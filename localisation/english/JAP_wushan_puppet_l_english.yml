 JAP_pnr_avoid_the_second_rice_riots: "Avoid a Second Rice Riot"
 JAP_pnr_avoid_the_second_rice_riots_desc: "The Rice Riots of 1918, triggered by rising food prices, once brought down our government. We must prevent such a thing from happening again."
 JAP_pnr_kuninotokotachi_faith: "Faith in Kunitokotachi-no-Mikoto"
 JAP_pnr_voice_of_yamato_patriots: "The Voice of Yamato Patriots"
 JAP_pnr_voice_of_yamato_patriots_desc: "We have always dreamed of a true Japan, a Japan wholly unrelated to the timid country of today, wallowing in the humiliation of defeat."
 JAP_pnr_unity_of_man_and_god: "Unity of Man and God"
