 ### Focus Tree ###
 JAP_ws_mark_of_the_defeated: "After Sunset"
 JAP_ws_mark_of_the_defeated_desc: "The war is over, and we are forced to face reality: the mighty Imperial Army has been annihilated, while the navy that once dominated the Pacific has been dismantled. Now, the twilight of the Empire has come."
 JAP_pnr_sheli_tuoguan_weiyuanhui: "Establish the Trusteeship Committee"
 JAP_pnr_sheli_tuoguan_weiyuanhui_desc: "The victorious powers have established a trusteeship committee to supervise our provisional government. Their aim is to ensure that we can never again possess any threatening strength, while keeping watch over our every move."
 JAP_npr_and_the_sunrise_again: "Comes the Morning"
 JAP_npr_and_the_sunrise_again_desc: "The world moves in endless cycles, and thus there is no such thing as eternity. After sunset comes sunrise, and after death comes rebirth. Japan did not resist the long black night of death in which it found itself, and because of this, it has finally welcomed yet another birth."
 JAP_npr_decide_on_the_new_governor_general: "The Fate of the Emperor"
 JAP_npr_decide_on_the_new_governor_general_desc: "The Emperor, a living god in this world, was believed to be omnipotent and incapable of error. Yet defeat in the war, and the Emperor's own public declaration of surrender, have led people to question his divine status."
 JAP_pnr_invite_the_duke_yansheng: "Invite the Duke Yansheng"
 JAP_pnr_invite_the_duke_yansheng_desc: "The Siwen Society has proposed inviting Kong Decheng, the Duke Yansheng currently residing at the Confucian Mansion in Shandong, to Japan as Governor-General. In 1928 they had tried to bring him to Japan for the Sino-Japanese Confucian Conference; perhaps now is the right time to continue that effort."
 JAP_pnr_new_shindojo: "Showa Shinsei-kai"
 JAP_pnr_new_shindojo_desc: "The Showa Shinsei-kai is a fringe religious group founded in 1935. They are connected to the young officers who plotted the Showa Restoration and are fanatical supporters of the Emperor. Most importantly, their leader, Deguchi Onisaburo, once had contact with [QIE.GetRulingParty]. Perhaps we can use this to please Beijing while securing our own interests to the greatest extent possible."
 JAP_pnr_kuninotokotachi_belief: "Establish the Faith of Kunitokotachi-no-Mikoto"
 JAP_pnr_kuninotokotachi_belief_desc: "In 1892, Kunitokotachi-no-Mikoto delivered to Deguchi Nao the divine message that 'the plum blossoms of the Three Thousand Worlds shall bloom,' revealing to Omoto believers the victories in the First Sino-Japanese and Russo-Japanese Wars, as well as Japan's eventual defeat in the World War. Now that the foretold future has arrived, we should continue to follow the divine guidance and rebuild this country."
 JAP_pnr_solve_hyperinflation: "Suppress Hyperinflation"
 JAP_pnr_solve_hyperinflation_desc: "The war left our domestic industry and agriculture severely distorted, and defeat has caused them to collapse entirely. We must intervene in prices immediately to prevent further damage."
 JAP_pnr_repatriation_resettlement_crisis: "Resolve the Repatriation Crisis"
 JAP_pnr_repatriation_resettlement_crisis_desc: "Millions of our soldiers and overseas nationals have been forcibly repatriated from China, Korea, Siam, and elsewhere. We must take measures to resettle them properly."
 JAP_pnr_solve_the_mafia: "The Mafia Problem"
 JAP_pnr_solve_the_mafia_desc: "With our loss of control over society, civilian criminal syndicates have immediately filled the vacuum we left behind. Now we must decide how to deal with these violent organizations."
 JAP_pnr_full_scale_reconstruction: "Full-Scale Reconstruction"
 JAP_pnr_full_scale_reconstruction_desc: "Most of our country's buildings have been reduced to ruins."
 JAP_pnr_medical_intervention: "Medical Intervention"
 JAP_pnr_medical_intervention_desc: "Extreme food shortages have led to the spread of infectious diseases such as tuberculosis. We must intervene at once."
 JAP_pnr_electricity_supply_and_demand_regulation_act: "Electricity Supply and Demand Regulation Act"
 JAP_pnr_electricity_supply_and_demand_regulation_act_desc: "Postwar Japan faces a nationwide power shortage, and we are unable to solve it in the short term. We can only resort to a strategy of rolling weekly blackouts."
 JAP_pnr_sheild_society: "The Rise of the Shield Society"
 JAP_pnr_sheild_society_desc: "The mysterious Shield Society has sent a long letter to [JAP.GetLeader], expressing dissatisfaction with Japan's current condition. They are a radical patriotic militant group, and perhaps it would not hurt to listen carefully to their demands."
 JAP_pnr_the_speech_begins: "The Shinjuku Speech"
 JAP_pnr_the_speech_begins_desc: "The mysterious Mr. 'Japan' is about to begin his speech in Shinjuku, hoping to stir patriotic feeling among the people. This is certain to provoke dissatisfaction in Beijing, but perhaps it is worth trying."
 JAP_pnr_ensure_the_safety_of_the_ichigaya_building: "Weaken the Ichigaya Building"
 JAP_pnr_ensure_the_safety_of_the_ichigaya_building_desc: "Our plan centers on attacking the headquarters of the Ground Self-Defense Force, thereby proving that they cannot truly protect the Japanese people. To that end, it is essential to secure the assault route before the operation begins."
 JAP_pnr_awaken_the_public: "A Thirst for War"
 JAP_pnr_awaken_the_public_desc: "Since the birth of mankind there has always been struggle and opposition: opposition of ideas, of faiths, of opinions. War is a necessary condition of humanity. Through war, mankind constantly tempers itself, constantly surpasses itself, and ultimately transforms into some new and beautiful form. Therefore war is good, and anything that prevents war from continuing is evil."
 JAP_pnr_recruit_comrades: "Recruit Comrades"
 JAP_pnr_recruit_comrades_desc: "A hero always attracts many other heroes like himself to accomplish a great cause together; think of the heroes of the Argo. They feared no hardship, gathered together under the guidance of fate, and marched toward a victory of their own. The Shield Society should be no different. We will seek out our comrades in universities and throughout society in order to carry out the plan."
 JAP_pnr_neo_shindojo: "Neo-Shinto"
 JAP_pnr_neo_shindojo_desc: "We will establish a new Shinto based on Omoto to replace the State Shinto faith of the wartime era."
 JAP_pnr_crack_down_on_the_black_market: "Legalize Tekiya Trade"
 JAP_pnr_crack_down_on_the_black_market_desc: "Our economy has collapsed, and the goods distributed through legal channels are not enough to meet the people's needs. At the same time, our military warehouses still contain large quantities of supplies that are supposed to be handed over to Beijing. Before they take possession of them, we may as well return them to the people through black market trade and make a tidy profit in the process."
 JAP_the_problem_of_orphan: "Deal with Street Orphans"
 JAP_the_problem_of_orphan_desc: "As defeat has driven the government into collapse, large numbers of homeless children who lost their parents in the war have begun turning to juvenile crime. We must do everything we can to stop this."
 JAP_pnr_taichio_nichinichi_shinbun_puppet: "Print the Taisho Nichinichi Shimbun"
 JAP_pnr_taichio_nichinichi_shinbun_puppet_desc: "We will resume publication of the Taisho Nichinichi Shimbun, which was banned by the authorities during the First Omoto Incident, in order to spread the faith of Neo-Shinto."
 JAP_pnr_second_mongolian_expedition: "The Second Mongolian Expedition"
 JAP_pnr_second_mongolian_expedition_desc: "In 1924 we once traveled to Mongolia to investigate the local Shambhala tradition, only to be interrupted by Zhang Zuolin and imprisoned. Now it is time to continue that unfinished expedition. It is expected to last four months, and we will achieve gratifying results."
 JAP_pnr_the_lunar_mountain_is_fuji: "The True God Appears on the Moonlit Mountain"
 JAP_pnr_the_lunar_mountain_is_fuji_desc: "Our Mongolian expedition has brought unexpected results: the Moonlit Mountain spoken of in the Tales of the Spirit World is in fact Mount Fuji, and according to prophecy, the True God shall descend from that mountain."
 JAP_pnr_possession_by_a_deity: "Man and God as One"
 JAP_pnr_possession_by_a_deity_desc: "The Emperor's defeat proved the failure of Amaterasu's descendants, and also proved the error of suppressing us during the First Omoto Incident. Now the true sovereign of Japan, heir to the great god Kunitokotachi, has descended from Mount Fuji and taken the throne. As Japan's true ruler, he will lead the nation to glory once more!"
 JAP_pnr_land_reform: "Begin Land Redistribution"
 JAP_pnr_land_reform_desc: "A great deal of our land remains in the hands of feudal landlords. This must be changed."
 JAP_pnr_subsidize_light_industry: "Subsidize Light Industry"
 JAP_pnr_subsidize_light_industry_desc: "Our top priority is to get light industry running as quickly as possible, in order to fill the shortage of consumer goods."
 JAP_pnr_subsidize_agriculture: "Subsidize Agriculture"
 JAP_pnr_subsidize_agriculture_desc: "Our agricultural production has been paralyzed by the war. If this country is to function normally again, a rapid recovery in agricultural output is indispensable."
 JAP_pnr_women_liberation: "Liberate Women"
 JAP_pnr_women_liberation_desc: "Our country is in ruins and requires vast amounts of labor for reconstruction. We can seize this opportunity to liberate women and bring them into the workforce as well."
 JAP_pnr_improved_writing_system: "Promote a New Writing System"
 JAP_pnr_improved_writing_system_desc: "The complexity of our writing system is one reason for our low average level of education. Perhaps we could adopt the Westernized writing system that failed to be implemented during the Meiji era; this would help our people acquire knowledge more quickly and bring us into line with the wider world."
 JAP_pnr_siwen_society_help: "Help from the Siwen Society"
 JAP_pnr_siwen_society_help_desc: "As early as 1918, the Siwen Society strongly advocated for the Duke Yansheng to settle in Japan and continue transmitting Confucius's orthodox line of succession 'for ten thousand generations.' Now that this has finally become a reality, its members will certainly continue working to assist the Duke in governing Japan through Confucian learning."
 JAP_pnr_confucian_mencian_orthodoxy: "Confucian-Mencian Orthodoxy"
 JAP_pnr_confucian_mencian_orthodoxy_desc: "Under the Duke Yansheng's rule, Japan has become a true land of Confucian and Mencian rites. Just as the Emperor once preserved the bloodline of Amaterasu through an unbroken line for ages, the Duke Yansheng too carries within him the blood of the Sage Confucius. There could be no more suitable true leader for our nation. Long live Kong Decheng! Long live Confucius! Long live Japan!"
 JAP_pnr_visit_yushima_seido: "Yushima Seido"
 JAP_pnr_visit_yushima_seido_desc: "Yushima Seido was built by Tokugawa Tsunayoshi, the fifth shogun of the Tokugawa shogunate, and may well be called Tokyo's Confucian temple. Having the Duke Yansheng reside here and declaring it sacred ground will help establish his authority."
 JAP_pnr_loyalty_and_filial_piety: "Loyalty and Filial Piety as One"
 JAP_pnr_loyalty_and_filial_piety_desc: "We will continue promoting among the people the principle of the unity of loyalty and filial piety from the Meiji-era Imperial Rescript on Education. The Duke Yansheng shall be portrayed as the sage who crossed the sea to save Japan, and the people will naturally be expected to swear undying loyalty to him."
 JAP_pnr_the_infallible_sage: "The Infallible Sage"
 JAP_pnr_the_infallible_sage_desc: "To further strengthen the Duke Yansheng's rule in Japan, we will launch a series of campaigns to continue spreading the Confucian morality of the Four Books and Five Classics while promoting the Duke as an omnipotent and infallible sage."
 JAP_pnr_collaboration_with_kyoto: "Cooperate with the Kyoto School"
 JAP_pnr_collaboration_with_kyoto_desc: "We will make contact with figures associated with the Kyoto School and persuade them to support the Duke Yansheng's rule over Japan."
 JAP_the_military_after_defeat_war: "The Army After Defeat"
 JAP_the_military_after_defeat_war_desc: "Under the regulations, our country is only permitted to maintain an extremely limited military for self-defense, and we must comply with those terms."
 JAP_pnr_prevent_sabotage_activities: "Prevent Sabotage"
 JAP_pnr_prevent_sabotage_activities_desc: "Because our army is so small, it may be unable to deal promptly with sabotage already in progress. Prevention is therefore of the utmost importance."
 JAP_pnr_learn_from_the_lesson: "Learn from the Lesson"
 JAP_pnr_learn_from_the_lesson_desc: "Though we were defeated, that does not mean we learned nothing. We will draw lessons from our defeat so as not to repeat our mistakes."
 JAP_pnr_rebuild_the_command_system: "Rebuild the Command System"
 JAP_pnr_rebuild_the_command_system_desc: "We will improve the existing command structure to suit our reduced military scale."
 JAP_pnr_revitalize_the_national_defense_industry: "Revitalize the Defense Industry"
 JAP_pnr_revitalize_the_national_defense_industry_desc: "We will rebuild the defense industrial system that was paralyzed by the end of the war, so that Japan may be protected from harm."
 JAP_pnr_military_alliance: "Military Alliance"
 JAP_pnr_military_alliance_desc: "Since our nation has been disarmed, the best option is to enter into a military alliance with another country."
 JAP_pnr_self_defense_forces: "Establish the Self-Defense Forces"
 JAP_pnr_self_defense_forces_desc: "We need a military force capable of preserving ourselves, ensuring that anyone who seeks to harm us cannot gain any advantage on our own soil."
 JAP_pnr_blue_force: "Blue Force"
 JAP_pnr_blue_force_desc: "We have established the Ground Self-Defense Force system. Now it is time to extend this model to the skies and the seas."
 JAP_pnr_the_birth_of_air_force_self_defense: "The Birth of the Air Self-Defense Force"
 JAP_pnr_the_birth_of_air_force_self_defense_desc: "We will train an elite air force to safeguard the skies over our territory."
 JAP_pnr_focus_on_agility: "Focus on Agility"
 JAP_pnr_focus_on_agility_desc: "We will emphasize aircraft agility and speed."
 JAP_pnr_focus_on_distances: "Focus on Range"
 JAP_pnr_focus_on_distances_desc: "We will emphasize aircraft range."
 JAP_pnr_the_air_war_from_future: "The Air War of the Future"
 JAP_pnr_the_air_war_from_future_desc: "We will establish an elite and advanced air force."
 JAP_pnr_the_coast_self_defense: "Coast Guard"
 JAP_pnr_the_coast_self_defense_desc: "We must ensure the safety of our own coastline."
 JAP_pnr_protect_our_ocean_lines: "Secure the Coastline"
 JAP_pnr_protect_our_ocean_lines_desc: "We will develop light patrol vessels to ensure the safety of our coastline."
 JAP_pnr_transport_ship_first: "Transport Ships First"
 JAP_pnr_transport_ship_first_desc: "Since we have been disarmed, transport ships may be the most suitable vessels for us to produce, rather than mighty warships bristling with guns."
 JAP_pnr_mutual_defense_agreement: "Mutual Defense Agreement"
 JAP_pnr_mutual_defense_agreement_desc: "We will sign a mutual defense agreement with our allies in order to obtain some relief from restrictions on military expansion."

 jap_pnr_qie_choose_kong_decheng: "[QIE.GetName] has appointed $JAP_pnr_kong_decheng$as governor."
 jap_pnr_qie_choose_onisanburo: "[QIE.GetName] has appointed $JAP_pnr_onisaburo$as governor."

 ### Ideas ###
 JAP_pnr_under_the_shadow_of_the_dragon: "Under the Shadow of the Dragon"
 JAP_pnr_under_the_shadow_of_the_dragon_desc: "The continental war has ultimately brought us a humiliating outcome. Not only did we fail to subdue China, we have instead become China's puppet. Now the dragon coiled upon the continent fixes our nation with its piercing gaze, and all we can do is pray."
 JAP_pnr_governor_not_yet_arrived: "The Governor-General Has Yet to Arrive"
 JAP_pnr_governor_not_yet_arrived_desc: "The Chinese government has informed us that it will appoint a Governor-General to assist in governing our country. Yet this Governor-General has still not arrived, and we do not even know who he is."
 JAP_pnr_overseas_japanese_repatriated: "Overseas Japanese Repatriated"
 JAP_pnr_overseas_japanese_repatriated_desc: "After the war ended, large numbers of Japanese military personnel and civilians who had settled in China, Korea, and other overseas regions were forced to return to their homeland. This massive wave of repatriation placed immense pressure on our social order and the provision of livelihoods."
 JAP_pnr_cooperation_with_boryokudan: "Cooperation with the Boryokudan"
 JAP_pnr_cooperation_with_boryokudan_desc: "Our government's control has regressed significantly compared to before, and the large number of unemployed people emerging from the ruins of war are waiting for an opportunity to disrupt public order. We may have no choice but to cooperate with Boryokudan, letting them maintain local security on our behalf."
