 QIE_wushan_dead_leader_live_country: "Harmony and balance"
 QIE_wushan_dead_leader_live_country_desc: "Under the rule of the Orthodox Church, we have restored order in North China. Now North China has swept away the chaos of lax ethics and moral decay, and has become a moral place envied by countless people in China. Harmony and balance have truly come among our people."
 QIE_wushan_dead_leader_live_country.tt: "§CYou can skip this national policy by completing the mutually exclusive national policy of [ROOT.GetLeader]. §!§W"
 QIE_wushan_return_to_democracy: "The new year with flying five-color flags"
 QIE_wushan_return_to_democracy_desc: "The dream of the Chinese people has finally come true! Now that China has been reunited, people take to the streets to celebrate the end of the war and the arrival of peace. New Religion of Salvation is a major contributor to the unification of our country! Now, as they had promised, the new democratic republic has taken over power and will lead the Chinese people into a new era. Long live China! Long live the Republic!"
 QIE_wushan_return_to_democracy_fake: "§9 We will set out to establish a new republican government, which will inherit power from the New Religion of Salvation, thereby truly realizing the ideals of the Revolution of 1911! §!"
 QIE_wushan_return_to_democracy_true: "§0In the chaos, people rushed to New Religion of Salvation, and the dream of a democratic republic also dissipated. Their footsteps extinguished the last remaining flames of Xinhai, but in contrast, an angry and frightening regime was born. §!"
 QIE_adopt_start_tungsten_producing_search_desc: "Our country's tungsten industry is currently in its infancy. During the period when the Harmony Society controlled the government, our country mainly cooperated with foreign capital to exploit these non-renewable rare resources. We must change this status quo and firmly hold strategic metals in our own hands. It would be very beneficial if overseas businessmen are willing to provide us with some mining technology, otherwise we will have to rely entirely on ourselves."
 QIE_the_dawn_of_loong_the_dusk_of_thieves_desc: "Now that Wuchen's shame has been overthrown, the land outside the pass has returned to our control. The green dragon that was trapped in the yellow mud in the past has now broken through the sky and is proud of the sky again. However, there are still many poor people in the border areas who do not know about our return. Our messenger will set off soon to bring them this good news."
 QIE_universal_education_for_poor_desc: "Under the guidance of \"Hongjiao Zhenren Liu\", Gui Guangde, Zhou Xueshi, and Wang Jinghui established a charity night school in Zhang Gong Temple, Tangzi Street, Nanjing, teaching Chinese, mathematics, English and a series of basic technologies. We should promote this kind of public welfare education, which will help us cultivate a group of skilled workers with sufficient levels."
 QIE_universal_education_for_poor_industry_1: "Ti Yan University Hall"
 QIE_decide_adopt_forced_producing_plan_desc: "More and more people come to our soup kitchens and porridge factories to receive relief food every day, and the number is still growing, which puts increasing financial pressure on the soup kitchens. We must find other ways. These refugees will be placed by us to work in various factories that are short of manpower. If they cannot meet the production quota, then they can only \"voluntarily\" not eat."
 QIE_decide_adopt_247_producing_plan_desc: "More and more people come to our soup kitchens and porridge factories to receive relief food every day, and the number is still growing, which puts increasing financial pressure on the soup kitchens. We must find other ways. We will divide these refugees into two groups and place them in various factories that are short of manpower to work. Each person will work 12 hours, so as to ensure that our factory can produce finished products 24 hours a day."
 QIE_wushan_salt_and_land_desc: "We will block their trade, we will control their economy, we will erase their language, we will obliterate their writing, we will construct a new past for them. They will call us peacemakers, all because we have decided to destroy them completely."
 QIE_wushan_restore_abolished_positions_desc: "Since the abolition of the imperial examination system at the end of the Qing Dynasty, the local guild halls where candidates used to rest have turned into clubs where fellow politicians and local social figures form cliques for private gain. It is certainly good to strike hard to eliminate them, but if we can take advantage of these associations and tolerate their local behavior a little, maybe we can also gain some benefits from them."
 QIE_wushan_establish_fair_social_standards_desc: "Confucius once strongly opposed the monarch's engraving of laws on tripods to announce to the world. This was not because the saints opposed the laws, but because once the laws were fixed, humans lost their inherent power of love and kindness. The laws would only make people fear punishment, but would not make people moral. This is also the fatal problem of Western rule of law. We will remember the words of the saints and guide and judge the people by unwritten moral laws."
 QIE_wushan_contact_with_the_social_elites_desc: "Most of the intellectuals in the opposition do not want to realize any ideals, they simply want to gain political capital and \"fame\" from it. If we can recruit those who have opposed our government to speak for us, more people will convert and believe that we are really a trustworthy government. Faced with the benefits within their reach, most intellectuals will not remain indifferent."
 QIE_KR_wushan_gathering_storm_desc: "The Qing Dynasty is about to enter 1936. During the Fourth Zhili-Fengtian War in 1927, Emperor Xuantong was restored to the throne in exchange for German support, but he was still unpopular and was not regarded as orthodox by most people. \n\nThe Zhili clique warlords defeated the Fengcian warlords and the Kuomintang army, but as the winners of China's nearly two decades of chaos, their control of the country is far from secure. In the East, the Empire of Japan is eyeing the mainland, while on the land of China, an upcoming crisis is quietly brewing in East China. Social elites from the charitable organization Wushan Society and former Beiyang government officials are visiting each other privately, and the government does not know what they are planning. Enemies both internal and external threaten the Qing court's hegemony. How long its power can last will be gradually revealed..."
 QIE_wushan_long_honed_tactics_desc: "There is no need to learn foreign combat strategies. China's military tactics are rooted in thousands of years of military practice. Abandoning them is equivalent to abandoning the wisdom of the Chinese military strategists and betraying China's excellent traditional culture. We will defeat the strong with the weak, and overcome the strong with softness. Patriotism and nationalism will help us survive our toughest moments and defeat the powerful enemies we face."
 QIE_embrace_new_tactics_desc: "The emergence of tanks, planes and trucks crushed China's thousands of years of accumulated military art to pieces. Facing war in the new era, we should not rest on our laurels, but should learn from those modern military powers and transform war strategies from an intuitive behavior into a quantifiable science."
 QIE_wushan_the_war_of_sciences_desc: "J.F.C. Fuller, the exiled general of the British Empire, summarized the reasons for their failure in World War I. His books \"On Future War\" and \"The Basis of the Science of War\" proposed a standardized principle of war. Military staffs of various countries regard his works as a guide. We had better study his theory carefully to prevent us from continuing to lag behind others in military combat thinking."
 QIE_wushan_the_war_of_sciences.tt: "§0A mysterious officer from across the ocean is set to join us.§!"
 QIE_wushan_new_type_squad_tactics_desc: "The rifle team and machine gun team in our army have long fought separately, but in the German Empire this distinction has gradually been diluted, and these infantry firepower units are instead called \"squads\", which will be deployed with the machine gunner as the center. We will learn this advanced tactic from the Germans."
 QIE_wushan_remembering_lessons_of_the_new_army_desc: "Why did the Revolution of 1911 happen? This is all because the New Army in various places appoints a large number of officers who have studied abroad, are imbued with heresy, and have not received the excellent ideological education of our country. Alas! In the end, except for the elite soldiers and generals in the six towns of Beiyang, the rest of the army was completely infiltrated by the revolutionaries. The car in front is overturned, and the car behind is a lesson. We must strictly focus on the ideological construction of the military to prevent similar things from happening again."
 QIE_wushan_restart_small_station_drill_ground_desc: "In 1894, President Yuan Shikai trained the Dingwu Army by imitating the German army system at Tianjin Station. He created my country's first army with strict management and kept this army firmly in the hands of strong men through personality worship. Although Tianjin is now controlled by the embassy city, it does not prevent us from reorganizing a strong, persevering, and extremely loyal army according to Yuan Shaobao's ideas."
 QIE_wushan_the_new_right_army_imperial_guard_desc: "The Wuwei Right Army is the strongest and most elite division among the five armies established in 1898. It is also the only force that survived the Boxer Rebellion. After a lot of reorganization and training, our army is finally worthy of inheriting the name of this brave and powerful army and protecting the country as an elite force that scares the enemy."
 QIE_decisive_battle_with_the_enemy_desc: "Is there anything more violent and cruel than fire? It will lick at will, burning the houses and obstacles it touches, and nothing can stop it. Several of our armies will take turns attacking, leaving no time for the enemy to rest and recover. The enemy who had lost his chance to breathe could only retreat steadily in the face of our fierce attacks, and finally fell to his knees in front of us."
 QIE_wushan_revise_cautions_laws_desc: "The Suspension of 1916 dealt a severe blow to the creditworthiness of central banks, leaving our banks effectively unable to absorb enough deposits. We must immediately ask the Department of Currency of the Ministry of Finance to supervise our banking business and try to restore the credit of the central bank - only after banks can operate normal financial services can we allocate these wealth to places where they can really be used."
 QIE_wushan_forcing_prisoners_to_work_desc: "Jingqing Bachelor is a new position proposed during the Reform Movement of 1898. This position is filled by technical talents and highly educated experts, and its status is comparable to that of consultants in the Western world. If you want to govern the country scientifically, it is essential to obtain the help of experts in various fields. We will re-establish the aristocratic position of Jingqing Bachelor to unite the majority of the technical elite in government."
 QIE_invasion_from_sea_desc: "[JAP.GetName] is an island country. If we want to take revenge on it, one of the options is to transport troops by sea and launch a landing operation, but the first trouble we will encounter will be their powerful navy."
 QIE_invasion_from_sky_desc: "[JAP.GetName] is separated from our country by the entire East China Sea. If we want to take revenge against it, one of the options is to drop troops from the sky to quickly occupy the port area and then transport our troops to its homeland. However, the first trouble we will encounter will be their air force that cannot be ignored."
 QIE_wushan_the_project_code_jianzhen_desc: "There is no problem in the world that money cannot solve, and now that a world war has broken out, we will not be questioned too much when we get weapons from non-enemy countries. They may also need our funds to support their war plans. We are preparing to purchase a batch of transport ships to transport our troops to the Japanese mainland."
 QIE_wushan_prepare_the_pink_plan_desc: "There is no problem in the world that money cannot solve, and now that a world war has broken out, we will not be questioned too much when we get weapons from non-enemy countries. They may also need our funds to support their war plans. We are preparing to purchase a batch of transport aircraft to transport our troops to the Japanese mainland."
 QIE_jesus_stage_2_desc: "Ancestor Ye told us in the \"Secrets of the Supreme Immortal Hunyuan Xuanxuan to Save the World\" that the most holy Ancestor Xiantian Taiyi is the only master of the world, and all the teachings of Yejiao are passed down from the ancestors in different sects. This means that what Jesus taught originally originated from our splendid Chinese culture, and there is no problem in worshiping Hui Zu as the sage teacher of our culture."
 QIE_mohammad_stage_2_desc: "Hui Ancestor told us in the \"Secrets of the Innate Hunyuan Xuanxuan Taishang to Save the World\" that the most holy Innate Taiyi Patriarch is the only master of the world, and all the teachings of Islam are passed down from the ancestors in different sects. This means that what Hui Ancestor taught originally originated from our splendid Chinese culture, and there is no problem in worshiping Hui Ancestor as the sage teacher of our culture."
 QIE_confucism_stage_2_desc: "Ancestor Confucianism told us in the \"Secret Book of the Supreme Immortal Hunyuan Xuanxuan to Save the World\" that the most holy ancestor Taiyi of Xiantian is the only master of the world, and all the teachings of Confucianism are passed down from the ancestors in different sects. Unfortunately, later generations have misunderstood many of Confucian's meanings, and there were many things Confucian wanted to say that he did not say before his death. Fortunately, the \"True Classic\" completes all of this."
 QIE_buddhism_stage_2_desc: "The Buddha told us in the \"Innate Hunyuan Xuanxuan Taishang Secret Book to Save the World\" that the most holy innate Taiyi Patriarch is the only master of the world, and all the teachings of Buddhism come from the ancestors' separate sects. Unfortunately, the original meaning of Buddhism has not been fully understood by later generations, but the \"Xuanxuan\" revealed by the ancestors will make up for this and lead people to the road to the state of supreme enlightenment and Nirvana."
 QIE_educate_the_people_with_tao_desc: "The Taoist Ancestor told us in the \"Secret Book of the Supreme Immortal Hunyuan Xuanxuan to Save the World\" that the most holy Ancestor Taiyi, the Innate Hunyuan, is the only master of the world, and all the teachings of Taoism are passed down from the ancestors in different sects. Whether it is \"the immortality of the Grain God\" or \"purification and solution\", they actually come from the \"True Sutra\"."
 QIE_wushan_puppet_trade_factory: "Exporting Chinese workers overseas"
 QIE_wushan_puppet_trade_factory_desc: "We need funds to rebuild our country, and these refugees can be used by us. We can imitate the choice made during the First World War and export Chinese labor overseas in exchange for funds. On the one hand, this can relieve our social pressure, and on the other hand, it can get us real gold and silver foreign exchange instead of paper printed by us."
 QIE_wushan_reorganise_the_kailuan_mining_bureau: "Reopen Kailuan Mining Bureau"
 QIE_wushan_reorganise_the_kailuan_mining_bureau_desc: "Kailuan Mining Bureau, established in 1878, is a joint venture established by the government and overseas capital. However, during the long-term warlord war, the Mining Bureau was abolished. At this time of development, we may be able to reopen the Mining Bureau and invite relevant capital to cooperate with us again for joint development."
 QIE_wushan_redundant_civilian_factory_design: "Redundant Design for Civilian Plants"
 QIE_wushan_redundant_civilian_factory_design_desc: "These civilian factories add a lot of unnecessary redundancy to the design, and at a certain moment, these additional built facilities will come into play."
 QIE_wushan_rapid_supply_hub_construction: "Quickly build a supply center"
 QIE_wushan_rapid_supply_hub_construction_desc: "Our redundant design of civilian factories is now paying off, and we are now able to use the extra design to convert them into supply hubs, providing more resources to our frontline forces to alleviate supply problems."
 QIE_wushan_wu_confirmed_as_the_leader_desc: "Commander-in-Chief Wu Peifu announced to the world that the Chinese people have stood up from today on, and no foreign devils or warlords will ever try to take away any benefit from the Chinese people. Wu Peifu will lead the Chinese people to correct the upside down morality in this world. Long live Yushuai! Long live the Confucius and Mencius ethics!"
 QIE_wushan_the_ghost_of_dual_ocean_navy_desc: "Nearly a hundred years ago, China firmly controlled Asia's oceans. He had four powerful fleets demonstrating his power. However, changing times, lack of funds, uncertainty about coastal control and the conspiracy of evil foreign forces have made our maritime power lag behind the world level. Our goal is to escape these dilemmas once and for all."
 QIE_wushan_focus_on_northern_navy_strategy_desc: "The Beiyang Navy, founded in 1867, was once one of the most powerful navies in the world. However, under the instructions of the evil and cowardly traitorous minister Li Hongzhang, the Beiyang Fleet was completely annihilated by Japan, a small country. We will rebuild the giant ships and artillery of the Beiyang Fleet and once again control the entire eastern ocean."
 QIE_wushan_fleet_in_being_desc: "A powerful naval force sometimes does not need to actually attack. It only needs to convince our enemies that the fleet stationed in the home port is a huge threat to them, in order to play its strategic role."
 QIE_wushan_decisive_battle_doctrine_desc: "A decisive naval battle will completely paralyze the enemy's maritime power. If we can seize the opportunity for a decisive battle and capture the enemy fleet in one fell swoop, then we will no longer have to worry about any threats on the ocean from then on."
 QIE_wushan_combine_sky_with_ocean_desc: "The development of our sea and air power has led to another path - the use of naval aircraft, whether taking off from aircraft carriers to harass opponents, or taking off from land to bomb enemy fleets, will further weaken our enemies' will to resist and military strength."
 QIE_wushan_prepare_for_the_second_round_robin_desc: "After arduous development, we have finally built an extremely powerful navy and air force. China once again has a three-service force that is consistent with its status. Hear the sound of planes passing by in the sky, the sound of fleets breaking through the waves in the ocean, and the sound of tanks crushing bushes on land. These are the last sounds our enemies will hear."
 QIE_wushan_more_is_better_faster_is_great_desc: "After a series of careful discussions, the Ordnance Industry Department decided to prioritize the development of our armored forces with production priority. If our factories continuously produce endless legions of steel, any enemy will be terrified of them."
 QIE_wushan_efficient_utilization_of_resources_desc: "After a series of careful discussions, the Ordnance Industry decided to develop a new production method that would utilize our armor-making resources with maximum efficiency. If we can obtain boundless steel legions through this optimization, any enemy will be terrified of them."
 QIE_wushan_conduct_armor_steel_experiments_desc: "After a series of careful discussions, the Ordnance Industry Administration decided to conduct research on tank armor. By increasing the hardness and thickness of our armor, the enemy will face one mobile fortress after another that they cannot defeat."
 QIE_wushan_high_speed_racing_engine_desc: "After a series of careful discussions, the Ordnance Industry Department decided to conduct research on tank engines. By increasing the strength of our engines, the enemy will face terrifying turrets flying on the ground one after another."
 QIE_wushan_stability_first_and_most_important_desc: "The design needs to be redundant and our armor must be able to survive the unexpected. By improving its reliability, it will be able to cope with more flexible combat terrains and maintain a longer life."
 QIE_wushan_squander_money_focus_on_fire_desc: "The most important thing in the design is firepower. Our armor must be able to defeat the enemy with one strike. By optimizing the design of its shells and barrels, we will be able to ensure high efficiency in killing the enemy, thereby reducing battlefield losses."
 QIE_the_project_of_white_horse_desc: "The Ordnance Industry Department has received a new funding allocation, which means we can continue to strengthen the direction of the original plan."
 QIE_wushan_715_armor_design_arsenal_desc: "The Ordnance Industry Department has received a new funding allocation, which means we can continue to strengthen the direction of the original plan."
 QIE_wushan_further_optimize_design_direction_desc: "The Ordnance Industry Department has received a new funding allocation, which means we can continue to strengthen the direction of the original plan."
 QIE_wushan_the_great_beast_industry_desc: "After a series of developments, we now have a powerful armor research and military-industrial organization. In the development of military technology, any breakthroughs that have been made can feed back the development of other military technologies. Even our enemies have to admit that an industrial behemoth they fear most is awakening in the east."
 QIE_after_wushan_control_whole_china_yangzhou_building: "Agriculture-based"
 QIE_after_wushan_control_whole_china_yangzhou_building_desc: "No country should ignore agriculture. On the one hand, agricultural products ensure the normal diet of our people. On the other hand, agricultural products can also become raw materials for various manufactured products. Think about the horrific social unrest that the famine in Sichuan in 1936 brought about? If we do not develop agriculture, society will fall into the shadow of turmoil, and there will never be hope for the development of industry and commerce."
 QIE_after_wushan_control_whole_china_jinzhou_building: "Re-merge the Ministry of Economic Affairs"
 QIE_after_wushan_control_whole_china_jinzhou_building_desc: "During the Reform Movement of 1898, my country established the State Administration of Agriculture, Industry and Commerce to manage national economic development. This department was split into the Ministry of Agriculture and Mines and the Ministry of Industry and Commerce in subsequent governments. But economic power has long been in the hands of the Treasury, leaving them with less power than expected. In order to facilitate post-war development, we must give them more economic power."
 QIE_wushan_economic_department: "Department of Economic Affairs"
 QIE_wushan_economic_department_desc: "During the Reform Movement of 1898, my country established the State Administration of Agriculture, Industry and Commerce to manage national economic development. This department was split into the Ministry of Agriculture and Mines and the Ministry of Industry and Commerce in subsequent governments. But economic power has long been in the hands of the Treasury, leaving them with less power than expected. In order to facilitate post-war development, we must give them more economic power."
 QIE_wushan_jiangzhou_industrial_promotion_tt: "Every three months, a factory will be built in a random §Ycore area controlled by our country§! that has a building vacancy. The §Y50%§! probability is §Ymilitary factory§!, and the §Y50%§! probability is §Ycivilian factory§!."
 QIE_wushan_yilun_youxu_industrial_upgrade_tt: "§YPostwar Industrial Revitalization§! Upgrade: Now every §Y80 days§!, §Y2 factories§! will be built in §Ycore areas controlled by our country§! where there are random building vacancies. Each time, there is a §Y50%§! probability of §Ymilitary factory§! and a §Y50%§! probability of §Ycivilian factory§!."
 QIE_after_wushan_control_whole_china_jizhou_building: "defense industry"
 QIE_after_wushan_control_whole_china_jizhou_building_desc: "The war left us only briefly, but it was not completely gone. In the near future, evil forces at home and abroad will definitely provoke another war aimed at annihilating Chinese culture and annihilating the Chinese people. We must prepare for this war and must not weaken our defense industry."
 QIE_after_wushan_control_whole_china_yuzhou_building: "Continue agricultural improvements"
 QIE_after_wushan_control_whole_china_yuzhou_building_desc: "During Yuan Shikai's period, my country used farmers' associations to popularize agricultural knowledge to people in rural areas, carry out well digging and irrigation work, and set up agricultural experimental sites to promote improved varieties and agricultural tools. But when Sun Wen's party provoked a rebellion in the south, our agricultural improvement plan had to be suspended. Now it's time to restart the program."
 QIE_after_wushan_control_whole_china_yanzhou_building: "Support the cotton textile industry"
 QIE_after_wushan_control_whole_china_yanzhou_building_desc: "Among all light industries related to people's livelihood, the cotton textile industry is definitely the most suitable industry for rapid development. As a labor-intensive industry, it has huge livelihood needs, the ability to absorb huge jobs, and a strong driving effect on the agricultural and manufacturing industry chains. If we want to stimulate the agricultural and industrial cycle, we should vigorously develop the cotton textile industry."
 QIE_after_wushan_control_whole_china_qingzhou_building: "Electrified China"
 QIE_after_wushan_control_whole_china_qingzhou_building_desc: "Electrification is the core of industrial modernization. Vigorously developing electrification can not only improve people's living standards, but also be helpful to our country's strategic material refining and military weapons manufacturing. Unfortunately, we currently have limited resources, so we will gradually electrify China, starting with the two major cities of Beijing and Shanghai."
 QIE_after_wushan_control_whole_china_qingzhou_building.tt: "Every two months, the §YElectrification§! modifier propagates from the region with that modifier to an adjacent unelectrified core region."
 QIE_after_wushan_control_whole_china_yizhou_building: "Promote mechanized farming"
 QIE_after_wushan_control_whole_china_yizhou_building_desc: "Most farmers in our country are currently doing hands-on farming on the farmland. There is nothing wrong with this, but maybe we can sympathize with these people who work hard for the people of the country. We should vigorously promote mechanized farming, which can not only reduce production costs, but also improve the comprehensive benefits of paddy field and dryland production. Most importantly, mechanized farming itself can liberate a large number of tenant farmers in rural areas and drive them into cities to become workers."
 QIE_after_wushan_control_whole_china_jiangzhou_building: "post war guild"
 QIE_after_wushan_control_whole_china_jiangzhou_building_desc: "Now that the war has come to an end and China has basically ended its current state of division, we should turn the country's focus from war to development. Compared with those industrialized and modern societies in the European world, our country's industry is very backward. The Ministry of Economic Affairs plans to hold a business promotion meeting and will announce subsidies for industrialists to help them build various factories."
 QIE_after_wushan_control_whole_china_xuzhou_building: "Focus on cash crops"
 QIE_after_wushan_control_whole_china_xuzhou_building_desc: "While ensuring that our country's food crop cultivation range is large enough, we should also encourage farmers to use part of their land to cultivate cash crops such as cotton. This will help increase farmers' income and truly achieve the purpose of \"promoting agriculture.\""
 QIE_the_first_choice_movement_base: "mobile fortress"
 QIE_wushan_the_first_choice_battleship: "Focus on battleships"
 QIE_wushan_the_first_choice_cruiser: "focus on cruisers"
 QIE_wushan_the_first_choice_submarines: "Focus on submarines"
 QIE_wushan_the_first_choice_destroyer: "focus on destroyers"
 QIE_the_first_choice_movement_base_desc: "In today's world naval situation, if you really want to build a powerful navy, the only option is aircraft carriers. Those naval aviation units that can truly influence the outcome of naval battles will take off from aircraft carriers, bringing smoke and death to their enemies, which will make our shipbuilding industry more interested in specializing in aircraft carriers."
 QIE_wushan_the_first_choice_battleship_desc: "Although aircraft carriers have proven their power in modern warfare, we still cannot ignore the existence of battleships as the dominant maritime force. As the sturdiest and most ferocious ships on the oceans, it is absolutely impossible to go wrong investing in them, which will make our shipbuilding industry more interested in specializing in the manufacture of battleships."
 QIE_wushan_the_first_choice_cruiser_desc: "No matter what the situation, investing in a light and mid-sized cruiser is never a wrong choice. Without these screen ships, we will not be able to maintain our dominance in naval warfare, which will make our shipbuilding industry more focused on specializing in submarines."
 QIE_wushan_the_first_choice_submarines_desc: "These cheap yet deadly submarines are our best bet for protecting us, from attacking belligerent merchant ships and freighters, to even transporting supplies to our armies, which will make our shipbuilding industry even more interested in specializing in submarines."
 QIE_wushan_the_first_choice_destroyer_desc: "Developing destroyers to secure our seas and give us the ability to harass our enemies will make it more attractive for our shipbuilding industry to specialize in destroyers."
 QIE_ws_tang_erhe_fake_3: "good people government in republic"
 QIE_ws_tang_erhe_fake_3_desc: "Under the proper governance of [QIE.GetLeader], China has taken on a new look. What we can thank is not the gods, nor the emperors who lorded it over us in the past. The only thing we have to thank is the able rule of the current government and our hard-working hands."
 QIE_ws_tang_erhe_fake_1: "Restore the national examination system"
 QIE_ws_tang_erhe_fake_1_desc: "During the war, although some of our universities and colleges still insisted on teaching. But we have to admit that our country’s mechanism for selecting talents through examinations has been completely paralyzed in the past decade or so. Now that we have unified the country, it is time to hold the first nationwide selection examination."
 QIE_ws_tang_erhe_fake_1.tt: "Obtain §YRestart Talent Selection§!, the effect is:\nResearch Speed: §G+10%§!\nMonthly Research Speed: §G+0.2%§!"
 QIE_ws_tang_erhe_fake_7: "Emancipate the mind"
 QIE_ws_tang_erhe_fake_7_desc: "The history of China is inseparable from the emperor, and the feudal ideas of these thousands of years are rooted in the spirit of the Chinese people. Although many intellectuals have raised their arms and raised their voices to awaken the Chinese people in modern times, how can our trickle down the feudal and backward embankments be demolished in an instant? We will continue to promote the ideas of freedom and equality, and over time, we will be able to remove the feudal mountain in people's hearts."
 QIE_ws_tang_erhe_fake_7.tt: "Obtain §Ydrops of water§! for §Y1800 days§!, the effect is:\nDaily social democratic support rate §G+0.06§!\nDaily social liberal support rate §G+0.06§!\nWeekly stability: §G+0.15%§!"
 QIE_ws_tang_erhe_fake_2: "Carry out post-war reconstruction"
 QIE_ws_tang_erhe_fake_2_desc: "The long-term melee in China has almost destroyed our country's industrial system. Although we have developed some industries before, it was an extremely deformed industrial system prepared for war. Now we no longer need guns and cannonballs, but bread and flowers. We will rebuild our light industrial system and bring a peaceful and better life to our people."
 QIE_ws_tang_erhe_fake_8: "Encourage the development of national industries"
 QIE_ws_tang_erhe_fake_8_desc: "Our weak light industrial system has long relied heavily on foreign countries. If we want to be truly strong, we must develop an independent light industrial system. To this end, we will subsidize national industrialists and help them develop."
 QIE_ws_tang_erhe_fake_8.tt: "Remove all our national spirit related to armament expansion\n\nGet §Y Start Rebuilding§!, the effect is:\nConstruction speed: §G+15%§!\nConsumer goods coefficient: §Y+10%§!"
 QIE_ws_tang_erhe_fake_4: "Pay war bonds"
 QIE_ws_tang_erhe_fake_4_desc: "Our financial institutions had raised money from people in the form of bonds before the war of unification, and it was time to honor those promises. In addition, we also need to carefully consider what we do with the financial products provided by other governments before the war. It might be about people supporting us..."
 QIE_ws_tang_erhe_fake_5: "Decide on diplomatic principles"
 QIE_ws_tang_erhe_fake_5_desc: "Now that China is unified and we have our domestic affairs in order, it is time to turn our attention abroad—we must decide our posture on the world stage and how we treat countries with which we have old grievances."
 QIE_ws_tang_erhe_fake_5.tt: "Triggers the event \"§YWhere we are internationally§!\"."
 QIE_ws_tang_erhe_fake_6: "Hold up the torch of freedom in the East"
 QIE_ws_tang_erhe_fake_6_desc: "We did it. Before we came, this was a land prone to wars and divided by warlords. When we are done with all of this, we will have a united, strong, democratic and free republic. We will hold up the torch of freedom in East Asia and protect more Asian countries from the threats of reactionary forces and militarism."
 QIE_ws_tang_erhe_fake_6.tt: "§YNew Beiyang Government§! will be called §YRepublic of China§!\nChange the focus tree to §YRepublic of China focus tree§!\n\n§CWe will seek to form an alliance to maintain long-term peace and stability in East Asia. §!"
 QIE_wushan_hongfan_jiuchou: "Hong Fan Jiuchu"
 QIE_wushan_hongfan_jiuchou_desc: "In ancient China, the virtuous sage Jizi taught this law based on the Chinese principle of the unity of nature and man to the emperor of the Zhou Dynasty who pacified the world. Now that the entire territory of China is under our control, we will imitate this traditional Chinese classic and promulgate a brand new constitution, one that is China's own and abandons all poisonous and harmful Western ideas."
 QIE_wushan_yilun_youxu: "Yilun Youxu"
 QIE_wushan_yilun_youxu_desc: "Through our efforts, our country has finally taken several important steps on the road to becoming a moral country. Although there were occasional voices of opposition to the series of measures we enacted after the war, they generally received a lot of support. This is precisely because we have unified China, and as the victors, we are naturally the rulers destined by destiny. Since we are destined by destiny, there must be a reason for everything we do that mediocre people are not aware of."
 QIE_wushan_friend_politics: "friend politics"
 QIE_wushan_friend_politics_desc: "In the final analysis, the essence of politics is the distribution of interests, and the formation of strong and fragile alliances out of the desire to gain greater advantages in the distribution of interests. As long as they can reasonably provide benefits to various factions in the government and hope for greater benefits, these \"friends\" will have their own way to maintain the continuation of the existing society."
 QIE_wushan_stability_means_everything: "Stability means everything"
 QIE_wushan_stability_means_everything_desc: "The Chinese have lived in a traditional farming society for thousands of years. Even though they have cut off their braids, the consciousness of small farmers has penetrated into their bones. Agricultural civilization is naturally averse to all risks, which means that our people are actually a group of the most conservative conservatives. But on the other hand, no matter what policies we enact, as long as we can ensure social stability, then they will not take any actual actions other than complaining."
 QIE_wushan_the_country_of_social_collaboration: "The country of social collaboration"
 QIE_wushan_the_country_of_social_collaboration_desc: "Syndicalism, New Confucianism, and the Assembly Line Revolution have all kinds of ideological collisions in China. They argue endlessly, and they all want to use their own methods to change the country. But in the final analysis, they all at least call themselves \"patriots\". We may be able to use this to unite them under a cooperative \"patriotic\" organization. If he does not want to join, then it proves that he may have second thoughts about China..."
 QIE_wushan_support_1922_education_act: "Revisiting the Renwu academic system"
 QIE_wushan_support_1922_education_act_desc: "The Renxu academic system was proposed by the government in 1922. This academic system spawned a number of new schools in coastal areas and cities in a short period of time, but its implementation in rural and inland areas faced the problem of teacher shortages. Now we will once again widely implement the Renwu school system and provide more intensive support to inland areas."
 QIE_wushan_top_down_land_reform: "top-down land reform"
 QIE_wushan_top_down_land_reform_desc: "Land reform will be carefully promoted by the state apparatus, through limiting land rents, buying back land and long-term loans, to transform more farmers into stable self-cultivators."
 QIE_wushan_start_land_reform: "progressive land reform"
 QIE_wushan_start_land_reform_desc: "The high land rental price is one of the reasons why my country's agriculture has been unable to move towards mechanization and institutionalization for a long time. Although we had used the short-term labor system to convert part of the agricultural population into workers before the war, our country still faced a very serious land problem. Land reform is urgent, but we cannot harm the interests of the landowners who support us. The most appropriate method is to pass laws to restrict landowners from raising land rents at will, and to continue to systematically buy back land and \"sell\" it to farmers in the form of long-term loans to convert them into homesteaders."
 QIE_wushan_financial_rebuild: "financial industry integration"
 QIE_wushan_financial_rebuild_desc: "Finance is the lifeblood of the country, and without banks to absorb funds, we would not be able to carry out much of our work. Previously, due to the chaotic social situation, people naturally did not trust our national bank, and instead entrusted their assets to various private banks. In order to facilitate the supervision of the financial industry, we should issue licenses to these private banks and set up a regulatory department to ensure the stability and safety of their operations."
 QIE_wushan_epidemic_prevention_section: "Department of Epidemic Prevention and Control"
 QIE_wushan_epidemic_prevention_section_desc: "For a long time, the health work of our country's government has been subordinate to the police department system, which is mainly responsible for maintaining the sanitary conditions in public places. We have to separate it from that and set up independent health systems to manage potential infectious diseases and national health problems."
 QIE_wushan_central_science_technology_institute: "National Beijing Institute of Science and Technology"
 QIE_wushan_central_science_technology_institute_desc: "Our country's scientific and technological research still lags behind the world level. Now that the war is over, we finally have an opportunity for development. Under the instruction of [QIE.GetLeader], we cooperated with Beijing Imperial University to establish the National Beijing Institute of Science and Technology, which will help our scientific and technological level catch up with the great powers."
 QIE_wushan_shuifeng_reservoir: "Utilize Shuifeng Reservoir"
 QIE_wushan_shuifeng_reservoir_desc: "At the junction of my country and South Korea, there is a reservoir jointly built by the Japanese and the Fengtian Puppet Government in the early days, Shuifeng Reservoir. Its strategic location provides a large amount of water energy resources. If we can work out a contract with South Korea, perhaps we can work with them to capitalize on this trophy from our old enemy."
 QIE_wushan_focus_on_small_medium_size_dam: "Developing small and medium-sized water conservancy projects"
 QIE_wushan_focus_on_small_medium_size_dam_desc: "Our country lacks talents who can build large-scale water conservancy projects from scratch, which takes time to cultivate. Large-scale water conservancy projects are not accomplished overnight and cannot solve the urgent energy problems we are facing at this stage. The best option is to start with some small hydropower stations and solve the energy problems we encounter in our development through quantity rather than scale. Sichuan Longxi River Hydropower Project Handu River Hydropower Project"
 QIE_wushan_nationalized_religious_site: "Nationalization of religious sites"
 QIE_wushan_nationalized_religious_site_desc: "We must not allow those foreign missionaries and the Chinese who are bewitched by them to continue to operate churches on our land, nor can we allow those monks, Taoist priests and imams to carry out religious activities without our control. To bring the country together, we must demand that all religious organizations submit to government leadership."
 QIE_wushan_the_exprience_of_chinese_war: "Aim for the spoils of the Central Plains"
 QIE_wushan_the_exprience_of_chinese_war_desc: "The war is over and all of China has fallen into our hands. The arsenals and arsenals left by the warlords in each province naturally belong to us. On the other hand, during the war, we also prepared a large amount of funds for post-war military construction through special funds. Let us make good use of these funds so that they can continue to serve our purposes."
 QIE_wushan_decide_our_tank_mio_traits: "Holding the first meeting of the Ordnance Industry Department"
 QIE_wushan_decide_our_tank_mio_traits_desc: "Scientists, soldiers, and bureaucrats all have their own opinions on how to develop our armored weapons. We would do well to hold an Ordnance Industry meeting to discuss the future direction of our nascent national military-industrial organization."
 QIE_wushan_air_and_ocean: "Navy and Air Force"
 QIE_wushan_rebuilding_after_war: "Postwar reconstruction"
 QIE_wushan_annex_chinese_overlord: "Chasing for China"
 QIE_wushan_military_revolution: "Military reform"
 QIE_wushan_seances_system: "Five religions in one"
 QIE_wushan_political_focus: "Political action"
 QIE_wushan_small_hydropower_station_modifier: "Small hydropower station"
 QIE_wushan_electrification_modifier: "Electrification"
 QIE_wushan_electrification_modifier_desc: "Electrification is the core of industrial modernization. Vigorously developing electrification can not only improve people's living standards, but also be helpful to the country's strategic material refining and military weapons manufacturing."
