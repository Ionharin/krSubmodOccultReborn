 QIE_wushan_unlock_foreign_investment_decisions_tt: "We will unlock a series of resolutions, which will help us carry out a series of §YIntroduction of foreign investment§! plans. If our government is a §Cmore open§! government, we may be able to unlock more unexpected collaborators."
 QIE_wushan_relief_unsustainable_tt: "§C Our relief activities are currently charity acts regardless of cost. If they continue like this, excessive cost expenditures will crush our government. We must find ways to improve this situation. §!"
 QIE_wushan_fiscal_reorg_tt: "§CSince we have completely severed ties with overseas capital enterprises, we have to carry out drastic reforms to the current financial system. This will be a shock to our economy in the short term, but our finances will be in much healthier shape after §Othree months§! of restructuring. §!"
 QIE_wushan_black_diamond_action_ongoing: "An exploration team is looking for a potential coal mine"
 QIE_wushan_contact_elites_tt: "§C By giving benefits to some intellectuals through the special meritocracy system we established, we may be able to bribe them to speak for us. §!"
 QIE_wushan_china_united_again_next_step_tt: "§RWe will begin to track down the real culprit behind the scenes, whether he is a person, an organization, or even a hostile overseas country, we will eradicate him completely! §!\n\n§RCompleting this national policy will directly unlock and skip the two national policies §Y$QIE_old_chinese_beliefs_reborn$§! and §Y$QIE_and_new_beliefs_live_in_here$§!. §!"
 chinese_traditionalist: "§ORites Sect§!"
 china_faction_alignment_name_traditionalist_china: "§ORites Sect§!§Y Camp§!"
 china_faction_tenets_title_traditionalist_china: "§OEtiquette§!§YPhilosophy§!"
 china_faction_tenets_traditionalist_china_desc: "§L The Li sect is the most peculiar group of nationalists and traditionalists in China. They are generally reactionary, anti-modern, and anti-scientific. The organization of this group is quite loose, and the sources of their ideas are extremely complex: they include conservative gentry, Confucian celebrities, old bureaucrats who hate republican politics, and young scholars who feel fearful and uneasy in the wave of Westernization. Generally speaking, they believe that the Western world once had some kind of moral foundation similar to Confucian civilization in the distant past, but it was gradually lost in the advancement of modernity. What is even more detestable is that this set of degenerate ideas was introduced into China along with the gunboats of the great powers, which in turn polluted the Chinese tradition that should be noble and self-sufficient. \n\nTherefore, the Rites sect calls for the restoration of traditional civilization, especially the moral order with Confucian Rites as the core. In their view, the root cause of all crises faced by China is that the entire society has deviated from the ethical foundation that maintains the world. As long as the collapse of rituals and music continues, no political system can bring about a revival of Chinese civilization. \n\nRelevant scholars represented by Gu Hongming firmly believe that the reason why Westerners believe that Easterners are barbaric and backward is precisely because Easterners are not as barbaric as Westerners. The West has machine guns and cannons, with which they destroyed China's old political order and spread poisonous knowledge to China's youth. \n\nHowever, the anti-Western nature of the Ritual Sect does not mean that they reject all Western artifacts. On the contrary, they believe that one day, when the Chinese can make equally sophisticated guns and turn their guns on the \"foreign devils\", the Western world will be judged under the violence they invented. §RAt that time, people will realize that the real victory is the Tao of Confucius and Mencius itself. §!"
