 QIE_wushan_seize_fengtian_financial_reserves_desc: "Now that Fengtian is completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_yunnan_financial_reserves: "Seizing the Yunnan Puppet Government’s Fund Reserves"
 QIE_wushan_seize_yunnan_financial_reserves_desc: "Now that Yunnan is completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_liangguang_financial_reserves: "Seize the capital reserves of the Guangdong and Guangxi puppet governments"
 QIE_wushan_seize_liangguang_financial_reserves_desc: "Now that Guangdong and Guangxi are completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_huadong_financial_reserves: "Seize the capital reserves of the puppet government in East China"
 QIE_wushan_seize_huadong_financial_reserves_desc: "Now that East China is completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_xibei_financial_reserves: "Seizing the funds reserves of the northwest puppet government"
 QIE_wushan_seize_xibei_financial_reserves_desc: "Now that the Three Northwest Horses are completely under our control, we can finally move everything out of their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_xinjiang_financial_reserves: "Seizing the Xinjiang Puppet Government’s Fund Reserves"
 QIE_wushan_seize_xinjiang_financial_reserves_desc: "Now that Xinjiang is fully under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_submitting_to_the_king_category: "Returning guests to the king"
 QIE_wushan_submitting_to_the_king_category_desc: "\"Sitting in the court and asking questions, hanging down the official seal. Love the Li leader, serve the Rong Qiang. They are one with each other, and lead the guests back to the king.\"\n\nThis thousand-character poem written by the well-known scholar Zhou Xingsi has been sung by countless people in the land of China over the past thousands of years. It expresses the Chinese people's beautiful yearning for the unity of the world and the unity of all people. But just look at the rivers and mountains of China today. It is divided in all directions, rituals have collapsed, music has been ruined, and the heroes are separatist. Puppet regimes everywhere are exercising their \"hegemony\". \n\nPeople all over the world have fallen into pain and despair. They all admire the North China Plain's orderly etiquette and peaceful singing and dancing; they all admire the Beiyang Government's benevolent governance. It’s time, as the only “kingdom” in the land of China, we will attack these tyrants and liberate the people from their hands."
 QIE_wushan_punish_jinyang: "The crime of attacking Jinyang"
 QIE_wushan_punish_jinyang_desc: "The Shanxi government has long claimed that it is the only legal government on the land of China, but now the bandits headed by [SHX.GetLeader] are abusing the people, levying excessive taxes, and the past events of the Shang Dynasty in the wine ponds and meat forests have been exposed by a refugee who fled from Shanxi. We cannot tolerate such behavior, and we will completely eliminate the illegal regime entrenched in Shanxi!"
 QIE_wushan_punish_sichuan: "The crime of conquering Bashu"
 QIE_wushan_punish_sichuan_desc: "The Sichuan government has long claimed that it is the only legal government on the land of China, but now the bandits headed by [SZC.GetLeader] abuse the people, extort extortionate taxes, and the past events of the Shang Dynasty, where they drank wine and meat, have been exposed by a refugee who fled from Sichuan. We cannot tolerate such behavior, and we will completely eliminate the illegal regime entrenched in Sichuan!"
 QIE_wushan_punish_wanxi: "The crime of attacking Huainan"
 QIE_wushan_punish_wanxi_desc: "The Anhui government has long claimed that it is the only legitimate government on the land of China, but now the bandits and bandits headed by [ANQ.GetLeader] abuse the people, extort excessive taxes, and the past events of the Shang Dynasty in the wine ponds and meat forests have been exposed by a refugee from Anhui who fled famine. We cannot tolerate such behavior, and we will completely eliminate the illegal regime entrenched in Anhui!"
 QIE_wushan_punish_bashenglianhe: "The crime of conquering the alliance of eight provinces"
 QIE_wushan_punish_bashenglianhe_desc: "The coalition government of the eight provinces has long claimed that it is the only legitimate government on the land of China, but now the bandits and bandits headed by [LEP.GetLeader] abuse the people, extort excessive taxes, and the past events of the Shang Dynasty in the wine pool and meat forest have been exposed by a refugee who fled from Nanjing. We cannot tolerate such behavior, and we will completely eliminate the illegal regime entrenched in Nanjing!"
 QIE_wushan_punish_liangguang: "The crime of attacking Lingnan"
 QIE_wushan_punish_liangguang_desc: "The Guangzhou government has long claimed to be the only legitimate government on the land of China, but now the bandits and bandits headed by [GXC.GetLeader] abuse the people, levy excessive taxes, and the past events of the Shang Dynasty in the wine pool and meat forest have been exposed by a refugee who fled from Guangdong and Guangxi. We cannot tolerate such behavior, and we will completely eliminate the illegal regime entrenched in Guangdong and Guangxi!"
 QIE_wushan_punish_hunan: "The crime of attacking Jingchu"
 QIE_wushan_punish_hunan_desc: "The Hunan government has long claimed that it is the only legal government on the land of China, but now the bandits headed by [HNN.GetLeader] abuse the people, levy extortionate taxes, and the past events of the Shang Dynasty in the wine ponds and meat forests have been exposed by a refugee who fled from Hunan. We cannot tolerate such behavior, and we will completely eliminate the illegal regime entrenched in Hunan!"
 QIE_wushan_punish_yunnan: "The crime of conquering southern China"
 QIE_wushan_punish_yunnan_desc: "The Yunnan government has long claimed that it is the only legitimate government on the land of China, but now the bandits and bandits headed by [YUN.GetLeader] abuse the people and expropriate the people. The past events of the Shang Dynasty in the wine ponds and meat forests have been exposed by a refugee who fled from Yunnan. We cannot tolerate such behavior, and we will completely eliminate the illegal regime entrenched in Yunnan!"
 QIE_wushan_punish_fengtian: "The crime of cutting black water"
 QIE_wushan_punish_fengtian_desc: "The Fengtian government has long claimed to be the last bastion of the Beiyang government, but now the dirty deals between the traitorous government headed by [FNG.GetLeader] and the Japanese have been revealed, and he is trying to give the Northeast region to the Japanese. We cannot tolerate such behavior, and we will completely eliminate the puppet government, traitors, and lackeys of foreigners entrenched outside the customs!"
 QIE_wushan_punish_lkmt: "The crime of attacking Wu and Yue"
 QIE_wushan_punish_lkmt_desc: "With the sound of a piercing horn, the red plague that once swept across the south and invaded the north once again pounced on the land of China. Sun Wen's party members headed by [CHI.GetLeader] wanted to put China into a situation of blood and pain again. They are like locusts, eating up the beautiful Chinese culture wherever they go. Peasants, take up arms, light fires, dig deep trenches, and let us completely put an end to this red locust plague that is dominating as the end of the world approaches!"
 QIE_wushan_recover_from_war_category: "recovering from war"
 QIE_wushan_recover_from_war_category_desc: "We paid a lot, but fortunately, we finally achieved results that matched our efforts. Now that China has been unified, we have declared to the world that we are the true and only legitimate government of China. \n\nContinuing the war in one go and regaining our former territories is naturally the idea of ​​most people who are full of patriotism and yearn for the majesty of China in the past - but our people are already very tired, and the devastation of the war and the pain of division have caused serious physical and mental harm to them. Since we want to bring salvation to the country and the world, we should not rule with hegemony, but with kingship. \n\nSun Tzu, China's greatest strategist of war, once pointed out that there are five things that can determine victory, the most important of which is \"the consent of the people and the superior.\" So let's slow down for a moment and, after a while of development, transform into the dragon that all enemies have to fear."
 QIE_wushan_changjiang_inspectorate_electric_lamp_factory: "Yangtze River Patrol Office Electric Light Factory"
 QIE_wushan_changjiang_inspectorate_electric_lamp_factory_desc: "The Yangtze River Patrol Office Electric Light Factory was founded by Zhang Xun in the Xuzhou area in 1914. However, during our unification war, the factory was damaged. We should try to rebuild the factory."
 QIE_wushan_jinan_chemical_factory: "Jinan Chemical Factory"
 QIE_wushan_jinan_chemical_factory_desc: "Jinan Chemical Factory was founded in 1934. The chemical factory has long been controlled by Zhang Zongchang's party members. These people didn't understand what chemistry was, except that it could create powerful explosions. Now that we have taken over the chemical plant, we should try to take advantage."
 QIE_wushan_huaihai_chemical_research_institute: "Huaihai Institute of Chemistry"
 QIE_wushan_huaihai_chemical_research_institute_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_east_china_coal_company: "East China Coal Co., Ltd."
 QIE_wushan_east_china_coal_company_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_xingnan_company: "Xingnan Company"
 QIE_wushan_xingnan_company_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_yancheng_fertilizer_factory: "Yancheng Fertilizer Factory"
 QIE_wushan_yancheng_fertilizer_factory_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_ningbo_soda_factory: "Ningbo Soda Drink Factory"
 QIE_wushan_ningbo_soda_factory_desc: "The Ningbo Soda Drink Factory, established in 1935, is jointly funded by Japan and Germany and mainly produces various fruity soft drinks. Now that we have taken control of this place, perhaps we can try to resume the production of related soda drinks. As consumer goods for entertainment, it may be able to stimulate the development of our country's civil economy after the war."
 QIE_wushan_dezhou_tobacco_company: "Texas Tobacco Company"
 QIE_wushan_dezhou_tobacco_company_desc: "Texas Tobacco Company was established in 1930 and has launched \"Golden Eagle\", \"Quanfu\", \"Guangming\" and \"Scotto\" brand cigarettes. Although it is a small tobacco company, since it produces high-value recreational consumer goods, it means that if we can restart its production line, we may be able to gain a lot of benefits from it."
 QIE_wushan_xinyang_fertilizer_factory: "Xinyang Fertilizer Factory"
 QIE_wushan_xinyang_fertilizer_factory_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_kaifeng_phosphoric_acid_factory: "Kaifeng Phosphoric Acid Plant"
 QIE_wushan_kaifeng_phosphoric_acid_factory_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_jicheng_three_acids_factory: "Integrated three-acid plant"
 QIE_wushan_jicheng_three_acids_factory_desc: "Xi'an Integrated Tri-Acid Plant was founded in 1933 by Gao Youming, Dou Yin-san, Nan Hanchen, Du Bincheng, Han Wangchen and others to raise funds. It mainly produces industrial \"tri-acid\" such as sulfuric acid, hydrochloric acid and nitric acid. At that time, the factory not only broke the monopoly of foreign goods on the northwest market, but also effectively supported the development of tanning, printing and dyeing, mining, metallurgy, and match industries in the northwest region at that time. Before reunification, we focused on guiding a group of refugees to go to Xi'an to expand the integrated three-acid plant. Now the construction of the new plant is nearing completion and may be put into production in the near future."
 QIE_wushan_minxing_soy_sauce_factory: "minxing soy sauce factory"
 QIE_wushan_minxing_soy_sauce_factory_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_xining_chemical_factory: "Xining Chemical Factory"
 QIE_wushan_xining_chemical_factory_desc: "During our unification war, many factories and chemical companies were damaged to varying degrees, and some factories had to shut down, which made it difficult to restart them. We will allocate budgets to restore and expand this facility that is extremely useful for our country's national defense."
 QIE_wushan_economic_department_1: "Department of Economic Affairs"
 QIE_wushan_economic_department_1_desc: "During the Reform Movement of 1898, my country established the State Administration of Agriculture, Industry and Commerce to manage national economic development. This department was split into the Ministry of Agriculture and Mines and the Ministry of Industry and Commerce in subsequent governments. But economic power has long been in the hands of the Treasury, leaving them with less power than expected. In order to facilitate post-war development, we must give them more economic power."
 QIE_wushan_xiadong_hydropower_station: "Xiadong Hydropower Station"
 QIE_wushan_xiadong_hydropower_station_desc: "We had a limited budget and needed a stable, cheap power supply that could be delivered quickly as we recovered from the war. We will allocate budget to build small hydropower stations locally."
 QIE_wushan_rangduhe_hydropower_station: "Rangdu River Hydropower Station"
 QIE_wushan_rangduhe_hydropower_station_desc: "We had a limited budget and needed a stable, cheap power supply that could be delivered quickly as we recovered from the war. We will allocate budget to build small hydropower stations locally."
 QIE_wushan_taohuaxi_hydropower_station: "Taohuaxi Hydropower Station"
 QIE_wushan_taohuaxi_hydropower_station_desc: "We had a limited budget and needed a stable, cheap power supply that could be delivered quickly as we recovered from the war. We will allocate budget to build small hydropower stations locally."
 QIE_wushan_dieshuihe_hydropower_station: "Dieshuihe Hydropower Station"
 QIE_wushan_dieshuihe_hydropower_station_desc: "We had a limited budget and needed a stable, cheap power supply that could be delivered quickly as we recovered from the war. We will allocate budget to build small hydropower stations locally."
 QIE_wushan_shilongba_hydropower_station: "Shilongba Hydropower Station"
 QIE_wushan_shilongba_hydropower_station_desc: "We had a limited budget and needed a stable, cheap power supply that could be delivered quickly as we recovered from the war. We will allocate budget to build small hydropower stations locally."
 QIE_wushan_expand_guangdong_pajiang_artillery_factory: "Expansion of Guangdong Liaojiang Artillery Factory"
 QIE_wushan_expand_guangdong_pajiang_artillery_factory_desc: "The Guangdong Liaojiang Artillery Factory was jointly established by Chen Jitang and German arms dealers in 1933 at a cost of 11 million silver dollars. It was the only modern factory in my country at that time that could realize the integrated manufacturing of chambers and guns. During the Unification War, the warlords of Guangdong and Guangxi planned to use this military factory to produce dozens of heavy artillery and tens of thousands of artillery shells per month, but it stalled due to lack of supporting smelting raw materials and funds. Now that we have taken control of the Liaojiang Artillery Factory, we can transform it into a military factory that can serve the development of our national defense."
 QIE_wushan_expand_kunming_arsenal: "Expansion of Kunming Military Factory"
 QIE_wushan_expand_kunming_arsenal_desc: "The war is over and we have taken over most of the military assets in the Kunming area. In order to restore and expand the post-war defense industry, we will expand the Kunming military factory."
 QIE_wushan_expand_chongqing_arsenal: "Expansion of Chongqing Military Factory"
 QIE_wushan_expand_chongqing_arsenal_desc: "The war is over and we have taken over most of the military assets in the Chongqing area. In order to restore and expand the post-war defense industry, we will expand the Chongqing military factory."
 QIE_wushan_establish_dading_tank_factory: "Establishment of Dading Chariot Factory"
 QIE_wushan_establish_dading_tank_factory_desc: "The war is over. In order to restore and expand the post-war defense industry, we will try to establish a Dading tank factory to produce more armored weapons to deal with future wars."
 QIE_wushan_establish_shaoguan_aircraft_factory: "Established Shaoguan Aircraft Manufacturing Plant"
 QIE_wushan_establish_shaoguan_aircraft_factory_desc: "The war is over. In order to restore and expand the post-war defense industry, we will try to establish the Shaoguan aircraft manufacturing plant to produce more aircraft to deal with future wars."
 QIE_wushan_reorganise_shanghai_dakang_cotton_mill: "Reorganization of Shanghai Dakang Cotton Mill"
 QIE_wushan_reorganise_shanghai_dakang_cotton_mill_desc: "Among all light industries related to people's livelihood, the cotton textile industry is definitely the most suitable industry for rapid development. As a labor-intensive industry, it has huge livelihood needs, the ability to absorb huge jobs, and a strong driving effect on the agricultural and manufacturing industry chains."
 QIE_wushan_reorganise_naigai_wata_cotton_company: "Reorganized Naikai Cotton Textile Company"
 QIE_wushan_reorganise_naigai_wata_cotton_company_desc: "Among all light industries related to people's livelihood, the cotton textile industry is definitely the most suitable industry for rapid development. As a labor-intensive industry, it has huge livelihood needs, the ability to absorb huge jobs, and a strong driving effect on the agricultural and manufacturing industry chains."
 QIE_wushan_reorganise_nenjiang_textile_mill: "Reorganization of Nenjiang Textile Factory"
 QIE_wushan_reorganise_nenjiang_textile_mill_desc: "Among all light industries related to people's livelihood, the cotton textile industry is definitely the most suitable industry for rapid development. As a labor-intensive industry, it has huge livelihood needs, the ability to absorb huge jobs, and a strong driving effect on the agricultural and manufacturing industry chains."
 QIE_wushan_reorganise_shanghai_tongxing_cotton_mill: "Reorganization of Shanghai Tongxing Cotton Mill"
 QIE_wushan_reorganise_shanghai_tongxing_cotton_mill_desc: "Among all light industries related to people's livelihood, the cotton textile industry is definitely the most suitable industry for rapid development. As a labor-intensive industry, it has huge livelihood needs, the ability to absorb huge jobs, and a strong driving effect on the agricultural and manufacturing industry chains."
 QIE_wushan_cast_jiangling_jingzhou_ding: "Jiangling Jingzhou tripod"
 QIE_wushan_cast_jiangling_jingzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. To the south is Jingzhou, Chuye, with its winding and towering mountains, so it is called Jingzhou."
 QIE_wushan_cast_jiangdu_yangzhou_ding: "Cast Jiangdu Yangzhou Ding"
 QIE_wushan_cast_jiangdu_yangzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. The so-called Yangzhou is based on Huaihe River in the north and the sea in the south. The soil under the soil is wet and there are many willows growing there, which is why it is named after it."
 QIE_wushan_cast_chengdu_liangzhou_ding: "Chengdu Liangzhou Ding"
 QIE_wushan_cast_chengdu_liangzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. The land of Huayang and the territory of Liang and Min are one of its confines; the country in the middle of the confines is Liangzhou."
 QIE_wushan_cast_dongyuan_xuzhou_ding: "Cast Dongyuan Xuzhou Ding"
 QIE_wushan_cast_dongyuan_xuzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. Xu, Shuye, Haidai and Huaiwei are Xuzhou."
 QIE_wushan_cast_shengong_yuzhou_ding: "Yuzhou tripod"
 QIE_wushan_cast_shengong_yuzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. Between He and Han is Yuzhou, and the one in the world is Zhou."
 QIE_wushan_cast_riguan_yanzhou_ding: "Cast Sun View Yanzhou Ding"
 QIE_wushan_cast_riguan_yanzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. Between He and Ji is Yanzhou, Weiye."
 QIE_wushan_cast_wuxing_jizhou_ding: "Cast Wuxing Jizhou Ding"
 QIE_wushan_cast_wuxing_jizhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. Between the two rivers is Jizhou and Jinye."
 QIE_wushan_cast_changan_yongzhou_ding: "Yongzhou tripod in Chang'an"
 QIE_wushan_cast_changan_yongzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. Looking up to join the expedition, overlooking Huayang, Heishui, Jiang and Han are Yongzhou."
 QIE_wushan_cast_shaoyang_qingzhou_ding: "Cast Shaoyang Qingzhou Ding"
 QIE_wushan_cast_shaoyang_qingzhou_ding_desc: "Yu painted the nine states, divided them into six groups, cut off the strong points to make up for the weak points, and ended up with seven thousand squares. The state's wealth was balanced, and the king's teachings were prepared. This is called Huaxia. To the east is Qingzhou, also known as Qi."
 QIE_wushan_dual_leadership_bop: "§YThe real person ascends the throne in the middle, and the living people serve on both sides§!"
 QIE_wushan_bop_jiang_side: "Led by Jiang Chaozong"
 QIE_wushan_bop_wu_side: "Directed by Wu Peifu"
 QIE_wushan_bop_support_jiang: "Donation packaging"
 QIE_wushan_bop_support_jiang_desc: "We can try to package our political donations as charitable donations and entrust them to be \"handled on our behalf\" by local disaster relief organizations run by the other party."
 QIE_wushan_bop_support_wu: "Relief with troops"
 QIE_wushan_bop_support_wu_desc: "By integrating idle refugees into the militia, on the one hand, the employment problems of the refugees can be alleviated, and on the other hand, they can be used to deal with public security problems."
 QIE_wushan_bop_jiang_power_hijacked: "Huiji layman hijacks Luanwuyuan"
 QIE_wushan_bop_jiang_total_control: "Huiji layman takes control of Luanwuyuan"
 QIE_wushan_bop_jiang_pressure: "Jiang Chaozong put pressure on Luanwuyuan"
 QIE_wushan_bop_balanced_court: "Luanwuyuan maintains balance"
 QIE_wushan_bop_wu_pressure: "Wu Peifu puts pressure on the Luan Council"
 QIE_wushan_bop_wu_total_control: "Layman Zhixuan takes control of Luanwuyuan"
 QIE_wushan_bop_wu_supreme_power: "Layman Zhixuan hijacks Luanwuyuan"
 QIE_wushan_bop_celebrity_liaison_fee: "Approval of celebrity social service fees"
 QIE_wushan_bop_celebrity_liaison_fee_desc: "Inviting celebrities to a charity dinner in the name of fundraising is a very legitimate reason, and the Luan Council has no proper reason to reject our funding request. We can start here and deliver some benefits."
 QIE_wushan_bop_extra_funding_army_bureau: "Temporary expenditures for military development"
 QIE_wushan_bop_extra_funding_army_bureau_desc: "We must move quickly to build a modern military capable of dealing with the difficulties ahead. It is reasonable to ask the Luan Council for more funding for this purpose."
 QIE_wushan_bop_subsidize_industrialists: "Subsidize industrialists"
 QIE_wushan_bop_subsidize_industrialists_desc: "Business owners and industrialists are an integral part of our government, and without a way to feed them, millions of workers and civilians will go hungry. We should subsidize their production."
 QIE_wushan_bop_strengthen_military_training: "Strengthen military training"
 QIE_wushan_bop_strengthen_military_training_desc: "Our specialty is the art of war. Even if we have long guns and short artillery that can dominate the land of China, without reasonable military methods and strict discipline, our troops will still be scattered by a firecracker."
 QIE_wushan_bop_introduce_elites_to_salvationism: "Introducing celebrities to join the New Religion of Salvation"
 QIE_wushan_bop_introduce_elites_to_salvationism_desc: "A socialite from the Embassy City is very interested in our organization. If we can hold an initiation ceremony for him and accept him as a member, he may be able to bring us unexpected benefits."
 QIE_wushan_bop_expand_salvationism_in_officer_corps: "Development of Protestantism in the officer corps"
 QIE_wushan_bop_expand_salvationism_in_officer_corps_desc: "Think about how the Revolution of 1911 happened. It was precisely because the new armies in various places appointed officers and returned young people with revolutionary ideas that they were infiltrated into a sieve. The six towns in Beiyang led by Yuan Shikai were able to avoid the poison of these evil revolutionary ideas because they all received the same set of spiritual education. If we can further promote the moral and patriotic teachings of New Religion of Salvation in the officer corps, we can ensure to the greatest extent possible that the soldiers' guns are in the hands of the officers, and that the officers' minds are in our hands."
 QIE_conspiracy_of_wushan: "Help from the New Religion of Salvation?"
 QIE_conspiracy_of_wushan_desc: "This is the ninth year that Patriarch Wu Peifu has been absent from the New Year meeting of the New Religion of Salvation. As a charitable organization and fraternal group composed of political and business elites, the New Religion of Salvation became Beijing's premier charity after helping to thwart the Kuomintang rebellion. At present, the affairs of the head of the church are handled by Jiang Chaozong, who presided over Ding Si's restoration. §RI wish they were just charitable organizations. §!"
 QIE_help_of_wushan: "Salvationist Help"
 QIE_help_of_wushan_desc: "The New Religion of Salvation, founded in Guangshantan, Henan in 1919, was highly appreciated by people in the Beiyang government, and now it has developed into the largest charity organization in Beijing. At this turbulent moment, the New Religion of Salvation has received financial support from the government and is making every effort to rescue refugees fleeing from the turbulent eight-province union area. This will take some time. It has proven that it remains the most favored charity organization among politicians and business people in Beijing."
 QIE_hate_of_wushan: "The expanding refugee crisis in eight provinces"
 QIE_hate_of_wushan_desc: "As batch after batch of refugees fleeing the war in the north enter the Xinyang and Wuhan areas, the Beiyang Government's choice to turn a deaf ear to the refugee crisis in eight provinces is gradually paying a price. §RThe nights in Gyeonggi are also eerily quiet...§!"
 QIE_wushan_rapid_infiltration: "rapid penetration"
 QIE_wushan_rapid_infiltration_desc: "We will use the flexibility and concealment of individual soldiers to quickly penetrate the enemy's front, thereby unknowingly disintegrating the enemy's front."
 QIE_wushan_let_the_artillery_speak: "Let the cannon speak"
 QIE_wushan_let_the_artillery_speak_desc: "Firepower, firepower, firepower. Under the intensive barrage fire and the concentrated attack of the formation, no enemy we faced could survive."
 QIE_work_for_rice: "Labor determines existence value"
 QIE_work_for_rice_desc: "We have informed these lazy bastards who are freeloading on us that the time of the great benefactors is over. If they want to drink gruel in the future, they must prove that they are worthy of drinking gruel."
 QIE_work_for_247_rice: "continuous production"
 QIE_work_for_247_rice_desc: "By dividing these refugees into two groups, we can ensure that the factory is staffed 24 hours a day. For those factory owners, this meant increased output and the proliferation of capital."
 QIE_wushan_charity_relief: "Philanthropic Finance"
 QIE_wushan_charity_relief_desc: "The first aid fund raised from the society with the help of the re-opened Beijing Charity Relief Bank has arrived, which has eased our relief pressure. But we don’t need to use all the charity money for relief. Maybe investing it and making money make money is also a good choice..."
 QIE_wushan_theocratic_authority_1: "Protestant Power: Suspicions of Illegality"
 QIE_wushan_theocratic_authority_1_desc: "Although Jiang Chaozong was highly praised by some Manchu nobles and conservative intellectuals who believed that the chaos should be stopped in time, as \"three decisions for the capital and dedication to the people.\" However, the current appeal of the New Religion of Salvation obviously relies entirely on Yushuai and his immediate subordinates rather than this old man from Beiyang. In addition, our occult activities inevitably attract criticism. If we want to successfully control the North China Plain, we must find a way to demonstrate our determination to bring stability to China's political situation - at least in appearance, unlike the previous direct government."
 QIE_wushan_theocratic_authority_2: "Protestant Power: Gradually Gaining Popular Support"
 QIE_wushan_theocratic_authority_2_desc: "Thanks to the policies we enacted, harmonious cooperation with a wide range of political parties in the former Congress, and a series of work to improve people's livelihood after the collapse of the eight-province coalition. Our regime has been recognized by most people. However, our Fuluan activities still aroused criticism from some die-hard intellectuals and more traditional people."
 QIE_wushan_theocratic_authority_3: "Protestant power: in full control"
 QIE_wushan_theocratic_authority_3_desc: "Nowadays, the rural gentry regards us as the restorers of traditional Chinese culture; the Manchu nobles believe that we will return the political power to its true master after pacifying the world; those restless young people even regard us as the patriotic government that drives away the foreign devils. King Hui of Liang once asked the erudite Mencius how to stabilize society. Mencius told him that once the world is unified, the people's hearts will inevitably move in the same direction, and society will inevitably be stable. Today, the whole country will support our actions towards the goal of China's reunification."
 QIE_wang_jinghui_academy: "King Hui Public School"
 QIE_wang_jinghui_academy_desc: "The public school that Wang Jinghui planned to establish at the Nanjing New Religion of Salvation Branch has now become a reality. We did it. We established a school for the poor to provide professional education. This public school will provide us with much needed talent, and they will be deeply grateful to us for the education we provide."
 QIE_wushan_national_beijing_science_institute: "National Beijing Institute of Science"
 QIE_wushan_national_beijing_science_institute_desc: "Based on the talent and education network accumulated by Jinghui Public School, the National Beijing Institute of Science will undertake more systematic industrial, electronic and basic scientific research."
 QIE_wushan_pharmacy_anatomy_act: "Medical Anatomy Development Draft"
 QIE_wushan_pharmacy_anatomy_act_desc: "Tang Erhe and the Chinese Medical Association proposed a draft that will help our medical development, involving a series of cutting-edge clinical trials. Citing the Tuskegee syphilis experiment launched in the United States a few years ago, Dr. Towner pointed out that in order to achieve results in the field of modern medical science, clinical trials are necessary and beneficial to the country. What we achieve here will not only improve our own health, but also prepare us for the harsh conditions our troops encounter."
 QIE_wushan_jiangnan_shipyard_bonus: "Jiangnan Shipbuilding Expansion"
 QIE_inner_sage: "Inner Saint"
 QIE_inner_sage_desc: "§CHeaven came down to Yilun and established our people. Where the outline is always, that is where the country is tied. All the ethics of crowns and belts, the beauty of poems and books, should be upheld with etiquette and uphold justice to death. The way of a saint is not just about cultivating the body, but actually about armor. Internally, you should keep your mind upright to unite the people; externally, you should rely on virtue to repel the enemy. Every people and every land is commanded by heaven. If there is a slight mistake, the etiquette will collapse and the music will be ruined; if the inner sanctity does not waver, external insults and ridicules will enter. §!"
 QIE_outer_king: "foreign king"
 QIE_outer_king_desc: "§CThe world is not owned by one person, but morality is the common weapon of the world. Wherever the Five Teachings have not been practiced, that is where beasts roam; the souls of the people who have not been sanctified are all hanging upside down waiting to be saved. Today, with benevolence and righteousness as the banner, and the edict as the axe, we drive the long chariot out of the Yumen, and cross the ocean with the sound of virtue. It's not just that I'm bloodthirsty, I really can't bear to let people live in misery for a long time. The king's division has conquered but not fought; in the age of great harmony, who dares not to come? §!"
 QIE_wushan_madan_spirit: "Report your satisfaction on the Golden Stage"
 QIE_wushan_madan_spirit_desc: "We promise people we will protect them, we give them weapons, we give them training, we feed them and clothe them, and they stand up when the enemy wants to take it away and stop the enemy from doing so. There is no one more patriotic than them."
 QIE_wushan_human_tide_spirit: "Combine vertically"
 QIE_wushan_human_tide_spirit_desc: "A thousand-mile embankment collapsed in an ant nest. As long as our soldiers unite, even the most powerful enemy will tire, and this will expose his weaknesses."
 QIE_wushan_elite_soldiers_spirit: "Lian Heng"
 QIE_wushan_elite_soldiers_spirit_desc: "It's not about having many soldiers, it's about being skilled. An outstanding elite force is the military force we need most. We will not waste our military production capacity on arming. Every bullet can kill more enemies with the highest efficiency."
 QIE_wushan_continuation_of_xiaozhan_spirit: "The continuation of the small station spirit"
 QIE_wushan_continuation_of_xiaozhan_spirit_desc: "Although Tianjin Xiaozhan is temporarily in the hands of others, they can take away the land, but they cannot take away the spirit of Xiaozhan! We will practice it in our military, building a truly loyal and powerful military."
 QIE_wushan_unexpected_budget: "unexpected budget"
 QIE_wushan_unexpected_budget_desc: "We have a limited budget. On the one hand, the No. 101 Special Experiment Department is optimizing the production process of the aircraft, and on the other hand, it is carrying out related test flights of new aircraft in Mongolia. If they fail to deliver results over a period of time, we will have to stop funding them."
 QIE_wushan_sunrise: "sunrise"
 QIE_wushan_sunrise_desc: "The night is coming to an end and the sun has risen. Our motherland has finally awakened from this long-lasting nightmare. Facing a brand-new future, people will rush to build it."
 QIE_wushan_luoyang_arsenal_zhili_research: "Luoyang Research Institute: Traditional Weapons Development"
 QIE_wushan_luoyang_arsenal_tank_research: "Luoyang Research Institute: Mechanization Development"
 QIE_wushan_luoyang_arsenal_infantry_cost: "Luoyang Research Institute: Focus on infantry weapons"
 QIE_wushan_luoyang_arsenal_artillery_cost: "Luoyang Research Institute: Pay attention to artillery"
 QIE_wushan_luoyang_arsenal_armor_cost: "Luoyang Research Institute: Focus on armored weapons"
 QIE_wushan_luoyang_arsenal_motorized_cost: "Luoyang Research Institute: Focus on mobile vehicles"
 QIE_jingchun_army_bureau: "The starting military aircraft department"
 QIE_jingchun_army_bureau_desc: "All in all, we have used various means to finally put these soldiers together for unified management. The next thing to do is to use the staff and modern warfare methods to transform them from an army that does its own thing into an army that can uniformly obey the deployment. Who thought of having Clausewitz deliver an oracle on the altar..."
 QIE_jingchun_army_bureau_upgraded: "Jingchun Zhenren Military Aircraft Department"
 QIE_jingchun_army_bureau_upgraded_desc: "Compared with the military systems of the world's leading countries, we are only temporarily at a disadvantage, and we are not yet hopeless. Moreover, the experience that is available in the Western world may not be available in this land of China. In time, we will surely be able to prove to everyone that what we have is the true teacher of the king of China and the true ruler to whom destiny belongs."
 QIE_jingchun_army_bureau_tank_upgraded: "Jingchun Zhenren Military Aircraft Department"
 QIE_jingchun_army_bureau_tank_upgraded_desc: "Compared with the military systems of the world's leading countries, we are only temporarily at a disadvantage, and we are not yet hopeless. Moreover, the experience that is available in the Western world may not be available in this land of China. In time, we will surely be able to prove to everyone that what we have is the true teacher of the king of China and the true ruler to whom destiny belongs."
 QIE_jingchun_army_bureau_tank_upgraded_2: "Salvation Arsenal Aviation Department"
 QIE_jingchun_army_bureau_tank_upgraded_2_desc: "For a long time, most of China's military has been undisciplined and undisciplined, more like official bandits than soldiers. With the thorough implementation of the Military Aircraft Department system, we were finally able to sweep away the bad habits of the past and truly build a modern army and a corresponding command system. Now, this powerful military force is waiting for orders to completely crush the enemy."
 QIE_jingchun_army_bureau_upgraded_2: "Salvation Arsenal Aviation Department"
 QIE_jingchun_army_bureau_upgraded_2_desc: "For a long time, most of China's military has been undisciplined and undisciplined, more like official bandits than soldiers. With the thorough implementation of the Military Aircraft Department system, we were finally able to sweep away the bad habits of the past and truly build a modern army and a corresponding command system. Now, this powerful military force is waiting for orders to completely crush the enemy."
 QIE_wushan_debt_repayment: "debt repayment"
 QIE_wushan_debt_repayment_desc: "We have begun to address our debt problem, and the new agreement with the Germans waived some of our interest payments at the cost of us now starting to repay our debt on a yearly basis. Although Li Sihao repeated his old tricks and designed a \"separate salt payment\" for us similar to the one designed for Yuan Shikai, which reduced our financial burden. But the debt that needs to be repaid today is still very heavy for the current government, but fortunately we can already see the day when we are completely free of debt."
 QIE_wushan_poor_relief_society: "Poor Relief Society"
 QIE_wushan_poor_relief_society_desc: "In August 1920, when the Zhijiang-Anhui War broke out, the New Religion of Salvation established a Poor Relief Association in the Gyeonggi area, responsible for liaising with social gentry and businessmen, and carrying out charity relief activities for officials and gentry. After the war, the organization disbanded itself. Now we have restarted the Poor Relief Society, but our resources are limited and the number of victims is huge. If we only provide charity relief, we may one day cause a collapse."
 QIE_wushan_rebuild_labor_cooperative_institute: "Rebuilding the Labor Cooperative Institution"
 QIE_wushan_rebuild_labor_cooperative_institute_desc: "The best way to solve the problem of syndicalism is to imitate the trade unions and establish a workers' cooperative house controlled by the government. The power to appoint relevant members and the content of the cooperative house meetings are all in our hands."
 QIE_wushan_unite_against_external_enemies: "The foundation of the world lies in the country"
 QIE_wushan_unite_against_external_enemies_desc: "The war has arrived! Everyone must obey orders and defend the interests of the country in the most appropriate manner assigned to him by the country. As the saying goes, those who protect the world are responsible for the humbleness of a common man."
 QIE_wushan_fiscal_reorganization: "The Finance Department is being reorganized"
 QIE_wushan_fiscal_reorganization_desc: "Under the leadership of Wang Kemin, the government finally decided to tear up the international debt it owed, which undoubtedly caused our country's international financial credibility to plummet and completely cut off the possibility of normal trade with overseas countries. Wang Kemin is presiding over the reorganization of the Department of Finance, which aims to alleviate the economic development problems caused by the loss of external assistance during this period."
 QIE_wushan_relief_finance_bureau: "self-sufficient financial status"
 QIE_wushan_relief_finance_bureau_desc: "After half a year, the Department of Finance has completely optimized its previous financial relations and external development strategies. Thanks to our large population, we have now established a self-sufficient economic development model that relies little on the external environment."
 QIE_tangdi_zhihua: "Chang Di's Hua"
 QIE_tangdi_zhihua_desc: "The beauty of Chang Di is not beautiful. There is nothing better than brothers today. \nThe power of death and mourning, brother Kong Huai. The original Xisi is here, and my brothers are asking for help. \nThe order is still there, and the brothers are in urgent need. Every time I have a good friend, I will always sigh. \nBrothers are jealous of each other and try to protect their affairs from outside. Whenever there are good friends, there will be no enemies."
 QIE_wushan_artillery_units_focus: "Danmaku planning"
 QIE_wushan_artillery_units_focus_desc: "By assigning artillery to specific units, we can pre-plan barrages for breakout operations, which will strengthen our artillery firepower and make its attacks more intense."
 QIE_wushan_special_units_focus: "Infiltrate positions"
 QIE_wushan_special_units_focus_desc: "We will adopt the strategy of engaging the enemy at zero distance, infiltrating the enemy's positions at night and launching attacks."
 QIE_wushan_belligerent_government: "bellicose government"
 QIE_wushan_belligerent_government_desc: "The time has come, and now we finally no longer need to pretend to be a comprador government that pursues a global good-neighbor policy and sells its country for glory. All the resources we previously gained through international trade and diplomatic relations will now be expended exponentially to power our war machinery…"
 QIE_wushan_precious_tradition: "precious tradition"
 QIE_wushan_precious_tradition_desc: "The words of a saint are worth thousands of gold. Today, the country is divided and the world is in chaos, precisely because people have forgotten etiquette and morality and have turned to worshiping the so-called republican liberation. For this reason, we must re-implant the Confucian and Mencius traditions into people's hearts. The great sutras and laws of \"Chun Qiu Zuo Zhuan\" will be able to save all the current shortcomings."
 QIE_wushan_scriptural_police: "Economic and religious inspector"
 QIE_wushan_scriptural_police_desc: "The religious inspectors will patrol not only the army but also society. They will monitor whether the ethics we promote are properly enforced in public spaces. They have nothing to do with the judicial organs, and all they can do is provide guidance and report on places that are not in line with social ethics. Therefore, they are not subject to the constraints of judicial personnel, and naturally do not need to bear relevant obligations."
 QIE_wushan_huayi_distinction: "Discrimination between Huayi and Huayi"
 QIE_wushan_huayi_distinction_desc: "The people of the four foreign countries have long been re-translated, and they admire the benevolence, righteousness, and loyalty of the Chinese. Although they come from a foreign land, they can be attentive to China, so I don't call them foreigners. Those who are introverted in the Four Barbarians, who like me to be benevolent, righteous, loyal and trustworthy, and who are willing to be virtuous to others, are not the splendor of the Four Barbarians? Those who remember my words are not called Yi."
 QIE_wushan_restore_ethical_order: "Restoring ethical principles"
 QIE_wushan_restore_ethical_order_desc: "Confucian ethics is the cornerstone of Chinese civilization and national construction. In the past decade or so, we have accepted Western ideas and ignored the precious treasures passed down by our ancestors. Now is the time to re-promote the excellence of our culture in society."
 QIE_wushan_enforce_salvationist_legal_code: "Promote the \"Hongfan Dadian\""
 QIE_wushan_enforce_salvationist_legal_code_desc: "Long before the Republican Revolution, our country had judicial and constitutional principles such as the \"Criminal Law of the Qing Dynasty\" and the \"Civil Law of the Qing Dynasty\". It is only because of the despicable and shameless acts of stealing the country by people in the previous Republic that these laws based on our country's national conditions have not been put into practice. We will implement the new law \"Hong Fan Dadian\" that inherits them in society. This law not only symbolizes the return of our society to tradition, but also symbolizes the continuation of the Chinese legal system in today's era."
 QIE_wushan_salvationist_legal_code: "\"Hongfan Dadian\""
 QIE_wushan_salvationist_legal_code_desc: "Long before the Republican Revolution, our country had judicial and constitutional principles such as the \"Criminal Law of the Qing Dynasty\" and the \"Civil Law of the Qing Dynasty\". It is only because of the despicable and shameless acts of stealing the country by people in the previous Republic that these laws based on our country's national conditions have not been put into practice. We will implement the new law \"Hong Fan Dadian\" that inherits them in society. After a period of transition, the \"Hongfan Dadian\" has been officially implemented in the areas we rule. This law not only symbolizes the return of our society to tradition, but also symbolizes the continuation of the Chinese legal system in today's era."
 QIE_wushan_rebuild_enyin_temporary: "Rebuilding the Special Enyin System"
 QIE_wushan_rebuild_enyin_temporary_desc: "Our country has had a shadow system since ancient times. This system can ensure that the upper class of society is firmly in the hands of some people, thereby forming a closer community of interests. We should rebuild this system to strengthen rule. But at the same time, we have not forgotten to open some upward channels for all kinds of people, so that we can ensure the interests of everyone in the entire political community."
 QIE_wushan_revived_enyin_system: "grace system"
 QIE_wushan_revived_enyin_system_desc: "Our country's ancient system of yin and yang has been rebuilt so that we can keep the upper class firmly in our hands. But at the same time, we have not forgotten to open some upward channels for all kinds of people, so that we can ensure the interests of everyone in the entire political community."
 QIE_wushan_temporary_friendly_ties: "our temporary friendly relationship with the world"
 QIE_wushan_temporary_friendly_ties_desc: "Our new regime is now so weak, and past governments have left us a country in ruins. To improve the situation, our best option is to be diplomatically friendly to the powerful. The great powers are interested in the minerals under our land and our abundant human resources, and we may be able to use these in exchange for things that are beneficial to us...\n\n§ROnce war breaks out, the New Religion of Salvation will tear off this disguise. §!"
 QIE_wushan_siyi_translation_institute: "Translation Institute"
 QIE_wushan_siyi_translation_institute_desc: "The Institute of Translation Studies was founded in 1903. This short-lived organization was once one of the few gateways for China to obtain knowledge from the outside world. We have restarted the Translation Institute to translate important overseas works for our use. §RIn addition to common economics and military books, maybe we can also let them \"translate\" some foreign books that don't exist at all...§!"
 QIE_wushan_expert_governance: "expert governance"
 QIE_wushan_expert_governance_desc: "The long-standing problem in Chinese politics has been that laymen have always guided experts, but this time it is different. These real working experts will finally be able to take charge with the help of a sacred photo that is actually powerless, and behind the curtain of superstition, we will form a real conference of experts to ensure the normal functioning of society."
 QIE_wushan_expert_governance_1: "expert governance"
 QIE_wushan_expert_governance_1_desc: "The long-standing problem in Chinese politics has been that laymen have always guided experts, but this time it is different. These real working experts will finally be able to take charge with the help of a sacred photo that is actually powerless, and behind the curtain of superstition, we will form a real conference of experts to ensure the normal functioning of society."
 QIE_wushan_expert_governance_2: "expert governance"
 QIE_wushan_expert_governance_2_desc: "The long-standing problem in Chinese politics has been that laymen have always guided experts, but this time it is different. These real working experts will finally be able to take charge with the help of a sacred photo that is actually powerless, and behind the curtain of superstition, we will form a real conference of experts to ensure the normal functioning of society."
 QIE_wushan_clique_politics: "forming cliques"
 QIE_wushan_clique_politics_desc: "Politics is the art of distribution. As long as we can do a good job of distribution, we can unite with any force to achieve our own goals. Some intellectuals criticized this kind of party-building behavior that had no bottom line and was motivated only by interests. It was essentially a kind of political speculation and government corruption. However, the reason why they criticized the government so fiercely was simply because they did not call him when the money was divided."
 QIE_wushan_rooster_devours_vermin: "Rooster Eater"
 QIE_wushan_rooster_devours_vermin_desc: "The war was not over yet, and although the Japanese had left the mainland, their threat was not gone. China is like the rooster and Japan is the worm. All we have to do is lower our head and peck, and it will fall steadily into our belly and become a delicious meal."
 QIE_wushan_blades_sigils_and_thunderfire: "Broadsword, Talisman and Five Thunder Musket"
 QIE_wushan_blades_sigils_and_thunderfire_desc: "With the help of traditional martial arts, talismans, a few obsolete muskets, and some modern medicines disguised as traditional medicines, we have established rural brave militia groups in villages everywhere. If one day our land unfortunately falls temporarily into the hands of the enemy, what they will have to face is high cost of governance and endless security wars."
 QIE_wushan_ycp_one_year_special_plan: "Al-Shabaab’s one-year special plan"
 QIE_wushan_ycp_one_year_special_plan_desc: "We are working with Al-Shabaab on a one-year special plan aimed at improving our country's weak industrial strength so that we are no longer controlled by others. Al-Shabaab believes that by developing industry, our country can become one of the world's great powers."
 QIE_wushan_rural_revival_movement: "rural revival movement"
 QIE_wushan_rural_revival_movement_desc: "We are working with members of the Imperial Constitutional Association to launch a one-year special plan aimed at improving the imbalance of development between rural areas and urban areas in our country, so that rural land that has not been properly developed can be fully utilized. Members of the Imperial Constitutional Association believe that by developing rural areas, our people will be happier, and our country will naturally become stronger."
 QIE_wushan_subsidize_domestic_enterprises_first: "Giving priority to subsidizing domestic enterprises"
 QIE_wushan_subsidize_domestic_enterprises_first_desc: "We cooperated with the Communist Party members to carry out a one-year special plan aimed at improving the development level of our national industry and integrating it with international standards. These socialist party business owners believe that industry can rejuvenate the country, and the mutual benefit of globalization is an indispensable part of industrial rejuvenation."
 QIE_wushan_chawei_commissioner: "Chawei Dutong"
 QIE_wushan_chawei_commissioner_desc: "We have trained spies to collect intelligence, but we lack the institutions to analyze it. Our new intelligence agency will help us process the information we collect and help us develop plans."
 QIE_wushan_full_power_chawei_commissioner: "Full power to monitor everything"
 QIE_wushan_full_power_chawei_commissioner_desc: "We have trained spies to collect intelligence, but we lack the institutions to analyze it. Our new intelligence agency will help us process the information we collect and help us develop plans."
 QIE_wushan_special_mandate_chawei_commissioner: "Extraordinary Chawei Dutong"
 QIE_wushan_special_mandate_chawei_commissioner_desc: "We have trained spies to collect intelligence, but we lack the institutions to analyze it. Our new intelligence agency will help us process the information we collect and help us develop plans."
 QIE_wushan_extraordinary_plenipotentiary_chawei_commissioner: "Extraordinary and Plenipotentiary Procuratorate"
 QIE_wushan_extraordinary_plenipotentiary_chawei_commissioner_desc: "With World War II in full swing, we must give our intelligence services more power if we want to have the upper hand in a world war. This would provide us with an early glimpse of the enemy in the shadow of a major war, and any war plans we might have would benefit from it."
 QIE_dual_control_wushan_focus_tt: "The long-term stalemate between §YJiang Chaozong§! and §YWu Peifu§! led to the dissatisfaction of other neutral members of the society. They forced the two to admit that §YQian Nengxun§! was the sole religious lineage of the §RNew Religion of Salvation§!. The soul of the deceased person would lead the North China government to an unknown path through the Fuji message - which would depend on the subsequent game. §RBut at least for now, everything is quiet. §!"
 QIE_wushan_events.1.t: "New Religion of Salvation invites fundraising donations"
 QIE_wushan_events.1.desc: "The Christian Salvation Church, a charity group, requested a substantial grant from us to provide relief and resettlement to the refugees who have recently flooded into Henan and Hubei due to the unrest in the eight provinces. The funds will be used to open nurseries, build temporary residences and other disaster relief projects. Unlike political officials, although they are nominally charitable organizations, they have close contacts with important officials in Beiyang on weekdays. Its leader, Jiang Chaozong, strongly supported the Zhili faction during the Third Zhili-Fengtian War. It is the government's duty to manage disasters and protect people. However, we have had trouble collecting taxes before, and it is really difficult to come up with such extra funds."
 QIE_wushan_events.1.a: "We don't have the money - let them hire someone else."
 QIE_wushan_events.1.b: "Another hard time for the Ministry of Finance."
 QIE_wushan_events.2.t: "Find another way out"
 QIE_wushan_events.2.desc: "What is deeply surprising is that the Harmony Society and the direct government behind it have refused to provide the New Religion of Salvation with funds to help the refugees in the eight provinces. Since the establishment of the New Religion of Salvation, its activity funds have been inseparable from the support of officials, gentry, celebrities and social businessmen. Especially considering the status of the current government in the eyes of the people, both the \"presidential briber\" and the layman Zhixuan should take this opportunity to show their determination to appease the people. Wison also thought that he could get at least some official funding to encourage people from all walks of life to actively participate in relief fundraising and stabilize the current chaotic situation. \n\nAll in all, the top priority is to see if money can be found through other channels. Although relying solely on donations from church members can help resettle the refugees at the moment, it is obvious that it will not solve the problems that will come soon."
 QIE_wushan_events.2.a: "Maybe it’s not that they don’t want to take the money, but that they can’t afford it."
 QIE_wushan_events.3.t: "Encounter in a teahouse"
 QIE_wushan_events.3.desc: "\"Today's weather is in line with the current situation. Although it is just a drizzle, there is something hidden in it...\"\n\nJiang Chaozong smiled in relief and took a sip from the covered bowl in Laijin Yuxuan. The sweet fragrance and light bitterness slide into the throat together. This tea cost him three cents foreign dollars, but the taste was worthy of the price. \n\nIn the spring of the Gengshen year of 1920, he was punished by the Duan Qirui government for participating in the German-supported Puyi restoration with Zhang Xun. At that time, he suffered from eye disease - he almost thought that he would be a blind general for the rest of his life. It was also in Central Park that old friends Wang Zhonggao and Deng Yuan presented him with a real-life statue of Chunyang Lu Dongbin taken with spiritual photography. With that photo and the subsequent outbreak of the Zhijiang-Anhui War, the New Religion of Salvation as a charitable organization was officially founded. If you think about it carefully, it seems that every time the cult gains momentum, it is always accompanied by war and turmoil. \n\nBut will it be the same this time? \n\n\"You are Mr. Yu Cheng, right?\" Just as Jiang Chaozong was sinking into old memories, a man with small eyes stopped in front of him. \n\n\"I didn't expect to meet you here. I thought this place had long been regarded as a base camp by those intellectuals. Now the exterminator is here, are you going to do some general cleaning?\" \n\nJiang Chaozong stared at the other party with confusion - at least he tried to look confused. The person who came was the target of his trip, Tong Jixu, a friend of Zheng Xiaoxu, the theorist behind the Royalist Party, and Puyi's chief of bodyguards. \n\n\"Who are you?\" Jiang Chaozong slowly put down the tea cup, \"I am old and weak. Maybe I have seen you somewhere before, but I just can't remember it at the moment.\""
 QIE_wushan_events.3.a: "\"I'm Tong Jixu, we met at Nanyuan Aviation School.\""
 QIE_wushan_events.3.b: "\"It's me. We met at the Restoration Conference when Zhang Xun revolted.\""
 QIE_wushan_events.4.t: "Strange news coming from Beijing"
 QIE_wushan_events.4.desc: "From the fog surrounding China's political arena, comes a confusing message. Although the details are still unclear, it is believed that after a coup in the Forbidden City this morning, a figure who is unfamiliar yet familiar to Chinese politics-Jiang Chaozong emerged. In 1917, Puyi carried out a failed restoration with the support of the Germans. At that time, he served as the admiral of the Nine Gates, and it was Jiang Chaozong who was responsible for defending Beijing. Accompanying him were Wu Peifu's deputy Liu Yuchun and Royalist Party member Aixinjueluo Puqian. \nJiang Chaozong once participated in Ding Si's restoration, but fell to Duan Qirui at the last moment. He revealed the course of the coup to the world's media. \"The traitor Cao Kun intends to assassinate His Majesty! Your Majesty is frightened and cannot attend now.\" Now his charity and religious organization, the New Religion of Salvation, has temporarily controlled the situation in Beijing, and plans to deal with the disorder problems in China caused by the collapse of the eight-province alliance and the famine in Sichuan in the next time. Jiang Chaozong did not disclose to the media why Wu Peifu, who shared the honor and disgrace with Cao Kun, appeared next to him. Now no one can be sure what will happen in the future..."
 QIE_wushan_events.4.a: "Another Zhang Tianran?"
 QIE_wushan_events.5.t: "Test placeholder event"
 QIE_wushan_events.5.desc: "How did you come to see this event? This is definitely a BUG."
 QIE_wushan_events.5.a: "Respect Tao and Virtue"
 QIE_wushan_events.6.t: "Burn incense"
 QIE_wushan_events.6.desc: "With the Zhili warlords standing by and watching the collapse of the eight-province alliance and the order of the Harmonious Society disintegrating like a sand tower, the New Religion of Salvation took advantage of the situation and took over Beijing's administrative system. However, as the ecclesiastical authority changed from a virtual role to a real power, the balance of power within this \"charitable organization\" finally became completely unbalanced. \nJiang Chaozong and Wu Peifu have been sitting in separate rooms on the east and west sides of Lu Zu Pavilion since the coup. On the surface, they still go to Fuji together, but secretly they have used their own magical powers. In order to maintain the mask of harmony in front of the congregation, the monthly Luan descending is still a must-attend performance. Tonight, layman Cizhi will serve as the shaman and invite Master Lu Zu of Chunyang to descend. Everyone participating in the fuqi holds incense. Here, the quality of the incense is a silent declaration of power and status. The one in Jiang Chaozong's hand is the Jialuo King Kong incense obtained from an old friend in Japan for a lot of money. It has thick purple smoke, like a blue dragon and a pillar; the one held by Wu Peifu is an ancient cypress incense picked from the Confucius Forest in Qufu, Shandong. It is thin and tall, like a gentleman facing the wind. \n\nAt this moment, the traces of sand on the altar began to move away. One stroke after another, everyone in the palace held their breath, and it was as silent as a tomb. Lu Zu penned a poem and wrote four sentences: \"The East Sea is deep and unnavigable, and the moon-dark road in the West Mountain is long. If you want to know where the destiny is, let's see who burns this incense.\"\n\nWhen the last stroke fell, the shackles stopped abruptly. No one in the entire hall dared to make a sound. Only the incense burns out, and the two pillars of smoke rise straight up and entangle on the beam, like two dragons fighting each other, and it is difficult to tell the winner. At this moment, I don't know who was careless and forgot to close the doors and windows. A gust of night wind came in from outside the pavilion. It was neither fast nor slow, but it went exactly where it should go."
 QIE_wushan_events.6.a: "The Jialuo incense is extinguished, and the Vajra does not protect its owner."
 QIE_wushan_events.6.b: "The fragrance of cypress is broken, and the saint does not pass his way"
 QIE_wushan_events.6.c: "Two incense burns together, and the prophecy cannot come true."
 QIE_wushan_events_6_a_tt: "The secret agreement between §YJiang Chaozong§! and his §gJapanese friends§! ultimately failed. §YWu Peifu§! will become the sole leader of the New Religion of Salvation."
 QIE_wushan_events_6_b_tt: "The Confucian crowns of §YWu Peifu§! and §GMing Jing Society§! ultimately failed to overcome the Japanese King Kong smoke coming across the sea. §YJiang Chaozong§! will become the only leader of the New Religion of Salvation."
 QIE_wushan_events_6_c_tt: "§RThe wind stopped. Nothing happened. §!"
 QIE_wushan_events.11.t: "Bingzi meeting"
 QIE_wushan_events.11.desc: "As is the custom every year to celebrate the Spring Festival, members of the club gathered at the Liuguo Hotel tonight. Lay Buddhist Huiji delivered his usual pragmatic and brief New Year speech. Compared with the sleepy platitudes of the Congress president during the day, these words are obviously more popular with people. Hui Ji first summarized the progress of the charity work and the changes in the membership list in the year of Yihai, and then mentioned the printing and distribution of the scriptures obtained from Fuji last year. After that, it entered the social time, and the faces of the new members of the society walked cautiously among the crowd, trying to find a place for themselves in the chatter of the old people. \n\nHuiji walked slowly through the hall holding a wine glass, looking around for someone. He heard that most people were talking about the Zhejiang-Jiangxi Railway that was recently opened to traffic between eight provinces. This railway obviously means the further expansion of the southern market for many people. A member who holds an important position on the board of directors revealed that German high-level officials will announce the acquisition of the railway in the next few days. Chinese nationalists will certainly not sit idly by; and before protests, strikes and anti-concession movements really arise, it may be profitable to provide some \"funding\" to the right people in advance...\n\nHuiji still didn't see him after all - although there were scattered members of the Beijing Mingjing Society in sight, layman Zhixuan himself still did not attend this year's meeting."
 QIE_wushan_events.11.a: "This is the ninth year that Wu Peifu has been absent..."
 QIE_wushan_events.11.b: "A gentleman is still a gentleman when he loses his throne; a king is reduced to a common man when he loses his throne."
 QIE_wushan_events.12.t: "a simple meal"
 QIE_wushan_events.12.desc: "Jiang Chaozong and Wu Jinglian sat down in Donglai Shunzhong on Qianmen Street. This was a social tradition among the Beiyang elders of their generation. Jiang Chaozong knew that King Baoding and Yushuai were just maintaining a decent connection of interests, but he never expected that they would have such an internal dispute over whether to support the crisis in the eight provinces. As telegrams from the south were delivered to the two men one after another, not rolling the dice was equivalent to the worst option. \n\nWu Jinglian picked up a piece of mutton and placed it in the boiling soup in the copper pot for a moment. Staring at the piece of meat that was gradually losing its color, Jiang Chaozong realized that the situation in Beijing might not calm down on its own as the direct government expected. Instead, it's heading for the worst."
 QIE_wushan_events.12.a: "Mr. Jiangsi, this mutton is getting old."
 QIE_wushan_events.13.t: "Divination"
 QIE_wushan_events.13.desc: "In the Lu Zu Pavilion in Mingguang Hutong, Guifang first burned three sticks of incense and bowed devoutly three times to the statue of Lu Dongbin. Then he took out the lacquered wooden plate from his pocket and began to spin it according to the current time. After the images on the plate returned to their positions and the hall became quiet again, Guifang knelt down and kowtowed again, and respectfully took out the book of interpretation of the hexagrams from under the altar table with both hands. \n\n\"What does the hexagram say?\" Hui Ji asked in a low voice when he saw that the divination was over. \n\n\"There is wealth everywhere,\" Guifang nodded, \"Three legends of pure earth, all are official ghosts. Looking at the middle legend, the official ghost rides on a white tiger. If an ordinary person wants to get this wealth, he will be in trouble.\"\n\nAfter he finished speaking, he suddenly changed. \"But for you and me, it is a talisman to urge the official to arrive. The sign of crouching and chanting indicates that the master is stagnant and difficult to solve; and there is a suspicion of chaos, so it is appropriate to commit the crime.\" Guifang closed the hexagram book and read slowly:\n\n\"When you are tempted by wealth, misfortune will strike. It is said that there is a tiger ghost, so officials should come.\""
 QIE_wushan_events.13.a: "The white tiger eats the yellow dragon, and the kingdom is about to end"
 QIE_wushan_events.14.t: "Uninvited guests in Shichahai"
 QIE_wushan_events.14.desc: "The host who invited them was really generous. Not only did he choose a high-end place like Huixiantang Restaurant, but he also invited Yu Shuyan, a great singer to sing \"Catch and Release Store\". After the table was gone and the sound lingered, everyone looked around and realized that the people present tonight could almost be called another congressional team - but most of them were small groups that were still being squeezed out by the Harmony Society. Everyone present knew that today's meal was by no means cheap. \n\nNow, the hospitable host who calls himself \"Huiji layman\" finally appears. Jiang Chaozong, dressed in military uniform and wearing a medal symbolizing his old status, walked slowly onto the stage. He first asked everyone present to raise funds for the United Refugees of Eight Provinces, and then changed the subject and began to talk about the increasingly chaotic situation in Beijing today: He said that he was aware that a loose and cautious alliance had formed among the people present. If the situation continued to deteriorate, he himself, as well as the New Religion of Salvation, would be willing to do a little bit to restore order in Beijing. \n\nThe first to express dissatisfaction were the members of the hardworking association. They had listened to Tang Erhe's persuasion before going to the banquet, but they found it difficult to accept that they had to talk about political union with a group of weirdos who advocated the \"unity of five religions\" and claimed to be able to communicate with \"Jesus\". Zeng Qi was more direct: He asked Jiang Chaozong whether the New Religion of Salvation was secretly receiving funding from the Germans, Japanese and embassy cities as rumored. The Al-Shabaab members obviously suspected that Jiang Chaozong's motives were impure, but they had to admit that if he could really control the government, they would not be unable to consider cooperating. \n\nEveryone in the Imperial Constitutional Association also had doubts. After all, everyone knows that Wu Peifu, the Jade Commander, is also a member of the New Religion of Salvation. Who can conclude that Jiang Chaozong's banquet, which is called a series of parties, is not a conspiracy arranged by Zhili to lure snakes out of their holes? However, after thinking about it, if Zhili really wants to deal with them, it seems that there is no need to go to such trouble. After several discussions in low voices, they finally decided to support Jiang Chaozong's actions for the time being. As for those members of the Mingguang Society, they obviously had other plans. They looked calm and spoke reservedly, as if they already knew what would happen tonight. Jiang Chaozong was not surprised by this. Before coming here, Zheng Xiaoxu had probably told them everything that needed to be said."
 QIE_wushan_events.14.a: "At least it looks more like Congress than the current administration."
 QIE_wushan_events.15.t: "Ridiculous rumors"
 QIE_wushan_events.15.desc: "Recently, Wu Peifu and Cao Kun could sense an abnormal atmosphere just by showing up on the street. Whenever the two of them appear, people will whisper to each other and make small talk. At first, they just thought it was a common rumor based on the recent situation. It was not until several telegrams explaining the relevant circumstances were sent to the case that the two finally understood the reason. \n\nIt turns out that since the collapse of the eight-province alliance, many \"half-immortals\" who fled from the south into North China have also flowed into Beijing along with the refugees. They set up stalls along the street and read fortune tellings, but they always said the same sentence: This is the year of Bingzi, and both Yushuai and King Baoding are in bad luck, and they may be in trouble. \n\nIt wouldn't be a big deal if it was just a fortune teller talking nonsense. However, many sorcerers who claim to have escaped from the south have good noses and eyes, and they can corroborate each other. Within a few days, the rumors spread more and more widely, and it seemed that it was a foregone conclusion that Wu and Cao would suffer great disaster this year. \n\nWhat's even more troublesome is that some gangsters and desperate refugees from eight provinces used rumors to embolden them and took desperate risks to try to break into Dongtangzi Alley to steal property. Although Wang Chengbin has ordered to strengthen security, the current situation in the capital is tense and the military strength is really stretched. Wu Jinglian then suggested that private soldiers from various families could come to act as security forces. Now those private soldiers are already on the way."
 QIE_wushan_events.15.a: "Do you believe what a fortune teller says casually?"
 QIE_wushan_events.15.tt: "§OThere are rumors that Russians wearing Zhili military uniforms were seen on the street, which is really strange. §!"
 QIE_wushan_events.16.t: "Wandering to a distant place"
 QIE_wushan_events.16.desc: "Meczynski had long been interested in the Czech. Unlike me, the other person looks too much like a Chinese. As long as he puts on these clothes, he can report to a certain Chinese warlord almost immediately - I don't know whether this is a compliment or an offense. Just when he was still thinking about how to start this conversation, the other party spoke first. The bastard was speaking German. Fortunately, Machinski also understood a few words. \n\n\"Mainjar,\" the Czech subconsciously wanted to touch Khedive, but then he thought that the Chinese soldiers had never seen this before. If there were any flaws, it would be all over. \"What is your name?\"\n\"Igor Semenovich Machin ——\"\n\"No, that's not it.\" Meinjier waved his hand, \"I mean those Chinese people, what did they call you?\"\n\n\"Han Hui, it's said to be wise.\" Mechinsky frowned, \"That's a damn name. Weird.\" \"They call me Hanfa. I have the law. That's interesting. It sounds like I can legally do what I want to do - I want to -\" his hands began to shake and he started to fumble for the cigarette on his body again, \"-I want to go back to Prague one day. , and let the fuck - all the Czechs speak Czech.\"\n\nThe mood came and went suddenly, and as soon as he finished speaking, Mainjar returned to the indifferent expression he had before speaking, as if the words just now did not come from his mouth. Machinsky was now at a loss and had no choice but to brag about how he had followed the rebellious Czechoslovak Legion to liberate Siberia and defeat the Russian Red Army."
 QIE_wushan_events.16.a: "\"Don't believe it, I single-handedly killed five red bandits in Yekaterinodar. Look, they shot this left hand.\""
 QIE_wushan_events.17.t: "outside the main hall"
 QIE_wushan_events.17.desc: "His Majesty Qianqing Palace Dan, several ceremonial guards looked silently at Wu Peifu, Cao Kun and their two guards approaching from a distance. Turning back to look at Dan Majesty, more than a dozen of the emperor's soldiers were already in their positions. Wu Peifu and Cao Kun approached, and before entering the hall, the two seemed to exchange a few words in a low voice. Then they walked into the temple side by side. \n\nIn the shadow of the palace wall farther away, several teams of temporarily transferred guards are waiting for the real order. They are nominally a temporary security force recruited to prevent the recent riots outside the palace from spreading to the imperial palace. But in fact, the orders these people took were by no means the emperor himself. They leaned nervously on the wooden box, waiting for that critical signal. The blanket and the lid of the box would be lifted, and the short gun hidden inside would be revealed. \n\nThe Royalist Party thought that it could get rid of Cao Wu in the name of the little emperor, while Cao Wu thought that he could escape with his guards and pistols. But no matter which side shoots first, they will lose their last bit of dignity in the Qianqing Palace. \n\nHis Majesty Dan's guards heard the sound of rapid footsteps and heavy stamping, and the palace suddenly became noisy. Then the guards in the shadow of the palace wall heard the first gunshot, and then the gunshots were heard in succession. The guards of Cao and Wu greeted the ceremonial guards and rushed into the Qianqing Palace with their guns drawn. There was chaos in the corridor. Everyone was caught by this sudden coup, but no one paid attention to a man wearing glasses and a suit, about 1.7 meters tall, who took advantage of the chaos and ran out of the palace."
 QIE_wushan_events.17.a: "Don't rush, wait until they both lose."
 QIE_wushan_events.17.b: "Two rebels are fighting in the Qianqing Palace, escort them!"
 QIE_wushan_events.17.at: "§RThe opportunity only lasts for a moment. If we keep waiting like this, the New Religion of Salvation may miss the opportunity to seize power! §!"
 QIE_wushan_events.17.tt: "\n§YAixinjueluo Puyi§! Passed away?\nManpower: §R-1§!?"
 QIE_wushan_events.18.t: "upright"
 QIE_wushan_events.18.desc: "Shooting at each other in the Palace of Qianqing, the inheritance left by our ancestors, was scary enough. During the exchange of fire with the clan members, Wu Peifu leaned against a pillar with a pale face. His vision gradually became blurred due to excessive blood loss, and the gunshots in his ears seemed to be muffled. It was unclear where they came from and who fired them. Cao Kun staggered and tried to hide on the other side of the pillars in the palace, but was accurately hit in the head by a bullet the moment he turned around. That is a 7.62mm rifle cartridge specially used for M1891/30. \n\nIt wasn't until the direct guards and the emperor's personal guards exchanged shots that the sound that truly determined the outcome finally sounded. Before several of the emperor's soldiers had time to reload, they were overwhelmed by another wave of firepower pouring in from the corridor and fell on the golden brick field. Before the direct guards had time to tell whether the incoming troops were reinforcements or enemies, they were forced to abandon their weapons in the chaos. The short bursts of submachine gun fire passed through the three-cornered windows and vibrated back and forth in the ancient palace. Sawdust, broken porcelain and blood mist fell together. Those who just wanted to kill Cao Wu with the emperor's orders now fell in confusion under the blood-stained \"upright and bright\" plaque. \n\nAs the back three halls fell silent again, Mechinsky took out the Khedive cigarette he got from his friend and took a satisfied puff. As he blew out the smoke ring happily, the second wave of fighting between the \"temporary security personnel\" and the Manchu rebels in the Forbidden City also began."
 QIE_wushan_events.18.tt: "§OWe will purge most of the cabinet that is still stubbornly loyal to Cao Kun, as well as those Communist Party members who still radically insist on the cause of restoration. §!"
 QIE_wushan_events.18.a: "Send Wu Peifu to the hospital quickly."
 QIE_wushan_events.18.b: "Rest in peace, King Baoding."
 QIE_wushan_events.19.t: "Stamped letter"
 QIE_wushan_events.19.desc: "It was another beautiful morning, and Tang Erhe stood in front of his house as usual and continued to do his \"morning exercises.\" This is a health science habit that he learned when he visited the German Empire more than ten years ago, and he has stuck to it ever since. Speaking of more than ten years ago, Wang Jingwei's young and fierce face suddenly appeared in front of him again. The debate in the newspaper had long passed, but whenever he thought of the other party's words in defense of Sun Yat-sen's death by traditional Chinese medicine, Tang Erhe still couldn't help but stop and sneer. However, a voice quickly interrupted his thoughts of recollection. \n\n\"Mr. Tang, I have your letter!\" It turned out to be the postman. \n\nAfter a brief greeting and sending the postman away, Tang Erhe lowered his head and carefully examined the envelope in his hand. At this point, it was enough to conclude that the letter writer was really careless: firstly, the envelope did not indicate who the sender was, and secondly, when affixing the stamp, the sailboat stamp was absurdly turned upside down and affixed to the upper left corner, as if the ship had sunk in the white ocean inexplicably. But for Tang Erhe, this seems to have a special meaning. His face suddenly became serious, and he turned back to the apartment. After making sure that the doors and windows were closed and there was no one else in the house, he opened the letter."
 QIE_wushan_events.19.a: "\"The Six Pines Old Man's Guide\""
 QIE_wushan_events.19.b: "\"You are invited to enjoy \"Catch and Release\" at Huixiantang Restaurant in Qianhai, Beijing.\""
 QIE_wushan_events.19.c: "\"Honorable Master Hui Ji\""
 QIE_wushan_events.20.t: "To Yushuai"
 QIE_wushan_events.20.desc: "Zhixuan layman Zunjian:\n\nNow I am practicing ruler element to ask about the determination of a single step. If you read this letter, you will surely be able to understand the truth clearly and choose the good and follow it. \n\nThe current government has broken its oath. An alcoholic maniac who flatters barbarians day by day in order to gain personal gain. There are even those who admire him. Although he is not a saint, he calls him a gentleman. He cares about old friendships, condones this arrogant and unscrupulous person, and repeatedly tolerates him. Don't you hear that there is famine in all directions, wars are raging, and the people are moaning and weeping blood? However, the authorities are afraid to avoid the heavy responsibilities of the world, do neither good nor evil, fallaciously entrust Lao Tzu's way of inaction, sit back and watch the crisis, and even cause disaster. \n\nThere are many talented people in the world, and they all look at Jiuding. Failing to provide relief when the people are in disaster is unkind; allowing foreign invaders to seize state property is unjust; establishing a parliament and silencing all parties is unbelief. These three crimes can be tolerated in times of peace, but in today's troubled times, they are enough to cause people from all over the world to question you. \n\nI only hope that I can work hard and shoulder the heavy responsibilities, and do not hesitate to patrol when the laws and regulations are broken and the laws and regulations are ruined. If you hesitate any longer, the world will fall and your position will not be protected. The letter was written in a hurry, and the words were incomplete. \n\nYours sincerely, Hui Ji, Yu Siwuxuan, June of the Year Bingzi"
 QIE_wushan_events.20.a: "\"If it's Jiang Chaozong's letter, you don't need to open it and read it to me. You can just put it together with the pile of letters.\""
 QIE_wushan_events.21.t: "Forbidden City security tightened"
 QIE_wushan_events.21.desc: "In view of the deteriorating situation in the country, there have been frequent security breaches recently in which Xiaoxiao took advantage of the midnight to avoid patrol guards and sneaked into the palace to steal. Tong Jixu, the chief of Puyi's bodyguards, has issued orders to further strengthen the security of the Forbidden City. Temporarily recruited security personnel were stationed inside and outside the palace gate one after another. Although many of them are just street gangsters who work day in and day out, they always make people feel that their hands and feet are unclean and will scrape away the walls of Qianqing Palace. Fortunately, however, it seems that there are still some professionals who have received professional training and have a steady pace. When they patrol the night, they do not look around like those temporarily hired idlers. The current situation is such that we really can't ask for more. At least in name, these people are here to protect the Forbidden City."
 QIE_wushan_events.21.a: "I just hope that the chaos will be settled as soon as possible."
 QIE_wushan_events.22.t: "New Religion of Salvation declares revenge"
 QIE_wushan_events.22.desc: "[FROM.Capital.GetCapitalVictoryPointName] sent news that since the assassination of Tang Erhe, the chairman of the New Beiyang Republican Government, China's social order has once again fallen into a state of collapse. People spontaneously took to the streets to cry for the passing of the \"good president\". Many people in Beijing surrounded Lu Zuge in Mingguang Hutong, where the New Religion of Salvation is located. They knelt outside this religious temple to redress Tang Erhe's grievances. \n\nThe New Religion of Salvation has declared a state of national emergency and is investigating the murderer of the assassination and the mastermind behind it. [ROOT.GetLeader] has re-assumed as the head of state. After a solemn ceremony, he worshiped the gods they worshiped in the temple and announced that all enemies, both internal and external, who intend to threaten China will pay the price. This rapidly growing craze for revenge has made many Chinese intellectuals and foreigners feel uneasy and frightened, and they have already left China one after another. The next steps [ROOT.GetName] will take remain unclear."
 QIE_wushan_events.22.a: "Let them pay their blood debt!"
 QIE_wushan_events.22.b: "Mad cultists are back in power."
 QIE_wushan_events.23.t: "Chinese cultists regain Beiyang!"
 QIE_wushan_events.23.desc: "For historians, everything that happened today deserves careful study. China has undergone confusing changes. The leader of the New Religion of Salvation [ROOT.GetLeader] gave a speech at [FROM.Capital.GetCapitalVictoryPointName], announcing that he had defeated all opponents who \"sullied the traditional Chinese culture\" on the battlefield and reunified the divided China. And even more shocking news follows: [ROOT.GetLeader] believes that the \"doomsday\" crisis is over, and that the New Religion of Salvation has completed its mission to save the disaster. In the coming period, they would transfer power to a new republic presided over by intellectuals and old politicians, which itself would return to matters of religious charity. This new China will be called \"New Beiyang\". \n\nThe New Religion of Salvation is different from ordinary folk cults. Most of its members are soldiers or senior intellectuals who have already shown their talents during the Yuan Shikai period. But their voluntary relinquishment of power did surprise international observers, and sociologists are paying close attention to the next steps of the New Religion of Salvation."
 QIE_wushan_events.23.a: "Chixian Shenzhou is back in our hands."
 QIE_wushan_events.23.b: "The cultists just gave up their power?"
 QIE_wushan_events.7.t: "Debt paid off"
 QIE_wushan_events.7.desc: "Finally, we paid off all our debt! Now there are no longer any shackles of debt on [QIE.GetName], and we are finally liberated from the daily fear and can now concentrate on domestic economic construction and industrial development."
 QIE_wushan_events.7.a: "debt free"
 QIE_wushan_events.8.t: "People from the community donate generously"
 QIE_wushan_events.8.desc: "After hearing that the Beiyang Government was solving the refugee problem in eight provinces, Chinese businessmen in the embassy city of Tianjin launched a fund-raising campaign in the embassy city. Now that the donations and donated materials have been handed over to us, they hope that we will make good use of the resources and wish us to solve the relevant problems as soon as possible and save the people from suffering."
 QIE_wushan_events.8.a: "Solve an urgent need!"
 QIE_wushan_events.8.tt: "§CWe have received additional §!£GFX_production_cost [?70|H0]§C disaster relief resources to solve the problems we are facing! §!"
 QIE_wushan_events.9.t: "Germans demand better terms"
 QIE_wushan_events.9.desc: "The German company we cooperated with in construction sent us a notice saying that the cooperation with us is very comfortable. They proposed that if possible, we could sign another contract and they would help us build several more factories at preferential prices. It is true that our country is in urgent need of development, but if we are led by foreign companies like this, it may have an impact on our government's image."
 QIE_wushan_events.9.a: "We welcome industry more than ideology."
 QIE_wushan_events.9.b: "We must defend our lives."
 QIE_wushan_events.10.t: "Finance department reorganization completed"
 QIE_wushan_events.10.desc: "The Department of Finance led by Wang Kemin informed us this morning that their reorganization of the Department of Finance has been completed. Now the new Department of Finance will adopt a completely different financial strategy and foreign policy than before to minimize the problems caused by a default on our debt."
 QIE_wushan_events.10.a: "Suitable for China’s own financial methods!"
 china_events.70.d.wushan: "Our country has thousands of years of history. For two thousand years, China has been the center of Asia, and countless small countries have admired the light of its civilization. However, this empire that once wanted to be passed down for eternity fell into violent turmoil in the last century. Although the Qing Dynasty expanded China's territory to new heights, the aggression of European imperialism brought the empire to an unprecedented low. To make matters worse, the stubborn Japanese dealt a heavy blow to the Qing Dynasty during the Sino-Japanese War. When the artifact fell, the Chinese people lost confidence in the imperial system. \n\nOctober 10, 1911, this day forever changed the destiny of our country. The revolutionaries in the New Army stationed in Wuchang launched a rebellion against the Manchu rule, and the Revolution of 1911 broke out. Revolutionary waves swept the south, while the north remained loyal to the Qing Dynasty under the control of the imperial envoy Yuan Shikai. However, Yuan Shikai, who understood the current situation, agreed to depose the young emperor Puyi in exchange for the position of president. At first, Yuan Shikai was forced to compromise with the revolutionaries, but he skillfully marginalized them and continued to expand the power of the Beiyang faction. However, his restoration ambitions ultimately backfired, ushering in a new era of warlordism. \n\nAfter the failure of the Northern Expedition, the era of division came to an end. The three generals Wu Peifu, Cao Kun, and Sun Chuanfang brought peace to the land of China, welcomed the emperor back with mercy, and opened a new era of peace. However, in 1936, the direct order collapsed and local war broke out again. History has proven that today's regime is so short-lived entirely because the rulers gave up on the moral civilization that has been passed down for thousands of years and started talking about politics and law and other heresy. \n\nAs the New Religion of Salvation took control of the vast land of the North China Plain, the reborn country began to govern this country that was poisoned by science, democracy and those foreign ideas. October 10th reminded us of the sad consequences of not being down-to-earth and blindly following foreign devils. Only traditional Chinese virtues can guide us to heal this broken country and revive China!"
 china_events.70.option.d: "Luckily, we eventually grew out of it."
 qing_coup_events.21.c: "Along with the commotion, bullets rained in from outside the hall..."
 QIE_wushan_reborn_chinese_arsenal: "The rebirth of the Chinese arsenal"
 QIE_wushan_reborn_chinese_arsenal_desc: "With the successful implementation of the Kunpeng Plan after we successfully unified China. The first step we need to take is to integrate the old local arsenal into the Luoyang 714 Ordnance Department. An unprecedented new modern military-industrial system belonging to China is about to take shape in our hands."
 QIE_wushan_our_independent_tank_factory: "Establishment of a special group for mechanical research"
 QIE_wushan_conduct_armor_steel_experiments: "Conduct armor steel experiments"
 QIE_wushan_high_speed_racing_engine: "Special engine projects"
 QIE_wushan_715_armor_design_arsenal: "Second grant to support related research"
 QIE_wushan_the_eagle_soars_in_the_sky: "Expansion of Luoyang Xigong Aviation Research Institute"
 QIE_wushan_squander_money_focus_on_fire: "Fire priority"
 QIE_wushan_stability_first_and_most_important: "Reliability first"
 QIE_integrate_existing_MIO_resources_desc: "Although our country has arsenals capable of producing rifles and artillery in various parts of the country, we have never mastered the ability to produce tanks. [ROOT.GetLeader] has ordered a military development plan called \"Kunpeng Plan\". The first goal of this plan is to expand the Luoyang 714 Research Institute we established before the war. This department will carry out research related to mechanized military industry and accumulate experience for future national defense construction. Given time, we will surely catch up with the world trend and become a military force that cannot be underestimated."
 QIE_MIO_unlock_tt: "Available as §YMilitary Industrial Organization§!§GAvailable§!:\n$QIE_luoyang_714_arsenal$ (§Y$QIE_luoyang_714_arsenal_subtitle$§!)\n$QIE_wushan_luoyang_airport_organisation$ (§Y$QIE_wushan_l uoyang_airport_organisation_subtitle$§!)\n$QIE_wushan_jiangnan_shipyard_organisation$ (§Y$QIE_wushan_jiangnan_shipyard_organisation_subtitle$§!)"
 QIE_wushan_aviation_714_bonus_tt: "§CDue to the technology accumulated in the 714th round, we have achieved additional enhancements! §!"
 extra_paratrooper_supply_grace_tt: " Paratroopers carrying supplies: §G+240.0§! hours"
 paradrop_organization_factor_tt: "$MODIFIER_PARADROP_ORGANIZATION_FACTOR$:$RIGHT|+=%1$"
 QIE_wushan_more_is_better_faster_is_great: "More is better, faster is better"
 QIE_wushan_efficient_utilization_of_resources: "Make efficient use of scarce resources"
 QIE_wushan_further_optimize_design_direction: "Further optimize design direction"
 QIE_wushan_china_airforce_coming_desc: "[ROOT.GetName]'s aviation force was established by Commander Wu Peifu during military training in Luoyang, but the military has not been able to make good use of this aviation force for a long time. With the unification of China, we can finally plan carefully and build an air force that will not lag behind the world."
 QIE_wushan_air_force_academy_desc: "We have to admit that China has a large population but few talents. Before we unified China, we were once at a disadvantage due to a lack of general personnel. Now we have decided to open the [ROOT.GetName] Aviation Academy to train suitable pilots, and the first batch of students will be selected from the army."
 QIE_wushan_expand_more_air_ports: "Expand more airports"
 QIE_wushan_expand_more_air_ports_desc: "Building sufficient airstrips will go a long way in ensuring that we can maintain a large air force in modern warfare, given the vast terrain of our country. The Military Aircraft Department has decided to build or expand airports in Wuhan, Heilongjiang, Shanghai and Beijing to ensure that we can provide air support in any potential war."
 QIE_wushan_establish_aviation_industry: "The aviation industry started"
 QIE_wushan_establish_aviation_industry_desc: "The world wars have made us fully understand the importance of coordinated attacks by aircraft and land forces: whether it is to detect the enemy's movements, attack ground targets, or engage in fierce battles with enemy air power in the air. With special investment from state-owned factories, the first aircraft produced by the Chinese after reunification is about to take to the skies."
 QIE_wushan_focus_on_air_bomb: "Priority is given to battlefield support"
 QIE_wushan_focus_on_air_fight: "air superiority priority"
 QIE_wushan_focus_on_air_fight_desc: "Due to our weak experience in the aviation industry, we can only focus on development in a single aspect for the time being. Some officers in the Air Force believed that we could use our air force to undermine the enemy's war potential. Establish air superiority by using fighter groups to overwhelm the enemy's air force, thereby denying enemy supplies and reinforcements."
 QIE_wushan_focus_on_air_bomb_desc: "Due to our weak experience in the aviation industry, we can only focus on development in a single aspect for the time being. Some officers in the Military Aircraft Division believe that our air force can directly support ground force operations. The bombers would help the Army clear enemy machine gun emplacements, artillery emplacements and pillboxes, thus mitigating casualties."
 QIE_wushan_daytime_airtime: "Out in daylight"
 QIE_wushan_night_knight: "night raid"
 QIE_wushan_daytime_airtime_desc: "By conducting organized and sustained attacks during the day, we are able to perform missions relatively stably and in an orderly manner with good visibility. At the same time, adopting this method of air combat also helps our troops improve coordination and consistency, which will make our sorties more efficient."
 QIE_wushan_night_knight_desc: "Night operations are fraught with uncertainty and vision risks, but with enhanced training our pilots can minimize losses under the cover of darkness. The ghosts of these small groups of operations will penetrate into enemy territory in the dark, while our enemies are still sleeping, even if they die, they will not realize our visit."
 QIE_wushan_air_defence_force: "Upgraded air defense capabilities"
 QIE_wushan_air_defence_force_desc: "Although after a series of training, we already have a team of outstanding pilots, they cannot be everywhere after all. The Military Aircraft Department has authorized the 714th Ordnance Industry Department to conduct research and operations on air defense forces. We will build and maintain air defense facilities in urban centers and key areas to deal with any invading enemies with ulterior motives."
 QIE_wushan_paratrooper: "Paratroopers"
 QIE_wushan_paratrooper_desc: "During the war against [JAP.GetName], we briefly planned to train an elite paratrooper force to attack its homeland. Now is the time to expand this elite force. We will recruit more elites whose goal is to wreak havoc behind enemy lines and seize strategic locations."
 QIE_wushan_chinese_wisdom_and_design: "Chinese wisdom, Chinese design"
 QIE_wushan_chinese_wisdom_and_design_desc: "The No. 101 Special Experiment Department of the Luoyang 714 Ordnance Industry Administration has planned to launch a special experiment targeting the aerospace industry and is seeking our capital injection. If the plan goes well, we may be able to reduce production costs by improving the aircraft design structure. In addition, the No. 101 Special Experiment Department also requested to conduct a test flight of a cutting-edge aircraft in Mongolia, and relevant documents have been submitted to the Military Aircraft Department."
 QIE_wushan_we_will_rule_sky_and_land: "Chongming bird, soaring in the sky"
 QIE_wushan_we_will_rule_sky_and_land_desc: "[ROOT.GetName]'s air force is always ready to defend our benevolent kingship in Asia. After a series of modernization measures, we have fully armed our air force, thus having the power to protect the entire Asia and even the world. We have authorized the 714th Ordnance Industry Department to carry out a cutting-edge research - jet propulsion. The experience we accumulated during the development of the Air Force has also bore fruit - the Jinguyuan Aviation Manufacturing Bureau in Luoyang will receive some of the research materials from the 714 and specialize in research in the field of aircraft."
 QIE_wushan_the_ghost_of_dual_ocean_navy: "The legacy of the two oceans navy"
 QIE_wushan_sturmtruppen_desc: "To put it bluntly, we are surrounded by enemies. If our enemies attack us together, we will be at a disadvantage. Considering our existing military strength, the best option is to launch a quick war against one of the forces to eliminate the other side, thereby mitigating the danger on other fronts."
 QIE_wushan_penetrate_and_infiltrate_the_enemy_desc: "Is there anything more dynamic and changeable than water? Put it in a container and it will take on the shape of the container, but once there are tiny gaps in the container it can penetrate. Our troops will also seize the enemy's slight mistakes, quickly penetrate into the enemy's defense lines, and completely defeat them."
 QIE_wushan_focus_on_northern_navy_strategy: "Continuing the Beiyang Navy’s tactics"
 QIE_wushan_focus_on_southern_navy_strategy: "Continuing the Nanyang Navy’s tactics"
 QIE_wushan_wu_enforcing_ethics_through_military_orders_desc: "Although the government has widely promoted the Tao of Confucius and Mencius and the traditional Confucian morality in society, most people believe that it is necessary to promote these virtues. But society is still full of lies, deception and immorality. The change of social atmosphere does not happen in a day, but in order to quickly educate the people, we should set up a moral police to supervise and remind people to comply with relevant regulations."
 QIE_the_government_which_wave_foreigners_desc: "The new government should be an open government. Based on the principle of \"equal opportunity\" proposed by the Americans ten years ago, we once again invite all countries in the world to jointly develop our markets with China and gain benefits together. Of course, this benefit will only last until the day peace ends..."
 QIE_wushan_jiang_establish_the_editing_and_translation_department_desc: "In 1903, in order to integrate with the international community and meet the need to cultivate new types of talents, the then Qing government established the Translation Institute of the Imperial University to translate overseas works. However, in 1911 it closed. We should re-establish the Translation Institute to translate outstanding foreign military and scientific works. In addition, the Translation Institute can also help us publish more content that needs to be \"translated\"."
 QIE_wushan_punishment_those_enemies_desc: "We have avenged the hatred of the Wuchen Year, when the foreign devils established the puppet regime \"Embassy City\" in the coastal areas of our country based on the principle of \"open door and equal opportunity\". The cowardly former government actually agreed to this absurd request and made decisions for the 40 million Chinese people. Since then, these foreigners have stepped on the backs of the Chinese people and tyrannized. Now the embassy city has disappeared, but the countries that participated in this operation still exist. As an avenger, we will send our second greetings to these initiators..."
 QIE_industry_focus_rely_on_foreigner_country_desc: "When it comes to doing business, our country strongly supports the American saying, \"Open door, equal opportunity.\" What our country has are resources, but what we lack is the technology to match them. By cooperating with overseas capital, we will be able to use foreign engineers to improve our construction standards."
 QIE_wushan_jiang_fanatics_militia_for_master_desc: "Chinese farmers have long lived in fear of being invaded by vagrants and bandits. In the most backward and poor rural areas a superstition developed in the use of charms and potions to protect the body from harm. We can use these poor people to establish militias in the countryside with the help of \"magic power\" and a few old-fashioned rifles on the grounds of protecting the gods in local temples. They may not be able to help us fight against the regular army, but if our land unfortunately falls one day, these people will be able to drag the enemy into the quagmire of security war."
 QIE_wushan_two_leader_the_order_of_non_speaker_desc: "Our previous efforts to persuade the landlord class and industrialists to donate money in order to deal with the social crisis obviously destroyed their trust in us. Through tax cuts, subsidies and various other actions that are beneficial to business, we may be able to reconcile with these people who are closely related to social development and continue to receive their support."
 QIE_wushan_reassess_the_financial_situation_desc: "Generally speaking, our country is still basically an agricultural country. In 1913, our country hosted the National Federation of Farmers' Associations meeting. However, with the abdication of Yuan Shikai and the subsequent political turmoil, most farmers' association organizations were unsustainable due to lack of funds and the loss of agricultural talents. We must lend a helping hand to them to preserve these experts in agricultural science, who alone can help our country avoid any possible food crisis."
 QIE_industry_focus_independent_planned_economy_desc: "We have decided to restructure the fiscal system to deal with the debt default problems we are facing. A fiscal austerity policy has been put on the agenda. Special debt will be issued in the near future. We will try to activate domestic economic momentum by handing out loans to dynamic private enterprises through domestic savings."
 QIE_adopt_start_coal_mining_search_desc: "Coal is a very important fuel resource. We have seized the eastern Shanxi region from Yan Xishan before, but we have shelved development. On the one hand, there is concern about damaging the fragile friendship between Shanxi and our government, and on the other hand, our technology is insufficient to develop deeper coal mines. But now it's time to dig these black diamonds out of the ground. We can mine it ourselves, or we can use the Kailuan Mining Bureau and foreign investment partners to mine it - provided that foreign companies are willing to cooperate with us."
 QIE_wushan_decisive_battle_doctrine: "Looking for a decisive opportunity"
 QIE_wushan_fleet_in_being: "Existence is a deterrent"
 QIE_wushan_hit_and_run: "Surface harassment tactics"
 QIE_wushan_submarines_focus: "Mainly focus on submarines"
 QIE_wushan_focus_on_southern_navy_strategy_desc: "The Nanyang Navy, established in 1875, was an important force in defending Jiangsu and Zhejiang during the Qing government. Unlike the Beiyang Navy, which pursues decisive battles, the Nanyang Navy maintains a limited fleet due to various reasons, and uses mobility and strategy rather than firepower to attack the enemy."
 QIE_wushan_hit_and_run_desc: "We will guide the development of our navy based on the tactical thinking of surface harassment and one-shot disengagement. In this way, we do not need to maintain a large fleet. All we have to do is to lock in the enemy first, attack, and then leave the combat area."
 QIE_wushan_submarines_focus_desc: "In order to achieve our elusive tactical purposes, the submarine is a very suitable ship. On the one hand, it is cheap to build, but on the other hand, it is deadly enough. It can be said to be the most suitable development option for us with an extremely limited budget now."
 QIE_wushan_torpedo_are_best_choice: "favor torpedo"
 QIE_wushan_torpedo_are_best_choice_desc: "Nothing is more important to our Navy than torpedoes. It may take a year for an ironclad to be delivered to the fleet from the shipyard, but our navy only needs a few hundred torpedoes produced last month to make the ironclad sleep on the bottom of the sea."
 QIE_wushan_destroyer_and_cruiser: "Destroyers and Cruisers"
 QIE_wushan_destroyer_and_cruiser_desc: "We will steadily build a fleet that can compete head-on with any naval power in the world. To this end, we will first develop destroyers, which will help us clear out any enemies lurking in the deep sea; followed by cruisers, they will form an iron wall above the sea to protect our capital ships."
 QIE_wushan_our_dream_our_ocean: "Our dreams, our sea"
 QIE_wushan_our_dream_our_ocean_desc: "Our dream of a future in which the new China leads the world in soft power and technological strength has now become a reality. We spent time and a lot of money trying to catch up with the great navies of great powers and adversaries. Today, our great fleet is sailing on the sea, and we will chart the course for the future ourselves. In order to better serve our navy, the 714th Ordnance Industry Administration will cooperate with Dalian Shipbuilding Company to focus on the development of ship manufacturing."
 QIE_wushan_strengthen_coastal_defense: "Strengthen coastal defense"
 QIE_wushan_strengthen_coastal_defense_desc: "We will repair a large number of coastal fortresses and forts at key nodes around the fleet. As long as we ensure that our fleet is under the protection of coastal defense artillery, the enemy navy will not dare to directly attack the port."
 QIE_wushan_combine_sky_with_ocean: "from blue to blue"
 QIE_wushan_the_air_ship: "pouring explosion"
 QIE_wushan_the_air_ship_desc: "Our recent achievements in the Navy and Air Force allow us to learn from each other's strengths. A special meeting has been held in the 714 Ordnance Department. At the meeting, we determined that we will entrust 714 to develop a powerful naval bomber that can destroy the enemy's fleet with extremely high efficiency."
 QIE_wushan_the_second_choice_destroyer: "focus on destroyers"
 QIE_wushan_the_second_choice_destroyer_desc: "Developing destroyers to secure our seas and give us the ability to harass our enemies will make it more attractive for our shipbuilding industry to specialize in destroyers."
 QIE_wushan_the_second_choice_submarines: "Focus on submarines"
 QIE_wushan_the_second_choice_submarines_desc: "These cheap yet deadly submarines are our best bet for protecting us, from attacking belligerent merchant ships and freighters, to even transporting supplies to our armies, which will make our shipbuilding industry even more interested in specializing in submarines."
 QIE_the_second_choice_movement_base: "mobile fortress"
 QIE_the_second_choice_movement_base_desc: "In today's world naval situation, if you really want to build a powerful navy, the only option is aircraft carriers. Those naval aviation units that can truly influence the outcome of naval battles will take off from aircraft carriers, bringing smoke and death to their enemies, which will make our shipbuilding industry more interested in specializing in aircraft carriers."
 QIE_wushan_the_second_choice_battleship: "Focus on battleships"
 QIE_wushan_the_second_choice_battleship_desc: "Although aircraft carriers have proven their power in modern warfare, we still cannot ignore the existence of battleships as the dominant maritime force. As the sturdiest and most ferocious ships on the oceans, it is absolutely impossible to go wrong investing in them, which will make our shipbuilding industry more interested in specializing in the manufacture of battleships."
 QIE_wushan_the_second_choice_cruiser: "focus on cruisers"
 QIE_wushan_the_second_choice_cruiser_desc: "No matter what the situation, investing in a light and mid-sized cruiser is never a wrong choice. Without these screen ships, we will not be able to maintain our dominance in naval warfare, which will make our shipbuilding industry more focused on specializing in submarines."
 QIE_wushan_we_need_reserves: "Train qualified seafarers"
 QIE_wushan_we_need_reserves_desc: "For our country today, there are so few qualified naval personnel that we have to recruit and train them from scratch. Otherwise, even if we have a powerful enough fleet, we will not have the talent to operate it."
