 QIE_wushan_long_tt: "New Religion of Salvation"
 QIE_wushan_long: "New Religion of Salvation\n§LNew Religion of Salvation originated from the mystical seances in Henan in 1919, formerly known as Wushan Society. It was originally an organization formed by frustrated literati who drank and discussed politics. They worshiped the legendary Chinese god Lu Dongbin and believed that the world was corrupt and the end was coming. The Séance soon fell into financial crisis, forcing it to send members to Beijing to seek financial assistance. Wang Jinxi, a member of the Wushan Society, developed a relationship with Jiang Chaozong, the nine-door admiral who was ostracized by the government due to the Zhang Xun restoration incident. He presented Jiang Chaozong with the \"photo of Lu Dongbin's apparition\" taken with a camera, which won Jiang Chaozong's favor and trust and attracted him to join the Wushan Society. \n\nAfter Jiang Chaozong joined, he invited a large number of members of the Beiyang government who were out of office or still in office to join the society, and actively raised funds from various channels to carry out public welfare undertakings, thus packaging Wushan Society as a charity organization rather than a simple mystical group. In 1925, Qian Nengxun, Jiang Chaozong, Duan Qirui, Wu Peifu and others announced that they had obtained the revelation text of the \"Taiyi Holy Ancestor\". This text was conveyed to them by the prophets of Confucianism, Buddhism, Taoism, Christianity and Islam at a seance. The purpose was to avoid the coming doomsday and save the declining world. Subsequently, Wushan Society submitted a document to the Beiyang government, requesting to be reorganized into a religious organization. The request was approved by Gong Xinzhan, then Beiyang's chief of internal affairs and a member of Wushan Society. At this point, the original Wushan Society was completely transformed by Beiyang politicians into another club and religious group for its activities. \n\nIn 1926, the New Religion of Salvation called Nanhai Guanyin, and Aristotle and George Washington predicted and influenced the National Revolutionary Army in the Northern Expedition. With the intervention of the Germans, the disintegration of the Northern Expedition groups, and the restoration of Emperor Xuantong in 1927, the New Religion of Salvation became a charitable and emerging religious group that attracted much attention from the government. But this shadow government without a crown also had to face new problems. As the current leader Wu Peifu regained the power of the Beiyang Government in name, he alienated many affairs of the New Religion of Salvation. This forced Jiang Chaozong to take on administrative responsibilities that should not have been borne by him, and unexpectedly accumulated a network of contacts that should not be underestimated. §!\n"
