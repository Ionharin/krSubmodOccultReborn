 QIE_wushan_zhili_arsenal_state_modifier: "Zhili Military Complex"
 QIE_wushan_zhili_arsenal_state_modifier_desc: "The New Religion of Salvation further strengthened the military power of the Zhili region, especially Baoding. By making it the heart of our country's military industry, we can maximize its military industrial strength and arm our military to the teeth."
 QIE_wushan_chixian_shenzhou_modifier: "Chixian Shenzhou"
 QIE_wushan_chixian_shenzhou_modifier_desc: "In ancient times, Dayu divided the world into nine states and cast nine tripods to prove his authority to rule the world. However, with thousands of years of war, Jiuding has no end. But any strongman who unified China hopes to prove that he is the legitimate emperor by recasting the Jiuding. We followed suit and erected a cauldron here to symbolize our unquestionable authority."
 QIE_wushan_kunpeng_plan_modifier: "Kunpeng Project"
 QIE_wushan_kunpeng_plan_modifier_desc: "Li Sihao from the Ministry of Finance provided us with a very tempting proposal - the \"Kunpeng Plan\" - a special sum of money, like a piggy bank, for construction after we unify China. But this money does not come from our own pockets, but from the hands of the warlords we defeated."
 QIE_wushan_lvzu_chunyang_throne_modifier: "The position of Lu Zu Chunyang"
 QIE_wushan_lvzu_chunyang_throne_modifier_desc: "The most holy ancestor Taiyi is the only true god who created the world and created the universe. He is the supreme and noble god and the root of all spirits. And Zhenren Lu Dongbin and Chunyang are his only messengers. It was under the enlightenment of Zhenren Chunyang that the five religions began to be separated in the world, and they taught all nations and tribes with their respective scriptures and principles. Now we have set up a throne for the real person in the church, and his name is above the church hierarchy and the head court. As the teachings of the Five Teachings continue to be implemented in society, the sect's control over the people's spirit and order will become increasingly stable. Although in the eyes of overseas observers this is an infringement of social freedoms, to our people, this is clear evidence of Lu Zu's growing protection for the people."
 QIE_wushan_luoyang_arsenal_modifier: "Luoyang 714 Research Institute"
 QIE_wushan_luoyang_arsenal_modifier_desc: "The Luoyang 714 Research Institute we established is a relatively small military research institute. It can provide limited help for our military research, and it may not cover all fields, but it is better than nothing."
 QIE_wushan_aviation_affairs_commission_modifer: "Governor Air Force Commander's Stand"
 QIE_wushan_aviation_affairs_commission_modifer_desc: "In the past, Yuan Shikai established the first well-trained aviation force in Chinese history at Nanyuan Airport. At that time, the Chinese Air Force was very weak, and its existence value was just existence. But now we will inherit Yuan Shaobao's legacy and build a truly powerful Air Force. They will soar in the sky and hunt down any invading enemies."
 QIE_wushan_coal_mining_principle_modifier: "ensure energy"
 QIE_wushan_coal_mining_principle_modifier_desc: "Coal mines are a very important industrial energy source, and any industrial activity cannot do without these \"black diamonds\"."
