 QIE_wushan_prepare_for_the_second_round_robin: "forging new paths"
 QIE_wushan_preparing_for_the_next_war: "Preparing for the next war"
 QIE_wushan_preparing_for_the_next_war_desc: "War has only left us temporarily; it still lurks around us, waiting to drag us into its domain again. Looking around, it seems that all around us are our enemies. We must be careful to deal with this evil world that has fallen into darkness. For this reason, it is extremely necessary to be vigilant and ready to fight against those gangsters and demons."
 QIE_wushan_wu_as_vice_master: "Deputy Order of Zhixuan"
 QIE_wushan_wu_as_vice_master_desc: "After a power struggle within the New Religion of Salvation, both Wu Peifu and Jiang Chaozong failed to win. The fight between the two of them also led to the damage to their status and reputation not only in society, but also in the order. Wu Peifu had to succumb to the five-member committee of the New Religion of Salvation Office and admit that the deceased Qian Nengxun was the canon, while he served as the deputy canon to handle related affairs."
 QIE_wushan_jiang_as_vice_master: "Huiji Vice-Chancellor"
 QIE_wushan_jiang_as_vice_master_desc: "After a power struggle within the New Religion of Salvation, both Wu Peifu and Jiang Chaozong failed to win. The fight between the two of them also led to the damage to their status and reputation not only in society, but also in the order. Jiang Chaozong had to succumb to the five-member committee of the New Religion of Salvation Luan Council and recognized the deceased Qian Nengxun as the religious canon, while he himself served as the deputy religious canon to handle related affairs."
 QIE_wushan_wu_as_vice_master_1: "Deputy Order of Zhixuan"
 QIE_wushan_wu_as_vice_master_1_desc: "After a power struggle within the New Religion of Salvation, both Wu Peifu and Jiang Chaozong failed to win. The fight between the two of them also led to the damage to their status and reputation not only in society, but also in the order. Wu Peifu had to succumb to the five-member committee of the New Religion of Salvation Office and admit that the deceased Qian Nengxun was the canon, while he served as the deputy canon to handle related affairs."
 QIE_wushan_jiang_as_vice_master_1: "Huiji Vice-Chancellor"
 QIE_wushan_jiang_as_vice_master_1_desc: "After a power struggle within the New Religion of Salvation, both Wu Peifu and Jiang Chaozong failed to win. The fight between the two of them also led to the damage to their status and reputation not only in society, but also in the order. Jiang Chaozong had to succumb to the five-member committee of the New Religion of Salvation Luan Council and recognized the deceased Qian Nengxun as the religious canon, while he himself served as the deputy religious canon to handle related affairs."
 QIE_wushan_five_turbid_evils_world: "Five turbid evil times"
 QIE_wushan_five_turbid_evils_world_desc: "The Buddha once taught in the Lotus Sutra that when the end of the world comes, all living beings will be indulged in five kinds of filthy evils: kalpa turbidity, view turbidity, trouble turbidity, living beings turbidity, and life turbidity. And when this evil world of five turbidities appears, Buddhas and immortals will come to the world to dispel the darkness for people. Nowadays, on the one hand, all parts of the world are plunged into eternal war, and on the other hand, Buddhas and immortals do rule the peaceful land of China. §RDoesn’t all this prove that now is the ultimate moment to fight evil? We will defeat all darkness, bring purity back to the world, and become the savior not only of China, but of all nations. §!"
 QIE_wushan_east_hua_west_xia: "Eastern China and Western Xia"
 QIE_wushan_east_hua_west_xia_desc: "The ultimate battle has begun. As the saying goes, those in the east are China and those in the west are summer. Hua, Rong, is the symbol of immortals; Xia, the people of China, is the symbol of the people. §R Immortals have been trying to save mortals since ancient times. This is both a prophecy and destiny itself. Our jihadi army will completely crush all evil in the world, liberate all Chinese people from the control of evil spirits and devils, and restore peace to the world. §!"
 QIE_wushan_celebration_for_the_end_of_war: "final battle"
 QIE_wushan_celebration_for_the_end_of_war_desc: "The hard winter is over and spring has arrived. People took to the streets to celebrate the hard-won happiness and peace that they had regained after decades of chaos—may war never come again, pain never come again, sadness never come again."
 QIE_wushan_the_fear_of_peace_broken: "Fear of broken peace"
 QIE_wushan_the_fear_of_peace_broken_desc: "The death of Tang Erhe has made people worry about whether the new government can ensure their stable lives - they can't even protect the chairman who is less than a few hundred meters away from them. How can they fulfill their promise to protect people's lives and property? Questions about the new Beiyang government began to emerge, and people trembled at the possibility of losing peace."
 QIE_wushan_mass_arrests: "massive manhunt"
 QIE_wushan_mass_arrests_desc: "The government is conducting large-scale manhunts for potential suspects and saboteurs, and is encouraging mutual surveillance and reporting. New Religion of Salvation will not only impose the harshest punishment on those who commit crimes, but will also show no mercy to any dissident voices and eliminate them all. This is not just an idea of ​​the New Religion of Salvation, but a policy that everyone calls out to the New Religion of Salvation, because only in this way can people ensure that their current lives will not be destroyed by the bad people among the masses."
 QIE_wushan_only_one_light_in_this_dark_world: "Five colored stones, mending the sky"
 QIE_wushan_only_one_light_in_this_dark_world_desc: "In ancient times, the four poles were abandoned and the nine states were divided;\nthe sky was not covered, and the earth was not contained;\nthe fire was blazing but never quenched, the water was vast and never ceased; ferocious beasts devoured the people, and birds of prey preyed on the old and the weak. \nSo Nuwa made §Lfive-colored§! stones to mend the sky, §Rcut off Ao's feet§! to establish the four poles, §Rkilled the black dragon§! to help Jizhou, §Raccumulated reed ash§! to stop the water. \n§OThe sky is replenished, and the four poles are upright; the water dries up, and Jizhou is at peace; the cunning insects die, and the people of Zhuan are prosperous. §!"
 QIE_ws_focus_it_will_increase_maddness.tt: "§GThis will increase the §Rfanaticism§! of the populace. \n§!"
 QIE_seize_the_great_game_has_complete.tt: "\n§RSince we have promoted §CDaozu§R's identity as the world's teacher, we regard the following areas as \"since ancient times\" lands§!§W:"
 QIE_seize_the_great_game_has_complete_claim.tt: "\n§CSince we have publicized the deeds of §RDaozu§C among the people, we believe that we have reason to interfere in the following areas§!§W:"
 QIE_into_samadhi_has_complete.tt: "\n§RBecause we have proclaimed §CBuddha§R's identity as the world's teacher, we consider the following areas as \"since ancient times\" lands§!§W:"
 QIE_into_samadhi_has_complete_claim.tt: "\n§CSince we have publicized the deeds of §RBuddha§C among the people, we believe that we have reason to interfere in the following areas§!§W:"
 QIE_spring_and_autumn_ritual_has_complete.tt: "\n§RSince we have promoted §CConfucian Patriarch§R's identity as the world's teacher, we regard the following areas as \"since ancient times\" lands§!§W:"
 QIE_spring_and_autumn_ritual_has_complete_claim.tt: "\n§CSince we have publicized the deeds of §RConfucian Patriarch§C among the people, we believe that we have reason to interfere in the following areas§!§W:"
 QIE_jesus_shed_his_blood_has_complete.tt: "\n§RBecause we have proclaimed §CJezu§R's identity as the World Teacher, we consider the following areas to be \"from the beginning of time\" lands§!§W:"
