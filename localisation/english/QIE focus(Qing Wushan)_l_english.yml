 QIE_god_circle_description_tt: "New Religion of Salvation uses the Jae language to appease people's hearts and stabilize society. Different patriarchs will bring §Cdifferent effects§! to the rule of New Religion of Salvation. Only when the teachings of certain ancestors are deeply rooted in people's hearts, people may cooperate with those crazy actions..."
 QIE_god_circle_tier_header: "Jitan education"
 QIE_god_circle_tier_hover_tt: "The current teaching level of the Five Teachings Altar: $QIE_god_circle_tier_var_text$\nEach time you switch to a religion, its influence level will return to zero, and will continue to increase naturally after cooling down for §Y49 days§!."
 QIE_god_circle_tier_var_text: "§G[?god_circle_tier]§!"
 QIE_god_circle_leader: "§Y$Leader$§! is currently the leader of the New Religion of Salvation"
 QIE_god_circle_no_focus_selected_tt: "§RConfucian Ancestor§YCurrently comes to the altar§!§!"
