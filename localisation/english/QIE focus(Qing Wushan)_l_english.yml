 QIE_wushan_black_diamond_category: "Control the black diamond"
 QIE_wushan_black_diamond_category_desc: "Coal is an extremely important strategic resource. If our factories want to produce people's livelihood products, guns and ammunition normally, we must ensure sufficient coal energy. my country has previously set up coal mining companies such as Kaiping Coal Mine and Luanzhou Coal Mine, and identified several potentially valuable coal veins. Some of them are located on the shallow surface and we can develop them independently, while some veins cannot be mined with our current technological level - we can only cooperate with overseas forces, or wait for the day when our technology is sufficient to guard these treasures that we cannot develop."
 QIE_wushan_survey_shanxi_vein: "Exploring mineral veins in Shanxi"
 QIE_wushan_survey_shanxi_vein_desc: "We will send exploration teams and geological experts to evaluate undeveloped coal fields in Shanxi to ensure that our factories can maintain normal production efficiency."
 QIE_wushan_survey_tangshan_vein: "Exploring Tangshan Mineral Veins"
 QIE_wushan_survey_tangshan_vein_desc: "We will send exploration teams and geological experts to evaluate the undeveloped coal fields in the Tangshan area to ensure that our factories can maintain normal production efficiency."
 QIE_wushan_survey_guisui_vein: "Exploring the Guisui Mine"
 QIE_wushan_survey_guisui_vein_desc: "We will send exploration teams and geological experts to evaluate the undeveloped coal fields in the Guisui area to ensure that our factories can maintain normal production efficiency."
 QIE_wushan_survey_guanzhong_coal: "Exploring Guanzhong Coal Mine"
 QIE_wushan_survey_guanzhong_coal_desc: "We will send exploration teams and geological experts to work with foreign capital to evaluate the undeveloped coal fields in the Guanzhong area to ensure that our factories can maintain normal production efficiency."
 QIE_wushan_foreign_investment_category: "Foreign investment and trade"
 QIE_wushan_foreign_investment_category_desc: "Now that we have decided to shoulder the debt left by previous governments, we might as well make the most of our existing investment laws to get the most benefit from global trade markets. The New Religion of Salvation has foreign members in all the powerful countries. Although the number is limited, it is enough to serve as a bridge for us to contact foreign capital. Through these relationships, we may be able to obtain assistance from overseas. \n\nOf course, the so-called investment promotion is not necessarily limited to civil undertakings. At a time when many countries turn a blind eye to internationally traded goods, we can also use this to replenish our modern weapons to apply them on future Chinese battlefields."
 QIE_wushan_buy_german_rifles: "buy german rifle"
 QIE_wushan_buy_german_rifles_desc: "Our members in the Prague area came back with good news. A German arms dealer has a batch of rifles that were originally intended to be supplied to the German army, but were eliminated due to older models. But such weapons are still very advanced for us. We can ship it into the country disguised as recycled metal."
 QIE_wushan_buy_LEC_rifles: "buy concession rifle"
 QIE_wushan_buy_LEC_rifles_desc: "The person we sent to the Embassy City for arms trade came back with good news. He met an arms dealer at a banquet in the Embassy City, and he had a batch of guns in urgent need of disposal. We may be able to purchase these weapons to prepare for future operations."
 QIE_wushan_buy_russian_rifles: "buy russian rifle"
 QIE_wushan_buy_russian_rifles_desc: "Our members in the Moscow region reported good news that a Russian arms dealer had a batch of rifles that were originally intended to be supplied to the Russian army, but they were eliminated due to older models. But such weapons are still very advanced for us. We can ship it into the country disguised as recycled metal."
 QIE_wushan_buy_japanese_rifles: "buy japanese rifle"
 QIE_wushan_buy_japanese_rifles_desc: "Although we have long had a tense relationship with the Japanese. But our members in the Nara area still came back with good news. The Japanese army is planning to phase out a batch of reliable and durable Arisaka rifles. The Japanese government and military just want to get rid of this waste so that it does not continue to occupy its warehouses. They don't ask where these weapons go..."
 QIE_wushan_let_us_ask_the_jiangnan_factory: "Seek support from Jiangnan Manufacturing Administration"
 QIE_wushan_let_us_ask_the_jiangnan_factory_desc: "The Jiangnan General Manufacturing Administration is now in the hands of the victors of the melee in East China, and we have to rely on their help if we are to carry out as extensive a rearmament as possible. Fortunately, it is still in the hands of warlord forces. They can ignore our behavior as long as we entice them with financial gain."
 QIE_wushan_japanese_zaibatsu_funds: "Introducing Japanese chaebol capital injections"
 QIE_wushan_japanese_zaibatsu_funds_desc: "Openly accepting investment from Japanese chaebols and trading companies will inevitably make people question the government's political policy and even lead to fierce attacks from nationalists. But these funds will help us quickly restore civilian industry and lay the foundation for subsequent military industrial construction. \n\nWhat Japanese capital pursues is nothing but economic profits. As long as they do not openly promote the so-called \"Greater East Asia Co-Prosperity\", we can control those dissatisfied voices and continue business cooperation. All the people can offer now are hungry bellies and hands with nowhere to put them; and the Japanese have the money and technology we urgently need in their hands."
 QIE_wushan_support_from_beyond_the_pass: "Funding from outside China?"
 QIE_wushan_support_from_beyond_the_pass_desc: "A \"corporate investment\" remitted from the Fukuma Iron Works in the Fengtian government-controlled area came to the account of the leather bag company we established in the embassy city. We will make good use of this remittance to revive our civil industries."
 QIE_wushan_seek_zhili_merchant_support: "Seek direct support from old merchants"
 QIE_wushan_seek_zhili_merchant_support_desc: "Thanks to [ROOT.GetLeader]'s early experience in holding positions in various social organizations, he has established quite deep connections with many salt merchants and chambers of commerce. Perhaps we can lobby the old Zhili salt business people and local chambers of commerce to win their support for our civil affairs construction plan."
 QIE_wushan_accept_daben_donation: "Accept Obenjiao charity remittances"
 QIE_wushan_accept_daben_donation_desc: "Japan's Omoto Church has provided a considerable amount of funding to our government in the name of \"international disaster relief\" to help Chinese people who have become refugees and wanderers in the recent series of turmoil. We may be able to divert this disaster relief money and convert it into funds needed for nation-building."
 QIE_wushan_refugee_crisis_category: "Turbulent China"
 QIE_wushan_refugee_crisis_category_desc: "§8The Beiyang Government§!’s indifference to the collapse of the eight-province alliance has had immeasurable consequences. Thousands of people cross the border and enter our sphere of influence every day seeking to escape the harm of the war. They came to us in search of peace and stability, but they themselves became the cause of the destruction of peace and stability. \n\nThese fleeing refugees formed a team moving north. Some died on the official road due to exhaustion and hunger, while others joined the bandits in collusion with local evil forces. If we cannot properly handle the influx of refugees, the aftermath of the joint destruction of the eight provinces will simultaneously blow the entire Beiyang Government to pieces. \n\n§GSichuan farmers§! have long been driven by profit and have grown opium in large quantities as a cash crop. This has resulted in Sichuan's food self-sufficiency level being appallingly low. The neglect of grain and rice production met its retribution, with a severe drought and the ensuing locust plague. This famine that swept across Sichuan completely paralyzed the administrative capacity of the Sichuan provincial government. \n\nThey are in urgent need of help now. If we lend a helping hand to them, even though they are warlords on one side of the separatist regime, they may not necessarily remember and repay our kindness. But we can try to shape our disaster relief image among the people, thereby trying to use public opinion to pressure their governments to achieve what we want to achieve - even peaceful reunification. \n\nBut the resources we have are limited. We must make a trade-off between solving our imminent crisis and supporting outsiders for the huge rewards that may not come yet. \n\n§OLuanwuyuan§!Currently mobilized §Cdisaster relief resources§!: £GFX_production_cost [?QIE_ws_crisis_response_funding|H0]\n"
 QIE_wushan_refugees_fleeing_war: "The looming eight-province joint refugee crisis"
 QIE_wushan_refugees_fleeing_war_desc: "Pure charity relief will only drag us down. We must quickly develop a relief method that can sustainably handle such a large number of refugees. Perhaps cooperating with business owners and emerging factories in North China and subsidizing these refugees to §YPoor Factories§! to serve as low-price labor at lower prices may be able to alleviate the problems we face. But in short, we must develop relevant strategies as soon as possible to prevent these refugees from causing greater trauma to our social fabric."
 QIE_wushan_open_temporary_gruel_kitchens: "Open a temporary porridge factory"
 QIE_wushan_open_temporary_gruel_kitchens_desc: "We will adopt the Chinese government’s basic method of dealing with refugees for thousands of years—opening porridge factories—to prevent these people from starving to death. As long as they can get a bite to eat, although they are still hungry, hope will be ignited in their hearts, which will ensure that they will not take risks and do something harmful to society because they are extremely hungry..."
 QIE_wushan_launch_public_fundraising: "Launch social fundraising"
 QIE_wushan_launch_public_fundraising_desc: "We need to use the power of the government to encourage people to make charitable donations to these refugees. Let’s leave aside those intellectuals in the city who don’t know how to farm and are just very compassionate; what we need most is that the landlords and gentry can open warehouses to sell grain or other urgently needed things. It will be troublesome, but not too troublesome, as long as we deliberately drive a small group of daring refugees to invade a miser's warehouse, we can make them understand the priority."
 QIE_wushan_request_international_relief: "Ask for help from international aid organizations"
 QIE_wushan_request_international_relief_desc: "There are many parts of the world that are not suffering from famine and war, and we can turn to them for some food. The voice needs to be loud enough, the request needs to be sincere enough, and our request needs to be known to as many people as possible. No government in the world would be shameless enough to watch a group of people starve to death in front of them, especially if it refuses to help."
 QIE_wushan_a_secret_remittance: "A secret \"donation\""
 QIE_wushan_a_secret_remittance_desc: "We received a secret donation from overseas. The remittance was transferred several times and the identity of the sender could no longer be determined. Although we cannot immediately convert the money into disaster relief materials, no matter who he is, we should thank him - speaking of which, do you feel that these materials have been consumed very quickly recently?"
 QIE_wushan_a_secret_remittance_tooltip: "£GFX_production_cost [?QIE_ws_crisis_response_funding|H0]"
 QIE_wushan_a_secret_remittance_tooltip_blocked: "£GFX_production_cost [?QIE_ws_crisis_response_funding|R0]"
 QIE_wushan_a_secret_remittance.tt: "§OWe will sell all remaining relief supplies and exchange them for political points. For every 100 points of supplies sold, we can gain 150 political points. §!"
 QIE_wushan_sichuan_famine_relief_countdown: "Great Famine in Sichuan"
 QIE_wushan_sichuan_famine_relief_countdown_desc: "The great famine in Sichuan continues, and our previous symbolic intervention has had unexpected repercussions. If we step up our intervention in this crisis, perhaps we can use this to kidnap the warlord government that controls Sichuan and demand that it merge with us peacefully."
 QIE_wushan_send_telegram_to_sichuan: "Send telegram to Sichuan"
 QIE_wushan_send_telegram_to_sichuan_desc: "The Great Famine is over, and now it’s time to ask Sichuan for our reward. Although these relief materials are nominally given to them for free, they should not be naive enough to really think that these are “free lunches.”"
 QIE_wushan_special_budget_for_sichuan: "special budget"
 QIE_wushan_special_budget_for_sichuan_desc: "We will set up a special budget to deal with famine in Sichuan. Unfortunately, we do not have more resources at our disposal, which will inevitably weaken our already limited disaster relief resources."
 QIE_wushan_sichuan_relief_grain: "Allocate disaster relief food"
 QIE_wushan_sichuan_relief_grain_desc: "We have purchased large quantities of grain from landlords and grain merchants in Henan and Zhili, and the grain will be shipped to Sichuan to alleviate the risk of famine in the region."
 QIE_wushan_grain_for_office: "Accepting millet to fill an official position"
 QIE_wushan_grain_for_office_desc: "Simply purchasing grain cannot make grain merchants and landowners fully cooperate with us. Obviously, due to the famine in Sichuan, they have also begun to worry about whether North China will also be hit by famine. In addition to money, we have to offer something more attractive to them, such as social status."
 QIE_ws_help_szc_famine_0: "We have made a special budget for the Sichuan famine"
 QIE_ws_help_szc_famine_1: "We have allocated disaster relief food to Sichuan that does not need to be repaid"
 QIE_ws_crisis_response_funding_tooltip: "£GFX_production_cost [?40|H0]"
 QIE_ws_crisis_response_funding_tooltip_blocked: "£GFX_production_cost [?40|R0]"
 QIE_ws_crisis_response_funding_cost_tooltip: "Implementing this resolution will cost $QIE_ws_crisis_response_funding_tooltip$"
 QIE_wushan_kunpeng_fund_category: "The waves of Kunpeng are swaying, and they are on their way to the sky of Kunlun."
 QIE_wushan_kunpeng_fund_category_desc: "Our planned §C\"Operation Kunpeng\"§! aims to ensure that when the government regains control of the entire land of China, it can quickly catch up with the great powers in the reconstruction process, and once again guide others as the greatest country in the East. The §gshort-sighted warlords§! and the §Rillegal governments§!, who are independent and independent of each other, provide an unexpected source of funds for this plan. \n\nOn the one hand, we can confiscate its financial reserves to support the war to regain China; on the other hand, we can temporarily seal part of them to pay for industrial recovery and national reconstruction needs in the future. Based on the pseudo-government funds that have been legally recovered and sealed, we estimate that we will be able to allocate approximately §Y[?ROOT.post_CHI_war_mio_reconstruction]§! additional funds during the national reconstruction phase."
 QIE_wushan_seize_shanxi_financial_reserves: "Seizing the Shanxi Puppet Government’s Fund Reserves"
 QIE_wushan_seize_shanxi_financial_reserves_desc: "Now that Shanxi is completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_shandong_financial_reserves: "Seizing the Shandong Puppet Government's Fund Reserves"
 QIE_wushan_seize_shandong_financial_reserves_desc: "Now that Shandong is completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_sichuan_financial_reserves: "Seizing the Sichuan Puppet Government's Fund Reserves"
 QIE_wushan_seize_sichuan_financial_reserves_desc: "Now that Sichuan is completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
 QIE_wushan_seize_hunan_financial_reserves: "Seizing the Hunan Puppet Government's Fund Reserves"
 QIE_wushan_seize_hunan_financial_reserves_desc: "Now that Hunan is completely under our control, we can finally remove everything from their government. The fleeing rulers might be able to take away the banknotes, but they could not remove the large amounts of gold and other precious metals stored in the banks. Part of these spoils will be used to reward the army, part will be used for domestic construction, and part will be stored as \"other money\" to serve our future establishment of military industrial organizations."
