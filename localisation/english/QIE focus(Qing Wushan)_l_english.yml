 QIE_ws_adv_cao_rulin: "Cao Rulin"
 QIE_ws_adv_cao_rulin_desc: "§Y Born: §!§LJanuary 2, 1877; Qing Dynasty, Shanghai County, Jiangsu Province§!\n§Y Faction: §!§cNew Communications Department§!\n§Y Background:§!§LCao Rulin entered Tokyo Law School in 1900, returned to China in 1904, worked in the Department of Commerce of the Ministry of Commerce, and was later transferred to the Ministry of Foreign Affairs. In 1910, Zaifeng appointed him as Vice Minister of Foreign Affairs. After the Revolution of 1911, he became a lawyer and later returned to politics as a member of the first Beiyang Senate. \n\nCao Rulin later became the Undersecretary of Foreign Affairs in 1913. In 1915, under the instruction of Yuan Shikai's government, he and Lu Zhengxiang held negotiations with Japan on the \"Twenty-One Articles\". Therefore, he was denounced as a traitor by Zhang Xun and others. In 1916, Cao Rulin became the Chief of Communications and the Chief of Foreign Affairs. In the autumn of the same year, Cao Rulin succeeded Liang Shiyi as the Prime Minister of the Bank of Communications, thus becoming the leader of the \"New Transportation Department\" and competing with Liang Shiyi's \"Old Transportation Department\". \n\nCao Rulin later served as the Chief of Communications, Chief of Finance and other cabinet positions in Duan Qirui's cabinet, and secured a large amount of Japanese financial assistance for the old Anhui government and army. His residence was burned down during protests in November, and he was dismissed from the cabinet in 1920. He later served as general manager of the Bank of Communications for a period. \n\nAlthough he had been invited by Zhang Zuolin to serve as chairman of the Finance Committee, he decided to return to Beijing after learning that the New Religion of Salvation had power. Perhaps because he would not treat his wallet badly here compared to Fengtian. §!\n\n§YNote: Cao Rulin’s nickname for the New Religion of Salvation is “Huimou”. He regards the New Religion of Salvation as a club that connects all parties and seeks benefits from it. He is not interested in related religious causes. §!"
 QIE_ws_adv_gong_xinzhan: "Gong Xinzhan"
 QIE_ws_adv_gong_xinzhan_desc: "§YBorn in:§!§L1871; Qing Dynasty, Hefei County, Anhui Province§!\n§Y Faction:§!§LNo faction§!\n§YBackground:§!§LGong Xinzhan was a supervisor in the Qing Dynasty and graduated from Jinling Tongwen Hall. Later he studied in Japan. He has served as an attaché in Chinese embassies and consulates in Japan, the United States, France, Italy, the Philippines and other countries for many years. After returning to China, he served as the prefect of Guangdong and acting inspector, and also served as an incorruptible military commander. After 1912, he successively served as the director of the Wuchang Mint, the president of the Bank of China in Hankou, the supervisor of the Relief Bureau, the director of the Anhui Provincial National Tax Preparatory Office, and the director of the Financial Department. In 1914, he was appointed director of the Anhui Provincial Department of Finance. In June 1915, he was promoted to Deputy Minister of Finance of the Beiyang Government and concurrently supervised by the Salt Affairs Bureau. In December of the same year, he was appointed to supervise the affairs of the Economic and Social Affairs Bureau. In April 1916, he served as a member of the Senate and participated in politics. \n\nIn January 1919, he served as the Minister of Finance of the Beiyang Government, Supervisor of the Currency Bureau and President of the Mint. On June 13, Gong Xinzhan concurrently served as Acting Prime Minister. Later, he resigned due to pressure from Wu Peifu, Zhang Zuolin and Cao Kun. \n\nIn 1924, Gong Xinzhan served as Director-General of the Ministry of Internal Affairs, Chairman of the Yangtze River Waterway Discussion Committee and Supervisor of Relief. In December of the following year, he was officially appointed as the Director-General of the Ministry of Transportation. However, he resigned soon after and lived in Tianjin, where he began to undertake business. He has successively served as director of a bank, general director of a glass company, director of the Mining Bureau, prime minister and chairman of Qixin Cement Company, etc. After the New Religion of Salvation took power, he became the new regime's finance minister. §!§!\n\n§YNote: Gong Xinzhan’s name is “Hui Che” in the New Religion of Salvation, and he is the economic committee member of the New Religion of Salvation. It was because he operated within it that New Religion of Salvation had long been able to attract sufficient funds to engage in philanthropic endeavors. §!"
 QIE_ws_adv_li_sihao: "Li Sihao"
 QIE_ws_adv_li_sihao_desc: "§Y Born:§!§L1882; Qing Dynasty, Cixi County, Zhejiang Province§!\n§Y Faction:§!§LNo faction§!\n§YBackground:§!§LLi Sihao participated in the 1903 Zhejiang Enke Examination, became a juren, and then studied at the Capital University. In 1912, he served as Deputy Secretary of Finance, Director of Salt Affairs, and Acting General Director. He also served as President of the Bank of China and President of the Currency Bureau for a time. In 1919, he was appointed Chief Financial Officer and Supervisor of the Salt Service Department. \n\nIn 1913, Yuan Shikai signed a loan contract of 25 million pounds with a group of banks from five countries. Li Sihao designed the genius \"Salt Service Separate Fund\" for this purpose, cleverly withdrawing hundreds of thousands of yuan per month from the repayment for government development. This \"additional payment\" was still in effect until the Zhi-Anhui War. After Duan Qirui came to power, Li Sihao, Xu Shuzheng, Wang Tang and others established the \"Anfu Club\". Li Sihao skillfully brokered in many parties and raised a large amount of military expenditures for the Anhui government by selling tariffs, salt taxes, and tobacco and alcohol sales rights, which aroused social disgust and condemnation. \n\nAfter Wu Peifu united eight southern provinces to form an anti-Duan alliance, Li Sihao cleverly purchased Beijing newspapers and channeled benefits to newspaper reporters to prevent Wu Peifu from returning to the north in terms of public opinion. On the one hand, he planned to launch a cabinet inversion movement in Congress to force Jin Yunpeng to step down; on the other hand, he used newspapers and periodicals to package himself, Zeng Shujun and Zhu Shen as \"patriots.\" However, as the Anhui Clique lost power after the Zhijiang-Anhui War, Wu Peifu, who took power in Beijing, listed Li Sihao as one of the \"Top Ten Culprits of the Anhui Clique\", and Li Sihao was wanted nationwide. He then briefly served as an advisor in Zhang Zuolin's cabinet, but with the Fengtian clique's defeat in the Third Zhili-Fengtian War, he chose to flee to Tianjin in advance for fear of being liquidated by Wu Peifu, instead of going north with Zhang Zuolin. §!§!\n\n§YNote: Li Sihao is known as \"Huiyi\" in the New Religion of Salvation and serves as an economic committee member in the New Religion of Salvation. He himself regards the New Religion of Salvation as a useful financial tool. While evading arrest in Tianjin, as a financial genius, he was attracted by various forces. It is said that even the left wing of the Kuomintang extended an olive branch to him. §!"
 QIE_ws_adv_lu_zongyu: "Lu Zongyu"
 QIE_ws_adv_lu_zongyu_desc: "§Y Born: §!§L1876; Qing Dynasty, Hangzhou Prefecture, Zhejiang Province§!\n§Y Faction: §!§cNew Communications Department§!\n§Y Background: §!§LLu Zongyu was born in a merchant family, and later entered Nanjing Wenzheng Academy. In 1899, he studied at Waseda University's Legal Economics Department at his own expense. In 1902, he returned to China and worked in tax management. Later, he served as a teacher at the Jinshi Hall and the Police Academy. In 1905, he served as the chief of the patrol department under Xu Shichang, and later served as counselor to inspect political minister Zai Ze. \n\nLu Zongyu followed Xu Shichang as the general office of the Fengtian Westernization Bureau and was in charge of the salt affairs of the three eastern provinces. In 1908, he returned to Beijing with Xu Shichang. In 1910, he became a member of the Zizhengyuan. After that, he first served as the associate director of the Bank of Communications, and was soon promoted to deputy minister of the branch. In 1913, he was elected to the Senate, and in the same year he served as China's Minister Plenipotentiary to Japan. \n\nWhen Japan sent troops to Shandong, Lu Zongyu conveyed China's neutral position to Japan and actively promoted the signing of the \"Twenty-One\" with Japan. After Yuan Shikai's death, he was recalled to China and served as the chairman of shareholders of the Bank of Communications. He was sent by Cao Rulin to go to Japan with Zhang Zongxiang to negotiate for the Nishiyuan loan. In 1917, he became the general manager of the China Huiye Bank, a joint venture between China and Japan. In 1919, he and Cao Rulin formed the New Communications Department. In the same year, he and Zhang Zongxiang were beaten by protesters and eventually dismissed. In 1925, he served as a member of the Provisional Political Council and participated in politics, eventually living in Tianjin. Later, he was summoned by Cao Rulin to Fengtian to serve for him. As the New Religion of Salvation took control of the Beiyang Government, he accepted the olive branch offered to him and returned to Beijing with Cao Rulin. §!§!\n\n§YNote: Lu Zongyu was named \"Hui Yi\" in the New Religion of Salvation so that he could talk about the retribution of ghosts and gods. He claimed that he had a strange function and could identify whether it was raining with his nose, with about 90% accuracy. §!"
 QIE_ws_adv_tang_erhe: "Tang Erhe"
 QIE_ws_adv_tang_erhe_desc: "§Y Born: §!§L1878; Qing Dynasty, Hangzhou Prefecture, Zhejiang Province§!\n§Y Faction: §!§M Nanzhi Clan§!\n§Y Background: §!§LThe famous intellectual and \"Six Pines Old Man\" Tang Erhe is a very special official in Sun Chuanfang's inner circle. He studied classics since he was a child, received private education, and was a talented student. In 1903, Tang Erhe went to Japan to study military affairs at Chengcheng School. During his stay in Japan, he actively participated in anti-Qing and anti-imperialist activities and joined the Tongmenghui. In 1904, he worked as a music teacher at Zhejiang University. Three years later, he went to Japan to study medicine again and studied at Kanazawa Medical College. He then went to study abroad at the University of Berlin in Germany and obtained a doctorate in medicine. \n\nAfter returning to China, Tang Erhe served as a physician and medical director in many institutions. During this period, he founded Zhejiang Hospital and participated in the Revolution of 1911. He later founded the National Beijing Medical College and served as its principal. In 1915, he initiated the establishment of the Medical Society of the Republic of China. In 1920, he was sent to Europe to investigate medicine. After returning to China in 1922, he served as deputy minister of education. \n\nAfter the Great Kantō Earthquake in Japan in 1923, Tang Erhe went to Japan as a condolence envoy of the Red Cross Society of China. Later, he served as the Director-General of Education in the \"Good Guy Government\" established by Wang Chonghui with the support of Wu Peifu. In 1925, Tang Erhe and Wang Jingwei had a brief debate on whether Sun Yat-sen's condition should be treated with traditional Chinese medicine or Western medicine. He sided with Western medicine. In 1926, Tang Erhe was appointed Minister of the Interior, and in 1927 he was appointed Minister of Finance. \n\nIn 1929, Tang Erhe received a doctorate in medicine from Tokyo Imperial University, Japan. After returning to China, he held various positions in the southern government. After receiving the invitation letter from Jiang Chaozong, Tang Erhe joined the Beiyang Government. §!\n\n§Y Note: Tang Erhe is not a member of the New Religion of Salvation. He and Jiang Chaozong got acquainted with each other because of their condolences for the Great Kanto Earthquake in Japan in 1923. At that time, Jiang Chaozong and other representatives of the New Religion of Salvation also went to Japan to carry out international disaster relief activities. §!"
 QIE_ws_adv_yuan_yonglian: "Yuan Yonglian"
 QIE_ws_adv_yuan_yonglian_desc: "§Y Born:§!§L1881; Qing Dynasty, Guiyang Prefecture, Guizhou Province§!\n§Y Faction:§!§LNo faction§!\n§YBackground:§!§L Yuan Yonglian was the Enke Jinshi in 1904, and achieved the 23rd place in the top three. During the Qing government, he served as the head of the Household Department and deputy financial supervisor of Shanxi. Soon he went to Japan to study and entered Hosei University. After returning to China in 1912, he served as prosecutor of the Ministry of Finance of the Beiyang Government, director of the Preparatory Office of the Shanxi National Taxation Department, and director of the Stamp Tax Office. In 1920, he was appointed director of the Taxation Department of the Ministry of Finance. \n\nAfter Yan Huiqing's regency cabinet, the \"good guy cabinet\" supported by Wu Peifu, came to power in 1926, Yuan Yonglian served as deputy minister of the Ministry of Finance. §!§!\n\n§YNote: Yuan Yonglian was named \"Gu Zhen\" in the New Religion of Salvation and served as an economic committee member in the New Religion of Salvation. He likes to talk about ghosts and gods, and he once organized another occult group \"Pushan Society\" in Beijing with others."
 QIE_ws_adv_zhong_shiming: "Zhong Shiming"
 QIE_ws_adv_zhong_shiming_desc: "§Y Born:§!§L1879; Qing Dynasty, Tianjin Prefecture, Zhili Province§!\n§Y Faction:§!§LNo faction§!\n§YBackground:§!§LZhong Shiming entered Beiyang University in April 1903 and studied for three years. In 1906, he went to the United States to receive higher education. In November 1909, he received a master's degree in literature from Harvard University. When he returned to China via Russia after graduation, he was ordered to study politics in advanced European countries. In February 1910, he served as a specialist in the Zhili Academic Affairs Office and an English professor at the Zhili Higher Industrial School. In 1921, he served as Deputy Minister of Finance and Director of the General Administration of Salt Affairs. \n\nIn 1923, he served as a senior financial advisor in Zhang Zuolin's cabinet, but he did not return to Fengtian with him after the third Zhili-Fengtian War. He then lived in Tianjin and concentrated on managing social welfare undertakings in Tianjin. Zhong Shiming presided over the Mingde Tzu Chi Society and the Chinese Studies Research Society in Tianjin, serving as the president and vice president respectively. §!§!\n\n§YNote: Zhong Shiming, whose name is \"Bidi\" in the New Religion of Salvation, is one of the deputy leaders of the New Religion of Salvation and is in charge of charity and support affairs. But he himself was not interested in these strange things, and he preferred to use New Religion of Salvation as a charitable organization rather than a religious organization."
 QIE_ws_adv_zhou_zhenlin: "Zhou Zhenlin"
 QIE_ws_adv_zhou_zhenlin_desc: "§Y Born: §!§L1875; Changsha Prefecture, Qing Dynasty, Hunan Province§!\n§Y Faction: §!§mOld Political Science Department§! (§lReconstructionist§!)\n§YBackground:§!§L Zhou Zhenlin participated in the Huaxing Society meeting of the revolutionary group founded by Huang Xing and others in 1903, and decided to launch an armed uprising in Changsha. In 1905, he joined the Tongmenghui and then went to Japan to study at Hosei University. After returning to China in 1907, he wrote articles to promote the revolution for the \"Imperial Daily News\" and \"Sunchon Times\" in Beijing. On the eve of the Wuchang Uprising in 1911, he was ordered to return to Changsha to gather comrades and make military arrangements. After the recovery of Hunan, he was appointed as the director of the Pay Bureau. In the spring of 1912, he participated in organizing government affairs. In March of the following year, he actively carried out anti-Yuan activities and was arrested in Jiujiang. After his release, he once again traveled east to Japan to join the Chinese Revolutionary Party. \n\nIn 1916, he went to Beijing on the order of Sun Yat-sen. As a senator, he liaised with the Kuomintang members in Congress to carry out parliamentary struggles. He also opened the \"True Republic Daily\" in Beijing to promote the Three People's Principles. The following year, he was ordered to follow Sun Yat-sen to Guangzhou to protect the Dharma, and later went to Shanghai to serve as the Secretary-General of the Kuomintang Office. In 1920, Zhou Zhenlin went to Fujian to meet Chen Jiongming and formulated a plan for him to return to Guangdong. \n\nIn 1923, he met with Feng Yuxiang, organized the National Army to fight against Yan Xishan, and criticized Cao Kun after he bribed the election. §!§!\n\n§Y Notes: Zhou Zhenlin’s name is “Daofu” in the New Religion of Salvation. He is the only figure in the New Religion of Salvation who has close relations with the Kuomintang. Although on the surface he is often entangled with the old political science department led by Huang Yan, he actually has private and secret connections with Sun Ke and others - of course, this matter has been known to the New Religion of Salvation."
 QIE_ws_adv_zhuang_rensong: "Zhuang Rensong"
 QIE_ws_adv_zhuang_rensong_desc: "§YBorn:§!§L1873; Qing Dynasty, Danyang County, Jiangsu Province§!\n§Y Faction:§!§LNo faction§!\n§YBackground:§!§L Zhuang Rensong, also known as Zhuang Lefeng. Graduated from Beiyang Naval Academy and was a disciple of Yan Fu. Although he was unable to join the army because he fell from a mast during school training and injured his leg, he stayed in school to teach after graduating as a top student. In 1900, he sold the Kaiping Mining Bureau to the British government, which triggered a property rights dispute between the Qing government and the British, forcing him to flee to Tianjin. \n\nAfter the Revolution of 1911, Zhuang Rensong founded Zhongxing Coal Mine Co., Ltd. with his classmate and then President Li Yuanhong and served as a director, becoming Li Yuanhong's white glove. As the company's business flourished, Zhuang Rensong was appointed by the British as the chairman of the Tianjin British Concession Chinese Taxpayers Association in 1926. In order to improve education issues, he actively raised funds while serving as a director and lobbied the embassy's urban industry bureau in an attempt to build a Chinese school. Zhuang Rensong finally succeeded in raising 34,000 taels of silver to build a school. This Chinese school, called Tianjin Public School, only admitted children from Chinese families who paid taxes in Tianjin. \n\nSoon after, the number of applications for admission to Tianjin Public School increased day by day, and the old school building could no longer accommodate it. The Chinese directors in the British Concession jointly requested the Ministry of Industry and Industry to fund the construction of a new school building, but the directors refused on the grounds of financial difficulties. In the end, Zhuang Lefeng decided to raise funds for the construction on his own and renamed the school \"Yaohua Middle School\", taking its meaning of \"Glorious China\". §!§!\n\n§YRemarks: Zhuang Rensong, whose name is \"Le Feng\" in the middle school of the New Religion of Salvation, is one of the directors of the Salvation New Church Charity House and Luan Wuyuan, and is responsible for charity and support affairs. Although he himself does not believe in these strange things, he also believes that this is a way to educate the people."
 QIE_beiyang_warfare: "Lin Jianzhang"
 QIE_ws_big_gun_warfare_desc: "§YBorn:§!§L1874; Qing Dynasty, Fuzhou, Fujian Province§!\n§YFaction:§!§LNo faction§!\n§YBackground:§!§LLin Jianzhang began his naval career with an appreciation of new technologies and his own boldness. As a native of Fujian, he joined the Chinese Navy and graduated from the Jiangnan Naval Academy. During the Revolution of 1911, Lin Jianzhang demonstrated his professionalism and courage by rescuing the revolutionary army in the upper reaches of the Yangtze River. The Nanjing Provisional Government therefore awarded him the title of naval lieutenant colonel and ordered him to command the navy's flagship \"Nanchen\". This promotion demonstrates his political influence. Then Lin Jianzhang came to the Zhili Navy. After the restoration of the Qing Dynasty, Lin Jianzhang declared the independence of the fleet and sailed to Shanghai. However, his subordinates worked together to remove him and threw him to Yantai. After being humiliated, Zhang Zuolin came to visit and allowed him to rebuild a fleet in Yantai. §!\n\n§YNote: Lin Jianzhang’s nickname is “Wu Rong” in the New Religion of Salvation. He is one of the economic committee members of the New Religion of Salvation and is responsible for managing the church’s donations. He personally supports Gong Xinzhan's career very much. §!"
 QIE_ws_jfc_fuller: "J.F.C. Fuller"
 QIE_ws_jfc_fuller_desc: "§YBorn:§!§L1878; Chichester, West Sussex, England§!\n§YFaction:§!§LNo faction§!\n§YBackground:§!§LJohn Frederick Charles Fuller was commissioned to the 1st Battalion, Oxfordshire Light Infantry in 1898. He participated in the Second Boer War in South Africa from 1899 to 1902, and was promoted to lieutenant a few months after arriving there. In 1913 he was admitted to the Staff College and began studying there in January 1914. \n\nDuring the World War, Fuller served as a staff officer for the Territorial Army and the Seventh Army in France. In 1916, he was transferred to the Headquarters of the Heavy Detachment of the Machine Gun Corps (the unit was later reorganized into the Tank Corps). \n\nIn September 1917, he held talks with the Minister of Munitions, Winston Churchill, at the Tank Corps headquarters in Bermicourt. He participated in planning the tank raid at the Battle of Cambrai in November 1917, and formulated a tank combat plan for the autumn offensive of 1918, and was promoted to lieutenant colonel. \n\nHe also designed a comprehensive mechanized attack plan on Germany called the \"1919 Plan\", but it was not implemented due to Germany's rapid victory. After going into exile in Canada, he chose to retire from the army and concentrate on writing military theory. §!\n\n§YNote: Fuller is associated with the mysterious Western occult organization \"A∴A∴\", and he is respectfully known as the \"Great Novice\". Discussions of Western mystical content such as the Kabbalah Tree of Life can also be seen in his military theoretical works. §!"
 QIE_ws_maczynski: "Igor Semyonovich Mechinsky"
 QIE_ws_menzel: "Mainjar"
 QIE_ws_chen_huan: "Chen Chen"
 QIE_ws_chen_huan_desc: "§Y Born: §!§LMarch 1870; Qing Dynasty, De'an Prefecture, Hubei Province§!\n§Y Faction: §!§bArmed Forces Department§!\n§YBackground:§!§L Chen Huan was a son of an aristocratic family. In 1895, he was stimulated by the Sino-Japanese War of 1895 and the military academy provided food to fill his stomach, so he decided to join the army and was admitted to the Hubei Armed Forces School. He participated in the training of the Beiyang New Army and organized the 6th Battalion of the Standing Army and the 1st Battalion of Engineers. In 1911, he went to Germany to study military affairs. After returning from Germany, he was appointed General Yiwei and in charge of Sichuan military affairs. \n\nDuring this period, the armed forces split into loyalists loyal to Hu Jingyi and the Sichuan National Protectorate Army led by Liu Cunhou. In the same year, he succeeded Hu Jingyi who left and continued to dominate Sichuan. Chen Chen followed Yuan Shikai's order to extend Yuan Shaobao's authority to Sichuan, and tried his best to eliminate the influence of the Kuomintang, the Republican Party, the Progressive Party and other political parties, as well as the Sichuan National Guard Army. \n\nIn November 1915, after Yuan Shikai planned to proclaim himself emperor, he informed Chen Huan, and representatives from Sichuan Province immediately raised the banner of supporting the imperial system. At the same time, Cai E launched an army to attack Yuan Shikai. Chen He actively responded to Cao Kun's plan, but on the other hand, he secretly contacted Cai E, who was in Yunnan at the time. \n\nAs Yuan Shikai abdicated, Chen Heng and Cai E agreed to a one-month truce and peace talks between the north and the south. However, because Yuan Shikai was attached to the presidency, the National Guard Army demanded that Yuan must step down. Chen He had no choice but to persuade Yuan Shikai to abdicate. Shortly after Yuan Shikai abdicated, he declared Sichuan's independence, but later went back on his word and canceled the independence. His actions aroused the ire of Beijing, who recalled him to Beijing and handed over control of Sichuan to the governor Luo Peijin. It was at this time that Liu Cunhou launched a mutiny and seized power from the Sichuan Provincial Government. §!§L§!\n\n§YNote: Due to this \"independent incident\", Chen Huan had to completely retire from the military and lived in Beijing, living a life of a scholar. §!"
