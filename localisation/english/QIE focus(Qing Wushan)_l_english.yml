 QIE_guide: "§RYou have enabled the accessory module of \"Penglai Nondum Reperta\". The route of this submod is on the second page! §!\n\n§MZhili Monarchy§! — §MPro-Anqing§! / §MPro-Nanjing§! ($authoritarian_democrat_coloured$)\n£white_dot To go Pro-Anqing, accept Chen Tiaoyuan's request for aid when the League War breaks out, bringing you down an Anti-Concessionist path.\n£white_dot To go Pro-Nanjing, deny Chen Tiaoyuan's request for aid when the League War breaks out and accept Qi Xieyuan's offer shortly after, bringing you down a pro-German path.\n\n§MManchu Qing§! — §MZongshe Party§! / §MYCP§! / §MCERA§! ($paternal_autocrat_coloured$ / $authoritarian_democrat_coloured$ / $social_conservative_coloured$)\n£white_dot Note: if Qu Yingguang or Zhang Tianran are not in power in Shandong you will not be able to select them as a coup backer. If you wish to have either as a coup backer, be sure to set Shandong's \"Zhang's Latest Gamble\" game rule to \"Qu in Command\" or \"Yiguandao Takeover\" to ensure Qu Yingguang or Zhang Tianran come to power in Shandong.\n£white_dot Accept neither Chen Tiaoyuan's nor Qi Xieyuan's requests for aid when the League War breaks out.\n£white_dot If choosing Qu Yingguang as a coup backer, send a division to help Shandong against riots when asked for help.\n£white_dot In the event \"A Clandestine Meeting\", choose a coup backer of your choice — if choosing Yan Xishan, play on his ambition.\n£white_dot In the event \"Ominous Troop Movements\", choose not to investigate the matter.\n£white_dot When guards rush to the hall, have the coup succeed.\n\n§MManchu Qing§! — §MLegitmate Elections§! ($social_conservative_coloured$ / $social_democrat_coloured$)\n£white_dot Set Shandong's \"Zhang's Latest Gamble\" game rule to \"Qu in Command\" to ensure Qu Yingguang comes to power in Shandong.\n£white_dot Accept neither Chen Tiaoyuan's nor Qi Xieyuan's requests for aid when the League War breaks out.\n£white_dot Send a division to help Shandong against riots when asked for help.\n£white_dot In the event \"A Clandestine Meeting\", choose Qu Yingguang as the coup backer.\n£white_dot In the event \"Ominous Troop Movements\", choose not to investigate the matter.\n£white_dot When guards rush to the hall, have the coup succeed.\n£white_dot In the \"The Emergency Government\" event, favour the CERA.\n£white_dot Complete the \"Train Civil Servants\" focus and complete all 3 electoral reform decisions by June 1940.\n£white_dot In the event \"Mapping out the Electorate\", choose to have the Assembly hash it out.\n£white_dot In the event \"Polling Infrastructure Needs\", choose to give the people access to the levers of power.\n£white_dot Complete the \"Rural Loyalty Ensured\" focus before completing the \"Empowering Local Assemblies\" decision and in the event \"Empowering the Local Assemblies\", choose to call for elections in regional governments within your territory.\n£white_dot Successfully completing Qu Yiangguang's reforms will maintain democracy and allow election of §SSocial Democrats§! in 1944.\n\n§MZhili Republic§! - §MHu Shih§! / §MV.K. Wellington Koo§! ($authoritarian_democrat_coloured$)\n£white_dot Same regular Manchu Coup, but either:\n£white_dot Do not send a division to help with riots when Qu Yingguang requests aid then choose him as coup backer, or\n£white_dot Choose Yan Xishan as coup backer and play on his fears of instability, or\n£white_dot Choose to investigate the matter in the event \"Ominous Troop Movements\", or\n£white_dot or have the coup fail when guards rush into the hall."
 QIE_guide_1: "§MNew Religion of Salvation§!/§MChinese Heavenly Virtue Holy Kingdom§!: §MJiang Chaozong§!/§MWu Peifu§! ($national_populist_coloured$)\n£white_dot When a large number of refugees from the eight provinces combined poured into the North China Plain, the New Religion of Salvation chose to reject the New Religion of Salvation's request for aid when submitting an emergency relief draft. This would allow the New Religion of Salvation to immediately skip its automatic national policy \"Charitable Donation\", and thus be the first to complete the national policy branch before the Xuantong coup. \n£white_dot Don't accept Chen Tiaoyuan and Qi Xieyuan's requests when the East China melee breaks out. \n£white_dot Enter the Xuantong Restoration route normally and choose any coup breaker. If you choose Yan Xishan, choose to take advantage of his ambition. \n£white_dot In the case of \"Ominous Troop Movement\", chose not to investigate the incident. \n£white_dot In the \"Outside the Hall\" event, select \"Two rebels are fighting in the Qianqing Palace, escort them!\" \n£white_dot When the guards rush into the hall, the third hidden option can be unlocked, allowing the New Religion of Salvation Coup to succeed. \n£white_dot After switching to the New Religion of Salvation national focus tree and completing the national policy \"Heaven's destiny is not lost, supervising the country on behalf of the emperor\", in the \"incense burning\" event that is automatically triggered later, you can choose to let either Jiang Chaozong or Wu Peifu succeed in their conspiracy. \n£white_dot If you choose \"Two fragrances share the same embers, the sage words will not come true\", the scandals of both of them will be exposed after solving the \"eight provinces refugee crisis\" incident, and technocrats such as Gong Xinzhan and Li Sihao will seize power and enter §MQian Nengxun§!'s hidden line of governing the country by the dead. \n£white_dot §RAttention! §!After the unification of China, the §MNew Beiyang Government Provisional Committee§! ($social_liberal_coloured$) established, as well as the interim chairman §M Tang Erhe §! are part of the plot, and this line cannot currently be transformed into the normalized §MRepublic of China§!."
