 QIE_the_shadow_of_order: "Bingzi's ghost"
 QIE_the_shadow_of_order_desc: "On this festive occasion of the Year of the Rat, more than one force is celebrating the new year and looking back on the past. Jiang Chaozong, the former nine-door admiral who had participated in Zhang Xun's restoration, replaced the absent Wu Peifu and delivered a New Year's greeting to members of a charity organization in Beijing. But most people here know that the political situation this year is not optimistic, §RA storm is coming...§!"
 QIE_secret_meeting: "charity fundraiser"
 QIE_secret_meeting_desc: "The New Religion of Salvation has exhausted the last of the funds in their budget for disaster relief. If the Beiyang Government and the Ministry of Finance remain indifferent to the chaos outside and say they are unable to provide any help, they will have to find ways to obtain disaster relief funds themselves from some channels."
 QIE_hang_on_the_oppo_discontent: "Capture the chaos"
 QIE_hang_on_the_oppo_discontent_desc: "The city of Beijing is in chaos now, but it is indeed the best situation for us. Zhili's inaction will inevitably lead to their loss of support. We just have to wait slowly, and an irresolvable conflict will inevitably break out between the little emperor and §CZhixuan§! \n§REverything is ready, all we need is the east wind...§!"
 QIE_the_seances_of_master_lv: "New Kingdom Protestantism"
 QIE_the_seances_of_master_lv_desc: "The two groups of rebels who disrespected their ancestors and planned a coup shot at each other in the Qianqing Palace. The New Religion of Salvation has captured them all, and the traitor Cao Kun and his rebellious parties have all been brought to justice. We have asked His Majesty Puyi to rest and recover. During this period, the New Religion of Salvation and other political parties in the former Congress will assume the responsibility of maintaining order in the capital and calming down the chaos."
 QIE_wushan_power: "The destiny has not been lost, supervising the country on behalf of the emperor"
 QIE_wushan_power_desc: "The development of things was completely unexpected. Who would have thought that a coup planned by the royalists would eventually lead to an unexpected counter-coup? Nowadays, the New Religion of Salvation is working hard to reorganize itself into a government cabinet. In this period of power transfer, the most fortunate thing is that many of its members have held positions in the old Beiyang government."
 QIE_wushan_power.tt: "§8 We will be recruiting Salvationist Protestant members and people associated with New Religion of Salvation to join our §GCabinet§!! §!"
