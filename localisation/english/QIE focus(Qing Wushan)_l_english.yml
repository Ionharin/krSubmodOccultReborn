 QIE_and_new_beliefs_live_in_here: "The goodness of Westerners also prospers the world"
 QIE_seances_restart_in_beijing: "The auspicious day has arrived"
 QIE_restore_the_order_behind_shanhaiguan: "Restoring order within the customs"
 QIE_eliminate_traitors_in_the_south: "Clean up the banditry in the South"
 QIE_destory_the_red_flag: "Defeat the evil thief Bingyin again"
 QIE_advance_to_the_shanhaiguan: "Looking outside the pass"
 QIE_wushan_universe_is_destroyed_by_fire: "The fire is burning but never extinguished"
 QIE_wushan_universe_is_destroyed_by_fire_desc: "The world has been engulfed in the fires of war, and we must take up arms to protect our families and our lives. It is not just a passive defense. In order to prevent an invasion like [JAP.GetName] from happening to us again, we must prepare for war against all potential people in the world who may threaten us."
 QIE_wushan_universe_is_destroyed_by_water: "The water is vast and never stops"
 QIE_wushan_universe_is_destroyed_by_water_desc: "Just like those foreign spies in the embassy cities and in our country in the past, there are egoists everywhere who are willing to sell their country's secrets for personal financial gain. We may also be able to use these people in other countries to our advantage."
 QIE_wushan_wangongchang_explosion: "apocalypse big bang"
 QIE_wushan_wangongchang_explosion_desc: "In the sixth year of the Apocalypse in the Ming Dynasty, a big explosion occurred in the gunpowder depot of Wanggong Factory in Beijing. Historical facts record that the explosion triggered a cloud shaped like Ganoderma lucidum and an ensuing dust cloud. There were even rumors that victims' clothing fell off for no reason and their belongings disappeared out of thin air. We should make full use of this historical memory to promote to the public that Chinese civilization once led the world. By acquiescing to the conspiracy theory connection between the Apocalypse Big Bang and \"nuclear technology\", we can not only inspire the national pride of the people, but also call on them to actively donate funds to revive this lost technology that belongs to China."
 QIE_wushan_arrest_of_opposition_figures: "purge the opposition"
 QIE_wushan_arrest_of_opposition_figures_desc: "Before the reunification of China, those opponents who seemed distant from us fought with us for similar purposes. To maintain this fragile collaboration, we even share power with them to a certain extent. But these people were still dissatisfied. After China was unified, instead of accepting the new order, they began to openly criticize the government. In the final analysis, we are just fellow travelers with different destinations. Since fellow travelers have become stumbling blocks, the government has the responsibility to take measures to prevent them from continuing to spread those harmful ideas."
 QIE_wushan_eradicate_poisonous_weeds: "The wind blows and poisonous weeds grow"
 QIE_wushan_eradicate_poisonous_weeds_desc: "For a long time, our literary, artistic and intellectual circles have been influenced by the decadent voices from Western society, and \"the word must be called Greek\" has become an incurable disease for these people. [ROOT.GetLeader] plans to publish a series of books to systematically describe how [ROOT.GetName] relied on traditional Chinese thought to achieve national reunification under the threat of evil foreign forces and the siege of separatist forces. In addition, the government will subsidize printing plants that print traditional ethics books, and strictly control intellectual books from the Western world."
 QIE_wushan_our_rockets_our_victory: "Welcome back thousands of households"
 QIE_wushan_our_rockets_our_victory_desc: "As early as the Ming Dynasty, the splendid Chinese civilization had already touched the prototype of rocket technology. Wanhu was respected as the \"Flying Scholar-official\" by people. He flew into the sky on a homemade rocket and became the god of firearms. We will rediscover the legend of Ten Thousand Households and shape it into a spiritual symbol of the national rocket industry. The people will understand: We are not learning from the West, but restoring the ancient magic weapons that originally belonged to the Chinese civilization."
 QIE_wushan_punish_those_syndicalistic_thugs: "The final battle against the red plague"
 QIE_wushan_punish_those_syndicalistic_thugs_desc: "The red color of the syndicalists is the color of the blood of the victims they chew in their mouths. How many revolutions, how many riots, and how big a sea of blood do they have to create before they give up? If they want blood, let us give them blood. Let us kill the last syndicalist. Let us use their blood to stop the rebirth of any blood sea."
 QIE_wushan_punish_those_syndicalistic_thugs.tt: "§RWe will end all socialist states in the world. §!"
 QIE_the_rise_of_jiang_desc: "After joining forces and successfully defeating the Royalist Party radicals, Jiang Chaozong, as one of the leaders of the New Religion of Salvation, once again had the opportunity to kiss the secular throne. He plans to establish a government full of diplomatic charm and open to the outside world, and only in this way can he achieve his ultimate goal."
 QIE_the_defense_of_wu_desc: "Wu Peifu has recovered from the impact of the Bingzi coup. As one of the nominal leaders of the New Religion of Salvation, his idea for this new theocracy is an independent national government that revives China's excellent traditional culture. He believes that the foundation of the Chinese people lies entirely in Confucius and Mencius. As long as the Chinese people start to respect Confucius and respect etiquette again, then China's glorious century will come again."
 QIE_seek_japanese_sympathy_desc: "Merely proving my prestige is not enough to bring down Wu Peifu. I must also find evidence that can slander him. Perhaps my friends in Japan had gathered some information about him before."
 QIE_beijing_mingjing_society_desc: "Jiang Chaozong has lived in Beijing for a long time and has been in private contact with various celebrities, intellectuals and rising political and business stars. During these exchanges, he must have done some shady things. If the people from the Beijing Ming Jing Society can provide me with some relevant evidence, I can prove that Jiang Chaozong acted for society and the people on the surface, but secretly did it for the elites and his own pocketbook."
 QIE_lobby_members_desc: "The political struggle that took place in Beijing was by no means an ordinary battle filled with smoke and blood on the battlefield, but a silent confrontation with political and social overtones. By leveraging old connections, I was able to pressure Wu Peifu to withdraw from the power struggle."
 QIE_mobilize_connections_desc: "This war is a bloodless war, but it is more dangerous because it is bloodless, because you have no way of knowing whether the other party has attacked your vital points. I must find people who can support me within the New Religion of Salvation as soon as possible, at least to prove to people at the regular meetings of the church that although I have been absent from church affairs for a long time, I still have quite high social prestige and trust within the church."
 QIE_the_reluctant_two_leaders_desc: "Although a dead man sat on the throne of the supreme church of New Religion of Salvation, in order to implement his policies, he still needed a living government to work for him. Jiang Chaozong and Wu Peifu have been appointed as extraordinary deputy religious leaders, responsible for cooperating with Qian Neng to teach and govern the country. Jiang and Wu started their struggle under the table again, using their own methods to exert influence on this fragile and strong leadership position."
 QIE_jiang_controls_the_wushan_desc: "Jiang Chaozong finally sat on the throne of power he dreamed of, not the position of a false saint, but the position of a true king. In the devastated country at his feet, members of the religious order and the citizens of Beijing shouted long live for him. And he also decided to use his own way to repay the trust and blessings placed in him by his friends and people."
 QIE_wu_control_the_wushan_desc: "After another setback, Wu Peifu once again reached the top of Beijing. It's just that this time things have changed, and the people surrounding him are no longer the military leaders of the Jinbao Sect and Luoyang Sect, but a group of traditional literati who are chanting the scriptures of sages. Wu Peifu will reshape this gradually decaying country and reshape the entire Chinese nation. Soon, it will once again stand tall on the vast eastern continent and become the envy of the Yi and Di from all over the world."
 QIE_the_oracle_of_master_lv_desc: "A new god's writing appeared on the altar. It turned out to be the first generation of the New Religion of Salvation, and the Prime Minister of the Beiyang Government, Qian Nengxun, appeared. He had already ascended to the Purple Mansion and was ranked in the Immortal Class. He couldn't bear to see the sect being divided due to internal strife, so he sent Luan here. Master Qian has issued an edict, and from now on, all matters of the religious order will be fully subject to his will."
 QIE_honor_tao_as_the_superior_desc: "On July 13, 1920, the founder of Confucianism, Buddhism and Taoism descended on Luzu Pavilion in Yanjing, the altar of salvation for the new religion. It explains to us the true meaning of the unity of the three religions. Now that we have mastered the state propaganda machine, it is time to further promote the true wisdom that Dao Zu originally told us to our people, in order to spread to them the traditional Chinese culture that we hope they will abide by."
 QIE_honor_buddhism_as_the_superior_desc: "On July 13, 1920, the founder of Confucianism, Buddhism and Taoism descended on Luzu Pavilion in Yanjing, the altar of salvation for the new religion. It explains to us the true meaning of the unity of the three religions. Now that we have mastered the state propaganda machine, it is time to further promote the true wisdom that Buddha originally told us to our people, in order to spread to them the traditional Chinese culture that we hope they will abide by."
 QIE_honor_con_as_the_superior_desc: "On July 13, 1920, the founder of Confucianism, Buddhism and Taoism descended on Luzu Pavilion in Yanjing, the altar of salvation for the new religion. It explains to us the true meaning of the unity of the three religions. Now that we have mastered the state propaganda machine, it is time to further promote the true wisdom that Confucian ancestors originally told us to our people, in order to spread to them the traditional Chinese culture that we hope they will abide by."
 QIE_honor_jesus_as_the_superior_desc: "In April 1920, the Western philosopher Aristotle and Jesus Christ came to Luzu Pavilion in Yanjing, the altar of salvation for the Protestant religion. For a long time, because Yezu only spoke English when he descended, there were many obstacles for us to communicate with him. If we also promote Jesus' identity as a Chinese sage to the citizens, we may encounter the same problem."
 QIE_honor_mohammad_as_the_superior_desc: "In September 1922, Huizu descended on Luzu Pavilion in Yanjing, the altar of salvation for the Protestant religion. It enlightens us on the relationship between Islam and traditional Chinese virtues. We might be able to promote to citizens the idea of ​​honoring Hui Ancestors as the sages of China. This will help us gather a new national identity and win over the Hui people in the northwest region to support our government."
 QIE_respond_the_sichuan_famine_desc: "Severe drought, combined with warlord fighting, and famine in Sichuan have already made the Sichuan government very anxious. If we can provide some humanitarian relief to the Sichuan Governor, maybe this favor will come in handy in the future."
 QIE_economic_stability_desc: "[ROOT.GetLeader] has become the supreme power holder of the cult and the government. Although our outstanding response to the refugee crisis has won praise from some social elites and citizens. But most people still regard us as reactionary and backward feudal superstitious elements. We must change this view: the most important thing at the moment is to find a suitable political party to unite. Faced with the opportunity to share the power to change China, few opposition parties can continue to abide by their principles."
 QIE_debt_negotiation_desc: "The time has come. Although we claim to be a new government, the international creditors will not let us go just because of our words. Unless we outright refuse to meet our obligations, overwhelming international debt will continue to hinder our economic growth. A reasonable choice is that since the melee in East China has damaged German interests in China, if we negotiate with the Germans at this time, we may be able to obtain better conditions. But those who are anti-concession and anti-foreign people will express regret for our choice."
 QIE_cancel_completely_desc: "The time has come. Although we claim to be a new government, the international creditors will not let us go just because of our words. Unless we outright refuse to meet our obligations, overwhelming international debt will continue to hinder our economic growth. A total debt default is a tempting option, and we could have all the numbers wiped out overnight, which would cause losses in the short term but allow us to grow further in the long term. But those business owners who have contacts overseas will regret our choice."
 QIE_charitable_share_bank_desc: "Beijing Charity Bank Co., Ltd. is a financial project designed for us by Li Sihao, Chief Financial Officer of the Duan Qirui government, to raise charity funds and invest in social development. However, with the defeat of the Anhui clique and Li Sihao being wanted by the former government, this plan had to be suspended. Now that we are in control of the government, maybe we can restart the plan and revoke Li Sihao's wanted order and have him come back to work for us."
 QIE_pauper_factory_desc: "Our country's industry has basically only developed in a few big cities, while the rural areas are completely uncultivated virgin land. Now that we have so many idle people on hand, perhaps we can send them to engage in pioneering work in various underdeveloped areas, providing work for relief. On the one hand, we can solve the refugee crisis, and on the other hand, we can develop our land."
 QIE_temporary_housing_desc: "Due to the ongoing conflicts caused by the collapse of the eight-province alliance and the turmoil in Beijing, a large number of war refugees have entered our sphere of influence. We might be able to house them properly. Relief shacks and cotton-padded clothes have been distributed in an orderly manner, and these construction actions have unexpectedly stimulated the re-employment of refugees. As long as this continues, the restoration of social order is imminent."
 QIE_project_henan_desc: "Henan has relied heavily on land output for a long time. Even the handicraft industry is not very developed, and its degree of industrialization is almost zero. If these wandering refugees can help us repair the corresponding infrastructure, it may become possible to develop Henan Province into a strong industrial region."
 QIE_project_zhili_desc: "Zhili Province is one of the most urbanized urban areas in our country, but this is thanks to Beijing as the capital. There is still a large amount of unused land in areas around Beijing such as Tangshan. If these wandering refugees can help us repair the corresponding infrastructure, it may become possible to develop Zhili Province into a strong industrial region."
 QIE_project_xian_desc: "The Guanzhong region of Shaanxi is a cotton-producing area where my country promotes new cotton varieties. However, the textile industry in this region is still dominated by handicraftsmen and small family workshops. This is mainly due to the traffic congestion and high logistics costs in the Guanzhong area. If these wandering refugees can help us repair the corresponding infrastructure, it may become possible to develop Shaanxi Province into a strong industrial region."
 QIE_the_legacy_of_wang_jinghui_desc: "On August 20, Xinyou year, Master Liu Zhenren of Hongjiao descended to the house of Wang Jinghui, a branch of the Nanjing New Religion of Salvation, leaving behind the edict of \"Tiren Jiahui, benefiting things and solidifying truth\" before returning to heaven. Since then, layman Wang has taken this as his creed to promote charity and education. Although he has passed away now, we will name this public school after him, so that thousands of people who benefited from his grace will remember him."
 QIE_seize_german_assets_desc: "As we shred documents that were just numbers, a large number of German businesses within our government's sphere of influence have left. They left behind factories and institutions that they couldn't move. We can take advantage of these industrial enterprises and nationalize them, after all, this is what the Germans left here. The best they can do is to indulge in oral pleasure without any additional reactions."
 QIE_old_army_new_life_desc: "Our current army is simply a mixed army. This does not mean that our equipment is not uniform. In other words, the lack of uniformity in equipment is the smallest problem. Among us there are peasant soldiers, cadets from Baoding Military Academy, and the Eight Banners Cavalry maintained by the Manchu nobles in order to show their status. It is impossible to command such a chaotic army on the battlefield. We must unify them under one idea and one front."
 QIE_restart_beijing_charity_society_desc: "The combined turmoil in the eight provinces of East China and the Great Famine in Sichuan have superimposed on each other, causing a large number of refugees fleeing from famine to migrate northward and flood into the areas under our control. Officials from various places have reported that these helpless people with nothing to do are gradually becoming a hidden danger to social stability. The Luan State Council has now approved a plan to restart the Poor Relief Society, which was used to provide relief to victims during the Zhijiang-Anhui War."
 QIE_jesus_shed_his_blood_desc: "The benevolent Ye Zu received the order from the Supreme Saint Patriarch of the Innate Taiyi and came to the Yi Di to convey morality and goodness to them. He treated all people equally and educated those people with etiquette, righteousness and morality. Because of this, they regarded Jesus as a beacon of light who came among the Gentiles to spread etiquette and education. But there are still some people whose hearts are hard and do not accept moral education. Perhaps only pain will make them remember their mistakes."
 QIE_raise_the_long_blade_desc: "The benevolent Hui Ancestor received the order from the Supreme Saint Patriarch of the Innate Taiyi and came to the Yi and Di to convey morality and goodness to them. He treated everyone equally and educated those people with etiquette, justice and morality. He stood among them and swore an oath to them using the great road passed down to him by his ancestors. But some Hui people don't seem to appreciate it. When they see that we regard Hui ancestors as the ancestors of China, they become angry and go against our religious policies. We should correct them in the name of destroying unity."
 QIE_spring_and_autumn_ritual_desc: "Mount Tai is decaying, beams are decaying, and philosophers are withering. \nI came in singing and sat down at home."
 QIE_seize_the_great_game_desc: "My son is about to go into hiding and is forced to write a book for me. \nSo I wrote the first and second chapters of the book, talking about the moral meaning of more than 5,000 words, and then left, not knowing where it would end."
 QIE_union_the_world_as_the_country_desc: "Although our five-religion policy has some minor twists and turns, it proves that it is not unfeasible to establish a new pantheon-style religious system and have this religion controlled by the government - at least we can still control it now. On this basis, whether through communication or swords, if we can promote our teachings to other parts of the world, perhaps we can subtly make the entire world accept Chinese ethics and achieve true unification."
 QIE_introducing_funds_desc: "Now that we have decided to take on the debts of the previous government, why should we remain limited to Germany itself? We have a lot of debt and we have decided to maximize the benefits of existing international investment laws. In this way, we should be able to attract other foreign investment and further achieve economic growth. In addition, we may also be able to take this opportunity to conduct a secret military expansion."
 QIE_put_on_the_cloak_of_confucius_desc: "The cause of the February 7th riots in 1923 was that evil syndicalists infiltrated workers' groups and openly incited them to sabotage production. We must learn the lessons of last time, and to do this we will allow workers to organize themselves into general unions, with union leaders appointed by our government. In addition, we will also require the Federation of Trade Unions to conduct traditional classic reading sessions every week that must be mandatory to participate in to improve the ideological awareness of workers."
 QIE_develop_henan_desc: "Our infrastructure investment in Henan has paid off. With the smooth flow of transportation routes, more homeless people seeking a living ration have come to Henan to participate in the construction plan. We expect to build several factories in Henan, which will create more jobs and improve the overall industrialization level of the region."
 QIE_develop_zhili_desc: " Our infrastructure investment in Zhili has paid off. With the smooth flow of transportation routes, more homeless people seeking a living ration rushed to Zhili to participate in the construction plan. We expect that several factories will be built in the Zhili region, which will create more jobs and increase the overall level of industrialization in the region."
 QIE_final_industry_henan_desc: "Under the leadership and command of [ROOT.GetRulingParty] and through arduous struggle, Henan finally changed its past appearance of weak foundation and backward technology and became one of the important modern industrial bases in our country. All this is not only thanks to the employees who work day and night for the construction, but also thanks to [ROOT.GetLeader]'s forward-looking work-for-relief policy - it would be great if such an efficient and cheap labor force could always be used by us..."
 QIE_final_industry_xian_desc: "Under the leadership and command of [ROOT.GetRulingParty], after arduous struggle, Shaanxi finally changed its past situation of unchanged transportation and single and fragile industrial structure, and became one of the important modern industrial bases in our country. All this is not only thanks to the employees who work day and night for the construction, but also thanks to [ROOT.GetLeader]'s forward-looking work-for-relief policy - it would be great if such an efficient and cheap labor force could always be used by us..."
 QIE_final_industry_zhili_desc: "Under the leadership and command of [ROOT.GetRulingParty], after arduous struggle, the Zhili region finally changed its past appearance of developed Beijing and backward surrounding areas and became one of the important modern industrial bases in our country. All this is not only thanks to the employees who work day and night for the construction, but also thanks to [ROOT.GetLeader]'s forward-looking work-for-relief policy - it would be great if such an efficient and cheap labor force could always be used by us..."
 QIE_german_technology_desc: "Foreign investors and engineers left our country in a hurry because we defaulted on our debt, but they could not bring back all the documents. Moreover, during our short time together, these foreigners had taught our workers and engineers many modern industrial essentials, and with the help of these documents, we were able to start these machines ourselves."
 QIE_collaborate_with_german_companies_desc: "The Germans are still our largest investors. Compared with other less stable countries in Asia, there is a natural affinity between German assets and our country. With a little lobbying, it is not difficult to get these German assets to increase their investment in us. Our government will award government contracts to these enterprises to ensure that the cooperation between us is equal and stable, with foreseeable and abundant profits."
 QIE_free_schools_for_poor_desc: "Juesixuan School was first founded in Chaotian Palace, Nanjing by the branches of the New Religion of Salvation in the eight-province joint region. It is a primary school night school specially funded by the New Religion of Salvation for orphans and poor and helpless children. We should copy the model of Juese Xuan Xuezhai and provide compulsory education to those children who have fled. On the one hand, it can educate them, and on the other hand, it can also provide education in lieu of relief."
 QIE_develop_xian_desc: "Our basic investment in Shaanxi has paid off. With the smooth flow of transportation routes, more homeless people seeking a living ration have arrived in Shaanxi to participate in the construction plan. We expect to build several factories in Shaanxi, which will create more jobs and improve the overall industrialization level of the region."
 QIE_construction_after_chinese_unification_desc: "The history of our country has been written jointly by all ethnic groups since ancient times. The structure of the people of the five directions straightforwardly points out that the ethnic groups at the core of China should help the ethnic groups in the periphery just like an elder brother helps his younger brother. Now all the barbarians on the land of China have recognized that our government is the common master of the world. In order to commemorate the deep brotherhood between us and all ethnic groups, we will divide the nine states according to the ancient system and build monuments in the corresponding areas so that people can always remember that we saved them from division and war."
 QIE_research_and_development_department_desc: "Our military industrial research lags significantly behind the world level, and cutting-edge weapons will further establish our victory on the battlefield. To this end, we need to establish a military research institute to try to change the status quo. The location has been chosen in Luoyang, which is the training ground of General Wu Peifu."
 QIE_restart_desc: "In 1915, the Republic of China government built the Gongxian Arsenal in Xiaoyi, Shanxi. Since then, the Gongxian Arsenal has never been upgraded. In order to activate our national machinery and prepare for future wars, it is time to expand the military industry in Xiaoyi area."
 QIE_rebuild_the_officer_corps_desc: "We must admit this fact. Whether it is our army or the armies of other Chinese warlords, they are facing the same problem: a lack of good soldiers and a lack of good generals. Soldiers can be trained quickly, but officers can hardly be trained quickly. We will invite experienced military officers from countries and embassy cities that are friendly to us to guide us."
 QIE_the_legacy_of_zhili_desc: "Looking back at our combat experience since the 20th century, we will find that China's battlefields have always been dominated by determined infantry and eye-catching artillery. In the past, we relied on these two things to dominate the country. Today, we will still rely on these two things to re-engage in the struggle to compete in the world."
 QIE_iron_tank_law_desc: "In Russia, an idea called the \"New Cavalry\" was proposed. Its purpose is to take advantage of Russia's long-established Cossack cavalry and replace the horses with modern mechanized equipment so that they can continue to take advantage of their mobility. This has a common truth for the Eight Banners cavalry who have lived on horseback for a long time in our country."
 QIE_the_ocean_of_guns_desc: "An army can do without artillery and tanks if it wants to maintain combat power, but if bullets and guns are not enough, they can only engage in hand-to-hand combat. This will undoubtedly mean huge casualties, and we must ensure that we equip our soldiers with enough rifles so that they do not have to fight the enemy with their bare hands."
 QIE_let_the_cannons_roar_desc: "When we fight on the land of China, strong fire support is indispensable. Artillery, a cheap and powerful weapon, is exactly the equipment we urgently need. They will provide trusted assistance as our troops advance."
 QIE_establish_the_war_headquarters_desc: "Our country has almost no modern form of staff department. The long-term operational policy has been to provide senior generals with a general direction, and it is up to the generals themselves to plan and implement it. Each army group acting on its own has wasted a lot of our resources, and the military's operational planning burden is also quite heavy. We have established the Military Counselor's Office, modeled after the German General Staff, to study the various aspects of war and to plan for mobilization and operations."
 QIE_the_heavy_footsteps_of_the_iron_behemoth_desc: "The mythical creatures Gan Giants in \"The Classic of Mountains and Seas\" live in the Xiaoyang Kingdom. These huge man-eating monsters are indestructible and terrifying. We will create a large number of \"Gan Giants\" on the battlefield, and a large number of tanks will completely crush any enemy who dares to stand in front of us and act like a chariot."
 QIE_improve_the_material_system_desc: "Unlike the situation in Europe, the terrain of our territory is complex and varied, and the traffic situation is poor. This prevents our armored forces from being able to exert their full strength a lot of the time. But we have found a solution, by planning more \"special\" designs in civilian factories, we can quickly convert them into wartime supply centers that can be exploited when war starts."
 QIE_speed_is_the_only_useful_thing_desc: "Sun Tzu, our great military scholar, once said that when an army fights, it must strive for quick victory. If it takes a long time, the army will inevitably be exhausted. To this end, we must use various methods to increase marching speed and combat speed to avoid a stalemate in combat. If necessary, let them work hard to overcome it."
 QIE_solid_as_a_rock_desc: "Sun Tzu, our great military scholar, once said that when an army fights, it must strive for quick victory. If it takes a long time, the army will inevitably be exhausted. As long as we strive to strengthen the defense level of the army, the enemy will inevitably lose morale and weapons in vain if it cannot attack for a long time, and will eventually lead to failure. Faced with an impassable front and a never-ending supply of soldiers, they will eventually collapse completely due to internal social pressure."
 QIE_the_human_tide_desc: "He Zong and Lian Heng are ancient Chinese political strategies, but they can also be used in the art of war. The so-called joint vertical is to unite many weak people to defeat the opponent through wheel battles to prevent the strong enemy from getting a chance to breathe. We will use this strategy to make the enemy die from exhaustion!"
 QIE_fearless_soilers_desc: "Who allows people to live in peace? It's the country; who keeps people fed and clothed? It's the state; who gives people a job? It's the country. The people of [ROOT.GetName] look at Central Asia, look at the people in Khiva, and they will realize that they live in a happy country. However, those evil puppet governments and warlords try to destroy this tranquility. In order to repay the peaceful life given to people by the motherland, soldiers should take up arms and be brave enough to die. Only in this way can their families enjoy this blessing longer."
 QIE_increase_military_production_desc: "Speaking of the military academy that China is most proud of, it must be Baoding Military Academy. Thanks to the development of the past ten years, Baoding Military Academy has now developed into a military complex. Our next plan is to further expand the military industry in Baoding area so that it can continuously provide necessary weapons for our war plan."
 QIE_elite_soldiers_desc: "He Zong and Lian Heng are ancient Chinese political strategies, but they can also be used in the art of war. The so-called continuous attack is to use elite troops to quickly destroy the enemy's weak areas, thereby making the enemy as a whole weaker and more vulnerable to attack by our elite troops. We will use this strategy to make the enemy die in fear!"
 QIE_against_airborne_enemies_desc: "Recent wars have made people aware of the importance of aircraft. Unfortunately, our enemy - [JAP.GetName] has a large number of aircraft, and our own aviation power is nothing more than a few wings in Luoyang and Beijing. Building a sky force from scratch that can confront the Japanese head-on is a fantasy for us now. Fortunately, we have a cheap alternative: anti-aircraft guns."
 QIE_against_tanks_desc: "Our enemies may have powerful armored fighting vehicles, but so what? A tank requires an expensive investment, but we can easily pose a threat to them by simply equipping it with old World War-era artillery."
 QIE_eye_of_the_immortal_desc: "There is no doubt that the key to the German Army's success in the world wars was their ability to brilliantly coordinate large-scale operations to achieve separate and mutually unified strategic objectives, which required a technology called radio. In addition, we will also use the Chinese people's own wisdom to further obtain information."
 QIE_establish_modern_intelligence_department_desc: "Intelligence is indispensable to a competent war plan. The German state has Department IIIb, and the reactionary pseudo-French regime has its General Intelligence Service. On the other hand, although we have trained many spies, we have never established an organization to systematically analyze the intelligence we have obtained. It's time to change that so we can gain the upper hand in war."
 QIE_become_MP_shadow_desc: "Most of the hard-line CCP members have been purged by us in the Forbidden City coup. Most of the people who remain in the Royalist Party today are Manchu nobles with a lot of industrial wealth. Ultimately they don't care who the ruler is, as long as the current regime protects their property and makes them rich. If we cooperate with them, we have to take their interests into consideration. If there is a crisis that causes problems with their products or wealth, we will definitely pay the price."
 QIE_become_CERA_shadow_desc: "The Association to Save the Qing Emperor was a political party with a wide audience and was deeply supported by farmers and some urban intellectuals. At the end of the day it's just a big tent party filled with a bunch of cynical, sanctimonious hypocrites. It may be in our best interest to work with this group of moderates, who will happily support our regime as long as we can provide some semblance of benefit to the general population."
 QIE_become_YCP_shadow_desc: "The Young China Party is mainly composed of young trainees from Baoding Military Academy and some urban intellectuals and provides funds to maintain its operations. They have long championed the cause of nationalism and are committed to strengthening centralization and industrialization. At this point, it seemed like we were a good fit to work with them. But be careful, these passionate young people will be hostile to any foreign forces. If we make the wrong choice, they may in turn harm us."
 QIE_wushan_common_polit_16_desc: "Liu Gonggong went to Youzhou, Fang Huandou went to Chongshan, fled three seedlings to Sanwei, killed Gun in Yushan, and the world was convinced of his four sins."
 QIE_old_chinese_beliefs_reborn_desc: "The words of the saints and sages have finally broken through the thick scab formed by the long-term influence of Western ideas and wars among our people. Now the traditional Chinese virtues are once again filled in the hearts of our people. They are ready to defend traditional culture, defend the motherland, and defend our government."
 QIE_and_new_beliefs_live_in_here_desc: "The propaganda campaign we launched against the two \"foreign ancestors\" was effective. By explaining to them that these ancestors actually inherited the beautiful Chinese culture, people at least no longer were as hostile to these foreign gods as they were during the Gengzi Rebellion. However, another voice has emerged among the people. They believe that Western regimes are cultural thieves who have plagiarized the virtues and knowledge of the Chinese people and fabricated \"religion\" to cover up their actions. We might be able to tap into this emerging spirit of nationalism."
 QIE_seances_restart_in_beijing_desc: "It was the auspicious day of the Eighth Meeting, and the great sages and gods of the heavens went to the palace on Yujing Mountain in Lingbao Xuandu to celebrate Tianzhen. In the Luzu Pavilion in Yanjing, members of the New Religion of Salvation also wrote and respectfully requested the masters of the Five Teachings to save mortals from the sea of ​​suffering and preach morality to the mortal world. However, today is different from the past. The power of the capital has fallen into the hands of my peers. Whatever we do will be reflected in society and the mountains and rivers."
 QIE_restore_the_order_behind_shanhaiguan_desc: "China has long been divided by ambitious strongmen and local factions with evil intentions. As the only legal government in China, we will send telegrams to the warlords, leftists and even revolutionary gangsters on one side of the separatist regime, asking them to lay down their arms and surrender immediately. But if they do not accept even this last mercy, we will raise an army to attack them and destroy these tyrants."
 QIE_eliminate_traitors_in_the_south_desc: "The \"United Provinces Movement\" was essentially just a product of rationalized local warlord separatism. Those naive intellectuals who had been poisoned by Western ideas actually supported this division disguised as unity. China has advocated great unification since ancient times, and there can never be two supreme rulers in a country. The Federal Provincialists are actually pests that undermine the unification of China. We will eliminate these bandits."
 QIE_destory_the_red_flag_desc: "During the Bingyin period, we defeated Sun Wen and his evil socialist thieves. This group of defeated soldiers abandoned their armor and ran to France to find a place to rest. Now they are making a comeback and are committing violence in the name of revolution on the land of China. We're going to eliminate these bad guys, and this time we're going to root them out to make sure these hateful criminals can never make waves again."
 QIE_advance_to_the_shanhaiguan_desc: "The Zhi-Fengtian War could be called a battle between two strong men, but the evil Zhang Zuolin could not accept his defeat with dignity. He fled back to Fengtian, where he knelt down to the Japanese and planned to dedicate the entire China to his foreign masters. We must kill this traitor!"
 QIE_universal_education_for_poor: "Ti Yan University Hall"
 QIE_revenge_for_1928: "The Shame of Yixuewuchen"
 QIE_revenge_for_1928_desc: "\"Open door, equal opportunity.\" In 1928, the imperialists led by Americans forcibly divided our country in the name of doing business. These concessions are obviously our country's land, but our people cannot enter and exit freely. As long as the embassy city exists, it will be a shame for us."
 QIE_the_dawn_of_loong_the_dusk_of_thieves: "The blue dragon flies into the sky, the villain hides his eyes"
 QIE_ws_jiang_chao_zong: "Jiang Chaozong"
 QIE_ws_jiang_chao_zong_bio: "Jiang Chaozong was born in a poor rural family. In his early years, he had to give up his studies due to family poverty and instead worked as a pawnshop apprentice at the \"Jixun Dian Shop\" opened by Liu Mingchuan, the future governor of Taiwan. Soon after, he joined Liu Mingchuan's Huai Army. In 1884, he participated in the Sino-French War, defeated the French army under the command of Liu Mingchuan, and recovered Keelung, Taiwan. \n\nDue to his heroic performance in the war, Jiang Chaozong was promoted to naval commander. During the Sino-Japanese War of 1894-1894, Jiang Chaozong followed Yuan Shikai and went to the front line to scout the movements of the Japanese army for the Qing army. Later, he participated in the establishment of Yuan Shikai's new Beiyang Army. His series of military exploits led to his promotion to the rank of second-grade general soldier in Hanzhong Town, Shaanxi Province. During the Revolution of 1911, he returned to Beijing from Shaanxi and served as an army staff officer under Yuan Shikai. In 1913, he was promoted to the commander of the fifth patrol battalion of the Nine Gate Infantry Army - commonly known as the \"Nine Gate Admiral\", and became the supreme defender of Beijing. \n\nWhen Zhang Xun entered Beijing and launched the first restoration of Xuantong, Jiang Chaozong, who was the governor of the Nine Gates, supported Zhang Xun and attended the restoration meeting. It was also there that he came into contact with Zheng Xiaoxu, Tong Jixu and others. However, after Duan Qirui took the oath at the racecourse, Jiang Chaozong sent a secret message to Duan Qirui to support him in launching an army to attack Zhang Xun. When Zhang Xun's defeated soldiers tried to enter Beijing, Jiang Chaozong blocked all nine gates, causing them to be completely annihilated by Duan Qirui. \n\nAfter this incident, Duan Qirui dismissed Jiang Chaozong from his position as the nine-door admiral and instead named him \"General Diwei\" to sideline him. It was after this incident that Jiang Chaozong met the Henan folk religion-New Religion of Salvation who was looking for a financial sponsor... \n\n§Y Note: Jiang Chaozong was amiable on the surface, but in fact he was ruthless and a pure opportunist. Yuan Kewen, the son of Yuan Shikai, once revealed that he had spread his minions widely and committed countless unjust killings. \nHe even tried to frame Yuan Kewen as a KMT spy and kill him. §!"
 QIE_ws_jiang_chaozong_leader_desc: "§YBorn:§!§L1861; Qing Dynasty, Ningguofu, Anhui Province§!\n§YBackground:§!§L$QIE_ws_jiang_chao_zong_bio$§!"
 QIE_ws_jiang_chaozong_advisor_desc: "§Y Born: §!§L1861; Ningguofu, Qing Dynasty, Anhui Province§!\n§Y Faction: §!§LNo faction§!\n§YBackground:§!§L Jiang Chaozong was born in a poor rural family. In his early years, he had to give up his studies because of his poverty, and became a pawnshop apprentice at the \"Jixun Dian Shop\" opened by Liu Mingchuan, the future governor of Taiwan, and soon joined Liu Mingchuan's Huai Army. In 1884, he participated in the Sino-French War, defeated the French army under the command of Liu Mingchuan, and recovered Keelung, Taiwan. \n\nDue to his heroic performance in the war, Jiang Chaozong was promoted to naval commander. During the Sino-Japanese War of 1894-1894, Jiang Chaozong followed Yuan Shikai and went to the front line to scout the movements of the Japanese army for the Qing army. Later, he participated in the establishment of Yuan Shikai's new Beiyang Army. His series of military exploits led to his promotion to the rank of second-grade general soldier in Hanzhong Town, Shaanxi Province. During the Revolution of 1911, he returned to Beijing from Shaanxi and served as an army staff officer under Yuan Shikai. In 1913, he was promoted to the commander of the fifth patrol battalion of the Nine Gate Infantry Army - commonly known as the \"Nine Gate Admiral\", and became the supreme defender of Beijing. \n\nWhen Zhang Xun entered Beijing and launched the first restoration of Xuantong, Jiang Chaozong, who was the governor of the Nine Gates, supported Zhang Xun and attended the restoration meeting. It was also there that he came into contact with Zheng Xiaoxu, Tong Jixu and others. However, after Duan Qirui took the oath at the racecourse, Jiang Chaozong sent a secret message to Duan Qirui to support him in launching an army to attack Zhang Xun. When Zhang Xun's defeated soldiers tried to enter Beijing, Jiang Chaozong blocked all nine gates, causing them to be completely annihilated by Duan Qirui. \n\nAfter this incident, Duan Qirui dismissed Jiang Chaozong from his position as the nine-door admiral and instead named him \"General Diwei\" to sideline him. It was after this incident that Jiang Chaozong met the Henan folk religion-New Religion of Salvation who was looking for a sponsor... \n\n§Y Note: Jiang Chaozong was known as \"Huiji\" in the Salvationism Protestantism, and was an early financial sponsor and member of the Salvationism Protestantism. He was the main driving force behind the development of New Religion of Salvation in Beijing with so many upper-class people. §!"
 QIE_ws_wu_pei_fu: "Wu Peifu"
 QIE_ws_wu_pei_fu_bio: "Wu Peifu was born into a merchant family. He studied surveying and mapping at the Baoding Army Crash Course and became a captain during the Russo-Japanese War. He later joined the New Army, served under Cao Kun, and performed outstandingly during the Revolution of 1911. \n\nDuring the War to Protect the Country, Wu Peifu fought with Cai E and barely defeated Cai E's troops. In 1918, the Beiyang government launched its southern expedition. The Third Division commanded by Wu Peifu captured Changsha, but Hunan Province was later handed over to Zhang Jingyao of the old Anhui clique. Wu Peifu and Cao Kun then conspired and decided to overthrow Duan Qirui's old Anhui warlord. In the Zhi-Anhui War, Wu Peifu led his army to achieve a decisive victory. \n\nWu Peifu became the first Chinese to appear on the cover of Time magazine and was called \"China's Strongest Man.\" In 1922, he tried to establish a reformist \"good guy cabinet\", but failed due to internal differences and Cao Kun's opposition. After being betrayed by Feng Yuxiang in 1924, Wu Peifu defected to Zhao Hengti and returned to North China in 1926, defeating the National Army. \n\nDuring the Northern Expedition, Wu Peifu and Zhang Zuolin formed the \"Anguo Army\" to resist the National Revolutionary Army and achieved a complete victory. He then competed with the Feng clique warlords for control of Beijing and defeated the Feng clique in the third and fourth Zhili-Fengtian wars. \n\nAlthough Wu Peifu opposed the restoration of the Qing court in 1928, he was able to flourish in this new government structure, maintaining Beiyang's dominant position while marginalizing the royalists. \n\nAfter the Salvation Church successfully seized power, Wu Peifu returned to the Salvation Church as the head of the Council, and eventually won the power struggle and established his leadership position. As he himself discussed in his work \"Explanation of the Great Learning\" published by the Beijing Ming Jing Society, he would revive the teachings of Confucius and Mencius in China, and ultimately planned to build a democratic republic with Chinese characteristics. \n\n§YRemarks: Wu Peifu is ambitious, firm in faith, loves the motherland, and desires to realize democracy and republic in China in the future. \nWu Peifu highly admired George Washington's great achievements and cast himself as a hero in rebuilding the republic. §!"
 QIE_ws_wu_peifu_leader_desc: "§YBorn:§!§LApril 22, 1874; Qing Dynasty, Penglai, Shandong Province§!\n§YBackground:§!§L$QIE_ws_wu_pei_fu_bio$§!"
 QIE_ws_qian_neng_xun: "Pu Ming Zheng Hua Zhenren"
 QIE_ws_qian_neng_xun_bio: "Qian Nengxun was born in a family of poets and writers, and his elders were important officials of the Qing government. This allowed him to rely on the grace system to be promoted to an official candidate early. In 1898, Qian Nengxun became a Jinshi, was awarded the Imperial Academy, and later served as the chief envoy of Shaanxi. \n\nIn 1910, upon the recommendation of Xu Shichang, Minister of Military and Aircraft, Aixinjueluo Zaifeng canonized Qian Nengxun as Minister of Frontier Affairs and concurrently as Governor of Shaanxi. With the outbreak of the Revolution of 1911, Qian Nengxun conducted a large-scale search for revolutionaries in Xi'an to maintain his rule. After the revolutionary army captured Xi'an, he collaborated with Xi'an generals in an unsuccessful attempt to recapture the city. Seeing that the situation was over, he planned to commit suicide to apologize, but was discovered by the revolutionary army. \n\nDuring the first restoration of Xuantong, Qian Nengxun attended the restoration meeting and became the left minister of the Ministry of Agriculture and Industry. On December 14, 1918, Qian Nengxun was appointed Prime Minister of the Republic of China, and formed a new cabinet with Lu Zhengxiang, Cao Rulin, and Lu Zongyu. However, as the \"Twenty-One Negotiations\" with the Empire of Japan the following year failed to achieve satisfactory results, the entire cabinet collapsed. \n\nAfter being forced to resign, Qian Nengxun joined the New Religion of Salvation under the introduction of Jiang Chaozong. Influenced by Xu Shichang, he was very interested in Lu Dongbin and took the lead in many of Lu Dongbin's immortal photography and Fuqi questioning. Lu Dongbin also used an oracle to inform everyone that Qian Nengxun was the leader of the new world-salvation religion. In 1924, Qian Nengxun passed away. Witnessed by the founder of the Five Teachings and Lu Dongbin, Qian Nengxun ascended to heaven and was \"given the title of Master of Jinque Lianxuan and the title of Puming Zhenghua Zhenren\". Nowadays, scandals broke out between Jiang Chaozong and Wu Peifu due to the power struggle, which put both parties in an extremely unfavorable situation. Qian Nengxun couldn't bear to see the two fighting so hard and destroying the brotherhood within the sect, so he deliberately descended from heaven and once again guided the sect as the leader. \n\n§YNote: Qian Nengxun’s portrait has absolutely no power. In the final analysis, it is just a rubber stamp for Beiyang technocrats such as Gong Xinzhan and Li Sihao. \nAll they can do is try their best to maintain a balance, but in order to make significant progress, they may have to be at the mercy of Jiang Chaozong or Wu Peifu...§!"
 QIE_ws_qian_nengxun_leader_desc: "§YBorn:§!§L1870; Qing Dynasty, Jiashan County, Zhejiang Province§!\n§YBackground:§!§L$QIE_ws_qian_neng_xun_bio$§!"
 QIE_ws_tang_er_he: "Tang Erhe"
 QIE_ws_tang_er_he_bio: "The famous intellectual and \"Six Pines Old Man\" Tang Erhe was a very special official in Sun Chuanfang's inner circle. He studied classics since he was a child, received private education, and was a talented student. In 1903, Tang Erhe went to Japan to study military affairs at Chengcheng School. During his stay in Japan, he actively participated in anti-Qing and anti-imperialist activities and joined the Tongmenghui. In 1904, he worked as a music teacher at Zhejiang University. Three years later, he went to Japan to study medicine again and studied at Kanazawa Medical College. He then went to study abroad at the University of Berlin in Germany and obtained a doctorate in medicine. \n\nAfter returning to China, Tang Erhe served as a physician and medical director in many institutions. During this period, he founded Zhejiang Hospital and participated in the Revolution of 1911. He later founded the National Beijing Medical College and served as its principal. In 1915, he initiated the establishment of the Medical Society of the Republic of China. In 1920, he was sent to Europe to investigate medicine. After returning to China in 1922, he served as deputy minister of education. \n\nAfter the Great Kantō Earthquake in Japan in 1923, Tang Erhe went to Japan as a condolence envoy of the Red Cross Society of China. Later, he served as the Director-General of Education in the \"Good Guy Government\" established by Wang Chonghui with the support of Wu Peifu. In 1925, Tang Erhe and Wang Jingwei had a brief debate on whether Sun Yat-sen's condition should be treated with traditional Chinese medicine or Western medicine. He sided with Western medicine. In 1926, Tang Erhe was appointed Minister of the Interior, and in 1927 he was appointed Minister of Finance. \n\nIn 1929, Tang Erhe received a doctorate in medicine from Tokyo Imperial University, Japan. After returning to China, he held various positions in the southern government. After receiving the invitation letter from Jiang Chaozong, Tang Erhe Beishang joined the Beiyang Government. \n\nNow that China has been unified, the New Religion of Salvationes have unexpectedly given up their control over China in an attempt to return power to a new democratic republican government. The interim transitional government elected Tang Erhe as chairman, which put the old man under a lot of pressure. \n\n§YNote: Tang Erhe is not a member of the New Religion of Salvation, nor is he interested in things about ghosts and gods. Although he believes that the theory of ghosts and gods is a way to comfort others, he himself firmly believes in the power of modern science.\n\nTang Erhe and Jiang Chaozong got acquainted through their condolences for the Great Kanto Earthquake in Japan in 1923. At that time, Jiang Chaozong and other representatives of the New Religion of Salvation also went to Japan to carry out international disaster relief activities. §!"
 QIE_ws_tang_erhe_leader_desc: "§YBorn:§!§L1878; Qing Dynasty, Hangzhou Prefecture, Zhejiang Province§!\n§YBackground:§!§L$QIE_ws_tang_er_he_bio$§!"
 QIE_buddhism_stage_2: "Thousand-leaf Lotus"
 QIE_confucism_stage_2: "Happy gentleman"
 QIE_jesus_stage_2: "light for the Gentiles"
 QIE_mohammad_stage_2: "Oath to the fallen stars"
 QIE_wushan_military_end: "Be taught and punished"
 QIE_wushan_military_end_desc: "If education is insufficient, punishment and killing will follow. After a series of reforms, [ROOT.GetName]'s army has been reborn and will become a sharp sword. These warriors are always ready to regain the land and resources that should belong to them for the people of [ROOT.GetName] - as long as their ruthless offensive has not reduced them to nothing."
 QIE_after_wushan_control_whole_china_luoyang_building: "Recast Luoyang's Cauldron"
 QIE_wushan_after_china_reborn_CERA: "Separation and Rescue Society"
 QIE_wushan_after_china_reborn_YCP: "Kill national traitors"
 QIE_wushan_after_china_reborn_MP: "Invest in Xungui Enterprises"
 QIE_wushan_after_china_reborn_YCP_desc: "It's time. Now that China has been unified and our prestige among the people has reached its peak, we no longer need to rely on al-Shabaab to increase our legitimacy. These chattering young people have long criticized our policies and scorned our support activities. Now we will dismantle them once and for all and find our own peace and quiet."
 QIE_wushan_after_china_reborn_CERA_desc: "It's time. Now that China has been unified and our prestige among the people has reached its peak, we no longer need to rely on the Imperial Constitutional Association to enhance our legitimacy. In the final analysis, the Imperial Constitutional Association is just a broad tent - which means that there must be various small groups and competing interests within it. We can easily destroy their union by simply dividing and conquering them and driving a wedge between them."
 QIE_wushan_after_china_reborn_MP_desc: "It's time. Now that China has been unified and our prestige among the people has reached its peak, we no longer need to rely on the Socialist Party to increase our legitimacy. In order to reasonably seize the benefits from these old people, the New Religion of Salvation has planned a charity dinner. At the dinner, we will announce new business policies. By \"voluntarily\" issuing more equity and purchasing it by the state, we can control their industries."
 QIE_after_wushan_control_whole_china_luoyang_building_desc: "Since the beginning of the world, the ruler of mankind has been sitting at the center of the world, controlling the areas from all directions that assist him. To most people this is just a myth, but it contains a hint of destiny. Now that we have pacified the world and followed the will of the people to become the wise king of all ages, we should follow the system of this ancient era and move our governing body to the center of the world - Luoyang. In this way we can prove to our people that the kingdom of the Three Sovereigns and Five Emperors and the virtuous Emperor Zhou has indeed come to them."
 QIE_wushan_punishment_those_enemies: "avenger's letter"
 QIE_industry_focus_rely_on_foreigner_country: "Cooperation construction plan"
 QIE_industry_focus_independent_planned_economy: "Fund doubling plan"
 QIE_decide_adopt_forced_producing_plan: "production index labor system"
 QIE_decide_adopt_247_producing_plan: "Twelve-hour work system"
 QIE_adopt_start_coal_mining_search: "secure fuel"
 QIE_adopt_start_steel_producing_search: "Construction of Beijing Iron and Steel Machinery Plant"
 QIE_adopt_start_steel_producing_search_desc: "Our country's steel industry is currently in its infancy. During the period when the Harmony Society controlled the government, our country mainly imported high-quality steel from the Germans. We must change this status quo and establish our own steel industry. It would be very helpful if overseas businessmen are willing to help us, otherwise we are all on our own."
 QIE_adopt_start_tungsten_producing_search: "Mining strategic metals"
 QIE_seize_the_gold_mine: "Repurposing rebel funds"
 QIE_wushan_china_united_again_lower_phase_desc: "Our beloved President of the Republic, Doctor Tang Erhe were shot to death in public! People spontaneously took to the streets, crying for Chairman Tong, and wanted those who conspired to kill him and destroy this hard-won joy to pay the price. [ROOT.GetLeader] has once again taken over the responsibility of the leader of the Republic. He will continue to hunt until all the subversive elements lurking among us and destroying the peace are eradicated. If the enemies come from outside, [ROOT.GetLeader] also announced that they will definitely pay the price!"
 QIE_wushan_china_united_again_lower_phase: "Five virtues from beginning to end"
 QIE_the_government_which_wave_foreigners: "A decent government with a smile on its face"
 QIE_wushan_jiang_establish_the_editing_and_translation_department: "Restoration of Translation Studies Institute"
 QIE_wushan_jiang_fanatics_militia_for_master: "Tuan Yong governs the countryside"
 QIE_wushan_jiang_confirmed_as_the_leader: "Master of Siwuxuan"
 QIE_wushan_jiang_confirmed_as_the_leader_desc: "Under Jiang Chaozong's wise governance, our country's social situation not only stabilized, but also won the respect and friendship of surrounding countries. All of this is enough to prove that only Jiang Chaozong can save the building from collapse, and only Jiang Chaozong can lead the North China government to realize the dream of unifying China."
 QIE_wushan_wu_our_precious_traditional_culture: "precious tradition"
 QIE_wushan_wu_enforcing_ethics_through_military_orders: "moral police"
 QIE_wushan_two_leader_the_order_of_non_speaker: "Repair relations with industrialists"
 QIE_wushan_reassess_the_financial_situation: "Encourage farmers’ associations"
 QIE_wushan_the_new_government_reviving_tradition: "A new government that revives tradition"
 QIE_wushan_the_new_government_reviving_tradition_desc: "There are many careerists in China, but there are very few who can ultimately dominate the country. Our government must demonstrate its strength and ambition to the public, and avoid being compared to short-lived, tyrannical regimes."
 QIE_wushan_establish_fair_social_standards: "Carry forward moral governance and benevolent governance"
 QIE_wushan_revise_cautions_laws: "Restoring bank credit"
 QIE_wushan_restore_abolished_positions: "Empowering local associations"
 QIE_wushan_forcing_prisoners_to_work: "Revisiting Bachelor’s degree from Jingqing"
 QIE_wushan_contact_with_the_social_elites: "win over intellectuals"
 QIE_wushan_restore_squire_council: "Restart the Gentry Council"
 QIE_wushan_negotations_with_YCP: "Take great strides forward for a new China"
 QIE_wushan_negotations_with_YCP_desc: "Both [ROOT.GetLeader] and representatives of the Young China Party acknowledge that today's North China government needs to launch a dramatic overhaul of state-owned enterprises and military industries. [ROOT.GetLeader] praised the Chinese Youth Party for its accurate insight into the current social ills in China, and welcomed the Youth Party to provide more solutions for social construction and governance."
 QIE_wushan_negotitations_with_CERA: "What matters is the happiness of the majority"
 QIE_wushan_negotitations_with_CERA_desc: "Both [ROOT.GetLeader] and representatives of the Imperial Constitutional Association acknowledge that long-term warlord warfare has left our rural areas vulnerable, leaving large tracts of land unused and abandoned. Farmers are our foundation, and improving the situation of farmers means improving the situation of the North China government. [ROOT.GetLeader] praised the Imperial Constitutional Association for its accurate insight into the current social ills in China, and welcomed the relevant people of the Imperial Constitutional Association to provide more solutions for social construction and governance."
 QIE_wushan_negotitations_with_MP: "Ensure the interests of domestic entrepreneurs"
 QIE_wushan_negotitations_with_MP_desc: "Both [ROOT.GetLeader] and representatives of the Socialist Party admitted that most of our country's livelihood industries are actually under German control, but this is not a bad thing. By cooperating with German companies, we may be able to improve the various levels of our own companies, thus accelerating our country's industrialization process. [ROOT.GetLeader] praised the Royalist Party for its accurate insight into the current social ills in China, and welcomed the Royalist Party and wise nobles to provide more solutions for social construction and governance."
 QIE_wushan_wu_confirmed_as_the_leader: "Mr. Justice Court"
 QIE_wushan_prepare_blow_up_the_dam: "Imitate Wang Ben’s old story"
 QIE_wushan_prepare_blow_up_the_dam_desc: "In the 22nd year of the Qin Dynasty, Wang Ben led an army of 600,000 to attack Wei and surrounded Daliang, the capital of Wei. Then he diverted water from the Yellow River into the capital of Wei. The flood soaked the entire city for more than three months, completely erasing Wei from the Central Plains. If one day, invaders who are eyeing Chinese civilization invade Cangxian-Baoding, we can follow the strategy of our ancestors and dig the Yellow River dam to delay the enemy's advance and gain more opportunities for us to counterattack."
 QIE_seize_the_gold_mine_desc: "The Ministry of Finance has put forward a very useful idea after we unify China: the \"Kunpeng Plan\". We will recover the wealth and gold of the puppet government, part of which will be used to continue our unification cause, and the other part will be used to fund the reconstruction of the military-industrial system after the war."
 QIE_integrate_existing_MIO_resources: "The Birth of the July 14th Ordnance Industry Administration"
 QIE_wushan_now_has_fallen_into_ancient_ice: "Now trapped in an ancient ice prison"
 QIE_wushan_the_dream_jiang: "Mr. Jiang Si’s Dream"
 QIE_wushan_the_dream_wu: "Wu Xiaogui'er's Bubble"
 QIE_wushan_now_has_fallen_into_ancient_ice_desc: "The clock is ticking, and the mad dream of salvation has come to an end. Everyone has his due reward, and it stands to reason that the defeated will be left empty-handed. Everyone has his own retribution, let's see who can persevere to the end!"
 QIE_wushan_china_airforce_coming: "Departing from Luoyang"
 QIE_the_project_of_white_horse: "\"White Horse\" plan"
 QIE_wushan_the_great_beast_industry: "The Awakening of the Industrial Behemoth"
 QIE_wushan_the_great_beast_industry.tt: "§CThis will end the 714 Ordnance Administration's polling, and all of our current breakthroughs will trigger a chain reaction in the future. \n\nWhen we finish the polling, we will strengthen the Jiangnan Shipbuilding Headquarters. \n\nWhen we finish polling, we will strengthen the Luoyang Aviation Department and strengthen the national policy effect of §YChongming Bird, Soaring in the Sky§C. \n§!§W"
 QIE_wushan_long_honed_tactics: "Time-tested traditional tactics"
 QIE_wushan_remembering_lessons_of_the_new_army: "Remember the lessons of 1911"
 QIE_wushan_restart_small_station_drill_ground: "Promote the spirit of the small station"
 QIE_wushan_the_new_right_army_imperial_guard: "Inherit the mantle of Wuwei Youjun"
 QIE_embrace_new_tactics: "Embrace new tactics"
 QIE_wushan_the_war_of_sciences: "scientific war"
 QIE_wushan_new_type_squad_tactics: "New team tactics"
 QIE_wushan_sturmtruppen: "Comet hits the moon"
 QIE_wushan_union_between_loong_eagle: "Long Xiang Ying Yang"
 QIE_wushan_union_between_loong_eagle_desc: "Under the wise leadership of [QIE.GetLeader], the strong and brave army and people eliminated all invading enemies, but there are still people who are secretly dissatisfied with this new country. These people are most likely the remnants of syndicalism and the minions of the warlords who are still loyal to their dead masters. It is too difficult for us alone to deal with everyone. We should ally with our old friend, Germany, and establish an alliance based on Beijing and Berlin across the entire Eurasian continent."
 QIE_wushan_great_loong_stand_on_east: "Lonely Dragon in the East"
 QIE_wushan_great_loong_stand_on_east_desc: "In the end, under the leadership of [QIE.GetLeader], we defeated all enemies who dared to attack us from the front. Their dripping blood served as a warning to those enemies who wanted to continue to challenge our \"kingly way\". These despicable people are now playing tricks in the dark to harm our unified country. But it doesn't matter, the green dragon has awakened, and it will stand in the east and look down on the whole world."
 QIE_wushan_penetrate_and_infiltrate_the_enemy: "Smart as water"
 QIE_decisive_battle_with_the_enemy: "Invasion like fire"
 QIE_wushan_the_project_of_yi: "Hou Yi's Operation"
 QIE_wushan_the_project_of_yi_desc: "The evil Japanese invaders finally no longer concealed their greed for the vast continent. Since ancient times, it has been difficult for the people of the islands to coexist peacefully with the people of the mainland for a long time. China once educated the Japanese with etiquette and morality, enabling these barbarians to escape from ignorance. However, these educated and ungrateful white-eyed wolves are now pointing their guns at their former division commanders. Take up arms and kill these shameless guys! Japan must be destroyed!"
 QIE_invasion_from_sea: "attack from sea"
 QIE_invasion_from_sky: "falling from the sky"
 QIE_wushan_prepare_the_pink_plan: "Prepare for sunset"
 QIE_wushan_prepare_the_pink_plan_tt: "§CIf we complete this national policy, its impact will continue to our subsequent reconstruction of China. §!"
 QIE_wushan_the_project_code_jianzhen: "Prepare for eastward crossing plan"
 QIE_wushan_salt_and_land: "salt and earth"
 QIE_wushan_air_force_academy: "Establish [ROOT.GetName] Aviation Academy"
 QIE_wushan_wu_our_precious_traditional_culture_desc: "The culture of Confucius and Mencius is the great traditional culture of our Chinese nation. However, many intellectuals and young people who have accepted rotten foreign ideas believe that their own pearls and jade should be smashed and enshrined as other people's rubble. We will launch national newspapers to promote these beautiful traditional cultures, and implement relevant teaching and assessment in private schools and new schools, thereby injecting the Confucian spirit into the Chinese nation again."
 QIE_wushan_restore_squire_council_desc: "Western ideas have destroyed my country's stable rural structure and abolished China's long-standing gentry-clan management system. This is one of the reasons why my country's society has fallen into turmoil. We will reopen the meeting of the gentry at the county level and actively play the role of these rural intellectuals in explaining social norms and spreading moral culture, thereby helping the government better manage rural areas."
 QIE_seances_restart_in_beijing.tt: "§LEverything about the New Religion of Salvation began with the death of Immortal Lu Dongbin in 1919. Now that we have taken control of the entire North China government, we should enshrine Lu Dongbin as a \"virtual king\" and set up a throne for him in our government that symbolizes the national advisor, placed to the left of the currently vacant emperor's throne. Of course, there will never be a §Rliving§! on this throne, never...§!\n\n"
 QIE_seize_the_great_game.tt: "Through this, we will establish the noble status of the Taoist ancestors in the minds of the people. \nThis will make it less likely that our §Rforeign policies will undermine political stability§!. And when the altar writes §C Daozu§!, it will receive additional reinforcements based on its education level."
 QIE_into_samadhi.tt: "Through this, we will establish the noble status of the ancestors of the Buddhist family in the minds of the people. \nThis will make people more able to spontaneously maintain §Rthe basic stability of society§!. And when the altar writes §CBuddha§!, it will receive additional reinforcements based on its education level."
 QIE_spring_and_autumn_ritual.tt: "Through this, we will establish the noble status of the Confucian ancestors in the minds of the people. \nThis will allow us to reduce the resistance to promoting policies and gain more §Rpolitical resources§!. And when the altar writes §CConfucian Ancestor§!, it will receive additional strengthening according to its education level."
 QIE_jesus_shed_his_blood.tt: "Through this, we will establish the noble status of the ancestors of the Ye family in the minds of the people. \nThis will make the people in the areas we occupy more §Rwilling to cooperate with us and accept our rule§!. And when the altar writes §CYezu§!, it will receive additional strengthening according to its education level."
 QIE_raise_the_long_blade.tt: "Through this, we will establish the honorable status of our ancestors back home in the minds of the people. \nThis will allow our soldiers to organize attacks and charges more §Rheroically§!. And when the altar writes §CHuizu§!, it will receive additional reinforcements based on its education level."
 QIE_ws0_tt: "§REveryone is waiting for news from the capital...§!"
 QIE_ws1_tt: "New Religion of Salvation must look to deal with the current chaos, but a quarrel began within the order over who should be its political leader. \n\n§RNow Jiang Chaozong and Wu Peifu have begun to compete for the leadership position... This is a rapid and uninterruptible process. \n\nBut if the two of them end up in a stalemate, it may lead to unexpected results. \n§!"
 QIE_ws2_tt: "§C Jiang Chaozong and Wu Peifu both suffered losses and had to admit that Qian Nengxun was their only religious lineage, and the New Religion of Salvation would be jointly managed by the two. Its future is still unclear. §!"
 QIE_become_MP_shadow_tt: "§CSince the beginning of the Republic of China, rituals and music have collapsed, all because they abandoned the principles and followed the Western style. Now, with the new religion of salvation as the body and the actual supervision of the country, we will promote the king's way in the world and establish the dynasty in the world. In the future, when the world is rebuilt, the Great Qing Dynasty will still be worshiped, the Holy Lord will bow down, and the royal way will be honored. §!\n§YThe New Religion of Salvation will integrate the political situation under a new name. §!"
 QIE_become_CERA_shadow_tt: "§tThe civil rights cannot be taken lightly, and the monarch cannot be dispensed with. §!\n§YThe New Religion of Salvation will integrate the political situation under a new name. §!"
 QIE_become_YCP_shadow_tt: "§GAll corruption in parliament and disasters caused by party strife are due to the lack of sacred faith. Today in China, there are raging foreign invaders and internal thieves like moths. Only the Youth Party members are holding arms to defend the country. We old people are willing to be our armor. §!\n§YThe New Religion of Salvation will integrate the political situation under a new name. §!"
 QIE_focus_can_only_be_completed_by_advisor_tt: "This focus can only be advanced automatically by §Y$CHARACTER$§! after completing §Y$FOCUS$§!."
 QIE_auto_focus_in_progress_tt: "§R$CHARACTER$§! is planning the next action\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 QIE_jiang_power_focus_can_only_be_completed_by_advisor_tt: "This national policy can only be promoted automatically by Jiang Chaozong after §YProtestant Church of Salvation§! takes control of Beijing."
 QIE_jiang_power_auto_focus_in_progress_tt: "Jiang Chaozong is showing his power\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 QIE_wu_power_focus_can_only_be_completed_by_advisor_tt: "This focus can only be advanced automatically by Wu Peifu after §YNew Religion of Salvation§! takes control of Beijing."
 QIE_wu_power_auto_focus_in_progress_tt: "Wu Peifu is defending his position\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 QIE_old_chinese_beliefs_reborn_warning_tt: "§RWe will revive China with ethical principles! §!\n\n§CAfter we unify China, mutually exclusive national policies will be skipped. \n§!"
 QIE_and_new_beliefs_live_in_here_warning_tt: "§RWe will civilize all countries with moral common prosperity! §!\n\n§CAfter we unify China, mutually exclusive national policies will be skipped. \n§!"
 QIE_pauper_factory_tt: "\n§CThere are many displaced poor people on the land of China who are fleeing from famine. They will find work on their own, and when they are done, they will wander to other places because they have lost their source of income. We can use this to guide their migration."
 QIE_respond_the_sichuan_famine_tt: "§CWe will use part of our resources to rescue refugees in Sichuan, which will cause our own turmoil, but may or may not be rewarded by Sichuan in the future! §!\n\n§CReceive additional §!£GFX_production_cost [?40|H0]§C disaster relief resources to deal with the problems we are currently facing. §!\n\n"
 QIE_henan_focus_can_only_be_completed_by_poor_tt: "This national policy can only be automatically promoted by refugees resettled in Henan."
 QIE_henan_auto_focus_in_progress_tt: "Refugees in Henan are under construction\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 QIE_xian_focus_can_only_be_completed_by_poor_tt: "This national policy can only be automatically promoted by refugees resettled in Shaanxi."
 QIE_xian_auto_focus_in_progress_tt: "Refugees in Shaanxi are under construction\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 QIE_zhili_focus_can_only_be_completed_by_poor_tt: "This national policy can only be automatically promoted by refugees resettled in Zhili"
 QIE_zhili_auto_focus_in_progress_tt: "The refugees in Zhili area are under construction\nProgress: §Y$FLAG_DAYS$§!/[?temp_focus_days] days"
 QIE_jiang_control_wushan_focus_tt: "§YJiang Chaozong§! won this power struggle. He will become the sole religious authority of §ONew Religion of Salvation§! and lead the North China government to a path based on opening up to the outside world and diplomacy and politics. §RAt least it seems so. §!"
 QIE_wu_control_wushan_focus_tt: "§YWu Peifu§! won this power struggle. He will become the sole religious authority of §OMessianist Protestantism§! and lead the North China government to a path based on independence and national self-reliance as the basic principles. §RAt least it seems so. §!"
 QIE_black_diamond_unlock_tt: "§OWe will get a correction for coal resources based on our previous decision. §!\n\n§CIf we choose to cooperate with foreigners, we will be able to explore more veins, but they will get their share. \n\nIf we do this work alone, although there will be fewer resources available, they will all be at our disposal. §!"
 QIE_forced_producing_plan_tt: "§C We will place the refugees in relief factories, so that we can improve the factory's production efficiency by setting higher daily work targets than before, thereby maximizing the use of human resources. §!"
 QIE_247_producing_plan_tt: "§C We will place the refugees in relief factories and adopt a new working method of day and night rotation to ensure that there are workers working in the factory 24 hours a day. On the one hand, we will create jobs and on the other hand, we will increase production, thereby solving the problem of refugees. §!"
 QIE_restore_order_tt: "§RWe will restore order within the customs and make those tyrants who are divided in all directions pay the price! §!\n"
 QIE_wushan_jiang_establish_the_editing_and_translation_department_tt: "§CWe will be able to translate overseas museums and classics, §RIn the foreseeable future, the Translation Institute will also come in handy. §!"
 QIE_debt_negotiation_ycp_betrayed_tt: "§RThis will make al-Shabaab feel betrayed! §!"
 QIE_debt_negotiation_mp_betrayed_tt: "§RThis will make the Royalist Party business owners feel betrayed! §!"
 QIE_cancel_completely_ycp_resolve_tt: "§CWe showed the al-Shabaab our determination! §!"
 QIE_debt_negotiation_mp_env_tt: "§CWe have convinced Royalist Party business owners that a sound business environment is coming! §!"
