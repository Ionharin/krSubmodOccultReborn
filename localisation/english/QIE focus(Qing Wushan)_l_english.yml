 QIE_god_circle_no_focus_tier_1: "Confucian Ancestor Jiangluan: full of doubts"
 QIE_god_circle_no_focus_tier_1_desc: "Although the so-called Confucius and Mencius of Confucianism have become part of the Chinese people, the \"Confucius\" we want to promote is not quite the same as what the public is familiar with, and it still takes some time for people to accept it."
 QIE_god_circle_no_focus_tier_2: "Confucian Ancestor Jiangluan: widely known"
 QIE_god_circle_no_focus_tier_2_desc: "After a period of spreading, the Chinese people have dropped their guard against the religious ancestor we promoted. Now what we have to do is to continue to promote it so that he can penetrate into people's lives."
 QIE_god_circle_no_focus_tier_3: "Confucian Ancestor Jiangluan: deeply rooted in people's hearts"
 QIE_god_circle_no_focus_tier_3_desc: "Whenever people discuss the fuji in Lu Zu Pavilion in Yanjing, even the most die-hard intellectuals have to admit the positive impact that our mystical activities have on society. Confucianism has become a folk activity to maintain social stability and provide spiritual comfort, and people have fully accepted its role."
 QIE_god_circle_con_tier_1: "Daozu Jiangluan: Doubts abound"
 QIE_god_circle_con_tier_1_desc: "From beginning to end, the only nominal Chinese native religion was Taoism. Although Taoist beliefs have been hit one after another since Kang Youwei advocated \"abolition of temples to run schools\" and \"restoration of Confucianism\", this will not affect the majesty of our \"Laozi\" on the altar. It's just that people still need some time to accept his existence."
 QIE_god_circle_con_tier_2: "Daozu Jiangluan: widely known"
 QIE_god_circle_con_tier_2_desc: "After a period of spreading, the Chinese people have dropped their guard against the religious ancestor we promoted. Now what we have to do is to continue to promote it so that he can penetrate into people's lives."
 QIE_god_circle_con_tier_3: "Daozu Jiangluan: deeply rooted in people's hearts"
 QIE_god_circle_con_tier_3_desc: "Whenever people discuss the fuji in Lu Zu Pavilion in Yanjing, even the most die-hard intellectuals have to admit the positive impact that our mystical activities have on society. Daozu's sacrifice has become a folk activity that maintains social stability and provides spiritual comfort, and people have fully accepted its role."
 QIE_god_circle_shi_tier_1: "Buddha descends to Luan: Doubts abound"
 QIE_god_circle_shi_tier_1_desc: "For China's rulers, the most beneficial religion was Buddhism. Buddhism is the best choice to stabilize social order and maintain current stability. Although the \"Sakyamuni\" we promote is different from what some people in Buddhism know, after all, the general public cannot detect the difference."
 QIE_god_circle_shi_tier_2: "Buddha descends to Luan: widely known"
 QIE_god_circle_shi_tier_2_desc: "After a period of spreading, the Chinese people have dropped their guard against the religious ancestor we promoted. Now what we have to do is to continue to promote it so that he can penetrate into people's lives."
 QIE_god_circle_shi_tier_3: "Buddha descends to Luan: deeply rooted in people's hearts"
 QIE_god_circle_shi_tier_3_desc: "Whenever people discuss the fuji in Lu Zu Pavilion in Yanjing, even the most die-hard intellectuals have to admit the positive impact that our mystical activities have on society. The Buddha's performance has become a folk activity that maintains social stability and provides spiritual comfort, and people have fully accepted its role."
 QIE_god_circle_lao_tier_1: "Huizu Jiangluan: Doubts abound"
 QIE_god_circle_lao_tier_1_desc: "A foreign patriarch who does not belong to the Han nationality is bound to arouse everyone's resistance, but this resistance is caused by lack of understanding rather than fear. We only need to continue to promote his existence and show people the similarities between his teachings and Chinese local culture to weaken this resistance."
 QIE_god_circle_lao_tier_2: "Huizu Jiangluan: widely known"
 QIE_god_circle_lao_tier_2_desc: "After a period of spreading, the Chinese people have dropped their guard against the religious ancestor we promoted. Now what we have to do is to continue to promote it so that he can penetrate into people's lives."
 QIE_god_circle_lao_tier_3: "Huizu Jiangluan: deeply rooted in the hearts of the people"
 QIE_god_circle_lao_tier_3_desc: "Whenever people discuss the fuji in Lu Zu Pavilion in Yanjing, even the most die-hard intellectuals have to admit the positive impact that our mystical activities have on society. Returning to one's ancestors and performing rituals has become a folk activity that maintains social stability and provides spiritual comfort, and people have fully accepted its role."
 QIE_god_circle_jesus_tier_1: "Yezu Jiangluan: full of doubts"
 QIE_god_circle_jesus_tier_1_desc: "A foreign patriarch who does not belong to the Han nationality is bound to arouse everyone's resistance, but this resistance is caused by lack of understanding rather than fear. We only need to continue to promote his existence and show people the similarities between his teachings and Chinese local culture to weaken this resistance."
 QIE_god_circle_jesus_tier_2: "Yezu Jiangluan: well known"
 QIE_god_circle_jesus_tier_2_desc: "After a period of spreading, the Chinese people have dropped their guard against the religious ancestor we promoted. Now what we have to do is to continue to promote it so that he can penetrate into people's lives."
 QIE_god_circle_jesus_tier_3: "Yezu Jiangluan: deeply rooted in people's hearts"
 QIE_god_circle_jesus_tier_3_desc: "Whenever people discuss the fuji in Lu Zu Pavilion in Yanjing, even the most die-hard intellectuals have to admit the positive impact that our mystical activities have on society. Yezu's sacrifice has become a folk activity that maintains social stability and provides spiritual comfort, and people have fully accepted its role."
