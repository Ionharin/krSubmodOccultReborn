 ### Ideas ###

 JAP_pnr_housing_finance_agency: "Housing Finance Agency"
 JAP_pnr_housing_finance_agency_desc: "Money is the nerve of struggle, and the secure concealment of houses is the fortress of defensive organisation - Japanese Communist Party\n\nThe Housing Finance Agency is an underground criminal network operated by the Japanese Communist Party to raise funds for its activities. Established at the direction of Kazama Jokichi, who returned from the Commune of France, it has gathered large sums for the struggle against capitalism through kidnapping, abduction, prostitution, extortion, and taxi businesses. Without question, these red terrorists have become a grave problem for public security.\n\n§RIf left unchecked, the situation may deteriorate further.§!"
 JAP_pnr_showa_tenno: "Today's Tenno"
 JAP_pnr_showa_tenno_desc: "$JAP_hirohito_leader_desc$"
 JAP_pnr_farewell_to_the_lost_decade: "Farewell to the Lost Decade"
 JAP_pnr_farewell_to_the_lost_decade_desc: "The American Great Depression that erupted in 1925 dealt a severe blow to our textile industry. Our government responded with relief measures and industrial restructuring, while striving, and doing so reluctantly, to integrate into the new global market led by the German Empire. Though these efforts achieved little, they did prevent the situation from worsening further.\n\nFortunately, our economy has begun to recover, but it remains fragile. Any moderate economic disturbance could send matters sharply downhill..."
 JAP_pnr_forever_frozen_in_1928: "Forever Frozen in 1928"
 JAP_pnr_forever_frozen_in_1928_desc: "Japan has endured a Lost Decade, and its party politics have remained frozen alongside the economy ever since 1928. After universal male suffrage was extended to all men over 25, workers, farmers, and the rising industrial classes unexpectedly sent their own representatives to the House of Representatives. Since then, the Diet has remained perpetually hung, with no party able to secure a decisive majority. While the court circles surrounding the Emperor are content with this state of affairs, Japan's politicians are anything but.\n\nThe current Prime Minister, Inukai Tsuyoshi, may be revered as a great champion of constitutional government, but in reality he is little more than a dying old man barely holding the Seiyūkai together. Few within the party recognize his authority, and he is powerless to restrain its increasingly bitter factional struggles.\n\nEver since Hara Takashi was assassinated by an agrarian nationalist, the Seiyūkai has lacked a leader capable of uniting the party. The struggle between Suzuki Kisaburō's faction of 'Japanese-style parliamentary fighters' and Kuhara Fusanosuke's anti-Suzuki faction grows fiercer by the day. Members continue to defect, the Seiyūkai is visibly falling apart, and the other parties are already eyeing the cabinet seats."
 JAP_pnr_offensive_realpolitik: "Offensive Realpolitik"
 JAP_pnr_offensive_realpolitik_desc: "As an island nation, [JAP.GetName] is guided by thoroughly concrete interests. We will avoid direct confrontation with the great powers as much as possible, instead using various forms of intervention to secure the greatest benefit for the state."
 JAP_pnr_offensive_realpolitik_1: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_1_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_offensive_realpolitik_2: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_2_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_offensive_realpolitik_3: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_3_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_offensive_realpolitik_4: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_4_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_restore_naval_shipbuilding_plan: "Restore the Naval Shipbuilding Plan"
 JAP_pnr_restore_naval_shipbuilding_plan_desc: "Ever since the “Glorious Revolution” broke out in Britain in 1925, the government has continuously invoked the so-called power of the people to suppress the expansion of the [JAP.GetAdjective] Navy, gradually reducing the military budget. The previously planned Eight-Eight Fleet Programme was abandoned halfway, and in the end only Kii and Owari left the yards. Now that the storm of war is drawing near, we can restart the old shipbuilding plan, but the age is different, and the moment has already passed. Still, at long last, we have once again been given a chance to expand."
 JAP_pnr_20_knot_scrap_plan_idea: "Refit the Old 20-Knot Ships"
 JAP_pnr_20_knot_scrap_plan_idea_desc: ""
 JAP_pnr_develop_assault_guns: "Assault Gun Focus"
 JAP_pnr_develop_assault_guns_desc: "Rather than focus on full-fledged tanks, we will instead rely on assault guns to aid our infantry in affecting breakthroughs, as a more cost-effective alternative."
 JAP_pnr_spiritual_renovation_0: "Spiritual Renovation"
 JAP_pnr_spiritual_renovation_0_desc: "Ever since the arrival of the Black Ships, our country has been wounded by Western imperialism. Below, society has embraced so-called liberty and emancipation, replacing neighbourly warmth with suspicion; above, the ministers of the court have conspired to turn [JAP.GetName] into a state ruled by a handful of men. After a historic march, we have at last gained the chance to remake the nation and restore all things to their proper form. We shall brush the dust from Japan and reveal her beautiful body, so warmth and virtue may return among us."
 JAP_pnr_spiritual_renovation_1: "$JAP_pnr_spiritual_renovation_0$"
 JAP_pnr_spiritual_renovation_1_desc: "$JAP_pnr_spiritual_renovation_0_desc$"
 JAP_pnr_spiritual_renovation_2: "$JAP_pnr_spiritual_renovation_0$"
 JAP_pnr_spiritual_renovation_2_desc: "$JAP_pnr_spiritual_renovation_0_desc$"
 JAP_pnr_spiritual_renovation_3: "$JAP_pnr_spiritual_renovation_0$"
 JAP_pnr_spiritual_renovation_3_desc: "$JAP_pnr_spiritual_renovation_0_desc$"
 JAP_pnr_suspension_of_the_constitution: "Suspension of the Constitution"
 JAP_pnr_suspension_of_the_constitution_desc: "In this hour of national peril, the old constitutional order can no longer protect the kokutai. To ensure imperial rule and national reconstruction can proceed, the constitution shall be suspended for a time."
 JAP_pnr_imperial_diet_banned: "Imperial Diet Banned"
 JAP_pnr_imperial_diet_banned_desc: ""
 JAP_pnr_new_workers_and_farmers_0: "New Workers and Farmers"
 JAP_pnr_new_workers_and_farmers_0_desc: "Workers and farmers are not the private property of the Reds. They too are children of the nation and the Emperor. A truly new state must free them from poverty and urban capital, then bring them into the order of common service."
 JAP_pnr_new_workers_and_farmers_1: "$JAP_pnr_new_workers_and_farmers_0$"
 JAP_pnr_new_workers_and_farmers_1_desc: "$JAP_pnr_new_workers_and_farmers_0_desc$"
 JAP_pnr_economic_reconstruction_plan_0: "Economic Reconstruction Plan"
 JAP_pnr_economic_reconstruction_plan_0_desc: "We cannot continue to let the so-called free market command the livelihood of the people. The state must remake the economy by its own authority, returning production, land, capital, and labour to the proper path of serving the national whole."
 JAP_pnr_economic_reconstruction_plan_1: "$JAP_pnr_economic_reconstruction_plan_0$"
 JAP_pnr_economic_reconstruction_plan_1_desc: "$JAP_pnr_economic_reconstruction_plan_0_desc$"
 JAP_pnr_flower_of_the_family: "Flower of the Family"
 JAP_pnr_flower_of_the_family_desc: "The family is the smallest cell of the nation, and women are the flowers that preserve its order and warmth. Only when the family is secure can the state be secure."
 JAP_pnr_new_and_old_family: "The New and Old Family"
 JAP_pnr_new_and_old_family_desc: ""
 JAP_pnr_workers_shareholders_assembly: "Workers' Shareholders Assembly"
 JAP_pnr_workers_shareholders_assembly_desc: "The factory should not be merely the private property of capitalists; it is also formed by the sweat and lives of workers. Allowing workers to participate in factory affairs in a new way will make the order of production more secure."
 JAP_pnr_esperantists: "Esperantists"
 JAP_pnr_esperantists_desc: "The new national education must do more than reproduce the old subject. It must also let Japan understand and face the world. Esperantists believe that a language crossing national divisions can become a bridge to a new civilisation."
 JAP_pnr_national_compulsory_education: "National Compulsory Education"
 JAP_pnr_national_compulsory_education_desc: ""
 JAP_pnr_new_labor_capital_relations: "New Labour-Capital Relations"
 JAP_pnr_new_labor_capital_relations_desc: "Labour and capital should not destroy each other through class hatred. Under state supervision and common service, they must be joined anew. The new labour-capital relationship will turn the factory from a battlefield into a productive community serving the whole people."
 JAP_pnr_showa_new_deal_0: "Showa New Deal"
 JAP_pnr_showa_new_deal_0_desc: "Utter disappointment with party politics, anger at military insubordination, and the loss of treasured close ministers have brought the Emperor down from the stone steps and into the chaos of politics himself.\n\nThough the Emperor remains mysterious, his actions have proven that he is by no means the distant puppet imagined by outsiders. By personally leading the Imperial Guard Division to suppress the rebels, Hirohito has once again demonstrated his authority and position as the supreme ruler and sacred embodiment of [JAP.GetName], opening the curtain on the Showa New Deal.\n\nSaionji Kinmochi and others repeatedly warned Hirohito in life that a monarch must preserve mystery and sanctity by avoiding excessive interference in politics. Yet now that the path of constitutional government lies broken, using the imperial prerogative and extraordinary measures seems to be the only way to halt the radicals, preserve the stability of the kokutai, and ultimately realise true democracy."
 JAP_pnr_showa_new_deal_1: "$JAP_pnr_showa_new_deal_0$"
 JAP_pnr_showa_new_deal_1_desc: "$JAP_pnr_showa_new_deal_0_desc$"
 JAP_pnr_showa_new_deal_2: "$JAP_pnr_showa_new_deal_0$"
 JAP_pnr_showa_new_deal_2_desc: "$JAP_pnr_showa_new_deal_0_desc$"
 JAP_pnr_showa_new_deal_3: "$JAP_pnr_showa_new_deal_0$"
 JAP_pnr_showa_new_deal_3_desc: "$JAP_pnr_showa_new_deal_0_desc$"
 JAP_pnr_gozen_conference_0: "Imperial Conference"
 JAP_pnr_gozen_conference_0_desc: "For a long time, the so-called Imperial Conference, a major meeting personally attended by the Emperor, followed custom by treating the Emperor as little more than a symbol, calling on his sacred judgement only when matters reached deadlock.\n\nTo truly ensure that similar incidents of insubordination do not occur again, the Imperial Conference, once merely a venue for informing His Majesty, has now assumed a more important responsibility. Whether or not there is deadlock or confrontation, no policy or plan may be discussed independently. It must be reported to the Emperor at the Imperial Conference and receive explicit approval before it can be carried out."
 JAP_pnr_gozen_conference_1: "$JAP_pnr_gozen_conference_0$"
 JAP_pnr_gozen_conference_1_desc: "$JAP_pnr_gozen_conference_0_desc$"
 JAP_pnr_gozen_conference_2: "$JAP_pnr_gozen_conference_0$"
 JAP_pnr_gozen_conference_2_desc: "$JAP_pnr_gozen_conference_0_desc$"
 JAP_pnr_gozen_conference_miitsu_monthly_tt: "Monthly Miitsu gain when Miitsu is above 70: §G+3§!\nMonthly Miitsu gain when Miitsu is below 30: §R-3§!"
 JAP_pnr_guardian_of_japan: "Guardian of Japan"
 JAP_pnr_guardian_of_japan_desc: "Article One of the Constitution of Great Japan: [JAP.GetName] shall be reigned over and governed by a line of Emperors unbroken for ages eternal. Article Nine: the Emperor may issue or cause others to issue laws needed to preserve public peace and order and promote the welfare of his subjects."
 JAP_pnr_imperial_appointment: "Imperial Appointment"
 JAP_pnr_imperial_appointment_desc: "The Advisory Council has been designed as a new consultative body, chiefly to provide the Emperor with advice on relevant matters. Unlike the existing organs of government, every member of the council is personally appointed by the Emperor."
 JAP_pnr_iron_democracy: "Iron Democracy"
 JAP_pnr_iron_democracy_desc: "To save the dying light of democracy in [JAP.GetName] with every effort available, forceful measures are sometimes necessary."
 JAP_pnr_house_of_peers_silenced: "House of Peers Silenced"
 JAP_pnr_house_of_peers_silenced_desc: "His Majesty has diluted the political influence of the House of Peers by appointing members of the House of Representatives to the peerage, sharply weakening its role in politics."
 JAP_pnr_way_of_subjects: "Way of the Subjects"
 JAP_pnr_way_of_subjects_desc: ""
 JAP_pnr_gunjin_chokuyu: "Rescript to Pacify the Military"
 JAP_pnr_gunjin_chokuyu_desc: "The Emperor is [JAP.GetName]'s supreme military leader and Grand Marshal of the army and navy, yet this title has long been little more than an empty name. The two services have acted as they pleased, and have often undermined one another for advantage. Through the earlier May 15 Incident and the present coup, the Emperor has authorised the purge and marginalisation of many radical officers in both services. With the prestige won by suppressing the rebels and the rescript issued alongside it, he has once again taken firm hold of the military."
 JAP_pnr_strengthened_supreme_command: "Strengthened Supreme Command"
 JAP_pnr_strengthened_supreme_command_desc: ""
 JAP_pnr_daigensui_office: "Grand Marshal's Office"
 JAP_pnr_daigensui_office_desc: "The Emperor is called Grand Marshal because the ancient Daigensui Myoo ritual of subjugation, a rite against foreign enemies, can only be performed by the Emperor. Whether this religious ritual can truly destroy our foes remains unknown, but through it the Emperor has established nominal command over the armed forces.\n\nNow that command has finally extended into the material world. The history of four-headed politics has been declared over; there is no longer a division between command and administration, nor the sharp opposition of army and navy. Arguments will remain unavoidable, but the appointment of all officers is now truly concentrated in the Emperor's hands."
 JAP_pnr_civilian_control_of_the_military_land_doctrine_bonus: "Civilian Control of the Military"
 JAP_pnr_civilian_control_of_the_military_naval_doctrine_bonus: "Civilian Control of the Military"
 JAP_pnr_planned_social_reform_industry_bonus: "Planned Social Reform"
 JAP_pnr_ban_strikes_tt: "We will lose Stability based on current $national_populist_coloured$ popularity and gain up to §Y4§! civilian factories."
 JAP_pnr_foolproof_plan: "Foolproof Plan"
 JAP_pnr_foolproof_plan_desc: "War begins before the first shot is fired. Detailed field surveys and meticulous operational planning will help the army launch more organised and destructive offensives."
 JAP_pnr_cage_tactic_idea: "Cage Tactic"
 JAP_pnr_cage_tactic_idea_desc: "The so-called “cage tactic” refers to rapidly constructing an encirclement and cutting enemy communications, forcing a small enemy force into the fog of war. Once completely isolated from the outside world, the enemy will collapse after only a few further attacks."
 JAP_pnr_strengthened_core_staff_system: "Strengthened General Staff"
 JAP_pnr_strengthened_core_staff_system_desc: "War begins before the first shot is fired. Detailed field surveys and meticulous operational planning will help the army launch more organised and destructive offensives."
 JAP_pnr_advanced_army: "Advanced Army"
 JAP_pnr_advanced_army_desc: "After a series of reforms, our army has become an advanced force that can look down upon the world. What we need now is a war, through which we may test the fruits of reform and prove the army's true strength!"
 JAP_pnr_great_war_army: "Great War Army"
 JAP_pnr_great_war_army_desc: "After a series of reforms, our army has become an advanced force that can look down upon the world, and our achievements on the battlefield have proven the success of those reforms."
 JAP_pnr_short_term_decisive_battle_doctrine_idea: "Single-Blow Theory"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_desc: "Although our army stands among the world's first rank, it still suffers from many shortcomings compared with the great powers. The most fatal cause of this condition is our shortage of strategic resources. Our army should therefore follow the principle of destroying the enemy with one mighty blow, lest we become trapped in a drawn-out war of attrition that consumes us entirely."
 JAP_pnr_short_term_decisive_battle_doctrine_idea_upgraded: "Single-Blow Theory"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_upgraded_desc: "$JAP_pnr_short_term_decisive_battle_doctrine_idea_desc$"
 JAP_pnr_prepare_for_total_war_idea: "Proceed Deliberately"
 JAP_pnr_prepare_for_total_war_idea_desc: "After the storm of the Weltkrieg, war is no longer a matter belonging only to the army, dependent upon will and morale. It has already become a many-sided totalist undertaking that tests a state's resources, industrial level, and technological development. Given our resources and industrial condition, fighting a war by modern standards is exceedingly difficult. We must therefore prepare for any possible war and avoid optimistic assumptions that future conflicts will be brief."
 JAP_pnr_prepare_for_total_war_idea_upgraded: "Proceed Deliberately"
 JAP_pnr_prepare_for_total_war_idea_upgraded_desc: "$JAP_pnr_prepare_for_total_war_idea_desc$"
 JAP_pnr_q_agency: "Q Agency"
 JAP_pnr_q_agency_desc: "Once war begins, establishing a special agency will be essential to preserving social stability in occupied areas. The Q in Q Agency stands for Quell. Whether by buying off potential local collaborators or by harsher methods of repression, we will always find a way to secure stability in the relevant regions."
 JAP_pnr_limited_light_armor: "Limited Light Armour"
 JAP_pnr_limited_light_armor_desc: "Our country lacks steel resources, so adopting a light armour programme best suits our national conditions."
 JAP_pnr_armored_forces: "Armoured Forces"
 JAP_pnr_armored_forces_desc: "Although our country faces a shortage of steel resources, there can be no doubt that arming a powerful armoured force will ensure that we can handle any enemy with ease."
 JAP_pnr_armored_car_warfare: "Promote Armoured Car Warfare"
 JAP_pnr_armored_car_warfare_desc: "Our country lacks steel resources, so adopting a light armour programme best suits our national conditions."
 JAP_pnr_armored_torrent: "Armoured Torrent"
 JAP_pnr_armored_torrent_desc: "Although our country faces a shortage of steel resources, there can be no doubt that arming a powerful armoured force will ensure that we can handle any enemy with ease."
 JAP_pnr_primacy_of_movement: "Primacy of Movement"
 JAP_pnr_primacy_of_movement_desc: ""
 JAP_pnr_resist_financial_risks_idea: "Resist Financial Risks"
 JAP_pnr_resist_financial_risks_idea_desc: "The terrifying economic nightmare is finally over. We seized the opportunity of this global Great Depression to eliminate all those poorly performing enterprises at once. Although we experienced a heartbreaking wave of bankruptcies and unemployment during this period, these were merely necessary sacrifices to make our industries healthy and put an end to the distorted 'feeding economy' model that had formed in the past. And now, isn't the data getting better? The market is once again radiating the vitality it should have. Today, we can finally say—we have emerged from the nightmare of the lost decade. Farewell, the bleak past; here I come, the prosperous future!"

 ### Balance of Power ###

 JAP_pnr_poor_reality_bop: "Impoverished Reality"
 JAP_pnr_choshu_no_rikugun: "Choshu no rikugun"
 JAP_pnr_satsuma_no_kaigun: "Satsuma no kaigun"
 JAP_pnr_bop_army_ascendant: "Army Ascendant"
 JAP_pnr_bop_two_services_balanced: "The Two Services Maintain Balance"
 JAP_pnr_bop_navy_ascendant: "Navy Ascendant"
 JAP_pnr_interservice_budget_bop_category: "Impoverished Reality"
 JAP_pnr_interservice_budget_bop_category_desc: ""
 JAP_pnr_annual_interservice_budget: "Annual Army-Navy Budget"
 JAP_pnr_annual_interservice_budget_desc: "Since 1927, our navy has undertaken disarmament plans to reduce defence spending and support the country through the economic crisis. At the same time, the army has also carried out disarmament plans, intending to use the surplus budget to upgrade its equipment. With our national resources so limited, we plainly cannot satisfy both services at once, and the army and navy often clash fiercely over the distribution of military funds.\n\nOur current army budget points are §Y[?JAP_pnr_army_budget_points|0]§!. Next year, we expect to gain §t[?JAP_pnr_army_budget_yearly_gain|0]§!.\nOur current navy budget points are: §3[?JAP_pnr_navy_budget_points|0]§!. Next year, we expect to gain §t[?JAP_pnr_navy_budget_yearly_gain|0]§!."
 JAP_pnr_emergency_army_budget: "Emergency Army Armament Budget"
 JAP_pnr_emergency_army_budget_desc: ""
 JAP_pnr_emergency_army_budget_points_tt: "Through the emergency budget bill, we will gain §O2§! army budget points. Yet this is undoubtedly an overdraft of our credibility with the Ministry of Finance, making them more inclined to elevate the other service as a counterweight."
 JAP_pnr_emergency_army_budget_used_this_year: "We have enacted this year's emergency army budget bill"
 JAP_pnr_emergency_shipbuilding_plan: "Emergency Shipbuilding Plan"
 JAP_pnr_emergency_shipbuilding_plan_desc: ""
 JAP_pnr_emergency_shipbuilding_plan_budget_points_tt: "Through the emergency budget bill, we will gain §O2§! navy budget points. Yet this is undoubtedly an overdraft of our credibility with the Ministry of Finance, making them more inclined to elevate the other service as a counterweight."
 JAP_pnr_emergency_shipbuilding_plan_used_this_year: "We have enacted this year's emergency navy budget bill"
