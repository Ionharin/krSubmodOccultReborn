 ### Raids ###

 raid_type_JAP_pnr_operation_night_blossom: "Operation Night Blossom"
 raid_type_JAP_pnr_operation_night_blossom_desc: "A strategic bomber will take off from an airbase near the Solomon Sea and drop a special bomb over key enemy city to execute Operation Night Blossom. The general staff believes this action will inflict heavy damage on these white lackeys and help our country achieve a swift victory in the war against imperialism."

 ### Dynamic Modifiers and Modifiers ###

 JAP_pnr_pandemic_modifier: "Pandemic"
 JAP_pnr_pandemic_modifier_desc: "A sudden plague has plunged this area into a public health crisis."
 JAP_pnr_red_hands_modifier: "Red Evil Hands"
 JAP_pnr_red_hands_modifier_desc: "Workers and peasants of Japan, Mount Fuji has sunk, and the evil emperor has fled with his tail between his legs. Now is the time to march and completely overthrow the bourgeoisie! - Japanese Communist Party\n\nAlthough, for various reasons, our country never became deeply integrated into the world market dominated by the German Empire, the outbreak of Black Monday has nevertheless transmitted the financial crisis to our shores, dealing a heavy blow to an economy that had only just begun to show signs of improvement.\n\nThe Japanese Communist Party has seized this opportunity. With the Kishida Middle School Student Incident as its emblem, it has accelerated its destructive actions against society. Large numbers of JCP members and radicals have been mobilised, launching attacks against our government ranging from lawful demonstrations to violent crimes. §RWe must prove to His Majesty the Emperor that we are capable of bringing these criminals to justice, or we will have to step down, or worse...§!"
 JAP_pnr_lost_decade_nightmare_modifier: "Nightmare of the Lost Decade"
 JAP_pnr_lost_decade_nightmare_modifier_desc: "Over the past decade, we revived our economy by adjusting our trade strategy. Yet just as we were about to bid farewell to the greyness of the past, this troublesome spectre has seized us once again, refusing to let us leave."
 JAP_pnr_destruction_and_creation_modifier: "Destruction and Creation"
 JAP_pnr_destruction_and_creation_modifier_desc: "Since ancient times, human development has been immersed in constant destruction, and those who can use the ruins left after destruction to create something new are called “Revolutionaries.” Ah, revolutionaries—what a beautiful name! When people utter this name, it seems there is no greater title under heaven and earth. For this very reason, many insidious villains, rogues, and vandals often steal the guise of “Revolutionaries.” They don this ill-fitting garment and make their grand entrance. Yet they know only destruction and have never grasped the true essence of creation, which is why, upon encountering a true revolutionary, they instantly turn to dust. \n\nTo achieve reform, the §Rdestruction§! of erroneous things is indispensable, but at the same time, one must not forget §Gcreation§! itself. To realize the perfect politics of reform, combining these two forces is essential. But if §Rdestruction§! is allowed to burn the nation to ashes, that terrifying frenzy may eventually spread across the entire world; if one begins to §Gcreate§! on a grand scale without even tearing down the old houses, what ultimately emerges will be nothing more than a more bloated existence. Only by balancing §Rdestruction§! and §Gcreation§!, and by allowing the two forces of black and white to hold each other in check, can true §Minnovation§! be achieved."
 JAP_pnr_lost_decade_disabled_ideas_tt: "£GFX_trigger_yes Allow manually changing ministers and laws"
 JAP_pnr_fleet_plan_modifier: "[JAP.GetName] Fleet Plan"
 JAP_pnr_fleet_plan_modifier_desc: "[JAP.GetName], the eldest son of Asia, likewise possesses the only powerful fleet in Asia owned by Asians themselves. Recalling past glory, at the beginning of the Weltkrieg the [JAP.GetAdjective] Navy seized and temporarily liberated most of [GER.GetName]'s Pacific territories in a single stroke. Yet as they won victories in the war, disaster and suffering descended upon our glorious navy.\n\nThe shameless blockade imposed by German colonialists severely affected our fleet construction plans, while the syndicalist movements that broke out in Britain and France led the politicians of the day to vote against continued strengthening of our maritime defence and the construction of a vast navy. The Imperial Army's obstruction then utterly destroyed our vision. Ten years later, however, our country has finally recognised the importance of the navy once again. The [JAP.GetAdjective] Navy shall once more roam the blue waters. Yes, the [JAP.GetAdjective] Navy shall once more roam the blue waters!"
