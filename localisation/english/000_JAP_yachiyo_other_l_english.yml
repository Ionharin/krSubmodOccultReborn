 ### Decisions ###

 JAP_pnr_red_conspiracy_begun: "The Red Conspiracy is spreading."
 JAP_pnr_red_conspiracy_category: "Red Conspiracy"
 JAP_pnr_red_conspiracy_progress_title: "Reds are on the move"
 JAP_pnr_red_conspiracy_progressbar_tt: "The current intensity of the Red Conspiracy is §R[?JAP_pnr_red_conspiracy_strength|0]§!/100."
 JAP_pnr_red_conspiracy_category_desc: "For a long time, our country has lacked powerful means to strike against red elements. From 1923 to 1926, under the cabinet of Tanaka Giichi, a Peace Preservation Law existed to combat these terrorists who threatened society. Yet this law greatly restricted civil rights and even threatened the normal functioning of the constitution, and so it was soon abolished. Until §0similar legislation§! is enacted, we can only rely on the police and the spies of the Tokko to deal with them.\n\nThere can be no doubt that the ever-growing red tide also presents an opportunity. If we can ensure that this social unrest persists long enough while remaining within our control, then perhaps we may be able to harness public sentiment to achieve certain §tparticular objectives§!."
 JAP_pnr_red_conspiracy_escalation: "£pol_violence Red Conspiracy Escalation"
 JAP_pnr_red_conspiracy_escalation_desc: "The underground organisations of the red elements are gathering strength. If they are not contained in time, their activities will grow still bolder."
 JAP_pnr_red_conspiracy_reduced: "The intensity of the Red Conspiracy is §Greduced by $RIGHT|0$ points§!."
 JAP_pnr_red_conspiracy_raised: "The intensity of the Red Conspiracy is §Rraised by $RIGHT|0$ points§!."
 JAP_pnr_red_conspiracy_curtail_red_press: "Raid the §RRed Flag§! Press"
 JAP_pnr_red_conspiracy_curtail_red_press_desc: "For years, the Japanese Communist Party and other radical left-wing subversives have used the §RRed Flag§! to propagate their ideas. Its pages are filled with articles inciting workers to strike and peasants to revolt, while each day brings yet more sensational tales urging the people to “charge against the wicked bourgeoisie.” Though we may never completely silence their rabble-rousing in clandestine publications of their own making, we can at least suppress their circulation as much as possible through a series of raids."
 JAP_pnr_red_conspiracy_activate_loyal_unions: "Mobilise Loyal Unions"
 JAP_pnr_red_conspiracy_activate_loyal_unions_desc: "Trade unions loyal to the present order can help us contest radical influence among the workers."
 JAP_pnr_red_conspiracy_establish_curfews: "Establish Curfews"
 JAP_pnr_red_conspiracy_establish_curfews_desc: "Night meetings and secret contacts are the soil in which underground organisations thrive. Temporary curfews can disrupt their rhythm."
 JAP_pnr_red_conspiracy_arrest_activists: "Arrest Labour Agitators"
 JAP_pnr_red_conspiracy_arrest_activists_desc: "With sufficient evidence in hand, the police and the Tokko can uproot several key figures in red organisations."
 JAP_pnr_red_conspiracy_selective_reform: "Selective Concessions"
 JAP_pnr_red_conspiracy_selective_reform_desc: "Limited social concessions can divide moderate workers from revolutionaries, at a cost shared by industry and the state treasury."
 JAP_pnr_red_conspiracy_lapse_on_security: "Accidental Security Lapses"
 JAP_pnr_red_conspiracy_lapse_on_security_desc: "Temporarily relaxing security can free political pressure and administrative resources, but underground red organisations will also use the opportunity to strengthen themselves."

 JAP_pnr_kasumigaseki_diplomacy_category: "Kasumigaseki Diplomacy"
 JAP_pnr_kasumigaseki_diplomacy_category_desc: ""
 JAP_pnr_south_china_melee_anq_decision: "East China Melee: [ANQ.GetName]"
 JAP_pnr_south_china_melee_anq_decision_desc: "The East China region of China—namely, the League of Eight Provinces—has been plunged into rebellion due to political issues. This presents an opportunity for our nation. If we wish to truly weaken China, we should either keep them in a state of perpetual division and discord, or support factions that are potential allies to us. In any case, the manoeuvring has already begun."
