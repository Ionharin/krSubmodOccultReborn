### Ability Power Chemistry Weapon ###
 ABILITY_JAP_PNR_SPECIAL_COUNTERMEASURES: "Special Countermeasures"
 ABILITY_JAP_PNR_SPECIAL_COUNTERMEASURES_DESC: "Our forces will conduct practical trials using extremely precious prototype special shells in order to verify their actual lethal effects against the enemy on the battlefield."

 ### Ideas ###

 JAP_pnr_housing_finance_agency: "Housing Finance Agency"
 JAP_pnr_housing_finance_agency_desc: "Money is the nerve of struggle, and the secure concealment of houses is the fortress of defensive organisation - Japanese Communist Party\n\nThe Housing Finance Agency is an underground criminal network operated by the Japanese Communist Party to raise funds for its activities. Established at the direction of Kazama Jokichi, who returned from the Commune of France, it has gathered large sums for the struggle against capitalism through kidnapping, abduction, prostitution, extortion, and taxi businesses. Without question, these red terrorists have become a grave problem for public security.\n\n§RIf left unchecked, the situation may deteriorate further.§!"
 JAP_pnr_showa_tenno: "Today's Tenno"
 JAP_pnr_showa_tenno_desc: "$JAP_hirohito_leader_desc$"
 JAP_pnr_farewell_to_the_lost_decade: "Farewell to the Lost Decade"
 JAP_pnr_farewell_to_the_lost_decade_desc: "The American Great Depression that erupted in 1925 dealt a severe blow to our textile industry. Our government responded with relief measures and industrial restructuring, while striving, and doing so reluctantly, to integrate into the new global market led by the German Empire. Though these efforts achieved little, they did prevent the situation from worsening further.\n\nFortunately, our economy has begun to recover, but it remains fragile. Any moderate economic disturbance could send matters sharply downhill..."
 JAP_pnr_rikken_seiyukai_factional_struggle: "Factional Struggle in the Rikken Seiyukai"
 JAP_pnr_rikken_seiyukai_factional_struggle_desc: "Although people respectfully call Inukai Tsuyoshi the great god of constitutionalism, in truth he is little more than a dying old man barely keeping the Seiyukai from splitting apart. No one within the Rikken Seiyukai recognises his authority, and Inukai Tsuyoshi himself is unable to restrain the party's increasingly fierce factional struggles.\n\nEver since Hara Takashi was assassinated by agrarian nationalists, the Seiyukai has lacked a capable party leader able to oversee the whole organisation. The line struggle between Suzuki Kisaburo, the so-called Japanese parliamentary fighter, and the anti-Suzuki faction led by Kuhara Fusanosuke has grown increasingly severe. Every day, someone announces their departure from the party. Without question, the Rikken Seiyukai is disintegrating from within."

