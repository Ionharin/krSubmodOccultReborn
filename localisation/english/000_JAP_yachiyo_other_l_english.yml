 JAP_pnr_increased_production_patriotic_association: "Increased Production Patriotic Association"
 JAP_pnr_increased_production_patriotic_association_desc: ""
 JAP_pnr_seoul_asia_university_preparations: "Seoul Asia University Preparations"
 JAP_pnr_seoul_asia_university_preparations_desc: "To establish a true Asian institution of higher learning, one that will educate every person of ambition across the continent equally, we are cooperating with [KOR.GetName] to prepare a university in the soon-to-be-completed Seoul Special City."
 JAP_pnr_spread_the_kingly_way: "Spread the Kingly Way"
 JAP_pnr_spread_the_kingly_way_desc: "Under the shelter and support of His Majesty the Tenno, the spiritual face of our people has been renewed. To spread the Kingly Way across Asia and even the world, we must answer conflicts and cooperation among the nations in a fitting posture."
 JAP_pnr_king_milinda: "King Milinda"
 JAP_pnr_king_milinda_desc: "$JAP_hirohito_leader_desc$"
 JAP_pnr_asian_values: "Asian Values"
 JAP_pnr_asian_values_desc: "The goddess of Asia gently shook her basket filled with spices and gold. She sang a song praising abundance as she walked along the high-noon road, and there she was murdered. A European goddess wearing a crown set with precious gems raised a blade behind her.\n\nShe cut open the victim's back and drew out Asia's spine, a shining column of beryl. She squeezed Asia's heart, like a practiced milkmaid, until every drop of blood flowed into the jar she had prepared.\n\nThis queen, lover of peace and guardian of all justice in the world, then departed on a black double-headed eagle, leaving only a mass of flesh and a ghost that wanders at dusk with even its memories carved away.\n\nWho will end the lament of this spectre of the past? Let us hold hope. The Japanese shall rise first, and before long reunite with the other parts of the goddess's body. She will erase the painful memories of the past, and true Asian humanity will be reborn from the ruins."
 JAP_pnr_short_bow_of_asia_0: "Short Bow of Asia"
 JAP_pnr_short_bow_of_asia_0_desc: "I looked southward and saw a queen. Beneath a waterfall, wearing a crown woven from wild lilies, she washed away the dust with flowing pure water. A white towel coiled around her delicate hands, her gentle gaze burned like an eagle's, and amid the green mountains she held a short bow. One end was Aigun, the other Rangoon.\n\nI heard loyal and brave souls weeping in the mountain stream: let no beast or demon harm the world again, and let no wicked one pursue the blood of the righteous.\n\nThus the goddess drew tight the bowstring of revenge."
 JAP_pnr_vanguard_of_asia: "Vanguard of Asia"
 JAP_pnr_vanguard_of_asia_desc: ""
 JAP_pnr_short_bow_of_asia_rissho_ankoku: "Short Bow of Asia: Rissho Ankoku"
 JAP_pnr_short_bow_of_asia_rissho_ankoku_desc: "All wells and pools are dried up. The land has turned to salt and cracked into hills and ravines. The mountains burn, and the heavenly dragons send no rain. Crops wither, the living die, and no grass grows again. Dust and darkness cover rain and earth; sun and moon show no light. Drought grips the four directions, and evil omens appear again and again."
 JAP_pnr_short_bow_of_asia_golden_rooster: "Short Bow of Asia: The Golden Rooster Heralds the Dawn"
 JAP_pnr_short_bow_of_asia_golden_rooster_desc: "One who has resolved to become a gentleman must devote himself to learning. If study is not diligent, then the will is not yet sincere. Among those who study with us, quickness and cleverness are not held highest; diligence, certainty, humility, and restraint are."
 JAP_pnr_return_to_simplicity: "Return to Simplicity"
 JAP_pnr_return_to_simplicity_desc: "The tense international situation and sharpening domestic conflicts have made the people restless. The root lies in Western liberalism poisoning a people once guided by Confucian instruction and moral learning. In precisely such feverish times, we should quietly influence the nation and guide its unease toward construction and reform, not assassination, violence, or war."
 JAP_pnr_detached_from_without: "Detached From Without"
 JAP_pnr_detached_from_without_desc: "Do not touch politics. Do not personally involve yourself in politics. His Majesty the Tenno is the model for all who hold power. He stands detached from politics, and precisely for that reason receives everything."
 JAP_pnr_healing_decay_0: "Healing Decay"
 JAP_pnr_healing_decay_0_desc: "The Japanese suffer from a grave illness. Until it is cured, any so-called Asian co-prosperity will appear only in distorted form. Western liberal poison has corroded Japan's spirit and seized politics, the only thing in this world capable of creating valuable life. Politics is the concrete expression of every spiritual principle, and the fruits of ruined politics are apples of Sodom. The Japanese must truly realise the destiny of the gods: His Majesty, as the unbroken imperial ancestor, is eternal life embodied in the universe. Only [JAP.GetName], once awakened to this truth, can truly save all Asia."
 JAP_pnr_healing_decay_1: "$JAP_pnr_healing_decay_0$"
 JAP_pnr_healing_decay_1_desc: "$JAP_pnr_healing_decay_0_desc$"
 JAP_pnr_healing_decay_2: "$JAP_pnr_healing_decay_0$"
 JAP_pnr_healing_decay_2_desc: "$JAP_pnr_healing_decay_0_desc$"
 JAP_pnr_short_bow_of_asia_great_vehicle_japan: "Short Bow of Asia: Great Vehicle Japan"
 JAP_pnr_short_bow_of_asia_great_vehicle_japan_desc: "Your companion has neither erred nor been deceived, nor does he speak from desire. It is only a revelation given to him, taught by one mighty in strength. He appeared at the highest point of the east, then drew near and descended, until he was at the distance of two bows or closer. He revealed to the servant of the Lord what he had to reveal, and his heart did not deny what he saw."
