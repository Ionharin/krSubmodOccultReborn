 JAP_pnr_kanebukuro_kozuchi_modifier: "Kanebukuro and Kozuchi"
 JAP_pnr_takeda_vitamin_pharmaceutical_0: "Takeda Vitamin Pharmaceutical"
 JAP_pnr_takeda_vitamin_pharmaceutical_0_desc: "Takeda Pharmaceutical Company, which began in Kansai, first made its name selling traditional kanpo medicines. Roughly fifty years ago, it chose to shift toward Western pharmaceuticals. At first it imported foreign medicines as a distributor, but Takeda soon set out on its own pharmaceutical path: as drug and chemical research institutes were established around Osaka, Takeda grew from a regional Kansai enterprise into a pharmaceutical company of major importance to [JAP.GetName].\n\nIt has accumulated enough experience in synthetic chemistry and now seeks to expand its commercial reach in the chemical industry. In 1933 the Swiss chemist Tadeus Reichstein first synthesized vitamin C, a substance said to prolong life and relieve malnutrition. The method is currently held by the Swiss firm Roche, and because of its scarcity the drug is extremely expensive in the East Asian market. Takeda is now conducting experiments in hopes of gaining the ability to produce this miraculous substance."
 JAP_pnr_takeda_vitamin_pharmaceutical_1: "Takeda Vitamin Pharmaceutical"
 JAP_pnr_takeda_vitamin_pharmaceutical_1_desc: "$JAP_pnr_takeda_vitamin_pharmaceutical_0_desc$"
 JAP_pnr_furukawa_electric_industry_0: "Furukawa Electric Industrial Co., Ltd."
 JAP_pnr_furukawa_electric_industry_0_desc: "The Honjo Copper Smelting Works, founded in Yokohama in 1884, was the origin of Furukawa Electric Industrial Co., Ltd. and established Furukawa's character as a non-ferrous metals enterprise. In 1920, Furukawa merged its copper business with a newly acquired electric wire manufacturer, creating Furukawa Electric Industrial Co., Ltd. and integrating the whole business chain from mining to copper products. That same year, Furukawa handled a contract for a submarine cable to Shanghai, marking its formal arrival on the world stage.\n\nIn 1923, Furukawa began cooperation with Siemens of the German Empire. Although [GER.GetName] formally imposed strict trade embargoes on [JAP.GetName] after the Weltkrieg, these international giants still found gaps in Mitteleuropa: Austria and the Ottomans. Through subsidiaries operating there, they made contact and eventually formed the Furukawa-Siemens cooperation in East Asia, Fuji Electric Manufacturing Co., Ltd.\n\nThe most troublesome issue for Furukawa Electric is the difference between the electrical frequencies of Kanto and Kansai, caused by the different generating equipment purchased when [JAP.GetName] electrified during the Meiji era. This has sharply increased equipment manufacturing costs. Furukawa has long tried to persuade the government through allied legislators to unify the national grid, but with little success."
 JAP_pnr_furukawa_electric_industry_1: "Furukawa Electric Industrial Co., Ltd."
 JAP_pnr_furukawa_electric_industry_1_desc: "$JAP_pnr_furukawa_electric_industry_0_desc$"
 JAP_pnr_sekiyama_farm_plantation_base: "Sekiyama Farm Plantation Base"
 JAP_pnr_sekiyama_farm_plantation_base_desc: "Sekiyama Farm in Taiwan is a necessary raw-material base for us, and expanding it will help secure our supply of chemical feedstocks."
 JAP_pnr_production_management_office_0: "Production Management Office"
 JAP_pnr_production_management_office_0_desc: "Endless production expansion must be stopped. What we need is production planning, progress monitoring, quality assurance, and comprehensive coordination that considers all of these factors, so that we first grasp what the market currently lacks and then produce with quality assured."
 JAP_pnr_production_management_office_1: "Production Management Office"
 JAP_pnr_production_management_office_1_desc: "$JAP_pnr_production_management_office_0_desc$"
 JAP_pnr_investment_in_expectations: "Investment in Expectations"
 JAP_pnr_investment_in_expectations_desc: "Confidence is necessary to sustain the market. It is because of confidence and prospects that the market can bring wealth from the future into the present."
 JAP_pnr_conservative_policy: "Conservative Policy"
 JAP_pnr_conservative_policy_desc: "Taking a risk-averse strategy in unstable times helps ensure steady asset growth. Though slow, this has proven to be an effective defensive method of preservation."
 JAP_pnr_chain_of_leveraged_multiplication: "Chain of Leveraged Multiplication"
 JAP_pnr_chain_of_leveraged_multiplication_desc: "We have already seized every advantage in the market, and the banks themselves are part of us. With our present position, we can use financial leverage and financing to control the small and medium firms upstream and downstream."
 JAP_pnr_power_frequency_unification_underway: "Power Frequency Unification Underway"
 JAP_pnr_power_frequency_unification_underway_desc: ""
 JAP_pnr_frequency_unified: "Industrial Power Standardisation"
 JAP_pnr_frequency_unified_desc: "Although it was extremely difficult, we have achieved grid frequency unification between Kanto and Kansai through a compromise method: the use of substations. Now we can truly integrate the nation's electrical resources, and the additional cost of manufacturing electrical equipment is gone."
 JAP_pnr_industrial_security_act_idea: "Industrial Security Act"
 JAP_pnr_industrial_security_act_idea_desc: ""
 JAP_pnr_building_the_organs: "Building the Organs"
 JAP_pnr_building_the_organs_desc: "Industry is to the nation what organs are to the human body; without industry, the state collapses. After the Weltkrieg, the world economy has nearly been conquered by Mitteleuropa, and trade with the Third Internationale or a declining America is not enough for [JAP.GetName]. If [JAP.GetName] is to advance, it must find a new method: the healing and strengthening of [JAP.GetName] itself.\n\nThe state, as a basic demander, will create its own market to promote industrialisation. Whether through procurement guarantees, loan rediscounting, or protective tariffs against imports, government fiscal commitments can be used to move private capital, turning national credit into another industrial bank and organising available private savings into national industrial capital. Then a selected group of strong organs will be chosen, and these nutrients will flow continuously into them. In time, those organs will become immensely strong, and the nation itself will shed its exhausted body and become a vigorous man."
 JAP_pnr_advanced_science_education: "Advanced Science Education"
 JAP_pnr_advanced_science_education_desc: ""
 JAP_pnr_corporate_republicanism_idea: "Corporate Republicanism"
 JAP_pnr_corporate_republicanism_idea_desc: ""
 JAP_pnr_national_orders: "National Orders"
 JAP_pnr_national_orders_desc: ""
 JAP_pnr_miner_and_weaver: "Miner and Weaver"
 JAP_pnr_miner_and_weaver_desc: "When the Japan Industrial Club was founded in 1920, the sculptor Ogura Uichiro installed this historically significant statue on the roof of the club hall. It symbolises the two foundations of our modern industry: coal and textiles. These two industries carried our industry through darkness and toward the dawn. For many years, the members of the Industrial Club have devoted themselves to the happiness of the people of [JAP.GetName] and to the revival of Japanese industry. Although there were occasional unpleasant incidents with workers in the past, those were merely misunderstandings caused by insufficient communication. Such things are now old smoke. Today, with the cooperation of the Industrial Club's members, [JAP.GetName] has become one of the world's foremost industrial nations. We have proven once again that, even under [GER.GetName]'s economic sanctions, we can still find the road to prosperity. As the miner clears sand and earth with his hammer, and as the weaver spins beautiful cloth with her shuttle, the presidents in Tokyo today continue to strive alongside their employees and labourers for the interests and future of [JAP.GetName], challenging still higher peaks."
### Oomoto ###
 JAP_pnr_showa_oomoto_way_modifier: "The Showa Way of Oomoto"
 JAP_pnr_showa_oomoto_way_modifier_desc: "Oomoto is the name of the religion led by Deguchi Onisaburo. In politics, it is better known through the right-wing Showa Shinseikai. Yet this does not mean Oomoto is filled only with right-wingers: whether the blackmailer feared by politicians, the “Great Demon King Bodhisattva” Kita Ikki; Goto Fumio, the influential leader of the Kokui Society and “the Emperor's policeman”; or Mitamura Shiro, one of the Japanese Communist Party leaders now under arrest, all have deep connections to Oomoto. At the same time, many sinister rumours have poured from alleys and idle conversations: that Deguchi Onisaburo is a sorcerer able to bewitch anyone who speaks with him; that Oomoto is plotting to overthrow the Japanese state; that Oomoto is connected to the Imperial Way faction; that Oomoto is connected to the Control faction... These rumours are sensational or contradictory. Yet the strangest and most troubling among them was spoken by Baroness Tsurudono, niece of Empress Shoken, consort of Emperor Meiji:\n\n§xIndeed, you look exactly like him.§!"
 JAP_pnr_sakura_hill_modifier: "Hill of Cherry Blossoms"
 JAP_pnr_rural_revival: "Rural Revival"
 JAP_pnr_rural_revival_desc: "Ever since the Meiji Restoration, our rural regions have been deliberately neglected. The government treated the countryside as the price of industrialisation and modernisation, continually drawing people from villages into the cities through widening income gaps, leaving rural society anxious and unsettled in every sense. But farmers are people too, and farmland left without hands to till it will naturally fall into waste. This is the fundamental principle by which things move."
 JAP_pnr_patriotic_industrial_workers_association_0: "Patriotic Industrial Workers' Association"
 JAP_pnr_patriotic_industrial_workers_association_0_desc: "The organisation known as the Patriotic Industrial Workers' Association emerged from violent groups formed after the Weltkrieg by industrial workers with too much idle time. Most were construction workers, and thus often had stretches of enforced leisure. Under police guidance, they successfully transformed into a right-wing workers' group, taking responsibility when others could not act openly and injecting patriotic spirit into the heads, shoulders, and diaphragms of students, left-wing workers, and other liberals."
 JAP_pnr_patriotic_industrial_workers_association_1: "Patriotic Industrial Workers' Association"
 JAP_pnr_patriotic_industrial_workers_association_1_desc: "$JAP_pnr_patriotic_industrial_workers_association_0_desc$"
 JAP_pnr_subsidized_festivals: "Subsidised Festivals"
 JAP_pnr_subsidized_festivals_desc: "Festivals are a living Japanese tradition: rites of reverence for gods and ancestors, and occasions for the living to communicate and deepen their bonds. Yet as more and more people flow into cities, and as more and more time is seized by “work,” festivals themselves have fallen into neglect. We shall use administrative means to set things right and bring tradition back to this country."
 JAP_pnr_uprooting_intermediaries: "Uprooting Intermediaries"
 JAP_pnr_uprooting_intermediaries_desc: "Just as the bond between His Majesty the Emperor and his subjects has been severed by many malicious people, so too have city and countryside been torn into two communities by speculators and resellers shuttling between them. They should have lived in harmony, yet these “job introducers” and “grain resellers” have made them hate one another. To repair this breach, the first step is to deal with these intermediaries. Let the men who farm farm in peace, let the men who tune machinery continue tuning machinery, and let each person remain in their proper place, free from wicked temptations such as “want to make real money?” and “you deserve somewhere better.”"
 JAP_pnr_preaching_god_with_bread: "Preaching God with Bread"
 JAP_pnr_preaching_god_with_bread_desc: "The crowd was hungry and asked Jesus for food. Jesus took five loaves of unleavened bread and two fish, and fed thousands. Through miracle he preached bread, satisfying men's material needs with divine power. Yet the crowd soon grew hungry again and continued searching for someone who could give them food. Then they met Marx.\n\nMarx told them that if they wanted real food, they must offer their strength to a god, the god of revolution. Marx preached miracle with bread, using people's hunger for material things to pour divine faith into their empty shells.\n\n- Deguchi Onisaburo"
 JAP_pnr_imperial_way_economy_idea: "Imperial Way Economy"
 JAP_pnr_imperial_way_economy_idea_desc: "The so-called “Imperial Way Economy” refers to a pure and retrograde economic model. Since everything in this country belongs to His Majesty the Emperor, we subjects must put ourselves in the proper attitude. There is no such thing as “trade”; all that we use and consume is the treasure left by His Majesty, or rather by Kunitokotachi, the foundational deity of this world, and Amaterasu, who opened the imperial line of Japan.\n\nFor this reason, His Majesty is plainly the master of all property, and all of our debts are merely props in a childish game of house. If His Majesty commands it, he may print a note worth tens of billions of yen and use it to settle the “debts” accumulated in this playacting. Like the ancient gods granting treasures to mortals, this could temporarily solve most of the social debts now facing our country."
 JAP_pnr_oo_getsu_hime: "Oo-getsu-hime"
 JAP_pnr_oo_getsu_hime_desc: "Susanoo killed her in anger, for he mistakenly believed she had mocked and dishonoured the Three Noble Children in an impure fashion.\nWhen the great goddess died, her corpse became five kinds of seed:\nfrom her head grew silkworm cocoons,\nfrom her eyes grew rice,\nfrom her ears grew millet,\nfrom her genitals grew wheat,\nfrom her buttocks grew beans.\nKamimusubi, gather the five grains from her corpse and sow them among mankind."
 JAP_pnr_once_more_as_one: "Once More as One"
 JAP_pnr_once_more_as_one_desc: "Society is formed by many diligent people gathered together. In remote antiquity, when the gods still walked among men and people had not yet lost their innocence, this diligent morality united them and led them beside the gods from one miracle to another. Yet as selfish poison corroded human hearts, the gods departed from mankind, and evil spirits began invading human dwellings, bringing plague, famine, death, and war.\nThe gods grieved for mankind's suffering and said: “Had people kept their virtues, these sufferings would not have happened. Yet we cannot bear to see this. Let us send them a messenger; let us send a ruler under heaven to lead them. May they awaken soon and unite once more.” Now the beautiful qualities we had lost have returned to our society. From the easternmost edge of the islands to the westernmost, the people are indeed united once more around His Majesty the Emperor. And one day all people in the world, from [JAP.GetName] to Antarctica, shall be united around the Emperor."
 JAP_pnr_beyond_myth_trait: "That Which Transcends Myth"
 JAP_pnr_dust_despised_by_men_trait: "Dust Despised by Men"
 JAP_pnr_holy_fool_trait: "Holy Fool"
 JAP_pnr_schleicher_of_the_east_trait: "Schleicher of the East"
 JAP_pnr_bald_mount_fuji_trait: "Bald Mount Fuji"
 JAP_pnr_reitai_juso_category: "Reitai Juso"
 JAP_pnr_reitai_juso_category_desc: "Current Reitai Juso progress: §Y[?JAP_pnr_om_circle_progress|0]§!/100\nCurrent subordinate accumulation: §Y[?JAP_pnr_om_lower_progress|0]§!/100"
 JAP_pnr_om_clock_tt: "Reitai Juso progress: §Y[?JAP_pnr_om_circle_progress|0]§!/100"
 JAP_pnr_om_triangle_tt: "Subordinate accumulation: §Y[?JAP_pnr_om_lower_progress|0]§!/100\n\nWhen the lower progress reaches §Y100§!, it will reset to zero and increase the upper circular progress bar by §Y10§!."
 JAP_pnr_reitai_juso_test_progress: "Test Reitai Juso Progress"
 JAP_pnr_om_lower_progress_gain_tt: "Subordinate accumulation will increase by §Y25§!."
### Konoe ###
 JAP_pnr_new_party_preparation_category: "[JAP_pnr_kn_category_name]"
 JAP_pnr_kokutai_clarification: "Clarification of the Kokutai"
 JAP_pnr_kokutai_clarification_desc: "The Meiji Constitution is, in truth, a document of vague words. Precisely because so many of its clauses are ambiguous, it has granted the government the widest possible authority of interpretation. As early as 1935, Professor Minobe Tatsukichi was drawn into the turmoil surrounding the “emperor organ theory,” a controversy born from the constitution's failure to clearly define the kokutai. Whatever else may be said, the government has now stated its position and truly clarified the meaning of the kokutai."
 JAP_pnr_parliamentary_harmony: "Parliamentary Harmony"
 JAP_pnr_parliamentary_harmony_desc: ""
 JAP_pnr_economic_model_reform_0: "Economic Model Reform"
 JAP_pnr_economic_model_reform_0_desc: "[JAP.GetName] is poor in resources. To make the fullest use of its existing industry and raw materials, shifting the economy from private management to unified state control through local organs will help improve productive efficiency."
 JAP_pnr_economic_model_reform_1: "$JAP_pnr_economic_model_reform_0$"
 JAP_pnr_economic_model_reform_1_desc: "$JAP_pnr_economic_model_reform_0_desc$"
 JAP_pnr_electoral_reform_0: "Electoral Reform"
 JAP_pnr_electoral_reform_0_desc: "Past elections depended on political donations; without money, one could scarcely campaign at all. This was the root of collusion between politics and business, the decay of party politics, and the growth of corruption. To secure support for future campaigns, legislators shamelessly pushed policies beneficial to those who paid them rather than to the people. This unhealthy custom will be uprooted through the electoral reform movement: every candidate will now register as a member of the Wasei Komeikai and receive campaign funds directly from the government. Political donations from business and financial circles have not been abolished, but they may only be paid into accounts designated by the Komeikai and then distributed uniformly to all candidates. With this measure, legislators may finally cease worrying about campaign money and think instead about what benefits the country and its people."
 JAP_pnr_electoral_reform_1: "$JAP_pnr_electoral_reform_0$"
 JAP_pnr_electoral_reform_1_desc: "$JAP_pnr_electoral_reform_0_desc$"
 JAP_pnr_electoral_reform_2: "$JAP_pnr_electoral_reform_0$"
 JAP_pnr_electoral_reform_2_desc: "$JAP_pnr_electoral_reform_0_desc$"
 JAP_pnr_electoral_reform_3: "$JAP_pnr_electoral_reform_0$"
 JAP_pnr_electoral_reform_3_desc: "$JAP_pnr_electoral_reform_0_desc$"
 JAP_pnr_electoral_reform_4: "$JAP_pnr_electoral_reform_0$"
 JAP_pnr_electoral_reform_4_desc: "$JAP_pnr_electoral_reform_0_desc$"
 JAP_pnr_all_japan_workers_industrial_patriotic_association: "All-Japan Workers' Industrial Patriotic Association"
 JAP_pnr_all_japan_workers_industrial_patriotic_association_desc: ""
 JAP_pnr_new_unity_economy: "New Unity Economy"
 JAP_pnr_new_unity_economy_desc: ""
 JAP_pnr_resist_hegemonic_threats: "Resist Hegemonic Threats"
 JAP_pnr_resist_hegemonic_threats_desc: "As the first Asian country to industrialise and enter the ranks of the great powers, Japan must shoulder the duty of resisting European and American hegemony. These powers bully the weak and spread their claws across Asia, from the dragon throne in Beijing to the harbour at Singapore. The superpower led by [GER.GetName] manipulates its puppet strings and constantly threatens Asian independence. We must take up our responsibility, become the shield of all Asians, and drive the black eagle and its servants from this land!"
 JAP_pnr_defend_ancient_traditions: "Defend Ancient Traditions"
 JAP_pnr_defend_ancient_traditions_desc: "[JAP.GetName] has ancient traditions of its own. Since antiquity our country has been shaped by morality and rites; we honour justice over peace and propriety over compromise. Yet these traditions were cast aside by the invasion of Western “pacifism.” So-called pacifism is no more than a muddling doctrine meant to preserve hegemony. Those who approve of pacifism may have been deceived by its pleasant appearance, or may themselves be accomplices of that hegemony."
 JAP_pnr_red_dukes_rule: "Rule of the Red Duke"
 JAP_pnr_red_dukes_rule_desc: "Under the rule of the Wasei Komeikai, Japan has become an utterly different country. Every aspect of life and production has been “integrated,” and even the party itself has dissolved in the furnace of time, forming a new political order of one country and one party, even if the Komeikai is not, nominally, a mere party organisation. Some observers believe this state-command model could serve as a pattern for late-developing Asian countries, and that $JAP_pnr_fumimaro_konoe$ and the aides gathered around him have indeed opened a new path for Asia, suited to its own development. Some media outlets regard it as a Japanese adaptation of the totalitarian charters of Mosley, Mussolini, and others, calling Japan “a monarchy in name and a socialist state in substance,” and arguing that state power has effectively passed to this constitutional anomaly, the Wasei Komeikai, endowed with ambiguous authority.\n\nOthers call $JAP_pnr_fumimaro_konoe$ himself the “Red Duke,” both echoing Schleicher's distant Western epithet as the “Red General” and reinterpreting the name Konoe bore in the early days of his administration."
 JAP_pnr_interconnected_nation: "An Interconnected Nation"
 JAP_pnr_interconnected_nation_desc: "The normal operation of the state and the normal conduct of government business depend on communication between people. A state that loses its ability to communicate is like a living mass collapsed on the ground, deprived of normal motion. This communicative function had operated before, but only through connections built separately between departments. The Taisei Yokusankai can now assist the government in this field and prove the value of its existence."
 JAP_pnr_state_press_control: "State Press Control"
 JAP_pnr_state_press_control_desc: "To build a country united from top to bottom, and to reverse the long-standing habit of lax individualism, control over the press is indispensable. If one newspaper says something has happened in the east and another says it has not, then one side must be fabricating sensational falsehoods. Such contradiction only breeds discord and struggle among the people. A single voice is the foundation of national unity. The Taisei Yokusankai will fulfil its duty of guidance and supervision, truly realising its role in assisting political operation."
 JAP_pnr_centrally_guided_economy: "Centrally Guided Economy"
 JAP_pnr_centrally_guided_economy_desc: ""
 JAP_pnr_smash_unemployed_parasites: "Smash the Unemployed Parasites"
 JAP_pnr_smash_unemployed_parasites_desc: ""
 JAP_pnr_total_mobilization: "Total Mobilisation"
 JAP_pnr_total_mobilization_desc: "[JAP.GetName] is a country poor in resources. Therefore every resource of life, every resource of production, and even people themselves must be mobilised against this meagre reality. Only by standing so tightly together can we overcome every difficulty before us. Only with the great collective spirit that sees one's own left hand as another's left hand can we create what ordinary people call a “miracle.” Yet we know this is no miracle. It is the inseparable love of the nation and His Majesty that mobilises us as one."
 JAP_pnr_way_of_assistance: "The Way of Assistance"
 JAP_pnr_way_of_assistance_desc: "At first, people misunderstood the Taisei Yokusankai as a dictatorship, a socialist conspiratorial clique, or a product that would “subvert the kokutai and endanger the Meiji Constitution.” Under $JAP_pnr_fumimaro_konoe$'s leadership, the Yokusankai has proven through its own actions that such misunderstandings were only anxieties toward something new. Since its establishment, it has always observed its position and nature, merely offering “advice” on politics and serving, at many necessary moments, as political lubricant. It does not covet power. It acts only from love for [JAP.GetName] and the hope that the country may become better.\n\nNow many legislators understand the Yokusankai's way of assistance. It has also been entrusted with more political activities that, while small, are vital to the country: from filming movies that promote exemplary people in production and daily life, to entering schools and unions to explain government policy. This is the value of the Taisei Yokusankai: to carry policy itself into every corner of society, letting every subject know the government's intention and, through that knowledge, binding all things into one whole: the way of cooperative assistance."
