### Party Name Setting ###

 ### Character and trait ###

 JAP_pnr_inukai_tsuyoshi: "Inukai Tsuyoshi"
 JAP_pnr_inukai_tsuyoshi_leader_desc: "§YBorn:§!§L1855; Bicchū Province, San'yōdō, Japan§!\n§YFaction:§!§2Seiyūkai§!\n§YBackground:§!§LInukai Tsuyoshi was born into a samurai family said to have ties to the Ashikaga shogunate. After graduating from Keio Gijuku in 1876, he traveled to the front lines of the Satsuma Rebellion as a war correspondent, where he recorded the story of the “Battotai.”\n\nIn 1882, he joined the Rikken Kaishinto, and eight years later was elected to the House of Representatives. When the Katsura Taro Cabinet precipitated a constitutional crisis in 1913, Inukai and Ozaki Yukio joined forces to organize the First Movement to Protect Constitutional Government, rallying the public and political parties to bring down Katsura's military-dominated cabinet and thereby safeguard the continuation of parliamentary government. This achievement earned Inukai and Ozaki the epithet “Gods of Constitutionalism.” Inukai had intended to retire from politics thereafter, but his constituents back home had other ideas. Without even informing him, they nominated him as a candidate in the “by-election prompted by Inukai Tsuyoshi's resignation,” effectively forcing him back into political life.\n\nFollowing the end of the World War, intervention by the Inukai Cabinet helped Japan's economy achieve a modest recovery. Yet hardship persisted in the countryside, while extremist movements continued to gain ground. At the same time, the shortcomings of party politics were becoming increasingly apparent, as competing interest groups attacked one another in the Diet and even within their own parties in pursuit of factional advantage. Beset by enemies from both within and without, Inukai himself found it increasingly difficult to keep the great ship of the Seiyūkai on course.§!§!\n\n§YNote: Inukai Tsuyoshi was an early member of the Revive China Society founded by Sun Yat-sen in Hawaii. Together with figures such as Tōyama Mitsuru of the Black Dragon Society, he traveled to China to investigate conditions there, and later provided the Chinese Kuomintang with generous financial aid, armed personnel, and technical assistance in the hope of bringing about the liberation of Asia.§!"
