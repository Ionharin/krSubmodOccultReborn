 JAP_pnr_plan_sagami_dam: "Plan the Sagami Dam"
 JAP_pnr_plan_sagami_dam_desc: "The Yokohama-Kanagawa industrial belt is growing by the day, and its demand for electricity has become immense. To secure normal industrial production and sustain the strong heart of our industry, hydroelectric development along the nearby Sagami River basin has become a matter of real importance. In 1935, a plan for the Sagami River Dam was submitted to the bureaucrats of the Home Ministry. Unfortunately, those bureaucrats preferred projects from which they could personally benefit, and cast this undertaking, so favourable to the people, into the wastebasket. Now we shall restart its construction."
