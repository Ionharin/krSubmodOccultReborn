 JAP_pnr_leap_forward_for_the_holy_war: "Leap Forward for the Holy War"
 JAP_pnr_leap_forward_for_the_holy_war_desc: "The Struggle Production Union means seizing the rightful power of production through struggle, and nourishing the fundamental strength of struggle through production. To truly realise the revival of the Japanese people, a holy war in both the material and spiritual worlds is unavoidable. Through that holy war, [JAP.GetName] will be renewed and step out from the shadows of the past."
