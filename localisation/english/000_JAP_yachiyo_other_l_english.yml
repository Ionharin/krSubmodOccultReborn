 JAP_pnr_gozen_arbitration_conference_active: "Gozen Arbitration Conference Underway"
 JAP_pnr_operation_launched_modifier: "$JAP_pnr_offensive_rescript$"
 JAP_pnr_operation_launched_modifier_desc: "By His Majesty's decree, this region has been designated as a key strategic zone that must be captured. For the great cause of our nation and the dignity of our people, advance!"
 JAP_pnr_imperial_progress: "Imperial Progress"
 JAP_pnr_imperial_progress_desc: "The Imperial Household will arrange a nationwide progress for His Majesty, allowing the Emperor to better understand Japan's current condition while consolidating his rule and demonstrating his command over the government."
 JAP_pnr_gozen_arbitration_conference: "Gozen Arbitration Conference"
 JAP_pnr_gozen_arbitration_conference_desc: "The imperial command has been issued. The Emperor has summoned bureaucrats and representatives of the Diet to an arbitration conference, where accumulated special agendas will be questioned and judged before the throne."
 JAP_pnr_offensive_rescript: "Offensive Rescript"
 JAP_pnr_offensive_rescript_desc: "The so-called imperial command was once merely an order that the Emperor, as symbol of supreme command, was obliged to issue within the Army's and Navy's operational orders. It was drafted by the Army or Navy section of Imperial General Headquarters, approved by the Emperor, and transmitted by the chiefs of staff. Now, however, the imperial command carries true weight: if the Emperor so orders, the military must concentrate its forces to achieve his purpose."
 JAP_pnr_prepare_decisive_fleet_battle: "Prepare the Decisive Fleet Battle"
 JAP_pnr_prepare_decisive_fleet_battle_desc: "$JAP_pnr_offensive_rescript_desc$"
 JAP_pnr_build_military_factory: "Build Military Factories"
 JAP_pnr_build_military_factory_desc: ""
 JAP_pnr_build_civilian_factory: "Build Civilian Factories"
 JAP_pnr_build_civilian_factory_desc: ""
 JAP_pnr_build_dockyard: "Build Dockyards"
 JAP_pnr_build_dockyard_desc: ""
 JAP_pnr_attend_public_events: "Attend Public Events"
 JAP_pnr_attend_public_events_desc: "Appearing before the public at critical moments, and showing concern for the people, will help the Emperor maintain his connection with them and use public sentiment to restrain the conduct of the government and the armed forces."
 JAP_pnr_production_rescript: "Rescript on Production"
 JAP_pnr_production_rescript_desc: "His Majesty has granted his subjects a rescript: all should place the strength of the nation and abundance of production above all else."
 JAP_pnr_love_farmers_rescript: "Rescript on Agriculture"
 JAP_pnr_love_farmers_rescript_desc: "His Majesty has granted his subjects a rescript: agriculture is the foundation of the state. May the rice harvest be rich, the winds and rains favourable, and all sectors of society show sympathy to farmers in their hardship."
 JAP_pnr_frugality_rescript: "Rescript on Frugality"
 JAP_pnr_frugality_rescript_desc: "His Majesty has granted his subjects a rescript: the spirit of our people lies in endurance, in not indulging appetite or wasting precious rice. Even with treasures piled high, they shall not fall into decadence, but store what is needed for uncertain times."
 JAP_pnr_morale_rescript: "Rescript on Morale"
 JAP_pnr_morale_rescript_desc: "His Majesty has granted his subjects a rescript: the patriotic hearts of the soldiers bring joy and pride. To fight for the nation and justice is the greatest of causes, and for that reason they are treasures of the state and pillars of society."
