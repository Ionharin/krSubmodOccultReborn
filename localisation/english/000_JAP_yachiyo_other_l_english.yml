 JAP_pnr_gozen_arbitration_conference_active: "Gozen Arbitration Conference Underway"
 JAP_pnr_operation_launched_modifier: "$JAP_pnr_offensive_rescript$"
 JAP_pnr_operation_launched_modifier_desc: "By His Majesty's decree, this region has been designated as a key strategic zone that must be captured. For the great cause of our nation and the dignity of our people, advance!"
 JAP_pnr_imperial_progress: "Imperial Progress"
 JAP_pnr_imperial_progress_desc: "The Imperial Household will arrange a nationwide progress for His Majesty, allowing the Emperor to better understand Japan's current condition while consolidating his rule and demonstrating his command over the government."
 JAP_pnr_gozen_arbitration_conference: "Gozen Arbitration Conference"
 JAP_pnr_gozen_arbitration_conference_desc: "The imperial command has been issued. The Emperor has summoned bureaucrats and representatives of the Diet to an arbitration conference, where accumulated special agendas will be questioned and judged before the throne."
 JAP_pnr_offensive_rescript: "Offensive Rescript"
 JAP_pnr_offensive_rescript_desc: "The so-called imperial command was once merely an order that the Emperor, as symbol of supreme command, was obliged to issue within the Army's and Navy's operational orders. It was drafted by the Army or Navy section of Imperial General Headquarters, approved by the Emperor, and transmitted by the chiefs of staff. Now, however, the imperial command carries true weight: if the Emperor so orders, the military must concentrate its forces to achieve his purpose."
 JAP_pnr_prepare_decisive_fleet_battle: "Prepare the Decisive Fleet Battle"
 JAP_pnr_prepare_decisive_fleet_battle_desc: "$JAP_pnr_offensive_rescript_desc$"
 JAP_pnr_build_military_factory: "Build Military Factories"
 JAP_pnr_build_military_factory_desc: ""
 JAP_pnr_build_civilian_factory: "Build Civilian Factories"
 JAP_pnr_build_civilian_factory_desc: ""
 JAP_pnr_build_dockyard: "Build Dockyards"
 JAP_pnr_build_dockyard_desc: ""
 JAP_pnr_attend_public_events: "Attend Public Events"
 JAP_pnr_attend_public_events_desc: "Appearing before the public at critical moments, and showing concern for the people, will help the Emperor maintain his connection with them and use public sentiment to restrain the conduct of the government and the armed forces."
 JAP_pnr_production_rescript: "Rescript on Production"
 JAP_pnr_production_rescript_desc: "His Majesty has granted his subjects a rescript: all should place the strength of the nation and abundance of production above all else."
 JAP_pnr_love_farmers_rescript: "Rescript on Agriculture"
 JAP_pnr_love_farmers_rescript_desc: "His Majesty has granted his subjects a rescript: agriculture is the foundation of the state. May the rice harvest be rich, the winds and rains favourable, and all sectors of society show sympathy to farmers in their hardship."
 JAP_pnr_frugality_rescript: "Rescript on Frugality"
 JAP_pnr_frugality_rescript_desc: "His Majesty has granted his subjects a rescript: the spirit of our people lies in endurance, in not indulging appetite or wasting precious rice. Even with treasures piled high, they shall not fall into decadence, but store what is needed for uncertain times."
 JAP_pnr_morale_rescript: "Rescript on Morale"
 JAP_pnr_morale_rescript_desc: "His Majesty has granted his subjects a rescript: the patriotic hearts of the soldiers bring joy and pride. To fight for the nation and justice is the greatest of causes, and for that reason they are treasures of the state and pillars of society."
### Kokoshiha ###
 JAP_pnr_japans_great_development_bonus_tt: "§2After completing this §YFocus§!, every ten £GFX_civ_factory Civilian Factories will permanently provide an additional 5£GFX_steel_texticon and 1£GFX_tungsten_texticon Strategic Resources.§!"
 JAP_pnr_kaikosha_modifier: "Kaikosha"
 JAP_pnr_kaikosha_modifier_desc: "Founded in 1877, the Kaikosha is a social and fraternal association for officers of the [JAP.GetName] Army. It was also the true birthplace of the group that contemporaries mistakenly labeled the “Control Faction.” In 1931, Tanaka Kiyoshi, Shikata Ryōji, Nagata Tetsuzan, and Ikeda Sumihisa met at the Kaikosha and formed a secret group dedicated to reforming domestic politics. Its purpose was to study the numerous conspiracies and abortive coups that had shaken the country, and from them derive methods by which society itself might be reformed. The collective later known as the “Control Faction” advocated achieving national renewal through legal means, regarding acts of destruction as nothing more than a useless burden. They believed that what [JAP.GetName] truly needed was “constructive work.” On the whole, they were a group of moderate reformist officers. §RAfter all, the Control Faction never plotted any coups or conspiracies themselves... right?§!"
 JAP_pnr_kaikosha_modifier_tt: "§oThe Kaikosha's §!current £GFX_legitimacy power projection within the §YCouncil for the Rectification and Renovation of State Affairs§! is: §G[?JAP_pnr_kaikosha_power|0]§!\nCurrent leading figures of the Kaikosha:\n§qNagata Tetsuzan§!\n§qTanaka Kiyoshi§!\n§qShikata Ryōji§!\n§qIkeda Sumihisa§!\n"
 JAP_pnr_ugaki_group_modifier: "Ugaki Group"
 JAP_pnr_ugaki_group_modifier_desc: "The Ugaki Group refers to the small circle surrounding the “grand old man” Ugaki Kazushige, together with those whom he patronized early in their careers and who have since risen to positions of prominence. If most military men have turned to support the Council for the Rectification and Renovation of State Affairs out of dissatisfaction with the present state of party politics, they will soon discover that Ugaki Kazushige is, in truth, little more than a party politician in uniform. On the one hand, Ugaki actively cultivates contacts with the political parties in order to gather information; on the other, he quietly passes that information on to others within his circle so that the group as a whole may profit from it. §RIn this regard, they might be considered a military organization that has learned the despicable tactics of party politicians.§!"
 JAP_pnr_ugaki_group_modifier_tt: "§PThe Ugaki Group's §!current £GFX_legitimacy power projection within the §YCouncil for the Rectification and Renovation of State Affairs§! is: §G[?JAP_pnr_ugaki_group_power|0]§!\nCurrent leading figures of the Ugaki Group:\n§NUgaki Kazushige§!\n§NAbe Nobuyuki§!\n§NMinami Jirō§!\n§NUmezu Yoshijirō§!\n"
 JAP_pnr_seiyosha_modifier: "Seiyōsha"
 JAP_pnr_seiyosha_modifier_desc: "The Seiyōsha is perhaps the most bewildering of all the groups among the reformist officers. If one fully accepts the conventional division between the so-called “Control Faction” and “Imperial Way Faction,” then these men ought perhaps to be called the “Banquet Faction”—mainly because most of their members spend their days carousing in the finest restaurants of Tokyo's most fashionable districts. Their leader, Hashimoto Kingorō, was influenced by the Young Turks during his time in the Ottoman Empire and came to yearn for a reformist military capable of smashing the conservative old order. This led its members to launch “coup” after “coup,” only for nearly every attempt to collapse before it had even begun, as drink invariably induced them to reveal the entire plan in public. §RUnlike the other groups, the Seiyōsha is not composed exclusively of Army personnel; a number of naval staff officers have also joined the organization.§!"
 JAP_pnr_seiyosha_modifier_tt: "§nThe Seiyōsha's §!current £GFX_legitimacy power projection within the §YCouncil for the Rectification and Renovation of State Affairs§! is: §G[?JAP_pnr_seiyosha_power|0]§!\nCurrent leading figures of the Seiyōsha:\n§pHashimoto Kingorō§!\n§pShigeto Chiaki§!\n§pKatō Kanji§!\n§pOka Takazumi§!\n"
 JAP_pnr_end_the_tide_of_chaos: "End the Tide of Chaos"
 JAP_pnr_end_the_tide_of_chaos_desc: "Members of the Imperial Diet, professional revolutionaries, and hot-blooded officers all claimed that they would bring [JAP.GetName] a brand-new future. In the end, all they did was make the present even more chaotic. These drunkards, some mad, some obsessed with money, and some intoxicated by fame, have all left the table satisfied. What [JAP.GetName] and its people need now are cleaners capable of clearing that table, and dutiful police officers capable of teaching these alcohol-soaked fanatics a lesson."
 JAP_pnr_cabinet_planning_board: "Cabinet Planning Board"
 JAP_pnr_cabinet_planning_board_desc: "To broaden our horizontal front, we have recruited a group of new bureaucrats with rational minds and an interest in numbers from various political departments, and established the new Cabinet Planning Board. Through our common efforts, Japan will strengthen itself in the most rational way possible."
 JAP_pnr_census_underway: "Census Underway"
 JAP_pnr_census_underway_desc: ""
 JAP_pnr_command_politics_0: "Command Politics"
 JAP_pnr_command_politics_0_desc: "The army need not rely only on violence to obtain what it needs. Is the Army Minister in the cabinet not a civilian official as well? Without question, by using this 'civilian' as the means to control the Army Minister, we can reasonably secure the army's interests from within parliament."
 JAP_pnr_command_politics_1: "$JAP_pnr_command_politics_0$"
 JAP_pnr_command_politics_1_desc: "$JAP_pnr_command_politics_0_desc$"
 JAP_pnr_command_society: "Command Society"
 JAP_pnr_command_society_desc: "To build a rational and reasonable ordered state, and to ensure that our limited resources are all used in the areas most urgently needed at present, strict obedience to orders is a necessary virtue. If someone cannot achieve it, they should be educated; if education still cannot teach them, then society itself should eliminate them."
 JAP_pnr_state_led_business_contracts_0: "State-Led Business Contracts"
 JAP_pnr_state_led_business_contracts_0_desc: "Unregulated capitalism expands only in disorder. Wherever profits are greatest, it rushes there. Within this endless luxury, social crisis and economic ruin eventually erupt. The government must fulfil its duty to guide the development of these enterprises."
 JAP_pnr_state_led_business_contracts_civilian: "$JAP_pnr_state_led_business_contracts_0$: Civil Contract"
 JAP_pnr_state_led_business_contracts_civilian_desc: "$JAP_pnr_state_led_business_contracts_0_desc$"
 JAP_pnr_state_led_business_contracts_military: "$JAP_pnr_state_led_business_contracts_0$: Military Contract"
 JAP_pnr_state_led_business_contracts_military_desc: "$JAP_pnr_state_led_business_contracts_0_desc$"
 JAP_pnr_state_led_business_contracts_change_m_tt: "§1Our economy is regulated by §YCabinet Planning Board§!. When the number of £GFX_civ_factory exceeds £GFX_mil_factory, this contract will change.§!"
 JAP_pnr_state_led_business_contracts_change_c_tt: "§1Our economy is regulated by §YCabinet Planning Board§!. When the number of £GFX_mil_factory exceeds £GFX_civ_factory, this contract will change.§!"
 JAP_pnr_rational_army: "Rational Army"
 JAP_pnr_rational_army_desc: ""
 JAP_pnr_ministry_of_war_planning_0: "Ministry of War Planning"
 JAP_pnr_ministry_of_war_planning_0_desc: "We have ended the long-standing split between the General Staff Office and the Army Ministry. Although the merger of personnel and the arrangement of posts will still cause some friction in cooperation, at least we have thoroughly rationalised the matter institutionally."
 JAP_pnr_ministry_of_war_planning_1: "$JAP_pnr_ministry_of_war_planning_0$"
 JAP_pnr_ministry_of_war_planning_1_desc: "$JAP_pnr_ministry_of_war_planning_0_desc$"
 JAP_pnr_rational_clock: "Rational Clock"
 JAP_pnr_rational_clock_desc: "In the Cabinet Planning Board, hundreds of experts have carried out vast calculations on the basis of enormous quantities of data and produced a flexible, self-adjusting timetable. From the work of labourers in steel mills to the rest periods of elementary school pupils, everything has been measured by the ruler of reason. We are moving toward a rational society; we are moving toward the final form of Japanese society."
 JAP_pnr_greater_japan_social_control_institute: "Greater Japan Social Control Institute"
 JAP_pnr_greater_japan_social_control_institute_desc: "The world we inhabit is itself composed of vast quantities of data and variables: the angle of a fighter's machine-gun fire in a dive, the balance of forces between opposing sides in war, the carbon content of iron, a middle school student's lunchbox. Information and truth about this world are constantly pouring out from these concrete realities. Once we grasp them, achieving our desired objectives becomes exceedingly simple. By imposing universal and comprehensive control over society, we can place the whole of society within the reports before us, and nothing will be able to escape them."
 JAP_pnr_war_on_poverty: "War on Poverty!"
 JAP_pnr_war_on_poverty_desc: "Our country is extremely poor in resources, and this is an undeniable fact. Before the situation improves, we must vigorously develop metal recycling technology. Precious treasures are hidden within this scrap metal, and fortunately most people in the world have not realised that they are throwing away such wealth every day. This allows us to import discarded metals from abroad at extremely low prices."
 JAP_pnr_purified_and_cleansed: "Purified and Cleansed"
 JAP_pnr_purified_and_cleansed_desc: "The chaotic clouds hanging over the Eight Isles have finally been swept away. Through our reconstruction, [JAP.GetName] has become a perfect rational state. We have erased all unreasonable things and placed every corner of society under the complete control of the government, while a powerful industrial and military foundation has been fully built through the tireless work of our comrades in the Planning Board. Under this almost perfect system, no country can now match us. We shall return to the world stage and prove that we are not only the foremost power of Asia, but the first among the world!"
### NatPop ###
 JAP_pnr_scientific_socialism_0: "Scientific Socialism"
 JAP_pnr_scientific_socialism_0_desc: "\"Scientific Japanese Socialism\" is a new socialist model advocated by Akamatsu Katsumaro. Syndicalists focus on copying British and French economic action, while Bolsheviks hope to achieve something in politics. Scientific Socialism surpasses them by avoiding hollow debate entirely and focusing instead on practical policies with real effect.\n\nBefore Scientific Socialism was born, every proletarian movement in [JAP.GetName] carried a blind sense of foreign imitation, with no roots in the framework of the Japanese nation and state. If Japan truly wishes to achieve transformation, it must analyse society scientifically from reality itself. And if people do so, they will inevitably agree with Akamatsu Katsumaro's claim: all people and all nations are obliged to demand an equal right to survival. It is impossible to imagine only [JAP.GetName] being confined to an island and required to sacrifice herself for so-called world peace."
 JAP_pnr_scientific_socialism_1: "$JAP_pnr_scientific_socialism_0$"
 JAP_pnr_scientific_socialism_1_desc: "$JAP_pnr_scientific_socialism_0_desc$"
 JAP_pnr_scientific_socialism_2: "$JAP_pnr_scientific_socialism_0$"
 JAP_pnr_scientific_socialism_2_desc: "$JAP_pnr_scientific_socialism_0_desc$"
 JAP_pnr_japanese_social_economy_0: "Japanese-Style Social Economy"
 JAP_pnr_japanese_social_economy_0_desc: "Our country is poor in resources. In a sense, we are the true proletarian among all nations of the world. Precisely for that reason, we must concentrate all existing strength to break this injustice. Just as poor families of old pooled everything they had to forge a pitchfork, then joined countless other families carrying all their property and their lives to resist oppression, the same principle applies to the nation today: comprehensive state control over the economic sphere."
 JAP_pnr_japanese_social_economy_1: "$JAP_pnr_japanese_social_economy_0$"
 JAP_pnr_japanese_social_economy_1_desc: "$JAP_pnr_japanese_social_economy_0_desc$"
 JAP_pnr_territorial_liberation_war: "Territorial Liberation War"
 JAP_pnr_territorial_liberation_war_desc: "As we have repeatedly stressed, class oppression exists not only between people, but also between nations. If we cannot smash oppression among nations and liberate the territory that rightfully belongs to us, then it will be difficult to speak of national progress, or of unity and liberation for the whole world."
 JAP_pnr_patriotic_education: "Patriotic Education"
 JAP_pnr_patriotic_education_desc: ""
 JAP_pnr_flag_is_a_weapon: "The Flag Is a Weapon"
 JAP_pnr_flag_is_a_weapon_desc: "We hold boundless love for our country and nation, and we inherit and carry forward the spiritual legacy of the first socialist state in history, the Paris Commune. Just as the Paris Commune once faced countless reactionaries, we too, as a socialist country, are now blockaded economically and diplomatically by a crowd of imperialists. But we will never betray this flag. Beneath it, we will smash the tyrants' enslavement of us, protect the rightful interests of the people, and defend the rightful interests of a true proletarian nation. They will learn that the flames of the red sun shall burn every chain of bondage to ash!"
 JAP_pnr_uprising_of_the_japanese_nation: "Uprising of the Japanese Nation"
 JAP_pnr_uprising_of_the_japanese_nation_desc: "Among those compatriots who became socialists out of an \"unusual\" fascination, there are always voices calling us to fight for some foreign comrades or some foreign liberation. It is admirable for passionate youth to care about the world. Yet they always wish to make [JAP.GetName] into a weapon or paving stone for strangers they have never met. This is only another form of the Kodoha's paving-stone doctrine. The Japanese nation fights for the Japanese nation, and only for the Japanese nation. If anything must be defended, it is the dignity of the Japanese nation itself, the continuation of [JAP.GetName], and the safety of His Majesty the Emperor, symbol of the state and bond of the nation."
 JAP_pnr_uprising_of_the_japanese_nation_anti_syndicalist: "$JAP_pnr_uprising_of_the_japanese_nation$"
 JAP_pnr_uprising_of_the_japanese_nation_anti_syndicalist_desc: "$JAP_pnr_uprising_of_the_japanese_nation_desc$"
 JAP_pnr_uprising_of_the_japanese_nation_anti_german: "$JAP_pnr_uprising_of_the_japanese_nation$"
 JAP_pnr_uprising_of_the_japanese_nation_anti_german_desc: "$JAP_pnr_uprising_of_the_japanese_nation_desc$"
 JAP_pnr_revolution_of_justice: "Revolution of Justice"
 JAP_pnr_revolution_of_justice_desc: "Beyond our country, there are many other oppressed proletarian nations. Some can join with us to resist an unjust social order, while many others still fear the pain of the whip and chain, and can only groan on the edge of death in servitude. We will prove that we are capable of launching a revolution against all oppressors. We will prove that we are the true Spartacus, friends of all gladiators, and that with our aid they will one day walk out of the arena, cut off the heads of the nobles, and thereby become fully free people."
### Kokumin Domei ###
 JAP_pnr_awakened_nation_0: "Awakening of the Nation"
 JAP_pnr_awakened_nation_0_desc: "Our country's representative is His Majesty the Emperor, but the foundation of everything that constitutes the state is formed by His Majesty's subjects. The standard of national life is precisely the proof of whether our country is strong. For this reason, we call upon the nation to unite and, in this extraordinary period, make equal efforts and sacrifices to open a path for national life. The people must struggle against class privilege to abolish it, and struggle against those \"class warriors\" so they cannot destroy national life. Only when all advance together and cohere into a single whole can everyone's life be secured, and the state itself gain vitality."
 JAP_pnr_awakened_nation_1: "$JAP_pnr_awakened_nation_0$"
 JAP_pnr_awakened_nation_1_desc: "$JAP_pnr_awakened_nation_0_desc$"
 JAP_pnr_awakened_nation_2: "$JAP_pnr_awakened_nation_0$"
 JAP_pnr_awakened_nation_2_desc: "$JAP_pnr_awakened_nation_0_desc$"
 JAP_pnr_totalitarian_principle: "Totalitarian Principle"
 JAP_pnr_totalitarian_principle_desc: "Scattered individualism and liberalism have brought [JAP.GetName] only chaos. Amid a worsening world situation, our people must unite and cooperate with one another to the greatest possible extent. What could be greater than people fighting at the same time for one ideal and one purpose? By gathering many ordinary men and women together, a new individual shall be born. Many cells within this individual, the \"organs\" that compose it, will gain hundreds or thousands of times more power than they could have when acting alone. Under the influence of this unity, the state will become incomparably powerful, and no difficulty will shake this giant from achieving its desired purpose."
 JAP_pnr_lose_the_collective_lose_everything: "Lose the Collective, Lose Everything"
 JAP_pnr_lose_the_collective_lose_everything_desc: "The individual cannot exist apart from the collective, just as the people cannot exist apart from the state. Therefore, whatever each citizen does as an individual must be done with the state's great plan in mind. Only then can he be called a model citizen, a person worthy of respect."
 JAP_pnr_spiritual_bond: "Spiritual Bond"
 JAP_pnr_spiritual_bond_desc: "Japanese are Japanese not merely because they live on the land of [JAP.GetName], but because, deep within their souls, they possess an indivisible spiritual bond with [JAP.GetName], a blessing and mark flowing through the blood. It is this spiritual bond that has shaped the Japanese people themselves."
 JAP_pnr_tacit_secret_cooperation: "Tacit Secret Cooperation"
 JAP_pnr_tacit_secret_cooperation_desc: ""
 JAP_pnr_banquet_ended: "The Banquet Ended"
 JAP_pnr_banquet_ended_desc: ""
 JAP_pnr_economic_planning_agency: "Economic Planning Agency"
 JAP_pnr_economic_planning_agency_desc: "We can no longer allow the market to keep damaging our economy in the name of so-called \"freedom\". The state will take responsibility and manage our economic development with the rapid expansion and strengthening of productive forces as its goal."
 JAP_pnr_demand_guided_economy: "Demand-Guided Economy"
 JAP_pnr_demand_guided_economy_desc: "Now that the state is using its powerful hand to regulate the economy, many scientific principles of economics have revealed themselves before us. By adjusting the direction of economic development according to society's present needs, we will make the most efficient use of our industrial resources and promote rapid, high-quality growth."
 JAP_pnr_firm_grip_of_the_state: "Firm Grip of the State"
 JAP_pnr_firm_grip_of_the_state_desc: "One person after another gathers inside the great house called the state, and these people are members of the state's family. They design its interior, arrange its expansion, and at crucial moments repair the occasional damage suffered by this house. All of this is done to ensure the house is sturdy, and that they have a safe, trustworthy, reliable place to live. To achieve this purpose, people will not begrudge offering everything they possess. The state will answer them, command them, plan them, and protect them. The state will stand before them against wind and rain, leaving them with no worries behind them."
### Shakai Taishuto ###
 JAP_pnr_respect_unity: "Respect Unity"
 JAP_pnr_respect_unity_desc: "The normal operation of the state and the normal continuation of production are founded on one basic principle: the guarantee and promise of each person's freedom, and each person's respect for the freedom of others on that basis."
 JAP_pnr_employment_security_office: "Employment Security Office"
 JAP_pnr_employment_security_office_desc: "There are many privately run employment agencies in society, but they are mostly limited to local vacancies and resemble local mutual-aid organisations. In order to make the fullest use of our population, and to stabilise society itself, it is especially important for the state to administer employment placement directly."
 JAP_pnr_trade_unions_for_peace_0: "Trade Unions for Peace"
 JAP_pnr_trade_unions_for_peace_0_desc: "The purpose of trade unions is to speak for the legitimate interests of workers, not to incite sabotage, push workers into destroying the livelihoods on which they depend, or drag them into political organisations. Through the unions, business owners can hear workers' views on working conditions and pay, and solve those problems. That is the original meaning of a trade union."
 JAP_pnr_trade_unions_for_peace_1: "$JAP_pnr_trade_unions_for_peace_0$"
 JAP_pnr_trade_unions_for_peace_1_desc: "$JAP_pnr_trade_unions_for_peace_0_desc$"
 JAP_pnr_national_health_insurance: "National Health Insurance"
 JAP_pnr_national_health_insurance_desc: "Although awareness of medical care has taken root in urban areas, rural residents still have almost no concept of it. This is mainly because long rural depression has left them unable to seek treatment, and without knowledge of preventive medicine. Establishing national health insurance, with the government providing medical protection, is therefore essential."
 JAP_pnr_listening_and_helping_hand: "Listening and a Helping Hand"
 JAP_pnr_listening_and_helping_hand_desc: "A qualified government should listen to the true voice of the people, and extend practical and effective aid to those groups that need help."
 JAP_pnr_worker_peasant_front: "Worker-Peasant Front"
 JAP_pnr_worker_peasant_front_desc: "Workers and peasants are often set against one another in Western countries, where the latter are usually regarded as exploiters and property owners. In our country things are entirely different. We can see that workers and peasants alike are oppressed by exploitative classes and capital, and share the same fundamental interests. This makes the two naturally capable of forming a united front."
 JAP_pnr_worker_peasant_soldier_front_supreme: "Supreme Worker-Peasant-Soldier Front"
 JAP_pnr_worker_peasant_soldier_front_supreme_desc: "Beyond the worker-peasant alliance, there are also military forces that desire the power of transformation. These military forces clearly refer to the rank-and-file soldiers formed from the broad masses. The Jinbingtai Incident, the League of Blood Incident, and even the May Fifteenth Incident all prove that these soldiers also yearn for change and for revolution against the exploiting class. They are therefore good friends of the worker-peasant alliance, and worthy targets of unity. If workers, peasants, and soldiers can be gathered into one force, overthrowing the Japanese bourgeoisie and realising true socialism will by no means be empty talk."
 JAP_pnr_mass_labor_movement_0: "Mass Labor Movement"
 JAP_pnr_mass_labor_movement_0_desc: "We have launched a propaganda campaign praising workers, peasants, and other labourers, while opposing the \"parasites\"."
 JAP_pnr_mass_labor_movement_1: "$JAP_pnr_mass_labor_movement_0$"
 JAP_pnr_mass_labor_movement_1_desc: "$JAP_pnr_mass_labor_movement_0_desc$"
 JAP_pnr_price_controls: "Price Controls"
 JAP_pnr_price_controls_desc: ""
 JAP_pnr_run_to_peace_and_tranquility: "Run to Peace and Tranquility"
 JAP_pnr_run_to_peace_and_tranquility_desc: "No one desires war, and even the army is compelled into war only by the needs of national defence and self-defence. We are a peace-loving country, and all of our unrest has arisen because stability was lost. The government has promised to bring peace and tranquillity back to this country through reasonable and lawful means. Through wealth redistribution and the gradual expansion of social security, our people will personally experience their lives becoming better and better, and will be able to work without worry, building [JAP.GetName] together. The achievements we obtain then will make our country one of the most respected members of the international community."
 JAP_pnr_war_of_social_revolution: "War of Social Revolution"
 JAP_pnr_war_of_social_revolution_desc: "No one desires war, but the alliance between internal class enemies and external international oppression has forced the people of [JAP.GetName] to take up arms. From the Triple Intervention to the naval blockade imposed by the imperialists, all of these external humiliations have undoubtedly aroused the anger of our people. At home, capitalism, having lost its external profits, turns inward and continues to oppress the proletarian workers, peasants, and soldiers, which will undoubtedly rouse resistance. Internally, we will struggle against all oppressors and use the power of the state to confine them in a cage. Externally, we are a righteous army. To resist imperialist oppression from abroad, the army shall wage revolution internationally on behalf of the people, reclaiming our lost and legitimate interests through justice and reason, and liberating the peoples of other countries from their control. Long live the people of [JAP.GetName]! Long live the workers of [JAP.GetName]! Long live the soldiers of [JAP.GetName]!"
 JAP_pnr_harmonious_economy: "Harmonious Economy"
 JAP_pnr_harmonious_economy_desc: "The focus of our economy is \"harmony\": carrying out moderate distribution based on demand, so that every side can achieve stable and gradual development."
 JAP_pnr_model_of_oriental_socialism: "Model of Oriental Socialism"
 JAP_pnr_model_of_oriental_socialism_desc: "Entrusted by His Majesty the Emperor, and through the tireless planning and action of the Shakai Taishuto, [JAP.GetName] has been shaped into something entirely different from what she once was. Now she sits upon a throne amid the blue waves of the East, crowned as a socialist nation, with countless citizens gathered around her knees. They too have changed, becoming strong and healthy. The government has courageously assumed its responsibilities, placing the improvement of the people's living standards above all else. Abroad, it has become the defender of the people's interests, refusing to retreat one step wherever [JAP.GetName]'s legitimate interests are involved. Through this, our country has truly built a socialist welfare state, and through this, our country can be called a model socialist nation of the Eastern world, worthy of emulation by others."

 ### Kanebukuro and Kozuchi ###
 JAP_pnr_kanebukuro_kozuchi_category: "Kanebukuro and Kozuchi"
 JAP_pnr_kanebukuro_kozuchi_category_desc: "During Black Monday, the present cabinet repeatedly appealed to the zaibatsu for assistance, and we, guided by the principle of investing in the future, opened our purses generously on their behalf. Now that they have brought the deadlock in the Imperial Diet to an end in a single stroke, the old incantation that “money rules everything” has once again proven its power. The time has come to reap the fruits of our investment.\n\nThe ruling party of today is little more than a collection of senior managers installed in government, and their employer is the §aMitsuba Club§!—a social circle that began within the Japan Industrial Club. We can trust our managers to perform the duties expected of them. After all, if even we are unable to turn a profit, then the country itself is surely on the verge of collapse.\n\nAlthough the §aMitsuba Club§! presents itself as nothing more than a “social circle,” unfriendly faces can naturally be found in any organization. Broadly speaking, the Club is divided into two major camps. The first consists of the §afamily zaibatsu§!, represented by presidents such as §jIwasaki Koyata§!, who rapidly accumulated capital during the wartime boom of the World War. They adhere to the old methods: expanding their wealth and their interests at home and abroad through direct vertical and horizontal corporate mergers, backed by financial holding companies. Opposing them are the emerging Konzerns represented by the “young man,” President §qAikawa Yoshisuke§!. Most of these concerns raise capital from the public through stock issues and may, in a sense, be described as §asocial zaibatsu§!. Their advocates advance an entirely new idea: the construction of a so-called “corporate state.” On the one hand, state policy and fiscal subsidies would be used to create “stable shareholder blocs”; on the other, the state itself would be treated as an instrument of credit, directing enormous volumes of orders into selected sectors for large enterprises to fulfill.\n\nBecause the former approach has already proven itself during the World War, its adherents are also known as the “Practical School.” The ideas of Aikawa and his associates, by contrast, remain for the moment a vision that has yet to become reality, and so they are known within the Club as the “Idealist School.” Perhaps, however, there is no need to make the matter so complicated. New products have always had to defeat old ones before they can carve out a market of their own; all of this may simply be the laws of the marketplace reenacting themselves once again in the realm of human relations.\n\nHere lies the most elementary of battlefields. Japan is small, and its market smaller still, ensuring that every tacit gentlemen's agreement will eventually be torn apart. Whoever earns the greatest returns in the market, whoever can tear the largest chunk from the market share of his rivals, will become the §xChairman§! of the §aMitsuba Club§!, wielding his river of flowing wealth to drive the politicians of this country wherever he pleases. Those unfortunate enough to be eliminated from the game will have no excuse to offer themselves, for the laws of the market have merely demonstrated that their ideas possess no value under present conditions—nothing more than unsold inventory left to gather dust in a warehouse.\n\n\nThis month's best-selling products come from: §YTo Be Announced§!\n\nHome Appliances: §YTo Be Announced§!\nInsurance Policies: §YTo Be Announced§!\nPharmaceuticals: §YTo Be Announced§!\nSmall Arms: §YTo Be Announced§!\nMotor Vehicles: §YTo Be Announced§!\nEnergy Industry: §YTo Be Announced§!\nInvestment Portfolios: §YTo Be Announced§!\n\n\nCurrent balance of power within the §aMitsuba Club§!:\nTraditional Zaibatsu: §H[?JAP_pnr_zb_balance_inverse|0]%§!\nEmerging Konzerns: §H[?JAP_pnr_zb_balance|0]%§!"
 JAP_pnr_kanebukuro_kozuchi_placeholder: "Observe Business Trends"
 JAP_pnr_kanebukuro_kozuchi_placeholder_desc: ""
