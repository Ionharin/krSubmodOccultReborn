 ### Imperial Way ###
 pnr_start_destruction_and_creation_tt: "§4Unlocks the §MDestruction and Creation§! mechanic. §RDestruction§! will provide additional military bonuses, while §GCreation§! will provide additional industrial bonuses.§!"
 JAP_pnr_kodoha_destruction_tt: "£GFX_SOV_paranoia_text_icon §RDestruction§!will change: §Y+$RIGHT|0$§!"
 JAP_pnr_kodoha_creation_tt: "£GFX_repairing §GCreation§!will change: §Y+$RIGHT|0$§!"
 JAP_pnr_kodoha_creation_decrease_tt: "£GFX_repairing §GCreation§!will change: §Y-$RIGHT|0$§!"
 JAP_pnr_kodoha_transformation_tt: "§xNational Transformation Results§! will change: §Y+$RIGHT|0$§!"
 JAP_pnr_kodoha_transformation_loss_tt: "§xNational Transformation Results§! will change: §R-$RIGHT|0$§!"
 JAP_pnr_ruin_and_creation_category: "Destruction and Creation"
 JAP_pnr_ruin_and_creation_category_desc: "Since time immemorial, the progress of mankind has unfolded amid ceaseless destruction, and those capable of creating something new from the shattered ruins left in its wake have been called “revolutionaries.” Ah, revolutionaries—what a splendid name! Once uttered, it seems there can be no greater title beneath Heaven and Earth. It is precisely for this reason that so many treacherous scoundrels, hooligans, and vandals so often steal the mantle of the “revolutionary,” dressing themselves in garments that were never theirs to wear before strutting onto the stage. Yet they know only how to destroy and have never grasped the true essence of creation. Thus, the moment they encounter a true revolutionary, they are reduced at once to nothing more than a handful of dust.\n\nTo bring about the Restoration, the §RDestruction§! of that which is wrong is indispensable—but neither can §GCreation§! itself be forgotten. If we are to realize a perfect politics of Restoration, then these two forces must be combined with the utmost care and kept in mutual balance. Should §RDestruction§! be allowed to burn the nation to ashes, its dreadful fanaticism may eventually spread across the entire world; yet if we embark upon wholesale §GCreation§! without first demolishing the old house, what emerges in the end will be nothing more than an even more bloated edifice. Only by balancing §RDestruction§! against §GCreation§!, by holding these forces of black and white in equilibrium, can true §MRenewal§! be achieved.\n\nAdvancing through §YNational Focuses§!, completing §YDecisions§!, and making choices throughout a series of §YEvents§! will all shape our vision of Restoration politics. Broadly speaking, §RDestruction§! will primarily be accumulated through §YNational Focuses§!, while §GCreation§! will primarily be accumulated through §YDecisions§!. If, at the conclusion of the §xthree-year transformation of the nation§!, both §RDestruction§! and §GCreation§! have reached their maximum values while remaining in balance, the most perfect form of §YNational Rebirth§! will be achieved, leading the country toward a path more mysterious and sublime. If §RDestruction§! and §GCreation§! are merely kept in balance, a perfect §YNational Reconstruction§! will be achieved; but should either §RDestruction§! or §GCreation§! exceed its proper bounds, then the country will naturally be drawn toward the corresponding extreme once §YNational Transformation§! has been completed.\n\nCurrent £GFX_SOV_paranoia_text_icon §RDestruction§!: §p[?JAP_pnr_iw_destruction|0]§!\nCurrent £GFX_repairing §GCreation§!: §p[?JAP_pnr_iw_creation|0]§!"
 JAP_pnr_iw_destory_tt: "§RDestruction§!: [?JAP_pnr_iw_destruction|0]\n\n§YCurrent Effects:§!\nPlanning Speed: [?JAP_pnr_destruction_and_creation_planning_speed|+=%1]\nWar Support: [?JAP_pnr_destruction_and_creation_war_support_factor|+=%1]\nJustify War Goal Time: [?JAP_pnr_destruction_and_creation_justify_war_goal_time|-=%1]\nDamage to Garrisons: [?JAP_pnr_destruction_and_creation_resistance_damage_to_garrison|-=%2]\nFactory Energy Consumption: [?JAP_pnr_destruction_and_creation_factory_energy_consumption|-=%1]"
 JAP_pnr_iw_creation_tt: "§GCreation§!: [?JAP_pnr_iw_creation|0]\n\n§YCurrent Effects:§!\nPolitical Power Gain: [?JAP_pnr_destruction_and_creation_political_power_factor|+=%1]\nProduction Efficiency Cap: [?JAP_pnr_destruction_and_creation_production_factory_max_efficiency_factor|+=%1]\nStability: [?JAP_pnr_destruction_and_creation_stability_factor|+=%1]\nConsumer Goods Factories Factor: [?JAP_pnr_destruction_and_creation_consumer_goods_factor|Y=%1]\nTraining Time: [?JAP_pnr_destruction_and_creation_training_time_factor|-=%1]"
 JAP_pnr_three_year_national_transformation: "Three Years of National Transformation"
 JAP_pnr_three_year_national_transformation_desc: "In accordance with our original purpose, we will suspend the constitution for three years and carry out the various measures of national transformation during that period. Time waits for no one. We must act swiftly!"
 JAP_pnr_three_year_national_transformation_timeout_tt: "We will gain various §Gbonuses§! based on the §YNational Transformation Results§! we have achieved."
