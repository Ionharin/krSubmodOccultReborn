 KOR_pnr_peninsula_profits_economic_status_14: "§0On the Brink of Collapse§!"
 KOR_pnr_land_reform_in_progress: "Agrarian Reform in Progress"
 KOR_pnr_land_reform_in_progress_desc: "We are reforming our agricultural structure according to the principle of “compensated expropriation, compensated distribution”, but this will inevitably provoke dissatisfaction among both the traditional landlord class and the peasantry, and we must withstand the pressure. "
 KOR_pnr_korean_agricultural_cooperative: "National Agricultural Cooperative Federation"
 KOR_pnr_korean_agricultural_cooperative_desc: ""
 KOR_legitimacy_idea_pnr_khg: "Donghak Legacy: §tAll Under Heaven§!"
 KOR_legitimacy_idea_pnr_khg_desc: "Under the leadership of §t$KOR_pnr_kim_hong_gyu$§! and his reorganized Sixty-Member Committee, Korea has risen before the world in a new form. \n\nLooking not only at Bocheonism but back across the entire Donghak uprising, its strength never came from any god or Buddha, from Confucianism, or even from Sages and emperors, but from the believers and community organizations spread throughout the countryside which it possessed and mobilized. \n\nThe Korean people have driven the Japanese colonial regime from their country, but if Bocheonism continues to indulge in so-called myths of Sages, it will only be left behind by the broad masses who once supported it and become a reactionary, backward, superstitious organization. For precisely this reason Bocheonism has made its choice, and has now become the mass organization and spiritual pillar of the Korean nation-state. \n\n§tThe Later-Heaven Renewal, Has Become Reality. §!"
 KOR_pnr_education_reform: "Education Reform"
 KOR_pnr_education_reform_desc: ""
 KOR_pnr_korean_youth_league: "Great Korean Youth Corps"
 KOR_pnr_korean_youth_league_desc: "The Great Korean Youth Corps is an association composed of patriotic Korean youth and intellectuals, similar to the Young China Party in China and the Young Turks in Turkey, opposing foreign interference and advocating Korean nationalism. Cooperation with them will help the government further maintain public order, and further reinforce our image in the public mind as pursuing a path of independence and autonomy. "
 KOR_pnr_seoul_normal_school_idea: "Seoul Normal School"
 KOR_pnr_seoul_normal_school_idea_desc: ""
 KOR_pnr_hwaebaek_conference: "Twentieth-Century Hwabaek Council"
 KOR_pnr_hwaebaek_conference_desc: "The Hwabaek Council is an ancient Korean parliamentary institution, first established in the first century AD. Cha Kyung-seok’s plan for enthronement met obstruction from every side, and he was ultimately forced to reconcile the contradictions among the various parties, determining the direction of governance through joint deliberation on affairs of state by leaders sent from each party. Cha Kyung-seok himself became the nominal monarch, but as with the Hwabaek Council, he possessed little decision-making power over any matter. "
 KOR_pnr_destined_monarch: "Destined Monarch"
 KOR_pnr_destined_monarch_desc: "In 1921, Cha Kyung-seok climbed Hwangseoksan and publicly held a sacrificial rite, the Japanese army attempted to arrest him, but he was sheltered by immortals and mysteriously vanished from the mountain. This caused many farmers and believers to call him the “destined monarch”. Now Cha Kyung-seok is enthroned a second time, and this Korean monarch appointed by Heaven has finally taken the throne that belongs to him. "
 KOR_pnr_winner_takes_all: "Winner Takes All"
 KOR_pnr_winner_takes_all_desc: ""
 KOR_legitimacy_idea_pnr_cks: "Donghak Legacy: §gLord of Universal Transformation§!"
 KOR_legitimacy_idea_pnr_cks_desc: "§g$KOR_pnr_cha_kyung_seok$§! sits enthroned within the Eleven Halls, a palace grander than Gyeongbokgung of the Joseon dynasty. From here, as Korea’s monarch, he guides Korea along its path. \n\nThe defeat of the Japanese colonial government and Korea’s national restoration prove that the old prophecy of the “Son of Heaven ascending the throne in the Gapja year” was no absurd superstition, but merely a plan compelled by fate to be postponed, Bocheonism has never been, is not, and never will be a tool of a nationalist political party, it shall transcend all of this and become part of the Korean people. \n\nThe Korean people have driven the Japanese colonial regime from their country, the Later-Heaven Renewal has begun, and the true Son of Heaven, the son of the Lord of Universal Transformation Who Responds to the Thunder of the Nine Heavens, §g$KOR_pnr_cha_kyung_seok$§!, shall follow destiny and fulfill the purpose of the heavenly gods. \n\n§gThe Mugunghwa Blooms, May the Eastern Land Endure Forever. §!"
 KOR_pnr_licking_wounds: "Licking Our Wounds"
 KOR_pnr_licking_wounds_desc: "We must not forget those harmed during the Japanese colonial period, including both Koreans and Japanese. They are all equal victims of war. "
 KOR_pnr_korea_our_consensus: "Korea-Our Consensus"
 KOR_pnr_korea_our_consensus_desc: "Despite the struggles among the factions within our government, every party should recognize one consensus, namely the development of Korea itself and the happiness of the Korean people. So long as everyone begins from this standpoint, reasonably explains their views, and can persuade the rest, we shall offer our support. "
 KOR_pnr_cultural_revival_idea: "Cultural Revival"
 KOR_pnr_cultural_revival_idea_desc: ""
 KOR_pnr_ministry_of_healthcare: "Ministry of Health Care"
 KOR_pnr_ministry_of_healthcare_desc: ""
 KOR_pnr_state_of_emergency_idea: "State of Emergency"
 KOR_pnr_state_of_emergency_idea_desc: "The government has declared a national state of emergency, meaning that we face an exceptionally grave problem. "
 KOR_legitimacy_idea_pnr_jjs: "Donghak Legacy: §8A Self-Proven Heavenly Kingdom§!"
 KOR_legitimacy_idea_pnr_jjs_desc: "What exactly does Taegeukdo mean, what do Resolving Grievances and Mutual Life-Giving, and the Later-Heaven Renewal actually mean? The §8$KOR_pnr_jo_jeong_san$§! of 1909 might have answered that they meant the liberation of the Korean nation from the Japanese police’s reign of terror. When §8$KOR_pnr_jo_jeong_san$§! looked up at his fifteen-year-old self, he realized that he had not betrayed him. \n\nThe defeat of the Japanese colonial government and Korea’s national restoration proved this was the correct path, and he had perfectly realized the answer proposed by his youthful self, now it was time to answer the next question. What should Koreans do after reclaiming their homeland? What did Kang Il-sun mean when he said in a vision that “Korea shall become one”? \n\n§8$KOR_pnr_jo_jeong_san$§! cannot be certain, but he knows it must be a beautiful world filled with laughter, where no one fears illness, pain, separation, or death, and everyone lives with courage for life. \n\n§8Yin and Yang in Harmony, the Way Reaches the True Realm. §!"
 KOR_pnr_beware_of_corruption: "Beware Corruption"
 KOR_pnr_beware_of_corruption_desc: ""
 KOR_pnr_ideal_paradise: "An Ideal Paradise"
 KOR_pnr_ideal_paradise_desc: "We will no longer promise the people an afterlife or a world centuries hence, we must accept responsibility, the true heavenly kingdom is not in the future, it must descend here and now. "
 KOR_pnr_daejin_university_idea: "Daejin University"
 KOR_pnr_daejin_university_idea_desc: ""
 KOR_pnr_three_major_business_budgets_idea: "Implement the Budget for the Three Major Undertakings"
 KOR_pnr_three_major_business_budgets_idea_desc: "Charitable relief, social welfare, and universal education, these three undertakings are all of great importance to the people’s livelihood, and we must nationalize them at any cost. "
 KOR_legitimacy_idea_pnr_phg: "Donghak Legacy: §CFavorable Winds and Timely Rains§!"
 KOR_legitimacy_idea_pnr_phg_desc: "Endless quarrels and selfishness can bring society and the nation nothing but division, Korea has already shed tears once, must Korea’s children make her weep again for their own desires? Someone must step forward to stop all this, §C$KOR_pnr_park_han_gyeong$§! firmly believes it. \n\nThe most beautiful thing in the human world must be the circle, a circle has no corners, and naturally no obstructions, it obstructs nothing else, and is obstructed by nothing else. If everyone could likewise become a circle, drawing in their own sharp edges, turning and moving without obstruction and without interruption, then no resentment or opposition would remain in the world. \n\nThe defeat of the Japanese colonial government and Korea’s national restoration mean that the age of opposition is over, the continuation of hatred can bring only an endless chain of pain, and Korea, as the victor, has the right to forgive the defeated, the right through mercy to lift the curse of painful years imposed upon the people. Only by doing so can we truly establish an earthly heavenly kingdom that dissolves every grievance and lives in harmony, advancing toward a future of common prosperity and mutual benefit. \n\n§CSettle the Body and Clear the Mind, Revere Heaven and Master the Self. §!"
 KOR_pnr_rural_autonomy: "Rural Self-Government"
 KOR_pnr_rural_autonomy_desc: ""
 KOR_pnr_relics_of_kang_il_sun: "Kang Il-sun’s Sacred Relics"
 KOR_pnr_relics_of_kang_il_sun_desc: "Kang Il-sun was the founder of Jeungsanism and the incarnation of Maitreya who descended into the mortal world to save humanity, no matter how fierce the sectarian struggles within Jeungsanism become, many Jeungsanist believers still come each year to Jeungsanbeop headquarters to venerate Kang Il-sun. If anything can briefly unite a divided Jeungsanism, it can only be Kang Il-sun’s remains. "
 KOR_pnr_balance_of_heaven_and_earth: "Balance Heaven and Earth"
 KOR_pnr_balance_of_heaven_and_earth_desc: "$KOR_pnr_kang_soon_im$ has made her choice, although she believes resisting the suzerain is unwise, she remains determined to continue the Reordering Works of Heaven and Earth, and though Korea will remain a dependent state for a long time to come, it will not become excessively reliant upon this powerful suzerain. "
 KOR_pnr_follow_the_forerunner: "Follow the Forerunner"
 KOR_pnr_follow_the_forerunner_desc: "After long contemplation, $KOR_pnr_kang_soon_im$ gave her answer, Jeungsanist faith mattered less than tangible benefit. If following sadaeism alone could improve the living standards of the Korean people, she would never hesitate. Even if one day Korean history books portray her as a sinister femme fatale like Jeong Nan-jeong, so be it, at least for now the Korean people truly receive what they urgently need. "
 KOR_pnr_armed_defense: "Armed Defense"
 KOR_pnr_armed_defense_desc: ""
 KOR_pnr_coastal_batteries: "Coastal Batteries"
 KOR_pnr_coastal_batteries_desc: ""
 KOR_pnr_focus_on_light_industry: "Focus on Light Industry"
 KOR_pnr_focus_on_light_industry_desc: ""
 KOR_pnr_focus_on_heavy_industry: "Focus on Heavy Industry"
 KOR_pnr_focus_on_heavy_industry_desc: ""
 KOR_legitimacy_idea_pnr_ksi0: "Donghak Legacy: §OVigil Through the Long Night§!"
 KOR_legitimacy_idea_pnr_ksi0_desc: "The world exists in eternal change, yet however it changes it remains a reenactment of past ages. In ancient times Dangun founded Korea, and today §O$KOR_pnr_kang_soon_im$§! leads the people to found Korea anew. History finds its echo and repetition here, and the Korean people are no longer readers of history, they have become the medium through which history manifests in the present. \n\nPrecisely because every fate is already ordained, precisely because all of this is merely the repeated reenactment of one part of a story, the people can be freed from the unknown suffering pressing down upon them. For the individual, the only things that matter are what they remember from the past and experience in the present, all of this will become something called “tradition”, flowing onward through this land like a gentle living stream, without end. \n\nThe merciless Japanese colonial government once tried to destroy these traditions, but though they could cut down a hundred heads, they could never sever a river. §O$KOR_pnr_kang_soon_im$§! and the Korean people shall continue guarding traditions that may not even need their defense, because their ancestors did the same. \n\n§OUnder the Sacred Dangun Tree, Prayers Without End. §!"
 KOR_legitimacy_idea_pnr_ksi1: "Donghak Legacy: §RRed Millet and Rotted Coin-Cords§!"
 KOR_legitimacy_idea_pnr_ksi1_desc: "§R$KOR_pnr_kang_soon_im$§! has made her choice, rather than proclaiming hollow independence and self-strengthening, the more correct course is to truly walk among the majority of this country’s people. The peasants are weeping, the workers are weeping, while most in the government continue attacking one another over their respective positions and whether foreign powers stand behind them. \n\nThe profound suffering inflicted on Korea by the Japanese colonial government means only that the Japanese were brutal, not that sadaeism was wrong. If merely kowtowing and pledging loyalty can raise the living standards of tens of millions of Koreans, §R$KOR_pnr_kang_soon_im$§! is willing to become a sinner against the nation, a traitor to Korea. Political positions, ideals, and even Jeungsanbeop itself can all be cast aside. Under the erosion of time, most comrades may have forgotten the original purpose of the Donghak uprising——the peasants could not survive, not that the peasants yearned to struggle. \n\nFortunately, at least for the peasants of this country, no empty slogan or slander against §R$KOR_pnr_kang_soon_im$§!’s character can conceal the fact that she helped lift them out of poverty. \n\n§RSeasons in Harmony and Harvests Abundant, Peace Under Heaven. §!"
 KOR_pnr_land_improvement_modifier: "Land Improvement"
 KOR_pnr_land_improvement_modifier_desc: "The land here has undergone a series of hydraulic improvements and fertilizer applications, further strengthening the fertility of its soil. "
 KOR_pnr_hermit_kingdom_idea: "Hermit Kingdom"
 KOR_pnr_hermit_kingdom_idea_desc: "Since ancient times Korea has been called the “Hermit Kingdom”, partly because Korea has little interest in diplomacy and expansion, and partly because of our aversion to the uncertain risks of the outside world. We shall inherit this title, but not politically, militarily. We will turn our country into a defensive state armed to the teeth, to prevent the events with Japan from ever happening again. "
 KOR_government_totally_collapse: "The Autumn Light Has Faded"
 KOR_government_totally_collapse_desc: "After a brief taste of freedom, the [KOR.GetName] government has once again fallen into chaos, and this time the chaos is greater than before, where fate will carry its future remains unknown.... "

