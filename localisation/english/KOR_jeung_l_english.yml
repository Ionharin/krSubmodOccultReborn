 ### National Spirits ###
 KOR_pnr_expel_japanese_residents: "Expel Japanese Residents"
 KOR_pnr_expel_japanese_residents_desc: "Although the Japanese colonial authorities have withdrawn, millions of Japanese still remain within Korea. Korea belongs to the Korean people, and these Japanese invaders who have occupied Korean land for so long must leave. "
 KOR_pnr_promote_co_prosperity: "Promote Co-Prosperity"
 KOR_pnr_promote_co_prosperity_desc: "The Japanese colonial authorities left our land, abandoning the millions of Japanese who had lived here during that period, people summoned to Korea by their state only to be mercilessly forsaken by their homeland. Although Koreans are the rightful masters of this land, demanding that these Japanese leave the second home in which they have lived for decades would be rather heartless. \n\nPerhaps we should reassure them, so long as they are willing to join Korea and become part of Korea, they should be allowed to continue living here. "
 KOR_pnr_dysfunctional_government: "A Government Divided Against Itself"
 KOR_pnr_dysfunctional_government_desc: "Jeungsanism took power in Korea on the strength of the prestige it accumulated in rural regions by resisting the invaders behind enemy lines during the Japanese colonial period, but the Restoration Army forces who faced the Japanese invaders directly at the front will probably not permit us to hold power so easily, and we must seek a settlement with them. "
 KOR_pnr_metropole_patronage: "Protection of the Suzerain"
 KOR_pnr_metropole_patronage_desc: "Although the Japanese have left, [KOR.GetName] has nominally achieved national restoration, our suzerain still exerts enormous pressure upon our economy. Through the former institution of the Japanese colonial government known as the “Oriental Development Company”——now reorganized as the “New Korea Company”——they administer the colonial legacy and provide us with various forms of assistance. \n\nDifficult though it is to admit, without our suzerain we probably could not have restored our nation so easily. It is obvious that, destitute as we are, we must occasionally rely on them for postwar reconstruction as well. Seen positively, this will promote the normalization of our economy; seen negatively, it means our suzerain will tighten its grip over our economy. "
 KOR_pnr_peninsula_profits_modifer: "Peninsular Interests"
 KOR_pnr_peninsula_profits_modifer_desc: "As the undisputed suzerain and guide of [KOR.GetName], after driving the Japanese colonial government from the peninsula we took over the “Oriental Development Company” left here by the Japanese in order to assist [KOR.GetName], and reorganized it as the “New Korea Company”. Through it we administer Korea’s vast potential wealth, ensuring our interests on the peninsula. "
 KOR_pnr_peninsula_profits_status_tt: "§3[KOR.GetName]§! public opinion: [KOR_pnr_peninsula_profits_collapse_status_scripted]\n§3[KOR.GetName]§! economic level: [KOR_pnr_peninsula_profits_economic_status_scripted]"
 KOR_pnr_peninsula_profits_collapse_status_0: "§LNoncommittal§!"
 KOR_pnr_peninsula_profits_collapse_status_4: "§9Considerably Resentful§!"
 KOR_pnr_peninsula_profits_collapse_status_7: "§RPublic Fury Boils Over§!"
 KOR_pnr_peninsula_profits_collapse_status_11: "§0Longing to Be Rid of Us§!"
