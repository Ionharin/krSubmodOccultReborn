 KOR_pnr_people_born_in_the_land_of_the_country_desc: "The Korean nation was not constructed by any narrow doctrine of bloodline, on the contrary, it is a community of culture and ideas. The Korean nation possesses both the splendor inherited from its history and new peoples who are continually integrated through homecoming. "
 KOR_pnr_radio_speech: "Taegeukdo’s Radio Waves"
 KOR_pnr_radio_speech_desc: "With radio broadcasting, we can break through geographical and physical limits, using a widely available audio medium to cross the boundaries of missionary work. And efficiently convey the message of faith to audiences in remote regions. "
