 KOR_pnr_emphasize_the_national_spirit: "The Korean Nation First"
 KOR_pnr_emphasize_the_national_spirit_desc: "A series of policies under Japanese rule sought to extinguish the people’s fighting spirit and national character. Although Koreans continued to exist in body, Koreans in spirit were nearly annihilated. Now that we have achieved final victory, we should use this moment to awaken the people’s fighting spirit once again. "
