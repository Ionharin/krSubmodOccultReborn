 KOR_pnr_comfort_the_victim: "Comfort the Victims"
 KOR_pnr_comfort_the_victim_desc: "Everyone is a victim of war, and everyone deserves the same salvation. Now that the Later-Heaven Renewal has begun, rather than remaining trapped in the suffering of the past, we should walk the path of Later-Heaven Renewal with contrite hearts. "
