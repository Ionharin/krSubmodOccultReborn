 ### National Focus Content ###
 KOR_jeung: "Eastern Land Focus Tree"
 KOR_pnr_the_hibiscus_blooms: "Korea Restored"
 KOR_pnr_the_hibiscus_blooms_desc: "It is over, after years of struggle, beneath mountains of flesh and bone stained by the red and white blood of countless patriots’ sacrifices, the Korean people are finally reunited with freedom. Now, the hibiscus blooms once more upon this land; now, Korea exists once more upon this land. "
