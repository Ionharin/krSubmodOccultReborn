 KOR_pnr_select_Jeungsanbeop_desc: "Description of Jeungsanbeop’s Vigil"
 KOR_pnr_the_triumph_of_korea: "The Restoration Army’s Triumphant Return"
 KOR_pnr_the_triumph_of_korea_desc: "It is over, after years of struggle, beneath mountains of flesh and bone stained by the red and white blood of countless patriots’ sacrifices, the Korean people are finally reunited with freedom. Now, the hibiscus blooms once more upon this land; now, Korea exists once more upon this land. "
 KOR_pnr_the_japanese_who_returned: "Repatriate the Japanese"
 KOR_pnr_the_japanese_who_returned_desc: "Years ago, the Japanese government occupied Korea under the so-called principle of “Japan–Korea Annexation”, and established the illegal Government-General of Korea. Today, more than seven hundred thousand Japanese remain within Korea, and we shall reach an agreement with the Japanese government to repatriate them to Japan in an orderly manner. "
 KOR_pnr_stay_in_land_your_birth: "The Land Beneath Our Feet Is Home"
 KOR_pnr_stay_in_land_your_birth_desc: "Many Japanese living under the illegal Government-General of Korea fell into collective cognitive dissonance upon hearing the news of the war’s end from Tokyo. Although some chose to flee secretly back to Japan out of fear, others began learning Korean so they could remain here. Our country urgently needs rebuilding, and perhaps we need not expel every Japanese person standing at this crossroads. "
 KOR_pnr_heaven_kingdom_begins_underfoot: "Paradise Approaches"
 KOR_pnr_heaven_kingdom_begins_underfoot_desc: "123"
 KOR_pnr_return_to_jeolla_do: "Return to Jeolla"
 KOR_pnr_return_to_jeolla_do_desc: "123"
 KOR_pnr_national_household_registration: "Conduct a National Household Census"
 KOR_pnr_national_household_registration_desc: "To govern this newborn postwar state effectively, allocate social resources rationally, and understand the size and circumstances of our present population is vitally important. At the same time, this national census will allow us to determine how many people still follow our religion after the Japanese suppression of Bocheonism. "
 KOR_pnr_discussion_on_the_country_system: "A Choice of National Polity"
 KOR_pnr_discussion_on_the_country_system_desc: "123"
 KOR_pnr_guidance_of_the_aspirant: "Kim Hong-gyu’s Guidance"
 KOR_pnr_guidance_of_the_aspirant_desc: "Bocheonism grew into a force feared by the Government-General of Korea precisely because it broadly mobilized the rural Korean masses into the movement——if Bocheonism remains mired in old myths of religious founders and dreams of emperorship, it will only drag Korea into the abyss once again. "
