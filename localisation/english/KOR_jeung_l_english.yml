 ### Decisions ###
 KOR_pnr_military_base_catalog: "Peninsular Interests"
 KOR_pnr_military_base_catalog_desc: "After driving the Japanese colonizers from the peninsula, we took over most of the industries they left in [KOR.GetName], including the Oriental Development Company. As another privileged Japanese state-owned company comparable to the South Manchuria Railway Company, it controlled roughly 250, 000 hectares of land in Korea during the colonial period, making it Korea’s largest landowner. \n\nThrough our active management and protection, we reorganized the Oriental Development Company as the “New Korea Company”, helping the newborn [KOR.GetName] administer the relevant assets and advance its national recovery and reconstruction. There is no doubt that by firmly controlling the New Korea Company, [ROOT.GetName] will be able to secure its own interests on the peninsula. Although it has been reorganized, it ultimately carries the bloodline of the colonizers, and if we use this institution to squeeze [KOR.GetName] too hard, we may arouse resentment among the local population; on the other hand, the New Korea Company nominally exists to help [KOR.GetName] restore its economy, and if it pursues profit alone, [KOR.GetName]’s already tottering economy may become impossible to save.... \n\nThe current interest index provided to us by the New Korea Company is: §Y[?KOR.KOR_pnr_peninsula_profits_var|2]§!\n\nThe latest §3[KOR.GetName]§! polling result is: §Y[?KOR.KOR_pnr_peninsula_collapse_var|2]§!\nThis means that the people of §3[KOR.GetName]§! [KOR_pnr_peninsula_profits_collapse_status_scripted] toward us\n\nThe current economic-crisis index facing §3[KOR.GetName]§! is: §Y[?KOR.KOR_pnr_peninsula_economic_health_var|2]§!\nThis means the economy of §3[KOR.GetName]§! is [KOR_pnr_peninsula_profits_economic_status_scripted]"
 KOR_pnr_daegu_crisis_countdown: "Daegu Crisis"
 KOR_pnr_daegu_crisis_countdown_desc: "Because of shortages during the early days of nation-building, a heartbreaking epidemic has erupted in Daegu, Gyeongsang Province. Yet behind this tragedy, sinister separatist forces appear to be secretly fomenting discord, people have taken to the streets to confront the government, and production has ground to a halt. We must settle this matter as quickly as possible! "
 KOR_pnr_ensure_the_suppression_plan: "Finalize the Suppression Plan"
 KOR_pnr_ensure_the_suppression_plan_desc: "There is no doubt that the Daegu Crisis began as an ordinary public-health problem, yet became so grave under agitation from foreign forces. We shall draw up a detailed suppression plan to ensure every bandit is apprehended and brought to justice. "
 KOR_pnr_operation_taeguk_tiger: "Operation Taegeuk Tiger"
 KOR_pnr_operation_taeguk_tiger_desc: "We have assembled the armed forces needed for riot suppression, and once our armored cars and tanks enter Daegu, any citizen inclined to make trouble will instinctively shut their doors and stay home. At that point, those still confronting us in the streets will unquestionably be rioters. "
 KOR_pnr_namwon_month_riot_countdown: "[GetYear] Hamhung Uprising"
 KOR_pnr_namwon_month_riot_countdown_desc: "As the scandal continues to ferment in [KOR.GetName], this protest march has been driven by deliberate nationalists——perhaps even by their own government——into a full-scale uprising. The citizens of Hamhung demand that the government immediately change its attitude toward us, or they cannot guarantee they will refrain from overthrowing it by force. This is naked intimidation, and they are no ordinary rioters, although it may further intensify tensions between our countries, for the sake of our interests we must strike hard. "
 KOR_pnr_cut_off_namwon_supply_lines: "Sever Hamhung’s Supply Lines"
 KOR_pnr_cut_off_namwon_supply_lines_desc: "To suppress the uprising completely, the first step is to sever the transport and telephone lines around Hamhung, preventing supplies from entering and stopping them from relaying information from the city to other saboteurs lying in wait outside. This will assist our subsequent operations. "
 KOR_pnr_month_blitz_operation: "[GetMonth] Blitz Operation"
 KOR_pnr_month_blitz_operation_desc: "We shall launch a rapid blitz operation to suppress completely the escalating uprising in Hamhung. Since they have no means of contacting the outside world, perhaps we can act without restraint, making them understand how foolish their behavior was and regret serving as the hounds of foreign saboteurs in this reckless revolt! "
 KOR_pnr_daegu_standoff_ongoing: "§tThe Daegu Crisis Is Ongoing.... §!"
 KOR_pnr_hamhung_situation_out_of_control: "§tThe Hamhung Uprising Is Ongoing.... §!"
 KOR_pnr_daegu_suppression_plan_finished: "The Riot-Suppression Plan Has Been Finalized"
 KOR_pnr_namwon_supply_lines_cut: "We Have Severed the Rioters’ Transport Routes and External Communications"

 ### Events ###
 KOR_pnr_puppet.1.t: "Another Choice? "
 KOR_pnr_puppet.1.desc: "The antagonism sparked by bloodshed during the demonstrations has still not subsided, successfully proving that a unified Restoration Army never truly existed, and factional struggle has developed from the initial standoff into scattered armed clashes, while the returned Provisional Government of the Republic of Korea appears unable to control the situation. We could of course wait for the conflict to subside, but rather than place our hopes in a provisional government that has only just returned, perhaps we could support an organization that has long existed in [KOR.GetName] and possesses deep ties with the local population——the Working People’s Party seems a good choice, but Lyuh Woon-hyung himself is presently trapped in the vortex of the left-right dispute. \n\nAt that moment, an organization transcending political parties caught our attention——Jeungsanism, a new religion born in [KOR.GetName] at the beginning of this century, closely connected to the Donghak Peasant Revolution（the Gabo Peasant War）, and rooted among [KOR.GetAdjective] farmers by radicals after the uprising failed. During the Japanese colonial period, Jeungsanism became a stronghold for many local revolutionary progressives in [KOR.GetName] resisting the Japanese colonial government. This also brought upon them relentless manhunts and reprisals by the Japanese police. Nevertheless, through their own tenacious vitality they survived, and consistently supported the [KOR.GetName] liberation movement. It may be madness, but supporting them is not beyond consideration.... "
 KOR_pnr_puppet.1.a: "Trust them. "
 KOR_pnr_puppet.1.b: "Perhaps not. "
 KOR_pnr_puppet.2.t: "The Crossroads of the Three-Thousand-Li Land"
 KOR_pnr_puppet.2.desc: "Although the Restoration Army possesses the symbolic legitimacy of the anti-Japanese war and national restoration, and the Provisional Government of the Republic of Korea does indeed hold a rightful claim to govern this country——after all these decades, their administrative foundations for ruling the entire peninsula have nevertheless weakened, and long exile abroad has left them rather distant from local forces and the grassroots masses. No Korean would deny that Korea’s national restoration was achieved jointly by the Restoration Army abroad and Korea’s local organizations at home. How many years have passed since the Provisional Government and Restoration Army left this land? During the dark years of colonial rule, it was those who remained here who united everyone and raised funds for the Provisional Government abroad, some even paying with their lives. \n\nIs only the blood shed for Korea by the Restoration Army real blood? With our support, guarantees, and lobbying, Jeungsanism——a local organization that actively resisted the invaders in the rear during the Japanese colonial period and supplied the Provisional Government with operational funds and related resources——has been permitted to take temporary control of [KOR.GetName] as its government, serving as a lubricant connecting the native countryside, reassuring farmers and local society, and helping [KOR.GetName] pass smoothly through the turbulence of the regime’s early establishment. \n\nThis is a compromise in nation-building, and the Provisional Government of the Republic of Korea has expressed deep regret over our choice, and one day, [KOR.GetName] will have to deal with this fracture. "
 KOR_pnr_puppet.2.a: "Who will our new neighbor be? "
 KOR_pnr_puppet.3.t: "Bocheonism Seeks Support"
 KOR_pnr_puppet.3.desc: "We have received a telegram from [KOR.GetName], one faction within Jeungsanism: Bocheonism hopes to obtain our support. Like most organizations, Jeungsanism is not monolithic, and Bocheonism is one of several large and influential denominations within it. Founded in 1918, Bocheonism gained roughly six million believers on the Korean Peninsula under Japanese colonial rule, and can be said to possess extensive ties to the Korean people. \n\nYet Bocheonism itself contains two forces, one seeks to perpetuate Bocheonism’s religious mythology, believing that Bocheonism was bestowed by the Lord of Universal Transformation Who Responds to the Thunder of the Nine Heavens, and that its leader Cha Kyung-seok is the Heavenly Lord’s son, the monarch granted to Korea by Heaven. More than a decade ago, Cha Kyung-seok offered sacrifices to Heaven on a mountain, declared Korean independence, and “ascended the throne”, after which his actions were suppressed by the Japanese government. \n\nThe other force is led by Bocheonism’s second-in-command Kim Hong-gyu, a friend of Kim Gu who organized several fundraising drives for the Provisional Government of the Republic of Korea. When he attempted to travel to Shanghai carrying one hundred thousand won, the Japanese discovered him, and the colonial government subjected him to severe torture. Like Cha Kyung-seok, he also yearns for Korean independence. But at heart he is a simple patriot, not a man who wishes to become emperor. "
 KOR_pnr_puppet.3.a: "A peasant monarch and a revolutionary, what kind of combination is this? "
 KOR_pnr_puppet.4.t: "Taegeukdo Seeks Support"
 KOR_pnr_puppet.4.desc: "We have received a telegram from [KOR.GetName], one faction within Jeungsanism: Taegeukdo hopes to obtain our support. Like most organizations, Jeungsanism is not monolithic, and Taegeukdo is one of several large and influential denominations within it. Founded in 1921, Taegeukdo bore an anti-colonial shadow from birth, beginning with a legendary tale. \n\nIn 1909, the fifteen-year-old Jo Cheol-je could not endure the fact that Korea had become a colony, so he killed a local Japanese governor-general, seized his property, donated part to the Provisional Government of the Republic of Korea, and gave part to the village’s workshop for homemade rifles. The incident quickly drew pursuit by the Japanese police, and while he stowed away aboard a train from Changwon toward Manchuria, Jeungsanist patriarch Kang Il-sun appeared in his dream, bestowed various divine powers upon him, and protected his safe arrival in Fengtian and subsequent return home. Today Jo Cheol-je, rather than pursuing spectacular struggle, longs to fulfill the wish of the deity who protected him and transform Korea into a beautiful earthly paradise. \n\nCompared with this religious leader, the young Park Han-gyeong’s background is somewhat.... problematic. Before national restoration he was a member of the Japanese army, though for most of the time he served as an inside agent. Perhaps because of this experience, he largely supports Jo Cheol-je’s ideas, believing a new world should be built in which everyone reconciles and forgives one another, but to achieve this goal, outside power is indispensable. "
 KOR_pnr_puppet.4.a: "A beautiful new nation, hmm.... "
 KOR_pnr_puppet.5.t: "Jeungsanbeop Seeks Support"
 KOR_pnr_puppet.5.desc: "We have received a telegram from [KOR.GetName], one faction within Jeungsanism: Jeungsanbeop hopes to obtain our support. Like most organizations, Jeungsanism is not monolithic, and Jeungsanbeop is one of several large and influential denominations within it. Jeungsanbeop holds an exceptionally special position, having been founded by Kang Sun-im, the biological daughter of Jeungsanist patriarch Kang Il-sun. In a certain sense, Jeungsanbeop may be the true heir of Jeungsanism, for Kang Il-sun’s remains are kept here, and every year all the major denominations must send representatives to Jeungsanbeop to hold rites of veneration. \n\nKang Sun-im was born with an unattractive appearance, drawing much criticism, but Kang Il-sun said that “only an ugly child can truly inherit my work and realize the Later-Heaven Renewal”. After Kang Il-sun’s death, Kang Sun-im’s aunt attempted to murder her in order to become Jeungsanism’s sole heir. This began years of wandering for Kang Sun-im, and in South Gyeongsang she attempted suicide, only to hear her father’s reproachful voice\n\n“My sustenance, why would you end your own life? I have brought you a gentleman, take heart, and look toward the future. ” When she came to her senses, her future husband, Kim Byeong-cheol, was sitting beside her, saying that a dream had guided him here to comfort someone. \n\nKang Sun-im may possess no political ideas whatsoever, existing only to preserve the status quo——Jeungsanbeop can be described as the most conservative and most orthodox force. In a certain sense, it is a mirror of the [KOR.GetAdjective] countryside. "
 KOR_pnr_puppet.5.a: "In this age, they still emphasize orthodox status? "
 KOR_pnr_puppet.6.t: "Our Decision"
 KOR_pnr_puppet.6.desc: "The day for our reply approaches, and the various Jeungsanist denominations are about to hold a conference at Jeungsan, the sacred place where their patriarch Kang Il-sun descended from Heaven, to determine who will represent Jeungsanism in this newborn Korean government. We previously received telegrams from three factions, each hoping to obtain our support, and plainly we can support only one. Although our support does not guarantee that the chosen faction will be elected representative at the conference, there is no doubt that our declaration, as guarantor of [KOR.GetAdjective] peace, will place immense pressure upon their final decision. "
 KOR_pnr_puppet.6.a: "Support Bocheonism. "
 KOR_pnr_puppet.6.b: "Support Taegeukdo. "
 KOR_pnr_puppet.6.c: "Support Jeungsanbeop. "
 KOR_pnr_puppet.6.d: "Leave them alone. "
 KOR_pnr_puppet.7.t: "Urgent Telegram from Seoul"
 KOR_pnr_puppet.7.desc: "An urgent telegram has arrived from Seoul, sent by the denomination we supported. According to the telegram, Jeungsanism is about to announce the results of the Jeungsan Conference, but unfortunately these Koreans ignored our hints and did not nominate our preferred candidate at the conference. The other side now hopes that we will provide further assistance, formally and explicitly expressing our support for them, which would force Jeungsanism to change its decision. \n\nThey have offered generous returns, declaring that if we intervene, once they control the government they will grant us further concessions in the economy, minerals, agriculture, and other fields. Although as suzerain we can accept cooperation with any force, they have nevertheless offered an increment worth considering, and this unexpected event indicates on one hand that this organization of farmers is not as easy to control as we anticipated, and on the other that they may repeatedly act against our wishes in the future——this is an opportunity to make them remember that the advice and orders of [ROOT.GetName] deserve careful consideration before they reply. "
 KOR_pnr_puppet.7.a: "Apply diplomatic pressure to [KOR.GetName]. "
 KOR_pnr_puppet.7.b: "Mobilize the border troops and prepare for armed coercion. "
 KOR_pnr_puppet.7.c: "Since they lost, accept the outcome. "
 KOR_pnr_puppet.8.t: "Congratulations"
 KOR_pnr_puppet.8.desc: "The denomination we supported has sent us a congratulatory telegram. It seems that under our pressure, the various Jeungsanist denominations ultimately decided to select them as the representative of Jeungsanism as a whole, entering the government to preside over relevant affairs. Although the precise line within their denomination remains undecided, they thank us for our efforts, control of the [KOR.GetAdjective] government has now fallen into their hands, and they can finally begin realizing step by step their ideal blueprint for [KOR.GetAdjective] society. "
 KOR_pnr_puppet.8.a: "It was a trivial favor on our part. "
 KOR_pnr_puppet.9.t: "Seizing the Sacred Relics"
 KOR_pnr_puppet.9.desc: "An unexpected internal struggle has erupted within Jeungsanism. Just days ago, Jo Cheol-je of Taegeukdo entered Jeungsanbeop territory with a group of followers, desecrated the tomb of their deceased founder Kang Il-sun, and removed his body from the grave. The theft was quickly discovered by Jeungsanbeop members, who identified Jo Cheol-je as the culprit. \n\nLate last night, Jeungsanbeop believers stormed Taegeukdo’s temple while a sacrificial rite for Kang Il-sun was underway. The dispute quickly became shoving, then a brawl centered on the corpse. During the chaotic struggle, Taegeukdo’s altar was destroyed and the left hand of their “divine ancestor” was broken off, Jeungsanbeop has now recovered most of Kang Il-sun’s remains, but Taegeukdo still retains his left hand. \n\nTaegeukdo fiercely condemned Jeungsanbeop’s violence, claiming to have received an oracle from Kang Il-sun instructing them to welcome his sacred body into Taegeukdo’s sanctuary, and stating that before inviting the sacred body they had already obtained permission from Kang Il-sun’s other surviving relatives. They insist the opposing side bears full responsibility for the damage to Kang Il-sun’s sacred body. \n\nJeungsanbeop, however, declares that Master Kang Sun-im is the only spokesperson explicitly designated by Kang Il-sun, that no one else’s permission is valid, and that Taegeukdo never obtained hers. Their conduct was therefore the most shameless theft. It was precisely this evil affinity that shattered the founder’s sacred body, and Taegeukdo must bear responsibility. \n\nIn any event, this may mean that more serious struggles exist within this religious organization than we expected. "
 KOR_pnr_puppet.9.a: "They are fighting over a corpse, what are they doing? "
 KOR_pnr_puppet.9.b: "Taegeukdo’s hysteria proves they cannot be trusted. "
 KOR_pnr_puppet.9.c: "Perhaps it would be better to eliminate the orthodox faction early.... "
 KOR_pnr_puppet.10.t: "The [KOR.GetAdjective] Leader Has Been Confirmed"
 KOR_pnr_puppet.10.desc: "News has arrived from [KOR.GetName], the struggles among Jeungsanism’s denominations and the leadership struggles within them have now both come to an end, [KOR.GetLeader] now controls the entire government as Jeungsanism’s representative. The questions now before him are what stance to take toward the Restoration Army forces, and how to rebuild a country colonized by [JAP.GetName] for decades. "
 KOR_pnr_puppet.10.a: "Let us wait and see. "
 KOR_pnr_puppet.11.t: "Agrarian Reform Obstructed"
 KOR_pnr_puppet.11.desc: "As an Asian agrarian society, [KOR.GetName]’s people have stronger demands for land than for political ideas or faith. This means that if we can help the overwhelming majority of its society——the peasants——realize their dream that “the tiller shall own the land”, we can naturally unite them beneath one faith and one idea through shared interest. Our allies planned precisely this, but the recent agrarian-reform campaign in [KOR.GetName] has encountered obstacle after obstacle. \n\nTo avoid angering landlords who already control agriculture and capital, the [KOR.GetAdjective] government currently follows the principle of “compensated purchase, compensated distribution”, but practical implementation has proven difficult. Some groups in the government representing landlord interests have expressed dissatisfaction, arguing that the government’s compensation standard for land purchases is too low and that settlement is being made in banknotes printed after national restoration rather than precious metals, leaving them unable to accept both the economic loss and potential instability. \n\nOn the other hand, groups in the government representing peasant interests have also expressed dissatisfaction, arguing that although the post-restoration government altered the tax system for reconstruction, farmers still face heavy taxes in kind. Owning their own land is certainly desirable, but the purchase price would be an unbearable burden. They hope the government itself will pay and distribute the land to farmers without charge. \n\nWorse still, some speculators have begun spreading rumors that [RUS.GetName] will soon intervene in East Asia, attempting to profit from the land crisis. [KOR.GetName] has appealed to us, hoping we can help them devise a reasonable solution. "
 KOR_pnr_puppet.11.a: "Let them distribute it without charge, we can provide subsidies. "
 KOR_pnr_puppet.11.b: "If they lack bullets for dealing with landlords, we have plenty. "
 KOR_pnr_puppet.11.c: "Let them feel out their own path. "
 KOR_pnr_puppet.12.t: "Empty Pockets"
 KOR_pnr_puppet.12.desc: "The newborn government of [KOR.GetName] has appealed to us, hoping we can provide various forms of financial assistance to help its economy recover rapidly. Previously, the [KOR.GetAdjective] government unified tax categories and rates by abolishing local tax systems and numerous harsh levies left from the colonial era, thereby promoting the recovery of productivity and circulation of goods, but this has also left the government unable to obtain sufficient money and supplies through taxation for its reconstruction work. \n\nThe [KOR.GetAdjective] government hopes that we, as its suzerain, can provide basic food, fuel, and medical supplies to alleviate the severe material shortages it currently faces. Once famine and a public-health crisis have been averted, if we can offer further assistance to repair the transport lines, power systems, and communications damaged during the previous war of national restoration, perhaps [KOR.GetName]’s industrial production will recover more quickly. "
 KOR_pnr_puppet.12.a: "We have ample reserves of food and consumer goods. "
 KOR_pnr_puppet.12.b: "If you need more money, name a figure. Speaking of which, have you tested whether the mining machinery left by the Japanese still works? "
 KOR_pnr_puppet.12.c: "I think the Korean people will always find their own way out. "
 KOR_pnr_puppet.13.t: "A Choice of Institutions"
 KOR_pnr_puppet.13.desc: "Although the leader of [KOR.GetName] has his own ideas about how to build the country, nominally we remain their suzerain, meaning that in every aspect of national development we possess legitimate grounds to advise them when they are lost. [KOR.GetName] has recently asked for our help, they are now a country ruled by [KOR.GetRulingParty], and therefore the government wishes to remove as much as possible of the Japanese colonial foundation from its laws, creating an entirely new set of institutions belonging to them alone. \n\nSome within the government propose continuing the spirit and basic principles of the 《Constitution of the Great Korean Empire》; others believe this law has been obsolete for too long, and viewed from the present is riddled with flaws and unsuited to today’s [KOR.GetName], arguing instead that they should learn legislation from great powers such as [GER.GetName] or [RUS.GetName]; naturally, some also believe following their suzerain is the best choice, and therefore advocate drafting the relevant provisions with the laws of [ROOT.GetName] as reference. \n\nUltimately, however, [KOR.GetName] still chose to ask our opinion, and the moment they made that decision, the answer became obvious——we can of course advise them to use our laws as a model, establishing the fundamental principles of [KOR.GetName]’s political development and institutional construction, but perhaps we could also turn it into a testing ground, trying policies we once planned to implement but ultimately abandoned.... "
 KOR_pnr_puppet.13.a: "Our laws will be the finest model for them! "
 KOR_pnr_puppet.13.b: "Let us begin a political experiment in [KOR.GetName].... "
 KOR_pnr_puppet.13.c: "What is wrong with retaining the old system and patching it up? "
 KOR_pnr_puppet.14.t: "Our Neighbor’s Defense Problem"
 KOR_pnr_puppet.14.desc: "[KOR.GetAdjective] society now faces an exceptionally grave test, with the fall of the Japanese colonial government and the establishment of the new [KOR.GetAdjective] regime, a vacuum has emerged in public security, and the new regime’s security forces are extremely weak. \n\nTo save expenditure for economic construction and facilitate the management of social order, the government retained large numbers of police officers and grassroots bureaucrats from the Japanese colonial period, but when these familiar faces reappeared before the [KOR.GetAdjective] public in new uniforms, they provoked enormous outrage. Public noncooperation with security administration is only one aspect, serious attacks on police have now erupted throughout [KOR.GetName], and some citizens even trust gangs and violent groups more than the police, becoming protectors of these sources of social instability. \n\nSome local security institutions have even chosen to reconcile with gangs, turning a blind eye to illegal activities such as drug trafficking and human trafficking in exchange for gang assistance in maintaining public order. The [KOR.GetAdjective] government is attempting to improve the situation, and hopes we can assist with security intervention during the early establishment of the regime. "
 KOR_pnr_puppet.14.a: "Of course, we will establish military bases. "
 KOR_pnr_puppet.14.b: "Limited assistance in maintaining order will be enough. "
 KOR_pnr_puppet.14.c: "Can the Restoration Army not manage it themselves? "
 KOR_pnr_puppet.15.t: "Education and Thought"
 KOR_pnr_puppet.15.desc: "The long and brutal colonial rule and assimilation policies of [JAP.GetName] have thoroughly destroyed the [KOR.GetAdjective] education system, and the results of a recent national census conducted by the [KOR.GetName] government show that illiteracy has reached an appalling 75%, meaning that implementing economic reform, public-health policy, and industrialization in such a country will be extremely difficult. \n\nFrom a positive perspective, however, if they can solve their educational and ideological problems, they can transform their enormous population into a highly skilled labor resource. The [KOR.GetName] government is already planning to establish a compulsory education system and provide free primary education to its citizens, but policy is one thing, implementation requires money and teachers. \n\nOn the other hand, low literacy has also left the public with simple and primitive conceptions of good and evil and of the nation, and they possess little understanding of the benefits of government policies, making them more susceptible to agitation by malicious actors. In contacting us this time, the [KOR.GetName] government not only hopes we can support its universal-education plan, but also wishes to use our power to print leaflets and posters in the cities promoting the superiority and benefits of government policy. \n\nConsidering their widespread illiteracy, perhaps we could do even more for them——establish Korean-language radio stations within our territory dedicated to [KOR.GetName] for political messaging, explaining the benefits of government policy in the plainest language, along with whatever else we wish to say. "
 KOR_pnr_puppet.15.a: "Help them print a batch of leaflets. "
 KOR_pnr_puppet.15.b: "If we could control the media of [KOR.GetName].... "
 KOR_pnr_puppet.15.c: "Do they really need to ask us about this? "
 KOR_pnr_puppet.16.t: "Technical Assistance"
 KOR_pnr_puppet.16.desc: "As [JAP.GetName] fled hastily from the land of [KOR.GetName], they abandoned large quantities of industrial equipment. Some had been properly sabotaged before their departure, while others remain operational. If these colonial legacies can be utilized, [KOR.GetName]’s industrialization can make greater progress. \n\nUnfortunately, [KOR.GetName] lacks sufficient skilled workers and engineers to operate or repair this machinery, and most [JAP.GetName] companies here engaged in resource extraction rather than manufacturing, so if [KOR.GetName] wishes to process raw materials into more valuable products, it still lacks a great deal of equipment and corresponding technology. It is obvious that [KOR.GetName] hopes to obtain support from us as its suzerain. \n\nThey hope to sign an agreement with us and receive comprehensive economic and technical assistance, bringing in the engineers, manufacturing equipment, and related technologies they urgently need. In return, besides granting further rights of joint development, they are also willing to provide us with labor for low-end manufacturing and service industries, such as miners and nurses. "
 KOR_pnr_puppet.16.a: "It is only right to introduce them to some mature civilian technologies. "
 KOR_pnr_puppet.16.b: "Beyond technology, we should also invest in establishing research institutes. "
 KOR_pnr_puppet.16.c: "Teach the apprentice, starve the master. "
 KOR_pnr_puppet.17.t: "[KOR.GetName] Seeks an Agreement on Market Access"
 KOR_pnr_puppet.17.desc: "Our friends in the [KOR.GetName] government appear to have formulated a new economic-development strategy. Recently they have wandered the world holding newly mined minerals, textiles, dried frozen fish, and various simply processed products, searching for buyers——only to be left reeling by other countries that have dominated globalized markets for decades, and now, with nowhere else to turn, they have returned seeking our help. \n\n[KOR.GetName] believes its domestic market is too small, and that if it wishes to develop its economy rapidly, the best choice is to use its labor resources to participate actively in and promote the cycle of international exchange, pursuing a “trade-oriented nation”. The main reason they have struck obstacles in the global economy is that they are only just beginning, the quality of their raw materials and manufactured goods already faces many alternatives on the international market, and as global tension rises, countries are imposing strict limits on market access, placing them at a disadvantage in competition. \n\nThe [KOR.GetName] government hopes we can relax market-access restrictions on [KOR.GetName], allowing their products to be exported here in large quantities and thereby driving economic development within [KOR.GetName]. There is no doubt that accepting their request will disrupt our domestic market and inevitably arouse dissatisfaction among many local enterprises. "
 KOR_pnr_puppet.17.a: "Limited concessions will help realize their economic-development strategy. "
 KOR_pnr_puppet.17.b: "Perhaps we can use this to make them more dependent on the market of [ROOT.GetName]. "
 KOR_pnr_puppet.17.c: "They will not take a single penny. "
 KOR_pnr_puppet.18.t: "Deviation from the Economic Plan"
 KOR_pnr_puppet.18.desc: "We have encountered a difficult problem, under [KOR.GetLeader]’s leadership, [KOR.GetName] appears to have subtly revised its predetermined economic plan, a plan originally approved by us. With the government’s tacit consent, some large enterprises seem to have begun borrowing from banks without restraint in an attempt to expand, and their debt-to-asset ratios have reached alarming levels. \n\nMost unacceptable of all, one of these enterprises’ methods of expansion is to use borrowed funds to purchase assets, then use the purchased assets as collateral to apply for further loans from [KOR.GetAdjective] banks, the amplification of the money multiplier suggests a banking credit crisis is likely. \n\nThe [KOR.GetAdjective] government may not realize what it is indulging, or perhaps it has recognized the risks and chosen to act regardless. There is no doubt that this is a dangerous gamble, and we know perfectly well where these unauthorized actions will lead. For the stability of [KOR.GetName] and the welfare of its people, and to avoid greater intervention funds that may be required in the future, perhaps we should express concern and dissatisfaction with their recent conduct——through a diplomatic warning, or by direct action forcing compromise and concessions. "
 KOR_pnr_puppet.18.a: "Persuade them through unofficial channels. "
 KOR_pnr_puppet.18.b: "Formally inform them directly that next quarter’s budget will be cut. "
 KOR_pnr_puppet.18.c: "You are making money without inviting me? "
 KOR_pnr_puppet.19.t: "The Korean National Movement Rises"
 KOR_pnr_puppet.19.desc: "A shocking piece of news has recently spread wildly through [ROOT.GetName] and [KOR.GetName]. A parade celebrating Korean national restoration was recently held in Seoul, and during the event, a young [KOR.GetAdjective] man slipped away from the procession, entered a restaurant operated by one of our nationals, and attacked him with an iron pipe. The assault left the forty-year-old [ROOT.GetAdjective] man with bruises across his body and a mild concussion. \n\nWhen the culprit was arrested by police maintaining order, he threw the iron pipe to the ground and repeatedly shouted “Long live [KOR.GetName]”. Preliminary investigation indicates he belonged to a local populist student organization. Notably, some witnesses report that police did not intervene during the beating, although they later defended themselves by saying their attention was entirely focused on maintaining general order in the parade and they therefore failed to notice the violence occurring indoors, but this explanation is plainly suspicious. \n\nWe cannot determine whether this attack was the young man’s own initiative or whether another force incited him from behind, the only thing we can be certain of is that within [KOR.GetAdjective] society, we seem gradually to have become the villain. Regardless, the fact remains that one of our citizens was attacked within [KOR.GetName], and the question now is how we should characterize the incident——"
 KOR_pnr_puppet.19.a: "Send a diplomatic protest to [KOR.GetName]. "
 KOR_pnr_puppet.19.b: "Are those things in your hands mere firewood? "
 KOR_pnr_puppet.19.c: "This is an inevitable problem for a suzerain.... "
 KOR_pnr_puppet.20.t: "[ROOT.GetName]-[KOR.GetName] Talent Exchange Program"
 KOR_pnr_puppet.20.desc: "The [KOR.GetName] government proposes signing a memorandum for a talent-exchange program with us, under which the [KOR.GetName] government will fund and select students in science and engineering to study here in the industrial technologies they urgently require, helping [KOR.GetName] raise its technological level in heavy industry, chemicals, electronics, and other fields. \n\nThey will pay all living expenses for these students during their stay in our country, while we will need to cover tuition and bench fees at universities and technical institutions, though only temporarily, as they promise to assume the full cost once government finances improve in the coming years. On the other hand, they also hope we can send personnel they urgently need to support the establishment and administration of higher-education institutions, which is vital to the future development of [KOR.GetName]. The [KOR.GetName] government further proposes expanding the scale of talent exchange in the future, and looks forward to the day when our countries can form a joint scientific and technical commission to advance technological development together. "
 KOR_pnr_puppet.20.a: "This is a fine plan for cultivating talent. "
 KOR_pnr_puppet.20.b: "Would they also like to experience the cultural scenery and comfortable life of [ROOT.GetName]? "
 KOR_pnr_puppet.20.c: "We currently lack the conditions to receive them. "
 KOR_pnr_puppet.21.t: "The Question of Operational Command"
 KOR_pnr_puppet.21.desc: "The [KOR.GetName] government led by Kim Hong-gyu recently sent us a rather interesting telegram, written in a respectful and consultative tone, but its contents already reveal their sharpened ambition. Ever since we helped the Restoration Army drive out the Japanese colonizers, operational command of [KOR.GetName] has remained in our hands. Now Kim Hong-gyu wants it returned, to achieve “Korean national restoration” in the truest sense. Plainly, he views this as an opportunity to rally domestic opinion and strengthen his identity as a patriot. \n\nThe most immediate problem with returning command is that our control over [KOR.GetName] will be weakened, and if any unforeseen event occurs, the troops deployed along the border will be unable to reinforce them in time. But returning operational command is not entirely without benefit, to assist the [KOR.GetName] government in military administration, we established many joint military advisory departments locally, and returning command will reduce our military expenditure in [KOR.GetName], while allowing us to profit by selling them more weapons and equipment for the military expansion they will be forced to undertake. "
 KOR_pnr_puppet.21.a: "This requires more careful evaluation. "
 KOR_pnr_puppet.21.b: "Last time they lost to the Japanese, who do they want to lose to this time? "
 KOR_pnr_puppet.21.c: "If they want it, give it to them. "
 KOR_pnr_puppet.22.t: "Proclaiming an Empire? "
 KOR_pnr_puppet.22.desc: "At first we suspected this was a prank by hostile overseas forces or the result of lax management in [KOR.GetName], but after cautious verification we confirmed the document’s authenticity. Cha Kyung-seok, the current leader of [KOR.GetName], has sent a request through a private radio station, hoping we will support him in completing his unfinished undertaking of “ascending the throne in the Gapja year”. If the facts described in his telegram are not exaggerated, the internal situation of the [KOR.GetName] government is now exceptionally grave. \n\nThe Restoration Army, Labor Party, Nationalist Party, and other forces believe Cha Kyung-seok’s dream of enthronement is extremely dangerous, but dare not publicize their opposition because we previously expressed support for him. Their current plan is to turn [KOR.GetName] into a parliamentary monarchy, Cha Kyung-seok may of course ascend the throne as “emperor”, but he must simultaneously revive another institution from [KOR.GetName]’s history——the “Hwabaek Council”, an aristocratic assembly of the peninsular state in the first century AD, beneath whose skin would be a genuine modern parliament led by them. \n\nCha Kyung-seok has appealed to us, hoping we will pressure [KOR.GetName] to prevent such an outcome, he wishes to become a true monarch rather than a rubber stamp, and has promised us many benefits after success, making his grand dream of restoration worthy of careful consideration. "
 KOR_pnr_puppet.22.a: "We will hint that we support you. "
 KOR_pnr_puppet.22.b: "If you need a temporary imperial guard, we have one here. "
 KOR_pnr_puppet.22.c: "We will discuss it further. "
 KOR_pnr_puppet.23.t: "Shopping List"
 KOR_pnr_puppet.23.desc: "After several rounds of discussion concerning [KOR.GetName]’s economic problems, the [KOR.GetName] government recently sent us an economic reconstruction and development plan of its own design. The plan clearly comes from Jo Cheol-je, but rather than a reconstruction and development plan, it is more accurately described as a lengthy shopping list. \n\nAccording to the list, Jo Cheol-je hopes to obtain a budget of hundreds of billions of won from us, part to rebuild and maintain various basic facilities for the people’s livelihood, with all the remainder devoted to further development, followed by an enumeration of the goods required for each development project——overall, Jo Cheol-je’s plan could indeed help the [KOR.GetName] government accelerate its economic reconstruction projects and achieve economic self-reliance and improved living standards as soon as possible, but the cost is simply too high, even we would find it difficult to provide such a sum in aid to [KOR.GetName], not to mention that whether they are worth investment on such a scale still requires discussion. "
 KOR_pnr_puppet.23.a: "Help him revise this “shopping list” into something more like a “strategy”. "
 KOR_pnr_puppet.23.b: "Buy what he wants. "
 KOR_pnr_puppet.23.c: "Does he think we are a wishing machine? "
 KOR_pnr_puppet.24.t: "Burn the Real Tiger"
 KOR_pnr_puppet.24.desc: "Park Han-gyeong has sent us a telegram, and it appears he has finally made up his mind to move against the Restoration Army. Park Han-gyeong believes that under his rule, [KOR.GetName] has essentially entered a stable phase, and that the “consensus and unity” program he leads within the government has achieved remarkably strong results. The only discordant note is the Restoration Army. Ever since Park Han-gyeong took power, the Restoration Army has opposed him at every turn, attempting to tear the government apart and destroy the unity of [KOR.GetName]. \n\nHaving fully recognized that these people have degenerated and no longer share the path of the Korean nation after national restoration, Park Han-gyeong has planned this secret purge. He has assembled a group of patriots absolutely loyal to the government and to himself, intending to purge every Restoration Army member and sympathizer from the government. But this plan requires our help, plainly, if they realize the operation targets them, they will immediately organize, either striking back or scattering in flight, creating numerous difficulties for the purge. \n\nPark Han-gyeong hopes we will interfere with [KOR.GetName]’s radio frequencies during the operation and disrupt their wireless lines. Yet even if we are unwilling to go that far, simply ignoring their calls for help would still aid his plan. It is a risky undertaking, but also [KOR.GetName]’s own domestic affair, and we have no particular reason either to help or refuse. "
 KOR_pnr_puppet.24.a: "We will arrange a communications-line inspection. "
 KOR_pnr_puppet.24.b: "Removing them will benefit further intervention by us. "
 KOR_pnr_puppet.24.c: "The risk is too great. "
 KOR_pnr_puppet.25.t: "Rural Protest"
 KOR_pnr_puppet.25.desc: "A diplomatic note written in Kang Sun-im’s name has reached our foreign ministry, but its contents are a joint petition, and only the translated copy bears Kang Sun-im’s signature. The petition was “signed” by many farmers from [KOR.GetName], most of them illiterate and unable to write their own names, so they pressed fingerprints or drew circles upon the letter. Its specific content condemns recent mining development undertaken jointly by our country and [KOR.GetName] for occupying farmland in many rural regions, some fertile fields formerly suitable for cultivation can no longer receive adequate irrigation because the mines conduct drainage operations, and when these farmers tried to reason with the developers, they were told that the relevant compensation had already been paid. \n\nThe petition emphasizes that for the farmers of [KOR.GetName], land is an inseparable part of them, something that cannot be measured in money. Recent mining-collapse accidents in North and South Hamgyong have also affected farmland around certain mining areas, causing farmers to worry further about the consequences of our operations. In brief, they hope we will halt mining and reassess its possible impact on [KOR.GetName]’s agriculture. Our joint mineral extraction with the [KOR.GetName] government is based on an already signed contract, and the relevant plans have passed expert evaluation, yet now the farmers have come to make trouble, ultimately, ignoring them would not create any major problem. "
 KOR_pnr_puppet.25.a: "Perhaps we have pressed too hard. "
 KOR_pnr_puppet.25.b: "Negotiate agricultural aid in exchange for mineral development. "
 KOR_pnr_puppet.25.c: "This development is based on the original agreement. "
 KOR_pnr_puppet.26.t: "The Rogue Soldiers Scandal"
 KOR_pnr_puppet.26.desc: "A criminal case closely connected to us has recently occurred in [KOR.GetName], two veterans from our country stand accused of gang-raping a [KOR.GetName] woman in Suwon, Gyeonggi Province, and when their disgraceful conduct was discovered by a [KOR.GetName] police officer on night patrol, the two instead beat the officer, knocking out sixteen of his upper teeth, before being arrested in Yongin at noon the next day. Although both the woman who was raped and the patrol officer subjected to severe violence identified the two as the perpetrators, neither has confessed. \n\nBefore discharge, the two served in the same division, which took part in a major assault against Japanese forces in South Chungcheong during the war against Japan and received decorations and commendations. After discharge, both settled in Suwon, within [KOR.GetName], and although nominally still our citizens, they have acquired extensive property in [KOR.GetName]. \n\nOne invested in several entertainment establishments and operates in the private financial market; the other invested in the “Three Whites” industries——sugar, flour, and textiles, amassing a great fortune through [KOR.GetName]’s socioeconomic development after national restoration. Because of their identities and the special nature of their post-demobilization businesses, many matters cannot withstand deeper investigation, although we have hinted to the [KOR.GetName] government that it should not investigate people connected to them further and should focus only on the case itself, we must prepare every possible response——an incident this vile is bound to shake public opinion within [KOR.GetName]. "
 KOR_pnr_puppet.26.a: "How could such a thing happen, and be reported? "
 KOR_pnr_puppet.27.t: "The Fate of the Scoundrels"
 KOR_pnr_puppet.27.desc: "The [KOR.GetName] government is clearly testing our attitude toward the incident and attempting to use the opportunity to weaken our control over them. A more detailed investigation report has been shared with us: on the afternoon after the two were arrested, a flood of reports entered their police system, including both signed complaints and anonymous accusations. Most alleged numerous crimes committed by our citizens currently in [KOR.GetName], from drunk driving and theft to fighting and molestation, and some even claimed our citizens slipped into homes in [KOR.GetName] at night to cut out children’s hearts and eat them. Plainly, some of these allegations may contain truth, while others are certainly paranoid fabrications. Whether these accusations are treated as true will plainly depend entirely on how the [KOR.GetName] government ultimately decides to handle the two inhuman monsters. \n\nNotably, after news of this appalling atrocity reached our country, many of our citizens also expressed outrage, but argued that because the two nominally remain our citizens, [KOR.GetName] has no right to try them, and they should be extradited to our country for judgment by our courts; others claim they were heroes in our country but learned wickedness after reaching [KOR.GetName], meaning the problem lies entirely in the culture and customs of [KOR.GetName].... If we truly extradite these two beasts, it may provoke a considerable crisis within [KOR.GetName].... "
 KOR_pnr_puppet.27.a: "Why not try these vile and cruel bastards on the spot? "
 KOR_pnr_puppet.27.b: "These two pieces of human garbage! But they must be judged in their homeland. "
 KOR_pnr_puppet.28.t: "Protests Erupt in [KOR.GetName]"
 KOR_pnr_puppet.28.desc: "The two criminals who returned home were swiftly sentenced to execution by firing squad by our judicial authorities after landing, and although some people expressed dissatisfaction with our verdict, most supported our removal of this human refuse, yet to our surprise, the anger of the [KOR.GetName] public has still not subsided. \n\nProtest marches led chiefly by young students have erupted throughout [KOR.GetName]. The largest and most transgressive has taken place in Hamhung, Hamgyong Province. Some marchers hold aloft insulting portraits and slogans directed at [ROOT.GetLeader], and have surrounded the municipal government and residential districts of our citizens, demanding that these “imperialists” be driven completely from [KOR.GetName]. Although the march is nominally peaceful, reports of attacks on our citizens occasionally leak from local newspapers, and some unrelated third-country nationals have suffered unprovoked assaults merely because they resemble [ROOT.GetAdjective] people. \n\nThe [KOR.GetName] government has not yet commented on the march, but beyond maintaining basic order it has done nothing. We would do best to handle the matter quietly as well, but if news reaches home that our country cannot ensure the safety of its citizens in [KOR.GetName], our government’s credibility will undoubtedly suffer a serious blow. "
 KOR_pnr_puppet.28.a: "What is the [KOR.GetName] government doing? "
 KOR_pnr_puppet.28.b: "Have our troops stationed in [KOR.GetName] prepare tear gas. "
 KOR_pnr_puppet.28.c: "As expected, but what can they do to me? "
 KOR_pnr_puppet.29.t: "Economic Collapse"
 KOR_pnr_puppet.29.desc: "Although we have done everything possible to help [KOR.GetName] restore its economy and intended to achieve its self-reliance in national finance, not long after [KOR.GetName] staggered briefly to its feet, it gave a piercing scream, collapsed to the ground again, and could no longer rise. The economy of [KOR.GetName] has fallen into collapse, the large quantities of goods it produces cannot be absorbed by its narrow domestic market, nor can it secure a position in worldwide free trade capable of sustaining it. Many economic policies formulated by the [KOR.GetName] government failed to achieve their intended purpose, while the endless and blind expansion of domestic enterprises during postwar recovery further crushed the economy——unable to recoup funds from their products, they were forced to default on astronomical loans previously taken from the banks. Yet all this is only the beginning of the collapse of the entire national financial system, and over the coming months or even decades, the situation will only grow worse.... "
 KOR_pnr_puppet.29.a: "I have an ominous feeling.... "
 KOR_pnr_puppet.30.t: "Collapse of Social Order"
 KOR_pnr_puppet.30.desc: "Recent news from [KOR.GetName] has been far from good, as the popular anti-[ROOT.GetName] movement intensifies, the government appears to have lost control over the countryside, and recently has nearly lost control over the cities as well. Under the banner of “resisting foreign invaders”, many civil organizations have begun committing all manner of violence, murdering and robbing travelers and looting trains are among the kindest things they do. \n\n[KOR.GetName] is now exhausted by efforts to suppress these problems, but its shortage of security forces has produced little effect. Worse still, as the government loses social control, its financial reserves have nearly reached bottom. The police and other coercive institutions no longer accept salaries paid by the government in banknotes, demanding equivalent value in precious metals. In some places where there is no money left for wages, the police once responsible for maintaining order have simply disbanded, taken their pistols and batons, and joined the joyous army of looters. \n\n[KOR.GetName] has now become a paradise for bandits and robbers, while whether its official administrative orders remain effective beyond the government gates has become a question worthy of careful study. "
 KOR_pnr_puppet.30.a: "How did this happen? "
 KOR_pnr_puppet.31.t: "A Life Like Morning Dew"
 KOR_pnr_puppet.31.desc: "The fragmentary messages returned by our foreign ministry in [KOR.GetName] confirm our ominous premonition——because [KOR.GetName] has long depended heavily on our grants of aid, its postwar economic growth has stagnated and it has failed to achieve self-reliance. \n\nLarge quantities of agricultural produce and simply manufactured goods possess no competitive advantage on world markets, their exports have been struck down, and economic circulation can occur only domestically. [KOR.GetName]’s investment is chiefly held as savings overseas, while domestic savings are nearly zero and local consumption remains extremely high, reducing the entire country’s economic model to a consumption economy dependent upon relief, trapped in a vicious cycle of poverty. \n\nThe rise of inflation, the rapid population growth accompanying the period of postwar stability, and the bitter consequences of their blind pursuit of land reform to force urbanization have all become apparent at this moment. The massive growth of unemployment has exhausted local Korean security forces, and because we did not intervene deeply in Korean social security, the understaffed Korean government has been unable to handle the many resulting social problems. \n\nNow mafias and robbers roam the cities, and violent acts such as robbery and theft have become commonplace. In more remote rural regions, some places have restored systems of human trafficking. Anarchy hangs over the country, delivering the final blow to this regime. [KOR.GetName] has collapsed completely, and we are powerless to reverse it. "
 KOR_pnr_puppet.31.a: "Hello, this is the [ROOT.GetName] Foreign Ministry, hello, is anyone there——"
 KOR_pnr_puppet.32.t: "Settle the Body and Clear the Mind, Revere Heaven and Master the Self"
 KOR_pnr_puppet.32.desc: "Endless quarrels and selfishness can bring society and the nation nothing but division, Korea has already shed tears once, must Korea’s children make her weep again for their own desires? Someone must step forward to stop all this, $KOR_pnr_park_han_gyeong$ firmly believes it. \n\nThe most beautiful thing in the human world must be the circle, a circle has no corners, and naturally no obstructions, it obstructs nothing else, and is obstructed by nothing else. If everyone could likewise become a circle, drawing in their own sharp edges, turning and moving without obstruction and without interruption, then no resentment or opposition would remain in the world. \n\nThe defeat of the Japanese colonial government and Korea’s national restoration mean that the age of opposition is over, the continuation of hatred can bring only an endless chain of pain, and Korea, as the victor, has the right to forgive the defeated, the right through mercy to lift the curse of painful years imposed upon the people. Only by doing so can we truly establish an earthly heavenly kingdom that dissolves every grievance and lives in harmony, advancing toward a future of common prosperity and mutual benefit. "
 KOR_pnr_puppet.32.a: "The hibiscus falls each dawn and blooms each dawn, its inexhaustible vitality has come down from antiquity. "
 KOR_pnr_puppet.33.t: "The Later-Heaven Renewal, Has Become Reality"
 KOR_pnr_puppet.33.desc: "$KOR_pnr_kim_hong_gyu$ found a suitable place and sat down, remaining quietly seated upon the grass, the sky showed its first faint light, and more people gradually arrived to admire the flowers. Most Koreans visiting Mongmyeoksan to see the flowers did not appear to recognize that he was $KOR_pnr_kim_hong_gyu$ himself. This was no bad thing, although the security team and other aides had strongly discouraged him from acting alone, fearing that either foreign saboteurs or [ROOT.GetName] might exploit the situation. If $KOR_pnr_kim_hong_gyu$ truly wished to view the flowers, they could clear the area in advance. \n\n$KOR_pnr_kim_hong_gyu$ naturally refused, if he were alone, even tens of thousands of mugunghwa blooming in succession would only deepen the solitude. And the facts proved that no one discovered him here——at this moment, he was not the leader, not $KOR_pnr_kim_hong_gyu$, he was a “Korean”. \n\nHe saw the first hibiscus bloom, and also saw the last hibiscus wither. He saw countless Koreans like himself sweep away the sorrow and pain once written across their faces, all smiling as they watched the mugunghwa bloom at dawn and fall at dusk, brief yet displaying all the potential and passion of its life. \n\nTwilight gathered the final trace of sunlight, the flower-viewing crowds had all departed, and $KOR_pnr_kim_hong_gyu$ slowly rose, leaving as the last person there. "
 KOR_pnr_puppet.33.a: "Though pines endure a thousand years, they rot at last, the hibiscus finds its glory in a single day. "
 KOR_pnr_puppet.34.t: "The Mugunghwa Blooms, May the Eastern Land Endure Forever"
 KOR_pnr_puppet.34.desc: "$KOR_pnr_cha_kyung_seok$ sits enthroned within the Eleven Halls, a palace grander than Gyeongbokgung of the Joseon dynasty. From here, as Korea’s monarch, he guides Korea along its path. \n\nThe defeat of the Japanese colonial government and Korea’s national restoration prove that the old prophecy of the “Son of Heaven ascending the throne in the Gapja year” was no absurd superstition, but merely a plan compelled by fate to be postponed, Bocheonism has never been, is not, and never will be a tool of a nationalist political party, it shall transcend all of this and become part of the Korean people. \n\nThe Korean people have driven the Japanese colonial regime from their country, the Later-Heaven Renewal has begun, and the true Son of Heaven, the son of the Lord of Universal Transformation Who Responds to the Thunder of the Nine Heavens, $KOR_pnr_cha_kyung_seok$, shall follow destiny and fulfill the purpose of the heavenly gods. "
 KOR_pnr_puppet.34.a: "In the sixth month all hundred flowers are common growth, the hibiscus alone declares itself unique. "
 KOR_pnr_puppet.35.t: "Yin and Yang in Harmony, the Way Reaches the True Realm"
 KOR_pnr_puppet.35.desc: "Seo Seong used the willow twig he had broken off as a hairpin, placing it in Kim Seon-yeong’s hair and leaving her rather embarrassed. Looking this way and that, she seemed able to pluck one of the peonies Jin-i had planted earlier, so she casually broke off the flower and handed it to Seo Seong as her “precious” return gift. \n\nSeo Seong really did look a little angry, and quickly pulled the willow twig from her hair. He accidentally tugged Seon-yeong in the process, making her burst into tears, crying that she would never play with him again. But children are unlike adults, their hatreds easily vanish like smoke. Before long the two had reconciled completely, as close as they had been throughout the four or five years they had spent together. They continued riding their broomstick horses, running along the riverbank like two generals charging together. Once tired, neither cared about the dirt, and they simply lay down on the ground. \n\n“When I grow up I’m going to marry you, just like Jin-i and Uncle! ” Perhaps children do not know what they are saying, or when they should say it, but Seo Seong suddenly spoke these words. \n\n“Marry? And then what? ”\n\n“Then we’ll have children, play paper cicadas with them, and ride broomstick horses together, forming a cavalry unit! ”\n\n“And after that? ”\n\n“Then——” Alas, poor Seo Seong seemed not yet to have thought of anything else he wished to do after becoming an adult, “then, then when we both die of old age, we’ll have them burn the paper cicadas and brooms as offerings to us, and we’ll keep playing down below! ” He too seemed to find the statement somewhat forced, and after speaking he reached out and returned the willow twig to Seon-yeong. Hopefully this would stop her from asking further questions. \n\nAs for the peony, its bud had yet to open. "
 KOR_pnr_puppet.35.a: "May I be a steadfast pine ancient through a thousand years, who would speak of the fragrant hibiscus renewed for but one morning. "
 KOR_pnr_puppet.36.t: "Under the Sacred Dangun Tree, Prayers Without End"
 KOR_pnr_puppet.36.desc: "The world exists in eternal change, yet however it changes it remains a reenactment of past ages. In ancient times Dangun founded Korea, and today $KOR_pnr_kang_soon_im$ leads the people to found Korea anew. History finds its echo and repetition here, and the Korean people are no longer readers of history, they have become the medium through which history manifests in the present. \n\nPrecisely because every fate is already ordained, precisely because all of this is merely the repeated reenactment of one part of a story, the people can be freed from the unknown suffering pressing down upon them. For the individual, the only things that matter are what they remember from the past and experience in the present, all of this will become something called “tradition”, flowing onward through this land like a gentle living stream, without end. \n\nThe merciless Japanese colonial government once tried to destroy these traditions, but though they could cut down a hundred heads, they could never sever a river. $KOR_pnr_kang_soon_im$ and the Korean people shall continue guarding traditions that may not even need their defense, because their ancestors did the same. "
 KOR_pnr_puppet.36.a: "Along the roadside sparse hedges pile up brocade, blooming at dawn, falling at dusk, then blooming at dawn again. "
 KOR_pnr_puppet.37.t: "Seasons in Harmony and Harvests Abundant, Peace Under Heaven"
 KOR_pnr_puppet.37.desc: "$KOR_pnr_kang_soon_im$ has made her choice, rather than proclaiming hollow independence and self-strengthening, the more correct course is to truly walk among the majority of this country’s people. The peasants are weeping, the workers are weeping, while most in the government continue attacking one another over their respective positions and whether foreign powers stand behind them. \n\nThe profound suffering inflicted on Korea by the Japanese colonial government means only that the Japanese were brutal, not that sadaeism was wrong. If merely kowtowing and pledging loyalty can raise the living standards of tens of millions of Koreans, $KOR_pnr_kang_soon_im$ is willing to become a sinner against the nation, a traitor to Korea. Political positions, ideals, and even Jeungsanbeop itself can all be cast aside. Under the erosion of time, most comrades may have forgotten the original purpose of the Donghak uprising——the peasants could not survive, not that the peasants yearned to struggle. \n\nFortunately, at least for the peasants of this country, no empty slogan or slander against $KOR_pnr_kang_soon_im$’s character can conceal the fact that she helped lift them out of poverty. "
 KOR_pnr_puppet.37.a: "Cold wind and dew fill the autumn scene, alas its bloom and fall occur between dawn and dusk. "
 KOR_pnr_puppet.38.t: "Open Fire! "
 KOR_pnr_puppet.38.desc: "At our instruction, garrisons throughout the region rapidly assembled to help the [KOR.GetAdjective] government maintain order. As we expected, the instant the marchers saw our troops appear, they could restrain themselves no longer. They immediately began assaulting the outermost defensive line formed by the police. After someone in the crowd threw a brick at one of our soldiers and “happened” to knock him unconscious, our troops began their counterattack. To maintain order, we employed tear gas, fire hoses, and blank ammunition in Hamgyong to suppress the unrest. \n\nWe temporarily dispersed the crowd, but their retaliation soon arrived, some people plainly directed by foreign powers and harboring ulterior motives destroyed roads around Hamhung and began attacking our citizens and soldiers with improvised weapons. They began setting fires and looting indiscriminately in the streets, and the situation developed to a wholly unacceptable level. After receiving the silent acquiescence of the [KOR.GetAdjective] government, we assembled a regular army unit and deployed tanks and armored cars for a systematic clearing of the rioters. We shot and arrested the relevant bandit leaders, then transferred them to the [KOR.GetAdjective] government. The suppression is now triumphantly complete, and the uprising has ended. "
 KOR_pnr_puppet.38.a: "Send [KOR.GetName] the bill for our assistance in suppressing the unrest. "
 KOR_pnr_puppet.39.t: "Daegu Crisis"
 KOR_pnr_puppet.39.desc: "Because the [KOR.GetAdjective] government lacks the funds required for economic recovery, its neglect of public health has caused a crisis. Last month, cholera suddenly struck Daegu, killing roughly 4, 000 people, and because the new regime lacks medical and sanitary supplies, many patients could not receive timely treatment, further encouraging the disease’s spread. \n\nThe government is currently helpless to treat the disease, and to prevent it spreading across [KOR.GetAdjective] territory, has chosen to seal off Daegu, the source of the outbreak. Large quantities of essential goods cannot enter the quarantine zone, which has instead worsened conditions. Driven by hunger, many citizens of Daegu gathered before the municipal government to demonstrate, during the protest, a police firearm accidentally discharged and killed two civilians, transforming the demonstration into violent conflict. People began attacking and killing police and destroying officials’ residences, and so far thirty-seven officers have died at the hands of the mob. Meanwhile, workers in Daegu have begun organizing strikes, and in some places have even raised syndicalist banners——forcing us to suspect whether foreign powers stand behind their strike. The [KOR.GetAdjective] government hopes to receive our help in resolving the crisis properly, perhaps we can provide humanitarian aid, but we can also determine who has been secretly causing trouble for [KOR.GetName]. "
 KOR_pnr_puppet.39.desc2: "Because the [KOR.GetAdjective] government lacks the funds required for economic recovery, its neglect of public health has caused a crisis. Last month, cholera suddenly struck Daegu, killing roughly 4, 000 people, and because the new regime lacks medical and sanitary supplies, many patients could not receive timely treatment, further encouraging the disease’s spread. \n\nThe government is currently helpless to treat the disease, and to prevent it spreading across [KOR.GetAdjective] territory, has chosen to seal off Daegu, the source of the outbreak. Large quantities of essential goods cannot enter the quarantine zone, which has instead worsened conditions. Driven by hunger, many citizens of Daegu gathered before the municipal government to demonstrate, during the protest, a police firearm accidentally discharged and killed two civilians, transforming the demonstration into violent conflict. People began attacking and killing police and destroying officials’ residences, and so far thirty-seven officers have died at the hands of the mob. \n\nAt the same time, some strange figures have appeared in Daegu, and under their incitement some places have even raised slogans and banners commonly used by conservatives and imperialists——forcing us to suspect whether the crisis is an infiltration operation by foreign reactionary forces. The [KOR.GetAdjective] government hopes to receive our help in resolving the crisis properly, perhaps we can provide humanitarian aid, but we can also determine who has been secretly causing trouble for [KOR.GetName]. "
 KOR_pnr_puppet.39.a: "We must prevent a humanitarian crisis. "
 KOR_pnr_puppet.39.b: "This is an uprising, an uprising! "
 KOR_pnr_puppet.39.c: "They can solve it themselves. "
 KOR_pnr_puppet.40.t: "A Syndicalist Plot? "
 KOR_pnr_puppet.40.t2: "A Plot of the Old Order? "
 KOR_pnr_puppet.40.desc: "Our troops and tanks suppressed the unrest in Daegu with ease and arrested its ringleaders. Under our interrogation, they confessed fully that they had received support from syndicalist countries. They stated that they had received instructions from the syndicalists, infiltrated Daegu, made great use of the epidemic and food problems, and incited uninformed [KOR.GetAdjective] citizens and workers to join them in striking, attempting to turn Daegu into a bridgehead for the syndicalist reddening of [KOR.GetName]. \n\nNow that the truth has come to light, these people must face just judgment. After confirming that they had signed their confessions, we immediately executed them. Their testimony is plainly excellent material for warning the [KOR.GetAdjective] government to remain alert against external and internal syndicalists plotting to destroy the nation. "
 KOR_pnr_puppet.40.desc2: "Our troops and tanks suppressed the unrest in Daegu with ease and arrested its ringleaders. Under our interrogation, they confessed fully that they had received support from an overseas organization. They stated that they had received money, slogans, and other supplies from an organization based in [IMP.GetName] known as the “Free [KOR.GetName] Movement”, infiltrated Daegu, made great use of the epidemic and food problems, and incited uninformed [KOR.GetAdjective] citizens and workers to join demonstrations and launch an uprising. They thereby attempted, beginning from Daegu, to bring “freedom, peace and humanity” back to [KOR.GetName]. \n\nNow that the truth has come to light, these people must face just judgment. After confirming that they had signed their confessions, we immediately executed them. Their testimony is plainly excellent material for warning the [KOR.GetAdjective] government to remain alert against external and internal potential subversives plotting to destroy the nation. "
 KOR_pnr_puppet.40.a: "We must beware these rats that penetrate every opening. "
 KOR_pnr_puppet.40.b: "Use this opportunity to demand that they replace their officials with people who can cooperate better with us. "
 KOR_pnr_puppet.41.t: "Labor Problems"
 KOR_pnr_puppet.41.desc: "We previously concluded a treaty of economic and technical assistance with [KOR.GetName]. Under its terms, we would provide [KOR.GetName] with the technologies required for industrial development, and in return, they would send us a large labor force. Recently, however, the treaty has caused us considerable embarrassment. \n\nAfter entering our country, some [KOR.GetAdjective] people did not undertake the labor-intensive work we urgently needed, such as mining or nursing, some attempted to settle permanently within our borders, and still others began entering the sex industry, which is not the result we hoped to see. \n\nOur private investigation found in particular that these women’s participation in the “flesh trade” appears to have been part of the [KOR.GetAdjective] government’s original plan, and that they send part of their earnings home as foreign currency. In a certain sense, [KOR.GetName] is conducting legal, state-scale human trafficking, we can certainly expose them, but that would inevitably deprive them of what may be a very important source of foreign exchange. Alternatively, we can simply accept it in silence and turn a blind eye to the conduct of these “princesses”. "
 KOR_pnr_puppet.41.a: "We did not permit them to come here for such degraded conduct. "
 KOR_pnr_puppet.41.b: "This is also one choice they have for survival. "
 KOR_pnr_puppet.42.t: "The Adventures of King Dongmyeong"
 KOR_pnr_puppet.42.desc: "He set down the letter in his hand, already he had lost count of how many business owners had approached the Youth Corps this week. During the recent workers’ uprising in Daegu, [ROOT.GetName]’s troops chose to cooperate with this civil organization, together defeating the workers’ plot to occupy the factories and beating them into complete rout, and it could be said that this victory established the organization’s reputation. Since then, invitations to cooperate have arrived without end. There were landlords whose land had been forcibly seized by groups of peasants, entrepreneurs whose original factories had been taken over by organized unions that seized the production facilities, and of course invitations to assist the government in maintaining order. \n\nThe prices they offered were all extremely tempting, but the Youth Corps now lacked manpower, so its services went first to the highest bidder. As for this occasion——his gaze swept across one of the letters spread over the desk, this was a major transaction, requiring a life-and-death struggle against workers across an entire industrial district to recover a series of factories involving fertilizer, textile fibers, aluminum, and petroleum refining for the anonymous client, all industries closely tied to the lifeblood of the national economy, and it would not do to neglect this “mysterious” great figure. \n\nHe pushed open the office door, descended the crude iron staircase to the ground floor, approached the hundreds of corpsmen already standing in formation, and began his brief and direct pre-battle address: "
 KOR_pnr_puppet.42.a: "Boys, heat the iron pipes red-hot and we move out! "
 KOR_pnr_puppet.43.t: "Peasants Storm the Government"
 KOR_pnr_puppet.43.desc: "The [KOR.GetAdjective] government has shared news with us, recently landlords and tenant farmers have unusually joined together to express dissatisfaction with the government. Their protest does not concern rent or other issues, but our aid to [KOR.GetName]——previously, to prevent a famine crisis, we provided the [KOR.GetAdjective] government with large quantities of grain, and this cheap grain caused an enormous shock to food prices after entering the [KOR.GetAdjective] market. \n\nLocal landlords and farmers have plainly both suffered losses because of our relief policy. They now demand that the government reconsider its relief treaty with us, or at least take action to stabilize grain prices and prevent further damage to their original interests. After tense discussion, the [KOR.GetAdjective] government has proposed a sufficiently strange method that nevertheless appears capable of resolving the situation——it will purchase grain from farm households at high prices, then sell it cheaply to the urban population. This will both subsidize farmers and ensure the government can provide inexpensive rations to promote urban industrial production. Unsurprisingly, adopting such a policy will inevitably burden government finances with further enormous subsidy pressure. "
 KOR_pnr_puppet.43.a: "Perhaps we truly do need to adjust our policy. "
 KOR_pnr_puppet.43.b: "Once they are fed, they begin cursing us? "
 KOR_pnr_puppet.44.t: "Chaos Spreads"
 KOR_pnr_puppet.44.desc: "As the Japanese flag that had hung over this land for decades was lowered and the Taegeukgi rose once more, [KOR.GetName] proclaimed its national restoration. The various factions, along with purely jubilant [KOR.GetAdjective] citizens, organized their own marching columns, and when several columns met, they embraced one another and merged into a greater stream of humanity. But not everything in the parades was good, when Yeom Dong-jin’s White Shirts Society column encountered members of the People’s Party, they demanded that the latter lower the flag of the Phalanstère International and raise only the national flag; youth organizations and the Provisional Government’s column shoved one another after someone shouted that henceforth all power belonged to the Provisional Government returning from overseas. \n\nWhen the police appeared to maintain order——because the Japanese defeat came so rapidly, many were still wearing uniforms from the colonial government——anger erupted within the marching columns. Near Garibong-dong, a security vehicle attempting to pass through the crowd accidentally struck down a young boy, becoming the source of the chaos. The crowd demanded that the police surrender the driver, beat officers maintaining order, and attempted to seize their sidearms, until warning shots rang out and the parade quickly became a chaotic stampede. \n\nLater, the gunfire had already become a rumor that “Japanese lackeys shot Koreans”, and conflict between the public and police spread rapidly. Improvised barricades facing one another appeared in the streets. Several Restoration Army units received contradictory orders: some officers demanded immediate protection of police stations and government offices, while left-wing soldiers simply refused to deploy, and even disarmed several police officers in the street. Other units chose to watch from the sidelines, announcing they would obey no one’s orders until the truth was established. \n\nThe Provisional Government used radio broadcasts to accuse syndicalists and socialists of planning the uprising, while left-wing officers declared it a conspiracy jointly orchestrated by police and the right wing. Every faction demands that we immediately recognize it as the legitimate government of [KOR.GetName]. "
 KOR_pnr_puppet.44.a: "A crowd that can share hardship, but not prosperity. "
 KOR_pnr_puppet.47.t: "[KOR.GetName] Has Defied Us"
 KOR_pnr_puppet.47.desc: "[KOR.GetName] has rejected our “advice”, stating that it will uphold the consensus of the First Jeungsan Conference. Whether motivated by simple arrogance or a nationalist position, our moderate intervention has failed. Nor will this be the last time they act in defiance of our will. "
 KOR_pnr_puppet.47.a: "This is diplomacy. "
 KOR_pnr_puppet.51.t: "The Tiger Breaks Its Reins"
 KOR_pnr_puppet.51.desc: "Over these years, we carried out comprehensive reconstruction and intervention across the Korean Peninsula, intending to restore Korea’s economic condition and political system, and attempting to support an ally capable of providing us with various long-term benefits——yet today, it seems this objective has failed. \n\nAlthough our intentions were benevolent, and through the New Korea Company we implemented various local policies benefiting the common development of Korea and our own country, these people appear not to regard them as favors, but as oppression. The Korean people demand either the abolition of the New Korea Company, or that Korea receive the share of benefits that should belong to them. Because of stereotypes and misunderstandings, these citizens unfortunately interpret us as another Japanese government in a new guise, imperialists in East Asia. \n\nToday, we received a message from [KOR.GetLeader], who announced that he represented the will of the domestic public and would terminate the “unequal national relationship” between us and them. This means even the government we supported is no longer under our control——perhaps we can only accept this outcome, or perhaps we should give the mob what it wants, but that would unquestionably signify weakness and strengthen their arrogance. "
 KOR_pnr_puppet.51.a: "The die is cast. "
 KOR_pnr_puppet.51.b: "We.... choose to reorganize the New Korea Company. "
