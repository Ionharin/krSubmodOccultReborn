 JAP_pnr_cardgame_category: "The Black Gold Contract"
 JAP_pnr_cardgame_category_desc: "\n§YI Have Too Many Cards in My Hand...§!\n\n§2“The Young Officers may support me, but they have no respect whatsoever for my true intentions. They make things up and advance all manner of extreme arguments. I do not even play mahjong, yet they claim that I do. I only play bridge. I have never played mahjong.”§! — Hirohito, complaining to Tajima Michiji\n\nEver since we began providing financial support to the Fengtian Government, the South Manchuria Railway's Resource Exploration Department has been searching the region for untapped strategic resources. This time, however, the vast oil field they have discovered in the Qiqihar region dwarfs the sum total of all their previous finds, and will undoubtedly alter the balance of power in the Far East forever. The discovery has already had a direct impact on our strategic calculations, forcing us to reconsider our continental policy from the ground up.\n\nFortunately, neither Fengtian nor Russia appears to have realized that we have struck a veritable gold mine. By publicly claiming that we have discovered only a medium-sized oil reserve, we have managed to deceive their observers for the time being. As time passes, however, they are certain to uncover the truth...\n\nFaced with this sudden source of immense wealth, the South Manchuria Railway, the Ministry of Finance, the zaibatsu, and Kwantung Army Headquarters have all put forward their own proposals and plans for the oil field. Our task is therefore to determine the proper course of action each turn: advancing the §ODevelopment and Exploration§! of the oil field and strengthening our control over the Qiqihar reserves, while doing everything possible to keep the §tSuspicion§! of Zhang Zuolin's Fengtian Government and Russia to the north in check."
 JAP_pnr_cardgame_title: "The Black Gold Contract"
 JAP_pnr_cardgame_active: "We have not yet determined the reserves of the Qiqihar oilfield"
 JAP_pnr_cardgame_finished: "The new status of the Fengtian government has been determined"
 JAP_pnr_cardgame_no_kwantung_cards: "We have adopted the No Trump"
 JAP_pnr_cardgame_start_decision: "Begin the Black Gold Contract"
 JAP_pnr_cardgame_start_decision_desc: "Begin the policy-card minigame for northern Manchurian oil interests.\n\nEach round refreshes your hand. You may play up to §Y2§! cards, then use \"Confirm This Round's Policy\" to proceed."
 JAP_pnr_cardgame_round_timer: "Bidding Round Deadline"
 JAP_pnr_cardgame_round_timer_desc: "If this round's policy is not confirmed, the situation will resolve itself after §Y40 days§!."
 JAP_pnr_cardgame_end_round_decision: "Confirm This Round's Policy"
 JAP_pnr_cardgame_end_round_decision_desc: "End the current bidding round, resolve the current situation, and advance oilfield development."

 JAP_pnr_cardgame_oil_development_label: "Oil Development"
 JAP_pnr_cardgame_oil_development_value: "§B[?JAP_pnr_cardgame_oil_development|0]§!"
 JAP_pnr_cardgame_oil_development_tt: "§YOil Development§!\nCurrent: [?JAP_pnr_cardgame_oil_development|0] / 100\nAt §Y100§!, the Black Gold Contract will be resolved."
 JAP_pnr_cardgame_japan_control_label: "Japanese Control"
 JAP_pnr_cardgame_japan_control_value: "§B[?JAP_pnr_cardgame_japan_control|0]§!"
 JAP_pnr_cardgame_japan_control_tt: "§YJapanese Control§!\nCurrent: [?JAP_pnr_cardgame_japan_control|0] / 100\nFinal rewards are mainly determined by Japanese Control."
 JAP_pnr_cardgame_fengtian_alarm_label: "Fengtian Suspicion"
 JAP_pnr_cardgame_fengtian_alarm_value: "§R[?JAP_pnr_cardgame_fengtian_alarm|0]§!"
 JAP_pnr_cardgame_fengtian_alarm_tt: "§YFengtian Suspicion§!\nCurrent: [?JAP_pnr_cardgame_fengtian_alarm|0] / 100\nAt 100, a Fengtian oil crisis will trigger."
 JAP_pnr_cardgame_russian_alarm_label: "Russian Suspicion"
 JAP_pnr_cardgame_russian_alarm_value: "§R[?JAP_pnr_cardgame_russian_alarm|0]§!"
 JAP_pnr_cardgame_russian_alarm_tt: "§YRussian Suspicion§!\nCurrent: [?JAP_pnr_cardgame_russian_alarm|0] / 100\nAt 100, a northern Manchurian diplomatic crisis will trigger."
 JAP_pnr_cardgame_hand_tt: "§YHand§!\nYou may play up to §Y2§! policy cards this round.\nPlayed this round: [?JAP_pnr_cardgame_cards_played_this_round|0] / 2"
 JAP_pnr_cardgame_deck_tt: "§YDeck§!\nEach round refreshes 4 cards from 8 policy card types. Cards cannot repeat within the same hand."
 JAP_pnr_cardgame_round_exchange_tt: "§YCommunity Cards§!\nOnce each bidding round, you may take two random cards you do not currently hold from here, exchanging them for the top two cards in your hand."
 JAP_pnr_cardgame_round_exchange_used_tt: "§YCommunity Cards§!\nYou have already exchanged community cards once this round."
 JAP_pnr_cardgame_current_crisis_heading: "Current Situation"
 JAP_pnr_cardgame_current_crisis: "[JAPPNRCardgameCurrentCrisis]"
 JAP_pnr_cardgame_current_crisis_tt: "§Y[JAPPNRCardgameCurrentCrisis]§!"
 JAP_pnr_cardgame_current_crisis_desc: "[JAPPNRCardgameCurrentCrisisDesc]"
 JAP_pnr_cardgame_round_label: "Bidding Round [?JAP_pnr_cardgame_round|0]"
 JAP_pnr_cardgame_cards_played_label: "Policies: [?JAP_pnr_cardgame_cards_played_this_round|0] / 2"

 JAP_pnr_cardgame_crisis_none: "No Situation"
 JAP_pnr_cardgame_crisis_none_desc: "The Black Gold Contract has not begun."
 JAP_pnr_cardgame_crisis_1: "Fengtian Demands Dividends"
 JAP_pnr_cardgame_crisis_1_desc: "§GIf the oilfield was discovered on Fengtian soil, then surely we should develop it together, or at least receive some share of the profits.§!\n\nIf we do not play a Finance Ministry or zaibatsu card before this round ends, Japanese Control will §R-10§! at round end."
 JAP_pnr_cardgame_crisis_2: "Spies Enter Aihun"
 JAP_pnr_cardgame_crisis_2_desc: "§GHave you heard? The Japanese seem to have found a modest oilfield. Odd, though, their security looks nothing like what one would expect for a modest oilfield.§!\n\nIf we fail to resist the Russian spies this round, Russian Suspicion will §R+15§! at round end."
 JAP_pnr_cardgame_crisis_3: "Mantetsu Imports Advanced Equipment"
 JAP_pnr_cardgame_crisis_3_desc: "§GGerman imports, absolutely first-rate.§!\n\nMantetsu cards gain slightly better development and control rewards this round, but each Mantetsu card further increases Fengtian Suspicion."
 JAP_pnr_cardgame_crisis_4: "Oil Reserves Exceed Expectations"
 JAP_pnr_cardgame_crisis_4_desc: "§GThe Qiqihar oilfield's reserves are greater than we first predicted. Perhaps it can now supply the empire with three million more barrels of crude oil each year.§!\n\nOil Development is §G+5§! at the start of this round, but all actions taken this round cause Fengtian and Russian Suspicion to increase by an additional §R25%§!."
 JAP_pnr_cardgame_crisis_5: "Fengtian Demands Limits on Railway Security"
 JAP_pnr_cardgame_crisis_5_desc: "§GYou Japanese say there is an oilfield, then seal off the area and refuse to let anyone look. Now you are sending more and more men to guard the railways. Perhaps there is nothing there, and this is only an excuse to expand the garrison?§!\n\nIf a Kwantung Army card is played this round, Fengtian Suspicion §R+10§! at round end; otherwise Fengtian Suspicion §G-5§!."
 JAP_pnr_cardgame_crisis_6: "Russia Is Concerned About the Far East"
 JAP_pnr_cardgame_crisis_6_desc: "§GThere have recently been unusual Japanese troop movements within Fengtian. Officially, these deployments are intended to secure a newly discovered medium-sized oil field now under development—but surely a single oil field of such modest size cannot warrant reinforcements on this scale...§!\n\nKwantung Army cards cause an additional §R+10§! Russian Suspicion this round."

 JAP_pnr_cardgame_card_1_decision: "Continue Drilling"
 JAP_pnr_cardgame_card_1_decision_desc: "§YMantetsu Card§!\nOil Development §G+4§!\nJapanese Control §G+2§!\nFengtian Suspicion §R+4§!"
 JAP_pnr_cardgame_card_2_decision: "Request Help from Toyo Takushoku"
 JAP_pnr_cardgame_card_2_decision_desc: "§YMantetsu Card§!\nOil Development §G+3§!\nJapanese Control §G+6§!\nFengtian Suspicion §R+7§!\n\nIf the previous card was Continue Drilling, triggers §YPolicy Combination: Mantetsu Rush§!."
 JAP_pnr_cardgame_card_3_decision: "Promise Mining Dividends"
 JAP_pnr_cardgame_card_3_decision_desc: "§YFinance Ministry Card§!\nJapanese Control §R-2§!\nFengtian Suspicion §G-7§!\nCan handle §8Fengtian Demands Dividends§!."
 JAP_pnr_cardgame_card_4_decision: "Spread Confusing Rumours"
 JAP_pnr_cardgame_card_4_decision_desc: "§YFinance Ministry Card§!\nRussian Suspicion §G-7§!\nKwantung Army cards cannot be played for the rest of this round.\nCan handle §8Spies Enter Aihun§!."
 JAP_pnr_cardgame_card_5_decision: "Zaibatsu Cooperative Aid"
 JAP_pnr_cardgame_card_5_decision_desc: "§YZaibatsu Card§!\nOil Development §G+4§!\nJapanese Control §G+1§!\nCan handle §8Fengtian Demands Dividends§!."
 JAP_pnr_cardgame_card_6_decision: "Long-Term Oil Purchase Contract"
 JAP_pnr_cardgame_card_6_decision_desc: "§YZaibatsu Card§!\nOil Development §G+2§!\nJapanese Control §G+4§!\nFengtian Suspicion §G-3§!\nCan handle §8Fengtian Demands Dividends§!.\n\nIf the previous card was Promise Mining Dividends, triggers §YPolicy Combination: Japan-Fengtian Cooperation§!."
 JAP_pnr_cardgame_card_7_decision: "Strengthen Railway Security"
 JAP_pnr_cardgame_card_7_decision_desc: "§YKwantung Army Card§!\nJapanese Control §G+6§!\nFengtian Suspicion §R+5§!\nRussian Suspicion §R+3§!"
 JAP_pnr_cardgame_card_8_decision: "Protect the Lifeline"
 JAP_pnr_cardgame_card_8_decision_desc: "§YKwantung Army Card§!\nOil Development §G+1§!\nJapanese Control §G+8§!\nFengtian Suspicion §R+7§!\nRussian Suspicion §R+5§!\n\nIf the previous card was Strengthen Railway Security, triggers §YDouble: Fait Accompli§!."

 JAP_pnr_cardgame_combo_fengtian_cooperation_tt: "§YPolicy Combination: Japan-Fengtian Cooperation§!\nFengtian Suspicion additionally §G-3§!, and the next Mantetsu card causes §G50%§! less Fengtian Suspicion."
 JAP_pnr_cardgame_combo_integration_tt: "§YPolicy Combination: Mantetsu Rush§!\nOil Development additionally §G+1§!, Japanese Control additionally §G+2§!."
 JAP_pnr_cardgame_combo_fait_accompli_tt: "§YDouble: Fait Accompli§!\nJapanese Control additionally §G+4§!, Fengtian Suspicion additionally §R+3§!, Russian Suspicion additionally §R+2§!."
 JAP_pnr_cardgame_joint_pressure_tt: "§RJoint Fengtian-Russian Pressure§!\nBoth Fengtian and Russian alarm are high. Japanese Control additionally §R-2§! this round."
 JAP_pnr_cardgame_fengtian_crisis_tt: "§RFengtian Oil Crisis§!\nJapanese Control §R-25§!, Fengtian Suspicion is reduced to §Y50§!."
 JAP_pnr_cardgame_russian_crisis_tt: "§RNorthern Manchurian Diplomatic Crisis§!\nJapanese Control §R-15§!, Russian Suspicion is reduced to §Y50§!."
 JAP_pnr_cardgame_result_down_tt: "§YDown: Costly Compromise§!\nGain §G10§! Political Power."
 JAP_pnr_cardgame_result_made_tt: "§YContract Made: Black Gold Secured§!\nGain §G25§! Political Power."
 JAP_pnr_cardgame_result_game_tt: "§YGame: The Empire's Black Gold§!\nGain §G50§! Political Power."
 JAP_pnr_cardgame_result_slam_tt: "§YSlam: The North Manchurian Contract§!\nGain §G75§! Political Power."
 JAP_pnr_cardgame_result_down: "Down: Costly Compromise"
 JAP_pnr_cardgame_result_made: "Contract Made: Black Gold Secured"
 JAP_pnr_cardgame_result_game: "Game: The Empire's Black Gold"
 JAP_pnr_cardgame_result_slam: "Slam: The North Manchurian Contract"
 JAP_pnr_cardgame_flowing_black_wealth_modifier: "Flowing Black Wealth"
 JAP_pnr_cardgame_flowing_black_wealth_modifier_desc: "The oilfield discovered in this region has been fully surveyed, and its reserves exceed anything anyone had imagined."
 JAP_pnr_cardgame_events.2.t: "The Black Gold Contract Completed"
 JAP_pnr_cardgame_events.2.d: "Development of the northern Manchurian oilfields has reached production. Japanese Control: [?JAP_pnr_cardgame_japan_control|0].\n\n[JAPPNRCardgameResult]"
 JAP_pnr_cardgame_events.2.a: "The contract is made."
