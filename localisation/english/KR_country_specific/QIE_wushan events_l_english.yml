l_english:
  QIE_ws_god_circle_events.1.t: "Zhisheng Xiantian"
  QIE_ws_god_circle_events.1.desc: "The Lu zu Pavilion on Banbi Street in the northern part of Beijing was built in the early Qing. In 1920, when three members of the Wushan Society came to Beijing from Henan seeking financial aid, it was Jiang Chaozong who purchased this plot of land for them as a base of activity for the Wushan Society. Later, after the Wushan Society reorganized itself as the New Religion of Salvation, they still handled internal affairs here.\n\nSince the Xuantong Restoration, the emergence of the Harmonious Associations, and the Qing government's establishment of a parliament, public opinion has largely been controlled by progressive intellectuals and the new-style press. The New Religion of Salvation has therefore tried to keep a low profile, lest society attack its occult and superstitious practice——“spirit-writing”. These activities retreated into an even more secretive state inside the Lu zu Pavilion, to the point that its gates have not been opened to outsiders for many years.\n\nThe New Religion of Salvation received the <True Scripture of Taiyi North Pole> from the one and only supreme god between Heaven and Earth——the Most Holy Xiantian Taiyi Patriarch. This scripture is the origin scripture of every religion in the world, and upon it are the five seals bestowed by the founders of Confucianism, Buddhism, Taoism, Christianity, and Islam, proving that its contents are true beyond doubt. Yet times have changed. Since the sect has already taken control of the North China Government, there is no longer any need to hide its conduct. Today, the Lu zu Pavilion, whose gates had long been shut, has opened its hall doors once more. Incense curls through the air, and the sound of scripture recitation never ceases. Ordinary believers of the New Religion of Salvation stream out, satchels slung across their shoulders and leaflets in hand, preaching to the people of Beijing the virtue of the five religious founders and the dignity of the Taiyi Patriarch. They call upon people to quickly turn their hearts back, do more good deeds, and convert to the New Religion of Salvation.\n\n“At this time when culture declines, discipline collapses, humanity is ravaged, and people's livelihood is doubly afflicted, our religion arises in response to the times, drawing upon the essence of Confucianism, Buddhism, Taoism, Christianity, and Islam. These five religions are all drawn in and assimilated, so as to attain the great unity of religion. Thus can all nations and peoples under Heaven be brought beneath the single great order of one religion.” As the members shouted this, they stuffed leaflets into the hands of everyone they saw.\n\nWherever members of the New Religion of Salvation preached, one or two military policemen were there to maintain order. Under the intimidation of the military police, people did not dare refuse the leaflets, but whether they can accept this form of religion will still require a period of observation……"
  QIE_ws_god_circle_events.1.a: "Respect the Tao and honor the Te."
  QIE_ws_god_circle_events.1.b: "Please tell me more (about the special mechanic)."
  QIE_ws_god_circle_events.2.t: "The Fall of the Three Capitals"
  QIE_ws_god_circle_events.2.desc: "“Ladies and gentlemen, ladies and gentlemen, whether you brew liquor or tend the fields, teach school or heal the sick, shave heads or scrub backs, sell oil or hawk candy, please trouble yourself to listen to what I have to say! ”\n\n“Do not look down on a beggar hanging his head, for begging is not among the lowest trades. I have read books and given lectures, I know the Three Bonds and Five Constants. Leave aside Emperors Yao and Shun for now, let us talk about how the Republic perished. Even the Mongol Yuan was a barbarian dynasty, yet it still knew to honor Confucius and revere Mencius；the Great Ming took possession of the realm, set up schools in Yingtian Prefecture, and gave special lectures on the <Great Learning> and the <Doctrine of the Mean>, never slighting the sages' classics；though the Qing emperors were descendants of the Manchus, they too did not forget to honor rites and value the classics.”\n\n“Now just look what happened, let us speak of after the Republic was founded: the rites collapsed like the sea overturning, they feared not Heaven and cherished no virtue, thinking only of politics, law, and science；men promoted common wives and women many husbands, the teachings of reputation were swept away and Mount Tai snapped. Presidents changed one after another, none long in office, all meeting disaster. The final kalpa will come, the final kalpa has arrived, above there is no Way, below there is no law；only by restoring the Duke Yansheng to his place, by the great classics and great law, can the world's ills be saved——I have been preaching this lesson for quite a while, boss, you ought to give me a little. If you want to economize, economize in big things, save ten qing plus eight qing；if you want to calculate, calculate in big sums, count ten thousand plus eighty thousand. If you truly say your purse is tight, then two copper coins will still count as a bond of fate! ”"
  QIE_ws_god_circle_events.2.a: "Reward him two cents to buy a steamed bun."
  QIE_ws_god_circle_events.3.t: "The Village Worthy"
  QIE_ws_god_circle_events.3.desc: "As more and more oracles from Confucius emerge from the Lu zu Pavilion, these oracles seem likely to spread throughout the whole North——and of course that includes Shandong. Rumor has it that Kong Decheng, the current Duke Yansheng of the Confucius Mansion in Qufu, privately criticized Beijing after seeing the so-called “brush descent of Confucius”；others say the young Kong Decheng flew into a rage and smashed many things in the mansion. But these are only rumors. In public, the Confucius Mansion has been surprisingly silent about all this. They have even sent two people to Beijing to attend this spirit-writing séance of Confucius.\n\nApart from them and several government officials, most of those present are onlookers. Now Confucius begins to speak. The spirit-writer trembles the planchette brush, its strokes twisting like dragons and snakes across the sand tray, while the person beside him responsible for recording and copying writes with equal speed. In no time, the spirit words are written down. The official presiding over the séance pushes up his glasses and begins reading the characters recorded: “The ancient Way is far away；I was born to seek it, yet it is as ravines and hills to Mount Tai, as standing water to the great sea. In learning, I have grown old and not ceased；what I say merely transmits the ancient sages, and I dare not create anything.” He pushes up his glasses again and continues reading on behalf of Confucius, this ancient sage, in words that everyone half understands and half does not. Fortunately, another official is responsible for putting these words into language everyone can understand.\n\n“The Taiyi Patriarch whom I revere inherits the purpose of Xuanzhen and has sent the New Religion of Salvation to expound a true scripture. The <Great Learning> and the <Doctrine of the Mean> are no more than annotations to this scripture. It is only that people of the world have failed to probe deeply. But even if you do not understand the annotations, do not worry. Today I tell you the essence of Confucianism: it lies wholly in the four words ‘honor the king and expel the barbarians’. The king means rites and morality, the state and the teaching of the former worthies；the barbarian means heterodox doctrine. Even if it is born in China, any thought that departs from the state's teachings and destroys the order of rites and righteousness is also barbarian. Grasp this, and you can become a person of virtue.”\n\nWhen the sermon is finished, the official accompanying the people from the Confucius Mansion bends slightly and turns his head toward the two of them, as if seeking some response."
  QIE_ws_god_circle_events.3.a: "Yes, yes, Confucius is right."
  QIE_ws_god_circle_events.4.t: "Converting the Barbarians"
  QIE_ws_god_circle_events.4.desc: "These past months there has been quite a new atmosphere in Beijing. Temples and monasteries inside and outside the city are whitewashing walls and repairing halls；one place sets up a scripture-lecture altar, another holds a prayer and exorcism assembly. Some are pleased to see it, saying it is a sign of the national spirit reviving. But seeing it, I cannot help but say something disappointing: this is not the revival of the national spirit, but the relapse of the national disease. Last year when I examined the <Declarations of the Perfected>, I made one point: many Daoist scriptures are mostly things cobbled together. It steals and piles things into a great warehouse, then hangs up a signboard with the word “Dao”, and calls itself China's native religion. When I called it “stolen goods”, I was not cursing anyone；I was pointing out that its origins are unclear and its accounts are muddled. If certain people in Beijing now still want to bring out this warehouse of old goods and open shop, then one must first ask: have these goods ever been inventoried? \n\nSome say: this religion now also does charity, giving porridge, giving coffins, relieving the poor；why attack it wholesale? I do not oppose giving porridge, nor do I oppose relieving the poor. But if charity relies on divine authority as its signboard, it easily becomes another kind of business. Today it gives a bowl of porridge, tomorrow it urges people to donate a stick of incense；today it gives out a coffin, tomorrow it tells people to believe that the City God, Dongyue, and the Ten Kings of Hell are all keeping accounts there. This kind of charity uses human poverty to maintain human superstition. Real charity makes the poor suffer less poverty；false charity makes the poor, after suffering poverty, still thank the gods.\n\nBeijing in particular must not lightly speak of religious revival. Beijing is where universities, libraries, research institutes, and newspapers gather；it ought to set the whole country an example of rational life.\n\nIf the youth of the old capital still believe spirit-writing can inquire into state affairs, and merchants still believe talismans can protect business, then although Beijing's city walls are ancient, its brains are inevitably too old. What China needs most today is not more immortals, but more common sense；not more celestial venerables and precious proclamations, but more scientific education. If a nation truly wants to save itself, the first step is daring to bring out its old goods and inspect them. Keep the good, discard the bad.\n\nI would like to advise Beijing's youth: do not fear being called disrespectful to your ancestors. If we treat ghost stories as national essence, that is the true insult to our ancestors；if we dare to recognize ghost stories as ghost stories, stolen goods as stolen goods, return scholarship to scholarship, and drive faith out of the marketplace of deception, that is the way to open a path of life for Chinese culture."
  QIE_ws_god_circle_events.4.a: "Why defend old religion and abandon new civilization? "
  QIE_ws_god_circle_events.5.t: "None Know Its End"
  QIE_ws_god_circle_events.5.desc: "Dr. Hu has recently written another essay, again repeating his old claim that many Daoist books are “stolen goods”, and using this to satirize the recent tide of religious revival in Beijing. His prose is certainly brisk, his metaphors certainly novel, yet on careful reading it is still nothing more than the same method used by new-school scholars for more than ten years: whatever China possesses is first suspected of being false；whatever the people believe is first denounced as foolish；whatever can maintain human relations and settle people's hearts is all swept into the two words “superstition” and cleared away.\n\nMr. Hu turns “complex origins” into “unclear provenance”, and “harmonizing many teachings” into “theft and patchwork”. This is the rhetoric beloved by pettifoggers. Suppose a family is poor and weak, has managed its affairs for generations, and possesses both ancestral property and utensils obtained through marriages and exchanges. If a gentleman in Western dress suddenly stands at the door and points, saying: this table resembles the neighbor's style, this chair resembles another province's craft, this lamp resembles something imported from overseas, therefore this whole household consists of stolen goods. Is there any judge under Heaven who would decide a case in this way? \n\nEven stranger, Mr. Hu on one hand denounces religion as “old goods of national essence”, while on the other compares it to opium and footbinding. Opium harms the body, footbinding injures the limbs, and both have obvious harms；but revering Heaven and honoring ancestors, respecting teachers and valuing the Dao, urging people to do good, and warning people against violating human relations——where is their harm? \n\nMr. Hu believes everything can be handed over to schools and hospitals. These are indeed institutions modern systems ought to have；yet beyond institutions, faith is still needed to maintain their foundation. A school without faith only produces frivolous men；a hospital without morality only becomes a marketplace.\n\nMr. Hu also denounces spirit-writing as demonic delusion. We need not defend every spirit message woodenly, nor need we say every descending brush-stroke is formed word by word by Heaven. Yet since ancient times, when sages established teachings, whether through allegory, images and numbers, or rites and music, all were meant to stir the conscience of ignorant men and women. When Confucius edited the Poetry and Documents, he did not refuse folk songs；when Buddhism speaks of karma, it does not refuse to borrow Heaven and Hell；when the Western religion preaches the Gospel, it too has miracles and sacred events to move listeners. Only when it comes to the spirit-writing familiar to the Chinese masses does Mr. Hu insist on eliminating it before he is satisfied. This is not love of truth, but only love of his own set of new terms. We are not saying all old things are good, nor that religion has no abuses. Temple managers cheating money, sorcerers confusing the masses, itinerant talismans and magic water——all should be strictly banned. But if, like Mr. Hu, one first denounces the sacred ancestors as thieves, then scolds folk believers as fools, then styles oneself a judge of civilization and with one stroke of the pen sentences China's native religions to the wastepaper basket, how can that be accepted? \n\nI wish to advise Mr. Hu and all new-school scholars: a little less frivolity, a little more compassion；a little less mockery, a little more responsibility. China today does not lack clever people；it is precisely that there are too many clever people and too few sincere and steady ones. If the New Religion of Salvation can gather hearts with the meaning of the five religions, relieve suffering through charity, and reorder society with the bonds of rites, then its merits and faults will naturally be judged by all under Heaven and by later generations. Newspaper prose may stir the crowd for a moment, sharp satire may win youths' applause, yet the lifeblood of the nation does not depend on a few pretty vernacular sentences, but on whether the multitudes still know Heaven and Earth, ancestors, state, and human relations. Destroying the Dao is easy；establishing the Dao is hard. If Mr. Hu wishes to be a destroyer of the Dao, then we dare not agree."
  QIE_ws_god_circle_events.5.a: "Dr. Hu destroys our pearls and jade while praising others' tiles and rubble；his heart deserves condemnation."
  QIE_ws_god_circle_events.6.t: "The Questions of King Milinda"
  QIE_ws_god_circle_events.6.desc: "Even though the New Religion of Salvation has gained almost the status of a state religion, many traditional believers still want to challenge it in defense of themselves——which is why this lecture platform has been set up outside the Lu zu Pavilion today.\n\nSeated on the right side of the platform is a monk from Juesheng Temple. Debating him is Master Xianming of Guangji Temple. In 1935, when Guangji Temple caught fire, it was the New Religion of Salvation that remitted a large sum for repairs. Now Master Xianming's willingness to come here to preach and debate also carries, to some degree, the meaning of saying a few fair words for an old kindness.\n\nThe debate begins with the most basic matter: what is the self? What is the state? The monk from Juesheng Temple argues that the New Religion of Salvation confuses the two, while Master Xianming points out that “our state is one body”: the self is merely the temporary gathering of the five aggregates, and the state is also the combination of many conditions. To cling to this body as a real self is certainly delusion；to cling to the names and forms of one time and place as an eternal state is likewise delusion. The state spoken of by the New Religion of Salvation is the land temporarily formed from the common karma of sentient beings, the order of rites and law, and the work of salvation from the kalpa.\n\nSomeone then asks: though the New Religion of Salvation speaks of disaster relief, people still suffer every moment；how can this be goodness? Master Xianming answers that relieving suffering cannot be exhausted in one day, nor by one method. If, because one person still suffers, one declares all relief to be false, then no good deed in the world could stand. The New Religion of Salvation today gives porridge, provides work relief, and urges people to cultivate virtue. Though it cannot suddenly extinguish all suffering under Heaven, it is nevertheless a feasible expedient method.\n\nAnother asks why disaster relief must be carried out through the New Religion of Salvation. The answer is that sentient beings are lost, each clinging to one extreme. Confucians cling to the teaching of names, Daoists to purity and stillness, Buddhists to liberation, and Christians and Muslims each keep to their own gates. If the five religions each govern themselves separately, then though there may be much goodwill, it will ultimately be hard to turn it into strength. Today the New Religion of Salvation uses the meaning of the confluence of the five religions to give relief work order and discipline.\n\nAfter several exchanges, the two sides are hard to separate. But Master Xianming's defense has undoubtedly moved some wavering figures in the religious world to support us."
  QIE_ws_god_circle_events.6.a: "Venerable sir, I shall debate with the words of a wise man, not a king."
  QIE_ws_god_circle_events.7.t: "Devadatta"
  QIE_ws_god_circle_events.7.desc: "“Today the Three Western Sages have descended by phoenix-writing. Dipamkara, Cundi, and Amitabha have all arrived at the altar. All in the congregation who seek answers, step forward and line up on the left! ” Inside the Lu zu Pavilion, the member maintaining order shouted out the names of the deities who had descended upon today's spirit altar. From the crowd, those who were not merely there to watch but truly had requests squeezed out and made their way to the left to wait in line.\n\nThe spirit-writer holding the brush today stood on the right side of the sand tray. His eyes were open, and he had not entered any so-called trance of “possession”；he simply swept the brush across the sand tray at great speed. Everyone who had a request of the deities, when their turn came, first had to kneel on the cushion before the altar and kowtow nine times, then offer the deities a gift of incense and flowers, state what they sought, kowtow nine more times, and go to the end of the line. Later, the reader responsible for announcing the spirit words would read out the first line of the oracle, which would certainly contain the corresponding person's name. After hearing their name, they too had to kowtow nine more times before receiving the spirit words.\n\nThe short woman standing in the middle of the line went to the cushion and kowtowed nine times, then took out a few well-handled coins as money for incense and flowers: “What I seek concerns my son. Last week, after eating grass carp, he suffered belly pain, and in the end he died in pain. He has already been buried. I want to ask Amitabha whether you received and led him away, or whether he has already reincarnated.” Having asked her question, she kowtowed again according to the rules and returned to the end of the line.\n\n“Zhang Yaomei receives Cundi's oracle! ” Trembling, she ran out of the line again and worked hard to knock her head nine times.\n\n“Pitiful loving mother with a heart like tender grass, tears fall in the dust as she asks old causes. This child in his former life made much karma, with nets in rivers and lakes harming scaly lives. Since killing intent was heavy, today's suffering was formed；old debts are nearly gone, yet dust remains. He must still turn several times in the human world, and one day the lotus throne may receive his body. If you wish to swiftly repay the fruit of former lives, you must buy ten fish and present them. Nine return to rivers and seas, following the waves；one is offered before the altar to prove old causes. You may also keep a long vegetarian fast and cultivate good thoughts, repenting on your son's behalf to cleanse wronged kin. With a sincere heart, the ferry of compassion will come；in the Western Land the lotus opens to guide the old acquaintance.”\n\nOnce the oracle had been announced, Zhang Yaomei gave the reader a few coins as a thank-you fee, then tottered away on her bound feet to buy fish."
  QIE_ws_god_circle_events.7.a: "With the self already fixed within me, I make a great vow: to serve the great undertaking, save all beings in the heavens, and lead them together out of the dusty wheel."
  QIE_ws_god_circle_events.8.t: "City of Samaria"
  QIE_ws_god_circle_events.8.desc: "“You must imagine such a scene, ” Michonne said, reclining on the bench, “before you even enter the city, you are surrounded by a crowd of Chinese. They crawl up, kneel before you, hold up hands stained with dried mud and whatever else, and say to you: ”\n\n“‘Great Bodhisattva, please show mercy! ’ The bodhisattva they speak of is a merciful deity believed in by the Chinese, and what they ask of you is only some food, not money. Others came to the office or the cathedral and told every foreigner they saw that they wished to return to Christ. This was the China I experienced in 1921.”\n\n“In my view, these Chinese seeking conversion were only rice Christians. They came for benefits, not because they had been called.” That was my answer to him.\n\nMichonne only smiled, then continued: “Now let us look at the situation in 1936. As you know, a native Chinese religion now controls the Beijing Government. Outside the city, they set up cauldrons and sheds, just as we have done many times, and begin relieving those who suffer.”\n\n“What is more different is that they declare themselves to have authority and to be able to perform wonders. These foods were bestowed upon them by Jesus Christ, and if those people believe in their new religion——a religion with Chinese characteristics, in the style of a Roman pantheon——they can receive more rice and flour.”\n\n“That is to say, the government has not only assumed the function of social disaster relief, but also the function of missionizing. Please tell me, for what purpose does the government need these ‘rice Christians’ to convert to their native religion? What use are these Chinese, who come for benefit and for food, to their cause? ”"
  QIE_ws_god_circle_events.8.a: "Lord, do you want us to call fire down from Heaven and burn them up? "
  QIE_ws_god_circle_events.9.t: "Simon Who Worked Wonders"
  QIE_ws_god_circle_events.9.desc: "When speaking of Chinese immortals, everyone naturally knows many. But when speaking of foreign immortals, most people only heard of the foreigner's one during the Boxer year, and his son.\n\nToday, the son of the great foreign god descended upon the sand tray of the Lu zu Pavilion. This aroused the interest of many people, and they packed the Pavilion so tightly that not a drop could pass through.\n\nPreviously, the people of the New Religion of Salvation had said that this “Jesus” instructed the New Religion of Salvation, saying that the Taiyi Patriarch cherished life and had sent him to distribute rice and flour to everyone so they could pass through the crisis. A few days ago, Jesus again said that today he would announce other matters. Whoever came could receive rice and flour, even eggs and other novel foreign candles and matches. Everyone watched as the spirit-writer responsible for the séance shook his head and swayed, the brush in his hand shook and swayed, and the person responsible for copying the spirit words also shook and swayed with him. Whether Chinese or foreign, the general method of divine communication seems not much different.\n\nWhen the copying was finished, it was time to read. One man took the paper and began loudly reading foreign words. An official in charge of the séance explained that because Jesus was a foreign deity, he spoke in English. After he finished reading once, Jesus said on the spirit board that there were no omissions or errors, and only then was it proclaimed again in Chinese.\n\nThe general meaning of Jesus was that now the Xiantian Taiyi Patriarch was personally manifesting in the human world, transmitting scripture, pointing out delusion, and analyzing the mysterious principles of Xiantian. People of superior wisdom could use this to reach the highest realm；people of middling capacity could cultivate their virtue；even low and ignorant people could be released from suffering and know to return from their lost path. What he wished to reveal to the crowd today was life and death.\n\nSo-called life all comes from Xiantian, and Xiantian comes from the “mystery” where the Patriarch dwells. Whether becoming a sage or a Buddha, becoming a ghost or a jian, there is no second road. In the mysterious realm, lines intersect: those that intersect below are called the lower realm, that is, ordinary people；those that intersect above dwell in the upper Heaven, that is, heavenly beings. The most wicked sink into this endless lower intersection, unable to advance or retreat, unable to reach the heavenly realm above, unable to live or die below. Their suffering takes countless forms and cannot be described. For those obstinate in evil, the only means of liberation is to obey the command of the great master of Heaven and Earth, the Taiyi Patriarch. Those who do not obey the holy religion and holy decrees may well have no method left to save them.\n\nSince the sermon was finished, Jesus was also willing to answer questions for those who came to watch. Of course, he did not forget to have the people in Lu zu Pavilion distribute the promised rice and flour to the audience."
  QIE_ws_god_circle_events.9.a: "Give me this authority too, so that whoever I lay my hands upon may receive the Holy Spirit."
  QIE_ws_god_circle_events.10.t: "Ascending to the Firmament"
  QIE_ws_god_circle_events.10.desc: "At first, Ma Wenqing only wanted to take his family away from the northwest to avoid raids by Mongol bandits crossing the border. On the road east, they heard that Beijing had new rulers, and that the new rulers opened wide the door to the Hui people. To respect their faith, they had even set up special places for prayer. That was why they came to Beijing. But what was all this——\n\nInside the Lu zu Pavilion, amid curling incense and packed heads, the townspeople watched with curiosity the performance of these members of the “New Religion of Salvation”. They held a wooden frame, drawing back and forth on the sand tray, making an unsettling scraping sound. The drawing soon ended. They waited as the copyist beside them transcribed the contents from the sand tray onto paper；then several people together burned incense toward the sand tray in thanks, after which they began reading the contents: “I am the ancestor of Islam, Muhammad. All things in the world are trapped within a ring of one emptiness with no reality, no void and no being. The name of this ring is the Pure and True Lord, that is, the Taiyi Patriarch whom I worship. From him I have mastered many mysteries and truths concerning this world. The Taiyi Patriarch taught this wisdom to Laozi, Laozi taught it to Confucius, Confucius taught it to Shakyamuni, and Shakyamuni in turn transmitted it to me. Therefore, my Islam has, by relying on the Pure and True Lord, brought forth countless immortals and saints. All this depends entirely on the teachings of the Taiyi Patriarch. If you people also read, protect, or even place the scriptures in your homes, you will gain immense benefit and blessed recompense——”\n\nMa Wenqing could listen no longer. He only felt that he had been deceived by travelers on the road of flight east, which was why he had brought his family to this damned place."
  QIE_ws_god_circle_events.10.a: "This is not the one we know."
  QIE_ws_god_circle_events.11.t: "Dajjal"
  QIE_ws_god_circle_events.11.desc: "In the end, Ma Wenqing decided to leave Beijing. Whether he went eastward into the Legation Cities, or northward to Fengtian, anywhere was fine. There was an air in Beijing that made him unable to breathe.\n\nSome people, hearing that he was Hui, looked at him with envy mixed with jealousy. Everyone knew that the present Beijing Government, to display its tolerance toward the Hui——perhaps partly for other countries to see, and partly to reduce the northwest Ma family's dislike of it——had in fact issued many unwritten policies favoring the Hui. Earlier, someone had even asked him, saying they knew he was currently unemployed, whether he wanted to come to Yanjing Lu zu Pavilion to take a job that could put food in his mouth. Leaving aside how they knew where he lived, what his surname and given name were, and whether he had work, Ma Wenqing would never step into that place again.\n\nHe knew some of his fellow Hui living in Beijing had already accepted the goodwill of the present government, but as a Jahriyya follower he could not. All this was like a stone pressing on his chest, and only leaving this place could ease it. Yet the spirit altar of the New Religion of Salvation was not set up for one man. Even if he left, could all this be cancelled for him? \n\nToday, as usual, Muhammad descended by the brush to preach. The spirit-writing personnel speaking for the ancestor of Islam may have suffered some allergy；his right eye was swollen, though it did not affect his ability to look at the paper and read the spirit words. The ancestor first told the listening masses that the final kalpa was now approaching, and only by reversing society's decline could disaster be dissolved. He then said that although the present is the final kalpa, just as the Buddha said, if this final kalpa can be dissolved, it can be transformed into still greater blessed recompense. And the only method for dissolving disaster is to make human hearts return to rites and law, return to the <True Scripture> propagated by the Taiyi Patriarch.\n\nThe ancestor of Islam revealed that a very dense miasma of filth exists in the world, emitted by those who have abandoned morality, rites, and righteousness. So long as this evil qi can be reduced, no matter what method is used to reduce it, it can strengthen the righteous qi of the world, thereby realizing the realm of great unity among mankind. At this point, the contents revealed by the ancestor of Islam were considered finished."
  QIE_ws_god_circle_events.11.a: "What they call the Garden is in truth the Fire."
  QIE_ws_god_circle_events.12.t: "The Five Religions Spirit Altar"
  QIE_ws_god_circle_events.12.desc: "The Five Religions Spirit Altar system is located on the national focus tree page, and simulates the New Religion of Salvation's propagation of the five religions they worship (or rather, use) . Each religious founder has different attribute bonuses. By choosing one of the five founders, he will appear more frequently on the spirit altar, and his influence among the people will visibly increase over time. As influence rises, the attribute bonuses provided by that founder will also strengthen, and the New Religion of Salvation can unlock that founder's unique focuses.\n\nAfter completing a founder's final focus, the effect of the national spirit “The Throne of Lu Zu Chunyang” will be permanently strengthened, preserving part of the corresponding founder's attributes within it forever. In addition, if the bonus of the currently promoted founder has already been preserved in “The Throne of Lu Zu Chunyang”, then the corresponding bonus effect will receive a multiplicative enhancement according to the current spirit altar level.\n\nHowever, each time the founder is switched, the corresponding spirit altar level will begin accumulating again from zero."
  QIE_ws_god_circle_events.12.a: "I think I understand."
  QIE_ws_leader_stories_jiang_increase: "§CJiang Chaozong's political power has been §Rstrengthened§C! §!§!§!"
