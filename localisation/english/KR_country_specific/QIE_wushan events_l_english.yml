  QIE_ws_united.12.t: "A Living Immortal"
  QIE_ws_united.12.desc: "Ever since the New Religion of Salvation unified China, Lüzu Pavilion had become the liveliest religious temple in Beijing. After they announced that they would relinquish power and establish a democratic republican government, smoke from Lüzu Pavilion poured from the temple gate day and night without cease. People pressed shoulder to shoulder, one after another, all wanting to stuff their own health, descendants, and wealth into the sticks of incense sold in the temple for sixty cents, so that the New Religion of Salvation and Fuyou Emperor would remember them. The old woman squeezed in at just this time. She was jostled by the crowd until she could barely stand, while her hand clutched tightly the three sticks of incense and two coins she had bought from the temple. Seeing that her legs and feet were inconvenient, the incense attendant responsible for watching over the offerings gave her a hand. When they passed the auspicious vat, the old woman muttered something under her breath while dropping the coins into it.\n\n“This way, you may worship here.” He pointed to an open space. The old woman knelt devoutly, raised the incense above her head, kowtowed nine times toward the statue of Lüzu inside the hall, then lit the incense and inserted it into the burner. Once she had finished this, she began looking all around, searching for something.\n\n“Are you asking for a divination lot, requesting a dharma-image photograph of the founders of the Five Religions, or seeking a spirit-writing consultation?” “None of that matters. I want to ask you something: where is the image of Qian Nengxun?”\n\n“Qian Nengxun?” “Yes. Is he not the religious leader of the New Religion of Salvation? Such a great figure should receive a few sticks of incense too.”\n\nThis put the incense attendant in some difficulty: “Old lady, Religious Leader Qian was the former Premier of the State Council. His photograph hangs in the government office building; it is not in the hall.” “You ought to hang it in the hall!” Her speech was slow, but very serious. “In life he served the people as premier, and after becoming an immortal in death, he commanded you to bring the whole realm together. Is that not great merit? Others all say he is already dead and has no use for power, so he gave power to a Good People Government, but good people are good people, and saviors are saviors. The world must always have a wise ruler. Religious Leader Qian is the wise ruler sent down by Heaven to set this chaotic age in order. The true savior of the Chinese people is not written into being by newspapers; he is appointed by Heaven. If people do not worship such a good immortal, can they still be considered human?”\n\nThe incense attendant did not know what to say. Not until the timekeeping bell rang did the fire in the incense burner grow fiercer, smoke rushing up toward the painted, peeling bracket sets, while the statue of Lü Dongbin still sat in the hall with lowered eyes."
  QIE_ws_united.12.a: "In life he bent himself to serve the people; after becoming an immortal, he still did not forget their suffering!"
  QIE_ws_united.13.t: "The Finest Future"
  QIE_ws_united.13.desc: "Inhale, exhale, inhale. Do not be nervous; you can do this. The car will soon reach the southern end of the Forbidden City, so relax——I once again look through the copied declaration for the ceremony in my hands. The copy Y. C. James Yen gave me earlier has already been worn out from my handling it. So I copied another one. There is an ink spot here; why did I not notice it when I copied it? Last night, all of Beijing was setting off firecrackers to celebrate today's ceremony, and even today there are still scattered people setting off crackers in the streets. No! This road is wrong! Why are we driving east?\n\n“Mr. Tang, have you forgotten? You said we would go to the post office building first.”\n\nRight, right, I forgot about that. Open the briefcase again and check. Good, the letters to be mailed to several Chinese medicine groups in Shanghai are all still here. Using such an old-fashioned method should better show the new government's sincerity toward the cause of Chinese medicine.\n\n“Mr. Tang, we have arrived at the Postal Administration.”\n\nThe postal worker with whom I had arranged things came forward to help open the door for me. I gripped the declaration in my hand, picked up my bag, and leaned forward, preparing to get out of the car. People truly grow old; even moving to get out of a car takes some effort.\n\n“Anyone who knows what's good for him, get out of the way!”\n\nSomeone close behind the worker shouted this. I looked up and saw three men: one wearing a black short jacket and trousers, the other two wearing black and gray long gowns. Probably some hooligans from somewhere, seeing a car and wanting to extort a sum. I am pressed for time. Where did I put the money?\n\n\n\nAs I was feeling for my wallet, someone, I do not know who, lit another firecracker congratulating the new government's founding. My heart suddenly tightened. Something taut snapped. It seemed I had no strength. My hands and feet would not work. I need to lie down, lie down. There is a seat behind me, so I will lie here."
  QIE_ws_united.13.a: "I am a little sleepy. What are you saying? I cannot hear clearly..."
  QIE_ws_united.14.t: "After the Gunshots"
  QIE_ws_united.14.desc: "The incident occurred in the morning, and by noon the news had spread throughout all of Beijing. Such a thing could not be concealed, so the ceremony had to be canceled as well.\n\nIn broad daylight, three thugs shot Dr. Tang Erhe, provisional chairman of New Beiyang, at the Beijing Post Office Building southeast of Tiananmen. The location of the incident was no more than three hundred meters from the place where the government founding ceremony was to be held. The three thugs were extremely brazen. One of them, holding a pistol, fired several shots and struck Tang Erhe. The staff of the post office building mistakenly believed that he had emptied his gun and rushed forward to arrest him. Unexpectedly, another man drew a shotgun and fired directly at the staff member, killing him on the spot; the third man pulled out a submachine gun and swept fire across the post office entrance, shaving about a foot of wood from the door of the manager's office. At this moment pedestrians fled, and the scene became chaotic. Seeing that their objective had been achieved, the shooters retreated together. Two of them fled east along Dongjiaomin Lane, while the pistol-wielder brought up the rear. Before leaving, he told passersby to get out of the way, then also blended into the crowd and escaped.\n\nTang Erhe has now been sent to Peking Union Medical College Hospital for emergency treatment, but it is feared there is no saving him.\n\nHe put down this urgent telegram and began changing clothes with a grave expression. He also called in the secretary who had been waiting outside: “Go confirm with several officers whether all their guns and men were at their posts this morning. Send urgent telegrams, and notify me immediately once you have news. Then you must go to the hospital,” he said while straightening his collar. “Also, I have been in the countryside of Hebei since last week.”\n\nThen, as if remembering something, he added another instruction:"
  QIE_ws_united.14.a: "Before I return, Tang Erhe cannot die."
  QIE_ws_united.14.tt: "§0The provisional committee of the New Beiyang Government is §Rfalling apart§0!§!§!§!"
  QIE_ws_united.15.t: "No “Murderer”"
  QIE_ws_united.15.desc: "Reporting to you: we have confirmed the movements of several officers and soldiers who had taken leave to rest during the ceremony, and they have all been cleared of suspicion of involvement in the shooting. The coroner removed five bullets from Tang Erhe's chest, and there were also several shell casings at the scene. After checking the headstamps of the casings, we confirmed that this was a batch of German-made pistol ammunition.\n\nBut we have made an even more puzzling discovery: the shotgun shells at the shooting scene came from the Châtellerault arms factory in the Vienne department of the Commune of France. We preliminarily suspect that the murderers obtained this batch of “all-nations” ammunition through illegal smuggling channels. The security organs and gendarmerie have gone separately to all major routes to inspect and search, but so far there has been no progress.\n\nAlso reporting to you: since the shooting occurred in the early morning, by evening foreign correspondents had already sent details of the shooting overseas. Now teahouses, hotels, and newspaper offices throughout the city are all discussing this matter, and rumors are flying everywhere. Some say it was done by old-style soldiers; some say it was done by political parties that previously cooperated with the New Religion of Salvation but were not selected for the Preparatory Committee, acting out of private vengeance; some say it was instigated by foreign forces; and still others claim that the three thugs had already been hiding in Beijing for many days.\n\nThere is one final piece of news.\n\n\n\n\n\n\n\nTang Erhe was in fact already suffering from late-stage lung cancer and did not have long to live."
  QIE_ws_united.15.a: "We are safe, but who did it?"
  QIE_ws_united.16.t: "A Desperate Gamble"
  QIE_ws_united.16.desc: "When the doctors at Union Hospital saw Tang Erhe, they already knew the outcome. Several bullets had entered between his chest and abdomen; two of the wounds were extremely close together, like two extra strokes added deliberately because the assassin feared this old man might live too long. As the nurses pushed the stretcher at a trot down the corridor, even the blood had already stopped dripping onto the floor. Before entering the operating room, he had already stopped breathing. But the doctors still had to perform resuscitation as a matter of procedure. First, they removed all the bullets, five in total. Then came the stethoscope, the syringes... several doctors stood around the operating table, their expressions so solemn it was as though this body still offered any ground worth contesting with the god of death.\n\nTwo hours later, after all the work that had to be done was finished, they covered his face with a white cloth and had the nurses push him outside, preparing to announce the death. But just as the nurses were pushing the body out, hurried footsteps sounded from the other end of the corridor.\n\n“[QIE.GetLeader] sent me. Have the bullets been removed? Where are they?” He wore a black overcoat, and the buttons at his cuffs had been left unfastened; it was clear he had come in great haste. After receiving the iron tray containing the bullets, he carefully put it into a bag and prepared to leave. Before departing, he lifted the white cloth.\n\n“Sir, do not do that.”\n\n“Please continue resuscitation.”\n\n“Sir, he has no heartbeat and no breathing. Massive blood loss——”\n\n“Continue resuscitation,” the government official said, glancing back at the doctor behind the nurse who was trying to explain the concept of “death” with medical knowledge. “Tang Erhe must not die until at least noon tomorrow. Then you may notify the coroner.”"
  QIE_ws_united.16.a: "I will report to Jiang Chaozong."
  QIE_ws_united.16.b: "I will report to Wu Peifu."
  QIE_ws_united.16.c: "I will report to Gong Xinzhan."
  QIE_ws_united.17.t: "The Fourteen Stations of the Cross"
  QIE_ws_united.17.desc: "Tang Erhe's death was finally made public. Although in people's hearts he did not possess any especially lofty prestige, most had at least heard stories about the “Good People Cabinet”. In any case, the passing of a good life can always draw people's tears, all the more when it was a good life that promised to bring democratic republicanism to China.\n\nPutting aside the condolences from intellectual circles for the moment, some of the people also poured into the streets, spontaneously holding memorials for Tang Erhe. But more people went to Lüzu Pavilion in Mingguang Hutong. They kowtowed before the deity on duty that day at the spirit-writing altar, asked questions, prayed, and said that Tang Erhe was a good man, hoping the immortals would help him become an immortal too, or at least let him be reborn into a good family in his next life.\n\nBut as for the New Beiyang Provisional Government, everyone's view was entirely different. How could there be any principle in this world by which blood is seen on the first day of opening, and the congratulatory firecrackers become the wailing of a funeral? In the end, the moment the New Religion of Salvation stepped down, chaos immediately arose under Heaven. The new government's foundation was unstable; its fate was not hard enough. It would be better to invite the New Religion of Salvation back to continue governing.\n\n————No, this was not said by members of the New Religion of Salvation. It was said by candy sellers, by merchants, by newspaper writers, by fathers of sons, by orphans who had grown up. It was these people who appeared in the streets, once again speaking words of the approaching final calamity and the threat not yet gone.\n\nJiang Chaozong rolled down the car window. He had already heard something of the situation in Beijing, but he had not expected what he would encounter head-on to be beyond his imagination: crowd after crowd of Beijing citizens. Because of the crowds, the car had no choice but to slow down. Some stood on tiptoe to look, some knelt on the ground, and some simply stood there quietly, silently watching Jiang Chaozong. Until a sorrowful voice cut through the silence, and the crowd stirred, some crying and some shouting, all pressing forward together to hold the car door, pound on the bodywork, and reach their hands toward Jiang Chaozong."
  QIE_ws_united.17.a: "Living immortal, redress the good man's grievance."
  QIE_ws_united.18.t: "A Conversation with a Dead Old Friend"
  QIE_ws_united.18.desc: "Gong Xinzhan sat in the meeting room. At the other end of the long table were Qian Nengxun's portrait and an incense burner. How long had it been since they moved in here? Gong Xinzhan scratched his back, then began to speak:\n\n“It is very noisy outside, and you are still smiling here,” he smacked his lips. “Everyone is saying Qian Nengxun is China's great savior, Qian Nengxun is a great immortal descended from Heaven. Great Immortal Qian, redress our grievance, redress Tang Erhe's grievance.” Having said this, he bent down, stretched both hands straight out, and pressed his head against the table, imitating the posture of kowtowing.\n\n“We do not want republican democracy. We want a wise ruler who can control everything. Immortal Qian, come back and continue ruling us.” He stood up and walked to the photograph.\n\n“You do not say a word. After all these years, I really thought you could speak. I still had expectations, Ganchen. In that case, I will take you outside to have a look.” Having said this, he held Qian Nengxun's photograph in both hands and walked out of the meeting room, then onto the street. Coming toward him were crowd after crowd of Beijing citizens, waiting anxiously outside the government offices. Some stood on tiptoe to look, some knelt on the ground, and some simply stood there quietly, silently watching the government gate.\n\nAt this moment Gong Xinzhan came out carrying the photograph. His steps were slow yet firm. He passed the military police maintaining order and walked into the middle of the crowd watching him, and the photograph in his hands. Then came a long silence, until a sorrowful voice cut through it. The crowd stirred, some crying and some shouting, all pressing forward together to hold this black-and-white photograph of the departed man, reaching their hands toward the person in the frame, as if he were watching this world and watching these people weep from the other side. This continued until the military police maintaining order at the gate of the Beijing government all stepped forward in unison, forcing the clamorous crowd back. Gong Xinzhan lowered his head, straightened the ribbon on Qian Nengxun's photograph, and then carefully studied the image of this old friend and colleague from earlier days:"
  QIE_ws_united.18.a: "Are you us? Are we you? No, we are them."
  QIE_ws_united.19.t: "Before the Broadcast"
  QIE_ws_united.19.desc: "By rights, the government has a responsibility to disclose to the people the results of the investigation into Tang Erhe's assassination. But the investigation team has not yet obtained any results. Some people who had privately hidden firearms were arrested, and even several syndicalists with radio transmitters were exposed in this great search, but after beatings and interrogation, all the evidence obtained from them proved that they were not the murderers. Where exactly did those three people go?\n\nThe lack of progress in the investigation is only one aspect. The other is who can represent the “government” in announcing this matter? Intellectuals instinctively detest obscurantism and criticize ignorance, but they are not a group of fools unable to read the direction of the wind. Everyone in this provisional government knows that results announced by any of them will not gain the public's acceptance. The only candidate is [QIE.GetLeader]. Because of this series of changes, the New Religion of Salvation, which had originally wanted to withdraw at the height of success, has once again been pushed to the front of the stage, and has become even more frightening than when it left——in the eyes of many people, the New Religion of Salvation is no longer merely a government, a government that unified the whole country. It is more a demon-suppressing pagoda, a temple protecting the nation. As long as it sits here in command, their peaceful and beautiful lives can continue, and they will not again taste turmoil. As for [QIE.GetLeader], who leads it, he is the living bodhisattva bestowed upon the people by Heaven, come to save them from suffering and calamity. At least, that is what they think.\n\nThere is still half an hour before the radio broadcast begins. [QIE.GetLeader] is savoring the experience of being surrounded by people on his way here. When did the roots of this seed sink so deep and grow so terrifyingly? A simple truth will probably be unable to soothe their pain, not to mention that the truth is not yet known. Directly saying “we do not know” would further destroy the image he now has in people's minds as an omniscient and omnipotent great man. He must maintain the New Religion of Salvation, maintain his own position in people's hearts; otherwise, once he falls from the summit, disappointment will turn into immense anger and tear this country apart. The nation needs a new symbol, a new enemy——thinking this, he once again took out the prepared speech draft and began to mark and revise it."
  QIE_ws_united.19.a: "There is no turning back now..."
  QIE_ws_united.19.tt: "§RThe last embers of §tdemocratic§9 republicanism have been completely §gextinguished...§!§!§!§!"
  QIE_ws_united.20.t: "The Vile Purple Usurps Vermilion"
  QIE_ws_united.20.desc: "The New Religion of Salvation will deliver a national address by radio to inform the people of the whole country of the investigation results in the Tang Erhe assassination case. People in the cities hold their breath before their radios, while farmers in the countryside crowd into the village headman's house. People are desperate to know: who dared commit such a crime on this day of nationwide celebration? At last, though the speaker's face cannot be seen, a voice indeed emerges from within:\n\nAll countrymen know that on the day of the founding ceremony, our nation's beloved Dr. Tang Erhe, head of the republic, was actually struck down beneath gunfire. Let us ask: what sort of frenzied and depraved villains would dare, at the hour of the Divine Land's founding, commit this violence intolerable through all ages? Throughout his life, Dr. Tang ran about for the cause of the republic, exhausting himself for the goodness and morality of China. Yet now he has died at the hands of a band of traitors who fear that our China has virtue, fear that our China has a republic, fear that our China has been reborn! Now we shall announce to the countrymen what the investigation has found.\n\nThis case is tangled and complicated; the depth of the murderers' flames and the breadth of their concealment far exceed initial expectations. Left at the scene were German- and French-pattern munitions; the weapons used by the murderers are also suspected to have come from Russian territory. Further evidence shows that remnant syndicalists within the country covered their tracks, and among the manifests of ships departing Tianjin there are also escapees using obviously false names. Viewed thus, this was not the plot of one person or one party, but the confluence of domestic and foreign villains, wishing to strangle our newborn China, wishing to ruin this hard-won peace, wishing to stir up old and new against one another and manipulate the people's hearts, so that China would once again fall into the final calamity!\n\nYour cries, I have heard them! The blood and tears of all loyal and virtuous people under Heaven, I have heard them as well! Therefore today, I declare here: from this moment on, the New Religion of Salvation will no longer lightly entrust the handle of the state to an unsettled situation. We shall reorder the laws and discipline and sweep away the lingering poison. All those who covet us from without, all those who incite disorder from within, all those who undermine the foundations of our country through conspiracy and assassination, shall be subject to the most severe pursuit, and shall pay the price they ought to pay!\n\nWe must make those people know: when the azure dragon of China sleeps, that is one thing; when it rages, it shakes mountains and rivers apart!\n\nWe must make those people know: when a good man suffers disaster, his loyal soul is not alone; hundreds of millions of citizens will surely demand justice for him!\n\nWe must make those people know: those who harm others with hidden arrows will finally be punished by justice under Heaven; those who throw the country into chaos through conspiracy will finally confess their crimes before history!\n\nGentlemen, today is not a day for weeping, but a day to order our armor and prepare our packs; not a time for retreat, but a time to purge the treacherous and wicked. We and the countrymen swear with one heart: if the source of chaos is not pacified, we shall not stop; if the remnants are not cleared away, we shall not rest; if China is not freed from these calamity-clouds and made to see the sun again, we shall never speak of peace!"
  QIE_ws_united.20.a: "Traitors and people are mixed together; jade and stone are hard to distinguish."
  QIE_ws_united.20.b: "They cling stubbornly to evil and do not obey the holy command."
  QIE_ws_united.20.c: "They would rather follow blades and swords than submit to holy law."
  QIE_ws_united.20.d: "Exterminate the wicked party; kill them all."
  QIE_ws_united.20.tt: "§RHeaven has Five Thieves; those who hunt them shall prosper...§!"
  QIE_ws_united.21.desc: "Tang Erhe's death was finally made public. Although in people's hearts he did not possess any especially lofty prestige, most had at least heard stories about the “Good People Cabinet”. In any case, the passing of a good life can always draw people's tears, all the more when it was a good life that promised to bring democratic republicanism to China.\n\nPutting aside the condolences from intellectual circles for the moment, some of the people also poured into the streets, spontaneously holding memorials for Tang Erhe. But more people went to Lüzu Pavilion in Mingguang Hutong. They kowtowed before the deity on duty that day at the spirit-writing altar, asked questions, prayed, and said that Tang Erhe was a good man, hoping the immortals would help him become an immortal too, or at least let him be reborn into a good family in his next life.\n\nBut as for the New Beiyang Provisional Government, everyone's view was entirely different. How could there be any principle in this world by which blood is seen on the first day of opening, and the congratulatory firecrackers become the wailing of a funeral? In the end, the moment the New Religion of Salvation stepped down, chaos immediately arose under Heaven. The new government's foundation was unstable; its fate was not hard enough. It would be better to invite the New Religion of Salvation back to continue governing.\n\n————No, this was not said by members of the New Religion of Salvation. It was said by candy sellers, by merchants, by newspaper writers, by fathers of sons, by orphans who had grown up. It was these people who appeared in the streets, once again speaking words of the approaching final calamity and the threat not yet gone.\n\nWu Peifu rolled down the car window. He had already heard something of the situation in Beijing, but he had not expected what he would encounter head-on to be beyond his imagination: crowd after crowd of Beijing citizens. Because of the crowds, the car had no choice but to slow down. Some stood on tiptoe to look, some knelt on the ground, and some simply stood there quietly, silently watching Wu Peifu. Until a sorrowful voice cut through the silence, and the crowd stirred, some crying and some shouting, all pressing forward together to hold the car door, pound on the bodywork, and reach their hands toward Wu Peifu."
  QIE_ws_united.22.t: "Father Pierre's Polite Refusal"
  QIE_ws_united.22.desc: "“News of China's unification has spread across the land. In 1936, the New Religion of Salvation took up the heavy burden of the Beijing regime and vowed to rebuild a China in which the people could live and work in peace. Now it is [GetYear]. Over this long period, patriotic soldiers and civilians have shed blood and sacrificed for unification, struggling with steadfast resolve. After enduring setbacks and hardships of every kind, the regime of the New Religion of Salvation has finally been able to announce China's unification.\n\nInternally, the suppression of disorder has ended; externally, resistance against enemies has ended. The Chinese people have finally been liberated from suffering, and on this day of peace the New Religion of Salvation has also announced that it will relinquish control over China and hand it over to the newborn democratic republican government. The New Religion of Salvation belongs, after all, to a past of calamity and turbulence; it will not go forward into a future of peace and tranquility——for that reason, so long as the newborn democratic republican government can ensure the independence and integrity of the state, can safeguard the people's recuperation, can draft a sacred constitution to ensure the continuation of the national polity, letting the people live and work in peace, live freely, and making China into a true paradise, that will be enough——”\n\n“You need say no more,” Father Pierre Célestin waved his hand. “I have already made clear to you that my conversion did not come about through human power. I was neither coerced by external forces, nor did I accomplish this by my own will——it was God who called me. How could I abandon God and return to China to take some official post?” After saying this, he seemed to feel that his refusal had been too forceful: “I will chant the Magnificat and pray that God bless China, just as I did before in Beijing...”\n\n“Mr. Lu, New China has only just been established, and we are desperately short of people. You are an experienced diplomat. Please, you must——”\n\n“Please let André escort you out. Now I have recognized the facts and circumstances of the outside world. What I can do is only answer the vocation made clear within my heart by God's grace. This long and definite vocation is now the only thing that matters to me, so please go back.”\n\nAfter sending away the persuader dispatched by [QIE.GetName], Pierre Célestin——the man once known as Lu Zhengxiang——thought for a moment, then faced the open window in the room and knelt down."
  QIE_ws_united.22.a: "“Lord, may you forgive the Chinese people; may you keep them away from false prophets and the dragon...”"
  QIE_ws_united.23.t: "Glory and Remembrance"
  QIE_ws_united.23.desc: "The Preparatory Committee raised an interesting, yet also highly necessary, proposal——a monument. Although the war had ended and the smoke had dispersed, and China had ultimately won a victory of its own, human beings are forgetful creatures. As time passes, they will forget many things. Perhaps only by carving lessons into stone can they be reminded of what happened in the past. Designing and building a postwar monument is not only to commemorate the dead, but also to let later generations remember history and cherish peace.\n\nA monument is precisely the carrier of the shared memory of a country and a nation. It bears the sacrifices and dedication of countless people. Standing there, it reminds those who look upon it that today's tranquility is not a matter of course, but the result bought with countless lives and blood.\n\nMany committee members support building such a monument, to commemorate the soldiers who died in the war of unification. Fortunately, there are indeed two outstanding architects and designers on the committee, and what is more interesting is that the two of them are husband and wife. This architect couple, returned from overseas, had long before the war traveled across the Chinese land, researching and surveying all kinds of ancient Chinese architecture. Some people on the committee hope that when people see this Peace Monument, what they see will not only be the lives that have passed away, but also the courage, unity, and conviction shown by the Chinese nation in the face of disaster.\n\nAt the same time, however, some members of the Preparatory Committee, most of whom had once held posts in the “special government” of the New Religion of Salvation, believe that the monument should emphasize the Chinese people's spirit of facing death without fear and seizing victory bravely. It should not be a lamenting, warning, commemorative monument, but a victory monument proclaiming that truth will ultimately triumph and China will ultimately rise. Only in this way, when people see it, will a sense of pride and the strength to continue forward rise from their hearts.\n\nBut everyone said many things all at once, and in the end they were still only suggestions. The final form still had to be handed to the two architects to integrate and design. It could be said that most of the initiative rested in the hands of the husband and wife. No matter what plan they ultimately adopt, this construction project may stimulate the recovery of the postwar government's civilian economy and make our economic system healthier."
  QIE_ws_united.23.a: "This monument will make people remember the glory of victory and the sweetness of triumph."
  QIE_ws_united.23.b: "This monument will make people remember that peace is built upon countless nameless bones."
  QIE_ws_united.23.c: "This monument will symbolize that the Chinese people have inherited the past, moved toward the future, and become the deciders of their own destiny."
  QIE_ws_united.24.t: "Before Boarding"
  QIE_ws_united.24.desc: "More than a week had passed since the New Religion of Salvation announced vengeance in that broadcast. Whether in Tianjin or Shanghai, the major foreign-owned steamship companies had reduced the number of international passenger sailings. At the harbor's edge stood thousands of foreigners and Chinese intellectuals who wanted to leave. Some people with keen political instincts had left China early after Tang Erhe's assassination, as if they had already foreseen the return of the New Religion of Salvation. Those who only realized after the broadcast that something terrible was happening and wanted to leave had no choice but to endure a long waiting-list process. Dragging trunks and baskets, their expressions exhausted, they waited for a ticket that could take them away from here.\n\nHe stuffed the ticket to the Philippines into her hand. Clearly, he belonged to the type who had prepared early. “When did you get this?” She was indeed somewhat surprised. One had to know that a week earlier, just when the news of Tang Erhe's death had been exposed, he had still been drawing sketches for the monument task entrusted to him by the committee.\n\nHe fell silent for a moment and kicked the leather suitcase at his feet, one corner of which had been chipped off: “I feel uneasy, and you are not allowed to laugh when I say this.” He paused, as if about to announce some imperial decree. “I dreamed of my father. In the dream, he told me that Zhang Xun's followers could not be trusted and told me to make plans early.” He said this very seriously, as if his father had truly sent him a prophetic dream, which made her laugh.\n\n“Do not laugh, do not laugh.” He accidentally kicked the suitcase over, then hurriedly set it upright again. “We first leave here for the Philippines, and then where?” She looked toward the other side of the harbor, where a man in a long gown seemed to be arguing with a shipping clerk over ticketing, then turned her head back. “I think we should go to France. There are still many acquaintances there, and people who can inherit the old world without suddenly plunging back into it.”\n\nAfter saying this, she turned around: “Can you see Chaoyin Temple over there? Look at the flush gable and the hip-and-gable roof, covered again with beautiful blue tiles.”\n\n“You cannot see Chaoyin Temple from here.” That was all he said."
  QIE_ws_united.24.a: "I will hide it in my heart and carry it elsewhere."
  QIE_ws_united.24.tt: "§YLin Huiyin§! leaves §Y$QIE_united_china_ws_final_phase_national_populist$§! \n§YLiang Sicheng§! leaves §Y$QIE_united_china_ws_final_phase_national_populist$§!"
  QIE_ws_united.27.t: "New Religion of Salvation: The Immortal Returns to the Throne"
  QIE_ws_united.27.desc: "In 1936, the New Religion of Salvation deftly maneuvered through the coup conspiracy within Beijing. Perhaps it had been blessed by Heaven’s mercy, or perhaps people had simply had enough of emperors, warlords, and a useless parliament. This political organization, draped in a religious outer garment, ultimately seated itself upon the throne in Beijing. It did not make any grand promises like those great parties and great leaders. Whether or not it acted out of good intentions, all it did was strive to maintain order, and from that order seek a share of interests belonging to itself.\n\nStabilizing the chaos across the North China Plain seemed to bring a faint glimmer of hope to a dull and dark society. Social problems that a normal government could not properly handle were somehow dealt with by this charitable organization now seated within the government. As the North China Plain developed, the New Religion of Salvation further answered the calls of the people and began its road of pacification. Even when the rising sun farther to the east revealed its fangs, it did not retreat a single step in the face of the Empire of Japan’s invasion. This was a feat that no organization ruling Beijing had been able to accomplish in decades—and perhaps it would carry the wishes of the people and strive toward an even greater goal.\n\nJust when people believed that such a legitimate political party would continue to rule, it instead chose to withdraw, and a democratic republican provisional government followed. Yet what this newborn thing brought people was less hope for the future than fear of it: a veteran elder of outstanding military achievement had departed, only to be followed by a newborn infant emperor. It was not until the gunshot in Beijing completely shattered the birth of the republic that people mourned for a dead man, feared a government unable to ensure safety, and finally cheered for the returned living saint, [QIE.GetLeader]. Rather than the New Religion of Salvation wishing to do this, it was more as though the people were calling upon it to do so, and the New Religion of Salvation could no longer let slip any opportunity to continue maintaining the people’s trust. It had to provide the people with answers to every question."
  QIE_ws_united.27.a: "I see a King, a Chakravartin, a Triumphant Man."
  QIE_ws_united.27.tt: "§0Thank you very much for playing PENGLAI NONDUM REPERTA: Qing Government-New Religion of Salvation route! You have now experienced essentially all content in this route.§!\n\n§gMod development team member: §YNethop§!.§!\n\n§YThank you to all the loveliest people who provided suggestions for the mod before and after its release. All of your suggestions and feedback have been extremely important; this event is dedicated to all of you.§!"
  QIE_ws_united.28.t: "New Religion of Salvation: Penglai Remains Unfound"
  QIE_ws_united.28.desc: "From the hill of Tepeyac in Mexico to Yushima Seidō in Japan, from Jerusalem to Baghdad, the New Religion of Salvation has already grasped one third of the entire world in its hands, truly realizing people’s ideals. After all, Confucius, Laozi, Shakyamuni, Jesus, and Muhammad were all enlightened by a Chinese immortal, so how could the legacy they left behind, and everything built by their followers, not count as the share that the Chinese people deserve? This is precisely the world desired by the New Religion of Salvation, the world of Great Unity desired by Kang Youwei, the unified world longed for by all people—the world has finally accepted the Way of Confucius and Mencius, and correct order has finally descended upon the nations.\n\nIn this earthly heaven where all prayers, all blessings, all curses, all hatred, all compassion, all anger, and all joy are permitted to exist, the only thing that does not exist is the New Religion of Salvation itself.\n\nAnd yet it remains firm, just like the statue of Lü Dongbin in Lüzu Pavilion on Mingguang Hutong, which has endured countless Chinese dynasties, standing there still."
  QIE_ws_united.28.a: "And will rule continue on like this?"
  QIE_ws_united.28.tt: "§0Thank you very much for playing PENGLAI NONDUM REPERTA: Qing Government-New Religion of Salvation route! You have now experienced all content in this route.§!\n\n§gMod development team member: §YMstislav Severianov DPhil, MRSB§!.§!\n\n§YThank you to all the loveliest people who provided suggestions for the mod before and after its release. All of your suggestions and feedback have been extremely important; this event is dedicated to all of you.§!"
  QIE_wushan_annex_events.2.t: "Jeungsanism"
  QIE_wushan_annex_events.2.desc: "In the late 19th century, the Korean Peninsula faced various social problems, which triggered a series of peasant-led uprisings. The most interesting among them was the famous 'Donghak Peasant Revolution'. The term 'Donghak' refers to a school of thought belonging to traditional Korean society, as opposed to Western culture represented by Catholicism. Choe Je-u believed that 'the ancient morality of the East had weakened, allowing Western teachings to infiltrate, thus endangering the nation... Western teachings are a heretical doctrine that destroys nations and annihilates the people.' He subsequently established the Donghak movement to resist the encroaching Western culture.\n\nThe first Donghak Peasant Revolution in 1894 ended with the Korean Empire and the revolutionary group signing a peace treaty, which restricted the development of Western thought and implemented preferential policies for peasants. However, as Japan expelled the Qing government's forces from Korea, the Donghak followers chose to take up arms and fight against the Japanese. These peasants were no match for the Japanese military. They were quickly suppressed; some chose to leave their homeland, while others were forced to go underground.\n\nJeungsan-gyo was one of the remnants of the Donghak Peasant Revolution. After forty years of development, it had split into several different groups. Some of these groups actively cooperated with the Provisional Government of the Republic of Korea, hoping to one day drive the Japanese out of Korean land; some advocated for peaceful coexistence with the Japanese settlers, believing that 'everyone is Korean'; and others asserted their own right to rule Korea, hoping to establish a theocratic government...\n\nEven if [ROOT.GetName] were willing to support these fanatics as the rulers of the Korean government, they would inevitably have to resolve the issues with the Korean Liberation Army..."
  QIE_wushan_annex_events.2.a: "Let Jeungsanism take power."
  QIE_wushan_annex_events.2.b: "Forget it."

  ### Compatibility Event Translation ###
  UPC.chinademocraticleague.003.d.wushan: "The New Religion of Salvation currently has an unsteady foothold in China. Although it has already received the support of many less-educated people, intellectuals still remain hostile to it. The recent controversy over the arrest of the “Seven Gentlemen” has enraged democratic figures and intellectuals in political circles who were already angry. They have raised banners in front of the government and Lüzu Pavilion, accusing the New Religion of Salvation of being true hypocrites for arresting these “good people”. They demand that the government respond. Many famous figures among them were mobilized by the National Salvation Association, the Endeavor Society, the Political Science Clique, the Rural Reconstruction Association, and even a group of constitutionalists who were half pushed and half willing. They united to denounce the New Religion of Salvation with both tongue and pen.\n\nSince its establishment, the National Salvation Association has been watching eagerly for the government's attitude toward the concessions and democracy. Black Monday, together with the arrest of the Seven Gentlemen, unrest in Shanghai, the Eight Provinces, and various other places, has made the situation increasingly urgent.\n\nAfter the Seven Gentlemen were extradited to Beijing, they received special preferential treatment from the authorities. However, at the call of $QIE_ws_adv_zhuang_rensong$, the government and a group of members within the religion who had long sneered at the Seven Gentlemen nevertheless joined with several jurists to bring charges against them. They accused the Seven Gentlemen of “gathering followers and plotting to endanger the government”, cited the multiple laws they had violated, and successfully initiated prosecution against them.\n\nYet after they had been thrown into prison for four months, the Seven Gentlemen incident triggered a large-scale intellectual movement and provided cover for their demands to call for democracy and peace, end the civil war, and unite against foreign aggression. In private, $QIE_ws_adv_tang_erhe$, $QIE_ws_adv_yuan_yonglian$, $QIE_ws_adv_zhou_zhenlin$, and others who had once served in the “Good People Government” pulled [QIE.GetSecondInCommand] aside and urged him to put pressure on the government, demanding that the charges be dropped and the prisoners released.\n\nOn the other hand, $QIE_ws_adv_zhuang_rensong$ insisted that the Seven Gentlemen's position was close to that of the Kuomintang and that they were constantly stirring up trouble in the political arena. If we yielded, it would make us appear to be, in reality, a weak and incompetent government submitting to the overbearing power of poor, pedantic literati. It is worth noting that $QIE_ws_adv_gong_xinzhan$ and others continued to watch from the sidelines and remain silent, deciding to obey the opinion of the majority."
  UPC.chinademocraticleague.003.a.wushan: "Shen Junru may leave; the others remain detained."
  UPC.chinademocraticleague.003.b.wushan: "Releasing them would not affect anything either..."

