  QIE_ws_leader_stories_wu_increase: "§CWu Peifu's political power has been §Rstrengthened§C! §!§!§!"
  QIE_ws_leader.1.t: "In the Study"
  QIE_ws_leader.1.desc: "Almost two weeks have passed since Jiang Chaozong spouted his wild words before the world media and the New Religion of Salvation seized control of government power. Wu Peifu had also awakened long ago. It is said that the first thing he asked the nurse after waking was where Cao Kun was. When he learned that Cao Kun had been shot dead by a stray bullet from the Zongshe Party during that day's coup, this hardline warlord could no longer hold back his tears, and wept bitterly for his patron and teacher. Yet very quickly, when he learned that Cao Kun had been smeared to the outside world as the murderer who “assassinated the emperor”, his grief turned to anger.\n\nYes, he could understand that this was a compromise made to preserve himself and the situation, but he could not accept the choice. Moreover, who could prove that Jiang Chaozong had truly come to relieve the crisis, rather than calculated against all of them? For these two weeks he shut himself in the study, opened every single letter Jiang Chaozong had sent him over the past nine years, and read each carefully. All the way until that final letter in the sixth month of the Bingzi year. He could be almost certain that Jiang Chaozong had deliberately allowed those monarchists to kill Cao Kun. But now that matters had reached this point, who would believe him? That fellow had specifically asked Liu Yuchun to stand beside him at the press conference, and he himself was nominally the dean of the New Religion of Salvation's teaching institute. If he made accusations rashly, people would suspect that Wu Peifu had staged a self-injury stratagem, secretly ordering this “counter-coup” from behind the scenes. For ages to come, all later classicists would jab their fingers into his spine.\n\nWu Peifu punched the desk lamp off the table, trying to relieve the pressure. The pain of the blunt impact traveled from his fingertips into his heart, yet this pain seemed to enlighten him to something——at least nominally, he was still dean of the New Religion of Salvation's teaching institute. In the past this had been an empty post in a charitable fraternity, but in today's Beijing it had become a symbol of power.\n\n“So long as my position can be proven……” he muttered. A bold plan took shape in his chest. After all, the “religion” of the New Religion of Salvation was only a skin；its essence was no different from the other Beijing regimes before it. If he could restore his position as religious leader, then perhaps he could clear Cao Kun's injustice——no, perhaps the dream he once imagined at the Kaiping Military Academy, of reviving a Confucian state of rites, could also become reality.\n\nHe rose, draped his coat over his shoulders, pushed open the study door, and walked out. The young guardsman who had long been waiting outside the door immediately startled awake."
  QIE_ws_leader.1.a: "Jade Marshal, are you feeling better? "
  QIE_ws_leader.2.t: "In Fengzeyuan"
  QIE_ws_leader.2.desc: "Almost two weeks have passed since Jiang Chaozong made a great splash before the world media and the New Religion of Salvation seized control of government power. During this time, Jiang Chaozong has been busy fulfilling promises to his former political allies. The difference between a politician and a swindler is that the former can prove himself a man who keeps his word——of course, what is proven is limited to what he promised, and does not include what the other party imagined after hearing the promise.\n\nToday, Jiang Chaozong invited Deng Bangshu and others to Fengzeyuan. On the surface, he chatted idly with Deng, spoke painfully of the importance of education, and hoped Deng Bangshu could donate more precious rare books to the Beijing Research Institute. In reality, he was sounding out whether the other man was willing to take up an official post in this new government. Unfortunately, Deng Bangshu was advanced in years and declined Jiang Chaozong's invitation, so the two could only chat about household trifles and incidentally praise Fengzeyuan's scallions-braised sea cucumber. After the failed Ding Si Restoration, Zhang Xun fled in panic to the Legation Cities, while Jiang Chaozong, because of his good relations with political and military figures, was regarded with suspicion by Duan Qirui. In the end, Jiang was stripped of the post of Commander of the Nine Gates, and then became “General Diwei”.\n\nHuman connections and common interests were his magic weapons for victory. By promising these old men a large cake to divide, he could easily unite them. Wu Peifu clearly did not understand this. Whether during the “Good People Cabinet” or the Zongshe Party rebellion, that idealist was always easily swayed by old friendships. As a marshal, this character made him a good superior；but if he wanted to call the wind and summon the rain in the Beijing Government——he still fell far short.\n\nAlthough he continued verbally responding to Deng Bangshu, Jiang Chaozong was already planning in his mind the wording for his next visit. Just then, a nervous-looking young man barged into Fengzeyuan's private room. His clothes were clearly cut for someone else's figure. He bent down beside Jiang Chaozong and whispered a few words."
  QIE_ws_leader.2.a: "Looks like Pipsqueak Wu has found his way home? "
  QIE_ws_leader.3.t: "A Night That Gave Old Xianzhou a Stomachache"
  QIE_ws_leader.3.desc: "Gong Xinzhan sighed. At sixty years old, he ignored the documents on his desk and lay down on the office floor. The parquet floor dug into his head, as uncomfortable as the bed at home. But none of this compared with the telegrams he had read——the melee in East China was nearing its end, yet refugees from the League of Eight Provinces were crossing the border every day into territory controlled by the North China Government, and the New Religion of Salvation was critically short of disaster-relief personnel；on the other hand, Sichuan's fragile agricultural structure had finally brought about a great famine after a severe drought. If nothing was done about the famine, it would damage the New Religion of Salvation's own social standing.\n\nPeople and resources, everything is lacking.\nYet at precisely this moment, Jiang Chaozong and Wu Peifu began competing with one another for the position of “leader”. Both of them wanted to rule this great ship that was leaking and sinking, yet showed little interest in stopping it from sinking——and that was the most stomach-churning situation of all.\n\n“Two bastards, messing around right here.”\n\nHe suddenly remembered that more than ten years ago, in this very room, someone had cursed him with the same words, and in anger he had resigned and wanted to go to the Legation Cities. At that time, Qian Nengxun had not yet passed away, sent someone to invite him back, and he had wanted to make a three-chapter pact with Qian Nengxun."
  QIE_ws_leader.3.a: "“Military men must not curse people”……? "
  QIE_ws_leader.4.t: "New State, New Religion, But a New Leader? "
  QIE_ws_leader.4.desc: "The rebellion launched by the Zongshe Party in the Forbidden City (or the Restoration Revolution, depending on what you call it) was ultimately used by Jiang Chaozong. The bones of these Manchu Qing dignitaries became the steps by which this old Beiyang general and his “big tent”——the New Religion of Salvation——ascended to power. Though the sect has already seized power, its leader remains undecided——after all, this is no longer a charitable brotherhood tinged with mysticism, but a religion or political party that truly controls the state. Presumably, all factions will now fight fiercely for the leader's throne in the Beijing Government.\n\nYou can see Jiang Chaozong's and Wu Peifu's respective focuses in the focus tree. You have no right to interfere with their actions. These focuses will be completed by them in sequence as time advances, and all you can do is gently move the spindle at the forks of fate, letting victory favor one side, or favor neither——this may affect the speed and outcome with which they complete their respective focuses, and determine who will prevail.\n\nWe have written a large number of “Human-Generated” (neither AI-Generated nor God-Generated) events for this route, which will provide different perspectives depending on which side you choose to support: of course! You can choose to experience Jiang Chaozong's story, yet like the capricious deity manifesting upon the spirit altar of the New Religion of Salvation, bestow the laurel of victory upon Wu Peifu out of a momentary whim, thus allowing you to collect Jiang Chaozong's “defeat events”. But we still advise you to choose the perspective of the route you wish to play, because this regime has little kindness for losers forced to swallow the bitter fruit……"
  QIE_ws_leader.4.a: "The essence of every sect and organization is the division of interests."
  QIE_ws_leader.4.a.tt: "§CYou will experience the entire struggle event chain from §YJiang Chaozong§C's perspective, and may influence future plot developments.§!"
  QIE_ws_leader.4.b: "If Confucius and Mencius can be honored and rites restored, why should China worry it will not prosper? "
  QIE_ws_leader.4.b.tt: "§CYou will experience the entire struggle event chain from §YWu Peifu§C's perspective, and may influence future plot developments.§!"
  QIE_ws_leader.4.c: "What matters most now is resolving the chaos……"
  QIE_ws_leader.4.c.tt: "§CYou will experience the entire struggle event chain from the perspective of the §Yhidden third party§C, and may influence future plot developments.§!"
  QIE_ws_leader.5.t: "The Encounter of 1923"
  QIE_ws_leader.5.desc: "After the Great Kanto Earthquake of 1923, members of the New Religion of Salvation went to Japan to offer condolences and disaster relief. This both improved the international image of the New Religion of Salvation and enabled the sect to establish contact with a local Japanese religious group——Oomoto, a Japanese folk religious organization led by Deguchi Onisaburo. After exchanging envoys and maintaining friendly contacts, Oomoto established a branch in Beijing, while the New Religion of Salvation also admitted some foreign members in Japan and likewise established a branch in Nara. But with the outbreak and conclusion of several Zhili-Fengtian Wars, the liaison offices on both sides eventually ceased operating.\n\nJiang Chaozong, wearing only his underclothes, sat on the bed surrounded by crumpled wastepaper, thinking about how to bring down the returned Jade Marshal——he had misjudged the political capital and social forces Wu Peifu could mobilize. If only one more bullet had been left for him in the Palace of Heavenly Purity, perhaps there would not be so many complications. Even if Wu Peifu, as head of the Zhili clique, was attacked by those intellectuals, when compared with an old Beiyang relic like himself who had once followed Zhang Xun and presided over occult activities in Beijing, they would immediately know who was the greater reactionary. He urgently needed evidence proving Wu Peifu was not worthy of trust or following.\n\nTrading with the Germans? Even little children on the roadside knew the Zhili clique was doing that.\nShort stature? That could be used to kick a dog already in the water, but using it against a still-threatening opponent would only invite ridicule.\nA secret pact with the Japanese? That was almost impossible——but the truth, or rather the “truth” people were to know, need not be so. It was precisely for this reason that he repeatedly brewed the words he wanted to say and sent them to the New Religion of Salvation's allies in Japan.\n\nIf no evidence could be found, one could forge evidence: a letter from some Japanese industrial company, which ought to imply that Wu Peifu had reached some “secret agreement” with them. This letter had to be enough to excite the newspapers, yet difficult to disprove immediately——and if the letter were intercepted by someone and “mistakenly” delivered by the postman to a newspaper office, that would be enough to stir up a commotion and weaken the political credibility of this “national strongman”. Those newspapers cared only how many papers they could sell tomorrow, not the truth.\n\nBut the question was, could this trick truly work? Perhaps only immortals could give the answer."
  QIE_ws_leader.5.a: "Unfortunately, I have not yet become an immortal."
  QIE_ws_leader.6.t: "Rumors and Gossip"
  QIE_ws_leader.6.desc: "The <North China Star> newspaper in Beijing received a strange letter today. Its contents were a letter written by a Japanese shipping manager to Wu Peifu, repeatedly reminding Wu Peifu to “remember the matters previously discussed”, as if fearing the reader might not know some secret transaction existed between them.\n\nThe reporters of the <North China Star> quickly realized that this letter was less a clue exposing Wu Peifu's ugly past than a forged piece of damaging material, intended to strike at a potential rival in the still-unclear Beijing situation. If they published it directly according to the wishes of the mastermind behind it, the newspaper itself might become a target of attack. In the next issue, they subtly warned those who wished to use newspapers to attack political enemies, pointing out that the newspaper had always maintained a cautious attitude toward unverified materials, and urging readers not to lightly believe such rumors.\n\nThe forged damaging material about secret collusion between the Japanese and Wu Peifu instead caused Wu Peifu's own reputation among the public to rise. Some wavering moderates became more inclined to support Jade Marshal's faction. Worse still, people began to suspect that this piece of damaging material might have come from the hands of competitors struggling with Wu Peifu for power——the prime suspect being General Diwei Jiang Chaozong, who had close relations with Japan and may have persuaded the Japanese to harm Jade Marshal's reputation. There could be no worse situation than this."
  QIE_ws_leader.6.a: "He lifted a stone only to drop it on his own foot."
  QIE_ws_leader.6.b: "A clownish ploy for power."
  QIE_ws_leader.7.t: "The Yunyang Maru Incident"
  QIE_ws_leader.7.desc: "The <North China Star> newspaper in Beijing received a strange letter today, involving Wu Peifu and a Japanese shipping affairs manager. Although at first the newspaper's reporters believed that any “foreign secret letter” appearing at this time was very likely damaging material meant to strike at political enemies, their search through old archives produced an unexpected harvest.\n\nThe letter concerned a series of secret agreements reached in 1923 between Wu Peifu and Japan's Nisshin Kisen Kaisha. Wu Peifu transferred interests to the Japanese side, using two Japanese freighters, the “Yunyang Maru” and “Yiyang Maru”, to provide arms to Yang Sen, head of the Sichuan Wubei clique, in an attempt to end the infighting among Sichuan warlords. Although Wu Peifu's purpose was to restore Sichuan's stability, the fact that he colluded and made deals with the Japanese under the table now seems beyond dispute.\n\nAfter the full text of the letter and related evidence were disclosed, it immediately caused an uproar in North China society and around the world, further splitting the crowds that supported Wu Peifu. Under the agitation of some members of the old Political Study clique, a group of radical intellectuals appeared in their self-published tabloids attacking Wu Peifu as a “hypocrite” and a “petty man who dares not act openly and honorably”. In any case, it seems the image of a “national strongman” that Wu Peifu had long built before outsiders is gradually collapsing……"
  QIE_ws_leader.7.a: "Jade Marshal's shortcomings, it turns out, are not only in his height."
  QIE_ws_leader.7.b: "The gods of fate and chance have smiled upon one side."
  QIE_ws_leader.8.t: "Someone Is Trying to Smear Him"
  QIE_ws_leader.8.desc: "Wu Peifu read the translated copy of the <North China Star> delivered to him and could not help laughing. From every angle, this was a foolish move. The reporters of the <North China Star> had published a letter written to Wu Peifu by a Japanese shipping investment manager. Reading it through, the letter was full of holes, and its wording was so deliberate as to be almost laughable, nearly wishing to write the charge of “secret dealings with Japan” into every line.\n\n“The hat he has put on me is far too large, ” Wu Peifu said while reading this shoddy forged evidence. With interest, he picked up a vermilion brush and circled several characters in the letter. Of course he knew who had forged it. He had not expected Jiang Chaozong to end up playing this sort of game with him——attacking his patriotic image. Unfortunately, these attacks had no effect, and would even be printed in the newspapers for society to laugh at. Wu Peifu glanced at several other popular tabloids on the desk, articles written by Beijing intellectuals to vindicate him. These people had originally still been watching from the sidelines, but once the letter was printed, they immediately joined his camp. Jiang Chaozong wanted to attack him with damaging material, but he had miscalculated, because this instead made everyone in Beijing begin supporting him. Truly, those who harm others ultimately harm themselves, and evildoers meet their own retribution.\n\nThinking of this, he comfortably closed his eyes and leaned back in his chair, almost able to imagine Jiang Chaozong's furious face when his own baseness and cunning recoiled upon him."
  QIE_ws_leader.8.a: "They do not really think they can find anything, do they? "
  QIE_ws_leader.9.t: "Settling Old Accounts"
  QIE_ws_leader.9.desc: "Wu Peifu read the translated copy of the <North China Star> delivered to him with a grave expression. He had never expected that the old matter of his support for Yang Sen and intervention in the Sichuan civil war would be discovered by these hyena-like reporters. What troubled him even more was that published alongside this old matter was an embellished letter to Wu Peifu himself, written by some Japanese shipping manager from who knew where.\n\nIn the newspaper, the reporters declared they had found evidence that Wu Peifu had reached an agreement with the Japanese when intervening in the Sichuan civil war. According to the report, Wu Peifu and Nisshin Kisen Kaisha had reached a series of agreements, using Japanese freighters and hiring Japanese escorts to transport a batch of Japanese weapons to Sichuan to support Yang Sen, the Zhili clique's ally in the Wubei faction. This was true；he had indeed done so. But the latter half of that letter said many more things Wu Peifu himself had never done, the worst of which was the manager's claim that “Wu Peifu promised the legitimate interests of Japanese steamship companies along the Yangtze after China's unification”. This nearly made him pound the desk in rage, shaking the brush on his right, kept there to display his identity as a “xiucai”, onto the floor.\n\nDid he, Wu Peifu, really look like a traitor wagging his tail before the Japanese? Yet because the evidence in the first half was so solid, many people instead suspected that the accusations in the latter half were also true, only that Jade Marshal had cleverly hidden the evidence while continuing to show outsiders his image as a “national strongman”.\n\nIn any case, Beijing's intellectual and political circles were shaken tremendously. The old Political Study clique, which had always opposed the Zhili clique, began under Huang Fu's leadership to loudly hype him as a “hypocrite” who “uses false nationalism as a name while practicing private exchange of interests”. His political capital had been greatly weakened, and the cause of all this had to be blamed on those reporters for being too meddlesome."
  QIE_ws_leader.9.a: "How did they actually manage to dig something up? "
  QIE_ws_leader.10.t: "Jade Marshal's Strike"
  QIE_ws_leader.10.desc: "Leave Beijing through Dongbianmen, follow the Tonghui River all the way to Gaobeidian Village, and one reaches Beijing's old sluice gate. A few more steps bring one to the somewhat dilapidated Dragon King Temple. Before the mountain gate hall, Wu Peifu hesitated for a moment. Was it guilt, or indecision? But in the end, under the gaze of Generals Azure Dragon and White Tiger, he stepped inside——Wu Peifu had not attended a meeting of the New Religion of Salvation for nine years, and naturally had not visited this place for nine years either——this was the meeting place of the Beijing Mingjing Society, whose members were almost all members of the New Religion of Salvation who followed Wu Peifu's lead. But after so many years, how many people would still remain here? \n\nTo Wu Peifu's surprise, when he entered the east side hall, there were still seven or eight people inside brewing tea around a brazier, though unfortunately Wu Peifu recognized none of their faces. Seeing Wu Peifu arrive, the group first froze, then their hands began to move in confusion. Clearly they had not expected such a thing to happen. Now, the living Jade Marshal had appeared before them. After some explanation, Wu Peifu learned that over the past nine years, most of the old members of the Mingjing Society had already left, and those remaining were this group of “followers” who had never met him within the religion but greatly admired him.\n\nHowever, Wu Peifu had not come to find old acquaintances in the society and reminisce, nor to receive the flattery of a few later believers. He knew well that Jiang Chaozong was a man who had struggled through the Beiyang political arena for many years. Balancing interests and winning hearts came naturally to such a man, and such a person could not possibly act openly and honorably；he would certainly have done things in the gray area. He had already inquired that although the donations and charitable funds received by the religion over the past nine years were nominally managed by Gong Xinzhan, whether funds were allocated, and how much, depended on Jiang Chaozong's decision. Before the Zongshe Party coup, Jiang Chaozong had been inviting various party figures to dinners and operas, placating different factions, and purchasing and smuggling all sorts of arms. Where had he gotten so much money? If something could be found, perhaps Jiang Chaozong could be forced to make concessions in the struggle. This was why Wu Peifu had appeared here. He had been away from the affairs of the New Religion of Salvation for far too long, and therefore needed those who had long participated to provide him with some rumors——for this, he worked hard to put on the kindly face of a scholar-gentleman, and spoke slowly to these admirers: \n\n“I have one matter, and I would like to trouble you all to ask around for me……”"
  QIE_ws_leader.10.a: "Have you heard any rumors about where the charitable funds of recent years went? "
  QIE_ws_leader.11.t: "A Man with No Leaks"
  QIE_ws_leader.11.desc: "The young members of the Beijing Mingjing Society sent back word. After asking everywhere, they had not found any definite evidence proving Jiang Chaozong had embezzled the religion's charitable funds. Perhaps this matter simply did not exist, or perhaps Jiang Chaozong had been extremely careful and had already swept all evidence clean. In addition, these society members acted in an overly ostentatious manner. Their inquiries everywhere into the use of charitable funds had already become known to many within the religion.\n\nAt the most recent regular meeting, some members sternly denounced the “unhealthy tendencies” that had recently appeared within the religion. They emphasized that to suspect fellow members of the society based merely on momentary doubt was quite discourteous and quite dangerous. At the same time, these people also subtly pointed to Wu Peifu behind those young men. They criticized him for having never asked about matters great or small within the religion for nine years, and now, upon returning to the New Religion of Salvation, the first thing he did was secretly gather handles and fight for power. This was not the scene they wished to see.\n\nThus it appears that the plan to bring down Jiang Chaozong from the angle of internal administration has failed. Worse, this reckless probing has instead made the wavering moderates within the religion begin to suspect that Wu Peifu is in fact an untrustworthy man scrambling for power and profit. Matters clearly have not developed in a good direction……"
  QIE_ws_leader.11.a: "Why could they not be a little more careful? "
  QIE_ws_leader.12.t: "Extortion and Blackmail"
  QIE_ws_leader.12.desc: "The young members of the Beijing Mingjing Society sent back news. They did not find evidence proving that Jiang Chaozong had embezzled charitable funds, but they obtained another interesting piece of information——after the New Religion of Salvation took control of Beijing, Jiang Chaozong made connections and paid visits in many directions, using the name of the New Religion of Salvation to intimidate and deceive the wealthy in the capital, collecting wealth in the name of “protection”.\n\nHe extorted selectively. For industrialists and Qing imperial nobles who had not previously supported his coup plan, he hinted that they should pay a “social maintenance fee”；for wealthy men who had more or less stood on his side during the earlier chaos in Beijing, he promised so-called prospects and social status, encouraging them to “voluntarily” donate to the New Religion of Salvation. One society member contacted one of these industrialists who had made such “donations”. The amount he donated differed from the amount recorded in the New Religion of Salvation's register of good works. It seems Jiang Chaozong was indeed plucking feathers from every passing goose.\n\nEntrusted by Wu Peifu, these young men brought up this shameful corruption at a regular meeting within the religion, provoking the indignation of most of the neutral faction inside the religion——mainly the forces of the Luanwu Yuan-Ciyuan, where Gong Xinzhan, who handles finance, is located. They have jointly demanded that Jiang Chaozong personally attend the next meeting to explain the matter. Now the refugee problem from the League of Eight Provinces remains unresolved, and relief for the Sichuan famine urgently requires money. The explosion of this scandal at this time has greatly weakened his influence inside the New Religion of Salvation. It seems he must now move away from the throne of power."
  QIE_ws_leader.12.a: "Those who have lost morality must not touch the seat of morality."
  QIE_ws_leader.12.b: "A fatal blow."
  QIE_ws_leader.13.t: "Impatient Adventurism"
  QIE_ws_leader.13.desc: "Wu Peifu must have read too many books of sages and popular romances, to actually believe that if Jiang Chaozong truly wanted to embezzle society funds, he would openly withdraw them from the accounts. What astonished Jiang Chaozong even more was that Wu dared to instruct that gang of followers from the Beijing Mingjing Society to do it for him. These people could not find anything, and instead would attract dissatisfaction from others inside the sect——because there is always someone who has not yet cleaned up the tail behind him. It was within expectations that the society members would be besieged at the regular meeting, and it required no thought to know that Wu Peifu would bring fire upon himself because of this investigation. In the end, Wu Peifu lacks political sense, and his followers are a group of hot-blooded young men with no city in their hearts. At least this time——he, Jiang Chaozong, has won."
  QIE_ws_leader.13.a: "Jade Marshal needs a competent political adviser."
  QIE_ws_leader.14.t: "Forgetting to Share the Cake Crumbs"
  QIE_ws_leader.14.desc: "These young men of the Beijing Mingjing Society rushed about like a gang of brutes, without the slightest understanding of society's rules of interaction. How could they have thought to take the register of good works directly to those industrialists who had donated to the New Religion of Salvation——and with that, all the facts of Jiang Chaozong's skimming money from the middle were exposed. Now look: the people responsible for operating disaster relief know that he took his cut, and one by one they have transformed into creditors from past lives, as though he owed them a sum of money in a previous life. With such an almost impossible-to-hide scandal exposed, those people within the religion do not dare stand up to speak for him, because jumping out now would be equivalent to declaring that he too had taken a share from Jiang Chaozong's hands. Now he is truly isolated and without aid inside the entire New Religion of Salvation. What is even more headache-inducing still lies ahead——Gong Xinzhan has gathered a group of people demanding that he explain the matter clearly, and plans to open the sand and ask the spirits in the Lu zu Pavilion to impeach him from his office as presiding master of the Affairs Institute. Recently some tabloid reporters have also moved at the scent. If this matter is finally exposed in society, the New Religion of Salvation will inevitably push him out as a sacrifice to preserve its overall image. This time he is truly going to bleed badly, thanks to this crowd of petty men who only know how to throw stones at someone who has fallen into a well."
  QIE_ws_leader.14.a: "I should have shared a portion with them earlier."
  QIE_ws_leader.15.t: "The Return of Li Sihao"
  QIE_ws_leader.15.desc: "Because the current power struggle inside the religion is still continuing, Jiang and Wu both refuse to yield, each displaying their abilities and planning to bring down the other. In substance, the top political structure of the entire Beijing is empty. Still, Jiang Chaozong has some sense. He has opened every convenient door for Gong Xinzhan, telling him that for disaster relief he may freely withdraw funds from the accounts of both the religion and the government. But to improve the paralyzed administrative mechanism, Gong Xinzhan has still taken the lead in forming a temporary committee of four members of the New Religion of Salvation.\n\n“We lack everything right now, ” Gong Xinzhan once again repeated words he had emphasized many times these past few days to these practical men, “as you all know, Zhixuan and Huiji are now fighting tooth and nail for the throne of Beijing. I fear that those able to settle the Beijing chaos are only we who sit here. I have gathered you today precisely to ask everyone to offer plans, to think together about how this matter can be solved.” Hearing this, the others began to state their own opinions: some said they should forcibly collect social responsibility fees from wealthy men in society；some said they should run the printing presses until sparks flew and print money in huge quantities to get through the crisis；others proposed digging open Empress Dowager Cixi's tomb and borrowing money from the Old Buddha——all wild and fanciful ideas that, if carried out, would probably damage the foundation of the New Religion of Salvation's rule.\n\n“Why do we not revive the old Beijing Charity Bank? ” This suggestion ran through Gong Xinzhan from top to bottom. He truly had not thought of it before——this had been designed for the New Religion of Salvation by Li Sihao, then Finance Minister, when the Duan Qirui government still held Beijing, with the purpose of using credit and finance to utilize social funds and obtaining continuous operating funds from net interest spreads and non-interest income. Yet the Duan Qirui government fell because of the Zhili-Anhui War, and Li Sihao was also wanted by the Zhili clique. He then drifted between Hunan and Fengtian, and currently still resided in the Tianjin area of the Legation Cities. “Of course we can, and it is a good strategy.” Gong Xinzhan's eyes shone. “Since we have already taken power, why not revoke his arrest warrant——and let this founder return to continue his work? ”"
  QIE_ws_leader.15.a: "The resurrection of the Anhui clique government? "
  QIE_ws_leader.16.t: "Li Sihao Has Returned to Beijing"
  QIE_ws_leader.16.desc: "We have received news that the arrest warrant for Li Sihao, former Anhui clique government official, Finance Minister, Salt Administration supervisor, and president of the Currency Bureau, has been revoked, and he has now returned to Beijing. Since the defeat of the Anhui clique, he has drifted among Fengtian, Hunan, and the Legation Cities, never able to return to the Beijing political arena.\n\nHis return seems to be for solving the disaster-relief problem currently faced by the New Religion of Salvation, because the person who revoked his arrest warrant was Gong Xinzhan. To ensure that disaster relief work proceeds in an orderly and efficient fashion, Gong Xinzhan has already organized a provisional committee of four members of the New Religion of Salvation inside the government. With Li Sihao returning to Beijing, this committee has effectively expanded to five people. Such naked faction-building ought to be condemned, but considering that only they are currently handling the relevant problems, the handling of this matter may be postponed for now.\n\nUnder Li Sihao's direction, the New Religion of Salvation's “Beijing Charity Relief Bank” from more than ten years ago has already resumed operations, and is absorbing idle funds from society for the relevant work."
  QIE_ws_leader.16.a: "Finance Minister? I do not care about such things."
  QIE_ws_leader.16.b: "What authority does Gong Xinzhan have to do this? "
  QIE_ws_leader.16.c: "Welcome back, old friend."
  QIE_ws_leader.17.t: "Jiang Chaozong Ascends to the Seat of Religious Leader"
  QIE_ws_leader.17.desc: "Since ancient times, there can be only one common lord upon the land of China, and only one dragon chair in the capital——and now this position has fallen into Jiang Chaozong's hands. At the internal regular meeting several days ago, some members gave a report concerning Wu Peifu's earlier “collusion with Japan”: at first it was all warm and tactful formalities. These crafty men, who had struggled in political and religious circles for decades, naturally did not lack such skills. Only after that drawn-out “but” fell did their representative point out that Wu Peifu was currently facing an extremely serious crisis of social credibility. To preserve the New Religion of Salvation's identity as one that “assumes social responsibility”, they hoped Wu Peifu would voluntarily resign his position as religious leader of the New Religion of Salvation, then announce publicly that he would “shut his door and reflect, learning from the pain”. If he did not do so, the religion would likely ask Lü Dongbin through spirit-writing and seek further measures.\n\nOf course, since the wind had already changed direction, throwing stones at someone who had fallen into a well became only natural. They further said that Wu Peifu had long been absent from meetings of the New Religion of Salvation. Though he remained the religious leader in name, in practice he had voluntarily abandoned the position. Some people nominated Gong Xinzhan, who had done quite well in managing the refugee problem recently, to take up the position of religious leader, but he refused. Instead, Gong Xinzhan supported Jiang Chaozong for the position, on the grounds that during these years all matters great and small had been handled by Jiang according to procedure, and by every principle, it was Jiang Chaozong who ought to sit in this seat.\n\nJiang Chaozong had no doubt that he could ascend to the seat of religious leader, and therefore did not attend this meeting at all. Instead, he had the troupe of family performers he had long maintained sing opera for him. When the other attendees came to announce the news to him, these people were performing <Radiance Added to the South Pole> to the accompaniment of silk and bamboo musicians——a piece that had not been staged again since Puyi's restoration in 1927."
  QIE_ws_leader.17.a: "Bow before the dragon carriage, wishing the sage sovereign's virtuous rule to be firm as Qian, "
  QIE_ws_leader.17.b: "Enjoying peace and boundless blessing, governing Chinese and barbarian with robe hanging and crown upright, "
  QIE_ws_leader.17.c: "May the precious throne endure for billions upon billions of years."
  QIE_ws_leader.18.t: "A Desolate Autumn"
  QIE_ws_leader.18.desc: "Wu Peifu did not go to the New Religion of Salvation's regular meeting. He sat in his study, leaning against his wrinkled tiger-skin backrest. He merely sat there.\n\nThe New Religion of Salvation had previously sent a messenger to inform him of the meeting's result: at the meeting, some people suggested he resign his office as religious leader of the New Religion of Salvation and devote himself to reflection. As for the vacant position of religious leader, most people argued it should be held by Jiang Chaozong, who had in substance controlled the sect for these nine years. This result was not unexpected. In the public opinion field of Beijing and even all North China, he had already changed from the strongman who appeared on the cover of America's <Time> magazine and led the Chinese people to “reorder the mountains and rivers” into a petty man whose words and heart did not match. He had once regarded George Washington as his model, yet now it seemed he had lost the chance to establish the same great achievements upon the land of China.\n\nThis news greatly shook Jade Marshal's staff. Li Jichen pointed out that it was clearly Jade Marshal who had brought more than ten years of peace to North China, yet now they wanted to kill the donkey once the millstone was no longer needed. The social situation was still in a state of chaos. So long as Jade Marshal gave the order, he, Li Jichen, would lead Zhili officers and soldiers in an assault on the government and purge those sanctimonious people. Yet he, Wu Peifu, the “strongest man in China”, only raised his hand and stopped him. Launching a military coup in such a period would only further destroy the people's trust in him, and would more firmly confirm the motive of “a conspiracy exposed, then shame turning to rage”.\n\nEven if the coup succeeded, perhaps in life he could rely on overwhelming power to suppress the people's comments. But after a hundred years, after a thousand years, when he had passed away and China still stood upon the earth, what would people call him? \n\nFor precisely this reason, he could not sacrifice the pure reputation of a Confucian general for a moment's advantage today. At least this way, after a hundred years, there might still be scholars and great Confucians to reverse the verdict on him. But after a coup, people would only remember him as a great warlord no different from the others."
  QIE_ws_leader.18.a: "Three men make a tiger in the market；slow soaking dissolves glue and lacquer."
  QIE_ws_leader.19.t: "Wu Peifu Ascends to the Seat of Religious Leader"
  QIE_ws_leader.19.desc: "What is the difference between a gentleman and a ruler? For Wu Peifu, the latter did not necessarily possess the virtues of the former, and the former did not necessarily possess the power of the latter——he believed that he had long possessed the virtue of a gentleman, and now he had finally obtained the power of a ruler. At the internal regular meeting several days ago, some members gave a report concerning Jiang Chaozong's earlier corruption, as if after long silence and avoidance, the New Religion of Salvation had finally decided to resolve this internal scandal. This was because some meddlesome tabloid reporters had heard rumors from who knew where and begun spreading similar stories everywhere. This was quite unfavorable to the New Religion of Salvation's consistent “charitable” face.\n\nJiang Chaozong was punished. He was still allowed to retain his name on the religion's rolls, but was stripped of his office as presiding master of the Affairs Institute, and from now on would have no right to inquire into or control the religion's funds. According to those who attended the meeting, when the sect announced this matter, Jiang Chaozong, though he tried hard to maintain his bearing, still looked shocked and uneasy. There was also another piece of news: the members headed by Gong Xinzhan, who had been responsible for disaster relief during this period, argued that Wu Peifu should continue to lead the New Religion of Salvation as religious leader. Although Wu Peifu had not attended a meeting of the New Religion of Salvation for nine consecutive years and was only a nominal religious leader, now that he had returned, it was proper for him to again assume the relevant duties.\n\nWu Peifu understood the hidden meaning within. After this period of disaster relief, the people had in fact already accepted the rule of the New Religion of Salvation, and this group headed by Gong Xinzhan wanted to use his prestige in society to further consolidate the position of the New Religion of Salvation——of course he would not refuse. And this time, he could finally make China return to the road it should have taken, back to the traditional path once discarded by the Chinese like tiles and rubble."
  QIE_ws_leader.19.a: "Once Bole knew the long neigh；without dragonlike stride, one dared not move, "
  QIE_ws_leader.19.b: "Soon the flying steed will lead its fellows, crying like a phoenix in the blue-clouded sky."
  QIE_ws_leader.20.t: "Defeat at Weinan"
  QIE_ws_leader.20.desc: "Sitting at the meeting table of the New Religion of Salvation, listening to accusation after accusation against him, Jiang Chaozong felt heaven and earth spin. It was not that he had failed to give them enough benefits, but now these ingrates, in order to sever ties with him, were all pretending one after another to be saints. To protect themselves, this group finally made a unanimous decision——to strip him of his power as presiding master of the Affairs Institute and exclude him from the entire financial system. This meant that from now on, he could only be a marginal figure in the sect. Though it was not impossible for him to rise again, how many years did he still have to use? \n\nJiang Chaozong had begun planning from the New Year of the Rat, attempting to seize power through the chaos in Beijing. Clearly he had been only one step away, yet he was brought down because of “corruption”——a charge that, to most people, did not count as any great matter at all. Everything he had done until now had only made wedding clothes for others. More importantly, this group of petty men, trimming their sails to the wind and bullying the weak once they are strong, after stepping on him, turned around to curry favor with Wu Peifu. They unanimously elected Wu Peifu to return to the position of religious leader, while making no mention at all of his neglect of internal affairs over the past nine years.\n\nThis long regular meeting finally ended. Walking through Beijing's streets, he saw that the countless begging refugees of the past had already been put in order. Passing through the Zhengyangmen arrow tower, he even found a folk opera troupe performing on open ground that had not yet finished. They were performing <The Battle of Jizhou>. The armored martial sheng seized a long spear as if a heavenly general descending to earth: "
  QIE_ws_leader.20.a: "With one lift of my silver spear I chase your life；only by eating your flesh will my heart be satisfied."
  QIE_ws_leader.21.t: "The Dead Return"
  QIE_ws_leader.21.desc: "The regular meeting of the New Religion of Salvation nearly fell out of control: Wu Peifu had been accused in society of having a private secret pact with the Japanese, while Jiang Chaozong had been discovered through internal denunciations to have embezzled charitable funds. The purpose of this meeting was to resolve the problems of these two men. Although every member present knew clearly that all this was the result of the two men's entangled struggle and mutual contest, in the end both of them had suffered defeat. If public opinion were ignored and Wu Peifu continued as religious leader, that would only make the legitimacy of the New Religion of Salvation even worse；if they said nothing about Jiang Chaozong's conduct, then should one hot-blooded straight-talker from the Beijing Mingjing Society let something slip outside one day, the New Religion of Salvation would not even be able to remain a charitable organization.\n\nJade Marshal remained in his study, while Jiang Chaozong had come to the meeting site, wearing an expression as if he wanted to eat everyone alive. At this awkward moment, the first person to break the silence was Gong Xinzhan: \n\n“Since there is presently no progress, allow me to report on recent work.” He cleared his throat and reported to the others on the management of the social crisis——this did not really require much reporting. One only needed to walk into the street and look to know the problem had basically been resolved. For precisely this reason, the new government formed by the New Religion of Salvation had also gained a considerably better reputation within Beijing. Many people also felt that Gong Xinzhan might be able to shoulder the position of religious leader/leader.\n\n“As for the question of religious leadership you are discussing, I have another piece of information to report, ” more than a dozen pairs of eyes looked toward Gong Xinzhan, and Jiang Chaozong also stared fixedly at him. In his eyes there seemed to be a glimmer of hope——as if he thought Gong Xinzhan would speak for him——“I have already, together with four others, consulted Emperor Fuyou at the Yanjing Lu zu Pavilion. The Emperor does not wish to see those of our religion fall into worldliness and sink into glory and wealth. He warns that Wu Peifu or Jiang Chaozong must absolutely not be chosen to hold great power within the religion.” He unfolded two sheets of paper. One bore the original image of the information obtained after opening the sand for spirit-writing, the other was a neatly copied version of the spirit words. “Moved by compassion, the Emperor especially petitioned the Taiyi Patriarch to dispatch the Xiantian Puming Zhenghua Perfected Qian Nengxun to descend and guide us in governing the state by rites and educating people by human relations. Perfected Qian has issued a decree: all great matters must first be asked of Perfected Qian before decisions are made；all small matters shall be decided by the five persons Huiche, Wuzhen, Bidi, Huiyi, and Xuanyi. In addition, the Emperor, mindful of Huiji's and Zhixuan's hard service, specially orders the two of them to assist with all their hearts and perform meritorious service to atone for their crimes.”\n\nNo one could have imagined that Gong Xinzhan could say such words. Qian Nengxun had been Premier of the Beijing Government's cabinet in 1919, and also the first religious leader of the New Religion of Salvation. After his death, members of the religion once asked through spirit-writing and learned that he had ascended to the Purple Palace of Xuandu, receiving the title “Xiantian Puming Zhenghua Perfected One”.\n\nYet facing all this, the first to erupt was Jiang Chaozong: “Are you still fooling around? Qian Nengxun is already dead! ”\n\n“Is Presiding Master Jiang questioning the decree of Emperor Fuyou? Moreover——” Gong Xinzhan looked down upon Jiang Chaozong from above, and a rather interesting sentence suddenly leapt into his mind: "
  QIE_ws_leader.21.a: "Military men are not allowed to curse people."
  QIE_ws_leader.22.t: "The Living Attend, the Perfected One Takes His Seat"
  QIE_ws_leader.22.desc: "Matters are developing in a bizarre direction. Or perhaps every matter since 1936 has been bizarre enough. Under the control of the New Religion of Salvation, at the meeting of the Beijing Government, the person seated in the position of president is not a living man, but a black-and-white photograph. The man in the photograph is Qian Nengxun, Premier in 1919, and also the first religious leader of the New Religion of Salvation. After his death, members of the New Religion of Salvation once held spirit-writing in the Lu zu Pavilion to ask the founders of Confucianism, Buddhism, Taoism, Christianity, and Islam, and received a reply saying that he had transformed into an immortal and would enjoy happiness forever.\n\nBut now, this “immortal” sits in the most honored position at the meeting. Standing to his left is the great meritorious minister of the New Religion of Salvation's seizure of power, General Diwei Jiang Chaozong；standing to his right is the former religious leader who had long not attended meetings of the New Religion of Salvation, General Fuwei Wu Peifu. Without the president's order, neither man dares sit down. But how is a photograph supposed to open its mouth and speak? Only when Gong Xinzhan, Wang Jinqu, and the others come in and begin reading today's agenda are the two men finally able to sit down.\n\nAnd so this long government meeting finally begins……"
  QIE_ws_leader.22.a: "Give greetings to President Qian."
  QIE_ws_leader.23.t: "Drought"
  QIE_ws_leader.23.desc: "Since spring began, not a drop of rain has fallen on the ground. The earth cracked open just like my mouth. I ran over to look, and some seedlings had managed to stand up, growing about a foot high. Everyone set up an incense altar for the Dragon God, and every household went to kowtow three times to the Dragon King. Incense was offered, heads were knocked, and the next morning locusts began flying in, eating even what had barely survived in the fields. After that, everyone packed up, took quilts and such, pulled along a stick, and left. I asked people where they were going, and they all said they did not know——they probably thought I was annoying and would not tell me.\n\nThe night before yesterday, sleeping by the roadside was especially cold. I woke up, then found Grandmother suddenly propping herself up and starting to talk about the end of the world and other frightening things. Later, when we reached outside the city, there was a porridge station. I took a basin to get porridge, and on the way back met a blue-eyed gentleman wearing glasses, holding a foreign box in his hand. He clicked several pictures of me, then told me that many people had starved to death.\n\nI did not understand why he said this——many people starve to death every year；what was he saying this for? After that the gentleman disappeared. I could not understand why he did this, just as I could not understand why everyone was in such a hurry to keep going north."
  QIE_ws_leader.23.a: "I only know that I am hungry."
  QIE_ws_leader.24.t: "Northward"
  QIE_ws_leader.24.desc: "If you ask exactly how Desan ran out, his own memories are already hazy. He only knows that at first, the street he usually worked had become hard to make a move on. When he asked the other wild children he mixed with, it seemed their territories too had gained many armed government soldiers. Some people did not fear those soldiers, and were arrested on the spot, then twisted off to who knew where.\n\nLater, some people in the city said the Red bandits had fought back from the southern mountains；some said Marshal Sun had been killed；others said the government troops opened fire by the river and killed people, and that anyone who wanted to go to Wuhan was killed, that those dog soldiers had all killed until their eyes were red, and so on. At first he did not believe it, after all, how could so many things happen at once? Only when two groups exchanged fire in Hefei in the middle of the night did he become afraid, feel that the earlier rumors were all true, and decide that while he still had time, he should directly cling to a train and leave.\n\nBut where was the train going? He could not read and did not understand. Asking the people clinging to the train with him, some said it was going to Hubei；others cursed them for spouting nonsense, saying the train had long turned north；it was all chaos and impossible to figure out. On the road, there was also a woman who failed to hold her child properly, and the child was rolled into the train wheels. Who told him to be born badly? If he had been born Marshal Sun's young master, he naturally would not have suffered this train calamity.\n\nBut that woman was also very indifferent. People who sit by the street every day know best how to tell whose expression is relaxed, and therefore easy to pickpocket. After this child died, that woman had the kind of state that made a purse easy to steal.\n\nIn the end, they were probably thrown somewhere in the north. This place looked much the same as Hefei. Perhaps all cities under Heaven look much the same: one area has tall buildings and well-dressed people, and around it are low houses and a group of children about his age. Thinking of this, he still had to go pay respects to the local boss, otherwise working on someone else's territory would definitely earn him a beating."
  QIE_ws_leader.24.a: "Return to the old trade."
  QIE_ws_leader.25.t: "To the Capital"
  QIE_ws_leader.25.desc: "After asking around for a while, Desan learned that he had arrived in Xinyang. As for finding a boss here to keep following, that idea also came to nothing——he paid respects to several bosses, but all felt that this Hefei pickpocket spoke with too strong an entering tone, and they could not understand what he was saying. On top of that, more and more people were doing this trade in Xinyang, and with too many monks and too little gruel, in the end there would inevitably be several fights over territory.\n\nRather than that, it would be better to keep going north. Desan heard people say that in the capital, the emperor had shot the great warlord Cao Kun——a warlord, that is, a street boss who makes his way in this world, leads more people, and can carry a gun——and that the emperor was having a group of great philanthropists distribute grain to people from the eight provinces. Anyone who went could drink hot porridge, and they would even take care of sleeping arrangements. If you had never studied, they would also manage your schooling and teach foreign words. He did not really understand the benefits of studying, only that the well-dressed rich people all studied and could speak foreigner language, so he did not much doubt that if one studied, one could become a rich person.\n\nSo, he kept clinging to trains whose engines faced north. As for clinging to trains, he had already become skilled at it. First, do not stay too long；if you freeze stiff in the middle of the night and your hands have no grip, you will definitely fall from the roof of the carriage. Second, when jumping off, jump in the direction of travel, pick your landing point carefully, and after landing, use the momentum to run a few more steps. This second point he learned from a “train-clinging master”. Unfortunately, when that master jumped off near Zhili, his foot caught on something, and his leg bone looked like a snapped corn stalk, or like a valuable jade bracelet smashed to pieces. He howled in pain the whole time. He probably committed some heaven-offending wrong in his previous life, and had to repay the debt like this in this one."
  QIE_ws_leader.25.a: "Men miss with their hands, horses stumble with their hooves."
  QIE_ws_leader.26.t: "Safe——"
  QIE_ws_leader.26.desc: "Fuck, Beijing is the best city under China's Heaven. Long before entering the city, one could see long queues of people holding their ancestral pots and basins to receive porridge. Some rotten old man sat on the yellow dirt road with his legs spread, sucking it mouthful by mouthful with his toothless mouth, as if, so long as the sound he made was loud enough, the meal counted as more food swallowed. After Desan arrived here, he stopped doing street business. Every day he just squeezed into the sheds, went out at the appointed time to drink porridge, and occasionally did some handicraft work. Someone would come to collect it and pay wages. At night, someone would ask him whether he wanted to go to night school. Night school taught literacy, arithmetic, and the strokes of foreign words.\n\nBut studying really is torment, probably the most unbearable torture in the world. Back then, how did King Zhou think of cutting out Bigan's heart, rather than making him read and study? "
  QIE_ws_leader.26.a: "As if entering a fairyland……"
  QIE_ws_leader.27.t: "Under Stars and Moon"
  QIE_ws_leader.27.desc: "“How much did you get to eat today? ” Seeing the thick-necked man come in, Desan immediately went up and asked.\n\nThe man glanced down at him, then snorted hard through his nose: “Damn it, could it be any different from you? ” Then he gave a short grunt, found a corner of the shed, and lay down.\n\nDuring the first week after arriving, a thick layer of rice could still settle at the bottom of the porridge. Then it grew thinner and thinner, and now it had become like muddy soup. It seemed all good days under Heaven eventually come to an end.\n\nA newspaper gentleman who came out from the city looked at it and said this was because those officials in the government discovered the refugees were eating better than employed workers, and their hearts immediately filled with compassion for laborers, so they cut relief for the refugees.\n\nHowever, the night school still continued as usual, and the number of people seemed to grow, with ages getting older and older too. Desan simply did not much love studying, and besides, if there was no food to eat, he feared he would starve to death before he ever studied his way into being a rich man.\n\nA few days later, a man wearing a foreign suit and tied with a foreign rope came. He was probably a government official, roughly the strategist under the boss, or the sort who delivers messages. This strategist smiled stiffly and spoke to them about “policy” and “morality”. The general meaning was: some people had received porridge these past few weeks, drank it, then slept, resting all day, which was a manifestation of laziness. The government could not encourage the habit of getting something without labor, so starting today, the porridge stations would be cancelled. From now on, one had to work for a certain length of time before there would be food；otherwise, one could only go hungry.\n\nThe work arrangement was that one group worked from eight in the morning to eight at night, then ate and slept；another group worked from eight at night to eight in the morning, then ate and slept during the day. This upside-down arrangement made some people complain, but without work there was no food, so in the end everyone had to accept it. For Desan, however, this happened to give him an excuse to skip night school."
  QIE_ws_leader.27.a: "“In ancient times there were those who would not eat food given with contempt；gentlemen, do you not feel ashamed? ”"
  QIE_ws_leader.28.t: "As If Without End"
  QIE_ws_leader.28.desc: "“How much did you get to eat today? ” Seeing the thick-necked man come in, Desan immediately went up and asked.\n\nThe man glanced down at him, then snorted hard through his nose: “Damn it, could it be any different from you? ” Then he gave a short grunt, found a corner of the shed, and lay down.\n\nDuring the first week after arriving, a thick layer of rice could still settle at the bottom of the porridge. Then it grew thinner and thinner, and now it had become like muddy soup. It seemed all good days under Heaven eventually come to an end.\n\nA newspaper gentleman who came out from the city looked at it and said this was because those officials in the government discovered the refugees were eating better than employed workers, and their hearts immediately filled with compassion for laborers, so they cut relief for the refugees.\n\nHowever, the night school still continued as usual, and the number of people seemed to grow, with ages getting older and older too. Desan simply did not much love studying, and besides, if there was no food to eat, he feared he would starve to death before he ever studied his way into being a rich man.\n\nA few days later, a man wearing a foreign suit and tied with a foreign rope came. He was probably a government official, roughly the strategist under the boss, or the sort who delivers messages. This strategist smiled stiffly and spoke to them about “policy” and “morality”. The general meaning was: some people had received porridge these past few weeks, drank it, then slept, resting all day, which was a manifestation of laziness. The government could not encourage the habit of getting something without labor, so starting today, the porridge stations would be cancelled. From now on, everyone had to work every day. As for how long, that was not fixed, and depended on the day's plan. Only after completing the planned quota for that day would there be food；otherwise, one could only go hungry.\n\nWhen they heard that they would be allowed to eat only after finishing the work, and that how much work there was would not be known beforehand, the crowd became restless. No one could guarantee they would finish on time.\n\n“Damn it, if I work a whole day and night and still have not finished, does that mean I just go hungry for a day? ” A rough and deep voice came from the crowd, and after saying this, he snorted through his nose. As for the smiling government official, he nodded and said that was basically the case. But if one finished on time, there would always be food；if one did not work, there would certainly be no food. In the end everyone had to accept it. For Desan, however, this happened to give him an excuse to skip night school."
  QIE_ws_leader.28.a: "“The people's livelihood lies in diligence；with diligence there is no want. Labor the body to cultivate virtue, endure hunger to make righteousness clear.”"
  QIE_ws_leader.29.t: "Great Development"
  QIE_ws_leader.29.desc: "A few months ago, he had still been lying in a shed, sucking relief porridge. But today, he had come here and sold himself to this desolate place for a mouthful of food. It had rained last night, and this ditch had become a mud pit half mud and half water.\n\nHe used all his strength to drive the shovel hard into the thick wet earth, then took a deep breath, and with the strength he had just recovered, lifted the soil and threw it outside the ditch. The soil, soaked full of rainwater, had become heavy mud, causing every movement to consume enormous strength, while what he had eaten before was no more than a steamed bun and some rice soup. But he could not stop the movement of his hands, because once the overseer discovered it, he feared that even the bun and rice soup would be taken away. More importantly, much of the hard-earned money originally meant to be handed to him would also be deducted.\n\nHalf of his bare feet had already sunk into the ditch. He was nailed there, unable to move, and with every dig of his own, he sank a little further down——this deep ditch was like a mysterious monster, gripping his feet tightly, and with every struggle swallowing him one bit more. This ditch, so long it vanished at the end of the horizon, had been dug out by the combined labor of who knew how many people like him. What kind of new road it would eventually become, he still could not imagine. Only that road surely would not be a muddy road, covered in muddy water, gradually sinking downward.\n\nWhen those refugees responsible for replacing the soil with sand and gravel arrived, he, and many others like him, had no choice but to leave for another place, to find the next deep ditch that would swallow their legs."
  QIE_ws_leader.29.a: "Work relief is beginning to show results."
  QIE_ws_leader.30.t: "Owen Lattimore's Visit"
  QIE_ws_leader.30.desc: "The Foreign Affairs Department has received news that an American scholar long active in the study of North China, Manchuria-Mongolia, and Xinjiang frontiers, Owen Lattimore, will soon visit Beijing. Lattimore is enthusiastic about Chinese history and social research. During the Sun Wen party rebellion of 1926, he set out from Beijing for Guihua and eventually reached Urumqi. After the end of the three Zhili-Fengtian Wars, he also went to the Rehe Province region to study the history of the Manchu and Mongol peoples. Receiving such an ethnologist and frontier scholar well would bring us every benefit and no harm. Perhaps we can learn from Lattimore about the Fengtian puppet government's ethnic policies and transport conditions beyond the pass, and then infer the movements of their local military and political authorities. We can also show the world the image of [ROOT.GetName] actively trying to integrate with them, winning more goodwill from foreign governments."
  QIE_ws_leader.30.a: "Let us welcome our international friend! "
  QIE_ws_leader.30.b: "A mere scholar is not worth treating this way."
  QIE_ws_leader.31.t: "Midnight"
  QIE_ws_leader.31.desc: "Cold, hungry, and still wasteland. Everyone continued north for some time. I heard the leaders say we were nearly out of Sichuan. The adults also said that if we passed through the forest before us, then crossed over a stretch of mountains, we would reach the riverbank. Once we crossed the river, there would be grain to eat. Many people took knives and cut bark from the trees to cook and eat. I ate it too. It tasted bad, but at least I was not hungry for the moment. Another thing that happened on the road was that Yu'er and her family slept too carelessly one night. They actually all slept like the dead, and when they woke, they found that everything they had brought from home had been rolled away by someone unknown. In this long column moving north, there were not only acquaintances but many strangers, and people disappeared every day. No one had any way to know who had done it, so they could only urge them not to worry.\n\nFortunately, after walking a while more, we met a group of kind-hearted gentlemen. After what seemed like some negotiation, they found work for Yu'er. That group of gentlemen paid her parents four yuan. I suppose it was probably the first month's wages paid in advance, or something like that. And so Yu'er went off to work, while her family continued taking the three younger brothers north with the column. Strangely, Yu'er had a place to rest, but her parents did not seem very happy."
  QIE_ws_leader.31.a: "But why are they not happy about this? "
  QIE_ws_leader.32.t: "Mud"
  QIE_ws_leader.32.desc: "When we reached the riverbank, my father buried Grandmother.\n\nDuring those days eating bark in the forest, her health was already poor. I think the food was too bitter and made her sick. When we reached the riverbank, she died. Everyone was very sad, but not in pain. Since no one was in pain, I was not in pain either.\n\nBesides, we had already reached the riverbank. Once we got to the other side, we could enter the city, and once we entered the city there would be food. I once heard an uncle who used to live across the river say that the city girls studying in schools did not do proper things during the day, only singing, playing ball, and spending money. The money they used in one year could buy sixteen water buffaloes. In school, men and women attended class together, and once familiar, they casually slept with men. They called this freedom. But that uncle went mad after he became separated from his wife on the road, so he could not tell any more stories about the city.\n\nThe river water was very, very swift. Everyone was waiting for boats that could ferry us across, so we camped here for the day. At night, many large boats came from the other side of the river, shining very, very bright lights back and forth toward the shore, waking everyone. From the river, faint shouts could be heard. At first everyone was still cursing, but suddenly they stopped speaking.\n\nThese must be government or high officials' boats coming to pick us up——"
  QIE_ws_leader.32.a: "So I stand here."
  QIE_ws_leader.33.t: "Dispatch from Bazhong"
  QIE_ws_leader.33.desc: "<Xinmin Daily> report\n\nThe poor peasant couple Zeng Mingguo of the First District of Bazhong County cooked and ate human flesh to stave off hunger. They were recently arrested and interrogated by the county government. According to the joint statement of Zeng Mingguo and his wife Liu: \n\nThey are from Jinbaozhai, aged 50, with one young son and one young daughter, and rent mountain land from a family surnamed Zhang for cultivation. There has been no rain for half a year, no green grass in the wild, and corpses of the starved lie along the roads. My family had no choice but to beg from door to door, never getting a full meal, tormented by hunger and cold and waiting faintly for death. Seeing among beggars who had starved to death by the roadside two small children surnamed Bai, we thought of the saying from former times that in famine years people ate people. That night we took them back to the house, removed intestines, stomachs, heads, and bones, and cooked the flesh as food, using it to fill our hungry bellies.\n\nA few days later, a child surnamed Zhang starved to death. We again took the body back and cooked and ate it in the same way. Later, as the year drew to its end, we secretly saw that a family surnamed Lai had buried a little girl who had already died. I dug her up one time after another, again prepared her in the same fashion, stored her in two buckets, and kept it for the needs of passing the New Year, when suddenly the tuanzheng discovered it. He said I had eaten living children and sent me here for trial. My livelihood had truly been cut off, and I had no way out, so I secretly ate dead bodies. Please investigate and show mercy, and so on.\n\nThe county government, considering that they were driven by hunger and cold, also feels much pity. However, as four children were cooked and eaten before and after, whether they were eaten while on the verge of death, or dead bodies were stolen and cooked, will be handled after officials are sent to investigate the truth.\n\n\n\nThe lower page includes <Illustration of Zeng Mingguo Eating Human Flesh from Hunger>."
  QIE_ws_leader.33.a: "This is not the disaster of one county, but a sign of the final kalpa."
  QIE_ws_leader.34.t: "A Toiling Fate"
  QIE_ws_leader.34.desc: "Desan still found a chance to run away. He abandoned the handcart those respectable people in the government had issued to him and ran.\n\nFrom south to north, from Hefei to Beijing, from dead alleys full of the stink of urine and filth to sheds, and finally to some godforsaken rural place in Zhili Province. In the end, he discovered that he seemed to hate this kind of life——even more than he hated Marshal Sun, Marshal Chen, or even Marshals Zhou, Wu, Zheng, and Wang. So he ran. Taking advantage of a deep night when no one noticed, he picked up his two legs, crossed the grassland that reached his knees, and jogged all the way. At first he did not know where he should go, but he soon remembered that night school had previously taught him how to look at stars and judge direction——if he had stayed in night school a while longer, he might even have learned how to look at stars and directly tell where Hefei or Beijing was.\n\nHeaven had always favored him, he thought. Heaven used the stars to guide him, letting him run to a city not as grand as Beijing. As for the people in Beijing who said Heaven had sent those people to govern China, that proved Heaven was a bastard. The two matters had to be counted separately；at least right now he was still rather grateful.\n\nIn short, he again took up what he had once done in Hefei. In an unfamiliar place, one only had to kowtow twice to the local boss and become a little brother. Because he had experience, he quickly again became a small leader, taking along a boy from Sichuan. After this journey, Desan was certain that in this life he was destined to be a pickpocket. As for studying, making a fortune, and becoming a young master, those could be left to the next life after reincarnation.\n\nThinking of this, he lay down contentedly by the street and slept loudly."
  QIE_ws_leader.34.a: "Sleep peacefully in a prosperous and beautiful dream."
  QIE_ws_leader.35.t: "Wedding Candles in the Bridal Chamber"
  QIE_ws_leader.35.desc: "“Master, that woman refuses, and keeps trying to kill herself. Several of us held her down.” Zhang the Good Man was still unable to understand why, on this wedding night, the bride had still not come out from the rear room. The old servant of the household went there and brought back this news.\n\nThis made Zhang the Good Man extremely anxious. One must know that this wife was someone he had spent nine yuan to “marry” back for his son from that man. Why, just before bowing in the wedding ceremony, was she crying and trying to die here? Besides, it had been agreed at the time as an “absolute sale”: after the betrothal money was paid, there would be no redemption and no return of goods. Though Zhang the Good Man could not compare with the county magistrate of Xiajin County, he still had a voice in the entire village and even the town. Although the few tables of wine and food prepared today were simple, all who came were familiar guests. If, through some carelessness, rumors spread that he could not manage his daughter-in-law, then he would truly lose great face among the villagers.\n\nThinking of this, he no longer cared about sage teachings such as “those who love others will always be loved by others”. After all, had not the sages also said “women and petty men are hard to raise”? He went straight in three steps taken as two, entered the rear room, passed through a crowd of useless maidservants who only knew how to cry “aiya, aiya” and crane their heads to watch, and raised his hand to give that foolish woman, who did not understand the larger situation and had ruined his face, two slaps. Afterwards, he ordered the servants to tidy her up properly and change her into red clothes suitable for today's joyful occasion——of course, they must not forget to stuff her mouth, so that no matter what, she would not shout and scream in the front courtyard.\n\nSince everything had been handled, two maidservants supported her, one on the left and one on the right, and brought her to the front courtyard. At this moment, this wedding ceremony, which made the entire family happy, could finally begin with proper dignity."
  QIE_ws_leader.35.a: "Congratulations, Young Master Zhang, on your joyous wedding! "
  QIE_ws_leader.36.t: "The Teahouse"
  QIE_ws_leader.36.desc: "Whenever rickshaw pullers could not find passengers, most of them had to look for other ways to pass their idle time. Though the curbside was free, it inevitably dug into one's bones；a teahouse was a better choice for resting one's feet, with seats, water to quench thirst, and people to relieve boredom.\n\n“Fifty-two! ” The old rickshaw puller raised his right hand before his face, extended five fingers, and answered the young rickshaw puller who had asked his age, “I am fifty-two this year, and I still do not know how many more years I can pull! ”\n\n“I am almost forty too. To tell you the truth, pulling one month means one month, pulling one year means one year；it is all just making do. There are still little ones at home to raise, so I can only hope these legs hold out a few more years.” The old rickshaw puller sipped some water and continued, “My son, though, is quite promising. Yoho! He is a soldier, a military gentleman! ”\n\nThis fatigue-relieving chat could involve comparison, and could also take one thread and expand into many other topics. While praising the old rickshaw puller's son as promising, the young rickshaw puller caught a keyword and shifted to another topic: “You know this foreigner, the one Wu Peifu always worships, called Hua Shengdoo or something, how mighty and awe-inspiring he was! America's emperor! Qin Shi Huang! ” At this, he planted one foot on the bench, as if boasting of his own achievements, “He beat everyone else all along the way until they threw away helmets and armor. And what happened? He cared only about fighting wars, did not have a single son, and in the end the imperial throne fell into someone else's hands.”\n\n“That is called a republic, they have no emperor anymore! And his name is not Hua Shengdoo, it is Washington.” In the teahouse, a sharp voice with laughter in it sounded, rather as if mocking the young rickshaw puller for his ignorance, but the puller did not care at all. “Yes, yes, you old gentleman are experienced and knowledgeable! You advised them on the republic! ” He turned his head and said to the old rickshaw puller again: “What I am saying is, look how powerful this Shengdoo was, yet when he died no one carried on his line. Isn't that dying without descendants? Dead, and nothing left behind. Not like you, old sir, with such a promising son.” The old rickshaw puller nodded, seeming to greatly approve of this flattery."
  QIE_ws_leader.36.a: "Right! No matter how powerful these foreigners are, they still die without descendants, don't they~"
  QIE_ws_leader.37.t: "Imported Cutting-Edge Surgery"
  QIE_ws_leader.37.desc: "Beijing dispatch from this newspaper\n\nIt has recently been heard that Peking Union Medical College Hospital performed a new Western medical procedure at the beginning of this week. The technique was precise, the arrangements thorough, and it may be called quite successful. This procedure has long been valued by European and American medical circles. Now that it has been personally performed by physicians of our country, it is sufficient proof that the techniques of new medicine are not monopolized by Westerners, and also constitute one aspect of progress in our country's medicine. Many in society who heard of it also believed that the daily progress of our country's new medicine now has evidence, and it is indeed enough to increase the confidence of our countrymen.\n\nAccording to persons in medical circles, this procedure is applied to those who have long shown tendencies toward violence, impulsiveness, rash action, and injuring others. Such patients are often perverse in temperament, readily violent, leaving family members helpless and neighbors alarmed. After treatment by the new procedure, their restless and deluded qi can often gradually become calm, and their fierce and violent nature can also somewhat return to submission, so that they no longer easily harm others. In this way they may perhaps return to society, be spared from becoming a worry to the family, and also be spared from becoming a burden to the state. The benefit here is truly not small.\n\nUpon investigation, this procedure was created in 1935 by the Portuguese physician António Egas Moniz, and is called the new procedure of prefrontal leucotomy. Since its appearance, European and American medical circles have paid considerable attention, and various American hospitals have also successively tried it, regarding it as a new path in psychiatric treatment.\n\nIn recent years, social customs have declined. Hooligans, ruffians, and repeat offenders who never reform disturb the marketplaces, and good citizens have long suffered from them. If the government considers public security and the people's peace, then for social offenders stubborn by nature and repeatedly harmful, it may carefully consult this new method from medical circles, removing the root of their violence and transforming those who harm the group back into order. For the state and the people, this would truly not be without benefit.\n\nOf course, the implementation of the new procedure concerns the human body and cannot be rash. Whether treatment is administered must involve the refined judgment of physicians, the careful consultation of family members and public opinion, and strict supervision by authorities, so as to avoid abuse. Yet giving up eating for fear of choking is also not what a progressive nation should do. The reason Europe and America can change with each passing day lies precisely in daring to experiment and daring to take responsibility；if our country today wishes to shake off weakness and seek strength, it too must break the habits of clinging to precedent and timidity, and with new knowledge and new techniques beneficial to livelihood and public security, choose the good and follow it, proceeding carefully."
  QIE_ws_leader.37.a: "Another advance for our country's medicine! "
  QIE_ws_leader.38.t: "Old Morality Need Not All Be Burned"
  QIE_ws_leader.38.desc: "Over the past several weeks, the government has frequently invited newspaper chief writers, doctors, chamber of commerce representatives, and university instructors to participate in various closed-door discussions. <New Voice Daily> recently published an editorial advocating an easing of the current tension between intellectuals and government policy. An excerpt from the editorial follows: \n\nIn modern times, whenever new-school arguments touch upon Confucius and Mencius, they gnash their teeth and knit their brows, as if seeing enemies；whenever they hear of rites and righteousness, they immediately suspect it to be the first sign of restored ancient despotism. This indignation is certainly not without cause. For thousands of years, bureaucrats and gentry used the Three Bonds and Five Constants to prey upon the common people；patriarchal and clan authority borrowed the words of sages to fetter women and youth. As for the lingering poison of these old ritual teachings, this newspaper has never concealed it for them, and absolutely does not speak in their favor.\n\nBut then, are the books of Confucius and Mencius truly so worthless that they must all be consigned to Qin's fires? We believe this argument is also somewhat excessive. What is hateful in old culture lies in the stubborn faction using it as iron chains to bind the people；yet the formation of iron chains does not necessarily prove that the material itself is entirely poison. Confucius said: “What you do not desire for yourself, do not impose upon others.” Mencius said: “The people are precious, the ruler is light.” Although these cannot be immediately called modern democracy, within them there was never entirely absent sympathy for the people's suffering and restraint upon power.\n\nWhat we oppose is casting Confucius and Mencius into golden statues and forcing all under Heaven to kneel and worship；what we reject is likewise painting all ancient books with ghost faces, as if fearing people will not spit upon them. The construction of a new society certainly requires science, requires equality, requires democracy；yet it also requires a spiritual foundation capable of persuading the majority of the people.\n\nThus this newspaper's position is very clear: take its benevolence and righteousness, remove its despotism；take its people-as-foundation and advance it into democracy；take its self-cultivation and transform it into civic responsibility. The ancient Way certainly cannot be honored as today's constitution, but neither need it all be thrown into the wastepaper basket. Today's progressives should seize back the right to interpret ancient books, so that Confucius and Mencius no longer remain monopolized by the stubborn faction, and can contribute what usable strength they still have to the construction of a new society."
  QIE_ws_leader.38.a: "At least they can read the direction of the wind；let them publish it more widely."
  QIE_ws_leader.39.t: "Suspicious Immortal Pills"
  QIE_ws_leader.39.desc: "“Damn it, kid, do you even know how to eat? ” Old Six reached out and slapped Xiaoqingzi on the back, though this was entirely horseplay among acquaintances, with no malice in it. “After all these years, I have become a senior disciple too.” After saying this, he put this week's “immortal pill” into his mouth, did not chew, and swallowed it straight into his belly.\n\nA few weeks ago, a cavalryman came to the village and conveyed the government's order: every village was to organize a militia unit to “protect temples, ancestral shrines, and Chinese tradition”. Each militia unit would receive some subsidies from the government. This money immediately made the village gentry, militia heads, and temple managers enthusiastic, greatly mobilizing the enthusiasm of various places to organize.\n\nFor these older people in the Zhili region, the same unease as during the old “Boxer” period arose in their hearts；for those young people who, apart from working in the fields, had nothing to do, this simply meant an interesting activity.\n\nWhat was even more interesting was that the government now began distributing some “immortal pills”. It was said that eating them could strengthen the body, increase power. They were slightly reddish Chinese medicinal pills mixed with some talisman ash, unexpectedly bitter, covering all other odors. So they had already learned how to eat them——do not chew in the mouth, just swallow directly. Xiaoqingzi had never eaten anything that could make him so incredibly strong and full of energy. After eating it, even plowing the fields gave him more strength. Its effects far exceeded the version he had heard about from the “senior disciples” of the old Boxers. There was only one small side effect: the next day, his head ached a little and he had no strength, but that was probably because he had done too much the previous day. As for Old Six, after eating it, he would become much quieter the next day；for him it seemed more like a calming medicine."
  QIE_ws_leader.39.a: "Once the immortal pill enters the belly, swords and spears cannot pierce."
  QIE_ws_leader.40.t: "Set the Apricot Altar in the Army"
  QIE_ws_leader.40.desc: "Just as we expected, after the scripture and doctrine inspectors entered the army, the soldiers immediately realized that this was not a “suggestion”, but an “order”.\n\nWe have ensured that every battalion has an inspector dispatched by the New Religion of Salvation responsible for supervising the implementation of the relevant work. Their work within the army has also unfolded as expected——on one hand, weekly ideological education；on the other, monthly self-examination meetings and post-meeting reflections. The problem we currently encounter remains a systemic one——the education level of many soldiers is insufficient for effective study, causing inspectors in some battalions to have to change post-meeting reflections into oral submissions, which wastes a great deal of time；on the other hand, some soldiers cannot accurately understand the subtle meanings within scripture, rites, and doctrine. At the present stage, these inspectors are trying as much as possible to explain them simply as loyalty to superiors, trust in comrades, and love of country. But if we wish to carry out broader ritual education within the army, additional literacy classes and cultural courses will be necessary, and this duty will in the future be performed by the scripture and doctrine inspectors."
  QIE_ws_leader.40.a: "Step by step, slowly."
  QIE_ws_leader.41.t: "A New Factory"
  QIE_ws_leader.41.desc: "He wiped his sweat, threw the shovel aside, leaned against the base of the earthen wall, and gasped for breath. His work could be counted as finished. The cement had been stirred so evenly that it could be said to meet the requirements very well, so perhaps by the end of the month he could receive a few extra jiao in praise money. He raised his head to look for his wife. She should be somewhere pushing sand and soil——“Hiss……” the splashed cement bit painfully into his hand——perhaps in just that moment when he closed his eyes from the pain, she appeared and vanished quickly? \n\nBut even if the two of them sold their strength together, earning half a yuan to one yuan in wages, they still could not fill the debt that turned day after day. And part of this money also had to go to eating, gambling, and smoking. How could all of it go to repaying debt? \n\nThe night shed was a time of rest belonging only to these people. The sheds were separate from one another, so in the end he still mustered the courage to tell her about it: he had decided to lend her to the local Chen family. It had already been agreed. She would only be lent for four years, for fifty yuan. If during the loan period she bore a son, she could return after three years——of course, the child would naturally remain with the Chen family——and she could also bring back another ten yuan as celebration money. This money would not only fill the family's debt, but leave a large sum besides, so that four years later they would no longer live such bitter days.\n\nSince he had laid everything bare, his wife only trembled and asked: “Why did you not tell me about this earlier? ” And he could only answer truthfully: “Last week I held the shovel and circled three times in front of you, but I could not say it. But after thinking carefully, other than making a matter of your body, there truly is no other way.”\n\nAs for another shed very close by, the temporary wooden window pieced together there creaked and swayed. Several workers were playing dou hunjiang while chatting aimlessly. “Have you heard who this factory is for? ” “What, could it be for you? ” “I heard them say it is the Jicheng Three Acids Factory, making explosives. I am telling you this, ” the man took a hard drag of his hand-rolled cigarette, “this factory has all kinds of requirements, and a pile of small factories too. Brothers, I am afraid we will be building here for four or five years.”"
  QIE_ws_leader.41.a: "Like gestating an infant."
  QIE_ws_leader.42.t: "Chemical Fertilizer"
  QIE_ws_leader.42.desc: "News of “achievements in refugee management” from various places has been sent back to Beijing. Many local industrialists have thanked [ROOT.GetName] for the subsidies and cheap labor provided to them. Even more enterprises that had initially been watching from the sidelines have begun contacting our Finance Department to seek entry. A celebration banquet for the smooth development and abundant results of this policy was thus held at Dongxinglou Restaurant.\n\n“This is basically the model of our ally, Germany.” The speaker looked very proud, raising his cup toward the few Prosperity League members sitting in the corner. Although the New Religion of Salvation had repeatedly shown goodwill to these pro-German lobbying groups since coming to power, these German lobbyists seemed to have seen a plague god and repeatedly refused the government's overtures. To ease the embarrassment, he paused and continued: “Our method is, on one hand, to have these peasants redeem and purchase land；on the other, to mobilize local landlords and gentry. They have huge amounts of grain, huge amounts of money. It is all sitting in their warehouses. Buying one bag of subsidized fertilizer can produce three times the previous grain, and dismiss twelve long-term farmhands. These long-term farmhands then naturally flow into urban factories, or become part of our vast construction army.”\n\nAt this point, he took a crumpled sheet of paper from the pocket of his formalwear, “This is fertilizer produced by Yongli Chemical under Mr. Fan Xudong's direction. It is Chinese people's own fertilizer. Thanks to the technical assistance of our German friends. Mr. Fan has reached an agreement with us. Because of the increasingly severe social conditions in East China, we have decided to help him establish a new Yongli Chemical plant in Zhili, and those former agricultural workers who come to build factories because of fertilizer will bring still more agricultural workers through the construction of fertilizer factories.”\n\n“What we are doing is not the land revolution that the Sun Wen party people are carrying out, but land improvement that can truly benefit this country's strength.”"
  QIE_ws_leader.42.a: "The sage is not humane；he treats the people as straw dogs."
  QIE_ws_leader.43.t: "The Opening of the 714 Research Institute"
  QIE_ws_leader.43.desc: "Although our country has long had several arsenals and military repair organs, it has lacked a research institution specifically responsible for testing, improving, and developing ordnance technology. Lin Jianzhang proposed to the government that such a research institute should be established to develop military technology. After some discussion, [QIE.GetLeader] finally decided to locate it in Luoyang. Because Lin Jianzhang's proposal was dated July 14, it was named the 714 Research Institute. There were two main considerations. First, as a military-industrial research institute, it should choose a place with a complete military-industrial system, which meant choosing only between Luoyang and Baoding；second, the government did not want to see the Baoding area dominate alone. We already have the Baoding Army Officer Academy. If the institute were also established there, it might break the balance. We can use this opportunity to strike at the Baoding military education circle headed by Jiang Baili. Although the current scale of the institute is small, if one day we unify the whole country, this little military research institute may grow into a giant……"
  QIE_ws_leader.43.a: "Founded in rough form today, made into a useful vessel tomorrow."
  QIE_ws_leader.44.t: "The Blood Sea to End All Blood Seas"
  QIE_ws_leader.44.desc: "When human desire is blocked by evil, it cannot flow. When it does not flow, it falls；therefore this is called sinking. Human evil is abundant, and Heaven and Earth are ruined, all because emptiness is not realized, and one does not cultivate the mystery oneself. (Chapter Seven, On Mysterious Emptiness, <True Scripture of Xiantian Hunyuan Xuanxuan Secret Register for Saving the World>) \n\nThis is not an ordinary war. This is a war to demand blood from every murderer who participated in the conspiracy. Our intelligence analysis shows that before Tang Erhe, the chairman were assassinated, several crates of strange goods from the Commune of France and the Union of Britain entered Beijing through Shanghai. Further investigation found that these goods were ultimately sent to an area very close to the gunman's residence. We have reason to suspect that this was an evil conspiracy, ultimately successful, in which the remnants of domestic syndicalist forces joined with nests of overseas Red rebels in an attempt to interfere in our country.\n\nNow, we have executed those domestic saboteurs one by one, while their foreign masters still sit at ease in their palaces——“No gods! No emperors! No destiny! ” they cry out so shamelessly, using terror and conspiracy to dominate millions upon millions of innocent people, turning them into obedient machines under their hands, machines that know only work, eating, rest, and death.\n\n[ROOT.GetLeader] and the people of [ROOT.GetName] have sworn an oath of revenge. They will destroy all enemies who sabotage, or plan to sabotage, their beautiful revival. This is no empty statement. An army of mourners, flowing with blood and tears and seeking vengeance, has risen from the East. This will be a march to end all blood and tears, a march that brings permanent peace and a world of great unity. Before the plague of socialism has been completely cured and the corpses that spread its germs burned to ash, our children, the descendants of [ROOT.GetName], will never put down the weapons in their hands."
  QIE_ws_leader.44.a: "We shall first bring about that blood sea."
  QIE_ws_leader.45.t: "What Others Abandon, I Take"
  QIE_ws_leader.45.desc: "Yesterday morning, the present government accepted this newspaper's request for an interview. Our reporter interviewed Mr. Wu Peifu, as follows: \n\nWang: Today the New Religion of Salvation has pacified Beijing from disorder and saved society from refugees. This may be called a great achievement, and the people all praise the present government's love for the people as for its own children. Yet there are also rumors in the streets saying that because Mr. Wu has always believed in Buddhism, the present government therefore places such importance on charity and relief. Is this true? \nWu: Not only do I believe in Buddhism. Confucianism, Buddhism, Taoism, Christianity, and Islam each have their strengths. I believe in them all.\n\nWang: Yet talk of religious ghosts and spirits is illusory and vague. Only human goodness is real. Mr. Wu, what is your opinion? \nWu: So-called ghosts and spirits are the human spirit. How can they not exist? The intelligent and upright are gods, the base and filthy are ghosts! A person can unite with Heaven and Earth, so after death he naturally exists forever. Only primary-school students do not believe in ghosts and spirits.\n\nWang: But people in the scientific world all denounce talk of ghosts and spirits as superstition. What is Mr. Wu's opinion? \nWu: Superstition? What is superstition? I have not gone upstairs, so I say there is no upstairs. Someone says upstairs is fun, and I say there is no upstairs, all superstition! Is that not shameful! There is much learning between Heaven and Earth. Westerners have only studied as far as philosophy, and do not know metaphysics. Because they do not understand, they say ghosts and spirits are superstition. If you do something bad, you will have nightmares at night. Therefore Zengzi said: every day, I examine myself three times. This is fear of offending the gods.\n\nWang: But in today's scientific world, as soon as one speaks of ghosts and spirits, one is ridiculed. What does Mr. Wu think? \nWu: Do you understand what what others abandon, I take means? Confucius wrote the <Spring and Autumn Annals>, condemning with words and punishing with the brush. Mencius spoke of morality, benevolence, and righteousness because at that time no one was condemning with words and punishing with the brush, so Confucius came to do it；no one spoke of morality, benevolence, and righteousness, so Mencius came to do it. If it had been the age of Tang and Yu, when everyone was a person of benevolence, righteousness, and morality, who would you condemn or punish? If Confucius and Mencius had been born in the age of Tang and Yu, they too would not have condemned with words or punished with the brush, nor spoken of morality or discussed benevolence and righteousness."
  QIE_ws_leader.45.a: "A dispatch from Wang Min, special correspondent of the <North China Daily News>."
  QIE_ws_leader.46.t: "Mr. Jiang the Fourth's Confession"
  QIE_ws_leader.46.desc: "The sun had just set when the Oriental Hotel in the new Xiangchang district welcomed a large group of honored guests——most of them high officials of the current [ROOT.GetName] government and social celebrities, with occasional motorcars bringing guests from elsewhere. It was Jiang Chaozong who had invited them to celebrate in this high-class restaurant operated by Chinese. First, to congratulate the government on “managing refugees effectively”；second, to congratulate himself on taking the position of religious leader, using the chance to strike a warning into important officials and local notables.\n\nIf one must speak of the Oriental Hotel's most famous dish, it is naturally French-style roast pig, said to use pigs specially raised on milk. But clearly, in every banquet led by Jiang Chaozong, the key point is never what is eaten. Only after everyone had arrived and taken their seats did Jiang Chaozong himself appear, walking slowly. He first congratulated the government for perfectly resolving the earlier crisis, praising “all honored gentlemen for fighting shoulder to shoulder and relieving wandering people with skill”；then he did not forget to declare his absolute position to everyone, saying that since he was head of state and general maintainer of the government, he ought to devote himself to the country until death.\n\nOnce the speech ended, the officials also offered congratulatory remarks to Jiang Chaozong in order. Most of the purpose of this banquet had already been achieved.\n\nWhen Jiang Chaozong entered among the tables, clinking cups, exchanging pleasantries, and shaking hands, Wang Kemin told Jiang Chaozong about the issue that concerned him most at present, namely whether Li Sihao's return would affect his own position as president of the Bank of China. “Shulu, ” Jiang Chaozong patted the back of his hand, “you will sit steadily in this position. As for Li Sihao, let him keep serving as his vice minister of finance.”\n\nAs for exchanging congratulations with Zhang Yanqing, the discussion turned to future diplomatic direction. Zhang Yanqing was not a member of the New Religion of Salvation, but a comparatively flexible monarchist. His question was what face [ROOT.GetName] would show to the world from now on——how exactly should the so-called “union of the five religions” and this religious content be handled? “Talk of religion is merely a method to keep refugees from rioting and bandits from making trouble. Externally, do not mention it for the time being.” Jiang Chaozong turned his head, “You need only make a broad appearance of openness to the outside, proving that we are a broad-minded government, and that will be about enough.”\n\n“Mr. Jiang, it is time to take the photograph! ” Just then, the hired photographer had set up his equipment. It was time to take a photograph, so it could be on the front page of all the major newspapers tomorrow."
  QIE_ws_leader.46.a: "“One, two, three: Long live the North China Government.”"
  QIE_ws_leader.47.t: "Two Immortals Descend to the Altar"
  QIE_ws_leader.47.desc: "Recently another strange event occurred upon the spirit altar of the New Religion of Salvation. Since we took control of the government, military personnel have been constantly troubled by how to turn our mixed force into an organized military power. For this reason, some members of the New Religion of Salvation came before the spirit altar, burned incense, and kowtowed to ask Emperor Fuyou.\n\nHowever, the Emperor did not descend. The one who came was the Hongnong governor, Perfected Guo Jingchun. Perfected Guo delivered an oracle declaring that the Taiyi Patriarch, moved by the wholehearted red loyalty of the religion's members in strengthening national defense, had specially sent him down to assist, transmitting to us the method of saving the world and the nation. Coming with him was the famous German military theorist Carl von Clausewitz——since Duke Guo can communicate with the hidden and the manifest, inviting a Western sage of war to descend to the same altar is naturally not strange.\n\nAfter this, Guo Pu and Clausewitz spoke on military matters for three consecutive days before the spirit altar. Guo Pu said that mountains, rivers, terrain, roads, fords, and bridges cannot be viewed merely as feng shui, but should be regarded as military stations, depth, and lines of retreat；Clausewitz said that war is the afterwave of politics, and that courage and cowardice in the army, obstruction on roads, and hesitation in commands are all battlefield friction. If victory is desired, one must first understand the center of gravity of one's own army, concentrate forces at the vital point, and with one strike break the enemy's courage.\n\nThe two immortals also explained that relying solely on the planchette brush made it hard to make many minute matters clear, and they further instructed us to consult and read certain specific books, to stop war with war, and thereby spread the good heart of saving the country, saving the people, and saving the world."
  QIE_ws_leader.47.a: "The Perfected One descends with the art of war, blessing and protecting our China."
  QIE_ws_leader.48.t: "The Religious Leader Descends by Spirit-Writing"
  QIE_ws_leader.48.desc: "Since today's work had been completed, Gong Xinzhan took off his glasses and rubbed his nose. The rule of [QIE.GetRulingParty] seemed even more……peaceful than he had expected? He had originally thought that people would absolutely never accept a religious organization holding Beijing's political power, even if this religion itself was an outward disguise for a group of old Beiyang men. But reality was that these people seemed to have accepted their rule. Perhaps this was because the earlier Zhili clique refusal to intervene in the League of Eight Provinces crisis had caused government and society to fall into complete chaos, making people feel that no matter who came, it would not be worse than then. And [QIE.GetRulingParty] had shown its usefulness in subsequently calming the social crisis, which may have unexpectedly won the people's trust.\n\nThanks to Jiang Chaozong and Wu Peifu denouncing and attacking each other, he and Li Sihao and the others were able to control the entire government, the entire sect. The document he had just read was precisely the policy development direction decided after everyone's previous meeting and discussion. But what followed was a matter even more painful to him——now he had to pretend to be “Qian Nengxun” issuing decrees. Of course, a talking photograph would only make intellectuals and most well-educated people burst into laughter, but for the great mass of Chinese with low education, an immortal in a photograph speaking was practically common sense. Now Gong Xinzhan, or rather Qian Nengxun who had already been “possessed”, raised his brush and, following the discussed document on the left, wrote on the blank paper to the right the first sentence of the divine oracle."
  QIE_ws_leader.48.a: "This little immortal comes to the altar today……"
  QIE_ws_leader.49.t: "Immortals Aid Agriculture"
  QIE_ws_leader.49.desc: "It is hereby observed that agriculture is the foundation of the state, and food is the Heaven of the people. In recent years the seasons have been out of order, especially in the northern provinces. Crops have withered, farming affairs are difficult, and this immortal has worried day and night, never forgetting it for a single day. Now that this immortal has come to the altar to govern, with all policies awaiting action, it is urgently proper to revive agriculture and enrich the people's livelihood.\n\nNanhai Guanshiyin has informed this immortal that peasants labor diligently all year, yet their income is slight；once disaster or poor harvest strikes, they are soon ruined. This immortal is mindful of the people's hardship and specially orders the government to allocate dedicated funds. All those who purchase new-style farm tools, improve seed varieties, or dig wells and irrigate fields may apply for subsidies according to regulations.\n\nEmperor Yan Shennong has also entrusted this immortal: if a craftsman wishes to do his work well, he must first sharpen his tools. Agricultural associations should be used to broadly transmit techniques. All new-style well-digging methods, water-lifting devices, and techniques for deep plowing, seed selection, and prevention and control of diseases and pests shall be taught in the countryside by persons dispatched from agricultural associations, with on-site guidance, so that every household knows and everyone can carry them out.\n\nThis immortal has ordered the government to issue instructions to all provinces, advising peasants to join forces in digging wells during slack farming seasons. Where funds are insufficient, local authorities shall provide subsidies as appropriate, and new-style well-digging equipment and waterwheels shall be promoted to save human labor and broaden irrigation.\n\nAll the above items are practical policies benefiting the people. All our peasants must eagerly undertake them, farm in proper time, and together seek advancement.\n\nOracle of Perfected Qian, Nengxun Puming Zhenghua"
  QIE_ws_leader.49.a: "Well now, today I really got to see a true immortal."
  QIE_wushan_events.24.t: "Recover China"
  QIE_wushan_events.24.desc: "This day has finally arrived. In the General's Temple, [ROOT.GetLeader], as religious leader of the New Religion of Salvation, held an extremely solemn formal ceremony to invite the martial god, Sage Emperor Guan, to manifest and answer questions about China's divided state.\n\nDuring the spirit-writing ceremony, Guan Yu announced that the time had come to unify China, and that the great generals of Chinese history: Wang Jian, Wei Qing, Ban Chao, Liu Yu, Chai Rong, Xu Da, and others had also manifested together, and would fight shoulder to shoulder with the army of [ROOT.GetName]. During the ceremony, a vast mass of dark clouds suddenly covered Beijing, with thunder sounding from within them. Some residents said they saw a golden dragon moving through the clouds and roaring in anger. Several clergy also claimed to have seen the mysterious spirit beast Baize during the process, which according to legend appears only before a truly benevolent Chinese lord. These rumors of auspicious omens have all inspired the morale of our people. Our army has polished its swords, and its morale is higher than ever before. We await only [ROOT.GetLeader]'s command, and then we can tear apart every separatist force standing before us, bringing about our war to restore China's unity."
  QIE_wushan_events.24.a: "May our ancestors bless us."
  QIE_wushan_events.25.t: "The Ungrateful Mr. Lattimore"
  QIE_wushan_events.25.desc: "Recently, the so-called “senior Sinologist” Mr. Owen Lattimore of the United States of America published a book internationally, promoting an erroneous idea called the “Inner Asian frontier thesis”, denying the existence of the splendid Chinese civilization passed down for several thousand years, and slandering it as the accidental product of interactions among grasslands, frontiers, and trade routes. What pains us is that several years ago Beijing once treated this ungrateful man with courtesy, even opening convenient doors to him. Yet what shocks and shames this newspaper most is that in Beijing and even throughout the whole country, there are intellectuals waving flags and shouting for this ignorant idea that harms the nation.\n\nThe so-called “Inner Asian frontier thesis” is nothing more than a conspiracy by petty men headed by Owen Lattimore to disintegrate the unified civilizational framework that China has inherited since the Qin and Han periods. Its purpose is to use these claims that deny the past, sever tradition, and overthrow the ancestors to poison the spirit of the Chinese people, causing the Chinese to fall into chaos, so that they can be ruled by them and forever remain slaves of foreigners.\n\nBut we are no longer slaves. Under the leadership of [ROOT.GetLeader], the people have proudly revived Chinese culture inherited for a thousand years. This is the true wisdom, unique in the world and never severed. It is precisely because foreigners envy us for possessing such a treasure that they wish to destroy it.\n\nMr. Lattimore had long plotted this. In 1926, taking advantage of our country's chaos, he set out from Beijing and spent years traveling all over our country, secretly conducting land surveys and resource investigations. His purpose was to clarify China's weaknesses so that he might destroy China in the future. Unfortunately for him, his conspiracy, like the conspiracies of many foreign invaders, is doomed to fail. We must be vigilant against enemies like Owen Lattimore who wag their tongues outside, and we must also be careful of those malicious intellectuals inside who cheer Lattimore on. Only in this way can we truly revive China, truly defend the nation, and truly achieve unification."
  QIE_wushan_events.25.a: "Does Lattimore, a foreigner, also have the right to comment on China? "
  QIE_wushan_events.26.t: "The Great Conspirator Mr. Lattimore"
  QIE_wushan_events.26.desc: "Recently, the so-called “senior Sinologist” Mr. Owen Lattimore of the United States of America published a book internationally, promoting an erroneous idea called the “Inner Asian frontier thesis”, denying the existence of the splendid Chinese civilization passed down for several thousand years, and slandering it as the accidental product of interactions among grasslands, frontiers, and trade routes. At the time, some people in the government had already seen that this man harbored sinister intentions and opposed granting him courteous treatment. Today's facts prove that this vigilance was no groundless worry. Yet what shocks and shames this newspaper most is that in Beijing and even throughout the whole country, there are intellectuals waving flags and shouting for this ignorant idea that harms the nation.\n\nThe so-called “Inner Asian frontier thesis” is nothing more than a conspiracy by petty men headed by Owen Lattimore to disintegrate the unified civilizational framework that China has inherited since the Qin and Han periods. Its purpose is to use these claims that deny the past, sever tradition, and overthrow the ancestors to poison the spirit of the Chinese people, causing the Chinese to fall into chaos, so that they can be ruled by them and forever remain slaves of foreigners.\n\nBut we are no longer slaves. Under the leadership of [ROOT.GetLeader], the people have proudly revived Chinese culture inherited for a thousand years. This is the true wisdom, unique in the world and never severed. It is precisely because foreigners envy us for possessing such a treasure that they wish to destroy it.\n\nMr. Lattimore had long plotted this. In 1926, taking advantage of our country's chaos, he set out from Beijing and spent years traveling all over our country, secretly conducting land surveys and resource investigations. His purpose was to clarify China's weaknesses so that he might destroy China in the future. Unfortunately for him, his conspiracy, like the conspiracies of many foreign invaders, is doomed to fail. We must be vigilant against enemies like Owen Lattimore who wag their tongues outside, and we must also be careful of those malicious intellectuals inside who cheer Lattimore on. Only in this way can we truly revive China, truly defend the nation, and truly achieve unification."
  QIE_wushan_events.26.a: "Does Lattimore, a foreigner, also have the right to comment on China? "
  QIE_wushan_events.27.t: "Inaugural Issue of <Essentials for Youth>"
  QIE_wushan_events.27.desc: "I humbly believe that delighting in the new and hating the old is a constant phrase of modern frivolity；reviewing the old to know the new is the transmitted instruction of China's sages and worthies. Youthful rashness and lightness may not be precious；aged sincerity and solidity are sufficient to serve as teachers. Westerners encourage one another, saying progress and freedom, science and democracy；their words and meanings shine brilliantly, as if sun and moon newly suspended. Our country's former philosophers transmitted benevolence, righteousness, rites, and music, loyalty, reciprocity, filiality, and fraternal respect；their principles run deep, like rivers never exhausted. Could this be one point where Chinese and Western peoples differ in thought and run in opposite directions? \n\nYouth does not merely mean vigorous blood and spirit, or bones and sinews not yet weakened. The preciousness of youth does not lie in daring to destroy established methods, nor in delighting to chase new sounds, but in being able to continue the lost learning of past sages, preserve the inherited models of former people, and with the heart of one square inch bear the lifeline of several thousand years of culture. It is like a great tree: the flourishing of its branches and leaves must be rooted in deep roots；like a great river: the strength of its waves must have a distant spring as source. If the roots are pulled up, the tree withers；if the source is blocked, the stream dries. China is a land of rites and righteousness；Chinese youth are the descendants of rites and righteousness. To abandon one's roots and yearn for other trees, to block one's source and draw in alien streams——though for a time it may be lush and surging, in the end it is nothing but floating duckweed and broken stalks, bent by the wind.\n\nSpeaking on this basis, can the youth of our country today stand independently between Heaven and Earth? Or will they entrust themselves to European winds and American rains without even knowing it? This is not something I can bear to say. The scholarship and implements of the West certainly include things that can be used；yet modern youth often fail to distinguish root from branch, substance from function. Hearing people speak of science, they believe the scriptures and biographies of sages may all be burned；hearing people speak of democracy, they believe rulers, parents, teachers, and friends may all be slighted；hearing people speak of freedom, they believe rites, law, integrity, and shame may all be discarded. Alas! With the convenience of utensils, they ruin the uprightness of the heart；with new names for institutions, they disorder the great root of human relations；with the clamor and competition of one moment, they exchange the bonds of ten thousand ages. This is what is called buying the casket and returning the pearl, getting the boat and losing the water.\n\nI see today's youth speak civilization with their mouths yet do not know to respect their parents；hold new books in their hands yet do not know to read the classics and histories；speak loftily of science yet do not know to rectify their hearts；speak extravagantly of democracy yet do not know to keep their ritual portions. In clothing and caps they imitate Westerners, in speech they mix foreign sounds, in conduct they abandon dignity and value frivolity, in thought they chase fashion and forget their roots. At first they were not without childlike sincerity, but gradually some are confused by floating phrases of new learning；gradually some fear the ridicule of the world and the words conservative, and so dare not openly honor Confucius and Mencius and revere rites and righteousness. Thus in society, elder and younger have no order, men and women have no boundaries, righteousness and profit are inverted, and integrity and shame are swept away.\n\nTo cure this disease, merely running about shouting and borrowing foreign names cannot suffice. It depends on one or two youths sincere in self-awareness and brave in keeping the Way, resolutely taking upon themselves the Chinese transmission of the Dao, developing the inherent spirit of our nation, and choosing among the many thoughts of the present age. What is root, from which one cannot be separated for even a day? What are branches and leaves, which may be adjusted according to the times? What is the proper path of rites and righteousness? What is the heterodox doctrine of indulgence? What are useful instruments and applications? What are poisonous flames that wound hearts and ruin customs? All must be clearly distinguished and carefully chosen. One must not see a foreign word and immediately worship it, hear a new name and immediately follow it, doubt that the ancestors have spirit because of one period of poverty and weakness, or declare sages useless because foreign states are rich and strong.\n\nI respectfully present six principles to tell the youth. First, honor the classics and histories. Second, understand filiality and fraternal respect. Third, revere rites and ceremony. Fourth, rectify the heart. Fifth, distinguish substance and function. Sixth, keep the national soul."
  QIE_wushan_events.27.a: "Respectfully addressed to the youth."
  QIE_wushan_events.28.t: "Foreign Instructor"
  QIE_wushan_events.28.desc: "We have already planned to adopt the world's current leading theories of mechanized warfare, but our country truly lacks military talent capable of guiding troops in mechanized operations. Perhaps we can find suitable instructors from the Legation Cities, but what if we could directly hire the theorist who proposed them? Major General John Frederick Charles Fuller, after following Britain into exile in Canada, has now retired. As far as we know, Gu Weijun of the Foreign Affairs Department may be able to contact him and invite him to our country to provide military guidance——Gu Weijun's wife, Huang Huilan, once had contact with a famous British occultist, Aleister Crowley. Crowley himself also loves our country's traditional culture, and it was during his time in Yunnan that he translated the <Dao De Jing> and the <Qingjing Jing> into English.\n\nBut the key point is not a foreign Daoist, but that Crowley is Major General Fuller's “guru” and “idol”. They belong to the same overseas occult organization. If he can come forward to help us pass along the message, that would be best."
  QIE_wushan_events.28.a: "Our own generals can also learn these things."
  QIE_wushan_events.28.b: "Contact Gu Weijun；we can give it a try."
  QIE_wushan_events.29.t: "Good News"
  QIE_wushan_events.29.desc: "Gu Weijun has brought back good news for us. Major General John Frederick Charles Fuller has accepted our invitation. He is very willing to come guide our army in training according to his military theories. This military thinker, known in the Western world as “Boney”, has already arrived in Beijing, but we had best keep an eye on him, because it is said that he himself still maintains some kind of countless and intricate connection with overseas occult groups."
  QIE_wushan_events.29.a: "You will help us build an army unlike any before it."
  QIE_wushan_events.30.t: "Telegram to Fengtian"
  QIE_wushan_events.30.desc: "We have now seized control of the North China Government, and those former Beiyang government important figures among us have all joined our cabinet. Yet there are still some old friends who, after defeat in the struggle, left North China in despair. “Huimou” Cao Rulin and “Huiyi” Lu Zongyu are currently serving [FNG.GetName]. Perhaps we can send them a telegram inviting them to return to our government——Cao Rulin is the leader of the New Communications Clique and holds a large amount of financial resources；Lu Zongyu once served as China's plenipotentiary minister to Japan, and with him in the middle to lubricate matters, perhaps we can ease tensions with Japan, thereby winning more time for our armament expansion."
  QIE_wushan_events.30.a: "Send the telegram over."
  QIE_wushan_events.30.b: "This matter needs long consideration."
  QIE_wushan_events.31.t: "Message from [QIE.GetName]"
  QIE_wushan_events.31.desc: "Since the political situation in Beijing changed, we have been closely watching their movements. We intercepted a telegram from Beijing, whose specific content invited Cao Rulin and Lu Zongyu to return to Beijing to take up office. In Fengtian, the New Communications Clique is almost synonymous with “Japanese lackeys”. If we let them leave, it will not arouse too much public resentment；but if they truly go, we may find it even harder in the future to obtain benefits from the Japanese."
  QIE_wushan_events.31.a: "Not one of them may leave. Keep them under close surveillance."
  QIE_wushan_events.31.b: "Let the two of them leave."
  QIE_wushan_events.32.t: "Launch a Raid? "
  QIE_wushan_events.32.desc: "We have received news that [FNG.GetName] has placed Cao Rulin and Lu Zongyu under strict surveillance. It seems the telegram inviting the two men to Beijing was intercepted by them. But if we can organize a raid, perhaps we can bring the two men out of Fengtian——the question now is whether these two men are worth us doing this."
  QIE_wushan_events.32.a: "Prepare to launch a raid."
  QIE_wushan_events.32.b: "This is not worth the risk."
  QIE_wushan_events.33.t: "The Return of Old Friends"
  QIE_wushan_events.33.desc: "Reporting to you: Cao Rulin and Lu Zongyu have arrived safely. The two men took a train through Chengde and reached Beijing. Although [FNG.GetLeader] seems to have discovered their movements, he only pursued symbolically and took no further action."
  QIE_wushan_events.33.a: "We meet once again."
  QIE_wushan_events.34.t: "Tang Erhe Leaves Nanjing"
  QIE_wushan_events.34.desc: "Tang Erhe, professor at Ginling College in Nanjing, has boarded a northbound train and has now left our territory. Someone reported that after receiving a letter in the morning, he hurriedly packed his luggage and left. More information requires further investigation."
  QIE_wushan_events.34.a: "A man of letters. Let him go."
  QIE_wushan_events.35.t: "Lin Jianzhang Goes to Beijing"
  QIE_wushan_events.35.desc: "Yantai naval officer Lin Jianzhang has boarded a train bound for Beijing and has now left our territory. Someone reported that after receiving a letter in the morning, he hurriedly packed his luggage and left. More information requires further investigation."
  QIE_wushan_events.35.a: "What is going on here? "
  QIE_ws_normal_events.1.t: "Cooperate with the Former Parliamentary Opposition"
  QIE_ws_normal_events.1.desc: "[QIE.GetLeader] now controls the Beijing Government and the New Religion of Salvation, and the power struggle has finally come to an end. The problem we now face is legitimacy in the eyes of the people——the people certainly see our disaster-relief achievements, but at most they only regard us as a qualified charitable group rather than a government. If we want to raise our government's legitimacy, the best choice is to form a governing coalition with parties previously in parliament. In this way, we can use the reputation they have accumulated among the people to endorse our new regime.\n\nThe Chinese Youth Party is an alliance of young activists and urban intellectuals. They care greatly about industrialization, but they quite dislike foreign forces. If we cooperate with them, we must be careful that our foreign policy does not upset them.\n\nAlthough the Zongshe Party is a group of Manchu Qing loyalists, the most radical among them were already purged in the previous coup. Those who remain are a group of “entrepreneurs” who control national industry in Beijing and even across the country. We can certainly create wealth together with these people, provided that the policies we implement later do not harm their interests. They want to do business with foreigners, making them basically the opposite of the Chinese Youth Party.\n\nThe third choice is the Imperial Constitutional Association. As a moderate and centrist party, cooperating with them can win us a fairly broad range of supporters, and will not allow our foreign policy to be controlled by them. But the price is that these people place great importance on rural areas with poor investment returns. To please them, many of our investments may have to enter the bottomless pit of the countryside……\n\nClearly, we do not have the energy to send lobbyists to all sides. Perhaps we need to specialize in one family."
  QIE_ws_normal_events.1.a: "The Zongshe Party fits our plan."
  QIE_ws_normal_events.1.b: "The Youth Party is not a very bad choice."
  QIE_ws_normal_events.1.c: "The Imperial Constitutional Association is the weakest, and can be used."
  QIE_ws_normal_events.2.t: "The War Is Going Badly! "
  QIE_ws_normal_events.2.desc: "Our war plan has failed to proceed as expected, and our enemies still possess a strong will to resist. Because the war is going badly, our army's morale has suffered a heavy blow, and the public has begun to doubt whether we can achieve our war goals, and whether this war truly will not have a huge impact on their daily lives."
  QIE_ws_normal_events.2.a: "Damn it! "
  QIE_ws_normal_events.3.t: "Relief from Beijing"
  QIE_ws_normal_events.3.desc: "This morning, a small force wearing Zhili clique uniforms appeared on the border between Shaanxi and Sichuan. At first our soldiers thought this was a sudden attack by the Beijing Government, but the truth quickly came to light. It turned out that aid from the central government had arrived. Just as [SZC.GetLeader] had previously heard, the current central government is now controlled by a charitable group called the New Religion of Salvation. As early as 1925, when the great famine broke out across the five provinces of Sichuan, Guizhou, Hunan, Hubei, and Jiangxi, the New Religion of Salvation had provided aid to Sichuan. Now that they control a political entity, the amount of aid is even greater than last time! Thanks to their help, our famine problem has been greatly alleviated."
  QIE_ws_normal_events.3.a: "But what is the price? "
  QIE_ws_normal_events.4.t: "The Price of Aid"
  QIE_ws_normal_events.4.desc: "Today we received a telegram from [QIE.GetName]. [QIE.GetLeader] formally notified us today, demanding that we immediately recognize their authority. In the telegram, [QIE.GetName] states that, as the truly legitimate regime on the land of China, they hope we can voluntarily dissolve our government and army and join the embrace of the central government. In addition, they specifically point out in the telegram that they hope [SZC.GetLeader] and his political staff will consider [QIE.GetName]'s previous help when we faced famine. They promise that our government personnel will enjoy retirement treatment, but will no longer be able to involve themselves in politics. Faced with such an unexpected and outrageous demand, we can choose to refuse——the price is war, and the other side certainly will not let the matter rest；or we can choose to yield. But unlike being a cooperative government, our government will directly vanish like smoke and clouds, with no chance to retain anything."
  QIE_ws_normal_events.4.a: "Famine? What famine? I have not heard of it."
  QIE_ws_normal_events.4.b: "We will not become ungrateful people."
  QIE_ws_normal_events.5.t: "The Victory of Charity"
  QIE_ws_normal_events.5.desc: "We have received news from Chengdu that the Sichuan government controlled by [SZC.GetLeader] has decided to fully accept our demands and peacefully merge directly with our government. Soldiers inside Sichuan are now being demobilized in order, and our government officials are also heading to Sichuan to carry out the transfer of power. It seems our previous charitable actions have worked."
  QIE_ws_normal_events.5.a: "A small price solved a great trouble."
  QIE_ws_normal_events.6.t: "Ingratitude"
  QIE_ws_normal_events.6.desc: "We have received news from Chengdu that the Sichuan government has flatly rejected the merger demand we proposed. In their reply, they state that we provided no useful assistance for the Sichuan famine, and even “used disaster relief as a false name to carry out surveying in reality”. These rumors are enough to prove that their government is nothing but a bandit nest composed of ungrateful, fact-distorting unworthy thieves. [SZC.GetLeader] also arrogantly states that they are the only legitimate government of China, and that even if there is a merger, China's power cannot be handed over to us. It seems negotiations have broken down, and the chance of a peaceful solution has become very slim. Our military command has already drafted a plan to attack Sichuan. If war begins, perhaps we can completely resolve this rabble within three months."
  QIE_ws_normal_events.6.a: "Do not hold illusions about the consciences of warlords. Prepare to assemble."
  QIE_ws_normal_events.7.t: "Fight for the Motherland"
  QIE_ws_normal_events.7.desc: "[RUS.GetName], under the leadership of [RUS.GetLeader], has finally raised the hammer of vengeance against the German Empire. This hammer, formed from countless ordinary yet tenacious Russian soldiers, strikes again and again upon the eastern wall, sending a deafening echo through the world——not only declaring that Russia will wash away the shame of the <Treaty of Brest-Litovsk>, but also declaring a war that surpasses all wars.\n\nIgor Semyonovich Mechinsky, a member of the New Religion of Salvation who has long served in our army, also known as “Layman Hanhui”, wishes to return to his country. He is very grateful for our cooperation during this period, but he has decided to join this great war, supremely glorious to him. Perhaps he will rise step by step with victory after victory, or perhaps he will die silently in some place known to no one. But in any case, he will wrap himself in the flag of his own country and his own nation, and remain there forever."
  QIE_ws_normal_events.7.a: "Lost children must eventually go home."
  QIE_ws_normal_events.8.t: "The Czech Language"
  QIE_ws_normal_events.8.desc: "The chains of the <Austro-Hungarian Empire Unification Treaty> have finally been shattered. Under the leadership of [CZE.GetLeader], the people of [CZE.GetName] have once again raised the banner of the Czech national revival movement. Czech children walk into the streets. Their mouths no longer speak the German of outsiders. They pick up rifles, lean upon one another, and stand forth to fight the decisive battle of fate against the Austro-Hungarian Empire that once clamped them down in the old days.\n\nA member of the New Religion of Salvation who has long served in our army, Menziel, also known as “Layman Hanfa”, wishes to return to his country. He is very grateful for our cooperation during this period, but he has decided to join this great war, supremely glorious to him. Perhaps he will rise step by step with victory after victory, or perhaps he will die silently in some place known to no one. But in any case, he will wrap himself in the flag of his own country and his own nation, and remain there forever."
  QIE_ws_normal_events.8.a: "We will bless your road home, wanderer from a foreign land."
  QIE_ws_normal_events.9.t: "<A Study of Hungarian Customs>"
  QIE_ws_normal_events.9.desc: "From families of four, move one；from families of six, move two；from families of eight, move three adult males. If any are selected for dispatch yet make excuses and disobey, they shall be handed to the authorities for punishment and flogging, and forcibly dispatched and settled, with absolutely no empty display.\n\nBeginning in 1370, in order to alleviate the uneven distribution of population across China, the Ming emperor issued a migration order to residents of Shanxi. Groups of Shanxi people were bound with ropes and, escorted by the army, were voluntarily migrated to various parts of the country. This migration lasted more than forty years, and one million Shanxi people left their homeland. Where exactly their hometown was can no longer be known, but a folk song describing the matter has been passed down for about 600 years: \n\nAsk where my ancestors lived, at the Great Pagoda Tree of Hongdong, Shanxi. Ask what my ancestors' old home was called, the old stork nest beneath the Great Pagoda Tree.\n\nTherefore, these people are also called “Great Pagoda Tree residents”. The recently published <A Study of Hungarian Customs> in the popular newspaper <Keeping the Present> revisits this matter and gives an unexpected conclusion: the article first reviews Hungary's local customs and culture, then presents three pieces of evidence. First, Hungary has a “Hont County”, whose pronunciation is extremely similar to Shanxi's “Hongdong County”；second, the Hungarian region also has large numbers of pagoda trees；third, and also the most “clever”, the article points out that Chinese white storks are highly aggressive and nest far from humans, whereas Hungary's European white storks are gentle in temperament. Therefore the author believes that the true Shanxi is actually Hungary, and that this migration was in fact the return migration of the Han nation to China. China controlled Hungary as early as 600 years ago, yet this land is now forcibly occupied by Europeans. This article has provoked entirely different reactions among intellectuals and the general public: many intellectuals harshly denounce it as “warlord-style dream talk”, but some ordinary people believe the claim may not be entirely without reason, and have joined this treasure hunt with great interest, studying still more “coincidences” between Europe and China.\n\nSome intellectuals friendly to the government have reported to us that they believe this article has an extremely bad effect on our country's international image, and hope we can ban its circulation."
  QIE_ws_normal_events.9.a: "No matter how you say it, this goes too far."
  QIE_ws_normal_events.9.b: "Do not encourage it, but do not ban it either. Let it quietly ferment."
  QIE_ws_normal_events.10.t: "Hont and Hongdong"
  QIE_ws_normal_events.10.desc: "Although it is hard to believe, we have ultimately taken control of all Hungary. Though we planned to establish a government in Hungary friendly to [QIE.GetName], making it China's outpost in the European heartland, domestic public opinion quickly boiled over after news of victory arrived. Many people declare that, according to that <A Study of Hungarian Customs> from several years ago, Hungary is part of China——they strongly demand that Hungary be incorporated into our territory. We certainly have legitimate authority to refuse this bizarre demand, but perhaps we can also agree to their request, thereby moving part of our country's population to the Hungarian region and establishing there a new order truly loyal to China. Of course, if we place the latter on the agenda, perhaps we will have no choice but to let some Hungarians voluntarily leave."
  QIE_ws_normal_events.10.a: "We shall return to the old homeland of six hundred years ago."
  QIE_ws_normal_events.10.b: "Absurd talk, left unbanned, will cease by itself."
  QIE_ws_normal_events.11.t: "What Does Since Ancient Times Mean? "
  QIE_ws_normal_events.11.desc: "We have received a confusing telegram. It appears to have been sent by [QIE.GetName] and the [QIE.GetRulingParty] currently ruling there. Yet the contents of the entire telegram resemble the strange dream of a sailor who drank too much gin, first vomited over the ship's rail, and then picked up a pen to write. The telegram first mentions their demand for land that rightfully belongs to them——[GEA.GetLeader] at first thought they were referring to Guangzhouwan, but looking further down, we saw several strange place names: Hanoi, Haiphong, and Lang Son. They declare that these lands have been their territory since ancient times, a sacred and inseparable part of them, and that they have controlled this place since the Qin and Han periods. Now we “evil colonizers” have taken the land that originally belonged to them. They demand that we immediately cede these lands to them, and as a reward for our substitute governance, we will receive some gifts from distant Beijing.\n\nThis telegram is full of dream talk, but we have no choice but to respond."
  QIE_ws_normal_events.11.a: "Thinking that it is them, I seem to understand this madness."
  QIE_ws_normal_events.11.b: "Perhaps we are not unable to discuss a transaction……"
  QIE_ws_normal_events.12.t: "[GEA.GetName] Has Humiliated Us! "
  QIE_ws_normal_events.12.desc: "We have received a reply from [GEA.GetNameDef]. To the telegram we sent in earnest, laying out our country's sacred ruling authority over the Red River Delta since ancient times, the other side's answer is refusal——they refuse to return these lands to us. Although we have given the other side full face by describing the “transaction” as a “reward”, these white men still seem not to appreciate it. This reply reveals disdain and humiliation toward us between every line. It seems we can only adopt forceful measures."
  QIE_ws_normal_events.12.a: "Why do they not revere our Celestial Empire? "
  QIE_ws_normal_events.13.t: "Telegram to German East Asia"
  QIE_ws_normal_events.13.desc: "We have already decided to recover the concessions originally ceded away to foreigners. Relevant telegrams will be sent in succession to the various great powers with interests in China——but we have another choice. Perhaps we can use this opportunity to try to recover China's control over the northern Vietnam region. Although nominally northern Vietnam is not part of the concessions or Legation Cities, over these two thousand years, Central Plain dynasties once intermittently controlled northern Vietnam. The most recent time was from 1407 to 1427, when Chinese armies attacked Annam to obtain control over it.\n\nOf course, this does not mean we want [GEA.GetName] to hand this land over to us for nothing. After all, we say with our mouths that this is territory we deserve, but in reality, our relevant ruling rights there truly are not very easy to determine. We can take a small step back and demand the land's return in the name of “redemption purchase”. This both gives [GEA.GetName] some face and ensures that we will not be attacked by the public as a weak government on territorial issues."
  QIE_ws_normal_events.13.a: "Send the telegram, then be ready to transfer money at any time."
  QIE_ws_normal_events.13.b: "Is there any value in claiming this place? "
  QIE_ws_normal_events.14.t: "A Perfect Transaction"
  QIE_ws_normal_events.14.desc: "[GEA.GetLeader] has sent us a telegram in reply. The telegram begins by discussing German East Asia's reasonable and lawful supervisory obligations over the northern Vietnam region, and reiterates that this land was authorized for him to govern by the great and honored [GER.GetLeader]. Without the permission of His Honored Majesty the Emperor, he originally had no right to buy, sell, or cede it to anyone.\n\nBut after carefully reading our telegram, he confirms that we do indeed possess sufficiently reasonable and lawful ruling rights over this land. Therefore he has persuaded His Majesty the Emperor to allow him on his own authority to bestow upon us, this ancient and great Eastern nation, a portion of the most precious jewel of the German state.\n\nIn simple terms, they are very satisfied with the price we offered, and we have regained control of this region."
  QIE_ws_normal_events.14.a: "Desperate to save face."
  QIE_ws_normal_events.15.t: "The Flames of War Have Arrived"
  QIE_ws_normal_events.15.desc: "[QIE.GetLeader] announced today that war has arrived. Therefore all institutions and policies we previously established for peacetime will be abolished, replaced by wartime emergency policies and related departments. Perhaps after this campaign, even after the war ends, wartime exceptional circumstances will continue to exist as ordinary circumstances. But so long as we can achieve victory, none of this will be a problem."
  QIE_ws_normal_events.15.a: "For [QIE.GetName], for [QIE.GetLeader]! "
  QIE_ws_normal_events.16.t: "Great Unity Under Heaven"
  QIE_ws_normal_events.16.desc: "If one wishes to unite humanity in equality and great unity, one must begin from making humanity's shape and physique the same. If shape and physique are different, then rites, undertakings, and affection cannot be the same. If one wishes to unite shapes and physiques that are utterly different and transform them so they become the same, apart from the method of union between men and women, nothing can transform them.——<Book of Great Unity>\n\nThis idea proposed by Kang Youwei in the <Book of Great Unity> is called “removing racial boundaries to unify humanity”. Through global migration and intermarriage, in only about a thousand years or so, we can make everyone in the world become the smartest, most excellent, and most moral yellow people, that is, Chinese people.\n\nTo achieve this goal, the first thing we must do is bring China's ancient wisdom and precious morality to those barbarous lands. To achieve the goal of world great unity, the excellent, higher civilizations in this world must shoulder responsibility and civilize those lower and backward civilizations. If those uncivilized peoples cannot understand the Four Books and Five Classics we teach them, the morality of Confucius and Mencius, or even their own gods' praise and admiration for Chinese culture, then it means they probably cannot yet accept spiritual strength. We can only use barbarous bodies——swords and blades——to teach them who the truly excellent side is."
  QIE_ws_normal_events.16.a: "Remove national boundaries to unite the earth, remove class boundaries to unite nations, remove racial boundaries to unite humanity."
  QIE_ws_normal_events.17.t: "A Madwoman"
  QIE_ws_normal_events.17.desc: "Zhang Xizhong wore a red flower of congratulations on his chest, held scissors in his hand, and stood before the newly completed Jicheng Three Acids Factory to cut the ribbon. As a director, this was originally his proper duty. As a national chemical enterprise in the Xi'an region, Jicheng Three Acids Factory had broken the monopoly of foreign capital over the three industrial acids, and was highly valued by the government. The people of Xi'an were also proud to possess such a factory. Before the temporary platform, the crowd that had come to observe pressed against one another, refusing to yield. Zhang Xizhong climbed onto the platform and was preparing to maintain order before reading the speech prepared for the ceremony, when an unexpected guest appeared within his line of sight.\n\nWas that a human being? It looked more like some disheveled ghost that had crawled out of King Yama's hell. Its clothes were ragged, its frizzy hair hung down to its abdomen, making one doubt whether it could see the road ahead. Most eerie of all, it tightly held a large bundle of blackened and yellowed ragged cloth against its chest with both hands, as if imitating a human mother holding an infant.\n\n“Chen the Good Man! ” That creature approached the crowd and screamed hysterically. Only then could everyone confirm that it was a woman who could speak, not some other creature. “My son is dead! My son is dead! Look at my son, my son was snatched away, dead! My son is snatched away every month……I was snatched away too, my bone marrow was drained, every month they drain my bone marrow! Who will save my son, who will save my son……”\n\nThis woman thus passed through the celebration procession for the completion ceremony of the new Jicheng Three Acids Factory. The originally crowded mass of people consciously opened a rather wide path before her. In this way, while repeating her cries in a sobbing voice, she walked to the other end, onto an earthen slope not yet cleaned up. Temporary sheds where the workers who built this factory had lived had once stood there. Now they had basically been completely dismantled, and only several shovels lay scattered haphazardly.\n\n“Who will save me……” she said, while picking up a shovel with one hand, the other still tightly holding that bundle of faded rags. She did not notice at all, or perhaps did not care at all, about the military police responsible for maintaining order approaching behind her."
  QIE_ws_normal_events.17.a: "For safety's sake, please trouble yourselves to drive her out."
  QIE_ws_normal_events.18.t: "The Tiger and the Sheep"
  QIE_ws_normal_events.18.desc: "“I truly do not want to deal with any of this, I just want to go back.”The man held his rifle, his head lowered as he leaned against the stump of a tree blasted in half, “When will it end? I keep charging like a madman out there, and those foreigners keep charging just as desperately, one of us two madmen always has to fall.I have been the one left standing three times already! ”\n\n“Look alive, ”he shouted at the top of his lungs, as the thunder of an artillery salvo shook the air around him, “You are going back, both of us are going back to celebrate the New Year.”After saying this, he leaned out and fired another shot, “Think about what you said a few days ago, were you not born in 1926? You were born in the bingyin year, the Year of the Tiger! You are a great big tiger, and the foreigners are just a flock of sheep, tigers are born to eat sheep, yet here you are afraid of being eaten by sheep! ”\n\nNow the artillery positions fell silent, the time had come.He bent down and patted the man on the head: “The fucking machine gun is gone, now grab that rifle, forget about your tripod! ”After saying this, he threw the grenade, then turned his head back: "
  QIE_ws_normal_events.18.a: "Then fix bayonets! "
  QIE_ws_united.1.t: "Year [GetYear]"
  QIE_ws_united.1.desc: "1936 is a year the Chinese people will remember forever. The age of warlords, with heroes contending and wars raging on every side, brought dark suffering to this land. Yet it was in 1936, amid the shock that shook the capital, that the charitable organization [QIE.GetRulingParty] bravely assumed its social responsibility and successfully restored order to the North China Government. In the years that followed, it led its invincible armies on campaigns in every direction, bringing broken China back together once more. Just as people believed [QIE.GetRulingParty] would continue to rule this land as China's most legitimate master, its leadership suddenly announced the establishment of the New Beiyang Republic: [QIE.GetRulingParty]'s mission had been completed, and the time had come to lay down its arms and return to the fields.\n\nTo the astonishment of foreign observers and domestic intellectuals, [QIE.GetLeader] summoned renowned intellectuals and jurists from all sectors of society to discuss the establishment of a transitional government, so as to guide China back toward the republican dream it had once walked toward, only to abandon halfway.\n\nNow it is [GetYear], the finest year yet for the four hundred million people living upon the land of East Asia. Though the road ahead is dark, China has at last set foot upon the true democratic path dreamed of and hoped for by the martyrs of Xinhai."
  QIE_ws_united.1.tt: "§0We will begin preparations for the New Beiyang Government. We will send invitations to leading intellectuals, jurists, and persons of standing from all sectors of society, so as to form the New Beiyang Provisional Government Committee.§!"
  QIE_ws_united.1.a: "Congratulations, congratulations."
  QIE_ws_united.2.t: "New Beiyang Provisional Government Committee"
  QIE_ws_united.2.desc: "As expected, the New Religion of Salvation's public announcement that it would relinquish power sent shockwaves through the intellectual world. Even those who had long criticized the New Religion of Salvation fell silent this time; some among them even softened their positions, believing that this “superstitious occult organization” was not entirely harmful to China. After all, over these several thousand years, China's rulers had without exception been the victors of contests among rival powers. A ruling group voluntarily giving up the fruits of victory had appeared for the first time.\n\nWang Chonghui, Hu Shih, Tang Erhe, Wellington Koo, Liang Shuming... even Huang Fu, who had always looked down on the people of the New Religion of Salvation, received an invitation from the New Beiyang Provisional Government Preparatory Committee. There were even rumors that Li Dazhao would end his exile in France and return to Beijing. Yet rumors were only rumors; even when the doors of the Preparatory Committee closed, Li Dazhao had not appeared. The Preparatory Committee's meetings ranged wildly over every imaginable subject. Had they taken place only a few years earlier, the topics they discussed would alone have been enough to get them all arrested: some proposed activating the never-implemented Cao Kun Constitution of 1923, some believed New Beiyang needed a new constitution that could sweep away the ills of the past, some felt the urgent priority was normalizing the medical system, some thought the long-neglected university entrance examinations had to be restarted at once, and someone pounded on the table trying to get everyone's attention, only to say that he was simply hungry and wanted recommendations for a nearby restaurant...\n\nAfter realizing that everyone had their own ideas and that priorities had to be established, the Preparatory Committee finally decided first to elect a grand chairman of the New Beiyang Provisional Government and a secretariat to preside over and arrange all subsequent meetings. In the vote, the democrats refused to let the centralists have their way, the liberals refused to yield before the authoritarians, and Hu Shih's quiet murmurs were drowned out by the sound of chairs scraping across the floor——in the end, everyone decided to nominate Tang Erhe, former Minister of Education of the Beiyang Government and one of the initiators of the “Good People Government”, as grand chairman. He did not currently belong to any faction and had few political entanglements, making him precisely the sort of person who could fairly preside over the meetings.\n\nNow that there was a grand chairman, everyone could finally return at ease to the matters they had been discussing before."
  QIE_ws_united.2.a: "Only the Old Man of Six Pines can shoulder this heavy responsibility."
  QIE_ws_united.3.t: "A Moment in the Transfer of Power"
  QIE_ws_united.3.desc: "The door of the meeting room was pushed open. The guard leading the way extended his hand and bowed slightly: “Mr. Wu, this way, please.” Wu Peifu then stepped into the room. The members of the New Beiyang Provisional Government had already been waiting here for some time. The reason they had invited Wu Peifu was to confirm just how far the New Religion of Salvation was willing to go in giving up its power——“Hehe, as for the transfer of power we discussed earlier, naturally, all of it,” Wu Peifu said, smiling and nodding. “The New Religion of Salvation will once again become a charitable organization, and we will each return to our proper places.”\n\nHaving said this, he coughed, reminding them that the main point was still to come: “There is just one small problem. For those of us who command troops, I am afraid the command authority over the army cannot yet be handed to the government.” After saying this, he took a sip of the tea on the table, using the opportunity to observe the committee members' reactions. “You understand. These brothers who all rolled out of the same pit trust and obey those to whom they can entrust their lives. If you simply parachute in a group of officers, I fear you will not be able to control them.” Wu Peifu could see the dissatisfaction on the faces of the provisional government committee members. After all, if the army was not in the hands of this new regime, would they not be just another rubber stamp? He had long anticipated this reaction: “The new government's urgent priority is to build a new army of its own. I suggest you bring in Jiang Baili.” He tapped the table. “Before the war, he was in charge of the Baoding Military Academy. As someone who has been through this, my advice is that you can promote a group of new young cadets and form a military committee. As for my troops, Governor Zhang's troops, and the troops of the other generals, once you have suitable officers, whether you want to break up their formations or change their designations is entirely up to you.” Having said this, he withdrew both hands from the table and leaned back comfortably, putting on the look of an old man enjoying the rest of his life. “Until then, let us guard the country's gates. But when all is said and done, who can still threaten China now? Later I will go to Tianjin, lie around every day, and spend my old age in peace.”\n\nHearing him say this, and seeing his exaggerated gestures, the committee members all laughed in relief. Of course, Wu Peifu laughed as well."
  QIE_ws_united.3.a: "A peaceful moment in the new Chinese government."
  QIE_ws_united.4.t: "A Moment in the Transfer of Power"
  QIE_ws_united.4.desc: "The door of the meeting room was pushed open. The guard leading the way extended his hand and bowed slightly: “Mr. Jiang, this way, please.” Jiang Chaozong then stepped into the room, where the members of the New Beiyang Provisional Government had already been waiting for some time. The reason they had invited Jiang Chaozong was to confirm just how far the New Religion of Salvation was willing to go in giving up its power——“Hehe, as for the transfer of power we discussed earlier, naturally, all of it,” Jiang Chaozong said, smiling and nodding. “The New Religion of Salvation will once again become a charitable organization, and we will return to work in social welfare.”\n\nHaving said this, he coughed, reminding them that the main point was still to come: “There is just one small problem. I think the command authority over the army may have to remain in the hands of the current officers for the time being.” After saying this, he looked around at the reactions of the committee members in the room: some expected, some angry, some disappointed. “Beijing has only just settled down. If we rashly replace the commanding officers now with people who cannot command respect, I fear they will be unable to control the soldiers, and public order will deteriorate.” Jiang Chaozong knew what these people were thinking. If the army was not in the hands of this new regime, would they not be just another rubber stamp? He had long anticipated this reaction: “The new government's urgent priority is to build a new army of its own. I suggest you bring in Jiang Baili.” He tapped the table. “Before the war, he was in charge of the Baoding Military Academy. As someone who has been through this, my advice is that you can promote a group of new young cadets and form a military committee. Once you have suitable officers, I think you can consider the matter of transferring military power.” Having said this, he withdrew both hands from the table and leaned back comfortably, putting on the look of an old man enjoying the rest of his life. “Until then, I will do my job as Commander of the Nine Gates. I will help you people guard the front door. Beijing has finally had a few peaceful days; we cannot let it fall into chaos again.”\n\nHearing him say this, and seeing his exaggerated gestures, the committee members all laughed in relief. Of course, Jiang Chaozong laughed as well."
  QIE_ws_united.4.a: "A peaceful moment in the new Chinese government."
  QIE_ws_united.5.t: "A Moment in the Transfer of Power"
  QIE_ws_united.5.desc: "The door of the meeting room was pushed open. The guard leading the way extended his hand and bowed slightly: “Mr. Gong, this way, please.” Gong Xinzhan then stepped into the room, where the members of the New Beiyang Provisional Government had already been waiting for some time. The reason they had invited Gong Xinzhan was to confirm just how far the New Religion of Salvation was willing to go in giving up its power——“It has already been said before: all of it will be transferred.” Gong Xinzhan interlaced his fingers, looking as exhausted as if he had just crawled out from an endless pile of documents. “The New Religion of Salvation will once again become a charitable organization, and we will shift our focus back to charity. We will still need the government's generous support in the future.”\n\nHaving said this, he slapped his own head as if remembering something: “Oh, right, we also have a problem. I think the command authority over the army probably cannot be given to you yet. Temporarily, just temporarily. We have some matters that are not yet finished.” After saying this, he looked around at the reactions of the committee members in the room: some expected, some angry, some disappointed. He knew he had to explain himself. “Military authority will certainly be given to the new government. The problem now is that we are clearing the pay accounts. Li Sihao has been working day and night these past few days. Disbanding old units, demobilizing soldiers, registering arms...” As he said this, he lowered his head, then suddenly raised it again. “Does the new government already have a provisional military budget? There are far too many documents and things to transfer. We are doing our best to resolve everything that is unclear. I suggest you first draft a budget, then bring in Jiang Baili.” He leaned forward. “Before the war, he was in charge of the Baoding Military Academy. I suggest promoting a group of young cadets as new officers, training people who can be trusted, and forming a military committee. Once you have suitable officers, I think we should also be nearly done counting things on our side.” Having said this, he placed his hand on the armrest of his chair and let out a deep breath. “If there is nothing else, I still need to go back and continue sorting through other budget documents. I will send them over to you after a while.”\n\nHearing him say this, the committee members all laughed in relief. Of course, Gong Xinzhan laughed as well; it was a weary, bitter laugh."
  QIE_ws_united.5.a: "A peaceful moment in the new Chinese government."
  QIE_ws_united.6.t: "The Barber"
  QIE_ws_united.6.desc: "“Aiyo, sir, do me a kindness. I run a small business; I cannot afford this.” He glanced toward the west at the countryman selling vegetables who was arguing with a patrolman over blocking the road. Such things were hardly rare around Shichahai. Then he turned his gaze back to the gleaming, big, round head before him, wondering how to deal with the thing. “Damn it!” The rickshaw puller set his cart down and ducked into the oil-cake stall beside them, baring his belly as he began cursing. “A bowl of wontons and an oil cake!” That booming voice made the head in front of him tremble, nearly causing his hand to slip.\n\n“Just think about it, think about it,” he said, biting into the oil cake. The wontons were too hot, so he had to let them cool. “Those official gentlemen in this alley who do spirit-writing, were they not sitting on the dragon throne eating and drinking well, with documents and soldiers all at their command? Why the hell have they started putting on airs again, saying they want to hand power to a new government? Is that not like finally stealing a roast chicken, then turning around and offering it up in a temple?”\n\nThe man had no companion. This was the most common way to start a conversation on old Beijing streets: if anyone took up the remark, the chatting could begin. The head on the chair seemed to want to laugh when it heard the roast chicken, but it feared the knife in the barber's hand, so it could only hold it in its throat and turn it into a cough. As for him, he leisurely stroked the razor twice across the leather strop. “Sir, you were born to pull carts, and I was born to cut hair. An emperor is still a man in the end. When his belly is hungry, he has to eat oil cakes; when his hair grows long, it has to be shaved. They are too lazy to be emperors.”\n\n“If even the old emperor does not want to be emperor, then what does he want to do?”\n\nHe first pressed down the head before him, shaved away a patch of foam by the temple, and then continued chatting: “If one is going to be something, one should be an immortal, a sage! Once an immortal has washed worldly power clean, he need not hold court and need not sign documents. If things succeed, it is Heaven's mandate shining bright; if they do not, it merely means more effort is needed. And that is only a dead immortal. If he becomes a living immortal, he can even rule the emperor!”\n\n“Damn, is that not even happier than being emperor?”\n\nThe man in the chair could no longer suppress his laughter. But then he jumped up with an “Aiyo”, and a crooked white path had appeared on his dark head, like a bright road about to be repaired, only to vanish halfway through."
  QIE_ws_united.6.a: "Slander the immortals, and suffer Heaven's punishment."
  QIE_ws_united.7.t: "Chinese Medicine Groups Refuse the Survey Once Again"
  QIE_ws_united.7.desc: "Today is [GetDateText], and I have received this telegram.\n\nIn the end, I am truly shocked by this result. When the New Religion of Salvation had just unified the country, if they had said “we find you highly suspicious”, I certainly would not have been so surprised——but reality is exactly the opposite. At the celebration ceremony for unification, several Chinese medicine groups attended the meeting and conversed very pleasantly with members of the New Religion of Salvation. Many people saw this.\n\nI had thought that these Chinese medicine groups, at the very least, supported the new government in doing many things beneficial to their development, so I wanted to strike while the iron was hot and restart the survey for the official Chinese medicine examination system of 1916. But why would they send this telegram?\n\nWhy does the telegram say “at a time when the country has only just been unified, and Chinese medicine education and transmission have not yet returned to the proper track, making school graduation the primary prerequisite for registration does not accord with national conditions”?\n\nDid I not read these words once already more than twenty years ago? Members of the Beiyang Medical and Pharmaceutical Association sent to conduct the investigation were also driven away by those Chinese medicine groups. They do not trust our provisional government. Why did they show one face to the New Religion of Salvation and another to us?\n\nPerhaps we have done something not quite right. Tomorrow I will check the details again with the members of the Medical and Pharmaceutical Association——\n\n“Chairman Tang, you have a new document!”\n\n——Ah, I have said before, do not call me Chairman on occasions like this. Just call me Tiaoding or Mr. Tang. Being called Chairman feels strange."
  QIE_ws_united.7.a: "Perhaps we should further explain the benefits of the survey to them in earnest, and prepare more gifts of thanks."
  QIE_ws_united.8.t: "Hu Shih's Farewell"
  QIE_ws_united.8.desc: "Although the night was already deep, I still decided to make this call. There are many things I must personally confirm with him. The metal receiver was already cold to begin with, but tonight it felt even colder. Only when his voice came from the other end did I feel a faint trace of warmth.\n\n“Mr. Tang,” he said, “why call me so late? Is there something urgent?”\n\nI heard from Wang Chonghui that you want to withdraw from the Preparatory Committee and leave Beijing as well. Is this true? The other end of the line fell silent. That silence confirmed the truth of the news, so I continued to ask the next question, about his plans for where he would go after leaving Beijing.\n\n“I have not decided yet. I may first go to Nanjing or Shanghai, and then perhaps to America. The American Civil War is nearly over; I want to go there and have a look.”\n\nIf you are going to Nanjing, I can introduce you to some friends. As for America, to me it is only a country that exists on globes and in books. Then came silence again. I had many things to say, but all of them stuck here. Tell me why you want to leave. Why do you not want to take any office? Is this not the very opportunity to realize your dream?\n\n“I feel——” He hesitated, as if weighing his words, as if wary of something. I do not know. “New Beiyang is very good, full of potential, a child that could become anything. It is some object kneaded into being by Nüwa and created into being by Cangjie. But precisely because of that, I have become uneasy about its father and mother. I understand what you think. It is only that I personally feel emotionally uncomfortable. Just think of me as a deserter and refugee.”\n\nI did not know what to say. The nation had only just begun, like an infant, and for him to leave like this was quite irresponsible. Yet I also could not bring myself to say that he was wrong. But I had been silent for a long time. For the sake of the telephone fee and my dignity, I had to say something:"
  QIE_ws_united.8.a: "Safe travels, Shizhi."
  QIE_ws_united.9.t: "A New Road Taken Stumblingly"
  QIE_ws_united.9.desc: "Although the Preparatory Committee repeatedly wrangled and argued during this period, in the end it still produced a series of drafts, programmatic documents, diplomatic policy plans, and other materials needed by the new government. As for New Beiyang's national flag, everyone decided to continue using the Five-Colored Flag long used by the Beiyang Government. The difference was that the order of the five colors would be rearranged to accord with the traditional Chinese principle of the mutual generation of the Five Phases. In this way, they would both avoid merely continuing the old system and offer this newborn republic a reinterpretation of its own past inheritance——this was proposed by some conservative intellectuals on the committee.\n\nNow all the legal and substantive preparations for establishing the new government were ready, and the committee members could breathe a sigh of relief. But they soon realized that they had made absolutely no preparations for the government founding ceremony, causing the meeting room to grow lively once again.\n\nY. C. James Yen bent down and placed a stack of drafts on the tea table, right in front of Tang Erhe: “This is the declaration to be used at New Beiyang's founding ceremony, Tiaoding.” The nearly seventy-year-old man before him was still leaning back on the sofa with his eyes closed. After thinking it over, Y. C. James Yen decided to shake the other man's shoulder. “Chairman Tang, you must take care of your health. This is the declaration draft to be used at New Beiyang's founding ceremony. I have brought it over for you.” Watching Tang Erhe, still drowsy-eyed, he rested his right hand on the stack of papers while repeating what he had already said once more.\n\n“Oh, thank you.” Tang Erhe adjusted his sitting posture, and the sofa creaked. “Thank you, thank you. Let me look at the draft.” He picked up the draft, only then remembering that he was not wearing his glasses, and fished them out of his breast pocket. “A very fine draft,” he said, raising his head. His gaze beneath the lenses was serious enough, but it could not conceal his fatigue. “As provisional chairman, reading this aloud is my duty. Only——” He placed the draft to the left side of the sofa, seeming to want Y. C. James Yen to pass a message to the people still arguing fiercely in the meeting room. “Once the National Assembly is restored and everything formally returns to the proper track, you should still nominate a new candidate for chairman. I am already old, and my energy cannot keep up.”\n\nAfter saying this, he began coughing violently again."
  QIE_ws_united.9.a: "Take good care of your health."
  QIE_ws_united.9.tt: "§0The time and place of the New Beiyang Government's founding ceremony have been decided. It will be held at Tiananmen in Beijing in 14 days.§!"
  QIE_ws_united.10.t: "Offering Incense"
  QIE_ws_united.10.desc: "Ever since the New Religion of Salvation unified China, Lüzu Pavilion had become the liveliest religious temple in Beijing. After they announced that they would relinquish power and establish a democratic republican government, smoke from Lüzu Pavilion poured from the temple gate day and night without cease. People pressed shoulder to shoulder, one after another, all wanting to stuff their own health, descendants, and wealth into the sticks of incense sold in the temple for sixty cents, so that the New Religion of Salvation and Fuyou Emperor would remember them. The old woman squeezed in at just this time. She was jostled by the crowd until she could barely stand, while her hand clutched tightly the three sticks of incense and two coins she had bought from the temple. Seeing that her legs and feet were inconvenient, the incense attendant responsible for watching over the offerings gave her a hand. When they passed the auspicious vat, the old woman muttered something under her breath while dropping the coins into it.\n\n“This way, you may worship here.” He pointed to an open space. The old woman knelt devoutly, raised the incense above her head, kowtowed nine times toward the statue of Lüzu inside the hall, then lit the incense and inserted it into the burner. Once she had finished this, she began looking all around, searching for something.\n\n“Are you asking for a divination lot, requesting a dharma-image photograph of the founders of the Five Religions, or seeking a spirit-writing consultation?” “None of that matters. I want to ask you something: where is the image of Wu Peifu?”\n\n“Wu Peifu?” “Yes. Is he not the religious leader of the New Religion of Salvation? Such a great figure should receive a few sticks of incense too.”\n\nThis put the incense attendant in some difficulty: “Old lady, Marshal Jade is still alive at present. I fear this incense cannot——” “It is more efficacious because he is alive!” Her speech was slow, but very serious. “He brought the whole realm together. Is that not great merit? Others all say Marshal Jade abdicated and gave power to a Good People Government, but good people are good people, and saviors are saviors. The world must always have a wise ruler. Religious Leader Wu is the wise ruler sent down by Heaven to set this chaotic age in order. The true savior of the Chinese people is not written into being by newspapers; he is appointed by Heaven. If people do not worship such a good immortal, can they still be considered human?”\n\nThe incense attendant did not know what to say. Not until the timekeeping bell rang did the fire in the incense burner grow fiercer, smoke rushing up toward the painted, peeling bracket sets, while the statue of Lü Dongbin still sat in the hall with lowered eyes."
  QIE_ws_united.10.a: "He was sent by Amitabha to save everyone!"
  QIE_ws_united.11.t: "Presenting Incense"
  QIE_ws_united.11.desc: "Ever since the New Religion of Salvation unified China, Lüzu Pavilion had become the liveliest religious temple in Beijing. After they announced that they would relinquish power and establish a democratic republican government, smoke from Lüzu Pavilion poured from the temple gate day and night without cease. People pressed shoulder to shoulder, one after another, all wanting to stuff their own health, descendants, and wealth into the sticks of incense sold in the temple for sixty cents, so that the New Religion of Salvation and Fuyou Emperor would remember them. The old woman squeezed in at just this time. She was jostled by the crowd until she could barely stand, while her hand clutched tightly the three sticks of incense and two coins she had bought from the temple. Seeing that her legs and feet were inconvenient, the incense attendant responsible for watching over the offerings gave her a hand. When they passed the auspicious vat, the old woman muttered something under her breath while dropping the coins into it.\n\n“This way, you may worship here.” He pointed to an open space. The old woman knelt devoutly, raised the incense above her head, kowtowed nine times toward the statue of Lüzu inside the hall, then lit the incense and inserted it into the burner. Once she had finished this, she began looking all around, searching for something.\n\n“Are you asking for a divination lot, requesting a dharma-image photograph of the founders of the Five Religions, or seeking a spirit-writing consultation?” “None of that matters. I want to ask you something: where is the image of Jiang Chaozong?”\n\n“Jiang Chaozong?” “Yes. Is he not the religious leader of the New Religion of Salvation? Such a great figure should receive a few sticks of incense too.”\n\nThis put the incense attendant in some difficulty: “Old lady, General Diwei is still alive at present. I fear this incense cannot——” “It is more efficacious because he is alive!” Her speech was slow, but very serious. “He brought the whole realm together. Is that not great merit? Others all say he abdicated and gave power to a Good People Government, but good people are good people, and saviors are saviors. The world must always have a wise ruler. Religious Leader Jiang is the wise ruler sent down by Heaven to set this chaotic age in order. The true savior of the Chinese people is not written into being by newspapers; he is appointed by Heaven. If people do not worship such a good immortal, can they still be considered human?”\n\nThe incense attendant did not know what to say. Not until the timekeeping bell rang did the fire in the incense burner grow fiercer, smoke rushing up toward the painted, peeling bracket sets, while the statue of Lü Dongbin still sat in the hall with lowered eyes."
