  QIE_wushan_world_moral_association: "World Ethical Society"
  QIE_wushan_world_moral_association_desc: "The concept of the World Ethical Society can be traced back to 1921,when it developed from Kang Youwei and his Confucian Church. Its purpose was precisely to “promote morality,and save the human heart”. \nIn the past,the son of the founder of the World Ethical Society Jiang Xizhang wrote a book entitled <Illustrated Explanation of the Three Thousand Great Thousand Worlds>,which expounded the mysteries of life and death,and revealed the true meaning of the Confluence of the Five Religions. It also used illustrations to depict extraterrestrial life beyond the universe. \nToday the World Ethical Society will serve as the vanguard through which we proclaim the virtues of Chinese rites and teachings,save this world from the poison of Western culture,and allow true peace and true civilization to descend upon the world once more. "
  QIE_wushan_world_moral_association_member: "World Ethical Society"
  QIE_wushan_world_moral_association_member_desc: "The concept of the World Ethical Society can be traced back to 1921,when it developed from Kang Youwei and his Confucian Church. Its purpose was precisely to “promote morality,and save the human heart”. \nIn the past,the son of the founder of the World Ethical Society Jiang Xizhang wrote a book entitled <Illustrated Explanation of the Three Thousand Great Thousand Worlds>,which expounded the mysteries of life and death,and revealed the true meaning of the Confluence of the Five Religions. It also used illustrations to depict extraterrestrial life beyond the universe. \nToday we have become a member of the World Ethical Society,and although we nominally possess the same “status of gentlemen” as its leader,something about the situation seems rather wrong……"
