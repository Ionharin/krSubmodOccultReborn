  faction_manifest_world_wide_ethical_society_name: "Great Harmony Under Heaven"
  faction_manifest_world_wide_ethical_society_desc: "We will bring most nations of the world under the control of the World Ethical Society,thereby realizing the unfinished ideal of Kang Youwei,uniting the entire world into a supranational entity,and using Confucian order and Chinese culture to bring a “final solution” to this world ravaged by war. "
