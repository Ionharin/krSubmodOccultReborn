  QIE_pnr_ws_puppet.1.t: "Deciding the Governor of [JAP.GetName]"
  QIE_pnr_ws_puppet.1.desc: "[QIE.GetLeader] had barely sat down when the refined secretary beside him wearing glasses,immediately bowed low,lowered his head beside the desk,and extended the document with both hands into the space between the desk and [QIE.GetLeader]. “This is the third telegram this month,and it is still the same issue,the Japanese want to know who exactly the Governor is. ”A long time has passed since the continental campaign of [JAP.GetName] ended in disgrace,and even the home islands were effortlessly occupied by the eastern dragon of [QIE.GetName]. At the time of surrender——or “termination of the war” as they called it——,[JAP.GetName] accepted many demands ranging from disarmament to reparations,including the complete takeover of its government by [QIE.GetName]. The treaty stipulated,that [QIE.GetName] would establish a military government in postwar [JAP.GetName],and appoint a Governor to administer it. \n\nIn truth [QIE.GetLeader] had not yet made up his mind either,under the treaty,[JAP.GetName] had already lost the ability to threaten the rule of [QIE.GetName],so long as the rule of [QIE.GetName] remained as unbreakable as that of the German Empire,and it continued to maintain its position as the hegemon of East Asia,[JAP.GetName] could henceforth exist only as a vassal state. As for this place devastated by war,with nothing except refugees,famine,the mafia and a dysfunctional government,sending anyone there would amount to exile from the center of power. [QIE.GetLeader] simply had not decided whom to remove from Beijing,so the matter had been set aside for the time being. \n\nThe days passed one after another,and allowing matters to drift like this was no solution. [QIE.GetLeader] had to make a decision,and when considering who within China was presently dangerous,it was probably that other figure opposed to the [QIE.GetName] doctrine of “Confluence of the Five Religions” known as the “living god”——Duke Yansheng Kong Decheng. If he could be expelled,[QIE.GetRulingParty] could interpret Confucianism more freely in accordance with its actual intentions；but there was in fact another choice,which was to support the old friend of [QIE.GetRulingParty] in Japan,the Oomoto leader $JAP_pnr_onisaburo$. This man was obsessed with eschatology and becoming the father of the Japanese nation,and although [QIE.GetLeader] sometimes thought that he was merely feigning madness,his behavior seemed to prove that he was sincere. There could be nothing better than throwing this broken toy to a lunatic who had lost his mind,and if [JAP.GetName] somehow came back to life,it could simply be taken back from him. "
  QIE_pnr_ws_puppet.1.a: "In that case,throw Kong Decheng to them. "
  QIE_pnr_ws_puppet.1.b: "Has Onisaburo not always dreamed of this? "
  QIE_pnr_ws_puppet.2.t: "The Second Shambhala Expedition"
  QIE_pnr_ws_puppet.2.desc: "$JAP_pnr_onisaburo$ has informed us,that he will soon travel to Mongolia to continue the Mongolian expedition that was interrupted last time by $FNG_zhang_zuolin$. In 1924 he attempted to enter Mongolia through the northeast,seeking the mysterious kingdom of Shambhala——a paradise beyond the mortal world found in Buddhist mythology,and the dwelling place of perfect beings. The expedition hired a small band of local brigands as a security force. Unfortunately trouble soon followed,the brigands were discovered and destroyed by Zhang Zuolin,while the expedition was naturally arrested in its entirety as accomplices of the brigands,with plans made to choose a suitable day to execute them all by firing squad. \n\nOnly after the Japanese side sent Zhang Zuolin a telegram,did Zhang Zuolin learn that he had arrested the wrong people,and had actually seized Japanese nationals this time. $JAP_pnr_onisaburo$ and the others were subsequently able to return to Japan,but the Shambhala expedition also ended because of the incident. Now under the rule of $JAP_pnr_onisaburo$ and [QIE.GetName],[JAP.GetName] and [QIE.GetName] have finally achieved lasting peace,which has led him to begin planning a second expedition. \n\n$JAP_pnr_onisaburo$ believes that he is certain to find something in Mongolia,and plans first to visit Beijing to meet [QIE.GetLeader],then after a brief rest to head north into Mongolia,for which he needs to borrow some weapons from us——because of the previous peace treaty between [JAP.GetName] and [QIE.GetName],he arrived this time without,and was unable to carry any weapons. "
  QIE_pnr_ws_puppet.2.a: "Of course of course,give him some weapons for self defense. "
  QIE_pnr_ws_puppet.3.t: "Deep into the Heartland"
  QIE_pnr_ws_puppet.3.desc: "The march through Mongolia was very tedious,and the destination of $JAP_pnr_onisaburo$ and his companions was the Orkhon Valley west of Ulaanbaatar. In the minds of the Mongols,Mount Orkhon is the axis of the world,and the souls of generations of khans and ancestors dwell there,releasing power downward from the mountain,and granting the khan the sacred authority to rule the tribes. As for $JAP_pnr_onisaburo$,he firmly believed that the entrance to the mysterious kingdom of Shambhala,the “Kingdom of Light” was hidden there. \n\nBut the march itself remained very dull,overwhelming the joy and unease of the pilgrimage to the sacred place. Everyone had to begin chatting to keep their minds focused. Someone asked the guide leading them whether anything interesting had happened recently,so the guide told a story he had heard about a clash during the age of warfare: it was said that farther west in Xinjiang there was a young and brutal warlord,who on one occasion had to face a regiment with only a few dozen men,yet he felt no fear,and set out with his companions and a large herd of horses. He drove the herd forward against the wind,charging onward,and shouted “Hand over your weapons immediately,or I will lead my entire army against you! ”When the enemy saw the dust raised by the horses,they believed a great army was approaching,and obediently surrendered. \n\n“Just like a story about Genghis Khan! ”someone in the party praised. But the guide looked somewhat disdainful: “Good friends,do you know what happened afterward——not one person in the surrendered regiment was left alive——that warlord killed them all! He was a complete madman,and even said that he would fight all the way to the East China Sea,and rebuild a great Islamic state on the continent! ”\n\nJust as their conversation grew lively,a cloud of dust like the one in the story suddenly rose from the right side of the party,the guide narrowed his eyes,then abruptly cried out as though he had seen Death itself: \n\n“Horse bandits are coming! ”"
  QIE_pnr_ws_puppet.3.a: "Open fire! "
  QIE_pnr_ws_puppet.3.b: "Split up and flee! "
  QIE_pnr_ws_puppet.2.b: "This madman truly believes there is a paradise beyond the mortal world……"
  QIE_pnr_ws_puppet.4.t: "A World Ablaze with Many Colors"
  QIE_pnr_ws_puppet.4.desc: "I do not know how long I rode,but at last I escaped those bandits,and found my way into some place unknown even to me. I was lost here,but that was no great problem,as long as I kept traveling east I could return to Ulaanbaatar. The immediate priority was water,and fortunately there was a small stream here. So now nothing was a problem. I tethered the horse,filled my water bag beside the river,and drank a great deal. Then I found a rock to lean against and rest. \n\nBy the time I awoke the sky was already dark,and an old man with a white beard older even than I,stood before me leaning on a staff. When he saw that I had awakened he told me,that he was the Ubusuna deity of Anatai Temple,and that this was a sacred place overflowing with spiritual power,which allowed him to manifest,and that he had come here under the instructions of other heavenly deities,to help me find the thing I wished to obtain. The first Archangel Wakahimegimi no Mikoto had ordered him to come here,and guide me toward the “Kingdom of Light”. I wanted to mount the horse,but the horse was gone. \n\nThe Ubusuna deity told me that this place was the boundary between the spirit world and reality,where livestock with clouded souls found it difficult to enter. He pointed toward the other end of the river,and together we mounted an auspicious cloud,flying swiftly over the sleeping city,until we reached a cave behind a mysterious waterfall. The Ubusuna deity told me that this was the entrance to the “Kingdom of Light”,and that after passing through seven times seven towers numbering forty nine,we would reach the “Kingdom of Light”. It was an immortal realm inhabited by transcendent beings,and because I was alive I could not enter,but could only gaze upon it from afar. "
  QIE_pnr_ws_puppet.4.a: "Then let us go. "
  QIE_pnr_ws_puppet.5.t: "A New Tale of the Spirit World"
  QIE_pnr_ws_puppet.5.desc: "After passing through many strange realms,at some point I became separated from the Ubusuna deity again. A strange rustling sound came from above my head,and I looked up at the sky,but there was nothing there. When I looked forward again the surroundings had become a roaring river carrying mud and sand,its sound like thunder,and terrifying to hear. A lion whose mane resembled flames leapt from the great river and blocked my path,letting out a low growl at me,and this must surely have been the guardian deity of the sacred place. \n\nIt said that it guarded this place under the command of Takateruhime no Mikoto of Ashihara Mizuho no Kuni. Ever since Takateruhime no Mikoto attacked the demon lord Tokoyohiko of Jerusalem with the Sword of Destruction and was imprisoned in the Garden of Eden,he had been demoted here to guard the gate of the “Kingdom of Light”——only the blessed dead could walk across this river,while the living and sinners would fall because of their own weight. Just as I prepared to turn back after the warning of the guardian,a beautiful youth dressed in white came from the opposite bank walking upon the stars,and he possessed a beauty beyond the mortal world,before which even Ariwara no Narihira would have been overcome with shame. \n\nThe youth dressed in white reached out and stroked the fur of the lion,calming the fierce beast. He then bowed deeply to me,pressed his palms together before his chest,and said: \n\n“I am the great deity who administers this place,and have been commanded to remain vigilant lest the clan of Pangu destroy the Jordan River once more. Now the cycle of heavenly destiny has arrived,and Kunitokotachi has ordered me to wait here,and await your coming. Together we shall travel to the spirit world,join in the great divine work of the universe,and transform into a supremely compassionate deity who will save the Three Realms. ”\n\nThe youth extended his right hand toward me,and behind me,the urgent call of the Ubusuna deity suddenly came,telling me not to linger too long,and to continue onward with him. "
  QIE_pnr_ws_puppet.5.a: "I will go no farther,and shall not cross beyond this point. "
  QIE_pnr_ws_puppet.5.b: "I heard the clear sound of a flute. "
  QIE_pnr_ws_puppet.6.t: "A New “Pope”,or Administrator of the Holy Sites"
  QIE_pnr_ws_puppet.6.desc: "With our capture of the final holy site,most places in the world where apparitions of the Christian Virgin Mary have occurred,along with holy sites closely connected to Christianity itself have fallen into our hands. It can be said,[ROOT.GetName] is the true heir to the spirit of the Crusades. To govern these holy territories stretching across several continents,we have followed the model of the quasi states once established by the great powers as “Legation Cities”,and sponsored a special urban organization headquartered in the Vatican. \n\nYet for a long time,we have not appointed a Governor to administer the relevant affairs of the newborn Vatican,which operates under the just supervision of benevolent Chinese officials. Without a Governor,it will be difficult for affairs to proceed——the best choices are the cardinals already within the Vatican,but recruiting authoritative figures from the various holy sites would also be a sound alternative. Whoever it may be,he will ultimately have to remain under our control. "
  QIE_pnr_ws_puppet.6.a: "Alfred·Baudrillart,a French cardinal. "
  QIE_pnr_ws_puppet.6.b: "Luis·María·Martínez,from Mexico. "
  QIE_pnr_ws_puppet.6.c: "Manuel·Gonçalves·Cerejeira,a Portuguese cardinal. "
  QIE_pnr_ws_puppet.6.d: "Michael·von·Faulhaber,a German cardinal. "
  QIE_pnr_ws_puppet.6.e: "Pierre·Célestin——our old colleague. "

  ### Limited War ###
  limiting_war_begonia_leaf_cat: "Limited War"
  limiting_war_begonia_leaf_cat_desc: "[RUS.GetName] is an extremely powerful opponent,but we have no need to enter a total conflict with them. We have no intention of completely destroying [RUS.GetName],and our purpose is merely to answer the voice of the people,and demand from them what already belongs to us. If an honorable master is cheated out of money and goods by a swindler,does the master therefore lose rightful ownership of those things? As the most legitimate master of Outer Manchuria,we will reclaim the property that has always belonged to us. "
  limiting_war_begonia_leaf_cat_tt: "Unlock decisions: £GFX_decision_icon_small §YOperation Codename: Scarlet Begonia§!"
  limiting_war_start_begonia_leaf: "Operation Codename: Scarlet Begonia"
  limiting_war_start_begonia_leaf_desc: "Deep is the grace of planting beneath the same rain and dew,one cluster pale and another rich. Never in life relying on the spring breeze,it dares compete with every flower in brilliant red———we will launch against §Y[RUS.GetName]§! a §Ylimited war§!. So long as we rapidly achieve our objectives,once we control every region we plan to occupy,we can avoid escalation into total war with [RUS.GetName]——moreover,this conflict is also a simple test,and if the facts prove that [RUS.GetName] is not as powerful as we believed……"
  is_not_engaged_in_a_limited_war: "We are not currently engaged in another limited war"
  limiting_war_begonia_leaf_mission: "Operation Codename: Scarlet Begonia"
  limiting_war_begonia_leaf_mission_desc: "Control all intended regions to win the §Ylimited war§!,and incorporate them into our territory without escalating into total war. \n\nIf our surrender progress exceeds §Y10%§! this limited war will end in §Rfailure§!. "
  limiting_war_start_begonia_leaf_tt_main: "Begin against §Y[RUS.GetName]§! a §Ylimited war§!. \n\nIf our surrender progress exceeds §Y10%§! this limited war will end in §Rfailure§!. \nEven if we control some of the target territory,losing the limited war itself may force us to §Rreturn§! territory conquered earlier. "
  limiting_war_events.1.t: "Outer Manchuria Returns! "
  limiting_war_events.1.desc: "Our enemy,the shameless thieves and brigands,the forces of [RUS.GetName] are collapsing,and our victory is now certain,after nearly a century,the fertile lands of Outer Manchuria have finally been placed firmly once more in the hands of their true master. \n\nThere is no doubt,that as we win victory after victory in the contested regions,the old imperialist forces entrenched in Moscow must be trembling,and praying to the gods they worship that our army will not utterly destroy their country. When the truly righteous and moral people of this world take up powerful firearms and strike back with all their strength,blessed by the twin weapons of thought and matter,how could [RUS.GetName] possibly avoid defeat? "
  limiting_war_events.1.a: "My loyal heart is a lodestone,never resting until it points north! "
  limiting_war_events.1.b: "[RUS.GetName] does not seem as powerful as we imagined……"
  limiting_war_events.2.t: "[FROM.GetAdjective] Achieves a Strategic Breakthrough"
  limiting_war_events.2.desc: "The unexpected has happened after all,and our recent military conflict with [FROM.GetName] in the Far East has ended in our defeat——although the quality and equipment of their army were inferior to ours,the [FROM.GetAdjective] forces still outmaneuvered our troops,and seized control of the Far East——or Outer Manchuria as they call it. \n\nThese people who claim to honor their ancestors deny the treaties their own forebears signed in black and white nearly a century ago,and brazenly sent troops to occupy territories that had long since been ceded to us. \n\nIn any case,their advances have caused these territories to fall temporarily into their hands,and there is no doubt,that their occupation has also weakened our authority. Continuing the conflict may further erode discipline and confidence,but abandoning the territory would mean admitting defeat before the [RUS.GetAdjective] public——and the people likely do not wish to see weakness from our government. "
  limiting_war_events.2.a: "We must cut our losses immediately. "
  limiting_war_events.2.b: "We will never abandon the rightful territory of our nation! "
  limiting_war_events.3.t: "[FROM.GetName] Accepts Defeat"
  limiting_war_events.3.desc: "News has arrived from Moscow that the imperialists are begging for peace,and there is no doubt that our military operation has achieved complete success,the enemy has lost all will to resist,and fearfully kowtows before us to beg for peace. [FROM.GetName],to avoid further retribution from us has formally relinquished control of Outer Manchuria. There is no doubt,that this victory has elevated our position in the world,intimidated those imperialists,and safeguarded our territorial integrity. "
  limiting_war_events.3.a: "The dragon soars in the East! "
  limiting_war_events.4.t: "[FROM.GetNameDefCap] Chooses Total War"
  limiting_war_events.4.desc: "[FROM.GetNameDefCap] is no longer pretending to seek negotiations with us,and it seems that their gains in the Far East have given them the courage to challenge us. Their intentions now appear perfectly clear: they mean to conquer our country completely. We must face a total war against them. "
  limiting_war_events.4.a: "Never compromise,never surrender. "
  limiting_war_events.5.t: "The [QIE.GetAdjective] Assault Stalls"
  limiting_war_events.5.desc: "Recently [QIE.GetName] suddenly launched an undeclared surprise attack in the Far East,and in the early stages of the war,the rapid advance of the [QIE.GetAdjective] forces caught us unprepared,but as the war has dragged on,their pressure has steadily increased,and their battlefield performance has gradually declined. The weaknesses of their army have been exposed. For the [QIE.GetAdjective] army,the planned lightning war has become a bitter struggle. We can choose magnanimity,and offer concessions,providing them a way out,but the board has now turned,and the decision whether to spare them or pursue total victory now lies with us. "
  limiting_war_events.5.a: "Offer concessions. "
  limiting_war_events.5.b: "We will accept only complete victory. "
  limiting_war_events.6.t: "The War in the Far East Goes Poorly"
  limiting_war_events.6.desc: "Our offensive in Outer Manchuria has reached a stalemate,but that is not the problem,the problem is that our enemy has already noticed it. They have realized that our operational plan is not proceeding smoothly. Now they have issued us an ultimatum,either we surrender immediately to reduce our losses,or continue the war,and endure still more bloodshed. "
  limiting_war_events.6.a: "Then let us negotiate peace. "
  limiting_war_events.6.b: "Until our lost homeland is recovered,we will not stop! "
  limiting_war_events.7.t: "[FROM.GetName] Refuses to Surrender"
  limiting_war_events.7.desc: "[FROM.GetName] has made it clear,that they would rather see their entire country reduced to ashes,than yield to us in the slightest. Our war will continue,and has now developed completely into a total war. "
  limiting_war_events.7.a: "The arrow is on the string,and must be loosed. "
  limiting_war_events.8.t: "[FROM.GetName] Seeks Our Surrender! "
  limiting_war_events.8.desc: "Intercepted communications from the enemy high command have confirmed our deepest fears: there will be no negotiated settlement,and no concession that allows this war to end in moderation. What they demand amounts to the complete surrender of our nation,and they intend to leave us struggling to survive beneath the iron heel of yet another imperialist. If this is their objective,then we have only one answer: we will never submit. "
  limiting_war_events.8.a: "[ROOT.GetNameDefCap] fights to the end! "
  limiting_war_events.9.t: "[FROM.GetName] Rejects Mediation"
  limiting_war_events.9.desc: "[FROM.GetName] rejected every proposal involving territorial concessions in the Far East,declaring them unacceptable. Their leadership claims,that this war has brought them humiliation,and only the destruction of our nation can end the conflict. "
  limiting_war_events.9.a: "It is merely a second Battle of Albazin! "
