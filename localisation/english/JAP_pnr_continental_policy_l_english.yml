 JAP_pnr_continental_policy_category: "Continental Policy"
 JAP_pnr_continental_policy_category_desc: "\nWe have resolved to pursue a balanced policy of divide and rule in China. To this end, we may covertly fund the various Chinese factions, ensuring that the continent remains divided for the long term. To avoid repeating the mistakes of the Nishihara Loans, we have made some small adjustments to the funding scheme; in time, China will become our puppet and, eventually, be absorbed by us.\n\n\n"
