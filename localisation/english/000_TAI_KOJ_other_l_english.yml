 ### Ideas ###

 TAI_pnr_aftermath_of_wushe_incident: "Aftermath of the Wushe Incident"
 TAI_pnr_aftermath_of_wushe_incident_desc: "The aftermath of the bloody conflict waged by Taiwan's local indigenous people against the Japanese and Han still lingers on this small island, and people remain anxious over whether the present calm will once again be broken by a similar incident."
 TAI_pnr_imperial_back_garden: "The Empire's Back Garden"
 TAI_pnr_imperial_back_garden_desc: "Japan has ruled Taiwan since 1895, nearly forty years ago. As armed resistance on the island has gradually died down, Tokyo has adjusted its strategy toward Taiwan and begun strengthening both cultural rule and economic construction."
 TAI_pnr_cockcroft_walton_accelerator: "Cockcroft-Walton Accelerator"
 TAI_pnr_cockcroft_walton_accelerator_desc: "Arakatsu Bunsaku defeated the research teams of Nishina Yoshio and Kikuchi Seishi far away in the Japanese home islands, successfully achieving artificial nuclear disintegration in the harshest conditions of the laboratory at Taihoku Imperial University. This was the second success in the world, and the first in Asia. Without question, it once again proves that even when constrained by inadequate external conditions, the yellow race can achieve progress that draws the eyes of the world. Asians and Asian science shall stand tall in the world before long!"

