 KOR_pnr_people_born_in_the_land_of_the_country: "生于国土之民"
 KOR_pnr_people_born_in_the_land_of_the_country_desc: "大韩民族并不是被任何狭义的血统论所构建起来的民族，正相反，它是一个文化和思想的共同体。大韩民族既有其自历史而来的辉煌，也有随着返乡而不断融入结合的新民族。"
 KOR_pnr_radio_speech: "太极道的无线电波"
 KOR_pnr_radio_speech_desc: "借助无线电广播，我们便能突破地理与物理限制，利用广泛普及的音频媒介跨越宣教边界。并高效地向偏远地区受众传递信仰信息。"
