 KOR_pnr_the_hibiscus_blooms: "韩国复还"
 KOR_pnr_the_hibiscus_blooms_desc: "结束了，历经多年的抗争，在无数志士的牺牲的红与白的血肉骨堆之下，朝鲜人民终于得以重新与自由相伴。如今，木槿二度盛放于这片土地；如今，朝鲜二度存在于这片土地。"
