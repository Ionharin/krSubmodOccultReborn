 KOR_pnr_changjin_river_dam_desc: "KOR_pnr_changjin_river_dam_desc"
 KOR_pnr_repair_japanese_ships_desc: "KOR_pnr_repair_japanese_ships_desc"
 KOR_pnr_expel_japanese_residents: "驱逐日本居民"
 KOR_pnr_expel_japanese_residents_desc: "尽管日本殖民当局已经撤离，但依然有数百万日本人滞留在韩国境内。韩国是属于韩国人自己的韩国，这些长期以来霸占韩国人土地的日本侵略者必须离开。"
 KOR_pnr_promote_co_prosperity: "推动共荣"
 KOR_pnr_promote_co_prosperity_desc: "日本殖民当局离开了我们的土地，他们抛下了在这段时间内生活在这里的数百万日本人，这些人受到国家的号召来到韩国，却又被他们的祖国无情地抛弃。虽然韩国人是这片土地正当的主人，但要求这些日本人离开自己已经生活了几十年的第二故乡未免有些太过无情。\n\n我们或许应该宽慰他们，只要他们愿意加入韩国，成为韩国的一份子，就应该让他们继续在这里生活下去。"
 KOR_pnr_dysfunctional_government: "离心离德的政府"
 KOR_pnr_dysfunctional_government_desc: "尽管甑山教凭借在日本殖民时期和侵略者进行敌后对抗而在乡村地区积累的声望掌握了韩国的政权，但那些在前线直面日本侵略者的光复军势力恐怕不会容许我们轻易掌握政权，我们必须寻求与他们之间的解决方案。"
 KOR_pnr_metropole_patronage: "宗主国荫蔽"
 KOR_pnr_metropole_patronage_desc: "虽然难以启齿，但如果没有我们的宗主国，我们恐怕无法这么轻易地光复我们的国家。显而易见的是，一穷二白的我们在战后重建上也不得不偶尔依赖他们的援助。从好的角度来说，这将促进我国的经济正常化；从坏的角度来说，这意味着我们的宗主国将更进一步掌握我们的经济。"
 KOR_pnr_land_reform_in_progress: "农地改革进行中"
 KOR_pnr_land_reform_in_progress_desc: "我们正在对我国的农业结构采取“有偿征用、有偿分配”的改革，但这势必会引发传统地主势力和农民两方面的不满，我们必须承受住压力。"
 KOR_pnr_korean_agricultural_cooperative: "韩国农协"
 KOR_pnr_korean_agricultural_cooperative_desc: ""
 KOR_legitimacy_idea_pnr_khg: "东学承继: §t溥天之下§!"
 KOR_legitimacy_idea_pnr_khg_desc: "在§t$KOR_pnr_kim_hong_gyu$§!和他重组的六十人委员会的带领之下，韩国在世界上以一个新的模样站起来了。\n\n不单单是普天教，回望整个东学起义运动，其力量绝不源于任何神佛，儒学甚至是圣人和皇帝，而是源自它所拥有的，所发动的遍布乡村的信众和社团组织。\n\n韩国人已经将日本殖民政权驱赶出了他们的国家，但如果普天教继续沉溺于所谓的圣人神话，只会被这些曾经支持它的广大群众抛在后面，成为反动落后的迷信团体。正是因此普天教作出了选择，它如今成为了韩国民族国家的群众组织和精神支柱。\n\n§t后天开辟，已成现实。§!"
 KOR_pnr_education_reform: "教育改革"
 KOR_pnr_education_reform_desc: ""
 KOR_pnr_korean_youth_league: "大韩青年团"
 KOR_pnr_korean_youth_league_desc: "大韩青年团是一个由韩国爱国青年和知识分子组成的社团，与中国地区的中国青年党类似，他们反对外国干涉，主张韩国民族主义。与他们的合作将帮助政府进一步维持社会公共秩序，并进一步强化在公众心目中我们追求独立自主道路的形象。"
 KOR_pnr_seoul_normal_school_idea: "汉城师范学校"
 KOR_pnr_seoul_normal_school_idea_desc: ""
 KOR_pnr_hwaebaek_conference: "20世纪和白会议"
 KOR_pnr_hwaebaek_conference_desc: "和白会议是古老的韩国议会制度，始创于公元1世纪。车京石的登基计划遭到了各方阻挠，他最终不得不调和各党派之间的矛盾，通过由各党派派出领袖共同商议国家大事来决定治国方向。而车京石自己则成为名义上的君王，但就像和白会议一样，车京石对任何事务都没有太多的决定权力。"
 KOR_pnr_destined_monarch: "命定君主"
 KOR_pnr_destined_monarch_desc: "1921年，车京石登上黄石山公开举行了一场祭祀仪式，日军尝试抓捕他，但他却被仙人庇护，奇异地从山上消失了。这使得许多农民和信徒都称他为“命定的君主”。如今车京石二度登基，上天所指派的这位韩国君主终于坐在了属于他的宝座之上。"
 KOR_pnr_winner_takes_all: "赢者通吃"
 KOR_pnr_winner_takes_all_desc: ""
 KOR_legitimacy_idea_pnr_cks: "东学承继: §g普化天尊§!"
 KOR_legitimacy_idea_pnr_cks_desc: "§g$KOR_pnr_cha_kyung_seok$§!端坐在十一殿中，这座宫殿的规模胜过朝鲜王朝的景福宫。而他就在这里作为韩国的君主指引着韩国的道路。\n\n日本殖民政府的败退与韩国的光复，证明了旧日关于“甲子年天子登基”的预言并非荒诞迷信，只是被命运所迫而不得不推迟的计划，普天教过去、现在、将来都不会成为民族政党的工具，它将超越所有这一切，成为韩国人的一部分。\n\n韩国人已经将日本殖民政权驱赶出了他们的国家，后天开辟已经开始，真正的天子，九天应雷声普化天尊之子§g$KOR_pnr_cha_kyung_seok$§!将顺应命运，实现天神的目的。\n\n§g无穷花开，东国永延。§!"
 KOR_pnr_licking_wounds: "舔舐伤口"
 KOR_pnr_licking_wounds_desc: "我们不能忘记那些在日本殖民时期受到了伤害的人们，其中既包括韩国人，也包括日本人。他们都是平等的战争受害者。"
 KOR_pnr_korea_our_consensus: "韩国-我们的共识"
 KOR_pnr_korea_our_consensus_desc: "尽管我们的政府内部各方争斗，但所有政党都应该认同一个共识，那就是韩国本身的发展和韩国人民的幸福。只要所有人都基于这个角度出发，合理地阐明自己的观点，并且能够说服大家，那么我们就会给予支持。"
 KOR_pnr_cultural_revival_idea: "文化复兴"
 KOR_pnr_cultural_revival_idea_desc: ""
 KOR_pnr_ministry_of_healthcare: "医疗保健部"
 KOR_pnr_ministry_of_healthcare_desc: ""
 KOR_pnr_state_of_emergency_idea: "紧急状态"
 KOR_pnr_state_of_emergency_idea_desc: "政府已宣布进入国家紧急状态，这意味着我们面对着极为严峻的问题。"
 KOR_legitimacy_idea_pnr_jjs: "东学承继: §8自证天国§!"
 KOR_legitimacy_idea_pnr_jjs_desc: "太极道究竟意味着什么，解冤相生，后天开辟究竟意味着什么？1909年的§8$KOR_pnr_jo_jeong_san$§!可能会回答说，这意味着韩民族从日本警察的恐怖统治下的解放。当§8$KOR_pnr_jo_jeong_san$§!抬头看向15岁的自己时，他意识到自己并没有背叛。\n\n日本殖民政府的败退与韩国的光复，证明了这是一条正确的道路，他完美地实现了身为少年的自己提出的解答，现在该回答下一个问题了。当韩国人重新夺回自己的故土之后应该做些什么？姜一淳在幻境之中说的“韩国将合为一体”意味着什么？\n\n§8$KOR_pnr_jo_jeong_san$§!无法确定，但他知道，那一定是一个充满欢声笑语，大家不再担心疾病，痛苦，分离与死亡，怀着生命的勇气活下去的美好世界。\n\n§8阴阳和谐，道通真境。§!"
 KOR_pnr_beware_of_corruption: "警惕腐败"
 KOR_pnr_beware_of_corruption_desc: ""
 KOR_pnr_ideal_paradise: "理想乐土"
 KOR_pnr_ideal_paradise_desc: "我们不会继续向民众许愿来世或是数百年后的世界了，我们必须承担起责任，真正的天国不在未来，它必须在当下就降临在这里。"
 KOR_pnr_daejin_university_idea: "大真大学"
 KOR_pnr_daejin_university_idea_desc: ""
 KOR_pnr_three_major_business_budgets_idea: "执行三大事业预算"
 KOR_pnr_three_major_business_budgets_idea_desc: "慈善救助，社会福利，普及教育，这三大事业可以说是对民生来说颇为重要的内容，我们必须不惜一切代价国家化这三大事业。"
 KOR_legitimacy_idea_pnr_phg: "东学承继: §C风调雨顺§!"
 KOR_legitimacy_idea_pnr_phg_desc: "无休止的争吵和利己主义为社会和国家所带来的只能是分裂，韩国已经历了一次泪水，难道韩国的孩子还要为了各自的欲望让她再次流泪吗？必须有人站出来制止这一切，§C$KOR_pnr_park_han_gyeong$§!笃信这一点。\n\n人世间最美好的东西一定是圆，圆没有棱角，自然也没有阻碍，它不妨碍别的事物，也不被别的事物阻碍。如果所有人也能如同圆一样，收敛起自己的棱角，无阻碍，无间断地旋转运行，那么世界上将再无任何怨恨与对立。\n\n日本殖民政府的败退与韩国的光复，意味着对立的时代已经结束，仇恨的延续所带来的只能是无尽痛苦的锁链，作为胜利者的韩国有权宽恕败者，有权以仁慈解除施加在人们身上的，痛苦岁月的诅咒。也唯有如此做，才能真正建立化解一切怨恨，和谐共存的人间天国，走向共同繁荣，互惠互利的未来。\n\n§C安身清心，敬天克己。§!"
 KOR_pnr_rural_autonomy: "乡村自治"
 KOR_pnr_rural_autonomy_desc: ""
 KOR_pnr_relics_of_kang_il_sun: "姜一淳的圣髑"
 KOR_pnr_relics_of_kang_il_sun_desc: "姜一淳是甑山教的创始人与下降凡间拯救世人的弥勒化身，无论甑山教内部的宗派斗争有多激烈，至少每年都会有许多甑山教信徒来到甑山法教的总部祭拜姜一淳。如果说什么东西能够短暂团结分裂的甑山教，那只能是姜一淳的骨骸。"
 KOR_pnr_balance_of_heaven_and_earth: "平衡天地"
 KOR_pnr_balance_of_heaven_and_earth_desc: "$KOR_pnr_kang_soon_im$作出了她的选择，虽然她认为反抗宗主国是不明智的，但她依然决心继续进行天地公事，尽管在未来很长一段时间内，韩国依然会作为一个附属国存在，但它并不会过于依赖这位强大的宗主。"
 KOR_pnr_follow_the_forerunner: "追随先驱者"
 KOR_pnr_follow_the_forerunner_desc: "$KOR_pnr_kang_soon_im$在长久的思考之后给出了她的答案，甑山教信仰比起明确的利益来说并不重要。如果只要奉行事大主义就能够改善韩国人民的生活水平，那她绝不会犹豫。假使在未来的一天，韩国历史书将她描绘为郑兰贞那样的阴险毒妇也无妨，至少现在韩国人民确实地得到了他们急切需要的东西。"
 KOR_pnr_armed_defense: "武装防御"
 KOR_pnr_armed_defense_desc: ""
 KOR_pnr_coastal_batteries: "海上炮台"
 KOR_pnr_coastal_batteries_desc: ""
 KOR_pnr_focus_on_light_industry: "注重轻工业"
 KOR_pnr_focus_on_light_industry_desc: ""
 KOR_pnr_focus_on_heavy_industry: "注重重工业"
 KOR_pnr_focus_on_heavy_industry_desc: ""
 KOR_legitimacy_idea_pnr_ksi0: "东学承继: §O长夜守望§!"
 KOR_legitimacy_idea_pnr_ksi0_desc: "世界处在永恒的变化之中，但不管如何变化却依然是对过去时代的再次重演。上古时期檀君建立韩国，而今日§O$KOR_pnr_kang_soon_im$§!带领人们再度建立韩国。历史在这里出现了呼应和反复，韩国人民不再是历史的阅读者，他们成为了历史显现在当下的媒介。\n\n正因一切命运已经注定，正因所有这一切不过是对一节故事的反复重演，人们才得以从压迫在他们身上的未知的苦难中得到解脱。对于个体的人来说，唯一重要的是他们在过去所记忆的和在当下所经验的，所有这一切将会化为名为“传统”的东西，如同一道涓涓活水在这片土地上延续下去，永不终结。\n\n无情的日本殖民政府曾经试图摧毁这些传统，但他们能够斩落一百颗头颅，却永远无法斩断一次河流。§O$KOR_pnr_kang_soon_im$§!和韩国人民会继续守护这或许并不需要他们保卫的传统，因为他们的祖辈正是这样做的。\n\n§O神檀树下，祈祷不绝。§!"
 KOR_legitimacy_idea_pnr_ksi1: "东学承继: §R粟红贯朽§!"
 KOR_legitimacy_idea_pnr_ksi1_desc: "§R$KOR_pnr_kang_soon_im$§!作出了她的抉择，与其宣称虚妄的独立与自强，更正确的做法是真正走到这个国家的大多数人中间。农民们在哭泣，工人们在哭泣，而政府中大多数人还在针对各自的立场和背后是否受到外国势力指使而相互攻击。\n\n日本殖民政府给韩国带来的深重苦难只意味着日本人的残暴，而不意味着事大主义是错误的。如果只需要磕头效忠就能为数千万韩国人带来生活水平的提升，§R$KOR_pnr_kang_soon_im$§!愿意成为这个民族的罪人，韩国的奸细。政治立场，理想，甚至是甑山法教本身都可以舍弃。在时间的侵蚀下，大多数同志或许忘记了东学起义的初心一一农民们无法生存，而不是农民们渴望斗争。\n\n幸运的是，至少对这个国家中的农民们来说，任何空洞的口号和对§R$KOR_pnr_kang_soon_im$§!人格的诋毁，都无法掩盖她帮助他们脱离贫困的事实。\n\n§R时和岁丰，天下太平。§!"
 KOR_pnr_land_improvement_modifier: "土地改良"
 KOR_pnr_land_improvement_modifier_desc: "这里的土地经过一系列水利改良和化肥施用，其土壤肥力得到的进一步加强。"
 KOR_pnr_hermit_kingdom_idea: "隐士之国"
 KOR_pnr_hermit_kingdom_idea_desc: "自古以来韩国就被称为“隐士之国”，这一方面是因为韩国对外交和扩张不感兴趣，另一方面则是由于我们对外界不确定性风险的厌恶。我们将继承这一名号，但不是在政治上，而是在军事上。我们会将我国打造成一个武装到牙齿的防御性国家，以避免日本的事情再度重演。"
 KOR_pnr_kang_soon_im: "姜淳任"
 KOR_pnr_cha_kyung_seok: "车京石"
 KOR_pnr_jo_jeong_san: "赵鼎山"
