 KOR_pnr_born_in_Jeollabuk_do_desc: "诞降于全北井邑描述"
 KOR_pnr_select_Daesoonjinrihoe: "太极道的宽恕"
 KOR_pnr_select_Daesoonjinrihoe_desc: "大顺真理会的宽恕描述"
 KOR_pnr_select_Bocheonism: "普天教的登基"
 KOR_pnr_select_Bocheonism_desc: "普天教的解放描述"
