 KOR_pnr_the_triumph_of_korea: "光复军的凯旋"
 KOR_pnr_the_triumph_of_korea_desc: "结束了，历经多年的抗争，在无数志士的牺牲的红与白的血肉骨堆之下，朝鲜人民终于得以重新与自由相伴。如今，木槿二度盛放于这片土地；如今，朝鲜二度存在于这片土地。"
 KOR_pnr_the_japanese_who_returned: "引扬日本人"
 KOR_pnr_the_japanese_who_returned_desc: "当年日本政府以所谓“日韩合并”原则占领了韩国，并设立了非法的朝鲜总督府。如今在韩国境内已有超过七十万余日本人，我们将与日本政府达成协约，将他们有序地遣送回朝鲜。"
 KOR_pnr_stay_in_land_your_birth: "脚下即故乡"
 KOR_pnr_stay_in_land_your_birth_desc: "许多生活在非法的朝鲜总督府治下的日本人面对来自东京的终战消息陷入了集体认知失调的状态。尽管有些人出于害怕选择偷渡回到日本，但也有一些日本人为了留在这里而开始学习起韩语。我们的国家亟待建设，或许我们并不需要将这些站在岔路口的日本人全部驱逐。"
 KOR_pnr_heaven_kingdom_begins_underfoot: "乐园将至"
 KOR_pnr_heaven_kingdom_begins_underfoot_desc: "123"
 KOR_pnr_return_to_jeolla_do: "重返全罗道"
 KOR_pnr_return_to_jeolla_do_desc: "123"
 KOR_pnr_national_household_registration: "清查全国户籍"
 KOR_pnr_national_household_registration_desc: "为了有效地管理这个战后新生的国家，合理地调配社会资源，掌握现在国民的数量及其相关信息是十分重要的。同时我们可以借助这次全国人口普查确认在普天教被日本人查禁之后，还有多少人依然信奉我们的宗教。"
 KOR_pnr_discussion_on_the_country_system: "国体之抉择"
 KOR_pnr_discussion_on_the_country_system_desc: "123"
 KOR_pnr_guidance_of_the_aspirant: "金洪奎的指引"
 KOR_pnr_guidance_of_the_aspirant_desc: "普天教之所以能够发展成被朝鲜总督府忌惮的势力，正是因为他广泛地发动了韩国乡村中的群众加入了这一运动——如果普天教继续沉溺于过去的教主神话与皇帝梦想，它只会把韩国再次引入深渊。"
