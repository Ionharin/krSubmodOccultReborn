 ### 决议内容 ###
 KOR_pnr_military_base_catalog: "半岛利益"
 KOR_pnr_military_base_catalog_desc: "在将日本殖民者赶出半岛之后，我们接收了他们遗留在[KOR.GetName]的大多数产业，东洋拓殖株式会社便是其中之一。作为与满铁齐名的另一家拥有特权的日本国营公司，它在殖民时期于韩国控制了约25万公顷土地，是韩国最大的土地所有人。\n\n在我们的积极运作和保全之下，我们将东洋拓殖株式会社改组为“新韩国公司”，帮助新生的[KOR.GetName]管理相关资产，并推动其国家恢复和重建工作。毫无疑问的是，通过牢牢掌控新韩国公司，[ROOT.GetName]将能确保自身在半岛的利益。尽管它已经改组，但它毕竟拥有殖民者的血统，如果我们通过该机构将[KOR.GetName]逼迫得太紧，可能会引发当地居民对我们的反感；另一方面来说，新韩国公司名义上是来帮助[KOR.GetName]恢复经济的，如果一味地追求利润，可能会让[KOR.GetName]摇摇欲坠的经济状态再也无法挽回……\n\n当前新韩国公司为我们提供的利益指数为：§Y[?KOR.KOR_pnr_peninsula_profits_var|2]§!\n\n最新的§3[KOR.GetName]§!民调统计结果为：§Y[?KOR.KOR_pnr_peninsula_collapse_var|2]§!\n这意味着§3[KOR.GetName]§!人对我们[KOR_pnr_peninsula_profits_collapse_status_scripted]\n\n§3[KOR.GetName]§!当前面临的经济危机指数为：§Y[?KOR.KOR_pnr_peninsula_economic_health_var|2]§!\n这意味着§3[KOR.GetName]§!经济状态处于[KOR_pnr_peninsula_profits_economic_status_scripted]"
 KOR_pnr_daegu_crisis_countdown: "大邱危机"
 KOR_pnr_daegu_crisis_countdown_desc: "由于建国初期物资不足，庆尚道大邱市爆发了一场令人痛心疾首的瘟疫。但在这场惨剧背后似乎有邪恶的分离势力在暗中煽动不和，人们走上街道和政府对峙，生产工作陷入停摆。我们必须尽快摆平这件事！"
 KOR_pnr_ensure_the_suppression_plan: "确保镇压计划"
 KOR_pnr_ensure_the_suppression_plan_desc: "毫无疑问，这场大邱危机本来是一场普通的公共卫生问题，却在境外势力的煽动下变得如此严重。我们将制定详细的镇压计划，以确保将所有匪徒捉拿归案。"
 KOR_pnr_operation_taeguk_tiger: "太极虎作战"
 KOR_pnr_operation_taeguk_tiger_desc: "我们已经集结了镇暴所需的相关武装力量，只要我们的装甲车和坦克开入大邱市，任何起哄的民众都会下意识地闭门不出。到那时候那些还在街上和我们对抗的无疑就是暴徒。"
 KOR_pnr_namwon_month_riot_countdown: "[GetYear]咸兴暴动"
 KOR_pnr_namwon_month_riot_countdown_desc: "由于丑闻在[KOR.GetName]持续发酵，这场示威游行在有心的民族主义者——甚至是其政府本身——的推波助澜下已变成了一场全面暴动。咸兴市民们要求政府立刻改变对我们的态度，不然就无法保证他们不会武装推翻政府。这是赤裸裸的恐吓，他们决不是一般的暴徒，尽管可能会进一步激化两国矛盾，但为了我们的利益，我们必须重拳出击。"
 KOR_pnr_cut_off_namwon_supply_lines: "切断咸兴补给线"
 KOR_pnr_cut_off_namwon_supply_lines_desc: "为了彻底镇压暴乱，第一步就是切断咸兴市周围的交通线和电话线，让物资无法进入咸兴，他们也无法把城市内的信息传达给在外潜伏的其它破坏分子。这将有助于我们的后续行动。"
 KOR_pnr_month_blitz_operation: "[GetMonth]速攻行动"
 KOR_pnr_month_blitz_operation_desc: "我们将发动一场迅速的速攻行动，彻底镇压咸兴市愈演愈烈的暴动。由于他们根本无法和外界联系，或许我们可以放手去做，让他们明白自己的行为是多么愚蠢，并后悔作为境外破坏势力的鹰犬参与到这场无谋的暴乱之中！"
 KOR_pnr_daegu_standoff_ongoing: "§t大邱危机正在进行中……§!"
 KOR_pnr_hamhung_situation_out_of_control: "§t咸兴暴动正在进行中……§!"
 KOR_pnr_daegu_suppression_plan_finished: "镇暴计划已拟定完毕"
 KOR_pnr_namwon_supply_lines_cut: "我们已切断暴徒的交通线与对外联络渠道"

 ### 事件 ###
 KOR_pnr_puppet.1.t: "另一个选择？"
 KOR_pnr_puppet.1.desc: "游行流血事件所引发的对立至今仍未平息，这成功证明统一的光复军本来就没有真正存在过，派系斗争已从最开始的互相对峙变成了零星的武装冲突，归国的大韩民国临时政府似乎已经无法控制住事态。我们当然可以等待这场冲突的斗争停息，但比起将希望寄托在刚刚归国的临时政府身上，或许我们可以选择扶持早就存在于[KOR.GetName]，和当地民众有着深入联系的组织——勤劳人民党似乎是一个好选择，但吕云亨本人目前也深陷这场左右争端的漩涡之中。\n\n就在这时，一个超越政党的组织映入了我们的眼帘——甑山教，这是在本世纪初诞生于[KOR.GetName]的一个新兴宗教，它与东学党起义（甲午农民战争）关系密切，是那些激进人士在起义失败后植根于[KOR.GetNameAdj]农民中间的组织。在日本殖民时期，甑山教成为了许多[KOR.GetName]本地革命进步人士对抗日本殖民政府的据点。这同时也招致了日本警察对他们的疯狂搜捕和报复。但无论如何，他们凭借着自己的顽强的生命力还是存活了下来，并且一直支持着[KOR.GetName]解放运动。虽然这很疯狂，但是我们并不是不能支持他们……"
 KOR_pnr_puppet.1.a: "相信他们。"
 KOR_pnr_puppet.1.b: "还是算了。"
 KOR_pnr_puppet.2.t: "三千里江山之歧路"
 KOR_pnr_puppet.2.desc: "尽管光复军拥有反日战争和民族光复的象征合法性，大韩民国临时政府对这个国家也确实有着正当的统治权——但在这几十年之后，他们治理整个半岛的行政基础却有所动摇，长期流亡在外使得他们与地方势力和基层群众颇为疏远。任何一个韩国人都不会否认，韩国光复的成就是在外的光复军和在内的韩国地方组织共同达成的。临时政府和光复军离开这片土地已经过去多少年了？在这段殖民政府统治的黑暗岁月里，是那些依然留在这里的人把大家团结起来，并为在外的临时政府筹集资金，有些人甚至为此付出了生命的代价。\n\n难道只有光复军为韩国流的血才是真正的血吗？在我国的支持，担保和游说之下，甑山教——一个在日本殖民时期积极在后方抗击侵略者，为临时政府提供行动资金相关资源的地方组织得以作为政府暂时控制[KOR.GetName]，它将作为润滑剂连接本土乡村，安抚农民和地方社会，帮助[KOR.GetName]顺利度过政权建立初期的动荡。\n\n这是一种建国妥协，大韩民国临时政府对我们的选择表示十分遗憾，并且终有一日，[KOR.GetName]将不得不处理这种撕裂。"
 KOR_pnr_puppet.2.a: "我们的新邻居会是谁？"
 KOR_pnr_puppet.3.t: "普天教希望得到支持"
 KOR_pnr_puppet.3.desc: "我们收到一封从[KOR.GetName]发来的电报，甑山教中的一个势力：普天教希望能够得到我们的支持。就像大多数组织那样，甑山教内部并非铁板一块，而普天教则是其中具有影响力的几个庞大教团之一。普天教于1918年创立，在日本殖民政府统治时期，他们在朝鲜半岛获得了约600万信徒，可以说他们广泛地和韩国人民联系在一起。\n\n然而普天教中也有两股势力，其中一股势力渴望延续普天教的宗教神话，他们相信普天教是由九天应雷声普化天尊赐下的，其教主车京石则是天尊之子，是上天赐给韩国的君主。车京石曾在十几年前在山上祭天，宣布韩国独立并“登基”，他的行为随后受到了日本政府的打压。\n\n另一股势力由普天教的二号金洪奎主导，他是金九的好友，曾组织了几次对大韩民国临时政府的筹款。在他携带十万韩元计划前往上海时被日本人发现，殖民政府对他进行了严刑拷打。和车京石一样，他也渴望韩国的独立。但他本质上是一个单纯的爱国者，而不是一个想当皇帝的人。"
 KOR_pnr_puppet.3.a: "农民君主和革命者，这是什么组合？"
 KOR_pnr_puppet.4.t: "太极道希望得到支持"
 KOR_pnr_puppet.4.desc: "我们收到一封从[KOR.GetName]发来的电报，甑山教中的一个势力：太极道希望能够得到我们的支持。就像大多数组织那样，甑山教内部并非铁板一块，而太极道则是其中具有影响力的几个庞大教团之一。1921年建立的太极道从出生起就带着反殖民的影子，它始于一个传奇般的故事。\n\n1909年，15岁的赵哲济无法忍受朝鲜沦为殖民地的事实，便杀死了当地的一名日本总长，夺取了他的财产，将其一部分捐给大韩民国临时政府，一部分则给村子里的土枪厂用作资金。这件事很快就引来了日本警察对他的追捕，当他从昌原扒火车逃往满洲的时候，甑山教祖师姜一淳显现在他的梦境中，赐予他各种神通，并保佑他顺利抵达奉天，又顺利回到故乡。如今的赵哲济比起轰轰烈烈的斗争，更渴望实现这位保护他的神灵的愿望，将韩国变为一个美好的地上乐园。\n\n与这位教主相比，年轻人朴汉庆的出身可就有些……问题了。他在光复前是日军的一员，但更多时间是作为内应存在。或许是由于这段经历，他基本支持赵哲济的想法，认为应该构建一个人人和解，彼此宽恕的新世界，但想要实现这一目的，借助外部力量是不可缺少的。"
 KOR_pnr_puppet.4.a: "美好的新国家，嗯……"
 KOR_pnr_puppet.5.t: "甑山法教希望得到支持"
 KOR_pnr_puppet.5.desc: "我们收到一封从[KOR.GetName]发来的电报，甑山教中的一个势力：甑山法教希望能够得到我们的支持。就像大多数组织那样，甑山教内部并非铁板一块，而甑山法教则是其中具有影响力的几个庞大教团之一。甑山法教的地位极为特殊，它是由甑山教的祖师姜一淳的亲生女儿，姜淳任建立的。可以说某种意义上，甑山法教才是真正的甑山教继承人，姜一淳的遗骨就存放在这里，每年各大教团都要派人前来甑山法教进行祭拜仪式。\n\n姜淳任生来样貌丑陋，招致了许多批评，但姜一淳却说“只有丑陋的孩子才能真正继承我的事业，实现后天开辟”。姜一淳死后，姜淳任的姑姑试图谋杀她，好成为甑山教唯一的继承人。这使得姜淳任开始了数年的流浪，在庆尚南道她试图自杀，却听到了自己父亲斥责的声音\n\n“我的食粮啊，为什么要结束自己的生命？我为你带来了一位绅士，振作起来，看向未来。”当她回过神的时候，她后来的丈夫，金炳哲就坐在她身边，称自己受到梦中的指引，来到这里安慰一个人。\n\n姜淳任心中或许毫无任何政治想法，只是一个维持现状的存在——甑山法教可以说是最保守，最正统的势力。某种意义上讲，它就是[KOR.GetNameAdj]农村地区的一面镜子。"
 KOR_pnr_puppet.5.a: "在这个时代还强调正统地位吗？"
 KOR_pnr_puppet.6.t: "我们的决定"
 KOR_pnr_puppet.6.desc: "回信的日子近了，甑山教诸教团即将在他们的祖师姜一淳从天而降的神圣地点——甑山举办一次会议，这次会议将决定由谁来代表甑山教进入这个新生的韩国政府。此前我们收到了三个派系的电报，他们各自都希望能够获得我们的支持，显而易见的是我们只能支持其中一方。虽然我们的支持并不意味着被支持的派系一定能够在会议中被选为代表，但毫无疑问，作为[KOR.GetNameAdj]和平的担保者的我们所作出的表态将给他们的最终决定带去极大的压力。"
 KOR_pnr_puppet.6.a: "支持普天教。"
 KOR_pnr_puppet.6.b: "支持太极道。"
 KOR_pnr_puppet.6.c: "支持甑山法教。"
 KOR_pnr_puppet.6.d: "放着不管。"
 KOR_pnr_puppet.7.t: "来自汉城的紧急电报"
 KOR_pnr_puppet.7.desc: "一封紧急电报从汉城发出，发信人是我们所支持的教派。根据电报中所说，甑山教即将宣布甑山会议的结果，而不幸的是这些韩国人无视了我们的暗示，他们并没有在会议中提名我们的支持对象。现在对方希望我们能够提供进一步帮助，正式且明确地表达我们对他们的支持，这将迫使甑山教内部改变他们的决定。\n\n对方提供了丰厚的回报，宣称如果我们愿意干涉，则在他们掌握政权之后会对我们进行在包括经济，矿产，农业各方面的更多让利。虽然作为宗主的我们和任何势力合作都可以接受，但对方毕竟开出了值得考虑的加码，而且这次意外事件一方面预示着这群农民组成的团体并不像我们所预期的那样好控制，另一方面则预示着他们未来或许会多次作出忤逆我们想法的行为——这是一个机会，让他们记住[ROOT.GetName]的建议和命令是值得他们谨慎考虑，再作出回答的。"
 KOR_pnr_puppet.7.a: "对[KOR.GetName]施加外交压力。"
 KOR_pnr_puppet.7.b: "调动边境军队，做好武装胁迫的准备。"
 KOR_pnr_puppet.7.c: "既然输了，那么就接受结局。"
 KOR_pnr_puppet.8.t: "道喜"
 KOR_pnr_puppet.8.desc: "我们所支持的教派向我们发送了一封贺喜的电文。似乎在我们的压力之下，甑山教诸教团最终决定推举他们作为甑山教全体的代表进入政府主持相关事务。虽然如今其教派内部的具体路线仍未决定，但他们感谢我们的付出，如今[KOR.GetNameAdj]政府的控制权已落入他们手中，而他们也终于可以一步步实现自己对[KOR.GetNameAdj]社会的理想蓝图了。"
 KOR_pnr_puppet.8.a: "这是我们的举手之劳。"
 KOR_pnr_puppet.9.t: "夺取圣物"
 KOR_pnr_puppet.9.desc: "甑山教内部发生了一场意外的内斗。就在几天前，太极道的赵哲济带着一群他的信徒进入了甑山法教的区域，他们破坏了他们的已故创始人姜一淳的陵墓，将他的尸体从坟墓里带了出来。这起盗窃行为很快就被甑山法教的成员们发现，而赵哲济也被他们锁定。\n\n昨天深夜，甑山法教的教徒们冲入了太极道的神殿，此时他们正在为姜一淳举行祭祀仪式。争执很快变为推搡，然后是一场围绕着尸体展开的斗殴。在这场混乱的争斗中，太极道的祭坛被摧毁，他们这位“天神先祖”的左手被打断，如今甑山法教已经夺回了姜一淳的大部分遗体，但太极道依然保留着他的左手。\n\n太极道猛烈地批判了甑山法教的暴力行为，他们宣称得到了姜一淳的神谕，要求他们将他的圣体迎接到太极道的圣殿之中，并且在邀请圣体之前他们已经得到了姜一淳其他遗属的许可。对于姜一淳的圣体遭到破坏的结果，其问题全在对方。\n\n而甑山法教则宣称姜顺任大师是姜一淳唯一明确指定的话事人，其他人的许可并不算数，而太极道也从未得到过她的许可。因此他们的行为无疑是最无耻的盗窃。正是这样的恶缘让创始人的圣体粉身碎骨，太极道必须为此承担责任。\n\n无论如何，这或许都意味着这个宗教组织内部存在着比我们预期更严重的斗争。"
 KOR_pnr_puppet.9.a: "抢夺尸体，他们在干什么？"
 KOR_pnr_puppet.9.b: "太极道的癔症证明他们不值得信任。"
 KOR_pnr_puppet.9.c: "或许让正统派提前出局比较好……"
 KOR_pnr_puppet.10.t: "[KOR.GetNameAdj]领袖已经确认"
 KOR_pnr_puppet.10.desc: "[KOR.GetName]方面发来消息，不论是甑山教的各教派之间的斗争还是教派内部的领袖斗争现在都已告一段落，[KOR.GetLeader]现在作为甑山教的代表控制了整个政府。现在他所要处理的问题便是以何种姿态对待光复军势力，以及如何重建这个受到[JAP.GetName]殖民数十年的国家。"
 KOR_pnr_puppet.10.a: "让我们拭目以待。"
 KOR_pnr_puppet.11.t: "农地改革受阻"
 KOR_pnr_puppet.11.desc: "[KOR.GetName]作为一个亚洲农业社会国家，比起政治观念和信仰，其民众对土地的需求更为强烈。这意味着如果能够帮助其社会中绝大多数人口——农民——实现他们“耕者有其田”的梦想，就能借助这种利益自然而然地将他们团结在一个信仰和一个观念之下。我们的盟友就是这样计划的，然而近期在[KOR.GetName]推行的农地改革运动却遇到了重重阻碍。\n\n为了避免激怒本来就掌控农业和资金的地主们，目前[KOR.GetNameAdj]政府采用的是“有偿赎买，有偿分配”原则，但在具体实行上却遭遇了困难。政府中一些代表地主利益的团体对这一政策表达了不满，理由是政府给出的购地补偿标准偏低，而且是以光复后印刷的纸币而非贵金属进行结算，他们无法接受经济利益受损以及潜在的不稳定性。\n\n另一方面，政府中代表农民利益的团体也对此政策表达了不满，理由是光复后的政府虽然出于重建需要调整了税收模式，但农民们依然面对着沉重的实物税。拥有自己的土地固然是好事，但这样一笔购地款对他们来说则是无法承受的负担。他们希望政府能够自己出钱把这些土地无偿分配给农民。\n\n更坏的是，有一些投机商开始散播[RUS.GetName]即将干涉东亚的谣言，试图从这场土地危机中攫取利益。[KOR.GetName]向我们求援，希望我们能够协助他们给出一个合理的解决方案。"
 KOR_pnr_puppet.11.a: "让他们搞无偿分配，我们可以提供补贴。"
 KOR_pnr_puppet.11.b: "如果他们缺对付地主的子弹，我们有很多。"
 KOR_pnr_puppet.11.c: "让他们自己摸索自己的道路。"
 KOR_pnr_puppet.12.t: "囊中羞涩"
 KOR_pnr_puppet.12.desc: "[KOR.GetName]这个新生的政府向我们求援，希望我们能够进行各式各样的财政援助，以帮助其经济迅速恢复。此前[KOR.GetNameAdj]政府已经通过清除殖民政府时期遗留的地方税制和各类苛捐杂税来统一税种和税率，从而促进生产力的恢复和商品流通，但这也导致政府无法通过税收获得没有足够的金钱和物资开展复兴工作。\n\n[KOR.GetNameAdj]政府希望作为宗主国的我们能够提供一些基础的粮食，燃料和医疗用品，以缓解他们当前所面对的严重的物资匮乏现状。在确保不会发生饥荒和公共卫生危机的情况下，如果我们能够进一步提供援助帮助其修缮在先前的光复战争中被损坏的交通线、电力和通信设施的话，或许[KOR.GetName]的工业生产将恢复得更快。"
 KOR_pnr_puppet.12.a: "我们有很多储备的粮食和消费品。"
 KOR_pnr_puppet.12.b: "如果你们需要更多钱的话，就说个数。说起来你们有测试过日本人留下的采矿机器还能用吗？"
 KOR_pnr_puppet.12.c: "我想韩国人民总能找到自己的出路的。"
 KOR_pnr_puppet.13.t: "制度之抉择"
 KOR_pnr_puppet.13.desc: "尽管[KOR.GetName]的领袖对于如何建设国家有自己的想法，但名义上我们依旧是他们的宗主国，这意味着在其国家发展的各个方面我们都有正当理由为陷入迷茫的他们提供建议。[KOR.GetName]近来向我们求助，他们如今是一个[KOR.GetRulingParty]的国家，因此政府想要尽可能地剔除日本殖民时期的法律底色，创造全新的，属于他们自己的一系列制度。\n\n一些政府中人提议应该延续大韩帝国时期的《大韩国国制》的精神和基本原则；还有一些人认为这部法律已经过时太久，以如今的目光来看漏洞百出，不适合现在的[KOR.GetName]，应该转而向世界上诸如[GER.GetName]或[RUS.GetName]这样的强国学习立法；当然也有一些人认为，追随他们的宗主国才是最好的选择，因此主张以[ROOT.GetName]的法律为参考进行相关指定工作。\n\n不过最终[KOR.GetName]还是选择询问我们的意见，当他们作出这个决定的时候，答案就很明显了——我们当然可以建议他们以我国法律为参考，建立[KOR.GetName]政治发展和体制建构的基本原则，但我们或许也可以将其变成一片试验田，尝试一些我们计划推行却最终取消的政策……"
 KOR_pnr_puppet.13.a: "我国的法律对他们而言将是一个最好的蓝本！"
 KOR_pnr_puppet.13.b: "让我们在[KOR.GetName]开始政治试验……"
 KOR_pnr_puppet.13.c: "沿用旧制，修修补补，有什么不好？"
 KOR_pnr_puppet.14.t: "我们邻居的国防问题"
 KOR_pnr_puppet.14.desc: "[KOR.GetNameAdj]社会现在面临着极为严峻的考验，随着日本殖民政府的倒台与新的[KOR.GetNameAdj]政权的建立，社会治安出现了真空地带，新政权的警备力量相当薄弱。\n\n政府为了节省开支用于经济建设，也为了便于管理社会秩序，大量日本殖民统治时期的警察和基层官僚都被保留了下来，可当这些熟面孔换了一身制服再次出现在[KOR.GetNameAdj]民众面前时，引发了他们的巨大愤慨。民众对治安管理的不配合只是一方面，现在[KOR.GetName]各地都爆发了严重程度不一的袭警问题，一些民众甚至比起警察更信任黑帮和暴力团伙，成为了这些社会不稳定因素的保护伞。\n\n更有一些地方治安机构选择和黑帮和解，用对毒品交易和人口买卖等非法行为视而不见来换取黑帮对社会治安的协助。[KOR.GetNameAdj]政府试图改善现状，他们希望我们能够协助他们在政权建立初期进行治安干涉。"
 KOR_pnr_puppet.14.a: "当然，我们会建立军事基地。"
 KOR_pnr_puppet.14.b: "有限的治安维持协助就够了。"
 KOR_pnr_puppet.14.c: "光复军自己难道不行吗？"
 KOR_pnr_puppet.15.t: "教育与思想"
 KOR_pnr_puppet.15.desc: "[JAP.GetName]长期以来残酷的殖民统治和同化政策彻底破坏了[KOR.GetNameAdj]教育体系，[KOR.GetName]政府近期进行的全国人口调查结果显示，国家文盲率达到了令人发指的75%，这意味着想在这样一个国家推行经济改革，公共卫生政策以及工业化是相当困难的。\n\n不过从好的角度来说，如果他们能解决教育问题和思想问题，就能把庞大的人口转化为高素质的劳动力资源。[KOR.GetName]政府已经在计划建立一套义务教育体系，为其国民提供免费的初等教育，但政策归政策，想要实行就需要钱和相关教师。\n\n另一方面，低识字率也导致民众维持着朴素且原始的善恶观和国家观，他们对政府执行的政策有什么好处并没有太多认识，使得他们更容易受到居心不良之人的煽动。[KOR.GetName]政府这次向我们致电除了希望我们能够为他们的全民教育计划提供帮助，还想借助我们的力量印刷一批传单和海报在城市中宣传政府政策的优越性和好处。\n\n考虑到他们的普遍文盲问题，我们或许还可以再帮他们多做一些工作——在我们的境内建立一些专供[KOR.GetName]的韩语电台来进行政治输入，用最平实的语言讲述政府政策的好处，以及那些我们想讲的东西。"
 KOR_pnr_puppet.15.a: "帮他们印一批传单。"
 KOR_pnr_puppet.15.b: "如果能控制[KOR.GetName]的媒体的话……"
 KOR_pnr_puppet.15.c: "这种事还要来询问我们吗？"
 KOR_pnr_puppet.16.t: "技术援助"
 KOR_pnr_puppet.16.desc: "随着[JAP.GetName]仓皇撤出[KOR.GetName]的土地，他们把大量工业设备都遗留在了这片土地上。其中一些在他们离开前已被妥善破坏，而还有一些则依然能正常运行。如果能利用这些殖民遗产，[KOR.GetName]的工业化进程就能取得更多进展。\n\n不幸的是，[KOR.GetName]并没有足够的技术工人和工程师能够驱动或是修复这些器械，而且[JAP.GetName]公司大多在这里从事的是资源开采而非制造业工作，如果想把原材料加工成更具价值的产品，[KOR.GetName]还缺少许多设备和相应技术。显而易见的是，[KOR.GetName]希望从作为宗主国的我们这里收获支持。\n\n他们希望能够和我们签订一份协定，获得综合性的经济与技术援助，以引入他们急需的工程师，制造设备和相关技术。作为回报，除了进一步的共同开发权之外，他们还愿意向我们提供一些低端制造业和服务业劳动力，例如矿工和护士。"
 KOR_pnr_puppet.16.a: "给他们引进一些成熟的民用技术是应该的。"
 KOR_pnr_puppet.16.b: "除了技术，还应该投资设立研究所才好。"
 KOR_pnr_puppet.16.c: "教会徒弟，饿死师傅。"
 KOR_pnr_puppet.17.t: "[KOR.GetName]希望商定市场准入"
 KOR_pnr_puppet.17.desc: "我们的朋友，[KOR.GetName]政府看起来制定了新的经济发展战略。最近一段时间里他们举着自己手里刚刚挖掘出来的矿物，纺织品，冻鱼干以及一些经过简单加工的产品在满世界寻找买家——结果是他们被其它已经占据全球化市场几十年的国家打得头昏眼花，现在走投无路的他们折回来希望得到我们的帮助。\n\n[KOR.GetName]认为，他们的国内市场太过狭小，如果想要快速发展经济，最好的选择就是利用其劳动力资源积极参与并推进国际交换循环，开展“贸易立国”。而导致他们在全球化经济中碰壁的原因主要是他们刚刚起步，原材料和生产出来的商品质量在国际市场上已有许多替代选项，并且随着世界紧张度的提高，各国都严格限制了市场准入，使得他们在竞争中陷入劣势。\n\n[KOR.GetName]政府希望我们能够放松对[KOR.GetName]的市场准入，使得他们的产品能够大量出口到我们这里来，如此便能带动其[KOR.GetName]国内的经济发展。毫无疑问，如果答应他们的要求就会冲击我们国内的市场，并且必然会招致许多本土企业的不满。"
 KOR_pnr_puppet.17.a: "有限的让利有助于实现他们的经济发展战略。"
 KOR_pnr_puppet.17.b: "或许可以借此让他们更依赖[ROOT.GetName]的市场。"
 KOR_pnr_puppet.17.c: "别想拿走一分钱。"
 KOR_pnr_puppet.18.t: "偏离经济计划"
 KOR_pnr_puppet.18.desc: "我们遇到了一个难题，在[KOR.GetLeader]的领导下，[KOR.GetName]似乎微妙地修正了他们预定的经济计划，而这份经济计划原先是由我们所审定的。在政府的默许之下，一些大型企业似乎开始无节制地向银行借贷以尝试进行扩张，他们的企业资产负债率达到了一个令人担忧的水平。\n\n最令人不能接受的是，这些企业的扩张方法之一居然是用借贷出来的资金购买资产，并利用所购资产作为抵押向[KOR.GetNameAdj]银行申请更多贷款，货币乘数的放大预示很可能会发生一场银行信用危机。\n\n[KOR.GetNameAdj]政府或许并没有意识到他们在纵容些什么，又或许是他们已经意识到了这样的风险，但依然选择这样行事。毫无疑问，这是一场危险的赌博，我们很清楚地知道这些擅自行动会导致什么结果。为了[KOR.GetName]的稳定和其民众的福祉，以及避免未来可能需要投入的更多干涉资金，或许我们应该对他们近期的行为表达忧虑和不满——进行外交警告，或者直接以行动强迫他们妥协和让步。"
 KOR_pnr_puppet.18.a: "通过非正规渠道劝说他们。"
 KOR_pnr_puppet.18.b: "直接正式告知他们削减下季度的预算。"
 KOR_pnr_puppet.18.c: "有钱赚不叫我？"
 KOR_pnr_puppet.19.t: "韩民族运动抬头"
 KOR_pnr_puppet.19.desc: "一则令人震惊的新闻最近在[ROOT.GetName]和[KOR.GetName]疯传。最近在汉城举行了一场庆祝韩国光复的游行庆祝活动，而就在活动中，一名[KOR.GetNameAdj]青年从队伍里溜出，潜入一家由我国人士开办的餐厅中，持铁管袭击殴打了对方。袭击导致这位40岁的[ROOT.GetNameAdj]男子全身多处瘀伤并罹患轻微脑震荡。\n\n在犯人被负责维持治安的警察逮捕时，他把铁管扔到地上并反复大喊“[KOR.GetName]万岁”。初步调查显示他属于一个当地的民粹主义学生团体。值得注意的是，有些人报告说在殴打过程中警察并未出手制止，尽管他们事后辩解说其注意力全部放在维持游行队伍的大体秩序上，因此没注意到这起发生在室内的暴行，但这样的说辞显然十分可疑。\n\n我们无法确定这次袭击是这名青年的自作主张还是有别的势力在背后对其进行煽动，我们唯一能确定的就是在[KOR.GetNameAdj]社会中我们似乎逐渐变成了负面角色。不论如何，我国公民在[KOR.GetName]境内受到攻击是事实，现在的问题就是我们要怎么定义这件事的性质——"
 KOR_pnr_puppet.19.a: "向[KOR.GetName]发送外交抗议。"
 KOR_pnr_puppet.19.b: "你们手里的东西是烧火棍吗？"
 KOR_pnr_puppet.19.c: "这是作为宗主国所必然面对的问题……"
 KOR_pnr_puppet.20.t: "[ROOT.GetName]-[KOR.GetName]人才交流计划"
 KOR_pnr_puppet.20.desc: "[KOR.GetName]政府提议和我们签订一份人才交流计划备忘录，具体内容为[KOR.GetName]政府将会出资选派一些他们的理工科学生前来我们这里学习那些他们急需的产业技术，以帮助[KOR.GetName]提高其重工业，化工和电子等各方面技术水平。\n\n他们将全额支付这些学生在我国期间的生活开销，而我们则需要为他们解决大学和技术机构的学费以及板凳费，当然这只是暂时的，他们承诺会在未来几年政府资金情况好转之后开始全额承担这些费用。另一方面，他们也希望我们能够派遣一些他们急需的人才前来支持他们进行高等教育机构的筹建与管理，这对[KOR.GetName]未来的发展至关重要。[KOR.GetName]政府还提议说希望在未来能够进一步扩大人才交流规模，并期待着能有一天和我国结成一个科研技术委员会，共同推进两国科技发展。"
 KOR_pnr_puppet.20.a: "这是个培养人才的好计划。"
 KOR_pnr_puppet.20.b: "要不要再领略一下[ROOT.GetName]的人文风光和舒适生活呢？"
 KOR_pnr_puppet.20.c: "我们现在不具有接待他们的条件。"
 KOR_pnr_puppet.21.t: "作战指挥权问题"
 KOR_pnr_puppet.21.desc: "金洪奎领导的[KOR.GetName]政府近日给我国发来了一封颇有意思的电报，这封电报以恭敬的商谈口吻书写，但内容却已展露出他们锋利的野心。自从我们协助光复军赶走日本殖民者之后，[KOR.GetName]的作战指挥权就一直掌握在我国手中。如今金洪奎想要将指挥权要回去，以实现真正意义上的“韩国光复”。显而易见的是，他将这一行为视为收拢国内民心，强化自己作为爱国者身份的一次机会。\n\n交还指挥权最直接的问题就在于我们对[KOR.GetName]的掌控力会遭到削弱，一旦发生任何意外情况，部署在边境的军队也无法及时驰援他们。但是交还作战指挥权并非全无好处，为了协助[KOR.GetName]政府进行军队管理，我国在当地设立了许多联合军事顾问部门，将指挥权交还给他们就可以减少我们在[KOR.GetName]的军事开支，还能因他们不得不开展的扩军行动向他们出售更多武器装备以换取利润。"
 KOR_pnr_puppet.21.a: "这还需要更谨慎地评估。"
 KOR_pnr_puppet.21.b: "上次他们输给了日本人，这次又想输给谁？"
 KOR_pnr_puppet.21.c: "他们想要，就给他们。"
 KOR_pnr_puppet.22.t: "称帝？"
 KOR_pnr_puppet.22.desc: "一开始我们怀疑这是海外敌对势力破坏或是因[KOR.GetName]管理不严而发生的一起恶作剧，但经过谨慎的确认之后我们确定了这份文件的真实性。车京石，[KOR.GetName]目前的领袖通过私人电台向我们发送请求，希望我们能够支持他实现自己“甲子年登基”的未竟之业。如果他的电报中叙述的都是未经夸张的事实的话，那么现在[KOR.GetName]政府内部的情况就极为严峻。\n\n光复军，劳动党，国民党等势力认为车京石的登基幻想十分危险，只是因为我们之前曾表达了对他的支持而不敢公开宣扬。他们目前的计划是将[KOR.GetName]变成一个议会君主制的国家，车京石当然可以登基做“皇帝”，但必须同时复兴[KOR.GetName]历史上的另一个传统机构——“和白会议”，这是公元一世纪时期半岛政权的贵族议会，而在这层皮之下的则是由他们领导的真正的现代议会。\n\n车京石向我们求援，希望我们对[KOR.GetName]施加压力以避免发生这样的情况，他想要成为的是一个真正的君主而不是一枚橡皮图章，他向我们许诺了许多事成之后的好处，值得我们仔细考虑这个人的复辟大梦。"
 KOR_pnr_puppet.22.a: "我们会暗示我们支持你。"
 KOR_pnr_puppet.22.b: "如果你需要一支暂时的禁卫军，这里有。"
 KOR_pnr_puppet.22.c: "我们会再做商讨。"
 KOR_pnr_puppet.23.t: "购物清单"
 KOR_pnr_puppet.23.desc: "在经过几轮针对[KOR.GetName]经济问题的讨论之后，[KOR.GetName]政府近日向我们发来了一份他们自己拟定的经济重建与开发计划。这份计划显然出自赵哲济之手，但与其说它是一份重建开发计划，倒不如说它是一份冗长的购物清单。\n\n根据清单内容，赵哲济希望从我们这里获得数千亿韩元的预算，其中一部分用于重建并维护各类基础民生设施，余剩的全部用来进一步开发，然后就是各种开发所需的物品内容列举——总的来说，赵哲济的这份计划确实能帮助[KOR.GetName]政府加快经济重建项目的实施，并且能尽快实现其经济上的自立和民生质量上的提高，但问题在于所需要付出的成本太高昂了，即便是我们也很难掏出这样一笔资金去援助[KOR.GetName]，更何况他们是否有进行如此大规模投资的价值还需要再商议。"
 KOR_pnr_puppet.23.a: "帮他把这份“购物清单”改得更像“战略”。"
 KOR_pnr_puppet.23.b: "给他采购想要的。"
 KOR_pnr_puppet.23.c: "他是不是把我们当成许愿机了。"
 KOR_pnr_puppet.24.t: "烧毁真老虎"
 KOR_pnr_puppet.24.desc: "朴汉庆向我们发来了一封电报，似乎他终于下定决心，决定对光复军动手了。朴汉庆认为[KOR.GetName]在他的治理之下已经基本步入平稳阶段，而他在政府之中主导的“共识与团结”计划也取得了相当出色的成果。唯一的不谐和音就是光复军。自从朴汉庆掌握政权之后，光复军就处处与他作对，尝试撕裂这个政府，破坏[KOR.GetName]的团结。\n\n在彻底认清了这些人其实已经堕落，在韩国光复之后与韩民族不再是同路人了之后，朴汉庆策划了这次秘密清洗行动。他纠集了一批绝对忠于政府，忠于自己的爱国人士，计划将政府中存在的光复军成员和那些光复军同情者全部清洗掉。但这个计划需要我们的帮助，显而易见的是，如果他们意识到了这是针对自己的行动，他们就会立刻组织起来，或开始反击，或四散而逃，这将为清洗工作带来诸多困难。\n\n朴汉庆希望我们干涉行动时[KOR.GetName]的电波频率，破坏他们的无线电线路。但即便我们不愿做到这种地步，只是单纯无视他们的求援信息也会对他的计划起到帮助。这是个充满风险的计划，不过也是[KOR.GetName]自己的家务事，我们也没理由帮他们或不帮他们。"
 KOR_pnr_puppet.24.a: "我们会安排一次线路检修。"
 KOR_pnr_puppet.24.b: "除掉他们对我们进一步干涉有利。"
 KOR_pnr_puppet.24.c: "这风险太大。"
 KOR_pnr_puppet.25.t: "乡村抗议"
 KOR_pnr_puppet.25.desc: "一封以姜淳任的名义书写的外交辞令被送到了我国外交部手中，不过其内容却是一封联名信，只有翻译稿件上有姜淳任的署名。联名信是由[KOR.GetName]的许多农民共同“签署”的，他们大多数人都是不会写自己名字的文盲，就在信上印了自己的指纹或者是画了一个圈。这封信的具体内容是谴责我国近期与[KOR.GetName]合作进行的矿业开发侵占了许多乡村地区的耕地，一些本来能够从事耕作的良田因为矿山进行疏干排水而导致无法得到充足灌溉，这些农民曾试图和开发人员理论，得到的回复却是相关补偿款早已支付给他们了。\n\n联名信中强调，对于[KOR.GetName]的农民来说，土地是和他们不可分割的一部分，是不能用金钱衡量的东西。而近期发生在咸静南北道的采矿塌陷事故也波及到了一些矿区周围农田，使得这些农民开始进一步担心我们的作业会给他们带来什么后果。简言之，他们希望我们中止采矿作业，并且重新评估其可能对[KOR.GetName]农业造成的影响。我们和[KOR.GetName]政府合作开采矿物是已经签定好的合约，相关计划也都已经过了专家评估，但如今农民们却来闹事，说到底，就算不管他们也不会有什么太大的问题。"
 KOR_pnr_puppet.25.a: "或许我们逼得太紧了。"
 KOR_pnr_puppet.25.b: "磋商农业援助换矿物开发。"
 KOR_pnr_puppet.25.c: "这些开发是基于一开始的协定的。"
 KOR_pnr_puppet.26.t: "兵痞丑闻"
 KOR_pnr_puppet.26.desc: "[KOR.GetName]近期发生了一起和我们密切相关的刑事案件，两名我国退伍军人被指控在京畿道水原邑轮奸了一名[KOR.GetName]女性，在他们的可耻行为被夜巡的[KOR.GetName]警察发现了之后，这两人反而将警察殴打了一顿，致使其上颌牙齿掉落16枚，二人在第二天中午在龙仁镇被抓获归案。尽管被强奸的女性和遭受严重暴力的巡警都指认二人便是凶手，但他们两人并不认罪。\n\n这二人在退伍前隶属于同一个师，在对日作战时期，这支师曾在忠清南道参与了对日本军队的强攻作战，受到了勋章表扬。在退伍之后，他们二人便在[KOR.GetName]的水原邑居住了下来，尽管他们名义上还是我国公民，但已经在[KOR.GetName]置办了许多产业。\n\n其中一人投资了数家娱乐场所，并运营着私营金融市场；另一人则投资了“三白”产业——白糖，面粉与纺织，凭借[KOR.GetName]光复后的社会经济发展积累了一大笔财富。由于他们身份以及复原后从事行业的特殊性，很多事情经不起进一步调查，尽管我们已经暗示[KOR.GetName]政府不要再深究和他们相关的人士，只专注于处理案件本身，但我们必须做好各种应对方案——如此恶劣的事件势必会引发[KOR.GetName]国内舆论的震动。"
 KOR_pnr_puppet.26.a: "怎么会发生，还被报道了这种事？"
 KOR_pnr_puppet.27.t: "无赖的命运"
 KOR_pnr_puppet.27.desc: "[KOR.GetName]政府显然正在试探我们对这起事件的态度，并尝试借此机会削弱我们对他们的控制。更详细的调查报告被共享给了我们：在他们二人被抓获归案后的第二天下午，大量举报涌入了他们的警察系统，其中既有实名举报也有匿名告发。大多数内容都是控诉目前在[KOR.GetName]的我国公民犯下的累累罪行，从酒驾和盗窃到斗殴与猥亵，甚至还有一些举报说我国公民把[KOR.GetName]在深夜里潜入到别人家里把孩子的心脏挖出来吃掉。显而易见的是，这些控诉里或许有真实的内容，当然也一定会有被害妄想症的胡编乱造。而这些指控的真实与否显然全部都要看[KOR.GetName]政府最终决定怎么处理那两个人面兽心的人渣的了。\n\n值得注意的是，在这件令人发指的暴行传回我国之后，我国许多民众也表达了愤慨，但他们却认为这两个人既然名义上依然是我国公民，[KOR.GetName]无权审判他们，应该将二人引渡回我国经我国司法下达判决；还有一些声音认为，他们在我国是英雄，到了[KOR.GetName]则学坏了，这完全是[KOR.GetName]的文化和风土有问题……如果我们真的将这两个畜生引渡回来，或许会在[KOR.GetName]内部引发一场不小的危机……"
 KOR_pnr_puppet.27.a: "为什么不直接就地审判这两个卑鄙残忍的混蛋？"
 KOR_pnr_puppet.27.b: "这两个人渣！但他们必须在祖国接受判决。"
 KOR_pnr_puppet.28.t: "[KOR.GetName]爆发抗议游行"
 KOR_pnr_puppet.28.desc: "那两个回国的罪犯在落地之后被我们的司法机关加急判处了枪决，尽管一些人对我们的判决表达了不满，但大多数人还是支持我们除掉人渣的，不过令我们意外的是，[KOR.GetName]的民众的怒火似乎仍未平息。\n\n在[KOR.GetName]的各地都爆发了以青年学生为主力的抗议游行。其中以咸镜道咸兴市的游行规模最大，行为也最越界。有些人高举[ROOT.GetLeader]的侮辱性照片和标语，他们包围了市政府和我国民众的聚居区，要求彻底将我们这群“帝国主义者”赶出[KOR.GetName]。尽管这场游行名义上是和平的，但一些我国民众遭到袭击的消息还是偶尔会从当地报纸上流出，更有一些不相干的第三国人士因为长得像[ROOT.GetNameAdj]便遭到了无端的袭击。\n\n目前[KOR.GetName]政府尚未对这次游行发表任何评论，但他们除了维持基本秩序之外也没有做任何事情。我们最好也应该冷处理这件事，但如果我国无法确保民众在[KOR.GetName]的安全这件事传回了国内，想必会对我们的政府信誉造成不小的打击。"
 KOR_pnr_puppet.28.a: "[KOR.GetName]政府在做什么？"
 KOR_pnr_puppet.28.b: "让我们的驻[KOR.GetName]士兵准备好催泪弹。"
 KOR_pnr_puppet.28.c: "意料之中，但能奈我何？"
 KOR_pnr_puppet.29.t: "经济崩溃"
 KOR_pnr_puppet.29.desc: "尽管我们已经尽我们的努力去帮助[KOR.GetName]恢复经济，并意图实现其在国家金融层面上的自立。但随着[KOR.GetName]摇摇晃晃地短暂地站了起来之后没过多久，它就发出一阵凄厉的惨叫，又扑倒在地上，再也站不起来了。[KOR.GetName]的经济已经陷入崩溃，他们生产出来的大量商品无法在其狭窄的本土市场得到消化，也无法在世界性的自由贸易中争得能够支持它继续下去的地位。[KOR.GetName]政府所制定的许多经济政策都未能实现其预期目的，而国内企业在战后恢复期中无休止的盲目扩张进一步压垮了他们的经济——由于无法从产品上回拢资金，他们不得不宣布对先前从银行贷出的天文数字的贷款违约。然而这一切只是整个国家金融体制崩溃的开始，在未来的几个月乃至几十年间，情况只会变得越来越糟……"
 KOR_pnr_puppet.29.a: "我有一种不祥的预感……"
 KOR_pnr_puppet.30.t: "社会秩序崩溃"
 KOR_pnr_puppet.30.desc: "最近从[KOR.GetName]传回的消息都不是很好，随着民间愈演愈烈的反[ROOT.GetName]运动，政府似乎失去了对乡村地区的控制权，并且最近就连对城市地区的控制权也几乎要失去了。借着“反对外国侵略者”的理由，许多民间团体开始制造各种暴力事件，劫杀旅人，抢劫火车已经是他们做的最善良的事情了。\n\n[KOR.GetName]如今疲于镇压这些问题，但由于安保力量不足而收效甚微。更雪上加霜的是，由于政府对社会控制力的失去，他们的财政储备也几乎见底。警察等暴力机关如今不接受政府以纸币形式发放薪水，他们要求等价值的贵金属。在一些已经没钱发放薪水的地方，原本负责维持治安的警察们则自行解散，拎着手枪和警棍加入了欢乐的抢劫大军之中。\n\n如今[KOR.GetName]已经沦为了土匪和强盗的乐园，至于其官方的行政命令在政府大门之外是否依旧有效，如今已经变成了一个值得仔细研究的问题。"
 KOR_pnr_puppet.30.a: "为什么会这样？"
 KOR_pnr_puppet.31.t: "朝露之命"
 KOR_pnr_puppet.31.desc: "我们在[KOR.GetName]的外交部传回来的断断续续的消息证实了我们那不祥的预感——由于长期以来[KOR.GetName]都严重依赖我们的无偿援助，这导致其战后经济增长陷入停滞，也无法进行自立。\n\n大量农产品和生产出来的简单商品在世界市场上毫无竞争优势，其出口受到打击，只能在国内进行经济循环。[KOR.GetName]的投资主要在海外储蓄，国内储蓄率几乎为零，本土消费率却居高不下，整个国家的经济模式沦为依靠救济的消费型经济，陷入了恶性贫困循环。\n\n通货膨胀的升高和随着战后稳定期而来的人口的迅速增长，以及他们盲目推行土地改革以强制城市化的苦果也在此刻显现了出来。失业人口的大量增加使得韩国本地治安力量疲于应对，由于我们并未对韩国社会的安全进行过多干涉，这导致缺乏人手的韩国政府无力处理许多随之而来的社会问题。\n\n现在黑手党和强盗们游荡在城市里，抢劫和盗窃一类的暴力行为变成了稀松平常的事情。在更偏远的农村地区，一些地方恢复了人口买卖制度。无政府状态笼罩在这个国家上空，为这个政权送去了最后一击。[KOR.GetName]彻底崩溃，而我们已无力回天。"
 KOR_pnr_puppet.31.a: "喂，这里是[ROOT.GetName]外交部，喂，有人在吗——"
 KOR_pnr_puppet.32.t: "安身清心，敬天克己"
 KOR_pnr_puppet.32.desc: "无休止的争吵和利己主义为社会和国家所带来的只能是分裂，韩国已经历了一次泪水，难道韩国的孩子还要为了各自的欲望让她再次流泪吗？必须有人站出来制止这一切，$KOR_pnr_park_han_gyeong$笃信这一点。\n\n人世间最美好的东西一定是圆，圆没有棱角，自然也没有阻碍，它不妨碍别的事物，也不被别的事物阻碍。如果所有人也能如同圆一样，收敛起自己的棱角，无阻碍，无间断地旋转运行，那么世界上将再无任何怨恨与对立。\n\n日本殖民政府的败退与韩国的光复，意味着对立的时代已经结束，仇恨的延续所带来的只能是无尽痛苦的锁链，作为胜利者的韩国有权宽恕败者，有权以仁慈解除施加在人们身上的，痛苦岁月的诅咒。也唯有如此做，才能真正建立化解一切怨恨，和谐共存的人间天国，走向共同繁荣，互惠互利的未来。"
 KOR_pnr_puppet.32.a: "槿花朝落又朝开，无穷生机自古来。"
 KOR_pnr_puppet.33.t: "后天开辟，已成现实"
 KOR_pnr_puppet.33.desc: "$KOR_pnr_kim_hong_gyu$找了一个合适的地方坐了下来，他就这样安静地坐在草坪上，天色透出第一丝微明，前来赏花的人也逐渐多了起来。在木觅山大多数前来赏花的韩国人似乎并没有认出他就是$KOR_pnr_kim_hong_gyu$本人。这并不是什么坏事，尽管安保团队和其他幕僚都极力劝阻他不要独自行动，不论是海外破坏势力，还是[ROOT.GetName]恐怕都会借此做文章。如果$KOR_pnr_kim_hong_gyu$真的要赏花的话他们可以预先清场。\n\n$KOR_pnr_kim_hong_gyu$当然拒绝了，如果只身一人，纵有数万朵无穷花次第开放，那也只能徒增寂寥。而事实证明根本没人发现他在这里——在此刻，他并非是领袖，并非是$KOR_pnr_kim_hong_gyu$，他是一个“韩国人”。\n\n他看到了第一朵木槿花的盛放，也看到了最后一朵木槿花的凋落。他看到了和他一样众多的韩国人扫去了昔日脸上的哀愁和痛苦，在观看这朝开暮落，短暂却又展现了其一生中全部潜能和激情的无穷花时都展露出笑颜。\n\n暮色收去了最后一丝日光，赏花的人群都已离开，$KOR_pnr_kim_hong_gyu$缓缓站起身，作为最后一人离去了。"
 KOR_pnr_puppet.33.a: "松树千年终是朽，槿花一日自为荣。"
 KOR_pnr_puppet.34.t: "无穷花开，东国永延"
 KOR_pnr_puppet.34.desc: "$KOR_pnr_cha_kyung_seok$端坐在十一殿中，这座宫殿的规模胜过朝鲜王朝的景福宫。而他就在这里作为韩国的君主指引着韩国的道路。\n\n日本殖民政府的败退与韩国的光复，证明了旧日关于“甲子年天子登基”的预言并非荒诞迷信，只是被命运所迫而不得不推迟的计划，普天教过去、现在、将来都不会成为民族政党的工具，它将超越所有这一切，成为韩国人的一部分。\n\n韩国人已经将日本殖民政权驱赶出了他们的国家，后天开辟已经开始，真正的天子，九天应雷声普化天尊之子$KOR_pnr_cha_kyung_seok$将顺应命运，实现天神的目的。"
 KOR_pnr_puppet.34.a: "百花六月皆凡木，木槿自言唯我独。"
 KOR_pnr_puppet.35.t: "阴阳和谐，道通真境"
 KOR_pnr_puppet.35.desc: "徐成把那支折下来的柳条当成发簪，插到了金善英的头发上，搞得她怪不好意思的。左看右看，似乎可以折走真伊之前种的芍药花，所以她就随手把那花折下来，递给了徐成作为她“珍贵的”回礼。\n\n徐成实在看起来是有点生气，快速地把那支柳条从头发里抽走了。结果不小心扯到了善英，把她弄得哇哇大哭，一边哭一边说再也不跟他玩了。不过小孩子不比大人，其仇恨很容易就烟消云散。没过一会儿两人就又和好如初，就像二人共同度过的这四五年间一样好。两个人继续骑着扫帚马，像是一路奔袭的两个将军一样沿着河边跑。等到跑累了，两个人也完全顾不得脏，直接往地上一躺。\n\n“等长大了我要和你结婚，就像真伊和叔叔那样！”或许是小孩子不知道自己在说什么，也不知道什么时候该说什么，徐成突然说出了这样的话。\n\n“结婚？然后呢？”\n\n“然后我们要生孩子，带着孩子玩纸蝉，还要一起骑扫帚马，搞一支骑兵队！”\n\n“再然后呢？”\n\n“然后——”唉，可怜的徐成似乎还没有想到变成大人之后想做的其它事情，“然后，然后等我们都老死了，就让他们把纸蝉和扫帚烧给我们，我们在下面继续玩！”似乎他也觉得这番话有些牵强，说完之后他伸出手，把那支柳条还给了善英。希望能让她别再继续追问下去了。\n\n至于那芍药花，那花尚含苞待放。"
 KOR_pnr_puppet.35.a: "愿作贞松千岁古，谁论芳槿一朝新。"
 KOR_pnr_puppet.36.t: "神檀树下，祈祷不绝"
 KOR_pnr_puppet.36.desc: "世界处在永恒的变化之中，但不管如何变化却依然是对过去时代的再次重演。上古时期檀君建立韩国，而今日$KOR_pnr_kang_soon_im$带领人们再度建立韩国。历史在这里出现了呼应和反复，韩国人民不再是历史的阅读者，他们成为了历史显现在当下的媒介。\n\n正因一切命运已经注定，正因所有这一切不过是对一节故事的反复重演，人们才得以从压迫在他们身上的未知的苦难中得到解脱。对于个体的人来说，唯一重要的是他们在过去所记忆的和在当下所经验的，所有这一切将会化为名为“传统”的东西，如同一道涓涓活水在这片土地上延续下去，永不终结。\n\n无情的日本殖民政府曾经试图摧毁这些传统，但他们能够斩落一百颗头颅，却永远无法斩断一次河流。$KOR_pnr_kang_soon_im$和韩国人民会继续守护这或许并不需要他们保卫的传统，因为他们的祖辈正是这样做的。"
 KOR_pnr_puppet.36.a: "夹路疏篱锦作堆，朝开暮落复朝开。"
 KOR_pnr_puppet.37.t: "时和岁丰，天下太平"
 KOR_pnr_puppet.37.desc: "$KOR_pnr_kang_soon_im$作出了她的抉择，与其宣称虚妄的独立与自强，更正确的做法是真正走到这个国家的大多数人中间。农民们在哭泣，工人们在哭泣，而政府中大多数人还在针对各自的立场和背后是否受到外国势力指使而相互攻击。\n\n日本殖民政府给韩国带来的深重苦难只意味着日本人的残暴，而不意味着事大主义是错误的。如果只需要磕头效忠就能为数千万韩国人带来生活水平的提升，$KOR_pnr_kang_soon_im$愿意成为这个民族的罪人，韩国的奸细。政治立场，理想，甚至是甑山法教本身都可以舍弃。在时间的侵蚀下，大多数同志或许忘记了东学起义的初心一一农民们无法生存，而不是农民们渴望斗争。\n\n幸运的是，至少对这个国家中的农民们来说，任何空洞的口号和对$KOR_pnr_kang_soon_im$人格的诋毁，都无法掩盖她帮助他们脱离贫困的事实。"
 KOR_pnr_puppet.37.a: "风露凄凄秋景繁，可怜荣落在朝昏。"
 KOR_pnr_puppet.38.t: "开火！"
 KOR_pnr_puppet.38.desc: "在我们的授意之下，各地驻军迅速集结起来，前来帮助[KOR.GetNameAdj]政府维持秩序。不出我们所料，游行队伍在看到我们的军队出现的那一刻就再也按捺不住了。他们立刻开始冲击由警察组成的最外层防线。在不知道人群中的哪一个人朝我们的士兵投掷了一块砖头，“碰巧”将他砸晕过去了之后，我们的军队开始了反击。为了维持秩序，在咸镜道地区我们动用了催泪弹，消防水龙和空包弹进行戡乱。\n\n我们暂时驱散了人群，但很快他们的报复就到来了，一些显然是受到外国势力指使的，别有用心的人破坏了咸兴市周围的道路，并使用自制武器开始袭击我国民众和军人。他们开始在大街上随意纵火抢劫，事态已发展到完全不可接受的地步。在得到了[KOR.GetNameAdj]政府沉默的默许之后，我们集结了一支正规军部队，开动坦克和装甲车对这群暴徒进行了系统性的清理。我们射杀并逮捕了相关匪首，将他们移交给了[KOR.GetNameAdj]政府。如今戡乱大功告成，这场暴乱也就此结束。"
 KOR_pnr_puppet.38.a: "把我们帮助平乱的账单寄给[KOR.GetName]。"
 KOR_pnr_puppet.39.t: "大邱危机"
 KOR_pnr_puppet.39.desc: "由于[KOR.GetNameAdj]政府缺乏开展经济复苏所需的必要资金，其对公共卫生的漠视导致了一场危机。在上个月，大邱市突发霍乱，约有4000人死于该疾病，而由于新政权缺乏卫生医疗用品，许多病人得不到及时救治，这进一步纵容了疾病的蔓延。\n\n政府目前对治疗这种疾病束手无策，为防止其在[KOR.GetNameAdj]境内蔓延，政府选择对疾病的源头大邱市进行封锁。大量生活必需品无法进入封锁区内，这反而进一步恶化了现状。由于饥饿，许多大邱市民聚集到市政府前进行示威，在示威过程中，警察的枪支不小心走火，误杀了两名平民，这使得示威转变成了暴力冲突。人们开始袭击并杀害警察，破坏官员的住所，截至目前已有37名警员命丧暴民之手。与此同时大邱市的工人开始组织罢工，一些地方甚至打出了工团主义的旗帜——这不得不使我们怀疑其它们的罢工背后是否有外国势力指使。[KOR.GetNameAdj]政府希望得到我们的帮助，妥善解决这场危机，或许我们可以提供一些人道主义援助，但也可以搞清楚到底是谁在暗地里给[KOR.GetName]捣乱。"
 KOR_pnr_puppet.39.desc2: "由于[KOR.GetNameAdj]政府缺乏开展经济复苏所需的必要资金，其对公共卫生的漠视导致了一场危机。在上个月，大邱市突发霍乱，约有4000人死于该疾病，而由于新政权缺乏卫生医疗用品，许多病人得不到及时救治，这进一步纵容了疾病的蔓延。\n\n政府目前对治疗这种疾病束手无策，为防止其在[KOR.GetNameAdj]境内蔓延，政府选择对疾病的源头大邱市进行封锁。大量生活必需品无法进入封锁区内，这反而进一步恶化了现状。由于饥饿，许多大邱市民聚集到市政府前进行示威，在示威过程中，警察的枪支不小心走火，误杀了两名平民，这使得示威转变成了暴力冲突。人们开始袭击并杀害警察，破坏官员的住所，截至目前已有37名警员命丧暴民之手。\n\n与此同时大邱市中出现了一些奇怪人士，在他们的鼓动下一些地方甚至打出了保守分子和帝国主义者们常用的标语和旗帜——这不得不使我们怀疑这场危机是否是外国反动势力的渗透行动。[KOR.GetNameAdj]政府希望得到我们的帮助，妥善解决这场危机，或许我们可以提供一些人道主义援助，但也可以搞清楚到底是谁在暗地里给[KOR.GetName]捣乱。"
 KOR_pnr_puppet.39.a: "我们必须避免人道主义危机。"
 KOR_pnr_puppet.39.b: "这是暴乱，是暴乱！"
 KOR_pnr_puppet.39.c: "他们自己能解决。"
 KOR_pnr_puppet.40.t: "工团分子的阴谋？"
 KOR_pnr_puppet.40.t2: "旧秩序的阴谋？"
 KOR_pnr_puppet.40.desc: "我们的军队和坦克车轻而易举地就镇压了大邱市正在发生的暴乱，并且逮捕了闹事的头目。经过我们的审问，他们对自己受到工团主义国家资助的事实供认不讳。他们供称自己收到了工团的指令，潜入到大邱市中对流行病问题和粮食问题大做文章，煽动不明就里的[KOR.GetNameAdj]民众与工人和他们一起参与罢工，从而尝试将大邱市打造成工团赤化[KOR.GetName]的桥头堡。\n\n既然真相已经大白，就该让这些人受到正义的审判了。在确认他们已经于供词上签字之后，我们就立刻对他们执行了死刑。而他们的证词显然是一份非常好的材料，能够敲打[KOR.GetNameAdj]政府警惕外部，也警惕内部的工团分子试图摧毁国家的阴谋。"
 KOR_pnr_puppet.40.desc2: "我们的军队和坦克车轻而易举地就镇压了大邱市正在发生的暴乱，并且逮捕了闹事的头目。经过我们的审问，他们对自己受到境外组织资助的事实供认不讳。他们供称自己收到了这个设立在[IMP.GetName]的“自由[KOR.GetName]运动”组织提供的金钱，标语和其它物资，潜入到大邱市中对流行病问题和粮食问题大做文章，煽动不明就里的[KOR.GetNameAdj]民众与工人和他们一起参与游行抗议，并发动暴动。从而尝试以大邱市为起点重新将“自由，和平与人道”带回[KOR.GetName]。\n\n既然真相已经大白，就该让这些人受到正义的审判了。在确认他们已经于供词上签字之后，我们就立刻对他们执行了死刑。而他们的证词显然是一份非常好的材料，能够敲打[KOR.GetNameAdj]政府警惕外部，也警惕内部的潜在颠覆分子试图摧毁国家的阴谋。"
 KOR_pnr_puppet.40.a: "要警惕这些无孔不入的老鼠。"
 KOR_pnr_puppet.40.b: "借此机会，要求他们换一批能和我们更好合作的官员。"
 KOR_pnr_puppet.41.t: "劳工问题"
 KOR_pnr_puppet.41.desc: "我们与[KOR.GetName]之前订立了一份经济与技术援助的条约。根据条约的内容，我们将向[KOR.GetName]提供他们发展工业所需的相关技术，而作为回报，他们将向我们输入许多劳动人口。然而这则条约最近为我们带来了很多尴尬。\n\n一些[KOR.GetNameAdj]在进入我国之后，并未按照预期从事矿工或护士等我们急需的劳动性工作，一些人尝试在我国境内定居下来，更有甚者则开始涉足色情行业，这不是我们希望看到的结果。\n\n尤其是在经过我们的私下调查后发现，这些女性从事“皮肉生意”似乎是[KOR.GetNameAdj]政府原定计划的一部分，她们会将部分收入作为外汇寄回国家。某种意义上讲，[KOR.GetName]正在开展合法的，国家规模的人口贩卖，我们当然可以戳穿他们，但这势必会让他们失去一个可能十分重要的外汇来源。或者我们只是默默接受，对这些“公主”的行为睁一只眼闭一只眼。"
 KOR_pnr_puppet.41.a: "我们允许他们过来不是为了搞沦落行为。"
 KOR_pnr_puppet.41.b: "这也是他们求生的一种选择。"
 KOR_pnr_puppet.42.t: "东明王的冒险"
 KOR_pnr_puppet.42.desc: "他把手里的这封信放下，这已经是这周以来不知道第几个来找青年团的企业主了。之前在大邱市的工人暴动中，[ROOT.GetName]军队选择和他们这个民间团体合作，一起挫败了那些工人霸占工厂的阴谋，将那些工人打得屁滚尿流，可以说这一场胜仗打出了他组织的名声。自那之后，合作的邀请就源源不绝。有土地被一群农民强行夺走的地主，有原本的工厂被组织起来工会夺取了生产设施的企业家，当然还有一些协助政府治安的邀请。\n\n他们开出的价码都极具诱惑力，不过现在青年团人手不足，所以他们提供的帮助服务也是价高者优先。至于这一次——他的目光扫过了桌子上摊开的其中一封信，那可是一笔大买卖，要和一整个工厂区里的工人搏命，帮这位匿名事主夺回一系列涉及到化肥、纺织纤维、铝业和石油精炼的工厂，这些可都是和国民经济命脉息息相关的，怠慢这位“神秘的”大人物可不好。\n\n他推开办公室的门，从简陋的铁楼梯上走到一层，来到已经列队完毕的数百名团员身边，开始了他简短又直接的战前训话："
 KOR_pnr_puppet.42.a: "小子们，把铁管烧红了我们就出发！"
 KOR_pnr_puppet.43.t: "农民冲击政府"
 KOR_pnr_puppet.43.desc: "[KOR.GetNameAdj]政府向我们分享了一条消息，最近地主和雇农罕见地联合起来向政府表达了他们的不满。他们抗议的点并非是出在地租或是别的问题上，而是在我们对[KOR.GetName]的援助之上——先前出于对饥荒危机的预防，我们向[KOR.GetNameAdj]政府援助了大量粮食，这些低价粮食在进入[KOR.GetNameAdj]市场之后对他们的粮价造成了极大冲击。\n\n显然本地地主和农民都因我们的救助政策而蒙受损失。现在他们要求政府重新考虑和我们之间的救助条约，或至少作出行动维持粮价稳定，避免进一步损害他们本来的利益。[KOR.GetNameAdj]政府在经过紧张的讨论之后，他们提出了一个足够怪异但似乎确实可以解决现状的方法——他们将以高价从农户手中收购粮食，再以低价卖给城市里的人口。如此一来就实现了既补贴了农民，又确保了政府能够提供廉价口粮促进城市工业生产。不出意外的是，他们采用这样的政策势必会让政府财政进一步背负巨大的补贴压力。"
 KOR_pnr_puppet.43.a: "或许我们确实要调整政策。"
 KOR_pnr_puppet.43.b: "吃饱了就开始骂我们？"
 KOR_pnr_puppet.44.t: "混乱蔓延"
 KOR_pnr_puppet.44.desc: "伴随着悬挂在这片土地上数十年的日本国旗的撤下与太极旗的再次升起，[KOR.GetName]宣告了它的光复。各方势力以及纯粹欢乐的[KOR.GetNameAdj]民众都组织起了自己的游行队伍，当几支队伍相遇时他们彼此拥抱，汇聚成一股更大的人流。可游行中发生的并不总是好事，当廉东振的白衣社队伍遇到人民党人时，他们要求对方放下法伦施泰尔国际的旗帜，只举起国旗；青年团体和临时政府的队伍发生了相互推搡，起因是有人高喊以后一切权力都归于由海外归来的临时政府。\n\n当维持秩序的警察出现时——由于日本人的败退如此之快，他们许多人甚至还穿着殖民政府时期的制服——游行队伍中爆发了愤怒。加里峰洞附近，一辆试图穿过人群的警备车辆意外撞倒了一名少年，这成为了混乱爆发的源头。人群要求警察交出肇事者，殴打并尝试夺取维持秩序的警察们的配枪，直到警告射击的枪声响了起来，游行就很快变成了混乱的踩踏事故。\n\n稍晚些时候，这阵枪声已变成“日本走狗射杀了韩国人”的流言，民众和警察之间的冲突迅速蔓延。街道上出现了互相对峙的临时路障。几支光复军部队接到了互相矛盾的命令：一些军官要求立刻保护警察局和政府机关，而亲左翼的士兵则直接拒绝出动，甚至当街解除了几名警察的武装。还有一些部队选择作壁上观，宣布在查明真相之前不会服从任何人的命令。\n\n临时政府通过广播渠道指责工团分子和社会主义者策划发动了这场暴乱，左翼军官则宣称这是警察和右翼联合起来促成的阴谋。各方势力都要求我们立刻承认其才是[KOR.GetName]合法政府。"
 KOR_pnr_puppet.44.a: "只能共苦，不能同甘的一群人。"
 KOR_pnr_puppet.47.t: "[KOR.GetName]忤逆了我们"
 KOR_pnr_puppet.47.desc: "[KOR.GetName]对我们的“建议”表达了拒绝，他们表示他们将维护第一次甑山会议中的共识。不论其原因是出于其单纯的自大还是民族主义立场，我们温和的干涉都宣告失败了。而他们作出类似这样忤逆我们意志的举动也绝不会是最后一次。"
 KOR_pnr_puppet.47.a: "这就是外交。"
 KOR_pnr_puppet.51.t: "猛虎脱缰"
 KOR_pnr_puppet.51.desc: "在这几年之间，我们对韩国半岛进行了全面的改造和干涉，意图恢复韩国的经济状态和政治体制，并试图扶持一个能够为我们提供各种长期利益的盟友——然而就在今天，似乎我们的这一目标宣告失败了。\n\n尽管我们出于好心，借助新韩国公司在当地实行了各项有助于韩国和我国共同发展的政策，但似乎这些人并不将其视为恩惠，反而视之为压迫。韩国人民呼吁要么废除新韩国公司，要么就让韩国能够得到本该属于他们的那部分利益。这些民众因为刻板印象和误解，不幸地将我们理解成改头换面的另一个日本政府，东亚地区的帝国主义者。\n\n就在今天，我们收到了来自[KOR.GetLeader]的消息，他宣布自己代表国内民众的意愿，要终结我们和他们之间“不平等的国家关系”。这意味着就连我们所扶持的政府也不再受到我们控制了——或许我们只能接受这个结局，又或许我们应该给那些暴民他们想要的东西，但这无疑意味着软弱，并会加强他们的嚣张气焰。"
 KOR_pnr_puppet.51.a: "木已成舟。"
 KOR_pnr_puppet.51.b: "我们……选择改组新韩国公司。"
