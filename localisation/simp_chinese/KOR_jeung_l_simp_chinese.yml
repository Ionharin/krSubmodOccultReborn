 KOR_pnr_promote_the_ilminism_desc: "纯血理论才是唯一正确的理论，世界上只存在一种韩国人，一种祖祖辈辈相传下来的民族性的血统。谁否认一民主义，谁否认纯血理论，谁就是否认了韩国的民族性。"
