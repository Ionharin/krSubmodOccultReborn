l_simp_chinese:
 JAP_ws_mark_of_the_defeated: "日落之后"
 JAP_ws_mark_of_the_defeated_desc: "战争已经结束，我们不得不正视现实：强大的帝国陆军已经覆灭，而昔日称霸太平洋的海军也遭到肢解。如今已是帝国的日暮时分。"
 JAP_pnr_sheli_tuoguan_weiyuanhui: "设立托管委员会"
 JAP_pnr_sheli_tuoguan_weiyuanhui_desc: "战胜国们设立了一个托管委员会监督我们的临时政府，他们的目的是确保我们无法再具有任何威胁性力量，并监视我们的一举一动。"
 JAP_npr_and_the_sunrise_again: "便是清晨"
 JAP_npr_and_the_sunrise_again_desc: "这个世界不停地循环着，因此不存在一种“永恒”的概念。日落之后便是日出，死亡之后便是新生。日本并未抗拒他所处的漫长的死之黑夜，正是出于此，他终于迎来了他的又一次出生。"
 JAP_npr_decide_on_the_new_governor_general: "天皇的命运"
 JAP_npr_decide_on_the_new_governor_general_desc: "天皇，现世人神——神灵无所不能，绝不犯错。但战争的失败，以及天皇公开发表的战败声明让人们开始质疑其神的身份。"
 JAP_pnr_invite_the_duke_yansheng: "邀请衍圣公"
 JAP_pnr_invite_the_duke_yansheng_desc: "斯文会提议邀请正在山东孔府寓居的衍圣公孔德成前来日本担任总督。1928年时他们试图促成衍圣公前往日本参加中日儒教大会，现在或许正是继续这件事的好时机。"
 JAP_pnr_new_shindojo: "昭和神圣会"
 JAP_pnr_new_shindojo_desc: "昭和神圣会是1935年建立的社会边缘宗教团体，他们与策划昭和维新的少壮派军官有关，是狂热的天皇支持者。最关键的是他们的首脑出口王任三郎曾与[QIE.GetRulingParty]有过交流，我们或许可以借此取悦北京，并最大限度确保我们的利益。"
 JAP_pnr_kuninotokotachi_belief: "确立国常立尊信仰"
 JAP_pnr_kuninotokotachi_belief_desc: "1892年，国常立尊向出口直传达了“三千世界梅花盛开”的神谕，向大本教成员揭示了甲午战争和日俄战争的胜利，以及日本最终将在世界大战中战败的未来。如今未来已至，我们应继续追随神谕的指引，重建这个国家。"
 JAP_pnr_solve_hyperinflation: "平息恶性通胀"
 JAP_pnr_solve_hyperinflation_desc: "战争导致我们的本土工业和农业发展十分畸形，而战败则导致它们彻底崩溃。我们必须立刻出手干预物价，避免造成进一步影响。"
 JAP_pnr_repatriation_resettlement_crisis: "解决归国者危机"
 JAP_pnr_repatriation_resettlement_crisis_desc: "我们数百万的士兵和海外国民从中国，从韩国，从暹罗等地被强制遣返回国，我们必须采取措施妥善安置他们。"
 JAP_pnr_solve_the_mafia: "黑手党问题"
 JAP_pnr_solve_the_mafia_desc: "由于我们失去了对社会的控制，民间黑手党立刻填补了我们的空位。现在我们必须决定要以什么态度应对这些暴戾的民间组织。"
 JAP_pnr_full_scale_reconstruction: "全力重建"
 JAP_pnr_full_scale_reconstruction_desc: "我国大部分建筑已沦为断壁残垣，"
 JAP_pnr_medical_intervention: "医疗干预"
 JAP_pnr_medical_intervention_desc: "粮食的极度短缺导致了诸如肺结核等传染病的横行，我们应当立刻干预。"
 KOR_pnr_electricity_supply_and_demand_regulation_act: "《电力供需调节法案》"
 KOR_pnr_electricity_supply_and_demand_regulation_act_desc: "战后日本面临全国性质的电力短缺，短期内我们无力解决，我们只能进行每周轮流停电的策略。"
 JAP_pnr_sheild_society: "盾会的崛起"
 JAP_pnr_sheild_society_desc: "神秘组织盾会向[JAP.GetLeader]寄来了一封长信，内里是对目前日本现状的不满。他们是一个激进的爱国暴力团伙，或许我们并非不可以仔细听听他们的诉求。"
 JAP_pnr_the_speech_begins: "新宿演讲"
 JAP_pnr_the_speech_begins_desc: "神秘的“日本”先生将要在新宿开始他的演讲，旨在激起国民的爱国之心，这件事一定会激发北京方面的不满，但或许我们有一试的价值。"
 JAP_pnr_ensure_the_safety_of_the_ichigaya_building: "薄弱化市谷大楼"
 JAP_pnr_ensure_the_safety_of_the_ichigaya_building_desc: "我们的计划重点在于进攻陆上自卫队的司令部，并借此证明他们实际上不能保护日本国民。为此在行动之前确保进攻路线是必要的。"
 JAP_pnr_awaken_the_public: "渴望战争"
 JAP_pnr_awaken_the_public_desc: "自人类诞生以来就有争斗和对立，思想的对立，信仰的对立，意见的对立，战争是组成人类的必要条件，人类通过战争不断磨练自己，不断超越自己，最终变形成某种新的，美丽的形态。因此战争是好的，而任何阻止战争继续的都是坏的。"
 JAP_pnr_recruit_comrades: "招募同志"
 JAP_pnr_recruit_comrades_desc: "一位英雄总是能吸引许多和他相同的英雄一起成就伟大的事业，想想阿尔戈号的英雄们。他们不畏困难，在命运的指引下聚在一起，并共同走向属于他们自己的胜利。盾会也应该如此，我们会在大学和社会上寻找我们的同志，以期实现计划。"
 JAP_pnr_neo_shindojo: "新神道教"
 JAP_pnr_neo_shindojo_desc: "我们将建立以大本教为基础的新神道教，以替换战争时期的国立神道教信仰。"
 JAP_pnr_crack_down_on_the_black_market: "的屋贸易合法化"
 JAP_pnr_crack_down_on_the_black_market_desc: "我们的经济已经崩溃，合法渠道配给的各类物资并不能满足民众的需求。另一方面，我们的军事仓库中还囤积有大量本该被北京接收的物资，在他们接收之前，我们不如通过黑市贸易将它们返还给民众，并从中再捞一笔。"
 JAP_the_problem_of_orphan: "处理流浪儿"
 JAP_the_problem_of_orphan_desc: "随着战败导致政府陷入崩溃，大量因战争失去父母的无组织的流浪儿开始在社会上进行青少年犯罪，我们必须尽力制止这一切。"
 JAP_pnr_taichio_nichinichi_shinbun_puppet: "印刷《大正日日新闻》"
 JAP_pnr_taichio_nichinichi_shinbun_puppet_desc: "我们将重新刊印在第一次大本事件期间被官方查禁的大正日日新闻来向人们宣传新神道教信仰。"
 JAP_pnr_second_mongolian_expedition: "第二次蒙古考察"
 JAP_pnr_second_mongolian_expedition_desc: "1924年我们曾前往蒙古考察当地的香巴拉传统，却被张作霖打断并将我们监禁起来。现在是时候继续当初未完成的考察了，这次考察预计持续四个月，我们将取得可喜的结果。"
 JAP_pnr_the_lunar_mountain_is_fuji: "真神现于月光山"
 JAP_pnr_the_lunar_mountain_is_fuji_desc: "我们的蒙古考察带来了意外的结果，《灵界物语》中的月光山指的其实就是富士山，而根据预言，真神将要从月光山上下来。"
 JAP_pnr_possession_by_a_deity: "人神一体"
 JAP_pnr_possession_by_a_deity_desc: "天皇的失败证明了天照大神的后裔的失败，也证明了第一次大本事件对我们弹压的错误。如今真正的日本国主，国常立大神的后嗣已从富士山上走了下来，坐在了王座之上，他将作为真正的日本统治者带领日本重新取得荣耀！"
 JAP_pnr_land_reform: "开始土地再分配"
 JAP_pnr_land_reform_desc: "我国的大量土地依然掌握在封建地主手中，必须对此进行改善。"
 JAP_pnr_subsidize_light_industry: "补贴轻工业"
 JAP_pnr_subsidize_light_industry_desc: "当务之急是尽快开展轻工业生产，从而填补我们的生活消费品缺口。"
 JAP_pnr_subsidize_agriculture: "补贴农业"
 JAP_pnr_subsidize_agriculture_desc: "我们的农业生产因战争陷入瘫痪，为了让我国变成一个正常运作的国家，对农业生产进行快速恢复是必不可少的。"
 JAP_pnr_women_liberation: "解放妇女"
 JAP_pnr_women_liberation_desc: "我国百废待兴，需要大量人力进行重建。我们正好可以解放妇女，让她们也加入到生产劳动的行列中。"
 JAP_pnr_improved_writing_system: "推广新书写系统"
 JAP_pnr_improved_writing_system_desc: "文字的书写繁琐是导致我国平均受教育程度的原因之一，或许我们可以采纳明治时期未能实际推行的西化书写系统，这将有助于我们的民众更快掌握相关知识，并与国际接轨。"
 JAP_pnr_siwen_society_help: "斯文会的帮助"
 JAP_pnr_siwen_society_help_desc: "早在1918年斯文会就大力主张衍圣公来日本定居，以继续传递孔子“万世一系”的道统，这件事如今终于成为现实，斯文会成员必将继续努力协助衍圣公，以儒学治理日本。"
 JAP_pnr_confucian_mencian_orthodoxy: "孔孟正统"
 JAP_pnr_confucian_mencian_orthodoxy_desc: "在衍圣公的治理之下，日本已经成为了一个纯正的孔孟礼仪之国，一如过去天皇曾万世一系地延续天照大神的血脉，衍圣公体内也流淌着圣人孔子的血脉——由衍圣公担任我国的真正领袖是最合适不过的了。孔德成万岁！孔子万岁！日本万岁！"
 JAP_pnr_visit_yushima_seido: "汤岛圣堂"
 JAP_pnr_visit_yushima_seido_desc: "汤岛圣堂由德川幕府第5代将军德川纲吉所建，可以称得上是东京孔庙了。请衍生公入住这里，并将这里划归为圣地将有助于确立他的权威。"
 JAP_pnr_loyalty_and_filial_piety: "忠孝一本"
 JAP_pnr_loyalty_and_filial_piety_desc: "我们将继续在民众中间推行明治《教育敕语》时期的忠孝一本原则，将衍生公塑造成渡海而来解救日本的圣人，而人们必然要对这位圣人誓死效忠。"
 JAP_pnr_the_infallible_sage: "金瓯无缺"
 JAP_pnr_the_infallible_sage_desc: "为了继续强化衍生公在日本的统治地位，我们将开展一系列活动，在日本继续推广四书五经儒家道德，并将衍生公宣扬成一位无所不能，永无错谬的圣人。"
 JAP_pnr_collaboration_with_kyoto: "与京都学派合作"
 JAP_pnr_collaboration_with_kyoto_desc: "我们将与京都学派的相关人物接触，游说他们支持衍生公对日本的统治。"
 new_focus_140: "new_focus_140"
 new_focus_140_desc: "new_focus_140_desc"
 JAP_the_military_after_defeat_war: "战败的军队"
 JAP_the_military_after_defeat_war_desc: "根据条例，我国只被允许拥有一支极为有限的军队用于自卫，我们必须遵从条例。"
 JAP_pnr_prevent_sabotage_activities: "预防破坏活动"
 JAP_pnr_prevent_sabotage_activities_desc: "由于我们的军队规模极小，致使它可能无法即时处理进行中的破坏性活动，因此预防就极为重要。"
 JAP_pnr_learn_from_the_lesson: "吸取教训"
 JAP_pnr_learn_from_the_lesson_desc: "尽管我们战败了，但我们并非没有学到什么。我们将吸取教训，以期不再重蹈覆辙。"
 JAP_pnr_rebuild_the_command_system: "重建指挥体系"
 JAP_pnr_rebuild_the_command_system_desc: "我们将改良现有指挥体系以应对我们缩小的军队规模。"
 JAP_pnr_revitalize_the_national_defense_industry: "振兴国防工业"
 JAP_pnr_revitalize_the_national_defense_industry_desc: "我们将重建因战争结束而瘫痪的国防工业体系，从而保护日本不受侵害。"
 JAP_pnr_military_alliance: "军事同盟"
 JAP_pnr_military_alliance_desc: "由于我国已被解除武装，最好的选择是与他国构成军事同盟。"
 JAP_pnr_self_defense_forces: "设立自卫队"
 JAP_pnr_self_defense_forces_desc: "我们需要一支能够保全我们自身的军事力量，确保想要侵害我们的人在我们自己的土地上无法取得任何优势。"
 JAP_pnr_blue_force: "蓝色力量"
 JAP_pnr_blue_force_desc: "我们已设立了地面自卫队体系，现在是时候在天空和海洋也推行这一模式了。"
 JAP_pnr_the_birth_of_air_force_self_defense: "航空警备队的诞生"
 JAP_pnr_the_birth_of_air_force_self_defense_desc: "我们将训练一支精锐的空军力量，用于保护我们领土的天空安全。"
 JAP_pnr_focus_on_agility: "注重灵活性"
 JAP_pnr_focus_on_agility_desc: "我们将注重飞机的灵活性和速度。"
 JAP_pnr_focus_on_distances: "注重航程"
 JAP_pnr_focus_on_distances_desc: "我们将注重飞机的航程。"
 JAP_pnr_the_air_war_from_future: "未来的空战"
 JAP_pnr_the_air_war_from_future_desc: "我们将设立一支精锐且先进的空军。"
 JAP_pnr_the_coast_self_defense: "海岸警备队"
 JAP_pnr_the_coast_self_defense_desc: "我们必须确保自己的海岸线安全。"
 JAP_pnr_protect_our_ocean_lines: "确保海岸线"
 JAP_pnr_protect_our_ocean_lines_desc: "我们将开发轻型巡逻船只以确保海岸线安全。"
 JAP_pnr_transport_ship_first: "运输船优先"
 JAP_pnr_transport_ship_first_desc: "由于我们已被解除武装，比起强大的坚船利炮，或许运输船才是我们最合适生产的舰船。"
 JAP_pnr_mutual_defense_agreement: "《共同防卫协定》"
 JAP_pnr_mutual_defense_agreement_desc: "我们将与我们的盟友签订共同防卫协定，以获取一些扩军限制上的缓解。"
