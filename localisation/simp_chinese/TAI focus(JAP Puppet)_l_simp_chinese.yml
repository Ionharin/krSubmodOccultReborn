 TAI_jingong_tahemashe: "侵攻塔马荷"
 TAI_jingong_tahemashe_desc: "布农族的塔马荷社依然和我们保持着敌对态度，我们不能再怀柔了，必须立刻出击。"
 TAI_find_lamata_sing_sing: "找出拉马达·星星"
 TAI_find_lamata_sing_sing_desc: "在1932年制造了可怕的“大关山屠杀”的丧心病狂的匪首，布农族的拉马达·星星如今依然在逃。尽管先前总督府已经处死了他的四个儿子，但我们仍未找到他本人。猛虎般的布农族正是因此才有着嚣张气焰，我们必须找出他将他处死，以维护总督府的颜面。"
