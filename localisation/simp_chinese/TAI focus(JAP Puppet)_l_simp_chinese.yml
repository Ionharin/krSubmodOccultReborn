l_simp_chinese:
 TAI_pnr_p_1936_situation: "昭和十一年元旦"
 TAI_pnr_p_1936_situation_desc: "1935年的台湾博览会已经圆满落幕，这是迄今为止[TAI。GetName]最盛大的活动，中川健藏总督作为博览会的总裁总算舒了一口气。昭和十年就这样完美结束了，而这份福气也会在昭和十一年继续延续下去。"
