 TAI_zaixu_jiuqing: "再续旧情"
 TAI_zaixu_jiuqing_desc: "123"
 TAI_lalongqingnian: "拉拢青年"
 TAI_lalongqingnian_desc: "我们的集团移住政策经常遭到那些老年原住民的阻挠和不配合，他们总是出于迷信的情感反对离开土地。又凭着他们的年岁迫使其他人也赞同他们的观点。我们应该转变思路，不再和“长老”谈判，而是转而和那些年轻的“觉醒者”们聊聊，带他们去看看移住地的情况，从而化解部落内部的反对意见。"
 TAI_baquliaoya: "拔去獠牙"
 TAI_baquliaoya_desc: "通过授产计划和移住计划让原住民更加农民化。"
