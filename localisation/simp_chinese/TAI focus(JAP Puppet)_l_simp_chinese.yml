 TAI_pnr_p_searching_for_the_body_of_mona_rudao: "寻找莫纳鲁道的尸体"
 TAI_pnr_p_searching_for_the_body_of_mona_rudao_desc: "雾社事件之中的首谋者，莫纳·鲁道的尸体迄今仍未找到，此前因为暴动地区的条件原因，总督府一直搁置了搜寻计划。如今暴乱已过去多年，即便能找到尸体恐怕也难以辨认，但我们还是得硬着头皮继续寻找，不然这件事依然会在每次帝国议会开会时被立宪政友会拿出来反复刁难。"
 TAI_pnr_p_police_supervision: "警察督管"
 TAI_pnr_p_police_supervision_desc: "123"
 TAI_pnr_p_japans_negative_assets: "大日本帝国的负资产"
 TAI_pnr_p_japans_negative_assets_desc: "在[JAP.GetName]，[TAI.GetName]一直被社会舆论认为是一项失败的项目。东京政府向[TAI.GetName]投资了许多资金，但它取得的经济成果却依然寥寥，以至于每年总督府都需要向东京要求更多资金。这当然是不实言论，[TAI.GetName]已经实现了收支上的自给自足，所谓的“累赘”完全是无中生有。不过这侧面体现了另一个问题，大多数人并没有感受到[TAI.GetName]带给它的利益，而只要他们还抱持着这种看法，任何向[JAP.GetName]开口要钱的行动相比都会激起民间不满。"
