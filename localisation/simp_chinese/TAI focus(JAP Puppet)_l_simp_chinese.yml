 TAI_pnr_p_military_revolution: "军事改革"
 TAI_pnr_p_military_revolution_desc: "作为总督府的我们真的有军事吗？我们有一支警察部队，是的，我们有一支警察部队。"
 TAI_pnr_p_strengthen_the_taiwan_military: "强化台湾军"
 TAI_pnr_p_strengthen_the_taiwan_military_desc: "1919年我们正式成立了台湾军总指挥部，将守备队扩编，成为常驻台湾的最高陆军指挥机构。"
 TAI_pnr_p_healing_the_wounds: "弥合伤痛"
 TAI_pnr_p_healing_the_wounds_desc: "早期的恐怖统治在我们和台湾原住民之间形成了一道深深的，泛着血沫的沟壑。我们必须想办法让过去的错误就这样随风过去，并将他们改造成我国国民的一分子。"
 TAI_pnr_p_indigenous_military_service_rights: "原住民兵役权"
 TAI_pnr_p_indigenous_military_service_rights_desc: "你也是[JAP.GetName]的一员——这话说得好听，但大多数时间，他们总是能在个人的权利上体会到这只是句漂亮话。我们应该赋予原住民兵役权，打破我们彼此之间的隔离，惟有这样才能让他们真切地意识到我们是朋友，我们是一个国族。"
 TAI_pnr_p_teach_with_authority: "以强力教导"
 TAI_pnr_p_teach_with_authority_desc: "雾社之伤痛未去，高砂之暴乱又起。对待这些新附之民绝不可继续采用温柔政策，要用强力使他们驯服，并将他们彻底改造成半现代的文明人。"
 TAI_pingding_hunluan: "平定经济混乱"
 TAI_pingding_hunluan_desc: "拜黑色星期一和台湾银行券与日元紧急脱钩所赐，现在岛内的经济秩序彻底陷入了混乱。台湾银行已宣布分行停业两星期以避免恐慌彻底摧毁经济。在日本重启对我们的支援之前，我们必须要自己想办法解决难题。"
