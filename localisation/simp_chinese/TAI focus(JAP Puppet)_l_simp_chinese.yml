 TAI_pnr_p_searching_for_the_body_of_mona_rudao: "寻找莫纳鲁道的尸体"
 TAI_pnr_p_searching_for_the_body_of_mona_rudao_desc: "雾社事件之中的首谋者，莫纳·鲁道的尸体迄今仍未找到，此前因为暴动地区的条件原因，总督府一直搁置了搜寻计划。如今暴乱已过去多年，即便能找到尸体恐怕也难以辨认，但我们还是得硬着头皮继续寻找，不然这件事依然会在每次帝国议会开会时被立宪政友会拿出来反复刁难。"
