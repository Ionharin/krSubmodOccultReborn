l_simp_chinese:
 JAP_pnr_election_category: "1936年众议院选举"
 JAP_pnr_election_category_desc: "在推翻田中义一大将的独裁统治之后，“宪政联盟”为[JAP.GetName]带来了宪政恢复，同时也为众议院带来了一场持续近十年的梦魇。自1928年《普通选举法》实施之后，此前大量不值一提的党派也被选票送入了众议院，并在近几年中蓬勃发展。随着“宪政联盟”因利益冲突而重新瓦解为两大党派，自那之后的每一次选举都未能令议会内诞生绝对多数党。\n\n权力的分散与少数党内阁使得政治决策中充满了妥协和利益交换，此前§c$JAP_pnr_inukai_tsuyoshi$§!还能凭借领导“宪政联盟”的名望震慑住议会中的各大党派，但随着他延续十年的执政，“宪政之神”的光辉已经逐渐黯淡，对昔日斗士的尊敬也已不再是帝国议会中的共识，议员们渴望着变化，而变化必然将带来动荡。\n\n要小心，衰弱的众议院将使得§P宫中集团§!进一步蚕食政党政治代表的§O民主§!，并令§P天皇§!的决策权在动荡的政治和社会局势中§R愈发强大§!。\n\n为了赢得众议院多数，对应的党派需要掌握议会中的§Y234席§!。根据初步预测，下一次选举中§Y众议院§!的席位分布将如下所示：\n\n§r$JAP_congress_seat_party_2_name$§!：§H[?JAP_pnr_election_party_seats^2|0]§!席（[?JAP_pnr_election_party_change^2|+0]）\n§S$JAP_congress_seat_party_4_name$§!：§H[?JAP_pnr_election_party_seats^4|0]§!席（[?JAP_pnr_election_party_change^4|+0]）\n§l$JAP_congress_seat_party_5_name$§!：§H[?JAP_pnr_election_party_seats^5|0]§!席（[?JAP_pnr_election_party_change^5|+0]）\n§m$JAP_congress_seat_party_6_name$§!：§H[?JAP_pnr_election_party_seats^6|0]§!席（[?JAP_pnr_election_party_change^6|+0]）\n§c$JAP_congress_seat_party_7_name$§!：§H[?JAP_pnr_election_party_seats^7|0]§!席（[?JAP_pnr_election_party_change^7|+0]）\n§a$JAP_congress_seat_party_8_name$§!：§H[?JAP_pnr_election_party_seats^8|0]§!席（[?JAP_pnr_election_party_change^8|+0]）\n§n$JAP_congress_seat_party_10_name$§!：§H[?JAP_pnr_election_party_seats^10|0]§!席（[?JAP_pnr_election_party_change^10|+0]）"
 JAP_pnr_election_countdown_decision: "众议院选举进行中"
 JAP_pnr_election_countdown_decision_desc: "随着自1936年6月召开的帝国议会临时会结束，考虑到上半年发生的一系列事件对内阁执政形象的影响，[JAP.GetLeader]首相在稍早些时候宣布解散众议院并重新举行选举。根据相关法律，选举将持续§Y40§!天，如无意外将在结束后宣布最终结果，全新的首相也将在本次选举之后经元老举荐，领受组阁大命，辅弼天皇陛下行使国政大权。此前日本议会已维持“悬峙议会”达近十年，这一次的选举能够改变这个国家被冻结的命运，破除没有多数党的魔咒吗？"
