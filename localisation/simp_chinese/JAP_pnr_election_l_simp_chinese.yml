l_simp_chinese:
 JAP_pnr_election_category: "1936年众议院选举"
 JAP_pnr_election_category_desc: "在推翻田中义一大将的独裁统治之后，“宪政联盟”为[JAP.GetName]带来了宪政恢复，同时也为众议院带来了一场持续近十年的梦魇。自1928年《普通选举法》实施之后，此前大量不值一提的党派也被选票送入了众议院，并在近几年中蓬勃发展。随着“宪政联盟”因利益冲突而重新瓦解为两大党派，自那之后的每一次选举都未能令议会内诞生绝对多数党。\n\n权力的分散与少数党内阁使得政治决策中充满了妥协和利益交换，此前§c$JAP_pnr_inukai_tsuyoshi$§!还能凭借领导“宪政联盟”的名望震慑住议会中的各大党派，但随着他延续十年的执政，“宪政之神”的光辉已经逐渐黯淡，对昔日斗士的尊敬也已不再是帝国议会中的共识，议员们渴望着变化，而变化必然将带来动荡。\n\n要小心，衰弱的众议院将使得§P宫中集团§!进一步蚕食政党政治代表的§O民主§!，并令§P天皇§!的决策权在动荡的政治和社会局势中§R愈发强大§!。\n\n为了赢得众议院多数，对应的党派需要掌握议会中的§Y234席§!。根据最新的报纸舆情统计，下一次选举中§Y众议院§!中各党派取得的席位可能如下：\n\n§r$JAP_congress_seat_party_2_name$§!：§H[?JAP_pnr_election_party_seats^2|0]§!席（[?JAP_pnr_election_party_change^2|+0]）\n§S$JAP_congress_seat_party_4_name$§!：§H[?JAP_pnr_election_party_seats^4|0]§!席（[?JAP_pnr_election_party_change^4|+0]）\n§l$JAP_congress_seat_party_5_name$§!：§H[?JAP_pnr_election_party_seats^5|0]§!席（[?JAP_pnr_election_party_change^5|+0]）\n§m$JAP_congress_seat_party_6_name$§!：§H[?JAP_pnr_election_party_seats^6|0]§!席（[?JAP_pnr_election_party_change^6|+0]）\n§c$JAP_congress_seat_party_7_name$§!：§H[?JAP_pnr_election_party_seats^7|0]§!席（[?JAP_pnr_election_party_change^7|+0]）\n§a$JAP_congress_seat_party_8_name$§!：§H[?JAP_pnr_election_party_seats^8|0]§!席（[?JAP_pnr_election_party_change^8|+0]）\n§n$JAP_congress_seat_party_10_name$§!：§H[?JAP_pnr_election_party_seats^10|0]§!席（[?JAP_pnr_election_party_change^10|+0]）\n§P$JAP_congress_seat_party_9_name$§!：§H[?JAP_pnr_election_party_seats^9|0]§!席（[?JAP_pnr_election_party_change^9|+0]）\n\n受社会局势左右的选举预计结果瞬息万变，在1928年施行《普通选举法》后更是如此，而报纸舆情毕竟有其滞后性，甚至有时它会变成一种§R宣传的武器§!而非实际民意的反映。在这种情况下，通过观察民意的潮流或许能对§Y真相§!掌握一二。当前社会上的新闻热点为：\n\n[loc_jap_pnr_election_true_result]"
 loc_election_true_result_1: "§O《宪政联盟何以成功？我们现在正需要“联合大同”》§!"
 loc_election_true_result_2: "§S《棚桥小虎给出工人团结的真正原则：回到工会中来》§!"
 loc_election_true_result_3: "§m《城市发展二十年，大正电力物语》§!"
 loc_election_true_result_4: "§c《带你踏入温情的农村共同体：以一名出色的地方官僚为男主角》§!"
 loc_election_true_result_5: "§a《日本为什么需要强力政府？兼谈政治刷新和外来活水的注入》§!"
 loc_election_true_result_6: "§n《斗战的一支号！赤松克麿昨日抵港区声援工人斗争》§!"
 loc_election_true_result_7: "§P《民主终末时，瞧瞧俄罗斯的大政星》§!"
 loc_election_true_result_8: "§j《非常时局需要非常青年，近卫公沐浴聚光灯》§!"
 loc_election_true_result_9: "§3《收购的智慧：日本产业击败住友位列大财阀三羽乌》§!"
 loc_election_true_result_10: "§7《共产党员就住在我的隔壁吗？愈演愈烈的赤色恐慌》§!"
 loc_election_true_result_11: "§7《早稻田大学狂人集会大骚动，称要寻共产党支部引爆革命》§!"
 loc_election_true_result_12: "§n《“杀死所有不忠日本人，解救OO陛下”，酗酒者厕所狂乱涂鸦遭逮捕》§!"
 loc_election_true_result_13: "§P《有何不了事欲投海男子被救下，称因参与工会运动遭主家罢免》§!"
 loc_election_true_result_14: "§N《大解密，矢野祐太郎谈德岛剑山的所罗门墓穴与约柜起源》§!"
