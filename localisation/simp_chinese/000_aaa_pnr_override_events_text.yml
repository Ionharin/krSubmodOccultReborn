### Override Events ###
  japan_domestic_events.242.t: "黑色星期一波及……[EGY.GetName]？"
  japan_domestic_events.242.d: "随着柏林股市的“圣诞节高峰”在一月末戛然而止，柏林证券市场的行情更是在俄德谈判时内容泄露，切尔诺夫遇刺，以及[LEP.GetName]局势恶化等国际事件的多重影响下急转直下。就像我国大多数经济学家在“圣诞节高峰”结束后预测的那样，德意志帝国的经济崩溃终于变成一场席卷世界的经济危机。幸运的是由于长期以来[GER.GetName]都在尝试将我们其经济领域，所以东京和大阪并没有因为这场危机而遭到重大冲击，不过即便我们的经济体在庞大的中欧同盟市场，或者称之为“德国的世界霸权市场”中处于边缘位置，我们还是被其经济崩溃的多米诺骨牌击中了，然而恰恰是因为我们与德国的直接贸易不多，所以我们很快就能从这次经济危机中恢复……至少在昨天，这个说法还是有效的。\n\n今天稍早些时候，[EGY.GetName]宣布由于“紧急状态”而单方面宣布停止履行自1926年以来我国与其签订的《日埃经济互惠贸易协定》，该协定已经过多次续约，下一次续约期本定在1940年。但[EGY.GetName]受到黑色星期一影响，突如其来的国际大宗商品崩盘和外部需求萎缩令埃及政府的经济遭到重大打击，这使得他们最终选择背叛和我们之间的约定。如果这就是全部的纠纷，我们只是失去了一纸贸易协定就好了。问题远不止如此，除了废除协定之外，[EGY.GetName]还宣布即日起将对我国棉布、人造丝产品征收约达70%的汇兑补偿税，以保护本地纺织业，扭转廉价日本纺织品倾销的“经济阴谋”。无论如何，我们目前已经失去了[EGY.GetName]这个重要的贸易伙伴，而未来会怎样我们不得而知……"
  japan_domestic_events.242.a: "经济……不是在恢复吗？"
  fengtian_japan_mechanic_events.001.t: "三宅坂与霞关"
  fengtian_japan_mechanic_events.001.d: "帝国与中国有着悠久的交往史，而其对华政策自相矛盾，摇摆不定也已成为了长久的传统，构成了所谓“霞关”与“三宅坂”间的“二元外交”。自1872年西乡隆盛向中国派遣优秀的陆军将校担任对华谍报人员至今已有64年，期间对华情报工作从未间断。三宅坂的陆军参谋本部自信于能依靠其长期耕耘的情报体系在对华外交问题上占尽优势。\n\n与之相对应的则是则是霞关的外务省，最初仅有“二局四课”的外务省在外交问题上话语权薄弱，仅有四百余人的规模难以撼动早已在对华外交领域深耕多年的陆军。但随着政党政治在世界大战后逐渐被民众推崇，军人转而被认为是冲突和弊病的源头。值此良机，在前首相原敬高超的政治手腕之下，外务省得到了大规模的扩张，并将关于外交事务的决策从陆军手中夺回。1934年外务省构成的“五局时代”则彻底宣告着政府对中国问题的发言权的掌控。\n\n外务省代表政府对[FNG.GetName]的“官方”态度是支持$FNG_zhang_zuolin$在东北权力的巩固，并与其共同开发东三省，谋求资源和经济的富足。但若$FNG_zhang_zuolin$表示出图谋中央的野心，则不可给予援助，以免与中国各势力造成恩仇关系，致使中日邦交陷入危险，而帝国威信亦失坠于世界。\n\n尽管东京已掌握了对华问题的主动权，但参谋本部仍以所谓“事关国防”为由并未放弃对外交的秘密干涉，对“无能政府”的阳奉阴违已成为他们的日常。而陆军在华的三支军队也同样对参谋本部阳奉阴违：关东军与$FNG_zhang_zuolin$密切合作，希望依仗强大的[FNG.GetName]作为帝国在华的唯一盟友对内博取政治利益，对外则保卫帝国之疆域；天津军（中国驻屯军）希望$FNG_zhang_zuolin$在东北涵养实力，待到中华再度陷入混乱，一举南下称霸于大陆，而令帝国于幕后操纵；上海军与帝国海军关系密切，他们一边在华东、华南寻找着其他合作者，一边渴求取得成果，一扫国内反军的阴霾。\n\n如今八省倾覆，冲突已至，帝国与中华的命运将在这些迥异的团体之下被引向未知的终局。"
  fengtian_japan_mechanic_events.001.tt: "§R在华之对策，对于帝国长期的安定至关重要。假使外交已无可能，战争已成为唯一选择，而帝国又被卷入其中，我们或许便只能选择支持奉天以谋求保卫我们在大陆的利益。这一支持在最后能为我们换来有利的条件，并让我们的对奉影响力不断提高。又或者，也许会出现另一种机遇？§!"
  