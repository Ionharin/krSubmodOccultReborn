l_simp_chinese:
  TAI_pnr_normal.5.t: "东亚共荣协会祝全台国民新春快乐"
  TAI_pnr_normal.5.desc: "在[JAP.GetName]治下，[TAI.GetName]已在日历上同它一道按照公历校准了时间，但真正意义上的鼠年一定是台湾汉族祖辈庆祝的1月24日而非日本规定的1月1日。今天早上东亚共荣协会发表了他们的新年致辞。协会主席陈炘，大东信托公司董事首先向台湾所有国民献上祝福，随后特别提到了台湾总督[TAI.GetLeader]在推行民主化上的努力以及1935年市会及街庄协议会员选举的成果，尽管本次选举并未实现彻底的男性普选，但依然为[TAI.GetName]带来了现代选举的启蒙。\n\n在翼赞过总督府的统治之后，东亚共荣协会则开始了他们一贯的宣传，致辞再一次强调了亚细亚民族共命运中台湾和内地之间的模范化关系，呼吁以1935年的选举为基础，进一步推进对内台差别待遇的抹平。\n\n东亚共荣协会始创于1933年12月10日，协会主席为台中州会议员宫原武熊与大东信托公司董事陈炘，在多年的发展之后，它已和谢龙阔的大同促进会、黄白成枝的大亚细亚黎明协会等组织合并，成为了[TAI.GetName]不可小觑的一股势力。该协会与雾峰林家的林献堂关系密切，这导致有人认为他们鼓吹东亚共荣并非是出于对该概念的认可，而是出于对台湾人当前的生存空间和地位不满，是模仿林献堂，借着“东亚共荣”搞另一条“非武装抗日路线”。"
  TAI_pnr_normal.5.a: "鼠年快乐……"
  TAI_pnr_normal.6.t: "三大亨之治"
  TAI_pnr_normal.6.desc: "尽管帝国经济圈先前因黑色星期一而一度暂停，但政治地震本身却依然传递到了[TAI.GetName]。$JAP_pnr_inukai_tsuyoshi$在自己家中被歹徒闯入击杀让在黑色星期一后本就扑朔迷离的东京政局又增添了一层雾气。无论如何，[TAI.GetLeader]想必在内地政局稳定之前都无法正常辞任了。今天早上林熊征、辜显荣和蓝高川已乘船经横滨前往东京，三人虽然目的地相同但目的并非一致。辜显荣此次赴日是作为今上天皇敕选的贵族院议员出席帝国议会临时会。作为台湾五大家族鹿港辜家的始祖，他曾追随北白川宫能久亲王绞杀当时盘踞在南方的反日暴徒，受赐单光旭日章。\n\n林熊征和蓝高川则是为了与日本方面进行商业谈判，就台湾糖业的问题而前往东京寻求帮助，并借机试探东京大藏省方面的意见，以期缓解黑色星期一之后台湾总督府面临的出口危机。\n\n这三人在台湾当地均是有名的绅士，因为三人曾被邀请出席天皇的御苑聚会并受天皇叙勋，故而又被称为“台湾三大亨”。"
  TAI_pnr_normal.6.a: "希望他们能给总督府带回好消息。"
  TAI_pnr_normal.6.b: "看起来只是三个卖国贼。"
  TAI_pnr_normal.7.t: "蔗奴"
  TAI_pnr_normal.7.desc: "“先……”台中州北斗郡一贯是“台湾三大亨”之一的林熊征的林本源制糖会社的甘蔗采收区，当地的蔗农只能将采收后的甘蔗卖给林本源，尽管只消再走上十余里，就是明治制糖和大日本制糖的工厂，而他们开出的甘蔗收购价要比林家的多三成。但这里毕竟是林熊征的保留地，除了卖给他便别无什么方法。林本源这次仗着二月份爆发的经济危机又进一步压价，如今和其它制糖厂的差距已经来到了五成。要求林本源制糖会社以合理的价格收购甘蔗，保护农民的正当利益已非常有必要。\n\n“先生呐，先生呐！您紧来啊！”此前不甚清晰的声音如今变得响亮，是一个女人呜呜咽咽地哭喊，李应章从后房走到前面的诊间里，就见那小小的农妇坐在地上，旁边是已经昏迷过去的大大的男人。李应章一边让女人把他安置在床上，一边折回后房，取出酒精棉球和注射针筒。等回到诊间的时候，那女人则仍是坐在原地止不住地哭啼，从甘蔗地到天气，最后竟一味地哀叹起命运起来了。李应章只好自己把这佝偻的小男人抬上病床，为他打了一针。\n\n“你这样嚎是做什么，你个哭神婆。”等那病人悠悠地张开眼了之后，他一张嘴就把农妇吞了进去，止住了诊间中的哭号，“你先去找几个粗工帮忙作事，去甘蔗园收成紧要。这甲九万多斤的甘蔗，扣了肥料和借金还有多少钱？若有剩，就先还了李医生的药钱，不然就要托李医生挂账了。”\n\n“你免挂虑钱项，”李应章一边把农妇从地上扶起，一边对着男人说，“药钱无着又有甚问题，先在我这里歇一下，安心静养要紧。”安顿好男人，再把农妇送出诊所之后，李应章终于能继续完成他先前没写完的讲稿了。他心中盘算着要怎么写后续：自我从总督府医专毕业回到二林庄看诊期间，见了许多受林家，受资本主义所逼迫的农户。我万望各位记起蒋渭水学长的遗嘱——“先生啊！”他迈进后房前，那农民突然中气十足地叫了他一声，惊得他回头去看那床位。\n\n“我想敢是不会好咯……”他病怏怏地说，整个人瘪了下去。"
  TAI_pnr_normal.7.a: "凡我青年同志，务须努力奋斗。"
  TAI_pnr_normal.7.b: "亦应加倍团结，为同胞得解放。"
