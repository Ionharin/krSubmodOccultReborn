  QIE_wushan_luoyang_airport_organisation: "洛阳金谷园航空制造局"
  QIE_wushan_luoyang_airport_organisation_subtitle: "实验性空中堡垒设计商"
  QIE_wushan_luoyang_airport_organisation_desc: "1920年5月，吴佩孚于洛阳金谷园修建了大型飞机场，那里正是直系空军的发源地。我们亦将七一四兵工署设置在洛阳，作为新近起步的军工产业基地，其发展目标是与保定地区的军事综合体分庭抗礼，相互制衡，以免造成一方做大的结果。"
  ws_luoyang_airport_mio_initial_trait: "$QIE_wushan_luoyang_airport_organisation_subtitle$\n§L$QIE_wushan_luoyang_airport_organisation_desc$§!\n"
  ws_luoyang_airport_upgrade_12_tt: "在完成§Y战场支援优先§!或§Y空中优势优先§!国策后，激活该特质将为巡抚空路空军统领行台提供§C额外加强§!！\n\n§Y战场支援优先§!将提供对地攻击：§G+15%§!\n§Y空中优势优先§!将提供对空攻击：§G+15%§!"
  ws_luoyang_airport_upgrade_12_1_tt: "§Y巡抚空路空军统领行台§!追加效果\n对地攻击：§G+15%§!"
  ws_luoyang_airport_upgrade_12_2_tt: "§Y巡抚空路空军统领行台§!追加效果\n对空攻击：§G+15%§!"
  ws_luoyang_airport_bonus_desc_20: "§C该特质还可重复激活§Y5§!次。§!"
  ws_luoyang_airport_bonus_desc_19: "§C该特质还可重复激活§Y4§!次。§!"
  ws_luoyang_airport_bonus_desc_18: "§C该特质还可重复激活§Y3§!次。§!"
  ws_luoyang_airport_bonus_desc_17: "§C该特质还可重复激活§Y2§!次。§!"
  ws_luoyang_airport_bonus_desc_16: "§C该特质已§Y无法§!再重复激活。\n\n激活该特质将解锁§Y最终迭代§!。"
  qie_mio_luoyang_airport_bonus_completed: "已将研发规程打磨至完美。"
  QIE_wushan_jiangnan_shipyard_organisation: "江南舰船修造总所"
  QIE_wushan_jiangnan_shipyard_organisation_subtitle: "先端舰队设计商"
  QIE_wushan_jiangnan_shipyard_organisation_desc: "江南舰船修造总所始于1865年成立的江南机器局，在这个分裂又统一的中国，它再次承担起了自己作为尖端舰船研究组织的身份。为中国海军威震亚太献上自己的一份力量。"
  ws_jiangnan_shipyard_mio_initial_trait: "$QIE_wushan_jiangnan_shipyard_organisation_subtitle$\n§L$QIE_wushan_jiangnan_shipyard_organisation_desc$§!\n"
  ### 决议和阵营 ###
  QIE_wushan_establish_japanese_jimi_zhou: "设立日本羁縻州"
  QIE_wushan_establish_japanese_jimi_zhou_desc: "在完成天下一统的大业之后，我们可以将东瀛重新编入新的天下秩序之中。若日本本土已被我们完全控制，我们将撤回在当地的核心与宣称，释放日本为§Y羁縻州§!；若日本已是我们的附庸，则将直接为其装载专属的傀儡国策树。"
  faction_QIE_world_moral_association: "万国道德会"
  faction_manifest_world_wide_ethical_society_name: "天下大同"
  faction_manifest_world_wide_ethical_society_desc: "我们将实现康有为的理想，将整个世界团结为一个超国家的实体。"
  COLLECTION_WORLD_WIDE_ETHICAL_SOCIETY_TARGETS: "万国道德会宣称区域"
  COLLECTION_WORLD_WIDE_ETHICAL_SOCIETY_CONTROLLED: "由我方或阵营成员控制的万国道德会宣称区域"
  QIE_wushan_establish_papal_jimi_zhou: "设立教廷羁縻州"
  QIE_wushan_establish_papal_jimi_zhou_desc: "在意大利与罗马归于我手之后，我们可以撤回在当地的直接法统，转而重建一个受天下秩序节制的教廷政权。它将作为羁縻州存在，并装载专属的傀儡国策树。"
  QIE_wushan_establish_turkestan_jimi_zhou: "设立突厥斯坦羁縻州"
  QIE_wushan_establish_turkestan_jimi_zhou_desc: "在大博弈的疆域完全纳入天下之后，我们可以撤回在中亚诸地的直接法统，转而扶持一个受我朝节制的突厥斯坦羁縻政权。若突厥斯坦尚不存在，我们将直接释放它；若其已是我们的附庸，则会将相关地区并入其版图，并扶植新的礼教派国粹政权。"
  QIE_wushan_establish_arab_jimi_zhou: "设立阿拉伯羁縻州"
  QIE_wushan_establish_arab_jimi_zhou_desc: "在长刃所及之地尽归天下之后，我们可以撤回在西亚、北非与伊比利亚部分地区的直接法统，转而扶持一个受我朝节制的阿拉伯羁縻政权。若伊拉克尚不存在，我们将直接释放它；若其已是我们的附庸，则会将相关地区并入其版图，并扶植新的礼教派国粹政权。"
  QIE_wushan_establish_southasia_jimi_zhou: "设立南亚羁縻州"
  QIE_wushan_establish_southasia_jimi_zhou_desc: "在入三昧之后所及的南亚诸地尽归天下之后，我们可以撤回在当地的直接法统，转而扶持一个受我朝节制的南亚羁縻政权。若不丹尚不存在，我们将直接释放它；若其已是我们的附庸，则会将相关地区并入其版图，并扶植新的礼教派国粹政权。"
