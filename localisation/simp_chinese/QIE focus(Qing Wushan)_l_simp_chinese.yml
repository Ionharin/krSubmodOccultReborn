l_simp_chinese:
 QIE_wushan_the_country_of_social_collaboration: "社会协作之国"
 QIE_wushan_the_country_of_social_collaboration_desc: "工团思想，新儒学，流水线革命，在中国有着各式各样的思想碰撞，他们争论不休，都想用他们自己的方法改变国家。但归根结底，他们至少都自称“爱国者”，我们或许可以利用这一点，将他们团结在一个相互协作的“爱国”组织之下，如果他不想加入，那么就证明他或许对中华怀有二心……"
 QIE_the_government_which_wave_foreigners: "笑面盈盈的体面政府"
 QIE_the_government_which_wave_foreigners_desc: "新政府应当是一个开放的政府，本着美国人在十年前提出的“机会均等”原则，我们再一次邀请世界各国与中国共同开发我们的市场，并且一同获得利益。当然，这份利益只会维持到和平结束的那一天……"
 QIE_wushan_jiang_fanatics_militia_for_master: "团勇治乡"
 QIE_wushan_jiang_fanatics_militia_for_master_desc: "长久以来中国的农民都生活在被游民和土匪侵扰的恐惧之中。在最落后的贫困农村中发展起了一种使用符咒和药水来保护身体免遭伤害的迷信。我们可以利用这些穷苦的贫民，以保护当地寺庙中的神灵为由，借助“神功”和几支老式步枪在农村中建立起民兵队。他们或许不能帮助我们对抗正规军，但假使有一天我们的土地不幸沦陷，这些人将能把敌人拖入到治安战的泥潭之中。"
 QIE_wushan_contact_with_the_social_elites: "拉拢知识分子"
 QIE_wushan_contact_with_the_social_elites_desc: "大多数在野的知识分子并不是为了实现什么理想，他们单纯只是想从中谋取政治资本和“名望”。如果我们能够招揽那些曾反对我们政府的人为我们说话，那就会有更多的民众会因为他们的转变而相信我们真的是一个值得信赖的政府。面对触手可及的利益，大多数知识分子都不会无动于衷的。"
 QIE_wushan_jiang_establish_the_editing_and_translation_department: "恢复译学馆"
 QIE_wushan_jiang_establish_the_editing_and_translation_department_desc: "1903年，为了和国际社会接轨，也为了满足培养新型人才的必要，当时的清政府设立了京师大学堂译学馆以翻译海外著作。然而在1911年它就关闭了。我们应该重设译学馆，对国外出色的军事与科学作品进行翻译，此外，译学馆还可以协助我们出版更多有必要被“翻译”的内容。"
 QIE_wushan_restore_abolished_positions: "赋权地方会馆"
 QIE_wushan_restore_abolished_positions_desc: "自从清末取消科举制度以来，原先供考生休息的地方会馆已经变成了同乡政客和当地社会人士结党营私的俱乐部。重拳出击消灭他们当然是好的，但如果我们能够利用这些同乡会，并且稍稍容忍他们在地方上的行为，或许我们也能从中获取一些利益。"
 QIE_wushan_friend_politics: "朋友政治"
 QIE_wushan_friend_politics_desc: "归根结底，政治的本质是利益分配，以及出于想在利益分配中获得更大优势而形成的一个个牢固又脆弱的联盟。只要能够合理地向政府中的各派人物提供好处，并许以更大的利益期望，这些“朋友们”便自有办法维持现有社会的延续。"
 QIE_wushan_jiang_confirmed_as_the_leader: "四勿轩主人"
 QIE_wushan_jiang_confirmed_as_the_leader_desc: "在江朝宗的英明治理之下，我国的社会状况不仅安定了下来，还赢得了周围国家的尊重和友谊，这一切都足以证明只有江朝宗能挽大厦于降倾，只有江朝宗能带领华北政府实现中华统一的梦想。"
 QIE_wushan_dead_leader_live_country: "和谐平衡"
 QIE_wushan_dead_leader_live_country_desc: "在救世新教的首位教统，神仙普明正化真人的统治之下，我们已经恢复了华北地区的秩序。现在华北地区一扫之前礼教废弛，道德沦丧的乱象，成为了中国无数人艳羡的道德之地，和谐与平衡真正降临到了我们的人民之间。"
 QIE_wushan_wu_confirmed_as_the_leader: "正义阁先生"
 QIE_wushan_wu_confirmed_as_the_leader_desc: "玉帅吴佩孚向世界宣告，中国人民自今天起站起来了，任何外国鬼子和军阀都别再想从中国人民手中夺走一分利益。吴佩孚将带领中国人民修正这世间颠倒的道义，玉帅万岁！孔孟礼教万岁！"
 QIE_wu_control_the_wushan: "吴持神谕"
 QIE_wu_control_the_wushan_desc: "经过又一番波折，吴佩孚再次君临了北京城的顶点。只是这一次物是人非，在他身边簇拥着的不再是津保派和洛阳派的军头们，而是一群念叨着圣贤经文的传统文人。吴佩孚将重塑这个逐渐腐烂的国家，重塑整个中华民族。不久之后，它将再次屹立在广袤的东方大陆之上，成为四方夷狄羡慕的难生中土。"
 QIE_wushan_the_new_government_reviving_tradition: "复兴传统的新政府"
 QIE_wushan_the_new_government_reviving_tradition_desc: "中华大地上有很多野心家，但最终能够支配全国的人却少之又少。我们的政府必须向民众证明自己的实力和抱负，而避免民众将我们和那些昙花一现的僭越政权相提并论。"
 QIE_put_on_the_cloak_of_confucius: "汲取二七暴动的教训"
 QIE_put_on_the_cloak_of_confucius_desc: "1923年发生的二七暴动起因是有邪恶的工团分子混入工人团体之中，公然煽动他们破坏生产。我们必须汲取上次的教训，为此我们将允许工人们组织总工会，当然工会领袖要由我们的政府指派。此外，我们还会要求总工会每周都开展必须强制参加的传统经典读书会，以提高工人们的思想觉悟。"
 QIE_wushan_wu_our_precious_traditional_culture: "珍贵的传统"
 QIE_wushan_wu_our_precious_traditional_culture_desc: "孔孟文化是我们中华民族伟大的传统文化，然而许多接受了国外腐臭思想的知识分子和青年却认为自家的珍珠美玉应该摔碎，转而供奉别人的废石瓦砾。我们将开办国家报章宣传这些美好的传统文化，并在私塾和新式学校中推行相关教学以考核，从而将儒家精神再次注入到中华民族之中。"
 QIE_wushan_establish_fair_social_standards: "弘扬德治仁政"
 QIE_wushan_establish_fair_social_standards_desc: "孔子曾极力反对君主将法律刻在鼎上昭告天下，这并不是因为圣人反对法律，而是因为法律一旦被固定下来，就失去了人类固有的爱心和仁慈的力量，法律只会让人害怕惩罚，而不会使人变得有道德。这也是西方法治的致命问题所在。我们将谨记圣人的话语，以不成文的道德法引导和裁判民众。"
 QIE_wushan_wu_enforcing_ethics_through_military_orders: "道德警察"
 QIE_wushan_wu_enforcing_ethics_through_military_orders_desc: "尽管政府已在社会上广泛地推行宣传了孔孟之道和儒家传统道德，尽管大多数人都认为弘扬这些美德是很有必要的。但社会上却依旧充斥着谎言，欺骗和不道德。社会风气的转变并非一日之功，但为了快速教化民众，我们应该设立道德警察督促并提醒民众遵守相关规定。"
 QIE_wushan_restore_squire_council: "重启缙绅议会"
 QIE_wushan_restore_squire_council_desc: "西方思想摧毁了我国稳定的农村结构，废除了中国原本长期实行的缙绅-宗族管理制度，这正是我国社会陷入动荡的原因之一。我们将在县一级重开缙绅会议，积极发挥这些乡村里的知识分子解释社会规范，传播道德文化的作用，从而帮助政府更好地管理农村地区。"
 QIE_wushan_revise_cautions_laws: "恢复银行信用"
 QIE_wushan_revise_cautions_laws_desc: "1916年的停兑令严重打击了中央银行的信用，导致我们的银行实际上无法吸收足够多的存款。我们必须立刻要求财政部泉币司对我们的银行业务进行监管，并尝试恢复中央银行的信用——只有银行能够正常开办金融业务之后，我们才能够分配这些财富到真正能用得上它们的地方。"
 QIE_the_reluctant_two_leaders: "生者分坐两厢"
 QIE_the_reluctant_two_leaders_desc: "尽管一个死人坐上了救世新教至高教统的宝座，但为了推行政策，他依然需要一个活人政府为他代劳。江朝宗和吴佩孚已被任命为特命副教统，负责协力钱能训教统治理国家。江吴二人再次开始了他们在桌下的斗争，用他们的方式各自对这脆弱又坚固的领袖之位施加着影响。"
 QIE_the_oracle_of_master_lv: "真人居中升座"
 QIE_the_oracle_of_master_lv_desc: "乩坛之上出现了一位新神仙的降笔，原来是救世新教的初代教统，北洋政府国务总理钱能训显现了。此前他已飞升紫府，位列仙班。他不忍看到教团因内斗而分裂，因此而降鸾在此。钱真人已下达谕旨，此后教团大小事务，皆全权听从他的旨意。"
 QIE_jiang_controls_the_wushan: "江握乩笔"
 QIE_jiang_controls_the_wushan_desc: "江朝宗终于坐上了他梦寐以求的权力宝座，不是虚妄的圣人之位，而是真正的君王之位。在他脚下这个满目疮痍的国家中，教团成员与北京市民们对他三呼万岁。而他也决定用他自己的方式来回报友人和民众对他的信任与祝福。"
 QIE_wushan_two_leader_the_order_of_non_speaker: "与实业家修复关系"
 QIE_wushan_two_leader_the_order_of_non_speaker_desc: "我们之前为了处理社会危机对地主阶级和实业家们采取的劝捐行为显然破坏了他们对我们的信任。通过减税，补贴和各种其它对企业有利的行为，我们或许可以与这些和社会发展息息相关的人取得和解，并继续得到他们的支持。"
 QIE_wushan_reassess_the_financial_situation: "鼓励农会组织"
 QIE_wushan_reassess_the_financial_situation_desc: "总的来说我国基本上还是一个农业国家，1913年我国主持了全国农会联合会会议，然而随着袁世凯的退位和随之而来的政局动荡，大部分农会组织都因资金不足与农业人才流失难以为继。我们必须对它们伸出援手，以保全这些农业科学的专家，只有他们才能帮助我国避免任何可能的粮食危机。"
 QIE_wushan_forcing_prisoners_to_work: "重提京卿学士"
 QIE_wushan_forcing_prisoners_to_work_desc: "京卿学士是在戊戌变法时期提出的一个新的职位，该职位由技术人才和受过高等教育的专家担任，其地位对标西方世界的顾问。想要科学地治理国家，获得各个领域的专家的帮助必不可少。我们将重新建立京卿学士这个贵族职位，以将大部分技术精英团结在政府中。"
 QIE_wushan_stability_means_everything: "稳定意味一切"
 QIE_wushan_stability_means_everything_desc: "中国人已经生活在传统的农耕社会中几千年了，即便他们已经剪掉辫子，但小农意识深入了他们的骨髓。农耕文明天然地厌恶一切风险，这一方面意味着我们的人民实际上是一群最保守的保守主义者。但从另一方面来看，不管我们颁布什么政策，只要我们还能确保社会稳定，那么他们就不会有什么除抱怨之外的实际行动。"
 QIE_restore_the_order_behind_shanhaiguan: "恢复关内秩序"
 QIE_restore_the_order_behind_shanhaiguan_desc: "长期以来，中国一直被野心勃勃的强人们和心怀不轨的地方派系所分裂。作为中国唯一的合法政府，我们将向这些割据一方的军阀，左翼分子甚至革命党匪徒发去电报，要求他们放下武器立刻归顺。但如果他们连这最后的仁慈都不接受的话，我们就将起兵讨伐他们，消灭这些僭主。"
 QIE_advance_to_the_shanhaiguan: "望向关外"
 QIE_advance_to_the_shanhaiguan_desc: "直奉战争尚且可以称得上是两位强者一决雌雄的战争，但邪恶的张作霖却无法堂堂正正地接受他的失败，他流窜回了奉天，在那里向日本人卑躬屈膝，并计划将整个中华献给他的外国主子。我们必须斩杀这个卖国贼！"
 QIE_wushan_hongfan_jiuchou: "洪范九畴"
 QIE_wushan_hongfan_jiuchou_desc: "在中国古代，贤德的圣人箕子向平定天下的周朝天子传授了基于中国天人合一原则的这部法律。既然中国全境都已在我们的控制之下，我们将效仿这部中国传统经典，颁布一部崭新的宪法，一部舍弃所有有毒有害的西方思想的，属于中国自己的宪法。"
 QIE_wushan_central_science_technology_institute: "国立北京科技研究所"
 QIE_wushan_central_science_technology_institute_desc: "我国的科技研究依然落后于世界水平，现在战争已经宣告结束，我们终于获得了发展机会。在[QIE.GetLeader]的授意之下，我们和北京帝国大学合作建立了国立北京科技研究所，这将帮助我们的科技水平追赶列强。"
 QIE_wushan_nationalized_religious_site: "宗教场所国有化"
 QIE_wushan_nationalized_religious_site_desc: "我们绝不能容许那些外国传教士和受到他们蛊惑的中国人继续在我们的土地上运营教堂，我们也不能容许那些和尚，道士和阿訇不受我们控制地进行宗教活动。为了将全国人民团结在一起，我们必须要求所有宗教组织都服从于政府的领导。"
 QIE_wushan_financial_rebuild: "金融业整合"
 QIE_wushan_financial_rebuild_desc: "金融是国家的命脉，如果没有银行吸纳资金，我们就没办法开展许多工作。先前因社会状况混乱，人们天生不信赖我们的国家银行，转而将资产托管给各类民间银行处理。为了便于监管金融业，我们应该对这些民间银行发放牌照，并设立一个监管部门来确保他们的运作稳定与安全。"
 QIE_wushan_support_1922_education_act: "重提壬戊学制"
 QIE_wushan_support_1922_education_act_desc: "壬戌学制于1922年由政府提出，该学制在短期内于沿海地区和城市中催生出一批新式学校，但广大农村和内陆地区的实行却面临师资短缺的问题。如今我们将再次广泛推行壬戊学制，并对内陆地区进行更有力度的扶持。"
 QIE_wushan_epidemic_prevention_section: "时疫防治司"
 QIE_wushan_epidemic_prevention_section_desc: "长期以来我国政府的卫生健康工作都隶属于警察厅系统，主要负责维持公共场所的卫生情况。我们必须将其从中分离出来，设立独立的卫生系统来管理潜在的传染病和国民健康问题。"
 QIE_wushan_start_land_reform: "渐进的土地改革"
 QIE_wushan_start_land_reform_desc: "高昂的土地租赁价格是我国农业长期以来无法迈向机械化，制度化的原因之一。尽管在战前我们已经借助短工制将一部分农业人口转化为了工人，但我国依然面临着很严峻的土地问题。进行土地改革刻不容缓，但我们不能损伤支持我们的地主的利益。最合适的方法是通过法律限制地主无法随意提高地租，并继续有计划地回购土地并以长期贷款的形式“售卖”给农民，将他们转化为自耕农。"
 QIE_wushan_yilun_youxu: "彝伦攸叙"
 QIE_wushan_yilun_youxu_desc: "经过我们的努力，我国终于在成为道德之国的道路上又迈出了重要的几步。我们在战后颁布的一系列措施虽然偶尔有反对的声音，但总体上还是受到了许多支持。这正是因为我们统一了中国，而作为胜利者的我们自然是天命所归的统治者，既然天命加身，做什么都一定有庸人所没有察觉到的道理。"
 QIE_after_wushan_control_whole_china_qingzhou_building: "电气化的中国"
 QIE_after_wushan_control_whole_china_qingzhou_building_desc: "电气化是工业现代化的核心，大力发展电气化不仅能提高民众的生活水平，也对我国的战略物资提炼和军工武器制造颇有助益。不幸的是我们目前资源有限，为此我们将先从北京和上海两座大城市开始，对中国逐步进行电气化改造。"
 QIE_after_wushan_control_whole_china_yizhou_building: "推广机械化耕作"
 QIE_after_wushan_control_whole_china_yizhou_building_desc: "我国大部分农民目前都在耕地中进行亲力亲为的耕作，这没什么不好的，但或许我们可以体恤这些为全国人民辛苦的人。我们应该大力推广机械化耕作，这不仅能降低生产成本，还能提高水田与旱地生产的综合效益，最重要的是，机械化耕作本身还能在农村地区解放出大量佃农，将他们驱赶到城市中成为工人。"
 QIE_after_wushan_control_whole_china_jiangzhou_building: "战后劝业会"
 QIE_after_wushan_control_whole_china_jiangzhou_building_desc: "既然战争已经告一段落，中国已经基本结束了它分裂的现状，我们接下来就应该把国家的侧重点从战争转向发展。与欧洲世界的那些工业化，现代化的社会相比，我国的工业十分落后。经济部计划举办一场劝业会，将宣布对实业家们进行补贴，帮助他们兴建各类工厂。"
 QIE_wushan_decide_our_tank_mio_traits: "举办第一次兵工署会议"
 QIE_wushan_decide_our_tank_mio_traits_desc: "我们的装甲武器要如何发展，科学家，士兵，官僚们都有自己的看法。我们最好举办一次兵工署会议，商讨我们这个新生的国家军工组织未来的发展方向。"
 QIE_wushan_high_speed_racing_engine: "特殊发动机项目"
 QIE_wushan_high_speed_racing_engine_desc: "经过一系列谨慎的讨论，兵工署决定对坦克发动机进行研究，通过增加我们的发动机强度，敌人面对的将是一座又一座飞驰在地面上的骇人炮台。"
 QIE_wushan_the_exprience_of_chinese_war: "问鼎中原的战利品"
 QIE_wushan_the_exprience_of_chinese_war_desc: "战争结束了，全中国都已落入我们手中。各省军阀所遗留下来的兵工厂和军械库也自然而然地归我们所有。另一方面，我们在战争期间通过特别另款也准备了一大笔用于战后军工建设的资金，让我们好好利用这些，使其能继续服务于我们的目的。"
 QIE_integrate_existing_MIO_resources: "七一四兵工署的诞生"
 QIE_integrate_existing_MIO_resources_desc: "尽管我们国家各个地方都拥有能够生产步枪和火炮的兵工厂，但我们始终没有掌握生产坦克的能力。[ROOT.GetLeader]已经下令开展一项名为“鲲鹏计划”的军工发展计划，该计划的第一个目标就是扩张我们在战前设立的洛阳七一四研究所，该部门将开展机械化军事工业的相关研究，并为未来的国防建设积累经验。假以时日，我们定能迎头赶上世界潮流，成为一支不可小觑的军事力量。"
 QIE_after_wushan_control_whole_china_jinzhou_building: "重新合并经济部"
 QIE_after_wushan_control_whole_china_jinzhou_building_desc: "戊戌变法时我国曾设立农工商总局以管理全国经济发展，该部门在之后的政府中被拆分为农矿部和工商部。但由于经济权力长期以来都掌握在财政部手中导致它们的权力比预计的要小。为了便于战后发展，我们必须让他们获得更多的经济权力。"
 QIE_after_wushan_control_whole_china_jizhou_building: "国防工业"
 QIE_after_wushan_control_whole_china_jizhou_building_desc: "战争只是短暂地离开了我们，它并非完全离我们远去。在不久的将来，国外和国内的邪恶势力一定会挑起另一场意图消灭中华文化，消灭中华人民的战争。我们要为这场战争做准备，绝不能废弛我们的国防工业。"
 QIE_after_wushan_control_whole_china_yanzhou_building: "支持棉纺织业"
 QIE_after_wushan_control_whole_china_yanzhou_building_desc: "在所有涉及民生的轻工业中，棉纺织业绝对是最合适快速发展的产业。作为劳动密集型产业，它兼具庞大的民生刚需、吸纳巨量就业的能力，以及对农业与制造业产业链的强大拉动作用。如果我们想要拉动农业与工业循环，我们就应该大力发展棉纺织业。"
 QIE_after_wushan_control_whole_china_yangzhou_building: "农业为本"
 QIE_after_wushan_control_whole_china_yangzhou_building_desc: "任何一个国家都不该不重视农业，一方面农产品确保了我国人民的正常饮食，另一方面农产品还可以成为各种制造品的原料。想想1936年在四川发生的饥荒带来了多么恐怖的社会动荡？如果我们不发展农业，社会就将陷入动荡的阴影，而工商业的发展也永无可望。"
 QIE_after_wushan_control_whole_china_xuzhou_building: "注重经济作物"
 QIE_after_wushan_control_whole_china_xuzhou_building_desc: "在确保我国的粮食作物耕种范围足够大的情况下，我们也应该鼓励农民们将一部分土地用于耕种棉花一类的经济作物，这有助于提高农民们的收入，并真正实现”兴农“的目的。"
 QIE_after_wushan_control_whole_china_yuzhou_building: "继续农业改良"
 QIE_after_wushan_control_whole_china_yuzhou_building_desc: "袁世凯时期我国曾借助农会组织向农村地区的民众们普及农业知识，进行凿井灌田工作，以及设立农事试验场以推动良种和农具改良。但当孙文党人在南方挑起叛乱之后，我们的农业改良计划就不得不中止了。现在是时候重启该计划了。"
 QIE_wushan_focus_on_small_medium_size_dam: "发展中小规模水利"
 QIE_wushan_focus_on_small_medium_size_dam_desc: "我国缺少能够从零建造大型水利工程的人才，这需要时间培养。而大型水利工程也并非一蹴而就的，无法解决现阶段我们所面临的急迫能源问题。最好的选择就是从一些小型的水电站开始，通过数量而非规模解决我们发展中遇到的能源问题。四川龙溪河水力发电工程瀼渡河水力发电工程"
 QIE_wushan_shuifeng_reservoir: "利用水丰水库"
 QIE_wushan_shuifeng_reservoir_desc: "在我国和韩国交界处有一处早期日本人和奉天伪政府联合修建的水库，水丰水库。其地理位置优越，能够提供大量水能资源。假使我们能与韩国达成一份合约，或许我们就能与他们共同利用这座从旧日敌人手中夺来的战利品。"
 QIE_construction_after_chinese_unification: "六合同风，九州共贯"
 QIE_construction_after_chinese_unification_desc: "我国的历史自古以来就是由各民族共同书写的，五方之民的结构直截了当地指出位于中国核心的民族应该像哥哥帮助弟弟那样去帮助四夷——位于周边的民族。如今中华大地上的四夷都已认同我们的政府是天下共主，为了纪念我们和各民族之间深厚的兄弟友谊，我们将按照古制划分九州，并在对应的地区修建纪念碑，让人们能够永远记住是我们将他们从分裂和战乱中拯救了出来。"
 QIE_after_wushan_control_whole_china_luoyang_building: "重铸雒阳之鼎"
 QIE_after_wushan_control_whole_china_luoyang_building_desc: "自开天辟地始，人类的统治者便安坐于天下中心的位置，分制约八方辅佐他的地区。对大多数人来说这只是一个神话，但其中却暗含着天命的预兆。我们既然已经平定天下，并顺应民意成为了万世之明君，那么就应当顺应这上古时代的制度，将我们的统治机关迁移到世界的中心——洛阳。如此一来我们便能向我们的民众证明，三皇五帝与贤德的周天子的国家确实降临到了他们身边。"
 QIE_wushan_return_to_democracy: "五色旗飘扬的新一年"
 QIE_wushan_return_to_democracy_desc: "中国人民的梦想终于实现了！如今中国已再次统一，人们走上街头欢庆着战争的结束与和平的到来。救世新教是我国统一的大功臣！现在正如他们之前所承诺的那样，这个新生的民主共和国已从其手中接过权力，将带领中国人民走向新的时代。中国万岁！共和万岁！"
