 JAP_pnr_continental_policy_category: "大陆政策"
 JAP_pnr_continental_policy_category_desc: "\n我们已决定对中国采用分而治之的平衡外交政策，为此我们可以对各个中国势力进行暗中资助，以确保大陆长期维持分裂状态——为了避免重蹈西原借款的覆辙，我们稍稍修正了资助方案，假以时日中国便会沦为我们的傀儡国，进而被我们吞并。\n\n\n"
