 #### Taiwan Localisation ####

 TAI_country_intro_background: "GFX_TAI_intro"
 TAI_KR_pnr_gathering_storm_desc: "1895年，清政府决定向日本割让台湾岛，但台湾当地民众却不愿由他人主宰自己的命运。在奋战184天之后，台湾民主国的国旗从台南撤下，而台湾总督府的国旗则飘扬在这座岛屿上空四十年。\n\n1936年的新年钟声已经敲响，在过去的一年中，$TAI_pnr_jap_puppet_ADJ$居民们度过了对他们来说或许是最充满希望的一年。在经过长期的请愿斗争和博取国际支持后，随着1935年11月的第一次议员选举的落幕，这座岛屿似乎不再是一件属于他人，被别人随意支配的战利品。$TAI_pnr_jap_puppet_ADJ$居民在半个世纪之后又一次握住了自己的命运，而不出所料的改变也即将开始。"
 TAI_guide: "我的"

