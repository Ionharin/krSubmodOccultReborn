 ### Character and trait ###

 TAI_pnr_nakagawa_kenzo: "中川健藏"
 TAI_pnr_nakagawa_kenzo_leader_desc: "§Y生于：§!§L1875年；日本国、新潟县§!\n§Y派系：§!§m民政党§!\n§Y背景：§!§L中川健藏是大日本帝国的典型文官。在于东京帝国大学毕业之后，他通过高级公务员考试进入内务省，成为了内务省官僚的一员。从北海道地方政府官员一路升迁到东京都知事。\n\n世界大战结束之后，《青岛条约》的签署使得国内民主运动愈演愈烈，而其中也出现了要同情关怀总督府居民，赋予他们合理权利的呼声——社会舆论相信，如果大日本帝国本身都无法平等对待内地居民和总督府居民，那他们又有什么脸面去大肆宣传凡尔赛条约时德国人对日本提出的“人种平等”原则的不屑呢？民意迫使大日本帝国政府不得不一改过去武官担任总督的惯例，开始了文官总督治理总督府的新时期。\n\n1932年5月，$TAI_pnr_nakagawa_kenzo$被任命为总督府第十六任总督，任期至1936年9月1日。在$TAI_pnr_nakagawa_kenzo$抵达台湾后，他积极尝试修复先前因暴力冲突而变得紧张的原住民-政府关系，并尝试延续前几任文官总督留下的遗产，最终在1935年末的台湾博览会期间促成了台湾历史上第一次议员选举。§!§!"

 ### Ideas ###

 TAI_pnr_aftermath_of_wushe_incident: "雾社事件的余波"
 TAI_pnr_aftermath_of_wushe_incident_desc: "台湾当地原住民对日本人和汉人展开的那场流血冲突的余波依然残留在这个小岛之上，人们依然担心目前的平静是否会再一次被类似的事件打破。"
 TAI_pnr_imperial_back_garden: "帝国后花园"
 TAI_pnr_imperial_back_garden_desc: "自1895年之后日本便开始统治台湾，至今已过去了约40年。随着台湾本地的武装反抗逐渐偃旗息鼓，如今东京调整了它对台湾的策略，并开始加强对台湾的文化统治和经济建设。"
 TAI_pnr_cockcroft_walton_accelerator: "考克饶夫-瓦尔顿加速器"
 TAI_pnr_cockcroft_walton_accelerator_desc: "荒胜文策击败了远在日本本岛的仁科芳雄与菊池正士的研究团队，在条件最艰苦的台北帝国大学的实验室中成功实现了人工击破原子核实验，这是世界上第二次成功，也是亚洲的第一次成功。毫无疑问，这再一次证明黄种人即便受限于外部条件的不足也能取得举世瞩目的进步——亚洲人与亚洲科技必将在不远的未来屹立于世界之上！"

 ### Modifiers ###


 #### KOJ Localisation ####

 KOJ_country_intro_background: "GFX_KOJ_intro"
 KOJ_KR_pnr_gathering_storm_desc: "1910年8月22日，就是在这一天《日韩合并条约》正式成立，使得朝鲜半岛成为了日本领土的一部分。在数十年的总督府统治下，半岛已俨然成为了日本向大陆扩张影响力的工具。原本属于朝鲜李氏王朝的诸多建筑被拆除，延续数百年的城市设计被彻底推倒——东京意图在半岛进行一场大计划，将$KOJ_ADJ$首府汉城打造成一座对标巴黎的特别都市，以彰显日本作为亚洲领头羊的地位。朝鲜总督们有序地筹措资金，调集人手以实现这“百年计划”，然而在外部，流亡上海的朝鲜伪政府在国际上肆意抹黑总督府的统治，在半岛北部，性情暴烈的不逞之徒们在暗中试图破坏这和平。与此同时，由东京资助的奉天政府正摩拳擦掌，准备再度于中原大地上与各路中华豪杰争锋。和平还能持续多久？而朝鲜总督府的统治又能安稳多久？"
 
