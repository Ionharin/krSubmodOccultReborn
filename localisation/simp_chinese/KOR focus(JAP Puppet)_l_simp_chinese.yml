 KOJ_pnr_seoul_renovation_plan: "汉城改造计划"
 KOJ_pnr_seoul_renovation_plan_desc: "京城的道路体系根据日本的军事目的和经济需求进行改造。 而象征朝鲜王朝和大韩帝国时代国权的建筑大部分都遭到破坏， 并将拆除的建材挪用于他处， 或是在其近处新建大规模的公共建筑。 城市行政和城市管理总是优先考虑日本人的利益。 总督府在中日战争之前的1936年扩大京城府的领域， 部署战争物资生产设施。"
 KOJ_pnr_issue_special_bonds: "发行债券"
 KOJ_pnr_issue_special_bonds_desc: "为了继续推进朝鲜半岛改造计划，将半岛打造成我国在大陆上的支点，钱是万万不可或缺的。除了从本岛大藏省处得到经费之外，我们也可以借助债券来募集当地人的财产。"
