l_simp_chinese:
 LOADING_TIP_0: "宗教在生活中要么是一种娱乐和麻醉剂，要么是一种愚弄和骗局。\n- 阿莱斯特·克劳利，1913年"
 LOADING_TIP_1: "日本乃神国！议会制度绝对行不通，独裁专制才是唯一的出路！看啊，马克思就在你们身后，他的幽灵正在摧毁大和民族！\n- 出口王仁三郎，1934年9月28日随笔"
 LOADING_TIP_2: "社会大众党是日本工农革命运动的主要危险。其中最危险的便是左翼社会大众党人。他们用革命的词句，掩盖他们的叛卖行径。\n- 《日本共产党1932年提纲》"
 LOADING_TIP_3: "天照大神你在哪儿！为什么不来帮助陛下！日本的神都是混蛋，你们全都在睡大觉吗？老子要把你们这群卑劣无耻的神赶出日本！\n- 矶部浅一
 LOADING_TIP_4: "世界社会主义的建设必须经过一国社会主义建设的阶段，一国社会主义建设则必须站在国民立场上，这体现了社会进化的必然性。\n- 赤松克麿，《国民社会主义与国际工人协会》"
 LOADING_TIP_5: "在一项投资的开始之际就出现了骗子，恰恰证明这项投资有利可图。\n- 鲇川义介"
 LOADING_TIP_6: "我们相信有了工会组织，就有了支持我们自己的最好方法。工会必须自身是工人自主自治能力日益充实的表现，是不断扩充其对外能力的机构，同时又是工人自身想要创造的未来社会的萌芽。\n- 大杉荣，《工人运动的精神》"
 LOADING_TIP_7: "明治维新时日本高举尊王攘夷的旗帜，封建制度清算仅是其必然结果，而今日革命事业的目标已被明确地被理解为清算资本主义本身。\n- 麻生久，1935年"
 LOADING_TIP_8: "君主养育百姓，从而延续先皇基业；臣民忠于君主，从而继承父辈遗志。君臣合一，忠孝合一——唯我大日本国可也。\n- 吉田松阴，《士规七则》"
 LOADING_TIP_9: "用你们充满希望的青春之血，在天空书写日本的历史吧！\n- 北一辉与岸信介在犹存社的对话，1919年"
 LOADING_TIP_10: "战争，为创造之父，文化之母；战争，为万有生命之无限生机，为天赋我皇国之使命。\n- 《国体的本义与其强化的提倡》"
 LOADING_TIP_11: "小心！小心！小心！远离汉口！吾友！远离灾祸，远离灾祸！\n- 李鸿章的鬼魂在降灵会上对庆丕所说，1910年"
 LOADING_TIP_12: "艺术是民族生命的审美表现，是在我民族生命之中把握并再现宇宙之美与调和的实相。\n- 桥本欣五郎"
 LOADING_TIP_13: "日本诸神以助人为本心，天下万民皆为神之物。陷赤子万民于痛苦中者乃神敌，理当天诛。\n- 高桥太郎"
 LOADING_TIP_14: "比如你今年十五岁，我今年五岁，你我之间订立一个平等条约，你打我一掌，我也还你一拳。这自然是很平等了，可是无论如何，五岁的我怎能打胜十五岁的你呢？\n- 叶公超"
 LOADING_TIP_15: "民粹主义！悦耳的名字，但是所谓民粹，正是各民族各自拥有的精粹，绝不是某种通用的精粹。一个日本人去模仿俄罗斯的民粹精神，妄图学习日本的民粹，多么可悲啊！多么可悲啊！\n- 远藤友四郎"
 LOADING_TIP_16: "那时摩西登上西奈山，天浮船随即将他带到了日本。而后，在能登的宝达山，天皇向他显现并赐下了十诫。由此推断，犹太人确实是日本人的旁支。\n- 竹内巨麿"
 LOADING_TIP_17: "古老西藏的消亡似乎带有某种宿命感，法轮已然转动，神秘也已消逝。西藏不再有守护者，也无人守护西藏。\n- 尼古拉斯·洛里奇，《阿尔泰-喜马拉雅》"
 LOADING_TIP_18: "为政者怠于辅弼之任，而天命弃之。随后锦旗扬，革命举。\n- 安冈正笃"
 LOADING_TIP_19: "那些无比纯洁的农民阶级只能仰仗我们，只有我们青年军官是他们的光，能够体悟他们的苦恼。\n- 《皇道维新的吼声》"
 LOADING_TIP_20: "请天皇陛下发动大权，发行一张一千亿日元的钞票购买下所有国内债务，经济问题就迎刃而解了。\n- 出口王仁三郎"
 LOADING_TIP_21: "至尊者堕落了，只有彻底复活至尊的绝对神性，才能复活日本的灵魂，向世界传播皇道的福音。\n- 大岸赖好，《皇政维新大纲》"
 LOADING_TIP_22: "如今的日本国民令我感到恶心，在我眼中看到的是沉闷弛缓的生命，是腐朽的烂泥。日本国民失掉了庄严的理想，变得懦弱、颓废、下流，使人鄙夷。\n- 大川周明"
 LOADING_TIP_23: "庶孔之大同、老之三清、佛之极乐、耶之天国、回之长存，一时胥发见于地球焉。\n- 江希张，《息战论》"
 LOADING_TIP_24: "各教分道扬镳，各行其是，儒者曰孔子之道光明，佛者曰释迦之道广大，耶回二教夸其教主，互相讥讪，互相攻击，救世之愿未达，而各教之战已至。\n- 吴佩孚"
 LOADING_TIP_25: "谁本孔子一贯之言，凛佛家造孽之诫。\n- 段祺瑞"
 LOADING_TIP_26: "西人常谓吾中国无宗教，人群如散沙，靡有团结。今救世新教为吾国之国教，苟国人能皆崇奉而宗之，是亦联结人心之一大机会也。\n- 熊悔修"
 LOADING_TIP_27: "我说日本切腹而中国介错，如今日本已走上全民族切腹的道路，可惜中国还不配做他们的“介错”。\n- 胡适，1935年"
 LOADING_TIP_28: "别给张作霖任何东西，军用饭盒也不行。\n- 内田康哉，1921年"
 LOADING_TIP_29: "张作霖拟入关压制吴佩孚之野心已经非常明了，向我方求援军火及军费，对我并无益处。援张并引导其在满洲之发展为我帝国重要政策，但绝不应迎合其虚荣之野心，故此际我帝国要尽力抑制其不自然势力之扩张，使之着力于满洲自体之发展。\n- 第一次直奉战争前三宅坂的批示"
 LOADING_TIP_30: "阁下如今手握兵力，如今只需掌握权力。若财力上需要援助，则敝人保证必可相助，使日、中两国利益相协调一致，以建立两国永久友好关系，更不可不为奠定其基础走出第一步。\n- 西原龟三，1918年"
 LOADING_TIP_31: "国事危急。解决之方，惟在副署。鄙人只望国土不致分裂，国体不致动摇，其他政治改良，尽有商量余地，绍帅想即入都，和平解决，深赖荩筹。\n- 张勋致江朝宗电报"
 LOADING_TIP_32: "西南扰壤，托名护法，实则蓄志破坏，以遂其吞并之私图，司马之心，路人皆见。\n- 倪嗣冲，1918年"
 LOADING_TIP_33: "中日亲善的最大害虫就是袁世凯，他是英美势力的走狗，特别是得到了英国公使和他的英国顾问的大力支持。\n- 唐绍仪与莫理循的对话，1916年"
 LOADING_TIP_34: "如果听之任之，孙中山的革命军是否一定能取得胜利难以确定。为了使革命军统一、组织化，给革命党人做尽可能多的事情，希望你能借我十万日元，并且不要指望以后我会还钱。\n- 宇都宫太郎会见岩崎久弥，1911年"
 LOADING_TIP_35: "我给参谋本部发了电报，说中国长江一带爆发了革命。参谋本部认为我终于发疯了，要立刻把我扭送回国治疗。\n- 寺西秀武，1911年"
 LOADING_TIP_36: "既然要在中国行走，就必须设法驱逐俄罗斯的势力。为了把俄罗斯驱逐，必须在中国的国土上开战。要在中国打仗，必须把中国拉到我们一方，是按照这样的顺序。于是我在开始学习中国话的同时，也努力地靠近中国的大人物。\n- 坂西利八郎，1903年"
 LOADING_TIP_37: "君为臣纲，纲者，表率也；君臣即上下之意，所以示差别也。在军队里，长官对于部下亦为君臣。\n- 吴佩孚"
 LOADING_TIP_38: "那是一种疯狂。而这种疯狂成了一种中和剂。破坏之后所感受到的是奇特的安宁。\n- 佐佐木到一"
 LOADING_TIP_39: "全国本属一家，焉有南北之界？北洋原系一体，何有皖直之分？国军同仇对外，安有芥蒂之嫌？\n- 曹锟"
 LOADING_TIP_40: "你要我反张作霖，我就要你反曹锟；这事咱俩同时干，一起来当王八蛋。\n- 张宗昌回复吴佩孚"
 LOADING_TIP_41: "国家要是没有了，借款就根本不用还了；国家要是强大了，我还什么借款？\n- 段祺瑞"
 LOADING_TIP_42: "要是日本打赢了，我们都有光明的前途；要是中国打赢了，我们是中国人，一样有光明的前途。万一中国不要我们，我们就去投奔法国人，怎么能说我们就没有光明的前途呢？\n- 吴化文"
 LOADING_TIP_43: "我北洋军阀是也。\n- 倪嗣冲"
 LOADING_TIP_44: "这事他妈的好办，我们去几个人把孙文党人的住处一围，然后开始放枪，大家伙儿嘴里再嚷嚷“袁宫保走了，我们北洋没人要了”，准保能把他们吓唬跑。\n- 曹锟，于北京兵变前夜。"
 LOADING_TIP_45: "想不到国民党人所作所为竟完全背离中国人的传统观念。我只是认为他们打仗是为了夺取政权，我没有想到他们竟会走极端，他们的行事竟完全违反我国的传统和我国的政治哲学。\n- 顾维钧"
 LOADING_TIP_46: "再举革命，非我不行，同时要再举革命，非服从我不行。我敢说除我外，无革命导师。\n- 孙中山"
