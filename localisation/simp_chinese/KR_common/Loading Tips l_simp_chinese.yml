l_simp_chinese:
 LOADING_TIP_0: "宗教在生活中要么是一种娱乐和麻醉剂，要么是一种愚弄和骗局。\n- 阿莱斯特·克劳利，1913年"
 LOADING_TIP_1: "日本乃神国！议会制度绝对行不通，独裁专制才是唯一的出路！看啊，马克思就在你们身后，他的幽灵正在摧毁大和民族！\n- 出口王仁三郎，1934年9月28日随笔"
 LOADING_TIP_2: "社会大众党是日本工农革命运动的主要危险。其中最危险的便是左翼社会大众党人。他们用革命的词句，掩盖他们的叛卖行径。\n- 《日本共产党1932年提纲》"
 LOADING_TIP_3: "天照大神你在哪儿！为什么不来帮助陛下！日本的神都是混蛋，你们全都在睡大觉吗？老子要把你们这群卑劣无耻的神赶出日本！\n- 矶部浅一
 LOADING_TIP_4: "世界社会主义的建设必须经过一国社会主义建设的阶段，一国社会主义建设则必须站在国民立场上，这体现了社会进化的必然性。\n- 赤松克麻吕，《国民社会主义与国际工人协会》"
 LOADING_TIP_5: "在一项投资的开始之际就出现了骗子，恰恰证明这项投资有利可图。\n- 鲇川义介"
 LOADING_TIP_6: "我们相信有了工会组织，就有了支持我们自己的最好方法。工会必须自身是工人自主自治能力日益充实的表现，是不断扩充其对外能力的机构，同时又是工人自身想要创造的未来社会的萌芽。\n- 大杉荣，《工人运动的精神》"
 LOADING_TIP_7: "明治维新时日本高举尊王攘夷的旗帜，封建制度清算仅是其必然结果，而今日革命事业的目标已被明确地被理解为清算资本主义本身。\n- 麻生久，1935年"
 LOADING_TIP_8: "君主养育百姓，从而延续先皇基业；臣民忠于君主，从而继承父辈遗志。君臣合一，忠孝合一——唯我大日本国可也。\n- 吉田松阴，《士规七则》"
 LOADING_TIP_9: "用你们充满希望的青春之血，在天空书写日本的历史吧！\n- 北一辉与岸信介在犹存社的对话，1919年"
 LOADING_TIP_10: "战争，为创造之父，文化之母；战争，为万有生命之无限生机，为天赋我皇国之使命。\n- 《国体的本义与其强化的提倡》"
 LOADING_TIP_11: "小心！小心！小心！远离汉口！吾友！远离灾祸，远离灾祸！\n- 李鸿章的鬼魂在降灵会上对庆丕所说，1910年"
 LOADING_TIP_12: "艺术是民族生命的审美表现，是在我民族生命之中把握并再现宇宙之美与调和的实相。\n- 桥本欣五郎"
 LOADING_TIP_13: "日本诸神以助人为本心，天下万民皆为神之物。陷赤子万民于痛苦中者乃神敌，理当天诛。\n- 高桥太郎"
 LOADING_TIP_14: "比如你今年十五岁，我今年五岁，你我之间订立一个平等条约，你打我一掌，我也还你一拳。这自然是很平等了，可是无论如何，五岁的我怎能打胜十五岁的你呢？\n- 叶公超"
 LOADING_TIP_15: "民粹主义！悦耳的名字，但是所谓民粹，正是各民族各自拥有的精粹，绝不是某种通用的精粹。一个日本人去模仿俄罗斯的民粹精神，妄图学习日本的民粹，多么可悲啊！多么可悲啊！\n- 远藤友四郎，《向皇国军人诉说》"
 LOADING_TIP_16: "那时摩西登上西奈山，天浮船随即将他带到了日本。而后，在能登的宝达山，天皇向他显现并赐下了十诫。由此推断，犹太人确实是日本人的旁支。\n- 竹内巨麻吕"
 LOADING_TIP_17: "古老西藏的消亡似乎带有某种宿命感，法轮已然转动，神秘也已消逝。西藏不再有守护者，也无人守护西藏。\n- 尼古拉斯·洛里奇，《阿尔泰-喜马拉雅》"
 LOADING_TIP_18: "为政者怠于辅弼之任，而天命弃之。随后锦旗扬，革命举。\n- 安冈正笃"
 LOADING_TIP_19: "那些无比纯洁的农民阶级只能仰仗我们，只有我们青年军官是他们的光，能够体悟他们的苦恼。\n- 《皇道维新的吼声》"
 LOADING_TIP_20: "请天皇陛下发动大权，发行一张一千亿日元的钞票购买下所有国内债务，经济问题就迎刃而解了。\n- 出口王仁三郎"
 LOADING_TIP_21: "至尊者堕落了，只有彻底复活至尊的绝对神性，才能复活日本的灵魂，向世界传播皇道的福音。\n- 大岸赖好，《皇政维新大纲》"
 LOADING_TIP_22: "如今的日本国民令我感到恶心，在我眼中看到的是沉闷弛缓的生命，是腐朽的烂泥。日本国民失掉了庄严的理想，变得懦弱、颓废、下流，使人鄙夷。\n- 大川周明"
 LOADING_TIP_23: "庶孔之大同、老之三清、佛之极乐、耶之天国、回之长存，一时胥发见于地球焉。\n- 江希张，《息战论》"
 LOADING_TIP_24: "各教分道扬镳，各行其是，儒者曰孔子之道光明，佛者曰释迦之道广大，耶回二教夸其教主，互相讥讪，互相攻击，救世之愿未达，而各教之战已至。\n- 吴佩孚"
 LOADING_TIP_25: "谁本孔子一贯之言，凛佛家造孽之诫。\n- 段祺瑞"
 LOADING_TIP_26: "西人常谓吾中国无宗教，人群如散沙，靡有团结。今救世新教为吾国之国教，苟国人能皆崇奉而宗之，是亦联结人心之一大机会也。\n- 熊悔修"
 LOADING_TIP_27: "我说日本切腹而中国介错，如今日本已走上全民族切腹的道路，可惜中国还不配做他们的“介错”。\n- 胡适，1935年"
 LOADING_TIP_28: "别给张作霖任何东西，军用饭盒也不行。\n- 内田康哉，1921年"
 LOADING_TIP_29: "张作霖拟入关压制吴佩孚之野心已经非常明了，向我方求援军火及军费，对我并无益处。援张并引导其在满洲之发展为我帝国重要政策，但绝不应迎合其虚荣之野心，故此际我帝国要尽力抑制其不自然势力之扩张，使之着力于满洲自体之发展。\n- 第一次直奉战争前三宅坂的批示"
 LOADING_TIP_30: "阁下如今手握兵力，如今只需掌握权力。若财力上需要援助，则敝人保证必可相助，使日、中两国利益相协调一致，以建立两国永久友好关系，更不可不为奠定其基础走出第一步。\n- 西原龟三，1918年"
 LOADING_TIP_31: "国事危急。解决之方，惟在副署。鄙人只望国土不致分裂，国体不致动摇，其他政治改良，尽有商量余地，绍帅想即入都，和平解决，深赖荩筹。\n- 张勋致江朝宗电报"
 LOADING_TIP_32: "西南扰壤，托名护法，实则蓄志破坏，以遂其吞并之私图，司马之心，路人皆见。\n- 倪嗣冲，1918年"
 LOADING_TIP_33: "中日亲善的最大害虫就是袁世凯，他是英美势力的走狗，特别是得到了英国公使和他的英国顾问的大力支持。\n- 唐绍仪与莫理循的对话，1916年"
 LOADING_TIP_34: "如果听之任之，孙中山的革命军是否一定能取得胜利难以确定。为了使革命军统一、组织化，给革命党人做尽可能多的事情，希望你能借我十万日元，并且不要指望以后我会还钱。\n- 宇都宫太郎会见岩崎久弥，1911年"
 LOADING_TIP_35: "我给参谋本部发了电报，说中国长江一带爆发了革命。参谋本部认为我终于发疯了，要立刻把我扭送回国治疗。\n- 寺西秀武，1911年"
 LOADING_TIP_36: "既然要在中国行走，就必须设法驱逐俄罗斯的势力。为了把俄罗斯驱逐，必须在中国的国土上开战。要在中国打仗，必须把中国拉到我们一方，是按照这样的顺序。于是我在开始学习中国话的同时，也努力地靠近中国的大人物。\n- 坂西利八郎，1903年"
 LOADING_TIP_37: "君为臣纲，纲者，表率也；君臣即上下之意，所以示差别也。在军队里，长官对于部下亦为君臣。\n- 吴佩孚"
 LOADING_TIP_38: "那是一种疯狂。而这种疯狂成了一种中和剂。破坏之后所感受到的是奇特的安宁。\n- 佐佐木到一"
 LOADING_TIP_39: "全国本属一家，焉有南北之界？北洋原系一体，何有皖直之分？国军同仇对外，安有芥蒂之嫌？\n- 曹锟"
 LOADING_TIP_40: "你要我反张作霖，我就要你反曹锟；这事咱俩同时干，一起来当王八蛋。\n- 张宗昌回复吴佩孚"
 LOADING_TIP_41: "国家要是没有了，借款就根本不用还了；国家要是强大了，你还想让我还钱？\n- 段祺瑞"
 LOADING_TIP_42: "要是日本打赢了，我们都有光明的前途；要是中国打赢了，我们是中国人，一样有光明的前途。万一中国不要我们，我们就去投奔法国人，怎么能说我们就没有光明的前途呢？\n- 吴化文"
 LOADING_TIP_43: "我北洋军阀是也。\n- 倪嗣冲"
 LOADING_TIP_44: "这事他妈的好办，我们去几个人把孙文党人的住处一围，然后开始放枪，大家伙儿嘴里再嚷嚷“袁宫保走了，我们北洋没人要了”，准保能把他们吓唬跑。\n- 曹锟，于北京兵变前夜。"
 LOADING_TIP_45: "想不到国民党人所作所为竟完全背离中国人的传统观念。我只是认为他们打仗是为了夺取政权，我没有想到他们竟会走极端，他们的行事竟完全违反我国的传统和我国的政治哲学。\n- 顾维钧"
 LOADING_TIP_46: "所谓同化，其实不与之同化，乃掩饰之名词也，其目的是希望日本政府对台人松弛压力，能放宽束缚，俾台人得减轻痛苦而已。\n- 林献堂"
 LOADING_TIP_47: "天助自助者，吾人为贯彻目的，今后遇到任何障碍亦须不屈不挠，此时虽为奴隶也要隐忍。必须研究建设比今日更加美丽之新台湾的方法，这是须要不屈不挠的努力的。\n- 林献堂"
 LOADING_TIP_48: "世间唯有文化运动断没有失败，表面上的成败并不足算，有运动便有影响着人民，到底这些无形的种子，是永久可以生长的。\n- 陈逢源"
 LOADING_TIP_49: "个人或者有可以压迫，主义绝对不能软化收买的，感情或者一时可以离间中伤，思想终究不怕权威恐吓的。\n- 林呈禄，《最近五年间的台湾统治根本问题》"
 LOADING_TIP_50: "噫！同化啊！以汝名而行的国语中心主义，已将我们的活动能力加以抑制，我们的人材概归无能化，举凡政治的社会的地位，非任令母国人独占不可。因此，后藤新平的八十年同化说，可以解释为使我们永久作奴的秘策。\n- 蔡培火"
 LOADING_TIP_51: "台湾革命社会运动，已进入第三期，无产阶级的胜利迫在眉睫。凡我青年同志须极力奋斗，而旧同志要加倍团结，积极的援助青年同志，期望为同胞解放而努力。\n- 蒋渭水，于遗嘱中托付"
 LOADING_TIP_52: "台湾是一个别有天地，在政治的关系上，不能用中国话来支配，在民族的关系上，不能用日本的普通话来支配，所以主张适应台湾的实际生活，建设台湾独立的文化。\n- 黄石辉，1930年"
 LOADING_TIP_53: "近日孔圣人的孝子贤孙们群起而倡建文庙了，于是一班“之乎也者焉矣哉”的老先生们的大文章洋洋乎千言登在报上。但我以为他们并不是孔圣人的孝子贤孙，因为他们正坐在“欺下罔上”之罚。\n- 张我军"
 LOADING_TIP_54: "要记得！输入西洋文明太迟的中国，是被东洋文明弄坏了的，而且连你本身也被它弄得无可容身之地，如此你还想不够吗？你还想带它来弄坏日本，弄坏台湾吗？\n- 张我军"
 LOADING_TIP_55: "在满族的统治下，中国成为一个美丽的花园式的国度。\n- 辜鸿铭，《雅各宾派的中国》"
 LOADING_TIP_56: "台湾总督府之官吏！我虽今年失败，必期明年成功。倘不承认我台民之独立，则必举事。不幸事不成，则吾等一举而起翻天覆地之骚动！\n- 罗福星，于遗嘱中托付"
 LOADING_TIP_57: "哈哈！汝是以服从为美德的善良民？现大千界里，有何法律？但有维持特别阶级之工具而已，亦不过一种力的表现罢。\n- 赖和"
 LOADING_TIP_58: "哦！群众的叫喊声！被生命追迫着的人们的惨呼声，震断了多少欢笑的心弦！振荡起血潮高鸣！\n- 杨华"
 LOADING_TIP_59: "革命事业是伟大而艰苦的，要想获得革命的成功，必须要有革命新细胞不断的补充。\n- 李友邦"
 LOADING_TIP_60: "时至近日，吾人所当努力者，惟在如何吸取西洋文明之长，以济吾东洋文明之穷。断不许以义和团的思想，欲以吾陈死寂灭之气象腐化世界。\n- 李大钊"
 LOADING_TIP_61: "虽然有人批评日本殖民时期榨干了朝鲜人民的鲜血，但这是一种基于对政治历史的无知和对日本人的敌意而产生的偏见和无稽之谈。\n- 朴重阳"
 LOADING_TIP_62: "台湾总督府之官吏！我虽今年失败，必期明年成功。倘不承认我台民之独立，则必举事。不幸事不成，则吾等一举而起翻天覆地之骚动！\n- 罗福星，于行刑前"
 LOADING_TIP_63: "如果上帝问：“你的愿望是什么？”我会毫不犹豫地回答：“我的愿望是韩国独立。”\n- 金九"
 LOADING_TIP_64: "人民不应该盲目服从于政府，不要忘记政府是人民的公仆，人民是自己的主人。\n- 徐载弼"
 LOADING_TIP_65: "我愿生活在幸福的日本，东方的天堂，世界的花园，决不愿生活在种族偏见和歧视极其严重的美国，气味难闻的中国，以及拥有魔鬼政府的朝鲜。\n- 尹致昊"
 LOADING_TIP_66: "你们不要以为日本帝国主义能长久维持，我们的独立终将实现。\n- 柳宽顺"
 LOADING_TIP_67: "清国皇帝将台湾割让给日本帝国，所以堂堂成为日本帝国之臣民。而既为日本臣民，尽忠于日本帝国，拯救我三百六十万同胞，是本人微衷。\n- 辜显荣"
 LOADING_TIP_68: "渐渐习习到，菊花母株繁荣日，分根终有时。\n- 胜田主计，1918年"
 LOADING_TIP_69: "你坐在宫城里，我们不但怕要留为复辟的种子，也觉得革命事业因此还未完成；就你个人而言，把一个青年老是监禁在城堡里，又觉得心里很不安。\n- 周作人，1924年"
 LOADING_TIP_70: "使皇上既可恢复它所失去的权力，又使这复辟看上去完全是满族人支持的而不带任何其他色彩。\n- 张作霖与庄士敦的对话，1924年"
 LOADING_TIP_71: "若提优待清室条件，我国民军便不加入，如果坚决主张，吾等即宣言攻北京。\n- 冯玉祥，1925年"
 LOADING_TIP_72: "列国咸谓冯倡赤化，落井下石，破坏优待条件致吾天子蒙尘。\n- 康有为，1925年"
 LOADING_TIP_73: "吾观孙先生过去之经历，虽可认为一伟大人物，然彼急求成功，为敷衍一时计，从来不问其对手为何人，只有乞助于妥协一途。甚至联络日本。\n- 吴佩孚同徐绍桢谈话，1923年10月2日"
 LOADING_TIP_74: "吴子玉一骗王占元，再骗赵恒惕，三骗鄂省人民，今加兵岳州，进兵川陕，俨然与西南为敌，我不打他谁打他。此种人说话毫无信义，叫我如何能信？\n- 孙中山，1921年12月5日"
 LOADING_TIP_75: "吴佩孚是个中国式的老学究，让他对新思想感兴趣是不容易的。他是个“成品”。而土匪张作霖是个可以加工的原料。\n- 孙中山，1922年"
 LOADING_TIP_76: "余信政治之要谛在于道德，而孙先生似认政治为一种技术。不知《大学》所谓治国平天下之根源在于诚意正心修身，示人以万姓率由之轨范。余奉此信条不渝。\n- 吴佩孚，1923年"
 LOADING_TIP_77: "中国青年党说，国家主义的运动“就是要国家能够独立，人民能够自由，而在国际上能够站得住的种种运动”。\n- 胡适，1930年"
 LOADING_TIP_78: "时刻将至，德国将被称作世上最好战的国度。自其腹地将崛起一个可怖之人，向全世界发动战争。他掀起的这场战火，将是人类所经受最为恐怖的战争。\n- 《圣奥迪莱预言与战争终结》，1916年"
 LOADING_TIP_79: "今日所谓有主义的革命，大都是向壁虚造一些革命的对象，然后高喊打倒那个自造的革命对象；好像捉妖的道士，先造出狐狸精山魈木怪等等名目，然后画符念咒用桃木宝剑去捉妖。妖怪是收进葫芦去了，然而床上的病人仍旧在那儿呻吟痛苦。\n- 胡适，1930年"
 LOADING_TIP_80: "有两处证据可以证明天秤座主宰奥地利。1916年春俄国将军布鲁西洛夫击败奥军期间，火星恰好运行经过天秤座；而马肯森元帅率领德军成功进攻罗马尼亚的战事，则印证罗马尼亚由狮子座主宰。\n- 拉尔夫·雪莉，1917年1月"
 LOADING_TIP_81: "湖南督军张敬尧带兵到四川到湖南打仗，到处都建造九天玄女庙；出战时招呼兵士左手心写一「得」字，右手心写一「胜」字，向西对九天玄女磕几个头，保管得胜。诸君看看这是什么玩意儿？\n- 陈独秀，《克林德碑》"
 LOADING_TIP_82: "Boxing的确是外国所有的字，但不同中国的打拳；对于中国可以说是“不会”。正如拳匪作Boxer，也是他们本有的字；但不能因有此字，便说外国也有拳匪。\n- 鲁迅，《拳术与拳匪》"