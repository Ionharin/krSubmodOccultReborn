  ### 覆写原版事件 ###
  japan_domestic_events.242.t: "黑色星期一波及……[EGY.GetName]？"
  japan_domestic_events.242.d: "随着柏林股市的“圣诞节高峰”在一月末戛然而止，柏林证券市场的行情更是在俄德谈判时内容泄露，切尔诺夫遇刺，以及[LEP.GetName]局势恶化等国际事件的多重影响下急转直下。就像我国大多数经济学家在“圣诞节高峰”结束后预测的那样，德意志帝国的经济崩溃终于变成一场席卷世界的经济危机。幸运的是由于长期以来[GER.GetName]都在尝试将我们其经济领域，所以东京和大阪并没有因为这场危机而遭到重大冲击，不过即便我们的经济体在庞大的中欧同盟市场，或者称之为“德国的世界霸权市场”中处于边缘位置，我们还是被其经济崩溃的多米诺骨牌击中了，然而恰恰是因为我们与德国的直接贸易不多，所以我们很快就能从这次经济危机中恢复……至少在昨天，这个说法还是有效的。\n\n今天稍早些时候，[EGY.GetName]宣布由于“紧急状态”而单方面宣布停止履行自1926年以来我国与其签订的《日埃经济互惠贸易协定》，该协定已经过多次续约，下一次续约期本定在1940年。但[EGY.GetName]受到黑色星期一影响，突如其来的国际大宗商品崩盘和外部需求萎缩令埃及政府的经济遭到重大打击，这使得他们最终选择背叛和我们之间的约定。如果这就是全部的纠纷，我们只是失去了一纸贸易协定就好了。问题远不止如此，除了废除协定之外，[EGY.GetName]还宣布即日起将对我国棉布、人造丝产品征收约达70%的汇兑补偿税，以保护本地纺织业，扭转廉价日本纺织品倾销的“经济阴谋”。无论如何，我们目前已经失去了[EGY.GetName]这个重要的贸易伙伴，而未来会怎样我们不得而知……"
  japan_domestic_events.242.a: "经济……不是在恢复吗？"
  fengtian_japan_mechanic_events.001.t: "三宅坂与霞关"
  fengtian_japan_mechanic_events.001.d: "帝国与中国有着悠久的交往史，而其对华政策自相矛盾，摇摆不定也已成为了长久的传统，构成了所谓“霞关”与“三宅坂”间的“二元外交”。自1872年西乡隆盛向中国派遣优秀的陆军将校担任对华谍报人员至今已有64年，期间对华情报工作从未间断。三宅坂的陆军参谋本部自信于能依靠其长期耕耘的情报体系在对华外交问题上占尽优势。\n\n与之相对应的则是则是霞关的外务省，最初仅有“二局四课”的外务省在外交问题上话语权薄弱，仅有四百余人的规模难以撼动早已在对华外交领域深耕多年的陆军。但随着政党政治在世界大战后逐渐被民众推崇，军人转而被认为是冲突和弊病的源头。值此良机，在前首相原敬高超的政治手腕之下，外务省得到了大规模的扩张，并将关于外交事务的决策从陆军手中夺回。1934年外务省构成的“五局时代”则彻底宣告着政府对中国问题的发言权的掌控。\n\n外务省代表政府对[FNG.GetName]的“官方”态度是支持$FNG_zhang_zuolin$在东北权力的巩固，并与其共同开发东三省，谋求资源和经济的富足。但若$FNG_zhang_zuolin$表示出图谋中央的野心，则不可给予援助，以免与中国各势力造成恩仇关系，致使中日邦交陷入危险，而帝国威信亦失坠于世界。\n\n尽管东京已掌握了对华问题的主动权，但参谋本部仍以所谓“事关国防”为由并未放弃对外交的秘密干涉，对“无能政府”的阳奉阴违已成为他们的日常。而陆军在华的三支军队也同样对参谋本部阳奉阴违：关东军与$FNG_zhang_zuolin$密切合作，希望依仗强大的[FNG.GetName]作为帝国在华的唯一盟友对内博取政治利益，对外则保卫帝国之疆域；天津军（中国驻屯军）希望$FNG_zhang_zuolin$在东北涵养实力，待到中华再度陷入混乱，一举南下称霸于大陆，而令帝国于幕后操纵；上海军与帝国海军关系密切，他们一边在华东、华南寻找着其他合作者，一边渴求取得成果，一扫国内反军的阴霾。\n\n如今八省倾覆，冲突已至，帝国与中华的命运将在这些迥异的团体之下被引向未知的终局。"
  fengtian_japan_mechanic_events.001.tt: "§R在华之对策，对于帝国长期的安定至关重要。假使外交已无可能，战争已成为唯一选择，而帝国又被卷入其中，我们或许便只能选择支持奉天以谋求保卫我们在大陆的利益。这一支持在最后能为我们换来有利的条件，并让我们的对奉影响力不断提高。又或者，也许会出现另一种机遇？§!"
  
  ### JAP新事件 ###

  JAP_pnr_event.1.t: "大帅的演说"
  JAP_pnr_event.1.desc: "今天稍早些时候，$FNG_zhang_zuolin$发表了一场简短的公开演讲，他通过援引中国古代故事“毋忘在莒”来对近来[FNG.GetAdjective]社会上的两股政治风潮进行评论。\n\n自1936年开年以来，主张南下统一中国，与[716.GetCapitalVictoryPointName]政府步调维持一致的光复派同主张“东北人的东北”的地方派之间的争端便持续不断，对于地方派，他们有着另一个非正式的称呼，“东北党”。长期以来这些地方主义者都是横亘在$FNG_zhang_zuolin$面前的一道无形的长城，他们出于对过去十几年东北军穷兵黩武导致经济崩溃时产生的饥荒与社会混乱记忆犹新。不用多想，他们背后有着希望$FNG_zhang_zuolin$能安稳运营东北的关东军支持着；而响应政府号召，鼓吹南下重新一统中国的光复派则得到了天津军的大力支持。\n\n此前$FNG_zhang_zuolin$虽然偶尔会公开表示自己没有放弃南下的野心，但我们一向认为这是他安抚自己势力的一种说辞。东京也曾多次通过关东军告诫其帝国对该问题的态度：得陇望蜀是人之常情，但欲要称霸全国，需首先妥善经营其势力范围——我们曾希望借此委婉地传达暂时不支持其统一中华的野心。然而这一次的演讲和他最近的行动却表明我们的希望落空了：所谓的“毋忘在莒”正是在多年艰苦经营之后收复失地，这表明了$FNG_zhang_zuolin$对光复派的直接支持；此外，$FNG_zhang_zuolin$在近几个月一转先前对地方主义情绪的放纵态度，开始大规模逮捕不支持政府南下的“东北党”人士。这很可能预示着$FNG_zhang_zuolin$相信发动第五次直奉战争的时机已经到来了，如果战争真的到来，这对我们在[FNG.GetName]的各项产业并不是一个好消息……"
  JAP_pnr_event.1.a: "$FNG_zhang_zuolin$如果是认真的……"
  JAP_pnr_event.2.t: "大帅真要南下吗？"
  JAP_pnr_event.2.desc: "张大帅前脚刚刚在父老乡亲面前许下诺言，后脚日本人就提着礼物屁颠屁颠地跑过来对着大帅嘘寒问暖。他们就跟伺候老父亲一样伺候着张大帅，等到大帅被他们伺候美了，这些狗娘养的才张嘴怯生生地说出自己的真实目的：“大帅爷，您先前讲要统一中华，是不是真的啊？”\n\n妈的，原来是想知道大帅先前许下打回北京的那番豪言壮志是不是吹牛逼！\n\n看来日本人是不明白大帅的脾气，那些不长眼的东西立刻被踢出了大帅府。君子一言，驷马难追。大帅一言，让日本人他亲爷爷放几万匹马也追不上！"
  JAP_pnr_event.2.a: "去你妈的，不然呢？"
  JAP_pnr_event.3.t: "竹计划"
  JAP_pnr_event.3.desc: "驻[FNG.GetAdjective]总领事馆传回了消息，$FNG_zhang_zuolin$真的计划南下统一中国！很难想象[FNG.GetName]在第三和第四次直奉战争中令人不忍直视的表现是怎么给$FNG_zhang_zuolin$勇气去谋划再一次同[QIE.GetName]进行一场战争的——难道凭[GER.GetName]无暇东顾，华东陷入混乱就能推导出[QIE.GetName]如今是个可以轻易战胜的对手吗？大家都还没忘记第三次直奉战争时北京城不到一天就被$QIE_wu_peifu$的小股部队彻底攻破，三十年前，八国联军想拿下北京城门都要花两天时间；在第四次直奉战争，当$FNG_zhang_zuolin$还慢悠悠地动员兵力时，$QIE_wu_peifu$则已经彻底摧毁$SHX_yan_xishan$的军队，在五台山参拜佛寺了。\n\n现在想来，[JAP.GetName]当初扶持$FNG_zhang_zuolin$是因为1911年他自称没有逐鹿中原的野心，只想经营“东北人的东北”，与日本共图利益的一致。然而第二次直奉战争的结果是$FNG_zhang_zuolin$盘踞在[608.GetCapitalVictoryPointName]做他的土皇帝，全然忘记了先前许下的那些诺言。以至于他在后来被赶出北京，回到东北之后仍然对中央的权力念念不忘。假如直奉开战，想必$FNG_zhang_zuolin$只能继续在东北地区制造饥荒，我们在东北的既有利益也会因战争受到影响。\n\n或许是时候放弃$FNG_zhang_zuolin$了，如果有能够挑战他权威，取代他代言[FNG.GetName]利益的人出现，并且此人能够与[JAP.GetName]进行持久而互信的合作的话，将大大有助于[JAP.GetName]在东北权益的伸张，虽然现在没有头绪，但我们总是会找到这样的人的。\n\n当然，$FNG_zhang_zuolin$和他的军队或许比我们想的要更强，以至于他们真的能在后续的战争中取胜。虽然不怎么情愿，但我们或许可以咨询一下现在正在[FNG.GetName]协助$FNG_zhang_zuolin$，担任参谋工作的$JAP_tojo_hideki$具体情况，作为关东军的他想必会给出较为保守且实际的军队实力评判。"
  JAP_pnr_event.3.a: "我们当初为什么要和马贼合作？"
  JAP_pnr_event.3.b: "保险起见，问一下$JAP_tojo_hideki$。"
  JAP_pnr_event.4.t: "剃刀的回复"
  JAP_pnr_event.4.desc: "小官近日受到问询之后不敢怠慢，于是立刻亲自探访了[FNG.GetAdjective]军队的实际训练，并结合先前的所见所感如实汇报：[FNG.GetAdjective]军队的训练程度，就目前掌握的情况来看，想要向[608.GetCapitalVictoryPointName]挑战是无谋的，军队的弹药目前无法确保供应，而其战意也几乎不存在。假如一支小队与突然出现的马贼交手，或许也难以占到什么便宜。至于支队的撤退则蔚为壮观，如同东北的老虎在平原上迅速果断的奔行，一日之间便能撤退千里。\n\n然而，我觉得以上问题在于设施的不足和军纪的缺乏，若以帝国的规范对[FNG.GetAdjective]军事的设施和理论进行指导，形成日中两国军队的协同提携，那假以时日[FNG.GetAdjective]军队必将成为不可小觑的中国势力。况且在北京有着直隶派的统治，其背后无论怎么说都残留着德国的势力，归根结底是西方所乐见的一道屏障。反观[FNG.GetName]，对于$FNG_zhang_zuolin$这么优秀和有因缘的人不去援助，一旦帝国只因他的志向远大而选择袖手旁观，从而失去他的信赖，那帝国的对华外交将来则永远不会再有振作的机会。若夫张作霖一心寻求帝国援助的方法，而帝国也不吝于给予其恩宠，那小官相信两国的利益必定能够成功地得到结合。"
  JAP_pnr_event.4.a: "听上去是军阀平均水平——没有水平。"
  JAP_pnr_event.5.t: "竹行动：整理现状"
  JAP_pnr_event.5.desc: "“所谓的[FNG.GetName]，”阿部伸夫在那张关系图背面涂好了胶水，把它拍在了立起来的纸板上，“与其说是一个政府和国家实体，不如说是现代的‘梁山泊’，是一群土匪组成联盟一起扮演家家酒，最后成真了的怪异存在。当然就这一性质上来看，大多数中国军阀都与之相同。”\n\n说到这里他咳了一下，以提醒先前就已经表现出昏昏欲睡的态度各班员打起精神：“我知道我们现在没什么抓手，所以大家也没什么头绪。但是至少掌握一下基本情况，然后静待机会出现——让我们继续说。[FNG.GetName]的核心毋庸置疑是$FNG_zhang_zuolin$，正是位于中央担任盟主的‘大帅’将各个派别的团体暂时性地团结在一起。1919年宽城子事件之后，虽然$FNG_zhang_zuolin$形式上统一了东北，但实质上只是将东北其它的军阀头目赶走了，[FNG.GetName]内部还残留着当前的派系斗争和分歧。如今在政府中占有主要影响力的有协和会——没什么好说的，我想大家都知道贸然用这群人只会直接暴露我们，谁不知道他们和[JAP.GetName]有关系？光复系，他们是直皖战争后投向$FNG_zhang_zuolin$的旧皖系残党，该组织如今只是一个文人为主的群体，在军事上依赖着[FNG.GetName]；交通系，他们是依赖于交通银行形成的派阀小圈子，是一群彻底的实用主义者，过去曾和我国有着利益上的暂时同盟，如今则成为了满铁扩张在东北利益的反对者；以及$FNG_zhang_zuolin$为中心的张氏集团，也就是$FNG_zhang_zuolin$自身的派系。”\n\n“我想我们先从光复系和交通系开始寻找合作者，他们一方控制了沈阳国会，易于被收买；另一方则追求更广泛的经济利益，先试一试他们中间有没有可以合作的人，”说到这里，阿部主任看了一眼那个已经垂下头去的家伙，把手边的粉笔投了过去。"
  JAP_pnr_event.5.a: "小野！你等下跟着班外雇员一起上街！"
  JAP_pnr_event.6.t: "行动意外：反目的可能性？"
  JAP_pnr_event.6.desc: "对[FNG.GetName]周围潜在的合作者的调查行动取得了一些进展，借助班外雇员的社会关系，我们的调查者成功和残余的“东北党”产生了接触，这些地方主义者们虽然遭到了政府的严厉打击，但依然维持着顽强的生命力。\n\n在简短交谈之后我们收获了一些额外信息：[FNG.GetNameDef]的分封制结构比我们想象的还要坚固，然而这种近乎古老的权力模式却使得我们能够进一步窥探其中的不和。\n\n就像我们之前确定的那样，整个[FNG.GetNameDef]无非是一个伪装成政府的土匪窝点，土匪头子之间关系不佳也是自然的事情。在袁世凯时期的“驱逐段芝贵”事件中，身为27师师长的$FNG_zhang_zuolin$曾借助计谋构陷自己的结拜兄弟，彼时和自己势均力敌的28师师长冯德麟，从而赢得了北洋政府的信任，一举夺得了奉天督军的权力。1917年张勋发动复辟之时，$FNG_zhang_zuolin$为了进一步削弱冯德麟，便暗中将自己拥护复辟的消息泄露给冯德麟，使得彼时急切希望借助政治外力压倒$FNG_zhang_zuolin$的冯德麟进京高调拥护复辟——随着复辟失败，冯德麟被北洋政府逮捕，$FNG_zhang_zuolin$遂一举收编了整个28师，彻底夺取了他的兵权。\n\n冯德麟死后，他的儿子$FNG_feng_yong$在张作霖军中效力。此人是游走于[FNG.GetNameDef]中的崭新势力，与中国青年党（YCP）有所关联。但我们如今也很难确认他是否仍对此事怀有怨气，或许我们可以尝试接触此人，试探他是否能以“冯氏集团”取代“张氏集团”。"
  JAP_pnr_event.6.a: "追加经费，调查新线索。"
  JAP_pnr_event.6.b: "继续按照现有计划进行调查。"
  JAP_pnr_event.7.t: "菊行动：调查告一段落"
  JAP_pnr_event.7.desc: "越是深入窥探[FNG.GetNameDef]的政府结构，我们就越是惊叹于他们整个系统的古老和——原始，使人不由得想起了中华地区古老的周天子分封制。整个东北中最富庶的奉天由“皇帝”，张氏父子牢牢控制着；发展程度次高的地区，如黑龙江和吉林则属于吴俊陞和张作相的地盘；集团之中资历较老，但当初曾有过背叛嫌疑，与冯德麟一同试图架空$FNG_zhang_zuolin$的汤玉麟则被分封（或是流放）到了因为几次直奉战争已经破败不堪的热河，与直系在前线对峙；像是张宗昌这样后来依附于[FNG.GetName]的军阀则被安置在外围，至于那些更年轻的军官则只能当上军团长或是各省督办，随着[FNG.GetName]撤回东北之后也都失去了自己的地盘。\n\n这一基于人身依附的权力结构完美地确保了张氏父子对[FNG.GetName]的统治无虞，位于内圈，掌握强大兵权的瓜分了利益的军官们根本不愿轻易支持有人打破这一分封制。现在想来郭松龄当初失败或许也与此有关。不过这也意味着位于权力圆环外围的军官们一定对此感到不满，或许后续行动我们可以转变思路，不再从$FNG_zhang_zuolin$身边人入手，而从外围物色合适对象。"
  JAP_pnr_event.7.a: "好像清晰了，好像又没有。"
  JAP_pnr_event.7.b: "说实话，要不问问张宗昌……"
  JAP_pnr_event.8.t: "反目的可能性：不可能"
  JAP_pnr_event.8.desc: "我们已经和$FNG_feng_yong$私下接触，然而情况不容乐观。在得知我们的来意之后，$FNG_feng_yong$义正言辞地要求我们离开，称自己不愿意和[JAP.GetAdjective]政府扯上哪怕一点关系。尽管直接接触失败了，我们还是对他的交际圈子和平时言行做了许多跟踪和研究：看起来$FNG_feng_yong$和他已经死去的父亲不同，对于争霸东北怀抱着一种厌恶的态度，甚至可以说是胸无大志的人。此人比起自立为王似乎更热衷于作为一个士兵行动。不知道他哪根脑筋搭错了，他在私下里支持着$FNG_zhang_xueliang$的事业，而对争夺[FNG.GetNameDef]的权力毫无想法。换句话说就是他现在给他父亲仇人的儿子在工作，想必他的行为早已招致了冯德麟昔日部下的不满，我们也没办法指望他能有什么号召力，能够动员起冯氏集团旧部对抗$FNG_zhang_zuolin$了。冯德麟如果在天有灵看到这一幕，想必一定要一枪崩死这个不孝子。"
  JAP_pnr_event.8.a: "实在不行就利用张景惠那个邪教徒吧……"
  JAP_pnr_event.9.t: "狗肉将军的电报"
  JAP_pnr_event.9.desc: "滚。"
  JAP_pnr_event.9.a: "火气这么大干什么。"
  JAP_pnr_event.10.t: "兰行动：陷入死路"
  JAP_pnr_event.10.desc: "如果我国真要寻找一位能够取代$FNG_zhang_zuolin$并能控制整个[FNG.GetNameDef]利益的人，我们首先便需要他利于操控，这并不意味着他一定是一个亲日派。地方军阀、联省自治分子甚至是民族主义者都无所谓，我们希求的此人一定是能和我国尽可能地共同开发[FNG.GetAdjective]资源，并且只有称霸东北，而无称霸中国的野心的人物。\n\n为了实现这一点，他必须对$FNG_zhang_zuolin$心怀不满，同时握有一定数量的军队或掌握着军备来源，最后他必须愿意和我国合作，尽管是一种短期的合作。这样的人物如今看来在[FNG.GetName]并不存在。或许我们唯一的选择只剩下$FNG_zhang_zuolin$了，支持他光复中华的计划，并确保战争的尽快结束才是我们应该考虑的。"
  JAP_pnr_event.10.a: "没有继续调查下去的必要了。"
  JAP_pnr_event.10.b: "或许还有可能性……"
  JAP_pnr_event.11.t: "柳暗花明：人选确定"
  JAP_pnr_event.11.desc: "尽管杨宇霆常被认知为[FNG.GetName]中的士官派成员，并且常常以[FNG.GetLeader]的管家自居。但我们的深入调查发现这只是单纯的误解，或者说对其认识的不全面。我们的调查人员发现杨宇霆本人其实是徐树铮的手下，这意味着他本人其实是皖系残党，难怪[FNG.GetLeader]始终与他保持着微妙的距离。\n\n1918年徐树铮与张作霖合作制造“秦皇岛劫械案”，抢劫了我国本来卖给冯国璋的军火，背后正是杨宇霆本人在牵线搭桥。徐杨二人本来的计划是上演“鸠占鹊巢”，借助[FNG.GetLeader]训练一支北洋少壮派部队为皖系所用，但未能料到直皖战争中皖系的覆灭。直皖战争后，也正是杨宇霆从中斡旋，将大批皖系相关人士带到了[FNG.GetName]。正因如此，多疑的[FNG.GetLeader]实际上并不信任这位“大管家”，只是出于利用的目的才暂时地宠信于他。随着杨宇霆的利用价值逐渐消失，适逢第三次直奉战争中杨宇霆败给了直系，[FNG.GetLeader]旋即将他架空，虽然明面上封他作总参议，但手下仅控制着兵工厂守备部队，失去了联合皖系势力，威胁[FNG.GetLeader]统治的能力。\n\n但正是如此，他才成为了我们的合作人选。在和杨宇霆私下接触后，他很乐意和我们建立“更进一步的互信关系”，但是我们首先要做的是确保他在[FNG.GetName]内部的立足，就如我们之前的调查结果那样，杨宇霆本人由于长期边缘化，在军队中实际号召力很小，我们必须从这里着手，打造一位新的“大帅”。"
  JAP_pnr_event.11.a: "到头来还是皖系靠得住。"
  JAP_pnr_event.12.t: "地方主义情绪反扑"
  JAP_pnr_event.12.desc: "地方主义势力“东北党”先前在我们的打击之下已经基本销声匿迹，但如今却突然又有死灰复燃之势。以幽灵的形式，今天早上有警察报告说在街上看到了反对[FNG.GetLeader]南下的标语，以及张贴在喧闹场所的传单，宣称[FNG.GetLeader]背叛了东北人民，“让父老乡亲为了他个人称王的梦想而流血牺牲”。这无疑对政府的信用造成了打击，也削弱了社会对[FNG.GetLeader]发动复国战争的支持。"
  JAP_pnr_event.12.a: "糟透了。"
  JAP_pnr_event.13.t: "社会支持复国战争"
  JAP_pnr_event.13.desc: "[FNG.GetLeader]提出要发动复国战争，光复全中国的倡议近日引得了社会的一致赞同，许多报纸都刊登了表扬我们政府的文章，偶尔也有一些民间团体自发地聚集，呼吁人们支援这场“正义之战”。国民沉浸在即将光复的喜悦中，我们的政府受到了几乎所有人的支持。"
  JAP_pnr_event.13.a: "我们众望所归！"
  JAP_pnr_event.14.t: "小火柴，大决心"
  JAP_pnr_event.14.desc: "一场漂亮的反击战！从1925年以来瑞典火柴托拉斯便大举向[FNG.GetNameDef]倾销火柴，并在接下来的几年内逐渐通过恶意降价和收买公司管理层的方式打击[FNG.GetAdjective]火柴。在邪恶的火柴帝国主义者伊瓦·克鲁格的计划下，瑞典人在几年内便侵占了长春和吉林等地的[FNG.GetAdjective]和[JAP.GetAdjective]火柴公司，并将其魔爪伸向了本土民族品牌的最后阵地奉天。\n\n在日本商业会议所和包括惠临火柴公司在内的几家的[FNG.GetAdjective]公司的合作下，大家组成了东北火柴同业组建联合会，以统一售价的策略抵制瑞典人的倾销。如今我们终于将瑞典火柴资本驱逐出了东北核心市场，这虽然是一场微不足道的，关于火柴行业的小小胜利，但它却是未来中日提携最终战胜白人帝国主义者的一个预兆。"
  JAP_pnr_event.14.a: "把洋货驱逐出去！"
  JAP_pnr_event.15.t: "陌生来电"
  JAP_pnr_event.15.desc: "夜色已深，屋里的所有人这几天为了确保行动准备万无一失便一直未曾休息，因此傍晚行动一开始后便都各个被睡神附体，昏死了过去。直到这阵震耳欲聋的电话铃声把大家都从睡梦之中震醒。上田三郎把手抽到桌上，一把拍住了话筒，怀着被搅扰好梦的巨大愤怒捏起了电话。仿佛就是个恶作剧电话一样，那头并没有声音传来。\n\n“混蛋！”他骂了一声，缓慢又清晰，发音和东京方言差不了多少。没想到那边突然也回应他骂了一声。“你们这些混蛋！你们怎么能这样对待帝国军人！”电话那头的声音委屈又暴躁，“爆炸和你们一样的报国军人坐的车子。呸！实在是太无情了！”\n\n“少佐，很高兴听到你没事，”上田一边口头敷衍着他，一边大拍桌子示意会议室里的其他人也赶紧打起精神，“我也没想到会发生这种事情，由于这任务是高度机密的，所以连你也不能提前通知就是了。”他抓着电话机走到了墙边，那里贴着$SHD_zhang_zongchang$的五辆铁甲专列的路线，而目标当初征用了其中的两辆，因此他肯定在其中之一上，至于这个电话——证明所有人都赌对了。“说真的，我在今天晚上一直一直没睡着觉，一直在为你默默祈祷，希望你不要有事，感谢上苍，如今看来神佛确实庇护了你。那么，他怎么样呢？”\n\n电话那头沉默了一会儿，随后对方的声音突然压得很低，但每个字都很清楚。"
  JAP_pnr_event.15.a: "“肯定死翘翘了，他直接从我身边飞出去了。”"
  JAP_pnr_event.16.t: "寄给某人的信件"
  JAP_pnr_event.16.desc: "久疏问候，一向可好？仁兄调职后，我一直惦记你的去向，在政府公报上也见不到你的消息。关于我在中央部名声不好这件事也不需要进行什么辩解。对于小人们的恶评和上司的胡乱批评，我有相当经验，已经不太在意了。最近中国战局虽趋活跃，但直奉之战况并无太大进展。于此现状下，尚难预断奉张之或没落或强盛。我正以一日千秋之心情，翘首以待该方面之喜讯。\n\n然而[FNG.GetNameDef]的现状是，[FNG.GetLeader]越来越蛮横，面对这种情况，实难容忍。而其原因，日本军阀不无过于助长他们傲慢之嫌。问题的解决，靠讲理谁也办不到，给点小恩小惠也不行。除武力之外，别无他途。不过使用武力也要选择名义和旗帜，这是很重要的。于是乎，只要稍有借口，就要当头一棒，以根本改变他们的对日观念。\n\n张之横暴，难以言喻。那些幻想施恩图报的日本人是用心良苦的老好人。零打碎敲，头痛医头、脚痛医脚不行。这次如果不以清算二十年来总帐之决心来对待，[FNG.GetAdjective]问题就不可能得到根本解决。\n\n死他一两个$FNG_zhang_zuolin$有什么了不起！这次一定要干！即使受到阻止，无论如何也要干！司令部那些人，独断专行，不和别人商量，别人只能遵守其规定、服从其命令，什么都不告诉我。我也喜欢动乱。而且无论什么问题都需要制造个借口，去年，前年，都很想干，但未能如愿。今年一定要达到目的！以后流放到什么地方去，或被解职，我都不在乎。后事就托付给仁兄你了。\n\n我想这次一定要抓住这一大好机会，"
  JAP_pnr_event.16.a: "在东北搞得血肉横飞，"
  JAP_pnr_event.16.b: "相信这是根本解决方针。"
  JAP_pnr_event.17.t: "满铁异动"
  JAP_pnr_event.17.desc: "[FNG.GetName]最近出了件大新闻，[FNG.GetLeader]公开宣称他决心南下再次发动直奉战争。随后东京株式取引所也出了件大新闻，长期以来在市面上受到各路投资者追捧的南满铁道株式会社股票罕见地遭遇了大量抛售。\n\n自1906年满铁成立以来，作为“国策会社”（即政府控制的，基于特殊法律建立的企业）的该公司就以每年6%的高额底线分红成为了市场上最炙手可热的股票：1906年满铁第一次向民间开放募集时，最终实际申请认购的金额超出计划面额数百倍，在随后三十年中的多次增加资本金总额的过程里，满铁股票每次都被迅速疯抢一空。就是这样一支几乎可以称得上是超大将级的股票却在昨天被大量抛售到市场上。\n\n一些关系人士称抛售者是日本生命保险，他们在谨慎评估满铁的业务能力和中华地区的政治局势之后选择减持满铁。然而这次抛售除了一些流言外并未引发更多恐慌，市场上的满铁股票几乎立刻就被其他人认购，人们依然相信，满铁将会继续延续下去它事业上的辉煌。"
  JAP_pnr_event.17.a: "我真受不了了。"
  JAP_pnr_normal.1.t: "步兵进一"
  JAP_pnr_normal.1.desc: "大叔收，中央委员会的意思，已经过麻里转达给了我，我想其它的细胞如今也收到了中央的指令。在去年发生了那种间谍渗透事件，使得青山和伊万，以及执行抢劫的同志们被逮捕。故而中央要求发动再登记运动以排查党内叛徒这一点，我们是完全支持的。然而在这段时间里，我们听说有一些诚实的同志只是诚恳地批判了自己的弱点和不足，就被中央认为不可信，要求“从头再来”；在再登记期间，一些参与了运动的同志却离奇地遭到逮捕，这些事情无疑是令我们震惊。我们认为，这一系列实施再登记的方式除了损害了党的权威，更令同志们对党不安。中央当前的路线也使各党部感到迟疑——我们认为，党的资金决不能再通过家屋资金局和“战斗的技术团”，特别是通过违法且暴力的行为来获取。盲目的暴动既难以得到广大日本群众的支持，也只会招致反动的日本政府对党的细胞与赤旗本身的疯狂绞杀。对同志们的大搜捕难道不就是因为如今中央采取如此暴力且激进的手段才引发的吗？\n\n正是这种极左主义导致了党的孤立化、宗派化。有一些同志已经在怀疑，在发生间谍事件之后发动各地党员的再登记运动以及逮捕风波，要是是因为中央委员会里有间谍就糟了。我们认为，党的形态本身，必须进行必要的，深刻的反省，党的口号和宗旨，已经被孤立于群众要求的浓厚教条化所支配。我们批评中央委员会，我们认为中央陷入了宗派性的唯我独尊主义，机关中心的街头主义，盲目的暴动主义，形式上的官僚主义。我们要求现在这个浮在空中的中央立刻回到群众之中，不要再延续前委员长遗留下来的路线，要与群众紧密地结合在一起，就这一点，目前中央既没有意识到，也完全没有实践。我们这些群众中的党员，我们这些与中央相对的“地方”，我们也已收到了野坂参三主席从[CHI.GetName]的来信，我们绝不会接受这个受到了中央蛊惑而下达的命令，我们绝不会解散。为了所有人团结在一面赤旗之下。\n\n我们将切断和充满了流氓官僚的中央的联系。"
  JAP_pnr_normal.1.a: "切断和这些热衷于破坏党的挑拨离间者的联系。"
  JAP_pnr_normal.1.b: "切断和自称中央委员会的流氓分子的联系。"
  JAP_pnr_normal.2.t: "新的中央委员"
  JAP_pnr_normal.2.desc: "为寻求具有大众性的实践运动前进，而非在中央的指示下进行宗派性的自我毁灭，本着这样的想法宫内勇、山本秋和相马胜义才领导了日本共产党内的多数派运动，并且很快得到了几乎是所有日共地方支部的响应——所有人都已经无法忍受党中央为实现“共产主义的觉醒”而根据《1932年提纲》采取的暴力行为和恐怖革命了。\n\n尽管说下了那样的话，即便是留下了“收到了在[CHI.GetName]的野坂参三主席的命令也绝不会解散！”这样的豪言壮语，但实际上只是凭一时的冲动做出的，只是灵魂和身体都在说“这样不对！”所以才顺从了直觉，回应了它的呼声。事实上多数派的大家如今对运动将去往何方相当茫然。\n\n由于与法国总部联系的切断，一些先前相当坚定的党员又开始自我怀疑起“多数派”运动的正当性，这无疑使运动日渐衰弱下去。多数派的旗手们不得不找到另一个有威望的人来统合起整个运动。\n\n然而放眼整个日本，除了位于北海道的日共中央之外，谁还有这样的威望？本着争取“多数”的根本原则，三位临时领袖在长久交谈之后决定采取“加入战术”，他们首先联系了从事妓女解放运动，和社会大众党关系密切的南喜一，此人曾是日本共产党的重要人物，在田中清玄控制共产党时组成了“解党派”，认为应当停止极左暴力行为，转向合法的大众斗争，他的行为被党中央称为“叛徒”。但多数派们相信“解党派”不过是比自己更早意识到错误的老前辈，而且南喜一的出身与资历足够，正可以作为多数派的“新中央委员”统合整个运动。\n\n在经过紧张商谈之后，三人推举南喜一为“新的中央委员”，随后南喜一宣布日本共产党（多数派）就此解散，并将相关人员引荐给社会大众党左派。三位领袖在另立的党内新刊《多数》上除了宣布解散之外，还号召全体运动的支持者加入到包括社会大众党在内的一切合法的群众团体、群众政党中去，以促成日本左翼群众的大团结和统一阵线。尽管$JAP_pnr_kato_kanju$的$JAP_pnr_syndicalist_party$是议会中的合法政党，但其实力太过弱小，只适合联合而不适合加入。在和山本宣治与麻生久进行了长久的会谈之后，多数派正式加入了社会大众党左派——名义上多数派运动已经解散。\n\n长期非法的共产党组织解散和公开加入行为自然在政府内引发了一场骚乱，但在了解前因后果，特别是了解到这些人已宣布放弃“暴力袭击”和“推翻天皇制”之后，这场骚乱便很快平息。"
  JAP_pnr_normal.2.a: "我想我们大概走在对的道路上。"
  JAP_pnr_normal.2.b: "只要不反对国体，马克思也无所谓。"
  JAP_pnr_normal.3.t: "1936年日本众议院大选"
  JAP_pnr_normal.3.desc: "随着关于《国家保安法》的争执终于告一段落，无论本届内阁是认为他们在当下胜券在握，还是受到了外部压力认为此时已经进入到了不得不解散的关头，[JAP.GetLeader]都在今天早上众议院开会前宣布将解散重新举行议员选举。\n\n解散消息并未激起太多波澜，不论是社会媒体还是各大在野党派都已经预料到随着关于《国家保安法》的相关事务结束，众议院解散和内阁总辞职总会来一个——并且大概率会是前者。一些较为乐观的媒体甚至将此次议员选举称为“扫清选举”，认为这次选举结束之后的众议院议员们届时将会走入即将竣工的新国会议事堂，而地点和议员面貌上的一新必然能带来政治世界的新风。\n\n当然一些长期以来唱衰日本政治前景的媒体则认为这次选举什么都不会改变，帝国议会依然会维持僵局状态。其中一些评论家认为各党派之间应该各退一步，发扬1927年“护宪联盟”的精神来达成某种提携，形成“国民的全部联盟”。而一些更激进的声音则呼吁，如果这次议会中依然没有绝对多数党，则应该让一位超越于各党派之外的人物担任首相，博取各党人物组成全新的内阁。总之如今各党派的党务系统都已催动他们的宣传机器开始进入全速工作状态，从东京到最偏远的东北农村都出现了各政党准备的临时演讲台。"
  JAP_pnr_normal.3.a: "增强警备！开始1936年选战！"
  JAP_pnr_normal.3.b: "就让我们开始运用《国家保安法》吧。"
  JAP_pnr_normal.4.t: "1936年第一次选举结果"
  JAP_pnr_normal.4.desc: "随着投票日的到来，这场持续四十天的选战在今天晚上八点正式落下帷幕。虽然在投票日之前留给各党派的宣传时间里偶有冲突发生，但总体来说各大党派之间仍维持了基本的体面。根据《普通选举法》，计票将在投票日的第二天才正式开始。这一设计显然有着极为现实的考量，农村地区、偏远岛屿与山区的票箱比起一臂之遥的东京票箱来说更可能在运达中心计票点之前遭遇意外。\n\n幸运的是今年的选举没人打票箱的主意了，在开票监票人的陪同下，计票点管理人员已经在统计各党派收获的票数，待到计票结束，其结果令所有人感到意外。"
  JAP_pnr_normal.4.a: "民意如此，岂能违背？"
  JAP_pnr_normal.4.seiyukai_tt: "根据1936年选举结果，$JAP_pnr_social_conservative_party$将成为执政党"
  JAP_pnr_normal.4.national_populist_tt: "根据1936年选举结果，$JAP_pnr_national_populist_party$将成为执政党"
  JAP_pnr_normal.4.authoritarian_democrat_tt: "根据1936年选举结果，$JAP_pnr_authoritarian_democrat_party$将成为执政党"
  JAP_pnr_normal.4.social_democrat_tt: "根据1936年选举结果，$JAP_pnr_social_democrat_party$将成为执政党"
  JAP_pnr_normal.4.social_liberal_tt: "根据1936年选举结果，$JAP_pnr_social_liberal_party$将成为执政党"
  JAP_pnr_normal.4.market_liberal_tt: "根据1936年选举结果，$JAP_pnr_market_liberal_party$将成为执政党"
  JAP_pnr_normal.4.special_tt: "1936年选举中依然没有多数政党。"
  JAP_pnr_normal.5.t: "谁来战斗？"
  JAP_pnr_normal.5.desc: "东京帝国大学“新人会”前成员，日本共产党的创党元老之一，社会大众党的前成员，如今$JAP_pnr_national_populist_party$的党首赤松克麿在今天于东京组织了一场竞选演讲，除了党派本身的施政承诺之外，演讲中还包含了对当下的“红色阴谋”的批评：\n\n诸君！自欧洲世界大战之后激发的所谓工团思想而觉醒的无产阶级战斗的前卫分子，在日本则展现为了另一种可耻的恐怖主义的面貌！这些手持神圣经典的教条主义者既没有分析我国资本主义的发展过程——更遑论我国并非资本主义社会——也不理解普遍的劳动大众的心理。诸君！请看看所谓“战斗的前卫分子”的真面目吧：在高举着解放大旗的情况下，在国家最困难的时刻煽动罢工，无法体悟国家和资本业者的难处，一味地要求工资和待遇的提高；更有甚者煽动恐慌，用所谓革命掩饰自己暗杀、勒索与抢劫的勾当。\n\n这些幼稚的神经衰弱者，信条的盲目遵奉者，不能以科学的精神和客观的视角分析我国的现实条件，便被所谓欧洲的“革命家们”教唆，在所谓社会即将崩溃的幻觉下一个劲地前进。请回忆吧！从最可耻的诱拐和抢劫案，到更温和的罢工运动，我没有看到社会本身的崩溃，我看到的是左翼分子在我们中间迫使社会崩溃。为了保护社会，保护我们一贯平稳的生活，是时候和他们斗争了，是时候夺回真正的社会主义了，有志向的诸君，我们一道结束亡国的左翼分子对国家的荼毒，让真正普遍大众的幸福，让真正科学的社会主义得以在世间实现，这是作为各位国民之总代表，我赤松克麿的首要任务。\n\n赤松克麿的此次公开演讲引发了许多左翼团体的猛烈抨击，他们称其为“工人阶级的叛徒”和“社会主义的骑劫者”。稍晚些时候$JAP_pnr_national_populist_party$的演讲现场遭到了工人团体的冲击。"
  JAP_pnr_normal.5.a: "我们将追随真正科学的社会主义！"
  JAP_pnr_normal.6.t: "我们代表了大众"
  JAP_pnr_normal.6.desc: "谁能想到在过去仅有个位数席位的社会大众党在今天竟能发展到此等雄伟规模，作为议会中的第三大党与立宪政友会和立宪民政党正面交锋。在田中义一大将借助《治安维持法》大肆破坏日本的结社自由的时候，大多数左翼政党都在这无情的风暴之中被扣上“工团主义者”的帽子随之凋零了。在左翼运动来到了生死存亡的关头时，仅存的三个合法左翼无产阶级政党：全国大众党、劳农党和社会民众党选择合并以团结力量，避免被田中大将的统治各个击破。\n\n随着田中义一内阁的倒台，社会大众党也终于渡过暗夜，迎来属于它的黎明。尽管在此期间发生了一些不甚乐观的事件，但这个左翼联盟政党依然在向前迈进。如今的社会大众党内部由委员长，基督教社会主义者安部矶雄统帅，他的副手是东京大学“新人会”前成员，秘书长麻生久，二人分别是原先社会民众党和劳农党的党首，因此他们虽然在社会大众党内部有着名义上的主副之分，但实际上则是在共享着对党内的权力。\n\n在本次竞选演讲上，安部矶雄首先重复了社会大众党一贯的温和态度：反对资本主义，反对暴力的社会主义（在大多数情况下，这指的是布尔什维克主义和战斗工团主义）以及反对国家民粹主义。安部委员长在演讲的结尾继续宣称将通过温和且合法的方式继续在议会之中促进“大众的福利伸张”，而麻生秘书长则主要谈到了社会各阶层之间的广泛联合，特别是以当前有力量和权力的组织组成“先驱者”以引导并塑造社会走向对应的方向。尽管二人所代表的党派暂时团结在同一个党内，但彼此之间的路线分歧依然难以被忽视。"
  JAP_pnr_normal.6.a: "很有趣，但权力分散不一定是好事。"
  JAP_pnr_normal.7.t: "我们应该承诺什么"
  JAP_pnr_normal.7.desc: "短命的“宪政联盟”在击败田中义一之后也迅速走向了分裂，宪政会最终未能在帝国议会中击败彼时因完成宪政恢复壮举而风光一时的政友会总裁$JAP_pnr_inukai_tsuyoshi$，现在回顾当初的错误或许是急于打造能站在前台的“宪政之神”而最终招致了宪政会的落败。在那之后，$JAP_pnr_social_conservative_party$很快吸纳了因田中义一隐退而陷入混乱的政友本党，而宪政会则改组为了立宪民政党，他们将自己的目光放在了当时迅速崛起的城市居民身上，主张“团结新兴力量，成为主导未来十年的强大力量”。\n\n但历史总会首先说出答案，在过去十年里，$JAP_pnr_inukai_tsuyoshi$的统治屹立不倒。这也是$JAP_pnr_market_liberal_party$本次党内大会的主题：$JAP_pnr_hamaguchi_osachi$就为什么在过去十年中持续遭到$JAP_pnr_social_conservative_party$压制而做了总结，他认为这是由于$JAP_pnr_social_conservative_party$本身的“明星效应”和国民的政治惯性所致。而随着$JAP_pnr_inukai_tsuyoshi$之死——阴险地说，$JAP_pnr_market_liberal_party$再一次获得了与其同台对抗的机会。在本次大会的最后，$JAP_pnr_hamaguchi_osachi$对未来几十天内要进行宣讲的基本承诺作了简短的叙述，首先要牢牢抓住各大城市地区居民的选票，向他们承诺要解决社会不安的“扫净”，城市教育的拓展，手工业和独立从业者的救助与包括农产品宏观价格调控在内的城市居民焦虑的问题。\n\n$JAP_pnr_market_liberal_party$自改组之后便维持着全党一致原则，总裁的命令即是党路线的方向，$JAP_pnr_hamaguchi_osachi$的权威不容质疑。"
  JAP_pnr_normal.7.a: "$JAP_pnr_hamaguchi_osachi$是对的。"
  JAP_pnr_normal.8.t: "悬峙议会的未来"
  JAP_pnr_normal.8.desc: "$JAP_pnr_adachi_kenzo$回望自己过去的人生，就算是为刺杀闵妃出谋划策的时候都没有这般费力气。$JAP_pnr_authoritarian_democrat_party$最初只是自己为了通过组建新党来激发$JAP_pnr_market_liberal_party$和$JAP_pnr_social_conservative_party$内的危机，从而迫使他们重新联合成“宪政联盟”这一联合政府形式，打破悬峙议会的一件工具，然而事与愿违，这一跨党派的合作联盟最终未能实现。而$JAP_pnr_authoritarian_democrat_party$内部也因此顿时分裂为了两派，即主张既然逼迫失败，就该解散重返$JAP_pnr_market_liberal_party$的，发动“回归本部运动”的山道襄一；以及主张既然现实证明旧两党拒绝变革，就该由$JAP_pnr_authoritarian_democrat_party$推进政治进化的，要求“自立新党”的中野正刚，两派的冲突瞬间撕裂了这个本来就是权宜之计的暂时政党。从主张重点关注农村问题，与农业恐怖分子橘孝三郎私交甚笃的风见章到鼓吹要向萨文科夫、莫斯利甚至是墨索里尼学习，在日本组建强力政府的杉浦武雄，党内成员各行其是，不受丝毫管辖。$JAP_pnr_adachi_kenzo$就这样坐在了无人信服的宝座上，作为党首挥舞着毫无统治力的指挥棒。\n\n或许最幸运的就是到准备选举的时候，主张“回归本部”的党员为了在选举中做出一些成绩，证明自己对$JAP_pnr_market_liberal_party$有着足够的价值，正紧锣密鼓地筹备着选举；而主张“自立新党”的成员中野正刚则更是对选举活动极为上心，他发动自己在《东京朝日新闻》担任记者时期的人脉，自作主张地在报纸上发动了近乎洗脑式的宣传攻势，$JAP_pnr_authoritarian_democrat_party$“本部”提出三大竞选纲领：首先是检讨自《上海条约》之后形成的国际秩序，日本将成为带动世界观念变革的先锋力量，组建强大的亚洲联盟；而后是正确运用名为国家的强力装置来摧灭剥削，促进收入再分配并帮扶中小企业和农业合理化；最后是进一步推进民主化，实现国民大众积极参与政治生活的正义社会。\n\n这些承诺从未和$JAP_pnr_adachi_kenzo$甚至是其它党员商讨过，不过大多数党员只要走上街头听到有人在谈论$JAP_pnr_authoritarian_democrat_party$，对中野正刚的怨气也瞬间消散了。"
  JAP_pnr_normal.8.a: "强有力的国家之手会解决所有问题，包括承诺本身。"
  JAP_pnr_normal.9.t: "回溯本心"
  JAP_pnr_normal.9.desc: "$JAP_pnr_social_conservative_party$很快就从失去了$JAP_pnr_inukai_tsuyoshi$的阴影中走了出来，老实说，这对$JAP_pnr_social_conservative_party$造成的影响远不及原敬被刺杀要大。随着宣传机器正式启动，党内各大派系也已经放下分歧，共同对外。与其它党派不同的是，他们立刻开始着手炒作“$JAP_pnr_inukai_tsuyoshi$的遗产”，诸多$JAP_pnr_social_conservative_party$候选人都以此作为自己演讲的题目，其内容也是同样地通过回顾$JAP_pnr_inukai_tsuyoshi$从1926年宪政恢复至今的执政历史，达成的执政成就来试图向选民们暗示即便失去了这位昔日的掌舵人，$JAP_pnr_social_conservative_party$也是他们最好的选择。\n\n但在讲述昔日的荣耀之外，$JAP_pnr_social_conservative_party$拿出的竞选纲领则延续了他们一贯的传统：基本毫无变化。党内长老们依然维持着一贯的保守主义立场：即一边推行较为温和的农业问题解决方案，一边扩大农村地区公共事业的投入，以及呼吁选民们用手中的选票巩固政党内阁。在这些竞选承诺之中最激进的莫过于继续推进扩大市町村基层组织的权力，以及承诺将推进府县知事公选来防止中央政府通过官选地方官来影响地方政策。作为一个保守政党来说，提出这种计划已属于$JAP_pnr_social_conservative_party$最激进的承诺了。\n\n而$JAP_pnr_social_conservative_party$对选举本身如此糊弄自然有他们的原因，在演讲之外，党务机器正在疯狂喷吐着钞票，流向各大选区负责组织选举的头人的皮包，这一通过利益交换的买票战术虽然已在1928年普选后的选举中越来越失去其价值，但$JAP_pnr_social_conservative_party$显然产生了路径依赖。毫无疑问，$JAP_pnr_social_conservative_party$希望通过继续推行保守主义政策来吸引那些渴望政权稳定可靠的选民的支持，再借助金钱收买一批立场不坚定的摇摆票，但在如今该竞选策略是否奏效或许只能等计票结束后才能知道了。"
  JAP_pnr_normal.9.a: "或许我们可以再相信一次……"
  JAP_pnr_normal.10.t: "大陆干涉"
  JAP_pnr_normal.10.desc: "[JAP.GetName]与中华彼此的命运自数千年前就交织在了一起。公元57年，奴国使臣从日本岛出发前往河南洛阳觐见后汉光武帝，皇帝赐予其一枚印章和一条绶带，这被认为是中日关系之间的开端。然而时过境迁，昔日的宗主如今陷于衰弱分裂之中，而[JAP.GetName]却已成为世界列强之一。从未有比现在更好的时机维持一个分裂而不统一的大陆，一个联而不合的诸邦。\n\n日本的大陆干涉政策基于一条根本性原则：维持大陆的均势，并假如在中国展现出统一的迹象时，移动桌上的棋子（[FNG.GetName]与其它合作者）将其击溃。然而这一原则存在着根本性的悖论，[FNG.GetName]并非对东京言听计从，[FNG.GetLeader]就和十年前一样，始终有着入主中央，统一中国的愿望，这使得他难以被我们操控。为此[JAP.GetName]必须在接下来的冲突中或寻找潜在的合作者，或通过冲突巧妙地将大陆局势导向对自己有利的状态。本次解锁的大陆干涉决议$JAP_pnr_shanghai_strike_category$便是一个教学性决议组，随着事件的一步步深入，[JAP.GetName]能够把[ANQ.GetName]争取到自己的一方。我们将在之后大陆上发生的许多冲突事件中大显身手，在幕后轻轻勾动傀儡丝线并谋取利益。\n\n然而挑战依然存在，我们在亚洲的最大对手[GEA.GetName]将随着我们逐渐涉入更多大陆上的冲突而对我们提高警惕，他们将随着时间推移逐步升级与我们之间的冲突——直至全面开战。我们必须借助决议和事件巧妙地维持冲突烈度在较低等级，令柏林误判远东不会发生大规模冲突，以避免[GEA.GetName]获得增援。"
  JAP_pnr_normal.10.a: "我大概明白了。"
  JAP_pnr_normal.11.t: "圣上陛下亲临，陆军演习堂堂开幕！"
  JAP_pnr_normal.11.desc: "【信越地方专电】承蒙浩荡之天恩，今日正值严寒将终，早春初显之清爽佳日。圣上陛下为亲自统监在信浓川流域附近所举办之特别演习，特由东京亲临演习现场。黎明破晓时分，陛下骑白马驾临统监部。大元帅之威光赫赫，随即对两军之作战地带展开御览。\n\n迎接圣驾的我精锐陆军将兵，无不激荡着忠勇义烈之气魄，布阵于漫山遍野。今日的演习之中，面对设想敌北军于河流对侧布置之防御阵线，我南军各师团师团敢于从西侧发动果断决然之大突击，隐秘渡河并击破其西部防线，策应已在外围假想之港口城市中驻军发动闪电急袭。\n\n在各位将士团结一心的紧密协同下，一举粉碎了敌军的坚固阵地。其迅速果敢之进击，实向天下彰显了“帝国军人无可匹敌”之威容。沿途之中，数万帝国子民为瞻仰圣驾而肃立平伏，齐声高呼“万岁”以祝圣寿无疆，欢呼声响彻山谷。本次演习预计将持续数日，必将再次证实我帝国国防之完美卓越。"
  JAP_pnr_normal.11.a: " 这么看来今年也不需要增加军费了。"
  JAP_pnr_normal.11.b: "战争贩子去死，税金小偷去死。（好戦的な戦争屋は死ね，税金泥棒は死ね）"
  JAP_pnr_normal.12.t: "北国之春"
  JAP_pnr_normal.12.desc: "大门突然吱呀一声地被推开了，阳光卷着冷气冲入了这个小屋，把$JAP_pnr_hakamada_satomi$吓得停下了手里编项圈的活计。党的运作需要经费，自从开始间谍整肃和“再登记”运动之后，“家屋资金局”已经接近瘫痪，同情者的汇款也为了避免被政府追踪到而切断，因为“多数派”将$JAP_pnr_hakamada_satomi$的样貌和走路姿势全部发表在他们分裂的“党报”《多数》上，袴田立刻带着党中央转移到了北海道。如今的党只依靠着这位“最后的委员长”编项圈和其它几名党员工作的工资来维持着运作。“若松，你吓到我了。”在看清来者是党内的元老，自己的战友若松龄之后，他才放下心来，“你已经把《赤旗》都发完了吗？”\n\n“是的，实际上还有些不够，我想我要再抄写一些。”她把门带上。“如果你是担心那些到处散播你长相和行走姿势，说我们是“间谍党中央”的多数派，”若松龄把大衣挂在墙上，“我有个大概是好消息的消息：多数派大张旗鼓地解散了，闹到了登报的地步，现在再也没有多数派了。顺带一提，他们已经帮你把日本共产党一起解散了，中央委员长。”看着眼前的男人陷入沉默，她一边向里屋走去，一边背诵起自己在报纸上看到的宣言：“我们没有清醒地看到广大群众摆脱偏见的幻影，党内根深蒂固的宗派主义对共产党形象的破坏，使它与广大人民之间产生了障碍。我们首先宣布对[JAP.GetAdjective]宪法的完全拥护，我们其次主张和平且合法地发声，我们最后宣布解散，真正走进广大人民群众中——”“间谍！叛徒！革命的懦夫！全都是叛徒和间谍！大泉兼藏！饭塚盈延！小畑达夫！全他妈是间谍，是运动的破坏者，现在还连名字都要夺走。在押送路上夺取锅山贞亲的计划是谁走漏的，哪些人知道这个消息！是谁背叛同志——‘光’，没有谷口的消息吗，她现在在哪儿……”\n\n“我们现在很安全，相信其他同志也很安全，”女人按住了他，试图平复他的情绪，“对你来说我不知道是好是坏，但总之——”她把那叠纸片递了过去，上面是用铅笔抄写的歪扭的“赤旗”两个字。\n\n“这是你的《赤旗》报。”"
  JAP_pnr_normal.12.a: "他捏着那脏兮兮的小纸片，石墨沾在了手指的茧子上。"
  JAP_pnr_normal.12.b: "他们为什么要内斗？"
  JAP_pnr_normal.13.t: "严酷的革命"
  JAP_pnr_normal.13.desc: "1924年田中义一大将颁布的《治安维持法》宣布了恐怖统治的开始，在对社会运动无情镇压的现实之下，许多有着激进思想的左翼组织都纷纷宣布放弃他们之前的诉求并支持政府，以换取在《治安维持法》下的安宁。然而主张布尔什维克主义的日本共产党是其中的少数，他们公开采取与政府敌对的态度，并“狂妄地”在他们所控制的各个农业和工人组织中都公开宣称要“废除天皇制”。这自然招致了田中义一大将对他们的打击。\n\n在一场严酷的大逮捕之后，日本共产党并未缓和自己的观点，而是在东京帝国大学“新人会”会员田中清玄的带领下开始了和政府之间的武装斗争，拉开了日本共产党成为暴力团体的序幕。在田中的指导之下，共产党员们建立了“革命技术部”，使用匕首、铁棍、长刀以及从[LEC.GetName]和[RUS.GetName]走私的机枪和手枪在街头展开了对警察的袭击。尽管田中义一已经倒台，但共产党依然维持着它的袭击惯性。\n\n正是在这个时期发生了第一次“多数派”运动，南喜一、水野成夫和神山茂夫等反对党内极左路线的人组成了“解党派”，宣布断绝和巴黎的联系，停止恐怖袭击，放弃废除君主制的口号。他们立刻被宣布为党内叛徒。1930年7月，田中清玄在参加工人大会后返回的路上被捕，有叛徒泄露了他的行踪，这预示着日本共产党进入了下一阶段。\n\n1930年，“巴黎艺术与科学之友人协会”——日本共产党在巴黎的总部——将索邦大学毕业生风间丈吉派遣至东京重建共产党，日本共产党也迎来了它史上最强大的时期，这一时期的日本共产党每月能获得六万日元的流动资金。在风间丈吉的指示下，原先的“革命技术部”被改组为“家屋资金局”，通过合法手段从社会各界吸纳那些同情者的捐款，通过非法手段敲诈勒索，甚至是抢劫银行来筹集革命资金。但在一场被党内叛徒出卖的抢劫之后，包括风间丈吉在内的许多党员被逮捕了，随后的营救行动也被泄露给警方，致使更多同志锒铛入狱。接手党内控制权的$JAP_pnr_hakamada_satomi$决心对党内进行清洗，以排除所有叛徒——他要求所有党员进行自我检讨并把所有个人信息都登记到党中央，这激起了许多早已对党内极左暴力路线不满的党员的愤怒，他们迅速结成“多数派”，反对袴田的“再登记运动”。如今$JAP_pnr_hakamada_satomi$控制的“日本共产党”不过是只有六人的一个小组，而群众，“多数”们已经站在了他的对立面。"
  JAP_pnr_normal.13.a: "原来如此。"
  JAP_pnr_normal.14.t: "闲话"
  JAP_pnr_normal.14.desc: "长期以来西园寺家都是从滩万（Nadaman）邀请派遣厨师来家中做菜的，而$JAP_pnr_saionji_kinmochi$这样亲自动身光临店里还是第一次。即便是所谓的星冈茶寮，若不是有北大路鲁山人这样难见一面的高傲主厨亲自烹饪，以及像是$JAP_pnr_fumimaro_konoe$这样他亲手带出来的学生促成此事，恐怕他也只会像往常那样不耐烦地摆摆手回绝，或是压根就不给出明确的答复，让对方尴尬地等一个晚上。\n\n“陆军里最近又人说了一些很让人不安的话。听说在军队之中，对前次陛下驾临的演习，士兵有许多牢骚。”$JAP_pnr_fumimaro_konoe$一边把那杯图堡啤酒推给$JAP_pnr_saionji_kinmochi$，一边汇报最近从各方听到的动向，“我还听到了这样的传闻，实在是不值一哂。有人说陛下‘平庸’，缺乏男子气概，又开始讲皇后殿下前几胎都是女儿，还认为皇太子殿下并非亲生……”\n\n“都是些老黄历——他们有没有新东西。哦？这个是——”“这是先用葛粉熬制汤底之后加入姜汁煮成的黄瓜汤，可谓是我随心灵感的自然之作，西园寺公爵。”\n\n看到$JAP_pnr_saionji_kinmochi$对这种陆军内的不安流言的兴致还没有一碗黄瓜汤高，$JAP_pnr_fumimaro_konoe$显得有些尴尬，他其实分不太清姜汁在这里的作用，所以也插不上话。不过另二人的交谈很快结束了：“军队对宫中很愤懑，认为有阴谋在策划。这是一向的，但我觉得这次很危险的一件事是，我听到了关于秩父宫亲王的事情，他的那个侍从西田税似乎很反感陛下打高尔夫这一点。”\n\n“我觉得确实不错，这烤豆腐是用鲣鱼片煮的，相当有想法。”\n\n“不知道是哪个陆军组织的，但秩父宫坐火车去其他地方的时候，有个陆军大佐进了火车，直接说要帮他登基。”\n\n$JAP_pnr_saionji_kinmochi$停下了手头的动作，那块芝麻酱拌过的贺茂茄子也这样卡在了碗底。“他答应了吗？”\n\n“他当然没有同意，我掌握的情况是这样。”\n\n八十岁的老者叹了口气，把筷子放在盘子边缘："
  JAP_pnr_normal.14.a: "在宫中，有很多事情值得担忧。"
  JAP_pnr_normal.14_tt: "§C帝国陆军内部的派系斗争正位于僵持状态，出任陆军大臣的§Y$JAP_pnr_hayashi_senjuro$§!夹在中间维持着微妙的平衡。在[JAP.GetAdjective]政局明晰下来，政府能够重新掌控陆军前打破其平衡恐怕会引发§R令人意外的结果§!。§!"
  JAP_pnr_normal.15.t: "昭和神圣会的阅兵"
  JAP_pnr_normal.15.desc: "一张有点尴尬的照片占据了今天早上新闻的头版。昭和神圣会的统管$JAP_pnr_onisaburo$今天在他的“大本教”核心地带举行了一场阅兵。而这张照片正是关于这场阅兵的。\n\n当时的具体情况是昭和青年团的成员站成一排等待$JAP_pnr_onisaburo$进行检阅，而这位“圣师”则在两辆挎斗摩托车，以及在空中巡游的“赤蜻蛉”飞机的护送下登场了：在两辆摩托车上都有各一名昭和神圣会成员手持会旗，而$JAP_pnr_onisaburo$本人则骑着白马缓缓移动检阅他的“圣骑士团”，当这位宗教家走过他们面前时，他们立刻扬起双手高喊“天皇万岁！”，而$JAP_pnr_onisaburo$则在白马上也举起握紧拳头的左手，高喊“天皇万岁！皇国日本万岁！”。\n\n这张戏剧性的“万岁照片”被出席这一检阅仪式的记者抓拍，一些批评家称这是大本教和昭和神圣会对天皇威严的赤裸裸践踏，然而昭和神圣会的另外两位关系人士，长期以来鼓吹天皇尊严不可侵犯的右翼巨头头山满和内田良平则并未急于划清界限，站出来抨击$JAP_pnr_onisaburo$的行为，恰恰相反，他们一直对这些针对$JAP_pnr_onisaburo$的批评保持沉默，甚至有传闻称内田良平在私下的酒会中把那些批评家称为“不通皇道，不知大本的过度反应者”。"
  JAP_pnr_normal.15.a: "真是岂有此理！他以为他是谁？天皇吗！"
  JAP_pnr_normal.15.b: "只是一贯地搏媒体眼球罢了……"
  JAP_pnr_normal.16.t: "最后的工人政党"
  JAP_pnr_normal.16.desc: "$JAP_pnr_syndicalist_party$的首脑$JAP_pnr_kato_kanju$在今天开始了他的竞选宣传。尽管他将自己的政党称为“帝国议会中最后的工人政党”，但这一方法也未能吸引到超出预期的关注。由于各种原因，工团主义者们在这个国家并不受到太多欢迎，就算是在帝国议会中他们也是边缘派系，这显然是由于两方面原因造成的：其一是宫中集团本身对这种“不安分的斗争左翼”的提防，其二则是他们本身的尴尬定位：较温和的选民们会选择支持社会大众党，而更激进的工人们之前已经采取行动，成为了日本共产党的战斗团的一员了。不出意外的话今年也可能维持帝国议会中的边缘小党不变。对此一些成员已经表达了不满，他们希望既然多年以来该党都未有起色，为了实现广泛工人运动的统一，干脆与社会大众党中的左翼合流……"
  JAP_pnr_normal.16.a: "老实说，他们的椅子已经有人了。"
  JAP_pnr_normal.17.t: "东京站"
  JAP_pnr_normal.17.desc: "平泉澄登上火车和雍仁对话。（只有在三次都宣布支持裕仁的情况下触发）"
  JAP_pnr_normal.17.a: "政治博弈可比犁式制动要难多了。"
  JAP_pnr_normal.18.t: "卓别林访问[JAP.GetName]"
  JAP_pnr_normal.18.desc: "活跃于[USA.GetName]的著名导演兼喜剧演员查理·卓别林近期访问我国。卓别林先生执导的讽刺喜剧电影《摩登时代》于今年2月在美国首映。该片讲述了那个对于各位观众来说无人不识的流浪汉在大萧条时期是如何在现代工业化世界中挣扎求生的。“黑色星期一”事件与该片的上映时间几乎同步，为其增添了一丝与当下现实对照的沉重。完成电影之后，卓别林先生便和本电影的女主角宝莲·高黛，他的银幕搭档——本报也同各国其他从业者一样，不清楚那位究竟算不算是卓别林夫人——开始了环球旅行，在抵达日本之前，卓别林先生暂时停留在[LEC.GetName]，尽管数百公里外[LEP.GetName]的骚乱仍在持续，但在我国驻扎在[LEC.GetName]的上海军的保护下可谓是安全无虞。\n\n宝莲·高黛女士目前暂留于[LEC.GetName]接受各家媒体采访，那位人人都认识的“无敌流浪汉”则乘船造访我国，四年之前卓别林先生在《城市之光》取得巨大成功后便来到我国参观，$JAP_pnr_inukai_tsuyoshi$前首相当时热情地接待了他，并向他展现了独属于亚洲的迷人一面，卓别林先生也用他的访谈忠实地证明1932年的[JAP.GetName]作为亚细亚模范国家的真实不虚。\n\n如今政府决定再次指派$JAP_pnr_inukai_tsuyoshi$前首相接待卓别林先生，相信一位老熟人能让他在日本度过一段舒心愉快，且依旧难忘的经历。"
  JAP_pnr_normal.18.a: "欢迎我们最可爱的西方朋友！"
  JAP_pnr_normal.18.b: "喜剧……舶来品……自由主义……日本堕落的根源……"
  JAP_pnr_normal.19.t: "去看相扑吗？"
  JAP_pnr_normal.19.desc: "其实没有什么变化，在过去当首相的十年里，每天的晚餐也是白米饭，渍物和醋渍青鳞小鲱鱼，还有偶尔出现的汤豆腐；当然现在不是首相了却还是没什么变化，早上头山先生托人给送来了一些点心，不过这也不是正餐。不过$JAP_pnr_inukai_takeru$可没得抱怨，毕竟自己的父亲可是吃得乐在其中，而且完全不觉得有什么要增添的必要。比起那位每天早上要吃麦片牛奶和法棍面包的元老来说，自己家更像是寻常庶民——\n\n“和喜剧之王度过的日子还愉快吗？”他喝了口味增汤，“这几天麻烦你去做了，$JAP_pnr_social_conservative_party$的那些家伙很开心吧，又增添了能大说特说的内容。”\n\n“我才想问您鼻子怎么样，医生有说什么吗？”讲到这里，$JAP_pnr_inukai_tsuyoshi$止不住地对他摆手：“还是老一套，做完检查就说很正常，能再活100年。完全是糊弄啊，去$JAP_pnr_social_conservative_party$当个干部吧。”看来宣布了“引退”的他倒是不介意在自己儿子这个$JAP_pnr_social_conservative_party$党员前说这种话。\n\n“无论如何他都想再和您见一面，”$JAP_pnr_inukai_takeru$托住下巴，“所以想知道您什么时候有空，5月14日，15日如何？我想可以订新喜乐的位置……”“我想在临走没什么事的时候再见吃个临别饭吧。你可以请他去两国国技馆看相扑，本月6日揭幕的话，15日正是西关胁双叶山对阵横纲玉锦，这可是亦师亦敌的一场精彩大战。”他夹起那根腌萝卜放在了米饭上，“如果错过就可惜了。而且带他去看相扑，对你个人还是别人很好的素材，至于和我吃饭则只能在不知道哪家花边报纸的版面上占一个小米粒的版面。”\n\n$JAP_pnr_inukai_takeru$还想说点什么，但是不知道什么时候，$JAP_pnr_inukai_tsuyoshi$已经伸出双手握紧了他的右手。"
  JAP_pnr_normal.19.a: "带他去两国国技馆看相扑，就交给你了。"
  JAP_pnr_normal.20.t: "社会催促我们尽快行动"
  JAP_pnr_normal.20.desc: "黑色星期一之后的日本经济处于可怕的低迷之中，许多报社评论家都将这次经济危机称为“第二次战后萧条”，并将其归咎于德意志帝国那充满危险的金融政策和作为军国主义国家无止境的贪婪。不过在最近几天，报纸上的攻击对象从[GER.GetName]悄悄变成了[JAP.GetLeader]，由于[JAP.GetLeader]内阁是在黑色星期一不久前才上台执政的，国民们虽然因恶化的经济形势而对现状颇有不满，但他们也清楚这对本届政府来说也是无妄之灾，人们相信内阁只是因为这一突发状况而陷入了暂时的混乱，而政府很快就会拿出应对措施来改善经济现状。\n\n不过时间证明他们似乎对[JAP.GetLeader]抱以错误的期待。截至目前，[JAP.GetLeader]及其内阁，特别是大藏大臣并未发布任何有关黑色星期一的救济政策，每当媒体问到政府是否制定了相关方案时，大藏省总是称相关问题正在研讨中并回避对该问题进行进一步回应。这使得民众怀疑本届政府实际上根本就无力应对这场经济危机，或者说，政府在故意忽视该问题。多家报社的社论都在质疑本届政府的执政水平：内阁并非陷入瘫痪，政府仍在除了经济领域外的各领域推动其相关工作。一些报纸讥讽[JAP.GetLeader]和其执政班底是“柜子内阁”，自认为只要关上柜子不去看就万事大吉。"
  JAP_pnr_normal.20.a: "这种民生大事急不得……"
  JAP_pnr_normal.20.b: "或许我们现在就应该行动了。"
  JAP_pnr_normal.21.t: "军队催促我们快速行动"
  JAP_pnr_normal.21.desc: "我们毫无起色的经济状态引得了军队势力的关切，这并不是一个好兆头……由于我们对处理当前一团乱麻的[JAP.GetAdjective]经济尚未拿出足够的成果，我们先前曾在社会上受到了一些民众的小小质疑。这一次轮到军队势力对我们提出疑问了。今天稍早些时候，陆军大臣和海军大臣一同拜访了[JAP.GetLeader]，向他传达了一些一半威胁一半提醒的话语：两位大臣都谈到最近军队中逐渐蔓延的躁动情绪，一些士兵称[JAP.GetLeader]的表现让人感觉“麻烦”。这种不满情绪可能会影响到本届政府的正常执政，甚至可能引发某些不必要的暴力事件。两位大臣称他们已经加强对异常士兵的思想教育与监视，但由于两军长期以来都饱受经费不足折磨之苦，他们没办法监视到每一个士兵。总而言之，现在军队中也开始滋生对本届内阁那不彻底的经济政策的不满情绪。在陆海军大臣临走之前，他们还向[JAP.GetLeader]传达说如果可以的话，希望[JAP.GetLeader]能考虑一下是否要为陆军和海军提供更多预算。"
  JAP_pnr_normal.21.a: "这是军队思想教育的问题，和我无关。"
  JAP_pnr_normal.21.b: "他们的建议是对的……"
  JAP_pnr_normal.22.t: "宫中逼迫[JAP.GetLeader]"
  JAP_pnr_normal.22.desc: "[JAP.GetAdjective]政府应对黑色星期一的政策取得了令人震惊的失败，在各大银行的经济学家看来，政府经济政策的失败在于缺乏一贯的目标，又或者说是缺乏将相关政策推行到底的勇气。在这种不彻底的应对政策中存在的便是几乎毫无变化的经济现状，国民对[JAP.GetLeader]那近乎于糊弄的黑色星期一应对政策陷入了失望和愤怒，他们强烈呼吁立刻罢免[JAP.GetLeader]。在这种艰难时局下，天皇陛下极为罕见地将[JAP.GetLeader]传召入宫觐见。尽管天皇和内阁总理大臣的对话原则上是保密的，但其它在野党很快就了解到天皇对本届内阁“极为失望”，并且似乎在听取了[JAP.GetLeader]的辩解之后，“毅然地转身离开了谒见间”。这一消息很快就被证实，今天中午[JAP.GetLeader]带领其内阁宣布了他们的黑色星期一政策——有消息称这是基于天皇的御沙汰所强制制定的。由此可见$JAP_pnr_paternal_autocrat_party$确实对本届领导班子失望透顶。"
  JAP_pnr_normal.22.a: "他们自作自受……"
  JAP_pnr_normal.22.a_tt: "§a在宫中的干涉下，我们被强制要求执行黑色星期一的特别经济政策，直到经济恢复正常。由于这不是我们自己作出的§Y财政选择§!，在危机结束后，我们不会得到§R任何增益§!§!。"
  JAP_pnr_normal.23.t: "台下接触"
  JAP_pnr_normal.23.desc: "初步选举的预测让人感到不安，尽管[JAP.GetRulingParty]因为未能完美处理上半年接踵而来的外部危机导致其政治信誉遭到极大打击，但《国家保安法》的通过还是狠狠地挽救了这辆即将冲向深渊的列车。但就像各大报纸一开始预测的那样，即便[JAP.GetRulingParty]有着《国家保安法》加持，他们在举行宣传演讲之后的民调也未能回到1936年初的高位，因此媒体们对他们的最终得票结果持悲观态度。\n\n同样持悲观态度的还有社会大众党的党务机关，他们敏锐地注意到加藤勘十的那新生的日本无产党在本次选举中吸引了诸多城市工人的关注。[JAP.GetRulingParty]的失败确实让大量选票流向了其他政党，但帝国议会中如此繁多的政党则直接稀释了大家所能分到的选票数量。\n\n社会大众党本自信满满，希冀于借助本次政治危机进军首相之位，但在日本无产党对社会大众党的分票攻势之下，似乎夺取议会中的绝对多数已成为了一个单纯的梦想。在选战压力之下，社会大众党内部对如何应对日本无产党也产生了分歧，一些人认为如果能作为终结“悬峙议会”的执政党进入众议院，不论是在宫中还是在社会上都会获得无以伦比的影响力，彼时推行各种政策也将水到渠成。为此即便是拉拢日本无产党，放松自己“三反纲领”中的“反社会主义”也无妨；另一些党员则认为这是原则问题，擅自让步可能会导致社会大众党腐化，甚至引发裂党危机。\n\n然而最终对社会声望的渴望战胜了原则，今天下午，社会大众党秘书长麻生久秘密会见了加藤勘十，两派对当下就是否组成左翼政党的联合进行了深入讨论。"
  JAP_pnr_normal.23.a: "麻生久说服了加藤勘十。"
  JAP_pnr_normal.23.a_tt: "§Y两党正式对外发表了联合声明，宣布将在选举结束后举行政党合并。届时将发生：§!\n§L-----------------------------------§!"
  JAP_pnr_normal.23.b: "战斗的工人们寸步不让。"
  JAP_pnr_normal.24.t: "“新人会”的情谊"
  JAP_pnr_normal.24.desc: "议员选举的本质是金钱和社会关系的相互较量。尽管1928年普选以及宪政恢复之后，社会各界对内务大臣操控选举和政党通过贿赂进行买票的选举舞弊操作日益厌恶，但除去这些不光彩的支出，举办演讲会，张贴传单甚至拜访选区选民都要付出难以想象的金额数字。更关键的是，这笔钱并不由政府负担，而是完全仰赖政党或独立候选人自行支出。\n\n国家社会主义党始建以来在第一次选举中只取得了2个席位，但在后来得到了一条实孝公爵和其他社会人士的赞助之后影响力则突飞猛进，初期民调统计中一些媒体甚至预测其能斩获众议院中近[?JAP_pnr_election_party_seats^10|0]个席位。然而国家社会主义党的崛起却引发了别的问题：它无力挑战“悬峙议会”，反而促成了“悬峙议会”的诞生。在这种僵局之下，赤松总裁寻求着外部助力，以实现他雄心勃勃的计划，他最终把目光落在了自己先前退出的党派：社会大众党上。\n\n同为东京帝国大学“新人会”出身，又是社会大众党（与前社会大众党）党员，麻生久和赤松克麿之间依然维持着密切的私人联系，现在正是团结所有力量击落立宪政友会和立宪民政党两大旧党，实现党派政治刷新的时刻。赤松总裁与麻生书记长进行了接触，而他们随后则相继颁布了声明——"
  JAP_pnr_normal.24.a: "社大党中左翼将和保守派割席。"
  JAP_pnr_normal.24.b: "国社党将重返社大党。"
  JAP_pnr_normal.24.c: "双方互称对方为叛徒。"
  JAP_pnr_normal.25.t: "归党派胜利？"
  JAP_pnr_normal.25.desc: "眼见初期民调已经出炉，国民同盟之中的“归党派”成员躁动不安起来：当然是由于立宪民政党弱点尽显。古老而强大的立宪民政党在社会压力下逐渐沦落凋零，新生的政党不断地挑战着它的霸权，这些认为1927年解党是个错误的成员立刻拔出长矛来攻击国民同盟宝座上的那位君主。\n\n一些人批评正是1927年的裂党导致了如今立宪民政党的衰弱，如今最好的选择是发表将在选举之后重新和立宪民政党合并的声明，用当下的团结去修复昔日的错误，从而谋求民权政党的延续。而不是放任那些自第一次西园寺内阁时期短暂放开管制之后，在今天彻底污染了民权派水源的，群魔乱舞的合法左翼政党与可疑的“左翼”政党控制帝国议会。\n\n与归党派针锋相对的便是中野正刚，他直截了当地在党内宣称，如果安达谦藏发表和立宪民政党之间重修旧好的声明，作为“国民同盟思想总裁”的他就要在选举结束后择日带着一干人等另立新党。此前选举局势一片大好的国民同盟再一次陷入了裂党危机……"
  JAP_pnr_normal.25.a: "安达总裁屈服于归党派。"
  JAP_pnr_normal.25.b: "国民同盟分裂了！"
  JAP_pnr_normal.26.t: "尘埃即将落定"
  JAP_pnr_normal.26.desc: "随着投票日的到来，这场持续四十天的选战在今天晚上八点正式落下帷幕。虽然在投票日之前留给各党派的宣传时间里偶有冲突发生，但总体来说各大党派之间仍维持了基本的体面。根据《普通选举法》，计票将在投票日的第二天甚至是第三天才正式开始。这一设计显然有着极为现实的考量，农村地区、偏远岛屿与山区的票箱比起一臂之遥的东京票箱来说更可能在运达中心计票点之前遭遇意外。\n\n在过去曾经发生过街头壮士甚至是政府自己为了操纵选举结果而袭击夺取票箱的情况，不过目前来看今年的情况则相当平安。一些媒体已经开始在报纸上刊登自己对选举结果的预测，另一些小报媒体则另辟蹊径，开始推荐起开票日最适合穿的衣服的颜色和享用的美食。但同时也有一些报人委婉地提到，由于这段时间的社会危机，参与投票的人数可能比预期的要少，而其结果也可能比看起来得要不可预料得多……"
  JAP_pnr_normal.26.a: "令人期待。"
  JAP_pnr_normal.26.b: "所以我要穿什么颜色？"
  JAP_pnr_normal.26_tt: "§G我们先前达成的选举联盟将结算……§!"
  JAP_pnr_normal.27.t: "重燃旧同盟？"
  JAP_pnr_normal.27.desc: "协力内阁的复兴？"
  JAP_pnr_normal.27.a: "两党总裁磋商之后决定了！"
  JAP_pnr_normal.27.b: "总裁们陷入了争执……"
  JAP_pnr_normal.28.t: "超然内阁的回归"
  JAP_pnr_normal.28.desc: "近卫组建新党。"
  JAP_pnr_normal.28.a: "事已至此，只能这样了。"
  JAP_pnr_normal.29.t: "舞弊"
  JAP_pnr_normal.29.desc: "在施行《普通选举法》，或者说在田中义一内阁以前，政党选举更多依赖于由地方士绅为代表的“头头”来为对应的政党进行拉票，从而帮助参选政党聚集选票。毫无疑问，拉票过程本身就浸透着可疑的金钱交易。然而田中义一大将的闪电夺权却让选举系统陷入瘫痪，借助地方士绅来干预选举已不再重要——田中义一的独裁统治之下，议会政治的有无根本无关紧要。而且田中义一本人更乐意借此理由打击议会中的党人，称他们为“日元贩子”并为自己的独裁统治攫取合法性。\n\n随着1926年宪政恢复和随后的《普通选举法》实施，尽管地方士绅们得以再次重操旧业，但实际上田中义一已经把此种买票等于恶行的印象打入了民众们的头脑之中，使得这些地方上的头面人物能从选举中号召到的选票数量有限，并且一定会为候选人带来相当负面的社会评价。\n\n虽然不想出此险棋，但如今$JAP_pnr_social_conservative_party$若想逆转选举大局，只能重操旧业了。在$JAP_pnr_suzuki_kisaburo$动员下，大量原本用于党务机关日常开支的资金被挪用于支援地方选举，$JAP_pnr_social_conservative_party$现在已被逼到绝境，为了取得胜利，他们甘愿用上一切能用上的计策。而他们的这一行为究竟是最终能通过士绅们为其聚集大量选票，令其扳倒议会中其它政党；还是被媒体们大加挞伐，反而竹篮打水一场空。其答案只能交给命运本身去裁断。"
  JAP_pnr_normal.29.a: "立宪政友会凭此逆转大局。"
  JAP_pnr_normal.29.b: "号外！立宪政友会选举舞弊！"
  JAP_pnr_normal.30.t: "马匹"
  JAP_pnr_normal.30.desc: "“有时候我觉得真是这样没错，”田边突然说，“我觉得中国马就是要比日本马好。”\n\n“您是怎么得出这个看法的呢？”木岛则倚在临时充作营房的民宅墙壁边上，一边写日记一边和田边大尉有一搭没一搭地聊着话，那条围在他脖子上的兔毛皮经过了几天的交战和进军之后已经逐渐变成土褐色——部队确实需要时间休整一下。\n\n“来了中国之后，我就愈发这样体会到了。我们带来的日本战马实在是非常优秀的马匹，可是一到打起仗来，一旦没法按时喂饲料的话，”他夹着烟，在那张床上翻了个身，“就立刻很虚弱地瘫软了，怎么鞭打也不起作用。而中国马就不一样了，和漂亮的日本马放在一起，矮墩墩的身体就更显得丑陋和愚蠢。但是却个个都是好样的，不管怎么去摔打，或者是饿上几天，都能保持战斗力，可以说立下了汗马功劳。木岛一等兵，你入伍前是医学学士吧，这是有什么医学道理吗？锻炼出来的？”\n\n“我觉得确实可能有这种情况，因为平素里受虐待而习惯了，所以不像日本马，到战场上反而更能适应，因为自己根本不知道受了虐待的缘故。”\n\n“哈！”田边又翻了个身，“所以啊那些混蛋小子们，因为这个事情就一点都不爱惜马，谁叫这些马的原主人都不爱惜呢。中国马倒下去就随手扔掉，丢到荒野之中，屁股上的那点肉都要让野狗啃干净了。我是非常爱马的人，我不是和你说过吗，1936年10月18日的中山纪念赛——小子，别写了，你是大医生，若是多杀中国人，拿一颗金鵄勋章回去，我不敢想你能讨到多好的老婆。\n\n“我知道，是克娄帕特拉·托马斯赢了。”他这样说。"
  JAP_pnr_normal.30.a: "野犬们咀嚼着战马的五脏六腑。"
  JAP_pnr_normal.31.t: "宗教的普适性"
  JAP_pnr_normal.31.desc: "井出是部队的随军传教使，至于认识他的缘由，则是田边大尉一边拉着他，一边给大家发“怀中佛号”。这家伙说话之前总要张牙舞爪，要驳斥人意见的时候，则要先拍一下自己那颗光亮的脑袋，起到惊堂木的作用，再发表自己的高论。\n\n一开始大家还对这个和尚抱有相当的戒心，并且认为随着战线的不断推进，带着这样一个累赘显然对战斗没有什么助力。直到这和尚在应战的时候，跟着田边大尉战斗的口令一起向前冲，拿着一把从地上倒伏的尸体身边的大刀，像砍西瓜一样“啪哧”一声把刀刃嵌进敌人脑袋里的时候，大家立刻就意识到，这样勇猛的随军传教使，恐怕是在许多部队都罕见的。\n\n一来二去大家自然熟络了起来，也知道了他是西本愿寺派的僧侣。“井出师傅，你这样杀敌勇猛的和尚，我实在是没有见过。每每见到你战后给亡者念经祷告的样子，就突然觉得你只是个和尚罢了。”\n\n“啊，那是这样的。呵呵。”“井出先生，”木岛一等兵用手肘戳了戳他，“你对敌军的阵亡者，即便没有聚拢，也替他们超度吗？”\n\n“我才不给敌人作超度呐！”他突然一挥手，在空中画了一个漂亮的半圆，“杀害我同胞的人，活着的敌人要杀，死了的作孤魂野鬼，作饿鬼游荡去吧。一想到他杀的是我的战友，我就心中可恨的不得了。”\n\n“我之前有听过宣传，”木岛对和尚这样说，“是大本教的宣传，他们说宗教是以无差别的普遍性为口号，而最终未能实现无差别的普遍性的东西。今天听了你这番话我想他们即便是“妖教”，但也说得不错，宗教超越国界的话，果真是假话。我想如果要找一个能让全世界人都接受的普遍概念的话，果然还是要把宗教从其中拿走。”\n\n木岛说出这话的时候有些失落。"
  JAP_pnr_normal.31.a: "田边大尉挠了挠他的胡子，发出恼人的声响。"
  JAP_pnr_jpc.1.t: "彼得·潘和他的同志们"
  JAP_pnr_jpc.1.desc: "正月即将结束，但冬天可不会这么轻易地结束。即便是远在千里之外的东京，人们都还穿着厚厚的毛衣吃着煮萝卜，何况是比东京更靠北的东北地方呢？密布的雪云从东京方向压了过来，向下肆意吐着彻骨的冷雪。令人意外的是，从更北方刮来的寒风虽然同样冷酷，却反而把这雪云吹散了不少。这风吹着吹着就消失不见，而那雪云似乎也是忌惮这风藏在哪里准备给它恶狠狠的一击，便也停滞在原地，一改跋扈的神气。然而就是这个停雪的寒夜，我们的小冒险家把伞折起来抖了抖，伸手抹去了长椅上的积雪，在确保这样坐下去也无虞之后便满怀期待地安心呆在那里。\n\n他围着自己最爱的那条围巾，呼出一口因为刚刚逃离险境而激动的气息。现在是在大家来之前先检视自己冒险的战利品的时候了：首先要用椅子把宝箱取下来，然后按照记忆左右来回拨动转盘，再小心地把战利品装好让一切就位。之后是最惊险的一步，要避开巡夜的女佣和催促睡觉的阿姨才能到这里。他打开书包审视着装在大信封里的那些战利品，一串数字加上秋田银行的标志让他相信这是最珍贵的那件。\n\n直到他注意到那几个用棉衣把身体完全裹住的人从路的另一头出现，他装好东西，跳到地面，校服短裤下的膝盖冻得通红。在这个时间能出现的那肯定是他要等的人，不会错，他们约好了在这里见面。为首的那个女人走到他面前时有些诧异，不过她还是伸出手来示意要和他握手。我们的小冒险家倒是先把书包递了过去，他还有好多好多话想问。而女人则首先向他致意问候。"
  JAP_pnr_jpc.1.a: "“我是“光”，是“大叔”的朋友，你就是三浦俊贞同志？”"
  JAP_pnr_jpc.2.t: "灭绝人性！赤色之手伸向学童"
  JAP_pnr_jpc.2.desc: "昨日白天有两名四十岁左右男性来到秋田县的株式仲买店中，试图出售涵盖从东京煤气到朝鲜殖产银行的多支股票，总价值超过十万日元，这一天文数字若不是有着紧急用钱的计划，则根本不会悉数出售。除此之外，这两名男性举止怪异，似乎并不清楚股票买卖之基本流程，也对店员的日常盘问表现出警惕。这一切促使该店最终报警，却没想到牵连出了一起惊天的大事件——这十万日元股票竟是从一位学童手中诈骗得来的，而这些股票则是他们教唆学童，从父亲的保险箱中窃取而出的！\n\n受害者三浦家中管教严格，因此心生不满决心离家出走，至于其如何同这二人搭上关联尚不清楚。总之在这二人的哄骗之下，他从自家保险柜中窃得大量现金，存折和股票，并将其悉数交予两人，待折算成现金后再做分配。受害者的父亲，北日本制菓常务，同时也是最大股东之一的三浦先生披露了更多内容。在嫌疑人的教唆和煽惑之下，受害者开始和家中产生思想上的冲突，并且开始“信仰”所谓社会主义，希望同家里决裂离开，并只留下一部分，另一部分则交给赤色的社会主义党。据统计，此次盗窃共损失现金一千日元，存折存款六百日元，以及十万日元的各类股票。幸运的是两名嫌疑者在被警方抓获之后便很快交出他们诈骗所得钱财，并供出了其背后的指挥者，原来是暴力犯罪和非法交易的老面孔，赤色的黑帮日本共产党！在代号为“光”的女会头的指挥下，他们策划了这场教唆盗窃案。于匪徒们的安全屋中，警察发现了离家出走的学童以及有六百日元的存折，但并未发现“光”与一千日元现金。目前该案件仍在进行调查之中。\n\n这些恐怖主义的赤色团体以破坏社会稳定为乐，就在政府稳步推进经济复苏计划，令我国全体国民从中受益的同时，他们不断地采用非法手段夺取他人的正当财产，竟还用歪理邪说洗脑懵懂之学童，使其协助犯罪。就像之前发生的敲诈勒索和银行抢劫事件一样，在本次极为恶劣的学童诱拐事件背后，也有这样一双赤红色的魔手在背后操弄。而这些毫无底线的匪徒一定还在暗处运用手枪和汽车酝酿着更多的赤色阴谋。然而政府本身却被政党斗争所连累，无法发挥出一个政府应该拥有的强力。现在正是时候呼吁政府中的所有势力放下一己私利团结起来，铲除社会之中匪徒的同情者，打击不安定的非国民破坏分子，保护遵纪守法的国民，维持社会的稳定。"
  JAP_pnr_jpc.2.a: "严惩这些赤色强盗。"
  JAP_pnr_jpc.2.a_tt: "赤色阴谋的§R强度§!减少了5"
  JAP_pnr_jpc.2.b: "这年头的富人遭报应还要大肆宣传。"
  JAP_pnr_jpc.3.t: "涂抹赤色"
  JAP_pnr_jpc.3a.desc: "在日本桥蛎壳町二丁目的料亭“那可井”中，厚重的障子门后是如今的首相$JAP_pnr_hamaguchi_osachi$和枢密院副议长平沼骐一郎男爵。\n\n“酒不错吧，这是月桂冠的酒款。为了首相你特意开的。”率先打破沉默，抛出话头的是平沼。“确实不错，不过我更关心平沼先生为何今天要特意请我来这里，难道只是为了请我一起吃顿晚餐吗？”眼见对方有了要对话的态度，$JAP_pnr_hamaguchi_osachi$也单刀直入地抛出了自己的疑惑。“那当然是为了拉近和内阁总理大臣的关系，有求于你，所以来献殷勤——你也知道吧，就是《国家保安法》，被$JAP_pnr_inukai_tsuyoshi$否掉的那个。”“我之前略有听闻，是改正版本的《治安维持法》吧，说起来《治安维持法》也是您的手笔。”\n\n“我想请首相你在下一会期提交改正过的《国家保安法》，如何？我不会让你难做，具体法条我们可以再商讨，你只要提出便好了。”讲到这里，平沼站起来，大概是为了掩饰表情地背过身去，开始研究起那些放在一边供食客消遣的报纸刊物。“男爵的意思是想让我当第二个田中义一大将吗？还是说男爵自认为我要借此报今天的一饭之恩？”“首相，”平沼装作找到了感兴趣的报纸，把它从阅览架上抽了出来，“我只是向你建议罢了，并不是强人所难。如果这件事不行的话，那也没办法了。”“内阁近来应对“黑色星期一”实在繁忙，既然平沼先生把话说完了，那就容我先告辞。”既然谈判已经结束，$JAP_pnr_hamaguchi_osachi$已决心不再多待，便起身告退。\n\n“安达谦藏——”平沼说出了那个足够让滨口停下脚步的名字，“是安达谦藏吧，把所有人集合起来对抗政友会。而奖励则是排除了政友会的所谓‘联合内阁’。”如今内阁总理大臣再度坐回到毒蛇的对面，仔细聆听蛇信的响声。“不止是贵族院，我想宫中也对今天的‘反$JAP_pnr_inukai_tsuyoshi$同盟’感到很奇怪，所以就擅自托人进行了调查。这样行不通的，元老是个很死脑筋的人，他大概不会容许联合政党内阁这种异物存在。但如果是‘民意’的话就另当别论——”\n\n平沼骐一郎男爵把那份报纸推到了$JAP_pnr_hamaguchi_osachi$面前，用手指敲着那列硕大的标题——灭绝人性！赤色之手伸向学童——“可如果有人告诉他这些报道后面居然藏着捏着钞票的手要怎么办，这件事被元老知道了倒也不会立即引发什么后果，我只是担心联合政党内阁可能会给他留下不好的印象，我想那可就太可惜了。”\n\n男爵站起身，极为诚恳地向坐在那里紧盯着他的$JAP_pnr_hamaguchi_osachi$鞠躬告辞："
  JAP_pnr_jpc.3b.desc: "“哈哈，久原先生，这是第一次这样单独吃饭吧。本来是我邀请你，结果不知怎么的反倒成了你来邀请我了。”一开始确实是平沼骐一郎邀请了$JAP_pnr_fusanosuke_kuhara$，不过在察觉到这并非是普通的邀约之后，$JAP_pnr_fusanosuke_kuhara$很快反客为主，邀请平沼在银座的滨作见面。“平沼前辈比我早迈入政界。我是实业出身，靠着小财和运气才在政友会里走到今天这个位置。应该是我请您传授经验才是。不知您之前有没有吃过关西地区的‘板前烹割’，这体验相当不错，请您稍后务必谈谈感想。”\n\n谈到滨作，就不得不说“板前割烹”这种新颖的料理风格：食客并非在包间中，而是坐在厨房前的吧台座位，一边享用美食的同时一边将厨师本人的刀工作为一种表演欣赏。正是滨作首先在大阪发明了这种烹饪风格，并将其引入关东。\n\n首先是鲷、然后是合鸭，最后是春笋。二人就这样从入口的当季食材聊到近在眼前的刀刃刺入脂肪时的脆响，随后又是$JAP_pnr_fusanosuke_kuhara$自己的在国外的所见所闻。\n\n“大家都说首相是个怪人，我想今日见面可以说名副其实，是个完全以政治家之外视角看待事物的怪人啊。然而当下的特殊时期，就是需要怪人的思路和怪人的做法。”平沼放下那杯加了梅干的芋烧酎，“首相是个外国通，不像我连满铁的列车都没体验过几次。我国经济依赖于海外，首相的见地确实不错。但我认为，不止是经济，在和国外交流的时候，国外的学说和思想，意识形态不是也会反过来输入[JAP.GetName]吗？当初明治大帝进行维新，正是效法了西人的制度，随之一道而来的还有西人的所谓自由主义。”$JAP_pnr_fusanosuke_kuhara$则拿起了那杯熟成生啤放到嘴边：“确实不错，这就是平沼前辈今天想和我见面的理由吗？”\n\n“首相是$JAP_pnr_social_conservative_party$出身，应该有所耳闻《国家保安法》吧，被$JAP_pnr_inukai_tsuyoshi$前首相拒绝的那个。”“我听说过一点，是男爵您主导的《治安维持法》的替代品。这部法案怎么了，男爵的意思不会是想游说我，让我支持它吧。”\n\n“我只是建议，建议总理考虑一下——我在$JAP_pnr_social_conservative_party$中有一些朋友，谈到了久原首相的‘大计划’——和[ENG.GetName]与[FRA.GetName]谋求进一步友好的贸易关系。哎呀真是个好计划，毕竟[GER.GetName]简直是对我们展现出了完全的敌意。但是呢，总会有一些人感觉和工团分子做生意实在是不能接受。我想虽然困难，但他们肯定是能被说服的。”平沼用手指绕着盘子在桌子上画了一个圈，“将来如果真的和[ENG.GetName]与[FRA.GetName]达成了极为友好的关系，我想赤色分子也会因此躁动起来，本着所谓的‘关系缓和’而加大令人头痛的活动吧。如果首相你真的想靠和工团主义者们做生意来缓解经济问题，扩展日本的对外贸易对象的话，我想《国家保安法》对维持国家秩序而言是非常必要的。”平沼骐一郎见到$JAP_pnr_fusanosuke_kuhara$依旧板着那张脸，便自己点了点头赞同自己，“希望首相仔细考虑，如果真的能和英法之间取得互惠互利的共荣关系的话，对于我国经济而言确实是一件极大的功劳。”\n\n刀锋划过桧木案板，留下了沉闷而不和谐的笃笃声。"
  JAP_pnr_jpc.3c.desc: "东京府淀桥区西大久保一丁目，被一道高得不祥的黑色木栅栏保护着。这里正是“国本社”领袖，枢密院副议长平沼骐一郎男爵的老巢。在尚未成为首相之前，作为平沼好友，同为帝国大学法科出身的$JAP_pnr_suzuki_kisaburo$便多次拜访这里。然而像今天这样参加所谓的“家宴”还是第一次——平沼骐一郎必然有所图谋。\n\n“铃木，祝贺你问鼎内阁总理大臣之位！”平沼一边和$JAP_pnr_suzuki_kisaburo$碰杯，一边摇着身子发出他那极有特色的笑声，“作为东大出身，看到你今天取得了这种成就，我真是感到莫大的喜悦。之前$JAP_pnr_inukai_tsuyoshi$否掉的那部《国家保安法》，我们终于又可以提上日程了！”“《国家保安法》？”$JAP_pnr_suzuki_kisaburo$当然记得，这部法案正是平沼骐一郎为了取代被废除的《治安维持法》，通过$JAP_pnr_suzuki_kisaburo$向$JAP_pnr_inukai_tsuyoshi$游说的，不过该法案最终在内阁的内部讨论中被以“如今的国民不会接受”为由否掉了，他没想到平沼今天借着家宴名义居然是想要谈这个。“是啊，你也对现在的议会局势很头痛吧。如果《治安维持法》能回来的话，内务大臣就又能像之前那样用警察狠狠打击那些嚣张的在野党了。至于赤色分子更是——一网打尽。”“如果想再推出这部法案就要找到个理由，当初田中义一是借助了大地震的机会，现在似乎没什么好机会让民众认同这部法律。即便内阁强推，到时候在帝国议会里也会受到阻力。”\n\n“如果你要现成的理由，这里就有。”平沼指着旁边那张桌子上摊开的报纸，上面是各大新闻社对近期在秋田县发生的“赤色诱拐事件”的报道，“有人在背后炒作这件事，看看这说法，‘强力政府’。我想也就是那几个人。但是这不就是现成可以利用的理由吗？来帮他们添把火，多找一些例子。”$JAP_pnr_suzuki_kisaburo$看了一眼那些标题，又看了一眼面前的平沼骐一郎，旋即走过去拿起其中一张报纸：“我不擅长对付众议院里的议员们，不知道平沼你还记不记得田中义一内阁、《治安维持法》和《普通选举法》的事情。”他放下那张报纸，盯着眼前的枢密院副议长，《治安维持法》的缔造者，“十年以前，帝国议会用《治安维持法》交换了《普通选举法》通过。当时是你和田中大将在背后有疏通吧。然而《治安维持法》通过之后就立刻实行了，而《普通选举法》却等到‘护宪联盟’扳倒田中义一，$JAP_pnr_inukai_tsuyoshi$作为‘宪政之神’上台后才实行。世人如今谈到田中义一大将便记得他是个利用《治安维持法》破坏结社权的独裁者；至于$JAP_pnr_inukai_tsuyoshi$则是拯救宪政于危难之中，推行《普通选举法》广纳民意于社会的拯救者。”\n\n气氛变得有些尴尬，平沼骐一郎也露出了沉默的真面目，全然失去了先前装出来的那种夸张的快乐。$JAP_pnr_suzuki_kisaburo$用手指捏着桌上那几页纸来回轻轻摩擦，“这里是不是有什么奥妙呢？我始终很好奇。这不是说我要拒绝朋友的建议，我是说，如果我借助这个时机提交《国家保安法》的话——”"
  JAP_pnr_jpc.3.a: "“《国家保安法》就拜托首相了。”"
  JAP_pnr_jpc.3.b: "“首相，啤酒高度根本没在变哦。”"
  JAP_pnr_jpc.3.c: "“我是田中义一，还是$JAP_pnr_inukai_tsuyoshi$？”"
  JAP_pnr_jpc.4.t: "不治之症"
  JAP_pnr_jpc.4.desc: "自1928年中东路冲突导致民众愈发厌恶军人，反对战争之后，许多军官得了一种令人害怕的“疾病”。他们一听到民众呼吁和平，鄙视军人的声音，就突然染上了这种病。这疾病的第一阶段是在公开场合把吉野作造的《论宪政之本义》或安部矶雄的《社会问题解释法》等塞进上衣口袋里，就像是得到了勋章的老兵那样佩戴着这些小册子。这疾病的进展期表现则是这样的：“病人”开始购买自己过去十几年从来没听说过的各种报纸认真研读：《战旗》、《大真》、《无产阶级科学》、《国体原理》、《风林》……一有空闲时间便去出席各类社会活动家举办的讲座，讨论报纸上的和不在报纸上的深奥内容，而水交会或偕行社的聚会也不来参加，对艺妓的兴趣也是寥寥。等到这时候，他的同伴便怀疑他得了一种难言的疾病。等到病情更加重的时候，则似乎是意识到脸上和心上有了新东西，于是无可救药地开始帮那些工人和农民举牌子、喊口号。\n\n尽管这种“疾病”已成了陆军和海军中的一股风潮，大多数军队高官，特别是陆军教育总监部与海军省教育局已对此见怪不怪，放弃靠训话来治疗的方法了，不过这一次发现的东西还是出乎了所有人预料。在对吴市海军的一次例行军务检查中，竟从几名海军那里搜出来了明令禁止的非法印刷物《赤旗》，这是由$JAP_pnr_totalist_party$在地下私自印刷，一般只供给其资助者（被蒙蔽的同情者）和党员（匪徒的一员）的。几名军官坚称这些报纸是他们在路边的自行车筐里捡到的，只是出于好玩和猎奇心理才带回了生活区。简单但全面的调查也洗脱了他们作为共产党员的嫌疑。不过至于是不是出于好奇捡来的，则由于报纸上有许多用铅笔勾画的句子和词而需要打个问号就是了。"
  JAP_pnr_jpc.4.a: "博览群书，批判性阅读。"
  JAP_pnr_jpc.5.t: "安久公司骚乱"
  JAP_pnr_jpc.5.desc: "就在大家因为经济危机焦头烂额的时候，$JAP_pnr_kato_kanju$和他的$JAP_pnr_syndicalist_party$又出来给我们添乱。二月刚刚开始，安久公司就引发了一场大罢工。安久公司并不是什么大产业，雇员大概只有三十人。而由于经济问题，社长福井安久太打算解雇大概十个工人来缓解公司的现金流。然而在这种时候谈解雇却激发了工人们的不满。本来找几个工会内的右派干部，和老板商量一下就能解决的事情，在$JAP_pnr_syndicalist_party$与自称东京最后的“战斗工会”，和工会（Wakokai）的指挥之下，这场最初为了对抗解雇的防御性罢工居然升级成了涉及京桥区到芝区的各公司印刷工联合起来的，要求加薪的罢工。在“黑色星期一”肆虐的当下，实现这要求还是太困难了。所以福井安久太就打算一边假意关闭印刷工厂，一边联系“桂庵”找些价钱便宜的临时工偷偷开工。\n\n福井安久太的计划很聪明，就是执行得不太顺利：那几个“临时工”，按工人们的话说是“工贼”，现在正在医院里躺着呢，而福井安久太则由于害怕躲在了警署里，搞得警方也拿这件事很头疼。总而言之，现在这场骚乱已经不是走到两队人马中间，说些漂亮话把大家遣散就能解决的了。最好的方法是踩一脚福井让他多吐点铜币出来，但这无疑会助长工人们的嚣张气焰；另一种方法则是找点机会，修理一下这帮工人一顿，当然这事可不能让警察他们去干。"
  JAP_pnr_jpc.5.a: "经济问题都不是问题。"
  JAP_pnr_jpc.5.b: "这事政府可不好出面，快给内田先生准备些伴手礼。"
  JAP_pnr_jpc.5.b_tt: "§a我们会向§n内田良平§!求助，让这些打手们摆平这件事。但小混混们下手可没轻没重，这可能会§t加剧冲突§!……§!"
  JAP_pnr_jpc.6.t: "桃色争议再起波澜"
  JAP_pnr_jpc.6.desc: "1933年距今不过3年，而当初搅动东京的松竹少女歌剧团再一次以同样的面孔出现在了大家面前——这一次还带上了同为松竹事业体系的松竹有声电影部门。回顾1933年6月，为要求确立最低薪资，加入工会自由，确保公司支付通勤费与化妆品费用，松竹少女歌剧团曾发起过一场静坐罢工，有超过200名少女演员参与了该行动，她们推举了当时刚刚年满18岁的水之江泷子为罢工争议委员长。由于该罢工的主体几乎全是歌剧团的年轻女性，当时的媒体便将其称为“桃色争议”。\n\n今日这抹桃色的风暴再度袭向东京，事件的开端是松竹大船摄影所本已于今年3月末开所，松竹对该摄影所的建设投入相当可观。但与此同时松竹有声电影部门却被要求体恤当下时局而“减薪”，松竹才在今年三月启用了耗资不菲的大船摄影所，如今却反过来要求员工减薪。电影部门制作人员很快对这一点提出了异议和待遇改善要求，而松竹少女歌剧团则同样因为“黑色星期一”后的收入下滑被告知将取消自1933年开始的通勤费补贴、定期升给、生理休假、对底层研究生的基本生活保障等在“桃色争议”时期确定下来的福利。这致使两边立刻合流，而劳资矛盾也立刻表面化，很快大阪松竹少女歌剧团也加入了罢工斗争。在过去少女歌剧团和有声电影部门曾协力对抗宝冢，这份合作精神在今日用来向松竹事业体系发起冲锋。\n\n3年之前的委员长在今天依然是委员长，水之江泷子的粉丝团“水之江”也在声援他们偶像的行动——该粉丝团成员复杂，从那些现在闹得起劲的，记不住名字的民众，到仍然保持沉默的高桥是清家的小姐、出口王仁三郎、甚至据说还有秩父宫妃势津子殿下和久迩宫妃知子女王。要是有个脑袋不好的华族或者是大人物突然要为了自己的偶像说点什么的话，那情况完全会变得难以控制。目前除了罢工委员长外，参与罢工的所有成员都跑进诸如高野山和比叡山之类的隐居地采取不接受私下对话态度，防止被资方分化瓦解。松竹现在如果想要找人谈判的话，就只能和水之江泷子亲自谈谈，当然他们可不能再犯1933年让警察直接扣押泷子的错误了……"
  JAP_pnr_jpc.6.a: "只是——单纯的劳动争议，松竹运气太差。"
  JAP_pnr_jpc.7.t: "横须贺工厂怠工事件"
  JAP_pnr_jpc.7.desc: "黑色星期一爆发之后的日本各城市都发生了程度各不相同的工人骚乱，至于更偏远的农业地区则因为本就失败的农业政策而和之前的骚乱情况没什么两样。如今这阵骚动之风则传到了横须贺地区。大日本帝国海军横须贺海军工厂发生了一件大事，出于对各地此起彼伏的工人运动的同情，一小群在海军工厂中工作的工人决定通过怠工行动来支持他们的斗争。这一计划立刻得到了横须贺工厂内许多工人的响应，横须贺的工厂长，古市龙雄机关少将出于对当前社会上对工人和农民运动潮流的忌惮而暂时将其视为劳资纠纷，指示各方稳健和平处理。\n\n如果情况如此单纯也不至于被称为“大事”，他们随后在工厂内举行的声援集会立刻让所有海军都神经紧绷——他们的集会标语来自海军禁书《高耸的桅杆》中的一小段内容。这几乎立刻把人带回到了1932年，那时日本共产党曾试图渗透海军，海军陆战队内的二等机关兵曹阪口喜一郎最终被他们诱惑，在吴镇守府通过印刷面向海军人员的社会主义杂志《高耸的桅杆》，将不少海军转化为了社会主义同情者。其人目前正和他的“同志们”集中关押在府中监狱，《高耸的桅杆》也已被悉数销毁，但今天出现在横须贺的这本刊物的回声是否证明海军内仍然存在相关同情者？值得注意的是，古市龙雄在阪口喜一郎活动的当时正是吴海军工厂的电气部长，他究竟是出于对社会舆论的忌惮而默许了工人们的行动，还是说出于更可怕的目的……"
  JAP_pnr_jpc.7.a: "太多阴谋论了……"
  JAP_pnr_jpc.7.b: "我们可赌不起，给古市工厂长放长假。"
  JAP_pnr_jpc.8.t: "片山潜被袭击"
  JAP_pnr_jpc.8.desc: "生于1859年的片山潜是日本工团主义最老资格的领导人之一，被称为“日本工团主义之父”。早年间他因为参与社会民主运动而被驱逐出境，之后他前往美国，在那里他见证了约翰·里德的工团主义运动，也目睹了世界产业工人联合会一步步壮大。受到这些影响，片山潜在1926年宪法恢复之后返回日本，建立了日本第一个合法的工团主义党：日本劳动农民党(日本労働農民党)。该党在1932年被宣布为非法后，他又参与组织成立了社会大众党(社会大衆党)，并在之后隐退。\n\n昨天，片山潜到访京都与社会大众党成员$JAP_pnr_yamamoto_senji$会面时，三个右翼分子攻击了$JAP_pnr_yamamoto_senji$的办公地，用棍子殴打了二人。$JAP_pnr_yamamoto_senji$在袭击中幸存了下来，但是76岁的片山潜，因为抢救无效，在今天早些时候逝世。"
  JAP_pnr_jpc.8.a: "情况变得棘手了。"
  JAP_pnr_jpc.9.t: "日本无产党的诞生"
  JAP_pnr_jpc.9.desc: "先前因黑色星期一而连锁引发的一系列的罢工骚乱已经引发了我国右翼势力的不满，随后他们袭击了可以称得上是日本工团主义象征的片山潜，这无疑加剧了冲突。那些尚在合法范围内的左翼政党因片山潜之死而逐渐开始激进化，片山潜原本肃静的葬礼已经被他们变成了义愤填膺的诉苦大会。\n\n出席了葬礼的$JAP_pnr_kato_kanju$号召所有左翼政党团结起来，他尤其谈到了$JAP_pnr_social_democrat_party$内部的问题，认为该党派虽然是帝国议会中举足轻重的大党之一，却开始表现得与劳动分子们离心离德，就这一问题他当场质问了$JAP_pnr_yamamoto_senji$。不过他并未对此多加纠缠，因为随后的发言便暴露了他的真实目的：他宣称工人们现在应该结成一个更强大，更广泛的左翼政党来对抗“位于左侧的反动社会民主主义分子”，并呼吁$JAP_pnr_social_democrat_party$左派脱离原本的党派，加入这个新的，真正代表工人的左翼政党。\n\n在葬礼的最后，几个边缘组织加上$JAP_pnr_kato_kanju$的$JAP_pnr_syndicalist_party$宣布合并并组成$JAP_pnr_nihon_musanto$，以真正实现在非常时期为工人阶级发声。"
  JAP_pnr_jpc.9.a: "这不是什么好消息……"
  JAP_pnr_jpc.10.t: "社会大众党呼吁正视现状"
  JAP_pnr_jpc.10.desc: "日本无产党的成立不仅获得了日本工人们和劳工活动家意外的响应，同时也让日本最大的左翼温和政党社会大众党陷入了极为难堪的境地。长期自诩为劳动工人在帝国议会中代言人的社会大众党如今被指责在经济危机期间未能尽到其保护工人合法权益的职责。\n\n社会大众党长期以来一直维持着其温和面目，尽管内部由中左派组成的革新团体一直都在鼓吹要加强工会行动对国家政治的影响力，而不能仅仅局限于协调工资，提供劳动援助等并未超出雇佣关系的行为。但社会大众党依旧对是否要借助工会发动政治行动而犹豫不决。\n\n党内保守派，即以党首安部矶雄在内的原社会民众党成员担心，如果党在该问题上表露出对工人们的示威游行和逐渐演变成街头暴力的冲杀的同情的话，可能会违反党内一直坚持的“三反原则”。不论是党内的革新集团还是党外的工人们都密切关注着社会大众党对该问题的看法，现在已经不再是能不去正面回答该问题的时候了。"
  JAP_pnr_jpc.10.a: "国家应该正视当下的劳资矛盾。"
  JAP_pnr_jpc.10.b: "所有人都在受苦，不止是工人。"
  JAP_pnr_jpc.11.t: "局势降温？"
  JAP_pnr_jpc.11.desc: "“黑色星期一”后接连爆发的工人运动无疑令更多人怀疑日本共产党在假借这场经济危机搞鬼，关于日共的“赤色阴谋”的传闻已经变得越来越耸人听闻，甚至有些人宣称就连“黑色星期一”本身也是英法左翼主义势力为了摧毁世界秩序而引爆的一场世界层面的“赤色阴谋”。\n\n在近期的一次报纸采访中，昭和高等商业学校常任理事菅野和太郎严厉批评了这一在社会上越来越夸张的阴谋论，称“包括日本共产党的阴谋在内，都只是政府推卸经济责任的一种说辞。经济本身的运转不因所谓罢工之举办所改变，关键仍在于产业主科学的规划管理和政府适当的引导掌控。如今街上游行的，实是一群粗野而未受科学教育的人。”\n\n菅野和太郎的这一言论顿时引发了渲染大波，但社会的关注点并不在于他对本届政府的批评上，而在于他们本身从中听到了侮辱的意味：一些城市工人要求菅野和太郎“道歉”，在公开场合悬挂他的照片并用竹枪或是长棍戳穿来表达他们对他的愤怒；而许多右翼分子则认为菅野和太郎长期鼓吹指令经济模式，宣称国家应该通过行政指令来全面控制社会经济生活，因此菅野和太郎一定是“日共同情者”，或者干脆就是一个潜伏的“日共分子”。\n\n如今菅野和太郎本人已经陷入了舆论的风暴之中，“赤色阴谋”本身的真实性似乎已经不再重要。"
  JAP_pnr_jpc.11.a: "这帮傻子自己就打起来了！"
  JAP_pnr_jpc.12.t: "霞关陷入火海"
  JAP_pnr_jpc.12.desc: "霞关被炮击"
  JAP_pnr_jpc.12.a: "日本工团竟已渗透到如此之深……"
  JAP_pnr_jpc.12.b: "全球工团运动无法抹去的一笔！"
  JAP_pnr_jpc.13.t: "东京激斗"
  JAP_pnr_jpc.13a.desc: "找内田良平摆平这件事是个正确的选择。当时参加安久公司罢工的工人们正集结起来举办誓师大会，他们一方面是为了给彼此加油打气，另一方面则是准备纠集更多人，在大会结束之后从京桥区开始一场罢工游行。和工会的头目，煽动这次罢工的匪首岩田秀彦刚刚开口没讲几句，内田良平派去的爱国社和大日本生产党成员们便突然闯入了会场。\n\n这些壮士手持皮鞭、木棍和铁棒见到工人便全力殴打，当时参加集会的工人们还没反应过来就被打得哭爹喊娘满地乱滚，稍晚些时候一部分工人终于反应过来，他们用地上的石头和木棒组织了一波反击，但由于在第一波突袭中他们损失了不少人，大日本生产党很快就瓦解了他们的攻势。等到局势已经基本确定，在附近准备收尾的警察立刻一拥而上控制住了场面。\n\n这场罢工游行前的誓师大会最终变成了安久公司罢工事件的最后一幕，岩田秀彦本人被扒光衣服裸体捆在了安久公司门口的路灯上，这一成果显然震慑了那些罢工团，他们最终在事实上进行了解散。印刷工人们在今天早上便已重返工作岗位，东京的印刷业界再次回归平静，再没人提什么“禁止解雇”之类的话了。"
  JAP_pnr_jpc.13b.desc: "找内田良平摆平这件事是个正确的选择。当时参加安久公司罢工的工人们正集结起来举办誓师大会，他们一方面是为了给彼此加油打气，另一方面则是准备纠集更多人，在大会结束之后从京桥区开始一场罢工游行。和工会的头目，煽动这次罢工的匪首岩田秀彦刚刚开口没讲几句，内田良平派去的爱国社和大日本生产党成员们便突然闯入了会场。\n\n这些壮士手持皮鞭、木棍和铁棒见到工人便全力殴打，但不知道怎么回事，迎接这些壮士的同样是皮鞭、木棍和铁棒。似乎这些工人早已预料到了会有人前来破坏集会，又或者这些武器是他们稍后要在罢工游行中使用的？总之大会现场很快陷入混乱，工人们和右翼壮士们手持武器相互殴打。直到在附近本来准备收尾的警察呼叫的增援警力全部赶到后才平息了这场争端。\n\n这场罢工游行前的誓师大会最终变成了安久公司罢工事件的最后一幕，在这场恶斗之后，大日本生产党的创设者之一，吉田益三先生拜访了在警署里的福井安久太，不清楚他们二人之间聊了什么，但最终福井乖乖接受了工人们的条件。既然罢工团的目的已经达成，他们也很快解散回到了各自的工作岗位上。东京的印刷业界再次回归平静，只是偶尔会听到有工人添油加醋地讲述这场左翼和右翼之间的传奇激斗故事。"
  JAP_pnr_jpc.13c.desc: "找内田良平摆平这件事似乎并不是个正确的选择，他的行动最终招来的灾难性的结局。当时参加安久公司罢工的工人们正集结起来举办誓师大会，他们一方面是为了给彼此加油打气，另一方面则是准备纠集更多人，在大会结束之后从京桥区开始一场罢工游行。和工会的头目，煽动这次罢工的匪首岩田秀彦刚刚开口没讲几句，内田良平派去的爱国社和大日本生产党成员们便突然闯入了会场。\n\n这些壮士手持皮鞭、木棍和铁棒见到工人便全力——然而工人们也有备而来，在第一波人手持武器，大声叫嚷地冲入会场的时候，迎接他们的是一根在建筑工地上常见的巨大的方木棒。那根木棒直接把冲进来的人捅了出去，随后手持其它钝器的工人们立刻和他们打成一片。本来计划通过突袭破坏罢工运动的壮士们反而成为了被突袭的对象。这场激斗极为血腥，两方都有大量人员受伤。直到在附近本来准备收尾的警察呼叫的增援警力全部赶到后才平息了这场争端。\n\n这场罢工游行前的誓师大会最终变成了震撼社会的流血事件，工人们的暴力行为反而使得更多人开始关心起印刷工人的现状，并指责政府在应对危机方面的不作为。在其它行业也出现了支持印刷工人反抗的呼声。今天早些时候，福井安久太可能是由于压力太大而一时惊慌，在警署内上吊自杀了。\n\n既然工厂主已死，工厂也理所当然地关闭了。眼见继续为此举行罢工斗争已无必要，罢工团也随之解散。东京的印刷业界再次回归平静，但是这平静之下却掩盖着骇人的怒涛。"
  JAP_pnr_jpc.13.a: "这就是不好好工作的下场！"
  JAP_pnr_jpc.13.b: "也还好吧。"
  JAP_pnr_jpc.13.c: "完了……"
  JAP_pnr_jpc.14.t: "党中央是叛徒！"
  JAP_pnr_jpc.14.desc: "同志们！鉴于许多同志仍对我们与党中央之间的冲突原因不甚明晰，故而我们特此告知同志们我们这样做的原因。这一切都是因为如今的党中央，以“中央委员会”为名的间谍匪帮，在我们先前的攻击下终于暴露出了掩蔽的自相矛盾之处。是的！我们如今把日本共产党中央的“中央委员会”称为“间谍匪帮”。也就是说，我们接下来将揭露让无产阶级运动昏昏沉沉的间谍元凶，其真面目的时候了！\n\n作为有原则的共产党员，我们绝不会说假话。以下便是警视厅走狗，反革命叛徒，自封为党中央代表的$JAP_pnr_hakamada_satomi$是间谍的原因。\n\n第一，$JAP_pnr_hakamada_satomi$是先前警视厅大搜捕中唯一未被捕的中央委员，这已足够使人警惕。警视厅放过袴田而只逮捕其他人的原因是什么？袴田自称自己躲藏得很好，难道其他中央委员就没有谨慎地选择躲藏地点吗？\n\n第二，$JAP_pnr_hakamada_satomi$被孤立于群众要求的浓厚教条化所支配，在这种情况下依然固执地坚持推翻天皇制，坚持盲目的宗派主义见解，主张发动暴力，白白葬送无产阶级的力量。\n\n第三，$JAP_pnr_hakamada_satomi$要求党员再登记，而许多再登记了的党员则被政府逮捕。如火如荼的反间谍斗争的结果是更多人被捕——这实在是令人感到恐惧。\n\n综上所述，实际上，他，$JAP_pnr_hakamada_satomi$才是我们党创立以来最严重的挑拨离间者元凶。现在中央委员会被运动的破坏者，警视厅的间谍所独占。中央已成为了间谍的中央，而我们必须夺回它！我们今天将公开叛徒的位置，我们把他的相貌告知同志们，以备大家日后警戒。他的老巢在日本东京千駄木5丁目，他时常出现的活动地点是东京本乡。他平日里戴着圆框眼镜伪装成知识分子，鼻子下面留着两撇短胡子，身材瘦削，肤色浅黑。当他走路时，身体会前后摇晃，一顿一顿！他的近日照片在下一页供各位同志参考。\n\n同志们！在各位同志的精诚协作之下，本宣传刊物《多数派》日前印刷量已超过1000册！这实在是一项大喜事，并证明我们的运动远离了党中央反而更加欣欣向荣……"
  JAP_pnr_jpc.14.a: "愣着干啥，赶紧抓人！"
  JAP_pnr_jpc.14_tt: "§C我们将组织一场针对§o日本共产党§!中央委员会的突袭行动，这将一举破坏掉他们在东京地区的行政大脑。§!"
  JAP_pnr_news.1.t: "泛美航空天际酒店遭到破坏"
  JAP_pnr_news.1.desc: "1935年9月美国泛美航空为开拓旧金山-中国的“中国飞剪号”水上航线时，在关岛的苏迈村建造了泛美航空天际酒店。然而这只落地休憩的白鹰却最终在天空中其它猛禽的攻击下倒地不起，这一切都是因为德日在太平洋区域矛盾的激化。\n\n今日晨间，一架战机飞临苏迈村上空进行扫射和投弹，试图破坏关岛的水上飞机基地。机枪扫射击中了靠近酒店的燃料罐引发爆炸，两名酒店厨房员工不幸遇难。昔日装潢奢华的单层度假酒店如今已沦为断壁残垣。\n\n目前[GEA.GetName]和[JAP.GetName]都在指责对方是造成该灾难的元凶。"
  JAP_pnr_news.1.a: "西太平洋局势愈发不安。"
  JAP_pnr_news.2.t: "民政党延续立宪政治"
  JAP_pnr_news.2.desc: "123"
  JAP_pnr_news.2.a: "国民必将凭帝国议会为自身发声"
  JAP_pnr_news.3.t: "同床异梦的宪政联盟"
  JAP_pnr_news.3.desc: "123"
  JAP_pnr_news.3.a: "这是日本政界的新风，还是朝荣暮落的牵牛？"
  JAP_pnr_news.4.t: "大同团结总同盟结成"
  JAP_pnr_news.4.desc: "在同日共进行了多轮非正式会谈之后，日共成员全部加入劳动组合全国评议会，而劳动组合全国评议会，社会大众党，以及民政党与政友会中的非主流派则共同组建了一个广泛的政治联盟。值得注意的是，该联盟特别强调维护《帝国宪法》，拥护天皇的立宪地位，这向宫中释放了日共立场趋于温和的信号。\n\n帝国陆军对于这一新生组织的出现选择了沉默，但零星的部队调动表明他们似乎正为某种行动做准备。面对军方施加的未知压力，宫中最终与这个新生的同盟达成了某种妥协。就在刚刚，西园寺公望正式奏荐“人民同盟”中的协力者之一，已有八年议会资历的社会大众党党员山本宣治出任首相。这个广泛的政治联盟是否能在解决日本当前面临的危机之前避免崩溃？"
  JAP_pnr_news.4.a: "那么此前那些传闻都是真的？"
  JAP_pnr_news.5.t: "科学的日本主义之胜"
  JAP_pnr_news.5.desc: "出人意料的消息从众议院中传来，在新的《议员选举法》通过后的首次众议院大选中，由北海道选区议员赤松克麿领导的科学社会党成功将其倡导的“科学的日本主义”带进了议会。\n\n起初他们根本无力撼动两大巨头政党的地位。但在关键时刻，以麻生久为首的社会大众党左派突然倒戈，通过一份互相协力候选人的选举协定与科学社会党组成同盟，形成了足以重塑日本政坛格局的政治力量。面对陌生的帝国议会第一大党，宫中似乎一时惊慌失措，但西园寺公望依然恪守“宪政常道”，奏请天皇向赤松克麿降下组阁大命。与政界不同，大多数民众都期待这位青壮年政治家的“科学”能为日本带来崭新的气象。"
  JAP_pnr_news.5.a: "日本无产阶级当以保卫自身民族利益为先"
  JAP_pnr_news.6.t: "社会大众党成为第一大党"
  JAP_pnr_news.6.desc: "尽管令人瞠目结舌，但事实的确如此。接连遭受政治丑闻与财务丑闻的打击后，立宪政友会和立宪民政党无可挽回地失去了国民的信任。两党虽然仍一如既往地在各地大肆展开贿选攻势，企图维持自身在众议院中的主导地位，但他们似乎未曾料到新《议员选举法》的施行使得选民数量激增，而日本民众早已在一次次失望中厌倦了两党的“民主”。\n\n长期作为政坛第三势力的社会大众党似乎已承载起越来越多日本民众对未来的希望。如今这个素有“永久在野党”之称的政党终于迎来了执政之日。其委员长安部矶雄如今已奉命组阁，并宣誓将一扫之前两党的积弊，真正地把民众的愿望和呼声带到帝国议会中。"
  JAP_pnr_news.6.a: "希望他们真能做到他们的承诺"
  JAP_pnr_news.7.t: "帝都不祥事件"
  JAP_pnr_news.7.desc: "东京政局在1936年上半年一直笼罩在迷雾里，时至今日一阵清风终于将雾霭吹散。约千名陆军中的革新派官兵发动了一场军事政变，他们迅速压制了几处关键的通讯设施和行政机关，并压制了清军派等反对势力，将其将领置于监视之下。此后政变部队迅速包围了皇宫，有报道称，天皇通过侍从武官长本庄繁男爵与政变部队取得接触。从眼下的局势判断，天皇似乎向政变者释放了积极信号。\n\n目前真崎甚三郎大将和近卫师团长香月清司中将一同控制了局面，并向日本全境颁布了戒严令。另有一条费解的消息，尽管目前尚不明确前因后果，但在政变部队成功控制了局势之后，秩父宫雍仁亲王似乎已进入皇宫。而宫中也已派出使者前往伊势神宫。"
  JAP_pnr_news.7.a: "陛下乃我等首领"
  JAP_pnr_news.8.t: "日本的加里波第"
  JAP_pnr_news.8.desc: "在石原莞尔，桥本欣五郎等人的带领下，日本党，或称之为“大日本主义国家党”，于几天前纠集了一群农民，工人和一些士兵从静冈发动了一场前往东京向天皇陛下致敬的游行。在内田良平和出口王仁三郎等社会活动家的支持下，一开始只有约百人的队伍在抵达东京后已膨胀到数万人规模。尽管政府一方面派遣宪兵镇压游行，一方面希望奏请宣告戒严，但在短暂的对峙之后，一部分宪兵也脱离队列加入了游行队伍。而天皇则为避免进一步激化矛盾拒绝了戒严的下达。\n\n队伍在进入东京后并未破坏现有秩序，还获得了东京市民的欢迎。稍晚些时候，下位春吉作为代表向掌玺大臣呈递了一份请愿书，天皇特别考虑了他们对“恢复日本正常秩序”的主张，并最终向宇垣一成降下了组阁大任。"
  JAP_pnr_news.8.a: "我们又一次得到它了"
  JAP_pnr_news.9.t: "昭和神圣会稳定政局"
  JAP_pnr_news.9.desc: "长期以来日本的阴影中便充斥着凭正义之名实施的“政治暴力”，左右翼急进团体历来奉行独狼式作风，诉诸少数人的直接行动和个人恐怖主义来实现社会变革。可当他们面对昭和神圣会势不可挡的群众动员和闪电般的宣传攻势时则彻底失去了力量。在九段军人会馆中出口王仁三郎进行了演讲，随后下位春吉手持会旗，与几辆摩托车一同护送这位“圣师”前往二重桥。与此同时，早已在俱乐部外等候的昭和神圣会成员也开始高喊着恢复“皇道”，并高唱《君之代》向二重桥进军。宣传汽车突然从各条道路中冲出开始广播，其飞机则同步开始在帝都上空散发传单，向市民宣扬昭和神圣会的诉求。这场游行以宫中的沉默结束，但组阁大命很快被下达给与昭和神圣会密切相关的内务官僚后藤文夫。毫无疑问，菊花已被十曜裹挟，烤得萎靡不振。"
  JAP_pnr_news.9.a: "这他妈的还是日本吗？"
  JAP_pnr_news.10.t: "泛美航空天际酒店遭到破坏"
  JAP_pnr_news.10.desc: "1935年9月美国泛美航空为开拓旧金山-中国的“中国飞剪号”水上航线时，在关岛的苏迈村建造了泛美航空天际酒店。然而这只落地休憩的白鹰却最终在天空中其它猛禽的攻击下倒地不起，这一切都是因为德日在太平洋区域矛盾的激化。\n\n今日晨间，一架战机飞临苏迈村上空进行扫射和投弹，试图破坏关岛的水上飞机基地。机枪扫射击中了靠近酒店的燃料罐引发爆炸，两名酒店厨房员工不幸遇难。昔日装潢奢华的单层度假酒店如今已沦为断壁残垣。\n\n目前[GEA.GetName]和[JAP.GetName]都在指责对方是造成该灾难的元凶。"
  JAP_pnr_news.10.a: "西太平洋局势愈发不安。"
  JAP_pnr_news.10.b: "审查该报道。"
  JAP_pnr_news.11.t: "马六甲海峡被隔离"
  JAP_pnr_news.11.desc: "看来[64.GetCapitalVictoryPointName]与东京之间在远东又爆发了新一轮外交摩擦。自黑色星期一过后，[JAP.GetName]便一直试图强化其对亚洲和太平洋地区各国的影响力，以接管在该区域日渐衰退的德国霸权。负责亚洲事务的[GEA.GetName]今天联合[DEI.GetName]宣布正式对马六甲海峡进行“隔离”，禁止悬挂有[JAP.GetAdjective]国旗的货船以及运往[JAP.GetNameDef]的战略物资通过该海峡。\n\n国际观察家指出，这是[64.GetCapitalVictoryPointName]试图反制东京在整个远东越来越频繁的私下军事干涉而采取的行动。并且从目前的情况分析，[JAP.GetNameDef]难以承受这一“关闭政策”。无论该危机最终如何收场，这都意味着德日关系暨1928年上海会议后的短暂缓和又再一次转入更为尖锐的冲突状态。"
  JAP_pnr_news.11.a: "东亚的事情怎么这么糟糕。"
  JAP_pnr_news.11.b: "十年和平，如梦似幻。"
  JAP_pnr_kg.1.t: "什么是“亚细亚”"
  JAP_pnr_kg.1.desc: "尽管有[ROOT.GetFactionName]这样的组织存在，但所谓的“亚细亚联盟”、“亚细亚主义”究竟是什么却让大多数人摸不着头脑。鹿岛守之助法学博士近期在拓殖大学的演讲上就该问题向宫中给出了他自己的答案。\n\n鹿岛博士首先谈到了1936年开年发生的“德国经济大崩溃”，并提出了与大多数经济学家不同的新颖观点。目前日本经济学家对这场经济危机的主流观点是[GER.GetNameDef]在东亚地区的投资存在欺诈和虚报利润，而关于此事的调查报告被公之于众，引发了银行挤兑，这致使沙赫特暂停银行兑换，最终引发了黑色星期一。然而鹿岛认为这一切的问题并不在于一次“商业欺诈”，而是一种“盲目扩张”。他严厉批评了[GER.GetLeader]的所谓“世界政策”，认为在当前的科技水平下，实现世界范围内的联合是不可能的，只会因为力量分散和官僚积弊导致腐败，更遑论“控制世界”了。真正正确的做法是首先建立区域性的“合作伙伴关系”，即由文化共通、种族共通、地理共通、诉求共通的“四共通”民族所组成的主权平等、关系民主化的联合。并随着科学技术水平的发展，全球变革时期到来的时候再由各个“区域同盟”过渡到“世界同盟”。\n\n鹿岛博士将自己的这一构想称为“亚细亚-太平洋共同体”，与他的挚友“青山荣次郎”，即[AUS.GetNameDef]伯爵理查德·库登霍夫-卡勒吉所提出的“泛欧洲联盟”相呼应。在演讲的最后，他鼓励听众（主要是拓殖大学的学生们）真正践行大学校歌中“在我面前没有歧视，无论是种族还是国界”的理想，应当首先成为日本的盐，随后是亚洲的盐，最终成为世界的盐。"
  JAP_pnr_kg.1.a: "亚洲命运休戚与共。"
  JAP_pnr_kg.1.b: "理想很美好，现实不好说。"
  JAP_pan_asia_event_impire_tt: "§1我们正沿着建成§O强调[JAP.GetNameDef]在亚洲的特殊地位§!的路线前进。§!"
  JAP_pan_asia_event_unite_tt: "§3我们正沿着建成§O亚洲各国携手共进§!的路线前进。§!"
  JAP_pnr_kg.2.t: "《亚细亚之亡状》"
  JAP_pnr_kg.2.desc: "在过去的一个月内，中国华东地区的骚乱已经发展成了一场各方势力相互对抗的全面内战，一些日本国内的泛亚主义者认为这是“欧洲霸权秩序崩溃的信号”，但诸如佐藤佐这样的新泛亚主义者却认为这不过是无稽之谈，所谓的华东内战不过是“盎格鲁撒克逊势力因分赃不均而爆发的内战”。\n\n《大亚细亚主义》上刊登了一篇由参谋本部成员今田新太郎少佐撰写的名为《亚细亚之亡状》的文章，在文中，今田中佐借着华东混战的乱象回顾了一个沉重的名词“黄祸论”，并随之提出了另一个与之相对的，名为“白祸论”的观点——在文章的第一部分，今田新太郎进一步发展了松井石根与桥本喜和人等人“白祸防备论”，从人种冲突的角度出发回顾了历史上西欧国家对亚洲的侵略：从“黑船来航”到德国以其远征军干涉中国国民党的“北伐”；随后他逐一分析了当前亚洲地区的各国政治局势，指出“广大亚洲沦落白人之手，波斯、阿富汗、暹罗等国之独立名不副实，惟日本具独立之实”，并号召各亚洲民族应当“存小异而求大同，以东洋永远和平与优秀文化的指导者，亚洲盟主之[JAP.GetNameDef]为中心团结以击灭白人帝国主义”。在文章的最后，他谈到应该构建亚细亚人民“普遍的命运”，实现持久和平，共同繁荣的东亚新秩序。而为了实现这一新秩序所首要的任务便是对亚洲各傀儡政权的清算，要首先使其民族脱离白人殖民者的压迫，并寻求一同打倒“夷狄之赤白帝国主义”的机会。为了拯救落入混沌乱离之中的亚洲，[JAP.GetNameDef]应该伸出温情的帮助之手去实现“道义的干涉”。\n\n这篇文章刊登之后在民间引发了轩然大波，许多人都批评今田新太郎是“最邪恶的战争贩子”和“非国民”，试图蛊惑[JAP.GetNameDef]贸然涉入中华局势，并最终将让帝国再陷入一场注定失败，且即便胜利也“无利可图”的战争。"
  JAP_pnr_kg.2.a: "有趣的愿景。"
  JAP_pnr_kg.2.b: "他只是在给未来找理由罢了……"
  JAP_pnr_kg.3.t: "全亚细亚民族会议"
  JAP_pnr_kg.3.desc: "一层薄薄的云遮住了太阳，半透不透的日光如今笼罩着长崎，给经过紧锣密鼓的筹备，即将在明天召开的全亚细亚民族会议的前景蒙上了一层难测的前景。[GetYear]的本次会议是第八届全亚细亚民族会议，本届大会参会人数同时也达到了历届大会之最，将有来自多个国家的超过一百二十余位代表出席，立宪政友会议员，大会组织者之一田中善立在海田饭店中接待了各位代表。\n\n自1929年全亚细亚民族会议设立以来，该大会就始终是由曾遭受或正在遭受帝国主义侵略和奴役的亚洲国家发起并参加的大型国际会议，因此自然而然地受到了世界各国的关注，不必多说，对该会议的攻击和质疑是少不了的。每年大会开始之前，[GER.GetNameDef]和他的宣传工具都会在报纸上发表大量的匿名社论，贬低亚细亚民族会议的意义。他们一边散布“明年该会议就将停办”的，判断亚洲团结必然失败的论调，另一边则利用各种手段拉拢分化亚洲国家，用捕风捉影的话语挑拨亚洲各国和[JAP.GetNameDef]之间的关系。\n\n1936年年初发生的黑色星期一已然重塑了整个亚洲局势，许多亚洲国家都开始重新评估日本与他们之间的关系，本次出现在会议上的新面孔有来自[PHI.GetNameDef]、[INC.GetNameDef]和[AFG.GetNameDef]的代表。然而中国方面，情况还和前几届一样，除了[FNG.GetNameDef]之外的中华势力依旧都拒绝参加本次大会。毫无疑问，他们认为只要拒绝出席该会议便足够证明所谓“全亚细亚”名不副实，从而对[JAP.GetAdejective]国际信用造成重大打击。"
  JAP_pnr_kg.3.a: "让我们开始吧。"
  JAP_pnr_kg.4.t: "滑稽的马戏团"
  JAP_pnr_kg.4.desc: "近些日子发生了一件颇为滑稽的事情，那便是所谓召集亚洲各国代表，实现亚洲“共存共荣”的所谓“亚细亚民族会议”。这一会议实乃是1928年列强分裂中国，令[FNG.GetNameDef]割据东北的另一手笔，从1929年至今已举办了许多届，可以说是每年都有的节目。据东京《报知新闻》的报道说，今年参加“亚细亚民族会议”的人数乃历年最高，为一百二十余人，足可见得所谓亚洲民族已经觉醒并团结起来，亚洲的永久和平也近在眼前。\n\n所谓和平与否我们姑且不论，让我们看看都有哪些国家，哪些代表呼吁这和平：除开日本的十五名代表之外，这一百二十余人中有约五十人来自[FNG.GetNameDef]，有二十人来自朝鲜，有十人来自台湾，余剩的二十五位代表则零零散散来自土耳其、菲律宾和印度等地。这些外人我们不知道，但那自称为所谓中华的代表的六十人，中国人却能确定他们绝没有受到作为“代表”的承认。这些代表所占的人数有一半之多，可见这次大会与其叫“亚细亚民族会议”，不如叫“中华民族会议”。而这些代表们既然没有资格代表我们中华民族，显得如同是滑稽的小丑，那其他各民族的“代表”的身份也就昭然若揭了。全然的，所谓的会议的价值也不问可知了。\n\n综括起来，所谓的亚细亚民族会议不过是滑稽的马戏团，是[JAP.GetNameDef]同其走狗自娱自乐的会议罢了。其本质乃是挂伪善面具行侵略政策的日本帝国主义欺骗亚洲弱小民族的惯用伎俩。一些人听到我们揭露日本的阴谋就会害怕，他们一辩白就暴露出来，而所谓的中国的日本帝国主义走狗就是这样被发现的。（作者：汉寅）"
  JAP_pnr_kg.4.a: "马戏不过博君一笑耳。"
  JAP_pnr_kg.4.b: "让他们接着笑吧……"
  JAP_pnr_kg.5.t: "不可靠的军事同盟"
  JAP_pnr_kg.5.desc: "黑色星期一严重影响了[GEA.GetNameDef]的正常运作，殖民地官僚们的预算一再被[64.GetCapitalVictoryPointName]裁缩以应对其面临的灭顶之灾。德国人将其政治重心转向内部反而使得整个亚洲地区出现了离奇的军事真空，如果[JAP.GetNameDef]，或者说“亚细亚民族会议”上能够达成某种共识，使得[JAP.GetNameDef]顺理成章地占据这些真空地带的话将有助于我们进一步扩张自己在亚洲地区的力量。\n\n在大会发言中，一些代表表示希望[JAP.GetNameDef]能够支援他们的民族自由斗争，不论是派遣志愿军还是接受他们本地的军官前来[JAP.GetAdjective]留学，或是单纯提供军火，只要是能够对各盟邦有帮助的军事支持他们都很欢迎。公平地说，所有亚洲国家的平均军事水平低得令人发指。而如果从这些亚洲国家中去掉[JAP.GetNameDef]，那么余剩各国的平均水平将无限趋近于0。在这样的情况下构成军事同盟的盟约，本质上只是削弱[JAP.GetNameDef]，使其将力量不得不分散到各个方面以托举各国，而各国也不过是将[JAP.GetNameDef]视为某件好用的趁手工具罢了，一些与会的[JAP.GetAdjective]代表在私下交谈里已经决定希望在军事同盟上更进一步，利用各种手段确保这些亚洲国家在军事上取得进步后不能轻易地把[JAP.GetNameDef]一脚踢开。\n\n但也有一些代表指出了值得担忧的问题，黑色星期一不仅瘫痪了[GEA.GetNameDef]，而且瘫痪得相当成功，似乎[64.GetCapitalVictoryPointName]已无力（也没时间）控制东亚殖民办公厅，而办公厅也基本无法控制整个[GEA.GetAdjective]军队。如果我们在现在把[GEA.GetNameDef]逼得太紧的话，我们可能会发现这条恶犬背后的链子早被不知道什么人砍断了。"
  JAP_pnr_kg.5.a: "我们会“接管”亚洲安全。"
  JAP_pnr_kg.5.b: "我们会“支援”亚洲和平。"
  JAP_pnr_kg.6.t: "亚洲经济的去向"
  JAP_pnr_kg.6.desc: "与前几届全亚细亚民族会议不同，经济危机的余波自本届大会召开的第一天起就笼罩在议场上空。不知道是幸运还是不幸，大多数与会代表的国家经济建设都处于一穷二白的状态，这导致他们几乎没有怎么受到这场席卷世界的金融危机的直接影响。不过就像极度依赖出口贸易的[JAP.GetNameDef]一样，这些国家在随后扩散的第二波次生冲击中都遭受了程度不一的严重打击。许多亚洲国家，特别是中亚和南亚国家失去了他们先前从[GEA.GetNameDef]那里得到的发展贷款，致使其工业发展陷入停滞。这也是为什么他们现在出现在会场的原因：这些代表迫切地希望能给他们的国家带回去一个投资上的好消息。\n\n成立全亚细亚金融与兴业机关（又称兴亚共荣院）的提案是即将在大会后几天进行的一项议程，届时[JAP.GetNameDef]将作为代表呼吁成立一个统括亚细亚经济的独立组织，该组织的架构基于目前存在于日台朝三地之间的$faction_JAP_pnr_start_factions_name$。考虑到这些代表对经济投资的渴望，或许[JAP.GetAdejective]代表们可以加班加点地修改这份提案，从而让[JAP.GetNameDef]能够从成立的经济同盟中获得更多利益。"
  JAP_pnr_kg.6.a: "只有[JAP.GetNameDef]才能带领亚洲实现繁荣。"
  JAP_pnr_kg.6.b: "亚洲是一个团结起来共同进退的整体。"
  JAP_pnr_kg.7.t: "《大亚共同声明》"
  JAP_pnr_kg.7.desc: "吾等全亚细亚民族会议，为谋求全亚细亚民族平等之实现，以期达到全亚细亚民族共存共荣之目的。为了支持这一蹶起的大运动，吾等全亚细亚民族以自身之自由意志缔结该声明。\n\n1.我等宣言，以平等正义为基础，谋求亚洲之恒久和平实现，并撤废人种与宗教的差别，确保全亚细亚民族之自由及幸福，乃是本共同体之基础。\n2.本共同体为达设立之目的，断行以下之努力：复兴亚细亚精神的并物质的文化；撤废国际间现存之不平等条约与各民族间之差别待遇；提摧亚细亚民族间之文化经济政治；奖励使用亚细亚生产品及亚细亚各国产业之增进。\n"
  JAP_pnr_kg.7a.desc: "$JAP_pnr_kg.7.desc$3.本共同体各盟邦之团结，在于政治经济文化之紧密关系及对于妨害全亚细亚民族解放和独立的共同敌人即西欧帝国主义侵略势力，加以抵制之共同意志。故而各盟邦当将其国防事项暂时悉置于天皇陛下御统帅之下，以[JAP.GetAdjective]最高军事机关为中心掌管，不再另设特别机关。\n4.本共同体各盟邦虽有各自独立之财政，但共同体以亚细亚命运之一体为前提，各盟邦间财政必不可毫无干系。[JAP.GetNameDef]既为共同体之枢轴国，暂时全联盟之经济建设之资金悉由[JAP.GetNameDef]筹备运用。\n5.本共同体最高机关称谓理事会，以二十五名理事组织之。\n6.理事会设于东京，并于必要地方另设支部。\n7.理事于总会选举任期志年。\n8.理事长于理事会选举任期一年。"
  JAP_pnr_kg.7b.desc: "$JAP_pnr_kg.7.desc$3.本共同体各盟邦之团结，在于维持东亚之持久和平与秩序，增进全亚细亚民族互相关系。为求全亚细亚自由与幸福之最终实现，[JAP.GetNameDef]当担负在亚细亚之使命与责任，尽心支持团结各盟邦与尚未成为盟邦者之反对殖民主义，民族独立之正义王道抗争，以期于将来彻底驱赶帝国主义。\n4.本共同体各盟邦虽有各自独立之财政，但共同体以亚细亚命运之一体为前提，各盟邦间财政必不可毫无干系。[JAP.GetNameDef]既为共同体之枢轴国，暂时全联盟之经济建设之资金悉由[JAP.GetNameDef]筹备运用。\n5.本共同体最高机关称谓理事会，以二十五名理事组织之。\n6.理事会设于东京，并于必要地方另设支部。\n7.理事于总会选举任期志年。\n8.理事长于理事会选举任期一年。"
  JAP_pnr_kg.7c.desc: "$JAP_pnr_kg.7.desc$3.本共同体各盟邦之团结，在于政治经济文化之紧密关系及对于妨害全亚细亚民族解放和独立的共同敌人即西欧帝国主义侵略势力，加以抵制之共同意志。故而各盟邦当将其国防事项暂时悉置于天皇陛下御统帅之下，以[JAP.GetAdjective]最高军事机关为中心掌管，不再另设特别机关。\n4.本共同体各盟邦自有其独立财政，但共同体以亚细亚命运之一体为前提，以全亚细亚民族全体之利益为根本，树立并指导有共同意义之产业贸易及其他重要经济计划为根本原则。[JAP.GetNameDef]既为首席，必将妥善引导各盟邦之经济增长与繁荣，以期实现全亚细亚经济之公正一体化，抵御美欧帝国主义之倾销掠夺。\n5.本共同体最高机关称谓理事会，以二十五名理事组织之。\n6.理事会设于东京，并于必要地方另设支部。\n7.理事于总会选举任期志年。\n8.理事长于理事会选举任期一年。"
  JAP_pnr_kg.7d.desc: "$JAP_pnr_kg.7.desc$3.本共同体各盟邦之团结，在于维持东亚之持久和平与秩序，增进全亚细亚民族互相关系。为求全亚细亚自由与幸福之最终实现，[JAP.GetNameDef]当担负在亚细亚之使命与责任，尽心支持团结各盟邦与尚未成为盟邦者之反对殖民主义，民族独立之正义王道抗争，以期于将来彻底驱赶帝国主义。\n4.本共同体各盟邦自有其独立财政，但共同体以亚细亚命运之一体为前提，以全亚细亚民族全体之利益为根本，树立并指导有共同意义之产业贸易及其他重要经济计划为根本原则。[JAP.GetNameDef]既为首席，必将妥善引导各盟邦之经济增长与繁荣，以期实现全亚细亚经济之公正一体化，抵御美欧帝国主义之倾销掠夺。\n5.本共同体最高机关称谓理事会，以二十五名理事组织之。\n6.理事会设于东京，并于必要地方另设支部。\n7.理事于总会选举任期志年。\n8.理事长于理事会选举任期一年。"
  JAP_pnr_kg.7.a: "亚细亚民族联合起来！"
  JAP_pnr_kg.7.b: "$JAP_pnr_kg.7.a$"
  JAP_pnr_kg.101.t: "经济支援？"
  JAP_pnr_kg.101.desc: "[JAP.GetName]向我们释出了善意，他们打算向我们提供一系列丰厚的支援，因为他们认为我们才是“真正的政府”。虽然他们大概率对所有人都是这么说的，但这毕竟是送到嘴边的利益。"
  JAP_pnr_kg.101.a: "我们当然接受。"
  JAP_pnr_kg.101.b: "[JAP.GetName]一定没安好心。"
  JAP_pnr_kg.102.t: "特别借款"
  JAP_pnr_kg.102.desc: "我们收到了一笔特别借款。"
  JAP_pnr_kg.102.a: "孝敬得好啊，[JAP.GetName]。"
  JAP_pnr_kg.103.t: "鸦片与枪支"
  JAP_pnr_kg.103.desc: "提供鸦片与枪支"
  JAP_pnr_kg.103.a: "我们正好有点资金缺口。"
  JAP_pnr_kg.104.t: "技术投资协定"
  JAP_pnr_kg.104.desc: "提供技术投资协定"
  JAP_pnr_kg.104.a: "科学改变生活。"
  JAP_pnr_kg.105.t: "鼓动正义之战"
  JAP_pnr_kg.105.desc: "他们鼓动正义之战"
  JAP_pnr_kg.105.a: "收复我等固有领土！"
  JAP_pnr_kg.106.t: "军事顾问团"
  JAP_pnr_kg.106.desc: "提供军事顾问团"
  JAP_pnr_kg.106.a: "如虎添翼。"
  JAP_pnr_kg.107.t: "有限的军事干涉"
  JAP_pnr_kg.107.desc: "承诺有限的军事干涉"
  JAP_pnr_kg.107.a: "帮手越多越好。"
  JAP_pnr_kg.108.t: "似乎有些……不对劲"
  JAP_pnr_kg.108.desc: "获得民族精神日本利益"
  JAP_pnr_kg.108.a: "现在断联还不晚。"
  JAP_pnr_kg.108.b: "如果他们继续援助其它人怎么办？"
  JAP_pnr_kg.109.t: "大东亚经济体"
  JAP_pnr_kg.109.desc: "加入日本阵营"
  JAP_pnr_kg.109.a: "我们已变成鹰犬走狗，决不能再陷得更深了。"
  JAP_pnr_kg.109.b: "所谓的国际关系就是走钢丝。"
  JAP_pnr_kg.110.t: "亚洲的爪牙"
  JAP_pnr_kg.110.desc: "完了，全完了，我们彻底沦为了日本的协力国。"
  JAP_pnr_kg.110.a: "为了东亚，一同奋进！"
  JAP_pnr_kg.200.t: "密克罗尼西亚疾驰"
  JAP_pnr_kg.200.desc: "这究竟是上海军基于自身的南进策略而自作主张，还是[JAP.GetAdjective]政府的暗中纵容目前已不得而知。在美国深陷内战之际，日本采取了极为大胆的举动——有一支海军特遣舰队从澎湖马公出发尝试占领关岛。\n\n关岛是马里亚纳群岛的一部分，在美西战争期间被美国占领。马里亚纳群岛的其余岛屿则被出售给德国，并在世界大战期间被日本占领，但最终在战争结束后归还给了德国。\n\n20世纪初，美国在关岛建造了一座加油站、海军陆战队营房和一些岸防炮。然而，华盛顿的政策制定者们怀疑自己在遭遇入侵时保卫关岛的能力，加上与该地区其他大国进行谈判的努力，导致美国未能大规模建设防御工事。关岛被认为对增援菲律宾毫无用处，而且随着美国国内经济局势的恶化，对其进行强化的计划也最终被搁置了，这使得现在的它尤为脆弱。\n\n日本特遣舰队前往关岛的计划很快被[GEA.GetName]在德属罗塔岛的观察哨发现，这使得该舰队被来自加罗林方向的几艘[GEA.GetAdjective]巡洋舰率先迟滞，使得[GEA.GetName]得以同样在新加坡集结一支舰队前往关岛，希望能抢在日本之前“保护”该岛屿。\n\n如今德日两军的部队均已登陆关岛，在三方（[GEA.GetName]、[JAP.GetName]与[USA.GetName]）于岛上短暂的相互交火之后，目前关岛陷入了对峙状态。目前德日两国都在尝试向密克罗尼西亚投放更多兵力，该地区的紧张形势在可以预见的未来将显著升温。"
  JAP_pnr_kg.200.a: "西太平洋正处于悬崖边缘……"
  JAP_pnr_kg.201.t: "德属东亚夺取关岛"
  JAP_pnr_kg.201.desc: "[GEA.GetName]忠诚地履行了他应尽的职责。关岛地区的僵持局势并没有持续太久，在舰载侦察机与一支赶来支援的海军陆战队的帮助下，[GEA.GetName]最终击败了[JAP.GetAdjective]军队，他们并没有受到关岛总督及岛上驻军的更多抵抗，[USA.GetAdjective]驻军人数严重不足，且仅持有轻武器。目前帝国战旗（Reichskriegsflagge）已与三色国旗一同在关岛上空飘扬。得胜的好消息已传回柏林，尽管国会又一次对[GEA.GetName]的“擅自行动”表达了忧虑，但如果没有我们跳过和柏林商讨的快速反应，如今恐怕关岛早已落入[JAP.GetName]手中，而我国的马里亚纳岛链中也将长出一根可怕的尖刺。这足以证明，这些远在柏林的政治家们并不清楚东亚的具体情况，而一味软弱地要求狮子也和他们一样吃草。\n\n帝国的诸国民啊，远离那些无病呻吟者，为这大喜的好消息欢庆吧，且为我等的部队而欢呼吧！上帝庇护强健忠信的勇者，而这勇者正是德意志的众水兵！"
  JAP_pnr_kg.201.a: "甚愿你赐福于德意志！"
  JAP_pnr_kg.202.t: "日本夺取关岛"
  JAP_pnr_kg.202.desc: "一开始是上海军自作主张的袭击，使得[JAP.GetName]内阁不得不应对这一紧张局势，但最终的成果却令所有人都感到欣喜。[JAP.GetAdjective]登陆部队在一场小规模冲突中迫使[GEA.GetName]退缩。或许是收到了新加坡的命令，或许是柏林不愿在亚洲激化矛盾，[GEA.GetAdjective]部队在随后几天便失去了踪影。在德国人离开之后，关岛总督及岛上驻军的抵抗微乎其微，由于美国深陷萧条之中，他们根本无力武装这样一个远方小岛。在几轮交火之后关岛总督便宣布投降了。如今旭日旗飘扬在阿普拉港内，而日章旗也已在关岛总督府上升起，更多驻军正从本土被派遣至关岛维持秩序，并确保[JAP.GetName]的统治。\n\n尽管这只是一场局部冲突，收获的只是一场小小的胜利。但上海军的行为还是立刻受到了民众的赞扬，日本一扫昔日反军和平的阴云，当我们的军队确实地为国家带回真正的利益之时，先前对军人的批评和歧视似乎都消散了。"
  JAP_pnr_kg.202.a: "涤清寰宇，皇道远布！"
  JAP_pnr_kg.203.t: "[638.owner.GetName]控制关岛"
  JAP_pnr_kg.203.desc: "在美国陷入动荡之际，日本采取了大胆举动，派遣了一支海军特遣舰队试图占领关岛。关岛是马里亚纳群岛的一部分，在美西战争期间被美国占领。马里亚纳群岛的其余岛屿则被出售给德国，并在世界大战期间被日本占领，但最终在战争结束后归还给了德国。\n\n20世纪初，美国在关岛建造了一座加油站、海军陆战队营房和一些岸防炮。然而，华盛顿的政策制定者们怀疑自己在遭遇入侵时保卫关岛的能力，加上与该地区其他大国进行谈判的努力，导致美国未能大规模建设防御工事。关岛被认为对增援菲律宾毫无用处，而且随着美国国内局势的恶化，人们希望德国在附近的驻军能够遏制日军的侵略，直至局势缓和。\n\n然而德国也并非是一位友善的朋友，在[GEA.GetName]发现日本人尝试登陆关岛之后，他们也派遣了一支小队登陆了关岛。随着两支部队和关岛驻军三方交火，获得德国保护的希望破灭了。在随后的僵持阶段中，德日两国都在向关岛附近投送兵力，试图将其彻底握在手中。最终，[638.owner.GetName]成功迫使另一方撤退从而控制住关岛，而人数严重不足的美国驻军并非是他们的对手，在用轻武器进行了一系列小规模战斗后选择了投降。现在[638.owner.GetAdjective]国旗已经在关岛总督府上空飘扬，这里已经变成了[638.owner.GetAdjective]领土的一部分，而我们对这一局势无能为力，只能这样看着[638.owner.GetName]耀武扬威。"
  JAP_pnr_kg.203.a: "$japan_foreign_events.226.a$"
  JAP_pnr_kg.204.t: "红，白与蓝"
  JAP_pnr_kg.204.desc: "在过去的几个月中，国际观察家们的目光都聚焦在美国身上。一方面是美国本土因经济危机和政治危机而爆发的一场可怕内战，另一方面则是因美国内战而失去秩序的海外领土，在关岛上，德国和日本正为争夺该岛屿控制权而展开了一场区域性冲突。\n\n这场冲突如今终于以一种意外的情况出现了转机：在过去这段时间中，德日两军在密克罗尼西亚频繁发生海上摩擦，而在关岛之上两边的登陆部队也在进行冲突。尽管局势有时偏向其中一边，但两方最终都未能掌控大局。在菲律宾海附近进行捕捞的一艘[PHI.GetAdjective]远洋渔船并未意识到自己进入了两军摩擦区内，当他们发现并尝试逃避时，其船舱不幸被炮击击穿，这导致了一名船员落水失踪。\n\n事件很快发酵，[GEA.GetName]与[JAP.GetName]都率先指责是对方炮击击中了该渔船。与此同时[AST.GetName]则借机呼吁两国和平解决关岛冲突，在[AST.GetLeader]主导的谈判斡旋之下，柏林和东京达成了一项和解，两国将停止在密克罗尼西亚的敌对行动，[GEA.GetName]和上海军将立刻撤出关岛，包括[AST.GetName]在内的三国将共同确保美国在关岛的正常权益。这场持续约三个月的危机就这样被化解了，但德日两国在可预见的未来里必然将在亚洲及太平洋地区引发更多冲突。"
  JAP_pnr_kg.204.a: "一切毫无变化。"
  JAP_pnr_kg.210.t: "上海谈判"
  JAP_pnr_kg.210.desc: "先前爆发的直系窃听丑闻让包括德意志帝国在内的帝国主义者们抓住了我国干涉中华地区内政的把柄进行了猛烈攻击，这沉重地打击了我国的国际信誉，并让[QIE.GetName]借助国际社会声援他们的声势，再一次就[FNG.GetName]的合法性问题向我方施加压力。然而事情并非总是那么糟糕，先前在危机中包括[QIE.GetName]在内的各方势力似乎只是愤恨于我们将他们的情报转交给[FNG.GetName]这件事，而并非愤恨于我国本身之存在，并在隐隐之中表达了与我方合作的可能。\n\n尽管当前中日之间的关系极为紧张，但尚还没有到必须要通过诉诸战争方能解决的地步。如果我们能通过和平的商谈订立一份条约，绕过先前由美国主导的《上海条约》，从而以最低限度打开中国各区域的市场，实现[JAP.GetName]的经济利益在这些地方的畅通无阻，我们也能凭此反过来压制张作霖和天津军，使其专心于在东北经营利益，而不再去企图中央的位置。对于山海关以南的诸割据势力来说，他们当前最紧要的便是应对自己近邻的威胁，我们正可以从此处入手。"
  JAP_pnr_kg.210.a: "我们只与合法政府对话。"
  JAP_pnr_kg.210.a_tt: "§C我们将邀请中国§Y合法性最高的政府§!参加秘密谈判。虽然我们不能期待与对方的谈判结果会被余剩地区的军阀所接受，但至少我们拥有了与中华最强者之间维持和平的机会。§!"
  JAP_pnr_kg.210.b: "中国的问题很复杂，邀请所有人。"
  JAP_pnr_kg.210.b_tt: "§c我们将邀请§Y所有中国势力§!参加秘密谈判。由于各割据势力和地方军阀诉求不同，我们恐怕不能期待取得任何卓越的结果。但如果这样的奇迹发生了，我们或许可以彻底改变中日之间的关系。§!"
  JAP_pnr_earlygame.1.t: "国会僵局"
  JAP_pnr_earlygame.1.desc: "“关于这一点——”[JAP.GetLeader]拉长了声音，持续几十天的质询已经让他把内容背得差不多了，“政府正在积极与各地的职业绍介所及地方当局展开协调，来缓解刚刚岸井先生提到的城市失业人口问题。为了提供更符合各地区实际情况的支援，政府已经责成有关部门开展研究，在失业问题尤为严重的地区实施临时赈济。”\n\n意料之中，当“钱”这个字再次从他的嘴里蹦出来了之后，重复了几十天的场面又一次上演了。虽然每次议会质询里登场的角色都不一样，不过他们都说着明显串通一气的话：\n\n“我想就首相刚才那番发言以及先前的诸多发言请求一下澄清，”看起来今天负责念这些老问题的是日本科学社会党的山名义鹤，“您从本次常会开始似乎一直以政府提供救济金为当前所有问题的解决方案，嗯，从米谷自治管理法案——‘政府贴补农村米谷收购价格’，国民健康保险——‘以强制缴费和国库补助维持其运作’，然后是今天的都市失业缓解。政府确实有这么多公共预算吗？抱歉有些冒犯，但是据我所知，政府应该还在支持汉城的都市改造计划，要重建都市——”他抬头环顾了一圈议会，确认除了$JAP_pnr_social_conservative_party$之外的人确实都在听他发言，“——可要花费不少钱。恕我冒昧，是因为$KOJ_pnr_kawamura_takeji$是$JAP_pnr_social_conservative_party$的人所以您很大度吗？我想如果您不能解释清楚这些额外公共开支从哪里来的话，我个人可能是没有办法赞同这些计划的。”\n\n山名义鹤坐了下去，然后又立刻弹起来：\n\n“抱歉犬养先生，但是我想大家不想再听您那已经说了快三个月的——”"
  JAP_pnr_earlygame.1.a: "“——规模庞大的都市增税计划了。”"
  JAP_pnr_earlygame.1.b: "“我想解决办法只有增税，别无他法了。”"
  JAP_pnr_earlygame.2.t: "真诚的心意"
  JAP_pnr_earlygame.2.desc: "武藏野町吉祥寺——他在散会之后费了好大劲儿才从社会大众党的人那里搞清楚$JAP_pnr_katsumaro_akamatsu$的住处。这些“新人会”出身的政客似乎都是受虐狂，就算当上了议员也住在普通人的住宅里。不过还好吉祥寺还勉强不算是什么乡下地区，只要坐中央本线就能抵达。登门拜访的礼物是不能少的，先前他在山道襄一那里没取得什么成果，铃木先生说是给国民同盟的诚心和馒头不够。所以这次他准备的足够把盒子挤开一个小尖。而且他这次还拿到了铃木先生的承诺，说是要作为撒手锏使用——政府愿意认真研究一下山口县德山市的新铁路计划，总之无论如何要把$JAP_pnr_katsumaro_akamatsu$和他的日本科学社会党拉拢过来。不过他本人对这件事心里没底，因为久原先生似乎没听说过这条铁路。\n\n不过这都和他没什么关系，他只要负责说动这个书呆子就可以了。整理好情绪，他按了门铃，然后非常真诚地对着开门的，戴着圆框眼镜的白西服男子微微鞠躬。虽然他可比这人年长至少十岁。"
  JAP_pnr_earlygame.2.a: "贸然拜访实在失礼，我是$JAP_pnr_social_conservative_party$的~"
  JAP_pnr_earlygame.3.t: "浪涛"
  JAP_pnr_earlygame.3.desc: "$LEP_sun_chuanfang$把众多华东地区的铁路，甚至包括刚刚开通的浙赣铁路卖给德国人这件事很快就传遍了全中国。如今的孙传芳任谁看了都可以说上一句”汉奸“。而各界知识分子的暴怒很快就转变为从学生团体对此的抗议游行。就像在这片土地上过去发生过的许多不祥事件那样，当学生们开始行动之后，工商业界肯定很快也会卷进来。现在正发生在芜湖的这场抗议正是如此。\n\n由于事件发生后安徽督理$ANQ_chen_tiaoyuan$自诩为”爱国者“，这使得大多数对[LEP.GetName]不满的抗议者都聚集在芜湖市内。随着前来的抗议者越来越多，抗议队伍也变得越来越浩大——换句话说，立场和身份都变得极为混杂。\n\n在中国工团党的支持下，今天下午的这场抗议还有附近德资工厂中的罢工工人参与。而面对此等非常事态，$LEP_sun_chuanfang$自然把一部分德训部队从南京调到芜湖来协助维持秩序——一切对他来说都非常完美。复杂的人员构成使得他并未受到更多盘问，他身为上海市工会干事的身份也并未引起他人的疑心，正是因为他自信自己能够说一口流利的江淮官话才接受了这项任务。况且，即便他受到了怀疑，但谁会拒绝一个带着活动资金来支持他们事业的人呢？\n\n队伍就这样行进着，他和那些愤怒的民众一样高举着白色旗帜，上面用毛笔写着“诛杀卖国贼$LEP_sun_chuanfang$”，口中则和所有人一样怒吼着“打倒列强，反对租界”的口号。随着他们的行进，越来越多的小股抗议者被吸纳了进了这道不可阻挡的洪流。他能看到，能看到那所谓的”德训部队“已被这阵仗吓得双腿发抖，他能看到这些家伙只是一群装备德式军械的土匪。\n\n抗议的队列已经越来越接近那支维持秩序的部队了，两边很快就要产生接触，届时一定会引发肢体冲突。他稍稍放低了那面写着”打倒列强“的旗帜。\n\n并借着白布的掩护抽出了那支预先准备好的FN M1900半自动手枪。"
  JAP_pnr_earlygame.3.a: "“打倒狗汉奸$LEP_sun_chuanfang$！”"
  JAP_pnr_earlygame.3.b: "他们为什么要打架？（关于大陆干涉机制的解释）。"
  JAP_pnr_earlygame.4.t: "北海道"
  JAP_pnr_earlygame.4.desc: "虽然令人意外，不过事情似乎还是谈成了：$JAP_pnr_katsumaro_akamatsu$那天很开心地收下了馒头，当然也收下了铁路，临走之时还给他和$JAP_pnr_social_conservative_party$道谢。在二人讨论的时候，$JAP_pnr_katsumaro_akamatsu$对他提出的每一项“诚心”都表示了“支持和感谢”，并且也说会“出于民众利益重新考虑在议会中的站位”。在他把这一系列积极信号汇报给党之后，这至少让$JAP_pnr_social_conservative_party$重新看见了一丝法案通过的希望，不过这种期待很快就转化成了失望。\n\n今天稍早些时候，一位日本科学社会党的议员在喫茶店与$JAP_pnr_social_conservative_party$成员见面时，非正式地传达了他们的想法：科学社会党依然不会支持现行法案。除非$JAP_pnr_social_conservative_party$愿意修改一开始提出的增税案，对财阀资本课以更重的累进税，而不是从手工业和杂业的一般从业者身上想办法去补贴农村地主的话——或许科学社会党还会考虑一下是否要选择“弃权”。\n\n另外，$JAP_pnr_katsumaro_akamatsu$还托这位党员传达了另一条消息：\n\n他是北海道选区的代议士，不是山口县的。"
  JAP_pnr_earlygame.4.a: "就不该让和尚的儿子进议会！"
  JAP_pnr_earlygame.5.t: "天皇敕命"
  JAP_pnr_earlygame.5.desc: "帝国议会常会即将闭幕，然而犬养内阁在今次会议上提出的诸多法案竟仍在审议之中。今天依旧是同一出剧目的上演，不同之处在于先前一直维持沉默的陆海军大臣们也加入了战斗。军队势力开始挥舞起讲稿，开始主张要修改持续了近十年的实质军缩政策，不过就像往常一样根本没人理他们，而且常会即将闭幕，他们现在跳出来也没什么作用。\n\n1926年犬养内阁上台之后便一直以“不列颠革命”和民间高涨的反战情绪为由来削减国防预算，使得海军的造舰计划也陷入停滞——不过这一切都是因为陆军当初头脑一热联手内阁一起打压海军导致的。在中东路事件之后，[JAP.GetName]在[FNG.GetName]取得的利益更是没有当时陆军大臣吹嘘的那么大，关东军为了中国人的铁路和俄罗斯人拼死奋战，最后换来的是[FNG.GetLeader]坐在沈阳政府里把关东军顾问们每天骂的像是孙子。一车又一车的枪支装上货船运往奉天，以极为廉价的价格白送给了这位盘踞在中国东北的老帅。这场毫无利益的军事冒险使得陆军步了海军后尘，也成了民间攻击军队的素材。\n\n不过这都不再重要。毕竟等今天结束，犬养内阁因为执政失败而倒阁便是显而易见的了。至于$JAP_pnr_inukai_tsuyoshi$本人，看起来是放弃挣扎了，正在自己的椅子上闭着眼睛数算最后几分钟。\n\n然后时间到了，常会结束了——直到宫中的使者出现之前，在野党都是这么想的，那位使者携带着从宫城带来的敕命，上面列有犬养内阁所有国务大臣的副署。\n\n朕兹将帝国议会之会期延长二十一日。"
  JAP_pnr_earlygame.5.a: "现在来了。"
  JAP_pnr_earlygame.5.b: "宫中的阴谋……"
  JAP_pnr_earlygame.6.t: "坐渔庄的访客"
  JAP_pnr_earlygame.6.desc: "远远看去，骏河湾的水很浓稠，恐怕容不得任何一条鱼自由游弋。$JAP_pnr_inukai_tsuyoshi$向计程车司机致谢，把多余的零钱留给他之后便下了车。静冈县兴津浸在红豆沙的味道里，虽然正月即将结束，但依然有店铺在卖杂煮，而且说到兴津的糕点那必然是作为“献上铭果”的宫样馒头——可惜购买伴手礼只是他回去时的目的，而非他来这里的目的。\n\n八十岁的老人站在了坐渔庄的大门前，侍者早已等候多时，很快便将他引入内室与主人交谈。\n\n“政友会内部，以及《普通选举法》之后情况的复杂怪奇，实在是使我不能胜任。”$JAP_pnr_inukai_tsuyoshi$在简单的寒暄之后直入正题，帝国议会常会即将结束，如果$JAP_pnr_social_conservative_party$连一项法案都无法取得成果，恐怕会有有心之人讥笑政党内阁之无能，“我想本来《普通选举法》和田中义一的事情后就该离开了，但实在是世论尚不容我就此退去，至今也有十年了。没有做出什么值得称道的大事，还发生了中东路那样的事，辜负了陛下的圣意，也有损国民之所托，实在惭愧惭愧。”\n\n“所以我想”，得到了对方点头之后，$JAP_pnr_inukai_tsuyoshi$继续说，“不能因党争而令国家预算与必要法律都无法处理。如果可以的话，内阁想奏请至少延长会期，令我竭力处理，议会闭会后，我亦当对今日政局有所善处。您以为如何？”\n\n对方自然理解了他的意思。“以内阁总理大臣之见，”最后的元老，$JAP_pnr_saionji_kinmochi$的语调里流露出舒缓和放松的气氛，“闭会之后，谁能担此大任？”\n\n所谓的坐渔庄，其含义正是“希望能悠闲地坐着钓鱼度过余生”——$JAP_pnr_inukai_tsuyoshi$临走之前还是决定吃一碗杂煮——至于鱼儿们都一股脑地往这里游过来，则是另一件事了。"
  JAP_pnr_earlygame.6.a: "“铃木喜三郎久历官界，由他收拾政局应当稳妥。”"
  JAP_pnr_earlygame.6.b: "“久原房之助久历实业，想必能于民生有所振作。”"
  JAP_pnr_earlygame.6_tt: "§c$JAP_pnr_saionji_kinmochi$将参考我们的意见。与此同时，$JAP_pnr_social_conservative_party$内部也会§R记住§!我们的答案§!"
  JAP_pnr_earlygame.7.t: "关切"
  JAP_pnr_earlygame.7.desc: "这可是件稀奇事，就在那份宣布帝国议会会期延长的敕命发布之后，内大臣斋藤实就向各政党（除却$JAP_pnr_social_conservative_party$和$JAP_pnr_syndicalist_party$）领袖发来了邀请，希望能就最近议会中的僵持情况展开一场个人性质的恳谈。既然是“私人”，那就没什么合适的理由拒绝，于是大家就这样齐聚在永田町二丁目的幸乐（Koraku）料亭。用过牛肉和御酒之后，这位海军出身的内大臣便发话了：“诸君都是帝国议会中的议员，受国民之付托，相信各位都明白，帝国议会之设立，乃是为传达国民之声音，协赞天皇陛下立法吧。”得了众人捧场的肯定之后，他便继续说：“内阁之存亡不能使国家政务废弛，也不能令民众对宪政之诸党灰心，我想在座的各位也都认同吧。”随后又是捧场的肯定，不过声音小了些，可见这些话是一剂极强的醒酒药。\n\n“近日众议院的一些事也传到了宫中，我个人也是听到了一些议论，犬养总理毕竟年事已高，而我国之必要政务又久滞于议场。我个人对此甚为关切，因此才冒昧请诸君今日过来，想听听各位的意见。各位觉得至少就预算案这种施政必要之法案，是否还有要商榷的地方？”“斋藤子爵，”最先发言的是代替社会大众党的安部矶雄前来的社会大众党书记长，$JAP_pnr_hisashi_aso$，“我党非常认同，议会之政争不可令国政废弛，也不可伤害民众对议会政治之信心，因此若当前内阁就那些胡来之工会法案、都市征税等议案松口，我党无意妨碍必要法案通过。”“我党也抱持如此想法，况且先前$JAP_pnr_social_conservative_party$所提议之米谷自治法案并非不能再做商讨，如果政友会愿意交换法案，$JAP_pnr_authoritarian_democrat_party$自然乐意助力。”“民众既然以我党为总代表，我便必代表人民之意愿在议会中战斗，”现在是$JAP_pnr_katsumaro_akamatsu$的发言时间，“为人民之根本福祉献身，我党全心全意支持必要议案通过。至于关于铁路，矿业以及健康保险组合之事，也始终欢迎$JAP_pnr_social_conservative_party$与我党对话，共谋社会之总体福利。”\n\n恳谈进行得很顺利，内大臣已确定各在野党都愿意合作。不过情报都是双向的，值此机会，攻守易形——“斋藤子爵，既然如此，椅子的位置是否已经有眉目了？”\n\n这才是他们真正想知道的东西，斋藤实很清楚这一点，当然这也是他搞不清的地方,$JAP_pnr_market_liberal_party$才是议会内的第二大党，那些小党派死心塌地地跟着他们一起对$JAP_pnr_inukai_tsuyoshi$进行倒阁又有什么利益呢？"
  JAP_pnr_earlygame.7.a: "“据我个人所知，是为民众谋利益的笃实之人——”"
  JAP_pnr_earlygame.8.t: "御下问"
  JAP_pnr_earlygame.8.desc: "“如此听来，犬养内阁恐已陷入困难，再不能维持政府了吧？”听到垂问，斋藤实立刻回答，“是，诚如圣虑，尚有多案未决，其中亦有施政必要之项。关于内阁总辞之事，还是西园寺公最为详悉。”“陛下，$JAP_pnr_inukai_tsuyoshi$等希望能请陛下降下敕命，延长会期二十一日，妥为处理诸般必要议案。”\n\n“内阁所奏，朕已知晓。既然为必要之故，朕以为可以。斋藤，便先将此意传与犬养，余下手续照例办理吧。”听到这话，斋藤实也知道是时候了，他站起身：“失礼了，那我便先退席去通知各国务大臣。”在得到了那坐在另一侧的“嗯”的一声之后，他就这样把局面留给了二人。\n\n“实在地说，我非常担心如果犬养倒台了，这些法案要怎么处置。”他调整了一下坐姿，语调也一扫先前的严肃，“西园寺公怎么看呢？$JAP_pnr_inukai_tsuyoshi$先前和你聊过……真的不能挽留吗？”“陛下，如今这种情况，犬养既然已有退意，若因圣眷而强使其留任，恐怕反而有损政局稳定。”\n\n“西园寺公觉得举荐谁比较好？”今上天皇站起身来，“犬养的意思是希望政友会的其他人来接替，”$JAP_pnr_saionji_kinmochi$也起身，“陛下有什么想法吗？政友会于您而言还算满意吗？”\n\n“前几天在打高尔夫的时候，”他把手支在桌子上，“近卫和我说了众议院不得了的事情，他们都联起手来要把$JAP_pnr_social_conservative_party$拉下台。所以我也从他那里听到了一些内容，我对$JAP_pnr_inukai_tsuyoshi$倒是没有特别的意见，他尽职尽责，但是$JAP_pnr_social_conservative_party$的其他人似乎都酷爱认养义子，搞政治靠山，实在令人担心。他们要是想想文正政变，就知道这么搞下去肯定要有大事发生。”\n\n“反过来再看看$JAP_pnr_market_liberal_party$那边，我听说他们党内大搞总裁专制，实在未必是什么政党政治的好事，不过总要比兄弟阋墙要好太多。西园寺公认为呢？”这番好恶表述，$JAP_pnr_saionji_kinmochi$当然清楚个中玄机，也自然能揣摩圣意拟好人选，“臣以为——”"
  JAP_pnr_earlygame.8.a: "$JAP_pnr_suzuki_kisaburo$可任此责。"
  JAP_pnr_earlygame.8.b: "$JAP_pnr_fusanosuke_kuhara$可任此责。"
  JAP_pnr_earlygame.8.c: "$JAP_pnr_hamaguchi_osachi$可任此责。"
  JAP_pnr_earlygame.9.t: "解冻"
  JAP_pnr_earlygame.9.desc: "帝国议会自意外延长会期以来议事速度骤然加快，二十一日间取得的进展已超过此前数月。看来此前困扰议场的诸多原则问题，也并非全无商量余地。此前始终态度强硬的各在野党，近日亦相继转向合作，开始以积极姿态支持$JAP_pnr_social_conservative_party$的多项提案，虽然偶有冲突和争执发生，但再也没有先前的那番僵局了。\n\n政界一部近来盛传，此次延长会期乃是因犬养内阁得到宫中支持，准备继续执政，对此政府及宫中方面均未作明确说明。谈到通过的诸多提案，其中最受瞩目者，是昨日通过的《米谷自治管理法案》修正案，在经过漫长的拉锯战之后，该法案现在除补贴米价之外，还增列自作农扶助及限制部分小作料上涨的条款。\n\n议会现已通过了该法案，意在缓解受到了朝、台两地大米输入后一蹶不振的我国农业市场，以救济经营日益困难的稻作农家。先前本报就此采访了农林大臣，内阁似乎笃信这些措施能够改善小作农经营状况，缓和近年来日趋尖锐的农村矛盾。\n\n就在现在帝国议会中还在就预算案展开商讨，如今预算案简直像是在刚过去不久的正月里的各位所吃的杂煮那样，各政党都向其中塞入了大量内容。于我国国民而言值得注意的有国民健康保险的补贴和职业绍介的补贴，虽然目前预算案仍处于草案状态暂未审议通过，但院内普遍认为通过已无重大障碍。"
  JAP_pnr_earlygame.9.a: "《东京日日新闻》讯"
  JAP_pnr_earlygame.10.t: "休止符"
  JAP_pnr_earlygame.10.desc: "今天是帝国议会常会的最后一天，而$JAP_pnr_inukai_tsuyoshi$则在议事即将告终时主动起身。\n\n“诸君”，他尝试吸引那些没注意到他起身的议员的目光，“本内阁已于今日开会以前，向陛下捧呈各国务大臣辞表。”\n\n这件事稍晚些时候传到了议会之外，而媒体们得知这件事之后也自然引发了不小骚动，但现在对于帝国议会中大多数议员来说这消息与其说令人震惊，不如说终于证实了此前的猜测。不过也有他们不知道的事情：按照近年的惯例，内阁一经总辞职，宫中便会就后继首相下问元老$JAP_pnr_saionji_kinmochi$，被视为继任人选者在经$JAP_pnr_saionji_kinmochi$的奏荐后就会被天皇陛下召见以降下大命组阁，按照时间推算，这位候选者应该正在四处物色阁员。对这些议员来说，他们大多只能确定自己不是新首相，也大抵不在新内阁的名单内。不过这个问题也会在今天解决——只需要检查一下门口的登记表，确定谁没有出席今天的常会就能确定了。\n\n当然也不必现在就跑到门口去翻那本册子，因为$JAP_pnr_inukai_tsuyoshi$既然在这个时刻宣布，那就说明时间上其实差不多了，很快书记官从议场外带回了宫内省方面刚刚传来的消息："
  JAP_pnr_earlygame.10.a: "是那个检事总长出身的家伙……"
  JAP_pnr_earlygame.10.b: "企业家怪人来了吗……"
  JAP_pnr_earlygame.10.c: "$JAP_pnr_hamaguchi_osachi$，议会里要有变化了。"
  JAP_pnr_earlygame.11.t: "与下一乐章"
  JAP_pnr_earlygame.11.desc: "“以上，就是今天关于满川先生的部分，”男人把稿子放在桌台上，环顾了一下在座的听众们，“满川龟太郎先生对我国的惆怅和对被夺去的亚细亚的悲痛就是这样——这也是为何在二十年前我和满川先生与北先生等志同道合的人组成了‘犹存社’。各位请看，即便是在今日，耀武扬威的欧罗巴诸国也依旧以对待奴隶的凶暴将亚细亚踩在脚下。从[HND.GetName]到[TRK.GetName]，亚细亚人因国家的弱小而受到列强们轻侮，所以他们也开始以运动让自己的国家强盛起来。诸君！此刻正值亚细亚诸民族大苏醒之时，与此同时我们[JAP.GetAdjective]民众在做些什么呢？作为亚细亚先驱者的[JAP.GetName]的口号是什么呢？战争打倒！军队打倒！野蛮打倒！——诸君，今日街头报纸上，不正充斥着这样的声音吗？这也是我一直向各位强调的，也是在讲演开始以前，$JAP_pnr_ishiwara_kanji$大佐提到的问题：国民们感染了一种懈怠的疾病，开始提倡一种令人不安的主义。国民和内阁开始相信，只要[JAP.GetName]丢掉宝剑，折断长弓，欧罗巴诸国便会因此信任[JAP.GetName]。就算是[TAI.GetAdjective]的民众，也要为了自己的投票权而和总督府展开斗争。而我国国民正把无力视为有力，把屈服视为胜利。”他敲了敲桌子，然后目光扫过眼前这些人的肩章。\n\n“一个连自己都无力保卫的[JAP.GetName]，一个为了虚假和平就主动放弃力量的[JAP.GetName]，又有何颜面自称亚细亚民族的先驱，诸民族之中的大盐平八郎？我国国民不再相信诸君这些承担国防之人，他们的行动不可不谓是一种思想上的迷误。但要如何医治这种迷误，各位或许可以稍后在休息时畅所欲言，共同讨论。现在请永田少将继续。”然后他张开手臂，一如雄辩家那般以动作拥抱了在场的所有听众，$JAP_pnr_okawa_shumei$，在一众佐官的鼓掌声中结束了他在九段的军人会馆中的演说。他当然也没忘记向那位慷慨邀请他的人致意，虽然那人今天并未到场，不过作为“圣师”，其还是派来了自己的使者。"
  JAP_pnr_earlygame.11.a: "然后是特里斯坦和弦。"
  JAP_pnr_earlygame.12.t: "我国对[EGY.GetName]出口创新高"
  JAP_pnr_earlygame.12.desc: "在刚刚过去的1935年，我国大阪港的入港船达20万艘、货物吞吐量达2864万吨，创下了有史以来的最高纪录。而这场“大阪港繁荣”本身便是我国出口贸易逐渐恢复的缩影。在迅速扩张的海外市场中，[EGY.GetName]尤其引人注目。\n\n在过去一年里，我国对[EGY.GetAdjective]的出口总额大幅突破，从纺织品到各类轻工业日用品，日本制造正在迅速进入其城市与乡村市场。也正是在1935年，我国已成为埃及王国的第一进口来源国。\n\n回顾世界大战时期，我国大量产品都出口至因战争而陷入日用品生产不足的欧洲国家以及大洋彼岸的[USA.GetName]，但随着《凡尔赛条约》和《青岛条约》的签订，我国失去了原先的大量海外市场，[GER.GetName]以及象征着其经济力量的中欧同盟将世界经济牢牢把握在手中，[GER.GetName]因[JAP.GetName]曾参与世界大战而借助中欧同盟的贸易政策压缩日本商品的市场空间，并要求各加盟国对我们实施进一步贸易禁运，即便是在与我国工商业界素有密切关系的东亚市场也一边借助[GEA.GetName]掌握住马六甲，对我们多加干预，另一边则花费大手笔扶植起[QIE.GetName]与[LEP.GetName]作为德国亚洲经济圈，蚕食我们在大陆的经济利益。\n\n然而我们并非彻底失去了欧洲市场，中欧同盟中具有独立性的加盟国，如[AUS.GetName]和[OTT.GetName]热衷于继续维持广泛的国际贸易，也不愿割舍我国以低廉价格和相当品质见长的产品。我国商品得以经这两国的转口贸易进入中欧同盟，从而在世界经济中得到了边缘但依旧有分量的地位。另一方面，我国也积极寻找其它潜在市场，[EGY.GetName]及[SOM.GetName]等非洲国家成为了大战之后我们的新兴市场，他们急切地需要将拥有的资源交换为可用的商品。可以说世界大战结束之后失去大量出口国是我国经济陷入战后危机的原因之一，但多亏了这些新晋交易伙伴，[JAP.GetAdjective]出口经济才能取得缓慢的恢复。"
  JAP_pnr_earlygame.12.a: "而我们就要向过去的灰暗告别了。"
  JAP_pnr_earlygame.13.t: "Confidence/Complication/Control"
  JAP_pnr_earlygame.13.desc: "下午做好的御手洗团子还剩下大半盘，再回过头看看玻璃柜里，确实没有什么值得重新码放整齐的东西。她探出头去左看右看，大家也都阴着脸，不像是对这家店的团子有兴趣的样子。而且母亲也抓着湿布过来，把几分钟前擦过一遍柜台又擦了一遍。既然这样，自己最好还是不要在前面添乱了。想到这里，她钻到了后门边，把那一捆预先初步处理过的细竹条压在两腿上，右手握住刀柄，左手则捏着竹条，用肚子抵住后端向前发力推削。然后是把刀反转过来，用刀背刮擦几次，一根用来穿团子的光滑竹签就这样做好了。\n\n不过削竹签不耽误她听声音，首先是自行车的车铃声，从远到近再到远，没有停歇的意思；然后是几个学生，也就这样走过去了——随后是隔壁里屋男人的声音：“昭和二年都挺过来了，怎么今年挺不过去！”这声音好大，就算是在店门口感兴趣的客人，听到这一声也只能飞快地逃离了吧。那个声音也是意识到了刚才的失礼，也可能是女人用湿布不停地拍打他的手臂发出的“啪啪”声警告他小点儿声音，于是又变成那个极细极细，温和的父亲的声音。\n\n“那末……如果去申请破产的话你们都要受苦，我想另一个出路就是生命保险了，之前有买过的明治生命现在就能用上。”竹签已经削好了，她就这样踏得很重地走到前面，侧身弯下腰去拾那些团子。下午做好的御手洗团子和之前一样，还剩下大半盘。\n\n然后她回过头去，那个玻璃柜也是和之前一样，依旧空荡荡地什么都没有。"
  JAP_pnr_earlygame.13.a: "“不要这样讲……死这种事，什么时候都能办到的，好不好？”"
  JAP_pnr_earlygame.14.t: "公债带来恢复"
  JAP_pnr_earlygame.14.desc: "[JAP.GetName]在过去十年中的经济恢复全要仰赖$JAP_pnr_inukai_tsuyoshi$内阁的大藏大臣高桥是清的“积极财政政策”，他将赤字公债作为刺激剂实现了国家贸易产业的复苏，但同时也为如今的“黑色星期一效应”埋下了隐患。“积极财政政策”是一种依靠经济增长逐步消化既有赤字的特别财政政策，在目前各国因衰退而纷纷提高贸易关税壁垒，海外市场萎缩的当下，最好的选择自然是继续延续积极财政，但在过去十年中积累下来的庞大赤字公债使继续增发已无太大空间。\n\n[JAP.GetLeader]的内阁刚刚组成便遇到了这场经济上的考验，从目前经济危机在全球范围内的蔓延速度来看，在未来几周内坏消息只会越来越多。但它对[JAP.GetName]来说是纯粹的坏事一桩，可对内阁来说情况却不同。假使内阁能够妥善渡过此次危机，那么就能奠定自己在国民中间的威望，同时向宫中势力展示自己的实力。在博得宫中和国民的信任之后，想要推行什么政策都会少很多阻力。\n\n本届$JAP_pnr_social_conservative_party$内阁的大藏大臣，先前与高桥是清观点一致的$JAP_pnr_fujii_sadanobu$在今天稍早些时候确定了紧急特别经济计划：内阁本无意继续扩大发行公债，因为目前日本银行的公债消化率已从先前的99%降至约80%的水平；但受到时局所迫，大藏省决定在今年以不超过上一年度财政自然增收额为限，额外发行特别债券，并由此在帝国各地开展大规模公共工程。除了延续高桥时期的财政政策外，$JAP_pnr_fujii_sadanobu$还提出基于世界大战期间的“战时利得税”制度设立“时局匡救临时利得税”，向获得超额利润的法人与个人征收超额部分约11%的税款，以避免政府财政因增发公债陷入困难。当然，关于增税这件事自然在社会上收获了不小的抗议声。"
  JAP_pnr_earlygame.14.a: "我们应该将所得资金投入消费品生产。"
  JAP_pnr_earlygame.14.b: "拉动军工产业需求有助于我国国防。"
  JAP_pnr_earlygame.14.c: "召集各财阀总裁和实业会头，和他们洽谈。"
  JAP_pnr_earlygame.15.t: "败者退场"
  JAP_pnr_earlygame.15.desc: "在[JAP.GetName]那失去的十年中，$JAP_pnr_inukai_tsuyoshi$内阁的大藏大臣高桥是清一意孤行，以赤字公债这种毒药作为刺激剂，滥用政府的财政信用来大肆进行产业拯救和大规模公共工程。表面上将我国带出了经济恐慌，却在如今的“黑色星期一效应”前暴露了其政策的失败性。不尊重市场规律，给那些毫无竞争力的失败企业续命，以及借助公共工程创造虚假繁荣最终引发了今日的混乱。\n\n[JAP.GetLeader]的内阁如今将修正大藏省过去十年所滋养出的“国民经济之癌”。“黑色星期一”是一场经济上的考验，某种意义上可称是本届内阁的“飞来横祸”，但这也是一个机会，证明$JAP_pnr_market_liberal_party$长期以来坚持的市场自由主义政策才是真正正确的道路，倘若内阁能妥善处理这次危机的话，在元老和宫中的赞许下复现过去十年里$JAP_pnr_inukai_tsuyoshi$的长久执政也并非是一种幻想。\n\n本届$JAP_pnr_market_liberal_party$内阁的大藏大臣$JAP_pnr_tsushima_juichi$认为在当下继续增发赤字公债是最简单的方法，但若真计划令日本经济正常化，则最好借助这次经济危机实现一场“经济更新”，将那些长期以来依赖国家财政支援的不良企业悉数出清，或令其被市场中更有活力的大企业集团并购。在此过程中政府只要确保作为市场财政最后防线的银行处于稳定，并且偶尔支援那些因出清过程被连带误伤的优质企业，那只看不见的大手就会摸来摸去地把一切都安排好。\n\n$JAP_pnr_market_liberal_party$一贯坚定地认为市场能够进行自我调节，提出类似计划也在情理之中。除了这项刷新国内经济状态的计划之外，内阁还希望借此机会扭转过去十年中因滥发公债所形成的奢侈浪费风气。为了厉行节俭，$JAP_pnr_market_liberal_party$还准备实施官吏减俸计划，虽然该计划尚未公布，但想必一定会遭到政府内的强烈反对……"
  JAP_pnr_earlygame.15.a: "在这种危机之下，还能维持正常生产的企业最重要。"
  JAP_pnr_earlygame.15.b: "一些拥有先进技术，潜力更大的企业值得稍稍保护。"
  JAP_pnr_earlygame.15.c: "值此机会积极促进各财阀进行产业并购。"
  JAP_pnr_earlygame.15_tt: "通过借助这场经济危机人为地对不良企业进行出清，我们或许将§m更快地§!从这场经济危机中脱身——代价是社会的§N稳定度§!。在我们走出经济危机后，将获得："
  JAP_pnr_earlygame.16.t: "$JAP_pnr_fujii_sadanobu$辞职"
  JAP_pnr_earlygame.16.desc: "尽管我们延续了先前的财政政策，但社会经济却并非如我们想象的那样立刻展现出强劲的恢复势头。似乎是市场已经对我们持续十年的经济刺激陷入疲劳了，幸运的是情况没有变得更糟，或许可以称为“缓慢温和的复苏”。更糟的情况发生在现任大藏大臣$JAP_pnr_fujii_sadanobu$身上：他选择辞职。在不久前的一次预算内阁会议上，$JAP_pnr_fujii_sadanobu$可怜兮兮地对农林省称“下属不肯让步，我也没办法”，随后又重重地咳了几声，从而回绝了他们要求修改“时局匡救临时利得税”的抗议。$JAP_pnr_fujii_sadanobu$身体一向不好，这一点在政府中人尽皆知，而他本人也时常会利用这一信息来作为筹码，巧妙地在财政问题上促使各方让步。\n\n大家本以为这一次依然是$JAP_pnr_fujii_sadanobu$本人的演技，但在会议结束后，大藏大臣本人在下楼梯时突然失去意识，滚落到楼梯底部。在经庆应义塾大学医院诊断后，医生认为从楼梯滚落并没有对其身体造成多大伤害，但他先前罹患的鼻窦炎和支气管扩张已进展到极为严重的程度，建议他入院接受治疗。他本人在随后于意识清醒的情况下辞去了大藏大臣的职务，目前该职务由高桥是清子爵接替。高桥将接力棒交给了$JAP_pnr_fujii_sadanobu$，而如今他又将其交还给了高桥，这不可不谓是一种命运。可以见得的是，高桥子爵将继续延续该财政政策，彻底将日本经济带向新的未来。"
  JAP_pnr_earlygame.16.a: "命运的安排，真是感人。"
  JAP_pnr_earlygame.16.b: "我是说有没有可能……"
  JAP_pnr_earlygame.17.t: "关闭工具箱"
  JAP_pnr_earlygame.17.desc: "内阁使出浑身解数解决“黑色星期一”的烂摊子，目前来看只是遏止了经济的下落，并在赤字公债的刺激下透露出一些恢复的势头。稍早些的会议中，高桥子爵严厉回绝了额外增发公债的建议，他认为如果继续增发公债，[JAP.GetName]将陷入恶性通货膨胀，到时候就不是内阁总辞职就能轻描淡写地解决的问题了。无论如何，[JAP.GetLeader]希望借助这次危机做出耀眼政绩的计划失败了，但这也怪不得他，毕竟“黑色星期一”完全是飞来横祸，自己只是在$JAP_pnr_inukai_tsuyoshi$倒下之后不幸地遭到命运碾压的可怜人罢了。虽然这次可能得不到元老$JAP_pnr_saionji_kinmochi$的肯定，但比起弄巧成拙，现在接受高桥子爵的建议，什么都不做就绝不会错，实在不行的话就说是高桥的主意就可以了。"
  JAP_pnr_earlygame.17.a: "接下来，交给市场……"
  JAP_pnr_earlygame.17.a_tt: "我们的经济状态每过60天都会好转，直到彻底恢复正常。我们将因我们的§Y财政选择§!得到对应的增益。"
  JAP_pnr_earlygame.18.t: "$JAP_pnr_tsushima_juichi$退场"
  JAP_pnr_earlygame.18.desc: "内阁的自由主义财政政策在社会上引发了零星恐慌，随后而来的一系列变化则证明这些恐慌是合理的：虽然从数据上看当前经济仍在掌控之中，但社会上已经因倒闭潮而出现了不满的声音。政府内部的情况也完全不容乐观：在受到各方官僚的口水围攻之后，$JAP_pnr_market_liberal_party$撤回了他们的官吏减俸计划，当然与此同时被撤回的还有$JAP_pnr_tsushima_juichi$本人。\n\n今晨稍早些时候，社会团体“勤俭工人和平会”——该团体由一群混迹于特殊喫茶店的无业游民，或称为“壮士”的人组成，可以说其日常行动基本与组织名大相径庭——发动了一场针对当前内阁的骚扰，他们攻占了$JAP_pnr_market_liberal_party$的一座党报印刷厂，并同时包围了$JAP_pnr_tsushima_juichi$在东京的住宅，要“替天行道”，要求内阁取消现在施行的财政政策。总而言之，$JAP_pnr_tsushima_juichi$已在刚刚让别人捎来了他的辞职信，现在井上准之助承担起了大藏大臣的职务。井上先生对我国经济多有关切，且长期以来一直与$JAP_pnr_market_liberal_party$交好。井上先生在本次紧急上任时也带来了此前准备好的许多政策草案，同时向政府官僚宣布将确保取消减俸计划，该计划也不会以任何形式再次推出。井上先生还谈到，在经过研究后，他准备对现有的财政政策进行一些修改，从而真正实现日本各项产业的振兴。"
  JAP_pnr_earlygame.18.a: "井上准之助会收拾残局。"
  JAP_pnr_earlygame.18.b: "不良资产被出清了。"
  JAP_pnr_earlygame.19.t: "飞出窗外"
  JAP_pnr_earlygame.19.desc: "社会会怎么评价$JAP_pnr_market_liberal_party$的执政呢？对于那些偏向杂论的报纸，对采用了这样雷厉风行的经济更新政策的内阁想必没法给出好评价，但像是《日本工业新闻》这样偏向财经政策的报刊想必能看出内阁的良苦用心吧，[JAP.GetLeader]之所以没买别的报纸正是出于这个原因。所以展开新印的报纸，就能在头版头条里找到对政府的评价——杀人犯！\n\n[JAP.GetLeader]立刻就把报纸从窗户丢了出去，但想了想总归还是觉得不对，所以几分钟后，那几张沾了点尘土的纸片就又妥善地出现在他的桌子上了：自$JAP_pnr_market_liberal_party$施行经济更新政策之后，本就蒙受“黑色星期一”影响的企业主们更加不堪重负，每日都有破产者，坠楼者，自缢者，可谓说当今内阁乃是以看不见的大手捉着经济利刃的，最凶恶的刽子手。而破产的诸多中小产业则被各路大集团以极低的价格收购，使得本报不禁脊背发凉，如今内阁是否已和各大财阀资本勾结，共同搜刮国民之财富？\n\n这下可好了，想必元老$JAP_pnr_saionji_kinmochi$也看到了这篇报道，延续十年内阁这种梦想如今还是不要追求了，当务之急是再延续十天内阁才是。[JAP.GetLeader]像狮子一样咆哮着离开了办公室，寻找$JAP_pnr_inoue_junnosuke$的踪迹。"
  JAP_pnr_earlygame.19.a: "然后自由落体。"
  JAP_pnr_earlygame.20.t: "浮华世界"
  JAP_pnr_earlygame.20.desc: "东京丸之内，晚上六点一到，铜鼓、喇叭、低音提琴，凡是爵士乐用得上的便应有尽有地往室内送。马尼拉的乐手们是东京最炙手可热的商品，尤其是在“黑色星期一”之后价格较往常更便宜。与此同时一箱箱千疋屋的鲜果从侧门送进后厨，榨剩的果皮与残渣又从另一边运到——我也不知道去了哪里。据我所知，俱乐部的后厨里有从芝加哥电气制造公司处买来的电动榨汁机，只需要把切好的半只橙子往旋转的瓷锥上按个几百次就能轻松准备好许多“健康饮品”。我好像还没介绍我是怎么到这里的，简单来说和大家都差不多，是车子自动把我带到这里的。下车之后穿过我那些被小孩子缠上的年轻同僚——总归是卖些小铅笔，日用品以及别的什么奇异小玩意，他们只消三言两语，把大家创业初期的回忆勾起来就能赚得满载而归。\n\n穿过俱乐部的大门，由于没有镜子我也只能凭感觉纠正一下领结。然后你就可以看到那些说话似乎总是含着一口气，在这种场合坚持穿传统和服的一群老人和未老先衰的年轻人。他们的大王是那个造了22辆“A型车”，结果自己依然开意大利飞雅特轿车的家伙。而我们这些还没编好“祖训”的晚辈后生们的国王似乎还没出场。等到那辆达特桑十四型稳稳地停在日本工业俱乐部会馆门前，这位新世界的君主便走下汽车，会馆楼顶的灯光照亮了那对拿线轴和铁锤的裸体男女，也在他面前的台阶上撇下了一道阴影。\n\n不错，我确实认识他。他是工业俱乐部里的那些穿和服的人眼中的瘟神，也是酷爱洋服的大家最喜爱的人。他是我们这些人的首领，$JAP_pnr_aikawa_yoshisuke$，那个利用“不齿手段”，把企业卖给所有人而不是留在家族里的家伙。"
  JAP_pnr_earlygame.20.a: "桌上再放下一枚桂马。"
  JAP_pnr_earlygame.21.t: "雀刺（Suzumezashi）"
  JAP_pnr_earlygame.21.desc: "他坐在那里一脸紧张，身上穿着的藏青色立领冬装，以及袖口的那条山形纹和圆环让所有看到他的人都能意识到此人是个海军少尉，还是个预备役的。那他出现在这里就更奇怪了，因为这里是三宅坂的陆军省调查班，而军令部在霞关，此人总不能是坐路面电车坐过站了吧。田中清听到这个消息时心中疑惑，而推开门看到他时则彻底陷入了混乱，这要比他第一次去参见“圣师”时还要混乱。但事已至此，还是要请他到应接室里聊一聊。\n\n没想到的是，田中清还没发话，这位年轻海军军官先张口了：“田中少佐，以我之见，我国必须上下团结一致，秉承着'一君万民'的大精神开拓国运，你认为这话如何呢？”小兔崽子怎么和荒木还有真崎带出来的人一个样子，不过田中清还在为这位海上皇道派准备茶水，所以就糊弄性地点了点头。“确实不错，也正是如此。”“最近的大萧条，经济的困境，以及在这种困境下政党和财阀勾结起来的腐败实在令人目不忍视。要是这样持续下去，就根本实现不了什么国运的伸张。必须要对国家进行革新，你怎么想？”\n\n不，完全是穿藏青制服的皇道派吧，所以田中清也切换成了合适的模式，他把茶水放在年轻人面前，自己则坐到了他身旁：“依我之见，若不是真正心怀牺牲小我的精神的人，比如像军人这样的，是不能完成国家革新的。我想革新一定是需要舍命的勇气，那样的话一定是军人最为合适。”讲到这里，对方一下子变得更激动，眼泪也从眼角里挤出来了：“陆军是否也有施行断然的革新的信心？陆军中央部，永田军务局长是否也支持？在军务局没人接待我，是桥本大佐推荐我来拜访你的，因为他告诉我你们都是统——”\n\n“中央部把当前的政治腐败看在眼里，也并不是对国家革新漠不关心。其实中央部对此也抱有极大的热忱。至于具体方法目前正在锐意研究中。关于这一点，还请你信任我们。说起来，你叫什么名字，我还不清楚。”“真的失礼，我是黑岩勇。既然陆军中央部也有这样的决心，我甘愿舍命作铺路石，效犬马之劳。”“好，黑岩少尉，虽然你是海军我是陆军，但是我理解你这样的年轻军官，心中怀着炽热的爱国之情，我们一定不会辜负这份感情，中央部也绝不会对目前的时局无动于衷。”\n\n等到那个看起来只是海军版的皇道派军官欣喜地抽着鼻子告辞离去之后，田中清抓起了电话，他本来想打给东京那家料亭，让那个花天酒地的快乐“革命家”不要再随意散播他的名字和地址，但现在有更重要的联络要做。"
  JAP_pnr_earlygame.21.a: "永田少将，我想大事不妙了。"
  JAP_pnr_earlygame.22.t: "回心转意"
  JAP_pnr_earlygame.22.desc: "赤坂区灵南坂，距离[JAP.GetAdjective]的政治心脏不过只需步行十余分钟，正是因为如此便利的位置，才令无数高级政要，财阀总裁以及高端料亭都扎根于此。而在土地价格对大多数平民来说难以想象的地段，面前这座别墅可谓称得上是阔气——拥有该别墅的人想必是某位不得了的财阀统帅，又或者是某位掌握着大量财富，在帝国议会中呼风唤雨的政治家吧。然而如此显赫的神秘人却过着极为低调的生活，鲜少有人拜访这户人家，从这一点上称其为灵南坂的“深井”也并不过分。\n\n与从建筑之外感受到的冷清不同，屋内的大家已经就某项事务展开了讨论。不错，这里就是“影子将军”头山满在灵南坂的一处房产，20年前中华民国的孙中山正是在此于宋庆龄的帮助下建立了中华革命党，并策划了一系列对抗袁世凯的起义。而如今另一场迫在眉睫的革新行动，一场属于[JAP.GetName]自己的行动也将在这里开始。\n\n聚集在别墅中的为首之人乃是著名的职业革命家$JAP_pnr_okawa_shumei$，坐在他身旁的是陆军大尉大蔵荣一和海军中尉古贺清志，以及还有其它十一名陆海军出身的军官。自然还有将这里借给他们议事的慷慨主人的儿子，头山秀三，然而他并不参与计划细节的讨论。关于这场国家革新的目标和人员分组都已确定下来，$JAP_pnr_okawa_shumei$也转告他们会有不少农民加入行动，然而现在最重要的是说服其中一名成员——黑岩勇。\n\n看起来黑岩是遭到那些大人物的欺骗了，自从他之前从陆军省回来便对这项谋划许久的革新行动显得有些迟疑。“黑岩少尉，”$JAP_pnr_okawa_shumei$走到他背后，把手放在他肩上，“我已经和你说过了，难道你看不见现在的问题吗？政府所谓“十年的恢复”在‘黑色星期一’面前原形毕露，赤色分子在阴影中的蠢动，农民和手工业者在街边恸哭，而掌握大企业的家族和政客勾结起来拼命吮吸日本民众的血汗，现在正是要下定决心的时刻。”“不要再迷惑于谎言了！为了改变国家，现在就行动吧！”他重重地捏了一下肩。“但是田中少佐和我说了，他说中央部也在关心。我想如果擅自行动，不是反而会对不起他们的努力吗？”\n\n听到这话，$JAP_pnr_okawa_shumei$发出嗤笑：“官僚的话怎么能信？”"
  JAP_pnr_earlygame.22.a: "请少尉走出去看看[GetMonth]的街道，还有什么好研究的？"
  JAP_pnr_earlygame.23.t: "浪人的仁义"
  JAP_pnr_earlygame.23.desc: "“回去了吗？”等到头山秀三把内里的门拉开之后，坐在昏暗内间中的影子将军本人终于开了口，“杀掉前首相和现首相，然后攻击政党总部，银行，警视厅，变电站，$JAP_pnr_okawa_shumei$是个口才不错的演说家，能让十几个人相信自己能做成这么多事情，对这些年轻人来说是个可怕的人物。你给了他们多少东西呢？”\n\n“黑岩先生是预备役，所以他没有手枪。我所提供的，归根结底只有一枪一弹。”\n\n“将军”本人则走到桌边，那里放着这些青年军官拜访时带来的伴手礼。他拾起那盒捆扎好的，浅草下町的舟和本店出品的芋羊羹——不愧是一群青年，真亏他们敢提着这东西来拜访——然后把余剩的那些盒子全都扫到了地上去。备好笔墨，把关键内容稳重地写在纸上后妥善地叠成极窄的一条，再解开草绳把这封“信件”夹进盒盖内侧的包装纸下面。对这些青年军官来说，他们受到的乃是作为义士的对待和与之相称的仁义，而这张纸则是他头山满对$JAP_pnr_inukai_tsuyoshi$的，独属于大陆浪人之间的仁义与准则。既然事情已经办妥了，他又照原样把芋羊羹的礼盒打包好，说是原样打包，但那个草绳还是能看出明显拆开过的痕迹。随后，这盒糕点便被交到了头山秀三的手中，而影子将军也对自己的儿子下达了下一项任务。"
  JAP_pnr_earlygame.23.a: "把这盒糕点送给$JAP_pnr_inukai_tsuyoshi$，请他尝尝萨摩芋的味道。"
  JAP_pnr_earlygame.24.t: "最后的参拜"
  JAP_pnr_earlygame.24.desc: "明治维新以来，无数爱国将士为天皇而献身。这些忠勇义士们按照神道教的法门皆作为护国英灵被合祀供奉在东京九段的神社之中。也正是因为他们舍弃自己而献身的忠义，这些死者才得以从人类的亡魂变化为不朽的神灵，成为太阳光辉的一部分与作为天照大神后裔的天皇同在。作为军人的黑岩勇一行人也是出于同样的理由才来到这里进行参拜，对他们自己来说，他们相信自己接下来要做的事情足够使他们在死后也同样被接纳为这些义士的一员，永远守护天皇陛下和[JAP.GetAdjective]的国土，为旭日再增添一分光辉。\n\n等到黑岩勇等人行礼默祷完毕，从拜殿出来时已是下午五点，而接下来就是正式行动的时刻。几人此次参拜神社固然坚定了他们行动的信心，但也又一次引发了不安和迟疑。在等出租车时，首先发话动摇军心的是陆军中尉篠原市之助，先前的会议上他就是个踌躇的家伙：“我听说犬养前首相是大陆浪人出身对吧，我们真能压制住他吗？”这股退缩的颓废气息很快又一次爬上了黑岩勇的身子，听到篠原这么讲，他也又想到了田中先前给他的承诺，直到山岸宏的那声叱责打断了这种侵蚀。\n\n“事到如今还说这些做什么，你如果不想干，就该早点退出！”随后山岸又把头扭向了在一旁的三上卓，“比起腻腻歪歪地在原地推辞，还是想一想我们要怎么办。那群家伙现在也还不来，我们几个怎么按计划斩除许多国贼！要我说，今天就先杀$JAP_pnr_inukai_tsuyoshi$和[JAP.GetLeader]。三上觉得呢？”“我认为可以——”“犬养前首相虽然现在是平民，但我们真的能干掉他吗？”\n\n“如果你害怕，”山岸一把将篠原拽了过来，“就不要迟疑，不要对话，直接开枪杀了他。三上，到底怎么说！”\n\n篠原被吓得身体微微抽动，无论如何，三上卓终于可以就这临时改变的计划提出自己的看法了。"
  JAP_pnr_earlygame.24.a: "大家一起去干掉$JAP_pnr_inukai_tsuyoshi$。"
  JAP_pnr_earlygame.25.t: "扣扳机者"
  JAP_pnr_earlygame.25.desc: "我记得等我们到$JAP_pnr_inukai_tsuyoshi$家门口的时候已经是下午五点三十了，我们说是萱野长知先生介绍我们来的，想和$JAP_pnr_inukai_tsuyoshi$聊聊。等我们进到院子里的时候首先遇到的是一位医生，现在想来那人就应该是大野。我们询问他是否知道前首相在哪里，他告诉我们他也是刚刚前来拜访。这个时候黑岩因为紧张开枪打了他，虽然没有击中，但是他立刻就逃跑了。我想这下坏了，于是让大家冲进屋子里面分头挨个搜查。最后是黑岩和我在最里面的房间里找到了$JAP_pnr_inukai_tsuyoshi$，黑岩一看到他就扣动了扳机，但是他枪里只装了一发子弹，还因为前面紧张用掉了。\n\n至于$JAP_pnr_inukai_tsuyoshi$就像是知道我们会来一样地坐在那张简陋的餐桌后面，托着烟草盆在那里抽烟，既不畏惧我们手里的枪，也对我们的命令不屑一顾。房间里当时除了$JAP_pnr_inukai_tsuyoshi$之外还有一个女人和一个小孩子，已经完全因为现状呆立在原地了。这个时候前首相大声呼喝让女人和孩子离开，我也说不会伤害他们，让他们快些离开。那个时候我们真的被震慑住了，因为黑岩的枪里没子弹，我就让他去叫其他人过来。\n\n随后$JAP_pnr_inukai_tsuyoshi$对我示意让我跟他走，我举着枪，他举着烟草盆，我们一起去了北边一间更宽敞的客间。后藤和八木两个人随后就赶到了，他一边取出卷好的香烟递给我们，一边问我们为什么不脱下鞋子坐下，表现得依旧很镇定，现在想来不过是在拖延时间罢了。“你知道我们为什么来，如果想说什么就立刻说！”我说了这样的话，就在$JAP_pnr_inukai_tsuyoshi$向前倾身要说什么的时候，山岸大尉冲了过来，看到我们正在交流就高喊“不要对话，开枪！”然后就有人从山岸背后开枪打中了$JAP_pnr_inukai_tsuyoshi$的额头，现在想来是篠原中尉做的吧，他收到了这样的命令。看到行动成功，我们就立刻离开了，没有进一步确认。"
  JAP_pnr_earlygame.25.a: "玉锦倒下！双叶山寄倒横纲——时代终结！"
  JAP_pnr_earlygame.26.t: "《国家保安法》"
  JAP_pnr_earlygame.26.desc_a: "$JAP_pnr_inukai_tsuyoshi$之死震动了帝国议会与社会舆论。这些杀死前首相的海军和陆军士官虽然表明自己没有受到任何极端思想的影响，但没什么能骗过司法省的调查。平沼骐一郎的得意门生，司法省的盐野季彦通过深度调查暴露出了掩藏在重重迷雾下的真相——日本共产党，调查显示他们的家中有《赤旗》和《黑色青年》等赤色非法刊物。回顾他们的证词，确实有一些人表明是为了“农民与劳动大众”打倒“大财阀”，相信这些人正是遭到了赤化才犯下此等暴行，面对这等丑闻，陆军教育总监部与海军省教育局难辞其咎，对两军的内部调查也将很快开展。\n\n当下[JAP.GetName]所面对的经济与社会困境，以及盘旋在国家上空的红色恐慌的幽灵都使人想到了1923年关东大地震后的那段时光，虽然当时远比现在令人感到绝望，但大家确实不再想面对一次类似当年的关东无政府主义者起义了。1924年初，执政的田中内阁借此通过了臭名昭著的《治安维持法》。该法案极大地限制了民权，是田中义一大将独裁统治的象征之一。1926年田中政权垮台之后，《治安维持法》随即被废除了。\n\n在如今的特殊社会状况下，推进一部类似于《治安维持法》的法律来控制现状似乎变得十分有必要，[JAP.GetLeader]与其内阁最近透露了类似的计划。在处理“黑色星期一”的经济问题上取得了不甚出色的成果之后，[JAP.GetRulingParty]寄希望于通过推行一部名为《国家保安法》的，经过调整的更温和版本的法案来做出一些值得称道的政绩。政府宣称该法律将加强对社会不安定分子的控制，并且捍卫我国摇摇欲坠的民本主义（不损害天皇主权的前提下的民主主义）政治。目前[JAP.GetLeader]正在私下与各党派总裁进行交流，但并不是所有人都支持这部法律中目前的条款，可以见得的是在即将召开的帝国议会临时会议上，就这部法律的草案内容会产生不小的争议……"
  JAP_pnr_earlygame.26.a: "我们会进行协商，而该法案会解决“一切”问题。"
  JAP_pnr_earlygame.27.t: "挥杆"
  JAP_pnr_earlygame.27.desc: "他站在球前摆好了姿势，望着地平线那一头——就像自己一贯做的那样。然后启杆后摆，扬起一道衬得上自己地位的迅疾弧线。那颗球“啪！”的一声便直直地飞向蔚蓝色的天空，精准地射向了它该去的位置。“好球！真是好球啊陛下，四杆洞的信天翁球！这可十分罕见，是难得的好运气！”$JAP_pnr_fumimaro_konoe$看到站在果岭附近的侍从挥舞着帽子，便立刻对天皇陛下拍手称好，既然来当自己球童的近卫公爵都这样说了，那就大概真的是一颗信天翁吧。\n\n他和$JAP_pnr_fumimaro_konoe$说话的同时把球杆递了过去：“‘诗人如那云霄中的王子，在暴雨之中笑看弓手。’然而在我国，信天翁则是愚蠢的象征，面对猎人从不逃离，总是轻易地被捕捉。最近有什么有意思的事情吗？”“陛下既然这么问，最近贵族院里聊得最多的便是$JAP_pnr_inukai_tsuyoshi$和《国家保安法》，关于第一点我有听到风声，似乎陆军那边很早就知道暗杀计划了。”$JAP_pnr_fumimaro_konoe$伸手去接那根球杆，用预先准备好的湿毛巾把杆面和沟槽擦拭了一遍，“关于第二点，有人和我说平沼男爵出了很大力，‘指鹿为马’，大概是这个意思。”\n\n“平沼的话看报纸就能知道，共产党怎么可能突然就变得这么活跃。平沼其人贪恋权位，为此不择手段。至于$JAP_pnr_inukai_tsuyoshi$，发生这种事我也很痛心，可以借机敲打一下陆军那边吗？近卫觉得继续示意永田去办如何？”$JAP_pnr_fumimaro_konoe$一边点头，一边从背包里又掏出来了毛刷，把泥沙从线沟里擦出来：“陛下如果觉得可以，我当然乐意效劳。还有一件事让我感到很不安，最近陆军里有了很奇怪的流言，是关于陛下您的。”既然清理完毕，他便把球杆还了回去。“关于我的？怎么说？”“似乎是从近卫师团那里传出来的，说在深夜看到您屋里亮灯，本以为您在勤于政务，结果凑近一看，发现您同香淳皇后在打麻将。”\n\n整个高尔夫球场的气氛都发生了微妙的改变，在短暂的沉默之后，他给出了自己对流言的澄清："
  JAP_pnr_earlygame.27.a: "“……我根本不会打麻将，我只打桥牌。”"
  JAP_pnr_earlygame.28.t: "离心力"
  JAP_pnr_earlygame.28.desc: "并非党内所有人都与[JAP.GetLeader]站在同一战线上。今天稍早些时候，《国家保安法》的泄露草案被“新闻界的无冕帝王”大宅壮一发布在《时局新闻》（Jikyoku Shinbun）上，在东京引发了不小的震动。长期作为小报（Koshimbun，使用通俗语言面向城市工人阶级和普通大众的通俗报纸）的《时局新闻》很快就销售一空，与[JAP.GetRulingParty]向那些大媒体透露的内容不同，《国家保安法》并非是一部温和的法案，《治安维持法》中大量关于审讯和无限扩张适用对象的法条在泄露的《国家保安法》草案中依旧存在。政府目前已强令《时局新闻》进行禁止发行，但这次泄露已在社会上形成了不小的波澜。许多社会活动家开始攻击政府不过是改头换面的田中义一内阁，是同样借助危机肆意扩大自身权力的独裁政权。他们呼吁民众团结起来反对政府，并向天皇陛下请愿立刻罢免[JAP.GetLeader]。党内一些中高层成员为了顺应民意，也开始公开讲些见风使舵的话。\n\n大宅壮一是潜在的危险分子，作为东京帝国大学“新人会”出身的报业老板，此人对社会主义抱持着一种近乎狂热的态度，这一点从他两个儿子的名字：礼人（Leijin,弗拉基米尔·列宁）和丸人（Marujin，卡尔·马克思）便能一窥。现在的问题在于是哪个叛徒把这一切泄露给了这个共匪，以及这到底是最无聊的“无私义举”还是[JAP.GetRulingParty]的高层为了扯[JAP.GetLeader]的后腿而策划的阴谋。不论如何，这侧面展示出社会并不欢迎《国家保安法》，而在和其它在野党就该法案进行事前交涉的时候，[JAP.GetLeader]必然会处于被动位置。"
  JAP_pnr_earlygame.28.a: "等法案通过就把大宅壮一抓起来。"
  JAP_pnr_earlygame.28.b: "比起间谍，先把那些党内投机分子开除。"
  JAP_pnr_earlygame.29.t: "失衡"
  JAP_pnr_earlygame.29.desc: "“皇道派”与“反皇道派”在宪政恢复，$JAP_pnr_hayashi_senjuro$上台之后就如同两座随时可能会倒塌的危楼，它们之间的势力平衡就如同一根强韧又脆弱的丝线，只要轻轻扰动就一定会断裂引发灾难，但只要什么都不做就能维持住这种危险的平衡。毫无疑问，$JAP_pnr_hayashi_senjuro$本人充当的角色正是一把张开的剪刀，正架在这根丝线之上。\n\n无论$JAP_pnr_hayashi_senjuro$究竟是出于利益而顺从了自己的私心，还是出于对帝国陆军愈演愈烈的分裂的担忧而表达了他个人的立场，他的行为都导致这把剪刀的刀刃闭合了，陆军省和参谋本部之间脆弱的平衡也随之被打破。\n\n"
  JAP_pnr_earlygame.29a.desc: "$JAP_pnr_earlygame.29.desc$随着$JAP_pnr_hayashi_senjuro$高调宣布自己将继续留任，并且支持现任政府的裁缩政策，主张以减少常备军为代价尽一切可能打造“帝国精兵”。他显然已经彻底倒向了“反皇道派”，和他们上了一艘船。参谋本部中同为反皇道派的$JAP_kanin_kotohito$旋即立刻逼迫“皇道派”大员$JAP_pnr_masaki_jinzaburo$辞职，并展开了一场针对参谋本部内剩余皇道派人士的大清洗。\n\n如今皇道派的势力一点一点地衰弱下去，并且解体速度正随着支持皇道派的军官被编入预备役的数量而越来越快。已经有许多不坚定的军官选择拜访清军派和统制派经常聚会的地点，试图早做打算跳槽到反皇道派阵营之中。"
  JAP_pnr_earlygame.29b.desc: "$JAP_pnr_earlygame.29.desc$随着$JAP_pnr_hayashi_senjuro$宣布自己“身体不适，不胜职责”并辞职之后，他推荐来接替他的陆军大臣$JAP_pnr_yoshiyuki_kawashima$正是一位人尽皆知的强硬皇道派军官。毫无疑问，$JAP_pnr_hayashi_senjuro$最终选择站在皇道派那一边。$JAP_pnr_yoshiyuki_kawashima$刚一就任就约谈了陆军省内多名高官，并强制要求他们暂时休假，这些官员无一例外都是反皇道派人士。\n\n在随后几天内，“川岛人事”席卷了整个陆军省，反皇道派势力在这近十年内发展出来的根基就这样被新任陆军大臣几乎破坏殆尽。大量先前在政治斗争中被反皇道派发配到帝国边陲地区的忠于皇道派的精英军官如今都被召回东京，负责填补因“大清洗”而空出来的位置。"
  JAP_pnr_earlygame.29.a: "军队终于要回到属于它的状态了。"
  JAP_pnr_earlygame.29.b: "皇军团结一心的日子不远了。"
  JAP_pnr_earlygame.30.t: "Connection/Corruption/Conflict"
  JAP_pnr_earlygame.30.desc: "一到午休时间，她就把常子拦了下来，作为同级的同学，自己知道常子有着所谓不可告人的秘密。当然是不符合青山学院高等女学校校规的阴暗秘密。但说实在的，谁又会大肆声张自己破坏校规，让闲话传到斯普罗尔斯校长耳朵里呢？自己知道她会给学校里的人介绍咖啡馆的工作，并且她自己也会去做咖啡店里的工作，因为大家都是来拜托她的，所以跑来问她准没错。要知道两年之前高等女学校的学生们就禁止进入咖啡店了，但她就是有这样的手腕。所谓的时髦啦，奢侈品啦，还有《妇人画报》和《装苑》上的别的什么东西，只要能在咖啡馆上工的话，就什么都能很快弄到；只要想快些弄到钱的话，最好的方法莫过于咖啡馆。\n\n“我想要钱，想要快点弄到钱。”自己对常子这么说。\n\n“傻逼啊，想要钱的话自己去找爸爸要啊，你们家不是开连锁店的吗？”\n\n“我的意思是说，请给我介绍工作，帮我找客人。”看起来对方完全误解了自己的意思，“咖啡店的工作。”\n\n“嚄。”她突然盯着自己的身体看，“如果下定决心的话，即便是现在这样的时期，也不会金钱不自由的，简单得很呢。”“我只是一直假装成老实孩子，不管是和果子店还是什么，实际上并不老实，早就有做这一行的心境了。”“这方面的话，我只是负责给客人介绍女孩子然后拿钱，所以你的心境什么的，对我无所谓。钱的话是你八我二，这点没商量。不过话说回来，你啊……”她瞪大了眼睛，然后叹了一口气，“别来逗我，反正你也肯定不是认真的。像你这样的孩子肯定不适合这种买卖，我想到与其到时候发现不合适，还是现在趁早放弃比较好。”\n\n看起来那家伙完全心不在焉，突然说这种有良心的话搪塞自己，所以自己又重复了一遍。"
  JAP_pnr_earlygame.30.a: "“我已经厌倦当老实孩子了，所以请给我介绍。”"
  JAP_pnr_earlygame.31.t: "[JAP.GetLeader]与《国家保安法》凯旋！"
  JAP_pnr_earlygame.31.desc: "今天早上，帝国议会中传来消息，[JAP.GetLeader]内阁力推的这部旨在收紧法网，打击社会颠覆分子的《国家保安法》审议通过。该法案内容此前曾在社会上泄露，由于其法条内容与此前田中义一内阁时期的《治安维持法》极为类似，故而引发了民意的轩然大波。虽然有部分较为保守的媒体认为该法案比起《治安维持法》更温和，但还是有一些自由主义报人尖锐地批评其为“历史倒车”和“对自由民权运动成果的彻底践踏”。\n\n这部法案在众议院内也引发了汹涌的反对声浪，而对其的投票表决则在对本届内阁此起彼伏的斥责和质疑声中拉开了帷幕：结果却令人意外，尽管反对意见看上去强烈，但该法案最终在众议院内取得了多数赞同。随后《国家保安法》被移交给贵族院进行审议，《国家保安法》以极为异常的速度获得了高票通过。有一些坚定反对这部法案的议员称这是“贵族院和本届内阁之间勾结的阴谋”。另一个消息则可能和该法案的通过密切相关，就在几个小时前，[JAP.GetLeader]内阁突然宣布已奏请解散众议院重新举行大选。"
  JAP_pnr_earlygame.31.a: "等一下，吃完就跑吗？"
  JAP_pnr_earlygame.32.t: "《国家保安法》的命运"
  JAP_pnr_earlygame.32.desc: "近几个月内不仅在社会上，也在国会里闹得沸沸扬扬的《国家保安法》终于迎来了它表决的时刻：投票时的空气凝滞得让人窒息，经众议院审议之后，这部法案最终得到了和它在这几周间与媒体评价相同的结果：一张该丢进垃圾桶里的废纸。\n\n议员们或许是出于朴素的正义感而拒绝《治安维持法》的卷土重来，从而对该法案投下了的否决票，也有可能是他们被日渐汹涌的院外社会民意所裹挟，而不得不投下反对票。但总之，[JAP.GetLeader]和他的内阁到此结束了——[JAP.GetLeader]本想再挣扎一下，通过解散众议院来寻求重新表决该法案的机会。但在内大臣斋藤实的私下建议之后他们打消了这一念头，一些人认为是宫中集团对其表达了执政的不满。今天早上，[JAP.GetLeader]带领全体阁僚宣布了总辞，在新首相被任命之前暂时作为职务执行内阁主持相关工作。\n\n目前新首相的身份尚未得到确定，一些报人猜测经过1936年上半年发生的一系列政治丑闻，日本政治可能要罕见地结束这持续十年的政党内阁时代，重新回到官僚掌权的超然内阁状态了。但也有一些乐观的声音指出在经过了将近十年的“悬峙议会”之后，[JAP.GetAdjective]各大政党已经深入理解了民主的要义就在于相互协商，而1936年的这些政治动荡恰好进一步暴露了单一内阁执政的弊端，从而现在正是在[JAP.GetName]推进西方常见的党派联合执政——即恢复“宪政联盟”时期互相提携，携手并进的联合内阁的最好时机。不论如何这些都只是猜测，而所有人都在屏息等待结果……"
  JAP_pnr_earlygame.32.a: "真难看。"
  JAP_pnr_earlygame.33.t: "撒手锏"
  JAP_pnr_earlygame.33.desc: "“诸位，”看到今晚邀请的大家大都已经聚到了这间屋子里，他缓慢又沉重地说出了这个消息，“我想诸位已经有所耳闻，$JAP_pnr_hayashi_senjuro$叛变了。他自甘堕落为军贼，沦为了当今有损皇道精神的一只土蜘蛛。”\n\n“参谋本部，我们最后的阵地已渐渐不支，相信很快对皇道虔信徒的打压就会来到基层。如今荒木大将和真崎大将都在受苦，前几天我夜里翻进荒木大将家中，远远看到大将的屋子还亮着灯。大将心怀皇国精神，纵使在被陆军中央排挤之后仍然不觉困苦，即使是深夜仍在努力工作。当时我就想如果我也能像荒木大将那样努力，就能为实现真正皇道的日本奉献上一份力量了！然而那些可恨的家伙，财阀的走狗，军人中的叛徒！他们排挤走了荒木大将，最近又联合起来，将真崎大将也赶出了参谋本部。我皇道派之最后阵地，忠君爱国之日本军人的最后阵地就这样在敌人的绞杀之下失手了！”\n\n“我想诸君都看到了我信中所写，如今我等信赖之大将被软禁于家中，我等信靠之天皇则遭佞臣幽禁。诸君，当下能行动的只有我们了！如果有谁认为接下来的话题不合适，想要说‘我不干了！’，如果有这样的家伙，就离开这个屋子！是要这样一肚子憋屈地，被这些心中毫无对日本精神之敬畏的军人追逼致死，还是在这以少击多的绝境之中，像岛津义弘公一般，向烈风一样冲杀这笼罩在陆军，笼罩在国家上的阴霾！诸君，到了选择的时候了！”"
  JAP_pnr_earlygame.33.a: "战术很困难，但政治很简单！"
  JAP_pnr_earlygame.34.t: "搅扰花园者"
  JAP_pnr_earlygame.34.desc: "[JAP.GetAdjective]陆军和[JAP.GetAdjective]海军之间关系不合早已众人皆知，然而他们并非事事都要敌对。譬如在寻花问柳一项上便大致有着相同的雅趣。东京新桥乌森花街的桝田屋正完美展现了陆海军之间的和解。每到资金充裕之时，这些佩戴着“天保钱”的陆军军官们便和自己的海军弟兄勾肩搭背地迈入预先定好的大房间，再招来美妓服侍宴会。觥筹交错间好不快活，宛如，宛如——\n\n他的脑筋打结了，他记得是叙利亚那里的古代教团，在美丽的宫殿中日夜不停地举办着宴会，直到任务来临，便毅然地离开仙境杀死目标，再回到这里继续欢乐。说到底阿拉伯人怎样都好，自己还是更想当凯末尔那样的人士。写了一半的短文被团成一团丢到了庭院里，当务之急是再灌面前这个新家伙几碗酒。\n\n走廊传来沉重的脚步声，还有“待合”（Machiai）的仲居的惊叫声，女将那细碎又连绵的解释声。恐怕又是哪个人喝多了在廊间耍酒疯。然后声音突然静了下来，自己房间的门被一脚踢开，那家伙，田中清站在门外，而女将则在一旁连连摆手。\n\n“$JAP_pnr_hayashi_senjuro$没顶住压力，现在皇道派疯子要把陆军省全占了。”田中先是看了一圈屋子里要么已经因酒精昏在地上的，要么是因为他的造访而震惊的人，随后对他说，“你一定也听到风声了，所以我来找你。”\n\n“田中！突然闯进来，你这家伙什么态度！有没有对长辈的礼貌！给我谢罪！”这家伙说话冠冕堂皇，气得他立刻拍桌子站起来。而对方则是立刻抓起桌上的那大只酒盏，倒满了德川义亲先前送给他的酒水之后一饮而尽。\n\n“我知道你写了，”他把酒碗递过去，放在桥本欣五郎的手边，“给我看看。”\n\n[JAP.GetAdjective]陆军和[JAP.GetAdjective]海军之间关系不合早已众人皆知，然而他们并非事事都要敌对。譬如在发动政变一项上便有着相同的雅趣。"
  JAP_pnr_earlygame.34.a: "哈哈。有的是，慢慢挑。"
  JAP_pnr_earlygame.35.t: "意外的访客"
  JAP_pnr_earlygame.35.desc: "“是谁啊？”看着漆叶绫着急地从前门那边过来，$JAP_pnr_saionji_kinmochi$站在沿下问了一句，8月末正是台风季，兴津的夜晚更是维持在26摄氏度上下，闷得人直喘气，恐怕就算是鱼，如今也要潜到深深的冷水里免得遭热气所害，这天气令人实在盼着能有一场大雨来把这种湿热驱赶走，并且正因为越是不下雨，才能确定下了雨，一定是一场颠倒一切，畅快淋漓的大雨。“大人，是立宪政友会党员，贵族院议员鹈泽总明法学博士希望拜见您。”\n\n“鹈泽吗？他之前没告诉我要来见我。”$JAP_pnr_saionji_kinmochi$当然记得他，此人平日性格温和，是一名优秀的基督教徒。作为日本神学校的校长，明治大学现任总长，从各种角度来说都是个和蔼可亲，受人爱戴的人，然而作为一名律师，他辩护的案件则总让人感觉“虔诚的基督徒”一词难以完全概括他。鹈泽总明热衷于为各种政治争议人物辩护，幸德秋水、血盟团、朴烈与金子文子、李奉昌，在这些震惊日本社会的重大案件中，他都作为被告方律师出席——诚然，在这种公众密切关注的案件上出席有助于增加他作为律师的名气，但这位校长真的需要做到如此地步吗？\n\n“要我请他明天再来吗？”女佣的询问打断了$JAP_pnr_saionji_kinmochi$的思考，他又望了望远处月光下照亮的云，那里没有要下雨的迹象。"
  JAP_pnr_earlygame.35.a: "这位律师深夜拜访定有要紧的事。"
  JAP_pnr_earlygame.35.b: "情况不太对劲，我先从地道溜了。"
  JAP_pnr_earlygame.36.t: "沉默杀手"
  JAP_pnr_earlygame.36.desc: "“天保钱”——这东西现在据说公开佩戴算违法了——这又是什么世道呢，军人穿军装上街会被小青年偷袭殴打，去电影院买票打折也要遭白眼，如今就连佩戴象征自己刻苦努力的荣誉也被勒令为违法了，似乎一切都调转了过来，社会崇拜愚昧和软弱，打击智慧与强力，可谓是一种向下堕落的懦夫社会。过去我曾难以理解，可能是文化差异所致，但是即便是作为一个百分之百的冈山县生人的自己也想不明白。为什么故事里的正派在击败反派之前，总是要慷慨激昂地陈述一番，而不是快意恩仇地一刀看下去。那时候的我觉得这是一种作者的说教，但如今看来确实一种不被理解的控诉和嚎哭，是因为不身临其境就无法感受到的巨大精神超脱。我想这就是所谓正义英雄的悲剧性，也就是故事的醍醐味吧。\n\n桥本欣五郎把那本小册子垫在自己左胸内侧的口袋里，把笔帽盖上，鞋子在刚刚被溅脏了。“啧，这算什么。”他踢了踢地上不动的那东西，把脚背在上面用力来回刮擦，结果却是搞得污渍越来越大。事已至此，索性破罐子破摔，他踩着台阶一路向下，血花甚至溅在了裤腿上，走过那横七竖八的倒在地上的尸体，在台阶最下面看到了百分百已经没救了的$JAP_pnr_yoshiyuki_kawashima$。在他身旁的男人看到桥本欣五郎走下来确认情况，便当着他的面上弹又打了一枪头。\n\n“死了还要鞭尸？”在他身后，几十杆长枪正直直插在大家的背上。"
  JAP_pnr_earlygame.36.a: "“小笠原子爵，你当海军大臣的事包在我身上。”"
  JAP_pnr_earlygame.37.t: "义军会议"
  JAP_pnr_earlygame.37.desc: "伴随着最后一人进入到亮堂堂的屋内，各部队的长官总算到齐了。这个时间的东京夜晚实在是闷得出奇，$JAP_pnr_ogishi_raiko$一边换上军装，一边走到今夜准备行动的大家身边。“我带来了300人，”屋外传来了零星的卡车引擎声，“现在我们有多少能用的作战力量。”\n\n“我这里有200人，”安藤辉三一边说着一边看向桌子另一头的另外几人，“野中动员了500人，栗原也带上了大概300人，丹生中尉那里有150人左右，还有其他人的一些部队。我想零零散散大概有两千人左右。”$JAP_pnr_ogishi_raiko$一边交流着兵力信息，一边探身去看在桌子上铺开的作战地图：“人数不够，如果想按照计划打击那些宫中重臣的话，势必会拆散部队。”\n\n“优先确保警视厅的弹压，”野中指着地图，“攻下警视厅之后就没人能抵挡我们了，我们杀西园寺之流如同杀鸡屠狗。”“西园寺那边我拜托了鹈泽博士，我亲眼见博士带上了手枪，往兴津那边去了——宫城呢，我们大量兵力要投入警视厅，如果还要干掉其他重臣的话，宫城方面只能投入最多100人了，这样真的好吗？一百人能有把握吗？”\n\n“到时候我们会借着起事的混乱以增援为由进入宫城，守护陛下的安全，”中桥基明看起来信心满满，“等起事成功，奸臣尽除之后，我们会第一时间传达给陛下我们的想法，这样陛下就会明白我们的赤子之心的！”\n\n“中桥……”$JAP_pnr_ogishi_raiko$叹了口气，“我想无论如何，‘玉’一定要确保。为此向宫城投入尽可能多的兵力才是应当的。这些奸臣失去了‘玉’就会轻易瓦解，到时候再清算也不迟。”\n\n与此同时，屋外卡车引擎发出了一阵刺耳的轰鸣，军靴的声音震得整栋建筑都微微摇晃，义军们已经集结并等待着为他们所信仰的事业献出生命。无论如何，现在房间里的军官们必须作出决定。"
  JAP_pnr_earlygame.37.a: "分散各队，绝不能让国贼苟活于世！"
  JAP_pnr_earlygame.37.b: "集结一半兵力，不，七成兵力保护皇居。"
  JAP_pnr_earlygame.38.t: "君侧一新"
  JAP_pnr_earlygame.38.desc: "诸位今日上街，可能会感到帝都空气为之一新因而心生奇怪吧，这正是我等打扫国家之大扫除的功劳，现在就要汇报给各位。我国之所以是神圣之地，在于天皇陛下世袭血脉所维系的国家体制。这一体制得以凝聚全体国民，共同缔造、毁灭并最终实现发展，最终实现“八纮一宇”的理想。自天祖和神武天皇建国以来，历经明治维新，这一国家体制的尊贵和卓越之处不断得到完善。如今，是时候将其充分展现并推广至世界各国了。\n\n然而，近来涌现出一批桀骜不驯、作恶多端之徒，他们践踏皇道，沉溺于私欲贪婪，无视天皇的绝对尊严，行事狂妄自大，阻碍人民的成长与发展，使人民饱受苦难，导致外敌入侵和威胁日益加剧。学匪、赤匪和叛国教团肆意招摇过市，其罪行令人发指。所谓元老、重臣、军阀、财阀、官僚和政党，正是造成国家政治秩序崩溃的根源。\n\n其中首恶，逆贼西园寺公望曾在几十年前允许社会主义匪徒们公开结党，替他们摇唇鼓舌。如今又站立在陛下侧近，借“元老大权”蒙蔽圣听。现在正是惩罚那些破坏国家政治的不义之徒，铲除那些阻挠天皇权威、阻碍昭和维新的奸佞之徒的时候。思索片刻后，我们不禁为国内的局势深感忧虑。铲除围绕天皇的奸臣叛军，彻底摧毁他们的核心势力，是我们义不容辞的责任，我们有能力做到这一点。\n\n在我等齐心奋力之下，昨天夜晚，匪贼西园寺、奸臣斋藤等一干狂徒皆已伏法，如果我们现在不履行作为忠诚臣民的绝对职责，我们将无法扭转衰败和停滞的现状。因此，我们必将团结一致，怀着共同的关切和愿望，奋起铲除奸佞之徒，维护正义，全心全意致力于保护和彰显国体，并将我们作为这片神圣土地的臣民的谦卑之心献上。\n\n自现在起以上内容将每小时播放一次。"
  JAP_pnr_earlygame.38.a: "愿皇祖皇宗的神灵，"
  JAP_pnr_earlygame.38.b: "赐我等指引和帮助。"
  JAP_pnr_earlygame.38.c: "贼军！贼军！本庄在哪里？！"
  JAP_pnr_earlygame.39.t: "攻入皇居"
  JAP_pnr_earlygame.39.desc: "什么是最重要的？对于大多数今晚一同行动的人来说，可能是“铲除奸邪”吧。$JAP_pnr_ogishi_raiko$很清楚这一点，很多人都只是想到要行动所以才行动，而完全没有一个完整的计划或是纲要。在这件事上，他们受北一辉和西田税之流的牵制也是理所应当的了——重要的一直不是外面的盒子，而是盒子里珍贵的玉，既然是“玉”，就应该牢牢握在自己手中才是。\n\n在迅速镇压警视厅后，约两千人的义军部队分出去了一百人维持对警视厅的控制，而两百人则前去突袭赤坂附近的伏见宫邸和朝鲜李王邸，后者是次要的，但绝不能让博恭王找到机会，$JAP_pnr_ogishi_raiko$深知这一点。警视厅被镇压的消息已经特意散播出去了，现在帝都剩下的暴力机关一定会陆续启动。义军中的大部分人被安排在了半藏门，小部分则作为奇兵被安排在樱田门以“协助防御”为名混入。在里应外合打垮了本间健太郎的守备部队之后，义军们一拥而入控制了皇居，面对绝望的人数差距，此时正极为清醒的侍从武官长，本庄繁男爵只得在“威胁之下”说出了天皇陛下的位置。\n\n为了避免刚刚苏醒，还没搞清楚状况的陛下受到惊吓，义军们首先确保了陛下周围的安全，并开始在半藏门和皇居北侧重点构建防御工事。无论如何，这次行动都可以说是成功了——接下来只要等火车到站。\n\n$JAP_pnr_ogishi_raiko$其实并不赞同西田税的计划，但他确实有所怀疑，这也是他力排众议，要求优先确保天皇陛下安全的原因。相信过不了多久，本庄繁就会解决这个怀疑。"
  JAP_pnr_earlygame.39.a: "通知陆军省和参谋本部高官，我们已确保陛下安全。"
  JAP_pnr_earlygame.39.b: "“屈辱！贼军！你们是要搞观应扰乱！”"
  JAP_pnr_earlygame.40.t: "列车到站"
  JAP_pnr_earlygame.40.desc: "事情发生的比预想的要顺利，也比预想的要快。等到陆军省和参谋本部收到天皇已经被“保护”的消息的时候，另外动员起来，响应义军的约300人的部队也已经“保护”了整个三宅坂包括陆地测量部在内的所有陆军设施。随着加挂有皇族车厢的列车在早上驶入东京之后，那些霸占陆军中央的奸佞之辈也已经被迅速或清理或控制住了。\n\n一名义军军官首先向早已返回中央，等候多时的皇道派大员们报告了其发动“维新”的目的：\n\n自欧洲战争之后，国民思想丧失了可以依靠的信念，变得七零八落，相互排斥，这造成了一场大混乱。归根结底在于自由主义的毒破坏了日本的国体，遵奉天皇陛下，恪守皇道的心灵被散漫占据。其中最为严重的产物莫过于将[FRA.GetName]和[ENG.GetName]作为祖国，要从根本上爆破掉整个国家的日共，他们侵入到城市、农村、工厂以及学校之中。到现在，随着黑色星期一的爆发，终于就连军队、司令部甚至是华族之中都被日共入侵了。既然我们受到了陛下和普通国民的信赖以确保国防安全，我们便不能纵容国家在内部被破坏分子所摧毁。因此日本国内的情形需要明确地进行改造，第一步便是排除军队内部赤化的毒素，将名为“反皇道派”的，伪装的社会主义者和计划经济者统统消灭。他们的影响力已深入经济和政治机构，玩弄手段来令大部分国民疲惫不堪，我们将在未来，在天皇陛下的旨意下实现对这些腐败的清除。\n\n在听取了他们的报告之后，几位陆军高层中的皇道派成员都表示理解青年将校的行动，并且称他们是“忧国的纯情青年”。随后在西田税的陪侍下，秩父宫雍仁亲王也抵达了三宅坂。他亲自接见了义军军官并听取了相关意见，随后和其一同动身前往宫城。稍晚些时候，从宫中传来了一道明确的敕命，宣布东京进入紧急戒严状态。"
  JAP_pnr_earlygame.40.a: "奉天皇敕命，东京进入戒严状态！"
  JAP_pnr_earlygame.41.t: "悉数斩杀"
  JAP_pnr_earlygame.41.desc: "看到荒木和真崎两位大将走过来，村上启作大佐向两人敬礼问候，他早在这里等候多时了。“你怎么在这里，”荒木贞夫看到村上启作之后有点疑惑，“你不是应该和林大将在一起吗，怎么只有你一个人。”“林大将那边稍微有些事情耽搁了，是大回教协会的事情，具体我也不清楚。大将让我先来这里，好好招待二位大将和其他人。”几人一边交谈一边往料亭里进，村上启作紧紧跟在二人后面进行报告。\n\n“南大将呢，在乡军人会搞的联谊，他怎么也不来。当然我也不好苛责，毕竟嘛，$JAP_pnr_yoshiyuki_kawashima$也不知道跑到哪里去了。真是越来越散漫，我们之后可一定要严抓纪律，这样下去怎么成为能够为国分忧，践行皇道的皇军战士。嗯，村上，我想陆军省也要搞皇道教育，你作为军事课长，未来要好好表现充当表率。”\n\n“林大将说，他祝贺两位大将重返中央，作为‘三大将’之一要有礼物送给大家。”这话倒是让荒木停下了脚步，脸上也露出了笑容：“是吗？还说什么‘三大将’，倒也无妨，那我等下可要好好感谢他，礼物已经在里面了吗。还搞这一出啊。”\n\n等进到屋内，各位皇道派要人都安坐好之后，村上启作自然向大家展示了礼物：那是已经在院内安排好的清军派青年将校们。\n\n“切腹吧！陛下信赖作为帝国军人的你，难道是为了让你搞政变吗！你这样，怎么敢自称皇军，担负起扶翼皇运的精神！”荒木因为愤怒而面容扭曲，浑身发抖，然后直挺挺地倒了下去。村上启作则转过头去看着已经僵坐在那里的$JAP_pnr_masaki_jinzaburo$，用那把明治二十六年式转轮手枪对准了他的胸口。"
  JAP_pnr_earlygame.41.a: "老实说，这下赚了。"
  JAP_pnr_earlygame.42.t: "被毒害的生命"
  JAP_pnr_earlygame.42.desc: "“现在外面都在传赤匪的事情，”他一边扒着窗户探头向外看着那工人组成的，由标语和横幅汇聚而成的游行队伍，一边对另一边坐在那里抄写东西的人说，“游行和袭击案件越来越多，很难不让人想到里面有破坏国家的颠覆分子的阴谋。至于《国家保安法》，这东西没通过。那是怎样，党人们没有责任心，警察们也管不到事情，陆军自己忙于内斗，这样下去这个国家可要沦为野兽和横暴者的乐园，我国要成为亚洲地区的最大笑柄了。日莲上人说的自界叛逆难现在不就显现在我眼前了吗？这件事实在是使我忧愁。”\n\n“石原大佐，依我的观点，这一切内政紊乱依然还是国民精神的不团结和堕落引起的，不实现国民精神的改良是不能奢谈国家对外的形象，不论是《法华经》还是别的什么东西，若是自己不强健起来，又怎么谈消灭全人类的不幸。我们今天在这里不就是为了这件事而准备吗？”那人一边回答，一边没停下手头的动作，“从静冈出发到东京，制造一场‘和平的日比谷烧打’，那天你也同意了整个计划。”\n\n“我只是想《国家保安法》要是没通过就留这样的后手，怎么真的用上了。不管现在怎样都好，一定要让社会意识到这件事的严重性——大川博士，所以你一直在写什么？”\n\n“我在写檄文，”大川周明抬起头来。"
  JAP_pnr_earlygame.42.a: "“给[JAP.GetLeader]的。”"
  JAP_pnr_earlygame.43.t: "“第二次日比谷烧打”"
  JAP_pnr_earlygame.43.desc: "其实大正是被裕仁皇太子毒杀的。"
  JAP_pnr_earlygame.43.a: "一切都在燃烧……"
  JAP_pnr_earlygame.44.t: "年糕是国贼"
  JAP_pnr_earlygame.44.desc: "裕仁陛下在进食年糕之时不幸被噎死。无法说话、无法咳嗽、面色青紫、双手抓喉。在明仁陛下长大之前，秩父宫殿下已担起责任，短暂作为摄政。"
  JAP_pnr_earlygame.44.a: "呃……不幸的可怜人。"
  JAP_pnr_earlygame.45.t: "忧国的青年"
  JAP_pnr_earlygame.45.desc: "“还在说什么行为激进的忧国青年，杀害朕股肱老臣的凶暴将校，令朕悲痛欲绝，又有什么好体谅的呢——海军能够信任吗，博恭王？”裕仁转过头去问坐在另一侧的伏见宫，“虽然有先前五·一五的问题，但我想让舰队开进来镇压他们如何？”在行动部队占据了警视厅并控制了广播系统之后，宫内便紧急举办了御前会议，商讨如何处理此次叛乱。在经过联系之后已经确认包括[JAP.GetLeader]和斋藤实在内的人员已经死亡，毫无疑问，起事的军官们确实如其所说将他们全部消灭了。“陛下，您当然可以信赖海军，况且所谓五·一五事件，我想这也是有人从中作祟——”他瞟了一眼对面的林铣十郎，“当然，把军舰开进来对准叛军这可以做到，只是召集海军陆战队要有一些时间。我想最好的方案是拜托陆军动起来。呵呵，这您可要问林大将了。”\n\n“陛下！恕臣直言，此时调动陆军镇压恐怕太过不妥，依臣所见应该先与青年将校交谈，促成和平的劝导解散，贸然镇压不仅无益社会稳定，更将有损于大元帅之威信。”“本庄！朕在问林大将，你何以为此等贼军开脱。林大将，我想听听你的意见。”\n\n“我同闲院宫殿下凭谕旨一同调动陆军必然不难，但是陆军内部整肃尚未完成，我想难免有同情者。纵然不会直接抗命，但恐怕会三番五次地推脱……”他瞟了一眼对面露出奸笑的那只海军老狐狸，“陛下若是有命令，我必竭力促成。”\n\n“若是陆军扭扭捏捏，朕既然身为陆海军大元帅，就亲自率领近卫师团出去平叛！”他突然叹了口气，随后转身向内走去，“我先离席。”"
  JAP_pnr_earlygame.45a.desc: "$JAP_pnr_earlygame.45.desc$\n\n内屋之中空荡荡的，裕仁就站在那里，曾经在这里的亲密侧近如今都被所谓的“忧国青年”当作“国贼”斩杀。他一直恪守西园寺等人教导，自多年前访问不列颠帝国后，希望能维持自己超然君主的地位——如今看来失败了，在自己最需要帮助的时候，那些曾经帮助自己的侧近却都不在身边——“京中尚觉冷清，何况云霭不散，五月梅雨连绵的吉野深山。”\n\n他转身回到了御前会议。"
  JAP_pnr_earlygame.45b.desc: "$JAP_pnr_earlygame.45.desc$\n\n内屋之中，那死里逃生的疲惫老者一见他走进来，便走到他身边压低声音重复那告诫：“陛下心中愤懑，我可以理解。只是希望陛下不要再说亲自平叛这样的话，越过了您长期以来恪守的这条线既有损于君主的权威，日后若是为世人所知，还要引来不必要的政治麻烦。”“西园寺公，”裕仁的声音里带着失落，“我要怎么驾驭呢，你怎么看，我要和他们说什么呢？”"
  JAP_pnr_earlygame.45.a: "朕乃汝等军人之大元帅，岂能不亲自平叛？"
  JAP_pnr_earlygame.45.b: "宣布他们为贼军，让陆海军自己去办。"
  JAP_pnr_earlygame.46.t: "反皇道派“政变”"
  JAP_pnr_earlygame.46.desc: "老人们对青年说：“这里有世界上的一切果物奇珍，有软管日夜流出牛奶、甘泉和美酒，有世界上一切的美妇人，擅于乐舞歌唱，但惟有英雄武士才配得享用。”于是青年遂踏上征程，杀死沙漠里的毒蝎，狩猎大海中的巨兽，回答守门人的三个谜语，终于完成了任务。他就像鹰一样翱翔在天空，落在了花园里。在广阔的冒险之后，这美丽的花园多么逼仄啊，他被锁在花园里，又盼望起外面的太阳。——“怎么样，我写得还可以吧。”桥本欣五郎和对面同样佩戴“天保钱”的长勇碰杯，随后询问坐在旁边的女人对自己作品的感想。\n\n【东京地方讯】在昨天夜里陆军发动了一场“政变”，此次政变并不是为了推翻政府，而是清除在陆军内部的反对势力。自林铣十郎大将卸任陆军大臣之后，统称为“皇道派”的陆军内部集团便大肆展开了排除异己的行动，这最终引发了陆军系统内部“反皇道派势力”，主要为佐官将校群体的反击。就在昨晚，陆军大臣川岛义之，新任参谋次长真崎甚三郎大将，宪兵司令官秦真次中将等皇道派要人被悉数暗杀。\n\n令人意外的是，这场血腥的陆军内部斗争却并未引发宫中对此的任何激烈批评，而参谋总长闲院宫载仁亲王则称此次事件“令人震惊且遗憾”，希望政变参与者能好好反思自己的所作所为。一些小道消息称永田铁山在兴津坐渔庄拜见西园寺公望后，西园寺赞扬他们的“政变”血腥且迅速，并借此得以保全帝国未来之命运。但目前尚无明确证据表明此事有宫中集团在背后参与。参与此次暗杀行动的主要成员：桥本欣五郎中佐、长勇中佐、酒井中佐、真方大尉等人已被控制，军法会议不日将对这些政变执行者进行审判。"
  JAP_pnr_earlygame.46.a: "拥立林大将出任首相。"
  JAP_pnr_earlygame.46.b: "宇垣一成更适合这个位置！"
  JAP_pnr_earlygame.47.t: "[SOM.GetName]暂停自我国进口商品"
  JAP_pnr_earlygame.47.desc: "坏消息又从另一头的非洲大陆传来，在[EGY.GetName]以“黑色星期一”为理由停止履行和我们之间的贸易协定之后，[SOM.GetName]也选择停止购买我们的轻工业产品。受到“黑色星期一效应”的影响，非洲之角最终失去了所有的外资企业与本就捉襟见肘的外汇储备。他们一直在强调自己并非“故意”，但他们最好亲自去和船上的那些产品去说。"
  JAP_pnr_earlygame.47.a: "我不想听。"
  JAP_pnr_earlygame.48.t: "我们失去了在[PHI.GetName]的市场"
  JAP_pnr_earlygame.48.desc: "尽管长期以来[PHI.GetName]都是[USA.GetName]忠实的自治邦，且美国商品在[PHI.GetName]还享有免税特权这种近乎“作弊”的经济优待，但在过去的日子里我国还是凭借价廉物美的商品稳稳位列[PHI.GetName]的第二大贸易伙伴的位置。在马尼拉和达沃等地，日本移民和日本公司共同建立了庞大的商业网络，一度垄断了菲律宾超过37%的零售贸易。我国商人能取得这些成就虽然有[USA.GetName]深陷大萧条的原因，当然也离不开他们自己的努力和奋斗。正是因为这样，今天发生的一切才让人心有不甘。仅仅是由于欧亚大陆另一端的柏林证券交易所出了问题，所连带产生的这场金融风暴却近乎摧毁了菲律宾的贸易收入。\n\n[PHI.GetAdjective]政府已经宣布将尽一切可能弥补贸易逆差，其中就包括对“威胁本国商业之外国垄断势力”加征更高额的关税。他们甚至要求重新检讨去年日美两国就我国棉布输菲问题的“绅士协定”（Gentlemen's Agreement），进一步压缩我国每年能向[PHI.GetName]出口棉布的总量。如今“小东京”达沃已经失去了往日的热闹，大规模农业和矿业开发都已被闲置，这一切只是因为那个星期一……"
  JAP_pnr_earlygame.48.a: "勤劳者又做错了什么？"
  JAP_pnr_earlygame.49.t: "失去十年的梦魇"
  JAP_pnr_earlygame.49.desc: "首先是2%，然后是12%，接着是11%。25%，25%，25%。这就是在过去一周内，道琼斯指数下跌的数值。四分之一的投资总额已经灰飞烟灭，消失在市场的深渊之中。柏林股市中投资者信心的崩溃为仍受大萧条困扰[USA.GetName]送去了另一份沉重的大礼。洛克菲勒家族尝试通过大量买入来拯救股市，但现实就是他们输了。悲观地讲，在可见的未来里，这种情况会一直持续下去，直到美国股市里的每一只股票都失去一切价值，投资者的信心将一直维持着破灭状态，毕竟对[USA.GetName]来说，未来根本没有什么希望可言。\n\n现在这种经济的苦闷也缠上[JAP.GetName]了，就像在过去几天里传到大藏省的数十件坏消息那样，大洋彼岸垂死的巨人这次“更加”死了。尽管[USA.GetName]此前受到大萧条困扰，但尚还有余力与我们进行贸易，我国始终是[USA.GetName]在国际上的第三大贸易伙伴，是和[IMP.GetName]不同的，“守信的”优质伙伴。我国一直从[USA.GetName]处购买原油，回收金属以及一系列机械设备，而向其输出生丝与其他商品。但如今这些东西都得不到了，既有美国制造业的问题，也有我们自己的问题：我们的外汇储备经紧急重编之后已经无力再担负先前那种规模的贸易。那个本来已经近乎被封印的恶鬼从阎罗地狱中又爬出来了，它燃烧的爪子抓住了[JAP.GetName]，要把她也一同带到下面去。"
  JAP_pnr_earlygame.49.a: "放开我的脚……"
  JAP_pnr_earlygame.50.t: "黑色星期一的微澜"
  JAP_pnr_earlygame.50.desc: "在2月初，德国经济市场经历了一场和我们在1920年情况极为相似的，被称为“黑色星期一”的世纪大崩盘。东京交易指数在得到该消息后立刻下跌了7%，不过当天就强势修复了6.7%，走出了一波漂亮的深V走势。大藏省认为这是由于夜间利空发酵导致的恐慌盘洗净，随后的强势修复证明市场仍对危机抱持乐观态度。\n\n得益于德国市场长期以来对我们的排挤，日本经济在德国主导的世界贸易体系中只位于边缘位置，这场经济危机的余波跨越大洋来到我们的岸边时已经变得温和可亲，甚至还不如东京湾中最小的浪头。虽然国内经济没有受到什么影响，但那些在国外有所投资的财阀与个体投资者想必是大出血了。总的来说“黑色星期一”目前看来对我国经济影响有限，仅仅是在社会上引起了些微骚乱，相信时间可以修复这份恐慌。"
  JAP_pnr_earlygame.50.a: "风平浪不惊。"
  JAP_pnr_earlygame.52.t: "日本银行宣布暂停银行券兑换"
  JAP_pnr_earlygame.52.desc: "黑色星期一的影响已经蔓延到了帝国内地之外的疆域：[KOJ.GetName]和[TAI.GetName]的许多民众在恐慌中尝试将他们手中的朝鲜银行券和台湾银行券兑换成日元，在两地引发了挤兑。今晨，大藏省颁布了关于黑色星期一的紧急命令，日本银行、朝鲜银行和台湾银行随后联合发表声明，宣布将暂停四周当地银行券和日元之间的相互兑换，并将视情况延长兑换禁令。这意味着帝国经济圈的暂时解体。\n\n我国目前维持着一种奇妙而经过精心设计的经济模式，即在本土发行日元，而在两大总督府分别授权对应的特殊银行机构（即朝鲜银行和台湾银行）发行对应的特殊货币：朝鲜银行券和台湾银行券。这两种银行券在对应的总督府区域被视为法定货币流通，并且能通过银行兑换为等额的日元。然而东京始终掌握着“兑换权”，这意味着我们可以在经济情况恶化的时候通过暂停货币兑换来将经济危机锁死在各自的区域而不相互影响，形成更坏的后果——没人想再经历一次西南战争时期因为纸币滥发而导致货币暴跌的危机了——但现在的暂停兑换只是把装着炸弹的盒子盖上，然后装作那里没有炸弹，寄希望于盒子里面有什么东西能够剪断引线。现在我们只能祈祷[KOJ.GetLeader]和[TAI.GetLeader]两位总督能够凭借自己的智慧渡过这次危机，届时我们便能重启日元经济圈。"
  JAP_pnr_earlygame.52.a: "没什么好怕的！"
  JAP_pnr_earlygame.53.t: "片目的伟人"
  JAP_pnr_earlygame.53.desc: "那时，大国常立尊就这样在我面前显现了，他的身体是多么神圣庄严而不可侵犯，崇高且伟大的形象充满了整个世界。随着他的显现，在我的异象之中首先生成了无穷无尽的日月星辰，在他手覆盖的地方立刻生成了巍峨的高山和茂盛的草木。我被国祖的显现而震慑，伏拜在他面前不敢抬头。他从口中吹出气来，那气立刻变作了风，又变成十二位男女天使来到我身边，其中六位将我搀扶起来，另六位则手持卷轴围绕在我身边。\n\n“神须佐能袁命为何如此惊慌，”那为首的天使张开巨大的白色双翼，他的翅膀下松、竹、梅便开始生长，“不要忧愁，不要恐慌，凡有肉的见到我们都要被焚尽，直至虚假熔化，以彻底的纯净站立在国土之上。王仁三郎，你请听吧，打开你的耳朵，因为我就要宣布这灵界的奥秘了。”\n\n随着他的宣告，天上传来汇报讯息的铜钟响声，诸天使都齐声唱赞，“荣耀兮！荣耀兮！你当细听，你当谨记！因为这奥秘是可憎的，因为这奥秘是至福的，它曾在旧时写在无页的纸上，经天神的手出示给人类的始祖，而他看了便忧愁！哀哉！哀哉！有大祸了！”先前生长的松树裂开了，从中出现一个身披紫色斗篷，赤裸全身的男子，他左手持宝剑，右手拿着天平。那生长的梅花缠上了他的双腿，那生长的竹子刺穿了他的右眼。\n\n“圣哉！凡有一只眼的有福了，凡有一只眼的要留心了！小松林命啊，博学多智的人能解开这谜题？谁能解开？谁能解开？谁能解开？你能解开这谜题。你必解开这谜题。其中隐藏着重大的奥秘，到东京去吧，因为声音和景象就到此为止了。”"
  JAP_pnr_earlygame.53.a: "然后出口王仁三郎从梦中惊醒。"
  JAP_pnr_earlygame.54.t: "“圣师”突袭东京！"
  JAP_pnr_earlygame.54.desc: "如今的东京沉浸在压抑而紧张的氛围之中，《国家保安法》草案的泄漏为$JAP_pnr_inukai_tsuyoshi$遇刺后的东京政局又增添了一丝前途未卜的气息。值此特殊时刻$JAP_pnr_onisaburo$造访东京无疑是给各大报纸投下了一颗重磅炸弹，大家都想知道“圣师”如何看待《国家保安法》。尽管在大多数主流报纸中$JAP_pnr_onisaburo$一直被称为“有趣的媒体人士”（精神病患者的一种委婉说法），但昭和神圣会和“大本教”毕竟可以说是现在最具组织性，也是全国最大的右翼民族主义团体。\n\n就像以往那样，这位“圣师”总是会在出现的时候同时创造更多话题，他此次并非独自现身，而是带上了柳原前光伯爵之女，大正天皇的表妹，“筑紫女王”柳原烨子。二人一同现身于东京时简直就像是在向宫内省挑衅，而宫内省对他们行为的沉默则再一次激起了民间小报对那件“大不敬”传闻的揣测——$JAP_pnr_onisaburo$对《国家保安法》并未表现出太多兴趣，只是表示相信帝国议会能够代表民意，对该法案作出极为公正的裁断。看起来这位宗教领袖并不愿意被卷入这场政治斗争之中，但如果他不是为了特意到东京露脸，对《国家保安法》发表看法的话，那他这时候来东京的理由到底是什么？"
  JAP_pnr_earlygame.54.a: "至少没给我们添乱。"
  JAP_pnr_earlygame.55.t: "交谈之后"
  JAP_pnr_earlygame.55.desc: "说到东京中有名的“独眼龙”，那想必就只有不甘寂寞的$JAP_okawa_shumei$和神龙见首不见尾的北一辉了。大川周明的眼睛因罹患一期梅毒性白浊而遭到了损伤；而北一辉的右眼则是一颗义眼，他在小时候被路边的树枝刺伤了那颗眼球。简单来说，候选人物看起来有两位，$JAP_pnr_onisaburo$决定分别都见一见。\n\n和$JAP_okawa_shumei$的见面是在九段的军人会馆，此前他已听闻$JAP_okawa_shumei$在佐官之中颇有人气，在军人会馆之中被捧为座上宾也是情理之中。然而和$JAP_okawa_shumei$的对话却令$JAP_pnr_onisaburo$感到意外：眼前这个男人和自己从基督教聊到了马克思主义，最后又谈到对日本国民精神的鄙夷——他似乎是认为如今的[JAP.GetName]不过是个颠倒一切，妖魔横行的地狱罢了。当$JAP_pnr_onisaburo$问他要如何从这地狱中脱离的时候，$JAP_okawa_shumei$则说要靠“永恒发展的太阳生命”。总的来说是个非常有趣的人。\n\n不过很快$JAP_pnr_onisaburo$就在筑地治作这家高级料亭见到了另一位令他惊叹的人——北一辉在包间里左拥右抱着两个女人和他神情自若地交谈，与充满诗性的$JAP_okawa_shumei$不同，这个独眼革命家似乎始终在讲述某种可以直接实践的危险行动。期间有两位年轻军官前来拜会北一辉，在看到$JAP_pnr_onisaburo$之后便要他这个巫师施法立刻下雨，给今晚的会面增添一点雅趣。面对这等无礼的挑衅，$JAP_pnr_onisaburo$本来一笑置之，可北一辉却突然对着两人大吼道：“不许对大本的人无礼！”随后要求二人立刻道歉。\n\n如今交谈已经结束，两人之中只有一位是神谕指向的对象，又或者说，$JAP_pnr_onisaburo$按了一下自己的帽子，其实这既不是单选，也不是多选题？\n\n“你必解开这谜题。”小松林命在他身边重复了一遍。"
  JAP_pnr_earlygame.55.a: "北一辉正是预言之人。"
  JAP_pnr_earlygame.55.a_tt: "§S“圣师”坚定了他所得到的神谕，他向北一辉伸出援手。§!\n§0即便其在当下虚弱无力，昭和神圣会与其的合作也能力挽狂澜。§!"
  JAP_pnr_earlygame.55.b: "大川周明才是那位紫衣之王。"
  JAP_pnr_earlygame.55.b_tt: "§o“圣师”坚定了他所得到的神谕，他向大川周明伸出援手。§!\n§0即便其在当下虚弱无力，昭和神圣会与其的合作也能力挽狂澜。§!"
  JAP_pnr_earlygame.55.c: "或许谜题尚未揭示，二人都不是答案。"
  JAP_pnr_earlygame.55.c_tt: "§n“圣师”仍在寻找神谕的答案。§!"
  JAP_pnr_earlygame.56.t: "久疏问候"
  JAP_pnr_earlygame.56.desc: "试图以所谓“赤色势力”的猖獗来推行旧法律的复活，不过是当前内阁与地方报人可耻的利益交换，为了使《国家保安法》顺利通过，内阁和地方新闻业者在幕后进行着这样的丑陋交易。内阁私下里和秋田县的安藤和风达成协议，以其人脉在各家报纸搬弄是非，将了无关系的工人的愤怒说成是共产党的阴谋，借此来在国民之中制造恐慌。\n\n在安藤这样的无良报人这样做了之后，他们立刻得到了诸如羽越本线改良这样的地方利益。内阁以此表彰他们作为政府奴隶的忠心。\n\n真是令人不齿且震惊！本应作为国民的眼睛和嘴巴，看到所有不公正和说出所有不公正的报业记者，竟和政府串通一气来愚弄国民，真是岂有此理！原先圣洁的帝国议会，正是因为像这样污浊不堪的小人混入其中，把立法权用得彻底脏污，损害了天皇陛下的神圣威严而变得堕落！今日这等丑闻的发生，岂不是又证明了议会关闭的正当性！唉，这帝国议会本是广纳民意的场所，怎能成为无良党人瓜分利益的乐园。有勇气的国民只要刺死他们，揭开面纱，便能发现内里不过是古老的藩阀。天下竟有此等不公正之事，真是奇观啊。国民们！请务必审视这一肆意践踏立法权，愚弄你们的荒唐现实！\n\n\n\n立刻给宇田川町送来八千日元，你知道位置。不然我想这篇文书散播出去，社会就会很躁动。北一辉敬上。"
  JAP_pnr_earlygame.56.a: "怎么又来敲竹杠。"
  JAP_pnr_earlygame.56.b: "我们……有的是！你还可以再添一个女仆！"
  JAP_pnr_earlygame.56.c: "我们一分钱都没有！"
  JAP_pnr_earlygame.56.c_tt: "§q北一辉不过是一个写文章敲诈当权者的日莲宗狂徒，但在这个时候，我们不满足他的要求真的是个好选择吗？§!\n\n§R这或许将导致首相在某些政治情况下遭遇不测。§!"
  JAP_pnr_earlygame.57.t: "我要最便宜的"
  JAP_pnr_earlygame.57.desc: "先前不是说，我被人介绍去银座交询社当差了吗，虽说那些厉害人物都在包间里，但是外面散座也有不少不得了的人物。结果啊那一天，有个家伙别着议员胸针，散发着乡巴佬的气息。说是这样，我还是立刻带着酒单迎上去问他是否需要点什么，顺道“无意地”用手指捏着波特酒的位置，没想到他完全不吃我的暗示，看也不看就直接对我说：“我要最便宜的！”那家伙毫不留情地这样说！所以我只好给他备了根本没人点的柠檬水。这种寒酸鬼是交询社的会员，简直不可思议。\n\n风见章捏着那杯7钱的柠檬水走到了那个留着卫生胡的男人身边：“风见！你看那个，马上要建好了——”见他走了过来，男人一把伸手搂住他，一边用那只抓着横滨鸡尾酒的手指着窗户另一头被灯光照亮的永田町，“国会议事堂我想很快就要启用了。终于不用在木屋子里呆着了。”风见章对欣赏权力象征不感兴趣：“先前同您谈的农村躁动的事，您有委婉地和陛下谈过吗？”“嗯——我听说新议事堂的中央塔有六十米高。”“先前同您谈的农村的事，您有和陛下谈过吗？”风见章又把问题重复一遍。\n\n“当然！我当然在打高尔夫的时候委婉地说了。宫中，陛下自然很关切，非常关切。”他眼睛向上看着天花板。“六十米，比这楼高多了，确实力压群雄啊。啊对，你要不要认识一下其他人，小泉信三今天也在。”\n\n他把那杯柠檬水放在台子上，迅速转换了话题：“这段时间我做了一点农村地区情况的调查，我想情况比估计的要糟。我准备借着这次临时会的机会来迫使政府把《小作法》和其它类似的东西确定下来。我可以提供资料，如果您能帮我游说一下的话。”"
  JAP_pnr_earlygame.57.a: "“不知道你有没有兴趣，近卫公爵。”"
  JAP_pnr_earlygame.58.t: "产业界的援手"
  JAP_pnr_earlygame.58.desc: "回望十年之前，那时财阀的赞助是政党维持正常运作的最有力的后盾。随着1928年《普通选举法》的实施，一开始商界精英们并未过多惊讶于水涨船高的选举赞助费用。但“悬峙议会”就这样延续了下来，而这些商人们立刻意识到继续为在议会中相互对峙的各大政党提供巨额资金，从而要求他们推行于自己有利的政策已变成一项收益不高的买卖。\n\n产业界与政党之间的纽带就这样奇妙地破裂了，像是$JAP_pnr_social_conservative_party$这样古老且颇具威名的政党，也因这一事件沦落到要依靠$JAP_kuhara_fusanosuke$、中岛知久平等与产业界密切相关的党员提供党务机关的运作资金，正是这一原因迅速导致他们在政党中地位的崛起。然而如今看来，政党和产业界间的这一纽带似乎有修复的可能。\n\n并非是三菱或三井等具体的财阀产业，而是作为产业界总代表的东京工业俱乐部日前和[JAP.GetRulingParty]私下接触，他们认为本届政府并非如媒体所言将在选举后黯然离场，为此他们愿意在选举期间内给我们提供一笔丰厚的竞选赞助，代价是如果我们胜选，希望我们能在未来多多关照他们的事业。短期来说，他们希望届时组建内阁时，能够提名他们推荐的人担任商工大臣。我们该遵从他们的意思吗？还是说我们可以先假意答应，日后再说？"
  JAP_pnr_earlygame.58.a: "真是及时雨啊！"
  JAP_pnr_earlygame.58.b: "这样的事情传出去恐怕名声不好。"
  JAP_pnr_earlygame.59.t: "党内元老们"
  JAP_pnr_earlygame.59.desc: "$JAP_pnr_social_conservative_party$先是失去了把持了将近十年的内阁，继而又沉浸在失去了$JAP_pnr_inukai_tsuyoshi$的悲痛之中，不过对大多数党员来说，痛苦转瞬即逝。毕竟如今$JAP_pnr_market_liberal_party$虽然夺去了内阁，但他们直接迎面撞上了这场突如其来的全球大萧条。毫无疑问，[JAP.GetLeader]在这场突发灾难中的任何无谓的挣扎，在未来或许都将转化为$JAP_pnr_social_conservative_party$重夺首相之位的垫脚石。\n\n而$JAP_pnr_inukai_tsuyoshi$的死亡也是如此，面对这场血腥的杀人案，民众除了同情那些“被逼到走投无路”（关于他们为什么这么认为，各位党员也在找原因）的杀手外，也对死去的$JAP_pnr_inukai_tsuyoshi$表示了同情。有小道消息称，[JAP.GetLeader]收到了死亡威胁，要他代替$JAP_pnr_inukai_tsuyoshi$去死，这侧面证明了$JAP_pnr_market_liberal_party$的执政失败。\n\n除去正在朝鲜总督府担任朝鲜总督的川村竹治之外，$JAP_pnr_social_conservative_party$内部的元老们举行了一场秘密会议，毕竟作为一个政党，必须有一位能够代表全党员的党首在台前才是，尤其是在$JAP_pnr_inukai_tsuyoshi$死亡的当下，“遗愿的继承者”想必能赚足社会的眼球。"
  JAP_pnr_earlygame.59a.desc: "$JAP_pnr_earlygame.59.desc$\n\n许多人都清楚$JAP_pnr_inukai_tsuyoshi$生前曾与[loc_first_party_election_0]结盟，尽管宪政之神的光环有所褪色，但大多数人都支持尊重前任总裁的遗志，推举[loc_first_party_election_0]出任党内总裁才是正道，在当下逆潮流而动无疑会打击党内凝聚力。\n\n许多人都清楚$JAP_pnr_inukai_tsuyoshi$生前曾与[loc_first_party_election_0]结盟，但大家也知道，$JAP_pnr_inukai_tsuyoshi$在生命将近的时刻似乎改变了想法：一些党员此前曾询问过$JAP_pnr_saionji_kinmochi$的秘书为何最终对$JAP_pnr_market_liberal_party$降下组阁大命，最终得到的回复却是$JAP_pnr_inukai_tsuyoshi$向元老推荐了[loc_first_party_election_1]，但元老并未采纳。这件事很快就$JAP_pnr_social_conservative_party$内几乎全党知晓，一些人视其为$JAP_pnr_inukai_tsuyoshi$在党内派阀斗争的立场发生转变的证据。但还没等$JAP_pnr_inukai_tsuyoshi$本人对这一事件作出澄清，他就不幸死于凶残的军官之手了。尽管宪政之神的光环有所褪色，但大多数人都支持尊重前任总裁的遗志，推举[loc_first_party_election_1]出任党内总裁才是正道，在当下逆潮流而动无疑会打击党内凝聚力。"
  JAP_pnr_earlygame.59b.desc: "$JAP_pnr_earlygame.59.desc$\n\n许多人都清楚$JAP_pnr_inukai_tsuyoshi$生前曾与[loc_first_party_election_0]结盟，但大家也知道，$JAP_pnr_inukai_tsuyoshi$在生命将近的时刻似乎改变了想法：一些党员此前曾询问过$JAP_pnr_saionji_kinmochi$的秘书为何最终对$JAP_pnr_market_liberal_party$降下组阁大命，最终得到的回复却是$JAP_pnr_inukai_tsuyoshi$向元老推荐了[loc_first_party_election_1]，但元老并未采纳。这件事很快就$JAP_pnr_social_conservative_party$内几乎全党知晓，一些人视其为$JAP_pnr_inukai_tsuyoshi$在党内派阀斗争的立场发生转变的证据。但还没等$JAP_pnr_inukai_tsuyoshi$本人对这一事件作出澄清，他就不幸死于凶残的军官之手了。尽管宪政之神的光环有所褪色，但大多数人都支持尊重前任总裁的遗志，推举[loc_first_party_election_1]出任党内总裁才是正道，在当下逆潮流而动无疑会打击党内凝聚力。"
  JAP_pnr_earlygame.59.a: "就这么定了"
  JAP_pnr_midgame.1.t: "政友会穿越风暴"
  JAP_pnr_midgame.1.desc: "在反政友会势力的多方围剿之下，$JAP_pnr_social_conservative_party$成功击退了他们，保住了自己在日本政治界中的地位。由于$JAP_pnr_social_conservative_party$在此次众议院选举中最终夺得绝对多数地位，那些密谋者们几乎立刻便陷入了垂头丧气，并且自然而然地因争吵和互相责怪而解体了。但$JAP_pnr_social_conservative_party$内部情况仍不容乐观。\n\n在通过了大选的考验之后，党内部暂时团结起来的各利益集团也随着外部威胁的消失重新开始了权力斗争——这主要是由于原敬死后的党内部始终没有出现一个能够统合各方的能人导致的。\n\n如今的$JAP_pnr_social_conservative_party$再次被迅速撕裂为两翼，其中一派支持原敬内阁时期的司法次官，官僚出身的铃木喜三郎。由于铃木交际广泛，任人唯亲，使得其身边聚拢了一群寻求实际政治利益的党员。特别是在因众议院长期维持“悬峙议会”，导致财阀向执政党输送援助的动力削弱之后，能从铃木手中得到资金这一点促使很多人追随他，但也正是由于他在$JAP_pnr_social_conservative_party$甚至是政治界扮演着“讲义气的大哥”的角色，在党外和新闻报界他简直是最恶劣的政治家的代名词。\n\n另一派则支持实业家出身的久原房之助，久原房之助过去曾依靠金钱打开通往政友会高层的道路，如今更是依靠提供资助在党内维持着庞大的支持者规模。最重要的是，此人似乎并非忠于$JAP_pnr_social_conservative_party$的政治愿景，而是希望借助党的名声为自己谋求利益。其时常会在公开场合留下直截了当，又让人感觉摸不着头脑的发言，此外他特立独行的行事作风和作为奇怪富豪的花边新闻早已在媒体和坊间为他打上了许多不怎么好的印象。"
  JAP_pnr_midgame.1.a: "不过我们现在士气正盛，这也没什么大不了的。"
  JAP_pnr_midgame.2.t: "中岛知久平表达合作意愿"
  JAP_pnr_midgame.2.desc: "随着党内总裁斗争暂时告一段落，此前那些特意和争斗维持距离的党员们立刻出现，试图在$JAP_pnr_social_conservative_party$重夺的政治秩序中谋求属于自己的位置。中岛知久平稍早些时候对商工大臣之位发起了挑战：这个位置本已预定给贵族院议员，长期支持$JAP_pnr_social_conservative_party$的三井财阀核心人物藤原银次郎。更为关键的是，藤原银次郎把握着一家在国内极为重要的公司——王子制纸，该公司与帝国海军之间关系密切。\n\n中岛知久平是海军军人出身，在离开海军之后，他投身于飞机制造业并转身成为实业界中举足轻重的军工财阀之一。和久原房之助一样，中岛知久平也凭借雄厚的财力在$JAP_pnr_social_conservative_party$中迅速成为了党内不可小觑的实权人物，并且很快倒向了铃木喜三郎一方，成为了铃木一派的慷慨资助人。其人在$JAP_pnr_social_conservative_party$内目前并未显露出任何政治抱负或野心，反而醉心于社会活动。中岛资助了东京帝国大学、东京商科大学等多家学府的社会学研究项目，试图梳理国内外政治经济现状，为政党施政提供参考——他的这一行为在社会上收获了不少好评，也是$JAP_pnr_social_conservative_party$少有地在报纸上以正面形象被报道的事件。\n\n中岛知久平此前曾在犬养毅内阁中担任商工省政务次官，他希望担任商工大臣这一点也是情理之中；但我们答应藤原银次郎在先，为此毁约恐怕将招致三井财阀的不满。"
  JAP_pnr_midgame.2.a: "如果你想要，我就会给。"
  JAP_pnr_midgame.2.b: "这个位置已经有人了。"
  JAP_pnr_midgame.3.t: "修复信任"
  JAP_pnr_midgame.3a.desc: "中岛知久平不论是在东京工业俱乐部中还是在各类面向社会的公开教育讲座中都是一位受欢迎的人物，一些没有见过他的人或许会以为他是一个八面玲珑的社交家，但当他手足无措地出现在演讲台上的时候，大多数人可能都会意识到他是个很纯真的人，正是这种大多数党人不具有的特质才令他受到人们的赞扬。\n\n中岛知久平今天下午出席了东京商科大学的公开讲演会——毫无疑问，这场公开讲演会背后的最大资助者正是中岛知久平本人——该讲演会以《走出黑色星期一，请讲讲你的看法》为题，邀请了许多经济学教授、实业家以及曾经参与过政策制定的中央官僚参加。从农村土地改革的必要与否到中央行政效能的分析，与会者从各方面讨论了国家从经济危机中复苏的各种办法。在会议的最后，中岛登上讲台发表了总结演说，他首先感谢了所有参会的受邀专家，称[JAP.GetNameDef]有如此多优秀的精英实乃一大幸事。随后又谈到了$JAP_pnr_social_conservative_party$计划实施的相关政策。\n\n中岛知久平目前身为本届内阁的商工大臣，透露未来内阁将在议会努力推动通过一部刺激先进技术开发，从而促进实业发展的法案。他还称自己明白$JAP_pnr_social_conservative_party$现在在社会上被国民称为“不学无术者”和“贪恋权位者”，而本届内阁将会以实际行动扭转国民对政党的这种印象，修复大众对政党政治的蓬勃信心。"
  JAP_pnr_midgame.3b.desc: "中岛知久平不论是在东京工业俱乐部中还是在各类面向社会的公开教育讲座中都是一位受欢迎的人物，一些没有见过他的人或许会以为他是一个八面玲珑的社交家，但当他手足无措地出现在演讲台上的时候，大多数人可能都会意识到他是个很纯真的人，正是这种大多数党人不具有的特质才令他受到人们的赞扬。\n\n中岛知久平今天下午出席了东京商科大学的公开讲演会——毫无疑问，这场公开讲演会背后的最大资助者正是中岛知久平本人——该讲演会以《走出黑色星期一，请讲讲你的看法》为题，邀请了许多经济学教授、实业家以及曾经参与过政策制定的中央官僚参加。从农村土地改革的必要与否到中央行政效能的分析，与会者从各方面讨论了国家从经济危机中复苏的各种办法。在会议的最后，中岛登上讲台发表了总结演说，他首先感谢了所有参会的受邀专家，称[JAP.GetNameDef]有如此多优秀的精英实乃一大幸事。随后又谈到了$JAP_pnr_social_conservative_party$计划实施的相关政策。\n\n虽然坊间先前一度传闻中岛知久平将出任[JAP.GetLeader]内阁的商工大臣或铁道大臣一职，但在最终的组阁名单上却不见他的名字。不过在本次公开讲演会上，中岛知久平称自己虽然不在内阁中任职，但会担负起作为“国民的代表”的责任，把各位专家的意见以及在演讲会开始前和开始后各位听众对当前经济现状的看法妥善转达给[JAP.GetLeader]内阁总理大臣，他宣称自己知道目前在社会上，许多国民称$JAP_pnr_social_conservative_party$为“不学无术者”和“贪恋权位者”，而本届内阁必定将以实际行动扭转国民对政党的这种印象，修复大众对政党政治的蓬勃信心。"
  JAP_pnr_midgame.3.a: "纯真之心是无价之物。"
  JAP_pnr_midgame.3.b: "以我之见，不过是城府极深的老狐狸。"
  JAP_pnr_midgame.4.t: "推进地方自治分权"
  JAP_pnr_midgame.4.desc: "翻开$JAP_pnr_social_conservative_party$的政党史，人们就能够意识到这实际上是一部地方和中央的斗争史。自1888年日本政府建立了市町村制度以来，地方权力便始终受到中央政府的严格监督。长期以来内务省的中央官僚们控制着府县知事的任命权，而知事们则控制着郡役所，郡役所则压制着町村及相关自治机构。1923年，在原敬内阁的极力推动下，郡役所终于被废除，其原本掌握的权力被分给府县和町村，从而直接强化了町村自治的能力。但$JAP_pnr_social_conservative_party$的这一行为并非是为了单纯向作为自己支持者的地方士绅们输送政治利益，其背后有着另一重考量，即税收。\n\n世界大战结束之后紧张的国家预算迫使政府作出行动，$JAP_pnr_social_conservative_party$期望通过将本该由中央政府征收的地租税移交给市町村，从而在地方上创造出稳定的独立税源，以减轻中央对地方的教育和基础设施维护等公共事业的费用。这项计划在议会之中始终缓慢推进着，并在田中义一大将统治时期短暂中断。而在宪政恢复之后的$inukai$内阁却陷入了“悬峙议会”，此时继续削弱内务省的力量无异于自杀，因此地方自治分权的相关工作陷入停滞也不奇怪了。然而如今$JAP_pnr_social_conservative_party$已完全控制住议会，[JAP.GetLeader]首相正准备重新推进该改革以强化自身在基层的支持和在党内的权威。"
  JAP_pnr_midgame.4.a: "有趣，接下来会如何发展？"
  JAP_pnr_midgame.5.t: "土地改革的命运"
  JAP_pnr_midgame.5.desc: "几位住在东京，长期以来始终支持我们的地方地主最近拜访了我们的党部，在谈话中，他们委婉地提到了犬养毅内阁时期通过的那部《米谷自治管理法》，认为依据该法案在地方推行的土地改革实际上严重损害了基层组织之间的如同一个大家庭一样的温情——或者更直白地说是他们的利益。\n\n他们首先认同政府所说的“农村处于危机之中”，但他们并不认为所谓的“土地问题”已经到了极为尖锐的地步。如果我们相信他们的说法，农村地区始终保持着充满温情的“家庭关系”。即便已经搬到城市中，但每年土地所有者还是会有几天回到乡下，关心佃农的平常生活，并在适当时刻慷慨地给予减租；而佃农则热爱劳动，用耕种土地来回报地主。偶尔也会有一些“又穷又懒”，想着不劳而获的的家伙尝试挑拨这种农村温情，相信正是这些人误导了中央政府。况且就算这些懒蛋拿到了土地，到最后这些土地还是会被他们卖给地主换钱或者就是丢在那里任其荒芜。\n\n他们的想法是，《米谷自治管理法》是当初议会妥协的产物，既然如今$JAP_pnr_social_conservative_party$已经彻底掌握众议院，相信内阁能够通过修正案或干脆废止该法案，从而重新恢复农村小集体的和平生活状态。"
  JAP_pnr_midgame.5.a: "老实说，我一开始就觉得《米谷自治法》不对劲。"
  JAP_pnr_midgame.5.b: "故事不错，下一个。"
  JAP_pnr_midgame.6.t: "三井财阀资助我们！"
  JAP_pnr_midgame.6.desc: "一切都向着好的方向发展，随着我们掌握了议会多数，那些过去因$JAP_pnr_social_conservative_party$无力施展对政治的控制的家伙又一次聚集在了我们身边，其中前后转变最剧烈的便是三井财阀。\n\n$JAP_pnr_social_conservative_party$最拮据的时期，也就是犬养毅执政的最后几年，那段时间同时也是诸多昔日盟友疏离$JAP_pnr_social_conservative_party$的时期。由于内阁无力维持对众议院的控制，即便犬养毅名义上控制着政权，但是却难以不加修改地推行任何法案。意识到内阁只是光杆司令的政党合作者们迅速削减了对$JAP_pnr_social_conservative_party$的资助，其中裁缩赞助最为激烈的便是三井财阀。在那段时间里，他们甚至停止了对$JAP_pnr_social_conservative_party$平时的赞助，而就算是举行众议院选举，他们也只愿付出几千日元的帮助，“因为$JAP_pnr_social_conservative_party$的价值目前配得上这么多钱”，前去请求更多支援的党员被对方如此回复。\n\n但随着[JAP.GetLeader]内阁的确立，三井财阀则一改先前的冷淡态度，和$JAP_pnr_social_conservative_party$谈到了昔日的种种“情谊”，试图重建二者之间的联盟：他们首先是高调宣称将每月提供三万日元的赞助（相当于$JAP_pnr_social_conservative_party$党务机关每月运作所需的四分之一），随后又暗示希望[JAP.GetLeader]在某些特定产业上给予“照顾”，以实现政界和商界的步调一致，从而打造更更美好的[JAP.GetAdjective]社会。"
  JAP_pnr_midgame.6.a: "天下熙熙，皆为利来。有钱大家一起赚。"
  JAP_pnr_midgame.6.b: "那就要看你们有没有这个“价值”了。"
  JAP_pnr_midgame.7.t: "党内分裂的批评"
  JAP_pnr_midgame.7.desc: "党内实力派人物，先前在$JAP_pnr_inukai_tsuyoshi$内阁出任商工大臣一职的前田米藏最近在一次私人宴饮上对[JAP.GetLeader]乃至于整个$JAP_pnr_social_conservative_party$都提出了批评。他宣称在1927年由$JAP_pnr_inukai_tsuyoshi$确定下来的$JAP_pnr_social_conservative_party$总裁公选制直到现在都未曾正式实施，如今的总裁依然是由党内元老们本着“尊重$JAP_pnr_inukai_tsuyoshi$的意愿”通过密室政治推举，而非经过公选选出的。虽然即便举行公选结果也大概不会改变，但不举行公选直接让[JAP.GetLeader]继任总裁显然不符合先前党内定下的规定，更谈不上是尊重所谓“遗愿”了。\n\n他的批评随后又转到了党内分裂的问题上，即[loc_seiyukai_enemy_0]和[JAP.GetLeader]之间的争斗，以他之见，如今政党内的无谓内耗正是由于这种密室政治导致的，而想要结束这种内耗，确立步调一致的党内纪律，最好的方法就是择期再举行一次总裁公选。前田米藏在原敬内阁时期曾一度控制$JAP_pnr_social_conservative_party$所谓“关东军团”，即党在关东地区的政治网络。但随着铃木喜三郎势力在党内的崛起，并逐步接管该政治网络，前田米藏的党内势力便受到了严重打击；然而他和久原房之助之间的关系也并不能谈得上多好，久原曾主张彻底摧毁议会，或者退而求其次建成一个“单一政党”执政，该想法毫无疑问有悖于宪法。这样一个被夹在两方中间的党内中坚派在平时恐怕是人厌狗嫌，但在党内两派对峙的当下却充满了拉拢价值……"
  JAP_pnr_midgame.7.a: "老东西，没被邀请组阁就说胡话。"
  JAP_pnr_midgame.7.b: "或许他是对的，我们该虚心接受。"
  JAP_pnr_midgame.8.t: "名单问题"
  JAP_pnr_midgame.8.desc: "为了稳步推进市町村自治分权，内务省拟定了一份全新的府县知事和警视总监拟任名单，然而不知道是谁在党内走漏了这份文件，而文件内容也自然在党内引起了轩然大波。关东地区的府县知事几乎都被与[JAP.GetLeader]关系密切的地方人士和朋友占据，而原先忠于[loc_seiyukai_enemy_0]派系的人士几乎都被辞退。当然，如果仔细研究这份名单的话还是能找到[loc_seiyukai_enemy_0]的人的，大多流落在偏北方的一些边远地区，可以说是[JAP.GetLeader]对整个[loc_seiyukai_enemy_0]支持者的流放。\n\n在看到了这份文件之后，[loc_seiyukai_enemy_0]派系立刻指责[JAP.GetLeader]以总裁之位以权谋私，为了打击意见不同的党内人士甚至不惜将他们“流放”。而[JAP.GetLeader]派则立刻还以颜色，称这份泄露的文件只是早期名单，如今的任命名单早已和这份名单大相径庭。但在[loc_seiyukai_enemy_0]派要求出示名单的时候，[JAP.GetLeader]派则表示这是内务省的机密，即便是党内同僚也无权过问。如今两方在党总部吵得不可开交，尽管一些党内中立派试图从中调解，但收效甚微。"
  JAP_pnr_midgame.8.a: "[loc_seiyukai_enemy_0]的派系，居然是0！0！0！"
  JAP_pnr_midgame.8.b: "真是欺人太甚！"
  JAP_pnr_con.1.t: "“圣师”回到东京"
  JAP_pnr_con.1.desc: "在先前的“阅兵风波”过后，人称“圣师”的右翼宗教分子，昭和神圣会统管$JAP_pnr_onisaburo_common$又搞出来了一件大新闻。他和他的参谋长下位春吉于昨日下午经横滨返抵东京。约有六百名昭和神圣会会员身穿制服，持会旗列队前往横滨港迎接两人，此外他们还出动了三架“赤蜻蛉”，一度令民众以为是海外贵宾来访，这在港口引发了短暂的混乱。\n\n昭和神圣会可能是[JAP.GetName]最大的，组织性极高的右翼团体。“黑色星期一”发生后，昭和神圣会便突然宣布将在[JAP.GetName]举办巡回讲座，讨论在危机之中如何进行皇道宣扬、维持爱国团结与践行忧国精神。在于内地完成演讲之后，$JAP_pnr_onisaburo_common$首先前往[KOR.GetAdjective]汉城地区，在那里留下了几张照片，随后便一头扎入了朝鲜半岛以南的农村地区。\n\n等到他再次出现就是在三月十二日的台北，总督$TAI_pnr_nakagawa_kenzo$陪同昭和神圣会会员在台北铁道饭店举办了台北地区的演讲。在那里御田村龙吉首先就“台北之昭和维新”为主题发表了演讲，谈到[TAI.GetName]作为远离内地的土地，其臣民如何践行神武天皇的皇道伟大事业，并谈到了由昭和神圣会育种的爱善陆稻在台南地区的种植情况；随后是下位春吉以“非常时代的日本将去往何处”为主题作了演讲，鼓励与会者即便在“黑色星期一”的危机之下依然不要忘记昭和神圣会所提倡的“人类之爱善”，只要心中保留这一美德，并将全心全力都奉献给“天皇的事业”，那终将得到美好的结果。"
  JAP_pnr_con.1.a: "这种宗教武装都很危险……"
  JAP_pnr_con.2.t: "昭和青年会慰问农村"
  JAP_pnr_con.2.desc: "又是$JAP_pnr_onisaburo_common$！昭和神圣会旗下团体，准军事组织昭和青年会的一张照片占据了多家报纸的头版，一旁还配有挑衅性的新闻标题：“忧国组织的大行动，昭和神圣会向受灾农民提供大米与稻种”，画面中的青年团团员手持会旗正在将包装好的一捆捆大米捐献给北陆地区的农民们。\n\n根据昭和神圣会官方社团报纸《真如之光》上的详细报道，三位青年是来北方践行“皇道精神”的，这些米都来自爱善陆稻试作田。他们之所以来到这里是因为他们奉戴神敕与圣诏，为完成皇国使命，替“天皇陛下”分忧，弘扬“人类爱善”，建成喜乐无边的光明世界，他们来到农民们身边倾听并解决他们的烦恼，除了米袋之外，这些青年还带来了爱善陆稻的种子。在原报道的最后还提到了昭和神圣会即将在当地召开一场小规模演讲。\n\n但其他媒体的关注点可不在什么稻种与演讲会上。他们反而拿这张照片来抨击农林大臣办事不利。认为就连救济农村这样的事情最终却还是要让民间团体代劳。出于该原因，内阁在早晨为农林大臣拟好了一份特别讲话，具体内容为承诺将派出调查员去研究东京圈及更偏远地区的农业现状，此外农林大臣再一次强调，如果农民实在遭遇了经济难以周转的问题，可以通过当地产业组合申请特别特别融通，根据既有制度办理贷款，这是一项已经延续了很久的政策。"
  JAP_pnr_con.2.a: "贫穷通往混乱，施舍通往崇拜。"
  JAP_pnr_con.2.b: "又有谁在意工人们呢？"
  JAP_pnr_con.3.t: "独眼的伟人"
  JAP_pnr_con.3.desc: "123"
  JAP_pnr_con.3.a: "准备行动了"
  JAP_pnr_con.4.t: "两位候选人"
  JAP_pnr_con.4.desc: "123"
  JAP_pnr_con.4.a: "那么就请后藤文夫先生来吧。"
  JAP_pnr_con.5.t: "斗争生产联合1号事件"
  JAP_pnr_con.5.desc: "123"
  JAP_pnr_con.5.a: "从各种角度来看，这都是个不稳定的同盟。"
  JAP_pnr_con.6.t: "斗争生产联合2号事件"
  JAP_pnr_con.6.desc: "123"
  JAP_pnr_con.6.a: "如果财阀也支持，那就肯定成功。"
  JAP_pnr_con.7.t: "斗争生产联合3号事件"
  JAP_pnr_con.7.desc: "123"
  JAP_pnr_con.7.a: "你们还有日本之心吗？"
  JAP_pnr_con.8.t: "斗争生产联合4号事件"
  JAP_pnr_con.8.desc: "123"
  JAP_pnr_con.8.a: "此乃久远的参拜之道。"
  JAP_pnr_515_parliament_support_tt: "对于我们当前的法案，议会的意见是：[JAP.GetJAPPNRParliamentSupportStatus]"
  JAP_pnr_515_parliament_giveup_tt: "§c我们将放弃当前法条的§Y增益效果§!以在议会中换取对法案的支持。§!"
  JAP_pnr_parliament_support_var_tt: "§a议会对§Y$JAP_pnr_NSA_idea$§!的意见将变化：§R$RIGHT|0$§!§!"
  JAP_pnr_parliament_support_status_unwelcome: "§R极不欢迎（[?JAP_pnr_parliament_support_var|0]）§!"
  JAP_pnr_parliament_support_status_contested: "§P难分伯仲（[?JAP_pnr_parliament_support_var|0]）§!"
  JAP_pnr_parliament_support_status_safe: "§G通过无虞（[?JAP_pnr_parliament_support_var|0]）§!"
  JAP_pnr_515.1.t: "帝国议会临时会召开"
  JAP_pnr_515.1.desc: "针对《国家保安法》的前期磋商简直是灾难，拜草案泄露事件所赐，[JAP.GetRulingParty]在舆论中的形象已经低到了极点。尽管有斋藤实内大臣从中斡旋，但其它在野党派的领袖还是值此机会向我们提出了各种难以接受的政治让步。今天就是帝国议会临时会议召开的日子，根据[JAP.GetAdjective]宪法第三十九条，法律案一旦在贵族院或众议院遭到否决，同一会期中便不得再次提出在会期中经表决未通过的法案。\n\n贵族院方面并不是问题，只要《国家保安法》能在众议院通过，[JAP.GetRulingParty]就有办法取得最终的胜利。[JAP.GetLeader]和他的内阁成员都严阵以待，接下来他们要面对的是一场恶战，《国家保安法》只能成功，否则本届内阁的政治生命就要到此为止了。甚至可能会作为一事无成的失败者，在[JAP.GetAdjective]历史书中变成“黑色星期一内阁”、“$JAP_pnr_inukai_tsuyoshi$遭害内阁”。\n\n为了避免最坏的情况，[JAP.GetLeader]将在议会之中寻求强硬与妥协的中间值，从而令《国家保安法》通过，[JAP.GetRulingParty]也考虑过在必要时刻以“解散众议院”为压力迫使议员们屈服。但这完全依赖于[JAP.GetLeader]当时所面对的状况以及其自己的感觉。唯一能确定的是，一味地妥协只会造就一部毫无价值，什么也没改变的法案；而一味地强硬或许并不能令议员们畏惧，反而会令他们坚定与本届内阁斗争的决心。"
  JAP_pnr_515.1.a: "“朕兹行帝国议会开院之式，告贵族院及众议院各员。”"
  JAP_pnr_515.1.b: "“近期东京之事件令朕深感遗憾……”"
  JAP_pnr_515_introduction_tt: "在《国家保安法》草案审议期间，我们将收到一系列事件。根据这些事件，我们能作出三种不同的抉择：§r强硬§!、§c妥协§!以及§l威胁§!。\n\n维持§r强硬§!将使对应的法条必定保留在草案之中，但可能会令议员们不满，使得他们更不易赞同该草案。\n\n选择§c妥协§!则会用妥协法条替换对应的法条，这将使议员们更可能赞同该法案。\n\n我们的最终底牌是§N奏请解散议会§!，如果我们认为事态无法控制，或只是想迫使在野党让步，我们可以以§N解散众议院§!为撒手锏令他们屈服，但或许他们不会惧怕我们的§l威胁§!。如果在野党挑战我们的§l威胁§!而我们并未真正行动的话，那我们一定会成为§n议会中的笑柄§!。\n\n§t小心行事，[JAP.GetLeader]首相。§!"
  JAP_pnr_515.2.t: "交锋：裁判思想"
  JAP_pnr_515.2.desc: "针对我们《国家保安法》中“取缔秘密结社”一项的法条，率先发起攻击的是社会大众党的河上丈太郎。此人乃是社会大众党保守派阵营中的一员，是个标准的基督教社会主义者，其发言带有强烈的基督教人道主义也在意料之中。\n\n河上丈太郎指出《国家保安法》的“取缔秘密结社”实际管束范围过宽，从暴力行为到单纯的思想犯罪都被囊括其中。他主张既然已有刑法可处罚暴动与反乱，《国家保安法》再谈论此毫无意义。随后他又借所谓“法律的本义”来攻击该法条，向议会中其他议员暗示若该法条获得通过，内阁一方面确实能对非法分子施加威慑和惩治，另一方面则能借此打击诸合法政党。河上丈太郎用这种卑劣的手段煽动议员们否决该提案，而我们必须对此立刻作出反击。"
  JAP_pnr_515.2.a: "本法无意妨碍一般政治运动。"
  JAP_pnr_515.2.b: "我想此番言论确有其道理。"
  JAP_pnr_515.2.c: "连此等条款亦不能接受，本内阁只得奏请解散众议院。"
  JAP_pnr_515.3.t: "交锋：谋议"
  JAP_pnr_515.3.desc: "1936年的东京有两个地方最热闹，一个是五月中旬“三社祭”时的浅草一带，另一个就是现在的帝国议会临时议事堂。在对一项无关痛痒的议案进行第一读会后，帝国议会中的各议员再一次对《国家保安法》草案展开了激斗。出身国民同盟的中野正刚抨击该法案中谈到的“预防犯罪”部分有滥权之嫌，在犯罪尚未施行而仅仅处于谋议阶段便可处以五年监禁，这简直就是田中义一的《治安维持法》的回魂。\n\n他认为若放行该法条原样通过的话，将会给予警察对谈话的极大解释权力。此人一向懂得如何利用焦虑，他甚至说在此法案通过以后，帝国议会本身就是[JAP.GetName]最大的犯罪组织，如果有人胆敢对内阁发起攻击，那所有支持该攻击议员恐怕都是“谋议罪”的嫌疑人。中野正刚其人明明是个鼓吹“总体主义”的激进政治家，他平日里的言论和《国家保安法》相比恐怕有过之而无不及，但他今天为了阻挠该法案甚至可耻地提出一个彻头彻尾的滑坡谬误，显然一部分议员出于恐惧相信了他的言辞。"
  JAP_pnr_515.3.a: "既然已有计划，那还能是单纯的“思想”吗？"
  JAP_pnr_515.3.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.3.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.4.t: "交锋：结社"
  JAP_pnr_515.4.desc: "《国家保安法》草案的泄露给我们带来了意外的危机，大宅壮一极力渲染该法案对言论的恐怖钳制，结果在今天被在野党议员用作“民意”来攻击内阁了。位于争论中心的法条是“监视外围组织”，有议员指出该法条涉及到的层级完全不同，混淆了宣传言论和具体的犯罪指令，并担心该法条会进一步加强警察署的权力。\n\n对该法条反对尤为激烈的是社会大众党的铃木文治，他在质询时言辞激烈，认为所谓的外围组织就像剥洋葱一样，如果《国家保安法》真能通过，那从工会到法律救援团体恐怕都要置于政府的监视之下，这种监视是否合乎现行权限姑且搁置不论，但在经济如此紧张的当下，政府是否有足够的资金来支持该监视计划值得进一步讨论。"
  JAP_pnr_515.4.a: "不问门口招牌，只问实际行为。"
  JAP_pnr_515.4.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.4.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.5.t: "交锋：姓名与住址"
  JAP_pnr_515.5.desc_a: "我们最开始的目的是借助该法条掌握各政党支持的院外团（壮士团体）的动向，不过看起来各在野党也意识到了我们的计划，他们对该法条进行了激烈的反击。不出意外，最大的反对声来自$JAP_pnr_market_liberal_party$，他们有着极为庞大且繁多的院外团。\n\n椎熊三郎议员在发言过程中情绪激动，他宣称该法条本质上是对《治安警察法》内容的骑劫，同时也压迫了本来“任意团体”（不涉及政治、不需要法人资格的民间团体）的存在空间，据此来看，《国家保安法》不过是本届内阁试图炮制“反政府团体名簿”的一件趁手工具罢了。在发言的最后，他呼吁议员们不要让[JAP.GetName]变成一个人人都是犯罪预备分子的警察国家，他就像其他反对《国家保安法》的议员那样，试图煽动不安和恐慌情绪。"
  JAP_pnr_515.5.desc_b: "我们最开始的目的是借助该法条掌握各政党支持的院外团（壮士团体）的动向，不过看起来各在野党也意识到了我们的计划，他们对该法条进行了激烈的反击。不出意外，最大的反对声来自$JAP_pnr_social_conservative_party$，他们有着极为庞大且繁多的院外团。\n\n大野伴睦议员在发言过程中情绪激动，他宣称该法条本质上是对《治安警察法》内容的骑劫，同时也压迫了本来“任意团体”（不涉及政治、不需要法人资格的民间团体）的存在空间，据此来看，《国家保安法》不过是本届内阁试图炮制“反政府团体名簿”的一件趁手工具罢了。在发言的最后，他呼吁议员们不要让[JAP.GetName]变成一个人人都是犯罪预备分子的警察国家，他就像其他反对《国家保安法》的议员那样，试图煽动不安和恐慌情绪。"
  JAP_pnr_515.5.a: "登记不等于禁止，连这个都不清楚吗？"
  JAP_pnr_515.5.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.5.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.6.t: "交锋：因字获罪"
  JAP_pnr_515.6.desc: "在今日帝国议会开会之前发生了一段小插曲，东京几个报社的记者联名写了一篇文章，虽然都是些不知名的记者，但这篇文章还是发表在了《东京日日新闻》的第二面上，大体意思是呼吁新闻自由，强调报业是民众意见的管道。虽然整篇文章并未直接提到《国家保安法》，但其显然意指该法案中涉及到新闻管制的部分，这应该是某个党派的手笔，想要借助新闻攻势对《国家保安法》发难。\n\n在随后的质询上，$JAP_pnr_national_populist_party$就现身指责法案中有关“通信公开”的法条考虑欠妥，他们认为该法条不仅打击了所谓的非法机关，还扩大打击了那些出于不知情的原因帮助他们印刷、传递刊物的中间人。$JAP_pnr_katsumaro_akamatsu$亲自出面，攻击该法条中的主观要件，认为其中提到的“明知”与“援助目的”完全依靠嫌疑人口供和警察推认，有滥用嫌疑。"
  JAP_pnr_515.6.a: "法条不是说的很清楚？“明知且援助”。"
  JAP_pnr_515.6.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.6.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.7.t: "交锋：军队责任"
  JAP_pnr_515.7.desc: "出乎意料的是，《国家保安法》中关于军队部分的内容几乎没有受到在野党的任何强烈抵抗，陆军和海军似乎在过去的十年里已经习惯了这一切，他们并未在议会中对此作出过多抵抗。然而有关官僚的部分则吸引了议会中广泛存在的“官僚派”的火力，且一并带上了前面已经放弃抵抗的陆海军。\n\n由于《国家保安法》其它法条目前在帝国议会中都在遭受攻击，“官僚派”们认为目前尚还无法确定该法案中的“犯罪行为”到底指的是哪些犯罪行为，因此讨论这一条中的从重处罚是无意义的，况且该法条似乎是依照身份处罚，而非按照滥用职权处罚，后者已有极为成熟且完善的法律规定，他们认为这一法条的存在意义不大。\n\n显然这些官僚出身的党人在为过去的他们辩护，这些人不愿意在一无所知的情况下背上莫名其妙的罪名，更有甚者宣称单凭这一条便可以断定《国家保安法》只是本届内阁“失去行政信心之后的专制独裁之工具”，号召众议院和贵族院拒绝整部法案。"
  JAP_pnr_515.7.a: "本法绝不纵容轻判当权者。"
  JAP_pnr_515.7.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.7.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.8.t: "交锋：内务省专断"
  JAP_pnr_515.8.desc: "《国家保安法》作为本届内阁所推出的唯一一部新法案，在众议院中得到了“众星捧月”般的关注度，要说到这份草案中最令各位议员“感兴趣”的那一条，那肯定是关于“紧急取缔权”的部分。简直是所有在野党议员都能过来对该法条踩一脚。行政处分先行让本届内阁获得了对在野党超乎寻常的控制力，只要宣布对某个外围支持团体进行紧急取缔，就能在瞬间让对应党派的正常运作受到影响。\n\n尽管该法条确实赋予了执政内阁超乎寻常的益处，但大家并没有智力障碍，知道若放行该法条那就一定会导致自身永远在议会之中处于劣势地位。议会中的众多反对者相信该法条只会把内务大臣变成治安官和选举裁判，是假借治安之名破坏竞选活动，一种写进法律里的，赤裸裸的选举舞弊行为。公平地讲，该法条确实有些危险，但如果能让它原样通过就能给本届内阁在未来带来极大的优势。"
  JAP_pnr_515.8.a: "治安行政争分夺秒，岂能全权仰赖诉讼。"
  JAP_pnr_515.8.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.8.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.9.t: "交锋：司法程序之外"
  JAP_pnr_515.9.desc: "帝国议会[GetDate]速记\n\n永田正义议员发言：关于《国家保安法》的问题，我想向陆海军大臣提出质询，军队方面对于该法案中“搜查陆海军机关、军营或舰艇时，有关军政机关应予协助”这部分是怎么看待或者解释的？其中涉及到的疑似军机证据是由军政机关进行事先筛选判断还是由司法官僚确认相关性？我想向司法大臣提出质询，如果《国家保安法》前述法条经审议得以保留，该法案得以通过，在具体实践上有效令状是依照现行刑事诉讼法之命令状为之，还是另设特别手续？搜查扣押等强制措施是否有规定期限？我想向内阁总理大臣，或者说提出《国家保安法》的全体大臣提出质询，该法案在实际执行过程中的执行主体是何人，如果依然将这一切委任给检察官及司法警察，那该法案是否只是以另一种形式重申并扩大了警察权？\n\n[JAP.GetLeader]答："
  JAP_pnr_515.9.a: "政府无意创造不受司法程序约束的特别警察权。"
  JAP_pnr_515.9.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.9.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.10.t: "交锋：代理人"
  JAP_pnr_515.10.desc: "帝国议会的质询漫长而无聊，大多数议员并非是出于真心反对他们现在所反对的动议，而是出于各种各样的无关理由站在了动议的对立面。相信《国家保安法》现在所遭受的质疑也是由于这一理由所致。议会本应在推进过《国家保安法》草案的相关事务之后开始审议铁路维护提案，但《国家保安法》引发的争论远比大多数人想象的要大。在法案中存在一项关于“冻结可疑资助”的法条，正是它引爆了今天的争议。\n\n金钱可谓是日本政党得以延续其生命的本源，如果失去了金钱，很多事情都没办法办成。如果该法条得以施行，政府便可以通过对特定团体施加行政处分来公然改变受到该团体资助的议员当选的事实。即便本届内阁在这一点上始终坚持这里的“当选无效力”目的是为了对抗非法团体扶植代理人参加选举并进入议会，但关于“实质援助”究竟包含哪些范围则依然不明确，帝国议会中大部分议员都对该法条持否定态度，甚至有一小部分[JAP.GetRulingParty]的议员也认为应该在这一法条进行让步，甚至是干脆取消该法条，面对内外同时袭来的双重压力，[JAP.GetLeader]内阁的回应是——"
  JAP_pnr_515.10.a: "无论如何，选举程序和议会不能遭非法结社渗透！"
  JAP_pnr_515.10.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.10.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.11.t: "农民动议"
  JAP_pnr_515.11.desc: "“感谢。”在得到了议长示意发言的手势提示之后，风见章站到了议会座席的最前方。帝国议会如今深陷《国家保安法》的漩涡之中，即便眼下是和这法案无关的时间，但发生的一切都是与之相关的议会攻防的延续。“各位先生，就在上周，我提交的农村紧急救济法案在第一读会后付托委员会。今天稍早些时候，我得知它至今还没有排上审议日程——如今东京的上空笼罩着哀伤和暴力的阴云，我想大家担忧天气也是正常的……”说到这里，他从怀里掏出来了那张叠的方方正正的纸。\n\n“我想各位议员都知道，先前五一五审判的时候，司法部门收到了减刑请愿书，甚至收到了那些手指……诸位一直在讨论‘同情者’和‘共犯’，这些人在自己不知情的情况下已经在这霞关风暴的中心。”那张纸被展开，抖了一下，“这是本届内阁坐在办公室里琢磨《保安法》的时候，我对茨城县和栃木县农村状况的调查，上面有当地农民的两百多个签名证明属实。之前第一读会的时候我也交了这个，我想各位不会在当时错过这个了吧，这个令人痛心的可怕现状，在远离东京圈的地方又进展到了什么程度呢？我想各位议员可以思考一下。”然后是沉默，在这沉默之中他深深地吸气。\n\n“我想要问问你们，现在是什么时候了。全体阁僚们，‘黑色星期一’过去多久了？那个事件过去多久了？内阁除了发表一些不痛不痒的声明，让农林大臣去田地里拍几张照片之外，余剩的时间都在议会里就这个什么保安法进行战斗。这是本届内阁唯一一个新东西，但是却是一部彻头彻尾，要封住所有人耳朵和嘴巴，甚至要把脑子掏出来的粗暴的恶法。暴力的青年人好可怕，把他们都抓起来吧——别费力气了，你们什么都做不到，在你们离开办公室，亲自走过泥污之前，你们什么都得不到，那些青年还会和你们战斗的。$JAP_pnr_inukai_tsuyoshi$执政九年的遗产，就这样被你们这些家伙消耗殆尽了。看看你们的手，你们看看你们的手指，执政的诸君，我只问你们指甲缝里还能找到一点大久保利通和木户孝允的骨气吗？你们今天有什么脸面站在这里？真是荒唐且羞耻，你们今天为了这部令人震惊的法案拼命，为了做出点东西超越过去，反而更是荒唐。内阁总理大臣以及背后的诸位大臣，你们为什么低着头，连直视议员的气力都丧失了吗？”"
  JAP_pnr_515.11.a: "议长！风见议员显然是在人身攻击！议长！"
  JAP_pnr_515.11.b: "这联署未经正式受理，议长！按原则不能作为有效材料。"
  JAP_pnr_515.12.t: "议会大乱斗"
  JAP_pnr_515.12.desc_a: "一方面或许是由于《国家保安法》的审议不顺，另一方面又或许是由于风见章前几天对内阁的批评打开了阀门。总之帝国议会的空气中如今弥漫着甲烷，它等待着一个迟钝的家伙划着一根火柴把所有人送上天。那个掏出火柴盒的坏人正是$JAP_pnr_national_populist_party$的安芸盛议员，他于诸多议员面前公开宣读了一份不知道哪里来的，但引爆了整个帝国议会的材料。这份材料是时任枢密院议长的平沼骐一郎男爵与[JAP.GetRulingParty]之间的一系列书信往来，根据安芸盛念出来的内容，《国家保安法》是平沼骐一郎向[JAP.GetRulingParty]秘密提供的草案，其目的既包括消灭社会不安定因素，也包括对在野党的院外政治活动整顿。作为交换，[JAP.GetRulingParty]将奏请改正《枢密院官制》，扩大枢密院的咨询范围。这意味着政府将把保留权力让渡给枢密院。\n\n自大正末期以来，枢密院便因其职能与内阁法制局有所重叠而被讥讽为“二号内阁法制局”，近年以$JAP_pnr_saionji_kinmochi$为首的宫中集团则希望进一步加强政党内阁的权力，并遏制枢密院这个怪胎在过去取得的扩张成果，避免在政治体系中形成“第三院”。除了该幕后交易外，还有关于首相的更多内容——\n\n总之，这份真假不明的材料激起了[JAP.GetRulingParty]激进派成员的怒火。他们率先冲上去试图揪打安芸盛并抢走文字材料，但与此同时$JAP_pnr_market_liberal_party$的议员却冲过来进行拦截。帝国议会瞬间陷入了混乱之中。眼看三拨人已经扭打在一起，在旁听席和休息室里的各政党院外团（Ingaidan）和议员秘书们则前仆后继地冲入议场内部，涌向发言台，期间一路利用墨水瓶和文件袋相互投掷，帝国议会已陷入一场大混战，议长那如暴雨般的敲钟宛如宣告回合的开始，而混战必有结局，只是目前尚未显露。"
  JAP_pnr_515.12.desc_b: "一方面或许是由于《国家保安法》的审议不顺，另一方面又或许是由于风见章前几天对内阁的批评打开了阀门。总之帝国议会的空气中如今弥漫着甲烷，它等待着一个迟钝的家伙划着一根火柴把所有人送上天。那个掏出火柴盒的人是$JAP_pnr_national_populist_party$的安芸盛议员，他于诸多议员面前公开宣读了一份不知道哪里来的，但引爆了整个帝国议会的材料。这份材料是时任枢密院议长的平沼骐一郎男爵与[JAP.GetRulingParty]之间的一系列书信往来，根据安芸盛念出来的内容，《国家保安法》是平沼骐一郎向[JAP.GetRulingParty]秘密提供的草案，其目的既包括消灭社会不安定因素，也包括对在野党的院外政治活动整顿。作为交换，[JAP.GetRulingParty]将奏请改正《枢密院官制》，扩大枢密院的咨询范围。这意味着政府将把保留权力让渡给枢密院。\n\n自大正末期以来，枢密院便因其职能与内阁法制局有所重叠而被讥讽为“二号内阁法制局”，近年以$JAP_pnr_saionji_kinmochi$为首的宫中集团则希望进一步加强政党内阁的权力，并遏制枢密院这个怪胎在过去取得的扩张成果，避免在政治体系中形成“第三院”。除了该幕后交易外，还有关于首相的更多内容——\n\n总之，这份真假不明的材料激起了[JAP.GetRulingParty]激进派成员的怒火。他们率先冲上去试图揪打安芸盛并抢走文字材料，但与此同时$JAP_pnr_social_conservative_party$的议员却冲过来进行拦截。帝国议会瞬间陷入了混乱之中。眼看三拨人已经扭打在一起，在旁听席和休息室里的各政党院外团（Ingaidan）和议员秘书们则前仆后继地冲入议场内部，涌向发言台，期间一路利用墨水瓶和文件袋相互投掷，帝国议会已陷入一场大混战，议长那如暴雨般的敲钟宛如宣告回合的开始，而混战必有结局，只是目前尚未显露。"
  JAP_pnr_515.12.a: "一位壮士拆下了一条椅子腿。"
  JAP_pnr_515.12.a_tt: "§t然后他加入了这场混战……（在这场混战小游戏中胜利将解锁成就“日本国议员大乱斗DX”，除此之外没有任何效果）§!\n\n§f你的初始生命值是§G40§!。§!"
  JAP_pnr_515.12.b: "简直是帮派火并，流氓恶斗。"
  JAP_pnr_515.13.t: "解散威胁"
  JAP_pnr_515.13.desc: "或许是[JAP.GetLeader]单纯想要效仿明治时期的那些藩阀内阁，用众议院解散威胁议员们通过他们希望的法案，又或者是本届内阁实际上根本无法忍受和帝国议会中议员进行讨价还价。在前次关于《国家保安法》的质询中，[JAP.GetLeader]在最后向那位发动质询，表达意见的议员撂下了狠话，就像品川弥二郎当年在第一届帝国议会上做的那样：[JAP.GetLeader]宣称如果议会不愿意通过《国家保安法》的法案，他就会立刻奏请天皇陛下解散众议院重新举行大选。\n\n这种政治逼迫确实收获了效果，那位在野党议员在明确的议员津贴和未知的选举之路中间选择了前者，至少在当前讨论的这一法条上，[JAP.GetLeader]内阁渡过了这次危机。但他在议会中的这一行动也为内阁在明天的报纸上争得了一个小小的版面，当然不会是什么赞扬的话。面对着社会舆论的变化，他是否还能继续动用这一方式逼迫议员在后续问题上妥协则仍是一个未知数。"
  JAP_pnr_515.13.a: "这就是博弈。"
  JAP_pnr_515.14.t: "$JAP_pnr_515.13.t$"
  JAP_pnr_515.14.desc: "也许是[JAP.GetLeader]历史读到入迷了，当他在书里看到山县有朋和伊藤博文的事迹以及他们在帝国议会中纵横捭阖，呼风唤雨的故事时，他错误地把自己当成了两人在人间的某种化身。但总之在刚刚针对本届内阁提出的《国家保安法》进行讨论的帝国议会临时会上，面对在野党议员对其中一条法条的质疑，[JAP.GetLeader]选择不和对方对话，直接用众议院解散来威胁议员退却。\n\n[JAP.GetLeader]为此付出了代价，那个议员并不害怕他的政治威慑，而他背后的党派似乎也决定支持他和本届内阁对抗到底。现在这颗定时炸弹抛回到了[JAP.GetLeader]内阁手中，根据现在小规模的民意调查，[JAP.GetRulingParty]在舆论中处于较为不利的状态，虽说这是小规模的民意调查，只具有参考性而不具有确定性，但本届内阁真要为此下赌注吗——无论如何[JAP.GetLeader]已经在议会中直接说出了解散威胁，如果他明天没法递交一份包含全体内阁大臣的解散奏请给天皇的话，那本届内阁可就连尽力维持的政治信用也要失去了——到时候只会发生像是“不信任案”那样的更坏的事情，但至少还能给内阁续命几天。然而时间不多了，内阁必须作出决定。"
  JAP_pnr_515.14.a: "看来[JAP.GetLeader]的牌打不下去了。"
  JAP_pnr_515.14.b: "好死不如赖活着，明天大大方方去帝国议会。"
  JAP_pnr_515.14.b_tt: "§l威胁§!选项将被§Y禁用§!。"
  JAP_pnr_515.15.t: "绝望的一击"
  JAP_pnr_515.15.desc: "在前几日紧张激烈的议会攻防中，执政党[JAP.GetRulingParty]试图通过威胁解散众议院来迫使在野党们通过《国家保安法》，不过看起来各大在野党并没有因其威胁而退缩。随着《国家保安法》的通过已无希望，[JAP.GetLeader]于今早宣布奉天皇敕命解散众议院重新举行大选。\n\n根据《大日本帝国宪法》规定，众议院解散后需在40天内举行总选举。这一规则原则上有利于执政党，因为他们掌握主动权，故而可以提前准备选举。在过去的十年里，$JAP_pnr_inukai_tsuyoshi$正是因为善用这一权力才能延续他的统治如此长的时间。在田中义一内阁以前，内务大臣还能借助《治安维持法》来指挥警方干扰在野党正常进行选举，然而随着田中义一的倒台，这种可耻的选举干涉也随之被民意所禁止了，\n\n但目前看来[JAP.GetRulingParty]并非是在做好万全准备的情况下宣布解散众议院，更何况不论[JAP.GetLeader]是相信自己的党派有能力在这场选举中拔得优位，还是单纯地不想让自己的政治生命如此快速地完结，这都表明了《国家保安法》草案在本会期中取得了耻辱性的惨败。至于民间对[JAP.GetRulingParty]的支持率：在黑色星期一带来的出口萎缩以及一系列丑闻的打击下，无需多想就能意识到他们的支持率一定处于可怕的低点，在这种局势之下，原则上讲其在众议院中的席位一定会被其它几个党派瓜分。\n\n即便[JAP.GetRulingParty]侥幸胜选，那帝国议会也大概率还是会维持“悬峙议会”的无多数状态，届时即便[JAP.GetRulingParty]再次在新会期中提出《国家保安法》，各大在野党还是能联合起来将其否决。\n\n也就是说，这一切不过是[JAP.GetLeader]临死前的最后挣扎。"
  JAP_pnr_515.15.a: "真让人汗颜，椅子就这么重要吗？"
  JAP_pnr_515.16.t: "动乱之后"
  JAP_pnr_515.16.desc: "日本从1936年开年到现在度过了一段并不愉快的时光，首先是丑陋的议会斗争，然后是黑色星期一的经济危机，之后又是丑陋的议会斗争。随着[JAP.GetLeader]为了挽救自己和他的党派的政治生命，尝试效法田中义一大将推出一部借尸还魂的《国家保安法》之后，国民已经对[JAP.GetRulingParty]失去了信心——议会之中还有许多为了自由和民主而同《国家保安法》斗争的政治家，不过[JAP.GetLeader]为了强推《国家保安法》通过而选择动用手中权力解散议会，从而破坏他们的联盟。\n\n这场令人不齿的众议院再选举于今天揭晓了答案，帝国议会依然维持着悬峙状态，但元老的态度则发生了变化。各新任议员已收到通知，将不会有任何一位党人得到组阁大命，这是他们丑陋争斗所得到的最终结果。而在西园寺公望的手边则有两个人选，在陆军中颇有威望的清军派领袖$JAP_pnr_hayashi_senjuro$和海军大将加藤宽治，无论最终选择为何，这都意味着政党政治就此走向终结。"
  JAP_pnr_515.16.a: "林首相可以调和好陆军内各派矛盾。"
  JAP_pnr_515.16.b: "宇垣一成或能凭借威望压制陆军。"
  JAP_pnr_515.17.t: "最后一人"
  JAP_pnr_515.17.desc: "针对《国家保安法》的质询已近结束，帝国议会众议院即将就该法案进行投票，其实该法案是否能通过，在座的议员心中都已经有了一个大致的估计了。就是在这个时候他被获准发言，自己的发言可能没办法改变大局，他向前走上发言台，然后环视了如今还滞留在会场内的议员——纵观整个议会，大多数人根本不是出于关心法案的具体内容才在这里的。\n\n“我想诸位还记得田中大将那时候的事情，那年也是和现在一样，《治安维持法》表决的时候，众议院和现在有着相同的氛围。我记得那个时候，大家都不敢站出来正面对抗，就像是被锁链拴住了脖子一样不敢行动。后来是‘宪政联盟’，大家一下子发现独裁者也没什么可怕的，只要大多数人团结一致，不管是一个还是十个独裁者都可以掀翻。这是已经故去的犬养前首相留给我们的教诲。”\n\n“如今借着前首相的死，就像田中义一借着关东大地震那样，政府又在推行新的《治安维持法》，难道各位同袍希望十年之后被按着《春秋》之笔法，说是独裁者的同谋吗？难道各位同袍希望今天投票结束走出去，看到那些把你们送进议会的人眼中的失望时而遗憾道‘今日未能尽力’吗？我想问各位议员同袍，我们已经把田中义一赶下去了一回，到了他复活，附在今天这个内阁身上的时候，我们照样可以把他再赶下去一回，这才是真正纪念前首相的方法。”\n\n“各位是一等的议员，是民意的总代表，民意对《保安法》的意见，各位读了报纸，和选民有所接触便也能体悟到一二。我想民意的忍耐是有限度的，内阁今天做了一件违背民意的错事，无疑是在挑战沉默的民意，我衷心希望本届内阁不会看到民意忍无可忍的那一天。”他又确认了一圈那些在仔细听他说话的的人，“我想这是投票前最后的发言了，随后就是表决。今天说出这些本月间闷在心里的话，真是我一生中的一大快事。我想即便是这个议会里抵抗《国家保安法》的战旗下只有我山本宣治一个人，我也并未感到寂寞。”"
  JAP_pnr_515.17.a: "“因为我的背后还有群众们支持着——”"
  JAP_pnr_515.18.t: "宫中迷思"
  JAP_pnr_515.18.desc: "“这样下去，议会政治岂不是要成为笑柄了。”他放下正在众议院中旁听的甘露寺受长打给他的紧急电报，发出了一声感叹，“虽说本就是无法预料的天灾，但最后竟搞成如今这番样子实在是太软弱了。[JAP.GetLeader]既然想保住位子，为何不更痛快，更凌厉一些。”\n\n“臣以为私下传达立即解散众议院的意思，这样如何？”“绝不可。自犬养毅掌握民党大局之后，他能以灵活手腕妥协调和议会内各方势力，如今看来[JAP.GetLeader]并无这样的能力，实在是可惜。若是为此人开了近十年以来都未曾再出现的，僵局之中解散议会而非协调妥协的先河，待解散众议院后，各位议员虽面容一新，但在民党议席分配上实际仍然陷入僵局，那只不过是同样的众议院。并且此例一开，我国恐陷入1925年以前议会屡屡解散的不详境地，只能徒增恐慌——”\n\n“此事事关重大，你去[JAP.GetLeader]那里替我督战，如果《国家保安法》失败，无论如何不能让他们解散众议院，要明确传达这样的意思给他们。若是内阁对此最终无能为力，又没有如犬养毅和原敬那样的能人能维持这个众议院，我想到那时就用贵族院或者官僚来组阁，虽然这一选择如今来看已属异常，但实在是维持日本的最后选择。”“陛下是否要召元老觐见进一步商讨此事？”\n\n“此事不必劳烦西园寺，只消你一人足够，”他又把那份电报拿起来，“不过确实有一人需要传召入宫，请你一并通知他。”"
  JAP_pnr_515.18.a: "传$JAP_pnr_fumimaro_konoe$入宫。"
  JAP_pnr_515.18.a_tt: "§a内阁一旦陷入危机，$JAP_pnr_paternal_autocrat_party$就将可能行动，届时可能会发生§R异常情况§!。§!"
  JAP_pnr_military_events.1.t: "大战之伤痛"
  JAP_pnr_military_events.1.desc: "[JAP.GetName]就像所有国家那样，其内部存在着各军种之间的冲突。由于帝国并非是一个可称得上“物产丰富”的国家，它的军种冲突较其它国家而言更为剧烈。陆军与海军在涉及到经费的问题上便会大打出手，然而随着几次军事行动未能取得预期的结果。1925年英国革命首先迫使海军终止了宏大的造舰计划，而1928年奉天冲突的有限战绩（以及和张作霖这个“谎话精”达成的“协议”本身并不为民众所信赖）则宣布了陆军也彻底出局。民众自此对军队失去了信心，这某种意义上讲反而缓和了陆海军矛盾。1921年原敬内阁的特别军费是陆海军最后见到的额外资金，如今两军都不得不面对贫乏的现实，并共同哀叹自己相同的敌人。资金的缺乏使得他们不得不自行削减开支来升级，甚至只是单纯维持军备。帝国议会中的党人们通过严格控制预算来令两军主动对内进行改革，而这种改革则反过来进一步压迫了军队在[JAP.GetName]的地位。\n\n为了应对资金紧张，陆军和海军都采用了最直接的方法：裁撤常备军。这使得大量陆军军人被强制复员，海军军校中的学员们毕业之后却发现自己无船可上，只能转为预备役。当这些军人们被释放到社会上的时候，民众对他们更加厌恶了：军人之所以优先，是因为他们“脑子有问题，只懂打架和杀人”；军人之所以买票半价，是因为他们是“半个正常人”……军人未能在社会上得到应有的尊重，反而促使帝国议会借助民意进一步逼迫两军，党人们甚至提出了陆海军大臣文官制，试图从内阁中彻底驱逐军人。所幸他们很快便陷入内斗，才令军队得到了一丝喘息时机。\n\n出于社会对军人的厌恶，一些士兵开始随身携带民主主义书籍，参加集会，试图证明自己是一个进步人士；更有些士兵立下了要让所有欺侮军人的国民付出代价的誓言，成为了黑社会和秘密结社中残暴的暴力分子。纵观历史，帝国从未有一刻陷入此等厌战情绪之中，“国民们”急需一场能够证明军队存在必要性的事件来吹去这厚重的阴霾。"
  JAP_pnr_military_events.1.a: "惟有胜利方能证明必要。"
  JAP_pnr_military_events.2.t: "不惜一切之现代化"
  JAP_pnr_military_events.2.desc: "[JAP.GetAdjective]陆军系统内部的派系斗争持续已久，最初是长州和萨摩之间的斗争，萨摩集团最终被支持普鲁士二元化军制的长州集团击败，为[JAP.GetName]奠定了陆军持续至今的军令-军政分离模式，并为后续的派系斗争埋下了伏笔。\n\n1922年长州集团的首脑山县有朋去世后，登场的挑战者便是立志于打破长州集团对陆军垄断的革新阵线：由当初在派系斗争中落败的萨摩集团（以上原勇作元帅为盟主）与在此期间内不断发展壮大的佐贺集团（以武藤信义为盟主）组成，并以土佐集团（以田中光显为盟主）作为政治界的盟友。这一反长州集团深入参与了“护宪联盟”对长州集团关键人物，颁布《国家保安法》的田中义一大将的攻击，借机在陆军内部严重打击了长州集团的势力，并夺取了陆军省和参谋本部中的多个关键位置。\n\n随着田中义一大将的政治死亡与肉体死亡，其领袖由宇垣一成大将接任。在宇垣的韬光养晦之下，长州集团一改先前任人唯亲的形式，开始拉拢陆军系统中的精英和中立将领，形成了被后人错误地称为“统制派”的集团。其精英主义的出身使得他们热衷于从抽象层面把握战争，并在世界大战之后形成了名为“国家总武装”的先锋军事思想：一次战术策略的成功不能决定未来战争的走向，未来的所有战争必将是消耗战的某种变体，是榨干所有国力以在战场上展现的“全体主义”战争。\n\n基于这一观点，他们极为重视军备的现代化，激进地主张将所有不适合于现代化作战的落后编制全部裁除，并用节约出来的经费投入军备升级，打造超现代化的精锐部队。由于他们的观点在某种意义上反而迎合了世界大战之后[JAP.GetAdjective]社会的和平思潮，这使得执政党更乐于和他们进行进一步合作，并让他们在近年里夺回了对陆军省的控制权。如今，“新长州集团”或称为“反皇道派”与盘踞在参谋本部中的“反长州集团”或称为“皇道派”紧张对峙，誓要彻底将陆军系统统合在一面旗帜之下。"
  JAP_pnr_military_events.2.a: "一切为了战争！"
  JAP_pnr_military_events.3.t: "向参谋本部进军"
  JAP_pnr_military_events.3.desc: "自从荒木贞夫卸任陆军大臣后，皇道派对帝国陆军中央机关的完全控制便只局限在参谋本部。为了缓和陆军内部的冲突，长期以来陆军大臣都由持守中立的清军派盟主$JAP_pnr_hayashi_senjuro$担任——尽管清军派本身也是反皇道派的一员，但$JAP_pnr_hayashi_senjuro$对皇道派对皇道派的意见则更复杂。随着反皇道派得到了政党势力的进一步援助，$JAP_pnr_hayashi_senjuro$大将站在了长州集团-反皇道派一边，原先存在于陆军省和参谋本部之间的岌岌可危的平衡最终被打破，现在皇道派似乎连参谋本部都无法保全了。\n\n在和参谋总长闲院宫载仁亲王商议过后，$JAP_pnr_hayashi_senjuro$发动了一场针对参谋本部内皇道派成员的大规模人事清洗。参谋次长铃木率道中将已被强行排除，根据计划将由重返中央的建川美次中将接任。本间雅晴、片仓衷、辻政信等反皇道派成员已经通过这次人事调动悉数掌握了参谋本部中的中层职务，如今反皇道派已彻底控制参谋本部，而他们的敌人如今只能蜷缩在宪兵队系统中因绝望而继续进行无谓的抵抗。"
  JAP_pnr_military_events.3.a: "他们终会明白，胜利属于智者。"
  JAP_pnr_military_events.4.t: "奠定总体战基础"
  JAP_pnr_military_events.4.desc: "在镇压了那些追随皇道派的青年军官于绝望中引发的零星骚动之后，再没有什么能够阻挡[JAP.GetRulingParty]和他在军队中的盟友了，陆军省、参谋本部甚至还有宪兵队如今都在长州集团的控制之下，[JAP.GetAdjective]陆军的陆军人事终于得以拨乱反正，整个陆军系统的控制权再一次回到了“长州”手中，至少在名义上回到了手中，随着他们正式确立了他们在陆军系统中的“总体统治”，昔日在思想上四分五裂的[JAP.GetAdjective]陆军如今已再度统一。\n\n陆军得到了一笔以充实国防为名义划拨的特别预算，但事实上，几乎所有人都清楚这是终结了内部派系的斗争的奖励。在反皇道派的通力合作之下，皇道派被彻底排挤到陆军系统中的边缘位置或之外，许多皇道派要员或被转入预备役，或被调任到总督府担任在当地担任军官。后者即便是在总督府也依然受到反皇道派的密切监视。在陆军省的推进之下，这笔特别预算将被用于一项更宏大的陆军军备更新计划，随之而来的还有更进一步的裁军清单，为了打造真正精锐的现代化部队，付出任何代价都是可以接受的。"
  JAP_pnr_military_events.4.a: "全体注意！"
  JAP_pnr_military_events.5.t: "胜负在于皇军"
  JAP_pnr_military_events.5.desc: "[JAP.GetAdjective]陆军系统内部的派系斗争持续已久，最初是长州和萨摩之间的斗争，萨摩集团最终被支持普鲁士二元化军制的长州集团击败，为[JAP.GetName]奠定了陆军持续至今的军令-军政分离模式，并为后续的派系斗争埋下了伏笔。\n\n1922年长州集团的首脑山县有朋去世后，登场的挑战者便是立志于打破长州集团对陆军垄断的革新阵线：由当初在派系斗争中落败的萨摩集团（以上原勇作元帅为盟主）与在此期间内不断发展壮大的佐贺集团（以武藤信义为盟主）组成，并以土佐集团（以田中光显为盟主）作为政治界的盟友。这一反长州集团深入参与了“护宪联盟”对长州集团关键人物，颁布《国家保安法》的田中义一大将的攻击，借机在陆军内部严重打击了长州集团的势力，并夺取了陆军省和参谋本部中的多个关键位置。\n\n佐贺集团中的荒木贞夫作为陆军大臣控制了陆军省，而铃木率道则被任命为参谋次长，名义上对参谋本部施行控制。为了巩固反长州集团的胜利，他们一方面从陆军系统中强硬清理原长州集团势力，另一方面积极拉拢在军队中处于多数的中基层军官，荒木贞夫用他平易近人的性格和魅力成功取得了他们的拥护，并在陆军内形成了今日的“皇道派”。\n\n然而皇道派最终因自己的选择而付出了代价。由于其支持者是中基层军官，这使得他们在战后和平思潮中不得不强硬地主张维持军队规模，反对裁军计划，这给了当时重整旗鼓的长州集团机会，通过主张更受政党青睐的“精兵计划”，皇道派迅速失去了执政党的支持。而先前激进的人事清理更让他们在政治上也引发了中立派的不安。最终，皇道派彻底丧失了陆军大臣-陆军省的控制权，将参谋本部作为他们影响力的最后阵地。这反而使得他们更进一步地坚持要维持甚至扩大常备军规模，一方面是他们不希望在态度上彻底屈服于长州集团；另一方面则是作为参谋本部，他们希望有足够的可用兵力来制定更完善的战争计划。虽然维持精兵模式也能在战时进行临时动员，但临时动员部队的协调程度，或称为“皇军精神”显然远不如常备军。"
  JAP_pnr_military_events.5.a: "皇爱、皇谊、皇威、皇民、皇军、皇国。"
  JAP_pnr_military_events.6.t: "罢免恨国者"
  JAP_pnr_military_events.6.desc: "皇道派与“护宪联盟”的蜜月期在田中义一倒台之后很快就结束了。犬养毅在暗中和那些反对皇道派，用裁军政策取悦政党的人士勾结了起来。他们用阴谋算计将荒木贞夫从陆军大臣位置上踢走，扶植了表面上维持中立且和荒木贞夫、真崎甚三郎关系良好，实际上则毫无主见，常常任人摆布的$JAP_pnr_hayashi_senjuro$担任陆军大臣。自那之后，反对皇道派的陆军人士便集结于陆军省中，与参谋本部中的皇道派对峙。\n\n这平衡如今终于被打破了，由于局势已经进展到必须选边站的情况，林大将在审慎思考之后选择了皇道派和解：他辞职不干，专心于他的伊斯兰教研究去了。他推荐的接任人选是川岛义之大将，此人正是皇道派的最有力盟友。由于陆军大臣的异动，反皇道派很快就遭遇了灭顶之灾。川岛义之利用其权限对陆军省内的反皇道派集团进行了迅速且强硬的打击，就像当初荒木贞夫大将剪除长州集团集团那样。这些最终目的是践踏军人之间的温情的恨国者或被编入预备役，或被流放到地方坐冷板凳。相信那些先前深受他们所害的人会热烈地欢迎他们的。皇道派如今终于夺回了对陆军中央机关的控制权，而他们的反对者也再无法组织起任何像样的抵抗了。"
  JAP_pnr_military_events.6.a: "是的，爱与热情终将战胜所有强敌。"
  JAP_pnr_military_events.7.t: "人心所向"
  JAP_pnr_military_events.7.desc: "如今来看，所谓的长州集团不过是一个存在于陆军中的幽灵，当维持着陆军内部均势的$JAP_pnr_hayashi_senjuro$离开之后，长州集团就像水里的泡沫一样瞬间就消失不见了。回顾他们耀武扬威的日子，便能意识到所谓长州集团的成功是一时的，失败是注定的。这必然是源于他们并没有理解“皇军”的真谛，本手册正是为了从他们的失败来向诸君解释究竟何为“皇军”，有着这样确实的教育目的。\n\n长州集团或称为“统制派”者，迷信于大炮的口径，盲从于军械的威力，他们相信今年新研发的武器总是比前一年新研发的武器要厉害，所以拼命地追求装备的现代化。这使得他们的所谓军备更新永远没有尽头，步枪再过先进也不过是一件武器，但他们愿意裁掉一个中队来换取一支步枪，在他们眼中武器比起和自己朝夕相处的战友更加重要——他们都是些自负的精英和倚老卖老之人，所以未必认为裁掉的是战友——他们的策略虽然因得到了政党的支持而暂时压过“皇道派”的正义，但却在裁军之中失去了士兵们的信任。而诸君便自然而然地汇聚到我们这边，因为我们根本不在乎那些冰冷的军械，我们在乎的是热切的报国之心和胜过一切黄金的“皇道精神”，所谓的“皇军”正是这样的一个团体，一个充满温情，彼此扶助，服从纪律并最终携手走向胜利的集体。是各位将士心怀热烈的“皇道大精神”，才赋予了武器力量。这个集体是由千万心怀“皇愿”，奉戴大御心的至诚报国将士们组成的，而不是由那些不能理解何为“皇魂”的武器组成的。他们正是因此而失败，虽然有先进的武器，但却没有拥有“皇心”，愿意付出生命的人，如今的事实证明我们今天是对的，未来将证明我们明天也是对的。\n\n《皇道论与皇国之中军人大精神的真髓》，荒木贞夫大将，[GetYear]"
  JAP_pnr_military_events.7.a: "皇军必胜！"
  JAP_pnr_military_events.8.t: "争取陆军大臣"
  JAP_pnr_military_events.8.desc: "1933年五相会议上，原先把持住陆军大臣位置的荒木贞夫突然提出了《皇国国策基本要纲》，他为皇道派谋取利益的行为最终却葬送了皇道派的对陆军省的控制。由于该要纲整体内容大略偏向维持军队规模甚至继续扩军，而对如何解决扩军带来的军费问题则语焉不详。这一要纲最终因逆民意而动而毫无悬念地未通过，荒木贞夫的个人威望也因此而一落千丈——他曾承诺他将为陆军争取更多经费，如今承诺显然落空了。\n\n荒木贞夫随后不久便辞去了陆军大臣的职务，并推荐同为皇道派成员的真崎甚三郎接替。但在闲院宫载仁亲王的干涉下（真崎曾与他有私人恩怨），最终的陆军大臣人选是性格温和，主张缓和陆军内部派系矛盾的$JAP_pnr_hayashi_senjuro$。这也成为了反皇道派收复陆军省的开端。\n\n随着时间推移，陆军内部的派系斗争并未如$JAP_pnr_hayashi_senjuro$所料变得缓和，反而进展到了双方各自在中央割据，必须站队的时刻。借着和执政党关系密切，反皇道派似乎决定用政治上的利益作为筹码前来说服$JAP_pnr_hayashi_senjuro$，在几次办公室里的正式见面和几次高级料亭中的把酒对谈之后，$JAP_pnr_hayashi_senjuro$大将得到了他们的承诺：如果他愿意把一直要求增加军费、维持军队规模甚至扩军的皇道派从陆军中央中清除出去，那么他们将支持林大将继续担任陆军大臣的职位，如果有可能的话，他们也愿意为林大将在元老和宫中重臣面前美言几句，未来能成为元帅也说不定。\n\n这确实是富有诱惑力的提案，但天平的另一边则是$JAP_pnr_hayashi_senjuro$的“温和”，如果他真的对皇道派展开清洗便无法再维持自己作为中立派的身份，势必将遭到皇道派的记恨，而且反皇道派的承诺究竟是否真的能够实现？又或者说他们只是信口许下自己根本做不到的诺言。说不定到最后自己最后什么利益都没得到，徒留一身骂名。"
  JAP_pnr_military_events.8.a: "林大将被利益诱惑了。"
  JAP_pnr_military_events.8a_tt: "§t$JAP_pnr_hayashi_senjuro$在陆军内部分裂的当下最终倒向了§P反皇道派§!一边，这必然会引发§n皇道派§!的不满。§!"
  JAP_pnr_military_events.8.b: "为名声计，我还是跑路吧。"
  JAP_pnr_military_events.8b_tt: "§t$JAP_pnr_hayashi_senjuro$在陆军内部分裂的当下最终不堪重负选择辞职，他推荐了$JAP_pnr_yoshiyuki_kawashima$接替他的位置，此人正是一位铁杆§n皇道派§!，这一举动势必将把§P反皇道派§!置于危机之中。§!"
  JAP_pnr_military_events.9.t: "[JAP.GetAdjective]海军现状"
  JAP_pnr_military_events.9.desc: "1925年的英国革命成为了[JAP.GetAdjective]海军的死穴，叠加当时社会愈演愈烈的和平思潮，[JAP.GetAdjective]政府借机向海军大臣发难，迫使其相关造舰计划即刻中止。随后留给海军的是漫长的“假日”：连年未曾变化的预算使得海军为确保舰船火力而舍弃安全冗余铤而走险。首先是1934年海军演习时的“友鹤事件”，然后是1935年海军演习时的“第四舰队事件”。丑闻并未成为谋取更多预算的理由，反而成为了维持预算不变的理由。\n\n在这种情况下，海军内部的路线斗争则变得更为剧烈：海军大臣大角岑生每年都会向帝国议会强硬地要求增加海军军费。在海军内部，这些主张不惜一切代价确保舰队火力的人被称为舰队派，1934和1935年的事故正是他们掌控权力的结果。然而大角岑生本人却并非舰队派的头目，几乎所有人都清楚在他背后操控他的是时任军令部总长伏见宫博恭王，这位皇族是巨舰大炮主义的强硬推行者。\n\n与他们相对的一派则是主张在有限预算内通过和内阁协调，以达成“刷新海军军备”的航空派，该路线由米内光政和堀悌吉为领导人物，他们在这十年间一直寻找着大舰队的替代品，并最终认为航空母舰具有相当大的潜力：与传统的战列-巡洋舰大舰队相比，航空母舰和其配备的飞行编队在作战上更为灵活，最关键的是能够节约经费——一艘铁甲舰可比一支飞行编队昂贵不少。他们的观点虽然同样得到了海军省和军令部中许多军官的支持，但这种支持基本来自私下而非公开场合。海军大臣大角岑生当前把控着海军人事任免权，而他背后的伏见宫博恭王势力则将米内等人讥讽为“空军”，并偶尔借助大角岑生通过人事任命的方式打击航空派，大多数人都不愿因忤逆这位亲王而丢掉工作。"
  JAP_pnr_military_events.9.a: "老资历很危险呢……"
  JAP_pnr_military_events.10.t: "拜察"
  JAP_pnr_military_events.10.desc: "矢牧章中佐在御用邸的别室中等待着消息，作为海军大臣的秘书官，他陪同大角岑生前来拜察天皇正是为了就1933年的《互涉规程》进行进一步的修订。《互涉规程》是伏见宫博恭王在当时提出用以强化军令部的“统帅”地位的谋略性质的法案。\n\n1933年的《规程》第三条提到“关于兵力，由海军省提供建议，军令部进行批准。”尽管大角岑生已经是伏见宫听话的傀儡，但他希望即便大角离开也能彻底控制海军省，因此在[GetYear]的修订版本里将第三条改为了“关于兵力，由军令部总长决定提案。”换句话说，本次修订的目的是进一步削弱海军省本来的兵力决定权，并将其集结在自己控制的军令部从而彻底架空海军大臣。大角岑生此次前来正是为了说明法令修正内容，以争取今上天皇的“御裁可”。\n\n然而刚刚过去通常所需的十分之一的拜见时间，走廊里就传来了脚步声。矢牧赶忙出门迎接，就遇到了面色惨白的海军大臣：“事情完蛋了，陛下很严肃，拒绝了单纯口头说明，要求我们立刻起草文件并且提交，要马上准备……情况变得紧急，完蛋了，彻底完蛋了。”听到海军大臣说这话，矢牧立刻就拉着大臣进入了接待室，开始起草所需的备忘录。等到二人结束工作已是下午三时，他把文件叠好，交到尚未从慌张中走出的大角岑生手中。而海军大臣则缓缓离开房间，开始了他的“再度拜谒”。"
  JAP_pnr_military_events.10.a: "“是，为在南洋阻击德国，我想这是必要的。”"
  JAP_pnr_military_events.10.b: "“朕尚有疑问，再对人事责任详细说明，择日再议裁可。”"
  JAP_pnr_military_events.11.t: "飞越大洋"
  JAP_pnr_military_events.11.desc: "尽管在过去几天里曾有一些风言风语，但大角岑生海军大臣的倒台还是太过突然。根据一些小道消息，大角岑生似乎是因为被夹在了“陛下”和“殿下”中间，又被“陛下”反复诘问，最终压力过大选择了辞职。他推荐的继任者本来是同为舰队派重要人物的的永野修身大将，但在几次私下商谈之后情况似乎急转直下，最终继任该位置的是一直在海军省内遭到打压的航空派领袖米内光政大将，随着主张重点发展航空母舰和空中战力的航空派在海军之中谋取了地位，或许伏见宫博恭王对海军整体控制将受到削弱，而巨舰大炮主义的思想也大概会有所退潮。\n\n此外由于这场人事变动如此迅速，加上米内光政本人颇得宫中喜爱，而且中间还发生了很多密室政治式的非公开谈话，海军中间也出现了另一种偏向阴谋论的说法，称大角的辞职实际上是天皇陛下身边的宫中集团策划的一场阴谋，目的是制衡海军内部派系，以免伏见宫一派彻底称霸海军系统，从而巧妙地扩大天皇对海军的实际控制权。"
  JAP_pnr_military_events.11.a: "你这么一说，似乎有点可能。"
  JAP_pnr_military_events.12.t: "真理只在射程之内"
  JAP_pnr_military_events.12.desc: "尽管过程多有波折，但伏见宫借助大角岑生策划的计谋最终成功了。《互涉规程》的修订已经得到了天皇的“御裁可”，意识到这意味着军令部彻底掌握兵力的运用权之后，伏见宫博恭王最终选择更进一步，将海军省中那些长期以来和自己路线不合的人从中央清除：在他的授意下，大角岑生以自己的名义对海军省内部进行了一次规模庞大的人事清洗，其目的无需多言，将那些试图把海军变成空军的家伙彻底清除出去。最先被转入预备役的是堀悌吉；然后是井上成美少将，他流放到横须贺镇守府待命；随后是其他在海军省中公开支持航空派的人物。如今在无人敢公开表达对传统大舰队路线的支持了，伏见宫和大角岑生成功在表面上确立了自己对海军系统的控制，如今他们将面对另一个长期以来困扰着海军的敌人：预算。相信它不会比起航空派还要难战胜。"
  JAP_pnr_military_events.12.a: "我们的大舰队将称霸海洋！"
  JAP_pnr_military_events.13.t: "自己人"
  JAP_pnr_military_events.13.desc: "“这位叫渡边，街上遇到的，说来这里做买卖。”王贵麟领着他闯进了村民们吃饭的地方。“哇呀，日本人！我第一遭见到活的！”他一边点头问候这些好奇的中国人，一边紧跟着王贵麟向里闯。“给渡边先生整点吃的。我们从镇上过来，妈的，吃的全让[KUM.GetLeader]和[SIK.GetLeader]的那帮土匪抢光了。”旁边那个人听到他这么说，便在墙上抹了抹沾着羊奶咸汤的手，给他从锅里捞了几粒饺子放进一旁挂着奶痕的空碗里，递给了渡边。\n\n没有餐具，他只好学这里的其他人，用手抓着那个勉强称得上是“饺子”的东西，那东西手感黏糊糊的，只是观看就能感觉到不寻常。在表皮那层诡异的油光之下能清楚地看到挂在上面的粉粒，放进嘴里之后，和外形一样的怪味道立刻塞满了口腔，沿着食管一路下探。肉类酸腐的味道混在粗粝的植物纤维里面，让他意识到这东西相当不妙。随着他强行命令自己的牙齿咀嚼，舌头搅动，从舌尖扩散到整条舌头上的是刮擦感和滚烫的温度，从死羊的腹中刨出来的未消化的青草恐怕就是这个气味。\n\n有液体从他的下眼睑溢出来，在模糊之中他看到所有人都停下了吃饭的动作，严肃地盯着他看。这下完了，他心想着，恐怕眼前这些人看到自己因生理反应而扭曲的面容要产生“果然他和我们不是同一人种啊……”这样的失望想法。\n\n“嗨呀，”王贵麟突然转过身去，对着剩下的那群人说，“这是和我们一起吃饭的渡边弟兄。”"
  JAP_pnr_military_events.13.a: "哎喽，是一家人。"
  JAP_pnr_military_events.14.t: "死之高贵"
  JAP_pnr_military_events.14.desc: "[JAP.GetName]一向是自诩站在正义一边的国家，大战之后就抱着所谓的正义沉入了和平的美梦之中。过去曾心怀着强健的精神驰骋在西伯利亚大陆上的日本男儿，今天怎么变得如此温吞！几天之前印度支那的人们对德帝国主义掀起了反旗，然而我国和我国国民竟对这些忧国志士毫无半点反应。当德国匪徒的飞机在交趾支那的丛林上方呼啸而过，当帝国主义者的炮舰停在西贡城外向内倾泻炮火的时候，[JAP.GetName]竟在一边呼吁些不痛不痒的和平，一边谈论欧美潮流的服装和发型吗？之前自诩为亚洲的先锋和解放者，说着的所谓的国家的大义和国民的精神，因为一次大战之后奉行的所谓“尊重生命”就这样全然失去了！\n\n为了自己的生命存续掩盖懦弱，嘴上说什么呼吁和平而丢掉武器，最后就会连生命也被丢掉！[JAP.GetName]就这样冒渎自己的生命，让[JAP.GetAdjective]魂魄就这样腐烂了！今天我已经把退职申请交到上官手中！如今我不是作为一个[JAP.GetAdjective]军人去到印度支那为了战斗，我作为一个更纯粹的日本人，为了实现印度支那的民族主义，为了有色人种的大联合和亚洲的协同共荣去战斗，实行[JAP.GetName]建设大亚洲的第一步！\n\n你们之中没有愿意撞在恐怖的白人靴子上去死的人吗？你们之中没有愿意为了比生命更尊贵的东西去死的人吗！若是听了我今天这番话就从梦中猛醒的，要是有这样的人就在明天凌晨集结吧！以侠义的精神为荣，有着超越一切的热忱灵魂的诸君，我们和印度支那的斗争者们一起起义，一起去死！"
  JAP_pnr_military_events.14.a: "当下与德国冲突为时过早。"
  JAP_pnr_military_events.14.b: "台湾总督府最近在“考察热带产业”以期进行投资。"
  JAP_pnr_military_events.15.t: "黄皮档案"
  JAP_pnr_military_events.15.desc: "事件的起因是国务大臣$SIA_pridi_phanomyong_royal$向$SIA_prajadhipok$国王提供了一份名为“黄皮档案”的国家发展草案，其目的是应对黑色星期一在[SIA.GetName]的蔓延，该草案涉及到形成福利国家所需要做出的各项改革：从土地再分配到对农民的补贴制度。在看过该档案之后，$SIA_prajadhipok$国王很“亲切地”将其称为赤匪，并下令逮捕$SIA_pridi_phanomyong_royal$。\n\n国王为他的行为付出了代价，$SIA_pridi_phanomyong_royal$背后的人民党左派成员在会议讨论之后决定控诉国王:他们通过他旺·里提德以个人名义向法院起诉国王干预政治、国家和经济事务。这无异于火上浇油，促使了内阁的分裂，并最终导致了议会和国王之间发生了一场内战。\n\n下官个人的看法是，尽管议会军如今牢牢控制着曼谷，但他们的叛乱后劲不足。即便可能过程会稍显艰辛，但相信$SIA_prajadhipok$国王最终能够压制这些左派反动势力。也正因如此下官才觉得这是一个晴天送伞的好时机，我们正可以借此机会扩张[JAP.GetName]在东南亚地区的潜在盟友，如果[289.GetCapitalVictoryPointName]最终能和我们站在一起，我们就可以直接从大陆上对[GEA.GetName]的新加坡海军基地创造难以忽视的威胁。"
  JAP_pnr_military_events.15.a: "[SIA.GetAdjective]真是野蛮……"
  JAP_pnr_military_events.15.b: "我们就不会随便说人是赤匪……"
  JAP_pnr_military_events.16.t: "TO机关"
  JAP_pnr_military_events.16.desc: "守屋精尔一开始只是计划带着刚刚上任的特命全权公使矢野真去波丁餐厅吃个著名的招牌菜烤乳猪，要知道这可是马德里最有名的老店，据说他们店里的冬青橡木柴火烤炉从18世纪初到现在两百年从来没有熄灭过。可刚走到马约尔广场附近，两个人立刻就融入到广场上那成千上万，密密麻麻的人群之中。让人不由得怀疑是不是圣母和耶稣显灵了，正在马约尔广场上挑去哪家亲子餐厅吃晚餐好。\n\n人群的集结速度比任何时候都要快，两个人很快就在涌动的人潮被分割开来，一同融入了这西班牙人的汪洋之中。就在这时候广场的广播系统突然开始躁动起来，整个马德里都响起了西班牙王国那著名的“有曲无词”的国歌。为了呼应这国歌，人群，或者说某种新生的意识体一边欢呼着一边向着北边的面包房之家迅速移动，并贪婪地吞噬他们在路上遇到的任何小股人群。\n\n在那国歌播放完毕之后，一个刺耳的男声则开始用激昂的声音播报：\n\n“奉[SPA.GetLeader]陛下之谕旨向各国民报告，前线传来消息，加泰罗尼亚和安达卢西亚的工团匪徒正屡屡受挫，我军不日便将攻占巴塞罗那的赤色巢穴！北方方面，卡洛斯叛匪也节节败退，预计内战将在一周内结束！”\n\n“国王万岁！[SPA.GetName]万岁！”人群一边欢呼着，一边加快了他们宏大的欢乐游行的脚步。而面包房之家的弗兰芒式尖顶角塔则在夕阳的照耀下，在人群的头顶投射下两道尖锐且令人不安的阴影。"
  JAP_pnr_military_events.16.a: "万岁！"
  JAP_pnr_military_events.17.t: "日升时分"
  JAP_pnr_military_events.17.desc: "这里有一个古老的故事：在很久很久之前，这片土地上有着一个强大的王国，有两位弟兄统治着这里，哥哥受到了诅咒是个瞎子，家中有一百位王子；弟弟受到了诅咒面色惨白，家中有五位王子。尽管兄弟二人彼此相爱，五位王子和一百位王子之间则多有冲突：那五位王子体内都有天神的血脉，因此时常凭力量在游戏时欺负一百位王子，这让一百位王子心生妒恨，誓要谋杀他们五人。随着这对国王弟兄的死去，他们的子嗣之间也因阴谋和冲突而走向了无法调和的对立，并最终酿成了一场恐怖的大战。\n\n在战场上，由于双方因兄弟阋墙而感到痛苦，故而约定战争只在白天进行，而日落时分则握手言和，依旧互称以兄弟。这尊贵的盟约时至今日仍令人们在听闻时心怀敬畏。遵着这经时间洗礼仍不失其光辉的古老盟约，日落之前的白日是恐怖厮杀的战场，日落之后的漫长黑夜则赐予精神以安稳的休息，但正如日落之后必是日出，对峙的双方在充足的休息后都已屏息等待着太阳的升起。\n\n“这样就结束了吗？”他倚在半毁的砖墙下发问。\n\n我们还没有讲完这个故事的后半部分，停战盟约履行了十四天。直到五位王子决定祈求天神，让日落虚假地降临在世界上，这让那一百位王子放松了警惕。在那一瞬间，天神解除了幻术，于是五位王子的军队轻易地将对方击败。在那个真正的夜晚里，一百位王子因失去自己的战友，因神圣誓言遭到愚弄而陷入了疯狂与愤怒，在他们的催促和羞辱之下，总司令为了证明自己的忠诚选择打破日落之后停止交战的正法（Dharma），于是厮杀就这样在本应和平的黑夜中延续下去，这古老的盟约早已破碎，亦无人将其视为约束。"
  JAP_pnr_military_events.17.a: "而恒河如今或被朝阳，或被鲜血染红。"
  JAP_pnr_military_events.18.t: "大暴风"
  JAP_pnr_military_events.18.desc: "彼时，那天地间唯一且至大者，用无烟的火创作了神秘精微的精灵，他们隐身在人世间，变形成动物，甚至夸耀自己是世界的统治者，坐在君主的大帐之中。精灵们不受约束，行事自由。米沙勒站在诗人阿沙身旁，用细语（waswas）轻轻浸润他那艺术与美德的心灵；阿比·图玛玛曾向阿姆尔·本·卢海伊揭示神秘的预言，指引他找到古老的异教偶像。恐怖的阿什莫德曾欺骗苏莱曼王摘下戒指，用旋风将他抛到万里之外的旷野；当旅行者走过沙漠山谷，夜幕降临时，有敌意的精灵便会出现杀死他，夺取他随身的财物。\n\n然而更多时候，邪恶精灵中的马里德（Marid）和伊夫利特（Ifrit）将用巫术卷起巨大的暴风，在空中彼此激战。问问从西方来的游牧者们吧，他们会为你亲自描述这战斗的惨烈：他们的怒火将吞噬十支商队，他们的争斗曾摧毁最繁华且虔诚的信士的城市，其繁华程度胜过古老的千柱之城。他们就这样用恐惧支配着人们，并使人们误以为他们乃是天地间的闪亮的真神，至可怖者。催促人们向其献上平息愤怒的祭品来依赖（shirk）其庇护。待到人们俯首称臣，待到对他们的恐惧如血液一样流淌在人们的血管之中，心满意足的精灵便不再卷起风暴进攻，他们转而用这力量摧毁其它不愿臣服于它，称他们为作恶者的的硬颈项的众民。"
  JAP_pnr_military_events.18.a: "他们的名字正是[RUS.GetName]。"
  JAP_pnr_military_events.18.b: "而[JAP.GetName]是信士的援助者。"
  JAP_pnr_military_events.19.t: "外道之王"
  JAP_pnr_military_events.19.desc: "在获得了土登丹增的允许之后，我得以穿过诵经祷告的僧众，进入房间见到了这位尊贵的老朋友。他与我们先前相见时是多么的判若两人，如同一节茁壮的真柏，在正盛时被神灵选作盆栽的材料，制成了神枝（Jin）那样的枯木。疾病竟将他四十岁的身体折磨成这个样子。我走到他面前，在那把或许之前有其它无形的生物坐过的空椅子上坐下。“战争已经开始，”我对他说，“我进藏时来的路，如今已被军队堵塞。”他依旧维持着狮子卧，只是嘴唇嗡动，低声对我说：\n\n“那天上瑜伽的起源之地，最初之王索查德那普于此地领受了释迦的教诲。将有一位神武的转轮王率领十二支天兵神将，奋力投出他的长矛，刺穿外道之王的前胸，随着领袖的一命呜呼，魔鬼也随之全部除尽。”他继续说着，声音比之前更低，“当那勇武的策马者击败一切妖魔，甘丹寺中宗喀巴的陵墓就会打开，释迦的教义将再次广布。等到一千年的安宁之后，四大元素将腐朽，世界将被毁灭，那些幸存的虔信者被莲花生大师的手托上天宫，于是等到无数年之后世界再度成型之时，他们就会从雪山上降下，佛教也随之再度兴起。”\n\n他依然继续说下去，但是我听不见他说的任何一句话了。一旁侍候的土登丹增将其他人招呼进来，低声宣布他已经进入图定（Thugsdam）。\n\n数周之后他将被火葬，那大火熊熊燃烧，让从北方来的[XSM.GetAdjective]看到便畏惧。"
  JAP_pnr_military_events.19.a: "在这之后便是圆满黄金时代吗？"
  JAP_pnr_military_events.20.t: "怀表"
  JAP_pnr_military_events.20.desc: "中国并非是一个铁路网发达的地方，而对于[1083.GetCapitalVictoryPointName]这样位于其疆域边缘的小城市更是这样。渡边一开始计划南下去喀布尔公使馆和驻阿富汗武官宫崎义一见面，顺道合理合法地为自己的工作开几天小差，结果却没想到根本没有南下的铁路网。这下计划泡汤，他只好乘坐这条唯一的横贯铁路，回到[LEC.GetName]的$LEC_national_populist_party$复命。"
  JAP_pnr_military_events.20a.desc: "$JAP_pnr_military_events.20.desc$\n\n[ETS.GetName]已在整个西北站稳脚跟，而他自己则没有这么好的运气：等到了西安转车已经是半夜，还很不幸地下起了雨。渡边索性找了一家附近半掩门的香油坊，给了店主一些钱，先借他店里的门板当床睡一宿。结果第二天醒过来时却是大惊，想不到这门板下面竟还躺着先前在王贵麟那里见过的一个村子里的少年。哈密到西安有两千公里，他坐火车到这里尚需要两日，而这些人虽然因逃难先出发，却能仅凭腿脚行走如此之远，着实令人惊叹。趁着天刚微亮，渡边从怀里摸出那块怀表，走到了里屋那个正在震荡敲击芝麻酱的掌柜面前。"
  JAP_pnr_military_events.20b.desc: "$JAP_pnr_military_events.20.desc$\n\n回程的道路虽然令人感到烦闷无聊，但也是令人稍感放松的经历。偶尔车厢头顶会传来沉闷的踩踏声，偶尔在蒸汽火车不那么吵的时候，他能听到异物被碾压的响声。或许只是心理作用也说不定，总之这些和他无关——在[ETS.GetName]落败之后，他就没有任何意义继续留在那里了。连代理人都消失了，自己为什么还要在那里看军阀互咬呢？在回到[LEC.GetName]的$LEC_national_populist_party$之后，自己一定要把余剩的那好大一笔机密费提出来，在[LEC.GetName]好好地安慰一下自己。至于行动失败的愧疚，那是大人物要考虑的问题，而自己只是个执行人，又有什么好考虑的呢。\n\n他打开随身携带的那块怀表，无聊地开始研究起为什么人类要把时间分成十二个小时。"
  JAP_pnr_military_events.20.a: "请你想办法收留这个孩子。"
  JAP_pnr_military_events.20.b: "那么，千登势，梅月……还是去大胜馆吧。"
  JAP_pnr_military_events.21.t: "西贡之声"
  JAP_pnr_military_events.21.desc: "1862年，蓝白红的三色国旗飘扬在交趾支那的土地上，然后是1867年，柬埔寨原本的绿与黄也被染成了红蓝白三色，最后是东京和安南，“印度支那”就这样被创造出来了；等到那场和人们无关，发生在很远很远地方的战争结束之后，新来到这里的一群人把三种颜色中的蓝色稍稍调暗，换成了黑色继续宣誓他们对这里，这些并不来自这里，也对这里仅知道一个“印度支那”——被创造的名字——的主权。然而她们的名字尚未被所有人遗忘，尽管在断头台前有十三颗头颅滚落，他们的鲜血也悚然喊叫着那遮蔽在“印度支那”之下的众多真名之一。\n\n我造访了[286.GetName]北部的一个小村庄，那里已经夷为平地，光秃秃的土地上突兀地立着两座石塔，那些村民们看清我的面貌之后，都热情地同我交谈。他们告诉我有两位守护神沉眠在这里，在那时为了掩护那支毫无经验的游击队撤退，他们二人在这里阻拦了[GEA.GetName]的陆上军队。神灵的名字，籍贯和部队我一概没有得到。\n\n我写这些的意图读者已经很明确，在战争结束之后，我立刻进入到西贡就是为了探清究竟发生了什么。"
  JAP_pnr_military_events.21a.desc: "$JAP_pnr_military_events.21.desc$随着越盟彻底控制了整个地区，盘踞于[336.GetCapitalVictoryPointName]的[GEA.GetLeader]集团以及他背后的柏林主子不得不承认他们的失败，越盟的胜利不仅粉碎了帝国主义者的强大神话，更为这个世界上更多在殖民者铁蹄之下仍未放弃斗争的解放者们揭去那虚假名字的希望。我见到了阮安宁，想从他那里得到什么东西，他给了我一颗有点笨拙的肮脏纽扣，尽管有所磨损，但我看出来上面有五七桐纹的图案。"
  JAP_pnr_military_events.21b.desc: "$JAP_pnr_military_events.21.desc$我持有法国护照——然而这并未减轻当局对我的怀疑。[GEA.GetName]的治安战仍未停止，每天都有连续不停的响声从西贡大监狱的高墙之内传来。我找遍了这里也没有找到，我想石井先生和其他人现在不在这里，他们一定是同越盟中的其他人一道，和阮安宁一起跨越了那死生的界限，去了某个地方。\n\n关于那些出发者留下的遗物，我什么也没找到。就带回了一块碎的不成样子的砖头，希望能以此铭记所有迈过那界限的魂灵。"
  JAP_pnr_military_events.21.a: "大好时节正值百花绽放。"
  JAP_pnr_military_events.21.b: "在西贡传来的只有帝国战旗的响声。"
  JAP_pnr_military_events.22.t: "骚乱结束"
  JAP_pnr_military_events.22.desc: "[289.GetCapitalVictoryPointName]传回消息，近日因“黄皮档案”而引发的[SIA.GetName]内战已经结束。"
  JAP_pnr_military_events.22a.desc: "$JAP_pnr_military_events.22.desc$就和我们预料中的一样，王室坚定了他们的位置，再无任何人能够威胁他们对[SIA.GetName]的合法统治了。"
  JAP_pnr_military_events.22b.desc: "$JAP_pnr_military_events.22.desc$出人意料的是，人民党的政变最终得胜，如今整个[SIA.GetName]已被议会控制。我们无法确定它的未来如何。"
  JAP_pnr_military_events.22.a: "此事平平无奇。"
  JAP_pnr_military_events.22.b: "这也能输吗？"
  JAP_pnr_military_events.23.t: "疲惫"
  JAP_pnr_military_events.23a.desc: "如果我们能以不流泪的双眼靠近，目睹你的悲恸，心中岂能冷酷无情？\n\n如此景象，无需泪水，无需叹息。\n\n这些荒凉的遗迹，是崇高的战利品，彰显着和平公民美德中蕴藏的非凡勇气。\n\n它们向后世证明你无与伦比的价值。\n\n鲜血在你眼前无情流淌；疾病吞噬了你的生命；\n\n战争如火山般席卷了你脚下的土地，可怕的考验！\n\n你却勇敢面对并坚持了下来，\n\n直到所有希望和帮助都已消逝。"
  JAP_pnr_military_events.23b.desc: "遵循古老的仪式，粗犷的比斯开人，\n\n当他们的孩子在纯洁无罪的婴儿时期夭折时，便会为安详的遗体穿上洁白的祭衣；\n\n如同象征着无云的胜利，他们用纯白玫瑰的花环，为这无辜的生命系上幸福的额头；\n\n随后，一群欢庆的人们齐声歌唱；耶稣的十字架高高举起，在前行的队伍中，人们将孩子抬出，敞开怀抱，送往它的墓穴。\n\n墓穴合上——母亲悲痛欲绝，这是她必须承受的；\n\n但很快，凭借着基督教的信仰，悲伤便被抑制；喜悦重返，照亮了坚韧的心灵。"
  JAP_pnr_military_events.23c.desc: "他们追逐，也被追逐；\n\n每日奔赴战场，即便寡不敌众也毫不退缩，因为他们已学会如何开辟和封堵残酷战争的堤坝；\n\n他们的首领，是昔日祖国孕育或扶持的将领，自力更生的领袖——\n\n如同那些令罗马帝国胆寒的对手；迦太基人曾因他们的猛烈冲击而溃逃。\n\n一位默默无闻的牧羊人，其身上仿佛重现了维里亚图斯的英勇；\n\n而米娜，在书香的荫蔽下成长，与那位伟大的领袖争锋相对，他厌倦了纷争和流血，\n\n渴望在西洋某处绿意盎然的岛屿上安息。"
  JAP_pnr_military_events.23.a: "面包房之家依然留在那里。"
  JAP_pnr_military_events.23.b: "随后，我见那旋风中，显现出神的面容。"
  JAP_pnr_military_events.23.c: "火炬就这样被点燃了。"
  JAP_pnr_military_events.24.t: "之后发生了……"
  JAP_pnr_military_events.24.desc: "1927年的某个夜晚，交战的激情已随着时间被磨损殆尽，和平的渴望静悄悄地爬上了折断的战旗。跨越温迪亚山脉，一座孤寂的宅邸中大人物们齐聚一堂，他们彼此争执，眉头紧锁。他们每个人确信自己来到这里都是怀抱着公正的心灵，执行着无偏的划分，随后每个人都在地图上画下一道漂亮的线。在他们面前，印度次大陆如同待分割的某只牲畜，他们望向这在小小方桌上便能铺展开的庞大大陆，目光之中充满了对使命的狂热。共识被推翻，地图被替换，和解与辩论的虚像之中隐藏着对铅笔线的涂抹，然而时间，最珍贵的时间迫使他们立刻给出成果。"
  JAP_pnr_military_events.24a.desc: "$JAP_pnr_military_events.24.desc$\n\n“既然如此我们将在南方统治，既不打扰也不被打扰，既不索取也不被索取。”胸前层层的祖母绿和珍珠摇动，他划下一条线保护诸王公的宝库。为这结果三位大人物各自作出了远超出另两人的牺牲，次大陆就这样被分割开来，数千万人的命运都因这条线而改变。人们本以为这条线将横亘在大陆上直到被时间变成理所当然，直到那些未出席会议的人们用他们的血模糊了它。\n\n1927停火如今已成历史，所画下的铅笔线已经褪色。当骑白马者掠过大地，回归天上，二十一响礼炮为他的离去而欢送，如今印度终究合一，而他的统治将开启下一个完美的真理时代。"
  JAP_pnr_military_events.24b.desc: "$JAP_pnr_military_events.24.desc$\n\n“把命运交给自然边界决定，”在场那唯一的白人这样说，“难道我们还能希求更多？拉杰普纳塔和旁遮普，交给我们这些便已足够。”他划下一条线宣称帝国褪色的珠宝。为这结果三位大人物各自作出了远超出另两人的牺牲，次大陆就这样被分割开来，数千万人的命运都因这条线而改变。人们本以为这条线将横亘在大陆上直到被时间变成理所当然，直到那些未出席会议的人们用他们的血模糊了它。\n\n1927停火如今已成历史，所画下的铅笔线已经褪色。那位对踏上次大陆领土漠不关心的皇帝如今再次宣誓自己对这里的主权，他从未亲眼见过这片于他而言恒久统治的土地的方方面面，只是有人把它塞到了自己手中。而他，蒙上帝护佑者，将再度散发璀璨光芒的明珠装在了自己王冠的最顶端，那象征所有权的最高处。"
  JAP_pnr_military_events.24c.desc: "$JAP_pnr_military_events.24.desc$\n\n那身穿双排扣海军蓝西服的印度律师划下两条线宣告社会主义在次大陆的阶段性胜利：“我们不会索取更多，我们不愿流下更多印度的鲜血。德里宣布了我们对帝国主义的挫败，巴罗达预示着我们能令封建王公们屈服。”为这结果三位大人物各自作出了远超出另两人的牺牲，次大陆就这样被分割开来，数千万人的命运都因这条线而改变。人们本以为这条线将横亘在大陆上直到被时间变成理所当然，直到那些未出席会议的人们用他们的血模糊了它。\n\n1927停火如今已成历史，所画下的铅笔线已经褪色。当印度教徒与穆斯林们一同迈入水神朱雷拉（Jhulelal）的庙宇，他们为伐楼那（Varuna）和卡兰达尔（Qalandar）献上各自的祈祷。在那不为人知，超越了时间的白色穹顶下，人们怀揣着最虔诚的心，向那些安眠的无名者们抛洒玫瑰花瓣。"
  JAP_pnr_military_events.24.a: "惟有真理得胜。"
  JAP_pnr_military_events.24.b: "天佑吾王。"
  JAP_pnr_military_events.24.c: "母亲，我向你鞠躬。"
  JAP_pnr_military_events.25.t: "猎熊者"
  JAP_pnr_military_events.25.desc: "胡代别尔迪是游牧民，和自己的马相伴而生，而如今他却要用自己的双腿在地上奔跑。更何况他从来没见过熊，这世界哪儿有熊会出现在沙漠之中呢？他拼了命地一边向前跑，一边把子弹装入到自己的步枪里面。那头巨大的熊就站在地平线上对着他发出低沉的咆哮，它是那么地庞大，其身躯遮蔽了光芒，几乎占领了整个世界。巨熊挥舞着两只厚重又尖锐的熊掌，试图激活他的本能反应，这样他一转身，那厚实的一爪就能从他柔软的后背处夺去他的性命。\n\n他纵深一跳激起沙尘，努力让自己变得没那么显眼，匍匐在地上瞄准了这只残暴的生灵。透过这支步枪的准星，他看到那比自己更快的骑兵队们向着巨熊冲过去，然后在那一瞬间生命便戛然而止地倒了下去。“哎呀！死东西！”他抱怨一声，接连打出五六颗弹丸。"
  JAP_pnr_military_events.25a.desc: "$JAP_pnr_military_events.25.desc$\n\n然而巨熊似乎发现了他和他的朋友们所在的位置。它大叫一声，紧挨着自己的那个人立刻眼球向前凸出一下，直直地趴了下去；它挥舞了一下爪子，身旁的那支小队就被震飞到空中。巨熊的行动多么灵巧轻盈，眼见它已走到眼前，胡代别尔迪为步枪装上了刺刀。战斗直到夜晚才终结，他和他余生的朋友们从巨熊那如山洞的嘴巴般进去，将军事地图从中带出作为猎熊的证明。"
  JAP_pnr_military_events.25b.desc: "$JAP_pnr_military_events.25.desc$\n\n钻心的疼痛激发了巨熊的怒火，它发出震天动地的吼叫，向世界宣告它已发现了这些试图伤害它的猎人。胡代别尔迪和他的朋友们立刻被随之而来的冲击波掀到空中，重重地摔到沙漠里失去了意识。等到战斗结束已是夜晚，他躺在那个沙漠里的弹坑里，被打扫战场的人用枪托敲醒。他和那些还有气息的人被编好队，而巨熊张开了他的嘴巴，把他们全部吞入自己腹中。"
  JAP_pnr_military_events.25.a: "时代的主宰令多少人折戟于此。"
  JAP_pnr_military_events.25.b: "纵使再多鲜血浇灌，自由之花也未曾盛放。"
  JAP_pnr_military_events.26.t: "铁鸟"
  JAP_pnr_military_events.26.desc: "在西藏地区的古老传说中，当钢铁之鸟在天空中飞翔，当钢铁之马在大地上奔驰的时候，愚痴与贪婪将统治整个世界。外道之王将率领妖魔们在大地上横行霸道，他们不信因果，摧毁寺庙，屠戮生灵。直至末劫到来，一位神武的转轮王，被称为香巴拉的碎魔轮王（Rudra Chakrin）将会从圣地现身，对于行善者，他示现寂静之相；对于外道军众，他化身摧灭者。于是他将带领十二支天兵与无可计数的神将，乘坐着风轮与神车来到人世间，与外道之王的军队决一死战。届时，世间正义的诸神都将从圣地出发，协助转轮王击败外道。神将们将喷出火焰，焚尽妖魔；战象化为千百倍大，消灭敌军。外道之王将卷起地水火风四大元素同转轮王征战。"
  JAP_pnr_military_events.26a.desc: "$JAP_pnr_military_events.27.desc$\n\n“那么他们谁最后赢了？”布赤躺在格桑德吉的腿上，“他们进行大战，其他人会怎么样。”\n\n在这场终极决战中，转轮王将投出耀眼的金色法轮，这法轮将撼动地、水、火、风四大元素，消灭三种毒物，五种害物。将除了神圣都城香巴拉之外的一切世界悉数摧毁，至此佛法重新兴盛，大地进入安乐的时代。\n\n格桑德吉用自己唯一的那只手指给布赤看远处的那座山，那是宗穆玛釉玛。"
  JAP_pnr_military_events.26b.desc: "$JAP_pnr_military_events.27.desc$\n\n“记住这个，记住转轮王的征战。”次捷紧紧握住她的手，“只要你不忘记他，他一定就会回来”。\n\n那个九本眼见已经把村子里能搬完的东西都搬走了，就催促次捷立刻和他们走，以履行乌拉（Ulag）的义务。"
  JAP_pnr_military_events.26.a: "山体赤红，一如鲜血浇灌。"
  JAP_pnr_military_events.26.b: "直至现实侵入传说。"
  JAP_pnr_military_events.27.t: "保护好自己：给即将毕业的你"
  JAP_pnr_military_events.27.desc: "毕业的日子即将到来，作为前辈的我首先要祝贺你即将真正成为一名干练的军人了。你可能会想，我只是一个尉官，而在军队里，尉官简直就像路边的野狗一样多。我劝你一定要打消这样的想法，无论如何你都已经进入了军队的“干部”阶层了，要知道，陆士毕业是所有[JAP.GetAdjective]军官的起点，那些厉害的佐级、将级中高层军官，他们和你们一样大多都有着陆士的学历。打起精神来，作为前辈我衷心为你们的毕业感到喜悦。\n\n但是接下来我想聊一聊一些比较严肃的话题，也就是各位的人身安全问题。我想大家都知道现在的社会环境，对我们，对军人们十分不友好。因此一定要注重好对自己的保护。就我自己的情况，我今天来这里的路上首先穿的是洋服，到了这里之后便脱下洋服换上了包里的制服，各位请看，左臂的这里因为我胡乱地塞进包里，变得有些皱巴巴的了，我想这也是没办法的事情。等下我离开的时候还会把它塞回去，然后穿上洋服回去。\n\n尽管最近已经不多见了，但是前几年确实有发生过穿着制服的军官走在路上，被一些游手好闲的青年围住殴打的情况。各位未来都是能成就一番大事业的人，所以务必珍惜自己，尽可能不要身穿军人制服走在大街上，也不要佩戴任何表明自己是军人的饰品。如果真的不得已这样的话，我认识的一些人会在上衣口袋里或者显眼处放上吉野作造的小册子或别的民本主义作品。现在是非常时期，要尽量避免和国民的冲突，并博取国民的信赖以待未来环境的好转。"
  JAP_pnr_military_events.27.a: "那么我们继续说……"
  JAP_pnr_military_events.28.t: "半价电影票"
  JAP_pnr_military_events.28.desc: "“两张《浪华悲歌》的票，”他把手伸进售票处那个又窄又黑的洞口里，然后张开手掌，让15钱（sen）从手心里掉落出来，“3点场。”然而只要投入日元，就对来者有求必应的那个神奇洞口这一次却没有回复他的要求。自己的女伴还在队伍外面等着他，于是他把伸进洞里的手掌先握成拳头敲了敲下面的桌面，然后又转过来张开摆动手指，示意对方赶紧把票交出来。\n\n“先生，我是说，票价是10钱一张。”终于，神秘的精灵在那个黑黢黢的洞口里回复他了，不过这是无情的拒绝。他啧了一下，用另一只手从屁股后面的口袋里摸来摸去，找出了自己的证件。随后把另一只手也伸进了洞口里：“这是我的证件，我是——军人……”他说这话的时候突然一下子没了底气，变得很小声。不过他这番发言倒是立刻吸引了队伍后面其他人的目光，仿佛他声音比他实际上发出来的要大多了。“军人？！”电影院精灵的声音一下子变得兴奋起来，那个尖锐的高亢女声直接把排好的队伍直接震乱，“先生，我确认你确实是军人了，但是军人又怎么了呢？”\n\n“按……按法律，”他如今两只手都被这个洞口狠狠地抓住了，活像一个古代游街示众时带上手枷的可怜人，“法律，军人……买电影票，半价优惠，有证件的话，所以15钱是对的……”\n\n“一张成人票！一张儿童票！”那高亢的女声立刻宣布，随后把两张扯下来的票分别塞进了他的手心里。过来围观的人群听到这声音也立刻大笑起来，逼得他不得不低下头赶紧跑走。至于有人问他要不要糖吃这件事，他则是根本没听到。"
  JAP_pnr_military_events.28.a: "“军人半价就是因为是小孩子嘛”（軍人は半人前）"
  JAP_pnr_military_events.29.t: "我憧憬的成年人"
  JAP_pnr_military_events.29.desc: "等我成年之后我想成为一名像住在同一条街区的，当过兵的哥哥一样负责任的人——我理想中的成年人是拥有勇气并尊重他人感受，能够保护他人的人。我相信，如果成年后不能遵守规则和礼仪，就会被社会厌恶，这就是为什么那个哥哥让大家烦躁的原因，尽管是很负责的人，但却平时行事粗暴。然而他很关心其他人的生活，帮店铺看店、帮大家搬东西、甚至帮大家驱赶来捣乱的坏人，所以我希望成为一个像他那样懂事、有担当的成年人，并且更进一步成为对大家温柔的社会成员和人。我也相信，这样尊重他人感受的人不仅能够帮助身边的人，也能关心他们的心灵。通过换位思考，我认为我可以意识到自身的不足和以前忽略的事情，从而更加珍惜身边的人。如果我能在行动中顾及他人的感受，我相信我能成为一个优秀的成年人，能够全心全意地为他人服务。为了成为我理想中的未来成年人，我认为从现在开始有很多事情需要注意，所以我将努力每天思考并践行这些事情。"
  JAP_pnr_military_events.29.a: "这就是我想成为的人。"
  JAP_pnr_military_events.30.t: "电车上"
  JAP_pnr_military_events.30.desc: "梶原一踏入车厢，所有乘客的目光就都投向他这里。这也怪不得大家，他的长筒马靴声音实在惹人注目，况且整个车厢里只有他一人穿着仔细打理，做工考究的茶褐色制服，肩章的那条粗金线上的三颗金星在车厢里闪闪发光，照得所有人都睁不开眼睛。他把自己的捷克式军帽摘了下来——“这帽子加上全身的制服都是我自己定制的，这股‘青年将校文化’的风气近期又在同袍之间流行起来了，我本人呢，不喜欢破碎式的军帽，看起来松松垮垮，活像被谁打断了全身的骨头，而俄罗斯式的帽冠又太大，有一种虚张声势的嫌疑。所以最后才定下来要一顶类似马鞍的捷克式……”\n\n梶原一踏入车厢，所有乘客的目光就都投向他这里。车上虽然拥挤，但见到他的时候却又变得十分宽敞，他向车厢中间走的时候几乎没有和其他人产生过碰撞。等到他环视一圈，发现电车上确实没有座位了之后，梶原尴尬地咳嗽了几声，就这样站在原地。随着他发出声音，最先行动的是一个三四十岁，穿着利休鼠色羽织的光头男人，他直接挤过人群来到梶原身旁，然后和他一样环视一圈，最后锁定了那个可怜的学生，一边喊着“小孩子要多吃苦养成坚韧品格”一边把他抓起来，在电车上清理出了一个座位。随后是坐在他左边一直看着他的那个太太突然和梶原搭话，称赞他的军服帅气，他才给大家介绍这身行头的由来。听他讲了来龙去脉，除了那个学生外的人都点了点头，然后发出“欸——”这样捧场的声音。\n\n梶原满足于这种令人愉悦的状况，他伸手去摸上衣口袋处那根香烟，刚刚叼住烟嘴的时候，他才想起来电车上禁止抽烟。然而还没等他把烟放回去，右边就伸过来一根燃烧着的火柴。"
  JAP_pnr_military_events.30.a: "啊，请用这个。"
  JAP_pnr_military_events.31.t: "国民的赤子"
  JAP_pnr_military_events.31.desc: "“在如今我国社会上，什么才是爱国？有人说是要勤俭，有人说是要努力做好本职工作，有人说是要给国家捐钱造军舰和飞机。要我说这都是美德，不是所谓的“爱国”。这天下最爱国的莫过于是把男子送去当兵，让女子在家里照顾好自家的小兵士。天下一等一的好汉，除了军人，我想也没有别的人啦！”他抽了抽鼻子，继续对着台下的村民们讲，“好男儿连家里的也不耕种，嘴上说着要干出一番大事业，所谓的大事业不是去当兵报效国家，而是跑到城市里作大学生，像吸血鬼一样每天敲诈家里的钱财，结果却是天天在那些乌七八糟的地方和各种不三不四的人厮混。嗯？蒲田，你家儿子几年前是不是这样不争气的？他现在是什么样子呢，你可以给大家讲一讲。”\n\n他伸出手指指了指坐在左侧那个一边流泪，一边点头的女人。那女人立刻上台，先向所有村里人鞠了一躬，然后从怀里掏出来那封叠的方方正正的信纸，开始念上面的字。\n\n“想必母亲大人已经得知，25日出发的部队似乎已有十几人牺牲。我们也即将奔赴前线，已经做好了无法生还的准备。为了国家，我会拼尽全力，请您放心。我上战场是为了立功归来，即便死了也要死得光荣，但我会努力不死，请您等着我回来。眼看丰收在即，家里肯定忙不过来，想来让人揪心。但这世上还有比我更不幸的人，请务必保重身体。”\n\n“蒲田家的小子大家都知道，一等一的混球。但是啦！我们村是个大家庭嘛，所以蒲田夫人找到我，托我想想办法管束他儿子，我就找了一些关系，把他儿子送去军队磨练磨练了，现在他不仅不需要家里的钱，每个月还有兵役义救金给亲属，唯有军队这样天底下厉害的地方才有这种好事。军队就是这样厉害的大熔炉，好男儿进去能够锤炼成黄金，坏小子进去也能矫正成可堪一用的石料，再不济也有一笔表彰为国奉献的收入。”"
  JAP_pnr_military_events.31.a: "“你不把儿子送去做兵士，就让他游手好闲吗？”"
  JAP_pnr_punch.1.t: "跳入混乱"
  JAP_pnr_punch.1.desc: "你叫山本还是佐藤，你是北陆石川县出身，所以可能是叫山本。但这都不重要，你只需要知道你需要大开杀戒了。佐藤先生，你是院外团的一员——正所谓樱花总在四月盛开，台风总在九月来袭，院外团总是会在众议院开会的时候也如期而至。在古老的时代，有名誉的人总是用刀剑解决争端，这足以证明暴力本身也是解决辩论问题的一个选项。院内团指的是经选举赢得议席，进入到议场之内的人组成的团体；院外团则是由在议会选举中落选的议员和未来将要参加选举的党人组成，这些“知识分子”名义上带领着一群渴望建功立业的好战青年。但实际上前者的暴力程度或许不会输给后者。\n\n在帝国议会刚刚诞生的时刻，院外团也就跟着出现了。1890年7月的第一次众议院选举中，那些前辈们冲进候选人的集会然后殴打绑架他们的选民，让他们没办法按时投票。在那个黄金时代，只有1%的日本人拥有投票权，所以直接去攻击选民显然是一种能有效干涉选举结果的高收益手段。可惜好日子已经过去了，田中先生，现在是男子普选的时代，在路边随便抓个路人殴打一顿不但对选举影响结果不大，还会连带着让你蹲几天。所以现在院外团主要负责维护秩序，进行警卫工作。只要议场里面一声令下，你只管冲进去见人就打就是了。"
  JAP_pnr_punch.1.a: "该打人了。"
  JAP_pnr_punch.2.t: "缠斗"
  JAP_pnr_punch.2.desc: "和[USA.GetNameDef]、[GER.GetNameDef]、甚至是[QIE.GetNameDef]国会中的院外团（Lobbying Group）极为相似，我国的院外团也负责游说议员——当然是用拳头和棍棒，如果真到关键时刻，藏在手杖里的利刃也能派上用场。\n\n想想1921年的日本邮船纠纷，当时立宪政友会派出他们的院外团前往股东大会“劝告”股东们，而立宪民政党的吉田矶吉则从自己的家乡九州召集了三百名决死的壮士，也前往股东大会“劝告”政友会的院外团，双方几轮“游说”过后，终于成功地调节了事态。你呢？加藤先生，你是出于什么目的加入了院外团？贫困？缺钱赌博？希望借助院外团身份被政党青睐，成为一名议员？还是说只是单纯渴望暴力？不论如何现在都是履行职责的时候了。\n\n中村先生一下子就跃到离发言台最近的那张议会桌子上，他蹲在那里，眯起眼睛寻找着自己的对手。此时一个手持厚文件袋的家伙和他四目相对：就是他了，既然目光相交就必须分出高下。吉田握紧了手里那根临时拆下来的椅子腿，而那个用文件袋当武器的家伙也小心翼翼地向他走了过来。\n\n山田先生摆出了架势，所有可能的战术都被思考过了，他心中思忖着要如何给对方一击取得优势。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.2.desc_hold: "和[USA.GetNameDef]、[GER.GetNameDef]、甚至是[QIE.GetNameDef]国会中的院外团（Lobbying Group）极为相似，我国的院外团也负责游说议员——当然是用拳头和棍棒，如果真到关键时刻，藏在手杖里的利刃也能派上用场。\n\n想想1921年的日本邮船纠纷，当时立宪政友会派出他们的院外团前往股东大会“劝告”股东们，而立宪民政党的吉田矶吉则从自己的家乡九州召集了三百名决死的壮士，也前往股东大会“劝告”政友会的院外团，双方几轮“游说”过后，终于成功地调节了事态。你呢？加藤先生，你是出于什么目的加入了院外团？贫困？缺钱赌博？希望借助院外团身份被政党青睐，成为一名议员？还是说只是单纯渴望暴力？不论如何现在都是履行职责的时候了。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.2.desc_dodge: "对方徒劳地挥舞着文件袋，却只是把众议院里的空气狠狠地殴打了一番。他惊恐地看着高桥先生，意识到今天遇到高人了。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.2.desc_dodge_miss: "伊藤先生闪转腾挪，巧妙地利用众议院中的桌椅进行防御。然而防御百密一疏，那家伙像是个可怕的古代忍者，突然出现在他的背后，用文件袋给他的肚子狠狠来了一下。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.2.desc_attack: "僵持之中，佐佐木先生猛然挥出一记重棍。单凭这一记挥棒的准度恐怕加盟名古屋金鯱军，角逐职业棒球联盟也不是什么难事。那家伙本想用文件袋来抵消冲击力，但是石井先生挥棒的速度更快！他的身体因冲击向一侧弯曲，目光中满是惊恐。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.2.desc_attack_miss: "瞄准对方，扬起椅子腿，池田先生凝聚全身力量狠狠地向下挥动木棒。然而大开大合的动作却让对方找到了机会，对方并未退缩，而是突然像强壮的公牛一样冲刺向桥本先生的怀中，抱着文件袋一记猛冲将他冲得连连后退。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.2.a: "从桌子上发动突袭。"
  JAP_pnr_punch.2.a_tt: "§Y这或许将给对方带来巨大伤害，并且只有在现在才能利用这招！§!"
  JAP_pnr_punch.2.b: "给他一棍。"
  JAP_pnr_punch.2.c: "我看到了桌子上的姓名牌。"
  JAP_pnr_punch.2.c_tt: "§R这或许将给对方带来巨大伤害。§!"
  JAP_pnr_punch.2.d: "防御。"
  JAP_pnr_punch.2.d_tt: "§Y如果防御成功你将恢复生命值，同时对方的斗志将动摇，这将使得我们的攻击更容易命中。§!"
  JAP_pnr_punch.2.e: "胜负已分！"
  JAP_pnr_punch.3.t: "历史的反复"
  JAP_pnr_punch.3.desc: "哎呀，看来前田先生忘记了一件很重要的事。大正九年，也就是1920年，在帝国议会中曾经发生过一场了不得的议会暴力事件，那时候众议院惩罚委员会的委员，立宪政友会的赤尾彦作前辈曾经因反对党的激烈狡辩而感到恼火，所以决定好好教训一下这个舌灿莲花的诡辩家，他直接抓起座位上的姓名牌冲到讲台上，与当时正在发言的三木武吉像是洗土豆一样扭打在了一起。毕竟在要批评这些只会说大话的家伙的时候，谁会不期望得到一件趁手工具呢？这块长30厘米，宽10厘米的木板简直是无法携带武器的帝国议会中最好的道具之一。但正是因为这位惩罚委员稍微激动了一点，在他被移交给众议院惩罚委员会之后，帝国议会就连夜把姓名牌从可拆卸的改成固定在桌子上的了。这是个没什么趣味性的历史小知识，不过它现在可要了你的命了，十二町先生。你在桌子上拽了快一分钟了，但那块姓名牌纹丝不动，而对方则拿着文件袋冲过来给了你好一顿毒打。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.3.a: "我怎么会记得这种事！"
  JAP_pnr_punch.4.t: "蛙扑"
  JAP_pnr_punch.4.desc: "我们刚刚聊到哪里了？好像是1921年的日本邮船纠纷。那个时候吉田矶吉招募的三百名壮士中还有七十人组成的精英小队，其他人在会场中警戒，而这七十人则站在股东大会会场外负责安保。等前来干扰大会的政友会院外团赶到的时候，这七十人便一齐脱下上衣，展露自己身上的刺青，以此震慑那些聚集在股东大会场所的门厅前的家伙们。\n\n那是一记漂亮的飞扑，对方没想到你的动作会这么灵敏，这么迅捷。想必你一定是个身经百战的院外团员了。你们二人怀抱厮打在一起，在地上滚动了好久。\n\n你当前的生命值为§G[?JAP.JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP.JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.4.a: "先发制人原则！"
  JAP_pnr_punch.5.t: "战胜对手"
  JAP_pnr_punch.5.desc: "经过一番决死斗争，这个手持厚重文件袋的家伙最终被清水先生打败了，他像个死青蛙一样躺在地上。吉田先生扬起自己久经百战，最能信任的双拳，为自己的成功而欢呼。\n\n当然激动的心情很快就平静下来，他开始搜寻下一位对手。"
  JAP_pnr_punch.5.a: "我是冠军！"
  JAP_pnr_punch.6.t: "眼前一黑"
  JAP_pnr_punch.6.desc: "即便有着多次斗殴积攒下来的经验，但或许是运气不好，或许是骄傲自满。藤田先生最后还是棋差一招，那家伙用文件袋把各种法律文件狠狠地打进他的大脑里，知识的厚重让他难以承受。\n\n直到那些文件的信息密度完全超出了他的承受范围，最终眼前一黑，昏了过去。"
  JAP_pnr_punch.6.a: "GUA! SAYONARA！"
  JAP_pnr_rs.1.t: "秘密调查"
  JAP_pnr_rs.1.desc: "或许海军就和他们表现出来的一样，在他们的舰船中确实隐藏着不得了的秘密。最近愈演愈烈的赤色阴谋风波招致了本就偶有合作，经常不和的陆海军之间的矛盾的进一步加深。陆军军务局怀疑先前那些关于海军内部的传闻和谣言或许有几分真实性在其中。事实上，在陆军中长期都存在着这样一个传说：据说在海军里有一个秘密的日本共产党细胞，在之前的多次内部调查中都掩饰得极好。而它未被拔出的原因便是在海军军令部中有很多布尔什维克主义同情者，他们之中不乏高官，正是他们协助掩护了这个细胞的秘密延续。当然一个根本找不到的组织最多只是活在大家打牌消遣时嘴里的谈资，并不会对现实造成什么实际影响。更何况，这个传说本身可能就是陆军自己出于某种偏见被创作出来的——甚至可能就是在1932年阪口喜一郎被共产党渗透时期创作出来落井下石的东西。\n\n但随着最近对于“赤色阴谋”的担忧逐渐升起，陆军内部又开始郑重对待这个故事。先前从海军官兵宿舍中搜出《赤旗》的事件如今已经人尽皆知，这无疑是海军很可能遭遇共产党渗透的证据之一。而对于该事件海军自己却在草草调查之后便宣布“没有问题”，快速结束了整个流程。我们当然可以相信海军自己的调查结果，但如果那个故事是真的呢……"
  JAP_pnr_rs.1.a: "我们最好组织自己的调查。"
  JAP_pnr_rs.2.t: "传闻显现"
  JAP_pnr_rs.2.desc: "我们先前对海军展开的独立调查浮现了令人担忧的结果，虽然我们没有发现能够直接证明海军已经遭到赤化渗透的证据，但我们确实发现了有关海军内存在的阴谋集团的一些线索。\n\n在接触了几位海军军官并拉近彼此的距离，并向其表达了“国家改造”的想法之后，他们很快将自己知道的情况和盘托出了：根据他们的说法，海军中的确存在着一个广泛活跃的，“为国分忧”的秘密团体。该团体主要由中层佐官和下层尉官组成，是藤井齐的“王师会”的继承团体。藤井齐是一位海军内部的狂人，曾经试图策划让[FNG.GetName]的中国人杀死日本人来引发日奉冲突，在国家内部陷入混乱时派出决死队在国会开会时闯入自爆以发动革命。然而这位狂人和他的政变计划最终砰然坠地，摔得粉碎——藤井齐在一次航空事故中不幸坠机，“王师会”也就此陷入沉默。\n\n值得注意的是，先前引发五一五事件的几名海军军官就曾参与过“王师会”，考虑到司法省的调查结果表明他们受到了布尔什维克主义的蛊惑，想必这个赤色阴谋集团的存在已经是板上钉钉了。"
  JAP_pnr_rs.2.a: "我们离真相越来越近了。"
  JAP_pnr_rs.2.b: "不太对劲，就到这里吧。"
  JAP_pnr_rs.3.t: "恐怖的政变计划"
  JAP_pnr_rs.3.desc: "我们的调查人员终于抓住了他们的狐狸尾巴，如今真相水落石出，但其沉重恐怕远非我们能承受。事实上不仅仅是海军，陆军内部也有人被卷入了这个阴谋集团之中。更令人畏惧的是，他们已经有了相当成熟的政变计划。\n\n循着手头的线索，我们的调查人员找到了东京新桥的一家高级料亭，桝田屋（Masudaya）。在那里我们见到了整个组织的主谋者们，其中既有海军成员也有陆军成员。一开始的对话都十分正常，但随着与会人员喝下越来越多清酒之后，他们开始断断续续地大声讲述各种恐怖的事情。\n\n在调查人员借此机会表明自己也有“扭转日本国民精神”的愿望之后，他们立刻向调查人员展示了一份一直放在桌子下面的可怕计划：根据该计划书，他们将首先鼓动海员工会在内阁召开五相会议或是国会开会的当天突然举行总罢工并要求内阁辞职，随后在警视厅出动镇压罢工时，派出敢死队引爆东京各大电厂制造混乱，而后贯彻“血盟团”的一人一杀主义，杀死所有元老重臣和另外一份长名单上的全部人物。\n\n在得到了该消息后我们的调查人员借口推辞迅速离开了现场，正好在门口遇到了之前的那几位海军军官，看来他们也是这个阴谋集团的一员，只是之前对此有所掩饰。"
  JAP_pnr_rs.3.a: "骇人的计划！不要打草惊蛇……"
  JAP_pnr_rs.3.b: "听上去只是酒后狂言。"
  JAP_pnr_rs.4.t: "反调查"
  JAP_pnr_rs.4.desc: "惊人的消息！在发现陆军鬼鬼祟祟地调查我们之后，我们派出反调查的人员确认了一个不得了的事实，陆军内部居然在酝酿着一个可怕的政变计划，而海军中的一些人也对此有所响应！看来他们对我们的调查正是为了确保我们对该计划了解多少，却反而令他们暴露。\n\n我们的调查人员伪装成海军里的“忧国志士”去接触了一些中下层陆军军官，在拉近距离之后他们立刻向我们吐露了希望进行“国家改造”的想法，随后对他们进行的跟踪将我们引到了东京中心圈的某座高级料亭中，在那里我们发现这个阴谋集团的参与者除了陆军之外，还有不少中坚海军军官。他们可以被称为“锦旗共产党”，是纯粹希望假借天皇的名义发动叛乱的组织。他们的计划极为详细，可以说到了随时都可能实施的状态：首先选择国会议员一同开会的某一天，和民间团体合作出动五千人包围国会，随后借助平叛的借口迅速集结出兵。一支小队将先占领警视厅，一支小队突袭国会杀死会场中的所有内阁成员。同时派出别动队消灭所有元老重臣，余剩所有兵力都将集结在半藏门，联合近卫师团攻入宫城直取皇居，必要时刻将出动4架陆军战机进行扫射，迫使天皇陛下在他们酒席间拟好的矫诏上签字。\n\n我们的调查人员称其在料亭中亲眼看到了那份矫诏，预定的内阁名单里有许多陆军内部的高官姓名，到时候甚至连海军大臣都由陆军大臣兼任。"
  JAP_pnr_rs.4.a: "谁还可以信任？一定要保密。"
  JAP_pnr_rs.4.b: "……少喝点吧。"
  JAP_pnr_rs.5.t: "抵抗恶法"
  JAP_pnr_rs.5.desc: "针对《国家保安法》的争论已经到了白热化，东京圈内几大有影响力的媒体就本法最终是否能平安通过的预测上彼此之间产生了冲突。一些媒体认为在[JAP.GetLeader]的政治手腕之下，该法案将毫无悬念地通过，届时[JAP.GetName]将迎来“复活的田中义一”；也有一些不那么悲观的媒体认为该法案在经过议会内的博弈之后将变得更温和，对未来持乐观态度。而今天稍早些时候，加藤勘十已经公开宣布他和他的[JAP_pnr_syndicalist_party_name]的其他党员将会缺席《国家保安法》后几天的审议与最后的表决环节，以此来表明工人阶级绝不支持这部恶法。\n\n当然，[JAP_pnr_syndicalist_party_name]除了在媒体上发表声明外还策划了别的计划，他们已经纠集了几百名工人随时准备在计划在帝国议会临时议事堂前发动一场声势浩大的游行示威，当为议事堂提供安保的警察和游行队伍产生冲突时，将会有几位美国记者和德国记者“恰巧”路过此地并“恰巧”抓拍下他们。"
  JAP_pnr_rs.5.a: "择日不如撞日，就在今天！"
  JAP_pnr_rs.5.b: "等《国家保安法》表决的时候打他们个措手不及。"
  JAP_pnr_rs.6.t: "陆军动手了！"
  JAP_pnr_rs.6.desc: "最近东京的气氛被《国家保安法》搅得浑浊不堪，本以为今天便是结束这污浊的日子，没想到陆军偏偏挑这个时候下手。首先是陆军假借因为社会对《国家保安法》不满所以要提高临时国会附近戒备的理由要求警视厅投入更多警力，而他们也在霞关附近布置了更多兵力。\n\n陆军的行动激起了海军的警惕，横须贺镇守府的几只舰艇在稍后就以基础操练为由进入东京湾内，紧张监视着陆军的一举一动。随后发生的一切令人震惊，一支小股游行示威队伍从宫城北侧出现，并且和路上的许多示威队伍合流形成了一股庞大的人潮，快速向临时议会堂方向移动。陆军借此开始将远超“维持秩序”所需数量的陆军派往宫城的北侧和东侧，半个宫城都被他们包围了。而怪异的情况是，他们即使布置了这么多人也未能阻止这支游行队伍——简直是在故意放任游行队伍南下冲击议会制造混乱——有消息称，六本木附近的步兵部队被动员起来前往各大变电站，还有更多部队被召集赶往宫城附近“确保安全”。恐怕我们之前得知的那个陆军政变阴谋已经正在实施，接下来陆军就要借镇压之名发动他们的政变计划，劫持天皇，实现他们的野心了！如今情况如此紧迫，我们必须快速行动，拯救陛下，拯救[JAP.GetName]！"
  JAP_pnr_rs.6.a: "方向七六，高低三五！"
  JAP_pnr_rs.7.t: "然后革命开始了？"
  JAP_pnr_rs.7.desc: "这究竟是怎么一回事，他已经搞不清楚了。当时自己在报纸上读到日本共产党派出三个蒙面劫匪抢劫东京大森银行，抢走大家一辈子都挣不到的三万日元的时候，城里一起做工的大家都说他们是一群横暴的赤色劫匪。但那个时候农村的叔母他们却很崇拜这些人，说他们是石川五右卫门那样的人。后来是不动贮蓄银行的分行被他们炸上了天，再后来是诱拐富商女儿出走，最后的最后，竟在东京街头上演了一场“劫囚车”大战，几个日本共产党人开着出租车，拿着各种枪械对着押送共产党犯人的汽车扫射。自己当时目睹了这一幕只觉得可怕，城里的大家也觉得可怕，自己做工地方的老板也觉得可怕的要命。但叔母他们听了自己讲得这些可怕的经历之后，反而更对这些人尊敬了。那一刻我觉得，我的世界好像和农村叔母家的世界脱钩了。\n\n但今年呢？今年三月之后一切都变得不对劲了，城里做工的大家也开始不聊香烟和便宜打折的洋食大杂烩，开始说什么共产党马上要起义了；走在街上感觉每条小巷子深处都有人在密谋自己不知道的可怕大事；叔母他们开始问自己要怎么找到那些劫匪。至于现在——\n\n现在我正处于人群的汪洋之中，他们是从哪里，哪座工厂涌出来的我不知道，他们要去哪里我也不知道，大家好像只是随着前进在逐渐增殖，有人对着路边店铺投掷石头，有人举着牌子大喊，我就这样和他们一起涌动着。\n\n我只是觉得我被这个世界甩在一边了，陌生的气息压得我要窒息了，所以做什么都好，别把我丢在后面。"
  JAP_pnr_rs.7.a: "《国家保安法》反对！[JAP.GetLeader]政权打倒！"
  JAP_pnr_rs.8.t: "然后政变开始了？"
  JAP_pnr_rs.8.desc: "一只巨大的怪物正在从神保町方向南下，它吞噬了沿途的一切，带着无与伦比的破坏力继续前进。就在刚刚，它已经突破了大手町的防线，那些守军们只是说着“没办法了！”“人群里还有警察！”“我不敢开枪！”然后就把问题抛给了有乐町负责加强安保的陆军。这是最后一道防线了，有乐町背后就是日比谷，而再向南走就是临时议事堂，那里正在紧张地进行《国家保安法》的最后表决。\n\n朝日新闻社由于也在这只怪物的前进路线上，他们的记者已经在合适的路口布置好照相机，和莫名其妙不知道从哪里听到风声，也在这里等候的外国记者们一起做好准备。等到和这只怪物正面接触的时候捕捉一张完美的照片，明天发到第二页上去。当然如果他们把照片冲洗出来后仔细看一下的话，说不定还能看到怪物之中有自己从三月开始就“休假”了的同事。\n\n这支怪物很快冲到了丸之内附近，有乐町防线已经做好准备，无论如何都要拦住它，它现在凶猛地扑到了防线上，那层薄薄的人墙顷刻之间就被冲散，他们不敢激化矛盾，尤其是注意到那些来自外国的照相机正对着他们的时候——谁知道在他们看不到的地方还有没有更多照相机——即便是鸣枪示警也会被这些长舌者以最恶毒的方式揣测。\n\n有乐町的防线被突破了，那些守军们只是说着“没办法了！”“外国人正在拍！”“我不敢开枪！”然后就把问题抛给了众议院附近负责加强安保的陆军，这是最后一道防线了。"
  JAP_pnr_rs.8.a: "“政变，是政变！快保护变电站！”"
  JAP_pnr_rs.9.t: "焦苦之物"
  JAP_pnr_rs.9.desc: "时间已近六月，天气也一天一天地热起来了。在风见章被迎进屋内之前，他始终看着那颗靠近路边的白菜。那是播种后六十天即可结球的新品种。它卷得太饱满，死死地向内抱住，但长得小而可怜。等到他进到屋内的时候，就从土里的白菜味转换成了煨白菜的味道了。那个人就坐在那里，一只手耷拉在桌子下面，升腾起缭绕的烟雾。\n\n“您今年也很精神，白菜的情况怎么样？”“农会开出的价格让人失望，但就算这样，去年准备绑白菜的红纸都没有用完，实在艰难，不过已经难了很久了。只是今年突然就又坏起来了，我没有进城，但是农会的人说城里也出了大事。”“是这样，城里，甚至是这个世界都出了很大的事情。”\n\n“城里做什么我是不管的，就是天皇死了，我想也和我这样的人无关。”背后厨房里锤了锤砧板，打断了这微妙的发言，“唉呀风见先生，还是不要聊这般悲伤的事情了。至少我还是认识您的，您总是来我们这什么也没有的地方。我现在也没有什么好东西，请您先尝尝这个润一润喉吧。”生姜一样的手指把从背后厨房里探出的那小碟接过来，上面是裁得方正的油纸，攒着一座褐红色的小土堆——那是在工厂中经离心之后和甜蜜的白砂糖分开的赤砂糖，只是价值极低的，散发着廉价甜味的，带着浓烈焦苦味道的副产物。\n\n在绢川村见不到东京和果子店里用白砂糖制的精美的上生果子，但在离心出来前，白砂糖和赤砂糖都有着根本的相同起源，因此约莫算是一种东西。风见章看了看眼前的那只嵌着煤烟和泥土的手，把裁好的油纸接了过来。"
  JAP_pnr_rs.9.a: "“——感谢，砂糖很甜。”"
  JAP_pnr_rs.9.b: "“我想做一个请愿，递到议会。您只是画一个圈也会很有帮助。”"
  JAP_pnr_foreign_events.1.t: "联帅治下八省不和"
  JAP_pnr_foreign_events.1.desc: "躲在黑鹰翅膀之下的$LEP_LEP_REP_governorate$因为短视而暴露出了弱点。随着$LEP_LEP_REP_governorate$将数条铁路出售给他们的德国主子，在$LEP_LEP_REP_governorate$产生了一场愈演愈烈的，针对[LEP.GetLeader]的反对浪潮。而在这场反对浪潮之中，他手下的一位地方军阀，$ANQ_chen_tiaoyuan$展露了反抗的野心，公开同[LEP.GetLeader]对立。[LEP.GetLeader]是[GEA.GetName]在东亚地区的一枚棋子，他的对手则名义上是一位主张独立自主，主张驱逐外国人（尤其是德国人）的民族主义者，这位民族主义者目前摇摆不定，或许我们可以找个机会在暗中推他一把，让他不再踌躇。\n\n暗中投资$ANQ_chen_tiaoyuan$是个有风险的选择，他虽然是潜在的合作对象，但我们没办法确定这家伙是单纯打出反对德国人的旗帜来聚拢人心，还是说真的是个言出必行，要把所有外国人都驱逐出去的傻子。但如果$ANQ_chen_tiaoyuan$最终能倒向我方，那将对帝国的对华政策相当有利：其一是[FNG.GetLeader]并不是一位合格的代理人，暗怀二心的[FNG.GetName]此前就曾多次尝试挣脱我们的束缚；其二是在华东地区获得一位帮手将有助于我们在中国最富庶的区域建立起另一个对抗德意志帝国主义的前线基地。其三则是关东军，以$JAP_tojo_hideki$为首的关东军集团将自己和[FNG.GetName]之间在多年里培养出来的互信关系用作和东京谈判的筹码，他们自称为最了解奉天实际情况的人，从而强硬要求东京在各项对[FNG.GetName]事务上必须要参考他们的意见，不然他们无法保证[FNG.GetLeader]和东京之间的合作愉快。这些家伙为了证明自己的重要性，不惜纵容[FNG.GetName]屡屡破坏我国在东北的权益，并反过来借此要挟我们。关东军、天津军和上海军之间的微妙平衡正随着关东军的愈发狂妄而逐渐被打破。如果东京能在更南方的位置确保一个潜在的合作者，便可以借此削弱关东军在大陆上一家独大的影响力，并安抚躁动不安的天津与上海军。况且如果能拉拢更多合作者，或许帝国无需发动一场直接性的战争便能在东亚确保更多利益。\n\n如今华东的紧张气氛不上不下，是时候给他们添一把火升升温了。"
  JAP_pnr_foreign_events.1.a: "密电上海军，准备行动！"
  JAP_pnr_foreign_events_new_decision_unlock_tt: "§a一系列全新§Y大陆干涉§!决议已在£GFX_decision_icon_small §Y$JAP_pnr_kasumigaseki_diplomacy_category$§!决议组被解锁。§!"
  JAP_pnr_foreign_events_new_decision_unlock_no_category_tt: "§a一系列全新§Y大陆干涉§!决议已在£GFX_decision_icon_small §Y$JAP_pnr_kasumigaseki_diplomacy_category$§!决议组被解锁。但你目前仍未完成国策§t$JAP_pnr_kasumigaseki_diplomacy$§!§!。"
  JAP_pnr_foreign_events.2.t: "社会声援反租界运动"
  JAP_pnr_foreign_events.2.desc: "随着社会上对$LEP_sun_chuanfang$和$LEP_qi_xieyuan$将铁路出售给德国人，以及后续在群众游行时制造流血冲突的声讨越来越猛烈，这两人在民间已被塑造成屠杀中国人的恐怖汉奸和德国鹰犬。而站在他们对立面的[ANQ.GetLeader]则自然而然地被塑造成了拯救中国于德意志帝国主义势力的救世主和“开明军阀”。$LEP_LEP_REP_governorate$的多家报纸都盛赞[ANQ.GetLeader]是一位爱国的行动者，并呼吁人们支持这场“中华民族独立的大圣战”。不止中国报社，在租界里流通的国际报纸也报道了这件事，他们认为在当今帝国主义横行霸道的当下，[ANQ.GetLeader]的“反租界”旗号无疑是中国人民意识觉醒，反抗欧洲白人帝国主义的一大标志。这些国际报道在对[ANQ.GetLeader]的行动表示同情之余，还呼吁[JAP.GetName]尽快和[ANQ.GetName]进行接触，作为先行者支援这些“反帝国主义斗士”。"
  JAP_pnr_foreign_events.2.a: "我们站在广大中国人民的一边！"
  JAP_pnr_foreign_events.2.b: "说起来，这几家中国报社背后也是日本人……"
  JAP_pnr_foreign_events.3.t: "青年义勇军前来帮助我们"
  JAP_pnr_foreign_events.3.desc: "由于反租界运动与日俱增的威望，每天都有人前来投奔对抗帝国主义者的盟主[ANQ.GetLeader]。如今安徽境内聚集了大量发誓要诛杀汉奸，打破中国人身上的德国枷锁的热血青年。我们的队伍虽然每天都在变大，但装备的数量却跟不上我们队伍的扩充速度，军备不足的梦魇始终萦绕在我们的头顶。\n\n不过这一情况如今得到了改善，一位来自上海的匿名富商是我们反德运动的同情者，他为我们准备了一大批军火免费送给我们，支援我们对抗德意志帝国主义的行动，现在我们可以用这些武器武装更多的部队了。"
  JAP_pnr_foreign_events.3.a: "公理站在我们一方！"
  JAP_pnr_foreign_events.3.b: "这些都是日式武器，是从奉天走私来的吗？"
  JAP_pnr_foreign_events.4.t: "撕下面孔"
  JAP_pnr_foreign_events.4.desc: "就像[ANQ.GetLeader]之前隐约感觉到的那样，在“反租界”运动的背后，确实有一个戴假面的人正在行动。而此人如今摘下了他的面具——正是[JAP.GetName]。一位长期混迹于华东地区的日本个人雇佣兵，也被称为大陆浪人的人请求与[ANQ.GetLeader]见面，他称自己是末永节，1911年曾追随孙中山参加过武昌革命。他这次前来是代表[JAP.GetAdjective]政府向我们摊牌。[JAP.GetName]希望更进一步支援[ANQ.GetLeader]及其反租界势力对抗德意志帝国主义的走狗[LEP.GetName]，从而将德国鬼子驱逐出亚洲，并真正实现亚洲人的亚洲。\n\n他向我们保证，如果我们愿意和[JAP.GetName]携手共进，那么东京将会提供一切可能的支援，帮助[ANQ.GetLeader]实现他对华东的完全控制。而[JAP.GetName]的援助计划也会比我们已经接受的要更庞大。尽管这位“中国通”嘴上说的好听，但[ANQ.GetLeader]明白日本人并不比德国人安全多少。现在的问题是我们是否要为了当下的利益接受他的邀请，冒着未知的风险与日本人展开合作。"
  JAP_pnr_foreign_events.4.a: "陈长官，你可不能当汉奸啊。"
  JAP_pnr_foreign_events.4.b: "哈哈，还是辛亥革命的老味道。"
  JAP_pnr_foreign_events.5.t: "老朋友"
  JAP_pnr_foreign_events.5.desc: "南平因为靠近龙岩，一向被政府认为是那群土匪暴徒们经常出没的地点。尤其是之前先是铁路遭到破坏，后又是孙联帅被一个伪装的女佣刺杀。[LEP.GetName]早已下令对自己所能控制到的区域内的各地来往人员和行李严加盘查，至于像南平这样的重点区域，则由警察和部队直接在车站的出口设卡盘查。前面那个女人的布袋子被刺刀划开，衣服簌簌地掉了一地，把许多人都拦在了原地。后来大家实在是等不及了，便也直接一人一只脚地从那些衣服上踏过去。等轮到他的时候——他可不怕那虚张声势的刺刀和帽徽——他直接哼了一声，没打开皮箱，只是从胸前口袋里把十六瓣菊花微微拾起来，那先前耀武扬威的家伙立刻换了笑颜，也不管后面乌泱泱的人群，只顾热切地给他指路如何去龙岩积灵宫，并故作推辞地收了他的日元。这位“好心人”还不忘建议他要小心山里的赤匪。\n\n等他到了龙岩的“赤匪窝点”的时候已经是下午四点了，他把帽子挂在衣架上。给了老朋友的遗孀一个拥抱。随后打开箱子，从箱中网栏，饼干下方的夹层里取出了那些钞票。\n\n“这是我从东京筹来的一部分钱，此外还有一笔不大不小的汇款，是另一个命不久矣的朋友在病床前托给我的。”他把钱放在那张木桌上，和女人并排而坐。而对方则把手搭在他的肩膀上，以赞许夹杂着安慰的力道抚摸着。\n\n短暂的沉默之后，他终于从那或许是北京，或许是东京的幻境中挣脱出来。“那笔钱是从满铁来的，已经在浙江实业银行处理干净。关于这笔钱的事我出发前托给了章秋阳，已经全数换成了法币，一共是二十万余元，到时你可以派人去三友实业社取。”\n\n说到这里，他站起身走到衣架前：“日子正在逼近，如果还有什么急缺物资，请务必和我说，我会回到上海之后和乃器兄一道处理，这样我们可以先采购一部分物资，再运回龙岩。”\n\n山田纯三郎把箱子提起来准备离开，他真的很赶时间。"
  JAP_pnr_foreign_events.5.a: "我会立刻让冯雪峰去提。"
  JAP_pnr_foreign_events.6.t: "山本条太郎去世"
  JAP_pnr_foreign_events.6.desc: "3月25日，[JAP.GetAdjective]知名实业家，贵族院议员，有“满铁复兴者”之称的山本条太郎因食道癌不幸去世。他早年间曾在三井物产担任常务董事，但因卷入西门子丑闻而辞职。1927年，山本条太郎出任立宪政友会总书记，同年出任南满铁路总裁。在他担任南满铁路总裁期间，一方面对满铁内部进行了诸多改革，实现了利润的大规模增长；另一方面则奠定了满铁在奉天地区的强大影响力，确保了[JAP.GetName]在中国北方的经济利益。据称，山本条太郎曾在酒局上与张作霖划拳定输赢，从而以这样一种几乎儿戏的方式为满铁在奉天的进一步扩张铺平了道路。这位商业巨擘在生命的最后几年中一直试图促成立宪政友会和立宪民政党之间的“党派同盟”，并寻求日本和中国之间紧张外交关系的降温。他的离世对所有人来说都无疑是一场打击，其葬礼预计将在本周内举办。"
  JAP_pnr_foreign_events.6.a: "谁人可为其继任？"
  JAP_pnr_foreign_events.6.b: "致电吊唁。"
  JAP_pnr_foreign_events.6.c: "阅。"
  JAP_pnr_foreign_events.7.t: "欧亚国际联运铁路线"
  JAP_pnr_foreign_events.7.desc: "明治维新后，日本相继取得了台湾、朝鲜、南萨哈林等领土。同时获得了南满铁路（东清铁路南段）的权益。就在短短几十年间，日本的领土规模已经翻了一倍。然而彼时的日本取得南满铁路之后，却因为条约规定无法与东清铁路北段，即今日的中东路进行联运，这使得南满铁路恐沦落为“地方线路”，难以发挥其经济价值。为避免这一情况的发生，1911年7月，满铁、大阪商船株式会社以及日本国有铁道的代表齐赴伦敦，力图将[JAP.GetName]纳入“东半球周游券”与“世界周游券”的国际旅游体系。最终在1913年6月，经西伯利亚铁路往返日本与伦敦的联运计划终于正式启动。日本铁道院也借此开始销售“世界周游券”与“东半球周游券”等联运车票。等到1916年，这条无比非凡的铁路线已将整片大陆与两极的海岛连接在一起，从珍奇异域之岛台湾到西方绅士之城伦敦只需14天时间，这就是“欧亚国际联运铁路线”。\n\n世界大战曾短暂地导致该项目取消，虽然战后该联运路线已逐步恢复，但尚未回到战前水平。考虑到黑色星期一的本质是大萧条的一种变体，日本铁道省计划将旅游业作为振兴经济的重要手段，宣传“欧亚国际联运铁路线”来促进国际旅行被认为是可利用的一种方法。我们将与先前参与该“世界周游”计划的各国进行交流，力图通过增加车次来拉动旅游业发展，这些国家虽然意识形态各有不同，但却大多都受到了黑色星期一的困扰，他们理论上不会拒绝这个提议。"
  JAP_pnr_foreign_events.7.desc_member: "日本明治维新后相继取得了台湾、朝鲜、南萨哈林等领土。日俄战争后更是获得了南满铁路（东清铁路南段）的权益。然而彼时的日本取得南满铁路之后，却因为条约规定无法与东清铁路北段，即今日的中东路进行联运，这使得南满铁路恐沦落为“地方线路”，难以发挥其经济价值。为避免这一情况的发生，1911年7月，满铁、大阪商船株式会社以及日本国有铁道的代表齐赴伦敦，力图将[JAP.GetName]纳入“东半球周游券”与“世界周游券”的国际旅游体系。最终在1913年6月，经西伯利亚铁路往返日本与伦敦的联运计划终于正式启动。日本铁道院也借此开始销售“世界周游券”与“东半球周游券”等联运车票。等到1916年，这条无比非凡的铁路线已将整片大陆与两极的海岛连接在一起，从珍奇异域之岛台湾到西方绅士之城伦敦只需14天时间，这就是“欧亚国际联运铁路线”。\n\n世界大战曾短暂地导致该项目取消，虽然战后该联运路线已逐步恢复，但尚未回到战前水平。考虑到黑色星期一的本质是大萧条的一种变体，日本铁道省计划将旅游业作为振兴经济的重要手段。现在他们希望作为“欧亚国际联运铁路线”途径国的我们能够和他们一起推动一项增加车次的计划，从而将在黑色星期一期间空闲的铁路运力利用在旅游业上带动经济复苏。[JAP.GetName]宣称这是一项能够展现所有人团结一致的决心，携手共同渡过这场经济危机的计划。问题就在于我们是否要和他们站在一起。"
  JAP_pnr_foreign_events.7.a: "而世界将因此走出危机。"
  JAP_pnr_foreign_events.7.b: "旅游业拉动经济复苏，这是个好主意。"
  JAP_pnr_foreign_events.7.c: "虽然很有诱惑力，但我们拒绝。"
  JAP_pnr_foreign_events.8.t: "[FROM.GetName]支持增加车次"
  JAP_pnr_foreign_events.8.desc: "在紧张的协商之后，[FROM.GetName]正式告知我们他们将支持我们增加欧亚国际联运铁路线车次的计划。无论其出于什么目的，但至少[FROM.GetName]和我们站在了一起。"
  JAP_pnr_foreign_events.8.a: "太好了。"
  JAP_pnr_foreign_events.9.t: "[FROM.GetName]拒绝提议"
  JAP_pnr_foreign_events.9.desc: "在紧张的协商之后，[FROM.GetName]正式告知我们他们不会支持我们增加欧亚国际联运铁路线车次的计划。理由是当前他们自己的运力已经相当紧张，没有多余的火车能够分配给旅游业。尽管他们在公开协商时表达了对我们提议本身的赞同和认可，但小道消息显示，[FROM.GetLeader]认为该计划不过是痴人说梦，看起来[FROM.GetName]并不相信区区几个游客就能改变整体的经济趋势。"
  JAP_pnr_foreign_events.9.a: "他们有他们的选择。"
  JAP_pnr_foreign_events.10.t: "[JAP.GetName]显露野心"
  JAP_pnr_foreign_events.10.desc: "1928年7月到8月期间，德国、日本和美国等国的代表齐聚于中国上海，经过了一系列商讨之后形成了《中国租界国际托管条约》,确立了[LEC.GetName]的地位以及各签约国在中国的利益，此次会议同时还促成了德国和日本之间的《青岛条约》，该条约的签署宣告了德日两国自世界大战延续至条约签署前的名义上的战争状态彻底结束。根据这两份条约，[GER.GetName]尊重[JAP.GetName]在中国的既有利益——这包括奉天、大连以及使馆城市；而[JAP.GetName]则应当以对等的尊重承认[GER.GetName]在中国其它地区的利益。但随着“黑色星期一”的到来和华东地区秩序的崩溃，看来[JAP.GetName]最终脱下了那身并不合身的“黑领结”，露出了内里的“凶暴的猴子”模样。\n\n尽管他们同样受到这场世界性的经济危机的困扰，但他们还是试图在危机之中抓住与之而来的机会。这场戏剧性的暴露起源于[LEP.GetAdjective]参谋部里一位日本参谋的失言，他称[LEP.GetAdjective]军队正在与[ANQ.GetName]与其背后支持他们的[JAP.GetName]交战。后续调查显示此人是一位关东军参谋，不知为何出现在了南方。\n\n我们在长江流域巡逻的“中国炮舰”确认了该消息，在华东战场上确实存在[JAP.GetAdjective]志愿军。这意味着[JAP.GetName]已经介入了八省联合的崩溃，并尝试借助这次混乱将自己的手从上海伸到更靠近内陆的地方——按理来说这并不能算是对条约的违背，但他们的行为显然对[GER.GetName]在华投资的安全构成了威胁。\n\n然而情况对我们来说也不甚乐观，[286.GetName]的骚乱暗示了一场可能即将到来的治安战，黑色星期一又令柏林难以支援我们的行动。目前仅仅是向[LEP.GetLeader]提供帮助就几乎榨干了我们，最好的选择或许是虚张声势，在尽力不引发事态升级的情况下迫使[JAP.GetName]退出华东，毕竟不仅我们深陷危机之中，这个世界中的所有人都处在同样的困难里。"
  JAP_pnr_foreign_events.10.a: "致电东京，“强硬地”要求他们改正错误。"
  JAP_pnr_foreign_events.10.a_tt: "§a强硬一点总是好的，暗示§R[64.GetCapitalVictoryPointName]§!对此很关注……§9[JAP.GetName]§!很可能会退缩，但德日关系大概也会因此变得更紧张。§!"
  JAP_pnr_foreign_events.10.b: "用委婉一点的口气。"
  JAP_pnr_foreign_events.10.b_tt: "§a我们会提醒他们注意分寸，但§9[JAP.GetName]§!很可能装傻充楞，这也没办法……§!"
  JAP_pnr_foreign_events.10.c: "为了避免麻烦上身的最好方法是——别干。"
  JAP_pnr_foreign_events.11.t: "东亚同文书院支持$ANQ_chen_tiaoyuan$"
  JAP_pnr_foreign_events.11.desc: "整个[LEP.GetName]境内都弥漫着紧张的气息，自$ANQ_chen_tiaoyuan$打出“驱逐外侮，还我租界”的反租界大旗后，整个华东的社会秩序便一天一天的坏下去，此前零星发生的暴力事件如今变得更为普遍，外国领事们正急迫地要求本国国民立刻前往[LEC.GetName]，并要求[LEP.GetLeader]立刻解决针对外国人的歧视和袭击问题。学生、工人甚至是手工业主们也走上街头要求政府正视中国和其他国家之间的关系。在整个华东陷入紧张之中时，其中一位列强终于开口了——他们支持$ANQ_chen_tiaoyuan$。\n\n稍早些时候，位于上海的东亚同文书院校长大内畅三就最近紧张的华东局势发表了校内演讲，在演讲中，他呼吁尤其以[GER.GetName]在内的各大强国重新审视自己和中国，以及更广泛的亚洲地区各国的关系。\n\n大内畅三毫不避讳地谈到了$ANQ_chen_tiaoyuan$和反租界运动的正义性，他主张这是“自中山先生辛亥革命之后，亚洲得觉醒而必将解放的又一例证。[LEC.GetName]和不平等条约的废除将成为鼓舞全亚洲反对帝国主义压迫的第一声雷霆。中华社会各界的民众愈是参与到这运动之中，帝国主义就愈早被赶出亚洲，大亚洲的团结也就得到了伸张。”\n\n在演讲末尾处，他还呼吁同文书院中的中国学生要积极参加到反租界运动中去，而其他“同文同种之亚洲友人”在此时机不当冷眼观瞧，应当给予实际的援助。"
  JAP_pnr_foreign_events.11.a: "打倒列强，收回租界！"
  JAP_pnr_foreign_events.11.b: "这真是黄鼠狼给鸡拜年。"
  JAP_pnr_foreign_events.12.t: "各行其是"
  JAP_pnr_foreign_events.12.desc: "看来我们和[ANQ.GetName]之间的小小密约被德国人注意到了，但暴露的方式有些特殊。今天早些时候我们收到了新加坡方面的消息。称他们注意到了近几日我国在华东地区的异常动向，希望我们能尊重过去签署的条约，谨慎地处理对华问题。外务省一开始认为是对[ANQ.GetName]的秘密援助被发现了，后续的短暂交谈证明确实被发现了，但是这只是次要原因，而主要原因则来自[LEP.GetName]中的日本人。根据德国人所言，在$LEP_qi_xieyuan$的参谋部中除了中国人和德国人之外还出现了日本人。\n\n一开始他们对有日本人存在并不惊讶，在使馆城市中存在着各式各样的赋闲军官等待着中国军阀去雇佣。但很快，他们就注意到这位日本人不像是退役军官或大陆浪人，随后的调查显示他是一名关东军参谋，而他千里迢迢前来干涉华东内战的理由居然是——根据随后他在上海日本总领事馆中的说明的情况——他认为帝国如果在华东谋取了新的合作者，便会将在大陆的力量分散而非全部置于满洲，从而导致北方防御的懈怠，威胁到国防。为此必须支援[LEP.GetName]恢复华东的秩序，奠定大陆的稳定。\n\n他在[LEP.GetAdjective]参谋部中的一次失言牵扯出了我们和[ANQ.GetName]之间的小小密约，我们向[ANQ.GetLeader]提供武器和“义勇队”的事情全都暴露出来了。在德国人确认我们卷入其中之后，他们便立刻给我们打电话要求我们作出回应：尊重之前的条约，撤回对[ANQ.GetName]的支持。[GEA.GetLeader]的言辞非常强硬，他称自己已经将情况告知了[64.GetCapitalVictoryPointName]——他很可能是在虚张声势。如果这件事真的被欧洲所知，电话大概率就应该来自柏林而非新加坡，但我们是否要在这件事上压下赌注？"
  JAP_pnr_foreign_events.12.a: "既然如此，停止对[ANQ.GetName]的援助。"
  JAP_pnr_foreign_events.12.b: "让那家伙赶紧回[FNG.GetName]，然后当什么都没发生。"
  JAP_pnr_foreign_events.13.t: "[JAP.GetName]尝试和我们接触"
  JAP_pnr_foreign_events.13.desc: "世界大战结束后[JAP.GetName]就和我国之间维持着极为复杂的关系。在革命刚刚成功时，[JAP.GetName]拒绝承认我们政府的合法性，转而支持他们在协约国的老朋友。但随着时间的推移对方态度有所软化，最终和我们之间形成了一种极为暧昧的外交关系：东京方面依然没有认定我们是[ROOT.GetAdjective]合法政权，但却在我们这里设立了外交办事处，并派出了一般只派驻公使馆的对应驻外武官。\n\n如今[JAP.GetName]似乎想和我们把这种关系更进一步，他们向我们发来一份令人惊讶的提案：鉴于我们和[JAP.GetName]之间有着共同的敌人[GER.GetName]，东京提议两国之间应该戮力同心，一同对抗邪恶的德意志帝国主义者。[JAP.GetName]将公开承认[ROOT.GetName]是唯一合法的政府，以换取和我们之间在各方面更紧密地合作。"
  JAP_pnr_foreign_events.13.a: "为什么不呢？"
  JAP_pnr_foreign_events.13.b: "我们绝不和帝国主义者媾和。"
  JAP_pnr_foreign_events.14.t: "[FROM.GetName]表现积极"
  JAP_pnr_foreign_events.14.desc: "我们从[FROM.GetAdjective]那里收到了积极回复，即便意识形态不同，但对方显然表现出了务实的态度。与之相对的是我们在协约国中的“旧朋友”，[FROM.GetAdjective]伪政权的暴跳如雷。就在我们宣布承认[FROM.GetName]的合法性之后没过多久，这些流亡者就发表了一篇声明来抨击我们的“背叛”，看起来失去我们这件事把他们气得不轻。"
  JAP_pnr_foreign_events.14.a: "这就是国际政治哦。"
  JAP_pnr_foreign_events.15.t: "[FROM.GetName]拒绝了我们"
  JAP_pnr_foreign_events.15.desc: "工团分子果然是一群社会主义意识形态的狂信徒。尽管我们对其晓以政治上的利害，但他们依然拒绝了和我们的潜在合作可能。他们自认为自己有能力在欧洲直面[GER.GetName]并将其击败，让我们为这些“勇士”祝福吧，因为上一次他们这么做的结果是逃到加拿大和非洲，谁知道当工团失败了之后，这些地方又会长出来什么莫名其妙的东西。"
  JAP_pnr_foreign_events.15.a: "很遗憾。"
  JAP_pnr_foreign_events.16.t: "出席瓦隆-蓬达尔克会议？"
  JAP_pnr_foreign_events.16.desc: "黑色星期一爆发之后，新的紧张局势悄然酝酿，[GER.GetNameDef]对欧洲的统治力在急速衰落，更遑论距离柏林更远的亚洲地区了。此前位于世界另一端的[JAP.GetNameDef]曾以积极态度试图增进我们之间的外交关系，现在他们想再进一步——和同为“对抗帝国主义的同志”的我国一同探讨如何对抗[GER.GetAdjective]军队对世界施加的强大影响，并进一步确认两国之间如何实现“亚洲共同利益的伸张和势力范围的划定”，并希望为德国离开亚洲后的世界持久和平奠定基础。毫无疑问，他们想要试探我们对亚洲的整体看法。\n\n对我们来说，亚洲，特别是东亚以及南亚是一片遥远的土地，在彻底解决我们面前的巨大威胁之前，我们确实无法对那里施加太多影响；另一方面，如果我们能够获得[JAP.GetNameDef]在西太平洋的助力，我们就能打击德国人及其盟友的海外资源区，从而反过来对他们的军事工业制造“芜菁之冬”。\n\n[JAP.GetNameDef]自称为了“表示诚意”，也是为了向世界上的第一个西方社会主义政权巴黎公社致以敬意，他们希望能与我国在[FRA.GetAdjective]小镇瓦隆-蓬达尔克进一步讨论相关事宜，商讨东方与西方两位“革命者”之间的关系。在过去，路易十三前去签署《阿莱斯敕令》的路上曾路过该镇，他下令炸断该镇唯一的桥梁以重挫当地的新教徒势力。\n\n毫无疑问，本次秘密谈判将涉及到亚洲诸多国家的命运，我们虽然与[JAP.GetNameDef]有着共同的敌人，[GER.GetNameDef]，但我们之间的冲突也是显而易见的。[JAP.GetNameDef]虽然自称为与帝国主义作斗争的斗士，但实际上他们不过是借着驱赶帝国主义之名来扩张其霸权的另一个压迫者罢了。他们必然是我们的敌人，并且可能是最卑劣的敌人。尽管现在暂时不必考虑和他们之间的冲突，但终有一日，为了实现真正的世界革命，我们将在正面战场上相见。"
  JAP_pnr_foreign_events.16.a: "我们听听他们想说什么。"
  JAP_pnr_foreign_events.16.b: "挥舞自由大旗的帝国主义者让我恶心。"
  JAP_pnr_foreign_events.17.t: "[From.GetName]将出席瓦隆-蓬达尔克会议"
  JAP_pnr_foreign_events.17.desc: "在我们向其表达了进一步合作的意愿之后，[From.GetName]告知我国他们将派出代表参加本次会议。不出意外的话，这些赤匪心中肯定怀有疑问和不满，但既然他们已经决定出席了，那就意味着我们之间或许可以通过谈话来达成某些利益的确认。"
  JAP_pnr_foreign_events.17.a: "Bienvenue, camarade!（欢迎你，同志！）"
  JAP_pnr_foreign_events.18.t: "[From.GetName]拒绝出席瓦隆-蓬达尔克会议"
  JAP_pnr_foreign_events.18.desc: "[From.GetName]近日向我们派驻其国家的武官和外交人员转达了他们的意见，在审慎考虑之后，他们认为此时和我们合作并非一个好选择，因此拒绝出席瓦隆-蓬达尔克会议。简单来说，[From.GetName]认为我们只是想取代[GER.GetNameDef]成为亚洲的区域性霸权，而非真心实意地想要消灭帝国主义。"
  JAP_pnr_foreign_events.18.a: "八嘎！竟敢侮辱大东亚圣战！"
  JAP_pnr_foreign_events.19.t: "第一天：印度半岛问题"
  JAP_pnr_foreign_events.19.desc: "会议第一天的核心聚焦在印度次大陆，根据霞关官僚们的意见，想要说服这些赤匪支持我们在亚洲的行动极为困难，因此我们将把谈判的重心放在“不支持我们的敌人”之上。为此就要提出有诱惑力的提案，并以此作为交换换取我们在最后抛出来的要求的实现。如今在印度次大陆上有三个政权都生成自己对整个印度次大陆有着合法的宣称，其中工团主义者们支持的政权是[HND.GetName]，而和我们之间维持着不温不火的外交关系的政权则是[PRF.GetName]。\n\n现在的问题在于，我们是否要以印度问题作为诱饵迫使这些工团暴徒们咬钩？承诺支持[HND.GetName]对整个印度的合法宣称并为其提供武器援助是个不错的筹码，但这无疑会在印度统一之后将其白白送给红色阵营。而且[HND.GetName]也是次大陆上最为好斗的势力，假如未来我们在南亚扩张势力范围，可能会与其产生不必要的摩擦……"
  JAP_pnr_foreign_events.19.a: "我们将支持[HND.GetName]的民族解放运动。"
  JAP_pnr_foreign_events.19.b: "我们呼吁密切关注印度次大陆的紧张局势。"
  JAP_pnr_foreign_events.20.t: "第二天：亚洲去殖民化"
  JAP_pnr_foreign_events.20.desc: "会议第二天的议题聚焦在更广泛的亚洲去殖民化问题上，对方向我们提出了一个要求，即如果我们成功将[GEA.GetNameDef]消灭，随后我们应当以独立国家的形式促使所有大陆上原本的德国殖民地建立各自的政权。作为交换，他们会支持我们对西太平洋岛屿的正当利益。在会议中还特别谈到了印度尼西亚，对方措辞强硬，要求我们在战后和他们一起共同确保印度尼西亚的完全独立。他们显然基于在亚洲建立缓冲地带的目的而提出了这些要求，但贸然答应这些要求显然意味着我们无法轻易将这些国家纳入我们的势力范围，而那些丰富的自然资源也不能被我国独享。"
  JAP_pnr_foreign_events.20.a: "就按他们的想法来。"
  JAP_pnr_foreign_events.20.b: "我想这一点还是不能接受。"
  JAP_pnr_foreign_events.21.t: "硝烟散去……"
  JAP_pnr_foreign_events.21.desc: "混战业已结束，华东试图砸碎束缚于身上的欧洲帝国主义锁链，如今他以全新的身体站立在了这片内战之后满目疮痍的土地之上。那些不惧死亡的中华儿女们在战争中前赴后继，噙着泪水同室操戈，挺身对抗自己的昔日同胞。这种“大义灭亲”之举，若不是有着极坚决的信心又怎么能作出？单凭这一点，就足够称他们为中国解放的脊梁，亚洲解放的先锋。或许在某个深夜，哥哥将为弟弟祈福，儿子将无言地安葬自己父亲的尸体。如今这副活地狱的景象，其全应怪罪于潜藏在背后的德意志帝国主义。"
  JAP_pnr_foreign_events.21a.desc: "$JAP_pnr_foreign_events.21.desc$\n\n然而痛苦终将结束，穿过泪水，悲哀得以抚平，失去一切的他们终于赢得了配得上自己的报酬：自由。今天早上，[JAP.GetName]已向[ANQ.GetName]致以慰问，并提供了五十万日元的战后援助资金。此外在靖亚神社宫司村上德太郎的斡旋之下，这座位于[LEC.GetName]的上海法华区的神社于今天举行了盛大的临时合祀祭，将在华东混战中战死的各士兵迎入神社，供奉在殿中。靖亚神社先前以近卫笃麿、荒尾精和根津一为主神，同时供奉其他东亚同文书院相关人士和校友，此次大规模地将中国士兵纳入合祀堪称是史上第一次。"
  JAP_pnr_foreign_events.21b.desc: "$JAP_pnr_foreign_events.21.desc$\n\n即便是付出了这样惨痛的代价，华东的命运却依然悬而未决。[SHD.GetLeader]在这场中国人民为争取自由的残酷内战的最后出现，窃取了万千群众的胜利果实，将整片华东收入囊中。有传言称[SHD.GetLeader]残忍无道，行事暴虐，其恶劣程度胜过中国其他军阀数百倍。这不由得让人为华东人民捏一把汗，他们刚刚从自相残杀的地狱中走出来，如今又落入了活阎王的魔掌。但终有一日，他们将会得到他们的解放，因为他们为此曾奋斗过，证明过自己的决心。"
  JAP_pnr_foreign_events.21c.desc: "$JAP_pnr_foreign_events.21.desc$\n\n[LEP.GetLeader]，这个德意志帝国主义的代理人就这样狞笑着站在尸骨堆上，心中满是对自己柏林主子接下来赏赐的美好畅想。他的土匪军队如今再一次宣誓了自己对华东地区的掌控权，工厂开始重新运转，饥饿的人们戴着镣铐夜以继日地工作，只为德意志帝国主义者在柏林的皇宫中能用上一块名贵的地砖。在[LEP.GetLeader]的高压统治之下，这场现世地狱剧也必然将持续下去，直至他们再掀起一次反抗，直至有人听到他们的呼声，救他们脱离那地狱。"
  JAP_pnr_foreign_events.21d.desc: "$JAP_pnr_foreign_events.21.desc$\n\n这些勇敢的中国人，亚洲解放的寻求者终于击败了德意志帝国主义的走狗，就在他们庆祝胜利之时，改头换面的军阀强人，温情脉脉的伪基督来了：[CHI.GetName]以革命之名诓骗大众，以残暴手段摧毁真正爱国者们的反租界运动。看看他的背后吧！在[CHI.GetLeader]的背后，不是有好几位红色暴君的手吗？"
  JAP_pnr_foreign_events.21.a: "愿逝者安息。"
  JAP_pnr_foreign_events.21.b: "令人反胃。"
  JAP_pnr_foreign_events.21.c: "[GER.GetNameDef]有这么强大吗？"
  JAP_pnr_foreign_events.22.t: "第三天：大陆打通作战"
  JAP_pnr_foreign_events.22.desc: "会议的第三天便是重头戏，这也是我们邀请这些赤匪坐下来聊聊的真正原因：大陆打通作战。毫无疑问，[GER.GetName]已经是我们完全的敌人了，但第三国际的这些工团主义者不同，他们还可以被“争取”以实现我们在亚洲的战略目标。现在的问题在于，假如未来我们和中华各势力之间的冲突到了非要通过战争便无法解决的情况时，我们必须确保他们的战斗力足够弱小，以免陷入战争的泥潭。为此我们需要这些家伙承诺，他们至少不会在我们和军阀们交战以最终攻击到[GER.GetNameDef]在亚洲的堡垒的时候，跑去给这些军阀提供军事援助或别的什么东西，阻碍我们的大陆打通作战。"
  JAP_pnr_foreign_events.22.a: "不要阻碍大陆打通作战。"
  JAP_pnr_foreign_events.22.b: "如果战争开始，希望你们能发动禁运。"
  JAP_pnr_foreign_events.23.t: "[JAP.GetName]在会议上的要求"
  valon_pon_darc_text_1: "他们支持[HND.GetName]对整个印度次大陆合理的主权声索，并许诺将在印度统一战争开始后援助[HND.GetName]"
  valon_pon_darc_text_2: "他们并不支持[HND.GetName]对整个印度次大陆的合理宣称，而是支持他们可疑的同伴[PRF.GetName]，一个印度封建制度的活化石，这意味着他们想要掐灭一个人口大国中兴起的工团思潮"
  valon_pon_darc_text_3: "他们肯定了我们提出的亚洲去殖民化构想，承诺将在驱逐[GER.GetName]之后和我们共同确保亚洲各国的独立"
  valon_pon_darc_text_4: "他们对我们提出的亚洲去殖民化构想表现平淡，至于我们提出的在[GEA.GetName]被粉碎，新加坡得到解放之后共同保障那些前殖民地的完全独立这一点则没有给出明确支持的回答"
  valon_pon_darc_text_5: "他们希望在他们与[GEA.GetName]发生冲突后，至少不要对他们的作战造成任何阻碍，这意味着要我们抛弃我们在东亚地区的盟友"
  valon_pon_darc_text_6: "他们希望在他们与[GEA.GetName]发生冲突后，禁运所有可能阻碍他们实现对抗德国人目标的国家，这意味着我们不仅要抛弃我们在东亚地区的盟友，更将致许多饱受战争摧残的人于不顾"
  JAP_pnr_foreign_events.23.desc: "近三日的会议下来，[JAP.GetNameDef]的诉求已经很明了了：首先，[valon_pon_darc_day_1_text]。其次，[valon_pon_darc_day_2_text]。最后，[valon_pon_darc_day_3_text]。我们是否要答应他们的要求？"
  JAP_pnr_foreign_events.23.a: "这似乎可以接受。"
  JAP_pnr_foreign_events.23.b: "他们似乎没睡醒。"
  JAP_pnr_foreign_events.24.t: "瓦隆-蓬达尔克会议成功"
  JAP_pnr_foreign_events.24.desc: "握手，签字，然后密约被小心地装进了信封里封好。[FROM.GetName]对我们之间的密约非常满意，不会有人知道今天在[FRA.GetAdjective]的某个小镇子上，几个世界大国就这样决定了亚洲的命运。人们将对此守口如瓶，直到事情发生的那一天才为人所知。"
  JAP_pnr_foreign_events.24.a: "他们会遵守密约吧。"
  JAP_pnr_foreign_events.25.t: "瓦隆-蓬达尔克会议失败"
  JAP_pnr_foreign_events.25.desc: "瓦隆-蓬达尔克会议最终不欢而散，[FROM.GetName]斥责我们的要求是“赤裸裸的侵略”，并且希望将他们变成同谋的凶手，随后他们他们头也不回地离开了会议现场。无论如何这指责都太过无礼了，我国已通过外交人员对此事进行了抗议。在[FRA.GetName]和赤匪共同度过了三天时间，如今看来真是白白浪费了。"
  JAP_pnr_foreign_events.25.a: "令人失望。"
  JAP_pnr_foreign_events.26.t: "泛亚主义高歌猛进"
  JAP_pnr_foreign_events.26.desc: "[ROOT.GetFactionName]内部团结一心，彼此之间取长补短，紧密合作。在最近的一次财务清算后，兴亚共荣院宣布他们获得了一部分额外资金可用于进一步促进我们对各盟国的投资，从而实现泛亚细亚的共同繁荣。"
  JAP_pnr_foreign_events.26.a: "好极了！"
  JAP_pnr_foreign_events.28.t: "[FROM.GetName]向我们提供军事援助"
  JAP_pnr_foreign_events.28.desc: "当我们深陷战争的泥淖中时，[FROM.GetNameDef]突然和我方接触，他们称愿意为我们提供一支经验丰富的军事顾问团，来到我们的军队中间担任教官。他们称将按照[FROM.GetNameDef]风格帮助我们训练我们的军队，以确保我们在和对方的战争中占尽先机。"
  JAP_pnr_foreign_events.28.a: "我们肯定接受。"
  JAP_pnr_foreign_events.28.b: "恶魔的低语声。"
  JAP_pnr_foreign_events.29.t: "丛林中的日本人"
  JAP_pnr_foreign_events.29.desc: "傻逼日本人又来给我们创造困难了，[INC.GetName]不过是一群暴民建立的非法武装据点，却在几天之内迅速席卷了整个中南半岛。首先这不会是我们军队的责任，调查也发现并不是我们军队的主要责任。我们的潜伏人员向我们传回的情报显示，[JAP.GetNameDef]虽然在明面上禁止其本国人员前往[INC.GetNameDef]，背地里却通过[PHI.GetNameDef]和我们玩障眼法。\n\n[JAP.GetAdjective]军事人员以个人名义前往达沃，然后再从达沃乘船前往西贡向[INC.GetNameDef]提供各种军事援助。从军事训练到各种军火支援真是不一而足。而之前我们的一些士兵报告说曾在交战时听到对方说日语，如今看来也并非是被害妄想症，或许[JAP.GetAdjective]志愿军已经和我们交火过好几轮了。我们应该义正言辞地批评[JAP.GetAdjective]政府这种干涉我国内政的可耻行为，让他们为此付出代价。"
  JAP_pnr_foreign_events.29.a: "立刻给东京打电话！
  JAP_pnr_foreign_events.30.t: "反制[JAP.GetNameDef]？"
  JAP_pnr_foreign_events.30.desc: "[JAP.GetNameDef]自1936年以来进行的每一项外交行动都在试图破坏[GER.GetNameDef]在亚洲地区的利益，显然他们试图接替因经济危机而陷入混乱的[64.GetCapitalVictoryPointName]，成为亚洲利益的主导者。虽然某种意义上讲，[GEA.GetNameDef]只是个大监狱，一个用来把在[64.GetCapitalVictoryPointName]毫无用处的军人放逐到丛林和痢疾杆菌之中的牢笼。但作为忠诚的[GER.GetAdjective]军人，我们绝不能放任[JAP.GetNameDef]在亚洲的扩张不管。\n\n[64.GetCapitalVictoryPointName]的对日政策目前相当暧昧，在解决掉家门口的工团匪徒和俄罗斯复仇者之前，[GER.GetSecondInCommand]恐怕无暇顾及亚洲，不过这也意味着目前亚洲政策由我们全权代理。现在摆在[GEA.GetLeader]面前的方案有两个，并且非常经典地可以分为温和方案和激进方案：温和派认为我们应该秉持一贯的克制，通过对话来解决和[JAP.GetNameDef]之间的紧张关系，并寄希望于我们严厉的外交辞令能够迫使他们收手；激进派的方案是我们直接和[DEI.GetName]合作，携手对经马六甲海峡前往日本的船只进行限制，迫使他们发表不干涉声明，但此举可能适得其反，并彻底摧毁[GER.GetNameDef]和[JAP.GetNameDef]之间的关系。当然还有第三个选项，那就是召集办公厅的大家一起办一场野外烧烤，彻底忘掉该死的[JAP.GetNameDef]和这些国际关系问题。"
  JAP_pnr_foreign_events.30.a: "让他们知道谁是世界霸主。"
  JAP_pnr_foreign_events.30.b: "无谓引发冲突非常不明智。"
  JAP_pnr_foreign_events.30.c: "忘了这件事吧，和我们没关系。"
  JAP_pnr_foreign_events.31.t: "[GEA.GetNameDef]要求我们尊重上海会议结果"
  JAP_pnr_foreign_events.31.desc: "从[GEA.Capital.GetCapitalVictoryPointName]传来了一封电报，电报内容开头是常见的[GER.GetAdjective]废话，大谈特谈了[GER.GetNameDef]在亚洲的正当权益和维护亚洲和平的理想。而第二部分才是重点：[GEA.GetNameDef]对我们近期频繁开展的，对亚洲各势力之间发生的冲突的支援颇有微词，他们认为我们在试图破坏亚洲的和平与稳定，并要求我们尊重1928年在上海会议上达成的数项共识，许诺今后不会再插手任何除当初规定的我国势力范围（即朝鲜半岛和[FNG.GetNameDef]）之外的亚洲冲突，虽然外交言辞铿锵有力，从“帝国之荣耀”到“虽远必诛”，但如今[64.GetCapitalVictoryPointName]在欧洲大陆遭到包围自顾不暇，想必也无法抽出手来真正对亚洲施加影响。如果我们就此接受的话想必会相安无事，但即便无视他们，估计[GEA.GetNameDef]也不敢做多过分的事情。"
  JAP_pnr_foreign_events.31.a: "还是听他们的话吧。"
  JAP_pnr_foreign_events.31.b: "虚张声势有什么好怕的。"
  JAP_pnr_foreign_events.31_tt: "§a£GFX_decision_icon_small §Y$JAP_pnr_kasumigaseki_diplomacy_category$§!决议组将不会再追加额外决议，你仍可以通过派遣志愿军来支援他们。§!"
  JAP_pnr_foreign_events.32.t: "[JAP.GetNameDef]拒绝了我们"
  JAP_pnr_foreign_events.32.desc: "温和派的计划失败了，[JAP.GetNameDef]告知我们他们不会屈服于[GER.GetAdjective]帝国主义者。现在摆在我们面前的选择只有激进派的方法，或者是彻底忘掉这件事，带着办公室里的所有人去度假了。"
  JAP_pnr_foreign_events.32.a: "那就联系[DEI.GetNameDef]。"
  JAP_pnr_foreign_events.32.b: "有谁的年假还没用完吗？"
  JAP_pnr_foreign_events.33.t: "马六甲海峡危机"
  JAP_pnr_foreign_events.33.desc: "[GEA.Capital.GetCapitalVictoryPointName]传来消息，由于[JAP.GetNameDef]在黑色星期一之后频繁干涉亚洲各国的国内冲突，试图在亚洲扩张利益，违背1928年上海会议达成的多项共识，[GEA.GetNameDef]正式告知我们从即日起对马六甲海峡进行有限度的“隔离”，禁止[JAP.GetAdjective]商船和目的地为[JAP.GetNameDef]，运送战略物资的船只通过马六甲海峡，这项决定是由[GEA.GetNameDef]联合[DEI.GetNameDef]共同作出的。在此期间，相关船只可绕行更南方的巽他海峡和龙目海峡。\n\n如果[JAP.GetNameDef]能够发表一份声明，承诺停止其对不属于自己势力范围，即除[FNG.GetNameDef]和朝鲜半岛外的亚洲地区的干涉，[GEA.GetNameDef]将考虑解除对马六甲海峡的暂时隔离政策。电报中还提到，必要时[GEA.GetNameDef]将为了确保“在亚洲的[GER.GetAdjective]正当利益”而向[JAP.GetNameDef]宣战。"
  JAP_pnr_foreign_events.33.a: "[GER.GetAdjective]帝国主义者！"
  JAP_pnr_foreign_events.34.t: "危机财"
  JAP_pnr_foreign_events.34.desc: "[JAP.GetAdjective]商船已被禁止通过马六甲海峡，如今[JAP.GetNameDef]肯定急得发疯。虽然[DEI.GetNameDef]也参与了这场封锁，但[DEI.GetLeader]心里有另一副算盘，就让德国人和日本人互殴去吧。\n\n如今大量的[JAP.GetNameDef]商船和需要与[JAP.GetNameDef]进行贸易的商船都为了规避风险而纷纷绕行巽他海峡，更有甚者甚至选择了已经常年赤字的龙目海峡前往[JAP.GetNameDef]。要知道，马六甲海峡实际上由[DEI.GetNameDef]和[GEA.GetNameDef]各控制一半，所以就算是其中的利润[DEI.GetNameDef]也只能得到一半。而现在，至少[JAP.GetAdjective]商船的过境费用已经全数落入了自己的腰包中。\n\n另有一件事就是战略资源价格，在此危机期间，[JAP.GetNameDef]的进口资源肯定会受到打击，而价格也肯定上涨，而作为[JAP.GetNameDef]长期以来的优质石油燃料供应商，我们也可以借此机会和他们达成一笔“优惠”的交易……"
  JAP_pnr_foreign_events.34.a: "落袋为安，就不希求更多了。"
  JAP_pnr_foreign_events.34.b: "问问他们对石油是否有兴趣。"
  JAP_pnr_foreign_events.35.t: "[DEI.GetNameDef]和我们私下接触"
  JAP_pnr_foreign_events.35.desc: "尽管[DEI.GetNameDef]也参与了对马六甲海峡的封锁，但他们显然和[GEA.GetNameDef]有着不同的介入动机。稍早些时候，[DEI.Capital.GetCapitalVictoryPointName]联系我们，称希望和我们谈谈巽他海峡的过境费问题。他们称如果我们愿意和他们达成长期的合作关系的话，在巽他海峡的过境费上可以给我们优惠。此外，他们还希望和我们进一步深化之前签订的石油贸易协定，以稍稍高于当时协议价的价格提供更多石油——看来我们的这位对手只是想从这场危机中为自己多捞点好处，如果借此机会加强和[DEI.GetNameDef]的合作的话或许有助于我们打破当前的外交僵局，毕竟如果他们的目的达到了的话，这个虚情假意的“禁运联盟”恐怕很快就会瓦解。"
  JAP_pnr_foreign_events.35.a: "我们当然乐于和你做生意。"
  JAP_pnr_foreign_events.35.b: "趁人之危？没门！"
  JAP_pnr_foreign_events.36.t: "马六甲海峡危机结束：[JAP.GetNameDef]屈服"
  JAP_pnr_foreign_events.36.desc: "本周早些时候，[JAP.GetAdjective]政府发表了公开声明，声明中谈到了几个月前爆发的因[GER.GetAdjective]政府不满[JAP.Capital.GetCapitalVictoryPointName]逐渐转变的对大陆方针而采取的反制措施。[JAP.GetNameDef]称[JAP.Capital.GetCapitalVictoryPointName]不希望破坏亚洲和平，先前所采取的一切行为皆是为了促使亚洲之混乱尽快平息而作出的决定。[JAP.GetNameDef]非常乐于与[GEA.GetNameDef]合作共同确保整个亚洲地区的长久稳定，同时也尊重1928年上海会议时所确定下来的德日之间的利益范围划分与当时达成的多项共识。\n\n[JAP.GetNameDef]虽然并未承认自己在此次危机中的失败，但事实证明他们确实屈服于了[GEA.GetNameDef]和他背后的[GER.Capital.GetCapitalVictoryPointName]的压力，无论如何，[JAP.GetNameDef]都已宣布未来将停止更广泛的亚洲干涉。就目前来看，德日在亚洲的紧张关系似乎得到暂时性的缓和，而亚洲也避免了一场提前爆发的大战。"
  JAP_pnr_foreign_events.36.a: "结果还可以。"
  JAP_pnr_foreign_events.37.t: "马六甲海峡危机结束：同盟背叛"
  JAP_pnr_foreign_events.37.desc: "令人震惊的消息传来！今天凌晨时分，[GEA.GetLeader]收到通知，多艘悬挂有[JAP.GetAdjective]国旗的商船成功通过了马六甲海峡，而原因并非是负责进行封锁的[GEA.GetAdjective]海军行动不力——事实上，这些商船是从[DEI.GetNameDef]控制的一侧通过的。\n\n[DEI.GetLeader]放出消息，称他在经过谨慎思考之后，决定向[HOL.GetLeader]呈递相关情况说明。简单来说，他们先前配合[GEA.GetNameDef]一同封锁马六甲海峡的行为事实上并没有得到[HOL.Capital.GetCapitalVictoryPointName]方面的批准，危机爆发后，女王震惊于该事态，因此责令[DEI.GetLeader]详细汇报具体情况。\n\n事实上[HOL.Capital.GetCapitalVictoryPointName]并不愿与[GEA.Capital.GetCapitalVictoryPointName]站在一起，他们很快就解除了靠近他们一侧的海峡的控制。这场海峡危机就这样以最荒诞的形式结束了，[GEA.GetNameDef]所做的一切都化作了徒劳。\n\n此外有消息称，[DEI.GetLeader]和[JAP.GetLeader]达成了某种密约，该约定促使[DEI.GetNameDef]可以从中收获更多利润，利益，或许这就是这个寿命短暂的“禁运同盟”瓦解的原因。"
  JAP_pnr_foreign_events.37.a: "哈哈哈哈哈。"
  JAP_pnr_foreign_events.38.t: "马六甲海峡危机结束：时间抚平一切"
  JAP_pnr_foreign_events.38.desc: "今天上午，[GEA.GetLeader]正式宣布持续了数月的马六甲海峡“隔离行动”正式结束，现在所有商船都可正常通过海峡。\n\n此次针对[JAP.GetNameDef]的反制行动的结束源于[GER.Capital.GetCapitalVictoryPointName]的强烈要求，事实上，一开始[GER.GetSecondInCommand]对亚洲发生了什么了解得并不清楚，只是本着遵循世界政策（Weltpolitik）的原则放任[GEA.GetNameDef]在亚洲对试图挑战他们的[JAP.GetNameDef]施加强大压力。然而在几个月后殖民办公厅提交的季度收入报表却震惊了[GER.Capital.GetCapitalVictoryPointName]，由于在马六甲海峡施行行动，[GEA.GetNameDef]的支出出现了极为异常的升高，与之相对的是，不仅是前往[JAP.GetNameDef]的商船选择绕行马六甲海峡，许多担心局势升级的他国商船也决定规划绕行至巽他海峡的路线，穿过[DEI.GetNameDef]前往目的地。\n\n简单来说，正在试图走出经济危机的[GER.GetNameDef]无法接受海外利益就这样白白损失，甚至对他们来说只是伤害了自己，便宜了[HOL.GetNameDef]的情况发生。[GER.Capital.GetCapitalVictoryPointName]已勒令[GEA.GetLeader]立刻停止对[JAP.GetNameDef]的敌对行动，重新开放马六甲海峡。德日在亚洲的紧张状态就这样得到了缓解，但在表面的关系舒缓之下，两国之间破碎的互信关系却也再也无法修复，一种更深层次的寒意必将继续搅动整个亚洲。"
  JAP_pnr_foreign_events.38.a: "好运青睐坚持到底的人。"
  JAP_pnr_foreign_events.39.t: "危机陷入僵局"
  JAP_pnr_foreign_events.39.desc: "自[GEA.GetNameDef]对我们施加贸易禁运已经过去快一个月了，现在整个危机状态似乎陷入了停滞。与现在的德-日僵局对应的是我们日益减少的战略资源储备，由于马六甲海峡遭到封锁，大量从日本出发或到达日本，需要途径马六甲海峡的客轮都已经取消，而货船们则都不得不绕行位于[DEI.GetName]控制下的另两座海峡，这导致了轮船运输费的增加与随之而来的战略资源价格的提高。\n\n尽管现状不容乐观，但我们还能坚持。如果我们始终保持这种拒绝向[GEA.GetNameDef]低头的态度，或许我们就能拖到事情出现转机的时候——大藏省的官僚们相信，海峡危机本身对[GEA.GetNameDef]的收入造成了不可小觑的打击，等到[64.GetCapitalVictoryPointName]意识到封锁[JAP.GetNameDef]对于他们从黑色星期一中恢复有百害而无一利的时候，危机结束的机会就会出现。当然，一些政府内官僚也呼吁在该问题上让步，因为战略资源价格的提高显然无益于作为岛国的我们的各项产业的平稳发展。"
  JAP_pnr_foreign_events.39.a: "别理他们，展现决心。"
  JAP_pnr_foreign_events.39.b: "要不还是妥协吧。"
  JAP_pnr_foreign_events.40.t: "和[JAP.GetNameDef]讲和？"
  JAP_pnr_foreign_events.40.desc: "[JAP.Capital.GetCapitalVictoryPointName]近日知会我们，称他们希望缓和与我们之间的关系。[JAP.GetNameDef]愿发表不再涉入各类亚洲冲突的正式声明，以换取我们对他们重新开放马六甲海峡。如今看来，[JAP.GetNameDef]也没什么大不了的，我们只需要关闭马六甲海峡便能轻松扼住他们的咽喉，从而令他们屈服在[GER.GetNameDef]面前。通过这次行动，我们成功捍卫了帝国在亚洲的正当利益。"
  JAP_pnr_foreign_events.40.a: "好极了！"
  JAP_pnr_foreign_events.1001.t: "[ANQ.GetName]接受了我们的帮助"
  JAP_pnr_foreign_events.1001.desc: "末永节给我们带回来了好消息。尽管[ANQ.GetLeader]自诩为反租界势力的庇护者与代言人，但在长久思考，明智地权衡利弊之后，[ANQ.GetLeader]最终决定和我们达成合作协议，接受我们的帮助。[ANQ.GetLeader]顾虑到自己的身份，因此和我们订立了秘密性质的协议。东京政府将通过[LEC.GetName]为其运送物资，支持其对华东地区的正当控制权；而[ANQ.GetLeader]将继续在明面上作为反租界运动的军事与政治领袖带领中国人民摆脱德帝国主义的压迫。"
  JAP_pnr_foreign_events.1001.a: "那么合作愉快。"
  JAP_pnr_foreign_events.1002.t: "[ANQ.GetName]拒绝了我们的帮助"
  JAP_pnr_foreign_events.1001.tt: "§a由于我们争取到[ANQ.GetName]的更进一步好感，这使得我们能在华东提前建立§Y利益§!。§!"
  JAP_pnr_foreign_events.1002.desc: "末永节回电。[ANQ.GetLeader]身为反租界运动的旗手并非如我们所想的那样是个用大旗遮盖个人野心的寻常军阀，面对我们提出的合作邀请，[ANQ.GetLeader]严厉地斥责了末永节和东京，无情地拒绝了我们好意。[ANQ.GetLeader]甚至还拿出当年段祺瑞的事件污蔑我们，要求我们为当年旧皖系的灭亡负责。谈判已经破裂，其中再无任何斡旋余地。"
  JAP_pnr_foreign_events.1002.a: "竖子不足与谋。"
  JAP_pnr_foreign_events.1002.tt: "§a由于我们没有争取到[ANQ.GetName]的更进一步好感，这使得我们无法在华东提前建立§Y利益§!。§!"
  JAP_pnr_lategame.1.t: "Commerce/Continuance/Consequence"
  JAP_pnr_lategame.1.desc: "她舔了舔那杯浓浓的棕黑色的液体，又烫又苦的感觉没法下口，所以她又把杯子放了回去，转过来端详这只瓷杯。通体白色的瓷杯杯沿有一圈恰到好处的铜色点缀，放在金、青、白三色交织的碟子上，符合她想象中的欧洲贵族所用的餐具，而这样漂亮的杯子如今就在她的手边。\n\n“我家的咖啡是不是有点苦，”咖啡店主人的声音从柜台那边传来，“不知道你能不能适应。”“很好喝，真的很好喝，味道很不错。”她立刻回应道，然后转过身去看着那位店主，这条街道上的新来客，他有着奇怪的眉毛，几乎要膨大到和额头一般高了，“下次请一定要来我家店里，要知道我家的御手洗团子，从昭和二年到现在都一直是畅销品哦。不论如何，大家都是做小买卖的，世道艰难啊。”说这话的时候，她还是在仔细看着那个男人的脸，她听说过传闻了。\n\n他杀过人。但果真，从脸还是看不出杀人者和不杀人者之间的区别的。\n\n“我听警署的人说，你杀过人对吗？”唉，她还是鼓起勇气问出口了，只是一说出口就后悔了。这下肯定要让对方感到不自在。“是的，中国战争的时候，我在大陆杀过人。不是军人，是平民。”对方笑了一下，似乎并不怎么在意。轻描淡写地承认了这件事之后，就继续在那里研究咖啡豆子。\n\n虽然明知道这些问题可能会引起对方的不满，但她还是这样问了：“你杀掉的人是什么样的？杀人的时候的感觉，是怎样的？”\n\n“是女人，一直在哭的女人，”男人停下了手里混合咖啡豆的动作，反过来盯着她，“因为她一直在哭，战壕里的大家都很烦躁，所以大家就冲出去把她杀了，把抱着不知道谁尸体的她杀了，然后世界都安静下来了。我想如果不杀人的话，不在那种环境下杀掉一个没有抵抗能力的女人的话，是不能理解这种感觉的。”\n\n果然触霉头了，她尴尬地转过身去，急中生智地试图把这个话题带过去：\n\n“你想听听我的故事吗？”她趴在桌子上，眼睛半掩着望向那只白瓷杯。"
  JAP_pnr_lategame.1.a: "“我们家啊，黑色星期一的时候遭了很大的问题呢……”"
  JAP_pnr_lategame.1.b: "“结果我实在没忍住，在床上就给了‘客人’一拳……”"
  JAP_pnr_lategame.1.c: "“感觉我是个一事无成的家伙，最后连这种事都失败了……”"


