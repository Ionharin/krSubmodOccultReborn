  JAP_pnr_con.8.a: "此乃久远的参拜之道。"
  JAP_pnr_515_parliament_support_tt: "对于我们当前的法案，议会的意见是：[JAP.GetJAPPNRParliamentSupportStatus]"
  JAP_pnr_515_parliament_giveup_tt: "§c我们将放弃当前法条的§Y增益效果§!以在议会中换取对法案的支持。§!"
  JAP_pnr_parliament_support_var_tt: "§a议会对§Y$JAP_pnr_NSA_idea$§!的意见将变化：§R$RIGHT|0$§!§!"
  JAP_pnr_parliament_support_status_unwelcome: "§R极不欢迎（[?JAP_pnr_parliament_support_var|0]）§!"
  JAP_pnr_parliament_support_status_contested: "§P难分伯仲（[?JAP_pnr_parliament_support_var|0]）§!"
  JAP_pnr_parliament_support_status_safe: "§G通过无虞（[?JAP_pnr_parliament_support_var|0]）§!"
  JAP_pnr_515.1.t: "帝国议会临时会召开"
  JAP_pnr_515.1.desc: "针对《国家保安法》的前期磋商简直是灾难，拜草案泄露事件所赐，[JAP.GetRulingParty]在舆论中的形象已经低到了极点。尽管有斋藤实内大臣从中斡旋，但其它在野党派的领袖还是值此机会向我们提出了各种难以接受的政治让步。今天就是帝国议会临时会议召开的日子，根据[JAP.GetAdjective]宪法第三十九条，法律案一旦在贵族院或众议院遭到否决，同一会期中便不得再次提出在会期中经表决未通过的法案。\n\n贵族院方面并不是问题，只要《国家保安法》能在众议院通过，[JAP.GetRulingParty]就有办法取得最终的胜利。[JAP.GetLeader]和他的内阁成员都严阵以待，接下来他们要面对的是一场恶战，《国家保安法》只能成功，否则本届内阁的政治生命就要到此为止了。甚至可能会作为一事无成的失败者，在[JAP.GetAdjective]历史书中变成“黑色星期一内阁”、“$JAP_pnr_inukai_tsuyoshi$遭害内阁”。\n\n为了避免最坏的情况，[JAP.GetLeader]将在议会之中寻求强硬与妥协的中间值，从而令《国家保安法》通过，[JAP.GetRulingParty]也考虑过在必要时刻以“解散众议院”为压力迫使议员们屈服。但这完全依赖于[JAP.GetLeader]当时所面对的状况以及其自己的感觉。唯一能确定的是，一味地妥协只会造就一部毫无价值，什么也没改变的法案；而一味地强硬或许并不能令议员们畏惧，反而会令他们坚定与本届内阁斗争的决心。"
  JAP_pnr_515.1.a: "“朕兹行帝国议会开院之式，告贵族院及众议院各员。”"
  JAP_pnr_515.1.b: "“近期东京之事件令朕深感遗憾……”"
  JAP_pnr_515_introduction_tt: "在《国家保安法》草案审议期间，我们将收到一系列事件。根据这些事件，我们能作出三种不同的抉择：§r强硬§!、§c妥协§!以及§l威胁§!。\n\n维持§r强硬§!将使对应的法条必定保留在草案之中，但可能会令议员们不满，使得他们更不易赞同该草案。\n\n选择§c妥协§!则会用妥协法条替换对应的法条，这将使议员们更可能赞同该法案。\n\n我们的最终底牌是§N奏请解散议会§!，如果我们认为事态无法控制，或只是想迫使在野党让步，我们可以以§N解散众议院§!为撒手锏令他们屈服，但或许他们不会惧怕我们的§l威胁§!。如果在野党挑战我们的§l威胁§!而我们并未真正行动的话，那我们一定会成为§n议会中的笑柄§!。\n\n§t小心行事，[JAP.GetLeader]首相。§!"
  JAP_pnr_515.2.t: "交锋：裁判思想"
  JAP_pnr_515.2.desc: "针对我们《国家保安法》中“取缔秘密结社”一项的法条，率先发起攻击的是社会大众党的河上丈太郎。此人乃是社会大众党保守派阵营中的一员，是个标准的基督教社会主义者，其发言带有强烈的基督教人道主义也在意料之中。\n\n河上丈太郎指出《国家保安法》的“取缔秘密结社”实际管束范围过宽，从暴力行为到单纯的思想犯罪都被囊括其中。他主张既然已有刑法可处罚暴动与反乱，《国家保安法》再谈论此毫无意义。随后他又借所谓“法律的本义”来攻击该法条，向议会中其他议员暗示若该法条获得通过，内阁一方面确实能对非法分子施加威慑和惩治，另一方面则能借此打击诸合法政党。河上丈太郎用这种卑劣的手段煽动议员们否决该提案，而我们必须对此立刻作出反击。"
  JAP_pnr_515.2.a: "本法无意妨碍一般政治运动。"
  JAP_pnr_515.2.b: "我想此番言论确有其道理。"
  JAP_pnr_515.2.c: "连此等条款亦不能接受，本内阁只得奏请解散众议院。"
  JAP_pnr_515.3.t: "交锋：谋议"
  JAP_pnr_515.3.desc: "1936年的东京有两个地方最热闹，一个是五月中旬“三社祭”时的浅草一带，另一个就是现在的帝国议会临时议事堂。在对一项无关痛痒的议案进行第一读会后，帝国议会中的各议员再一次对《国家保安法》草案展开了激斗。出身国民同盟的中野正刚抨击该法案中谈到的“预防犯罪”部分有滥权之嫌，在犯罪尚未施行而仅仅处于谋议阶段便可处以五年监禁，这简直就是田中义一的《治安维持法》的回魂。\n\n他认为若放行该法条原样通过的话，将会给予警察对谈话的极大解释权力。此人一向懂得如何利用焦虑，他甚至说在此法案通过以后，帝国议会本身就是[JAP.GetName]最大的犯罪组织，如果有人胆敢对内阁发起攻击，那所有支持该攻击议员恐怕都是“谋议罪”的嫌疑人。中野正刚其人明明是个鼓吹“总体主义”的激进政治家，他平日里的言论和《国家保安法》相比恐怕有过之而无不及，但他今天为了阻挠该法案甚至可耻地提出一个彻头彻尾的滑坡谬误，显然一部分议员出于恐惧相信了他的言辞。"
  JAP_pnr_515.3.a: "既然已有计划，那还能是单纯的“思想”吗？"
  JAP_pnr_515.3.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.3.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.4.t: "交锋：结社"
  JAP_pnr_515.4.desc: "《国家保安法》草案的泄露给我们带来了意外的危机，大宅壮一极力渲染该法案对言论的恐怖钳制，结果在今天被在野党议员用作“民意”来攻击内阁了。位于争论中心的法条是“监视外围组织”，有议员指出该法条涉及到的层级完全不同，混淆了宣传言论和具体的犯罪指令，并担心该法条会进一步加强警察署的权力。\n\n对该法条反对尤为激烈的是社会大众党的铃木文治，他在质询时言辞激烈，认为所谓的外围组织就像剥洋葱一样，如果《国家保安法》真能通过，那从工会到法律救援团体恐怕都要置于政府的监视之下，这种监视是否合乎现行权限姑且搁置不论，但在经济如此紧张的当下，政府是否有足够的资金来支持该监视计划值得进一步讨论。"
  JAP_pnr_515.4.a: "不问门口招牌，只问实际行为。"
  JAP_pnr_515.4.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.4.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.5.t: "交锋：姓名与住址"
  JAP_pnr_515.5.desc_a: "我们最开始的目的是借助该法条掌握各政党支持的院外团（壮士团体）的动向，不过看起来各在野党也意识到了我们的计划，他们对该法条进行了激烈的反击。不出意外，最大的反对声来自$JAP_pnr_market_liberal_party$，他们有着极为庞大且繁多的院外团。\n\n椎熊三郎议员在发言过程中情绪激动，他宣称该法条本质上是对《治安警察法》内容的骑劫，同时也压迫了本来“任意团体”（不涉及政治、不需要法人资格的民间团体）的存在空间，据此来看，《国家保安法》不过是本届内阁试图炮制“反政府团体名簿”的一件趁手工具罢了。在发言的最后，他呼吁议员们不要让[JAP.GetName]变成一个人人都是犯罪预备分子的警察国家，他就像其他反对《国家保安法》的议员那样，试图煽动不安和恐慌情绪。"
  JAP_pnr_515.5.desc_b: "我们最开始的目的是借助该法条掌握各政党支持的院外团（壮士团体）的动向，不过看起来各在野党也意识到了我们的计划，他们对该法条进行了激烈的反击。不出意外，最大的反对声来自$JAP_pnr_social_conservative_party$，他们有着极为庞大且繁多的院外团。\n\n大野伴睦议员在发言过程中情绪激动，他宣称该法条本质上是对《治安警察法》内容的骑劫，同时也压迫了本来“任意团体”（不涉及政治、不需要法人资格的民间团体）的存在空间，据此来看，《国家保安法》不过是本届内阁试图炮制“反政府团体名簿”的一件趁手工具罢了。在发言的最后，他呼吁议员们不要让[JAP.GetName]变成一个人人都是犯罪预备分子的警察国家，他就像其他反对《国家保安法》的议员那样，试图煽动不安和恐慌情绪。"
  JAP_pnr_515.5.a: "登记不等于禁止，连这个都不清楚吗？"
  JAP_pnr_515.5.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.5.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.6.t: "交锋：因字获罪"
  JAP_pnr_515.6.desc: "在今日帝国议会开会之前发生了一段小插曲，东京几个报社的记者联名写了一篇文章，虽然都是些不知名的记者，但这篇文章还是发表在了《东京日日新闻》的第二面上，大体意思是呼吁新闻自由，强调报业是民众意见的管道。虽然整篇文章并未直接提到《国家保安法》，但其显然意指该法案中涉及到新闻管制的部分，这应该是某个党派的手笔，想要借助新闻攻势对《国家保安法》发难。\n\n在随后的质询上，$JAP_pnr_national_populist_party$就现身指责法案中有关“通信公开”的法条考虑欠妥，他们认为该法条不仅打击了所谓的非法机关，还扩大打击了那些出于不知情的原因帮助他们印刷、传递刊物的中间人。$JAP_pnr_katsumaro_akamatsu$亲自出面，攻击该法条中的主观要件，认为其中提到的“明知”与“援助目的”完全依靠嫌疑人口供和警察推认，有滥用嫌疑。"
  JAP_pnr_515.6.a: "法条不是说的很清楚？“明知且援助”。"
  JAP_pnr_515.6.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.6.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.7.t: "交锋：军队责任"
  JAP_pnr_515.7.desc: "出乎意料的是，《国家保安法》中关于军队部分的内容几乎没有受到在野党的任何强烈抵抗，陆军和海军似乎在过去的十年里已经习惯了这一切，他们并未在议会中对此作出过多抵抗。然而有关官僚的部分则吸引了议会中广泛存在的“官僚派”的火力，且一并带上了前面已经放弃抵抗的陆海军。\n\n由于《国家保安法》其它法条目前在帝国议会中都在遭受攻击，“官僚派”们认为目前尚还无法确定该法案中的“犯罪行为”到底指的是哪些犯罪行为，因此讨论这一条中的从重处罚是无意义的，况且该法条似乎是依照身份处罚，而非按照滥用职权处罚，后者已有极为成熟且完善的法律规定，他们认为这一法条的存在意义不大。\n\n显然这些官僚出身的党人在为过去的他们辩护，这些人不愿意在一无所知的情况下背上莫名其妙的罪名，更有甚者宣称单凭这一条便可以断定《国家保安法》只是本届内阁“失去行政信心之后的专制独裁之工具”，号召众议院和贵族院拒绝整部法案。"
  JAP_pnr_515.7.a: "本法绝不纵容轻判当权者。"
  JAP_pnr_515.7.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.7.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.8.t: "交锋：内务省专断"
  JAP_pnr_515.8.desc: "《国家保安法》作为本届内阁所推出的唯一一部新法案，在众议院中得到了“众星捧月”般的关注度，要说到这份草案中最令各位议员“感兴趣”的那一条，那肯定是关于“紧急取缔权”的部分。简直是所有在野党议员都能过来对该法条踩一脚。行政处分先行让本届内阁获得了对在野党超乎寻常的控制力，只要宣布对某个外围支持团体进行紧急取缔，就能在瞬间让对应党派的正常运作受到影响。\n\n尽管该法条确实赋予了执政内阁超乎寻常的益处，但大家并没有智力障碍，知道若放行该法条那就一定会导致自身永远在议会之中处于劣势地位。议会中的众多反对者相信该法条只会把内务大臣变成治安官和选举裁判，是假借治安之名破坏竞选活动，一种写进法律里的，赤裸裸的选举舞弊行为。公平地讲，该法条确实有些危险，但如果能让它原样通过就能给本届内阁在未来带来极大的优势。"
  JAP_pnr_515.8.a: "治安行政争分夺秒，岂能全权仰赖诉讼。"
  JAP_pnr_515.8.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.8.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.9.t: "交锋：司法程序之外"
  JAP_pnr_515.9.desc: "帝国议会[GetDate]速记\n\n永田正义议员发言：关于《国家保安法》的问题，我想向陆海军大臣提出质询，军队方面对于该法案中“搜查陆海军机关、军营或舰艇时，有关军政机关应予协助”这部分是怎么看待或者解释的？其中涉及到的疑似军机证据是由军政机关进行事先筛选判断还是由司法官僚确认相关性？我想向司法大臣提出质询，如果《国家保安法》前述法条经审议得以保留，该法案得以通过，在具体实践上有效令状是依照现行刑事诉讼法之命令状为之，还是另设特别手续？搜查扣押等强制措施是否有规定期限？我想向内阁总理大臣，或者说提出《国家保安法》的全体大臣提出质询，该法案在实际执行过程中的执行主体是何人，如果依然将这一切委任给检察官及司法警察，那该法案是否只是以另一种形式重申并扩大了警察权？\n\n[JAP.GetLeader]答："
  JAP_pnr_515.9.a: "政府无意创造不受司法程序约束的特别警察权。"
  JAP_pnr_515.9.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.9.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.10.t: "交锋：代理人"
  JAP_pnr_515.10.desc: "帝国议会的质询漫长而无聊，大多数议员并非是出于真心反对他们现在所反对的动议，而是出于各种各样的无关理由站在了动议的对立面。相信《国家保安法》现在所遭受的质疑也是由于这一理由所致。议会本应在推进过《国家保安法》草案的相关事务之后开始审议铁路维护提案，但《国家保安法》引发的争论远比大多数人想象的要大。在法案中存在一项关于“冻结可疑资助”的法条，正是它引爆了今天的争议。\n\n金钱可谓是日本政党得以延续其生命的本源，如果失去了金钱，很多事情都没办法办成。如果该法条得以施行，政府便可以通过对特定团体施加行政处分来公然改变受到该团体资助的议员当选的事实。即便本届内阁在这一点上始终坚持这里的“当选无效力”目的是为了对抗非法团体扶植代理人参加选举并进入议会，但关于“实质援助”究竟包含哪些范围则依然不明确，帝国议会中大部分议员都对该法条持否定态度，甚至有一小部分[JAP.GetRulingParty]的议员也认为应该在这一法条进行让步，甚至是干脆取消该法条，面对内外同时袭来的双重压力，[JAP.GetLeader]内阁的回应是——"
  JAP_pnr_515.10.a: "无论如何，选举程序和议会不能遭非法结社渗透！"
  JAP_pnr_515.10.b: "$JAP_pnr_515.2.b$"
  JAP_pnr_515.10.c: "$JAP_pnr_515.2.c$"
  JAP_pnr_515.11.t: "农民动议"
  JAP_pnr_515.11.desc: "“感谢。”在得到了议长示意发言的手势提示之后，风见章站到了议会座席的最前方。帝国议会如今深陷《国家保安法》的漩涡之中，即便眼下是和这法案无关的时间，但发生的一切都是与之相关的议会攻防的延续。“各位先生，就在上周，我提交的农村紧急救济法案在第一读会后付托委员会。今天稍早些时候，我得知它至今还没有排上审议日程——如今东京的上空笼罩着哀伤和暴力的阴云，我想大家担忧天气也是正常的……”说到这里，他从怀里掏出来了那张叠的方方正正的纸。\n\n“我想各位议员都知道，先前五一五审判的时候，司法部门收到了减刑请愿书，甚至收到了那些手指……诸位一直在讨论‘同情者’和‘共犯’，这些人在自己不知情的情况下已经在这霞关风暴的中心。”那张纸被展开，抖了一下，“这是本届内阁坐在办公室里琢磨《保安法》的时候，我对茨城县和栃木县农村状况的调查，上面有当地农民的两百多个签名证明属实。之前第一读会的时候我也交了这个，我想各位不会在当时错过这个了吧，这个令人痛心的可怕现状，在远离东京圈的地方又进展到了什么程度呢？我想各位议员可以思考一下。”然后是沉默，在这沉默之中他深深地吸气。\n\n“我想要问问你们，现在是什么时候了。全体阁僚们，‘黑色星期一’过去多久了？那个事件过去多久了？内阁除了发表一些不痛不痒的声明，让农林大臣去田地里拍几张照片之外，余剩的时间都在议会里就这个什么保安法进行战斗。这是本届内阁唯一一个新东西，但是却是一部彻头彻尾，要封住所有人耳朵和嘴巴，甚至要把脑子掏出来的粗暴的恶法。暴力的青年人好可怕，把他们都抓起来吧——别费力气了，你们什么都做不到，在你们离开办公室，亲自走过泥污之前，你们什么都得不到，那些青年还会和你们战斗的。$JAP_pnr_inukai_tsuyoshi$执政九年的遗产，就这样被你们这些家伙消耗殆尽了。看看你们的手，你们看看你们的手指，执政的诸君，我只问你们指甲缝里还能找到一点大久保利通和木户孝允的骨气吗？你们今天有什么脸面站在这里？真是荒唐且羞耻，你们今天为了这部令人震惊的法案拼命，为了做出点东西超越过去，反而更是荒唐。内阁总理大臣以及背后的诸位大臣，你们为什么低着头，连直视议员的气力都丧失了吗？”"
  JAP_pnr_515.11.a: "议长！风见议员显然是在人身攻击！议长！"
  JAP_pnr_515.11.b: "这联署未经正式受理，议长！按原则不能作为有效材料。"
  JAP_pnr_515.12.t: "议会大乱斗"
  JAP_pnr_515.12.desc_a: "一方面或许是由于《国家保安法》的审议不顺，另一方面又或许是由于风见章前几天对内阁的批评打开了阀门。总之帝国议会的空气中如今弥漫着甲烷，它等待着一个迟钝的家伙划着一根火柴把所有人送上天。那个掏出火柴盒的坏人正是$JAP_pnr_national_populist_party$的安芸盛议员，他于诸多议员面前公开宣读了一份不知道哪里来的，但引爆了整个帝国议会的材料。这份材料是时任枢密院议长的平沼骐一郎男爵与[JAP.GetRulingParty]之间的一系列书信往来，根据安芸盛念出来的内容，《国家保安法》是平沼骐一郎向[JAP.GetRulingParty]秘密提供的草案，其目的既包括消灭社会不安定因素，也包括对在野党的院外政治活动整顿。作为交换，[JAP.GetRulingParty]将奏请改正《枢密院官制》，扩大枢密院的咨询范围。这意味着政府将把保留权力让渡给枢密院。\n\n自大正末期以来，枢密院便因其职能与内阁法制局有所重叠而被讥讽为“二号内阁法制局”，近年以$JAP_pnr_saionji_kinmochi$为首的宫中集团则希望进一步加强政党内阁的权力，并遏制枢密院这个怪胎在过去取得的扩张成果，避免在政治体系中形成“第三院”。除了该幕后交易外，还有关于首相的更多内容——\n\n总之，这份真假不明的材料激起了[JAP.GetRulingParty]激进派成员的怒火。他们率先冲上去试图揪打安芸盛并抢走文字材料，但与此同时$JAP_pnr_market_liberal_party$的议员却冲过来进行拦截。帝国议会瞬间陷入了混乱之中。眼看三拨人已经扭打在一起，在旁听席和休息室里的各政党院外团（Ingaidan）和议员秘书们则前仆后继地冲入议场内部，涌向发言台，期间一路利用墨水瓶和文件袋相互投掷，帝国议会已陷入一场大混战，议长那如暴雨般的敲钟宛如宣告回合的开始，而混战必有结局，只是目前尚未显露。"
  JAP_pnr_515.12.desc_b: "一方面或许是由于《国家保安法》的审议不顺，另一方面又或许是由于风见章前几天对内阁的批评打开了阀门。总之帝国议会的空气中如今弥漫着甲烷，它等待着一个迟钝的家伙划着一根火柴把所有人送上天。那个掏出火柴盒的人是$JAP_pnr_national_populist_party$的安芸盛议员，他于诸多议员面前公开宣读了一份不知道哪里来的，但引爆了整个帝国议会的材料。这份材料是时任枢密院议长的平沼骐一郎男爵与[JAP.GetRulingParty]之间的一系列书信往来，根据安芸盛念出来的内容，《国家保安法》是平沼骐一郎向[JAP.GetRulingParty]秘密提供的草案，其目的既包括消灭社会不安定因素，也包括对在野党的院外政治活动整顿。作为交换，[JAP.GetRulingParty]将奏请改正《枢密院官制》，扩大枢密院的咨询范围。这意味着政府将把保留权力让渡给枢密院。\n\n自大正末期以来，枢密院便因其职能与内阁法制局有所重叠而被讥讽为“二号内阁法制局”，近年以$JAP_pnr_saionji_kinmochi$为首的宫中集团则希望进一步加强政党内阁的权力，并遏制枢密院这个怪胎在过去取得的扩张成果，避免在政治体系中形成“第三院”。除了该幕后交易外，还有关于首相的更多内容——\n\n总之，这份真假不明的材料激起了[JAP.GetRulingParty]激进派成员的怒火。他们率先冲上去试图揪打安芸盛并抢走文字材料，但与此同时$JAP_pnr_social_conservative_party$的议员却冲过来进行拦截。帝国议会瞬间陷入了混乱之中。眼看三拨人已经扭打在一起，在旁听席和休息室里的各政党院外团（Ingaidan）和议员秘书们则前仆后继地冲入议场内部，涌向发言台，期间一路利用墨水瓶和文件袋相互投掷，帝国议会已陷入一场大混战，议长那如暴雨般的敲钟宛如宣告回合的开始，而混战必有结局，只是目前尚未显露。"
  JAP_pnr_515.12.a: "一位壮士拆下了一条椅子腿。"
  JAP_pnr_515.12.a_tt: "§t然后他加入了这场混战……（在这场混战小游戏中胜利将解锁成就“日本国议员大乱斗DX”，除此之外没有任何效果）§!\n\n§f你的初始生命值是§G40§!。§!"
  JAP_pnr_515.12.b: "简直是帮派火并，流氓恶斗。"
  JAP_pnr_515.13.t: "解散威胁"
  JAP_pnr_515.13.desc: "或许是[JAP.GetLeader]单纯想要效仿明治时期的那些藩阀内阁，用众议院解散威胁议员们通过他们希望的法案，又或者是本届内阁实际上根本无法忍受和帝国议会中议员进行讨价还价。在前次关于《国家保安法》的质询中，[JAP.GetLeader]在最后向那位发动质询，表达意见的议员撂下了狠话，就像品川弥二郎当年在第一届帝国议会上做的那样：[JAP.GetLeader]宣称如果议会不愿意通过《国家保安法》的法案，他就会立刻奏请天皇陛下解散众议院重新举行大选。\n\n这种政治逼迫确实收获了效果，那位在野党议员在明确的议员津贴和未知的选举之路中间选择了前者，至少在当前讨论的这一法条上，[JAP.GetLeader]内阁渡过了这次危机。但他在议会中的这一行动也为内阁在明天的报纸上争得了一个小小的版面，当然不会是什么赞扬的话。面对着社会舆论的变化，他是否还能继续动用这一方式逼迫议员在后续问题上妥协则仍是一个未知数。"
  JAP_pnr_515.13.a: "这就是博弈。"
  JAP_pnr_515.14.t: "$JAP_pnr_515.13.t$"
  JAP_pnr_515.14.desc: "也许是[JAP.GetLeader]历史读到入迷了，当他在书里看到山县有朋和伊藤博文的事迹以及他们在帝国议会中纵横捭阖，呼风唤雨的故事时，他错误地把自己当成了两人在人间的某种化身。但总之在刚刚针对本届内阁提出的《国家保安法》进行讨论的帝国议会临时会上，面对在野党议员对其中一条法条的质疑，[JAP.GetLeader]选择不和对方对话，直接用众议院解散来威胁议员退却。\n\n[JAP.GetLeader]为此付出了代价，那个议员并不害怕他的政治威慑，而他背后的党派似乎也决定支持他和本届内阁对抗到底。现在这颗定时炸弹抛回到了[JAP.GetLeader]内阁手中，根据现在小规模的民意调查，[JAP.GetRulingParty]在舆论中处于较为不利的状态，虽说这是小规模的民意调查，只具有参考性而不具有确定性，但本届内阁真要为此下赌注吗——无论如何[JAP.GetLeader]已经在议会中直接说出了解散威胁，如果他明天没法递交一份包含全体内阁大臣的解散奏请给天皇的话，那本届内阁可就连尽力维持的政治信用也要失去了——到时候只会发生像是“不信任案”那样的更坏的事情，但至少还能给内阁续命几天。然而时间不多了，内阁必须作出决定。"
  JAP_pnr_515.14.a: "看来[JAP.GetLeader]的牌打不下去了。"
  JAP_pnr_515.14.b: "好死不如赖活着，明天大大方方去帝国议会。"
  JAP_pnr_515.14.b_tt: "§l威胁§!选项将被§Y禁用§!。"
  JAP_pnr_515.15.t: "绝望的一击"
  JAP_pnr_515.15.desc: "在前几日紧张激烈的议会攻防中，执政党[JAP.GetRulingParty]试图通过威胁解散众议院来迫使在野党们通过《国家保安法》，不过看起来各大在野党并没有因其威胁而退缩。随着《国家保安法》的通过已无希望，[JAP.GetLeader]于今早宣布奉天皇敕命解散众议院重新举行大选。\n\n根据《大日本帝国宪法》规定，众议院解散后需在40天内举行总选举。这一规则原则上有利于执政党，因为他们掌握主动权，故而可以提前准备选举。在过去的十年里，$JAP_pnr_inukai_tsuyoshi$正是因为善用这一权力才能延续他的统治如此长的时间。在田中义一内阁以前，内务大臣还能借助《治安维持法》来指挥警方干扰在野党正常进行选举，然而随着田中义一的倒台，这种可耻的选举干涉也随之被民意所禁止了，\n\n但目前看来[JAP.GetRulingParty]并非是在做好万全准备的情况下宣布解散众议院，更何况不论[JAP.GetLeader]是相信自己的党派有能力在这场选举中拔得优位，还是单纯地不想让自己的政治生命如此快速地完结，这都表明了《国家保安法》草案在本会期中取得了耻辱性的惨败。至于民间对[JAP.GetRulingParty]的支持率：在黑色星期一带来的出口萎缩以及一系列丑闻的打击下，无需多想就能意识到他们的支持率一定处于可怕的低点，在这种局势之下，原则上讲其在众议院中的席位一定会被其它几个党派瓜分。\n\n即便[JAP.GetRulingParty]侥幸胜选，那帝国议会也大概率还是会维持“悬峙议会”的无多数状态，届时即便[JAP.GetRulingParty]再次在新会期中提出《国家保安法》，各大在野党还是能联合起来将其否决。\n\n也就是说，这一切不过是[JAP.GetLeader]临死前的最后挣扎。"
  JAP_pnr_515.15.a: "真让人汗颜，椅子就这么重要吗？"
  JAP_pnr_515.16.t: "动乱之后"
  JAP_pnr_515.16.desc: "日本从1936年开年到现在度过了一段并不愉快的时光，首先是丑陋的议会斗争，然后是黑色星期一的经济危机，之后又是丑陋的议会斗争。随着[JAP.GetLeader]为了挽救自己和他的党派的政治生命，尝试效法田中义一大将推出一部借尸还魂的《国家保安法》之后，国民已经对[JAP.GetRulingParty]失去了信心——议会之中还有许多为了自由和民主而同《国家保安法》斗争的政治家，不过[JAP.GetLeader]为了强推《国家保安法》通过而选择动用手中权力解散议会，从而破坏他们的联盟。\n\n这场令人不齿的众议院再选举于今天揭晓了答案，帝国议会依然维持着悬峙状态，但元老的态度则发生了变化。各新任议员已收到通知，将不会有任何一位党人得到组阁大命，这是他们丑陋争斗所得到的最终结果。而在西园寺公望的手边则有两个人选，在陆军中颇有威望的清军派领袖$JAP_pnr_hayashi_senjuro$和海军大将加藤宽治，无论最终选择为何，这都意味着政党政治就此走向终结。"
  JAP_pnr_515.16.a: "林首相可以调和好陆军内各派矛盾。"
  JAP_pnr_515.16.b: "宇垣一成或能凭借威望压制陆军。"
  JAP_pnr_515.17.t: "最后一人"
  JAP_pnr_515.17.desc: "针对《国家保安法》的质询已近结束，帝国议会众议院即将就该法案进行投票，其实该法案是否能通过，在座的议员心中都已经有了一个大致的估计了。就是在这个时候他被获准发言，自己的发言可能没办法改变大局，他向前走上发言台，然后环视了如今还滞留在会场内的议员——纵观整个议会，大多数人根本不是出于关心法案的具体内容才在这里的。\n\n“我想诸位还记得田中大将那时候的事情，那年也是和现在一样，《治安维持法》表决的时候，众议院和现在有着相同的氛围。我记得那个时候，大家都不敢站出来正面对抗，就像是被锁链拴住了脖子一样不敢行动。后来是‘宪政联盟’，大家一下子发现独裁者也没什么可怕的，只要大多数人团结一致，不管是一个还是十个独裁者都可以掀翻。这是已经故去的犬养先生留给我们的教诲。”\n\n“如今借着犬养先生的死，就像田中义一借着关东大地震那样，政府又在推行新的《治安维持法》，难道各位同袍希望十年之后被按着《春秋》之笔法，说是独裁者的同谋吗？难道各位同袍希望今天投票结束走出去，看到那些把你们送进议会的人眼中的失望时而遗憾道‘今日未能尽力’吗？我想问各位议员同袍，我们已经把田中义一赶下去了一回，到了他复活，附在今天这个内阁身上的时候，我们照样可以把他再赶下去一回，这才是真正纪念犬养先生的方法。”他又确认了一圈那些在仔细听他说话的的人，“我想这是投票前最后的发言了，随后就是表决，但我想即便是这个议会里抵抗《国家保安法》的战旗下只有我山本宣治一个人，我也并未感到寂寞。”"
  JAP_pnr_515.17.a: "“因为我的背后还有群众们支持着——”"
  JAP_pnr_military_events.1.t: "大战之伤痛"
  JAP_pnr_military_events.1.desc: "[JAP.GetName]就像所有国家那样，其内部存在着各军种之间的冲突。由于帝国并非是一个可称得上“物产丰富”的国家，它的军种冲突较其它国家而言更为剧烈。陆军与海军在涉及到经费的问题上便会大打出手，然而随着几次军事行动未能取得预期的结果。1925年英国革命首先迫使海军终止了宏大的造舰计划，而1928年奉天冲突的有限战绩（以及和张作霖这个“谎话精”达成的“协议”本身并不为民众所信赖）则宣布了陆军也彻底出局。民众自此对军队失去了信心，这某种意义上讲反而缓和了陆海军矛盾。1921年原敬内阁的特别军费是陆海军最后见到的额外资金，如今两军都不得不面对贫乏的现实，并共同哀叹自己相同的敌人。资金的缺乏使得他们不得不自行削减开支来升级，甚至只是单纯维持军备。帝国议会中的党人们通过严格控制预算来令两军主动对内进行改革，而这种改革则反过来进一步压迫了军队在[JAP.GetName]的地位。\n\n为了应对资金紧张，陆军和海军都采用了最直接的方法：裁撤常备军。这使得大量陆军军人被强制复员，海军军校中的学员们毕业之后却发现自己无船可上，只能转为预备役。当这些军人们被释放到社会上的时候，民众对他们更加厌恶了：军人之所以优先，是因为他们“脑子有问题，只懂打架和杀人”；军人之所以买票半价，是因为他们是“半个正常人”……军人未能在社会上得到应有的尊重，反而促使帝国议会借助民意进一步逼迫两军，党人们甚至提出了陆海军大臣文官制，试图从内阁中彻底驱逐军人。所幸他们很快便陷入内斗，才令军队得到了一丝喘息时机。\n\n出于社会对军人的厌恶，一些士兵开始随身携带民主主义书籍，参加集会，试图证明自己是一个进步人士；更有些士兵立下了要让所有欺侮军人的国民付出代价的誓言，成为了黑社会和秘密结社中残暴的暴力分子。纵观历史，帝国从未有一刻陷入此等厌战情绪之中，“国民们”急需一场能够证明军队存在必要性的事件来吹去这厚重的阴霾。"
  JAP_pnr_military_events.1.a: "惟有胜利方能证明必要。"
  JAP_pnr_military_events.2.t: "不惜一切之现代化"
  JAP_pnr_military_events.2.desc: "[JAP.GetAdjective]陆军系统内部的派系斗争持续已久，最初是长洲和萨摩之间的斗争，萨摩集团最终被支持普鲁士二元化军制的长洲集团击败，为[JAP.GetName]奠定了陆军持续至今的军令-军政分离模式，并为后续的派系斗争埋下了伏笔。\n\n1922年长洲集团的首脑山县有朋去世后，登场的挑战者便是立志于打破长洲集团对陆军垄断的革新阵线：由当初在派系斗争中落败的萨摩集团（以上原勇作元帅为盟主）与在此期间内不断发展壮大的佐贺集团（以武藤信义为盟主）组成，并以土佐集团（以田中光显为盟主）作为政治界的盟友。这一反长洲集团深入参与了“护宪联盟”对长洲集团关键人物，颁布《国家保安法》的田中义一大将的攻击，借机在陆军内部严重打击了长洲集团的势力，并夺取了陆军省和参谋本部中的多个关键位置。\n\n随着田中义一大将的政治死亡与肉体死亡，其领袖由宇垣一成大将接任。在宇垣的韬光养晦之下，长洲集团一改先前任人唯亲的形式，开始拉拢陆军系统中的精英和中立将领，形成了被后人错误地称为“统制派”的集团。其精英主义的出身使得他们热衷于从抽象层面把握战争，并在世界大战之后形成了名为“国家总武装”的先锋军事思想：一次战术策略的成功不能决定未来战争的走向，未来的所有战争必将是消耗战的某种变体，是榨干所有国力以在战场上展现的“全体主义”战争。\n\n基于这一观点，他们极为重视军备的现代化，激进地主张将所有不适合于现代化作战的落后编制全部裁除，并用节约出来的经费投入军备升级，打造超现代化的精锐部队。由于他们的观点在某种意义上反而迎合了世界大战之后[JAP.GetAdjective]社会的和平思潮，这使得执政党更乐于和他们进行进一步合作，并让他们在近年里夺回了对陆军省的控制权。如今，“新长洲集团”或称为“反皇道派”与盘踞在参谋本部中的“反长洲集团”或称为“皇道派”紧张对峙，誓要彻底将陆军系统统合在一面旗帜之下。"
  JAP_pnr_military_events.2.a: "一切为了战争！"
  JAP_pnr_military_events.3.t: "向参谋本部进军"
  JAP_pnr_military_events.3.desc: "自从荒木贞夫卸任陆军大臣后，皇道派对帝国陆军中央机关的完全控制便只局限在参谋本部。为了缓和陆军内部的冲突，长期以来陆军大臣都由持守中立的清军派盟主$JAP_pnr_hayashi_senjuro$担任——尽管清军派本身也是反皇道派的一员，但$JAP_pnr_hayashi_senjuro$对皇道派对皇道派的意见则更复杂。随着反皇道派得到了政党势力的进一步援助，$JAP_pnr_hayashi_senjuro$大将站在了长洲集团-反皇道派一边，原先存在于陆军省和参谋本部之间的岌岌可危的平衡最终被打破，现在皇道派似乎连参谋本部都无法保全了。\n\n在和参谋总长闲院宫载仁亲王商议过后，$JAP_pnr_hayashi_senjuro$发动了一场针对参谋本部内皇道派成员的大规模人事清洗。参谋次长铃木率道中将已被强行排除，根据计划将由重返中央的建川美次中将接任。本间雅晴、片仓衷、辻政信等反皇道派成员已经通过这次人事调动悉数掌握了参谋本部中的中层职务，如今反皇道派已彻底控制参谋本部，而他们的敌人如今只能蜷缩在宪兵队系统中因绝望而继续进行无谓的抵抗。"
  JAP_pnr_military_events.3.a: "他们终会明白，胜利属于智者。"
  JAP_pnr_military_events.4.t: "奠定总体战基础"
  JAP_pnr_military_events.4.desc: "在镇压了那些追随皇道派的青年军官于绝望中引发的零星骚动之后，再没有什么能够阻挡[JAP.GetRulingParty]和他在军队中的盟友了，陆军省、参谋本部甚至还有宪兵队如今都在长洲集团的控制之下，[JAP.GetAdjective]陆军的陆军人事终于得以拨乱反正，整个陆军系统的控制权再一次回到了“长洲”手中，至少在名义上回到了手中，随着他们正式确立了他们在陆军系统中的“总体统治”，昔日在思想上四分五裂的[JAP.GetAdjective]陆军如今已再度统一。\n\n陆军得到了一笔以充实国防为名义划拨的特别预算，但事实上，几乎所有人都清楚这是终结了内部派系的斗争的奖励。在反皇道派的通力合作之下，皇道派被彻底排挤到陆军系统中的边缘位置或之外，许多皇道派要员或被转入预备役，或被调任到总督府担任在当地担任军官。后者即便是在总督府也依然受到反皇道派的密切监视。在陆军省的推进之下，这笔特别预算将被用于一项更宏大的陆军军备更新计划，随之而来的还有更进一步的裁军清单，为了打造真正精锐的现代化部队，付出任何代价都是可以接受的。"
  JAP_pnr_military_events.4.a: "全体注意！"
  JAP_pnr_military_events.5.t: "胜负在于皇军"
  JAP_pnr_military_events.5.desc: "[JAP.GetAdjective]陆军系统内部的派系斗争持续已久，最初是长洲和萨摩之间的斗争，萨摩集团最终被支持普鲁士二元化军制的长洲集团击败，为[JAP.GetName]奠定了陆军持续至今的军令-军政分离模式，并为后续的派系斗争埋下了伏笔。\n\n1922年长洲集团的首脑山县有朋去世后，登场的挑战者便是立志于打破长洲集团对陆军垄断的革新阵线：由当初在派系斗争中落败的萨摩集团（以上原勇作元帅为盟主）与在此期间内不断发展壮大的佐贺集团（以武藤信义为盟主）组成，并以土佐集团（以田中光显为盟主）作为政治界的盟友。这一反长洲集团深入参与了“护宪联盟”对长洲集团关键人物，颁布《国家保安法》的田中义一大将的攻击，借机在陆军内部严重打击了长洲集团的势力，并夺取了陆军省和参谋本部中的多个关键位置。\n\n佐贺集团中的荒木贞夫作为陆军大臣控制了陆军省，而铃木率道则被任命为参谋次长，名义上对参谋本部施行控制。为了巩固反长洲集团的胜利，他们一方面从陆军系统中强硬清理原长洲集团势力，另一方面积极拉拢在军队中处于多数的中基层军官，荒木贞夫用他平易近人的性格和魅力成功取得了他们的拥护，并在陆军内形成了今日的“皇道派”。\n\n然而皇道派最终因自己的选择而付出了代价。由于其支持者是中基层军官，这使得他们在战后和平思潮中不得不强硬地主张维持军队规模，反对裁军计划，这给了当时重整旗鼓的长洲集团机会，通过主张更受政党青睐的“精兵计划”，皇道派迅速失去了执政党的支持。而先前激进的人事清理更让他们在政治上也引发了中立派的不安。最终，皇道派彻底丧失了陆军大臣-陆军省的控制权，将参谋本部作为他们影响力的最后阵地。这反而使得他们更进一步地坚持要维持甚至扩大常备军规模，一方面是他们不希望在态度上彻底屈服于长洲集团；另一方面则是作为参谋本部，他们希望有足够的可用兵力来制定更完善的战争计划。虽然维持精兵模式也能在战时进行临时动员，但临时动员部队的协调程度，或称为“皇军精神”显然远不如常备军。"
  JAP_pnr_military_events.5.a: "皇爱、皇谊、皇威、皇民、皇军、皇国。"
  JAP_pnr_military_events.6.t: "罢免恨国者"
  JAP_pnr_military_events.6.desc: "皇道派与“护宪联盟”的蜜月期在田中义一倒台之后很快就结束了。犬养毅在暗中和那些反对皇道派，用裁军政策取悦政党的人士勾结了起来。他们用阴谋算计将荒木贞夫从陆军大臣位置上踢走，扶植了表面上维持中立且和荒木贞夫、真崎甚三郎关系良好，实际上则毫无主见，常常任人摆布的$JAP_pnr_hayashi_senjuro$担任陆军大臣。自那之后，反对皇道派的陆军人士便集结于陆军省中，与参谋本部中的皇道派对峙。\n\n这平衡如今终于被打破了，由于局势已经进展到必须选边站的情况，林大将在审慎思考之后选择了皇道派和解：他辞职不干，专心于他的伊斯兰教研究去了。他推荐的接任人选是川岛义之大将，此人正是皇道派的最有力盟友。由于陆军大臣的异动，反皇道派很快就遭遇了灭顶之灾。川岛义之利用其权限对陆军省内的反皇道派集团进行了迅速且强硬的打击，就像当初荒木贞夫大将剪除长洲集团集团那样。这些最终目的是践踏军人之间的温情的恨国者或被编入预备役，或被流放到地方坐冷板凳。相信那些先前深受他们所害的人会热烈地欢迎他们的。皇道派如今终于夺回了对陆军中央机关的控制权，而他们的反对者也再无法组织起任何像样的抵抗了。"
  JAP_pnr_military_events.6.a: "是的，爱与热情终将战胜所有强敌。"
  JAP_pnr_military_events.7.t: "人心所向"
  JAP_pnr_military_events.7.desc: "如今来看，所谓的长州集团不过是一个存在于陆军中的幽灵，当维持着陆军内部均势的$JAP_pnr_hayashi_senjuro$离开之后，长州集团就像水里的泡沫一样瞬间就消失不见了。回顾他们耀武扬威的日子，便能意识到所谓长州集团的成功是一时的，失败是注定的。这必然是源于他们并没有理解“皇军”的真谛，本手册正是为了从他们的失败来向诸君解释究竟何为“皇军”，有着这样确实的教育目的。\n\n长州集团或称为“统制派”者，迷信于大炮的口径，盲从于军械的威力，他们相信今年新研发的武器总是比前一年新研发的武器要厉害，所以拼命地追求装备的现代化。这使得他们的所谓军备更新永远没有尽头，步枪再过先进也不过是一件武器，但他们愿意裁掉一个中队来换取一支步枪，在他们眼中武器比起和自己朝夕相处的战友更加重要——他们都是些自负的精英和倚老卖老之人，所以未必认为裁掉的是战友——他们的策略虽然因得到了政党的支持而暂时压过“皇道派”的正义，但却在裁军之中失去了士兵们的信任。而诸君便自然而然地汇聚到我们这边，因为我们根本不在乎那些冰冷的军械，我们在乎的是热切的报国之心和胜过一切黄金的“皇道精神”，所谓的“皇军”正是这样的一个团体，一个充满温情，彼此扶助，服从纪律并最终携手走向胜利的集体。是各位将士心怀热烈的“皇道大精神”，才赋予了武器力量。这个集体是由千万心怀“皇愿”，奉戴大御心的至诚报国将士们组成的，而不是由那些不能理解何为“皇魂”的武器组成的。他们正是因此而失败，虽然有先进的武器，但却没有拥有“皇心”，愿意付出生命的人，如今的事实证明我们今天是对的，未来将证明我们明天也是对的。\n\n《皇道论与皇国之中军人大精神的真髓》，荒木贞夫大将，[GetYear]"
  JAP_pnr_military_events.7.a: "皇军必胜！"
  JAP_pnr_military_events.8.t: "争取陆军大臣"
  JAP_pnr_military_events.8.desc: "1933年五相会议上，原先把持住陆军大臣位置的荒木贞夫突然提出了《皇国国策基本要纲》，他为皇道派谋取利益的行为最终却葬送了皇道派的对陆军省的控制。由于该要纲整体内容大略偏向维持军队规模甚至继续扩军，而对如何解决扩军带来的军费问题则语焉不详。这一要纲最终因逆民意而动而毫无悬念地未通过，荒木贞夫的个人威望也因此而一落千丈——他曾承诺他将为陆军争取更多经费，如今承诺显然落空了。\n\n荒木贞夫随后不久便辞去了陆军大臣的职务，并推荐同为皇道派成员的真崎甚三郎接替。但在闲院宫载仁亲王的干涉下（真崎曾与他有私人恩怨），最终的陆军大臣人选是性格温和，主张缓和陆军内部派系矛盾的$JAP_pnr_hayashi_senjuro$。这也成为了反皇道派收复陆军省的开端。\n\n随着时间推移，陆军内部的派系斗争并未如$JAP_pnr_hayashi_senjuro$所料变得缓和，反而进展到了双方各自在中央割据，必须站队的时刻。借着和执政党关系密切，反皇道派似乎决定用政治上的利益作为筹码前来说服$JAP_pnr_hayashi_senjuro$，在几次办公室里的正式见面和几次高级料亭中的把酒对谈之后，$JAP_pnr_hayashi_senjuro$大将得到了他们的承诺：如果他愿意把一直要求增加军费、维持军队规模甚至扩军的皇道派从陆军中央中清除出去，那么他们将支持林大将继续担任陆军大臣的职位，如果有可能的话，他们也愿意为林大将在元老和宫中重臣面前美言几句，未来能成为元帅也说不定。\n\n这确实是富有诱惑力的提案，但天平的另一边则是$JAP_pnr_hayashi_senjuro$的“温和”，如果他真的对皇道派展开清洗便无法再维持自己作为中立派的身份，势必将遭到皇道派的记恨，而且反皇道派的承诺究竟是否真的能够实现？又或者说他们只是信口许下自己根本做不到的诺言。说不定到最后自己最后什么利益都没得到，徒留一身骂名。"
  JAP_pnr_military_events.8.a: "林大将被利益诱惑了。"
  JAP_pnr_military_events.8a_tt: "§f$JAP_pnr_hayashi_senjuro$在陆军内部分裂的当下最终倒向了§P反皇道派§!一边，这必然会引发§n皇道派§!的不满。§!"
  JAP_pnr_military_events.8.b: "为名声计，我还是跑路吧。"
  JAP_pnr_military_events.8b_tt: "§f$JAP_pnr_hayashi_senjuro$在陆军内部分裂的当下最终不堪重负选择辞职，他推荐了川岛义之接替他的位置，此人正是一位铁杆§n皇道派§!，这一举动势必将把§P反皇道派§!置于危机之中。§!"
  JAP_pnr_military_events.9.t: "[JAP.GetAdjective]海军现状"
  JAP_pnr_military_events.9.desc: "1925年的英国革命成为了[JAP.GetAdjective]海军的死穴，叠加当时社会愈演愈烈的和平思潮，[JAP.GetAdjective]政府借机向海军大臣发难，迫使其相关造舰计划即刻中止。随后留给海军的是漫长的“假日”：连年未曾变化的预算使得海军为确保舰船火力而舍弃安全冗余铤而走险。首先是1934年海军演习时的“友鹤事件”，然后是1935年海军演习时的“第四舰队事件”。丑闻并未成为谋取更多预算的理由，反而成为了维持预算不变的理由。\n\n在这种情况下，海军内部的路线斗争则变得更为剧烈：海军大臣大角岑生每年都会向帝国议会强硬地要求增加海军军费。在海军内部，这些主张不惜一切代价确保舰队火力的人被称为舰队派，1934和1935年的事故正是他们掌控权力的结果。然而大角岑生本人却并非舰队派的头目，几乎所有人都清楚在他背后操控他的是时任军令部总长伏见宫博恭王，这位皇族是巨舰大炮主义的强硬推行者。\n\n与他们相对的一派则是主张在有限预算内通过和内阁协调，以达成“刷新海军军备”的航空派，该路线由米内光政和堀悌吉为领导人物，他们在这十年间一直寻找着大舰队的替代品，并最终认为航空母舰具有相当大的潜力：与传统的战列-巡洋舰大舰队相比，航空母舰和其配备的飞行编队在作战上更为灵活，最关键的是能够节约经费——一艘铁甲舰可比一支飞行编队昂贵不少。他们的观点虽然同样得到了海军省和军令部中许多军官的支持，但这种支持基本来自私下而非公开场合。海军大臣大角岑生当前把控着海军人事任免权，而他背后的伏见宫博恭王势力则将米内等人讥讽为“空军”，并偶尔借助大角岑生通过人事任命的方式打击航空派，大多数人都不愿因忤逆这位亲王而丢掉工作。"
  JAP_pnr_military_events.9.a: "老资历很危险呢……"
  JAP_pnr_military_events.10.t: "拜察"
  JAP_pnr_military_events.10.desc: "矢牧章中佐在御用邸的别室中等待着消息，作为海军大臣的秘书官，他陪同大角岑生前来拜察天皇正是为了就1933年的《互涉规程》进行进一步的修订。《互涉规程》是伏见宫博恭王在当时提出用以强化军令部的“统帅”地位的谋略性质的法案。\n\n1933年的《规程》第三条提到“关于兵力，由海军省提供建议，军令部进行批准。”尽管大角岑生已经是伏见宫听话的傀儡，但他希望即便大角离开也能彻底控制海军省，因此在[GetYear]的修订版本里将第三条改为了“关于兵力，由军令部总长决定提案。”换句话说，本次修订的目的是进一步削弱海军省本来的兵力决定权，并将其集结在自己控制的军令部从而彻底架空海军大臣。大角岑生此次前来正是为了说明法令修正内容，以争取今上天皇的“御裁可”。\n\n然而刚刚过去通常所需的十分之一的拜见时间，走廊里就传来了脚步声。矢牧赶忙出门迎接，就遇到了面色惨白的海军大臣：“事情完蛋了，陛下很严肃，拒绝了单纯口头说明，要求我们立刻起草文件并且提交，要马上准备……情况变得紧急，完蛋了，彻底完蛋了。”听到海军大臣说这话，矢牧立刻就拉着大臣进入了接待室，开始起草所需的备忘录。等到二人结束工作已是下午三时，他把文件叠好，交到尚未从慌张中走出的大角岑生手中。而海军大臣则缓缓离开房间，开始了他的“再度拜谒”。"
  JAP_pnr_military_events.10.a: "“是，为在南洋阻击德国，我想这是必要的。”"
  JAP_pnr_military_events.10.b: "“朕尚有疑问，再对人事责任详细说明，择日再议裁可。”"
  JAP_pnr_military_events.11.t: "飞越大洋"
  JAP_pnr_military_events.11.desc: "尽管在过去几天里曾有一些风言风语，但大角岑生海军大臣的倒台还是太过突然。根据一些小道消息，大角岑生似乎是因为被夹在了“陛下”和“殿下”中间，又被“陛下”反复诘问，最终压力过大选择了辞职。他推荐的继任者本来是同为舰队派重要人物的的永野修身大将，但在几次私下商谈之后情况似乎急转直下，最终继任该位置的是一直在海军省内遭到打压的航空派领袖米内光政大将，随着主张重点发展航空母舰和空中战力的航空派在海军之中谋取了地位，或许伏见宫博恭王对海军整体控制将受到削弱，而巨舰大炮主义的思想也大概会有所退潮。\n\n此外由于这场人事变动如此迅速，加上米内光政本人颇得宫中喜爱，而且中间还发生了很多密室政治式的非公开谈话，海军中间也出现了另一种偏向阴谋论的说法，称大角的辞职实际上是天皇陛下身边的宫中集团策划的一场阴谋，目的是制衡海军内部派系，以免伏见宫一派彻底称霸海军系统，从而巧妙地扩大天皇对海军的实际控制权。"
  JAP_pnr_military_events.11.a: "你这么一说，似乎有点可能。"
  JAP_pnr_military_events.12.t: "真理只在射程之内"
  JAP_pnr_military_events.12.desc: "尽管过程多有波折，但伏见宫借助大角岑生策划的计谋最终成功了。《互涉规程》的修订已经得到了天皇的“御裁可”，意识到这意味着军令部彻底掌握兵力的运用权之后，伏见宫博恭王最终选择更进一步，将海军省中那些长期以来和自己路线不合的人从中央清除：在他的授意下，大角岑生以自己的名义对海军省内部进行了一次规模庞大的人事清洗，其目的无需多言，将那些试图把海军变成空军的家伙彻底清除出去。最先被转入预备役的是堀悌吉；然后是井上成美少将，他流放到横须贺镇守府待命；随后是其他在海军省中公开支持航空派的人物。如今在无人敢公开表达对传统大舰队路线的支持了，伏见宫和大角岑生成功在表面上确立了自己对海军系统的控制，如今他们将面对另一个长期以来困扰着海军的敌人：预算。相信它不会比起航空派还要难战胜。"
  JAP_pnr_military_events.12.a: "我们的大舰队将称霸海洋！"
  JAP_pnr_military_events.13.t: "自己人"
  JAP_pnr_military_events.13.desc: "“这位叫渡边，街上遇到的，说来这里做买卖。”王贵麟领着他闯进了村民们吃饭的地方。“哇呀，日本人！我第一遭见到活的！”他一边点头问候这些好奇的中国人，一边紧跟着王贵麟向里闯。“给渡边先生整点吃的。我们从镇上过来，妈的，吃的全让[KUM.GetLeader]和[SIK.GetLeader]的那帮土匪抢光了。”旁边那个人听到他这么说，便在墙上抹了抹沾着羊奶咸汤的手，给他从锅里捞了几粒饺子放进一旁挂着奶痕的空碗里，递给了渡边。\n\n没有餐具，他只好学这里的其他人，用手抓着那个勉强称得上是“饺子”的东西，那东西手感黏糊糊的，只是观看就能感觉到不寻常。在表皮那层诡异的油光之下能清楚地看到挂在上面的粉粒，放进嘴里之后，和外形一样的怪味道立刻塞满了口腔，沿着食管一路下探。肉类酸腐的味道混在粗粝的植物纤维里面，让他意识到这东西相当不妙。随着他强行命令自己的牙齿咀嚼，舌头搅动，从舌尖扩散到整条舌头上的是刮擦感和滚烫的温度，从死羊的腹中刨出来的未消化的青草恐怕就是这个气味。\n\n有液体从他的下眼睑溢出来，在模糊之中他看到所有人都停下了吃饭的动作，严肃地盯着他看。这下完了，他心想着，恐怕眼前这些人看到自己因生理反应而扭曲的面容要产生“果然他和我们不是同一人种啊……”这样的失望想法。\n\n“嗨呀，”王贵麟突然转过身去，对着剩下的那群人说，“这是和我们一起吃饭的渡边弟兄。”"
  JAP_pnr_military_events.13.a: "哎喽，是一家人。"
  JAP_pnr_military_events.14.t: "死之高贵"
  JAP_pnr_military_events.14.desc: "[JAP.GetName]一向是自诩站在正义一边的国家，大战之后就抱着所谓的正义沉入了和平的美梦之中。过去曾心怀着强健的精神驰骋在西伯利亚大陆上的日本男儿，今天怎么变得如此温吞！几天之前印度支那的人们对德帝国主义掀起了反旗，然而我国和我国国民竟对这些忧国志士毫无半点反应。当德国匪徒的飞机在交趾支那的丛林上方呼啸而过，当帝国主义者的炮舰停在西贡城外向内倾泻炮火的时候，[JAP.GetName]竟在一边呼吁些不痛不痒的和平，一边谈论欧美潮流的服装和发型吗？之前自诩为亚洲的先锋和解放者，说着的所谓的国家的大义和国民的精神，因为一次大战之后奉行的所谓“尊重生命”就这样全然失去了！\n\n为了自己的生命存续掩盖懦弱，嘴上说什么呼吁和平而丢掉武器，最后就会连生命也被丢掉！[JAP.GetName]就这样冒渎自己的生命，让[JAP.GetAdjective]魂魄就这样腐烂了！今天我，石井卓雄前少尉，已经把退职申请交到上官手中！如今我不是作为一个[JAP.GetAdjective]军人去到印度支那为了战斗，我作为一个更纯粹的日本人，为了实现印度支那的民族主义，为了有色人种的大联合和亚洲的协同共荣去战斗，实行[JAP.GetName]建设大亚洲的第一步！\n\n你们之中没有愿意撞在恐怖的白人靴子上去死的人吗？你们之中没有愿意为了比生命更尊贵的东西去死的人吗！若是听了我今天这番话就从梦中猛醒的，要是有这样的人就在明天凌晨集结吧！以侠义的精神为荣，有着超越一切的热忱灵魂的诸君，我们和印度支那的斗争者们一起起义，一起去死！"
  JAP_pnr_military_events.14.a: "当下与德国冲突为时过早，让我们祝福石井少尉。"
  JAP_pnr_military_events.14.b: "台湾总督府最近在“考察热带产业”以期进行投资。"
  JAP_pnr_military_events.15.t: "黄皮档案"
  JAP_pnr_military_events.15.desc: "事件的起因是国务大臣$SIA_pridi_phanomyong_royal$向$SIA_prajadhipok$国王提供了一份名为“黄皮档案”的国家发展草案，其目的是应对黑色星期一在[SIA.GetName]的蔓延，该草案涉及到形成福利国家所需要做出的各项改革：从土地再分配到对农民的补贴制度。在看过该档案之后，$SIA_prajadhipok$国王很“亲切地”将其称为赤匪，并下令逮捕$SIA_pridi_phanomyong_royal$。\n\n国王为他的行为付出了代价，$SIA_pridi_phanomyong_royal$背后的人民党左派成员在会议讨论之后决定控诉国王:他们通过他旺·里提德以个人名义向法院起诉国王干预政治、国家和经济事务。这无异于火上浇油，促使了内阁的分裂，并最终导致了议会和国王之间发生了一场内战。\n\n下官个人的看法是，尽管议会军如今牢牢控制着曼谷，但他们的叛乱后劲不足。即便可能过程会稍显艰辛，但相信$SIA_prajadhipok$国王最终能够压制这些左派反动势力。也正因如此下官才觉得这是一个晴天送伞的好时机，我们正可以借此机会扩张[JAP.GetName]在东南亚地区的潜在盟友，如果[289.GetCapitalVictoryPointName]最终能和我们站在一起，我们就可以直接从大陆上对[GEA.GetName]的新加坡海军基地创造难以忽视的威胁。"
  JAP_pnr_military_events.15.a: "[SIA.GetAdjective]真是野蛮……"
  JAP_pnr_military_events.15.b: "我们就不会随便说人是赤匪……"
  JAP_pnr_military_events.16.t: "TO机关"
  JAP_pnr_military_events.16.desc: "守屋精尔一开始只是计划带着刚刚上任的特命全权公使矢野真去波丁餐厅吃个著名的招牌菜烤乳猪，要知道这可是马德里最有名的老店，据说他们店里的冬青橡木柴火烤炉从18世纪初到现在两百年从来没有熄灭过。可刚走到马约尔广场附近，两个人立刻就融入到广场上那成千上万，密密麻麻的人群之中。让人不由得怀疑是不是圣母和耶稣显灵了，正在马约尔广场上挑去哪家亲子餐厅吃晚餐好。\n\n人群的集结速度比任何时候都要快，两个人很快就在涌动的人潮被分割开来，一同融入了这西班牙人的汪洋之中。就在这时候广场的广播系统突然开始躁动起来，整个马德里都响起了西班牙王国那著名的“有曲无词”的国歌。为了呼应这国歌，人群，或者说某种新生的意识体一边欢呼着一边向着北边的面包房之家迅速移动，并贪婪地吞噬他们在路上遇到的任何小股人群。\n\n在那国歌播放完毕之后，一个刺耳的男声则开始用激昂的声音播报：\n\n“奉[SPA.GetLeader]陛下之谕旨向各国民报告，前线传来消息，加泰罗尼亚和安达卢西亚的工团匪徒正屡屡受挫，我军不日便将攻占巴塞罗那的赤色巢穴！北方方面，卡洛斯叛匪也节节败退，预计内战将在一周内结束！”\n\n“国王万岁！[SPA.GetName]万岁！”人群一边欢呼着，一边加快了他们宏大的欢乐游行的脚步。而面包房之家的弗兰芒式尖顶角塔则在夕阳的照耀下，在人群的头顶投射下两道尖锐且令人不安的阴影。"
  JAP_pnr_military_events.16.a: "万岁！"
  JAP_pnr_military_events.17.t: "日升时分"
  JAP_pnr_military_events.17.desc: "这里有一个古老的故事：在很久很久之前，这片土地上有着一个强大的王国，有两位弟兄统治着这里，哥哥受到了诅咒是个瞎子，家中有一百位王子；弟弟受到了诅咒面色惨白，家中有五位王子。尽管兄弟二人彼此相爱，五位王子和一百位王子之间则多有冲突：那五位王子体内都有天神的血脉，因此时常凭力量在游戏时欺负一百位王子，这让一百位王子心生妒恨，誓要谋杀他们五人。随着这对国王弟兄的死去，他们的子嗣之间也因阴谋和冲突而走向了无法调和的对立，并最终酿成了一场恐怖的大战。\n\n在战场上，由于双方因兄弟阋墙而感到痛苦，故而约定战争只在白天进行，而日落时分则握手言和，依旧互称以兄弟。这尊贵的盟约时至今日仍令人们在听闻时心怀敬畏。遵着这经时间洗礼仍不失其光辉的古老盟约，日落之前的白日是恐怖厮杀的战场，日落之后的漫长黑夜则赐予精神以安稳的休息，但正如日落之后必是日出，对峙的双方在充足的休息后都已屏息等待着太阳的升起。\n\n“这样就结束了吗？”他倚在半毁的砖墙下发问。\n\n我们还没有讲完这个故事的后半部分，停战盟约履行了十四天。直到五位王子决定祈求天神，让日落虚假地降临在世界上，这让那一百位王子放松了警惕。在那一瞬间，天神解除了幻术，于是五位王子的军队轻易地将对方击败。在那个真正的夜晚里，一百位王子因失去自己的战友，因神圣誓言遭到愚弄而陷入了疯狂与愤怒，在他们的催促和羞辱之下，总司令为了证明自己的忠诚选择打破日落之后停止交战的正法（Dharma），于是厮杀就这样在本应和平的黑夜中延续下去，这古老的盟约早已破碎，亦无人将其视为约束。"
  JAP_pnr_military_events.17.a: "而恒河如今或被朝阳，或被鲜血染红。"
  JAP_pnr_military_events.18.t: "大暴风"
  JAP_pnr_military_events.18.desc: "彼时，那天地间唯一且至大者，用无烟的火创作了神秘精微的精灵，他们隐身在人世间，变形成动物，甚至夸耀自己是世界的统治者，坐在君主的大帐之中。精灵们不受约束，行事自由。米沙勒站在诗人阿沙身旁，用细语（waswas）轻轻浸润他那艺术与美德的心灵；阿比·图玛玛曾向阿姆尔·本·卢海伊揭示神秘的预言，指引他找到古老的异教偶像。恐怖的阿什莫德曾欺骗苏莱曼王摘下戒指，用旋风将他抛到万里之外的旷野；当旅行者走过沙漠山谷，夜幕降临时，有敌意的精灵便会出现杀死他，夺取他随身的财物。\n\n然而更多时候，邪恶精灵中的马里德（Marid）和伊夫利特（Ifrit）将用巫术卷起巨大的暴风，在空中彼此激战。问问从西方来的游牧者们吧，他们会为你亲自描述这战斗的惨烈：他们的怒火将吞噬十支商队，他们的争斗曾摧毁最繁华且虔诚的信士的城市，其繁华程度胜过古老的千柱之城。他们就这样用恐惧支配着人们，并使人们误以为他们乃是天地间的闪亮的真神，至可怖者。催促人们向其献上平息愤怒的祭品来依赖（shirk）其庇护。待到人们俯首称臣，待到对他们的恐惧如血液一样流淌在人们的血管之中，心满意足的精灵便不再卷起风暴进攻，他们转而用这力量摧毁其它不愿臣服于它，称他们为作恶者的的硬颈项的众民。"
  JAP_pnr_military_events.18.a: "他们的名字正是[RUS.GetName]。"
  JAP_pnr_military_events.18.b: "而[JAP.GetName]是信士的援助者。"
  JAP_pnr_military_events.19.t: "外道之王"
  JAP_pnr_military_events.19.desc: "在获得了土登丹增的允许之后，我得以穿过诵经祷告的僧众，进入房间见到了这位尊贵的老朋友。他与我们先前相见时是多么的判若两人，如同一节茁壮的真柏，在正盛时被神灵选作盆栽的材料，制成了神枝（Jin）那样的枯木。疾病竟将他四十岁的身体折磨成这个样子。我走到他面前，在那把或许之前有其它无形的生物坐过的空椅子上坐下。“战争已经开始，”我对他说，“我进藏时来的路，如今已被军队堵塞。”他依旧维持着狮子卧，只是嘴唇嗡动，低声对我说：\n\n“那天上瑜伽的起源之地，最初之王索查德那普于此地领受了释迦的教诲。将有一位神武的转轮王率领十二支天兵神将，奋力投出他的长矛，刺穿外道之王的前胸，随着领袖的一命呜呼，魔鬼也随之全部除尽。”他继续说着，声音比之前更低，“当那勇武的策马者击败一切妖魔，甘丹寺中宗喀巴的陵墓就会打开，释迦的教义将再次广布。等到一千年的安宁之后，四大元素将腐朽，世界将被毁灭，那些幸存的虔信者被莲花生大师的手托上天宫，于是等到无数年之后世界再度成型之时，他们就会从雪山上降下，佛教也随之再度兴起。”\n\n他依然继续说下去，但是我听不见他说的任何一句话了。一旁侍候的土登丹增将其他人招呼进来，低声宣布他已经进入图定（Thugsdam）。\n\n数周之后他将被火葬，那大火熊熊燃烧，让从北方来的[XSM.GetAdjective]看到便畏惧。"
  JAP_pnr_military_events.19.a: "在这之后便是圆满黄金时代吗？"
  JAP_pnr_military_events.20.t: "怀表"
  JAP_pnr_military_events.20.desc: "中国并非是一个铁路网发达的地方，而对于[1083.GetCapitalVictoryPointName]这样位于其疆域边缘的小城市更是这样。渡边一开始计划南下去喀布尔公使馆和驻阿富汗武官宫崎义一见面，顺道合理合法地为自己的工作开几天小差，结果却没想到根本没有南下的铁路网。这下计划泡汤，他只好乘坐这条唯一的横贯铁路，回到[LEC.GetName]的$LEC_national_populist_party$复命。"
  JAP_pnr_military_events.20a.desc: "$JAP_pnr_military_events.20.desc$\n\n[ETS.GetName]已在整个西北站稳脚跟，而他自己则没有这么好的运气：等到了西安转车已经是半夜，还很不幸地下起了雨。渡边索性找了一家附近半掩门的香油坊，给了店主一些钱，先借他店里的门板当床睡一宿。结果第二天醒过来时却是大惊，想不到这门板下面竟还躺着先前在王贵麟那里见过的一个村子里的少年。哈密到西安有两千公里，他坐火车到这里尚需要两日，而这些人虽然因逃难先出发，却能仅凭腿脚行走如此之远，着实令人惊叹。趁着天刚微亮，渡边从怀里摸出那块怀表，走到了里屋那个正在震荡敲击芝麻酱的掌柜面前。"
  JAP_pnr_military_events.20b.desc: "$JAP_pnr_military_events.20.desc$\n\n回程的道路虽然令人感到烦闷无聊，但也是令人稍感放松的经历。偶尔车厢头顶会传来沉闷的踩踏声，偶尔在蒸汽火车不那么吵的时候，他能听到异物被碾压的响声。或许只是心理作用也说不定，总之这些和他无关——在[ETS.GetName]落败之后，他就没有任何意义继续留在那里了。连代理人都消失了，自己为什么还要在那里看军阀互咬呢？在回到[LEC.GetName]的$LEC_national_populist_party$之后，自己一定要把余剩的那好大一笔机密费提出来，在[LEC.GetName]好好地安慰一下自己。至于行动失败的愧疚，那是大人物要考虑的问题，而自己只是个执行人，又有什么好考虑的呢。\n\n他打开随身携带的那块怀表，无聊地开始研究起为什么人类要把时间分成十二个小时。"
  JAP_pnr_military_events.20.a: "请你想办法收留这个孩子。"
  JAP_pnr_military_events.20.b: "那么，千登势，梅月……还是去大胜馆吧。"
  JAP_pnr_military_events.21.t: "西贡之声"
  JAP_pnr_military_events.21.desc: "1862年，蓝白红的三色国旗飘扬在交趾支那的土地上，然后是1867年，柬埔寨原本的绿与黄也被染成了红蓝白三色，最后是东京和安南，“印度支那”就这样被创造出来了；等到那场和人们无关，发生在很远很远地方的战争结束之后，新来到这里的一群人把三种颜色中的蓝色稍稍调暗，换成了黑色继续宣誓他们对这里，这些并不来自这里，也对这里仅知道一个“印度支那”——被创造的名字——的主权。然而她们的名字尚未被所有人遗忘，尽管在断头台前有十三颗头颅滚落，他们的鲜血也悚然喊叫着那遮蔽在“印度支那”之下的众多真名之一。\n\n我造访了[286.GetName]北部的一个小村庄，那里已经夷为平地，光秃秃的土地上突兀地立着两座石塔，那些村民们看清我的面貌之后，都热情地同我交谈。他们告诉我有两位守护神沉眠在这里，在那时为了掩护那支毫无经验的游击队撤退，他们二人在这里阻拦了[GEA.GetName]的陆上军队。神灵的名字，籍贯和部队我一概没有得到。\n\n我写这些的意图读者已经很明确，在战争结束之后，我立刻进入到西贡就是为了探清究竟发生了什么。"
  JAP_pnr_military_events.21a.desc: "$JAP_pnr_military_events.21.desc$随着越盟彻底控制了整个地区，盘踞于[336.GetCapitalVictoryPointName]的[GEA.GetLeader]集团以及他背后的柏林主子不得不承认他们的失败，越盟的胜利不仅粉碎了帝国主义者的强大神话，更为这个世界上更多在殖民者铁蹄之下仍未放弃斗争的解放者们揭去那虚假名字的希望。我见到了阮安宁，想从他那里得到什么东西，他给了我一颗有点笨拙的肮脏纽扣，尽管有所磨损，但我看出来上面有五七桐纹的图案。"
  JAP_pnr_military_events.21b.desc: "$JAP_pnr_military_events.21.desc$我持有法国护照——然而这并未减轻当局对我的怀疑。[GEA.GetName]的治安战仍未停止，每天都有连续不停的响声从西贡大监狱的高墙之内传来。我找遍了这里也没有找到，我想石井先生和其他人现在不在这里，他们一定是同越盟中的其他人一道，和阮安宁一起跨越了那死生的界限，去了某个地方。\n\n关于那些出发者留下的遗物，我什么也没找到。就带回了一块碎的不成样子的砖头，希望能以此铭记所有迈过那界限的魂灵。"
  JAP_pnr_military_events.21.a: "大好时节正值百花绽放。"
  JAP_pnr_military_events.21.b: "在西贡传来的只有帝国战旗的响声。"
  JAP_pnr_military_events.22.t: "骚乱结束"
  JAP_pnr_military_events.22.desc: "[289.GetCapitalVictoryPointName]传回消息，近日因“黄皮档案”而引发的[SIA.GetName]内战已经结束。"
  JAP_pnr_military_events.22a.desc: "$JAP_pnr_military_events.22.desc$就和我们预料中的一样，王室坚定了他们的位置，再无任何人能够威胁他们对[SIA.GetName]的合法统治了。"
  JAP_pnr_military_events.22b.desc: "$JAP_pnr_military_events.22.desc$出人意料的是，人民党的政变最终得胜，如今整个[SIA.GetName]已被议会控制。我们无法确定它的未来如何。"
  JAP_pnr_military_events.22.a: "此事平平无奇。"
  JAP_pnr_military_events.22.b: "这也能输吗？"
  JAP_pnr_military_events.23.t: "疲惫"
  JAP_pnr_military_events.23a.desc: "如果我们能以不流泪的双眼靠近，目睹你的悲恸，心中岂能冷酷无情？\n\n如此景象，无需泪水，无需叹息。\n\n这些荒凉的遗迹，是崇高的战利品，彰显着和平公民美德中蕴藏的非凡勇气。\n\n它们向后世证明你无与伦比的价值。\n\n鲜血在你眼前无情流淌；疾病吞噬了你的生命；\n\n战争如火山般席卷了你脚下的土地，可怕的考验！\n\n你却勇敢面对并坚持了下来，\n\n直到所有希望和帮助都已消逝。"
  JAP_pnr_military_events.23b.desc: "遵循古老的仪式，粗犷的比斯开人，\n\n当他们的孩子在纯洁无罪的婴儿时期夭折时，便会为安详的遗体穿上洁白的祭衣；\n\n如同象征着无云的胜利，他们用纯白玫瑰的花环，为这无辜的生命系上幸福的额头；\n\n随后，一群欢庆的人们齐声歌唱；耶稣的十字架高高举起，在前行的队伍中，人们将孩子抬出，敞开怀抱，送往它的墓穴。\n\n墓穴合上——母亲悲痛欲绝，这是她必须承受的；\n\n但很快，凭借着基督教的信仰，悲伤便被抑制；喜悦重返，照亮了坚韧的心灵。"
  JAP_pnr_military_events.23c.desc: "他们追逐，也被追逐；\n\n每日奔赴战场，即便寡不敌众也毫不退缩，因为他们已学会如何开辟和封堵残酷战争的堤坝；\n\n他们的首领，是昔日祖国孕育或扶持的将领，自力更生的领袖——\n\n如同那些令罗马帝国胆寒的对手；迦太基人曾因他们的猛烈冲击而溃逃。\n\n一位默默无闻的牧羊人，其身上仿佛重现了维里亚图斯的英勇；\n\n而米娜，在书香的荫蔽下成长，与那位伟大的领袖争锋相对，他厌倦了纷争和流血，\n\n渴望在西洋某处绿意盎然的岛屿上安息。"
  JAP_pnr_military_events.23.a: "面包房之家依然留在那里。"
  JAP_pnr_military_events.23.b: "随后，我见那旋风中，显现出神的面容。"
  JAP_pnr_military_events.23.c: "火炬就这样被点燃了。"
  JAP_pnr_military_events.24.t: "之后发生了……"
  JAP_pnr_military_events.24.desc: "1927年的某个夜晚，交战的激情已随着时间被磨损殆尽，和平的渴望静悄悄地爬上了折断的战旗。跨越温迪亚山脉，一座孤寂的宅邸中大人物们齐聚一堂，他们彼此争执，眉头紧锁。他们每个人确信自己来到这里都是怀抱着公正的心灵，执行着无偏的划分，随后每个人都在地图上画下一道漂亮的线。在他们面前，印度次大陆如同待分割的某只牲畜，他们望向这在小小方桌上便能铺展开的庞大大陆，目光之中充满了对使命的狂热。共识被推翻，地图被替换，和解与辩论的虚像之中隐藏着对铅笔线的涂抹，然而时间，最珍贵的时间迫使他们立刻给出成果。"
  JAP_pnr_military_events.24a.desc: "$JAP_pnr_military_events.24.desc$\n\n“既然如此我们将在南方统治，既不打扰也不被打扰，既不索取也不被索取。”胸前层层的祖母绿和珍珠摇动，他划下一条线保护诸王公的宝库。为这结果三位大人物各自作出了远超出另两人的牺牲，次大陆就这样被分割开来，数千万人的命运都因这条线而改变。人们本以为这条线将横亘在大陆上直到被时间变成理所当然，直到那些未出席会议的人们用他们的血模糊了它。\n\n1927停火如今已成历史，所画下的铅笔线已经褪色。当骑白马者掠过大地，回归天上，二十一响礼炮为他的离去而欢送，如今印度终究合一，而他的统治将开启下一个完美的真理时代。"
  JAP_pnr_military_events.24b.desc: "$JAP_pnr_military_events.24.desc$\n\n“把命运交给自然边界决定，”在场那唯一的白人这样说，“难道我们还能希求更多？拉杰普纳塔和旁遮普，交给我们这些便已足够。”他划下一条线宣称帝国褪色的珠宝。为这结果三位大人物各自作出了远超出另两人的牺牲，次大陆就这样被分割开来，数千万人的命运都因这条线而改变。人们本以为这条线将横亘在大陆上直到被时间变成理所当然，直到那些未出席会议的人们用他们的血模糊了它。\n\n1927停火如今已成历史，所画下的铅笔线已经褪色。那位对踏上次大陆领土漠不关心的皇帝如今再次宣誓自己对这里的主权，他从未亲眼见过这片于他而言恒久统治的土地的方方面面，只是有人把它塞到了自己手中。而他，蒙上帝护佑者，将再度散发璀璨光芒的明珠装在了自己王冠的最顶端，那象征所有权的最高处。"
  JAP_pnr_military_events.24c.desc: "$JAP_pnr_military_events.24.desc$\n\n那身穿双排扣海军蓝西服的印度律师划下两条线宣告社会主义在次大陆的阶段性胜利：“我们不会索取更多，我们不愿流下更多印度的鲜血。德里宣布了我们对帝国主义的挫败，巴罗达预示着我们能令封建王公们屈服。”为这结果三位大人物各自作出了远超出另两人的牺牲，次大陆就这样被分割开来，数千万人的命运都因这条线而改变。人们本以为这条线将横亘在大陆上直到被时间变成理所当然，直到那些未出席会议的人们用他们的血模糊了它。\n\n1927停火如今已成历史，所画下的铅笔线已经褪色。当印度教徒与穆斯林们一同迈入水神朱雷拉（Jhulelal）的庙宇，他们为伐楼那（Varuna）和卡兰达尔（Qalandar）献上各自的祈祷。在那不为人知，超越了时间的白色穹顶下，人们怀揣着最虔诚的心，向那些安眠的无名者们抛洒玫瑰花瓣。"
  JAP_pnr_military_events.24.a: "惟有真理得胜。"
  JAP_pnr_military_events.24.b: "天佑吾王。"
  JAP_pnr_military_events.24.c: "母亲，我向你鞠躬。"
  JAP_pnr_military_events.25.t: "猎熊者"
  JAP_pnr_military_events.25.desc: "胡代别尔迪是游牧民，和自己的马相伴而生，而如今他却要用自己的双腿在地上奔跑。更何况他从来没见过熊，这世界哪儿有熊会出现在沙漠之中呢？他拼了命地一边向前跑，一边把子弹装入到自己的步枪里面。那头巨大的熊就站在地平线上对着他发出低沉的咆哮，它是那么地庞大，其身躯遮蔽了光芒，几乎占领了整个世界。巨熊挥舞着两只厚重又尖锐的熊掌，试图激活他的本能反应，这样他一转身，那厚实的一爪就能从他柔软的后背处夺去他的性命。\n\n他纵深一跳激起沙尘，努力让自己变得没那么显眼，匍匐在地上瞄准了这只残暴的生灵。透过这支步枪的准星，他看到那比自己更快的骑兵队们向着巨熊冲过去，然后在那一瞬间生命便戛然而止地倒了下去。“哎呀！死东西！”他抱怨一声，接连打出五六颗弹丸。"
  JAP_pnr_military_events.25a.desc: "$JAP_pnr_military_events.25.desc$\n\n然而巨熊似乎发现了他和他的朋友们所在的位置。它大叫一声，紧挨着自己的那个人立刻眼球向前凸出一下，直直地趴了下去；它挥舞了一下爪子，身旁的那支小队就被震飞到空中。巨熊的行动多么灵巧轻盈，眼见它已走到眼前，胡代别尔迪为步枪装上了刺刀。战斗直到夜晚才终结，他和他余生的朋友们从巨熊那如山洞的嘴巴般进去，将军事地图从中带出作为猎熊的证明。"
  JAP_pnr_military_events.25b.desc: "$JAP_pnr_military_events.25.desc$\n\n钻心的疼痛激发了巨熊的怒火，它发出震天动地的吼叫，向世界宣告它已发现了这些试图伤害它的猎人。胡代别尔迪和他的朋友们立刻被随之而来的冲击波掀到空中，重重地摔到沙漠里失去了意识。等到战斗结束已是夜晚，他躺在那个沙漠里的弹坑里，被打扫战场的人用枪托敲醒。他和那些还有气息的人被编好队，而巨熊张开了他的嘴巴，把他们全部吞入自己腹中。"
  JAP_pnr_military_events.25.a: "时代的主宰令多少人折戟于此。"
  JAP_pnr_military_events.25.b: "纵使再多鲜血浇灌，自由之花也未曾盛放。"
  JAP_pnr_military_events.26.t: "铁鸟"
  JAP_pnr_military_events.26.desc: "在西藏地区的古老传说中，当钢铁之鸟在天空中飞翔，当钢铁之马在大地上奔驰的时候，愚痴与贪婪将统治整个世界。外道之王将率领妖魔们在大地上横行霸道，他们不信因果，摧毁寺庙，屠戮生灵。直至末劫到来，一位神武的转轮王，被称为香巴拉的碎魔轮王（Rudra Chakrin）将会从圣地现身，对于行善者，他示现寂静之相；对于外道军众，他化身摧灭者。于是他将带领十二支天兵与无可计数的神将，乘坐着风轮与神车来到人世间，与外道之王的军队决一死战。届时，世间正义的诸神都将从圣地出发，协助转轮王击败外道。神将们将喷出火焰，焚尽妖魔；战象化为千百倍大，消灭敌军。外道之王将卷起地水火风四大元素同转轮王征战。"
  JAP_pnr_military_events.26a.desc: "$JAP_pnr_military_events.27.desc$\n\n“那么他们谁最后赢了？”布赤躺在格桑德吉的腿上，“他们进行大战，其他人会怎么样。”\n\n在这场终极决战中，转轮王将投出耀眼的金色法轮，这法轮将撼动地、水、火、风四大元素，消灭三种毒物，五种害物。将除了神圣都城香巴拉之外的一切世界悉数摧毁，至此佛法重新兴盛，大地进入安乐的时代。\n\n格桑德吉用自己唯一的那只手指给布赤看远处的那座山，那是宗穆玛釉玛。"
  JAP_pnr_military_events.26b.desc: "$JAP_pnr_military_events.27.desc$\n\n“记住这个，记住转轮王的征战。”次捷紧紧握住她的手，“只要你不忘记他，他一定就会回来”。\n\n那个九本眼见已经把村子里能搬完的东西都搬走了，就催促次捷立刻和他们走，以履行乌拉（Ulag）的义务。"
  JAP_pnr_military_events.26.a: "山体赤红，一如鲜血浇灌。"
  JAP_pnr_military_events.26.b: "直至现实侵入传说。"
  JAP_pnr_punch.1.t: "跳入混乱"
  JAP_pnr_punch.1.desc: "你叫山本还是佐藤，你是北陆石川县出身，所以可能是叫山本。但这都不重要，你只需要知道你需要大开杀戒了。佐藤先生，你是院外团的一员——正所谓樱花总在四月盛开，台风总在九月来袭，院外团总是会在众议院开会的时候也如期而至。在古老的时代，有名誉的人总是用刀剑解决争端，这足以证明暴力本身也是解决辩论问题的一个选项。院内团指的是经选举赢得议席，进入到议场之内的人组成的团体；院外团则是由在议会选举中落选的议员和未来将要参加选举的党人组成，这些“知识分子”名义上带领着一群渴望建功立业的好战青年。但实际上前者的暴力程度或许不会输给后者。\n\n在帝国议会刚刚诞生的时刻，院外团也就跟着出现了。1890年7月的第一次众议院选举中，那些前辈们冲进候选人的集会然后殴打绑架他们的选民，让他们没办法按时投票。在那个黄金时代，只有1%的日本人拥有投票权，所以直接去攻击选民显然是一种能有效干涉选举结果的高收益手段。可惜好日子已经过去了，田中先生，现在是男子普选的时代，在路边随便抓个路人殴打一顿不但对选举影响结果不大，还会连带着让你蹲几天。所以现在院外团主要负责维护秩序，进行警卫工作。只要议场里面一声令下，你只管冲进去见人就打就是了。"
  JAP_pnr_punch.1.a: "该打人了。"
  JAP_pnr_punch.1.b: "我要再想想院外团的职责。"
  JAP_pnr_punch.2.t: "缠斗"
  JAP_pnr_punch.2.desc: "中村先生一下子就跃到离发言台最近的那张议会桌子上，他蹲在那里，眯起眼睛寻找着自己的对手。此时一个手持厚文件袋的家伙和他四目相对：就是他了，既然目光相交就必须分出高下。吉田握紧了手里那根临时拆下来的椅子腿，而那个用文件袋当武器的家伙也小心翼翼地向他走了过来。\n\n山田先生摆出了架势，所有可能的战术都被思考过了，他心中思忖着要如何给对方一击取得优势。\n\n你当前的生命值为§G[?JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.2.a: "从桌子上发动突袭。"
  JAP_pnr_punch.2.b: "给他一棍。"
  JAP_pnr_punch.2.c: "我看到了桌子上的姓名牌。"
  JAP_pnr_punch.2.d: "防御。"
  JAP_pnr_punch.3.t: "历史的反复"
  JAP_pnr_punch.3.desc: "哎呀，看来前田先生忘记了一件很重要的事。大正九年，也就是1920年，在帝国议会中曾经发生过一场了不得的议会暴力事件，那时候众议院惩罚委员会的委员，立宪政友会的赤尾彦作前辈曾经因反对党的激烈狡辩而感到恼火，所以决定好好教训一下这个舌灿莲花的诡辩家，他直接抓起座位上的姓名牌冲到讲台上，与当时正在发言的三木武吉像是洗土豆一样扭打在了一起。毕竟在要批评这些只会说大话的家伙的时候，谁会不期望得到一件趁手工具呢？这块长30厘米，宽10厘米的木板简直是无法携带武器的帝国议会中最好的道具之一。但正是因为这位惩罚委员稍微激动了一点，在他被移交给众议院惩罚委员会之后，帝国议会就连夜把姓名牌从可拆卸的改成固定在桌子上的了。这是个没什么趣味性的历史小知识，不过它现在可要了你的命了，十二町先生。你在桌子上拽了快一分钟了，但那块姓名牌纹丝不动，而对方则拿着文件袋冲过来给了你好一顿毒打。\n\n你当前的生命值为§n[?JAP_pnr_your_punching_life_var|0]§!\n反对党当前的生命值为§R[?JAP_pnr_enemies_punching_life_var|0]§!"
  JAP_pnr_punch.3.a: "我怎么会记得这种事！"
  JAP_pnr_horsing.1.t: "1936年中山纪念赛马小游戏事件"
  JAP_pnr_horsing.1.desc: "[JAP.GetLeader]其实是个资深的赛马迷，1936年10月18日的中山纪念赛吸引了许多观众，自然也吸引了他本人。共有7匹赛马参赛，其中母马2匹，公马4匹：亚特兰大，外祖父 Diamond Wedding 的父本 Diamond Jubilee是英国三冠马；\tクレオパトラトマス；ツキヤス；\tスモールジヤツク；フソウ；サイコウテン和イワタダ。"
  JAP_pnr_horsing.1.a: "依我看，亚特兰大没有输的理由。"
  JAP_pnr_horsing.1.b: "クレオパトラトマス可是月城一脉。"
  JAP_pnr_horsing.1.c: "扶桑绝对能胜利，扶桑！"
  JAP_pnr_horsing.1.d: "老骥伏枥，志在千里。期待伊瓦塔达爆冷。"
  JAP_pnr_rs.1.t: "秘密调查"
  JAP_pnr_rs.1.desc: "或许海军就和他们表现出来的一样，在他们的舰船中确实隐藏着不得了的秘密。最近愈演愈烈的赤色阴谋风波招致了本就偶有合作，经常不和的陆海军之间的矛盾的进一步加深。陆军军务局怀疑先前那些关于海军内部的传闻和谣言或许有几分真实性在其中。事实上，在陆军中长期都存在着这样一个传说：据说在海军里有一个秘密的日本共产党细胞，在之前的多次内部调查中都掩饰得极好。而它未被拔出的原因便是在海军军令部中有很多布尔什维克主义同情者，他们之中不乏高官，正是他们协助掩护了这个细胞的秘密延续。当然一个根本找不到的组织最多只是活在大家打牌消遣时嘴里的谈资，并不会对现实造成什么实际影响。更何况，这个传说本身可能就是陆军自己出于某种偏见被创作出来的——甚至可能就是在1932年阪口喜一郎被共产党渗透时期创作出来落井下石的东西。\n\n但随着最近对于“赤色阴谋”的担忧逐渐升起，陆军内部又开始郑重对待这个故事。先前从海军官兵宿舍中搜出《赤旗》的事件如今已经人尽皆知，这无疑是海军很可能遭遇共产党渗透的证据之一。而对于该事件海军自己却在草草调查之后便宣布“没有问题”，快速结束了整个流程。我们当然可以相信海军自己的调查结果，但如果那个故事是真的呢……"
  JAP_pnr_rs.1.a: "我们最好组织自己的调查。"
  JAP_pnr_rs.2.t: "传闻显现"
  JAP_pnr_rs.2.desc: "我们先前对海军展开的独立调查浮现了令人担忧的结果，虽然我们没有发现能够直接证明海军已经遭到赤化渗透的证据，但我们确实发现了有关海军内存在的阴谋集团的一些线索。\n\n在接触了几位海军军官并拉近彼此的距离，并向其表达了“国家改造”的想法之后，他们很快将自己知道的情况和盘托出了：根据他们的说法，海军中的确存在着一个广泛活跃的，“为国分忧”的秘密团体。该团体主要由中层佐官和下层尉官组成，是藤井齐的“王师会”的继承团体。藤井齐是一位海军内部的狂人，曾经试图策划让[FNG.GetName]的中国人杀死日本人来引发日奉冲突，在国家内部陷入混乱时派出决死队在国会开会时闯入自爆以发动革命。然而这位狂人和他的政变计划最终砰然坠地，摔得粉碎——藤井齐在一次航空事故中不幸坠机，“王师会”也就此陷入沉默。\n\n值得注意的是，先前引发五一五事件的几名海军军官就曾参与过“王师会”，考虑到司法省的调查结果表明他们受到了布尔什维克主义的蛊惑，想必这个赤色阴谋集团的存在已经是板上钉钉了。"
  JAP_pnr_rs.2.a: "我们离真相越来越近了。"
  JAP_pnr_rs.2.b: "不太对劲，就到这里吧。"
  JAP_pnr_rs.3.t: "恐怖的政变计划"
  JAP_pnr_rs.3.desc: "我们的调查人员终于抓住了他们的狐狸尾巴，如今真相水落石出，但其沉重恐怕远非我们能承受。事实上不仅仅是海军，陆军内部也有人被卷入了这个阴谋集团之中。更令人畏惧的是，他们已经有了相当成熟的政变计划。\n\n循着手头的线索，我们的调查人员找到了东京新桥的一家高级料亭，桝田屋（Masudaya）。在那里我们见到了整个组织的主谋者们，其中既有海军成员也有陆军成员。一开始的对话都十分正常，但随着与会人员喝下越来越多清酒之后，他们开始断断续续地大声讲述各种恐怖的事情。\n\n在调查人员借此机会表明自己也有“扭转日本国民精神”的愿望之后，他们立刻向调查人员展示了一份一直放在桌子下面的可怕计划：根据该计划书，他们将首先鼓动海员工会在内阁召开五相会议或是国会开会的当天突然举行总罢工并要求内阁辞职，随后在警视厅出动镇压罢工时，派出敢死队引爆东京各大电厂制造混乱，而后贯彻“血盟团”的一人一杀主义，杀死所有元老重臣和另外一份长名单上的全部人物。\n\n在得到了该消息后我们的调查人员借口推辞迅速离开了现场，正好在门口遇到了之前的那几位海军军官，看来他们也是这个阴谋集团的一员，只是之前对此有所掩饰。"
  JAP_pnr_rs.3.a: "骇人的计划！不要打草惊蛇……"
  JAP_pnr_rs.3.b: "听上去只是酒后狂言。"
  JAP_pnr_rs.4.t: "反调查"
  JAP_pnr_rs.4.desc: "惊人的消息！在发现陆军鬼鬼祟祟地调查我们之后，我们派出反调查的人员确认了一个不得了的事实，陆军内部居然在酝酿着一个可怕的政变计划，而海军中的一些人也对此有所响应！看来他们对我们的调查正是为了确保我们对该计划了解多少，却反而令他们暴露。\n\n我们的调查人员伪装成海军里的“忧国志士”去接触了一些中下层陆军军官，在拉近距离之后他们立刻向我们吐露了希望进行“国家改造”的想法，随后对他们进行的跟踪将我们引到了东京中心圈的某座高级料亭中，在那里我们发现这个阴谋集团的参与者除了陆军之外，还有不少中坚海军军官。他们可以被称为“锦旗共产党”，是纯粹希望假借天皇的名义发动叛乱的组织。他们的计划极为详细，可以说到了随时都可能实施的状态：首先选择国会议员一同开会的某一天，和民间团体合作出动五千人包围国会，随后借助平叛的借口迅速集结出兵。一支小队将先占领警视厅，一支小队突袭国会杀死会场中的所有内阁成员。同时派出别动队消灭所有元老重臣，余剩所有兵力都将集结在半藏门，联合近卫师团攻入宫城直取皇居，必要时刻将出动4架陆军战机进行扫射，迫使天皇陛下在他们酒席间拟好的矫诏上签字。\n\n我们的调查人员称其在料亭中亲眼看到了那份矫诏，预定的内阁名单里有许多陆军内部的高官姓名，到时候甚至连海军大臣都由陆军大臣兼任。"
  JAP_pnr_rs.4.a: "谁还可以信任？一定要保密。"
  JAP_pnr_rs.4.b: "……少喝点吧。"
  JAP_pnr_rs.5.t: "抵抗恶法"
  JAP_pnr_rs.5.desc: "针对《国家保安法》的争论已经到了白热化，东京圈内几大有影响力的媒体就本法最终是否能平安通过的预测上彼此之间产生了冲突。一些媒体认为在[JAP.GetLeader]的政治手腕之下，该法案将毫无悬念地通过，届时[JAP.GetName]将迎来“复活的田中义一”；也有一些不那么悲观的媒体认为该法案在经过议会内的博弈之后将变得更温和，对未来持乐观态度。而今天稍早些时候，加藤勘十已经公开宣布他和他的[JAP_pnr_syndicalist_party_name]将会缺席《国家保安法》的表决，以此来表明工人阶级绝不支持这部恶法。\n\n当然，[JAP_pnr_syndicalist_party_name]除了在媒体上发表声明外还策划了别的计划，他们已经纠集了几百名工人，计划在《国家保安法》表决当天在帝国议会临时议事堂前进行游行示威，当为国会投票提供安保的警察和游行队伍产生冲突时，将会有几位美国记者和德国记者“恰巧”路过此地并“恰巧”抓拍下他们。"
  JAP_pnr_rs.5.a: "就在《国家保安法》表决那一天。"
  JAP_pnr_rs.6.t: "陆军动手了！"
  JAP_pnr_rs.6.desc: "最近东京的气氛被《国家保安法》搅得浑浊不堪，本以为今天便是结束这污浊的日子，没想到陆军偏偏挑这个时候下手。首先是陆军假借因为社会对《国家保安法》不满所以要提高临时国会附近戒备的理由要求警视厅投入更多警力，而他们也在霞关布置了更多兵力。\n\n陆军的行动激起了海军的警惕，横须贺镇守府的几只舰艇在稍后就以基础操练为由进入东京湾内，紧张监视着陆军的一举一动。随后海军进一步发现，陆军开始将一部分兵力部署在变电设施和发电厂附近，与此同时远超“维持秩序”所需数量的陆军正在赶往霞关，而观察员还注意到，有一小股民间抗议游行队伍正在从另一边前往临时国会，恐怕接下来陆军就要借镇压之名发动他们的政变计划，劫持天皇，实现他们的野心了！如今情况如此紧迫，我们必须快速行动，拯救陛下，拯救[JAP.GetName]！"
  JAP_pnr_rs.6.a: "方向七六，高低三五！"
  JAP_pnr_rs.7.t: "陆军赤化？"
  JAP_pnr_rs.7.desc: "在反调查之后，海军认为陆军才是赤化阴谋的一部分。大川周明的包围国会计划。"
  JAP_pnr_rs.7.a: "必要时刻盯紧他们，盯紧桥本欣五郎。"
  JAP_pnr_rs.8.t: "孤垒"
  JAP_pnr_rs.8.desc: "山本宣治前往国会"
  JAP_pnr_rs.8.a: "这是赌博，还是静待时机。"
  JAP_pnr_rs.8.b: "必须有人在议会中捍卫民主。"
  JAP_pnr_rs.9.t: "焦苦之物"
  JAP_pnr_rs.9.desc: "时间已近六月，天气也一天一天地热起来了。在风见章被迎进屋内之前，他始终看着那颗靠近路边的白菜。那是播种后六十天即可结球的新品种。它卷得太饱满，死死地向内抱住，但长得小而可怜。等到他进到屋内的时候，就从土里的白菜味转换成了煨白菜的味道了。那个人就坐在那里，一只手耷拉在桌子下面，升腾起缭绕的烟雾。\n\n“您今年也很精神，白菜的情况怎么样？”“农会开出的价格让人失望，但就算这样，去年准备绑白菜的红纸都没有用完，实在艰难，不过已经难了很久了。只是今年突然就又坏起来了，我没有进城，但是农会的人说城里也出了大事。”“是这样，城里，甚至是这个世界都出了很大的事情。”\n\n“城里做什么我是不管的，就是天皇死了，我想也和我这样的人无关。”背后厨房里锤了锤砧板，打断了这微妙的发言，“唉呀风见先生，还是不要聊这般悲伤的事情了。至少我还是认识您的，您总是来我们这什么也没有的地方。我现在也没有什么好东西，请您先尝尝这个润一润喉吧。”生姜一样的手指把从背后厨房里探出的那小碟接过来，上面是裁得方正的油纸，攒着一座褐红色的小土堆——那是在工厂中经离心之后和甜蜜的白砂糖分开的赤砂糖，只是价值极低的，散发着廉价甜味的，带着浓烈焦苦味道的副产物。\n\n在绢川村见不到东京和果子店里用白砂糖制的精美的上生果子，但在离心出来前，白砂糖和赤砂糖都有着根本的相同起源，因此约莫算是一种东西。风见章看了看眼前的那只嵌着煤烟和泥土的手，把裁好的油纸接了过来。"
  JAP_pnr_rs.9.a: "“——感谢，砂糖很甜。”"
  JAP_pnr_rs.9.b: "“我想做一个请愿，递到议会。您只是画一个圈也会很有帮助。”"
  JAP_pnr_foreign_events.1.t: "联帅治下八省不和"
  JAP_pnr_foreign_events.1.desc: "躲在黑鹰翅膀之下的$LEP_LEP_REP_governorate$因为短视而暴露出了弱点。随着$LEP_LEP_REP_governorate$将数条铁路出售给他们的德国主子，在$LEP_LEP_REP_governorate$产生了一场愈演愈烈的，针对[LEP.GetLeader]的反对浪潮。而在这场反对浪潮之中，他手下的一位地方军阀，$ANQ_chen_tiaoyuan$展露了反抗的野心，公开同[LEP.GetLeader]对立。[LEP.GetLeader]是[GEA.GetName]在东亚地区的一枚棋子，他的对手则名义上是一位主张独立自主，主张驱逐外国人（尤其是德国人）的民族主义者，这位民族主义者目前摇摆不定，或许我们可以找个机会在暗中推他一把，让他不再踌躇。\n\n暗中投资$ANQ_chen_tiaoyuan$是个有风险的选择，他虽然是潜在的合作对象，但我们没办法确定这家伙是单纯打出反对德国人的旗帜来聚拢人心，还是说真的是个言出必行，要把所有外国人都驱逐出去的傻子。但如果$ANQ_chen_tiaoyuan$最终能倒向我方，那将对帝国的对华政策相当有利：其一是[FNG.GetLeader]并不是一位合格的代理人，暗怀二心的[FNG.GetName]此前就曾多次尝试挣脱我们的束缚；其二是在华东地区获得一位帮手将有助于我们在中国最富庶的区域建立起另一个对抗德意志帝国主义的前线基地。其三则是关东军，以$JAP_tojo_hideki$为首的关东军集团将自己和[FNG.GetName]之间在多年里培养出来的互信关系用作和东京谈判的筹码，他们自称为最了解奉天实际情况的人，从而强硬要求东京在各项对[FNG.GetName]事务上必须要参考他们的意见，不然他们无法保证[FNG.GetLeader]和东京之间的合作愉快。这些家伙为了证明自己的重要性，不惜纵容[FNG.GetName]屡屡破坏我国在东北的权益，并反过来借此要挟我们。关东军、天津军和上海军之间的微妙平衡正随着关东军的愈发狂妄而逐渐被打破。如果东京能在更南方的位置确保一个潜在的合作者，便可以借此削弱关东军在大陆上一家独大的影响力，并安抚躁动不安的天津与上海军。况且如果能拉拢更多合作者，或许帝国无需发动一场直接性的战争便能在东亚确保更多利益。\n\n如今华东的紧张气氛不上不下，是时候给他们添一把火升升温了。"
  JAP_pnr_foreign_events.1.a: "密电上海军，准备行动！"
  JAP_pnr_foreign_events_new_decision_unlock_tt: "§a一系列全新§Y大陆干涉§!决议已在£GFX_decision_icon_small §Y$JAP_pnr_kasumigaseki_diplomacy_category$§!决议组被解锁。§!"
  JAP_pnr_foreign_events_new_decision_unlock_no_category_tt: "§a一系列全新§Y大陆干涉§!决议已在£GFX_decision_icon_small §Y$JAP_pnr_kasumigaseki_diplomacy_category$§!决议组被解锁。但你目前仍未完成国策§t$JAP_pnr_kasumigaseki_diplomacy$§!§!。"
  JAP_pnr_foreign_events.2.t: "社会声援反租界运动"
  JAP_pnr_foreign_events.2.desc: "随着社会上对$LEP_sun_chuanfang$和$LEP_qi_xieyuan$将铁路出售给德国人，以及后续在群众游行时制造流血冲突的声讨越来越猛烈，这两人在民间已被塑造成屠杀中国人的恐怖汉奸和德国鹰犬。而站在他们对立面的[ANQ.GetLeader]则自然而然地被塑造成了拯救中国于德意志帝国主义势力的救世主和“开明军阀”。$LEP_LEP_REP_governorate$的多家报纸都盛赞[ANQ.GetLeader]是一位爱国的行动者，并呼吁人们支持这场“中华民族独立的大圣战”。不止中国报社，在租界里流通的国际报纸也报道了这件事，他们认为在当今帝国主义横行霸道的当下，[ANQ.GetLeader]的“反租界”旗号无疑是中国人民意识觉醒，反抗欧洲白人帝国主义的一大标志。这些国际报道在对[ANQ.GetLeader]的行动表示同情之余，还呼吁[JAP.GetName]尽快和[ANQ.GetName]进行接触，作为先行者支援这些“反帝国主义斗士”。"
  JAP_pnr_foreign_events.2.a: "我们站在广大中国人民的一边！"
  JAP_pnr_foreign_events.2.b: "说起来，这几家中国报社背后也是日本人……"
  JAP_pnr_foreign_events.3.t: "青年义勇军前来帮助我们"
  JAP_pnr_foreign_events.3.desc: "由于反租界运动与日俱增的威望，每天都有人前来投奔对抗帝国主义者的盟主[ANQ.GetLeader]。如今安徽境内聚集了大量发誓要诛杀汉奸，打破中国人身上的德国枷锁的热血青年。我们的队伍虽然每天都在变大，但装备的数量却跟不上我们队伍的扩充速度，军备不足的梦魇始终萦绕在我们的头顶。\n\n不过这一情况如今得到了改善，一位来自上海的匿名富商是我们反德运动的同情者，他为我们准备了一大批军火免费送给我们，支援我们对抗德意志帝国主义的行动，现在我们可以用这些武器武装更多的部队了。"
  JAP_pnr_foreign_events.3.a: "公理站在我们一方！"
  JAP_pnr_foreign_events.3.b: "这些都是日式武器，是从奉天走私来的吗？"
  JAP_pnr_foreign_events.4.t: "撕下面孔"
  JAP_pnr_foreign_events.4.desc: "就像[ANQ.GetLeader]之前隐约感觉到的那样，在“反租界”运动的背后，确实有一个戴假面的人正在行动。而此人如今摘下了他的面具——正是[JAP.GetName]。一位长期混迹于华东地区的日本个人雇佣兵，也被称为大陆浪人的人请求与[ANQ.GetLeader]见面，他称自己是末永节，1911年曾追随孙中山参加过武昌革命。他这次前来是代表[JAP.GetAdjective]政府向我们摊牌。[JAP.GetName]希望更进一步支援[ANQ.GetLeader]及其反租界势力对抗德意志帝国主义的走狗[LEP.GetName]，从而将德国鬼子驱逐出亚洲，并真正实现亚洲人的亚洲。\n\n他向我们保证，如果我们愿意和[JAP.GetName]携手共进，那么东京将会提供一切可能的支援，帮助[ANQ.GetLeader]实现他对华东的完全控制。而[JAP.GetName]的援助计划也会比我们已经接受的要更庞大。尽管这位“中国通”嘴上说的好听，但[ANQ.GetLeader]明白日本人并不比德国人安全多少。现在的问题是我们是否要为了当下的利益接受他的邀请，冒着未知的风险与日本人展开合作。"
  JAP_pnr_foreign_events.4.a: "陈长官，你可不能当汉奸啊。"
  JAP_pnr_foreign_events.4.b: "哈哈，还是辛亥革命的老味道。"
  JAP_pnr_foreign_events.5.t: "老朋友"
  JAP_pnr_foreign_events.5.desc: "南平因为靠近龙岩，一向被政府认为是那群土匪暴徒们经常出没的地点。尤其是之前先是铁路遭到破坏，后又是孙联帅被一个伪装的女佣刺杀。[LEP.GetName]早已下令对自己所能控制到的区域内的各地来往人员和行李严加盘查，至于像南平这样的重点区域，则由警察和部队直接在车站的出口设卡盘查。前面那个女人的布袋子被刺刀划开，衣服簌簌地掉了一地，把许多人都拦在了原地。后来大家实在是等不及了，便也直接一人一只脚地从那些衣服上踏过去。等轮到他的时候——他可不怕那虚张声势的刺刀和帽徽——他直接哼了一声，没打开皮箱，只是从胸前口袋里把十六瓣菊花微微拾起来，那先前耀武扬威的家伙立刻换了笑颜，也不管后面乌泱泱的人群，只顾热切地给他指路如何去龙岩积灵宫，并故作推辞地收了他的日元。这位“好心人”还不忘建议他要小心山里的赤匪。\n\n等他到了龙岩的“赤匪窝点”的时候已经是下午四点了，他把帽子挂在衣架上。给了老朋友的遗孀一个拥抱。随后打开箱子，从箱中网栏，饼干下方的夹层里取出了那些钞票。\n\n“这是我从东京筹来的一部分钱，此外还有一笔不大不小的汇款，是另一个命不久矣的朋友在病床前托给我的。”他把钱放在那张木桌上，和女人并排而坐。而对方则把手搭在他的肩膀上，以赞许夹杂着安慰的力道抚摸着。\n\n短暂的沉默之后，他终于从那或许是北京，或许是东京的幻境中挣脱出来。“那笔钱是从满铁来的，已经在浙江实业银行处理干净。关于这笔钱的事我出发前托给了章秋阳，已经全数换成了法币，一共是二十万余元，到时你可以派人去三友实业社取。”\n\n说到这里，他站起身走到衣架前：“日子正在逼近，如果还有什么急缺物资，请务必和我说，我会回到上海之后和乃器兄一道处理，这样我们可以先采购一部分物资，再运回龙岩。”\n\n山田纯三郎把箱子提起来准备离开，他真的很赶时间。"
  JAP_pnr_foreign_events.5.a: "我会立刻让冯雪峰去提。"
  JAP_pnr_foreign_events.6.t: "山本条太郎去世"
  JAP_pnr_foreign_events.6.desc: "3月25日，[JAP.GetAdjective]知名实业家，贵族院议员，有“满铁复兴者”之称的山本条太郎因食道癌不幸去世。他早年间曾在三井物产担任常务董事，但因卷入西门子丑闻而辞职。1927年，山本条太郎出任立宪政友会总书记，同年出任南满铁路总裁。在他担任南满铁路总裁期间，一方面对满铁内部进行了诸多改革，实现了利润的大规模增长；另一方面则奠定了满铁在奉天地区的强大影响力，确保了[JAP.GetName]在中国北方的经济利益。据称，山本条太郎曾在酒局上与张作霖划拳定输赢，从而以这样一种几乎儿戏的方式为满铁在奉天的进一步扩张铺平了道路。这位商业巨擘在生命的最后几年中一直试图促成立宪政友会和立宪民政党之间的“党派同盟”，并寻求日本和中国之间紧张外交关系的降温。他的离世对所有人来说都无疑是一场打击，其葬礼预计将在本周内举办。"
  JAP_pnr_foreign_events.6.a: "谁人可为其继任？"
  JAP_pnr_foreign_events.6.b: "致电吊唁。"
  JAP_pnr_foreign_events.6.c: "阅。"
  JAP_pnr_foreign_events.7.t: "欧亚国际联运铁路线"
  JAP_pnr_foreign_events.7.desc: "明治维新后，日本相继取得了台湾、朝鲜、南萨哈林等领土。同时获得了南满铁路（东清铁路南段）的权益。就在短短几十年间，日本的领土规模已经翻了一倍。然而彼时的日本取得南满铁路之后，却因为条约规定无法与东清铁路北段，即今日的中东路进行联运，这使得南满铁路恐沦落为“地方线路”，难以发挥其经济价值。为避免这一情况的发生，1911年7月，满铁、大阪商船株式会社以及日本国有铁道的代表齐赴伦敦，力图将[JAP.GetName]纳入“东半球周游券”与“世界周游券”的国际旅游体系。最终在1913年6月，经西伯利亚铁路往返日本与伦敦的联运计划终于正式启动。日本铁道院也借此开始销售“世界周游券”与“东半球周游券”等联运车票。等到1916年，这条无比非凡的铁路线已将整片大陆与两极的海岛连接在一起，从珍奇异域之岛台湾到西方绅士之城伦敦只需14天时间，这就是“欧亚国际联运铁路线”。\n\n世界大战曾短暂地导致该项目取消，虽然战后该联运路线已逐步恢复，但尚未回到战前水平。考虑到黑色星期一的本质是大萧条的一种变体，日本铁道省计划将旅游业作为振兴经济的重要手段，宣传“欧亚国际联运铁路线”来促进国际旅行被认为是可利用的一种方法。我们将与先前参与该“世界周游”计划的各国进行交流，力图通过增加车次来拉动旅游业发展，这些国家虽然意识形态各有不同，但却大多都受到了黑色星期一的困扰，他们理论上不会拒绝这个提议。"
  JAP_pnr_foreign_events.7.desc_member: "日本明治维新后相继取得了台湾、朝鲜、南萨哈林等领土。日俄战争后更是获得了南满铁路（东清铁路南段）的权益。然而彼时的日本取得南满铁路之后，却因为条约规定无法与东清铁路北段，即今日的中东路进行联运，这使得南满铁路恐沦落为“地方线路”，难以发挥其经济价值。为避免这一情况的发生，1911年7月，满铁、大阪商船株式会社以及日本国有铁道的代表齐赴伦敦，力图将[JAP.GetName]纳入“东半球周游券”与“世界周游券”的国际旅游体系。最终在1913年6月，经西伯利亚铁路往返日本与伦敦的联运计划终于正式启动。日本铁道院也借此开始销售“世界周游券”与“东半球周游券”等联运车票。等到1916年，这条无比非凡的铁路线已将整片大陆与两极的海岛连接在一起，从珍奇异域之岛台湾到西方绅士之城伦敦只需14天时间，这就是“欧亚国际联运铁路线”。\n\n世界大战曾短暂地导致该项目取消，虽然战后该联运路线已逐步恢复，但尚未回到战前水平。考虑到黑色星期一的本质是大萧条的一种变体，日本铁道省计划将旅游业作为振兴经济的重要手段。现在他们希望作为“欧亚国际联运铁路线”途径国的我们能够和他们一起推动一项增加车次的计划，从而将在黑色星期一期间空闲的铁路运力利用在旅游业上带动经济复苏。[JAP.GetName]宣称这是一项能够展现所有人团结一致的决心，携手共同渡过这场经济危机的计划。问题就在于我们是否要和他们站在一起。"
  JAP_pnr_foreign_events.7.a: "而世界将因此走出危机。"
  JAP_pnr_foreign_events.7.b: "旅游业拉动经济复苏，这是个好主意。"
  JAP_pnr_foreign_events.7.c: "虽然很有诱惑力，但我们拒绝。"
  JAP_pnr_foreign_events.8.t: "[FROM.GetName]支持增加车次"
  JAP_pnr_foreign_events.8.desc: "在紧张的协商之后，[FROM.GetName]正式告知我们他们将支持我们增加欧亚国际联运铁路线车次的计划。无论其出于什么目的，但至少[FROM.GetName]和我们站在了一起。"
  JAP_pnr_foreign_events.8.a: "太好了。"
  JAP_pnr_foreign_events.9.t: "[FROM.GetName]拒绝提议"
  JAP_pnr_foreign_events.9.desc: "在紧张的协商之后，[FROM.GetName]正式告知我们他们不会支持我们增加欧亚国际联运铁路线车次的计划。理由是当前他们自己的运力已经相当紧张，没有多余的火车能够分配给旅游业。尽管他们在公开协商时表达了对我们提议本身的赞同和认可，但小道消息显示，[FROM.GetLeader]认为该计划不过是痴人说梦，看起来[FROM.GetName]并不相信区区几个游客就能改变整体的经济趋势。"
  JAP_pnr_foreign_events.9.a: "他们有他们的选择。"
  JAP_pnr_foreign_events.10.t: "[JAP.GetName]显露野心"
  JAP_pnr_foreign_events.10.desc: "1928年7月到8月期间，德国、日本和美国等国的代表齐聚于中国上海，经过了一系列商讨之后形成了《中国租界国际托管条约》,确立了[LEC.GetName]的地位以及各签约国在中国的利益，此次会议同时还促成了德国和日本之间的《青岛条约》，该条约的签署宣告了德日两国自世界大战延续至条约签署前的名义上的战争状态彻底结束。根据这两份条约，[GER.GetName]尊重[JAP.GetName]在中国的既有利益——这包括奉天、大连以及使馆城市；而[JAP.GetName]则应当以对等的尊重承认[GER.GetName]在中国其它地区的利益。但随着“黑色星期一”的到来和华东地区秩序的崩溃，看来[JAP.GetName]最终脱下了那身并不合身的“黑领结”，露出了内里的“凶暴的猴子”模样。\n\n尽管他们同样受到这场世界性的经济危机的困扰，但他们还是试图在危机之中抓住与之而来的机会。这场戏剧性的暴露起源于[LEP.GetAdjective]参谋部里一位日本参谋的失言，他称[LEP.GetAdjective]军队正在与[ANQ.GetName]与其背后支持他们的[JAP.GetName]交战。后续调查显示此人是一位关东军参谋，不知为何出现在了南方。\n\n我们在长江流域巡逻的“中国炮舰”确认了该消息，在华东战场上确实存在[JAP.GetAdjective]志愿军。这意味着[JAP.GetName]已经介入了八省联合的崩溃，并尝试借助这次混乱将自己的手从上海伸到更靠近内陆的地方——按理来说这并不能算是对条约的违背，但他们的行为显然对[GER.GetName]在华投资的安全构成了威胁。\n\n然而情况对我们来说也不甚乐观，[286.GetName]的骚乱暗示了一场可能即将到来的治安战，黑色星期一又令柏林难以支援我们的行动。目前仅仅是向[LEP.GetLeader]提供帮助就几乎榨干了我们，最好的选择或许是虚张声势，在尽力不引发事态升级的情况下迫使[JAP.GetName]退出华东，毕竟不仅我们深陷危机之中，这个世界中的所有人都处在同样的困难里。"
  JAP_pnr_foreign_events.10.a: "致电东京，“强硬地”要求他们改正错误。"
  JAP_pnr_foreign_events.10.a_tt: "§a强硬一点总是好的，暗示§R[64.GetCapitalVictoryPointName]§!对此很关注……§9[JAP.GetName]§!很可能会退缩，但德日关系大概也会因此变得更紧张。§!"
  JAP_pnr_foreign_events.10.b: "用委婉一点的口气。"
  JAP_pnr_foreign_events.10.b_tt: "§a我们会提醒他们注意尺寸，但§9[JAP.GetName]§!很可能装傻充楞，这也没办法……§!"
  JAP_pnr_foreign_events.10.c: "为了避免麻烦上身的最好方法是——别干。"
  JAP_pnr_foreign_events.11.t: "东亚同文书院支持$ANQ_chen_tiaoyuan$"
  JAP_pnr_foreign_events.11.desc: "整个[LEP.GetName]境内都弥漫着紧张的气息，自$ANQ_chen_tiaoyuan$打出“驱逐外侮，还我租界”的反租界大旗后，整个华东的社会秩序便一天一天的坏下去，此前零星发生的暴力事件如今变得更为普遍，外国领事们正急迫地要求本国国民立刻前往[LEC.GetName]，并要求[LEP.GetLeader]立刻解决针对外国人的歧视和袭击问题。学生、工人甚至是手工业主们也走上街头要求政府正视中国和其他国家之间的关系。在整个华东陷入紧张之中时，其中一位列强终于开口了——他们支持$ANQ_chen_tiaoyuan$。\n\n稍早些时候，位于上海的东亚同文书院校长大内畅三就最近紧张的华东局势发表了校内演讲，在演讲中，他呼吁尤其以[GER.GetName]在内的各大强国重新审视自己和中国，以及更广泛的亚洲地区各国的关系。\n\n大内畅三毫不避讳地谈到了$ANQ_chen_tiaoyuan$和反租界运动的正义性，他主张这是“自中山先生辛亥革命之后，亚洲得觉醒而必将解放的又一例证。[LEC.GetName]和不平等条约的废除将成为鼓舞全亚洲反对帝国主义压迫的第一声雷霆。中华社会各界的民众愈是参与到这运动之中，帝国主义就愈早被赶出亚洲，大亚洲的团结也就得到了伸张。”\n\n在演讲末尾处，他还呼吁同文书院中的中国学生要积极参加到反租界运动中去，而其他“同文同种之亚洲友人”在此时机不当冷眼观瞧，应当给予实际的援助。"
  JAP_pnr_foreign_events.11.a: "打倒列强，收回租界！"
  JAP_pnr_foreign_events.11.b: "这真是黄鼠狼给鸡拜年。"
  JAP_pnr_foreign_events.12.t: "各行其是"
  JAP_pnr_foreign_events.12.desc: "看来我们和[ANQ.GetName]之间的小小密约被德国人注意到了，但暴露的方式有些特殊。今天早些时候我们收到了新加坡方面的消息。称他们注意到了近几日我国在华东地区的异常动向，希望我们能尊重过去签署的条约，谨慎地处理对华问题。外务省一开始认为是对[ANQ.GetName]的秘密援助被发现了，后续的短暂交谈证明确实被发现了，但是这只是次要原因，而主要原因则来自[LEP.GetName]中的日本人。根据德国人所言，在$LEP_qi_xieyuan$的参谋部中除了中国人和德国人之外还出现了日本人。\n\n一开始他们对有日本人存在并不惊讶，在使馆城市中存在着各式各样的赋闲军官等待着中国军阀去雇佣。但很快，他们就注意到这位日本人不像是退役军官或大陆浪人，随后的调查显示他是一名关东军参谋，而他千里迢迢前来干涉华东内战的理由居然是——根据随后他在上海日本总领事馆中的说明的情况——他认为帝国如果在华东谋取了新的合作者，便会将在大陆的力量分散而非全部置于满洲，从而导致北方防御的懈怠，威胁到国防。为此必须支援[LEP.GetName]恢复华东的秩序，奠定大陆的稳定。\n\n他在[LEP.GetAdjective]参谋部中的一次失言牵扯出了我们和[ANQ.GetName]之间的小小密约，我们向[ANQ.GetLeader]提供武器和“义勇队”的事情全都暴露出来了。在德国人确认我们卷入其中之后，他们便立刻给我们打电话要求我们作出回应：尊重之前的条约，撤回对[ANQ.GetName]的支持。[GEA.GetLeader]的言辞非常强硬，他称自己已经将情况告知了[64.GetCapitalVictoryPointName]——他很可能是在虚张声势。如果这件事真的被欧洲所知，电话大概率就应该来自柏林而非新加坡，但我们是否要在这件事上压下赌注？"
  JAP_pnr_foreign_events.12.a: "既然如此，停止对[ANQ.GetName]的援助。"
  JAP_pnr_foreign_events.12.b: "让那家伙赶紧回[FNG.GetName]，然后当什么都没发生。"
  JAP_pnr_foreign_events.13.t: "[JAP.GetName]尝试和我们接触"
  JAP_pnr_foreign_events.13.desc: "世界大战结束后[JAP.GetName]就和我国之间维持着极为复杂的关系。在革命刚刚成功时，[JAP.GetName]拒绝承认我们政府的合法性，转而支持他们在协约国的老朋友。但随着时间的推移对方态度有所软化，最终和我们之间形成了一种极为暧昧的外交关系：东京方面依然没有认定我们是[ROOT.GetAdjective]合法政权，但却在我们这里设立了外交办事处，并派出了一般只派驻公使馆的对应驻外武官。\n\n如今[JAP.GetName]似乎想和我们把这种关系更进一步，他们向我们发来一份令人惊讶的提案：鉴于我们和[JAP.GetName]之间有着共同的敌人[GER.GetName]，东京提议两国之间应该戮力同心，一同对抗邪恶的德意志帝国主义者。[JAP.GetName]将公开承认[ROOT.GetName]是唯一合法的政府，以换取和我们之间在各方面更紧密地合作。"
  JAP_pnr_foreign_events.13.a: "为什么不呢？"
  JAP_pnr_foreign_events.13.b: "我们绝不和帝国主义者媾和。"
  JAP_pnr_foreign_events.14.t: "[FROM.GetName]表现积极"
  JAP_pnr_foreign_events.14.desc: "我们从[FROM.GetAdjective]那里收到了积极回复，即便意识形态不同，但对方显然表现出了务实的态度。与之相对的是我们在协约国中的“旧朋友”，[FROM.GetAdjective]伪政权的暴跳如雷。就在我们宣布承认[FROM.GetName]的合法性之后没过多久，这些流亡者就发表了一篇声明来抨击我们的“背叛”，看起来失去我们这件事把他们气得不轻。"
  JAP_pnr_foreign_events.14.a: "这就是国际政治哦。"
  JAP_pnr_foreign_events.15.t: "[FROM.GetName]拒绝了我们"
  JAP_pnr_foreign_events.15.desc: "工团分子果然是一群社会主义意识形态的狂信徒。尽管我们对其晓以政治上的利害，但他们依然拒绝了和我们的潜在合作可能。他们自认为自己有能力在欧洲直面[GER.GetName]并将其击败，让我们为这些“勇士”祝福吧，因为上一次他们这么做的结果是逃到加拿大和非洲，谁知道当工团失败了之后，这些地方又会长出来什么莫名其妙的东西。"
  JAP_pnr_foreign_events.15.a: "很遗憾。"
  JAP_pnr_foreign_events.16.t: "出席瓦隆-蓬达尔克会议？"
  JAP_pnr_foreign_events.16.desc: "黑色星期一爆发之后，新的紧张局势悄然酝酿，[GER.GetNameDef]对欧洲的统治力在急速衰落，更遑论距离柏林更远的亚洲地区了。此前位于世界另一端的[JAP.GetNameDef]曾以积极态度试图增进我们之间的外交关系，现在他们想再进一步——和同为“对抗帝国主义的同志”的我国一同探讨如何对抗[GER.GetAdjective]军队对世界施加的强大影响，并进一步确认两国之间如何实现“亚洲共同利益的伸张和势力范围的划定”，并希望为德国离开亚洲后的世界持久和平奠定基础。毫无疑问，他们想要试探我们对亚洲的整体看法。\n\n对我们来说，亚洲，特别是东亚以及南亚是一片遥远的土地，在彻底解决我们面前的巨大威胁之前，我们确实无法对那里施加太多影响；另一方面，如果我们能够获得[JAP.GetNameDef]在西太平洋的助力，我们就能打击德国人及其盟友的海外资源区，从而反过来对他们的军事工业制造“芜菁之冬”。\n\n[JAP.GetNameDef]自称为了“表示诚意”，也是为了向世界上的第一个西方社会主义政权巴黎公社致以敬意，他们希望能与我国在[FRA.GetAdjective]小镇瓦隆-蓬达尔克进一步讨论相关事宜，商讨东方与西方两位“革命者”之间的关系。在过去，路易十三前去签署《阿莱斯敕令》的路上曾路过该镇，他下令炸断该镇唯一的桥梁以重挫当地的新教徒势力。\n\n毫无疑问，本次秘密谈判将涉及到亚洲诸多国家的命运，我们虽然与[JAP.GetNameDef]有着共同的敌人，[GER.GetNameDef]，但我们之间的冲突也是显而易见的。[JAP.GetNameDef]虽然自称为与帝国主义作斗争的斗士，但实际上他们不过是借着驱赶帝国主义之名来扩张其霸权的另一个压迫者罢了。他们必然是我们的敌人，并且可能是最卑劣的敌人。尽管现在暂时不必考虑和他们之间的冲突，但终有一日，为了实现真正的世界革命，我们将在正面战场上相见。"
  JAP_pnr_foreign_events.16.a: "我们听听他们想说什么。"
  JAP_pnr_foreign_events.16.b: "挥舞自由大旗的帝国主义者让我恶心。"
  JAP_pnr_foreign_events.17.t: "[From.GetName]将出席瓦隆-蓬达尔克会议"
  JAP_pnr_foreign_events.17.desc: "在我们向其表达了进一步合作的意愿之后，[From.GetName]告知我国他们将派出代表参加本次会议。不出意外的话，这些赤匪心中肯定怀有疑问和不满，但既然他们已经决定出席了，那就意味着我们之间或许可以通过谈话来达成某些利益的确认。"
  JAP_pnr_foreign_events.17.a: "Bienvenue, camarade!（欢迎你，同志！）"
  JAP_pnr_foreign_events.18.t: "[From.GetName]拒绝出席瓦隆-蓬达尔克会议"
  JAP_pnr_foreign_events.18.desc: "[From.GetName]近日向我们派驻其国家的武官和外交人员转达了他们的意见，在审慎考虑之后，他们认为此时和我们合作并非一个好选择，因此拒绝出席瓦隆-蓬达尔克会议。简单来说，[From.GetName]认为我们只是想取代[GER.GetNameDef]成为亚洲的区域性霸权，而非真心实意地想要消灭帝国主义。"
  JAP_pnr_foreign_events.18.a: "八嘎！竟敢侮辱大东亚圣战！"
  JAP_pnr_foreign_events.19.t: "第一天：印度半岛问题"
  JAP_pnr_foreign_events.19.desc: "会议第一天的核心聚焦在印度次大陆，根据霞关官僚们的意见，想要说服这些赤匪支持我们在亚洲的行动极为困难，因此我们将把谈判的重心放在“不支持我们的敌人”之上。为此就要提出有诱惑力的提案，并以此作为交换换取我们在最后抛出来的要求的实现。如今在印度次大陆上有三个政权都生成自己对整个印度次大陆有着合法的宣称，其中工团主义者们支持的政权是[HND.GetName]，而和我们之间维持着不温不火的外交关系的政权则是[PRF.GetName]。\n\n现在的问题在于，我们是否要以印度问题作为诱饵迫使这些工团暴徒们咬钩？承诺支持[HND.GetName]对整个印度的合法宣称并为其提供武器援助是个不错的筹码，但这无疑会在印度统一之后将其白白送给红色阵营。而且[HND.GetName]也是次大陆上最为好斗的势力，假如未来我们在南亚扩张势力范围，可能会与其产生不必要的摩擦……"
  JAP_pnr_foreign_events.19.a: "我们将支持[HND.GetName]的民族解放运动。"
  JAP_pnr_foreign_events.19.b: "我们呼吁密切关注印度次大陆的紧张局势。"
  JAP_pnr_foreign_events.20.t: "第二天：亚洲去殖民化"
  JAP_pnr_foreign_events.20.desc: "会议第二天的议题聚焦在更广泛的亚洲去殖民化问题上，对方向我们提出了一个要求，即如果我们成功将[GEA.GetNameDef]消灭，随后我们应当以独立国家的形式促使所有大陆上原本的德国殖民地建立各自的政权。作为交换，他们会支持我们对西太平洋岛屿的正当利益。在会议中还特别谈到了印度尼西亚，对方措辞强硬，要求我们在战后和他们一起共同确保印度尼西亚的完全独立。他们显然基于在亚洲建立缓冲地带的目的而提出了这些要求，但贸然答应这些要求显然意味着我们无法轻易将这些国家纳入我们的势力范围，而那些丰富的自然资源也不能被我国独享。"
  JAP_pnr_foreign_events.20.a: "就按他们的想法来。"
  JAP_pnr_foreign_events.20.b: "我想这一点还是不能接受。"
  JAP_pnr_foreign_events.21.t: "硝烟散去……"
  JAP_pnr_foreign_events.21.desc: "混战业已结束，华东试图砸碎束缚于身上的欧洲帝国主义锁链，如今他以全新的身体站立在了这片内战之后满目疮痍的土地之上。那些不惧死亡的中华儿女们在战争中前赴后继，噙着泪水同室操戈，挺身对抗自己的昔日同胞。这种“大义灭亲”之举，若不是有着极坚决的信心又怎么能作出？单凭这一点，就足够称他们为中国解放的脊梁，亚洲解放的先锋。或许在某个深夜，哥哥将为弟弟祈福，儿子将无言地安葬自己父亲的尸体。如今这副活地狱的景象，其全应怪罪于潜藏在背后的德意志帝国主义。"
  JAP_pnr_foreign_events.21a.desc: "$JAP_pnr_foreign_events.21.desc$\n\n然而痛苦终将结束，穿过泪水，悲哀得以抚平，失去一切的他们终于赢得了配得上自己的报酬：自由。今天早上，[JAP.GetName]已向[ANQ.GetName]致以慰问，并提供了五十万日元的战后援助资金。此外在靖亚神社宫司村上德太郎的斡旋之下，这座位于[LEC.GetName]的上海法华区的神社于今天举行了盛大的临时合祀祭，将在华东混战中战死的各士兵迎入神社，供奉在殿中。靖亚神社先前以近卫笃麿、荒尾精和根津一为主神，同时供奉其他东亚同文书院相关人士和校友，此次大规模地将中国士兵纳入合祀堪称是史上第一次。"
  JAP_pnr_foreign_events.21b.desc: "$JAP_pnr_foreign_events.21.desc$\n\n即便是付出了这样惨痛的代价，华东的命运却依然悬而未决。[SHD.GetLeader]在这场中国人民为争取自由的残酷内战的最后出现，窃取了万千群众的胜利果实，将整片华东收入囊中。有传言称[SHD.GetLeader]残忍无道，行事暴虐，其恶劣程度胜过中国其他军阀数百倍。这不由得让人为华东人民捏一把汗，他们刚刚从自相残杀的地狱中走出来，如今又落入了活阎王的魔掌。但终有一日，他们将会得到他们的解放，因为他们为此曾奋斗过，证明过自己的决心。"
  JAP_pnr_foreign_events.21c.desc: "$JAP_pnr_foreign_events.21.desc$\n\n[LEP.GetLeader]，这个德意志帝国主义的代理人就这样狞笑着站在尸骨堆上，心中满是对自己柏林主子接下来赏赐的美好畅想。他的土匪军队如今再一次宣誓了自己对华东地区的掌控权，工厂开始重新运转，饥饿的人们戴着镣铐夜以继日地工作，只为德意志帝国主义者在柏林的皇宫中能用上一块名贵的地砖。在[LEP.GetLeader]的高压统治之下，这场现世地狱剧也必然将持续下去，直至他们再掀起一次反抗，直至有人听到他们的呼声，救他们脱离那地狱。"
  JAP_pnr_foreign_events.21d.desc: "$JAP_pnr_foreign_events.21.desc$\n\n这些勇敢的中国人，亚洲解放的寻求者终于击败了德意志帝国主义的走狗，就在他们庆祝胜利之时，改头换面的军阀强人，温情脉脉的伪基督来了：[CHI.GetName]以革命之名诓骗大众，以残暴手段摧毁真正爱国者们的反租界运动。看看他的背后吧！在[CHI.GetLeader]的背后，不是有好几位红色暴君的手吗？"
  JAP_pnr_foreign_events.21.a: "愿逝者安息。"
  JAP_pnr_foreign_events.21.b: "令人反胃。"
  JAP_pnr_foreign_events.21.c: "[GER.GetNameDef]有这么强大吗？"
  JAP_pnr_foreign_events.22.t: "第三天：大陆打通作战"
  JAP_pnr_foreign_events.22.desc: "会议的第三天便是重头戏，这也是我们邀请这些赤匪坐下来聊聊的真正原因：大陆打通作战。毫无疑问，[GER.GetName]已经是我们完全的敌人了，但第三国际的这些工团主义者不同，他们还可以被“争取”以实现我们在亚洲的战略目标。现在的问题在于，假如未来我们和中华各势力之间的冲突到了非要通过战争便无法解决的情况时，我们必须确保他们的战斗力足够弱小，以免陷入战争的泥潭。为此我们需要这些家伙承诺，他们至少不会在我们和军阀们交战以最终攻击到[GER.GetNameDef]在亚洲的堡垒的时候，跑去给这些军阀提供军事援助或别的什么东西，阻碍我们的大陆打通作战。"
  JAP_pnr_foreign_events.22.a: "不要阻碍大陆打通作战。"
  JAP_pnr_foreign_events.22.b: "如果战争开始，希望你们能发动禁运。"
  JAP_pnr_foreign_events.23.t: "[JAP.GetName]在会议上的要求"
  valon_pon_darc_text_1: "他们支持[HND.GetName]对整个印度次大陆合理的主权声索，并许诺将在印度统一战争开始后援助[HND.GetName]"
  valon_pon_darc_text_2: "他们并不支持[HND.GetName]对整个印度次大陆的合理宣称，而是支持他们可疑的同伴[PRF.GetName]，一个印度封建制度的活化石，这意味着他们想要掐灭一个人口大国中兴起的工团思潮"
  valon_pon_darc_text_3: "他们肯定了我们提出的亚洲去殖民化构想，承诺将在驱逐[GER.GetName]之后和我们共同确保亚洲各国的独立"
  valon_pon_darc_text_4: "他们对我们提出的亚洲去殖民化构想表现平淡，至于我们提出的在[GEA.GetName]被粉碎，新加坡得到解放之后共同保障那些前殖民地的完全独立这一点则没有给出明确支持的回答"
  valon_pon_darc_text_5: "他们希望在他们与[GEA.GetName]发生冲突后，至少不要对他们的作战造成任何阻碍，这意味着要我们抛弃我们在东亚地区的盟友"
  valon_pon_darc_text_6: "他们希望在他们与[GEA.GetName]发生冲突后，禁运所有可能阻碍他们实现对抗德国人目标的国家，这意味着我们不仅要抛弃我们在东亚地区的盟友，更将致许多饱受战争摧残的人于不顾"
  JAP_pnr_foreign_events.23.desc: "近三日的会议下来，[JAP.GetNameDef]的诉求已经很明了了：首先，[valon_pon_darc_day_1_text]。其次，[valon_pon_darc_day_2_text]。最后，[valon_pon_darc_day_3_text]。我们是否要答应他们的要求？"
  JAP_pnr_foreign_events.23.a: "这似乎可以接受。"
  JAP_pnr_foreign_events.23.b: "他们似乎没睡醒。"
  JAP_pnr_foreign_events.24.t: "瓦隆-蓬达尔克会议成功"
  JAP_pnr_foreign_events.24.desc: "握手，签字，然后密约被小心地装进了信封里封好。[FROM.GetName]对我们之间的密约非常满意，不会有人知道今天在[FRA.GetAdjective]的某个小镇子上，几个世界大国就这样决定了亚洲的命运。人们将对此守口如瓶，直到事情发生的那一天才为人所知。"
  JAP_pnr_foreign_events.24.a: "他们会遵守密约吧。"
  JAP_pnr_foreign_events.25.t: "瓦隆-蓬达尔克会议失败"
  JAP_pnr_foreign_events.25.desc: "瓦隆-蓬达尔克会议最终不欢而散，[FROM.GetName]斥责我们的要求是“赤裸裸的侵略”，并且希望将他们变成同谋的凶手，随后他们他们头也不回地离开了会议现场。无论如何这指责都太过无礼了，我国已通过外交人员对此事进行了抗议。在[FRA.GetName]和赤匪共同度过了三天时间，如今看来真是白白浪费了。"
  JAP_pnr_foreign_events.25.a: "令人失望。"
  
  JAP_pnr_foreign_events.1001.t: "[ANQ.GetName]接受了我们的帮助"
  JAP_pnr_foreign_events.1001.desc: "末永节给我们带回来了好消息。尽管[ANQ.GetLeader]自诩为反租界势力的庇护者与代言人，但在长久思考，明智地权衡利弊之后，[ANQ.GetLeader]最终决定和我们达成合作协议，接受我们的帮助。[ANQ.GetLeader]顾虑到自己的身份，因此和我们订立了秘密性质的协议。东京政府将通过[LEC.GetName]为其运送物资，支持其对华东地区的正当控制权；而[ANQ.GetLeader]将继续在明面上作为反租界运动的军事与政治领袖带领中国人民摆脱德帝国主义的压迫。"
  JAP_pnr_foreign_events.1001.a: "那么合作愉快。"
  JAP_pnr_foreign_events.1002.t: "[ANQ.GetName]拒绝了我们的帮助"
  JAP_pnr_foreign_events.1001.tt: "§a由于我们争取到[ANQ.GetName]的更进一步好感，这使得我们能在华东提前建立§Y利益§!。§!"
  JAP_pnr_foreign_events.1002.desc: "末永节回电。[ANQ.GetLeader]身为反租界运动的旗手并非如我们所想的那样是个用大旗遮盖个人野心的寻常军阀，面对我们提出的合作邀请，[ANQ.GetLeader]严厉地斥责了末永节和东京，无情地拒绝了我们好意。[ANQ.GetLeader]甚至还拿出当年段祺瑞的事件污蔑我们，要求我们为当年旧皖系的灭亡负责。谈判已经破裂，其中再无任何斡旋余地。"
  JAP_pnr_foreign_events.1002.a: "竖子不足与谋。"
  JAP_pnr_foreign_events.1002.tt: "§a由于我们没有争取到[ANQ.GetName]的更进一步好感，这使得我们无法在华东提前建立§Y利益§!。§!"

