  ### 覆写原版事件 ###
  japan_domestic_events.242.t: "黑色星期一波及……[EGY.GetName]？"
  japan_domestic_events.242.d: "随着柏林股市的“圣诞节高峰”在一月末戛然而止，柏林证券市场的行情更是在俄德谈判时内容泄露，切尔诺夫遇刺，以及[LEP.GetName]局势恶化等国际事件的多重影响下急转直下。就像我国大多数经济学家在“圣诞节高峰”结束后预测的那样，德意志帝国的经济崩溃终于变成一场席卷世界的经济危机。幸运的是由于长期以来[GER.GetName]都在尝试将我们其经济领域，所以东京和大阪并没有因为这场危机而遭到重大冲击，不过即便我们的经济体在庞大的中欧同盟市场，或者称之为“德国的世界霸权市场”中处于边缘位置，我们还是被其经济崩溃的多米诺骨牌击中了，然而恰恰是因为我们与德国的直接贸易不多，所以我们很快就能从这次经济危机中恢复……至少在昨天，这个说法还是有效的。\n\n今天稍早些时候，[EGY.GetName]宣布由于“紧急状态”而单方面宣布停止履行自1926年以来我国与其签订的《日埃经济互惠贸易协定》，该协定已经过多次续约，下一次续约期本定在1940年。但[EGY.GetName]受到黑色星期一影响，突如其来的国际大宗商品崩盘和外部需求萎缩令埃及政府的经济遭到重大打击，这使得他们最终选择背叛和我们之间的约定。如果这就是全部的纠纷，我们只是失去了一纸贸易协定就好了。问题远不止如此，除了废除协定之外，[EGY.GetName]还宣布即日起将对我国棉布、人造丝产品征收约达70%的汇兑补偿税，以保护本地纺织业，扭转廉价日本纺织品倾销的“经济阴谋”。无论如何，我们目前已经失去了[EGY.GetName]这个重要的贸易伙伴，而未来会怎样我们不得而知……"
  japan_domestic_events.242.a: "经济……不是在恢复吗？"
  fengtian_japan_mechanic_events.001.t: "三宅坂与霞关"
  fengtian_japan_mechanic_events.001.d: "帝国与中国有着悠久的交往史，而其对华政策自相矛盾，摇摆不定也已成为了长久的传统，构成了所谓“霞关”与“三宅坂”间的“二元外交”。自1872年西乡隆盛向中国派遣优秀的陆军将校担任对华谍报人员至今已有64年，期间对华情报工作从未间断。三宅坂的陆军参谋本部自信于能依靠其长期耕耘的情报体系在对华外交问题上占尽优势。\n\n与之相对应的则是则是霞关的外务省，最初仅有“二局四课”的外务省在外交问题上话语权薄弱，仅有四百余人的规模难以撼动早已在对华外交领域深耕多年的陆军。但随着政党政治在世界大战后逐渐被民众推崇，军人转而被认为是冲突和弊病的源头。值此良机，在前首相原敬高超的政治手腕之下，外务省得到了大规模的扩张，并将关于外交事务的决策从陆军手中夺回。1934年外务省构成的“五局时代”则彻底宣告着政府对中国问题的发言权的掌控。\n\n外务省代表政府对[FNG.GetName]的“官方”态度是支持$FNG_zhang_zuolin$在东北权力的巩固，并与其共同开发东三省，谋求资源和经济的富足。但若$FNG_zhang_zuolin$表示出图谋中央的野心，则不可给予援助，以免与中国各势力造成恩仇关系，致使中日邦交陷入危险，而帝国威信亦失坠于世界。\n\n尽管东京已掌握了对华问题的主动权，但参谋本部仍以所谓“事关国防”为由并未放弃对外交的秘密干涉，对“无能政府”的阳奉阴违已成为他们的日常。而陆军在华的三支军队也同样对参谋本部阳奉阴违：关东军与$FNG_zhang_zuolin$密切合作，希望依仗强大的[FNG.GetName]作为帝国在华的唯一盟友对内博取政治利益，对外则保卫帝国之疆域；天津军（中国驻屯军）希望$FNG_zhang_zuolin$在东北涵养实力，待到中华再度陷入混乱，一举南下称霸于大陆，而令帝国于幕后操纵；上海军与帝国海军关系密切，他们一边在华东、华南寻找着其他合作者，一边渴求取得成果，一扫国内反军的阴霾。\n\n如今八省倾覆，冲突已至，帝国与中华的命运将在这些迥异的团体之下被引向未知的终局。"
  fengtian_japan_mechanic_events.001.tt: "§R在华之对策，对于帝国长期的安定至关重要。假使外交已无可能，战争已成为唯一选择，而帝国又被卷入其中，我们或许便只能选择支持奉天以谋求保卫我们在大陆的利益。这一支持在最后能为我们换来有利的条件，并让我们的对奉影响力不断提高。又或者，也许会出现另一种机遇？§!"
  
  ### JAP新事件 ###

  JAP_pnr_event.1.t: "大帅的演说"
  JAP_pnr_event.1.desc: "今天稍早些时候，$FNG_zhang_zuolin$发表了一场简短的公开演讲，他通过援引中国古代故事“毋忘在莒”来对近来[FNG.GetAdjective]社会上的两股政治风潮进行评论。\n\n自1936年开年以来，主张南下统一中国，与[716.GetCapitalVictoryPointName]政府步调维持一致的光复派同主张“东北人的东北”的地方派之间的争端便持续不断，对于地方派，他们有着另一个非正式的称呼，“东北党”。长期以来这些地方主义者都是横亘在$FNG_zhang_zuolin$面前的一道无形的长城，他们出于对过去十几年东北军穷兵黩武导致经济崩溃时产生的饥荒与社会混乱记忆犹新。不用多想，他们背后有着希望$FNG_zhang_zuolin$能安稳运营东北的关东军支持着；而响应政府号召，鼓吹南下重新一统中国的光复派则得到了天津军的大力支持。\n\n此前$FNG_zhang_zuolin$虽然偶尔会公开表示自己没有放弃南下的野心，但我们一向认为这是他安抚自己势力的一种说辞。东京也曾多次通过关东军告诫其帝国对该问题的态度：得陇望蜀是人之常情，但欲要称霸全国，需首先妥善经营其势力范围——我们曾希望借此委婉地传达暂时不支持其统一中华的野心。然而这一次的演讲和他最近的行动却表明我们的希望落空了：所谓的“毋忘在莒”正是在多年艰苦经营之后收复失地，这表明了$FNG_zhang_zuolin$对光复派的直接支持；此外，$FNG_zhang_zuolin$在近几个月一转先前对地方主义情绪的放纵态度，开始大规模逮捕不支持政府南下的“东北党”人士。这很可能预示着$FNG_zhang_zuolin$相信发动第五次直奉战争的时机已经到来了，如果战争真的到来，这对我们在[FNG.GetName]的各项产业并不是一个好消息……"
  JAP_pnr_event.1.a: "$FNG_zhang_zuolin$如果是认真的……"
  JAP_pnr_event.2.t: "大帅真要南下吗？"
  JAP_pnr_event.2.desc: "张大帅前脚刚刚在父老乡亲面前许下诺言，后脚日本人就提着礼物屁颠屁颠地跑过来对着大帅嘘寒问暖。他们就跟伺候老父亲一样伺候着张大帅，等到大帅被他们伺候美了，这些狗娘养的才张嘴怯生生地说出自己的真实目的：“大帅爷，您先前讲要统一中华，是不是真的啊？”\n\n妈的，原来是想知道大帅先前许下打回北京的那番豪言壮志是不是吹牛逼！\n\n看来日本人是不明白大帅的脾气，那些不长眼的东西立刻被踢出了大帅府。君子一言，驷马难追。大帅一言，让日本人他亲爷爷放几万匹马也追不上！"
  JAP_pnr_event.2.a: "去你妈的，不然呢？"
  JAP_pnr_event.3.t: "竹计划"
  JAP_pnr_event.3.desc: "驻[FNG.GetAdjective]总领事馆传回了消息，$FNG_zhang_zuolin$真的计划南下统一中国！很难想象[FNG.GetName]在第三和第四次直奉战争中令人不忍直视的表现是怎么给$FNG_zhang_zuolin$勇气去谋划再一次同[QIE.GetName]进行一场战争的——难道凭[GER.GetName]无暇东顾，华东陷入混乱就能推导出[QIE.GetName]如今是个可以轻易战胜的对手吗？大家都还没忘记第三次直奉战争时北京城不到一天就被$QIE_wu_peifu$的小股部队彻底攻破，三十年前，八国联军想拿下北京城门都要花两天时间；在第四次直奉战争，当$FNG_zhang_zuolin$还慢悠悠地动员兵力时，$QIE_wu_peifu$则已经彻底摧毁$SHX_yan_xishan$的军队，在五台山参拜佛寺了。\n\n现在想来，[JAP.GetName]当初扶持$FNG_zhang_zuolin$是因为1911年他自称没有逐鹿中原的野心，只想经营“东北人的东北”，与日本共图利益的一致。然而第二次直奉战争的结果是$FNG_zhang_zuolin$盘踞在[608.GetCapitalVictoryPointName]做他的土皇帝，全然忘记了先前许下的那些诺言。以至于他在后来被赶出北京，回到东北之后仍然对中央的权力念念不忘。假如直奉开战，想必$FNG_zhang_zuolin$只能继续在东北地区制造饥荒，我们在东北的既有利益也会因战争受到影响。\n\n或许是时候放弃$FNG_zhang_zuolin$了，如果有能够挑战他权威，取代他代言[FNG.GetName]利益的人出现，并且此人能够与[JAP.GetName]进行持久而互信的合作的话，将大大有助于[JAP.GetName]在东北权益的伸张，虽然现在没有头绪，但我们总是会找到这样的人的。\n\n当然，$FNG_zhang_zuolin$和他的军队或许比我们想的要更强，以至于他们真的能在后续的战争中取胜。虽然不怎么情愿，但我们或许可以咨询一下现在正在[FNG.GetName]协助$FNG_zhang_zuolin$，担任参谋工作的$JAP_tojo_hideki$具体情况，作为关东军的他想必会给出较为保守且实际的军队实力评判。"
  JAP_pnr_event.3.a: "我们当初为什么要和马贼合作？"
  JAP_pnr_event.3.b: "保险起见，问一下$JAP_tojo_hideki$。"
  JAP_pnr_event.4.t: "剃刀的回复"
  JAP_pnr_event.4.desc: "小官近日受到问询之后不敢怠慢，于是立刻亲自探访了[FNG.GetAdjective]军队的实际训练，并结合先前的所见所感如实汇报：[FNG.GetAdjective]军队的训练程度，就目前掌握的情况来看，想要向[608.GetCapitalVictoryPointName]挑战是无谋的，军队的弹药目前无法确保供应，而其战意也几乎不存在。假如一支小队与突然出现的马贼交手，或许也难以占到什么便宜。至于支队的撤退则蔚为壮观，如同东北的老虎在平原上迅速果断的奔行，一日之间便能撤退千里。\n\n然而，我觉得以上问题在于设施的不足和军纪的缺乏，若以帝国的规范对[FNG.GetAdjective]军事的设施和理论进行指导，形成日中两国军队的协同提携，那假以时日[FNG.GetAdjective]军队必将成为不可小觑的中国势力。况且在北京有着直隶派的统治，其背后无论怎么说都残留着德国的势力，归根结底是西方所乐见的一道屏障。反观[FNG.GetName]，对于$FNG_zhang_zuolin$这么优秀和有因缘的人不去援助，一旦帝国只因他的志向远大而选择袖手旁观，从而失去他的信赖，那帝国的对华外交将来则永远不会再有振作的机会。若夫张作霖一心寻求帝国援助的方法，而帝国也不吝于给予其恩宠，那小官相信两国的利益必定能够成功地得到结合。"
  JAP_pnr_event.4.a: "听上去是军阀平均水平——没有水平。"
  JAP_pnr_event.5.t: "竹行动：整理现状"
  JAP_pnr_event.5.desc: "“所谓的[FNG.GetName]，”阿部伸夫在那张关系图背面涂好了胶水，把它拍在了立起来的纸板上，“与其说是一个政府和国家实体，不如说是现代的‘梁山泊’，是一群土匪组成联盟一起扮演家家酒，最后成真了的怪异存在。当然就这一性质上来看，大多数中国军阀都与之相同。”\n\n说到这里他咳了一下，以提醒先前就已经表现出昏昏欲睡的态度各班员打起精神：“我知道我们现在没什么抓手，所以大家也没什么头绪。但是至少掌握一下基本情况，然后静待机会出现——让我们继续说。[FNG.GetName]的核心毋庸置疑是$FNG_zhang_zuolin$，正是位于中央担任盟主的‘大帅’将各个派别的团体暂时性地团结在一起。1919年宽城子事件之后，虽然$FNG_zhang_zuolin$形式上统一了东北，但实质上只是将东北其它的军阀头目赶走了，[FNG.GetName]内部还残留着当前的派系斗争和分歧。如今在政府中占有主要影响力的有协和会——没什么好说的，我想大家都知道贸然用这群人只会直接暴露我们，谁不知道他们和[JAP.GetName]有关系？光复系，他们是直皖战争后投向$FNG_zhang_zuolin$的旧皖系残党，该组织如今只是一个文人为主的群体，在军事上依赖着[FNG.GetName]；交通系，他们是依赖于交通银行形成的派阀小圈子，是一群彻底的实用主义者，过去曾和我国有着利益上的暂时同盟，如今则成为了满铁扩张在东北利益的反对者；以及$FNG_zhang_zuolin$为中心的张氏集团，也就是$FNG_zhang_zuolin$自身的派系。”\n\n“我想我们先从光复系和交通系开始寻找合作者，他们一方控制了沈阳国会，易于被收买；另一方则追求更广泛的经济利益，先试一试他们中间有没有可以合作的人，”说到这里，阿部主任看了一眼那个已经垂下头去的家伙，把手边的粉笔投了过去。"
  JAP_pnr_event.5.a: "小野！你等下跟着班外雇员一起上街！"
  JAP_pnr_event.6.t: "行动意外：反目的可能性？"
  JAP_pnr_event.6.desc: "对[FNG.GetName]周围潜在的合作者的调查行动取得了一些进展，借助班外雇员的社会关系，我们的调查者成功和残余的“东北党”产生了接触，这些地方主义者们虽然遭到了政府的严厉打击，但依然维持着顽强的生命力。\n\n在简短交谈之后我们收获了一些额外信息：[FNG.GetNameDef]的分封制结构比我们想象的还要坚固，然而这种近乎古老的权力模式却使得我们能够进一步窥探其中的不和。\n\n就像我们之前确定的那样，整个[FNG.GetNameDef]无非是一个伪装成政府的土匪窝点，土匪头子之间关系不佳也是自然的事情。在袁世凯时期的“驱逐段芝贵”事件中，身为27师师长的$FNG_zhang_zuolin$曾借助计谋构陷自己的结拜兄弟，彼时和自己势均力敌的28师师长冯德麟，从而赢得了北洋政府的信任，一举夺得了奉天督军的权力。1917年张勋发动复辟之时，$FNG_zhang_zuolin$为了进一步削弱冯德麟，便暗中将自己拥护复辟的消息泄露给冯德麟，使得彼时急切希望借助政治外力压倒$FNG_zhang_zuolin$的冯德麟进京高调拥护复辟——随着复辟失败，冯德麟被北洋政府逮捕，$FNG_zhang_zuolin$遂一举收编了整个28师，彻底夺取了他的兵权。\n\n冯德麟死后，他的儿子冯庸在张作霖军中效力。此人是游走于[FNG.GetNameDef]中的崭新势力，与中国青年党（YCP）有所关联。但我们如今也很难确认他是否仍对此事怀有怨气，或许我们可以尝试接触此人，试探他是否能以“冯氏集团”取代“张氏集团”。"
  JAP_pnr_event.6.a: "追加经费，调查新线索。"
  JAP_pnr_event.6.b: "继续按照现有计划进行调查。"
  JAP_pnr_event.7.t: "菊行动：调查告一段落"
  JAP_pnr_event.7.desc: "越是深入窥探[FNG.GetNameDef]的政府结构，我们就越是惊叹于他们整个系统的古老和——原始，使人不由得想起了中华地区古老的周天子分封制。整个东北中最富庶的奉天由“皇帝”，张氏父子牢牢控制着；发展程度次高的地区，如黑龙江和吉林则属于吴俊陞和张作相的地盘；集团之中资历较老，但当初曾有过背叛嫌疑，与冯德麟一同试图架空$FNG_zhang_zuolin$的汤玉麟则被分封（或是流放）到了因为几次直奉战争已经破败不堪的热河，与直系在前线对峙；像是张宗昌这样后来依附于[FNG.GetName]的军阀则被安置在外围，至于那些更年轻的军官则只能当上军团长或是各省督办，随着[FNG.GetName]撤回东北之后也都失去了自己的地盘。\n\n这一基于人身依附的权力结构完美地确保了张氏父子对[FNG.GetName]的统治无虞，位于内圈，掌握强大兵权的瓜分了利益的军官们根本不愿轻易支持有人打破这一分封制。现在想来郭松龄当初失败或许也与此有关。不过这也意味着位于权力圆环外围的军官们一定对此感到不满，或许后续行动我们可以转变思路，不再从$FNG_zhang_zuolin$身边人入手，而从外围物色合适对象。"
  JAP_pnr_event.7.a: "好像清晰了，好像又没有。"
  JAP_pnr_event.7.b: "说实话，要不问问张宗昌……"
  JAP_pnr_event.8.t: "反目的可能性：不可能"
  JAP_pnr_event.8.desc: "我们已经和$FNG_feng_yong$私下接触，然而情况不容乐观。在得知我们的来意之后，$FNG_feng_yong$义正言辞地要求我们离开，称自己不愿意和[JAP.GetAdjective]政府扯上哪怕一点关系。尽管直接接触失败了，我们还是对他的交际圈子和平时言行做了许多跟踪和研究：看起来$FNG_feng_yong$和他已经死去的父亲不同，对于争霸东北怀抱着一种厌恶的态度，甚至可以说是胸无大志的人。此人比起自立为王似乎更热衷于作为一个士兵行动。不知道他哪根脑筋搭错了，他在私下里支持着$FNG_zhang_xueliang$的事业，而对争夺[FNG.GetNameDef]的权力毫无想法。换句话说就是他现在给他父亲仇人的儿子在工作，想必他的行为早已招致了冯德麟昔日部下的不满，我们也没办法指望他能有什么号召力，能够动员起冯氏集团旧部对抗$FNG_zhang_zuolin$了。冯德麟如果在天有灵看到这一幕，想必一定要一枪崩死这个不孝子。"
  JAP_pnr_event.8.a: "实在不行就利用张景惠那个邪教徒吧……"
  JAP_pnr_event.9.t: "狗肉将军的电报"
  JAP_pnr_event.9.desc: "滚。"
  JAP_pnr_event.9.a: "火气这么大干什么。"
  JAP_pnr_event.10.t: "兰行动：陷入死路"
  JAP_pnr_event.10.desc: "如果我国真要寻找一位能够取代$FNG_zhang_zuolin$并能控制整个[FNG.GetNameDef]利益的人，我们首先便需要他利于操控，这并不意味着他一定是一个亲日派。地方军阀、联省自治分子甚至是民族主义者都无所谓，我们希求的此人一定是能和我国尽可能地共同开发[FNG.GetAdjective]资源，并且只有称霸东北，而无称霸中国的野心的人物。\n\n为了实现这一点，他必须对$FNG_zhang_zuolin$心怀不满，同时握有一定数量的军队或掌握着军备来源，最后他必须愿意和我国合作，尽管是一种短期的合作。这样的人物如今看来在[FNG.GetName]并不存在。或许我们唯一的选择只剩下$FNG_zhang_zuolin$了，支持他光复中华的计划，并确保战争的尽快结束才是我们应该考虑的。"
  JAP_pnr_event.10.a: "没有继续调查下去的必要了。"
  JAP_pnr_event.10.b: "或许还有可能性……"
  JAP_pnr_event.11.t: "柳暗花明：人选确定"
  JAP_pnr_event.11.desc: "尽管杨宇霆常被认知为[FNG.GetName]中的士官派成员，并且常常以[FNG.GetLeader]的管家自居。但我们的深入调查发现这只是单纯的误解，或者说对其认识的不全面。我们的调查人员发现杨宇霆本人其实是徐树铮的手下，这意味着他本人其实是皖系残党，难怪[FNG.GetLeader]始终与他保持着微妙的距离。\n\n1918年徐树铮与张作霖合作制造“秦皇岛劫械案”，抢劫了我国本来卖给冯国璋的军火，背后正是杨宇霆本人在牵线搭桥。徐杨二人本来的计划是上演“鸠占鹊巢”，借助[FNG.GetLeader]训练一支北洋少壮派部队为皖系所用，但未能料到直皖战争中皖系的覆灭。直皖战争后，也正是杨宇霆从中斡旋，将大批皖系相关人士带到了[FNG.GetName]。正因如此，多疑的[FNG.GetLeader]实际上并不信任这位“大管家”，只是出于利用的目的才暂时地宠信于他。随着杨宇霆的利用价值逐渐消失，适逢第三次直奉战争中杨宇霆败给了直系，[FNG.GetLeader]旋即将他架空，虽然明面上封他作总参议，但手下仅控制着兵工厂守备部队，失去了联合皖系势力，威胁[FNG.GetLeader]统治的能力。\n\n但正是如此，他才成为了我们的合作人选。在和杨宇霆私下接触后，他很乐意和我们建立“更进一步的互信关系”，但是我们首先要做的是确保他在[FNG.GetName]内部的立足，就如我们之前的调查结果那样，杨宇霆本人由于长期边缘化，在军队中实际号召力很小，我们必须从这里着手，打造一位新的“大帅”。"
  JAP_pnr_event.11.a: "到头来还是皖系靠得住。"
  JAP_pnr_event.12.t: "地方主义情绪反扑"
  JAP_pnr_event.12.desc: "地方主义势力“东北党”先前在我们的打击之下已经基本销声匿迹，但如今却突然又有死灰复燃之势。以幽灵的形式，今天早上有警察报告说在街上看到了反对[FNG.GetLeader]南下的标语，以及张贴在喧闹场所的传单，宣称[FNG.GetLeader]背叛了东北人民，“让父老乡亲为了他个人称王的梦想而流血牺牲”。这无疑对政府的信用造成了打击，也削弱了社会对[FNG.GetLeader]发动复国战争的支持。"
  JAP_pnr_event.12.a: "糟透了。"
  JAP_pnr_event.13.t: "社会支持复国战争"
  JAP_pnr_event.13.desc: "[FNG.GetLeader]提出要发动复国战争，光复全中国的倡议近日引得了社会的一致赞同，许多报纸都刊登了表扬我们政府的文章，偶尔也有一些民间团体自发地聚集，呼吁人们支援这场“正义之战”。国民沉浸在即将光复的喜悦中，我们的政府受到了几乎所有人的支持。"
  JAP_pnr_event.13.a: "我们众望所归！"
  JAP_pnr_event.14.t: "小火柴，大决心"
  JAP_pnr_event.14.desc: "一场漂亮的反击战！从1925年以来瑞典火柴托拉斯便大举向[FNG.GetNameDef]倾销火柴，并在接下来的几年内逐渐通过恶意降价和收买公司管理层的方式打击[FNG.GetAdjective]火柴。在邪恶的火柴帝国主义者伊瓦·克鲁格的计划下，瑞典人在几年内便侵占了长春和吉林等地的[FNG.GetAdjective]和[JAP.GetAdjective]火柴公司，并将其魔爪伸向了本土民族品牌的最后阵地奉天。\n\n在日本商业会议所和包括惠临火柴公司在内的几家的[FNG.GetAdjective]公司的合作下，大家组成了东北火柴同业组建联合会，以统一售价的策略抵制瑞典人的倾销。如今我们终于将瑞典火柴资本驱逐出了东北核心市场，这虽然是一场微不足道的，关于火柴行业的小小胜利，但它却是未来中日提携最终战胜白人帝国主义者的一个预兆。"
  JAP_pnr_event.14.a: "把洋货驱逐出去！"
  JAP_pnr_event.15.t: "陌生来电"
  JAP_pnr_event.15.desc: "夜色已深，屋里的所有人这几天为了确保行动准备万无一失便一直未曾休息，因此傍晚行动一开始后便都各个被睡神附体，昏死了过去。直到这阵震耳欲聋的电话铃声把大家都从睡梦之中震醒。上田三郎把手抽到桌上，一把拍住了话筒，怀着被搅扰好梦的巨大愤怒捏起了电话。仿佛就是个恶作剧电话一样，那头并没有声音传来。\n\n“混蛋！”他骂了一声，缓慢又清晰，发音和东京方言差不了多少。没想到那边突然也回应他骂了一声。“你们这些混蛋！你们怎么能这样对待帝国军人！”电话那头的声音委屈又暴躁，“爆炸和你们一样的报国军人坐的车子。呸！实在是太无情了！”\n\n“少佐，很高兴听到你没事，”上田一边口头敷衍着他，一边大拍桌子示意会议室里的其他人也赶紧打起精神，“我也没想到会发生这种事情，由于这任务是高度机密的，所以连你也不能提前通知就是了。”他抓着电话机走到了墙边，那里贴着$SHD_zhang_zongchang$的五辆铁甲专列的路线，而目标当初征用了其中的两辆，因此他肯定在其中之一上，至于这个电话——证明所有人都赌对了。“说真的，我在今天晚上一直一直没睡着觉，一直在为你默默祈祷，希望你不要有事，感谢上苍，如今看来神佛确实庇护了你。那么，他怎么样呢？”\n\n电话那头沉默了一会儿，随后对方的声音突然压得很低，但每个字都很清楚。"
  JAP_pnr_event.15.a: "“肯定死翘翘了，他直接从我身边飞出去了。”"
  JAP_pnr_event.16.t: "寄给某人的信件"
  JAP_pnr_event.16.desc: "久疏问候，一向可好？仁兄调职后，我一直惦记你的去向，在政府公报上也见不到你的消息。关于我在中央部名声不好这件事也不需要进行什么辩解。对于小人们的恶评和上司的胡乱批评，我有相当经验，已经不太在意了。最近中国战局虽趋活跃，但直奉之战况并无太大进展。于此现状下，尚难预断奉张之或没落或强盛。我正以一日千秋之心情，翘首以待该方面之喜讯。\n\n然而[FNG.GetNameDef]的现状是，[FNG.GetLeader]越来越蛮横，面对这种情况，实难容忍。而其原因，日本军阀不无过于助长他们傲慢之嫌。问题的解决，靠讲理谁也办不到，给点小恩小惠也不行。除武力之外，别无他途。不过使用武力也要选择名义和旗帜，这是很重要的。于是乎，只要稍有借口，就要当头一棒，以根本改变他们的对日观念。\n\n张之横暴，难以言喻。那些幻想施恩图报的日本人是用心良苦的老好人。零打碎敲，头痛医头、脚痛医脚不行。这次如果不以清算二十年来总帐之决心来对待，[FNG.GetAdjective]问题就不可能得到根本解决。\n\n死他一两个$FNG_zhang_zuolin$有什么了不起！这次一定要干！即使受到阻止，无论如何也要干！司令部那些人，独断专行，不和别人商量，别人只能遵守其规定、服从其命令，什么都不告诉我。我也喜欢动乱。而且无论什么问题都需要制造个借口，去年，前年，都很想干，但未能如愿。今年一定要达到目的！以后流放到什么地方去，或被解职，我都不在乎。后事就托付给仁兄你了。\n\n我想这次一定要抓住这一大好机会，"
  JAP_pnr_event.16.a: "在东北搞得血肉横飞，"
  JAP_pnr_event.16.b: "相信这是根本解决方针。"
  JAP_pnr_normal.1.t: "步兵进一"
  JAP_pnr_normal.1.desc: "大叔收，中央委员会的意思，已经过麻里转达给了我，我想其它的细胞如今也收到了中央的指令。在去年发生了那种间谍渗透事件，使得青山和伊万，以及执行抢劫的同志们被逮捕。故而中央要求发动再登记运动以排查党内叛徒这一点，我们是完全支持的。然而在这段时间里，我们听说有一些诚实的同志只是诚恳地批判了自己的弱点和不足，就被中央认为不可信，要求“从头再来”；在再登记期间，一些参与了运动的同志却离奇地遭到逮捕，这些事情无疑是令我们震惊。我们认为，这一系列实施再登记的方式除了损害了党的权威，更令同志们对党不安。中央当前的路线也使各党部感到迟疑——我们认为，党的资金决不能再通过家屋资金局和“战斗的技术团”，特别是通过违法且暴力的行为来获取。盲目的暴动既难以得到广大日本群众的支持，也只会招致反动的日本政府对党的细胞与赤旗本身的疯狂绞杀。对同志们的大搜捕难道不就是因为如今中央采取如此暴力且激进的手段才引发的吗？\n\n正是这种极左主义导致了党的孤立化、宗派化。有一些同志已经在怀疑，在发生间谍事件之后发动各地党员的再登记运动以及逮捕风波，要是是因为中央委员会里有间谍就糟了。我们认为，党的形态本身，必须进行必要的，深刻的反省，党的口号和宗旨，已经被孤立于群众要求的浓厚教条化所支配。我们批评中央委员会，我们认为中央陷入了宗派性的唯我独尊主义，机关中心的街头主义，盲目的暴动主义，形式上的官僚主义。我们要求现在这个浮在空中的中央立刻回到群众之中，不要再延续前委员长遗留下来的路线，要与群众紧密地结合在一起，就这一点，目前中央既没有意识到，也完全没有实践。我们这些群众中的党员，我们这些与中央相对的“地方”，我们也已收到了野坂参三主席从[CHI.GetName]的来信，我们绝不会接受这个受到了中央蛊惑而下达的命令，我们绝不会解散。为了所有人团结在一面赤旗之下。\n\n我们将切断和充满了流氓官僚的中央的联系。"
  JAP_pnr_normal.1.a: "切断和这些热衷于破坏党的挑拨离间者的联系。"
  JAP_pnr_normal.1.b: "切断和自称中央委员会的流氓分子的联系。"
  JAP_pnr_normal.2.t: "新的中央委员"
  JAP_pnr_normal.2.desc: "为寻求具有大众性的实践运动前进，而非在中央的指示下进行宗派性的自我毁灭，本着这样的想法宫内勇、山本秋和相马胜义才领导了日本共产党内的多数派运动，并且很快得到了几乎是所有日共地方支部的响应——所有人都已经无法忍受党中央为实现“共产主义的觉醒”而根据《1932年提纲》采取的暴力行为和恐怖革命了。\n\n尽管说下了那样的话，即便是留下了“收到了在[CHI.GetName]的野坂参三主席的命令也绝不会解散！”这样的豪言壮语，但实际上只是凭一时的冲动做出的，只是灵魂和身体都在说“这样不对！”所以才顺从了直觉，回应了它的呼声。事实上多数派的大家如今对运动将去往何方相当茫然。\n\n由于与法国总部联系的切断，一些先前相当坚定的党员又开始自我怀疑起“多数派”运动的正当性，这无疑使运动日渐衰弱下去。多数派的旗手们不得不找到另一个有威望的人来统合起整个运动。\n\n然而放眼整个日本，除了位于北海道的日共中央之外，谁还有这样的威望？本着争取“多数”的根本原则，三位临时领袖在长久交谈之后决定采取“加入战术”，他们首先联系了从事妓女解放运动，和社会大众党关系密切的南喜一，此人曾是日本共产党的重要人物，在田中清玄控制共产党时组成了“解党派”，认为应当停止极左暴力行为，转向合法的大众斗争，他的行为被党中央称为“叛徒”。但多数派们相信“解党派”不过是比自己更早意识到错误的老前辈，而且南喜一的出身与资历足够，正可以作为多数派的“新中央委员”统合整个运动。\n\n在经过紧张商谈之后，三人推举南喜一为“新的中央委员”，随后南喜一宣布日本共产党（多数派）就此解散，并将相关人员引荐给社会大众党左派。三位领袖在另立的党内新刊《多数》上除了宣布解散之外，还号召全体运动的支持者加入到包括社会大众党在内的一切合法的群众团体、群众政党中去，以促成日本左翼群众的大团结和统一阵线。尽管$JAP_pnr_kato_kanju$的$JAP_pnr_syndicalist_party$是议会中的合法政党，但其实力太过弱小，只适合联合而不适合加入。在和山本宣治与麻生久进行了长久的会谈之后，多数派正式加入了社会大众党左派——名义上多数派运动已经解散。\n\n长期非法的共产党组织解散和公开加入行为自然在政府内引发了一场骚乱，但在了解前因后果，特别是了解到这些人已宣布放弃“暴力袭击”和“推翻天皇制”之后，这场骚乱便很快平息。"
  JAP_pnr_normal.2.a: "我想我们大概走在对的道路上。"
  JAP_pnr_normal.2.b: "他们自己就溃散了，现在只剩可恶的袴田……"
  JAP_pnr_normal.3.t: "1936年日本众议院大选"
  JAP_pnr_normal.3.desc: "随着关于《国家保安法》的争执终于告一段落，无论本届内阁是认为他们在当下胜券在握，还是受到了外部压力认为此时已经进入到了不得不解散的关头，[JAP.GetLeader]都在今天早上众议院开会前宣布将解散重新举行议员选举。\n\n解散消息并未激起太多波澜，不论是社会媒体还是各大在野党派都已经预料到随着关于《国家保安法》的相关事务结束，众议院解散和内阁总辞职总会来一个——并且大概率会是前者。一些较为乐观的媒体甚至将此次议员选举称为“扫清选举”，认为这次选举结束之后的众议院议员们届时将会走入即将竣工的新国会议事堂，而地点和议员面貌上的一新必然能带来政治世界的新风。\n\n当然一些长期以来唱衰日本政治前景的媒体则认为这次选举什么都不会改变，帝国议会依然会维持僵局状态。其中一些评论家认为各党派之间应该各退一步，发扬1927年“护宪联盟”的精神来达成某种提携，形成“国民的全部联盟”。而一些更激进的声音则呼吁，如果这次议会中依然没有绝对多数党，则应该让一位超越于各党派之外的人物担任首相，博取各党人物组成全新的内阁。总之如今各党派的党务系统都已催动他们的宣传机器开始进入全速工作状态，从东京到最偏远的东北农村都出现了各政党准备的临时演讲台。"
  JAP_pnr_normal.3.a: "增强警备！开始1936年选战！"
  JAP_pnr_normal.3.b: "就让我们开始运用《国家保安法》吧。"
  JAP_pnr_normal.4.t: "1936年第一次选举结果"
  JAP_pnr_normal.4.desc: "随着投票日的到来，这场持续四十天的选战在今天晚上八点正式落下帷幕。虽然在投票日之前留给各党派的宣传时间里偶有冲突发生，但总体来说各大党派之间仍维持了基本的体面。根据《普通选举法》，计票将在投票日的第二天才正式开始。这一设计显然有着极为现实的考量，农村地区、偏远岛屿与山区的票箱比起一臂之遥的东京票箱来说更可能在运达中心计票点之前遭遇意外。\n\n幸运的是今年的选举没人打票箱的主意了，在开票监票人的陪同下，计票点管理人员已经在统计各党派收获的票数，待到计票结束，其结果令所有人感到意外。"
  JAP_pnr_normal.4.a: "民意如此，岂能违背？"
  JAP_pnr_normal.4.seiyukai_tt: "根据1936年选举结果，$JAP_pnr_social_conservative_party$将成为执政党"
  JAP_pnr_normal.4.national_populist_tt: "根据1936年选举结果，$JAP_pnr_national_populist_party$将成为执政党"
  JAP_pnr_normal.4.authoritarian_democrat_tt: "根据1936年选举结果，$JAP_pnr_authoritarian_democrat_party$将成为执政党"
  JAP_pnr_normal.4.social_democrat_tt: "根据1936年选举结果，$JAP_pnr_social_democrat_party$将成为执政党"
  JAP_pnr_normal.4.social_liberal_tt: "根据1936年选举结果，$JAP_pnr_social_liberal_party$将成为执政党"
  JAP_pnr_normal.4.market_liberal_tt: "根据1936年选举结果，$JAP_pnr_market_liberal_party$将成为执政党"
  JAP_pnr_normal.5.t: "谁来战斗？"
  JAP_pnr_normal.5.desc: "东京帝国大学“新人会”前成员，日本共产党的创党元老之一，社会大众党的前成员，如今$JAP_pnr_national_populist_party$的党首赤松克麿在今天于东京组织了一场竞选演讲，除了党派本身的施政承诺之外，演讲中还包含了对当下的“红色阴谋”的批评：\n\n诸君！自欧洲世界大战之后激发的所谓工团思想而觉醒的无产阶级战斗的前卫分子，在日本则展现为了另一种可耻的恐怖主义的面貌！这些手持神圣经典的教条主义者既没有分析我国资本主义的发展过程——更遑论我国并非资本主义社会——也不理解普遍的劳动大众的心理。诸君！请看看所谓“战斗的前卫分子”的真面目吧：在高举着解放大旗的情况下，在国家最困难的时刻煽动罢工，无法体悟国家和资本业者的难处，一味地要求工资和待遇的提高；更有甚者煽动恐慌，用所谓革命掩饰自己暗杀、勒索与抢劫的勾当。\n\n这些幼稚的神经衰弱者，信条的盲目遵奉者，不能以科学的精神和客观的视角分析我国的现实条件，便被所谓欧洲的“革命家们”教唆，在所谓社会即将崩溃的幻觉下一个劲地前进。请回忆吧！从最可耻的诱拐和抢劫案，到更温和的罢工运动，我没有看到社会本身的崩溃，我看到的是左翼分子在我们中间迫使社会崩溃，而我们的社会就是不如他们所愿地崩溃！是时候夺回真正的社会主义了，有志向的诸君，我们一道结束亡国的左翼分子对国家的荼毒，让真正普遍大众的幸福，让真正科学的社会主义得以在世间实现，这是作为各位国民之总代表，我赤松克麿的首要任务。\n\n赤松克麿的此次公开演讲引发了许多左翼团体的猛烈抨击，他们称其为“工人阶级的叛徒”和“社会主义的骑劫者”。稍晚些时候$JAP_pnr_national_populist_party$的演讲现场遭到了工人团体的冲击。"
  JAP_pnr_normal.5.a: "我们将追随真正科学的社会主义！"
  JAP_pnr_normal.6.t: "我们代表了大众"
  JAP_pnr_normal.6.desc: "谁能想到在过去仅有个位数席位的社会大众党在今天竟能发展到此等雄伟规模，作为议会中的第三大党与立宪政友会和立宪民政党正面交锋。在田中义一大将借助《治安维持法》大肆破坏日本的结社自由的时候，大多数左翼政党都在这无情的风暴之中被扣上“工团主义者”的帽子随之凋零了。在左翼运动来到了生死存亡的关头时，仅存的三个合法左翼无产阶级政党：全国大众党、劳农党和社会民众党选择合并以团结力量，避免被田中大将的统治各个击破。\n\n随着田中义一内阁的倒台，社会大众党也终于渡过暗夜，迎来属于它的黎明。尽管在此期间发生了一些不甚乐观的事件，但这个左翼联盟政党依然在向前迈进。如今的社会大众党内部由委员长，基督教社会主义者安部矶雄统帅，他的副手是东京大学“新人会”前成员，秘书长麻生久，二人分别是原先社会民众党和劳农党的党首，因此他们虽然在社会大众党内部有着名义上的主副之分，但实际上则是在共享着对党内的权力。\n\n在本次竞选演讲上，安部矶雄首先重复了社会大众党一贯的温和态度：反对资本主义，反对暴力的社会主义（在大多数情况下，这指的是布尔什维克主义和战斗工团主义）以及反对国家民粹主义。安部委员长在演讲的结尾继续宣称将通过温和且合法的方式继续在议会之中促进“大众的福利伸张”，而麻生秘书长则主要谈到了社会各阶层之间的广泛联合，特别是以当前有力量和权力的组织组成“先驱者”以引导并塑造社会走向对应的方向。尽管二人所代表的党派暂时团结在同一个党内，但彼此之间的路线分歧依然难以被忽视。"
  JAP_pnr_normal.6.a: "很有趣，但权力分散不一定是好事。"
  JAP_pnr_normal.7.t: "我们应该承诺什么"
  JAP_pnr_normal.7.desc: "短命的“宪政联盟”在击败田中义一之后也迅速走向了分裂，宪政会最终未能在帝国议会中击败彼时因完成宪政恢复壮举而风光一时的政友会总裁$JAP_pnr_inukai_tsuyoshi$，现在回顾当初的错误或许是急于打造能站在前台的“宪政之神”而最终招致了宪政会的落败。在那之后，$JAP_pnr_social_conservative_party$很快吸纳了因田中义一隐退而陷入混乱的政友本党，而宪政会则改组为了立宪民政党，他们将自己的目光放在了当时迅速崛起的城市居民身上，主张“团结新兴力量，成为主导未来十年的强大力量”。\n\n但历史总会首先说出答案，在过去十年里，$JAP_pnr_inukai_tsuyoshi$的统治屹立不倒。这也是$JAP_pnr_market_liberal_party$本次党内大会的主题：$JAP_pnr_hamaguchi_osachi$就为什么在过去十年中持续遭到$JAP_pnr_social_conservative_party$压制而做了总结，他认为这是由于$JAP_pnr_social_conservative_party$本身的“明星效应”和国民的政治惯性所致。而随着$JAP_pnr_inukai_tsuyoshi$之死——阴险地说，$JAP_pnr_market_liberal_party$再一次获得了与其同台对抗的机会。在本次大会的最后，$JAP_pnr_hamaguchi_osachi$对未来几十天内要进行宣讲的基本承诺作了简短的叙述，首先要牢牢抓住各大城市地区居民的选票，向他们承诺要解决社会不安的“扫净”，城市教育的拓展，手工业和独立从业者的救助与包括农产品宏观价格调控在内的城市居民焦虑的问题。\n\n$JAP_pnr_market_liberal_party$自改组之后便维持着全党一致原则，总裁的命令即是党路线的方向，$JAP_pnr_hamaguchi_osachi$的权威不容质疑。"
  JAP_pnr_normal.7.a: "$JAP_pnr_hamaguchi_osachi$是对的。"
  JAP_pnr_normal.8.t: "悬峙议会的未来"
  JAP_pnr_normal.8.desc: "$JAP_pnr_adachi_kenzo$回望自己过去的人生，就算是为刺杀闵妃出谋划策的时候都没有这般费力气。$JAP_pnr_authoritarian_democrat_party$最初只是自己为了通过组建新党来激发$JAP_pnr_market_liberal_party$和$JAP_pnr_social_conservative_party$内的危机，从而迫使他们重新联合成“宪政联盟”这一联合政府形式，打破悬峙议会的一件工具，然而事与愿违，这一跨党派的合作联盟最终未能实现。而$JAP_pnr_authoritarian_democrat_party$内部也因此顿时分裂为了两派，即主张既然逼迫失败，就该解散重返$JAP_pnr_market_liberal_party$的，发动“回归本部运动”的山道襄一；以及主张既然现实证明旧两党拒绝变革，就该由$JAP_pnr_authoritarian_democrat_party$推进政治进化的，要求“自立新党”的中野正刚，两派的冲突瞬间撕裂了这个本来就是权宜之计的暂时政党。从主张重点关注农村问题，与农业恐怖分子橘孝三郎私交甚笃的风见章到鼓吹要向萨文科夫、莫斯利甚至是墨索里尼学习，在日本组建强力政府的杉浦武雄，党内成员各行其是，不受丝毫管辖。$JAP_pnr_adachi_kenzo$就这样坐在了无人信服的宝座上，作为党首挥舞着毫无统治力的指挥棒。\n\n或许最幸运的就是到准备选举的时候，主张“回归本部”的党员为了在选举中做出一些成绩，证明自己对$JAP_pnr_market_liberal_party$有着足够的价值，正紧锣密鼓地筹备着选举；而主张“自立新党”的成员中野正刚则更是对选举活动极为上心，他发动自己在《东京朝日新闻》担任记者时期的人脉，自作主张地在报纸上发动了近乎洗脑式的宣传攻势，$JAP_pnr_authoritarian_democrat_party$“本部”提出三大竞选纲领：首先是检讨自《上海条约》之后形成的国际秩序，日本将成为带动世界观念变革的先锋力量，组建强大的亚洲联盟；而后是正确运用名为国家的强力装置来摧灭剥削，促进收入再分配并帮扶中小企业和农业合理化；最后是进一步推进民主化，实现国民大众积极参与政治生活的正义社会。\n\n这些承诺从未和$JAP_pnr_adachi_kenzo$甚至是其它党员商讨过，不过大多数党员只要走上街头听到有人在谈论$JAP_pnr_authoritarian_democrat_party$，对中野正刚的怨气也瞬间消散了。"
  JAP_pnr_normal.8.a: "强有力的国家之手会解决所有问题，包括承诺本身。"
  JAP_pnr_normal.9.t: "回溯本心"
  JAP_pnr_normal.9.desc: "$JAP_pnr_social_conservative_party$很快就从失去了$JAP_pnr_inukai_tsuyoshi$的阴影中走了出来，老实说，这对$JAP_pnr_social_conservative_party$造成的影响远不及原敬被刺杀要大。随着宣传机器正式启动，党内各大派系也已经放下分歧，共同对外。与其它党派不同的是，他们立刻开始着手炒作“$JAP_pnr_inukai_tsuyoshi$的遗产”，诸多$JAP_pnr_social_conservative_party$候选人都以此作为自己演讲的题目，其内容也是同样地通过回顾$JAP_pnr_inukai_tsuyoshi$从1926年宪政恢复至今的执政历史，达成的执政成就来试图向选民们暗示即便失去了这位昔日的掌舵人，$JAP_pnr_social_conservative_party$也是他们最好的选择。\n\n但在讲述昔日的荣耀之外，$JAP_pnr_social_conservative_party$拿出的竞选纲领则延续了他们一贯的传统：基本毫无变化。党内长老们依然维持着一贯的保守主义立场：即一边推行较为温和的农业问题解决方案，一边扩大农村地区公共事业的投入，以及呼吁选民们用手中的选票巩固政党内阁。在这些竞选承诺之中最激进的莫过于继续推进扩大市町村基层组织的权力，以及承诺将推进府县知事公选来防止中央政府通过官选地方官来影响地方政策。作为一个保守政党来说，提出这种计划已属于$JAP_pnr_social_conservative_party$最激进的承诺了。\n\n而$JAP_pnr_social_conservative_party$对选举本身如此糊弄自然有他们的原因，在演讲之外，党务机器正在疯狂喷吐着钞票，流向各大选区负责组织选举的头人的皮包，这一通过利益交换的买票战术虽然已在1928年普选后的选举中越来越失去其价值，但$JAP_pnr_social_conservative_party$显然产生了路径依赖。毫无疑问，$JAP_pnr_social_conservative_party$希望通过继续推行保守主义政策来吸引那些渴望政权稳定可靠的选民的支持，再借助金钱收买一批立场不坚定的摇摆票，但在如今该竞选策略是否奏效或许只能等计票结束后才能知道了。"
  JAP_pnr_normal.9.a: "或许我们可以再相信一次……"
  JAP_pnr_normal.10.t: "大陆干涉"
  JAP_pnr_normal.10.desc: "[JAP.GetName]与中华彼此的命运自数千年前就交织在了一起。公元57年，奴国使臣从日本岛出发前往河南洛阳觐见后汉光武帝，皇帝赐予其一枚印章和一条绶带，这被认为是中日关系之间的开端。然而时过境迁，昔日的宗主如今陷于衰弱分裂之中，而[JAP.GetName]却已成为世界列强之一。从未有比现在更好的时机维持一个分裂而不统一的大陆，一个联而不合的诸邦。\n\n日本的大陆干涉政策基于一条根本性原则：维持大陆的均势，并假如在中国展现出统一的迹象时，移动桌上的棋子（[FNG.GetName]与其它合作者）将其击溃。然而这一原则存在着根本性的悖论，[FNG.GetName]并非对东京言听计从，[FNG.GetLeader]就和十年前一样，始终有着入主中央，统一中国的愿望，这使得他难以被我们操控。为此[JAP.GetName]必须在接下来的冲突中或寻找潜在的合作者，或通过冲突巧妙地将大陆局势导向对自己有利的状态。本次解锁的大陆干涉决议$JAP_pnr_shanghai_strike_category$便是一个教学性决议组，随着事件的一步步深入，[JAP.GetName]能够把[ANQ.GetName]争取到自己的一方。我们将在之后大陆上发生的许多冲突事件中大显身手，在幕后轻轻勾动傀儡丝线并谋取利益。\n\n然而挑战依然存在，我们在亚洲的最大对手[GEA.GetName]将随着我们逐渐涉入更多大陆上的冲突而对我们提高警惕，他们将随着时间推移逐步升级与我们之间的冲突——直至全面开战。我们必须借助决议和事件巧妙地维持冲突烈度在较低等级，令柏林误判远东不会发生大规模冲突，以避免[GEA.GetName]获得增援。"
  JAP_pnr_normal.10.a: "我大概明白了。"
  JAP_pnr_normal.11.t: "圣上陛下亲临，陆军演习堂堂开幕！"
  JAP_pnr_normal.11.desc: "【信越地方专电】承蒙浩荡之天恩，今日正值严寒将终，早春初显之清爽佳日。圣上陛下为亲自统监在信浓川流域附近所举办之特别演习，特由东京亲临演习现场。黎明破晓时分，陛下骑白马驾临统监部。大元帅之威光赫赫，随即对两军之作战地带展开御览。\n\n迎接圣驾的我精锐陆军将兵，无不激荡着忠勇义烈之气魄，布阵于漫山遍野。今日的演习之中，面对设想敌北军于河流对侧布置之防御阵线，我南军各师团师团敢于从西侧发动果断决然之大突击，隐秘渡河并击破其西部防线，策应已在外围假想之港口城市中驻军发动闪电急袭。\n\n在各位将士团结一心的紧密协同下，一举粉碎了敌军的坚固阵地。其迅速果敢之进击，实向天下彰显了“帝国军人无可匹敌”之威容。沿途之中，数万帝国子民为瞻仰圣驾而肃立平伏，齐声高呼“万岁”以祝圣寿无疆，欢呼声响彻山谷。本次演习预计将持续数日，必将再次证实我帝国国防之完美卓越。"
  JAP_pnr_normal.11.a: " 这么看来今年也不需要增加军费了。"
  JAP_pnr_normal.11.b: "战争贩子去死，税金小偷去死。（好戦的な戦争屋は死ね，税金泥棒は死ね）"
  JAP_pnr_normal.12.t: "北国之春"
  JAP_pnr_normal.12.desc: "大门突然吱呀一声地被推开了，阳光卷着冷气冲入了这个小屋，把袴田里见吓得停下了手里编项圈的活计。党的运作需要经费，自从开始间谍整肃和“再登记”运动之后，“家屋资金局”已经接近瘫痪，同情者的汇款也为了避免被政府追踪到而切断，因为“多数派”将袴田里见的样貌和走路姿势全部发表在他们分裂的“党报”《多数》上，袴田立刻带着党中央转移到了北海道。如今的党只依靠着这位“最后的委员长”编项圈和其它几名党员工作的工资来维持着运作。“若松，你吓到我了。”在看清来者是党内的元老，自己的战友若松龄之后，他才放下心来，“你已经把《赤旗》都发完了吗？”\n\n“是的，实际上还有些不够，我想我要再抄写一些。”她把门带上。“如果你是担心那些到处散播你长相和行走姿势，说我们是“间谍党中央”的多数派，”若松龄把大衣挂在墙上，“我有个大概是好消息的消息：多数派大张旗鼓地解散了，闹到了登报的地步，现在再也没有多数派了。顺带一提，他们已经帮你把日本共产党一起解散了，中央委员长。”看着眼前的男人陷入沉默，她一边向里屋走去，一边背诵起自己在报纸上看到的宣言：“我们没有清醒地看到广大群众摆脱偏见的幻影，党内根深蒂固的宗派主义对共产党形象的破坏，使它与广大人民之间产生了障碍。我们首先宣布对[JAP.GetAdjective]宪法的完全拥护，我们其次主张和平且合法地发声，我们最后宣布解散，真正走进广大人民群众中——”“间谍！叛徒！革命的懦夫！全都是叛徒和间谍！大泉兼藏！饭塚盈延！小畑达夫！全他妈是间谍，是运动的破坏者，现在还连名字都要夺走。在押送路上夺取锅山贞亲的计划是谁走漏的，哪些人知道这个消息！是谁背叛同志——‘光’，没有谷口的消息吗，她现在在哪儿……”\n\n“我们现在很安全，相信其他同志也很安全，”女人按住了他，试图平复他的情绪，“对你来说我不知道是好是坏，但总之——”她把那叠纸片递了过去，上面是用铅笔抄写的歪扭的“赤旗”两个字。\n\n“这是你的《赤旗》报。”"
  JAP_pnr_normal.12.a: "他捏着那脏兮兮的小纸片，石墨沾在了手指的茧子上。"
  JAP_pnr_normal.12.b: "他们为什么要内斗？"
  JAP_pnr_normal.13.t: "严酷的革命"
  JAP_pnr_normal.13.desc: "1924年田中义一大将颁布的《治安维持法》宣布了恐怖统治的开始，在对社会运动无情镇压的现实之下，许多有着激进思想的左翼组织都纷纷宣布放弃他们之前的诉求并支持政府，以换取在《治安维持法》下的安宁。然而主张布尔什维克主义的日本共产党是其中的少数，他们公开采取与政府敌对的态度，并“狂妄地”在他们所控制的各个农业和工人组织中都公开宣称要“废除天皇制”。这自然招致了田中义一大将对他们的打击。\n\n在一场严酷的大逮捕之后，日本共产党并未缓和自己的观点，而是在东京帝国大学“新人会”会员田中清玄的带领下开始了和政府之间的武装斗争，拉开了日本共产党成为暴力团体的序幕。在田中的指导之下，共产党员们建立了“革命技术部”，使用匕首、铁棍、长刀以及从[LEC.GetName]和[RUS.GetName]走私的机枪和手枪在街头展开了对警察的袭击。尽管田中义一已经倒台，但共产党依然维持着它的袭击惯性。\n\n正是在这个时期发生了第一次“多数派”运动，南喜一、水野成夫和神山茂夫等反对党内极左路线的人组成了“解党派”，宣布断绝和巴黎的联系，停止恐怖袭击，放弃废除君主制的口号。他们立刻被宣布为党内叛徒。1930年7月，田中清玄在参加工人大会后返回的路上被捕，有叛徒泄露了他的行踪，这预示着日本共产党进入了下一阶段。\n\n1930年，“巴黎艺术与科学之友人协会”——日本共产党在巴黎的总部——将索邦大学毕业生风间丈吉派遣至东京重建共产党，日本共产党也迎来了它史上最强大的时期，这一时期的日本共产党每月能获得六万日元的流动资金。在风间丈吉的指示下，原先的“革命技术部”被改组为“家屋资金局”，通过合法手段从社会各界吸纳那些同情者的捐款，通过非法手段敲诈勒索，甚至是抢劫银行来筹集革命资金。但在一场被党内叛徒出卖的抢劫之后，包括风间丈吉在内的许多党员被逮捕了，随后的营救行动也被泄露给警方，致使更多同志锒铛入狱。接手党内控制权的袴田里见决心对党内进行清洗，以排除所有叛徒——他要求所有党员进行自我检讨并把所有个人信息都登记到党中央，这激起了许多早已对党内极左暴力路线不满的党员的愤怒，他们迅速结成“多数派”，反对袴田的“再登记运动”。如今袴田里见控制的“日本共产党”不过是只有六人的一个小组，而群众，“多数”们已经站在了他的对立面。"
  JAP_pnr_normal.13.a: "原来如此。"
  JAP_pnr_normal.14.t: "这发生在未来的某一刻"
  JAP_pnr_normal.14.desc: "他看了看自己的腕表，现在是凌晨12点22分。此前他向仓茂周藏以探望病人的名义请了假，为的就是参与到整个事件之中。列车几乎晚了一个小时，而此时弘前也下着小雨。换作平时，自己的那位侍从一定会着急地跑过来给自己撑伞，然而此时这位尽责的侍从却正留守在东京。这也是他之所以选择这班列车而不通过青森前往东京的原因，按照约定，一位共犯将在随后和自己一同前往东京。列车将途径奥羽线和上越线，而他则因心中的这个秘密一夜未眠。等列车到了上越之后又加挂了一节车厢，另一位同谋者正是在这里登上了火车，进入了他的包厢。\n\n“殿下，”平泉澄，曾为自己授课过的东京帝国大学教授，同时也是这场不能轻易说出的秘密的同谋者之一，“我想事已至此已经没什么好说的了，我只想确定您最终的意见，这样等我们到了东京就能决定采取什么行动。”当然，东京中发生的不祥事件已经传到了他的耳朵里，而他自告奋勇，无论如何都要阻止亲王那无谋的行动。但若这位劝阻者本身便参与了共谋，那一切行动的意义就全部反转。\n\n“宣仁——”，他的语调相当平淡，“没和你在一起，所以这意味着他拒绝了。”在得到了对方肯定的答复之后，年轻的亲王陷入了短暂的思考。对于这或许将决定时代变化的最后之问，锦旗的拥有者，秩父宫雍仁亲王给出了他的答案，而这答案也必然决定了在这车厢之外的那些人的最终命运。"
  JAP_pnr_normal.14.a: "干吧。"
  JAP_pnr_normal.14.b: "我不能支持……这并非我的意愿。"
  JAP_pnr_normal.15.t: "昭和神圣会的阅兵"
  JAP_pnr_normal.15.desc: "一张有点尴尬的照片占据了今天早上新闻的头版。昭和神圣会的统管$JAP_pnr_onisaburo$今天在他的“大本教”核心地带举行了一场阅兵。而这张照片正是关于这场阅兵的。\n\n当时的具体情况是昭和青年团的成员站成一排等待$JAP_pnr_onisaburo$进行检阅，而这位“圣师”则在两辆挎斗摩托车，以及在空中巡游的“赤蜻蛉”飞机的护送下登场了：在两辆摩托车上都有各一名昭和神圣会成员手持会旗，而$JAP_pnr_onisaburo$本人则骑着白马缓缓移动检阅他的“圣骑士团”，当这位宗教家走过他们面前时，他们立刻扬起双手高喊“天皇万岁！”，而$JAP_pnr_onisaburo$则在白马上也举起握紧拳头的左手，高喊“天皇万岁！皇国日本万岁！”。\n\n这张戏剧性的“万岁照片”被出席这一检阅仪式的记者抓拍，一些批评家称这是大本教和昭和神圣会对天皇威严的赤裸裸践踏，然而昭和神圣会的另外两位关系人士，长期以来鼓吹天皇尊严不可侵犯的右翼巨头头山满和内田良平则并未急于划清界限，站出来抨击$JAP_pnr_onisaburo$的行为，恰恰相反，他们一直对这些针对$JAP_pnr_onisaburo$的批评保持沉默，甚至有传闻称内田良平在私下的酒会中把那些批评家称为“不通皇道，不知大本的过度反应者”。"
  JAP_pnr_normal.15.a: "真是岂有此理！他以为他是谁？天皇吗！"
  JAP_pnr_normal.15.b: "只是一贯地搏媒体眼球罢了……"
  JAP_pnr_normal.16.t: "最后的工人政党"
  JAP_pnr_normal.16.desc: "$JAP_pnr_syndicalist_party$的首脑$JAP_pnr_kato_kanju$在今天开始了他的竞选宣传。尽管他将自己的政党称为“帝国议会中最后的工人政党”，但这一方法也未能吸引到超出预期的关注。由于各种原因，工团主义者们在这个国家并不受到太多欢迎，就算是在帝国议会中他们也是边缘派系，这显然是由于两方面原因造成的：其一是宫中集团本身对这种“不安分的斗争左翼”的提防，其二则是他们本身的尴尬定位：较温和的选民们会选择支持社会大众党，而更激进的工人们之前已经采取行动，成为了日本共产党的战斗团的一员了。不出意外的话今年也可能维持帝国议会中的边缘小党不变。对此一些成员已经表达了不满，他们希望既然多年以来该党都未有起色，为了实现广泛工人运动的统一，干脆与社会大众党中的左翼合流……"
  JAP_pnr_normal.16.a: "老实说，他们的椅子已经有人了。"
  JAP_pnr_normal.17.t: "东京站"
  JAP_pnr_normal.17.desc: "平泉澄登上火车和雍仁对话。（只有在三次都宣布支持裕仁的情况下触发）"
  JAP_pnr_normal.17.a: "政治博弈可比犁式制动要难多了。"
  JAP_pnr_normal.18.t: "卓别林访问[JAP.GetName]"
  JAP_pnr_normal.18.desc: "活跃于[USA.GetName]的著名导演兼喜剧演员查理·卓别林近期访问我国。卓别林先生执导的讽刺喜剧电影《摩登时代》于今年2月在美国首映。该片讲述了那个对于各位观众来说无人不识的流浪汉在大萧条时期是如何在现代工业化世界中挣扎求生的。“黑色星期一”事件与该片的上映时间几乎同步，为其增添了一丝与当下现实对照的沉重。完成电影之后，卓别林先生便和本电影的女主角宝莲·高黛，他的银幕搭档——本报也同各国其他从业者一样，不清楚那位究竟算不算是卓别林夫人——开始了环球旅行，在抵达日本之前，卓别林先生暂时停留在[LEC.GetName]，尽管数百公里外[LEP.GetName]的骚乱仍在持续，但在我国驻扎在[LEC.GetName]的上海军的保护下可谓是安全无虞。\n\n宝莲·高黛女士目前暂留于[LEC.GetName]接受各家媒体采访，那位人人都认识的“无敌流浪汉”则乘船造访我国，四年之前卓别林先生在《城市之光》取得巨大成功后便来到我国参观，$JAP_pnr_inukai_tsuyoshi$前首相当时热情地接待了他，并向他展现了独属于亚洲的迷人一面，卓别林先生也用他的访谈忠实地证明1932年的[JAP.GetName]作为亚细亚模范国家的真实不虚。\n\n如今政府决定再次指派$JAP_pnr_inukai_tsuyoshi$前首相接待卓别林先生，相信一位老熟人能让他在日本度过一段舒心愉快，且依旧难忘的经历。"
  JAP_pnr_normal.18.a: "欢迎我们最可爱的西方朋友！"
  JAP_pnr_normal.18.b: "喜剧……舶来品……自由主义……日本堕落的根源……"
  JAP_pnr_normal.19.t: "去看相扑吗？"
  JAP_pnr_normal.19.desc: "其实没有什么变化，在过去当首相的十年里，每天的晚餐也是白米饭，渍物和醋渍青鳞小鲱鱼，还有偶尔出现的汤豆腐；当然现在不是首相了却还是没什么变化，早上头山先生托人给送来了一些点心，不过这也不是正餐。不过$JAP_pnr_inukai_takeru$可没得抱怨，毕竟自己的父亲可是吃得乐在其中，而且完全不觉得有什么要增添的必要。比起那位每天早上要吃麦片牛奶和法棍面包的元老来说，自己家更像是寻常庶民——\n\n“和喜剧之王度过的日子还愉快吗？”他喝了口味增汤，“这几天麻烦你去做了，$JAP_pnr_social_conservative_party$的那些家伙很开心吧，又增添了能大说特说的内容。”\n\n“我才想问您鼻子怎么样，医生有说什么吗？”讲到这里，$JAP_pnr_inukai_tsuyoshi$止不住地对他摆手：“还是老一套，做完检查就说很正常，能再活100年。完全是糊弄啊，去$JAP_pnr_social_conservative_party$当个干部吧。”看来宣布了“引退”的他倒是不介意在自己儿子这个$JAP_pnr_social_conservative_party$党员前说这种话。\n\n“无论如何他都想再和您见一面，”$JAP_pnr_inukai_takeru$托住下巴，“所以想知道您什么时候有空，5月14日，15日如何？我想可以订新喜乐的位置……”“我想在临走没什么事的时候再见吃个临别饭吧。你可以请他去两国国技馆看相扑，本月6日揭幕的话，15日正是西关胁双叶山对阵横纲玉锦，这可是亦师亦敌的一场精彩大战。”他夹起那根腌萝卜放在了米饭上，“如果错过就可惜了。而且带他去看相扑，对你个人还是别人很好的素材，至于和我吃饭则只能在不知道哪家花边报纸的版面上占一个小米粒的版面。”\n\n$JAP_pnr_inukai_takeru$还想说点什么，但是不知道什么时候，$JAP_pnr_inukai_tsuyoshi$已经伸出双手握紧了他的右手。"
  JAP_pnr_normal.19.a: "带他去两国国技馆看相扑，就交给你了。"
  JAP_pnr_normal.20.t: "社会催促我们尽快行动"
  JAP_pnr_normal.20.desc: "黑色星期一之后的日本经济处于可怕的低迷之中，许多报社评论家都将这次经济危机称为“第二次战后萧条”，并将其归咎于德意志帝国那充满危险的金融政策和作为军国主义国家无止境的贪婪。不过在最近几天，报纸上的攻击对象从[GER.GetName]悄悄变成了[JAP.GetLeader]，由于[JAP.GetLeader]内阁是在黑色星期一不久前才上台执政的，国民们虽然因恶化的经济形势而对现状颇有不满，但他们也清楚这对本届政府来说也是无妄之灾，人们相信内阁只是因为这一突发状况而陷入了暂时的混乱，而政府很快就会拿出应对措施来改善经济现状。\n\n不过时间证明他们似乎对[JAP.GetLeader]抱以错误的期待。截至目前，[JAP.GetLeader]及其内阁，特别是大藏大臣并未发布任何有关黑色星期一的救济政策，每当媒体问到政府是否制定了相关方案时，大藏省总是称相关问题正在研讨中并回避对该问题进行进一步回应。这使得民众怀疑本届政府实际上根本就无力应对这场经济危机，或者说，政府在故意忽视该问题。多家报社的社论都在质疑本届政府的执政水平：内阁并非陷入瘫痪，政府仍在除了经济领域外的各领域推动其相关工作。一些报纸讥讽[JAP.GetLeader]和其执政班底是“柜子内阁”，自认为只要关上柜子不去看就万事大吉。"
  JAP_pnr_normal.20.a: "这种民生大事急不得……"
  JAP_pnr_normal.20.b: "或许我们现在就应该行动了。"
  JAP_pnr_normal.21.t: "军队催促我们快速行动"
  JAP_pnr_normal.21.desc: "我们毫无起色的经济状态引得了军队势力的关切，这并不是一个好兆头……由于我们对处理当前一团乱麻的[JAP.GetAdjective]经济尚未拿出足够的成果，我们先前曾在社会上受到了一些民众的小小质疑。这一次轮到军队势力对我们提出疑问了。今天稍早些时候，陆军大臣和海军大臣一同拜访了[JAP.GetLeader]，向他传达了一些一半威胁一半提醒的话语：两位大臣都谈到最近军队中逐渐蔓延的躁动情绪，一些士兵称[JAP.GetLeader]的表现让人感觉“麻烦”。这种不满情绪可能会影响到本届政府的正常执政，甚至可能引发某些不必要的暴力事件。两位大臣称他们已经加强对异常士兵的思想教育与监视，但由于两军长期以来都饱受经费不足折磨之苦，他们没办法监视到每一个士兵。总而言之，现在军队中也开始滋生对本届内阁那不彻底的经济政策的不满情绪。在陆海军大臣临走之前，他们还向[JAP.GetLeader]传达说如果可以的话，希望[JAP.GetLeader]能考虑一下是否要为陆军和海军提供更多预算。"
  JAP_pnr_normal.21.a: "这是军队思想教育的问题，和我无关。"
  JAP_pnr_normal.21.b: "他们的建议是对的……"
  JAP_pnr_normal.22.t: "宫中逼迫[JAP.GetLeader]"
  JAP_pnr_normal.22.desc: "[JAP.GetAdjective]政府应对黑色星期一的政策取得了令人震惊的失败，在各大银行的经济学家看来，政府经济政策的失败在于缺乏一贯的目标，又或者说是缺乏将相关政策推行到底的勇气。在这种不彻底的应对政策中存在的便是几乎毫无变化的经济现状，国民对[JAP.GetLeader]那近乎于糊弄的黑色星期一应对政策陷入了失望和愤怒，他们强烈呼吁立刻罢免[JAP.GetLeader]。在这种艰难时局下，天皇陛下极为罕见地将[JAP.GetLeader]传召入宫觐见。尽管天皇和内阁总理大臣的对话原则上是保密的，但其它在野党很快就了解到天皇对本届内阁“极为失望”，并且似乎在听取了[JAP.GetLeader]的辩解之后，“毅然地转身离开了谒见间”。这一消息很快就被证实，今天中午[JAP.GetLeader]带领其内阁宣布了他们的黑色星期一政策——有消息称这是基于天皇的御沙汰所强制制定的。由此可见$JAP_pnr_paternal_autocrat_party$确实对本届领导班子失望透顶。"
  JAP_pnr_normal.22.a: "他们自作自受……"
  JAP_pnr_normal.22.a_tt: "§a在宫中的干涉下，我们被强制要求执行黑色星期一的特别经济政策，直到经济恢复正常。由于这不是我们自己作出的§Y财政选择§!，在危机结束后，我们不会得到§R任何增益§!§!。"
  JAP_pnr_normal.23.t: "台下接触"
  JAP_pnr_normal.23.desc: "就是否组成左翼阵线进行了讨论"
  JAP_pnr_normal.23.a: "无产党加入了社会大众党左翼。"
  JAP_pnr_normal.23.b: "事实上，谈判破裂了。"
  JAP_pnr_normal.24.t: "社会大众党左翼与赤松交流"
  JAP_pnr_normal.24.desc: "社大党左翼和赤松交流。"
  JAP_pnr_normal.24.a: "麻生久向赤松伸出援手。"
  JAP_pnr_normal.24.b: "国家社会主义党重返社大党。"
  JAP_pnr_normal.25.t: "归党派胜利？"
  JAP_pnr_normal.25.desc: "国民联盟和民政党的交谈。"
  JAP_pnr_normal.25.a: "面对压力，立宪民政党和国民同盟重修旧好了。"
  JAP_pnr_normal.25.b: "国民同盟分裂了！"
  JAP_pnr_jpc.1.t: "彼得·潘和他的同志们"
  JAP_pnr_jpc.1.desc: "正月即将结束，但冬天可不会这么轻易地结束。即便是远在千里之外的东京，人们都还穿着厚厚的毛衣吃着煮萝卜，何况是比东京更靠北的东北地方呢？密布的雪云从东京方向压了过来，向下肆意吐着彻骨的冷雪。令人意外的是，从更北方刮来的寒风虽然同样冷酷，却反而把这雪云吹散了不少。这风吹着吹着就消失不见，而那雪云似乎也是忌惮这风藏在哪里准备给它恶狠狠的一击，便也停滞在原地，一改跋扈的神气。然而就是这个停雪的寒夜，我们的小冒险家把伞折起来抖了抖，伸手抹去了长椅上的积雪，在确保这样坐下去也无虞之后便满怀期待地安心呆在那里。\n\n他围着自己最爱的那条围巾，呼出一口因为刚刚逃离险境而激动的气息。现在是在大家来之前先检视自己冒险的战利品的时候了：首先要用椅子把宝箱取下来，然后按照记忆左右来回拨动转盘，再小心地把战利品装好让一切就位。之后是最惊险的一步，要避开巡夜的女佣和催促睡觉的阿姨才能到这里。他打开书包审视着装在大信封里的那些战利品，一串数字加上秋田银行的标志让他相信这是最珍贵的那件。\n\n直到他注意到那几个用棉衣把身体完全裹住的人从路的另一头出现，他装好东西，跳到地面，校服短裤下的膝盖冻得通红。在这个时间能出现的那肯定是他要等的人，不会错，他们约好了在这里见面。为首的那个女人走到他面前时有些诧异，不过她还是伸出手来示意要和他握手。我们的小冒险家倒是先把书包递了过去，他还有好多好多话想问。而女人则首先向他致意问候。"
  JAP_pnr_jpc.1.a: "“我是“光”，是“大叔”的朋友，你就是三浦俊贞同志？”"
  JAP_pnr_jpc.2.t: "灭绝人性！赤色之手伸向学童"
  JAP_pnr_jpc.2.desc: "昨日白天有两名四十岁左右男性来到秋田县的株式仲买店中，试图出售涵盖从东京煤气到朝鲜殖产银行的多支股票，总价值超过十万日元，这一天文数字若不是有着紧急用钱的计划，则根本不会悉数出售。除此之外，这两名男性举止怪异，似乎并不清楚股票买卖之基本流程，也对店员的日常盘问表现出警惕。这一切促使该店最终报警，却没想到牵连出了一起惊天的大事件——这十万日元股票竟是从一位学童手中诈骗得来的，而这些股票则是他们教唆学童，从父亲的保险箱中窃取而出的！\n\n受害者三浦家中管教严格，因此心生不满决心离家出走，至于其如何同这二人搭上关联尚不清楚。总之在这二人的哄骗之下，他从自家保险柜中窃得大量现金，存折和股票，并将其悉数交予两人，待折算成现金后再做分配。受害者的父亲，北日本制菓常务，同时也是最大股东之一的三浦先生披露了更多内容。在嫌疑人的教唆和煽惑之下，受害者开始和家中产生思想上的冲突，并且开始“信仰”所谓社会主义，希望同家里决裂离开，并只留下一部分，另一部分则交给赤色的社会主义党。据统计，此次盗窃共损失现金一千日元，存折存款六百日元，以及十万日元的各类股票。幸运的是两名嫌疑者在被警方抓获之后便很快交出他们诈骗所得钱财，并供出了其背后的指挥者，原来是暴力犯罪和非法交易的老面孔，赤色的黑帮日本共产党！在代号为“光”的女会头的指挥下，他们策划了这场教唆盗窃案。于匪徒们的安全屋中，警察发现了离家出走的学童以及有六百日元的存折，但并未发现“光”与一千日元现金。目前该案件仍在进行调查之中。\n\n这些恐怖主义的赤色团体以破坏社会稳定为乐，就在政府稳步推进经济复苏计划，令我国全体国民从中受益的同时，他们不断地采用非法手段夺取他人的正当财产，竟还用歪理邪说洗脑懵懂之学童，使其协助犯罪。就像之前发生的敲诈勒索和银行抢劫事件一样，在本次极为恶劣的学童诱拐事件背后，也有这样一双赤红色的魔手在背后操弄。而这些毫无底线的匪徒一定还在暗处运用手枪和汽车酝酿着更多的赤色阴谋。然而政府本身却被政党斗争所连累，无法发挥出一个政府应该拥有的强力。现在正是时候呼吁政府中的所有势力放下一己私利团结起来，铲除社会之中匪徒的同情者，打击不安定的非国民破坏分子，保护遵纪守法的国民，维持社会的稳定。"
  JAP_pnr_jpc.2.a: "严惩这些赤色强盗。"
  JAP_pnr_jpc.2.a_tt: "赤色阴谋的§R强度§!减少了5"
  JAP_pnr_jpc.2.b: "这年头的富人遭报应还要大肆宣传。"
  JAP_pnr_jpc.3.t: "涂抹赤色"
  JAP_pnr_jpc.3a.desc: "在日本桥蛎壳町二丁目的料亭“那可井”中，厚重的障子门后是如今的首相$JAP_pnr_hamaguchi_osachi$和枢密院副议长平沼骐一郎男爵。\n\n“酒不错吧，这是月桂冠的酒款。为了首相你特意开的。”率先打破沉默，抛出话头的是平沼。“确实不错，不过我更关心平沼先生为何今天要特意请我来这里，难道只是为了请我一起吃顿晚餐吗？”眼见对方有了要对话的态度，$JAP_pnr_hamaguchi_osachi$也单刀直入地抛出了自己的疑惑。“那当然是为了拉近和内阁总理大臣的关系，有求于你，所以来献殷勤——你也知道吧，就是《国家保安法》，被$JAP_pnr_inukai_tsuyoshi$否掉的那个。”“我之前略有听闻，是改正版本的《治安维持法》吧，说起来《治安维持法》也是您的手笔。”\n\n“我想请首相你在下一会期提交改正过的《国家保安法》，如何？我不会让你难做，具体法条我们可以再商讨，你只要提出便好了。”讲到这里，平沼站起来，大概是为了掩饰表情地背过身去，开始研究起那些放在一边供食客消遣的报纸刊物。“男爵的意思是想让我当第二个田中义一大将吗？还是说男爵自认为我要借此报今天的一饭之恩？”“首相，”平沼装作找到了感兴趣的报纸，把它从阅览架上抽了出来，“我只是向你建议罢了，并不是强人所难。如果这件事不行的话，那也没办法了。”“内阁近来应对“黑色星期一”实在繁忙，既然平沼先生把话说完了，那就容我先告辞。”既然谈判已经结束，$JAP_pnr_hamaguchi_osachi$已决心不再多待，便起身告退。\n\n“安达谦藏——”平沼说出了那个足够让滨口停下脚步的名字，“是安达谦藏吧，把所有人集合起来对抗政友会。而奖励则是排除了政友会的所谓‘联合内阁’。”如今内阁总理大臣再度坐回到毒蛇的对面，仔细聆听蛇信的响声。“不止是贵族院，我想宫中也对今天的‘反$JAP_pnr_inukai_tsuyoshi$同盟’感到很奇怪，所以就擅自托人进行了调查。这样行不通的，元老是个很死脑筋的人，他大概不会容许联合政党内阁这种异物存在。但如果是‘民意’的话就另当别论——”\n\n平沼骐一郎男爵把那份报纸推到了$JAP_pnr_hamaguchi_osachi$面前，用手指敲着那列硕大的标题——灭绝人性！赤色之手伸向学童——“可如果有人告诉他这些报道后面居然藏着捏着钞票的手要怎么办，这件事被元老知道了倒也不会立即引发什么后果，我只是担心联合政党内阁可能会给他留下不好的印象，我想那可就太可惜了。”\n\n男爵站起身，极为诚恳地向坐在那里紧盯着他的$JAP_pnr_hamaguchi_osachi$鞠躬告辞："
  JAP_pnr_jpc.3b.desc: "“哈哈，久原先生，这是第一次这样单独吃饭吧。本来是我邀请你，结果不知怎么的反倒成了你来邀请我了。”一开始确实是平沼骐一郎邀请了$JAP_pnr_fusanosuke_kuhara$，不过在察觉到这并非是普通的邀约之后，$JAP_pnr_fusanosuke_kuhara$很快反客为主，邀请平沼在银座的滨作见面。“平沼前辈比我早迈入政界。我是实业出身，靠着小财和运气才在政友会里走到今天这个位置。应该是我请您传授经验才是。不知您之前有没有吃过关西地区的‘板前烹割’，这体验相当不错，请您稍后务必谈谈感想。”\n\n谈到滨作，就不得不说“板前割烹”这种新颖的料理风格：食客并非在包间中，而是坐在厨房前的吧台座位，一边享用美食的同时一边将厨师本人的刀工作为一种表演欣赏。正是滨作首先在大阪发明了这种烹饪风格，并将其引入关东。\n\n首先是鲷、然后是合鸭，最后是春笋。二人就这样从入口的当季食材聊到近在眼前的刀刃刺入脂肪时的脆响，随后又是$JAP_pnr_fusanosuke_kuhara$自己的在国外的所见所闻。\n\n“大家都说首相是个怪人，我想今日见面可以说名副其实，是个完全以政治家之外视角看待事物的怪人啊。然而当下的特殊时期，就是需要怪人的思路和怪人的做法。”平沼放下那杯加了梅干的芋烧酎，“首相是个外国通，不像我连满铁的列车都没体验过几次。我国经济依赖于海外，首相的见地确实不错。但我认为，不止是经济，在和国外交流的时候，国外的学说和思想，意识形态不是也会反过来输入[JAP.GetName]吗？当初明治大帝进行维新，正是效法了西人的制度，随之一道而来的还有西人的所谓自由主义。”$JAP_pnr_fusanosuke_kuhara$则拿起了那杯熟成生啤放到嘴边：“确实不错，这就是平沼前辈今天想和我见面的理由吗？”\n\n“首相是$JAP_pnr_social_conservative_party$出身，应该有所耳闻《国家保安法》吧，被$JAP_pnr_inukai_tsuyoshi$前首相拒绝的那个。”“我听说过一点，是男爵您主导的《治安维持法》的替代品。这部法案怎么了，男爵的意思不会是想游说我，让我支持它吧。”\n\n“我只是建议，建议总理考虑一下——我在$JAP_pnr_social_conservative_party$中有一些朋友，谈到了久原首相的‘大计划’——和[ENG.GetName]与[FRA.GetName]谋求进一步友好的贸易关系。哎呀真是个好计划，毕竟[GER.GetName]简直是对我们展现出了完全的敌意。但是呢，总会有一些人感觉和工团分子做生意实在是不能接受。我想虽然困难，但他们肯定是能被说服的。”平沼用手指绕着盘子在桌子上画了一个圈，“将来如果真的和[ENG.GetName]与[FRA.GetName]达成了极为友好的关系，我想赤色分子也会因此躁动起来，本着所谓的‘关系缓和’而加大令人头痛的活动吧。如果首相你真的想靠和工团主义者们做生意来缓解经济问题，扩展日本的对外贸易对象的话，我想《国家保安法》对维持国家秩序而言是非常必要的。”平沼骐一郎见到$JAP_pnr_fusanosuke_kuhara$依旧板着那张脸，便自己点了点头赞同自己，“希望首相仔细考虑，如果真的能和英法之间取得互惠互利的共荣关系的话，对于我国经济而言确实是一件极大的功劳。”\n\n刀锋划过桧木案板，留下了沉闷而不和谐的笃笃声。"
  JAP_pnr_jpc.3c.desc: "东京府淀桥区西大久保一丁目，被一道高得不祥的黑色木栅栏保护着。这里正是“国本社”领袖，枢密院副议长平沼骐一郎男爵的老巢。在尚未成为首相之前，作为平沼好友，同为帝国大学法科出身的$JAP_pnr_suzuki_kisaburo$便多次拜访这里。然而像今天这样参加所谓的“家宴”还是第一次——平沼骐一郎必然有所图谋。\n\n“铃木，祝贺你问鼎内阁总理大臣之位！”平沼一边和$JAP_pnr_suzuki_kisaburo$碰杯，一边摇着身子发出他那极有特色的笑声，“作为东大出身，看到你今天取得了这种成就，我真是感到莫大的喜悦。之前$JAP_pnr_inukai_tsuyoshi$否掉的那部《国家保安法》，我们终于又可以提上日程了！”“《国家保安法》？”$JAP_pnr_suzuki_kisaburo$当然记得，这部法案正是平沼骐一郎为了取代被废除的《治安维持法》，通过$JAP_pnr_suzuki_kisaburo$向$JAP_pnr_inukai_tsuyoshi$游说的，不过该法案最终在内阁的内部讨论中被以“如今的国民不会接受”为由否掉了，他没想到平沼今天借着家宴名义居然是想要谈这个。“是啊，你也对现在的议会局势很头痛吧。如果《治安维持法》能回来的话，内务大臣就又能像之前那样用警察狠狠打击那些嚣张的在野党了。至于赤色分子更是——一网打尽。”“如果想再推出这部法案就要找到个理由，当初田中义一是借助了大地震的机会，现在似乎没什么好机会让民众认同这部法律。即便内阁强推，到时候在帝国议会里也会受到阻力。”\n\n“如果你要现成的理由，这里就有。”平沼指着旁边那张桌子上摊开的报纸，上面是各大新闻社对近期在秋田县发生的“赤色诱拐事件”的报道，“有人在背后炒作这件事，看看这说法，‘强力政府’。我想也就是那几个人。但是这不就是现成可以利用的理由吗？来帮他们添把火，多找一些例子。”$JAP_pnr_suzuki_kisaburo$看了一眼那些标题，又看了一眼面前的平沼骐一郎，旋即走过去拿起其中一张报纸：“我不擅长对付众议院里的议员们，不知道平沼你还记不记得田中义一内阁、《治安维持法》和《普通选举法》的事情。”他放下那张报纸，盯着眼前的枢密院副议长，《治安维持法》的缔造者，“十年以前，帝国议会用《治安维持法》交换了《普通选举法》通过。当时是你和田中大将在背后有疏通吧。然而《治安维持法》通过之后就立刻实行了，而《普通选举法》却等到‘护宪联盟’扳倒田中义一，$JAP_pnr_inukai_tsuyoshi$作为‘宪政之神’上台后才实行。世人如今谈到田中义一大将便记得他是个利用《治安维持法》破坏结社权的独裁者；至于$JAP_pnr_inukai_tsuyoshi$则是拯救宪政于危难之中，推行《普通选举法》广纳民意于社会的拯救者。”\n\n气氛变得有些尴尬，平沼骐一郎也露出了沉默的真面目，全然失去了先前装出来的那种夸张的快乐。$JAP_pnr_suzuki_kisaburo$用手指捏着桌上那几页纸来回轻轻摩擦，“这里是不是有什么奥妙呢？我始终很好奇。这不是说我要拒绝朋友的建议，我是说，如果我借助这个时机提交《国家保安法》的话——”"
  JAP_pnr_jpc.3.a: "“《国家保安法》就拜托首相了。”"
  JAP_pnr_jpc.3.b: "“首相，啤酒高度根本没在变哦。”"
  JAP_pnr_jpc.3.c: "“我是田中义一，还是$JAP_pnr_inukai_tsuyoshi$？”"
  JAP_pnr_jpc.4.t: "不治之症"
  JAP_pnr_jpc.4.desc: "自1928年中东路冲突导致民众愈发厌恶军人，反对战争之后，许多军官得了一种令人害怕的“疾病”。他们一听到民众呼吁和平，鄙视军人的声音，就突然染上了这种病。这疾病的第一阶段是在公开场合把吉野作造的《论宪政之本义》或安部矶雄的《社会问题解释法》等塞进上衣口袋里，就像是得到了勋章的老兵那样佩戴着这些小册子。这疾病的进展期表现则是这样的：“病人”开始购买自己过去十几年从来没听说过的各种报纸认真研读：《战旗》、《大真》、《无产阶级科学》、《国体原理》、《风林》……一有空闲时间便去出席各类社会活动家举办的讲座，讨论报纸上的和不在报纸上的深奥内容，而水交会或偕行社的聚会也不来参加，对艺妓的兴趣也是寥寥。等到这时候，他的同伴便怀疑他得了一种难言的疾病。等到病情更加重的时候，则似乎是意识到脸上和心上有了新东西，于是无可救药地开始帮那些工人和农民举牌子、喊口号。\n\n尽管这种“疾病”已成了陆军和海军中的一股风潮，大多数军队高官，特别是陆军教育总监部与海军省教育局已对此见怪不怪，放弃靠训话来治疗的方法了，不过这一次发现的东西还是出乎了所有人预料。在对吴市海军的一次例行军务检查中，竟从几名海军那里搜出来了明令禁止的非法印刷物《赤旗》，这是由$JAP_pnr_totalist_party$在地下私自印刷，一般只供给其资助者（被蒙蔽的同情者）和党员（匪徒的一员）的。几名军官坚称这些报纸是他们在路边的自行车筐里捡到的，只是出于好玩和猎奇心理才带回了生活区。简单但全面的调查也洗脱了他们作为共产党员的嫌疑。不过至于是不是出于好奇捡来的，则由于报纸上有许多用铅笔勾画的句子和词而需要打个问号就是了。"
  JAP_pnr_jpc.4.a: "博览群书，批判性阅读。"
  JAP_pnr_jpc.5.t: "安久公司骚乱"
  JAP_pnr_jpc.5.desc: "就在大家因为经济危机焦头烂额的时候，$JAP_pnr_kato_kanju$和他的$JAP_pnr_syndicalist_party$又出来给我们添乱。二月刚刚开始，安久公司就引发了一场大罢工。安久公司并不是什么大产业，雇员大概只有三十人。而由于经济问题，社长福井安久太打算解雇大概十个工人来缓解公司的现金流。然而在这种时候谈解雇却激发了工人们的不满。本来找几个工会内的右派干部，和老板商量一下就能解决的事情，在$JAP_pnr_syndicalist_party$与自称东京最后的“战斗工会”，和工会（Wakokai）的指挥之下，这场最初为了对抗解雇的防御性罢工居然升级成了涉及京桥区到芝区的各公司印刷工联合起来的，要求加薪的罢工。在“黑色星期一”肆虐的当下，实现这要求还是太困难了。所以福井安久太就打算一边假意关闭印刷工厂，一边联系“桂庵”找些价钱便宜的临时工偷偷开工。\n\n福井安久太的计划很聪明，就是执行得不太顺利：那几个“临时工”，按工人们的话说是“工贼”，现在正在医院里躺着呢，而福井安久太则由于害怕躲在了警署里，搞得警方也拿这件事很头疼。总而言之，现在这场骚乱已经不是走到两队人马中间，说些漂亮话把大家遣散就能解决的了。最好的方法是踩一脚福井让他多吐点铜币出来，但这无疑会助长工人们的嚣张气焰；另一种方法则是找点机会，修理一下这帮工人一顿，当然这事可不能让警察他们去干。"
  JAP_pnr_jpc.5.a: "经济问题都不是问题。"
  JAP_pnr_jpc.5.b: "这事政府可不好出面，快给内田先生准备些伴手礼。"
  JAP_pnr_jpc.5.b_tt: "§a我们会向§n内田良平§!求助，让这些打手们摆平这件事。但小混混们下手可没轻没重，这可能会§t加剧冲突§!……§!"
  JAP_pnr_jpc.6.t: "桃色争议再起波澜"
  JAP_pnr_jpc.6.desc: "1933年距今不过3年，而当初搅动东京的松竹少女歌剧团再一次以同样的面孔出现在了大家面前——这一次还带上了同为松竹事业体系的松竹有声电影部门。回顾1933年6月，为要求确立最低薪资，加入工会自由，确保公司支付通勤费与化妆品费用，松竹少女歌剧团曾发起过一场静坐罢工，有超过200名少女演员参与了该行动，她们推举了当时刚刚年满18岁的水之江泷子为罢工争议委员长。由于该罢工的主体几乎全是歌剧团的年轻女性，当时的媒体便将其称为“桃色争议”。\n\n今日这抹桃色的风暴再度袭向东京，事件的开端是松竹大船摄影所本已于今年3月末开所，松竹对该摄影所的建设投入相当可观。但与此同时松竹有声电影部门却被要求体恤当下时局而“减薪”，松竹才在今年三月启用了耗资不菲的大船摄影所，如今却反过来要求员工减薪。电影部门制作人员很快对这一点提出了异议和待遇改善要求，而松竹少女歌剧团则同样因为“黑色星期一”后的收入下滑被告知将取消自1933年开始的通勤费补贴、定期升给、生理休假、对底层研究生的基本生活保障等在“桃色争议”时期确定下来的福利。这致使两边立刻合流，而劳资矛盾也立刻表面化，很快大阪松竹少女歌剧团也加入了罢工斗争。在过去少女歌剧团和有声电影部门曾协力对抗宝冢，这份合作精神在今日用来向松竹事业体系发起冲锋。\n\n3年之前的委员长在今天依然是委员长，水之江泷子的粉丝团“水之江”也在声援他们偶像的行动——该粉丝团成员复杂，从那些现在闹得起劲的，记不住名字的民众，到仍然保持沉默的高桥是清家的小姐、出口王仁三郎、甚至据说还有秩父宫妃势津子殿下和久迩宫妃知子女王。要是有个脑袋不好的华族或者是大人物突然要为了自己的偶像说点什么的话，那情况完全会变得难以控制。目前除了罢工委员长外，参与罢工的所有成员都跑进诸如高野山和比叡山之类的隐居地采取不接受私下对话态度，防止被资方分化瓦解。松竹现在如果想要找人谈判的话，就只能和水之江泷子亲自谈谈，当然他们可不能再犯1933年让警察直接扣押泷子的错误了……"
  JAP_pnr_jpc.6.a: "只是——单纯的劳动争议，松竹运气太差。"
  JAP_pnr_jpc.7.t: "横须贺工厂怠工事件"
  JAP_pnr_jpc.7.desc: "黑色星期一爆发之后的日本各城市都发生了程度各不相同的工人骚乱，至于更偏远的农业地区则因为本就失败的农业政策而和之前的骚乱情况没什么两样。如今这阵骚动之风则传到了横须贺地区。大日本帝国海军横须贺海军工厂发生了一件大事，出于对各地此起彼伏的工人运动的同情，一小群在海军工厂中工作的工人决定通过怠工行动来支持他们的斗争。这一计划立刻得到了横须贺工厂内许多工人的响应，横须贺的工厂长，古市龙雄机关少将出于对当前社会上对工人和农民运动潮流的忌惮而暂时将其视为劳资纠纷，指示各方稳健和平处理。\n\n如果情况如此单纯也不至于被称为“大事”，他们随后在工厂内举行的声援集会立刻让所有海军都神经紧绷——他们的集会标语来自海军禁书《高耸的桅杆》中的一小段内容。这几乎立刻把人带回到了1932年，那时日本共产党曾试图渗透海军，海军陆战队内的二等机关兵曹阪口喜一郎最终被他们诱惑，在吴镇守府通过印刷面向海军人员的社会主义杂志《高耸的桅杆》，将不少海军转化为了社会主义同情者。其人目前正和他的“同志们”集中关押在府中监狱，《高耸的桅杆》也已被悉数销毁，但今天出现在横须贺的这本刊物的回声是否证明海军内仍然存在相关同情者？值得注意的是，古市龙雄在阪口喜一郎活动的当时正是吴海军工厂的电气部长，他究竟是出于对社会舆论的忌惮而默许了工人们的行动，还是说出于更可怕的目的……"
  JAP_pnr_jpc.7.a: "太多阴谋论了……"
  JAP_pnr_jpc.7.b: "我们可赌不起，给古市工厂长放长假。"
  JAP_pnr_jpc.8.t: "片山潜被袭击"
  JAP_pnr_jpc.8.desc: "生于1859年的片山潜是日本工团主义最老资格的领导人之一，被称为“日本工团主义之父”。早年间他因为参与社会民主运动而被驱逐出境，之后他前往美国，在那里他见证了约翰·里德的工团主义运动，也目睹了世界产业工人联合会一步步壮大。受到这些影响，片山潜在1926年宪法恢复之后返回日本，建立了日本第一个合法的工团主义党：日本劳动农民党(日本労働農民党)。该党在1932年被宣布为非法后，他又参与组织成立了社会大众党(社会大衆党)，并在之后隐退。\n\n昨天，片山潜到访京都与社会大众党成员$JAP_pnr_yamamoto_senji$会面时，三个右翼分子攻击了$JAP_pnr_yamamoto_senji$的办公地，用棍子殴打了二人。$JAP_pnr_yamamoto_senji$在袭击中幸存了下来，但是76岁的片山潜，因为抢救无效，在今天早些时候逝世。"
  JAP_pnr_jpc.8.a: "情况变得棘手了。"
  JAP_pnr_jpc.9.t: "日本无产党的诞生"
  JAP_pnr_jpc.9.desc: "先前因黑色星期一而连锁引发的一系列的罢工骚乱已经引发了我国右翼势力的不满，随后他们袭击了可以称得上是日本工团主义象征的片山潜，这无疑加剧了冲突。那些尚在合法范围内的左翼政党因片山潜之死而逐渐开始激进化，片山潜原本肃静的葬礼已经被他们变成了义愤填膺的诉苦大会。\n\n出席了葬礼的$JAP_pnr_kato_kanju$号召所有左翼政党团结起来，他尤其谈到了$JAP_pnr_social_democrat_party$内部的问题，认为该党派虽然是帝国议会中举足轻重的大党之一，却开始表现得与劳动分子们离心离德，就这一问题他当场质问了$JAP_pnr_yamamoto_senji$。不过他并未对此多加纠缠，因为随后的发言便暴露了他的真实目的：他宣称工人们现在应该结成一个更强大，更广泛的左翼政党来对抗“位于左侧的反动社会民主主义分子”，并呼吁$JAP_pnr_social_democrat_party$左派脱离原本的党派，加入这个新的，真正代表工人的左翼政党。\n\n在葬礼的最后，几个边缘组织加上$JAP_pnr_kato_kanju$的$JAP_pnr_syndicalist_party$宣布合并并组成$JAP_pnr_nihon_musanto$，以真正实现在非常时期为工人阶级发声。"
  JAP_pnr_jpc.9.a: "这不是什么好消息……"
  JAP_pnr_jpc.10.t: "陆海对峙"
  JAP_pnr_jpc.10.desc: "第一舰队驶入东京湾，东京湾堡垒已经瘫痪。"
  JAP_pnr_jpc.10.a: "斗争的时刻到了！怒吼的时刻到了！真相的时刻到了！"
  JAP_pnr_jpc.11.t: "1分钟前"
  JAP_pnr_jpc.11.desc: "示威农民和工人包围了霞关临时国会。"
  JAP_pnr_jpc.11.a: "不要向风暴低头。"
  JAP_pnr_jpc.12.t: "霞关陷入火海"
  JAP_pnr_jpc.12.desc: "霞关被炮击"
  JAP_pnr_jpc.12.a: "日本工团竟已渗透到如此之深……"
  JAP_pnr_jpc.12.b: "全球工团运动无法抹去的一笔！"
  JAP_pnr_jpc.13.t: "东京激斗"
  JAP_pnr_jpc.13a.desc: "找内田良平摆平这件事是个正确的选择。当时参加安久公司罢工的工人们正集结起来举办誓师大会，他们一方面是为了给彼此加油打气，另一方面则是准备纠集更多人，在大会结束之后从京桥区开始一场罢工游行。和工会的头目，煽动这次罢工的匪首岩田秀彦刚刚开口没讲几句，内田良平派去的爱国社和大日本生产党成员们便突然闯入了会场。\n\n这些壮士手持皮鞭、木棍和铁棒见到工人便全力殴打，当时参加集会的工人们还没反应过来就被打得哭爹喊娘满地乱滚，稍晚些时候一部分工人终于反应过来，他们用地上的石头和木棒组织了一波反击，但由于在第一波突袭中他们损失了不少人，大日本生产党很快就瓦解了他们的攻势。等到局势已经基本确定，在附近准备收尾的警察立刻一拥而上控制住了场面。\n\n这场罢工游行前的誓师大会最终变成了安久公司罢工事件的最后一幕，岩田秀彦本人被扒光衣服裸体捆在了安久公司门口的路灯上，这一成果显然震慑了那些罢工团，他们最终在事实上进行了解散。印刷工人们在今天早上便已重返工作岗位，东京的印刷业界再次回归平静，再没人提什么“禁止解雇”之类的话了。"
  JAP_pnr_jpc.13b.desc: "找内田良平摆平这件事是个正确的选择。当时参加安久公司罢工的工人们正集结起来举办誓师大会，他们一方面是为了给彼此加油打气，另一方面则是准备纠集更多人，在大会结束之后从京桥区开始一场罢工游行。和工会的头目，煽动这次罢工的匪首岩田秀彦刚刚开口没讲几句，内田良平派去的爱国社和大日本生产党成员们便突然闯入了会场。\n\n这些壮士手持皮鞭、木棍和铁棒见到工人便全力殴打，但不知道怎么回事，迎接这些壮士的同样是皮鞭、木棍和铁棒。似乎这些工人早已预料到了会有人前来破坏集会，又或者这些武器是他们稍后要在罢工游行中使用的？总之大会现场很快陷入混乱，工人们和右翼壮士们手持武器相互殴打。直到在附近本来准备收尾的警察呼叫的增援警力全部赶到后才平息了这场争端。\n\n这场罢工游行前的誓师大会最终变成了安久公司罢工事件的最后一幕，在这场恶斗之后，大日本生产党的创设者之一，吉田益三先生拜访了在警署里的福井安久太，不清楚他们二人之间聊了什么，但最终福井乖乖接受了工人们的条件。既然罢工团的目的已经达成，他们也很快解散回到了各自的工作岗位上。东京的印刷业界再次回归平静，只是偶尔会听到有工人添油加醋地讲述这场左翼和右翼之间的传奇激斗故事。"
  JAP_pnr_jpc.13c.desc: "找内田良平摆平这件事似乎并不是个正确的选择，他的行动最终招来的灾难性的结局。当时参加安久公司罢工的工人们正集结起来举办誓师大会，他们一方面是为了给彼此加油打气，另一方面则是准备纠集更多人，在大会结束之后从京桥区开始一场罢工游行。和工会的头目，煽动这次罢工的匪首岩田秀彦刚刚开口没讲几句，内田良平派去的爱国社和大日本生产党成员们便突然闯入了会场。\n\n这些壮士手持皮鞭、木棍和铁棒见到工人便全力——然而工人们也有备而来，在第一波人手持武器，大声叫嚷地冲入会场的时候，迎接他们的是一根在建筑工地上常见的巨大的方木棒。那根木棒直接把冲进来的人捅了出去，随后手持其它钝器的工人们立刻和他们打成一片。本来计划通过突袭破坏罢工运动的壮士们反而成为了被突袭的对象。这场激斗极为血腥，两方都有大量人员受伤。直到在附近本来准备收尾的警察呼叫的增援警力全部赶到后才平息了这场争端。\n\n这场罢工游行前的誓师大会最终变成了震撼社会的流血事件，工人们的暴力行为反而使得更多人开始关心起印刷工人的现状，并指责政府在应对危机方面的不作为。在其它行业也出现了支持印刷工人反抗的呼声。今天早些时候，福井安久太可能是由于压力太大而一时惊慌，在警署内上吊自杀了。\n\n既然工厂主已死，工厂也理所当然地关闭了。眼见继续为此举行罢工斗争已无必要，罢工团也随之解散。东京的印刷业界再次回归平静，但是这平静之下却掩盖着骇人的怒涛。"
  JAP_pnr_jpc.13.a: "这就是不好好工作的下场！"
  JAP_pnr_jpc.13.b: "也还好吧。"
  JAP_pnr_jpc.13.c: "完了……"
  JAP_pnr_news.1.t: "泛美航空天际酒店遭到破坏"
  JAP_pnr_news.1.desc: "1935年9月美国泛美航空为开拓旧金山-中国的“中国飞剪号”水上航线时，在关岛的苏迈村建造了泛美航空天际酒店。然而这只落地休憩的白鹰却最终在天空中其它猛禽的攻击下倒地不起，这一切都是因为德日在太平洋区域矛盾的激化。\n\n今日晨间，一架战机飞临苏迈村上空进行扫射和投弹，试图破坏关岛的水上飞机基地。机枪扫射击中了靠近酒店的燃料罐引发爆炸，两名酒店厨房员工不幸遇难。昔日装潢奢华的单层度假酒店如今已沦为断壁残垣。\n\n目前[GEA.GetName]和[JAP.GetName]都在指责对方是造成该灾难的元凶。"
  JAP_pnr_news.1.a: "西太平洋局势愈发不安。"
  JAP_pnr_news.2.t: "民政党延续立宪政治"
  JAP_pnr_news.2.desc: "123"
  JAP_pnr_news.2.a: "国民必将凭帝国议会为自身发声"
  JAP_pnr_news.3.t: "同床异梦的宪政联盟"
  JAP_pnr_news.3.desc: "123"
  JAP_pnr_news.3.a: "这是日本政界的新风，还是朝荣暮落的牵牛？"
  JAP_pnr_news.4.t: "大同团结总同盟结成"
  JAP_pnr_news.4.desc: "在同日共进行了多轮非正式会谈之后，日共成员全部加入劳动组合全国评议会，而劳动组合全国评议会，社会大众党，以及民政党与政友会中的非主流派则共同组建了一个广泛的政治联盟。值得注意的是，该联盟特别强调维护《帝国宪法》，拥护天皇的立宪地位，这向宫中释放了日共立场趋于温和的信号。\n\n帝国陆军对于这一新生组织的出现选择了沉默，但零星的部队调动表明他们似乎正为某种行动做准备。面对军方施加的未知压力，宫中最终与这个新生的同盟达成了某种妥协。就在刚刚，西园寺公望正式奏荐“人民同盟”中的协力者之一，已有八年议会资历的社会大众党党员山本宣治出任首相。这个广泛的政治联盟是否能在解决日本当前面临的危机之前避免崩溃？"
  JAP_pnr_news.4.a: "那么此前那些传闻都是真的？"
  JAP_pnr_news.5.t: "科学的日本主义之胜"
  JAP_pnr_news.5.desc: "出人意料的消息从众议院中传来，在新的《议员选举法》通过后的首次众议院大选中，由北海道选区议员赤松克麿领导的科学社会党成功将其倡导的“科学的日本主义”带进了议会。\n\n起初他们根本无力撼动两大巨头政党的地位。但在关键时刻，以麻生久为首的社会大众党左派突然倒戈，通过一份互相协力候选人的选举协定与科学社会党组成同盟，形成了足以重塑日本政坛格局的政治力量。面对陌生的帝国议会第一大党，宫中似乎一时惊慌失措，但西园寺公望依然恪守“宪政常道”，奏请天皇向赤松克麿降下组阁大命。与政界不同，大多数民众都期待这位青壮年政治家的“科学”能为日本带来崭新的气象。"
  JAP_pnr_news.5.a: "日本无产阶级当以保卫自身民族利益为先"
  JAP_pnr_news.6.t: "社会大众党成为第一大党"
  JAP_pnr_news.6.desc: "尽管令人瞠目结舌，但事实的确如此。接连遭受政治丑闻与财务丑闻的打击后，立宪政友会和立宪民政党无可挽回地失去了国民的信任。两党虽然仍一如既往地在各地大肆展开贿选攻势，企图维持自身在众议院中的主导地位，但他们似乎未曾料到新《议员选举法》的施行使得选民数量激增，而日本民众早已在一次次失望中厌倦了两党的“民主”。\n\n长期作为政坛第三势力的社会大众党似乎已承载起越来越多日本民众对未来的希望。如今这个素有“永久在野党”之称的政党终于迎来了执政之日。其委员长安部矶雄如今已奉命组阁，并宣誓将一扫之前两党的积弊，真正地把民众的愿望和呼声带到帝国议会中。"
  JAP_pnr_news.6.a: "希望他们真能做到他们的承诺"
  JAP_pnr_news.7.t: "帝都不祥事件"
  JAP_pnr_news.7.desc: "东京自前几天就笼罩在迷雾里，时至今日一阵清风终于将雾霭吹散。约千名陆军中的革新派官兵发动了一场军事政变，他们迅速压制了几处关键的通讯设施和行政机关，并压制了清军派等反对势力，将其将领置于监视之下。此后政变部队迅速包围了皇宫，有报道称，天皇通过侍从武官长本庄繁男爵与政变部队取得接触。从眼下的局势判断，天皇似乎向政变者释放了积极信号。\n\n目前真崎甚三郎大将和近卫师团长香月清司中将一同控制了局面，并向日本全境颁布了戒严令。另有一条费解的消息，尽管目前尚不明确前因后果，但在政变部队成功控制了局势之后，秩父宫雍仁亲王似乎已进入皇宫。而宫中也已派出使者前往伊势神宫。"
  JAP_pnr_news.7.a: "陛下乃我等首领"
  JAP_pnr_news.8.t: "日本的加里波第"
  JAP_pnr_news.8.desc: "在石原莞尔，桥本欣五郎等人的带领下，联合，或称之为“日本爱国斗争生产联合”，于几天前纠集了一群农民，工人和一些士兵从静冈发动了一场前往东京向天皇陛下致敬的游行。在内田良平和出口王仁三郎等社会活动家的支持下，一开始只有约百人的队伍在抵达东京后已膨胀到数万人规模。尽管政府一方面派遣宪兵镇压游行，一方面希望奏请宣告戒严，但在短暂的对峙之后，一部分宪兵也脱离队列加入了游行队伍。而天皇则为避免进一步激化矛盾拒绝了戒严的下达。\n\n队伍在进入东京后并未破坏现有秩序，还获得了东京市民的欢迎。稍晚些时候，下位春吉作为代表向掌玺大臣呈递了一份请愿书，天皇特别考虑了他们对“恢复日本正常秩序”的主张，并最终向宇垣一成降下了组阁大任。"
  JAP_pnr_news.8.a: "我们又一次得到它了"
  JAP_pnr_news.9.t: "昭和神圣会稳定政局"
  JAP_pnr_news.9.desc: "长期以来日本的阴影中便充斥着凭正义之名实施的“政治暴力”，左右翼急进团体历来奉行独狼式作风，诉诸少数人的直接行动和个人恐怖主义来实现社会变革。可当他们面对昭和神圣会势不可挡的群众动员和闪电般的宣传攻势时则彻底失去了力量。在九段军人会馆中出口王仁三郎进行了演讲，随后下位春吉手持会旗，与几辆摩托车一同护送这位“圣师”前往二重桥。与此同时，早已在俱乐部外等候的昭和神圣会成员也开始高喊着恢复“皇道”，并高唱《君之代》向二重桥进军。宣传汽车突然从各条道路中冲出开始广播，其飞机则同步开始在帝都上空散发传单，向市民宣扬昭和神圣会的诉求。这场游行以宫中的沉默结束，但组阁大命很快被下达给与昭和神圣会密切相关的内务官僚后藤文夫。毫无疑问，菊花已被十曜裹挟，烤得萎靡不振。"
  JAP_pnr_news.9.a: "这他妈的还是日本吗？"
  JAP_pnr_news.10.t: "泛美航空天际酒店遭到破坏"
  JAP_pnr_news.10.desc: "1935年9月美国泛美航空为开拓旧金山-中国的“中国飞剪号”水上航线时，在关岛的苏迈村建造了泛美航空天际酒店。然而这只落地休憩的白鹰却最终在天空中其它猛禽的攻击下倒地不起，这一切都是因为德日在太平洋区域矛盾的激化。\n\n今日晨间，一架战机飞临苏迈村上空进行扫射和投弹，试图破坏关岛的水上飞机基地。机枪扫射击中了靠近酒店的燃料罐引发爆炸，两名酒店厨房员工不幸遇难。昔日装潢奢华的单层度假酒店如今已沦为断壁残垣。\n\n目前[GEA.GetName]和[JAP.GetName]都在指责对方是造成该灾难的元凶。"
  JAP_pnr_news.10.a: "西太平洋局势愈发不安。"
  JAP_pnr_news.10.b: "审查该报道。"
  JAP_pnr_kg.1.t: "[JAP.GetName]与我们接触"
  JAP_pnr_kg.1.desc: "日本与第三国际接触，尝试磋商未来的战略部署"
  JAP_pnr_kg.1.a: "我们有共同的亚洲利益。"
  JAP_pnr_kg.1.b: "我们怎可能与君主制主义者苟合？"
  JAP_pnr_kg.2.t: "[ROOT.GetName]表达了积极态度"
  JAP_pnr_kg.2.desc: "123"
  JAP_pnr_kg.2.a: "很好。"
  JAP_pnr_kg.4.t: "瓦隆-彭达尔克会议"
  JAP_pnr_kg.4.desc: "日本商谈大陆打通作战计划"
  JAP_pnr_kg.4.a: "我们同意扶持印度人民共和国，"
  JAP_pnr_kg.4.b: "并承诺将缅甸交给他们。"
  JAP_pnr_kg.4.c: "不，我们必须先取得华南再讨论印度问题。"
  JAP_pnr_kg.101.t: "经济支援？"
  JAP_pnr_kg.101.desc: "[JAP.GetName]向我们释出了善意，他们打算向我们提供一系列丰厚的支援，因为他们认为我们才是“真正的政府”。虽然他们大概率对所有人都是这么说的，但这毕竟是送到嘴边的利益。"
  JAP_pnr_kg.101.a: "我们当然接受。"
  JAP_pnr_kg.101.b: "[JAP.GetName]一定没安好心。"
  JAP_pnr_kg.102.t: "特别借款"
  JAP_pnr_kg.102.desc: "我们收到了一笔特别借款。"
  JAP_pnr_kg.102.a: "孝敬得好啊，[JAP.GetName]。"
  JAP_pnr_kg.103.t: "鸦片与枪支"
  JAP_pnr_kg.103.desc: "提供鸦片与枪支"
  JAP_pnr_kg.103.a: "我们正好有点资金缺口。"
  JAP_pnr_kg.104.t: "技术投资协定"
  JAP_pnr_kg.104.desc: "提供技术投资协定"
  JAP_pnr_kg.104.a: "科学改变生活。"
  JAP_pnr_kg.105.t: "鼓动正义之战"
  JAP_pnr_kg.105.desc: "他们鼓动正义之战"
  JAP_pnr_kg.105.a: "收复我等固有领土！"
  JAP_pnr_kg.106.t: "军事顾问团"
  JAP_pnr_kg.106.desc: "提供军事顾问团"
  JAP_pnr_kg.106.a: "如虎添翼。"
  JAP_pnr_kg.107.t: "有限的军事干涉"
  JAP_pnr_kg.107.desc: "承诺有限的军事干涉"
  JAP_pnr_kg.107.a: "帮手越多越好。"
  JAP_pnr_kg.108.t: "似乎有些……不对劲"
  JAP_pnr_kg.108.desc: "获得民族精神日本利益"
  JAP_pnr_kg.108.a: "现在断联还不晚。"
  JAP_pnr_kg.108.b: "如果他们继续援助其它人怎么办？"
  JAP_pnr_kg.109.t: "大东亚经济体"
  JAP_pnr_kg.109.desc: "加入日本阵营"
  JAP_pnr_kg.109.a: "我们已变成鹰犬走狗，决不能再陷得更深了。"
  JAP_pnr_kg.109.b: "所谓的国际关系就是走钢丝。"
  JAP_pnr_kg.110.t: "亚洲的爪牙"
  JAP_pnr_kg.110.desc: "完了，全完了，我们彻底沦为了日本的协力国。"
  JAP_pnr_kg.110.a: "为了东亚，一同奋进！"
  JAP_pnr_kg.200.t: "密克罗尼西亚疾驰"
  JAP_pnr_kg.200.desc: "这究竟是上海军基于自身的南进策略而自作主张，还是[JAP.GetAdjective]政府的暗中纵容目前已不得而知。在美国深陷内战之际，日本采取了极为大胆的举动——有一支海军特遣舰队从澎湖马公出发尝试占领关岛。\n\n关岛是马里亚纳群岛的一部分，在美西战争期间被美国占领。马里亚纳群岛的其余岛屿则被出售给德国，并在世界大战期间被日本占领，但最终在战争结束后归还给了德国。\n\n20世纪初，美国在关岛建造了一座加油站、海军陆战队营房和一些岸防炮。然而，华盛顿的政策制定者们怀疑自己在遭遇入侵时保卫关岛的能力，加上与该地区其他大国进行谈判的努力，导致美国未能大规模建设防御工事。关岛被认为对增援菲律宾毫无用处，而且随着美国国内经济局势的恶化，对其进行强化的计划也最终被搁置了，这使得现在的它尤为脆弱。\n\n日本特遣舰队前往关岛的计划很快被[GEA.GetName]在德属罗塔岛的观察哨发现，这使得该舰队被来自加罗林方向的几艘[GEA.GetAdjective]巡洋舰率先迟滞，使得[GEA.GetName]得以同样在新加坡集结一支舰队前往关岛，希望能抢在日本之前“保护”该岛屿。\n\n如今德日两军的部队均已登陆关岛，在三方（[GEA.GetName]、[JAP.GetName]与[USA.GetName]）于岛上短暂的相互交火之后，目前关岛陷入了对峙状态。目前德日两国都在尝试向密克罗尼西亚投放更多兵力，该地区的紧张形势在可以预见的未来将显著升温。"
  JAP_pnr_kg.200.a: "西太平洋正处于悬崖边缘……"
  JAP_pnr_kg.201.t: "德属东亚夺取关岛"
  JAP_pnr_kg.201.desc: "[GEA.GetName]忠诚地履行了他应尽的职责。关岛地区的僵持局势并没有持续太久，在舰载侦察机与一支赶来支援的海军陆战队的帮助下，[GEA.GetName]最终击败了[JAP.GetAdjective]军队，他们并没有受到关岛总督及岛上驻军的更多抵抗，[USA.GetAdjective]驻军人数严重不足，且仅持有轻武器。目前帝国战旗（Reichskriegsflagge）已与三色国旗一同在关岛上空飘扬。得胜的好消息已传回柏林，尽管国会又一次对[GEA.GetName]的“擅自行动”表达了忧虑，但如果没有我们跳过和柏林商讨的快速反应，如今恐怕关岛早已落入[JAP.GetName]手中，而我国的马里亚纳岛链中也将长出一根可怕的尖刺。这足以证明，这些远在柏林的政治家们并不清楚东亚的具体情况，而一味软弱地要求狮子也和他们一样吃草。\n\n帝国的诸国民啊，远离那些无病呻吟者，为这大喜的好消息欢庆吧，且为我等的部队而欢呼吧！上帝庇护强健忠信的勇者，而这勇者正是德意志的众水兵！"
  JAP_pnr_kg.201.a: "甚愿你赐福于德意志！"
  JAP_pnr_kg.202.t: "日本夺取关岛"
  JAP_pnr_kg.202.desc: "一开始是上海军自作主张的袭击，使得[JAP.GetName]内阁不得不应对这一紧张局势，但最终的成果却令所有人都感到欣喜。[JAP.GetAdjective]登陆部队在一场小规模冲突中迫使[GEA.GetName]退缩。或许是收到了新加坡的命令，或许是柏林不愿在亚洲激化矛盾，[GEA.GetAdjective]部队在随后几天便失去了踪影。在德国人离开之后，关岛总督及岛上驻军的抵抗微乎其微，由于美国深陷萧条之中，他们根本无力武装这样一个远方小岛。在几轮交火之后关岛总督便宣布投降了。如今旭日旗飘扬在阿普拉港内，而日章旗也已在关岛总督府上升起，更多驻军正从本土被派遣至关岛维持秩序，并确保[JAP.GetName]的统治。\n\n尽管这只是一场局部冲突，收获的只是一场小小的胜利。但上海军的行为还是立刻受到了民众的赞扬，日本一扫昔日反军和平的阴云，当我们的军队确实地为国家带回真正的利益之时，先前对军人的批评和歧视似乎都消散了。"
  JAP_pnr_kg.202.a: "涤清寰宇，皇道远布！"
  JAP_pnr_kg.203.t: "[638.owner.GetName]控制关岛"
  JAP_pnr_kg.203.desc: "在美国陷入动荡之际，日本采取了大胆举动，派遣了一支海军特遣舰队试图占领关岛。关岛是马里亚纳群岛的一部分，在美西战争期间被美国占领。马里亚纳群岛的其余岛屿则被出售给德国，并在世界大战期间被日本占领，但最终在战争结束后归还给了德国。\n\n20世纪初，美国在关岛建造了一座加油站、海军陆战队营房和一些岸防炮。然而，华盛顿的政策制定者们怀疑自己在遭遇入侵时保卫关岛的能力，加上与该地区其他大国进行谈判的努力，导致美国未能大规模建设防御工事。关岛被认为对增援菲律宾毫无用处，而且随着美国国内局势的恶化，人们希望德国在附近的驻军能够遏制日军的侵略，直至局势缓和。\n\n然而德国也并非是一位友善的朋友，在[GEA.GetName]发现日本人尝试登陆关岛之后，他们也派遣了一支小队登陆了关岛。随着两支部队和关岛驻军三方交火，获得德国保护的希望破灭了。在随后的僵持阶段中，德日两国都在向关岛附近投送兵力，试图将其彻底握在手中。最终，[638.owner.GetName]成功迫使另一方撤退从而控制住关岛，而人数严重不足的美国驻军并非是他们的对手，在用轻武器进行了一系列小规模战斗后选择了投降。现在[638.owner.GetAdjective]国旗已经在关岛总督府上空飘扬，这里已经变成了[638.owner.GetAdjective]领土的一部分，而我们对这一局势无能为力，只能这样看着[638.owner.GetName]耀武扬威。"
  JAP_pnr_kg.203.a: "$japan_foreign_events.226.a$"
  JAP_pnr_kg.204.t: "红，白与蓝"
  JAP_pnr_kg.204.desc: "在过去的几个月中，国际观察家们的目光都聚焦在美国身上。一方面是美国本土因经济危机和政治危机而爆发的一场可怕内战，另一方面则是因美国内战而失去秩序的海外领土，在关岛上，德国和日本正为争夺该岛屿控制权而展开了一场区域性冲突。\n\n这场冲突如今终于以一种意外的情况出现了转机：在过去这段时间中，德日两军在密克罗尼西亚频繁发生海上摩擦，而在关岛之上两边的登陆部队也在进行冲突。尽管局势有时偏向其中一边，但两方最终都未能掌控大局。在菲律宾海附近进行捕捞的一艘[PHI.GetAdjective]远洋渔船并未意识到自己进入了两军摩擦区内，当他们发现并尝试逃避时，其船舱不幸被炮击击穿，这导致了一名船员落水失踪。\n\n事件很快发酵，[GEA.GetName]与[JAP.GetName]都率先指责是对方炮击击中了该渔船。与此同时[AST.GetName]则借机呼吁两国和平解决关岛冲突，在[AST.GetLeader]主导的谈判斡旋之下，柏林和东京达成了一项和解，两国将停止在密克罗尼西亚的敌对行动，[GEA.GetName]和上海军将立刻撤出关岛，包括[AST.GetName]在内的三国将共同确保美国在关岛的正常权益。这场持续约三个月的危机就这样被化解了，但德日两国在可预见的未来里必然将在亚洲及太平洋地区引发更多冲突。"
  JAP_pnr_kg.204.a: "一切毫无变化。"
  JAP_pnr_earlygame.1.t: "国会僵局"
  JAP_pnr_earlygame.1.desc: "“关于这一点——”[JAP.GetLeader]拉长了声音，持续几十天的质询已经让他把内容背得差不多了，“政府正在积极与各地的职业绍介所及地方当局展开协调，来缓解刚刚岸井先生提到的城市失业人口问题。为了提供更符合各地区实际情况的支援，政府已经责成有关部门开展研究，在失业问题尤为严重的地区实施临时赈济。”\n\n意料之中，当“钱”这个字再次从他的嘴里蹦出来了之后，重复了几十天的场面又一次上演了。虽然每次议会质询里登场的角色都不一样，不过他们都说着明显串通一气的话：\n\n“我想就首相刚才那番发言以及先前的诸多发言请求一下澄清，”看起来今天负责念这些老问题的是日本科学社会党的山名义鹤，“您从本次常会开始似乎一直以政府提供救济金为当前所有问题的解决方案，嗯，从米谷自治管理法案——‘政府贴补农村米谷收购价格’，国民健康保险——‘以强制缴费和国库补助维持其运作’，然后是今天的都市失业缓解。政府确实有这么多公共预算吗？抱歉有些冒犯，但是据我所知，政府应该还在支持汉城的都市改造计划，要重建都市——”他抬头环顾了一圈议会，确认除了$JAP_pnr_social_conservative_party$之外的人确实都在听他发言，“——可要花费不少钱。恕我冒昧，是因为$KOJ_pnr_kawamura_takeji$是$JAP_pnr_social_conservative_party$的人所以您很大度吗？我想如果您不能解释清楚这些额外公共开支从哪里来的话，我个人可能是没有办法赞同这些计划的。”\n\n山名义鹤坐了下去，然后又立刻弹起来：\n\n“抱歉犬养先生，但是我想大家不想再听您那已经说了快三个月的——”"
  JAP_pnr_earlygame.1.a: "“——规模庞大的都市增税计划了。”"
  JAP_pnr_earlygame.1.b: "“我想解决办法只有增税，别无他法了。”"
  JAP_pnr_earlygame.2.t: "真诚的心意"
  JAP_pnr_earlygame.2.desc: "武藏野町吉祥寺——他在散会之后费了好大劲儿才从社会大众党的人那里搞清楚$JAP_pnr_katsumaro_akamatsu$的住处。这些“新人会”出身的政客似乎都是受虐狂，就算当上了议员也住在普通人的住宅里。不过还好吉祥寺还勉强不算是什么乡下地区，只要坐中央本线就能抵达。登门拜访的礼物是不能少的，先前他在山道襄一那里没取得什么成果，铃木先生说是给国民同盟的诚心和馒头不够。所以这次他准备的足够把盒子挤开一个小尖。而且他这次还拿到了铃木先生的承诺，说是要作为撒手锏使用——政府愿意认真研究一下山口县德山市的新铁路计划，总之无论如何要把$JAP_pnr_katsumaro_akamatsu$和他的日本科学社会党拉拢过来。不过他本人对这件事心里没底，因为久原先生似乎没听说过这条铁路。\n\n不过这都和他没什么关系，他只要负责说动这个书呆子就可以了。整理好情绪，他按了门铃，然后非常真诚地对着开门的，戴着圆框眼镜的白西服男子微微鞠躬。虽然他可比这人年长至少十岁。"
  JAP_pnr_earlygame.2.a: "贸然拜访实在失礼，我是$JAP_pnr_social_conservative_party$的~"
  JAP_pnr_earlygame.3.t: "浪涛"
  JAP_pnr_earlygame.3.desc: "$LEP_sun_chuanfang$把众多华东地区的铁路，甚至包括刚刚开通的浙赣铁路卖给德国人这件事很快就传遍了全中国。如今的孙传芳任谁看了都可以说上一句”汉奸“。而各界知识分子的暴怒很快就转变为从学生团体对此的抗议游行。就像在这片土地上过去发生过的许多不祥事件那样，当学生们开始行动之后，工商业界肯定很快也会卷进来。现在正发生在芜湖的这场抗议正是如此。\n\n由于事件发生后安徽督理$ANQ_chen_tiaoyuan$自诩为”爱国者“，这使得大多数对[LEP.GetName]不满的抗议者都聚集在芜湖市内。随着前来的抗议者越来越多，抗议队伍也变得越来越浩大——换句话说，立场和身份都变得极为混杂。\n\n在中国工团党的支持下，今天下午的这场抗议还有附近德资工厂中的罢工工人参与。而面对此等非常事态，$LEP_sun_chuanfang$自然把一部分德训部队从南京调到芜湖来协助维持秩序——一切对他来说都非常完美。复杂的人员构成使得他并未受到更多盘问，他身为上海市工会干事的身份也并未引起他人的疑心，正是因为他自信自己能够说一口流利的江淮官话才接受了这项任务。况且，即便他受到了怀疑，但谁会拒绝一个带着活动资金来支持他们事业的人呢？\n\n队伍就这样行进着，他和那些愤怒的民众一样高举着白色旗帜，上面用毛笔写着“诛杀卖国贼$LEP_sun_chuanfang$”，口中则和所有人一样怒吼着“打倒列强，反对租界”的口号。随着他们的行进，越来越多的小股抗议者被吸纳了进了这道不可阻挡的洪流。他能看到，能看到那所谓的”德训部队“已被这阵仗吓得双腿发抖，他能看到这些家伙只是一群装备德式军械的土匪。\n\n抗议的队列已经越来越接近那支维持秩序的部队了，两边很快就要产生接触，届时一定会引发肢体冲突。他稍稍放低了那面写着”打倒列强“的旗帜。\n\n并借着白布的掩护抽出了那支预先准备好的FN M1900半自动手枪。"
  JAP_pnr_earlygame.3.a: "“打倒狗汉奸$LEP_sun_chuanfang$！”"
  JAP_pnr_earlygame.3.b: "他们为什么要打架？（关于大陆干涉机制的解释）。"
  JAP_pnr_earlygame.4.t: "北海道"
  JAP_pnr_earlygame.4.desc: "虽然令人意外，不过事情似乎还是谈成了：$JAP_pnr_katsumaro_akamatsu$那天很开心地收下了馒头，当然也收下了铁路，临走之时还给他和$JAP_pnr_social_conservative_party$道谢。在二人讨论的时候，$JAP_pnr_katsumaro_akamatsu$对他提出的每一项“诚心”都表示了“支持和感谢”，并且也说会“出于民众利益重新考虑在议会中的站位”。在他把这一系列积极信号汇报给党之后，这至少让$JAP_pnr_social_conservative_party$重新看见了一丝法案通过的希望，不过这种期待很快就转化成了失望。\n\n今天稍早些时候，一位日本科学社会党的议员在喫茶店与$JAP_pnr_social_conservative_party$成员见面时，非正式地传达了他们的想法：科学社会党依然不会支持现行法案。除非$JAP_pnr_social_conservative_party$愿意修改一开始提出的增税案，对财阀资本课以更重的累进税，而不是从手工业和杂业的一般从业者身上想办法去补贴农村地主的话——或许科学社会党还会考虑一下是否要选择“弃权”。\n\n另外，$JAP_pnr_katsumaro_akamatsu$还托这位党员传达了另一条消息：\n\n他是北海道选区的代议士，不是山口县的。"
  JAP_pnr_earlygame.4.a: "就不该让和尚的儿子进议会！"
  JAP_pnr_earlygame.5.t: "天皇敕命"
  JAP_pnr_earlygame.5.desc: "帝国议会常会即将闭幕，然而犬养内阁在今次会议上提出的诸多法案竟仍在审议之中。今天依旧是同一出剧目的上演，不同之处在于先前一直维持沉默的陆海军大臣们也加入了战斗。军队势力开始挥舞起讲稿，开始主张要修改持续了近十年的实质军缩政策，不过就像往常一样根本没人理他们，而且常会即将闭幕，他们现在跳出来也没什么作用。\n\n1926年犬养内阁上台之后便一直以“不列颠革命”和民间高涨的反战情绪为由来削减国防预算，使得海军的造舰计划也陷入停滞——不过这一切都是因为陆军当初头脑一热联手内阁一起打压海军导致的。在中东路事件之后，[JAP.GetName]在[FNG.GetName]取得的利益更是没有当时陆军大臣吹嘘的那么大，关东军为了中国人的铁路和俄罗斯人拼死奋战，最后换来的是[FNG.GetLeader]坐在沈阳政府里把关东军顾问们每天骂的像是孙子。一车又一车的枪支装上货船运往奉天，以极为廉价的价格白送给了这位盘踞在中国东北的老帅。这场毫无利益的军事冒险使得陆军步了海军后尘，也成了民间攻击军队的素材。\n\n不过这都不再重要。毕竟等今天结束，犬养内阁因为执政失败而倒阁便是显而易见的了。至于$JAP_pnr_inukai_tsuyoshi$本人，看起来是放弃挣扎了，正在自己的椅子上闭着眼睛数算最后几分钟。\n\n然后时间到了，常会结束了——直到宫中的使者出现之前，在野党都是这么想的，那位使者携带着从宫城带来的敕命，上面列有犬养内阁所有国务大臣的副署。\n\n朕兹将帝国议会之会期延长二十一日。"
  JAP_pnr_earlygame.5.a: "现在来了。"
  JAP_pnr_earlygame.5.b: "宫中的阴谋……"
  JAP_pnr_earlygame.6.t: "坐渔庄的访客"
  JAP_pnr_earlygame.6.desc: "远远看去，骏河湾的水很浓稠，恐怕容不得任何一条鱼自由游弋。$JAP_pnr_inukai_tsuyoshi$向计程车司机致谢，把多余的零钱留给他之后便下了车。静冈县兴津浸在红豆沙的味道里，虽然正月即将结束，但依然有店铺在卖杂煮，而且说到兴津的糕点那必然是作为“献上铭果”的宫样馒头——可惜购买伴手礼只是他回去时的目的，而非他来这里的目的。\n\n八十岁的老人站在了坐渔庄的大门前，侍者早已等候多时，很快便将他引入内室与主人交谈。\n\n“政友会内部，以及《普通选举法》之后情况的复杂怪奇，实在是使我不能胜任。”$JAP_pnr_inukai_tsuyoshi$在简单的寒暄之后直入正题，帝国议会常会即将结束，如果$JAP_pnr_social_conservative_party$连一项法案都无法取得成果，恐怕会有有心之人讥笑政党内阁之无能，“我想本来《普通选举法》和田中义一的事情后就该离开了，但实在是世论尚不容我就此退去，至今也有十年了。没有做出什么值得称道的大事，还发生了中东路那样的事，辜负了陛下的圣意，也有损国民之所托，实在惭愧惭愧。”\n\n“所以我想”，得到了对方点头之后，$JAP_pnr_inukai_tsuyoshi$继续说，“不能因党争而令国家预算与必要法律都无法处理。如果可以的话，内阁想奏请至少延长会期，令我竭力处理，议会闭会后，我亦当对今日政局有所善处。您以为如何？”\n\n对方自然理解了他的意思。“以内阁总理大臣之见，”最后的元老，$JAP_pnr_saionji_kinmochi$的语调里流露出舒缓和放松的气氛，“闭会之后，谁能担此大任？”\n\n所谓的坐渔庄，其含义正是“希望能悠闲地坐着钓鱼度过余生”——$JAP_pnr_inukai_tsuyoshi$临走之前还是决定吃一碗杂煮——至于鱼儿们都一股脑地往这里游过来，则是另一件事了。"
  JAP_pnr_earlygame.6.a: "“铃木喜三郎久历官界，由他收拾政局应当稳妥。”"
  JAP_pnr_earlygame.6.b: "“久原房之助久历实业，想必能于民生有所振作。”"
  JAP_pnr_earlygame.6_tt: "§c$JAP_pnr_saionji_kinmochi$将参考我们的意见。与此同时，$JAP_pnr_social_conservative_party$内部也会§R记住§!我们的答案§!"
  JAP_pnr_earlygame.7.t: "关切"
  JAP_pnr_earlygame.7.desc: "这可是件稀奇事，就在那份宣布帝国议会会期延长的敕命发布之后，内大臣斋藤实就向各政党（除却$JAP_pnr_social_conservative_party$和$JAP_pnr_syndicalist_party$）领袖发来了邀请，希望能就最近议会中的僵持情况展开一场个人性质的恳谈。既然是“私人”，那就没什么合适的理由拒绝，于是大家就这样齐聚在永田町二丁目的幸乐（Koraku）料亭。用过牛肉和御酒之后，这位海军出身的内大臣便发话了：“诸君都是帝国议会中的议员，受国民之付托，相信各位都明白，帝国议会之设立，乃是为传达国民之声音，协赞天皇陛下立法吧。”得了众人捧场的肯定之后，他便继续说：“内阁之存亡不能使国家政务废弛，也不能令民众对宪政之诸党灰心，我想在座的各位也都认同吧。”随后又是捧场的肯定，不过声音小了些，可见这些话是一剂极强的醒酒药。\n\n“近日众议院的一些事也传到了宫中，我个人也是听到了一些议论，犬养总理毕竟年事已高，而我国之必要政务又久滞于议场。我个人对此甚为关切，因此才冒昧请诸君今日过来，想听听各位的意见。各位觉得至少就预算案这种施政必要之法案，是否还有要商榷的地方？”“斋藤子爵，”最先发言的是代替社会大众党的安部矶雄前来的社会大众党书记长，$JAP_pnr_hisashi_aso$，“我党非常认同，议会之政争不可令国政废弛，也不可伤害民众对议会政治之信心，因此若当前内阁就那些胡来之工会法案、都市征税等议案松口，我党无意妨碍必要法案通过。”“我党也抱持如此想法，况且先前$JAP_pnr_social_conservative_party$所提议之米谷自治法案并非不能再做商讨，如果政友会愿意交换法案，$JAP_pnr_authoritarian_democrat_party$自然乐意助力。”“民众既然以我党为总代表，我便必代表人民之意愿在议会中战斗，”现在是$JAP_pnr_katsumaro_akamatsu$的发言时间，“为人民之根本福祉献身，我党全心全意支持必要议案通过。至于关于铁路，矿业以及健康保险组合之事，也始终欢迎$JAP_pnr_social_conservative_party$与我党对话，共谋社会之总体福利。”\n\n恳谈进行得很顺利，内大臣已确定各在野党都愿意合作。不过情报都是双向的，值此机会，攻守易形——“斋藤子爵，既然如此，椅子的位置是否已经有眉目了？”\n\n这才是他们真正想知道的东西，斋藤实很清楚这一点，当然这也是他搞不清的地方,$JAP_pnr_market_liberal_party$才是议会内的第二大党，那些小党派死心塌地地跟着他们一起对$JAP_pnr_inukai_tsuyoshi$进行倒阁又有什么利益呢？"
  JAP_pnr_earlygame.7.a: "“据我个人所知，是为民众谋利益的笃实之人——”"
  JAP_pnr_earlygame.8.t: "御下问"
  JAP_pnr_earlygame.8.desc: "“如此听来，犬养内阁恐已陷入困难，再不能维持政府了吧？”听到垂问，斋藤实立刻回答，“是，诚如圣虑，尚有多案未决，其中亦有施政必要之项。关于内阁总辞之事，还是西园寺公最为详悉。”“陛下，$JAP_pnr_inukai_tsuyoshi$等希望能请陛下降下敕命，延长会期二十一日，妥为处理诸般必要议案。”\n\n“内阁所奏，朕已知晓。既然为必要之故，朕以为可以。斋藤，便先将此意传与犬养，余下手续照例办理吧。”听到这话，斋藤实也知道是时候了，他站起身：“失礼了，那我便先退席去通知各国务大臣。”在得到了那坐在另一侧的“嗯”的一声之后，他就这样把局面留给了二人。\n\n“实在地说，我非常担心如果犬养倒台了，这些法案要怎么处置。”他调整了一下坐姿，语调也一扫先前的严肃，“西园寺公怎么看呢？$JAP_pnr_inukai_tsuyoshi$先前和你聊过……真的不能挽留吗？”“陛下，如今这种情况，犬养既然已有退意，若因圣眷而强使其留任，恐怕反而有损政局稳定。”\n\n“西园寺公觉得举荐谁比较好？”今上天皇站起身来，“犬养的意思是希望政友会的其他人来接替，”$JAP_pnr_saionji_kinmochi$也起身，“陛下有什么想法吗？政友会于您而言还算满意吗？”\n\n“前几天在打高尔夫的时候，”他把手支在桌子上，“近卫和我说了众议院不得了的事情，他们都联起手来要把$JAP_pnr_social_conservative_party$拉下台。所以我也从他那里听到了一些内容，我对$JAP_pnr_inukai_tsuyoshi$倒是没有特别的意见，他尽职尽责，但是$JAP_pnr_social_conservative_party$的其他人似乎都酷爱认养义子，搞政治靠山，实在令人担心。他们要是想想文正政变，就知道这么搞下去肯定要有大事发生。”\n\n“反过来再看看$JAP_pnr_market_liberal_party$那边，我听说他们党内大搞总裁专制，实在未必是什么政党政治的好事，不过总要比兄弟阋墙要好太多。西园寺公认为呢？”这番好恶表述，$JAP_pnr_saionji_kinmochi$当然清楚个中玄机，也自然能揣摩圣意拟好人选，“臣以为——”"
  JAP_pnr_earlygame.8.a: "$JAP_pnr_suzuki_kisaburo$可任此责。"
  JAP_pnr_earlygame.8.b: "$JAP_pnr_fusanosuke_kuhara$可任此责。"
  JAP_pnr_earlygame.8.c: "$JAP_pnr_hamaguchi_osachi$可任此责。"
  JAP_pnr_earlygame.9.t: "解冻"
  JAP_pnr_earlygame.9.desc: "帝国议会自意外延长会期以来议事速度骤然加快，二十一日间取得的进展已超过此前数月。看来此前困扰议场的诸多原则问题，也并非全无商量余地。此前始终态度强硬的各在野党，近日亦相继转向合作，开始以积极姿态支持$JAP_pnr_social_conservative_party$的多项提案，虽然偶有冲突和争执发生，但再也没有先前的那番僵局了。\n\n政界一部近来盛传，此次延长会期乃是因犬养内阁得到宫中支持，准备继续执政，对此政府及宫中方面均未作明确说明。谈到通过的诸多提案，其中最受瞩目者，是昨日通过的《米谷自治管理法案》修正案，在经过漫长的拉锯战之后，该法案现在除补贴米价之外，还增列自作农扶助及限制部分小作料上涨的条款。\n\n议会现已通过了该法案，意在缓解受到了朝、台两地大米输入后一蹶不振的我国农业市场，以救济经营日益困难的稻作农家。先前本报就此采访了农林大臣，内阁似乎笃信这些措施能够改善小作农经营状况，缓和近年来日趋尖锐的农村矛盾。\n\n就在现在帝国议会中还在就预算案展开商讨，如今预算案简直像是在刚过去不久的正月里的各位所吃的杂煮那样，各政党都向其中塞入了大量内容。于我国国民而言值得注意的有国民健康保险的补贴和职业绍介的补贴，虽然目前预算案仍处于草案状态暂未审议通过，但院内普遍认为通过已无重大障碍。"
  JAP_pnr_earlygame.9.a: "《东京日日新闻》讯"
  JAP_pnr_earlygame.10.t: "休止符"
  JAP_pnr_earlygame.10.desc: "今天是帝国议会常会的最后一天，而$JAP_pnr_inukai_tsuyoshi$则在议事即将告终时主动起身。\n\n“诸君”，他尝试吸引那些没注意到他起身的议员的目光，“本内阁已于今日开会以前，向陛下捧呈各国务大臣辞表。”\n\n这件事稍晚些时候传到了议会之外，而媒体们得知这件事之后也自然引发了不小骚动，但现在对于帝国议会中大多数议员来说这消息与其说令人震惊，不如说终于证实了此前的猜测。不过也有他们不知道的事情：按照近年的惯例，内阁一经总辞职，宫中便会就后继首相下问元老$JAP_pnr_saionji_kinmochi$，被视为继任人选者在经$JAP_pnr_saionji_kinmochi$的奏荐后就会被天皇陛下召见以降下大命组阁，按照时间推算，这位候选者应该正在四处物色阁员。对这些议员来说，他们大多只能确定自己不是新首相，也大抵不在新内阁的名单内。不过这个问题也会在今天解决——只需要检查一下门口的登记表，确定谁没有出席今天的常会就能确定了。\n\n当然也不必现在就跑到门口去翻那本册子，因为$JAP_pnr_inukai_tsuyoshi$既然在这个时刻宣布，那就说明时间上其实差不多了，很快书记官从议场外带回了宫内省方面刚刚传来的消息："
  JAP_pnr_earlygame.10.a: "是那个检事总长出身的家伙……"
  JAP_pnr_earlygame.10.b: "企业家怪人来了吗……"
  JAP_pnr_earlygame.10.c: "$JAP_pnr_hamaguchi_osachi$，议会里要有变化了。"
  JAP_pnr_earlygame.11.t: "与下一乐章"
  JAP_pnr_earlygame.11.desc: "“以上，就是今天关于满川先生的部分，”男人把稿子放在桌台上，环顾了一下在座的听众们，“满川龟太郎先生对我国的惆怅和对被夺去的亚细亚的悲痛就是这样——这也是为何在二十年前我和满川先生与北先生等志同道合的人组成了‘犹存社’。各位请看，即便是在今日，耀武扬威的欧罗巴诸国也依旧以对待奴隶的凶暴将亚细亚踩在脚下。从[HND.GetName]到[TRK.GetName]，亚细亚人因国家的弱小而受到列强们轻侮，所以他们也开始以运动让自己的国家强盛起来。诸君！此刻正值亚细亚诸民族大苏醒之时，与此同时我们[JAP.GetAdjective]民众在做些什么呢？作为亚细亚先驱者的[JAP.GetName]的口号是什么呢？战争打倒！军队打倒！野蛮打倒！——诸君，今日街头报纸上，不正充斥着这样的声音吗？这也是我一直向各位强调的，也是在讲演开始以前，$JAP_pnr_ishiwara_kanji$大佐提到的问题：国民们感染了一种懈怠的疾病，开始提倡一种令人不安的主义。国民和内阁开始相信，只要[JAP.GetName]丢掉宝剑，折断长弓，欧罗巴诸国便会因此信任[JAP.GetName]。就算是[TAI.GetAdjective]的民众，也要为了自己的投票权而和总督府展开斗争。而我国国民正把无力视为有力，把屈服视为胜利。”他敲了敲桌子，然后目光扫过眼前这些人的肩章。\n\n“一个连自己都无力保卫的[JAP.GetName]，一个为了虚假和平就主动放弃力量的[JAP.GetName]，又有何颜面自称亚细亚民族的先驱，诸民族之中的大盐平八郎？我国国民不再相信诸君这些承担国防之人，他们的行动不可不谓是一种思想上的迷误。但要如何医治这种迷误，各位或许可以稍后在休息时畅所欲言，共同讨论。现在请永田少将继续。”然后他张开手臂，一如雄辩家那般以动作拥抱了在场的所有听众，$JAP_pnr_okawa_shumei$，在一众佐官的鼓掌声中结束了他在九段的军人会馆中的演说。他当然也没忘记向那位慷慨邀请他的人致意，虽然那人今天并未到场，不过作为“圣师”，其还是派来了自己的使者。"
  JAP_pnr_earlygame.11.a: "然后是特里斯坦和弦。"
  JAP_pnr_earlygame.12.t: "我国对[EGY.GetName]出口创新高"
  JAP_pnr_earlygame.12.desc: "在刚刚过去的1935年，我国大阪港的入港船达20万艘、货物吞吐量达2864万吨，创下了有史以来的最高纪录。而这场“大阪港繁荣”本身便是我国出口贸易逐渐恢复的缩影。在迅速扩张的海外市场中，[EGY.GetName]尤其引人注目。\n\n在过去一年里，我国对[EGY.GetAdjective]的出口总额大幅突破，从纺织品到各类轻工业日用品，日本制造正在迅速进入其城市与乡村市场。也正是在1935年，我国已成为埃及王国的第一进口来源国。\n\n回顾世界大战时期，我国大量产品都出口至因战争而陷入日用品生产不足的欧洲国家以及大洋彼岸的[USA.GetName]，但随着《凡尔赛条约》和《青岛条约》的签订，我国失去了原先的大量海外市场，[GER.GetName]以及象征着其经济力量的中欧同盟将世界经济牢牢把握在手中，[GER.GetName]因[JAP.GetName]曾参与世界大战而借助中欧同盟的贸易政策压缩日本商品的市场空间，并要求各加盟国对我们实施进一步贸易禁运，即便是在与我国工商业界素有密切关系的东亚市场也一边借助[GEA.GetName]掌握住马六甲，对我们多加干预，另一边则花费大手笔扶植起[QIE.GetName]与[LEP.GetName]作为德国亚洲经济圈，蚕食我们在大陆的经济利益。\n\n然而我们并非彻底失去了欧洲市场，中欧同盟中具有独立性的加盟国，如[AUS.GetName]和[OTT.GetName]热衷于继续维持广泛的国际贸易，也不愿割舍我国以低廉价格和相当品质见长的产品。我国商品得以经这两国的转口贸易进入中欧同盟，从而在世界经济中得到了边缘但依旧有分量的地位。另一方面，我国也积极寻找其它潜在市场，[EGY.GetName]及[SOM.GetName]等非洲国家成为了大战之后我们的新兴市场，他们急切地需要将拥有的资源交换为可用的商品。可以说世界大战结束之后失去大量出口国是我国经济陷入战后危机的原因之一，但多亏了这些新晋交易伙伴，[JAP.GetAdjective]出口经济才能取得缓慢的恢复。"
  JAP_pnr_earlygame.12.a: "而我们就要向过去的灰暗告别了。"
  JAP_pnr_earlygame.13.t: "Confidence/Complication/Control"
  JAP_pnr_earlygame.13.desc: "下午做好的御手洗团子还剩下大半盘，再回过头看看玻璃柜里，确实没有什么值得重新码放整齐的东西。她探出头去左看右看，大家也都阴着脸，不像是对这家店的团子有兴趣的样子。而且母亲也抓着湿布过来，把几分钟前擦过一遍柜台又擦了一遍。既然这样，自己最好还是不要在前面添乱了。想到这里，她钻到了后门边，把那一捆预先初步处理过的细竹条压在两腿上，右手握住刀柄，左手则捏着竹条，用肚子抵住后端向前发力推削。然后是把刀反转过来，用刀背刮擦几次，一根用来穿团子的光滑竹签就这样做好了。\n\n不过削竹签不耽误她听声音，首先是自行车的车铃声，从远到近再到远，没有停歇的意思；然后是几个学生，也就这样走过去了——随后是隔壁里屋男人的声音：“昭和二年都挺过来了，怎么今年挺不过去！”这声音好大，就算是在店门口感兴趣的客人，听到这一声也只能飞快地逃离了吧。那个声音也是意识到了刚才的失礼，也可能是女人用湿布不停地拍打他的手臂发出的“啪啪”声警告他小点儿声音，于是又变成那个极细极细，温和的父亲的声音。\n\n“那末……如果去申请破产的话你们都要受苦，我想另一个出路就是生命保险了，之前有买过的明治生命现在就能用上。”竹签已经削好了，她就这样踏得很重地走到前面，侧身弯下腰去拾那些团子。下午做好的御手洗团子和之前一样，还剩下大半盘。\n\n然后她回过头去，那个玻璃柜也是和之前一样，依旧空荡荡地什么都没有。"
  JAP_pnr_earlygame.13.a: "“不要这样讲……政府总归会做些什么吧。”"
  JAP_pnr_earlygame.14.t: "公债带来恢复"
  JAP_pnr_earlygame.14.desc: "[JAP.GetName]在过去十年中的经济恢复全要仰赖$JAP_pnr_inukai_tsuyoshi$内阁的大藏大臣高桥是清的“积极财政政策”，他将赤字公债作为刺激剂实现了国家贸易产业的复苏，但同时也为如今的“黑色星期一效应”埋下了隐患。“积极财政政策”是一种依靠经济增长逐步消化既有赤字的特别财政政策，在目前各国因衰退而纷纷提高贸易关税壁垒，海外市场萎缩的当下，最好的选择自然是继续延续积极财政，但在过去十年中积累下来的庞大赤字公债使继续增发已无太大空间。\n\n[JAP.GetLeader]的内阁刚刚组成便遇到了这场经济上的考验，从目前经济危机在全球范围内的蔓延速度来看，在未来几周内坏消息只会越来越多。但它对[JAP.GetName]来说是纯粹的坏事一桩，可对内阁来说情况却不同。假使内阁能够妥善渡过此次危机，那么就能奠定自己在国民中间的威望，同时向宫中势力展示自己的实力。在博得宫中和国民的信任之后，想要推行什么政策都会少很多阻力。\n\n本届$JAP_pnr_social_conservative_party$内阁的大藏大臣，先前与高桥是清观点一致的$JAP_pnr_fujii_sadanobu$在今天稍早些时候确定了紧急特别经济计划：内阁本无意继续扩大发行公债，因为目前日本银行的公债消化率已从先前的99%降至约80%的水平；但受到时局所迫，大藏省决定在今年以不超过上一年度财政自然增收额为限，额外发行特别债券，并由此在帝国各地开展大规模公共工程。除了延续高桥时期的财政政策外，$JAP_pnr_fujii_sadanobu$还提出基于世界大战期间的“战时利得税”制度设立“时局匡救临时利得税”，向获得超额利润的法人与个人征收超额部分约11%的税款，以避免政府财政因增发公债陷入困难。当然，关于增税这件事自然在社会上收获了不小的抗议声。"
  JAP_pnr_earlygame.14.a: "我们应该将所得资金投入消费品生产。"
  JAP_pnr_earlygame.14.b: "拉动军工产业需求有助于我国国防。"
  JAP_pnr_earlygame.14.c: "召集各财阀总裁和实业会头，和他们洽谈。"
  JAP_pnr_earlygame.15.t: "败者退场"
  JAP_pnr_earlygame.15.desc: "在[JAP.GetName]那失去的十年中，$JAP_pnr_inukai_tsuyoshi$内阁的大藏大臣高桥是清一意孤行，以赤字公债这种毒药作为刺激剂，滥用政府的财政信用来大肆进行产业拯救和大规模公共工程。表面上将我国带出了经济恐慌，却在如今的“黑色星期一效应”前暴露了其政策的失败性。不尊重市场规律，给那些毫无竞争力的失败企业续命，以及借助公共工程创造虚假繁荣最终引发了今日的混乱。\n\n[JAP.GetLeader]的内阁如今将修正大藏省过去十年所滋养出的“国民经济之癌”。“黑色星期一”是一场经济上的考验，某种意义上可称是本届内阁的“飞来横祸”，但这也是一个机会，证明$JAP_pnr_market_liberal_party$长期以来坚持的市场自由主义政策才是真正正确的道路，倘若内阁能妥善处理这次危机的话，在元老和宫中的赞许下复现过去十年里$JAP_pnr_inukai_tsuyoshi$的长久执政也并非是一种幻想。\n\n本届$JAP_pnr_market_liberal_party$内阁的大藏大臣$JAP_pnr_tsushima_juichi$认为在当下继续增发赤字公债是最简单的方法，但若真计划令日本经济正常化，则最好借助这次经济危机实现一场“经济更新”，将那些长期以来依赖国家财政支援的不良企业悉数出清，或令其被市场中更有活力的大企业集团并购。在此过程中政府只要确保作为市场财政最后防线的银行处于稳定，并且偶尔支援那些因出清过程被连带误伤的优质企业，那只看不见的大手就会摸来摸去地把一切都安排好。\n\n$JAP_pnr_market_liberal_party$一贯坚定地认为市场能够进行自我调节，提出类似计划也在情理之中。除了这项刷新国内经济状态的计划之外，内阁还希望借此机会扭转过去十年中因滥发公债所形成的奢侈浪费风气。为了厉行节俭，$JAP_pnr_market_liberal_party$还准备实施官吏减俸计划，虽然该计划尚未公布，但想必一定会遭到政府内的强烈反对……"
  JAP_pnr_earlygame.15.a: "在这种危机之下，还能维持正常生产的企业最重要。"
  JAP_pnr_earlygame.15.b: "一些拥有先进技术，潜力更大的企业值得稍稍保护。"
  JAP_pnr_earlygame.15.c: "值此机会积极促进各财阀进行产业并购。"
  JAP_pnr_earlygame.15_tt: "通过借助这场经济危机人为地对不良企业进行出清，我们或许将§m更快地§!从这场经济危机中脱身——代价是社会的§N稳定度§!。在我们走出经济危机后，将获得："
  JAP_pnr_earlygame.16.t: "$JAP_pnr_fujii_sadanobu$辞职"
  JAP_pnr_earlygame.16.desc: "尽管我们延续了先前的财政政策，但社会经济却并非如我们想象的那样立刻展现出强劲的恢复势头。似乎是市场已经对我们持续十年的经济刺激陷入疲劳了，幸运的是情况没有变得更糟，或许可以称为“缓慢温和的复苏”。更糟的情况发生在现任大藏大臣$JAP_pnr_fujii_sadanobu$身上：他选择辞职。在不久前的一次预算内阁会议上，$JAP_pnr_fujii_sadanobu$可怜兮兮地对农林省称“下属不肯让步，我也没办法”，随后又重重地咳了几声，从而回绝了他们要求修改“时局匡救临时利得税”的抗议。$JAP_pnr_fujii_sadanobu$身体一向不好，这一点在政府中人尽皆知，而他本人也时常会利用这一信息来作为筹码，巧妙地在财政问题上促使各方让步。\n\n大家本以为这一次依然是$JAP_pnr_fujii_sadanobu$本人的演技，但在会议结束后，大藏大臣本人在下楼梯时突然失去意识，滚落到楼梯底部。在经庆应义塾大学医院诊断后，医生认为从楼梯滚落并没有对其身体造成多大伤害，但他先前罹患的鼻窦炎和支气管扩张已进展到极为严重的程度，建议他入院接受治疗。他本人在随后于意识清醒的情况下辞去了大藏大臣的职务，目前该职务由高桥是清子爵接替。高桥将接力棒交给了$JAP_pnr_fujii_sadanobu$，而如今他又将其交还给了高桥，这不可不谓是一种命运。可以见得的是，高桥子爵将继续延续该财政政策，彻底将日本经济带向新的未来。"
  JAP_pnr_earlygame.16.a: "命运的安排，真是感人。"
  JAP_pnr_earlygame.16.b: "我是说有没有可能……"
  JAP_pnr_earlygame.17.t: "关闭工具箱"
  JAP_pnr_earlygame.17.desc: "内阁使出浑身解数解决“黑色星期一”的烂摊子，目前来看只是遏止了经济的下落，并在赤字公债的刺激下透露出一些恢复的势头。稍早些的会议中，高桥子爵严厉回绝了额外增发公债的建议，他认为如果继续增发公债，[JAP.GetName]将陷入恶性通货膨胀，到时候就不是内阁总辞职就能轻描淡写地解决的问题了。无论如何，[JAP.GetLeader]希望借助这次危机做出耀眼政绩的计划失败了，但这也怪不得他，毕竟“黑色星期一”完全是飞来横祸，自己只是在$JAP_pnr_inukai_tsuyoshi$倒下之后不幸地遭到命运碾压的可怜人罢了。虽然这次可能得不到元老$JAP_pnr_saionji_kinmochi$的肯定，但比起弄巧成拙，现在接受高桥子爵的建议，什么都不做就绝不会错，实在不行的话就说是高桥的主意就可以了。"
  JAP_pnr_earlygame.17.a: "接下来，交给市场……"
  JAP_pnr_earlygame.17.a_tt: "我们的经济状态每过30天都会好转，直到彻底恢复正常。我们将因我们的§Y财政选择§!得到对应的增益。"
  JAP_pnr_earlygame.18.t: "$JAP_pnr_tsushima_juichi$退场"
  JAP_pnr_earlygame.18.desc: "内阁的自由主义财政政策在社会上引发了零星恐慌，随后而来的一系列变化则证明这些恐慌是合理的：虽然从数据上看当前经济仍在掌控之中，但社会上已经因倒闭潮而出现了不满的声音。政府内部的情况也完全不容乐观：在受到各方官僚的口水围攻之后，$JAP_pnr_market_liberal_party$撤回了他们的官吏减俸计划，当然与此同时被撤回的还有$JAP_pnr_tsushima_juichi$本人。\n\n今晨稍早些时候，社会团体“勤俭工人和平会”——该团体由一群混迹于特殊喫茶店的无业游民，或称为“壮士”的人组成，可以说其日常行动基本与组织名大相径庭——发动了一场针对当前内阁的骚扰，他们攻占了$JAP_pnr_market_liberal_party$的一座党报印刷厂，并同时包围了$JAP_pnr_tsushima_juichi$在东京的住宅，要“替天行道”，要求内阁取消现在施行的财政政策。总而言之，$JAP_pnr_tsushima_juichi$已在刚刚让别人捎来了他的辞职信，现在井上准之助承担起了大藏大臣的职务。井上先生对我国经济多有关切，且长期以来一直与$JAP_pnr_market_liberal_party$交好。井上先生在本次紧急上任时也带来了此前准备好的许多政策草案，同时向政府官僚宣布将确保取消减俸计划，该计划也不会以任何形式再次推出。井上先生还谈到，在经过研究后，他准备对现有的财政政策进行一些修改，从而真正实现日本各项产业的振兴。"
  JAP_pnr_earlygame.18.a: "井上准之助会收拾残局。"
  JAP_pnr_earlygame.18.b: "不良资产被出清了。"
  JAP_pnr_earlygame.19.t: "飞出窗外"
  JAP_pnr_earlygame.19.desc: "社会会怎么评价$JAP_pnr_market_liberal_party$的执政呢？对于那些偏向杂论的报纸，对采用了这样雷厉风行的经济更新政策的内阁想必没法给出好评价，但像是《日本工业新闻》这样偏向财经政策的报刊想必能看出内阁的良苦用心吧，[JAP.GetLeader]之所以没买别的报纸正是出于这个原因。所以展开新印的报纸，就能在头版头条里找到对政府的评价——杀人犯！\n\n[JAP.GetLeader]立刻就把报纸从窗户丢了出去，但想了想总归还是觉得不对，所以几分钟后，那几张沾了点尘土的纸片就又妥善地出现在他的桌子上了：自$JAP_pnr_market_liberal_party$施行经济更新政策之后，本就蒙受“黑色星期一”影响的企业主们更加不堪重负，每日都有破产者，坠楼者，自缢者，可谓说当今内阁乃是以看不见的大手捉着经济利刃的，最凶恶的刽子手。而破产的诸多中小产业则被各路大集团以极低的价格收购，使得本报不禁脊背发凉，如今内阁是否已和各大财阀资本勾结，共同搜刮国民之财富？\n\n这下可好了，想必元老$JAP_pnr_saionji_kinmochi$也看到了这篇报道，延续十年内阁这种梦想如今还是不要追求了，当务之急是再延续十天内阁才是。[JAP.GetLeader]像狮子一样咆哮着离开了办公室，寻找$JAP_pnr_inoue_junnosuke$的踪迹。"
  JAP_pnr_earlygame.19.a: "然后自由落体。"
  JAP_pnr_earlygame.20.t: "浮华世界"
  JAP_pnr_earlygame.20.desc: "东京丸之内，晚上六点一到，铜鼓、喇叭、低音提琴，凡是爵士乐用得上的便应有尽有地往室内送。马尼拉的乐手们是东京最炙手可热的商品，尤其是在“黑色星期一”之后价格较往常更便宜。与此同时一箱箱千疋屋的鲜果从侧门送进后厨，榨剩的果皮与残渣又从另一边运到——我也不知道去了哪里。据我所知，俱乐部的后厨里有从芝加哥电气制造公司处买来的电动榨汁机，只需要把切好的半只橙子往旋转的瓷锥上按个几百次就能轻松准备好许多“健康饮品”。我好像还没介绍我是怎么到这里的，简单来说和大家都差不多，是车子自动把我带到这里的。下车之后穿过我那些被小孩子缠上的年轻同僚——总归是卖些小铅笔，日用品以及别的什么奇异小玩意，他们只消三言两语，把大家创业初期的回忆勾起来就能赚得满载而归。\n\n穿过俱乐部的大门，由于没有镜子我也只能凭感觉纠正一下领结。然后你就可以看到那些说话似乎总是含着一口气，在这种场合坚持穿传统和服的一群老人和未老先衰的年轻人。他们的大王是那个造了22辆“A型车”，结果自己依然开意大利飞雅特轿车的家伙。而我们这些还没编好“祖训”的晚辈后生们的国王似乎还没出场。等到那辆达特桑十四型稳稳地停在日本工业俱乐部会馆门前，这位新世界的君主便走下汽车，会馆楼顶的灯光照亮了那对拿线轴和铁锤的裸体男女，也在他面前的台阶上撇下了一道阴影。\n\n不错，我确实认识他。他是工业俱乐部里的那些穿和服的人眼中的瘟神，也是酷爱洋服的大家最喜爱的人。他是我们这些人的首领，$JAP_pnr_aikawa_yoshisuke$，那个利用“不齿手段”，把企业卖给所有人而不是留在家族里的家伙。"
  JAP_pnr_earlygame.20.a: "桌上再放下一枚桂马。"
  JAP_pnr_earlygame.21.t: "雀刺（Suzumezashi）"
  JAP_pnr_earlygame.21.desc: "他坐在那里一脸紧张，身上穿着的藏青色立领冬装，以及袖口的那条山形纹和圆环让所有看到他的人都能意识到此人是个海军少尉，还是个预备役的。那他出现在这里就更奇怪了，因为这里是三宅坂的陆军省调查班，而军令部在霞关，此人总不能是坐路面电车坐过站了吧。田中清听到这个消息时心中疑惑，而推开门看到他时则彻底陷入了混乱，这要比他第一次去参见“圣师”时还要混乱。但事已至此，还是要请他到应接室里聊一聊。\n\n没想到的是，田中清还没发话，这位年轻海军军官先张口了：“田中少佐，以我之见，我国必须上下团结一致，秉承着'一君万民'的大精神开拓国运，你认为这话如何呢？”小兔崽子怎么和荒木还有真崎带出来的人一个样子，不过田中清还在为这位海上皇道派准备茶水，所以就糊弄性地点了点头。“确实不错，也正是如此。”“最近的大萧条，经济的困境，以及在这种困境下政党和财阀勾结起来的腐败实在令人目不忍视。要是这样持续下去，就根本实现不了什么国运的伸张。必须要对国家进行革新，你怎么想？”\n\n不，完全是穿藏青制服的皇道派吧，所以田中清也切换成了合适的模式，他把茶水放在年轻人面前，自己则坐到了他身旁：“依我之见，若不是真正心怀牺牲小我的精神的人，比如像军人这样的，是不能完成国家革新的。我想革新一定是需要舍命的勇气，那样的话一定是军人最为合适。”讲到这里，对方一下子变得更激动，眼泪也从眼角里挤出来了：“陆军是否也有施行断然的革新的信心？陆军中央部，永田军务局长是否也支持？在军务局没人接待我，是桥本大佐推荐我来拜访你的，因为他告诉我你们都是统——”\n\n“中央部把当前的政治腐败看在眼里，也并不是对国家革新漠不关心。其实中央部对此也抱有极大的热忱。至于具体方法目前正在锐意研究中。关于这一点，还请你信任我们。说起来，你叫什么名字，我还不清楚。”“真的失礼，我是黑岩勇。既然陆军中央部也有这样的决心，我甘愿舍命作铺路石，效犬马之劳。”“好，黑岩少尉，虽然你是海军我是陆军，但是我理解你这样的年轻军官，心中怀着炽热的爱国之情，我们一定不会辜负这份感情，中央部也绝不会对目前的时局无动于衷。”\n\n等到那个看起来只是海军版的皇道派军官欣喜地抽着鼻子告辞离去之后，田中清抓起了电话，他本来想打给东京那家料亭，让那个花天酒地的快乐“革命家”不要再随意散播他的名字和地址，但现在有更重要的联络要做。"
  JAP_pnr_earlygame.21.a: "永田少将，我想大事不妙了。"
  JAP_pnr_earlygame.22.t: "回心转意"
  JAP_pnr_earlygame.22.desc: "赤坂区灵南坂，距离[JAP.GetAdjective]的政治心脏不过只需步行十余分钟，正是因为如此便利的位置，才令无数高级政要，财阀总裁以及高端料亭都扎根于此。而在土地价格对大多数平民来说难以想象的地段，面前这座别墅可谓称得上是阔气——拥有该别墅的人想必是某位不得了的财阀统帅，又或者是某位掌握着大量财富，在帝国议会中呼风唤雨的政治家吧。然而如此显赫的神秘人却过着极为低调的生活，鲜少有人拜访这户人家，从这一点上称其为灵南坂的“深井”也并不过分。\n\n与从建筑之外感受到的冷清不同，屋内的大家已经就某项事务展开了讨论。不错，这里就是“影子将军”头山满在灵南坂的一处房产，20年前中华民国的孙中山正是在此于宋庆龄的帮助下建立了中华革命党，并策划了一系列对抗袁世凯的起义。而如今另一场迫在眉睫的革新行动，一场属于[JAP.GetName]自己的行动也将在这里开始。\n\n聚集在别墅中的为首之人乃是著名的职业革命家$JAP_pnr_okawa_shumei$，坐在他身旁的是陆军大尉大蔵荣一和海军中尉古贺清志，以及还有其它十一名陆海军出身的军官。自然还有将这里借给他们议事的慷慨主人的儿子，头山秀三，然而他并不参与计划细节的讨论。关于这场国家革新的目标和人员分组都已确定下来，$JAP_pnr_okawa_shumei$也转告他们会有不少农民加入行动，然而现在最重要的是说服其中一名成员——黑岩勇。\n\n看起来黑岩是遭到那些大人物的欺骗了，自从他之前从陆军省回来便对这项谋划许久的革新行动显得有些迟疑。“黑岩少尉，”$JAP_pnr_okawa_shumei$走到他背后，把手放在他肩上，“我已经和你说过了，难道你看不见现在的问题吗？政府所谓“十年的恢复”在‘黑色星期一’面前原形毕露，赤色分子在阴影中的蠢动，农民和手工业者在街边恸哭，而掌握大企业的家族和政客勾结起来拼命吮吸日本民众的血汗，现在正是要下定决心的时刻。”“不要再迷惑于谎言了！为了改变国家，现在就行动吧！”他重重地捏了一下肩。“但是田中少佐和我说了，他说中央部也在关心。我想如果擅自行动，不是反而会对不起他们的努力吗？”\n\n听到这话，$JAP_pnr_okawa_shumei$发出嗤笑：“官僚的话怎么能信？”"
  JAP_pnr_earlygame.22.a: "请少尉走出去看看[GetMonth]的街道，还有什么好研究的？"
  JAP_pnr_earlygame.23.t: "浪人的仁义"
  JAP_pnr_earlygame.23.desc: "“回去了吗？”等到头山秀三把内里的门拉开之后，坐在昏暗内间中的影子将军本人终于开了口，“杀掉前首相和现首相，然后攻击政党总部，银行，警视厅，变电站，$JAP_pnr_okawa_shumei$是个口才不错的演说家，能让十几个人相信自己能做成这么多事情，对这些年轻人来说是个可怕的人物。你给了他们多少东西呢？”\n\n“黑岩先生是预备役，所以他没有手枪。我所提供的，归根结底只有一枪一弹。”\n\n“将军”本人则走到桌边，那里放着这些青年军官拜访时带来的伴手礼。他拾起那盒捆扎好的，浅草下町的舟和本店出品的芋羊羹——不愧是一群青年，真亏他们敢提着这东西来拜访——然后把余剩的那些盒子全都扫到了地上去。备好笔墨，把关键内容稳重地写在纸上后妥善地叠成极窄的一条，再解开草绳把这封“信件”夹进盒盖内侧的包装纸下面。对这些青年军官来说，他们受到的乃是作为义士的对待和与之相称的仁义，而这张纸则是他头山满对$JAP_pnr_inukai_tsuyoshi$的，独属于大陆浪人之间的仁义与准则。既然事情已经办妥了，他又照原样把芋羊羹的礼盒打包好，说是原样打包，但那个草绳还是能看出明显拆开过的痕迹。随后，这盒糕点便被交到了头山秀三的手中，而影子将军也对自己的儿子下达了下一项任务。"
  JAP_pnr_earlygame.23.a: "把这盒糕点送给$JAP_pnr_inukai_tsuyoshi$，请他尝尝萨摩芋的味道。"
  JAP_pnr_earlygame.24.t: "最后的参拜"
  JAP_pnr_earlygame.24.desc: "明治维新以来，无数爱国将士为天皇而献身。这些忠勇义士们按照神道教的法门皆作为护国英灵被合祀供奉在东京九段的神社之中。也正是因为他们舍弃自己而献身的忠义，这些死者才得以从人类的亡魂变化为不朽的神灵，成为太阳光辉的一部分与作为天照大神后裔的天皇同在。作为军人的黑岩勇一行人也是出于同样的理由才来到这里进行参拜，对他们自己来说，他们相信自己接下来要做的事情足够使他们在死后也同样被接纳为这些义士的一员，永远守护天皇陛下和[JAP.GetAdjective]的国土，为旭日再增添一分光辉。\n\n等到黑岩勇等人行礼默祷完毕，从拜殿出来时已是下午五点，而接下来就是正式行动的时刻。几人此次参拜神社固然坚定了他们行动的信心，但也又一次引发了不安和迟疑。在等出租车时，首先发话动摇军心的是陆军中尉篠原市之助，先前的会议上他就是个踌躇的家伙：“我听说犬养前首相是大陆浪人出身对吧，我们真能压制住他吗？”这股退缩的颓废气息很快又一次爬上了黑岩勇的身子，听到篠原这么讲，他也又想到了田中先前给他的承诺，直到山岸宏的那声叱责打断了这种侵蚀。\n\n“事到如今还说这些做什么，你如果不想干，就该早点退出！”随后山岸又把头扭向了在一旁的三上卓，“比起腻腻歪歪地在原地推辞，还是想一想我们要怎么办。那群家伙现在也还不来，我们几个怎么按计划斩除许多国贼！要我说，今天就先杀$JAP_pnr_inukai_tsuyoshi$和[JAP.GetLeader]。三上觉得呢？”“我认为可以——”“犬养前首相虽然现在是平民，但我们真的能干掉他吗？”\n\n“如果你害怕，”山岸一把将篠原拽了过来，“就不要迟疑，不要对话，直接开枪杀了他。三上，到底怎么说！”\n\n篠原被吓得身体微微抽动，无论如何，三上卓终于可以就这临时改变的计划提出自己的看法了。"
  JAP_pnr_earlygame.24.a: "大家一起去干掉$JAP_pnr_inukai_tsuyoshi$。"
  JAP_pnr_earlygame.25.t: "扣扳机者"
  JAP_pnr_earlygame.25.desc: "我记得等我们到$JAP_pnr_inukai_tsuyoshi$家门口的时候已经是下午五点三十了，我们说是萱野长知先生介绍我们来的，想和$JAP_pnr_inukai_tsuyoshi$聊聊。等我们进到院子里的时候首先遇到的是一位医生，现在想来那人就应该是大野。我们询问他是否知道前首相在哪里，他告诉我们他也是刚刚前来拜访。这个时候黑岩因为紧张开枪打了他，虽然没有击中，但是他立刻就逃跑了。我想这下坏了，于是让大家冲进屋子里面分头挨个搜查。最后是黑岩和我在最里面的房间里找到了$JAP_pnr_inukai_tsuyoshi$，黑岩一看到他就扣动了扳机，但是他枪里只装了一发子弹，还因为前面紧张用掉了。\n\n至于$JAP_pnr_inukai_tsuyoshi$就像是知道我们会来一样地坐在那张简陋的餐桌后面，托着烟草盆在那里抽烟，既不畏惧我们手里的枪，也对我们的命令不屑一顾。房间里当时除了$JAP_pnr_inukai_tsuyoshi$之外还有一个女人和一个小孩子，已经完全因为现状呆立在原地了。这个时候前首相大声呼喝让女人和孩子离开，我也说不会伤害他们，让他们快些离开。那个时候我们真的被震慑住了，因为黑岩的枪里没子弹，我就让他去叫其他人过来。\n\n随后$JAP_pnr_inukai_tsuyoshi$对我示意让我跟他走，我举着枪，他举着烟草盆，我们一起去了北边一间更宽敞的客间。后藤和八木两个人随后就赶到了，他一边取出卷好的香烟递给我们，一边问我们为什么不脱下鞋子坐下，表现得依旧很镇定，现在想来不过是在拖延时间罢了。“你知道我们为什么来，如果想说什么就立刻说！”我说了这样的话，就在$JAP_pnr_inukai_tsuyoshi$向前倾身要说什么的时候，山岸大尉冲了过来，看到我们正在交流就高喊“不要对话，开枪！”然后就有人从山岸背后开枪打中了$JAP_pnr_inukai_tsuyoshi$的额头，现在想来是篠原中尉做的吧，他收到了这样的命令。看到行动成功，我们就立刻离开了，没有进一步确认。"
  JAP_pnr_earlygame.25.a: "玉锦倒下！双叶山寄倒横纲——时代终结！"
  JAP_pnr_earlygame.26.t: "《国家保安法》"
  JAP_pnr_earlygame.26.desc_a: "$JAP_pnr_inukai_tsuyoshi$之死震动了帝国议会与社会舆论。这些杀死前首相的海军和陆军士官虽然表明自己没有受到任何极端思想的影响，但没什么能骗过司法省的调查。平沼骐一郎的得意门生，司法省的盐野季彦通过深度调查暴露出了掩藏在重重迷雾下的真相——日本共产党，调查显示他们的家中有《赤旗》和《黑色青年》等赤色非法刊物。回顾他们的证词，确实有一些人表明是为了“农民与劳动大众”打倒“大财阀”，相信这些人正是遭到了赤化才犯下此等暴行，面对这等丑闻，陆军教育总监部与海军省教育局难辞其咎，对两军的内部调查也将很快开展。\n\n当下[JAP.GetName]所面对的经济与社会困境，以及盘旋在国家上空的红色恐慌的幽灵都使人想到了1923年关东大地震后的那段时光，虽然当时远比现在令人感到绝望，但大家确实不再想面对一次类似当年的关东无政府主义者起义了。1924年初，执政的田中内阁借此通过了臭名昭著的《治安维持法》。该法案极大地限制了民权，是田中义一大将独裁统治的象征之一。1926年田中政权垮台之后，《治安维持法》随即被废除了。\n\n在如今的特殊社会状况下，推进一部类似于《治安维持法》的法律来控制现状似乎变得十分有必要，[JAP.GetLeader]与其内阁最近透露了类似的计划。在处理“黑色星期一”的经济问题上取得了不甚出色的成果之后，[JAP.GetRulingParty]寄希望于通过推行一部名为《国家保安法》的，经过调整的更温和版本的法案来做出一些值得称道的政绩。政府宣称该法律将加强对社会不安定分子的控制，并且捍卫我国摇摇欲坠的民本主义（不损害天皇主权的前提下的民主主义）政治。目前[JAP.GetLeader]正在私下与各党派总裁进行交流，但并不是所有人都支持这部法律中目前的条款，可以见得的是在即将召开的帝国议会临时会议上，就这部法律的草案内容会产生不小的争议……"
  JAP_pnr_earlygame.26.a: "我们会进行协商，而该法案会解决“一切”问题。"
  JAP_pnr_earlygame.27.t: "挥杆"
  JAP_pnr_earlygame.27.desc: "他站在球前摆好了姿势，望着地平线那一头——就像自己一贯做的那样。然后启杆后摆，扬起一道衬得上自己地位的迅疾弧线。那颗球“啪！”的一声便直直地飞向蔚蓝色的天空，精准地射向了它该去的位置。“好球！真是好球啊陛下，四杆洞的信天翁球！这可十分罕见，是难得的好运气！”$JAP_pnr_fumimaro_konoe$看到站在果岭附近的侍从挥舞着帽子，便立刻对天皇陛下拍手称好，既然来当自己球童的近卫公爵都这样说了，那就大概真的是一颗信天翁吧。\n\n他和$JAP_pnr_fumimaro_konoe$说话的同时把球杆递了过去：“‘诗人如那云霄中的王子，在暴雨之中笑看弓手。’然而在我国，信天翁则是愚蠢的象征，面对猎人从不逃离，总是轻易地被捕捉。最近有什么有意思的事情吗？”“陛下既然这么问，最近贵族院里聊得最多的便是$JAP_pnr_inukai_tsuyoshi$和《国家保安法》，关于第一点我有听到风声，似乎陆军那边很早就知道暗杀计划了。”$JAP_pnr_fumimaro_konoe$伸手去接那根球杆，用预先准备好的湿毛巾把杆面和沟槽擦拭了一遍，“关于第二点，有人和我说平沼男爵出了很大力，‘指鹿为马’，大概是这个意思。”\n\n“平沼的话看报纸就能知道，共产党怎么可能突然就变得这么活跃。平沼其人贪恋权位，为此不择手段。至于$JAP_pnr_inukai_tsuyoshi$，发生这种事我也很痛心，可以借机敲打一下陆军那边吗？近卫觉得继续示意永田去办如何？”$JAP_pnr_fumimaro_konoe$一边点头，一边从背包里又掏出来了毛刷，把泥沙从线沟里擦出来：“陛下如果觉得可以，我当然乐意效劳。还有一件事让我感到很不安，最近陆军里有了很奇怪的流言，是关于陛下您的。”既然清理完毕，他便把球杆还了回去。“关于我的？怎么说？”“似乎是从近卫师团那里传出来的，说在深夜看到您屋里亮灯，本以为您在勤于政务，结果凑近一看，发现您同香淳皇后在打麻将。”\n\n整个高尔夫球场的气氛都发生了微妙的改变，在短暂的沉默之后，他给出了自己对流言的澄清："
  JAP_pnr_earlygame.27.a: "“……我根本不会打麻将，我只打桥牌。”"
  JAP_pnr_earlygame.28.t: "离心力"
  JAP_pnr_earlygame.28.desc: "并非党内所有人都与[JAP.GetLeader]站在同一战线上。今天稍早些时候，《国家保安法》的泄露草案被“新闻界的无冕帝王”大宅壮一发布在《时局新闻》（Jikyoku Shinbun）上，在东京引发了不小的震动。长期作为小报（Koshimbun，使用通俗语言面向城市工人阶级和普通大众的通俗报纸）的《时局新闻》很快就销售一空，与[JAP.GetRulingParty]向那些大媒体透露的内容不同，《国家保安法》并非是一部温和的法案，《治安维持法》中大量关于审讯和无限扩张适用对象的法条在泄露的《国家保安法》草案中依旧存在。政府目前已强令《时局新闻》进行禁止发行，但这次泄露已在社会上形成了不小的波澜。许多社会活动家开始攻击政府不过是改头换面的田中义一内阁，是同样借助危机肆意扩大自身权力的独裁政权。他们呼吁民众团结起来反对政府，并向天皇陛下请愿立刻罢免[JAP.GetLeader]。党内一些中高层成员为了顺应民意，也开始公开讲些见风使舵的话。\n\n大宅壮一是潜在的危险分子，作为东京帝国大学“新人会”出身的报业老板，此人对社会主义抱持着一种近乎狂热的态度，这一点从他两个儿子的名字：礼人（Leijin,弗拉基米尔·列宁）和丸人（Marujin，卡尔·马克思）便能一窥。现在的问题在于是哪个叛徒把这一切泄露给了这个共匪，以及这到底是最无聊的“无私义举”还是[JAP.GetRulingParty]的高层为了扯[JAP.GetLeader]的后腿而策划的阴谋。不论如何，这侧面展示出社会并不欢迎《国家保安法》，而在和其它在野党就该法案进行事前交涉的时候，[JAP.GetLeader]必然会处于被动位置。"
  JAP_pnr_earlygame.28.a: "等法案通过就把大宅壮一抓起来。"
  JAP_pnr_earlygame.28.b: "比起间谍，先把那些党内投机分子开除。"
  JAP_pnr_earlygame.29.t: "解散国会的提议"
  JAP_pnr_earlygame.29.desc: "为了让保安法通过有人希望能够先解散众议院重新大选。"
  JAP_pnr_earlygame.29.a: "绝不可在此狂热时刻解散国会！"
  JAP_pnr_earlygame.30.t: "《国家保安法》的命运"
  JAP_pnr_earlygame.30.desc: "《国家保安法》的命运"
  JAP_pnr_earlygame.30.a: "毫无疑问，《国家保安法》终获通过！"
  JAP_pnr_earlygame.30.b: "借危机夺取民权的《国家保安法》流产了！"
  JAP_pnr_earlygame.31.t: "《国家保安法》通过，解散议会大选"
  JAP_pnr_earlygame.31.desc: "在内阁领导下国家保安法终于通过。作为回应，左右派联合起来弹劾了内阁，认为任期内发生严重的黑色星期一问题和五一五事件是政府的耻辱。执政党决定借此机会解散议会重新大选，同时运用国家保安法来结束悬浮议会，彻底将其它党派驱逐出去。"
  JAP_pnr_earlygame.31.a: "看来他们信心满满。"
  JAP_pnr_earlygame.32.t: "《国家保安法》失败，解散议会大选"
  JAP_pnr_earlygame.32.desc: "内阁的执政已陷入彻底失败，保安法、黑色星期一和五一五事件都摧毁了他们的合法性。但他们依然不愿意离开，决定孤注一掷解散议会。"
  JAP_pnr_earlygame.32.a: "如果早点解散众议院可能不会变成现在这样。"
  JAP_pnr_earlygame.33.t: "陆军策划政变"
  JAP_pnr_earlygame.33.desc: "一部分陆军已经无法忍受政党政治和选举了，他们也决定响应海军藤井齐的想法，也发动政变来夺取政权。他们计划在选举结束之后，元老拜谒天皇之前发动政变夺取权力。"
  JAP_pnr_earlygame.33.a: "战术很困难，但政治很简单。"
  JAP_pnr_earlygame.33.b: "这是最薄弱的时刻，在这时候进攻。"
  JAP_pnr_earlygame.34.t: "尊皇讨奸"
  JAP_pnr_earlygame.34.desc: "选举已经结束，同天夜里陆军准备出发政变。"
  JAP_pnr_earlygame.34.a: "将我等赤红的忠心献于首领。"
  JAP_pnr_earlygame.34.b: "各位听着，陛下已经对我们的事业表达了支持！"
  JAP_pnr_earlygame.35.t: "清君侧（伪路线）"
  JAP_pnr_earlygame.35.desc: "枪毙了大多数宫中重臣"
  JAP_pnr_earlygame.35.a: "奏怆歌闻震天动地，拨乱云见白日苍空。"
  JAP_pnr_earlygame.36.t: "二二六政变失败（伪路线）"
  JAP_pnr_earlygame.36.desc: "123"
  JAP_pnr_earlygame.36.a: "奸贼！我只恨没能悉数杀尽你们！"
  JAP_pnr_earlygame.38.t: "君侧未清（真路线）"
  JAP_pnr_earlygame.38.desc: "由于暗杀小队数量不足，部分人逃跑了。"
  JAP_pnr_earlygame.38.a: "可恨！可耻！"
  JAP_pnr_earlygame.37.t: "义军会议（真路线）"
  JAP_pnr_earlygame.37.desc: "皇道派军官们正在策划如何清君侧。"
  JAP_pnr_earlygame.37.a: "以诛杀国贼为重。（转入伪路线35号事件）"
  JAP_pnr_earlygame.37.b: "集结一半兵力，不，七成兵力保护皇居。"
  JAP_pnr_earlygame.39.t: "攻占皇居（真路线）"
  JAP_pnr_earlygame.39.desc: "皇道派约700人控制住了皇居，本庄繁见局势如此，告知了裕仁的位置。"
  JAP_pnr_earlygame.39.a: "通知陆军省和参谋本部，我们已确保陛下安全。"
  JAP_pnr_earlygame.40.t: "告全体臣民书"
  JAP_pnr_earlygame.40.desc: "第二天早上新闻管制。"
  JAP_pnr_earlygame.40.a: "奉天皇敕命，东京进入戒严状态。"
  JAP_pnr_earlygame.41.t: "阴谋被挫败"
  JAP_pnr_earlygame.41.desc: "统制派策划了一起反政变，但未起到效果。"
  JAP_pnr_earlygame.41.a: "陆军已经彻底瘫痪，他们最好现在就为天皇切腹。"
  JAP_pnr_earlygame.42.t: "我有一份小名单"
  JAP_pnr_earlygame.42.desc: "我有一份小名单"
  JAP_pnr_earlygame.42.a: "这里还有一些空位——填你喜欢的名字。"
  JAP_pnr_earlygame.43.t: "你知道吗？"
  JAP_pnr_earlygame.43.desc: "其实大正是被裕仁皇太子毒杀的。"
  JAP_pnr_earlygame.43.a: "父子相残真让人痛心。"
  JAP_pnr_earlygame.44.t: "年糕是国贼"
  JAP_pnr_earlygame.44.desc: "裕仁陛下在进食年糕之时不幸被噎死。无法说话、无法咳嗽、面色青紫、双手抓喉。在明仁陛下长大之前，秩父宫殿下已担起责任，短暂作为摄政。"
  JAP_pnr_earlygame.44.a: "呃……不幸的可怜人。"
  JAP_pnr_earlygame.45.t: "愤怒（裕仁亲政路线）"
  JAP_pnr_earlygame.45.desc: "裕仁听说自己的大臣被杀陷入了愤怒之中。"
  JAP_pnr_earlygame.45.a: "朕意已决。"
  JAP_pnr_earlygame.45.b: "既然如此，宣布他们为贼军。"
  JAP_pnr_earlygame.46.t: "天皇统帅"
  JAP_pnr_earlygame.46.desc: "123"
  JAP_pnr_earlygame.46.a: "合围贼军！"
  JAP_pnr_earlygame.47.t: "[SOM.GetName]暂停自我国进口商品"
  JAP_pnr_earlygame.47.desc: "坏消息又从另一头的非洲大陆传来，在[EGY.GetName]以“黑色星期一”为理由停止履行和我们之间的贸易协定之后，[SOM.GetName]也选择停止购买我们的轻工业产品。受到“黑色星期一效应”的影响，非洲之角最终失去了所有的外资企业与本就捉襟见肘的外汇储备。他们一直在强调自己并非“故意”，但他们最好亲自去和船上的那些产品去说。"
  JAP_pnr_earlygame.47.a: "我不想听。"
  JAP_pnr_earlygame.48.t: "我们失去了在[PHI.GetName]的市场"
  JAP_pnr_earlygame.48.desc: "尽管长期以来[PHI.GetName]都是[USA.GetName]忠实的自治邦，且美国商品在[PHI.GetName]还享有免税特权这种近乎“作弊”的经济优待，但在过去的日子里我国还是凭借价廉物美的商品稳稳位列[PHI.GetName]的第二大贸易伙伴的位置。在马尼拉和达沃等地，日本移民和日本公司共同建立了庞大的商业网络，一度垄断了菲律宾超过37%的零售贸易。我国商人能取得这些成就虽然有[USA.GetName]深陷大萧条的原因，当然也离不开他们自己的努力和奋斗。正是因为这样，今天发生的一切才让人心有不甘。仅仅是由于欧亚大陆另一端的柏林证券交易所出了问题，所连带产生的这场金融风暴却近乎摧毁了菲律宾的贸易收入。\n\n[PHI.GetAdjective]政府已经宣布将尽一切可能弥补贸易逆差，其中就包括对“威胁本国商业之外国垄断势力”加征更高额的关税。他们甚至要求重新检讨去年日美两国就我国棉布输菲问题的“绅士协定”（Gentlemen's Agreement），进一步压缩我国每年能向[PHI.GetName]出口棉布的总量。如今“小东京”达沃已经失去了往日的热闹，大规模农业和矿业开发都已被闲置，这一切只是因为那个星期一……"
  JAP_pnr_earlygame.48.a: "勤劳者又做错了什么？"
  JAP_pnr_earlygame.49.t: "失去十年的梦魇"
  JAP_pnr_earlygame.49.desc: "首先是2%，然后是12%，接着是11%。25%，25%，25%。这就是在过去一周内，道琼斯指数下跌的数值。四分之一的投资总额已经灰飞烟灭，消失在市场的深渊之中。柏林股市中投资者信心的崩溃为仍受大萧条困扰[USA.GetName]送去了另一份沉重的大礼。洛克菲勒家族尝试通过大量买入来拯救股市，但现实就是他们输了。悲观地讲，在可见的未来里，这种情况会一直持续下去，直到美国股市里的每一只股票都失去一切价值，投资者的信心将一直维持着破灭状态，毕竟对[USA.GetName]来说，未来根本没有什么希望可言。\n\n现在这种经济的苦闷也缠上[JAP.GetName]了，就像在过去几天里传到大藏省的数十件坏消息那样，大洋彼岸垂死的巨人这次“更加”死了。尽管[USA.GetName]此前受到大萧条困扰，但尚还有余力与我们进行贸易，我国始终是[USA.GetName]在国际上的第三大贸易伙伴，是和[IMP.GetName]不同的，“守信的”优质伙伴。我国一直从[USA.GetName]处购买原油，回收金属以及一系列机械设备，而向其输出生丝与其他商品。但如今这些东西都得不到了，既有美国制造业的问题，也有我们自己的问题：我们的外汇储备经紧急重编之后已经无力再担负先前那种规模的贸易。那个本来已经近乎被封印的恶鬼从阎罗地狱中又爬出来了，它燃烧的爪子抓住了[JAP.GetName]，要把她也一同带到下面去。"
  JAP_pnr_earlygame.49.a: "放开我的脚……"
  JAP_pnr_earlygame.50.t: "黑色星期一的微澜"
  JAP_pnr_earlygame.50.desc: "在2月初，德国经济市场经历了一场和我们在1920年情况极为相似的，被称为“黑色星期一”的世纪大崩盘。东京交易指数在得到该消息后立刻下跌了7%，不过当天就强势修复了6.7%，走出了一波漂亮的深V走势。大藏省认为这是由于夜间利空发酵导致的恐慌盘洗净，随后的强势修复证明市场仍对危机抱持乐观态度。\n\n得益于德国市场长期以来对我们的排挤，日本经济在德国主导的世界贸易体系中只位于边缘位置，这场经济危机的余波跨越大洋来到我们的岸边时已经变得温和可亲，甚至还不如东京湾中最小的浪头。虽然国内经济没有受到什么影响，但那些在国外有所投资的财阀与个体投资者想必是大出血了。总的来说“黑色星期一”目前看来对我国经济影响有限，仅仅是在社会上引起了些微骚乱，相信时间可以修复这份恐慌。"
  JAP_pnr_earlygame.50.a: "风平浪不惊。"
  JAP_pnr_earlygame.52.t: "日本银行宣布暂停银行券兑换"
  JAP_pnr_earlygame.52.desc: "黑色星期一的影响已经蔓延到了帝国内地之外的疆域：[KOJ.GetName]和[TAI.GetName]的许多民众在恐慌中尝试将他们手中的朝鲜银行券和台湾银行券兑换成日元，在两地引发了挤兑。今晨，大藏省颁布了关于黑色星期一的紧急命令，日本银行、朝鲜银行和台湾银行随后联合发表声明，宣布将暂停四周当地银行券和日元之间的相互兑换，并将视情况延长兑换禁令。这意味着帝国经济圈的暂时解体。\n\n我国目前维持着一种奇妙而经过精心设计的经济模式，即在本土发行日元，而在两大总督府分别授权对应的特殊银行机构（即朝鲜银行和台湾银行）发行对应的特殊货币：朝鲜银行券和台湾银行券。这两种银行券在对应的总督府区域被视为法定货币流通，并且能通过银行兑换为等额的日元。然而东京始终掌握着“兑换权”，这意味着我们可以在经济情况恶化的时候通过暂停货币兑换来将经济危机锁死在各自的区域而不相互影响，形成更坏的后果——没人想再经历一次西南战争时期因为纸币滥发而导致货币暴跌的危机了——但现在的暂停兑换只是把装着炸弹的盒子盖上，然后装作那里没有炸弹，寄希望于盒子里面有什么东西能够剪断引线。现在我们只能祈祷[KOJ.GetLeader]和[TAI.GetLeader]两位总督能够凭借自己的智慧渡过这次危机，届时我们便能重启日元经济圈。"
  JAP_pnr_earlygame.52.a: "没什么好怕的！"
  JAP_pnr_earlygame.53.t: "片目的伟人"
  JAP_pnr_earlygame.53.desc: "那时，大国常立尊就这样在我面前显现了，他的身体是多么神圣庄严而不可侵犯，崇高且伟大的形象充满了整个世界。随着他的显现，在我的异象之中首先生成了无穷无尽的日月星辰，在他手覆盖的地方立刻生成了巍峨的高山和茂盛的草木。我被国祖的显现而震慑，伏拜在他面前不敢抬头。他从口中吹出气来，那气立刻变作了风，又变成十二位男女天使来到我身边，其中六位将我搀扶起来，另六位则手持卷轴围绕在我身边。\n\n“神须佐能袁命为何如此惊慌，”那为首的天使张开巨大的白色双翼，他的翅膀下松、竹、梅便开始生长，“不要忧愁，不要恐慌，凡有肉的见到我们都要被焚尽，直至虚假熔化，以彻底的纯净站立在国土之上。王仁三郎，你请听吧，打开你的耳朵，因为我就要宣布这灵界的奥秘了。”\n\n随着他的宣告，天上传来汇报讯息的铜钟响声，诸天使都齐声唱赞，“荣耀兮！荣耀兮！你当细听，你当谨记！因为这奥秘是可憎的，因为这奥秘是至福的，它曾在旧时写在无页的纸上，经天神的手出示给人类的始祖，而他看了便忧愁！哀哉！哀哉！有大祸了！”先前生长的松树裂开了，从中出现一个身披紫色斗篷，赤裸全身的男子，他左手持宝剑，右手拿着天平。那生长的梅花缠上了他的双腿，那生长的竹子刺穿了他的右眼。\n\n“圣哉！凡有一只眼的有福了，凡有一只眼的要留心了！小松林命啊，博学多智的人能解开这谜题？谁能解开？谁能解开？谁能解开？你能解开这谜题。你必解开这谜题。其中隐藏着重大的奥秘，到东京去吧，因为声音和景象就到此为止了。”"
  JAP_pnr_earlygame.53.a: "然后出口王仁三郎从梦中惊醒。"
  JAP_pnr_earlygame.54.t: "“圣师”突袭东京！"
  JAP_pnr_earlygame.54.desc: "如今的东京沉浸在压抑而紧张的氛围之中，《国家保安法》草案的泄漏为$JAP_pnr_inukai_tsuyoshi$遇刺后的东京政局又增添了一丝前途未卜的气息。值此特殊时刻$JAP_pnr_onisaburo$造访东京无疑是给各大报纸投下了一颗重磅炸弹，大家都想知道“圣师”如何看待《国家保安法》。尽管在大多数主流报纸中$JAP_pnr_onisaburo$一直被称为“有趣的媒体人士”（精神病患者的一种委婉说法），但昭和神圣会和“大本教”毕竟可以说是现在最具组织性，也是全国最大的右翼民族主义团体。\n\n就像以往那样，这位“圣师”总是会在出现的时候同时创造更多话题，他此次并非独自现身，而是带上了柳原前光伯爵之女，大正天皇的表妹，“筑紫女王”柳原烨子。二人一同现身于东京时简直就像是在向宫内省挑衅，而宫内省对他们行为的沉默则再一次激起了民间小报对那件“大不敬”传闻的揣测——$JAP_pnr_onisaburo$对《国家保安法》并未表现出太多兴趣，只是表示相信帝国议会能够代表民意，对该法案作出极为公正的裁断。看起来这位宗教领袖并不愿意被卷入这场政治斗争之中，但如果他不是为了特意到东京露脸，对《国家保安法》发表看法的话，那他这时候来东京的理由到底是什么？"
  JAP_pnr_earlygame.54.a: "至少没给我们添乱。"
  JAP_pnr_earlygame.55.t: "交谈之后"
  JAP_pnr_earlygame.55.desc: "说到东京中有名的“独眼龙”，那想必就只有不甘寂寞的$JAP_okawa_shumei$和神龙见首不见尾的北一辉了。大川周明的眼睛因罹患一期梅毒性白浊而遭到了损伤；而北一辉的右眼则是一颗义眼，他在小时候被路边的树枝刺伤了那颗眼球。简单来说，候选人物看起来有两位，$JAP_pnr_onisaburo$决定分别都见一见。\n\n和$JAP_okawa_shumei$的见面是在九段的军人会馆，此前他已听闻$JAP_okawa_shumei$在佐官之中颇有人气，在军人会馆之中被捧为座上宾也是情理之中。然而和$JAP_okawa_shumei$的对话却令$JAP_pnr_onisaburo$感到意外：眼前这个男人和自己从基督教聊到了马克思主义，最后又谈到对日本国民精神的鄙夷——他似乎是认为如今的[JAP.GetName]不过是个颠倒一切，妖魔横行的地狱罢了。当$JAP_pnr_onisaburo$问他要如何从这地狱中脱离的时候，$JAP_okawa_shumei$则说要靠“永恒发展的太阳生命”。总的来说是个非常有趣的人。\n\n不过很快$JAP_pnr_onisaburo$就在筑地治作这家高级料亭见到了另一位令他惊叹的人——北一辉在包间里左拥右抱着两个女人和他神情自若地交谈，与充满诗性的$JAP_okawa_shumei$不同，这个独眼革命家似乎始终在讲述某种可以直接实践的危险行动。期间有两位年轻军官前来拜会北一辉，在看到$JAP_pnr_onisaburo$之后便要他这个巫师施法立刻下雨，给今晚的会面增添一点雅趣。面对这等无礼的挑衅，$JAP_pnr_onisaburo$本来一笑置之，可北一辉却突然对着两人大吼道：“不许对大本的人无礼！”随后要求二人立刻道歉。\n\n如今交谈已经结束，两人之中只有一位是神谕指向的对象，又或者说，$JAP_pnr_onisaburo$按了一下自己的帽子，其实这既不是单选，也不是多选题？\n\n“你必解开这谜题。”小松林命在他身边重复了一遍。"
  JAP_pnr_earlygame.55.a: "北一辉正是预言之人。"
  JAP_pnr_earlygame.55.a_tt: "§S“圣师”坚定了他所得到的神谕，他向北一辉伸出援手。§!\n§0即便其在当下虚弱无力，昭和神圣会与其的合作也能力挽狂澜。§!"
  JAP_pnr_earlygame.55.b: "大川周明才是那位紫衣之王。"
  JAP_pnr_earlygame.55.b_tt: "§o“圣师”坚定了他所得到的神谕，他向大川周明伸出援手。§!\n§0即便其在当下虚弱无力，昭和神圣会与其的合作也能力挽狂澜。§!"
  JAP_pnr_earlygame.55.c: "或许谜题尚未揭示，二人都不是答案。"
  JAP_pnr_earlygame.55.c_tt: "§n“圣师”仍在寻找神谕的答案。§!"
  JAP_pnr_earlygame.56.t: "久疏问候"
  JAP_pnr_earlygame.56.desc: "试图以所谓“赤色势力”的猖獗来推行旧法律的复活，不过是当前内阁与地方报人可耻的利益交换，为了使《国家保安法》顺利通过，内阁和地方新闻业者在幕后进行着这样的丑陋交易。内阁私下里和秋田县的安藤和风达成协议，以其人脉在各家报纸搬弄是非，将了无关系的工人的愤怒说成是共产党的阴谋，借此来在国民之中制造恐慌。\n\n在安藤这样的无良报人这样做了之后，他们立刻得到了诸如羽越本线改良这样的地方利益。内阁以此表彰他们作为政府奴隶的忠心。\n\n真是令人不齿且震惊！本应作为国民的眼睛和嘴巴，看到所有不公正和说出所有不公正的报业记者，竟和政府串通一气来愚弄国民，真是岂有此理！原先圣洁的帝国议会，正是因为像这样污浊不堪的小人混入其中，把立法权用得彻底脏污，损害了天皇陛下的神圣威严而变得堕落！今日这等丑闻的发生，岂不是又证明了议会关闭的正当性！唉，这帝国议会本是广纳民意的场所，怎能成为无良党人瓜分利益的乐园。有勇气的国民只要刺死他们，揭开面纱，便能发现内里不过是古老的藩阀。天下竟有此等不公正之事，真是奇观啊。国民们！请务必审视这一肆意践踏立法权，愚弄你们的荒唐现实！\n\n\n\n立刻给宇田川町送来八千日元，你知道位置。不然我想这篇文书散播出去，社会就会很躁动。北一辉敬上。"
  JAP_pnr_earlygame.56.a: "怎么又来敲竹杠。"
  JAP_pnr_earlygame.56.b: "我们……有的是！你还可以再添一个女仆！"
  JAP_pnr_earlygame.56.c: "我们一分钱都没有！"
  JAP_pnr_earlygame.56.c_tt: "§R北一辉不过是一个写文章敲诈当权者的日莲宗狂徒，但在这个时候，我们不满足他的要求真的是个好选择吗？§!"
  JAP_pnr_earlygame.57.t: "我要最便宜的"
  JAP_pnr_earlygame.57.desc: "先前不是说，我被人介绍去银座交询社当差了吗，虽说那些厉害人物都在包间里，但是外面散座也有不少不得了的人物。结果啊那一天，有个家伙别着议员胸针，散发着乡巴佬的气息。说是这样，我还是立刻带着酒单迎上去问他是否需要点什么，顺道“无意地”用手指捏着波特酒的位置，没想到他完全不吃我的暗示，看也不看就直接对我说：“我要最便宜的！”那家伙毫不留情地这样说！所以我只好给他备了根本没人点的柠檬水。这种寒酸鬼是交询社的会员，简直不可思议。\n\n风见章捏着那杯7钱的柠檬水走到了那个留着卫生胡的男人身边：“风见！你看那个，马上要建好了——”见他走了过来，男人一把伸手搂住他，一边用那只抓着横滨鸡尾酒的手指着窗户另一头被灯光照亮的永田町，“国会议事堂我想很快就要启用了。终于不用在木屋子里呆着了。”风见章对欣赏权力象征不感兴趣：“先前同您谈的农村躁动的事，您有委婉地和陛下谈过吗？”“嗯——我听说新议事堂的中央塔有六十米高。”“先前同您谈的农村的事，您有和陛下谈过吗？”风见章又把问题重复一遍。\n\n“当然！我当然在打高尔夫的时候委婉地说了。宫中，陛下自然很关切，非常关切。”他眼睛向上看着天花板。“六十米，比这楼高多了，确实力压群雄啊。啊对，你要不要认识一下其他人，小泉信三今天也在。”\n\n他把那杯柠檬水放在台子上，迅速转换了话题：“这段时间我做了一点农村地区情况的调查，我想情况比估计的要糟。我准备借着这次临时会的机会来迫使政府把《小作法》和其它类似的东西确定下来。我可以提供资料，如果您能帮我游说一下的话。”"
  JAP_pnr_earlygame.57.a: "“不知道你有没有兴趣，近卫公爵。”"
  JAP_pnr_con.1.t: "“圣师”回到东京"
  JAP_pnr_con.1.desc: "在先前的“阅兵风波”过后，人称“圣师”的右翼宗教分子，昭和神圣会统管$JAP_pnr_onisaburo_common$又搞出来了一件大新闻。他和他的参谋长下位春吉于昨日下午经横滨返抵东京。约有六百名昭和神圣会会员身穿制服，持会旗列队前往横滨港迎接两人，此外他们还出动了三架“赤蜻蛉”，一度令民众以为是海外贵宾来访，这在港口引发了短暂的混乱。\n\n昭和神圣会可能是[JAP.GetName]最大的，组织性极高的右翼团体。“黑色星期一”发生后，昭和神圣会便突然宣布将在[JAP.GetName]举办巡回讲座，讨论在危机之中如何进行皇道宣扬、维持爱国团结与践行忧国精神。在于内地完成演讲之后，$JAP_pnr_onisaburo_common$首先前往[KOR.GetAdjective]汉城地区，在那里留下了几张照片，随后便一头扎入了朝鲜半岛以南的农村地区。\n\n等到他再次出现就是在三月十二日的台北，总督$TAI_pnr_nakagawa_kenzo$陪同昭和神圣会会员在台北铁道饭店举办了台北地区的演讲。在那里御田村龙吉首先就“台北之昭和维新”为主题发表了演讲，谈到[TAI.GetName]作为远离内地的土地，其臣民如何践行神武天皇的皇道伟大事业，并谈到了由昭和神圣会育种的爱善陆稻在台南地区的种植情况；随后是下位春吉以“非常时代的日本将去往何处”为主题作了演讲，鼓励与会者即便在“黑色星期一”的危机之下依然不要忘记昭和神圣会所提倡的“人类之爱善”，只要心中保留这一美德，并将全心全力都奉献给“天皇的事业”，那终将得到美好的结果。"
  JAP_pnr_con.1.a: "这种宗教武装都很危险……"
  JAP_pnr_con.2.t: "昭和青年会慰问农村"
  JAP_pnr_con.2.desc: "又是$JAP_pnr_onisaburo_common$！昭和神圣会旗下团体，准军事组织昭和青年会的一张照片占据了多家报纸的头版，一旁还配有挑衅性的新闻标题：“忧国组织的大行动，昭和神圣会向受灾农民提供大米与稻种”，画面中的青年团团员手持会旗正在将包装好的一捆捆大米捐献给北陆地区的农民们。\n\n根据昭和神圣会官方社团报纸《真如之光》上的详细报道，三位青年是来北方践行“皇道精神”的，这些米都来自爱善陆稻试作田。他们之所以来到这里是因为他们奉戴神敕与圣诏，为完成皇国使命，替“天皇陛下”分忧，弘扬“人类爱善”，建成喜乐无边的光明世界，他们来到农民们身边倾听并解决他们的烦恼，除了米袋之外，这些青年还带来了爱善陆稻的种子。在原报道的最后还提到了昭和神圣会即将在当地召开一场小规模演讲。\n\n但其他媒体的关注点可不在什么稻种与演讲会上。他们反而拿这张照片来抨击农林大臣办事不利。认为就连救济农村这样的事情最终却还是要让民间团体代劳。出于该原因，内阁在早晨为农林大臣拟好了一份特别讲话，具体内容为承诺将派出调查员去研究东京圈及更偏远地区的农业现状，此外农林大臣再一次强调，如果农民实在遭遇了经济难以周转的问题，可以通过当地产业组合申请特别特别融通，根据既有制度办理贷款，这是一项已经延续了很久的政策。"
  JAP_pnr_con.2.a: "贫穷通往混乱，施舍通往崇拜。"
  JAP_pnr_con.2.b: "又有谁在意工人们呢？"
  JAP_pnr_con.3.t: "独眼的伟人"
  JAP_pnr_con.3.desc: "123"
  JAP_pnr_con.3.a: "准备行动了"
  JAP_pnr_con.4.t: "两位候选人"
  JAP_pnr_con.4.desc: "123"
  JAP_pnr_con.4.a: "那么就请后藤文夫先生来吧。"
