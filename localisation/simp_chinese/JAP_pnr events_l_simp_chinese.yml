l_simp_chinese:
  JAP_pnr_normal.1.t: "日本共产党分裂"
  JAP_pnr_normal.1.desc: "袴田里见收到了日本共产党（多数派）因家屋事务局问题而宣布正式裂党的信件。"
  JAP_pnr_normal.1.a: "切断和这些热衷于破坏党的挑拨离间者的联系。"
  JAP_pnr_normal.1.b: "切断和自称中央委员会的流氓分子的联系。"
  JAP_pnr_normal.2.t: "犬养毅国会质询"
  JAP_pnr_normal.2.desc: "就米谷自治管理法案，国民健康保险法案，国民经济振兴法案，展开国会质询甚至引起动乱的结果是，天皇批准了解散众议院重新选举的决定，交由民众自己。"
  JAP_pnr_normal.2.a: "万岁！万岁！万万岁！（启动大选倒计时）"
  JAP_pnr_normal.3.t: "1936年日本众议院大选"
  JAP_pnr_normal.3.desc: "第一次大选，作为永久在野党的势力不要期望在这一次就直接掌握权力，应当步步为营，首先瓜分选票——现在的政治局势对政友会和民政党而言并非具有巨大优势，而宪政常道也并非如我们所想的那样坚不可摧。"
  JAP_pnr_normal.3.a: "为了农民和崭新的，科学的日本主义！（民粹主义者）"
  JAP_pnr_normal.3.a_tt: "我们将作为£occupation_costs §G$JAP_pnr_national_populist_party$§!参选\n\n£occupation_costs $JAP_pnr_social_conservative_party$将失去§R10§!个席位\n£occupation_costs $JAP_pnr_national_populist_party$将获得§Y5§!个席位\n£occupation_costs $JAP_pnr_authoritarian_democrat_party$将获得§Y2§!个席位\n£occupation_costs $JAP_pnr_social_democrat_party$将获得§Y1§!个席位\n£occupation_costs $JAP_pnr_market_liberal_party$将获得§Y2§!个席位"
  JAP_pnr_normal.3.b: "为了社会大多数的幸福，为了无产阶级工人和军队势力的联合！（社会大众党）"
  JAP_pnr_normal.3.b_tt: "我们将作为£occupation_costs $JAP_pnr_social_democrat_party$参选\n\n£occupation_costs $JAP_pnr_social_conservative_party$将失去§R10§!个席位\n£occupation_costs $JAP_pnr_social_democrat_party$将获得§Y4§!个席位\n£occupation_costs $JAP_pnr_social_liberal_party$将获得§Y4§!个席位\n£occupation_costs $JAP_pnr_national_populist_party$将获得§Y2§!个席位"
  JAP_pnr_normal.3.c: "唯有继续推行国家掌握的托拉斯和康采恩才能拯救日本！（国民同盟）"
  JAP_pnr_normal.3.c_tt: "我们将作为£occupation_costs $JAP_pnr_authoritarian_democrat_party$参选\n\n£occupation_costs $JAP_pnr_social_conservative_party$将失去§R10§!个席位\n£occupation_costs $JAP_pnr_authoritarian_democrat_party$将获得§Y5§!个席位\n£occupation_costs $JAP_pnr_social_liberal_party$将获得§Y3§!个席位\n£occupation_costs $JAP_pnr_market_liberal_party$将获得§Y2§!个席位"
  JAP_pnr_normal.3.d: "毫无疑问，作为国会第二大党的我们按政治惯性该取而代之了。（民政党）"
  JAP_pnr_normal.3.d_tt: "我们将作为£occupation_costs $JAP_pnr_market_liberal_party$参选\n\n£occupation_costs $JAP_pnr_social_conservative_party$将失去§R10§!个席位\n£occupation_costs $JAP_pnr_market_liberal_party$将获得§Y10§!个席位"
  JAP_pnr_normal.4.t: "1936年第一次选举结果"
  JAP_pnr_normal.4.desc: "第一次选举结果已出炉，查看议会界面\n\n解锁了新的国会决议"
  JAP_pnr_normal.4.a: "民主制度仍在运行的铁证！"
  JAP_pnr_normal.4.seiyukai_tt: "根据1936年选举结果，$JAP_pnr_social_conservative_party$将成为执政党"
  JAP_pnr_normal.4.national_populist_tt: "根据1936年选举结果，$JAP_pnr_national_populist_party$将成为执政党"
  JAP_pnr_normal.4.authoritarian_democrat_tt: "根据1936年选举结果，$JAP_pnr_authoritarian_democrat_party$将成为执政党"
  JAP_pnr_normal.4.social_democrat_tt: "根据1936年选举结果，$JAP_pnr_social_democrat_party$将成为执政党"
  JAP_pnr_normal.4.social_liberal_tt: "根据1936年选举结果，$JAP_pnr_social_liberal_party$将成为执政党"
  JAP_pnr_normal.4.market_liberal_tt: "根据1936年选举结果，$JAP_pnr_market_liberal_party$将成为执政党"
  JAP_pnr_normal.5.t: "国家社会主义研究所介绍"
  JAP_pnr_normal.5.desc: "赤卫的思想"
  JAP_pnr_normal.5.a: "日共元老掀起农民的旗帜！"
  JAP_pnr_normal.6.t: "社会大众党：两头猛虎"
  JAP_pnr_normal.6.desc: "社会大众党介绍"
  JAP_pnr_normal.6.a: "议会斗争和温和路线的典范。"
  JAP_pnr_normal.7.t: "立宪民政党：宪政常道的守卫"
  JAP_pnr_normal.7.desc: "城市新兴资产阶级利益。"
  JAP_pnr_normal.7.a: "擎炬火，向未来。"
  JAP_pnr_normal.8.t: "国民同盟：科学经济，科学指令"
  JAP_pnr_normal.8.desc: "国民同盟介绍"
  JAP_pnr_normal.8.a: "强有力的国家之手会解决所有问题。"
  JAP_pnr_normal.9.t: "政友会的金元攻势"
  JAP_pnr_normal.9.desc: "政友会开始大规模发动贿选。"
  JAP_pnr_normal.9.a: "这符合民主吗？"
  JAP_pnr_normal.10.t: "聚光灯之外：宫中"
  JAP_pnr_normal.10.desc: "裕仁和宫中大臣的对话，对最近贵族们的闲谈，近卫和雍仁"
  JAP_pnr_normal.10.a: "家家有本难念的经"
  JAP_pnr_normal.11.t: "聚光灯之外：台湾"
  JAP_pnr_normal.11.desc: "大本教昭和神圣会"
  JAP_pnr_normal.11.a: "邓南遮先生此次未能成行，真是太过遗憾了。"
  JAP_pnr_normal.11.b: "出口王仁三郎吗？真是个彻底的怪人。"
  JAP_pnr_normal.12.t: "聚光灯之外：列车上"
  JAP_pnr_normal.12.desc: "石原莞尔和宇垣一成"
  JAP_pnr_normal.12.a: "白种人和黄种人的大战近了。"
  JAP_pnr_jpc.1.t: "秋田县的深夜"
  JAP_pnr_jpc.1.desc: "北日本制菓的一位经理的儿子三浦俊贞对社会主义感兴趣，盗取了家中的现金和约十万日元的股票本离家出走。"
  JAP_pnr_jpc.1.a: "你就是三浦俊贞同志？"
  JAP_pnr_jpc.2.t: "三浦国中生事件"
  JAP_pnr_jpc.2.desc: "三浦俊贞被发现时正在和三名日共成员一起出售股票——触发不断提高强度的倒计时任务“赤色阴谋”。"
  JAP_pnr_jpc.2.a: "严惩这些赤色强盗。"
  JAP_pnr_jpc.2.a_tt: "赤色阴谋的§R强度§!减少了5"
  JAP_pnr_jpc.2.b: "理性的说，孩子的家长要负一部分教育的责任……"
  JAP_pnr_jpc.3.t: "赤色阴谋的另一面"
  JAP_pnr_jpc.3.desc: "赤色阴谋只是政府为了证明自己有能力控制工团势力，展示给社会各界看的东西，其本质是对社会局势的精巧操弄，并借此为自己的政党攫取更多利益的一种方式。\n\n借助操弄赤色阴谋，我们可以很合理地削弱海军的力量——并且陆军也因此一损俱损。而在社会层面上，我们将工团势力活动控制在极小的范围内——我们敌对政党的票仓附近，来给他们找点事做。所以最好的情况是对共党活动进行驱猎，并将赤色阴谋控制在一定范围内。如果赤色阴谋过低，我们就没办法炒作共产党威胁，如果赤色阴谋过高，说不定我们的牛皮就吹破了——总不会真的有人相信，如今和平的东京会真正爆发一场革新一切的赤色狂潮吧？"
  JAP_pnr_jpc.3.a: "敌人不能消失，否则政府就会找到新的敌人（在一个关键的事件发生前，确保赤色阴谋在35-85中间）。"
  JAP_pnr_jpc.4.t: "赤旗报"
  JAP_pnr_jpc.4.desc: "一次海军军务检查发现了赤旗报"
  JAP_pnr_jpc.4.a: "看来海军也博览群书，批判性阅读啊。"
  JAP_pnr_jpc.5.t: "是我们吗？"
  JAP_pnr_jpc.5.desc: "袴田里见意识到了政府试图利用共党，他决定……"
  JAP_pnr_jpc.5.a: "我们应该在赤旗报上声明，这一切都是凶恶政府的阴谋。"
  JAP_pnr_jpc.5.b: "不，他们似乎没搞清楚自己在操弄些什么……（确保当某个事件发生后，赤色阴谋大于85，就会引发意外的结果……）"
  JAP_pnr_jpc.6.t: "桃色争议"
  JAP_pnr_jpc.6.desc: "歌剧团成员不满待遇而发动罢工。（关联事件，二战开始后松竹少女歌剧团慰问前线士兵）"
  JAP_pnr_jpc.6.a: "只是每年都会发生的单纯的劳动争议……"
  JAP_pnr_jpc.7.t: "横须贺工厂怠工事件"
  JAP_pnr_jpc.7.desc: "发生了怠工声援"
  JAP_pnr_jpc.7.a: "看来我们的引蛇出洞成功了。"
  JAP_pnr_jpc.7.b: "毫无疑问，海军肯定和此有关。"
  JAP_pnr_jpc.8.t: "零星的罢工"
  JAP_pnr_jpc.8.desc: "士兵回营，舰队回港，政权归于人民。"
  JAP_pnr_jpc.8.a: "工团分子正在尝试发动总罢工！通过《治安维持法》刻不容缓！"
  JAP_pnr_jpc.8.b: "毫无疑问，陆军和政府已经勾结起来。"
  JAP_pnr_jpc.8.c: "要重新评估拒绝调查的海军。"
  JAP_pnr_jpc.8.d: "把印刷机开足马力！"
  JAP_pnr_jpc.9.t: "最后的冲锋"
  JAP_pnr_jpc.9.desc: "罢工工人和警察发生了冲突。"
  JAP_pnr_jpc.9.a: "匹夫之怒，血溅五步。"
  JAP_pnr_jpc.10.t: "陆海对峙"
  JAP_pnr_jpc.10.desc: "第一舰队驶入东京湾，东京湾堡垒已经瘫痪。"
  JAP_pnr_jpc.10.a: "斗争的时刻到了！怒吼的时刻到了！真相的时刻到了！"
  JAP_pnr_jpc.11.t: "1分钟前"
  JAP_pnr_jpc.11.desc: "示威农民和工人包围了霞关临时国会。"
  JAP_pnr_jpc.11.a: "不要向风暴低头。"
  JAP_pnr_jpc.12.t: "霞关陷入火海"
  JAP_pnr_jpc.12.desc: "霞关被炮击"
  JAP_pnr_jpc.12.a: "日本工团竟已渗透到如此之深……"
  JAP_pnr_jpc.12.b: "全球工团运动无法抹去的一笔！"
  JAP_pnr_news.1.t: "政友会延续立宪政治"
  JAP_pnr_news.1.desc: "123"
  JAP_pnr_news.1.a: "[JAP.GetName]的宪政再无威胁"
  JAP_pnr_news.2.t: "民政党延续立宪政治"
  JAP_pnr_news.2.desc: "123"
  JAP_pnr_news.2.a: "国民必将凭帝国议会为自身发声"
  JAP_pnr_news.3.t: "同床异梦的宪政联盟"
  JAP_pnr_news.3.desc: "123"
  JAP_pnr_news.3.a: "这是日本政界的新风，还是朝荣暮落的牵牛？"
  JAP_pnr_news.4.t: "人民同盟的诞生"
  JAP_pnr_news.4.desc: "在同日共进行了多轮非正式会谈之后，日共成员全部加入劳动组合全国评议会，而劳动组合全国评议会，社会大众党，以及民政党与政友会中的非主流派则共同组建了一个广泛的政治联盟。值得注意的是，该联盟特别强调维护《帝国宪法》，拥护天皇的立宪地位，这向宫中释放了日共立场趋于温和的信号。\n\n帝国陆军对于这一新生组织的出现选择了沉默，但零星的部队调动表明他们似乎正为某种行动做准备。面对军方施加的未知压力，宫中最终与这个新生的同盟达成了某种妥协。就在刚刚，西园寺公望正式奏荐“人民同盟”中的协力者之一，已有八年议会资历的社会大众党党员山本宣治出任首相。这个广泛的政治联盟是否能在解决日本当前面临的危机之前避免崩溃？"
  JAP_pnr_news.4.a: "那么此前那些传闻都是真的？"
  JAP_pnr_news.5.t: "科学的日本主义之胜"
  JAP_pnr_news.5.desc: "出人意料的消息从众议院中传来，在新的《议员选举法》通过后的首次众议院大选中，由北海道选区议员赤松克麿领导的科学社会党成功将其倡导的“科学的日本主义”带进了议会。\n\n起初他们根本无力撼动两大巨头政党的地位。但在关键时刻，以麻生久为首的社会大众党左派突然倒戈，通过一份互相协力候选人的选举协定与科学社会党组成同盟，形成了足以重塑日本政坛格局的政治力量。面对陌生的帝国议会第一大党，宫中似乎一时惊慌失措，但西园寺公望依然恪守“宪政常道”，奏请天皇向赤松克麿降下组阁大命。与政界不同，大多数民众都期待这位青壮年政治家的“科学”能为日本带来崭新的气象。"
  JAP_pnr_news.5.a: "日本无产阶级当以保卫自身民族利益为先"
  JAP_pnr_news.6.t: "社会大众党成为第一大党"
  JAP_pnr_news.6.desc: "尽管令人瞠目结舌，但事实的确如此。接连遭受政治丑闻与财务丑闻的打击后，立宪政友会和立宪民政党无可挽回地失去了国民的信任。两党虽然仍一如既往地在各地大肆展开贿选攻势，企图维持自身在众议院中的主导地位，但他们似乎未曾料到新《议员选举法》的施行使得选民数量激增，而日本民众早已在一次次失望中厌倦了两党的“民主”。\n\n长期作为政坛第三势力的社会大众党似乎已承载起越来越多日本民众对未来的希望。如今这个素有“永久在野党”之称的政党终于迎来了执政之日。其委员长安部矶雄如今已奉命组阁，并宣誓将一扫之前两党的积弊，真正地把民众的愿望和呼声带到帝国议会中。"
  JAP_pnr_news.6.a: "希望他们真能做到他们的承诺"
  JAP_pnr_news.7.t: "帝都不祥事件"
  JAP_pnr_news.7.desc: "东京自前几天就笼罩在迷雾里，时至今日一阵清风终于将雾霭吹散。约千名陆军中的革新派官兵发动了一场军事政变，他们迅速压制了几处关键的通讯设施和行政机关，并压制了清军派等反对势力，将其将领置于监视之下。此后政变部队迅速包围了皇宫，有报道称，天皇通过侍从武官长本庄繁男爵与政变部队取得接触。从眼下的局势判断，天皇似乎向政变者释放了积极信号。\n\n目前真崎甚三郎大将和近卫师团长香月清司中将一同控制了局面，并向日本全境颁布了戒严令。另有一条费解的消息，尽管目前尚不明确前因后果，但在政变部队成功控制了局势之后，秩父宫雍仁亲王似乎已进入皇宫。而宫中也已派出使者前往伊势神宫。"
  JAP_pnr_news.7.a: "陛下乃我等首领"
  JAP_pnr_news.8.t: "日本的加里波第"
  JAP_pnr_news.8.desc: "在石原莞尔，桥本欣五郎等人的带领下，联合，或称之为“日本爱国斗争生产联合”，于几天前纠集了一群农民，工人和一些士兵从静冈发动了一场前往东京向天皇陛下致敬的游行。在内田良平和出口王仁三郎等社会活动家的支持下，一开始只有约百人的队伍在抵达东京后已膨胀到数万人规模。尽管政府一方面派遣宪兵镇压游行，一方面希望奏请宣告戒严，但在短暂的对峙之后，一部分宪兵也脱离队列加入了游行队伍。而天皇则为避免进一步激化矛盾拒绝了戒严的下达。\n\n队伍在进入东京后并未破坏现有秩序，还获得了东京市民的欢迎。稍晚些时候，下位春吉作为代表向掌玺大臣呈递了一份请愿书，天皇特别考虑了他们对“恢复日本正常秩序”的主张，并最终向宇垣一成降下了组阁大任。"
  JAP_pnr_news.8.a: "我们又一次得到它了"
  JAP_pnr_news.9.t: "昭和神圣会稳定政局"
  JAP_pnr_news.9.desc: "长期以来日本的阴影中便充斥着凭正义之名实施的“政治暴力”，左右翼急进团体历来奉行独狼式作风，诉诸少数人的直接行动和个人恐怖主义来实现社会变革。可当他们面对昭和神圣会势不可挡的群众动员和闪电般的宣传攻势时则彻底失去了力量。在九段军人会馆中出口王仁三郎进行了演讲，随后下位春吉手持会旗，与几辆摩托车一同护送这位“圣师”前往二重桥。与此同时，早已在俱乐部外等候的昭和神圣会成员也开始高喊着恢复“皇道”，并高唱《君之代》向二重桥进军。宣传汽车突然从各条道路中冲出开始广播，其飞机则同步开始在帝都上空散发传单，向市民宣扬昭和神圣会的诉求。这场游行以宫中的沉默结束，但组阁大命很快被下达给与昭和神圣会密切相关的内务官僚后藤文夫。毫无疑问，菊花已被十曜裹挟，烤得萎靡不振。"
  JAP_pnr_news.9.a: "这他妈的还是日本吗？"
  JAP_pnr_kg.1.t: "[JAP.GetName]与我们接触"
  JAP_pnr_kg.1.desc: "日本与第三国际接触，尝试磋商未来的战略部署"
  JAP_pnr_kg.1.a: "我们有共同的亚洲利益。"
  JAP_pnr_kg.1.b: "我们怎可能与君主制主义者苟合？"
  JAP_pnr_kg.2.t: "[ROOT.GetName]表达了积极态度"
  JAP_pnr_kg.2.desc: "123"
  JAP_pnr_kg.2.a: "很好。"
  JAP_pnr_kg.4.t: "瓦隆-彭达尔克会议"
  JAP_pnr_kg.4.desc: "日本商谈大陆打通作战计划"
  JAP_pnr_kg.4.a: "我们同意扶持印度人民共和国，"
  JAP_pnr_kg.4.b: "并承诺将缅甸交给他们。"
  JAP_pnr_kg.4.c: "不，我们必须先取得华南再讨论印度问题。"
  JAP_pnr_kg.101.t: "经济支援？"
  JAP_pnr_kg.101.desc: "[JAP.GetName]向我们释出了善意，他们打算向我们提供一系列丰厚的支援，因为他们认为我们才是“真正的政府”。虽然他们大概率对所有人都是这么说的，但这毕竟是送到嘴边的利益。"
  JAP_pnr_kg.101.a: "我们当然接受。"
  JAP_pnr_kg.101.b: "[JAP.GetName]一定没安好心。"
  JAP_pnr_kg.102.t: "特别借款"
  JAP_pnr_kg.102.desc: "我们收到了一笔特别借款。"
  JAP_pnr_kg.102.a: "孝敬得好啊，[JAP.GetName]。"
  JAP_pnr_kg.103.t: "鸦片与枪支"
  JAP_pnr_kg.103.desc: "提供鸦片与枪支"
  JAP_pnr_kg.103.a: "我们正好有点资金缺口。"
  JAP_pnr_kg.104.t: "技术投资协定"
  JAP_pnr_kg.104.desc: "提供技术投资协定"
  JAP_pnr_kg.104.a: "科学改变生活。"
  JAP_pnr_kg.105.t: "鼓动正义之战"
  JAP_pnr_kg.105.desc: "他们鼓动正义之战"
  JAP_pnr_kg.105.a: "收复我等固有领土！"
  JAP_pnr_kg.106.t: "军事顾问团"
  JAP_pnr_kg.106.desc: "提供军事顾问团"
  JAP_pnr_kg.106.a: "如虎添翼。"
  JAP_pnr_kg.107.t: "有限的军事干涉"
  JAP_pnr_kg.107.desc: "承诺有限的军事干涉"
  JAP_pnr_kg.107.a: "帮手越多越好。"
  JAP_pnr_kg.108.t: "似乎有些……不对劲"
  JAP_pnr_kg.108.desc: "获得民族精神日本利益"
  JAP_pnr_kg.108.a: "现在断联还不晚。"
  JAP_pnr_kg.108.b: "如果他们继续援助其它人怎么办？"
  JAP_pnr_kg.109.t: "大东亚经济体"
  JAP_pnr_kg.109.desc: "加入日本阵营"
  JAP_pnr_kg.109.a: "我们已变成鹰犬走狗，决不能再陷得更深了。"
  JAP_pnr_kg.109.b: "所谓的国际关系就是走钢丝。"
  JAP_pnr_kg.110.t: "亚洲的爪牙"
  JAP_pnr_kg.110.desc: "完了，全完了，我们彻底沦为了日本的协力国。"
  JAP_pnr_kg.110.a: "为了东亚，一同奋进！"
