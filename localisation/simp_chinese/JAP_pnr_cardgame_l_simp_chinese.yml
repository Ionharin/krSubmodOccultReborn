l_simp_chinese:
 JAP_pnr_cardgame_category: "黑金定约"
 JAP_pnr_cardgame_category_desc: "\n§Y我的手牌太多了……§!\n\n§2青年将校虽然拥护我，但一点也不尊重我的真意。说些不存在的事情，搞各种极端的论调。我明明不打麻将，他们说我打麻将。我只打桥牌，从来不打麻将。§!——裕仁对田岛道治的抱怨\n\n自从我们开始资助奉天政府之后，满铁资源勘探处便尝试在当地寻找尚未被开发的战略资源。然而这一次他们在齐齐哈尔地区发现的大型油田远超之前所有勘探的总和，并毫无疑问地会永远改变远东的力量平衡。这一发现直接影响到了我国的战略决策，并不得不使我们重新开始审视我们的大陆政策。\n\n幸运的是，不管是奉天还是俄罗斯似乎都还没有注意到我们挖到了一座金山，我们对外宣称自己发现了中等储量的石油，暂时骗过了他们的耳目。但随着时间推移，他们一定会发现真相的……面对这突如其来的巨大财富源泉，满铁、大藏省、财阀和关东军本部都对这片油田提出了自己的看法和规划。而我们要做的便是在每回合中确定合适的方策，在推进油田的§O开发与勘探§!，提高我国对齐齐哈尔油田控制的同时，尽量压制住奉天政府的张作霖与北方俄罗斯的§t警戒§!。"
