 JAP_pnr_cardgame_crisis_none: "暂无局势"
 JAP_pnr_cardgame_crisis_none_desc: "黑金定约尚未开始。"
 JAP_pnr_cardgame_crisis_1: "奉天要求分红"
 JAP_pnr_cardgame_crisis_1_desc: "§G既然油田是在奉天的土地上被发现的，那么我们就理应共同开发——或者你们至少应该给我们点利益。§!\n\n若在本轮结束时，我们未打出大藏省和财阀卡牌，则回合结束时日本控制将§R-10§!。"
 JAP_pnr_cardgame_crisis_2: "间谍进入瑷珲"
 JAP_pnr_cardgame_crisis_2_desc: "§G您听说了吗？日本人似乎挖到了一个不大不小的石油田。但这可真是奇了怪了，他们的安保等级倒不像是一般油田。§!\n\n若本轮我们未能抵抗俄罗斯间谍的入侵，回合结束时俄罗斯警戒§R+15§!。"
 JAP_pnr_cardgame_crisis_3: "满铁引进新锐设备"
 JAP_pnr_cardgame_crisis_3_desc: "§G德国进口，绝对精良。§!\n\n本轮满铁牌的开发与控制收益略有提高，但每打出一张满铁牌都会额外提高奉天政府的警戒度。"
 JAP_pnr_cardgame_crisis_4: "油田储量超预期"
 JAP_pnr_cardgame_crisis_4_desc: "§G齐齐哈尔油田的储量比我们一开始预测的要更高——或许它现在能多给我国每年提供300万桶的原油。§!\n\n本轮开始时油田开发等级§G+5§!，但本轮作出的所有行动都将造成奉天与俄罗斯警戒额外提高§R25%§!。"
 JAP_pnr_cardgame_crisis_5: "奉天要求限制铁路警备"
 JAP_pnr_cardgame_crisis_5_desc: "§G你们这些日本人嘴上说着有油田，又把地方封起来不给看让人好奇，另一方面还派出越来越多的人守卫铁路沿线——该不会那里什么都没有，只是你们想扩大驻军的借口吧？§!\n\n若本轮使用关东军卡牌，则在回合结束时奉天警戒§R+10§!；否则奉天警戒§G-5§!。"
 JAP_pnr_cardgame_crisis_6: "俄罗斯关切远东局势"
 JAP_pnr_cardgame_crisis_6_desc: "§G近期日本对奉天境内有反常的兵力调动现象，名义上是为了确保正在开采的一个新近发现的中型油田的安全，但只是一个中型油田何至于增兵至此……§!\n\n本轮使用的所有关东军卡牌都将令俄罗斯警戒额外§R+10§!。"

 JAP_pnr_cardgame_card_1_decision: "继续钻探"
 JAP_pnr_cardgame_card_1_decision_desc: "§Y满铁牌§!\n油田开发§G+4§!\n日本控制§G+2§!\n奉天警戒§R+4§!"
 JAP_pnr_cardgame_card_2_decision: "请求东洋拓殖会社帮助"
 JAP_pnr_cardgame_card_2_decision_desc: "§Y满铁牌§!\n油田开发§G+3§!\n日本控制§G+6§!\n奉天警戒§R+7§!\n\n若上一张牌为“继续钻探”，将触发§Y方策配合：满铁疾驰§!。"
 JAP_pnr_cardgame_card_3_decision: "许诺开采分红"
 JAP_pnr_cardgame_card_3_decision_desc: "§Y大藏省牌§!\n日本控制§R-2§!\n奉天警戒§G-7§!\n可处理§8“奉天要求分红”§!。"
 JAP_pnr_cardgame_card_4_decision: "散播混乱流言"
 JAP_pnr_cardgame_card_4_decision_desc: "§Y大藏省牌§!\n俄罗斯警戒§G-7§!\n本轮不能再使用关东军牌。\n可处理§8“间谍进入瑷珲”§!。"
 JAP_pnr_cardgame_card_5_decision: "财阀协力援助"
 JAP_pnr_cardgame_card_5_decision_desc: "§Y财阀牌§!\n油田开发§G+4§!\n日本控制§G+1§!\n可处理§8“奉天要求分红”§!。"
 JAP_pnr_cardgame_card_6_decision: "长期石油采购合同"
 JAP_pnr_cardgame_card_6_decision_desc: "§Y财阀牌§!\n油田开发§G+2§!\n日本控制§G+4§!\n奉天警戒§G-3§!\n可处理§8“奉天要求分红”§!。\n\n若上一张牌为“许诺开采分红”，触发§Y方策配合：日奉合作§!。"
 JAP_pnr_cardgame_card_7_decision: "加强沿线铁道警备"
 JAP_pnr_cardgame_card_7_decision_desc: "§Y关东军牌§!\n日本控制§G+6§!\n奉天警戒§R+5§!\n俄罗斯警戒§R+3§!"
 JAP_pnr_cardgame_card_8_decision: "保护生命线"
 JAP_pnr_cardgame_card_8_decision_desc: "§Y关东军牌§!\n油田开发§G+1§!\n日本控制§G+8§!\n奉天警戒§R+7§!\n俄罗斯警戒§R+5§!\n\n若上一张牌为“加强沿线铁道警备”，触发§Y加倍：既成事实§!。"

 JAP_pnr_cardgame_combo_fengtian_cooperation_tt: "§Y方策配合：日奉合作§!\n奉天警戒额外§G-3§!，下一张满铁牌造成的奉天警觉降低§G50%§!。"
