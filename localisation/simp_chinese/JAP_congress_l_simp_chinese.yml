 JAP_congress_open_button_desc_enabled: "§Y帝国议会§!乃大日本帝国的最高立法机关，自1890年以来已开设46年，其内部设有众议院与贵族院，凡大日本帝国25岁以上国民均有权当选为众议院议员。根据宪法规定，帝国议会将协助§Y天皇陛下§!行使立法权。"
