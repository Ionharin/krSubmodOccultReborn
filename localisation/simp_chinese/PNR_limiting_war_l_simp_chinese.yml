l_simp_chinese:
 limiting_war_begonia_leaf_cat: "有限战争"
 limiting_war_begonia_leaf_cat_desc: "[RUS.GetName]是个十分强大的对手，但我们没必要和他们进行全面冲突。我们并无将[RUS.GetName]完全摧毁的念头，我们的目的只是顺应民众的呼声，向他们索取本就属于我们的东西。难道一位可敬的主人被一个骗子诈骗走了钱财和货物，主人就对这些东西失去了正当的所有权吗？作为外满洲最正当的主人，我们将会取回本就属于我们的财产。"
 limiting_war_begonia_leaf_cat_tt: "启用决议：£GFX_decision_icon_small §Y行动代号: 海棠红§!"
 limiting_war_start_begonia_leaf: "行动代号：海棠红"
 limiting_war_start_begonia_leaf_desc: "栽植恩深雨露同，一丛浅淡一丛浓。平生不借春风力，肯与群芳斗艳红———我们将发动一场针对§Y[RUS.GetName]§!的§Y有限战争§!。只要我们快速达成我们的目的，在控制所有计划占领的区域之后，我们便可避免与[RUS.GetName]之间升级为全面战争——况且，这场冲突也是一场简单的试探，要是事实证明[RUS.GetName]并不如我们想得那般强大的话……"
 is_not_engaged_in_a_limited_war: "我们当前不处于另一场有限战争中"
 limiting_war_begonia_leaf_mission: "行动代号：海棠红"
 limiting_war_begonia_leaf_mission_desc: "控制所有预计夺取地区以赢得§Y有限战争§!，并在不升级为全面战争的情况下将其纳入我们的版图。\n\n若我们的投降进度超过§Y10%§!将导致这场有限战争§R失败§!。"
 limiting_war_start_begonia_leaf_tt_main: "开始对§Y[RUS.GetName]§!的§Y有限战争§!。\n\n若我们的投降进度超过§Y10%§!将导致这场有限战争§R失败§!。\n即便我们可能控制了部分目标土地，但本身输掉有限战争可能导致我方必须§R归还§!此前征服的领土。"
 limiting_war_events.1.t: "外东北回归！"
 limiting_war_events.1.desc: "我们的敌人，卑鄙无耻的窃贼和匪徒，[RUS.GetName]的军队正在溃败，我们的胜利已成定局，时隔近百年，我国富饶的外东北地区终于再次被牢牢掌控在他真正的主人手中。\n\n毫无疑问，随着我们在冲突地区取得的一个又一个胜利，盘踞在莫斯科中的旧帝国主义势力定在瑟瑟发抖，并向他们信仰的神灵祈求我们的军队不要彻底毁灭他们的国家。当这个世界上真正正义且道德的人们拿起强大的火器奋力反击，在思想与物质的两重武器的加持之下，[RUS.GetName]怎能不失败？"
 limiting_war_events.1.a: "臣心一片磁针石，不指北方不肯休！"
 limiting_war_events.1.b: "[RUS.GetName]似乎并不如我们想象的那般强大……"
 limiting_war_events.2.t: "[FROM.GetAdjective]取得了战略突破"
 limiting_war_events.2.desc: "出人意料的事情还是发生了，我们最近在远东地区与[FROM.GetName]之间发生的军事冲突以我们的失败而告终——尽管他们的军队素质和装备水平逊于我军，但[FROM.GetAdjective]军队还是在策略上胜过了我方部队，并夺取了远东——以他们的话说是外东北的控制权。\n\n这群自称敬奉祖先的人否认自己的先祖在近百年之前白纸黑字签下的条约，悍然出兵占据了这些早已归属给我们的领土。\n\n无论如何，他们取得的进展导致这些领土暂时落入他们手中，而毫无疑问的是，他们的占领也同时削弱了我们的权威。继续冲突可能会进一步瓦解纪律和信心，但放弃该领土则意味着在[RUS.GetAdjective]公众面前承认失败——而民众恐怕不想看到我们政府软弱的一面。"
 limiting_war_events.2.a: "我们必须立即止损。"
 limiting_war_events.2.b: "我们绝不会放弃我国的正当领土！"
 limiting_war_events.3.t: "[FROM.GetName]接受失败"
 limiting_war_events.3.desc: "从莫斯科传回了帝国主义者们祈求和平的消息，毫无疑问的是我们的军事行动取得了完全的成功，敌人已经丧失了所有抵抗斗志，并害怕地向我们磕头求饶以祈求和平。[FROM.GetName]为避免我们进一步的复仇，已正式放弃对外东北的控制。毫无疑问的是，这场胜利提升了我们在世界上的地位，震慑了那些帝国主义者，并维护了我们领土的完整性。"
 limiting_war_events.3.a: "巨龙腾飞于东方！"
 limiting_war_events.4.t: "[FROM.GetNameDefCap]决定全面开战"
 limiting_war_events.4.desc: "[FROM.GetNameDefCap]已不再假惺惺地摆出要和我们谈判的样子，似乎是在远东地区取得的成果让他们有了挑战我们的勇气。看起来他们的意图十分明确：他们要彻底征服我国。我们必须面对和他们之间的全面战争。"
 limiting_war_events.4.a: "决不妥协，决不投降。"
 limiting_war_events.5.t: "[QIE.GetAdjective]突击停滞"
 limiting_war_events.5.desc: "最近[QIE.GetName]突然在远东地区发动了一场不宣而战的突袭，在战争初期，[QIE.GetAdjective]部队的迅速突进让我们措手不及，但随着战争日益持久，他们的压力日渐增加，战场上的表现也逐步下滑。其军队的弱点已暴露出来。对[QIE.GetAdjective]军队而言，原本计划中的闪电战已变成一场苦战。我们可以选择宽宏大量，提出让步给他们一条出路，不过棋盘已经反转，是放他们一马还是追求彻底的胜利，决定权现在在于我们。"
 limiting_war_events.5.a: "提出让步。"
 limiting_war_events.5.b: "我们只接受完全的胜利。"
 limiting_war_events.6.t: "远东战事不利"
 limiting_war_events.6.desc: "我们在外东北的攻势已陷入僵局，这并非问题所在，问题在于我们的敌人已经察觉到了这一点。他们注意到了我们的作战计划执行得并不顺利。如今他们向我们发出最后通牒，我们要么立即投降以减少损失，要么继续战争，承受更多的流血牺牲。"
 limiting_war_events.6.a: "那就议和吧。"
 limiting_war_events.6.b: "在收复故土之前，我们绝不停下！"
 limiting_war_events.7.t: "[FROM.GetName]拒绝投降"
 limiting_war_events.7.desc: "[FROM.GetName]已明确表示，他们宁愿看到整个国家化为灰烬，也绝不会向我们屈服丝毫。我们的战争将继续下去，并且已完全演变成一场全面战争。"
 limiting_war_events.7.a: "箭在弦上，不得不发。"
 limiting_war_events.8.t: "[FROM.GetName]谋求让我方投降！"
 limiting_war_events.8.desc: "截获的敌方高层通讯证实了我们最深重的忧虑：不会有谈判达成的和解，也不会有任何让这场战争适度结束的让步。他们要求的无异于我国的彻底投降，企图让我们在又一个帝国主义者的铁蹄下苟活。如果这就是他们的目标，那么我们只有一个回答：我们绝不屈服。"
 limiting_war_events.8.a: "[ROOT.GetNameDefCap]战斗到底！"
 limiting_war_events.9.t: "[FROM.GetName]拒绝调解"
 limiting_war_events.9.desc: "[FROM.GetName]拒绝了所有涉及远东领土让步的提议，称其不可接受。他们的领导层宣称，这场战争给他们带来了耻辱，只有摧毁我们的国家才能结束这场冲突。"
 limiting_war_events.9.a: "不过是第二次雅克萨之战！"