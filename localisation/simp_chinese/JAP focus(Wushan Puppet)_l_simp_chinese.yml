l_simp_chinese:
 JAP_pnr_self_defense_forces: "设立自卫队"
 JAP_pnr_self_defense_forces_desc: "我们需要一支能够保全我们自身的军事力量，确保想要侵害我们的人在我们自己的土地上无法取得任何优势。"
 JAP_pnr_learn_from_the_lesson: "吸取教训"
 JAP_pnr_learn_from_the_lesson_desc: "尽管我们战败了，但我们并非没有学到什么。我们将吸取教训，以期不再重蹈覆辙。"
 JAP_pnr_rebuild_the_command_system: "重建指挥体系"
 JAP_pnr_rebuild_the_command_system_desc: "我们将改良现有指挥体系以应对我们缩小的军队规模。"
 JAP_pnr_military_alliance: "军事同盟"
 JAP_pnr_military_alliance_desc: "由于我国已被解除武装，最好的选择是与他国构成军事同盟。"
 JAP_pnr_revitalize_the_national_defense_industry: "振兴国防工业"
 JAP_pnr_revitalize_the_national_defense_industry_desc: "我们将重建因战争结束而瘫痪的国防工业体系，从而保护日本不受侵害。"
