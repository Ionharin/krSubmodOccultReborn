  autonomy_pnr_jimi_zhou: "羁縻州"
  autonomy_pnr_jimi_zhou_desc: "羁縻州制度始于中国南北朝时期，目的是对中央政权难以触及的遥远边疆的属国进行控制。尽管在如今，统治一个土地广袤的帝国可能要比起千年之前更加简单，但毫无疑问对于中国这样强调中央集权的国家来说，这些行政事务终究会将整个帝国压垮。"
