 JAP_pnr_daitoa_kyoeiken: "三方协商的共赢"
 JAP_pnr_daitoa_kyoeiken_desc: "社会力量相对强大，国家和社会团体平等协商。比如瑞典、德国战后建立的“社会伙伴关系”（工会、雇主协会和政府三方谈判决定工资和福利政策），就是典型的社会法团主义"
 JAP_pnr_orient_group: "游荡的红色幽灵"
 JAP_pnr_orient_group_desc: "尽管日本共产党尚未获得合法政党的承认，但当局已经默许了我们的合理存在，并停止了他们的破坏活动。就像在十几年前那样，我们将通过我们的外围组织——大大小小的工会和农会传达我们的想法，日本的政治局势变换莫测，现在还不是放松的时候。"
