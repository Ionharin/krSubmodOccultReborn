 JAP_pnr_suiheisha_calls_for_improvement_of_the_current_situation_desc: "123"
 JAP_pnr_japan_is_at_its_most_dangerous_moment: "日本到了最危险的时候"
 JAP_pnr_japan_is_at_its_most_dangerous_moment_desc: "我们在大陆取得的诸多暂时失败让国家中那些不坚定的投降主义者试图对我们的敌人讲和，这些人迷惑了天皇陛下，试图让天皇发表一份战败声明。我们已经挫败了他们的阴谋，避免了国体遭到腐蚀，日本人民绝不认输，日本万岁！天皇陛下万岁！"
 JAP_pnr_pick_up_the_bamboo_spear: "拿起竹枪"
 JAP_pnr_pick_up_the_bamboo_spear_desc: "敌人近在咫尺，他们不仅残杀矫健之日本男儿，甚至还图谋攻打我们的岛屿。值此生死存亡时刻，日本好男女无论老少皆要拿起竹枪，与侵略者们斗争到底！"
 JAP_pnr_sacrifice_private_interests_for_the_public_good: "灭私奉公"
 JAP_pnr_sacrifice_private_interests_for_the_public_good_desc: "值此生死存亡之时刻，全体国民必须有倾尽全力抵抗敌人之精神觉悟，才能凭此种日本之强壮精神对抗敌人，一切资源与物资绝非一人所有，而是国家所有。"
 JAP_pnr_suppress_the_non_citizens: "镇压非国民"
 JAP_pnr_suppress_the_non_citizens_desc: "毫无疑问，为了破坏日本男儿的战争士气，我们的敌人唤醒了一系列潜伏在我们国家中的间谍和破坏分子，煽动迷惑我国国民中止战争，放弃抵抗，我们必须严厉镇压他们，如此才能保全我国之士气。"
 JAP_pnr_diet_of_the_resilient_nation: "坚强民族之饮食"
 JAP_pnr_diet_of_the_resilient_nation_desc: "国难当头，我国最优质的饮食必须供给给那些在前线浴血奋战，抗击敌军的帝国勇士。而我国大多数居民应当为永恒之繁荣，忍耐一时之不幸，另寻其它食物：青蛙，老鼠，狐狸，蜗牛都是很好的补充蛋白质的主食；至于淀粉与碳水化合物，则可通过花生壳和锯末来获取。"
 JAP_pnr_awaken_the_pain_of_defeat: "唤醒战败的痛苦"
 JAP_pnr_awaken_the_pain_of_defeat_desc: "如果我国战败，日本岛落入敌手，我们面对的残暴敌人一定会出于泄愤目的对我们展开屠杀。他们将阉割所有日本男人，强奸所有日本女人，日本必将不复存在。为了避免这些禽兽犯下此等暴行，我们唯有尽心奉献，支援帝国军队。"
 JAP_pnr_yuukyuu_no_taigi: "悠久之大义"
 JAP_pnr_yuukyuu_no_taigi_desc: "没有什么比为国家尽忠而献身更高贵的了，人的生命何其短暂灰暗，而世间正道又何其长久闪耀！不论是前线与敌人抗击而献身，还是在后方为支援战局而献身之人，必将超越生死本身！"
 JAP_pnr_emergency_industrial_evacuation: "紧急工业撤离"
 JAP_pnr_emergency_industrial_evacuation_desc: "我们的敌人一定会着重攻击工业区，以瘫痪我国的工业能力。为了避免这一情况，我们应该将工业紧急向其它地区疏散。"
 JAP_pnr_charge_at_the_enemy_here: "向敌人的这里突击！"
 JAP_pnr_charge_at_the_enemy_here_desc: "日本的孩子们，昭和的男儿们，你们面对的不过是外强中干的土鸡瓦狗。当你做好准备，以必胜之决心与难移之意志向其发起决死之冲击时，他们必因你的强大和勇气而颤抖不已。"
 JAP_pnr_promote_soldiers_deeds: "宣扬士兵事迹"
 JAP_pnr_promote_soldiers_deeds_desc: "那些在战场上奋勇杀敌，为国尽忠而死的英魂值得更好的对待。抚恤金，白米，媒体宣传，供奉……这些必须都准备好，当人们意识到他们无需担心死后之事时，他们必能获得战斗并活下去的勇气。"
 JAP_pnr_national_volunteer_combat_corps: "国民义勇战斗团"
 JAP_pnr_national_volunteer_combat_corps_desc: "尽管日子一天天过去，但日本民众的战斗精神依然高昂。民众们宁可成为野兽的刀下亡魂，也不愿当亡国奴。国民们被组织起来，形成义勇战斗团，使得我们的敌人即便占领了一处土地，也要时刻小心那乡野和小巷中报国的一击。"
