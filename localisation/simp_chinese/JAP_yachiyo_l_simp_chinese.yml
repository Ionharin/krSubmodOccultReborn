 JAP_pnr_searching_for_oil: "加速资源回收"
 JAP_pnr_searching_for_oil_desc: "作为海岛国家的我国缺少各类资源是事实，与其进行矿物和资源开发来缓解我们缺少资源的现状，我们不如从世界上的其它国家进口回收金属和其它废料来进行资源的回收再利用。"
