 JAP_pnr_chemical_weapons_section: "工人们，团结在工会之中！"
 JAP_pnr_chemical_weapons_section_desc: "不管是1920年由加藤勘十领导的铁矿罢工，还是由无政府工团主义者进行的足利研究所打烧。工人们常常为了改善自己的工作环境来诉诸于个人的暴力。总的来说这并不是罪无可赦的事情，但英雄式的个人恐怖或许会引发民间厌恶，通过工会进行合理的斗争才能为我们争得更广泛的同情。"
