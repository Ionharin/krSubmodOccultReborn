 JAP_pnr_special_military_exercise: "陆军特别军事演习"
 JAP_pnr_special_military_exercise_desc: "自1892年以来，我国陆军每年都会举办特别军事演习，而天皇陛下也每年都会作为大元帅监督该演习，绝不会缺席。按照计划，今年的演习将于北海道进行。"
 JAP_pnr_elder_brother_in_east_asia: "东亚母亲的长子"
 JAP_pnr_elder_brother_in_east_asia_desc: "123"
 JAP_pnr_the_peace_of_asia: "亚洲的和平"
 JAP_pnr_the_peace_of_asia_desc: "我国已毫无疑问地团结起整个亚洲，并带领亚洲人民将帝国主义悉数消灭，再无任何帝国主义者压迫我们了，天皇陛下万岁！[JAP.GetName]万岁！亚洲团结万岁！"
 JAP_pnr_phasianus_versicolor: "绿雉，多彩之鸟"
 JAP_pnr_phasianus_versicolor_desc: "123"
 JAP_pnr_japanese_aitake: "笙之和音"
 JAP_pnr_japanese_aitake_desc: "生活在永恒不变的和平时代，这时代就如同笙之和音般和谐，这个时代会一直持续下去吗？这个时代会一直持续八千代吧。\n\n看啊，雪花落在了松树的叶子上，好雪，好雪。"
 JAP_pnr_68th_sessions_imperial_diet: "第68回帝国会议常会"
 JAP_pnr_68th_sessions_imperial_diet_desc: "自1890年我国根据《大日本帝国宪法》召开第1回帝国会议常会已过去45年。在本次帝国会议常会上，冈田启介将代表立宪民政党呈递昭和十一年预算案，旨在解决日益严重的农民危机和城市中下层赤贫化问题。"
