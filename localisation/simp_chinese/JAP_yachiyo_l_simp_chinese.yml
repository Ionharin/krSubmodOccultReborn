 JAP_pnr_33_percent_principle: "33%原则"
 JAP_pnr_33_percent_principle_desc: "为了社会的健康发展与我国经济的平等化，无论国营企业还是私人企业，都将强制把33%的年收入用作发放给劳动者的工资，33%的年收入用于扩大企业规模，33%的年收入作为储备资金。余剩的1%将归给审议局管辖的特别基金会管理。"
 JAP_pnr_ban_strikes: "罢工禁止"
 JAP_pnr_ban_strikes_desc: "123"
 JAP_pnr_fluttering_banner_of_honor: "飘扬的锦旗"
 JAP_pnr_fluttering_banner_of_honor_desc: "谨遵今上天皇的御稜威，我等革稗政，除民害，去虚文，时至今日所发动改造国家的大计画已宣告完成。日本国已焕然一新，日本民众已焕然一新，再无奸诈朝敌惑乱我大八州蜻蛉君子之国。手持雍仁陛下因信赖所赐予的正道锦旗，我等诚惶诚恐，必将以身许国，之死靡侘。"
 JAP_pnr_missing_governor_general_of_korea: "不知所踪的朝鲜总督"
