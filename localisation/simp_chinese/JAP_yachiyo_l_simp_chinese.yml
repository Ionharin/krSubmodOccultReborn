 JAP_pnr_dai_gensui_of_army_and_navy_desc: "123"
 JAP_pnr_fiscal_austerity: "暴力出清"
 JAP_pnr_fiscal_austerity_desc: "毫无疑问，我国面对黑色星期一遭遇到重创的原因正是我们虚胖的经济。长期以来面对各种经济危机时立宪政友会都主张对社会企业进行救济，这使得许多不良企业逃离了优胜劣汰的命运，值此机会，或许我们可以让它们出局，使得日本经济更加健康。"
 JAP_pnr_consumer_savings_awareness_campaign: "银行乃最后防线"
 JAP_pnr_consumer_savings_awareness_campaign_desc: "123"
 JAP_pnr_currency_war: "进化而非削减"
 JAP_pnr_currency_war_desc: "这种降本，不会削弱购买力（甚至可能因为效率提升而加薪），反而会因为生产力的巨大飞跃，带来一种良性的通缩。什么叫良性通缩？你今天买的电脑、手机，是不是比十年前的性能强百倍，价格还便宜得多？这就是技术进步带来的良性通缩。你的钱更值钱了，你能买到的东西更好了。这不是灾难，这是文明的进步。"
 JAP_pnr_no_debt_policy: "不举债原则"
 JAP_pnr_no_debt_policy_desc: "123"
 JAP_pnr_expand_exports: "扩大出口"
 JAP_pnr_expand_exports_desc: "123"
 JAP_pnr_issue_special_government_bonds: "发行特别公债"
 JAP_pnr_issue_special_government_bonds_desc: "为了对抗这场消费者失去信心的金融风暴，扩大政府预算支出规模是有必要的。值此机会，我们将重启1923年大地震后未能实施的各项特别财政计划，从电话改进特别国债到萨哈林拓殖特别国债，借此为低迷的社会创造更多需求。"
 JAP_pnr_accommodative_monetary_policy: "廉价货币政策"
 JAP_pnr_accommodative_monetary_policy_desc: "货币就如同一种饮料，当人们感到口渴的时候大口饮下，就可以刺激经济体系来促进其活动。既然我们的市场现在如此干渴，大量的商品在它的胃中亟待着被消化，我们最好的选择便是让它一口气喝个够——通过增加货币供给来刺激投资与消费增长。"
 JAP_pnr_jikyoku_kyokyu_jigyo: "问题在利率"
 JAP_pnr_jikyoku_kyokyu_jigyo_desc: "我们一贯执行的积极财政政策恰恰能够帮助我们走出当前的经济困境，大藏省将通过降低短期利率及发动一系列经济政策来恢复市场信心，释放流动性，促使投资回暖，并帮助我们彻底摆脱经济危机。"
 JAP_pnr_large_scale_public_works: "大规模公共工程"
 JAP_pnr_large_scale_public_works_desc: "北海道地区和冲绳地区长期以来经济水平显著落后于我国平均水平，值此机会，我们可以尝试开发并改造其产业结构和经济状态，通过大规模的公共工程来改善其对外部和公共财政的依赖。"
 JAP_pnr_theory_of_gradual_reduction_of_public_debt: "公债渐减论"
 JAP_pnr_theory_of_gradual_reduction_of_public_debt_desc: "为了稳定时局我们发行了大量公债，这帮助我们快速地从萧条之中走了出来。但通胀的危险仍然萦绕在我们的头顶，为此我们必须想办法收缩现有债务规模，不管是通过银行正回购还是别的什么手段，不然这场经济危机只会以另一种方式与我们相伴而行。"
