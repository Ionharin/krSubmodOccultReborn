 JAP_pnr_continuation_of_hozumi_yatsuka: "穗积八束之延续"
 JAP_pnr_continuation_of_hozumi_yatsuka_desc: "国家乃权力团体，社会乃平等团体。而天皇陛下即是这些团体的真正主人，这是宪法第一条明确规定的。毫无疑问，先前存在的国体一元论是一种异端邪说，它让天皇成为了人民的仆人，犯下了不敬罪。"
 JAP_pnr_clarification_of_the_kokutai: "国体明徵"
 JAP_pnr_clarification_of_the_kokutai_desc: "仅仅是打击天皇机关说谬论还不够，我们必须让人们深入了解国体之重要性——我国原本是以皇室为宗家、尊奉天皇为古今中心、君民一体的大家族国家。因此，为国家繁荣尽力，即是侍奉天皇的荣光；对天皇尽忠，即是爱国并谋求国家的昌盛。没有忠君就没有爱国，没有爱国就没有忠君。"
 JAP_pnr_vigorous_spirit: "刚健之气魄"
 JAP_pnr_vigorous_spirit_desc: "白种人对我们的文化入侵到了一种可怕的地步，许多日本少年不以强壮和男子气概为荣，反而开始研究穿衣和涂脂抹粉。我们必须逆转自明治时期开始的日本民族之堕落，重新提倡男性的刚健力量。"
 JAP_pnr_most_loyal_and_courageous_soldier: "最忠勇的士兵"
 JAP_pnr_most_loyal_and_courageous_soldier_desc: "123"
 JAP_pnr_ban_party_politics: "封禁党人政治"
 JAP_pnr_ban_party_politics_desc: "自明治天皇开设国会以来，盘踞在国会中的政党都是这个国家的蛀虫。他们重视自身利益胜过国家利益，为自己的一瓶西洋美酒，就能置数万户农民于危险境地。再没有比这更可怕的东西了，我们必须查禁。"
 JAP_pnr_require_zaibatsu_to_offer_concessions: "要求财阀让利"
 JAP_pnr_require_zaibatsu_to_offer_concessions_desc: "财阀，日本最敲骨吸髓的资本主义蛀虫。毫无疑问，如果将他们一杀了之的话只会导致我国经济陷入混乱，况且他们已为了自己的利益将大多数行业垄断，免去了我们整合国家经济的需求。现在我们只需要敲打他们，让他们把利益交予国家，而非全部进入他们自己的腰包即可。"
 JAP_pnr_end_urban_decay: "终结城市堕落"
 JAP_pnr_end_urban_decay_desc: "城市中的小资产阶级和中产阶级无疑正是国家堕落的明证。"
