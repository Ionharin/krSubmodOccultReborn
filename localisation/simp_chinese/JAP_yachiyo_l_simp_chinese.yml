 JAP_pnr_special_military_exercise: "40精锐师计划"
 JAP_pnr_special_military_exercise_desc: "在1921年，山梨半造大将曾计划了四十精锐师计划。"
 JAP_pnr_the_peace_of_asia: "宁静之亚细亚"
 JAP_pnr_the_peace_of_asia_desc: "我国已毫无疑问地团结起整个亚洲，并带领亚洲人民将帝国主义悉数消灭，再无任何帝国主义者压迫我们了，天皇陛下万岁！[JAP.GetName]万岁！亚洲团结万岁！"
