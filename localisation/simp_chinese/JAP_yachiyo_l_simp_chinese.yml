 JAP_pnr_investing_in_heavy_and_chemical_industries_desc: "天才无法被埋没，有高度科学天分的学生经教育之后必能成为我国栋梁。"
 JAP_pnr_all_japan_industrial_alliance: "有序的经济控制"
 JAP_pnr_all_japan_industrial_alliance_desc: "日本产业理事会，新的市场秩序要求资本家学会和政府站在一起共同谋利，政府则负责将大量的公共订单输入到市场中来养育企业，作为交换，企业则要服从于政府的产业策略和经济控制。"
