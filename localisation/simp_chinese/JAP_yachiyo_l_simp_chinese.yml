 JAP_pnr_against_german_and_russian_imperialism_desc: "123"
 JAP_pnr_socialism_in_one_country: "一国建成社会主义"
 JAP_pnr_socialism_in_one_country_desc: "123"
 JAP_pnr_sweep_kensei_no_jodo_into_the_trash_heap: "国体辨明"
 JAP_pnr_sweep_kensei_no_jodo_into_the_trash_heap_desc: "现行的资本主义秩序并非是日本的国体，所谓的日本国体应该是整个国家自始至终传承下来，始终未变的某种核心。因此，万世一系的天皇陛下即为国体本身，天皇陛下即为全国民共同体的政治中心。"
