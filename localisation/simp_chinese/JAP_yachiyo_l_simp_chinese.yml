 JAP_pnr_pacify_social_associations: "安抚社会结社"
 JAP_pnr_pacify_social_associations_desc: "1918年发生的白虹贯日事件让新闻报界噤若寒蝉，极左右翼浪人团体和政府与军队中的各种会党都出于自己的利益而或多或少地影响着社会安定。由于《治安维持法》已被废除，我们现在所能做的仅仅是通过行政手段进行劝导来避免他们进一步激进化，并且稳扎稳打地推行我们的相关政策，来感化并孤立这些激进分子。"
