 JAP_pnr_raise_the_banner_of_peace: "高举和平旗帜"
 JAP_pnr_raise_the_banner_of_peace_desc: "123"
 JAP_pnr_creative_socialism: "创造性的社会主义"
 JAP_pnr_creative_socialism_desc: "是创造性的社会主义，不是改良主义。二者是具有去别的，前者充分发挥了人的主观能动性。"
 JAP_pnr_death_to_those_who_sabotage_production: "破坏生产者死！"
 JAP_pnr_death_to_those_who_sabotage_production_desc: "123"
