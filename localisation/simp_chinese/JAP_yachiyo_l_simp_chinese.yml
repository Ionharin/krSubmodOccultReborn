 JAP_pnr_detrick_sharing_program: "德特里克共享计划"
 JAP_pnr_detrick_sharing_program_desc: "最近[ENG.GetName]在格鲁纳德岛进行的测试证明了炭疽芽孢气溶胶在生物战中的有效性，这使得世界再一次将目光聚焦于生物战上。科学毫无疑问是无国界的，我们必须以同样水平的技术武装我们的盟友我们将提供炭疽杆菌、土拉弗朗西斯菌、伯内特考克斯体等生物制剂，以对图谋不轨的国家进行威慑，并在必要时刻对其进行报复。"
 JAP_pnr_dovzhansk_sharing_program: "斯维尔德洛夫斯克共享计划"
 JAP_pnr_dovzhansk_sharing_program_desc: "最近[ENG.GetName]在格鲁纳德岛进行的测试证明了炭疽芽孢气溶胶在生物战中的有效性，这使得世界再一次将目光聚焦于生物战上。科学毫无疑问是无国界的，我们必须以同样水平的技术武装我们的盟友我们将提供马尔堡病毒、正痘病毒、委内瑞拉马脑炎病毒等生物制剂，以对图谋不轨的国家进行威慑，并在必要时刻对其进行报复。"
 JAP_pnr_cha_ichigo: "“茶”一号"
 JAP_pnr_cha_ichigo_desc: "“茶”一号，或称为氢氰酸化学战剂是我们的最新成果，通过将氢氰酸装入易碎的玻璃瓶之中，我们就得到了这种强大的手榴弹。氢氰酸是一种无色液体，在释放后会汽化。它是一种强效神经毒剂，高浓度时可对敌人造成巨大杀伤。十分适合用于清理掩体和其他密闭空间。"
