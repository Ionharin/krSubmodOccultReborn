 JAP_pnr_horse_epidemic_prevention_section_desc: "如果已完成囚笼战术，则效果会强化"
 JAP_pnr_institute_for_epidemic_prevention: "妇女的正当权力"
 JAP_pnr_institute_for_epidemic_prevention_desc: "人是自由的，妇女是自由的，为此妇女可以做任何事情，即便是卖淫，因为她的身体属于她自己。"
 JAP_pnr_cha_ichigo: "产儿限制计划"
 JAP_pnr_cha_ichigo_desc: "[JAP.GetName]长期以来通过向外输出人口的方式来解决过剩人口，抑制贫困的发生。但究其根本，造成这一切的原因是农村地区仍处于劳动社会的思想之中，这使得他们依然维持着“多子多福”的观念，将子嗣视为劳动力和一种有效率的牲口。我们必须在劳动阶层之间推广节育，十个已有孩子的家庭不再生育对贫困抑制的贡献，要比我们一百艘东拓的殖民船更大。"
 JAP_pnr_ko_ichigo: "点燃无产阶级斗争之火"
 JAP_pnr_ko_ichigo_desc: "日本将在巴西建设一个完美的拓殖地，它领先于世界其他地方。移民在那里的生活绝对安全，不会受到任何威胁，而且会成为在日本不敢奢望的大地主，享受如同在家一般的快乐。为此，有必要从根本上改变我们的移民方式……一定要有计划地输送移民。"
