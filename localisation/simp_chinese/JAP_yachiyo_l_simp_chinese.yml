 JAP_pnr_workers_peasants_and_soldiers_united_for_victory_desc: "五一五事件的意外走向，被政府过分渲染的赤色威胁，以及最终流产的《治安维持法》。少了哪一项都或许都没法达成今日的结果。人民的呼唤最终将日本共产党带回了日本社会之中，形成了一个广泛的左翼联盟，而联盟也已许下诺言，将不会辜负日本民众的希望。"
 JAP_pnr_workers_peasants_and_soldiers_united_for_victory11: "促进基层工商业发展"
 JAP_pnr_workers_peasants_and_soldiers_united_for_victory11_desc: "123"
 JAP_pnr_abandon_the_victimhood_view_of_history: "进攻资产阶级的左侧"
 JAP_pnr_abandon_the_victimhood_view_of_history_desc: "如果贸然地宣称摧毁天皇制，粉碎财阀政府，只会引来日本人民和社会各界对我们的联合绞杀。我们必须分析天皇制的实质——天皇是资产阶级分子压迫无产工农的一座神像，因此解决了支撑资本主义的反革命力量，天皇制就自然而然地在日本人民心中瓦解了。当前我们面对的主要的威胁是从左面支撑资本主义的反革命力量——社会民主主义者，他们比更普通的资本主义更迷惑人心，可称得上是使革命衰弱的毒剂，伪装成左翼的萨文科夫分子。"
 JAP_pnr_nationalize_key_sectors: "监督银行与大型企业"
 JAP_pnr_nationalize_key_sectors_desc: "123"
 JAP_pnr_homeland_defense_corps: "爱乡护家团"
 JAP_pnr_homeland_defense_corps_desc: "以往日共的覆灭原因就在于其一方面没有真正地进入到农民和工人中间，而是将马克思主义——布尔什维克主义视为一种知识分子式的娱乐；另一方面没有明确区分外围组织与政党的职责，使得外围组织一旦覆灭，则政党也一同覆灭。"
 JAP_pnr_state_controlled_foreign_trade: "人民的呼声"
 JAP_pnr_state_controlled_foreign_trade_desc: "123"
 JAP_pnr_no_reward_without_labor: "不劳动者无所得"
 JAP_pnr_no_reward_without_labor_desc: "123"
 JAP_pnr_abolish_forced_labor_barracks: "废除章鱼部屋"
 JAP_pnr_abolish_forced_labor_barracks_desc: "123"
 JAP_pnr_rationed_supply: "合作社会"
 JAP_pnr_rationed_supply_desc: "123"
 JAP_pnr_break_the_cycle_of_history: "打破历史循环"
 JAP_pnr_break_the_cycle_of_history_desc: "123"
 JAP_pnr_eradicate_corrupt_bureaucrats: "非暴力之美"
 JAP_pnr_eradicate_corrupt_bureaucrats_desc: "我们面对的主要问题就是低效率的官僚，我们面对的最大问题就是低效率且中饱私囊的官僚。必须将这些系统中的杂质清除出去，国家的运作才能变得更加有效率。为此由工会或是专门的廉政委员会对这些“国家的仆人”进行监控和审计是相当有必要的。"
 JAP_pnr_eliminate_radicals_and_win_over_moderates: "消灭激进，拉拢温和"
 JAP_pnr_eliminate_radicals_and_win_over_moderates_desc: "尽管我们的左翼联盟运动看起来声势浩大，但其依然只是国内的一小部分人形成的。为了充实我们的队伍，我们应该尽可能地发展温和派和同情者加入我们，扩大我们的战线，不论他是自耕农，一般手工业者还是工厂主。但同时我们也要警惕激进分子，绝不能让他们混入，或者是在内部破坏我们的阵线联盟。"
 JAP_pnr_launch_literacy_education: "强化扫盲教育与职业培训"
 JAP_pnr_launch_literacy_education_desc: "123"
 JAP_pnr_against_german_imperialism: "天皇，总罢工，与神话的再现"
 JAP_pnr_against_german_imperialism_desc: "123"
 JAP_pnr_production_pace_setter_campaign: "培养生产革命热情"
 JAP_pnr_production_pace_setter_campaign_desc: "123"
 JAP_pnr_total_revolutionary_perspective: "总体革命观"
 JAP_pnr_total_revolutionary_perspective_desc: "革命即是对背叛者和妥协者以及既得利益者的恐怖，正是因为我们的同志坚持自己的准则，那些软弱的投降主义者才会因为我们的“标新立异”而嘲笑我们。这是他们在精神上害怕的表现，并显然对我们的革命造成了阻碍。我们要保护我们的同志，把恐怖施加在那些抗拒改变的懦夫的肉体之上——扫清一切障碍，大步前进！"
 JAP_pnr_liberate_the_continents_oppressed: "解放大陆被压迫者"
 JAP_pnr_liberate_the_continents_oppressed_desc: "123"
 JAP_pnr_hammer_conquers_all: "铁锤征服一切"
 JAP_pnr_hammer_conquers_all_desc: "我们的社会主义工人运动是一切资本主义和帝国主义者无法达到的典范，它将打破对技术的旧观点，对定额的旧观点，对生产计划的旧观点——并且远远超越了现有的劳动生产率，这将巩固我们的政权，并为更进一步的社会发展作好准备。"
 JAP_pnr_grand_vision: "铁锤征服一切"
 JAP_pnr_grand_vision_desc: "123"
 JAP_pnr_red_jingihaku: "红色神祇伯"
 JAP_pnr_red_jingihaku_desc: "123"
 JAP_pnr_national_transformation: "宣布戒严"
 JAP_pnr_national_transformation_desc: "我们终于排除了那些为祸朝纲的妖人，诛杀了那些只知享乐，蒙蔽圣上的国贼。如今日本国终于重回正轨，维新的大变革将一扫过去的阴霾！"
 JAP_pnr_end_the_current_state_of_chaos: "终结混乱之现状"
 JAP_pnr_end_the_current_state_of_chaos_desc: "123"
 JAP_pnr_i_am_everything: "朕即一切"
 JAP_pnr_i_am_everything_desc: "123"
 JAP_pnr_exorcise_resentment: "祓除怨恨"
 JAP_pnr_exorcise_resentment_desc: "日本确实通过第一次世界大战发展了产业，获得了巨额外汇。但另一方面，个人主义和自由主义泛滥，利己主义、营利主义蔓延开来。结果，家族主义的淳风美俗遭到破坏，为国尽忠的爱国主义被蔑视。劳资携手同心协力经营事业的劳动精神，被煽动劳资对立的左翼主义搅乱，就连政界也被以对立抗争为常态的政党政治所把持。"
 JAP_pnr_additional_military_budget: "追加军事预算"
 JAP_pnr_additional_military_budget_desc: "123"
