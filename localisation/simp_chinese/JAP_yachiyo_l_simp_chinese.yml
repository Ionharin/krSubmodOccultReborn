 JAP_pnr_japanese_style_technocracy: "不眠的制造业垂直整合"
 JAP_pnr_japanese_style_technocracy_desc: "产业重心集中在重工业和军需生产​。旗下拥有日本矿业、日立制作所、户田铸物等企业，1933年创立日产汽车，成为日本第一家真正的汽车企业。其康采恩体系更偏向制造业垂直整合​，而非金融资本的全行业渗透。"
