 JAP_pnr_asia_supreme_alliance: "亚细亚至高同盟"
 JAP_pnr_asia_supreme_alliance_desc: "123"
 JAP_pnr_scientific_japanism: "科学的日本主义"
 JAP_pnr_scientific_japanism_desc: "[JAP.GetName]，一个公元前660年由神武天皇建立并始终延续至今的国家——这不过是神话和臆造，日本是客观存在的某种共同体，是以大和民族为主体，以“一君万民”为社会结构，以海岛为发展环境的实体。这便是对[JAP.GetName]作出的最实事求是，最科学的解读。"
 JAP_pnr_seize_the_right_to_speak_through_armed_force: "三种矛盾"
 JAP_pnr_seize_the_right_to_speak_through_armed_force_desc: "以往的红色社会主义者，尤其是马克思主义者将所有政治问题都还原为阶级矛盾——他们似乎认为自己得到了一把万能的宝刀，在自己妄想的世界中解释一切。阶级矛盾当然存在，但我们也能够观察到当今世界上同时存在着民族矛盾和国家矛盾。"
 JAP_pnr_centralized_national_economy: "国家中心经济"
 JAP_pnr_centralized_national_economy_desc: "123"
 JAP_pnr_public_ownership_of_the_means_of_production: "劳动组合会"
 JAP_pnr_public_ownership_of_the_means_of_production_desc: "123"
 JAP_pnr_crack_down_hard_on_syndicalism: "对工团主义重拳出击"
 JAP_pnr_crack_down_hard_on_syndicalism_desc: "工团主义者们总是为了一己私利反对所有人的公共利益。他们嘴上说要为全人类谋利益，可是他们干的都是最下流，最自私的事情——要让他们知道，没有民族和国家，他们什么都不是；要让他们亲身体验，面对民族的浪潮和国家的力量，他们是多么弱小，多么无能。"
 JAP_pnr_crack_down_hard_on_capitalism: "对资本主义重拳出击"
