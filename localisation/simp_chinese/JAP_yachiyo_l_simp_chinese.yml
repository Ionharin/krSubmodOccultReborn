 JAP_pnr_abandon_the_gold_standard: "金银共同支撑日元"
 JAP_pnr_abandon_the_gold_standard_desc: "沙赫特暂停帝国马克和黄金的兑换启发了我们，或许我们可以更进一步，创造一种黄金和白银双轨制支撑日元的经济体系，这将打破我们的困境，并使得我们能随意调整货币价值而不受市场力量的约束。此外，我们还能借机安抚白银游说集团，将他们拉拢到我们的经济阵营之中。"
