 JAP_pnr_kasumigaseki_diplomacy: "霞关外交"
 JAP_pnr_kasumigaseki_diplomacy_desc: "日本是茫茫大洋上的一座岛屿，外交于她而言乃是一切政务之首。作为亚细亚长子的我们有必要保护其它弱小的亚洲国家，以外交手段为全体亚洲人谋取利益，并适时调节整个亚洲大家庭的各方纷争，维持整体的和谐与平衡。"
