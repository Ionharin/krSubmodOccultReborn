 JAP_pnr_unable_to_move_a_single_step: "寸步难行"
 JAP_pnr_unable_to_move_a_single_step_desc: "战争的现状已经超出了我们一开始的预期，强烈的前线对抗和逐渐崩溃的占领区秩序都预示着我们陷入了战争的泥潭之中，无法轻易脱身。而在短暂的“大战繁荣”后，我国经济也似乎开始变得不太正常。我们必须尽快终结战争，用强大的一击迫使对方屈服。"
