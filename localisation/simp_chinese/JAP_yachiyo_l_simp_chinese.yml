 JAP_pnr_regiment_level_combined_arms: "团级合成化军队"
 JAP_pnr_regiment_level_combined_arms_desc: "毫无疑问，我国面对的的现状是紧张的资源和缺乏的火力。为此大力推行合成化军队师必要的，我们将能在资源紧张的东亚和太平洋战场中占得先机。"
 JAP_pnr_panzergruppe: "机甲集群计划"
 JAP_pnr_panzergruppe_desc: "我们的机甲群将承担起唯一一个任务——速度。机甲部队自启动开始就不会停下来，它们将全速向敌后前进，打乱敌人的战略规划，破坏敌人的后勤系统，并不让敌人在后方设置新防线，从而让他们彻底无法在对应的战区里立足。"
