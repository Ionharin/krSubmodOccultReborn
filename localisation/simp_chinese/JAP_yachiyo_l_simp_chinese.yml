 JAP_pnr_rono_ha: "推行跨党派合作"
 JAP_pnr_rono_ha_desc: "1936年大选有很多需要我们吸取教训的地方：民众迫切地需要变革，而我们惯常的选举操作思路似乎已经失灵了。如果我们没办法赢得帝国议会中的绝对多数，我们就该学会与其它党派结盟从而推行我们的计划。如果目前的政党之间仍因政策争议而相互冲突，而那些共同决定政策的政党则稳扎稳打，毫不费力地将人民引向议会政治的真正本质，那么我相信，大多数拒绝接受目前政治组织的人，无论是极左派还是极右派，都将得到缓解和同化。我深信，大多数拒绝接受当前政治组织的人，无论是极左还是极右，都将得到缓解和同化。"
 JAP_pnr_dissolution_of_parliament: "安抚社会结社"
 JAP_pnr_dissolution_of_parliament_desc: "1918年发生的白虹贯日事件让新闻报界噤若寒蝉，极左右翼浪人团体和政府与军队中的各种会党都出于自己的利益而或多或少地影响着社会安定。由于《治安维持法》已被废除，我们现在所能做的仅仅是通过行政手段进行劝导来避免他们进一步激进化，并且稳扎稳打地推行我们的相关政策，来感化并孤立这些激进分子。"
 JAP_pnr_institute_of_national_socialism: "书面化佃农租约"
 JAP_pnr_institute_of_national_socialism_desc: "自明治时代以来推行的“地租改正”确立了每年固定的现金地租，并占据了我们国家收入很大的一部分，此前政府数次试图通过《小作法》，但都受到了议会中利益团体的阻挠。贸然降低地租将对我国造成极大打击，但我们也必须想办法安抚农民：废止口头上的佃农租约，并强令租约每三年签订一次或许是一种温和的改良方法。"
 JAP_pnr_parliament_social_mass_party_2: "审计监督教育工程"
 JAP_pnr_parliament_social_mass_party_2_desc: "大学令颁布后，高等教育大扩建，学校建筑工程、教学器材采购成为政治家、文部省官僚和各大财阀（如三井、三菱）寻租分赃的温床。寄附金入学"
 JAP_pnr_support_the_construction_of_the_GGO: "支援总督府建设"
 JAP_pnr_support_the_construction_of_the_GGO_desc: "123"
 JAP_pnr_join_hands_to_navigate_economic_turmoil: "携手走出经济动荡"
 JAP_pnr_join_hands_to_navigate_economic_turmoil_desc: "123"
 JAP_pnr_a_back_they_can_trust: "强化工兵队"
 JAP_pnr_a_back_they_can_trust_desc: "我们将落实征召后补助金计划和因病致残后的安抚计划，让我们的士兵把后背放心地交给我们。"
 JAP_pnr_mission_of_movement: "运动的任务"
 JAP_pnr_mission_of_movement_desc: "我们的假想敌是极为擅长通过壕沟和纵深阵地来进行迟滞防守的狡猾对手，为了避免陷入对我们来说极为不利的攻坚战，我们将通过强击彻底破坏敌人的防线，从而打破停滞的战场空间，将整个战场陷入到运动之中再寻找歼灭时机。"
 JAP_pnr_south_manchuria_railway_our_bond_with_the_continent: "满铁，我们与大陆的纽带"
 JAP_pnr_south_manchuria_railway_our_bond_with_the_continent_desc: "满铁在形式上是半官半民的公司，但其实质是代替我国政府在奉天地区乃至整个大陆推行国防及国策而设立的国家机关。为了加强我们对大陆的掌控力，继续授予满铁权力是必需的。"
 JAP_pnr_rice_valley_self_governance_act: "米谷自治管理法案"
 JAP_pnr_rice_valley_self_governance_act_desc: "为解决我国当前面临的农业问题，立宪政友会内部起草了一份相关草案，在最大限度确保政友会的资助者——地主们利益的情况下温和地改善现存的农业劳动关系，这份草案将赋予帝国农会极大的农业补贴和粮食定价权，可以预见的是，那些以城市为基本盘的政党对这份草案一定会提出反对意见。"
 JAP_pnr_leaning_toward_suzuki_faction: "倒向铃木派"
 JAP_pnr_leaning_toward_suzuki_faction_desc: "以铃木喜三郎为首的团体是政友会中最大的派阀，与他们为敌实在太过危险，不仅会损害犬养毅本人的威信，还会导致政友会内部不和。最好还是和他们打好关系，并且更多倾听他们的意见来安抚他们。"
 JAP_pnr_join_forces_with_the_wakuhara_faction: "和久原派联手"
 JAP_pnr_join_forces_with_the_wakuhara_faction_desc: "作为新兴企业家的久原房之助对大多数人来说都是个”神秘人“，他行事太过商人思维，不像是个议员。但这或许也是好事，民众厌倦了一板一眼的人物，而像久原这样有趣的人说不定正对他们的胃口。"
 JAP_pnr_clarification_of_the_kokutai: "部分土地国有化"
 JAP_pnr_clarification_of_the_kokutai_desc: "如今日本的所谓“寄生地主”已成为了经济意义上的诸侯，而我等维新的革命，我等席卷一切，破坏一切的大革命之根本就在于拨乱反正，将有利于大规模耕种的土地和林场国有化，而将适宜个人进行小规模耕种的土地留给我国的劳动者，这才是真正的维新之道。"
 JAP_pnr_promote_cross_party_cooperation: "遣散功勋者"
 JAP_pnr_promote_cross_party_cooperation_desc: "123"
 JAP_pnr_genuine_socialism: "进化的国家"
 JAP_pnr_genuine_socialism_desc: "国家乃权力团体，社会乃平等团体。而天皇陛下即是这些团体的真正主人，这是宪法第一条明确规定的。毫无疑问，先前存在的国体一元论是一种异端邪说，它让天皇成为了人民的仆人，犯下了不敬罪。"
