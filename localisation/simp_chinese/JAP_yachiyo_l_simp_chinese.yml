 JAP_pnr_decaying_life: "腐朽之物"
 JAP_pnr_decaying_life_desc: "日本，这世界上最污浊，最低劣的地方。名为大正民主的虚幻承诺宛如有毒的瘴气般弥漫在这太平洋上的孤岛之中，国民的生命陷入沉滞与颓废，国民的灵魂必须如烈火般燃烧，烧尽一切腐肉——否则它不仅无法拯救亚细亚，也不可能得到其他亚细亚民族信任。"
 JAP_pnr_reshaping_the_nation_of_life: "重塑生命国家"
 JAP_pnr_reshaping_the_nation_of_life_desc: "空想的国际协调主义，自我感动的人道主义，政治上缺乏理想的自然主义，诸如此类的思想开始支配国民之魂的时候，国民已经失去了正视严峻事实，采取与事实相应严肃行动的能力。"
 JAP_pnr_heaven_ever_dwells_within_the_shadow_of_swords: "天国常在剑影之中"
 JAP_pnr_heaven_ever_dwells_within_the_shadow_of_swords_desc: "正式提出了国内改革、打倒阀族、排斥既成政党、重现神武建国精神、实现昭和维新的五大口号，得到了海军舰队派的菊池武夫、小笠原长生资助。值得注意的是，同样是这段时期，大川周明再次改变了他对左翼——或者说以赤松克麿为代表的转向左翼的看法，希望与左翼中的爱国者合作实现国家社会主义运动的统一，以新运动团体为核心实现国家社会主义革命，但由于和赤松、左翼转向派发生运动主导权上的争夺而失败。"
 JAP_pnr_actions_of_self_transcendence: "自我超越的行动"
 JAP_pnr_actions_of_self_transcendence_desc: "奈良朝时代，日本第一次明确地抱持国民自觉的时候，体悟到印度思想精髓的我等先祖认为，国家应是妙法的实现，期待日本犹如佛土的庄严。"
