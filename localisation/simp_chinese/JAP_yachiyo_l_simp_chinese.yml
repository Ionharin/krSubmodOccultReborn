 JAP_pnr_black_monday_arrives_in_the_east: "黑色星期一席卷东方"
 JAP_pnr_black_monday_arrives_in_the_east_desc: "我国虽长期受到[GER.GetName]的经济封锁，但经过近十年的国际财政布局，我们已经和西亚地区的奥斯曼帝国与欧洲腹地的奥地利帝国建立了更广泛的经济合作。这些居间者帮助我们在实质上融入了[GER.GetName]主导的世界经济。然而，这种关系终究将我们也拖入了黑色星期一的灾难之中，这对我们有所好转的经济可能是个打击，但同时或许也是重整国家经济的好机会……"
