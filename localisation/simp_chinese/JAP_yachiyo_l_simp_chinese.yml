 JAP_pnr_black_dragon_society_is_in_action: "灰色之路"
 JAP_pnr_black_dragon_society_is_in_action_desc: "很多事情无法由生活在光明下的正人君子们执行，为此将它们委派给这些一旦离开黑暗就会燃烧的生物就显得十分有必要——国家与这林立的阴谋集团之间的关系就如同政党和它的院外团，富商与他的猎犬群一样，但要小心，如果他们受惊了，恐怕会反过来咬主人一口。"
