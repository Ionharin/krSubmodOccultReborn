 JAP_pnr_organic_productive_state: "有机的生产国家"
 JAP_pnr_organic_productive_state_desc: "123"
 JAP_pnr_new_life_awaited_by_citizens: "国民切盼之新生活"
 JAP_pnr_new_life_awaited_by_citizens_desc: "123"
 JAP_pnr_first_class_social_welfare: "一等社会福利"
 JAP_pnr_first_class_social_welfare_desc: "123"
 JAP_pnr_controlled_capitalism: "受控的资本主义"
 JAP_pnr_controlled_capitalism_desc: "123"
 JAP_pnr_implement_poverty_relief: "落实贫困救济"
 JAP_pnr_implement_poverty_relief_desc: "123"
 JAP_pnr_evolving_nation: "进化的国家"
 JAP_pnr_evolving_nation_desc: "国家乃权力团体，社会乃平等团体。而天皇陛下即是这些团体的真正主人，这是宪法第一条明确规定的。毫无疑问，先前存在的国体一元论是一种异端邪说，它让天皇成为了人民的仆人，犯下了不敬罪。"
 JAP_pnr_partial_nationalization_of_land: "部分土地国有化"
 JAP_pnr_partial_nationalization_of_land_desc: "如今日本的所谓“寄生地主”已成为了经济意义上的诸侯，而我等维新的革命，我等席卷一切，破坏一切的大革命之根本就在于拨乱反正，将有利于大规模耕种的土地和林场国有化，而将适宜个人进行小规模耕种的土地留给我国的劳动者，这才是真正的维新之道。"
 JAP_pnr_vigorous_spirit: "刚健之气魄"
 JAP_pnr_vigorous_spirit_desc: "白种人对我们的文化入侵到了一种可怕的地步，许多日本少年不以强壮和男子气概为荣，反而开始研究穿衣和涂脂抹粉。我们必须逆转自明治时期开始的日本民族之堕落，重新提倡男性的刚健力量。"
 JAP_pnr_emergency_suspension_of_the_constitution: "紧急暂停宪法"
 JAP_pnr_emergency_suspension_of_the_constitution_desc: "如同一位勤劳的主妇尽心尽力地打扫房间，将所有脏污去除而露出房间本来的完美面貌那样，我们的“维新”也是与之相同的政治行动。为实现我们使国家一新的目的，首先要做的就是停止那持续生成脏污的源头——宪法。"
 JAP_pnr_ban_party_politics: "终结党人政治"
 JAP_pnr_ban_party_politics_desc: "自明治天皇开设国会以来，盘踞在国会中的政党都是这个国家的蛀虫。他们重视自身利益胜过国家利益，为自己的一瓶西洋美酒，就能置数万户农民于危险境地。再没有比这更可怕的东西了，我们必须查禁。"
 JAP_pnr_trusts_and_cartels: "托拉斯与卡特尔"
 JAP_pnr_trusts_and_cartels_desc: "我国资本缺乏，工业发展也比列强来说起步更晚。为此建立托拉斯与卡特尔是必要的，面对失去的十年，以及近期发生的黑色星期一，许多不能自给自营的工业已经暴露出它们的脆弱。为此必须要用国家，用全体的力量将它们变成真正的工业组织。"
 JAP_pnr_cities_subsidize_rural_areas: "城市补贴农村"
 JAP_pnr_cities_subsidize_rural_areas_desc: "城市中的小资产阶级和中产阶级无疑正是国家堕落的明证。"
