 JAP_pnr_yamata_no_orochi: "大众的胜利"
 JAP_pnr_yamata_no_orochi_desc: "政治恰恰是这样的东西，在帝国议会的辉煌厅堂中，议员们为了自身政党的利益和自己的钱包而行动；在街边候选人的嘶吼中，对情绪的操控彻底掩盖了对自身政策的解释。而在更深更深的地方，超越政治的团体们也从未放弃其野心。"
 JAP_pnr_baden_baden_group_forward: "新巴登巴登集团前进"
