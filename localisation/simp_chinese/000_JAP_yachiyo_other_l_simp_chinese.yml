 JAP_pnr_short_bow_of_asia_great_vehicle_japan: "亚细亚之短弓：大乘日本"
 JAP_pnr_short_bow_of_asia_great_vehicle_japan_desc: "你们的同伴，既不迷误，又不迷信，也未随私欲而言。那只是他所受的启示，教授他的，是那强健有力的。他端现于东方的最高处，然后渐渐接近而降低，处于两弓的距离，或更近一些。他把他要启示的授予主的仆人，他的心没有否认他所见的。难道你们要为他所见的而与他争论吗？他确已见他再次下降，在极境的酸枣树旁，那里有归宿的乐园。"
