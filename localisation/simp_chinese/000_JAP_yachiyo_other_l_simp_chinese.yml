 ### Ability Power Chemistry Weapon ###
 ABILITY_JAP_PNR_SPECIAL_COUNTERMEASURES: "特殊对策"
 ABILITY_JAP_PNR_SPECIAL_COUNTERMEASURES_DESC: "我军将利用极为珍贵的试作型特殊弹进行实际试验，以验证其在战场上对敌人的实际杀伤效果。"

 ### Ideas ###

 JAP_pnr_housing_finance_agency: "家屋资金局"
 JAP_pnr_housing_finance_agency_desc: "金钱是斗争的神经，藏身房屋的安全周密，是防备组织的要塞——日本共产党\n\n家屋资金局是日本共产党为筹集活动资金所运作的一个地下犯罪网络，由从法兰西公社归来的风间丈吉授意建立，他们通过绑架，诱拐，卖淫，敲诈勒索和出租车业务收拢了大量资金用于“和资本主义斗争”。毫无疑问，这些赤色恐怖分子已成为社会安全所面临的一大严峻问题。\n\n§R如果放任不管，局势可能进一步恶化。§!"
 JAP_pnr_showa_tenno: "今上天皇"
 JAP_pnr_showa_tenno_desc: "$JAP_hirohito_leader_desc$"
 JAP_pnr_farewell_to_the_lost_decade: "向失去的十年告别"
 JAP_pnr_farewell_to_the_lost_decade_desc: "1925年爆发的美国大萧条对我国纺织业造成了巨大冲击，我国政府为此进行了救助和产业结构改革，并努力（以及不情愿地）融入以德意志帝国为首的新全球市场之中，尽管收效甚微，但确实避免了局势进一步恶化。\n\n幸运的是，我国经济已经开始恢复，不过它依然脆弱，任何中度经济动荡都可能导致情况急转直下……"
 JAP_pnr_rikken_seiyukai_factional_struggle: "立宪政友会的派系斗争"
 JAP_pnr_rikken_seiyukai_factional_struggle_desc: "尽管人们尊称犬养毅为伟大的宪政之神，但他实质不过是个勉强维持政友会不分裂的垂死的老人。立宪政友会内部无人承认他的权威，而犬养毅也无法约束政党内部日益激烈的派系斗争。\n\n自原敬被农业民族主义分子暗杀之后，政友会始终缺乏一位有能力的政党领袖来总领全局——以“日式议会斗士”为首的铃木喜三郎和以久原房之助为首的“反铃木派”之间的路线斗争日益严峻，每天都有人宣布退出党派，毫无疑问，立宪政友会内部正在瓦解。"

