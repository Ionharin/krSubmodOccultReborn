### Grey Cardinals ###
 JAP_pnr_grey_cardinals_category: "灰衣主教们的争锋"
 JAP_pnr_grey_cardinals_category_desc: "§Y神武会§!向东京的进军以成功告终。这场纠集了数万人的大游行确实震慑住了宫内省和大多数政党，使他们不得不正视汹涌的民意。"
 JAP_pnr_grey_cardinals_ishiwara_support_tt: "当前§o石原莞尔§!在斗争生产连合中的受支持率为§Y[?JAP_pnr_grey_cardinals_ishiwara_support|0]§!"
 JAP_pnr_grey_cardinals_yasuoka_support_tt: "当前§a安冈正笃§!在斗争生产连合中的受支持率为§Y[?JAP_pnr_grey_cardinals_yasuoka_support|0]§!"
 JAP_pnr_grey_cardinals_okawa_support_tt: "当前§n大川周明§!在斗争生产连合中的受支持率为§Y[?JAP_pnr_grey_cardinals_okawa_support|0]§!"
 JAP_pnr_grey_cardinals_life_impulse_tt: "[JAP_pnr_grey_cardinals_life_impulse_status]"
 JAP_pnr_grey_cardinals_life_impulse_restless: "生命仍在躁动（§Y[?JAP_pnr_con_blind_impulse_of_life|0]§!）"
 JAP_pnr_grey_cardinals_life_impulse_calming: "生命逐渐平静（§Y[?JAP_pnr_con_blind_impulse_of_life|0]§!）"
 JAP_pnr_grey_cardinals_life_impulse_rational: "生命回归理性（§Y[?JAP_pnr_con_blind_impulse_of_life|0]§!）"
 JAP_pnr_grey_cardinals_life_impulse_peaceful: "生命陷入安宁（§Y[?JAP_pnr_con_blind_impulse_of_life|0]§!）"
 JAP_pnr_leap_forward_for_the_holy_war: "为圣战之跃进"
 JAP_pnr_leap_forward_for_the_holy_war_desc: "所谓的斗争生产连合，正是以斗争夺取生产之正当权力，以生产滋养斗争之根本力量。为了真正实现日本民族的大复兴，一场既发生在物质世界，也发生在精神世界的圣战在所难免。但可以见得的是，经过此圣战，我[JAP.GetName]必将焕然一新，走出往日的阴影。"
 JAP_pnr_restrained_enterprises: "约束企业"
 JAP_pnr_restrained_enterprises_desc: ""
 JAP_pnr_increased_production_patriotic_association: "增产报国会"
 JAP_pnr_increased_production_patriotic_association_desc: ""
 JAP_pnr_seoul_asia_university_preparations: "汉城亚细亚大学筹备中"
 JAP_pnr_seoul_asia_university_preparations_desc: "为建立真正的属于亚洲人的高等学府，平等地令生活在整片大陆上的所有有志之士受到教育。我国正与[KOR.GetName]合作，在即将完成的汉城特别市内筹建一所大学。"
 JAP_pnr_spread_the_kingly_way: "为王道之广布"
 JAP_pnr_spread_the_kingly_way_desc: "在天皇陛下的庇护与支持之下，我国国民在此期间精神面貌已焕然一新。为要使我国王道广布于亚洲乃至世界，我国必将在国际之上以合适之姿态应对同列邦的冲突与合作。"
 JAP_pnr_king_milinda: "弥兰王"
 JAP_pnr_king_milinda_desc: "$JAP_hirohito_leader_desc$"
 JAP_pnr_asian_values: "亚洲价值观"
 JAP_pnr_asian_values_desc: "亚洲之女神轻摇着她那装满香料与黄金的篮子，她唱着赞美丰盈的歌谣，走在日头正高的小路上——就是在这里，她被谋杀了。头戴镶满贵重宝石的王冠的欧洲女神在她背后向她举起了利刃。\n\n她切开受害者的脊背，抽出亚洲的脊骨，那是闪闪发亮的蓝柱石；她捏紧亚洲的的心脏，像一个手法熟练的挤奶女工一样把所有血液都挤进她预备好的罐子里。\n\n这位爱好和平，主持世间一切正义的女王就这样乘坐黑色双头鹰离开了，徒留下一团肉块，以及一个只在黄昏时彷徨徘徊，连记忆都被挖去的幽灵\n\n谁来结束这过去的亡灵的哀叹？让我们心怀希望，日本人将首先起来，随后在不久的将来与女神身体的其它部位再度合一，她将消除关于过去的痛苦记忆，真正的亚洲人性将在废墟中重生。到那时，诗人将会高唱他们的歌谣，毫不羞愧地再次宣布他们对亚洲命运，对人类命运的信仰，而人类的命运绝不会再度容忍任何和平的暴行。"
 JAP_pnr_short_bow_of_asia_0: "亚细亚之短弓"
 JAP_pnr_short_bow_of_asia_0_desc: "我抬头看向南方，有一位女王，在瀑布下头戴野百合花织就的花冠，以流动的净水洗去尘埃，纤纤玉手缠着白色的手巾，她软弱的目光如鹰般炽烈，在群山翠绿间手挽一张短弓，这一头乃是瑷珲，那一头乃是仰光。\n\n我听到那忠勇的灵魂在山涧水流中悲哭低语：莫使那猛兽邪魔再为害世间，莫使那恶人再追逼为善者的鲜血。\n\n为此，女神拉紧了这复仇的弓弦。"
 JAP_pnr_vanguard_of_asia: "亚洲之先锋"
 JAP_pnr_vanguard_of_asia_desc: ""
 JAP_pnr_short_bow_of_asia_rissho_ankoku: "亚细亚之短弓：立正安国"
 JAP_pnr_short_bow_of_asia_rissho_ankoku_desc: "诸有井泉池。一切尽枯涸。土地悉碱卤。剖裂成丘涧。诸山皆燋燃。天龙不降雨。苗稼皆枯死。生者皆死尽。余草更不生。雨土皆昏闇。日月不现明。四方皆亢旱。数现诸恶瑞。十不善业道。贪瞋痴倍增。众生于父母。观之如獐鹿。众生及寿命。色力威乐灭。远离人天乐。皆悉堕恶道。如是不善业。恶王恶比丘。毁坏我正法。损减天人道。诸天善神王。悲愍众生者。弃此浊恶国。皆悉向余方。"
 JAP_pnr_short_bow_of_asia_golden_rooster: "亚细亚之短弓：金鸡报晓"
 JAP_pnr_short_bow_of_asia_golden_rooster_desc: "已立志为君子，自当从事于学。凡学之不勤，必其志之尚未笃也。从吾游者，不以聪慧警捷为高，而以勤确谦抑为上。诸生试观侪辈之中，苟有“虚而为盈，无而为有”讳己之不能，忌人之有善，自矜自是，大言欺人者，使其人资禀虽甚超迈，侪辈之中，有弗疾恶之者乎？有弗鄙贱之者乎？彼固将以欺人，人果遂为所欺，有弗窃笑之者乎？苟有谦默自持，无能自处，笃志力行，勤学好问。"
 JAP_pnr_return_to_simplicity: "回归质朴"
 JAP_pnr_return_to_simplicity_desc: "紧张的国际局势与日益尖锐的国内冲突让人们变得烦躁不安。其根本在于西方自由主义思想毒害了本来受到孔孟之道教化，受到儒学教育的我国民众。恰恰是在这种狂热的时刻，我们才应该潜移默化地去影响国民，将他们把对当下的不安引向正确的道路——对国家的建设，对当下一切错误的改造，而不是激进化的暗杀，暴力甚至是战争。"
 JAP_pnr_detached_from_without: "超然于外"
 JAP_pnr_detached_from_without_desc: "不要触碰政治，不要亲自涉及政治。天皇陛下乃是一切当权者的榜样，他超然于政治之外，正是因此才得到了一切。"
 JAP_pnr_healing_decay_0: "医治衰颓"
 JAP_pnr_healing_decay_0_desc: "日本人得了一种很重的疾病，在这种疾病被治愈之前，所谓的亚洲之共荣显然会以其本来面貌的扭曲而呈现。这一切都是因为西方自由主义之毒侵蚀了日本的精神，劫持了政治——这世界上唯一能创造有价值生活的事物。政治乃是一切精神原理的具象化表现，而遭到破坏的政治所结出的一切果子便都是索多玛的苹果。必须让日本人真正意识到神灵的宿命——天皇陛下作为万世一系的国祖本身就是永恒的生命在宇宙中的体现，只有真正切身意识到这一点的[JAP.GetName]才能真正地觉醒，而后才能真正地解救整个亚洲。"
