 JAP_pnr_interservice_budget_bop_category_desc: ""
 JAP_pnr_annual_interservice_budget: "年度陆海军预算"
 JAP_pnr_annual_interservice_budget_desc: "自1927年开始我国海军就展开了相关的裁军计划以减少国防开支支援经济危机；与此同时陆军也进行了裁军计划，意图将多余的预算用于升级军队装备。由于我国资源不足，显然我们无法同时兼顾两方，为此陆海军经常因军事预算分配而大打出手。\n\n当前我们的陆军预算点数为§Y[?JAP_pnr_army_budget_points|0]§!，预计下一年我们将获得§t[?JAP_pnr_army_budget_yearly_gain|0]§!。\n当前我们的海军预算点数为§3[?JAP_pnr_navy_budget_points|0]§!，预计下一年我们将获得§t[?JAP_pnr_navy_budget_yearly_gain|0]§!。"
 JAP_pnr_emergency_army_budget: "紧急陆军军备预算"
 JAP_pnr_emergency_army_budget_desc: ""
 JAP_pnr_emergency_army_budget_points_tt: "借助紧急预算案，我们将获得§O2点§!陆军预算点数，但这无疑是在向大藏省透支我们的信誉，并让他们更倾向于提拔另一方来制衡我们。"
 JAP_pnr_emergency_army_budget_used_this_year: "我们已执行本年度紧急陆军预算案"
 JAP_pnr_emergency_shipbuilding_plan: "紧急造舰计划"
 JAP_pnr_emergency_shipbuilding_plan_desc: ""
 JAP_pnr_emergency_shipbuilding_plan_budget_points_tt: "借助紧急预算案，我们将获得§O2点§!海军预算点数，但这无疑是在向大藏省透支我们的信誉，并让他们更倾向于提拔另一方来制衡我们。"
 JAP_pnr_emergency_shipbuilding_plan_used_this_year: "我们已执行本年度紧急海军预算案"
 JAP_pnr_next_year_interservice_budget_mission: "下一年度陆海军预算博弈中"
 JAP_pnr_next_year_interservice_budget_mission_desc: ""
 JAP_pnr_army_expansion_plan_budget_tt: "§C完成该国策将使我们立刻获得§O1点§!陆军预算用于推进我们的军备恢复计划！§!"
 JAP_pnr_navy_expansion_plan_budget_tt: "§C完成该国策将使我们立刻获得§O1点§!海军预算用于推进我们的军备恢复计划！§!"

### Raids ###

 raid_type_JAP_pnr_operation_night_blossom: "夜间樱花行动"
 raid_type_JAP_pnr_operation_night_blossom_desc: "一架战略轰炸机将从所罗门海附近的航空基地起飞，其将在敌人的关键城市上空投下特殊弹，以执行代号：夜间樱花行动。参谋部相信此举将能对这些白人鹰犬造成重创，并有助于我国迅速取得对帝国主义作战的胜利。"

### Dynamic Modifiers and Modifiers ###

 JAP_pnr_pandemic_modifier: "大流行"
 JAP_pnr_pandemic_modifier_desc: "一场突如其来的瘟疫导致此地陷入公共卫生危机。"
 JAP_pnr_red_hands_modifier: "赤色魔手"
 JAP_pnr_red_hands_modifier_desc: "日本工人和农民们，富士山已经沉没，邪恶的天皇已经夹着尾巴逃跑了，现在是时候进军，彻底颠覆资产阶级了！——日本共产党\n\n尽管我国出于各种原因没有深入到德意志帝国主导的世界市场之中去，但随着黑色星期一的爆发，金融危机还是传导到了我国，并且对我们刚刚稍有起色的经济施加了一记重拳。\n\n日本共产党正是抓住了这个机会，以“岸田国中生事件”为代表加快了他们对社会的破坏行动。大量日共和激进分子被动员出来，对我国政府发动从合法游行到暴力犯罪的广泛攻击，§R我们必须向天皇陛下证明我们有能力将这些犯罪者绳之以法，否则我们就不得不倒台，或者更糟……§!"
 JAP_pnr_lost_decade_nightmare_modifier: "失去十年的梦魇"
 JAP_pnr_lost_decade_nightmare_modifier_desc: "在过去十年里我们通过调整贸易策略重新振兴了我们的经济，而就在我们将要向过去的灰暗告别的时候，这个难缠的幽灵又一次一把抓住了我们，不想让我们离开。"
 JAP_pnr_destruction_and_creation_modifier: "毁灭与缔造"
 JAP_pnr_destruction_and_creation_modifier_desc: "自古以来，人类的发展就处于不断地毁灭之中，而能够利用毁灭之后的断壁残垣创造出崭新事物的人则被称为“革命者”。啊，革命者，多么美好的名字，当人们说出这个名字之后，似乎天地之间再没有比它大得多的头衔了！正因如此，许多阴险小人，流氓和破坏狂经常窃取“革命者”的皮囊，他们穿戴上这件并不符合自己的衣服便粉墨登场了。然而他们只知破坏，却从未掌握缔造的真谛，这使得他们见到真正的革命者之后，便立刻化成了一抔尘土。\n\n为了实现维新，对错误事物的§R毁灭§!必不可少，但同时也不能忘记§G缔造§!本身。而假使我等要实现完美的维新之政治，那么谨慎结合这两种力量，确保其相互制衡则为必须谨遵之教条。若是令§R毁灭§!将国家焚烧殆尽，那骇人的狂热或许终将蔓延至整个世界；若是连旧房子都未推倒便开始大肆§G缔造§!，那最后形成的也不过就是更臃肿的存在。惟有令§R毁灭§!与§G缔造§!相平衡，令黑与白这两种力量相持，才能实现真正的§M革新§!。"
 JAP_pnr_lost_decade_disabled_ideas_tt: "£GFX_trigger_yes 允许分配内阁成员和修改法律"
 JAP_pnr_fleet_plan_modifier: "[JAP.GetName]舰队方案"
 JAP_pnr_fleet_plan_modifier_desc: "[JAP.GetName]，亚细亚的长子，而他的海军同样也是唯一一支在亚洲由亚洲人所拥有的强大舰队力量。回忆往昔荣耀，世界大战爆发之初，[JAP.GetAdjective]海军便一举夺取并暂时解放了[GER.GetName]在太平洋的大部分领土。然而随着他们在战争中取得胜利，灾难和苦痛也随之降临到我国荣耀的海军头上。\n\n德国殖民者对我们恬不知耻的封锁严重影响了我们的舰队建造计划，而在英法相继爆发的工团主义运动则令当时的政客们对是否继续加强我国海上国防，建成庞大海军的计划投下了反对票。帝国陆军从中作梗彻底摧毁了我们的愿景，然而十年之后，我国终于又一次意识到了海军的重要性。[JAP.GetAdjective]海军将再次遨游于蓝水之上，是的，[JAP.GetAdjective]海军将再次遨游于蓝水之上！"
