 JAP_pnr_gozen_arbitration_conference_active: "御前仲裁会议召开中"
 JAP_pnr_operation_launched_modifier: "$JAP_pnr_offensive_rescript$"
 JAP_pnr_operation_launched_modifier_desc: "奉陛下大命，该地区已被划为需重点攻下的关键战区。为我国家之大业与我民族之尊严，前进！"
 JAP_pnr_imperial_progress: "皇室巡幸"
 JAP_pnr_imperial_progress_desc: "宫内将为陛下安排一次全国范围内的出巡，借助巡幸陛下一方面可以深入了解日本的现状，另一方面则可以巩固自身的统治并宣示自己对政权的掌控力。"
 JAP_pnr_gozen_arbitration_conference: "御前仲裁会议"
 JAP_pnr_gozen_arbitration_conference_desc: "大命已经下达，天皇召集诸官僚与议会代表出席仲裁会议，对积压的多项特别议程展开质询和御裁断。"
 JAP_pnr_offensive_rescript: "进攻诏敕"
 JAP_pnr_offensive_rescript_desc: "原先所谓的“奉敕大命”乃是夹杂在陆军和海军的“大陆命”和“大海令”中的天皇作为统帅象征不得不发出的命令，由大本营陆军部或大本营海军部起草，经天皇批准后，由参谋总长或军令部总长传达给受令者。但如今这“大命”已成为真正具有重量的东西，如果天皇如此命令，军队就必须集结兵力实现这目的。"
 JAP_pnr_offensive_rescript_tt: "当决议完成时，为与我们交战的所有敌人的相邻地区添加§Y$JAP_pnr_offensive_rescript$§!。\n"
 JAP_pnr_prepare_decisive_fleet_battle: "准备舰队决战"
 JAP_pnr_prepare_decisive_fleet_battle_desc: "$JAP_pnr_offensive_rescript_desc$"
 JAP_pnr_build_military_factory: "建设军用工厂"
 JAP_pnr_build_military_factory_desc: ""
 JAP_pnr_build_civilian_factory: "建设民用工厂"
 JAP_pnr_build_civilian_factory_desc: ""
 JAP_pnr_build_dockyard: "建设船坞"
 JAP_pnr_build_dockyard_desc: ""
 JAP_pnr_attend_public_events: "出席公共活动"
 JAP_pnr_attend_public_events_desc: "在必要时刻出席公共活动，在公众面前展现自身对他们的关心有助于维持自己和民众之间的联系，并能借助这些民意反过来约束政府以及军队的诸多言行。"
 JAP_pnr_production_rescript: "生产敕语"
 JAP_pnr_production_rescript_desc: "陛下已赐予诸臣民一道敕语：希望各位能够以国家之强健，生产之丰富为第一要务。"
 JAP_pnr_love_farmers_rescript: "爱农敕语"
 JAP_pnr_love_farmers_rescript_desc: "陛下已赐予诸臣民一道敕语：农事乃国家之根本，惟愿米谷丰产，风调雨顺，更望社会各界体恤农民之苦，在必要时刻施以援手。"
 JAP_pnr_frugality_rescript: "勤俭敕语"
 JAP_pnr_frugality_rescript_desc: "陛下已赐予诸臣民一道敕语：我国臣民之精神在于坚忍不拔，不放纵口腹的欲望，也不浪费珍贵的白米，即便财宝已经堆积如山，也不会过上奢侈无度的堕落生活，而是为了不时之需而一直储存着它们。"
 JAP_pnr_morale_rescript: "士气敕语"
 JAP_pnr_morale_rescript_desc: "陛下已赐予诸位臣民一道敕语：诸位将士的爱国之心实在令我感到喜悦和骄傲，为了国家和正义而战斗，这世界上没有比这更大的了，正是因为此，你们才是国家的宝物，社会的栋梁。"
### Kokoshiha ###
 JAP_pnr_japans_great_development_bonus_tt: "§2完成该§Y国策§!后，我们每有十座£GFX_civ_factory 民用工厂，就能永久额外获得5£GFX_steel_texticon ，1£GFX_tungsten_texticon 的战略资源。§!"
 JAP_pnr_kaikosha_modifier: "偕行社"
 JAP_pnr_kaikosha_modifier_desc: "偕行社始创于1877年，是[JAP.GetName]陆军军官的联谊社交组织。这里同时也是被时人错误地称为“统制派”的真正起源地——1931年，田中清、四方谅二、永田铁山和池田纯久四人在偕行社中聚会，形成了一个力图改革国内政治的秘密团体。其成立的目的便是研究国内发生的诸多阴谋事件和未遂政变，并从中推演出改革社会的方法。这被后人称为“统制派”的集体奉行利用合法手段达成革新，将破坏活动视为无用的累赘。他们相信[JAP.GetName]所急需的东西乃是“建设工作”。总的来说，他们是一群温和的改良军官。§R至少统制派从来没有策划过政变和阴谋……对吧？§!"
 JAP_pnr_kaikosha_modifier_tt: "当前§o偕行社§!对§Y匡革庶政会§!的£GFX_legitimacy 权力辐射为：§G[?JAP_pnr_kaikosha_power|0]§!\n当前偕行社的头面人物为：\n§q永田铁山§!\n§q田中清§!\n§q四方谅二§!\n§q池田纯久§!\n"
 JAP_pnr_ugaki_group_modifier: "宇垣集团"
 JAP_pnr_ugaki_group_modifier_desc: "宇垣集团所指的乃是围绕在宇垣一成这位“大御所”身旁的，或早期受他提携而如今身居高位的人物所组成的小团体。如果说大多数军人是出于对政党政治的现状的不满才转而支持匡革庶政会的话，那么他们很快就会发现这位宇垣一成实际上不过是穿上了军装的党人。宇垣一成一方面以积极态度和各政党进行接触来获得信息，另一方面则暗中将这些信息输送给集团中的其他人来为整个团体夺取利益。§R在这一点上，他们或许可以称得上是学会了党人恶劣伎俩的军人组织。§!"
 JAP_pnr_ugaki_group_modifier_tt: "当前§P宇垣集团§!对§Y匡革庶政会§!的£GFX_legitimacy 权力辐射为：§G[?JAP_pnr_ugaki_group_power|0]§!\n当前宇垣集团的头面人物为：\n§N宇垣一成§!\n§N阿部信行§!\n§N南次郎§!\n§N梅津美治郎§!\n"
 JAP_pnr_seiyosha_modifier: "星洋社"
 JAP_pnr_seiyosha_modifier_desc: "星洋社或许是革新军官中最令人感到迷惑的团体，假如全盘接受所谓“统制派”和“皇道派”之分，那他们应该被称为“宴会派”——这主要是因为其成员大多泡在东京最繁华地区的高级餐厅之中整日寻欢作乐。其首脑桥本欣五郎在奥斯曼帝国期间受到了青年土耳其党的影响，渴望借助革新主义的军队打破保守的旧秩序。这使得其成员反复地发动“政变”，却几乎在每一次政变之前就因为酒精的作用把计划在大庭广众下悉数说出而导致失败。§R与其它团体不同，星洋社中并非只有陆军人员，一些海军参谋也加入到了该组织之中。§!"
 JAP_pnr_seiyosha_modifier_tt: "当前§n星洋社§!对§Y匡革庶政会§!的£GFX_legitimacy 权力辐射为：§G[?JAP_pnr_seiyosha_power|0]§!\n当前星洋社的头面人物为：\n§p桥本欣五郎§!\n§p重藤千秋§!\n§p加藤宽治§!\n§p冈敬纯§!\n"
 JAP_pnr_end_the_tide_of_chaos: "结束混乱之潮"
 JAP_pnr_end_the_tide_of_chaos_desc: "帝国议会议员，职业革命家和热血官兵们嘴上说着要给[JAP.GetName]带来全新的未来，结果他们做的只是让现状更为混乱。这些或陷入疯狂，或沉迷金钱，或陶醉功名的醉鬼们皆已心满意足地从牌桌上离去，[JAP.GetName]和它的人民现在需要的是能够收拾这张桌子的清洁者，以及能把这些酗酒狂徒教训一顿的尽责警察。"
 JAP_pnr_cabinet_planning_board: "中央企画院"
 JAP_pnr_cabinet_planning_board_desc: "为了扩大我们的横向战线，我们从各个政治部门中招揽了一批有“理性思维，对数字感兴趣的”新官僚，并设置了新机构中央企画院。在我们的共同努力之下，日本将通过最理性的方式实现它的强化。"
 JAP_pnr_census_underway: "人口普查进行中"
 JAP_pnr_census_underway_desc: ""
 JAP_pnr_command_politics_0: "指令政治"
 JAP_pnr_command_politics_0_desc: "军队并非只能依靠暴力来得到它所需要的东西，难道内阁之中的陆军大臣就不是文官吗？毫无疑问，借助这位“文官”，我们便能从议会之中以操控陆军大臣为方法，合理地为军队谋取利益。"
 JAP_pnr_command_politics_1: "$JAP_pnr_command_politics_0$"
 JAP_pnr_command_politics_1_desc: "$JAP_pnr_command_politics_0_desc$"
 JAP_pnr_command_society: "指令社会"
 JAP_pnr_command_society_desc: "为了建成理性且合理的秩序国家，为了确保我国有限的资源能够悉数运用于当前最急需的领域，严格执行命令是必须具有的美德，如果无法做到，那么就应该对其进行教育，如果教育也无法令他学会，那么就让社会本身将他淘汰。"
 JAP_pnr_state_led_business_contracts_0: "国家主导的商业合同"
 JAP_pnr_state_led_business_contracts_0_desc: "毫无监管的资本主义只是在无序地进行扩张，哪里的利益巨大，他们就会奔向哪里。而在这无穷尽的奢华之中最终引爆社会危机和经济的毁灭。政府必须尽到指导这些企业发展的义务。"
 JAP_pnr_state_led_business_contracts_civilian: "$JAP_pnr_state_led_business_contracts_0$：民用契约"
 JAP_pnr_state_led_business_contracts_civilian_desc: "$JAP_pnr_state_led_business_contracts_0_desc$"
 JAP_pnr_state_led_business_contracts_military: "$JAP_pnr_state_led_business_contracts_0$：军用契约"
 JAP_pnr_state_led_business_contracts_military_desc: "$JAP_pnr_state_led_business_contracts_0_desc$"
 JAP_pnr_state_led_business_contracts_change_m_tt: "§1我国经济受到§Y中央企画院§!调控，当£GFX_civ_factory 多于£GFX_mil_factory时，该合同会发生变化。§!"
 JAP_pnr_state_led_business_contracts_change_c_tt: "§1我国经济受到§Y中央企画院§!调控，当£GFX_mil_factory 多于£GFX_civ_factory时，该合同会发生变化。§!"
 JAP_pnr_rational_army: "理性的军队"
 JAP_pnr_rational_army_desc: ""
 JAP_pnr_ministry_of_war_planning_0: "战争计画省"
 JAP_pnr_ministry_of_war_planning_0_desc: "我们终结了长期以来参谋本部和陆军省之间的分裂问题，尽管由于人员合并和职位安排导致二者合作起来依然有些冲突，但至少我们在制度上彻底将其合理化了。"
 JAP_pnr_ministry_of_war_planning_1: "$JAP_pnr_ministry_of_war_planning_0$"
 JAP_pnr_ministry_of_war_planning_1_desc: "$JAP_pnr_ministry_of_war_planning_0_desc$"
 JAP_pnr_rational_clock: "理性的时钟"
 JAP_pnr_rational_clock_desc: "在中央企画院中，数百名专家基于海量数据进行大量计算之后得出了制定了一套弹性的，可自我调节的时间表，从炼钢厂中工人的工作，到小学校中学生们的休息时间，一切都用理性之尺计算完毕了。我们正在迈向理性的社会，我们正在迈向日本社会的最终形态。"
 JAP_pnr_greater_japan_social_control_institute: "大日本社会统制所"
 JAP_pnr_greater_japan_social_control_institute_desc: "我们所处的这个世界本身就是由海量的数据和变量组成的，战斗机俯冲时机枪射击的角度，战争中相持双方的兵力对比，铁的含碳量，中学生的午餐便当，关于这个世界的信息和真相正在源源不断地从这些现实的实体中涌出。只要掌握了这些，那么想要达成自身所期望的目的就变得极为简单。通过对社会施行普遍且全面的统制，我们就可以将整个社会置于我们面前的报告书中，而任何东西都无法从中逃离。"
 JAP_pnr_war_on_poverty: "向贫乏开战！"
 JAP_pnr_war_on_poverty_desc: "我国资源极为贫乏，这是不争的事实。在现状改善之前，我们必须大力发展金属回收技术。这些废铜烂铁之中隐藏着珍贵的宝物，而幸运的是，国际上大多数人都没有意识到它们每天都在丢弃掉这些财富。这导致我们能以极为低廉的价格从海外进口废弃金属。"
 JAP_pnr_purified_and_cleansed: "肃正一清"
 JAP_pnr_purified_and_cleansed_desc: "笼罩在八洲之上的混沌妖云终究被我们拂去，[JAP.GetName]经过我们的改造已变成完美的理性之国，我们抹去了所有不合理的事物，并将社会的各个角落置于政府的完全统制之下，强大的工业和军事基础在我等企画院的同袍夜以继日的工作下也已完全建立。在这近乎于完美的体制的支配之下，如今再无任何国家能够与我们匹敌，而我们也将重返世界舞台，证明自己不仅是亚细亚地区之首席，更是世界之第一！"
### NatPop ###
 JAP_pnr_scientific_socialism_0: "科学社会主义"
 JAP_pnr_scientific_socialism_0_desc: "“科学的日本社会主义”是赤松克麿所主张的一种崭新的“社会主义模式”。工团主义者们聚焦于仿照英法进行经济行动，而布尔什维克主义者们则期望能够在政治上有所作为。科学社会主义超越了他们，彻底回避了空虚的议论，而着眼于有实际效果的现实政策。\n\n[JAP.GetName]的所有无产阶级运动在科学社会主义诞生之前都带着盲目的舶来感，其根本不植根于日本的民族与国家框架之内。如果日本真的想取得变革，就要从实际出发科学地分析社会——并且如果人们这么做了，就会不约而同地赞同赤松克麿的主张：所有人和国家都有义务要求生存的平等权利。无法设想只有[JAP.GetName]被限制于一个岛国，并被要求必须为所谓的世界和平做出牺牲。"
 JAP_pnr_scientific_socialism_1: "$JAP_pnr_scientific_socialism_0$"
 JAP_pnr_scientific_socialism_1_desc: "$JAP_pnr_scientific_socialism_0_desc$"
 JAP_pnr_scientific_socialism_2: "$JAP_pnr_scientific_socialism_0$"
 JAP_pnr_scientific_socialism_2_desc: "$JAP_pnr_scientific_socialism_0_desc$"
 JAP_pnr_japanese_social_economy_0: "日本式社会经济"
 JAP_pnr_japanese_social_economy_0_desc: "我国资源匮乏，某种意义上讲真可谓是世界万国之中的真正“无产者”。正是因为此才要凝聚现有的全部力量来打破这种不公。就像古时的贫民举家之力打造一把草叉，和千千万万这样的家庭一起拿着自己全部的资产和自己的性命去反抗压迫那样。于今日的国家而言，那便是由国家本身对经济领域的全面支配。"
 JAP_pnr_japanese_social_economy_1: "$JAP_pnr_japanese_social_economy_0$"
 JAP_pnr_japanese_social_economy_1_desc: "$JAP_pnr_japanese_social_economy_0_desc$"
 JAP_pnr_territorial_liberation_war: "领土解放战"
 JAP_pnr_territorial_liberation_war_desc: "正如我们反复强调的那样，阶级压迫不仅存在于人与人之间，更存在于国家与国家之间。如果不能粉碎国家之间的压迫，解放本就属于我们自己的领土，那便很难再谈论所谓国家的进步和全世界的团结与解放。"
 JAP_pnr_patriotic_education: "爱国主义教育"
 JAP_pnr_patriotic_education_desc: ""
 JAP_pnr_flag_is_a_weapon: "旗帜是武器"
 JAP_pnr_flag_is_a_weapon_desc: "我们心怀对国家和民族的无限热爱，我们继承并发扬了历史上第一个社会主义国家——巴黎公社的精神遗产。就像过去巴黎公社面对无数反动分子那样，今天作为社会主义国家的我们也被一群帝国主义者在经济和外交上封锁了。但我们绝不会辜负这面旗帜，在旗帜之下，我们将粉碎暴君对我们的奴役，保护人民的正当利益，保护身为真正无产阶级国度的正当利益。他们将会知道，红色太阳的烈火将把一切束缚的锁链悉数焚尽！"
 JAP_pnr_uprising_of_the_japanese_nation: "日本民族的奋起"
 JAP_pnr_uprising_of_the_japanese_nation_desc: "在我们那些出于“与众不同的”猎奇感而成为社会主义者的同袍中总是有人发出这样的声音：要为了某某国家的同志，为了某某国家的解放而奋斗。心怀热血的青年总是心系天下，这是值得赞扬的精神。但他们却总是想把[JAP.GetName]作为其他素未谋面的“同志”的一把武器，一块“铺路石”——这不过是另一种皇道派的“铺路石主义”的表现罢了。日本民族为且只为日本民族而奋斗，就算真的有要保卫的东西，那也是要保卫日本民族本身的尊严，[JAP.GetName]本身的延续，以及作为国家象征，民族纽带的天皇陛下的安全。"
 JAP_pnr_uprising_of_the_japanese_nation_anti_syndicalist: "$JAP_pnr_uprising_of_the_japanese_nation$"
 JAP_pnr_uprising_of_the_japanese_nation_anti_syndicalist_desc: "$JAP_pnr_uprising_of_the_japanese_nation_desc$"
 JAP_pnr_uprising_of_the_japanese_nation_anti_german: "$JAP_pnr_uprising_of_the_japanese_nation$"
 JAP_pnr_uprising_of_the_japanese_nation_anti_german_desc: "$JAP_pnr_uprising_of_the_japanese_nation_desc$"
 JAP_pnr_revolution_of_justice: "正义的革命"
 JAP_pnr_revolution_of_justice_desc: "除了我国之外，世界上还有许多受到了压迫的无产阶级国家，其中一些国家可以和我们联合起来一起反抗不公正的社会秩序，但仍有许多国家仍畏惧鞭子和锁链的痛苦，只能在奴役中发出将死的呻吟。我们将会证明我们有能力发动一场对所有压迫者的革命，我们将证明我们才是真正的斯巴达克斯，我们是所有“角斗士”的朋友，而在我们的帮助下，他们终将走出斗兽场，砍下那些贵族的头颅，并借此化身为完全的自由人。"
### Kokumin Domei ###
 JAP_pnr_awakened_nation_0: "国民之觉醒"
 JAP_pnr_awakened_nation_0_desc: "我国的代表乃是天皇陛下，但构成国家的一切根本却是天皇陛下的各位臣民——国民生活的水平恰恰是我国是否强大的例证。正因为此，我们呼吁国民们团结起来，为了开拓国民生活的出路，在此非常时期均等地付出努力和牺牲。国民们应当同阶级的特权进行斗争以废止它们，国民们应当同那些“阶级斗争者”进行斗争来避免他们破坏国民生活。惟有大家一同前进，凝聚成一个整体，所有人的生活才能获得保障，而国家本身也将因此而获得活力。"
 JAP_pnr_awakened_nation_1: "$JAP_pnr_awakened_nation_0$"
 JAP_pnr_awakened_nation_1_desc: "$JAP_pnr_awakened_nation_0_desc$"
 JAP_pnr_awakened_nation_2: "$JAP_pnr_awakened_nation_0$"
 JAP_pnr_awakened_nation_2_desc: "$JAP_pnr_awakened_nation_0_desc$"
 JAP_pnr_totalitarian_principle: "全体主义原则"
 JAP_pnr_totalitarian_principle_desc: "散漫的个人主义和自由主义带给[JAP.GetName]的只是混乱，在日益恶化的世界局势之中，我国人民必须团结起来，以最大的程度进行相互合作。世上有什么事情比人们同时为一个理想，一个目的而奋斗更伟大呢？通过把许多普通男女凝聚在一起，一个崭新的个体就将诞生。这些个体之中的许多细胞——组成它的“器官”将获得比他们单独行动时强大数百，数千倍的力量。受到这种团结的影响，国家将变得无以伦比的强大，任何困难都无法撼动这个巨人达成自己所意欲达成的目的。"
 JAP_pnr_lose_the_collective_lose_everything: "失去集体失去一切"
 JAP_pnr_lose_the_collective_lose_everything_desc: "个人无法脱离集体存在，一如国民无法脱离国家存在。正是因为此，作为个体的国民无论做什么都要为国家的大计着想，这样一来他便可以被称为模范的国民，值得尊敬的人。"
 JAP_pnr_spiritual_bond: "精神纽带"
 JAP_pnr_spiritual_bond_desc: "日本人之所以为日本人，不止是因为生活在[JAP.GetName]的土地上，更是因为他在灵魂深处与[JAP.GetName]之间产生了难以分割的精神纽带，一种流淌在血脉中的祝福和标记。正是这种精神纽带塑造了日本人本身。"
 JAP_pnr_tacit_secret_cooperation: "心照不宣的秘密合作"
 JAP_pnr_tacit_secret_cooperation_desc: ""
 JAP_pnr_banquet_ended: "宴会终结"
 JAP_pnr_banquet_ended_desc: ""
 JAP_pnr_economic_planning_agency: "经济企画院"
 JAP_pnr_economic_planning_agency_desc: "不能再容许市场以所谓“自由”之名来持续破坏我国的经济了，国家将负起责任，以生产力的迅速扩大和强化为目标来管理我国的经济发展。"
 JAP_pnr_demand_guided_economy: "需求指导经济"
 JAP_pnr_demand_guided_economy_desc: "在国家施展强有力的大手调控经济的当下，关于经济的诸多科学原则就这样显现在我们面前了。我们基于社会当前需要适时调整经济发展方向的模式将最大效率地利用我们手中的工业资源，并促进我国经济快速，高质量的发展。"
 JAP_pnr_firm_grip_of_the_state: "紧握国家之手"
 JAP_pnr_firm_grip_of_the_state_desc: "一个又一个人聚集在名为“国家”的大房子之中，这些人正是国家的家庭成员。他们设计内部装潢，安排房子的扩建，在关键时刻还要修补这栋房子偶尔的破损。所有这一切都是为了确保房屋的坚固，确保他们能有一个安全，信赖，可靠的生活地点。为此人们不吝惜于献出自己所拥有的一切来实现这一目的。国家将回应他们，国家将支配他们，国家将计划他们，国家将保护他们。国家将站在他们身前为他们遮风挡雨，国家将令他们再无后顾之忧。"
### Shakai Taishuto ###
 JAP_pnr_respect_unity: "尊重团结"
 JAP_pnr_respect_unity_desc: "国家的正常运转，生产的正常进行基于一个最基础的原则，那便是对每个人的自由的保障和承诺，以及每个人基于此对其他人自由的尊重。"
 JAP_pnr_employment_security_office: "职业安定所"
 JAP_pnr_employment_security_office_desc: "社会上存在着许多私人运营的职业介绍所，然而它们基本仅局限于当地的职业空缺，更像是一种地方互助组织。为了最大化利用我国的人口资源，也是为了安定社会本身，由国家亲自管理的职业介绍所显得尤为重要。"
 JAP_pnr_trade_unions_for_peace_0: "为和平而存在的工会"
 JAP_pnr_trade_unions_for_peace_0_desc: "工会存在的意义即是为工人的正当利益发声，而不是策动破坏，让工人反过来摧毁自己赖以为生的活计，甚至将他们牵扯进政治的组织。通过工会，企业主将能听到工人们对劳动环境和劳动报酬的意见，并且解决这些问题，这就是工会存在的本来意义。"
 JAP_pnr_trade_unions_for_peace_1: "$JAP_pnr_trade_unions_for_peace_0$"
 JAP_pnr_trade_unions_for_peace_1_desc: "$JAP_pnr_trade_unions_for_peace_0_desc$"
 JAP_pnr_national_health_insurance: "国民健康保险"
 JAP_pnr_national_health_insurance_desc: "尽管医疗保健意识已在城市地区生根发芽，但农村居民依然对此基本没有概念——这主要是由于农村地区长期经济萧条导致他们无力就医，也毫无预防医学的相关知识。为此设立国民健康保险，由政府来提供医疗保障就显得尤为必要。"
 JAP_pnr_listening_and_helping_hand: "倾听与援手"
 JAP_pnr_listening_and_helping_hand_desc: "一个合格的政府应当做到倾听国民的真正呼声，并向那些需要帮助的团体伸出切实有效的援手。"
 JAP_pnr_worker_peasant_front: "工农阵线"
 JAP_pnr_worker_peasant_front_desc: "工人和农民，在西方国家里通常将后者视为剥削者和有产者，因此将两者对立起来；而在我国却完全不同，我们可以注意到工人与农民阶级都遭受剥削阶级和资本的压迫，具有根本利益的一致性。这使得这两者天然地就能够结成联合阵线。"
 JAP_pnr_worker_peasant_soldier_front_supreme: "工农兵阵线至高无上"
 JAP_pnr_worker_peasant_soldier_front_supreme_desc: "在工农联盟之外，还存在着渴望着变革力量的军队势力。显然军队势力所指的是由广大群众组成的基层士兵。神兵队事件、血盟团事件甚至是五一五事件，这些层出不穷的暴力事件都证明这些军人也在渴望着变革，渴望着向剥削阶级发动革命。因此他们显然也是工农联盟的好朋友，是值得团结的对象。只要将工人、农民和军人这三股力量凝聚在一起，打倒日本资产阶级，实现真正的社会主义就决不是一种空谈。"
 JAP_pnr_mass_labor_movement_0: "大众劳动运动"
 JAP_pnr_mass_labor_movement_0_desc: "我们已开展一项歌颂工人和农民等劳动者，反对“寄生者”的宣传运动。"
 JAP_pnr_mass_labor_movement_1: "$JAP_pnr_mass_labor_movement_0$"
 JAP_pnr_mass_labor_movement_1_desc: "$JAP_pnr_mass_labor_movement_0_desc$"
 JAP_pnr_price_controls: "价格控制"
 JAP_pnr_price_controls_desc: ""
 JAP_pnr_run_to_peace_and_tranquility: "向和平与安宁奔去"
 JAP_pnr_run_to_peace_and_tranquility_desc: "没有人渴望战争，就算是军队也是出于国防和自卫的需要而不得以地投入到战争之中。我们是爱好和平的国家，我们的所有骚动都是因为失去了稳定所导致的，而政府已经承诺会通过合理且合法的手段将和平与安宁带回到这个国家之中。通过财富的重新分配和社会保障的逐渐拓宽，我国国民将真正亲身体验到他们的生活变得越来越好，而他们也可以毫无后顾之忧地从事他们的工作，从而一同建设[JAP.GetName]，届时我们所取得的成就将令我国成为国际间最受尊敬的成员之一。"
 JAP_pnr_war_of_social_revolution: "社会革命的战争"
 JAP_pnr_war_of_social_revolution_desc: "没有人渴望战争，但内部的阶级敌人和外部的国际压迫之间的联合却逼得[JAP.GetName]的人民们拿起武器来发动战争。从“三国干涉还辽”事件到帝国主义者们对我国的海上封锁，所有这些来自外部的欺侮都毫无疑问地引起了我国人民的愤慨；而在内部，资本主义因失去了外部利益，便向内继续压迫无产的工农兵们，这毫无疑问会激起我们的反抗。在内部，我们将与一切压迫者斗争，用国家的权力将他们约束在樊笼之内；在外部，我们是正义之师，为了抵抗帝国主义对我们的外来压迫，军队必将代替人民在国际间发动革命，凭公理与正义讨回我们失去的合理利益，并将其它国家的人民从他们的控制之中解放出来。[JAP.GetName]人民万岁！[JAP.GetName]工人万岁！[JAP.GetName]士兵万岁！"
 JAP_pnr_harmonious_economy: "调和经济"
 JAP_pnr_harmonious_economy_desc: "我国经济的重点在于“调和”，基于需求来进行温和的分配，来使各方面都能取得稳定而逐步的发展。"
 JAP_pnr_model_of_oriental_socialism: "东方社会主义的典范"
 JAP_pnr_model_of_oriental_socialism_desc: "奉天皇陛下之信赖，在社会大众党不遗余力的规划与行动之下，[JAP.GetName]已被塑造成了与往日迥乎不同的模样。如今她安坐在东方碧波的宝座之上，头戴社会主义之国的桂冠，在她的膝下围绕着的是不可计数的国民们。他们也一改往日的模样，个个变得强壮而健康。政府勇于担负起了自己的职责，将国民的生活水平提高置于政府的最优先事项之上。对外则化身为人民利益的保护者，凡涉及[JAP.GetName]的正当利益，则绝不退让分毫。正是借此，我国才真正建成了社会主义的福利国家，正是借此，我国才称得上是东方世界社会主义的典范之国，值得其他国家竞相模仿。"

### Zaibatsu ###
 JAP_pnr_kanebukuro_kozuchi_category: "金袋与小槌"
 JAP_pnr_kanebukuro_kozuchi_category_desc: "当前内阁曾在“黑色星期一”期间频繁地请求财阀们援助，而我们则出于投资未来的原则为他们慷慨解囊。随着他们一举终结了帝国议会中的悬峙僵局，“金钱掌控一切”的咒语也展现出了它的效果，果实到了收获的时刻。\n\n如今的执政党不过是安排在政府中的一群高级经理，其雇主则是§a三叶俱乐部§!——一个始于日本工业俱乐部内部的交友会。相信我们的经理会作好他们应尽的职责的，毕竟要是连我们都没有利益可得的话，那这个国家无疑就要崩溃了。\n\n尽管§a三叶俱乐部§!表面上是“交友会”，但不友善的人自然在每一个团体中都存在。简单来看，俱乐部内部可以分为两大阵营：以§j岩崎小弥太§!总裁等人为代表，在世界大战期间的“大战景气”时迅速积累资金的§a家族式财阀§!。他们奉行老方法，即通过直接的纵向和横向企业兼并，借助金融控股来扩大自身所持有的财富与在国内和国外的利益。另一阵营则是以“年轻人”§q鲇川义介§!总裁为代表的新兴康采恩，他们大多通过向民间发行股票来吸纳社会资金，可以说得上是一种§a社会式财阀§!。这些人进行主张一种全新的观点，即建成所谓“企业国家”。一方面通过国家政策和财政补贴来形成“稳定股东集团”，另一方面则将国家本身视为一件信用商品来利用，使其在特定领域定向创造大量订单来供大企业生产。\n\n由于前者已被世界大战证明有效，所以他们也被称为“实战派”，而鲇川等人的观点目前显然还是一种尚未变成理想的现实，所以他们在俱乐部中也被称为“观念派”。不过或许这一切没必要搞的这么麻烦，因为新的产品总是要打败旧的产品才能开拓市场，所以这一切不过是市场规律在人际关系领域的又一次重演。\n\n这里是最朴素的战场，日本面积狭小，市场更是有限，这使得任何默契的君子协定最后都会被撕毁——谁在市场中的收益更好，谁能从其他人的市场份额中撕下更大的一块，谁就可以成为§a三叶俱乐部§!的§x主席§!，用他那流淌的财富之河驱使这个国家的政客们；而那些不幸在这场游戏中出局的人们也没有办法为自己找理由，因为市场的规律终究证明他们的观点不过是在当下毫无价值，只能积压在仓库中的库存。\n\n\n本月最畅销的产品来自：§Y暂未揭晓§!\n\n家用电器:§Y暂未揭晓§!\n保险合同:§Y暂未揭晓§!\n生命药物:§Y暂未揭晓§!\n步枪装备:§Y暂未揭晓§!\n汽车载具:§Y暂未揭晓§!\n能源行业:§Y暂未揭晓§!\n投资组合:§Y暂未揭晓§!\n\n\n当前在§a三叶俱乐部§!内的权力局势：\n传统财阀：§H[?JAP_pnr_zb_balance_inverse|0]%§!\n新兴康采恩：§H[?JAP_pnr_zb_balance|0]%§!"
 JAP_pnr_zb_balance_change_tt: "§N£GFX_faction_tur_unaligned §a三叶俱乐部§!内的局势发生了变化：§Y$RIGHT|0$%§!§!"
