 JAP_pnr_electoral_reform_4_desc: "$JAP_pnr_electoral_reform_0_desc$"
 JAP_pnr_all_japan_workers_industrial_patriotic_association: "全日本工人产业报国会"
 JAP_pnr_all_japan_workers_industrial_patriotic_association_desc: ""
 JAP_pnr_new_unity_economy: "新团结经济"
 JAP_pnr_new_unity_economy_desc: ""
 JAP_pnr_resist_hegemonic_threats: "抵御霸权主义威胁"
 JAP_pnr_resist_hegemonic_threats_desc: "作为亚洲第一个完成工业化，跻身于世界强国之列的国家，我国必须承担起抵御欧美霸权主义的职责，这些强国恃强凌弱，在亚洲地区广布爪牙，从北京的龙椅上到新加坡的港口边，以[GER.GetName]为首的超级强权操弄着傀儡丝线，始终威胁着亚洲人的独立。我国必须担负起责任，成为所有亚洲人的盾牌，将黑色老鹰和它的仆从们赶出这片土地！"
 JAP_pnr_defend_ancient_traditions: "捍卫古老传统"
 JAP_pnr_defend_ancient_traditions_desc: "[JAP.GetName]有着属于自己的古老传统，自古以来，我国便受到道德和礼仪的教化，我们崇尚正义胜过和平，我们崇尚礼义胜过妥协。然而这传统却因为西方欧美的“和平主义”的入侵而被丢弃了。所谓的和平主义不过是一种为了维持其霸权地位的得过且过主义，任何赞同和平主义的人或许是被这种美好的外表所迷惑了，或许本身就是这霸权的帮凶。"
 JAP_pnr_red_dukes_rule: "红色公爵之治"
 JAP_pnr_red_dukes_rule_desc: "在和盛公明会的支配之下，日本已变成了完全不同的一个国家，生活和生产的方方面面都被“一体化”了，就连政党本身也消融在时间的熔炉中，形成一国一党（即便在名义上，和盛公明会并非是一个单纯的政党组织）的崭新政治格局。一些观察家认为这种国家指令型的模式是亚洲后发国家均可借鉴的发展模式，并认为$JAP_pnr_fumimaro_konoe$和聚集在他周围的幕僚们确实为亚洲开拓了一条崭新的，符合当地人自己发展的道路。一些媒体认为这是基于莫斯利和墨索里尼等人的《极权宪章》的日本化，认为日本已经是一个“名义上的君主国，实质上的社会主义国家”，并认为国家大权实际上已全数归于这个宪法上的异类，被授予了模糊权力的和盛公明会。\n\n另有一些媒体将$JAP_pnr_fumimaro_konoe$本人称为“红色公爵”，这是既是呼应遥远西方施莱谢尔作为“红色将军”的绰号，也是对$JAP_pnr_fumimaro_konoe$在施政初期的名号的重新释义。"
 JAP_pnr_interconnected_nation: "相互联结之国"
 JAP_pnr_interconnected_nation_desc: "国家的正常运转，政府公务的正常开展依赖于人和人之间的交流，失去了交流能力的国家就如同一具瘫倒在地，丧失正常运动机能的活着的肉块。此前这种交流机能虽然有在运转，但一直是各部门之间自行建立的。大政翼赞会正可以在这方面为政府提供帮助，实现其存在的价值。"
 JAP_pnr_state_press_control: "国家新闻管制"
 JAP_pnr_state_press_control_desc: "为了建成上下齐心的国家，为了扭转长期以来自由散漫的风气，对新闻业界的管制必不可少。如果有一家报社说东方发生了某件事，另一家报社说东方没有发生某件事，那么必然就有一方是在哗众取宠地捏造事实，而这种矛盾又会转而引起人与人之间的不和与争斗。一个声音是我们国家维持团结一致的基础，大政翼赞会将尽到劝导和监督的责任，真正实现起辅弼政治运作的目的。"
 JAP_pnr_centrally_guided_economy: "中央指导型经济"
 JAP_pnr_centrally_guided_economy_desc: ""
 JAP_pnr_smash_unemployed_parasites: "粉碎失业寄生虫"
 JAP_pnr_smash_unemployed_parasites_desc: ""
 JAP_pnr_total_mobilization: "全面动员"
 JAP_pnr_total_mobilization_desc: "[JAP.GetName]是一个资源贫乏的国家，为此所有生活资源，所有生产资源乃至于人本身都要被动员起来来对抗这贫乏的现实。惟有这样紧紧地团结在一起，我们才能战胜我们所面对的所有困难；惟有拥有将自己的左手视为别人的左手这样的伟大集体精神，我们才能凭借人的力量创造出寻常人口中的“奇迹”——但我们知道，这并非是奇迹，而是紧密一体，不可分离的我们对国家，对天皇陛下的爱之本身将我们动员起来。"
 JAP_pnr_way_of_assistance: "翼赞之道"
 JAP_pnr_way_of_assistance_desc: "起初人们将大政翼赞会误解为一个独裁组织，一个社会主义分子的阴谋集团，一个“颠覆国体，危害明治宪法”的产物。但大政翼赞会在$JAP_pnr_fumimaro_konoe$的带领之下用自己的行动证明了这些误解都是人们对新事物本身的不安。自大政翼赞会建立以来，它始终恪守着自身的地位与性质，只是对政治提出“建议”，并在许多必要的时刻充当了政治意义上的润滑剂，它不贪图权力，只是心怀对[JAP.GetName]的爱和希望国家变得更好的愿望在行动。\n\n如今许多议员都理解了大政翼赞会的翼赞之道，它也被委任了更多虽然细小，但却对这个国家十分重要的政治活动——从拍摄电影宣传生产和生活中的优秀人物，到走进学校和工会中宣扬政府政策。这正是大政翼赞会的存在之价值，那就是将政策本身带到民间的每一个角落，令每一个国民都能得知政府的意图，并在这种知晓之中将一切凝聚为一个整体：协力翼赞之道。"
 JAP_pnr_new_party_preparation_category_prepare: "新党预备"
 JAP_pnr_new_party_preparation_category_wasei_komeikai: "和盛公明会"
 JAP_pnr_new_party_preparation_category_taisei_yokusankai: "大政翼赞会"
 JAP_pnr_new_party_preparation_category_desc: "随着帝国议会众议院大选的落幕，悬峙议会的局面仍未被打破，宫中集团终于对无能的政党政治失去了信心。他们任命大公爵近卫文麿作为首相。\n\n然而宫中的耐心终究有限，如果近卫在一定时间内无法平定混乱的政治局势，得不到超过三分之二（67%）的国内政治势力的支持，他或许就不得不选择离开政坛。为了实现新党的目标，近卫必须在各方辗转，或施以利益，或给予威胁。可以预见的是，如果新党真正结成，它究竟和§o昭和研究会§!与§a早餐俱乐部§!众人心中所构想的本来面貌偏差多少，便完全取决于藤原家的政治手腕。\n\n近卫文麿当前对新党运动的热情程度是§Y[?JAP_pnr_kn_konoe_enthusiasm|0]§!，若其跌入§R-2§!，则会有极为不幸但却意料之中的事情发生，若新党结成时其热情仍低于§R1§!，则会有较为不幸的事件发生。维持较高热情迈向未来将产生巨大的回报。"
 JAP_pnr_kn_political_situation_title: "政治局势"
 JAP_pnr_new_party_preparation_support_text: "新党同情者：§Y[?JAP_pnr_kn_new_party_supporters|0]%§!\n革新官僚：§Y[?JAP_pnr_kn_reform_bureaucrats|0]%§!\n军队关联者：§Y[?JAP_pnr_kn_military_associates|0]%§!\n党人：§Y[?JAP_pnr_kn_party_politicians|0]%§!\n宫中势力：§Y[?JAP_pnr_kn_court_forces|0]%§!"
 JAP_pnr_kn_support_situation_title: "各方意见"
 JAP_pnr_new_party_preparation_status_text: "新党同情者：[JAP_pnr_kn_new_party_supporters_stance_text]\n革新官僚：[JAP_pnr_kn_reform_bureaucrats_stance_text]\n军队关联者：[JAP_pnr_kn_military_associates_stance_text]\n党人：[JAP_pnr_kn_party_politicians_stance_text]\n宫中势力：[JAP_pnr_kn_court_forces_stance_text]"
 JAP_pnr_kn_stance_support: "§G支持§!"
