 ### Showa Restoration ###
 JAP_pnr_showa_restoration_category: "昭和新政"
 JAP_pnr_showa_restoration_category_desc: "青年将官的叛乱彻底引起了今上天皇的怒火，而陆军同情者对这场叛乱的迟疑更是加重了天皇的愤怒——随着裕仁率领近卫师团亲自平息这场政变，天皇再一次强调了他本人作为陆海军大元帅的地位。为了解决当前碎片化的政治结构，更是为了确保类似这样破坏国体的事情不再发生。今上天皇放下了那已逝去的元老与宫中近臣的教诲，以万世一系者的名义开启了他的真正新政。\n\n为了实现昭和新政所必须的资源乃是御稜威，这一资源即是衡量民意或天皇陛下统治力的神圣力量，乃是作为神道的天照大神后嗣所拥有的恩泽的太阳光辉。当其光辉炽烈的时候，民众便紧紧跟随，俯首叩拜，而那些心怀二心的小人也不敢靠近；当其光辉晦暗的时候，民众便难以寻见天皇的威光，而其遭遇两军虚以委蛇甚至暗害的不测风险也将提高……\n\n\n当前天皇陛下所能调用的£GFX_imperial_influence_texticon 御稜威： §Y[?JAP_pnr_sr_miitsu|0]§!\n当前的£GFX_paternal_autocrat_texticon 陆军统御力： §Y[?JAP_pnr_sr_army_control|0]§!\n当前的£GFX_convoy_texticon 海军统御力： §Y[?JAP_pnr_sr_navy_control|0]§!"
 JAP_pnr_showa_tenno_mysticism_tt: "根据目前天皇的行动，当大业成就时，我们的政体将是[ROOT.GetJAPPNRShowaRestorationRegimeName]（§t[?JAP_pnr_sr_emperor_mysticism|0]§!）。"
