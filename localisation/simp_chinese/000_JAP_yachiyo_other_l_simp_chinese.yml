 JAP_pnr_restore_naval_shipbuilding_plan: "恢复海军造舰计划"
 JAP_pnr_restore_naval_shipbuilding_plan_desc: "自1925年英国发生“光荣革命”以来，政府便一直以所谓人民的力量来压制[JAP.GetAdjective]海军的扩张，并逐步削减军队预算。先前预定进行的“八八造舰计划”半途而废，最终只出厂了纪伊号和尾张号。如今战争的风暴已经迫近，我们得以重启先前的造舰计划，可是时代已经不同了，时机也已经过去了。但总之，我们终于又一次迎来了扩张的机会。"
 JAP_pnr_20_knot_scrap_plan_idea: "20节老旧舰船改装"
 JAP_pnr_20_knot_scrap_plan_idea_desc: ""
 JAP_pnr_develop_assault_guns: "发展突击炮"
 JAP_pnr_develop_assault_guns_desc: "与其把注意力集中在成熟的坦克上，还不如依靠我们的突击炮使步兵获得突破能力，这是一种更划算的选择。"
 JAP_pnr_spiritual_renovation_0: "精神一新"
 JAP_pnr_spiritual_renovation_0_desc: "自“黑船”来航之后，我国便遭西方帝国主义之毒所戕害。下至社会奉行所谓自由解放，邻里之间以猜忌代替温情；上至宫中诸大臣串通一气，将我[JAP.GetName]变为三两人之国家。在经过一场历史性的大进军之后，我等终于得到了改造国家，将一切恢复原样的机会。我等必将拂去日本身上的尘土，露出她美好的胴体，要使温情重新回到我们中间，要使美德重新回到我们中间。"
 JAP_pnr_spiritual_renovation_1: "$JAP_pnr_spiritual_renovation_0$"
 JAP_pnr_spiritual_renovation_1_desc: "$JAP_pnr_spiritual_renovation_0_desc$"
 JAP_pnr_spiritual_renovation_2: "$JAP_pnr_spiritual_renovation_0$"
 JAP_pnr_spiritual_renovation_2_desc: "$JAP_pnr_spiritual_renovation_0_desc$"
 JAP_pnr_spiritual_renovation_3: "$JAP_pnr_spiritual_renovation_0$"
 JAP_pnr_spiritual_renovation_3_desc: "$JAP_pnr_spiritual_renovation_0_desc$"
 JAP_pnr_suspension_of_the_constitution: "宪法暂停"
 JAP_pnr_suspension_of_the_constitution_desc: "我们的国家改造计划的第一步便是暂停宪法。我国受欧洲，美国之自由主义荼毒甚深，虽然有一部分民众仍心怀日本的传统精神，但大多数人更是已不知道什么是自己的传统，什么又是舶来品了。宪法并非不是一件好东西，只是它对当前的日本民众来说乃是毒物。我们的当务之急是依照大命，一面用强力肃清所有有害物，一面用宣传来开化人心，如此方能促成真正的国家改造。"
 JAP_pnr_imperial_diet_banned: "帝国议会被查禁"
 JAP_pnr_imperial_diet_banned_desc: ""
 JAP_pnr_new_workers_and_farmers_0: "新工农"
 JAP_pnr_new_workers_and_farmers_0_desc: "一些激进分子主张要彻底粉碎土地的不平等，粉碎工人和资本家之间的不平等。这些先生说的没错，国家之改造必然在于使地权的平等，使工厂权力的平等。"
 JAP_pnr_new_workers_and_farmers_1: "$JAP_pnr_new_workers_and_farmers_0$"
 JAP_pnr_new_workers_and_farmers_1_desc: "$JAP_pnr_new_workers_and_farmers_0_desc$"
 JAP_pnr_economic_reconstruction_plan_0: "经济改造计划"
 JAP_pnr_economic_reconstruction_plan_0_desc: "我国过去的经济关系已形成了一种贵族与奴隶之间的，不平等的剥削关系。这种关系存在于地主与佃农之间，存在于工厂主与工人之间，甚至存在于城市群体与乡村群体之间。想要改变这种现状，施行彻底的经济改造是急切而十分必要的。"
 JAP_pnr_economic_reconstruction_plan_1: "$JAP_pnr_economic_reconstruction_plan_0$"
 JAP_pnr_economic_reconstruction_plan_1_desc: "$JAP_pnr_economic_reconstruction_plan_0_desc$"
 JAP_pnr_flower_of_the_family: "家庭之花"
 JAP_pnr_flower_of_the_family_desc: "我国妇女乃是家庭的光辉与花朵，她们美好的品格和言行毫无疑问地会影响她们的孩子，继而影响我国的未来。"
 JAP_pnr_new_and_old_family: "新与旧的家庭"
 JAP_pnr_new_and_old_family_desc: ""
 JAP_pnr_workers_shareholders_assembly: "劳动者股东大会"
 JAP_pnr_workers_shareholders_assembly_desc: "劳动者与生产之间的关系乃是借助技术——这种智慧的结晶创造的过程，毫无疑问，劳动者才是生产的主人，而如今畸形的劳资关系使提供智慧结晶的工厂主得到了大部分的利益，实现了经济上的富足，却让劳动者陷入贫困之中。这无疑是白人的侵害，我们将逆转这一切。要让劳动者成为工厂的股东，并借此让劳动者的收入真正与工厂的经营绑定在一起，而工厂主也会得到属于他应得的那一份，因为这些工具毫无疑问是劳动者向他租借而来的。"
 JAP_pnr_esperantists: "世界语者"
 JAP_pnr_esperantists_desc: "语言障碍是民族冲突和偏见的根源，而世界上的大多数偏见都是由英语和德语造成的。看看[GER.GetName]那飞扬跋扈的地主做派，再看看[ENG.GetName]和[IMP.GetName]那令人作呕的，贵族与流氓式的表现。为此废止英语和德语极为有必要，作为反对白人帝国主义，反对欧美霸权的“新人类”们，我们必须采纳一种能够促进世界和平与文化交流的，具有希望的新语言。"
 JAP_pnr_national_compulsory_education: "国民义务教育"
 JAP_pnr_national_compulsory_education_desc: ""
 JAP_pnr_new_labor_capital_relations: "新劳资关系"
 JAP_pnr_new_labor_capital_relations_desc: "经过一系列针对经济领域的改造，我国终于实现了一种不同于过去的，崭新的劳资关系。那些工团主义者和激进社会主义者为此疯狂地攻击我们是“资产阶级的改良主义”——他们又在用自己创造的词汇试图污蔑我们了，这只是因为我们实现了他们求而不得的东西，引得他们嫉妒罢了。"
 JAP_pnr_showa_new_deal_0: "昭和新政"
 JAP_pnr_showa_new_deal_0_desc: "对政党政治的彻底失望，对军人暴走的愤怒，对所珍视之近臣的离去——天皇本人已从石阶之上走下，亲自进入到了政治的混沌之中。\n\n尽管天皇本人神秘莫测，但他凭行动证明了今天的自己绝非如外人所猜测的那般成为了一个远离政治的傀儡。随着天皇在叛乱中亲率近卫师团镇压叛军的举动，裕仁再一次证明了自身作为[JAP.GetName]的至高统治者与神圣化身的威严和地位，并借此拉开了“昭和新政”的序幕。\n\n西园寺公望等人生前曾多次告诫裕仁为维持身为君王的神秘度与神圣性，不可过多地干预政治。但在这宪政之路业已破碎的当下，利用“天皇大权”，采取非常之手段似乎已成为了遏止激进分子，维护国体稳定，并最终实现真正的民主的唯一方法。"
 JAP_pnr_showa_new_deal_1: "$JAP_pnr_showa_new_deal_0$"
 JAP_pnr_showa_new_deal_1_desc: "$JAP_pnr_showa_new_deal_0_desc$"
 JAP_pnr_showa_new_deal_2: "$JAP_pnr_showa_new_deal_0$"
 JAP_pnr_showa_new_deal_2_desc: "$JAP_pnr_showa_new_deal_0_desc$"
 JAP_pnr_showa_new_deal_3: "$JAP_pnr_showa_new_deal_0$"
 JAP_pnr_showa_new_deal_3_desc: "$JAP_pnr_showa_new_deal_0_desc$"
 JAP_pnr_gozen_conference_0: "御前会议"
 JAP_pnr_gozen_conference_0_desc: "长期以来的所谓御前会议，即天皇亲自出席的重大会议上，根据习惯，天皇本人仅仅是作为一个象征而出席，并在陷入僵局的时刻利用“圣裁”来进行决定。\n\n为了真正确保类似的暴走事件不再发生，原本用于向天皇陛下知会的御前会议如今已担负起了更重要的职责：无论是否陷入僵局或对峙，任何政策和计划自此之后都无法独自进行讨论，其必须在御前会议上向天皇报告并得到明确的批准之后才能执行。"
 JAP_pnr_gozen_conference_1: "$JAP_pnr_gozen_conference_0$"
 JAP_pnr_gozen_conference_1_desc: "$JAP_pnr_gozen_conference_0_desc$"
 JAP_pnr_gozen_conference_2: "$JAP_pnr_gozen_conference_0$"
 JAP_pnr_gozen_conference_2_desc: "$JAP_pnr_gozen_conference_0_desc$"
 JAP_pnr_gozen_conference_miitsu_monthly_tt: "大于70御稜威时每月御稜威获得量：§G+3§!\n小于30御稜威时每月御稜威获得量：§R-3§!"
 JAP_pnr_guardian_of_japan: "日本的庇护者"
 JAP_pnr_guardian_of_japan_desc: "大日本宪法第一条——[JAP.GetName]由万世一系之天皇统治；大日本宪法第九条——天皇可以颁布或命令他人颁布执行的法律，以维护公共和平与秩序，增进臣民之福祉。"
 JAP_pnr_imperial_appointment: "天皇任命"
 JAP_pnr_imperial_appointment_desc: "顾问院被设计为新的咨询机构，主要为天皇提供相关内容的咨询。与现有的其它政府部门不同，顾问院中的所有成员都是由天皇亲自任命的。"
 JAP_pnr_iron_democracy: "铁之民主"
 JAP_pnr_iron_democracy_desc: "为了不遗余力地抢救[JAP.GetName]中行将熄灭的民主之光，有时采取强力手段是必要的。"
 JAP_pnr_house_of_peers_silenced: "贵族院偃旗息鼓"
 JAP_pnr_house_of_peers_silenced_desc: "天皇陛下通过将众议院议员任命为贵族的形式来冲淡贵族院在政治上的影响力，这显著削弱了贵族院对政治的影响力。"
 JAP_pnr_way_of_subjects: "臣民之道"
 JAP_pnr_way_of_subjects_desc: ""
 JAP_pnr_gunjin_chokuyu: "肃军敕语"
 JAP_pnr_gunjin_chokuyu_desc: "天皇乃[JAP.GetName]的最高军事领袖陆海军大元帅，然而长期以来这头衔只是一个虚名，两军各行其是，甚至为了利益而互相使绊子的情况屡见不鲜。借着先前五一五事件与此次政变，天皇已授意清洗以及边缘化了陆海军中诸多激进军官，并借助先前镇压叛军的威望与随之一同颁发的肃军敕语再一次把军队牢牢握在了自己手中。"
 JAP_pnr_strengthened_supreme_command: "强化统帅权"
 JAP_pnr_strengthened_supreme_command_desc: ""
 JAP_pnr_daigensui_office: "大元帅府"
 JAP_pnr_daigensui_office_desc: "天皇之所以被称为大元帅，正是由于自古以来的“大元帅明王调伏法”乃是惟有天皇才能举行的，对抗外敌的宗教仪式。其宗教仪式是否能真正“诛灭仇敌”尚不可知，但借助此仪式，天皇确立了自身名义上对军队的掌控力。\n\n而如今这掌控力终于蔓延到了现实的物质领域，“四头政治”的历史已宣告终结，再无所谓军令与军政之分，也再无陆军与海军的尖锐对立。尽管争吵依然不可少，但现在所有军官任命权都真正地集中在了天皇手中。"
 JAP_pnr_civilian_control_of_the_military_land_doctrine_bonus: "文官统制"
 JAP_pnr_civilian_control_of_the_military_naval_doctrine_bonus: "文官统制"
 JAP_pnr_planned_social_reform_industry_bonus: "计划社会改革"
 JAP_pnr_ban_strikes_tt: "我们将根据当前$national_populist_coloured$支持率失去稳定度，并最多获得§Y4§!座民用工厂。"
 JAP_pnr_foolproof_plan: "万无一失"
 JAP_pnr_foolproof_plan_desc: "战争在交战之前就已经开始了，详细的实地考察和周密的计划部署将有助于军队发起更有组织，更具破坏力的进攻。"
 JAP_pnr_cage_tactic_idea: "囚笼战术"
 JAP_pnr_cage_tactic_idea_desc: "所谓的“囚笼战术”，指的便是通过快速构建出包围网，并切断敌人的通讯线路来将敌人的一小撮部队逼入战争迷雾中的战术。面对与外界完全隔绝的情况，我军只需再组织数轮攻击，敌人便会自行溃散。"
 JAP_pnr_strengthened_core_staff_system: "强化的参谋本部"
 JAP_pnr_strengthened_core_staff_system_desc: "战争在交战之前就已经开始了，详细的实地考察和周密的计划部署将有助于军队发起更有组织，更具破坏力的进攻。"
 JAP_pnr_advanced_army: "先进之军"
 JAP_pnr_advanced_army_desc: "经过一系列改革，我国军队已成为傲视世界之先进军队。我们现在所需的不过是一场战争，借助此战争我们便可以检验我们的改革成果，并证明我军的真正实力！"
 JAP_pnr_great_war_army: "大战之军"
 JAP_pnr_great_war_army_desc: "经过一系列改革，我国军队已成为傲视世界之先进军队，而我们在战场上所取得的诸项成果更是证明了我们改革的成功。"
 JAP_pnr_short_term_decisive_battle_doctrine_idea: "一击论"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_desc: "我国陆军之力量虽在世界上处于第一梯队，但较列强而言仍有许多不足，造成这一现象的最为致命的原因便是我国战略资源的不足够。为此我军应当奉行以强力一击摧毁敌人的战争原则，以免陷入一场旷日持久的消耗战中从而将我们消耗殆尽"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_upgraded: "一击论"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_upgraded_desc: "$JAP_pnr_short_term_decisive_battle_doctrine_idea_desc$"
 JAP_pnr_prepare_for_total_war_idea: "徐徐图之"
 JAP_pnr_prepare_for_total_war_idea_desc: "在第一次世界大战的风暴之后，战争已不再是依赖意志和士气的，只属于军队自己的一件事务了。它早已变成考验国家已有资源，工业水平和科技发展的多方面的“全体主义行动”。受限于我国资源与工业现状，想要进行一场符合当下标准的战争实在太过困难，为此我等应当为任何可能的战争做好准备，并不要乐观地估计今后的战争将是能在短期内结束的战争。"
 JAP_pnr_prepare_for_total_war_idea_upgraded: "徐徐图之"
 JAP_pnr_prepare_for_total_war_idea_upgraded_desc: "$JAP_pnr_prepare_for_total_war_idea_desc$"
 JAP_pnr_q_agency: "Q机关"
 JAP_pnr_q_agency_desc: "一旦战争开始，为确保占领区的社会稳定，设立相关的特务机关是必不可少的。Q机关的Q指平息（Quell），不论是收买当地潜在的合作者还是使用更严厉的方式来压制占领区，我们总会找到确保相关地区稳定的办法。"
 JAP_pnr_limited_light_armor: "有限轻装甲"
 JAP_pnr_limited_light_armor_desc: "我国钢铁资源不足，为此采用轻型装甲计划是最符合我国国情的。"
 JAP_pnr_armored_forces: "装甲部队"
 JAP_pnr_armored_forces_desc: "尽管我国面临着钢铁资源不足的窘境，但毫无疑问，武装一支强大的装甲部队将确保我们面对任何敌人都游刃有余。"
 JAP_pnr_armored_car_warfare: "推广装甲车作战"
 JAP_pnr_armored_car_warfare_desc: "我国钢铁资源不足，为此采用轻型装甲计划是最符合我国国情的。"
 JAP_pnr_armored_torrent: "装甲洪流"
 JAP_pnr_armored_torrent_desc: "尽管我国面临着钢铁资源不足的窘境，但毫无疑问，武装一支强大的装甲部队将确保我们面对任何敌人都游刃有余。"
 JAP_pnr_primacy_of_movement: "机动至上"
 JAP_pnr_primacy_of_movement_desc: ""
 JAP_pnr_resist_financial_risks_idea: "抵抗金融风险"
 JAP_pnr_resist_financial_risks_idea_desc: "恐怖的经济噩梦终于过去了，我们抓住这次全球大萧条的机会，一举消灭了那些运转不良的企业，虽然在此期间我们经历了一阵令人感到悲痛的倒闭潮和失业潮，但这些不过是为了让我们的产业健康化，终结过去里形成的畸形的“喂养式经济”模式所必要的牺牲，而且现在，数据不是正在变好吗？现在市场再次焕发出它应有的活力，如今我们终于可以说——我们走出了失去十年的噩梦，永别了，灰暗的过去；我来了，繁华的未来！"
 JAP_pnr_NSA_idea: "《国家保安法》"
 JAP_pnr_NSA_idea_desc: "用于替代之前已被取消的《治安维持法》的新法律《国家保安法》要比它的前身更加……“温和”，但这依然赋予了政府打击那些力量不足的非法激进组织的权力。"

 ### Balance of Power ###

 JAP_pnr_poor_reality_bop: "贫乏的现实"
 JAP_pnr_choshu_no_rikugun: "长之陆军"
 JAP_pnr_satsuma_no_kaigun: "萨之海军"
 JAP_pnr_bop_army_ascendant: "陆军得势"
 JAP_pnr_bop_two_services_balanced: "两军维持平衡"
 JAP_pnr_bop_navy_ascendant: "海军得势"
 JAP_pnr_interservice_budget_bop_category: "贫乏的现实"
 JAP_pnr_interservice_budget_bop_category_desc: ""
 JAP_pnr_annual_interservice_budget: "年度陆海军预算"
 JAP_pnr_annual_interservice_budget_desc: "自1927年开始我国海军就展开了相关的裁军计划以减少国防开支支援经济危机；与此同时陆军也进行了裁军计划，意图将多余的预算用于升级军队装备。由于我国资源不足，显然我们无法同时兼顾两方，为此陆海军经常因军事预算分配而大打出手。\n\n当前我们的陆军预算点数为§Y[?JAP_pnr_army_budget_points|0]§!，预计下一年我们将获得§t[?JAP_pnr_army_budget_yearly_gain|0]§!。\n当前我们的海军预算点数为§3[?JAP_pnr_navy_budget_points|0]§!，预计下一年我们将获得§t[?JAP_pnr_navy_budget_yearly_gain|0]§!。"
 JAP_pnr_emergency_army_budget: "紧急陆军军备预算"
 JAP_pnr_emergency_army_budget_desc: ""
 JAP_pnr_emergency_army_budget_points_tt: "借助紧急预算案，我们将获得§O2点§!陆军预算点数，但这无疑是在向大藏省透支我们的信誉，并让他们更倾向于提拔另一方来制衡我们。"
 JAP_pnr_emergency_army_budget_used_this_year: "我们已执行本年度紧急陆军预算案"
 JAP_pnr_emergency_shipbuilding_plan: "紧急造舰计划"
 JAP_pnr_emergency_shipbuilding_plan_desc: ""
 JAP_pnr_emergency_shipbuilding_plan_budget_points_tt: "借助紧急预算案，我们将获得§O2点§!海军预算点数，但这无疑是在向大藏省透支我们的信誉，并让他们更倾向于提拔另一方来制衡我们。"
 JAP_pnr_emergency_shipbuilding_plan_used_this_year: "我们已执行本年度紧急海军预算案"
 JAP_pnr_next_year_interservice_budget_mission: "下一年度陆海军预算博弈中"
 JAP_pnr_next_year_interservice_budget_mission_desc: ""
 JAP_pnr_army_expansion_plan_budget_tt: "§C完成该国策将使我们立刻获得§O1点§!陆军预算用于推进我们的军备恢复计划！§!"
 JAP_pnr_navy_expansion_plan_budget_tt: "§C完成该国策将使我们立刻获得§O1点§!海军预算用于推进我们的军备恢复计划！§!"

 ### Raids ###

 raid_type_JAP_pnr_operation_night_blossom: "夜间樱花行动"
 raid_type_JAP_pnr_operation_night_blossom_desc: "一架战略轰炸机将从所罗门海附近的航空基地起飞，其将在敌人的关键城市上空投下特殊弹，以执行代号：夜间樱花行动。参谋部相信此举将能对这些白人鹰犬造成重创，并有助于我国迅速取得对帝国主义作战的胜利。"

 ### Dynamic Modifiers and Modifiers ###

 JAP_pnr_pandemic_modifier: "大流行"
 JAP_pnr_pandemic_modifier_desc: "一场突如其来的瘟疫导致此地陷入公共卫生危机。"
 JAP_pnr_red_hands_modifier: "赤色魔手"
 JAP_pnr_red_hands_modifier_desc: "日本工人和农民们，富士山已经沉没，邪恶的天皇已经夹着尾巴逃跑了，现在是时候进军，彻底颠覆资产阶级了！——日本共产党\n\n尽管我国出于各种原因没有深入到德意志帝国主导的世界市场之中去，但随着黑色星期一的爆发，金融危机还是传导到了我国，并且对我们刚刚稍有起色的经济施加了一记重拳。\n\n日本共产党正是抓住了这个机会，以“岸田国中生事件”为代表加快了他们对社会的破坏行动。大量日共和激进分子被动员出来，对我国政府发动从合法游行到暴力犯罪的广泛攻击，§R我们必须向天皇陛下证明我们有能力将这些犯罪者绳之以法，否则我们就不得不倒台，或者更糟……§!"
 JAP_pnr_lost_decade_nightmare_modifier: "失去十年的梦魇"
 JAP_pnr_lost_decade_nightmare_modifier_desc: "在过去十年里我们通过调整贸易策略重新振兴了我们的经济，而就在我们将要向过去的灰暗告别的时候，这个难缠的幽灵又一次一把抓住了我们，不想让我们离开。"
 JAP_pnr_destruction_and_creation_modifier: "毁灭与缔造"
 JAP_pnr_destruction_and_creation_modifier_desc: "自古以来，人类的发展就处于不断地毁灭之中，而能够利用毁灭之后的断壁残垣创造出崭新事物的人则被称为“革命者”。啊，革命者，多么美好的名字，当人们说出这个名字之后，似乎天地之间再没有比它大得多的头衔了！正因如此，许多阴险小人，流氓和破坏狂经常窃取“革命者”的皮囊，他们穿戴上这件并不符合自己的衣服便粉墨登场了。然而他们只知破坏，却从未掌握缔造的真谛，这使得他们见到真正的革命者之后，便立刻化成了一抔尘土。\n\n为了实现维新，对错误事物的§R毁灭§!必不可少，但同时也不能忘记§G缔造§!本身。而假使我等要实现完美的维新之政治，那么谨慎结合这两种力量，确保其相互制衡则为必须谨遵之教条。若是令§R毁灭§!将国家焚烧殆尽，那骇人的狂热或许终将蔓延至整个世界；若是连旧房子都未推倒便开始大肆§G缔造§!，那最后形成的也不过就是更臃肿的存在。惟有令§R毁灭§!与§G缔造§!相平衡，令黑与白这两种力量相持，才能实现真正的§M革新§!。"
 JAP_pnr_lost_decade_disabled_ideas_tt: "£GFX_trigger_yes 允许分配内阁成员和修改法律"
 JAP_pnr_fleet_plan_modifier: "[JAP.GetName]舰队方案"
 JAP_pnr_fleet_plan_modifier_desc: "[JAP.GetName]，亚细亚的长子，而他的海军同样也是唯一一支在亚洲由亚洲人所拥有的强大舰队力量。回忆往昔荣耀，世界大战爆发之初，[JAP.GetAdjective]海军便一举夺取并暂时解放了[GER.GetName]在太平洋的大部分领土。然而随着他们在战争中取得胜利，灾难和苦痛也随之降临到我国荣耀的海军头上。\n\n德国殖民者对我们恬不知耻的封锁严重影响了我们的舰队建造计划，而在英法相继爆发的工团主义运动则令当时的政客们对是否继续加强我国海上国防，建成庞大海军的计划投下了反对票。帝国陆军从中作梗彻底摧毁了我们的愿景，然而十年之后，我国终于又一次意识到了海军的重要性。[JAP.GetAdjective]海军将再次遨游于蓝水之上，是的，[JAP.GetAdjective]海军将再次遨游于蓝水之上！"
