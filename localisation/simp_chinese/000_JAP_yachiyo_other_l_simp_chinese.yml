### Konoe ###
 JAP_pnr_kokutai_clarification: "国体之澄清"
 JAP_pnr_kokutai_clarification_desc: "明治宪法实在是一部语焉不详的宪法，正是因为它在许多地方模糊不清，才给予了政府最大限度的解释权力。早在1935年，美浓部达吉教授便陷入了“天皇机关说”的漩涡之中——这是由于宪法对“国体”的定义不甚明确所导致的。无论如何，政府已经表明了它的立场，并真正澄清了“国体”的含义。"
 JAP_pnr_parliamentary_harmony: "议会调和"
 JAP_pnr_parliamentary_harmony_desc: ""
 JAP_pnr_economic_model_reform_0: "经济模式改革"
 JAP_pnr_economic_model_reform_0_desc: "[JAP.GetName]资源匮乏，为了最大限度利用现有的工业资源和原料，将经济模式从私人经营转换为国家通过地方机关进行统一控制将有助于提高生产效率。"
 JAP_pnr_economic_model_reform_1: "$JAP_pnr_economic_model_reform_0$"
 JAP_pnr_economic_model_reform_1_desc: "$JAP_pnr_economic_model_reform_0_desc$"
 JAP_pnr_electoral_reform_0: "选举革新"
 JAP_pnr_electoral_reform_0_desc: "过去的选举依赖政治献金，可以说没有金钱就无法开展选举工作，这可以说是一切政商勾结，政党政治堕落，腐败滋生的根本源头。议员们为了在未来的选举中继续得到商界和民间的金融支持，便毫无廉耻地推动有利于付钱之人，而非有利于民众本身的政策。这样的不正之风将通过选举革新运动来彻底除去——现在所有参选议员都将登记为和盛公明会成员，并由政府直接提供选举资金；商财界的政治献金仍未取消，但现在只能赞助给公明会的指定账户，再由公明会统一安排给所有参选议员。通过此措施，议员们终于可以不再为竞选资金发愁，而真正去想些有益于这个国家，有益于国民的事情了。"
 JAP_pnr_electoral_reform_1: "$JAP_pnr_electoral_reform_0$"
 JAP_pnr_electoral_reform_1_desc: "$JAP_pnr_electoral_reform_0_desc$"
