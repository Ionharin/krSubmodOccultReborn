 JAP_pnr_masaki_jinzaburo: "真崎甚三郎"
 JAP_pnr_masaki_jinzaburo_desc: "§Y生于：§!§L1876年；日本国、佐贺县§!\n§Y派系：§!§n皇道派§!\n§Y背景：§!§L1896年真崎甚三郎进入陆军士官学校并毕业，他本应继续在陆军大学校中继续深造，但日俄战争的爆发打断了这一计划。1907年，从西伯利亚归来的真崎甚三郎从陆军大学校作为“御赐组”——获得御赐军刀的毕业生——离开陆军大学校。§!§!"
 JAP_pnr_fusanosuke_kuhara: "久原房之助"
 JAP_pnr_fusanosuke_kuhara_leader_desc: "§Y生于：§!§L1869年；日本国、长门国§!\n§Y派系：§!§c政友会§!\n§Y背景：§!§L实业家，久原财阀的掌门人，心如蛇蝎的阴谋家，神秘的政客，跳梁小丑……日本政界对这位在世界大战之后崛起的新政治家有许多不同的称呼。$JAP_pnr_fusanosuke_kuhara$的旅途始于1912年他创办的久原矿业公司，而在今天该公司已成为日本三大铜业公司之一。在世界大战期间，他抓住机会，竭力收买和新建了许多企业。1916年，他向孙中山提供了约130万日元的低息借款支援其在中国发动革命，作为回报他要求事成之后东北地区的特许开发权。\n\n随着世界大战的结束，中国革命之火的熄灭以及日本金融危机的到来，久原房之助的企业陷入困境，而他也因此而深感身为企业家的无力，决心步入政界，并将其企业让给义弟鲇川义介打理。在加入立宪政友会后，久原房之助凭借提供大量党内经费一跃而成政友会内部举足轻重的人物，随后他便遇到了自己政界人生中最大的敌人——盘踞在立宪政友会内部的$JAP_pnr_suzuki_kisaburo$和追随他的“关东军团”。为了对抗这个党内之党，打破铃木派对政党内部上升通道的垄断，$JAP_pnr_fusanosuke_kuhara$与许多同样对现状不满的成员组成了“反铃木派”，以彻底将$JAP_pnr_suzuki_kisaburo$等人清除出立宪政友会为首要任务。§!§!\n\n§Y备注：$JAP_pnr_fusanosuke_kuhara$行事诡异且神秘，有传闻说他在神户市本山村买下了六万余平方米的土地以建造豪宅，又有传闻称他在自己的屋子里每个房间中都装上了电话机，更有人称他前往美利坚合众国拜访安德鲁·卡内基时，斥巨资买下了一节车厢。这位神秘的实业家总是小报中耸人听闻的故事里的核心人物以及政治阴谋的参与者。§!"
