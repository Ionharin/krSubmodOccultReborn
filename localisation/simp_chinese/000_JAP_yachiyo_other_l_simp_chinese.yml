 JAP_pnr_kanebukuro_kozuchi_modifier: "金袋与小槌"
 JAP_pnr_takeda_vitamin_pharmaceutical_0: "武田维生素制药"
 JAP_pnr_takeda_vitamin_pharmaceutical_0_desc: "起家于关西地区的武田药品株式会社最早销售传统汉方药，约在五十年前，他们决定开始转型从事西洋药品业务。一开始是作为经销商进口海外药物，但很快武田制药就决定开启自己的制药道路：随着各类药品工业研究所和化学研究所在大阪地区的建立，武田制药已从关西的地区性企业变为在[JAP.GetName]举足轻重的制药公司。\n\n他们已经在合成化学行业积攒了足够的经验，如今正试图继续扩张自己在化工领域的商业版图：1933年瑞士化学家塔德乌斯·赖希施泰因首次人工合成了维生素C，这种能延年益寿，改善营养不良的物质的合成方法目前由瑞士药物公司罗氏制药持有，由于稀少性，该药物在东亚市场极其昂贵。而武田制药目前正进行化学实验以试图获得生产这种神奇物质的能力。"
 JAP_pnr_takeda_vitamin_pharmaceutical_1: "武田维生素制药"
 JAP_pnr_takeda_vitamin_pharmaceutical_1_desc: "$JAP_pnr_takeda_vitamin_pharmaceutical_0_desc$"
 JAP_pnr_furukawa_electric_industry_0: "古河电气工业株式会社"
 JAP_pnr_furukawa_electric_industry_0_desc: "1884年在横滨始创的本所溶铜所正是古河电气工业株式会社的起源，也为古河奠定了其有色金属行业的底色。1920年，古河将其铜业务与新收购的电线制造公司合并，形成了古河电气工业株式会社，也正是借此古河得以整合其从采矿到制造铜制品的全业务链。同年古河电气工业株式会社承办了一条通往上海的海底光缆买卖合同，正式标志其走上世界舞台。\n\n1923年，古河与德意志帝国的西门子公司展开了合作，尽管世界大战后名义上[GER.GetName]对[JAP.GetName]实施严厉的贸易禁运，但这些国际巨头们依然发现了中欧同盟的漏洞：奥地利和奥斯曼，他们通过在两地运作的子公司进行接触，并最终在东亚地区形成了古河-西门子合作，即富士电机制造株式会社。\n\n对古河电气工业最头疼的事情莫过于关东和关西地区的电流频率不同，这是由于明治时期[JAP.GetName]进行电气化时两地区采购的发电设备不同所导致，这使得其设备制造成本陡增。长期以来古河都试图通过和议员们合作说服政府推动电网统一，然而收效甚微。"
 JAP_pnr_furukawa_electric_industry_1: "古河电气工业株式会社"
 JAP_pnr_furukawa_electric_industry_1_desc: "$JAP_pnr_furukawa_electric_industry_0_desc$"
 JAP_pnr_sekiyama_farm_plantation_base: "关山农园种植基地"
 JAP_pnr_sekiyama_farm_plantation_base_desc: "位于台湾的关山农园是我们的必要原料基地，拓展其有助于确保我们的化学原料供应。"
 JAP_pnr_production_management_office_0: "生产管理办公室"
 JAP_pnr_production_management_office_0_desc: "无休止的生产膨胀必须被制止，我们需要的是生产计划、进度监控、质量保证和将这一切纳入考量的综合协调能力，要抓住当前市场上到底缺少什么再去进行确保质量的生产。"
 JAP_pnr_production_management_office_1: "生产管理办公室"
 JAP_pnr_production_management_office_1_desc: "$JAP_pnr_production_management_office_0_desc$"
 JAP_pnr_investment_in_expectations: "对期望的投资"
 JAP_pnr_investment_in_expectations_desc: "信心是支撑市场的必要条件，正是由于信心和前景市场才得以从未来之中将财富带到当下。"
 JAP_pnr_conservative_policy: "保守政策"
 JAP_pnr_conservative_policy_desc: "在并不稳定的时刻采取厌恶风险的策略有助于确保资产的稳定增长，尽管增长缓慢，但这已被证实是一种确实有效的防御性的维持策略。"
 JAP_pnr_invest_underdeveloped_regions: "投资欠开发区域"
 JAP_pnr_invest_underdeveloped_regions_desc: "我国有许多欠发达地区的开发都被忽视了，致使我们无法充分利用我们已有的土地资源。"
 JAP_pnr_stand_on_the_land_0: "立足土地"
 JAP_pnr_stand_on_the_land_0_desc: "回顾$JAP_pnr_social_conservative_party$的历史，它本来就是一个注重于农村地区的地主与乡间富户的政党，我们是什么时候忘记了这一点，继而伤透了那些在过去三十年间始终支持着我们的，相信我们代表了他们的利益的人的呢？无论如何，我们已经意识到了我们的错误，为了真正履行我们对他们的承诺，为了确保政党执政的无虞，我们将立足于土地，为那些将我们送到这个位置的人发出最合适的声音。"
 JAP_pnr_stand_on_the_land_1: "$JAP_pnr_stand_on_the_land_0$"
 JAP_pnr_stand_on_the_land_1_desc: "$JAP_pnr_stand_on_the_land_0_desc$"
 JAP_pnr_stand_on_the_land_2: "$JAP_pnr_stand_on_the_land_0$"
 JAP_pnr_stand_on_the_land_2_desc: "$JAP_pnr_stand_on_the_land_0_desc$"
 JAP_pnr_prefectural_economic_survey: "都道府县经济调查"
 JAP_pnr_prefectural_economic_survey_desc: "政府要制定政策，首先必须有尽可能准确的数据。通过对都道府县进行广泛的经济调查之后，我们终于能针对性地评估各地区的经济发展情况，并给出对应的指导与帮助了。"
 JAP_pnr_public_finance_redistribution: "公共财政再分配"
 JAP_pnr_public_finance_redistribution_desc: ""
 JAP_pnr_chairmen_support_government: "总裁们支持政府"
 JAP_pnr_chairmen_support_government_desc: "凭借我们的游说和私下的聚会，各大社会团体的总裁都愿意支持我们的事业，有了他们的帮助，我们便可以更进一步地让国民理解我们的政策，并拉近政府和他们之间的距离，从而在必要的时刻建立政府-社会的统一战线。"
 JAP_pnr_end_caretaker_government: "结束看守政府"
 JAP_pnr_end_caretaker_government_desc: "长期以来，$JAP_pnr_social_conservative_party$给国民留下的印象都是一个维持现状，不愿做出改变的看守政府。如果当下是太平之世，国民生活舒适倒也无妨。然而现在[JAP.GetName]在国际上面对的是愈来愈紧张的亚洲事态，在国内则是因“黑色星期一”而再次遭到重击的经济。在这样的困苦之下，政府如果继续满足于当一个“夜警”，那便是一种渎职。为了保卫国民的生活，$JAP_pnr_social_conservative_party$将行动起来，以更积极的态度应对当下。"
 JAP_pnr_friend_of_government: "政府之友"
 JAP_pnr_friend_of_government_desc: "$JAP_pnr_social_conservative_party$中的所谓“政友”，指的乃是政治同道之友，是志同道合的同仁们团结起来的标志。我们过去曾因个人利益而产生争端，我们过去曾因政见不同而相互倾轧，但从今天起我们再次团结。\n\n今日的$JAP_pnr_social_conservative_party$已不单单是所谓同道者的联盟，更是政府本身的朋友，$JAP_pnr_social_conservative_party$始终与政府，与天皇陛下，与全体国民站在一起，为了经由国政实现我们所许诺的，国民所期望的未来而努力。"
 JAP_pnr_chain_of_leveraged_multiplication: "牵引增殖之锁"
 JAP_pnr_chain_of_leveraged_multiplication_desc: "我们已在市场上占尽优势，银行本身就是我们的一部分。凭借我们现有的地位，我们可以利用金融放大效应，借助融资来掌控那些上下游中小企业的控制权。"
 JAP_pnr_power_frequency_unification_underway: "输电频率统一中"
 JAP_pnr_power_frequency_unification_underway_desc: ""
 JAP_pnr_frequency_unified: "工业电力标准化"
 JAP_pnr_frequency_unified_desc: "尽管非常困难，但我们还是通过一种妥协的方法——借助变电站实现了关东和关西两地区的电网频率统一，如今我们真正地可以统合起全国的电力资源，并且再无电器制造的额外成本了。"
 JAP_pnr_industrial_security_act_idea: "《工业安保法》"
 JAP_pnr_industrial_security_act_idea_desc: ""
 JAP_pnr_building_the_organs: "打造内脏"
 JAP_pnr_building_the_organs_desc: "毫无疑问，工业之于国家本身就犹如内脏之于人类，如果失去工业，国家就会轰然垮塌。在世界大战之后，世界经济几乎已被中欧同盟征服，与第三国际和衰退的美国进行的任何贸易对[JAP.GetName]来说都不足够，[JAP.GetName]若想前进便必须找到新方法——那就是对[JAP.GetName]本身的治愈和强化。\n\n国家这个孩童作为“基础的需求者”将自己制造市场来促进工业化，不管是采购保证，贷款再贴现还是对进口商品的保护性关税，通过利用这些政府财政承诺来撬动私人资本，从而将国家信用作为另一座“工业银行”来进行贷款，将可用的私人储蓄组织成国家工业资本。然后再精选一批强大的器官，让这些营养源源不断地注入精选的内脏之中。假以时日，这些器官将变得无比强壮，而国家本人也将脱去疲惫的肉体，变成健壮的男儿。"
 JAP_pnr_advanced_science_education: "先端科学教育"
 JAP_pnr_advanced_science_education_desc: ""
 JAP_pnr_corporate_republicanism_idea: "企业共和主义"
 JAP_pnr_corporate_republicanism_idea_desc: ""
 JAP_pnr_national_orders: "国家订单"
 JAP_pnr_national_orders_desc: ""
 JAP_pnr_miner_and_weaver: "矿夫与织女"
 JAP_pnr_miner_and_weaver_desc: "1920年日本工业俱乐部建立之时，雕刻家小仓右一郎先生为俱乐部会馆楼顶设立了这具有历史意义的雕像，它象征着我国近代工业的两大基石——煤炭与纺织，正是这两大产业托举了我国工业，使其度过黑暗，抵达黎明。长期以来，工业俱乐部的各成员都为[JAP.GetName]国民的幸福生活，为实现日本产业振兴而在日本工业发展的道路上鞠躬尽瘁，虽然过去几年中偶尔与工人们发生过一些不愉快，但那不过都是由于双方缺乏沟通所导致的误会。往日种种已成旧日烟云，如今[JAP.GetName]在工业俱乐部中各成员的协力推动下已成为世界上首屈一指的工业国家。我们又一次证明了即便受到[GER.GetName]的经济制裁，我们依然能够找到通往美好繁荣的道路。一如矿夫用手中的锤子清除拦路的砂土，一如织女用线筒纺出绮丽的织物，今天的东京都内，各位总裁依然在为[JAP.GetName]的利益和未来而和员工与劳动者们一起努力奋斗，挑战更高的山峰。"
 JAP_pnr_waltz_of_the_konzerns_tt: "§N完成该国策后，我们将根据§a三叶俱乐部§!内的权力局势而获得持续的动态增益，通过检查§Y$JAP_pnr_kanebukuro_kozuchi_category$§!决议组来确认当前效果。§!"
### Oomoto ###
 JAP_pnr_yachiyo_jishi_tt: "我们将根据当前的$national_populist_coloured$支持率获得£GFX_civ_factory 民用工厂和£GFX_mil_factory 军用工厂，最多获得4£GFX_civ_factory 民用工厂和4£GFX_mil_factory 军用工厂"
 JAP_pnr_showa_oomoto_way_modifier: "昭和大本之道"
 JAP_pnr_showa_oomoto_way_modifier_desc: "大本，乃出口王仁三郎所领导之宗教的名称。而在政治领域，其以右翼团体“昭和神圣会”之名更为人所熟知。然而这并不意味着大本之中充斥着右翼分子：不论是被政客们畏惧的敲诈者“大魔王菩萨”北一辉，还是在政府之中有着强大号召力，与平沼骐一郎男爵并驾齐驱的国维社首领，“天皇的警察”后藤文夫，以及现在已经落网的日本共产党头目之一三田村史郎都与大本教有着深度的联系。与此同时，也有许多不好的传言在小巷子和闲谈中涌出——大本的头目出口王仁三郎是妖术师，能够迷惑任何和他对话的人；大本正策划着颠覆日本政权的阴谋；大本与皇道派们有关；大本与统制派们有关……这些传言或耸人听闻，或相互矛盾。但其中最令人感到忧心且怪奇的莫过于明治天皇的正妃昭宪皇后的侄女，鹤殿男爵夫人曾说过的话：\n\n§x确实不错，您和他长得一模一样。§!"
 JAP_pnr_sakura_hill_modifier: "樱花之丘"
 JAP_pnr_rural_revival: "农村复兴"
 JAP_pnr_rural_revival_desc: "自从明治维新之后，我国农村地区就被有意地忽视了。政府将农村视为了走向工业化和现代化的代价，借助收入差距不断地从农村吮吸人口到城市之中，使得农村在各种意义上都陷入了不安和动荡之中。但是农民们也是人，农地如果没有人耕种，就自然而然地会荒芜，这就是事物运行的根本道理。"
 JAP_pnr_patriotic_industrial_workers_association_0: "爱国产业工人会"
 JAP_pnr_patriotic_industrial_workers_association_0_desc: "名为“爱国产业工人会”的组织是随着第一次世界大战后建立的暴力团组织，由在闲时无所事事的产业工人们组成。他们大多是建筑工人，因此总是会有一段游手好闲的时间——在警察的指导之下，他们成功转型成了右翼工人团体，负责在不好出面的时刻去担负起责任，把爱国精神注入到学生和左翼工人等自由主义者的脑袋，肩膀和横膈膜里。"
 JAP_pnr_patriotic_industrial_workers_association_1: "爱国产业工人会"
 JAP_pnr_patriotic_industrial_workers_association_1_desc: "$JAP_pnr_patriotic_industrial_workers_association_0_desc$"
 JAP_pnr_subsidized_festivals: "补贴祭典"
 JAP_pnr_subsidized_festivals_desc: "祭典乃是日本的生活传统，既是日本人对诸神和祖先的敬畏之礼，也是生者们相互沟通，增进感情的活动。然而随着越来越多的人流向城市，越来越多的人被“工作”夺去了时间，导致祭典本身也遭到了荒废。我们将以行政手段拨乱反正，我们将把传统重新带回到这个国家之中。"
 JAP_pnr_uprooting_intermediaries: "拔除中介"
 JAP_pnr_uprooting_intermediaries_desc: "就像天皇陛下和他的臣民之间的联系被许多心怀不轨的人截断了那样，城市和农村也被辗转于这两地之间的，投机倒把的倒卖者们硬生生地撕裂成了两个群体——它们之间本应该和谐相处，却因为这许多“工作介绍者”和“粮食倒卖者”的原因而彼此憎恨。想要修复二者之间的裂痕，最先要做的就是把这些中介都处理掉。令种地的男性安心种地，让调试机械的男性继续调试机械，让人们各安其位，而不受到“想要赚大钱吗？”、“你值得更好的地方。”等等邪恶诱惑的干扰。"
 JAP_pnr_preaching_god_with_bread: "以面包宣扬神"
 JAP_pnr_preaching_god_with_bread_desc: "人群饿了，向耶稣讨要食物，耶稣便向他们讨了五张无酵饼和两条鱼，并喂饱了数千人。他以神迹宣扬了面包，凭借天神的力量满足了人们的物质要求；而人群很快又饿了，他们继续寻找能够讨要食物的人，于是他们遇到了马克思。\n\n马克思告诉他们，如果你们想要真正的食物，就要为了神灵——革命之神——而献出自己的力量，马克思以面包宣扬了神迹，凭借人们对物质的渴求将神灵的信仰注入到他们的躯壳之中。\n\n——出口王仁三郎"
 JAP_pnr_imperial_way_economy_idea: "皇道经济"
 JAP_pnr_imperial_way_economy_idea_desc: "所谓的“皇道经济”所指的正是一种纯良的，复古的经济模式，既然这个国家的一切都属于天皇陛下，那么身为臣民的我们就应该摆正态度，所谓的“交易”是不存在的，在这里我们所使用的，所消耗的便都是天皇陛下，或者说是建立此世界的根基天神国常立尊和开启日本皇统的天照大神所留下来的财宝。\n\n正因如此，天皇陛下显然是所有财产的主人，而我们的所有债务也不过是顽童之间扮演家家酒的道具。只要由天皇陛下下令，以他的力量印刷一张数百亿日元的钞票，并用这张钞票去兑下这场扮演里积累的“债务”，就像古时天神们赐予凡人宝物那样，这样就可以暂时解决我国社会当前所面对的大多数债务问题。"
 JAP_pnr_oo_getsu_hime: "大宜都比卖"
 JAP_pnr_oo_getsu_hime_desc: "须佐之男心怀愤怒杀死了她，因他误认为她以污秽的方式愚弄，轻贱三贵子的荣誉。\n当大女神死后，其尸体化为五种种子：\n其头部长出蚕茧，\n其眼部长出水稻，\n其耳部长出粟米，\n其阴部长出小麦，\n其臀部长出豆类。\n神皇产灵尊啊，将五谷从她的尸体上采撷，并播撒向人间。"
 JAP_pnr_once_more_as_one: "再度一体"
 JAP_pnr_once_more_as_one_desc: "社会是由许多勤勤恳恳工作的人集合在一起形成的。在遥远的古代，在神明依然行走在人间，人们尚未失去纯真的时代，正是这种勤恳的道德将人们团结在一起，并跟随着神明们一同取得了一个又一个奇迹。然而随着人心被自私之毒侵蚀，神明们告别了人类，邪灵们开始入侵人类的居所，他们带来了瘟疫，饥荒，死亡和战争。\n神明们为人类所遭受的痛苦哀伤，他们说：“假如人们守住了他们的美德，这些痛苦便不会发生。但我们不忍心看到这样的事情，让我们为他们派遣一位使者，让我们派遣一位治天之君领导他们吧。愿他们早日醒悟，再次团结在一起。”，如今我们失去的美好品质又一次回到了我们的社会之中，从岛屿的最东边到岛屿的最西边，人们确实再度团结在天皇陛下周围。而终有一日，从[JAP.GetName]到南极洲，世界上所有人都将在团结在天皇身边。"
