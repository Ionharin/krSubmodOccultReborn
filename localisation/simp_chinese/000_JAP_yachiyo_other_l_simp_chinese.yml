### Guide and Intro ###
 JAP_KR_pnr_gathering_storm_desc: "日本的一切似乎都在世界大战之后被冻结了，经济的停滞，军队的衰败以及帝国议会的僵持自20年代延续至今。尽管许多人都尝试打破这一现状，其成果却寥寥无几。1923年无政府主义者刺杀摄政王裕仁未遂促使政府出台《治安维持法》，但野蛮燃烧的民意最终焚尽了这部法律，也令帝国议会陷入了“悬峙议会”的僵局。关东军对奉天政府的进军没有起到任何成果，民众们依然厌恶军人，将帝国之外的领土视为税收负担而非成果与奖杯。\n\n1936年的朝阳照常升起，而日本是否能寻找到打破冰封的机会，重新主宰自身在亚洲乃至世界上的命运，她终将在这风起云涌的新世界中给出自己的答案。"
 JAP_country_intro_header: "泥淖：世界大战十六载后"
 JAP_country_intro_content: "随着世界大战尘埃落定，§j日本§!昔日的盟友们不是王冠坠地，就是深陷危机。§j日本§!因远离欧洲大陆而逃过了黑色雄鹰的阴影。即便如此，它还是承受了来自旧世界的皇帝的怒火：受关税壁垒与德国商业霸权所阻，§j日本§!几乎被拒于中欧同盟庞大的市场之外，而它所背靠的太平洋上的邻居——美利坚合众国也深陷萧条，导致§j日本§!的出口受到了完全的打击：就这样§j日本§!跌跌撞撞地走进了被称为“失落的十年”的20年代，§j日本§!经济萧条、政治动荡，农业上的困境尤其严重，这导致人口发生了大规模迁移，农民从萧条的农村逃往城市，涌入劳动力市场，进一步压低了雇员的工资。\n\n1923年9月的关东大地震使§o日本无政府主义者§!看到了复制§r法国工团主义§!革命的机会。然而，§o无政府主义§!起义遭到镇压。在随后的红色恐慌中，一名名叫§o难波大助§!的无政府主义者于12月27日试图刺杀摄政王裕仁。日本历史上首次在全国范围内实施戒严。臭名昭著的《治安维持法》正是§c田中义一§!内阁值此混乱之时颁布的，该法律赋予国家对任何企图危害“国体”者处以死刑的权力。\n\n然而出口为主导的经济坠落仍未停止，1926年初，所谓的“地震券”和台湾银行丑闻爆发，导致一系列大规模银行倒闭。在外交方面，田中优柔寡断的政策既未能保护日本在中国的利益免受国民党北伐的威胁，也未能阻止德国的干预。他的统治弱点暴露无遗。1926年4月，帝国议会中形成了一个对抗§c田中义一§!的联盟，发起“第二次保宪运动”。面对民众对反对派的支持以及摄政王裕仁的间接干预，田中及其内阁被迫辞职。在后来被称为“1926年宪政恢复”的事件中，§c立宪政友会§!和§m宪政会§!组建了“宪政联盟”内阁，承诺实行民主治理、成年男性普选和政党内阁制，并废止了《治安维持法》。尽管两党很快分道扬镳，但他们确实凭此保全了日本最后的民主余火。\n\n自1926年以来，§c立宪政友会§!已统治日本十年，犬养毅的内阁也已延续近十年。在这十年中，日本的经济迎来了缓慢的恢复，犬养毅和其内阁再一次与欧洲世界建立了经济联系，通过奥地利帝国和奥斯曼帝国这两个较为开放的国家来融入到中欧同盟主导的世界经济之中——另一方面，日本也重建了自己的出口产业，从奉天政府到中亚地区的国家，甚至是遥远非洲大陆的开罗都可见到日本的产品。然而这一切都只是经济的缓慢恢复，而非增长。日本宛如被某个神灵冻结在了十年之前，对民众来说，1936年同1926年似乎并未有什么分别，但犬养毅和他的§c立宪政友会§!即将在接下来唤醒沉睡的日本，将它引向未来。"
 JAP_country_intro_header_1: "和平：世界大战与“黑色星期一”"
 JAP_country_intro_content_1: "1914年8月23日，大日本帝国深感时机已至，遂基于此前缔结的英日同盟向德意志帝国宣战，日军很快就将山东半岛的胶州港，德属萨摩亚与德属新几内亚纳入自己的势力范围，德意志帝国深陷欧洲泥淖无暇东顾，其在亚洲地区的殖民利益也暂时落入日本手中。由于远离欧洲战场，日本随后便进入了被称为§l大战景气§!的经济高速发展期。大隈重信内阁一方面借助条约和协议对袁世凯及其死后的段祺瑞政府进行经济控制，尝试通过提供日本借款来实现中国的币值改革，从而将中国经济纳入日元圈；另一方面则借世界大战期间的供求失衡大肆向欧洲出售各类战时物资：战争对商业用运输船的破坏使欧洲地区陷入了运力紧张，随之而来的是海上运费暴涨，这使得拥有强大海运能力而又远离欧洲主战场，基本没有战争损失的日本借此赚取了大量间接性贸易收入，而政府也从战前的负债国摇身一变成为手握协约国大量债权的债权国。\n\n就在日本大发战争财的同时，欧洲战局却急转直下：协约国在1918年遭到了重大打击，俄国与罗马尼亚首先出局，然后是斐迪南·福煦失败的春季攻势，协约国失去了八十万有生力量，这间接导致他们无力为东南欧的巴尔干盟友分担压力。在法国重整旗鼓，进行“最后攻势”行动的时候，§r法国总工会（CGT）§!和§R工人国际法国支部（SFIO）§!猝不及防地发动了全国总罢工，生产瘫痪使协约国的“最后攻势”几乎立刻崩溃，并最终促成了德意志帝国在欧洲的胜利与《凡尔赛条约》的签订。国内情况也不容乐观，地主和米商因预期日本将出兵西伯利亚而哄抬米价，引发了全国范围的物价骚乱，另一方面，由于米作为家庭再生产劳动的生活资料，使得彼时的女性较男性更直接感受到了米价上涨对生活的压迫，这意外地促成了§R女性社会主义§!在危机时期的发展。§a寺内正毅§!内阁随即垮台，政府的权力落入到§N平民首相§!§c原敬§!的手中。\n\n日本代表团虽然出席了和平会议，但他们拒绝放弃自己在亚洲取得的战果，也因此拒绝在合约上签字。皇帝的怒火立刻降临在日本身上，尽管没有直接的武装冲突，德国及其盟友还是立刻对§m黄祸§!挥舞起经济的大棒，以贸易封锁惩罚了日本人。虽然日本国内因德意志帝国的横暴而激起了继续战斗的决心，但协约国在世界大战中的战败和欧洲市场的消失则为日本随后持续不断的经济危机埋下了隐患的种子。\n\n世界大战结束后的国际市场在短暂调整之后，市场供求关系开始向战前状态回归，而日本则被排除在这次经济恢复的浪潮之外，其在战时从各强国手中夺得的市场如今或是因战时需求消失而萎缩，或是落入到柏林企业手中。债权方面，阿尔及尔的法国政权拒绝偿还债务；俄罗斯大地上，布尔什维克、白军与萨文科夫的北方起义军激斗正酣；联合王国也未曾向日本兑付一分钱，近十亿日元的对外债权如今只能兑现为大藏省官僚苍白的脸庞和几张废纸。外交困境和国际贸易受阻的问题很快传递到国内经济之上，日本的物价指数因处于“战争状态”而逆世界整体趋势持续上涨。\n\n1920年3月15日星期一，东京证券交易所开盘的那一刻，日本近代以来最大的经济危机降临了。"
 JAP_country_intro_header_2: "困境：外交努力与原敬之死"
 JAP_country_intro_content_2: "日本的经济一直到1920年12月才终于停止滑落：股票价格近乎腰斩，砂糖、大豆、稻米和棉线跌去60%，生丝跌去70%。大量在世界大战期间依靠出口贸易起家，为扩大市场进行了巨额投资的新兴康采恩在这场经济危机袭来之后陷入了严重亏损：铃木商店、久原矿业公司、古河商事、石井商会……企业经营效益的恶化令银行业出现了大量不良债权，最终促成了数十家银行的歇业和倒闭。时任日本首相§c原敬§!为拯救经济，一方面责令大藏大臣高桥是清通过日本银行融资3亿日元，另一方面则向德意志帝国释放出了希望外交关系正常化的信号。\n\n日本渴望打破国际孤立，通过国际贸易来改善其经济困境，而英国、俄国和美国则希望借机恢复战前亚洲的权力平衡——1921年10月，在美国的斡旋之下，§m第二中国财团（Second China Consortium）§!促成了《青岛协定》的签署，日本将包括胶州湾在内的德国殖民地全部归还给德国，德日将签订和平条约，日本可以维持其在满洲的“现有特殊利益”。与此同时，§P大谷喜久藏§!和§P由比光卫§!应§7瓦西里·博尔德列夫§!的邀请，前往哈尔滨商讨西伯利亚占领区的相关事宜。§c原敬§!内阁向二人施加了压力，这次会面最终使日本军队撤出西伯利亚，并停止了对§3谢苗诺夫§!和§4卡尔梅科夫§!的支持。作为交换，俄罗斯政府将确保日本在该地区的商业利益以及财阀特权地位。\n\n然而§c原敬§!的努力并不为日本民众所接受，经济萧条导致了劳资矛盾深化，继而在民众之中催生了愤怒的反精英主义。公众在青岛问题上指责政府的软弱，将其称为§o第二次三国干涉还辽§!；在西伯利亚问题上指责政府对在西伯利亚被杀害的日本侨民的漠视，所谓的《哈尔滨协定》则展示出政府无力捍卫日本人流血争得的土地，并且最终不过是和财阀特权阶级勾结，弃平民们于不顾。1921年11月4日，在东京车站，一位名为中冈艮一的火车站职员用短刀对§c原敬§!执行了“天诛”，其目的是清算从世界大战的战败到近期一系列“协定”的罪恶，§c原敬§!心脏破裂当场死亡。即便§c原敬§!已死，但日本的厄运才刚刚开始。"
 JAP_country_intro_header_3: "灾难：现实与经济的大地震"
 JAP_country_intro_content_3: "1923年9月1日，日本关东地区发生了7.9级大地震，这场地震中死伤超过20万人，而财产损失总额达到了约55亿日元。时任首相§P山本权兵卫§!先后颁布了取缔暴利令、延期支付令、日本银行赈灾票据贴现损失补偿令等紧急措施。和痛苦与混乱随之而来的还有令人不安的传言：§9朝鲜人§!正借此机会肆意放火，投毒与安放炸弹，试图颠覆日本政权，在他们的背后或许还有§r无政府主义者们§!的身影——§o不逞社§!，正是将日本人对朝鲜人的蔑称作为组织称呼的团体，其首脑为朝鲜无政府主义者§r朴烈§!与日本无政府主义者§r金子文子§!，他们从关东大地震的混乱之中看到了复制法国工团主义革命的机会。随着§a水野炼太郎§!明确说明“敌人是朝鲜人”之后，传言就升级为了街头暴力。在这心浮气躁、痛苦不堪的环境中，发誓要保卫家庭，为国效力的日本青年、自警团和军队在街头展开了公开的§o杀人混战§!，约有六千名朝鲜人、中国人和说方言的日本乡下人被送去了黄泉。\n\n日本无政府主义者们的首领§r大杉荣§!在此期间一边参与到自警团的凌晨巡逻任务之中，推着婴儿车照看邻居的孩子；一边和十五六位追随者在日落时分于家中会面讨论。他的行动被文学评论家内田鲁庵注意到，并且很快就被当地宪兵注意到。9月16日，§r大杉荣§!失踪了，人们本以为他或许已遭宪兵杀害，但在三四天之后他毫发无伤地出现在了朋友们面前，似乎是自警团团员的身份保全了他的清白，但他和“朝鲜人叛乱”之间的关系直到今天也尚不清晰。\n\n在持续近半个月的§o对朝鲜人虐杀§!之后，警察们发现这些暴力事件非但没有控制住社会稳定，反而还进一步导致了混乱，对私刑团伙的打击随后开始。政府开始宣称“无政府主义者煽动的暴乱已遭到镇压”，日本在灾难之后也总算迎来了一段稳定时期。直到1923年12月27日，一名名叫§o难波大助§!的无政府主义者在虎之门发动了一次对皇太子裕仁的失败刺杀，目的是给“关东大地震时死去的同志报仇”与“让民众知道天皇不是神灵，是会§o流血§!的凡人”。这次刺杀迫使§P山本权兵卫§!内阁即刻辞职，日本也首次在全国范围内实施戒严。\n\n接任§P山本权兵卫§!的是§c田中义一§!大将，为了维持社会稳定，§c田中义一§!指示日本银行向普通商业银行提供总共5亿日元的救灾借款，再由普通银行贷款给各大康采恩：铃木商店、古河商事、石井商会，这些在1920年便已破绽百出的大公司搭上了灾后救济的便车，把救灾贷款转变成了救济贷款。§c田中义一§!还趁帝国议会中的反对派混乱之际，强行颁布了《治安维持法》，该法赋予国家对任何企图危害“国体”者处以死刑的权力，象征着田中政权的严酷统治。然而事与愿违，§c田中义一§!内阁依然未能抵挡经济萧条的浪潮：1925年英国革命的爆发，日本在欧洲市场中仍遭到德意志帝国的隐形限制问题，以及美国经济的持续衰退都使得日本的对外出口经济毫无起色，1926年初，由§c田中义一§!亲自埋下的经济炸弹也随之爆炸，台湾银行在延长还贷期限之后仍有超过3亿日元无法收回，大藏大臣在议会中的失言引发了挤兑风波。在外交方面，§c田中义一§!未能保护日本在中国的利益免受国民党的威胁。\n\n日本各方势力都借这些向内阁发难：首先是宫中集团，本已失能的§P天皇§!见地以宸翰再次重申了“军人敕语”的地位，此举被认为是对前政府推行的强力政治的不满；随后是§c犬养毅§!等人的“宪政联盟”，敕语和经济危机被议会中的诸党人认为是可被用于讨伐朝敌的§p锦之御旗§!，变相促成了陆军内阁的倒台；而后是陆军内部的倾轧，与§c田中义一§!所代表的“长洲阀”相对立的，以§P上原勇作§!为代表的“萨摩阀”借此向政府发起了全面攻击。正是在这各方势力的围攻之下，§c田中义一§!的内阁最终只能倒台，而他本人也在不久之后因心脏病而去世——在他去世的这一点上，始终有人相信这是§f宫中阴谋§!使然。\n\n如今日本的命运握在了短命的§c宪政§m联盟§!§!手中，在推行了日本明治维新以来第一部没有资产门槛限制的成年男性普选法之后，§c宪政§m联盟§!§!也因内部政见不同而随之瓦解。普选法施行后产生的帝国议会众议院席位出乎所有人的意料：没有多数党，这开启了日本的§S悬峙议会§!时代。而随着元老决定将组阁大命降给§c犬养毅§!后，属于这位老者的十年执政之路也一同开始。动荡的1926年以§P大正天皇§!驾崩告终，其子§P裕仁§!即位，年号昭和。新天皇的登基并未给日本带来更多好消息，日本依然在浩瀚的海洋上挣扎着，几近溺毙。"
 JAP_country_intro_header_4: "冒险：铩羽而归的大陆干涉"
 JAP_country_intro_content_4: "“§m军人§!近乎§6小儿§!，只是喜欢所谓英雄，渴望所谓荣耀，如今也无需多说了。他们§6幼稚的脑袋§!只懂得机械般的训练，§6未开化的心灵§!只拥有动物般的勇气，这也是只有在§6小学生§!身上才能看到的现象。肆无忌惮地屠杀，则完全跟§6小儿§!没什么不同。特别和§6小儿§!相似的，是一受喇叭和军歌的鼓舞，就不问是为什么而战，欣然对敌。”\n\n在德意志帝国以经济讹诈的形式攻击日本的时候，日本民众起初仍支持对德国的作战。但随着经济危机的发生，《青岛协定》和《哈尔滨协定》的签署，在日本社会中转而出现了一股独特，且逐渐蔓延的§q颓废和平浪潮§!。民众以德意志帝国的军国主义霸权作为攻击的对象，普鲁士式的，无休止的军备竞赛最终招来了一场世界大战。在各方大战一番，平民百姓死伤殆尽之后，所留下的不过是暴力者中的最暴力者。日本民众痛斥武力和战争只能给世界带来破坏和不公，而不能带来经济和生活上的实际益处，即便是所谓为了“维护和平”的国防工程也不过是战争的导火索。尽管日本民间由于战后经济危机和日本失败的外交现状产生了这样的思潮，但陆军和海军都未停下他们扩充实力的脚步。\n\n日本的海军建造计划几乎永无止境，雄心勃勃的帝国海军提出了§1八八舰队§!计划，其目的是增强海军实力以对抗德国公海舰队。每当帝国议会决算预算之时，海军大臣便会指出德国的十二艘普鲁士级和齐格弗里德级战列舰对日本的威胁，首先下水的是土佐级战列舰，该舰随后便被改装为航空母舰，然后是纪伊级战列舰和秋级战列舰。在得知德国追加了四艘沙恩霍斯特级战列舰的建造之后，帝国海军则决定以追加生产纪伊级和秋级战列舰的方式继续追赶。而日本陆军则在旁观完欧洲战场之后决定不遗余力地推进陆军现代化，§P由比光卫§!大将彼时因出兵攻占西伯利亚而势头正盛，他借机通过帝国议会向政府发难，要求政府增加陆军军费来实现现代化：战车大队、扩充航空兵规模、购买高射炮和轻机枪、辎重部队摩托化……陆军的现代化计划在1920年的金融危机和《哈尔滨协定》签署后就宣告泡汤，民众不再支持一支没有成绩，只是一味地消耗国家预算的军队。而陆军也因为地位的变化旋即加入到了§q和平浪潮§!的大势之中：反对海军那“令人不齿”的，浪费国家预算的造舰计划，并主张推行§9更公平的温和军备重整计划§!。1923年的关东大地震首先导致日本政府为救灾所需的临时开支增加，民众变得更加无法§o忍受§!军费的增长，他们呼吁立刻停止军备扩张，把国家预算用在真正该用在的地方。1925年§r英国革命§!的发生则为政府控制海军膨胀提供了进一步的理由，§M党人们§!与§P陆军大臣§!联合起来，以英国革命中§r人民的力量§!向海军施加压力。其结果是海军军费预算遭到大幅§k削减§!，所有战列舰的建造工程都被迫§k停止§!，许多舰体遭到§k拆解报废§!。\n\n1928年，§e奉天冲突§!爆发，这使得遭到压制的§P日本陆军§!看到了通过获取战果来得到更多预算的机会。在得到了§e张作霖§!的承诺之后，1928年秋末，§P金谷范三§!将军指挥的朝鲜军和§P村冈长太郎§!指挥的关东军在牡丹江和宁安对§a康斯坦丁·萨哈罗夫§!将军发动了突袭，最终协助§e奉天政府§!夺下了中东路，奠定了日本在满洲的谈判地位。这一行动的最终协议是：日本释放俄国战俘，换取俄国军队从满洲完全撤出，将中东路地区事实上移交给§e奉天政府§!。但为什么？日本一而再再而三地将自己直接夺得的胜利果实拱手交予别人，日本民众并不为“帮助奉天”而获得的间接收益而感到欢喜。随后是§e张作霖§!的阳奉阴违，日本虽然通过§x满铁集团§!在名义上几乎控制了满洲所有经济领域的资产，但它们大多位于旧铁路区域沿线，而§e奉天政府§!始终尝试通过修建新铁路和建设新设施来削弱§x满铁§!对他们的控制。到1935年末，§x满铁§!对§e奉天政府§!的影响力虽然仍举足轻重，但其整体影响力也不过仅剩两成。许多日本士兵的血就这样白流了。\n\n日本陆军的军事冒险并未给国家带来更进一步的成果，反而将军人进一步置于死地。日本民众依旧厌恶战争，如今又以§0军事冒险的失败§!进一步作为呼吁和平，要求注重经济恢复的筹码。军人们试图求助陆海军大元帅，那位作为神灵的§P今上天皇§!依旧维持着自身的神秘，§a宫中重臣们§!亦不愿让天皇作出有损在民间威望的事情。帝国议会中，两位宪政之神，强调民众力量的§n尾崎行雄§!与主张议会政治的§c犬养毅§!首相本身便是支持军备缩减的先锋——他们相信军备裁减之后节省下来的资金将能够用于修复国内的残破不堪的经济。军队无意同时对抗民众和议会，在象征性的抵抗之后便举手投降了。至此，现实的经济压力迫使日本军队失去了除§o削减军队规模§!之外进行§P军事现代化§!的可能性。而复员军人的§m安置问题§!又对社会造成了进一步的冲击。在过去的时间里，日本民众将军人视为§o战争贩子§!，这使得他们难以寻找到一份合适的工作，§c犬养毅§!政府尝试通过把这些军人强制安置为体育或爱国主义课程教师来缓解失业问题，但§q和平思潮§!的流行之下，时至今日他们在学校中也未能得到足够的尊重。"
 JAP_country_intro_header_5: "神话：大正无政府主义/大正社会主义运动的记忆"
 JAP_country_intro_content_5: "“开门啊，开门啊。为什么你们安逸地住在§p桃色的房间§!里，而我们却在§a灰色的原野§!中奋斗漂泊？打开门啊，把你们的心也变成§a灰色§!，唱着§a灰色§!的歌，和我们一道追求平等的§r幸福§!。”\n\n§O大正§!，一个尚未过去多久但已经成为一种神话的产物。以§M黑龙会§!的§n内田良平§!与§n头山满§!在1905年组织的§f日比谷烧打事件§!为开端，日本的§S大众§!第一次诞生了。§l大正德莫克拉西§!，§r大正无政府主义§!，§1大正生命主义§!皆是从那把大火中出现的事物。首先发生的是天皇本身的不在场。随着§S大众§!这一概念的出现，一部分§o早期社会主义者§!，如今应该称为§r无政府主义者§!便从§S安部矶雄§!的《社会问题解释法》的基督教式的人道社会改良与§r片山潜§!的《我们的社会主义》的劳动-组织关系之中抽身，转而去研究与§S大众§!相对的§P天皇§!。\n\n研究的最终成果在1910年于全体日本国民面前§M发表§!，§o宫下太吉§!和§o菅野须贺子§!怀抱着§a朴素科学主义§!的精神，相信大众既然认为天皇是不可侵犯的神灵，那只需通过炸弹将神灵炸碎，就能使人们意识到天皇不过也是会§o流血§!的凡人，从而拂去笼罩在日本上方的§P蒙昧主义§!。这场炸弹袭击以失败告终，而这场被后世称为§o大逆事件§!的失败刺杀也导致§r日本社会主义运动§!进入了寒冬。人们，§r大正社会主义者们§!开始搁置§P天皇制§!，因为正视它就必须正视与之相伴的§o大逆事件§!。首先是将§2民主主义§!称为§6民本主义§!，剥离了主权问题；然后是后来的§a天皇机关说§!——制定了天皇制的§P明治宪法§!本就依赖§f黑格尔派§!的§O洛伦兹·施泰因§!的理论，所谓§a国家机关§!不过是一种追认，而非一种对天皇制的分析。\n\n在§x马克思主义§!将天皇制的根基挖出之前，人们始终未能把握天皇制的本质，甚至无法对这个隐藏之物进行思考。不论是§S白桦派§!还是§l自然主义者§!，在他们的论述中天皇是始终在场的不在场者，那个在§p桃色房屋§!门外的§P访客§!，在当下不存在，而永远存在于未来的下一刻。在这种苦闷的缠绕下，§S白桦派§!转向了§7新村运动§!，主张村社范围内的§n农业乌托邦§!；§l自然主义者们§!则将自己限制在个人五感所能触碰到的地方，听到流水声代表有活水，看到树木才会有树叶飘落，作为装置的天皇就在文字之外，无需描述，也不可被触碰。\n\n然后是大正元年，§S荒畑寒村§!与§r大杉荣§!创办了《近代思想》杂志，作为以不追问天皇制为出发点的启蒙性杂志，该杂志最终促成了§r无政府§!-§x布尔什维克主义§!论战（§k安那-布尔论争§!）。重视直接行动而轻视理论的§r无政府工团主义§!在论战中被§x布尔什维克主义§!击败，一方面由于§x布尔什维克主义§!明确了工人的国际团结；另一方面则是§r行动的无政府工团主义§!难以与彼时因§N米骚动§!之后蓬勃的§n农民运动§!相互响应。§x布尔什维克主义§!最终在日本实现了对§r无政府主义§!的§j超克§!。\n\n然而§r无政府主义§!在日本并未失败，他们以一种更§0扭曲§!的方式保存了下来。日本无政府主义者一方面从§r克鲁泡特金§!处得到了基本理论，另一方面则从§S夏尔·贝玑§!的诗歌与§o乔治·索雷尔§!的《暴力论》中获得了锋利的武器，§o神话§!本身。这种对§o神话§!的追求恰恰使他们能够向被搁置的天皇制倾斜：§n维新政治§!。§P右翼无政府主义§!就这样诞生了：焦虑的日本中下层青年于§p存在主义§!的层面被纳入天皇制中，并最终形成了§n青年将校运动§!。被回溯性构建的§c国家§!和§n故乡§!是新的主题，§7新村运动§!被§n橘孝三郎§!与§n权藤成卿§!继承，§r个人恐怖主义§!的行动被§o血盟团§!继承，§l自然主义§!也得到了§0野口米次郎§!等§q神秘主义者§!的发展，无政府主义者们的思想最终被§n农业民族主义者§!和§n国家民粹主义者们§!借鉴并传承了下来，成为了§P维新§n运动§!§!的重要原动力。"
 JAP_guide: "§M日本共产党§!/§M日本劳动组合全国评议会§!/§M劳动者农民党§!（$totalist_coloured$/$radical_socialist_coloured$/$syndicalist_coloured$/$social_democrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级大于85，触发陆军对海军的调查事件。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议前夕，让§S山本宣治§!准备发表红旗演讲，确保此时§x赤色阴谋§!的等级大于75。\n\n§M日本共产党§!（$totalist_coloured$/$radical_socialist_coloured$）\n£white_dot 在完成国策§p打破历史循环§!前确保§N沉重的现实§!并未压过§x展翅的理想§!从而维持§M人民同盟§!的存续，并确保§t全日本农工同盟§!占据主导地位，即可维持$radical_socialist_coloured$。\n£white_dot 或者在任何时刻，让§N沉重的现实§!高于§x展翅的理想§!从而令§M人民同盟§!破裂，§o全日本农工同盟§!就会发动阵线清洗，从而作为$totalist_coloured$主导同盟。\n\n§M日本劳动组合全国评议会§!（$syndicalist_coloured$）\n£white_dot 在完成国策§p打破历史循环§!前确保§N沉重的现实§!并未压过§x展翅的理想§!从而维持§M人民同盟§!的存续，并确保§r日本劳动组合全国评议会§!占据主导地位。\n\n§M劳动者农民党§!（$social_democrat_coloured$/$radical_socialist_coloured$）\n£white_dot 在完成国策§p打破历史循环§!前确保§N沉重的现实§!并未压过§x展翅的理想§!从而维持§M人民同盟§!的存续，并确保§S社会大众党§!占据主导地位。在随后的事件中，可选择重组§M劳动者农民党§!（$radical_socialist_coloured$）或维持§M社会大众党§!（$social_democrat_coloured$）\n\n\n§M国柱会§!/§M金鸡俱乐部§!/§M犹存社§!（$totalist_coloured$/$authoritarian_democrat_coloured$/$national_populist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过，确保此时§x赤色阴谋§!的等级大于50小于75。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项，§M大日本斗争生产联合§!就会在随后开始向东京进军。\n\n§M国柱会§!（$totalist_coloured$）\n£white_dot 确保在完成国策§p大东亚协和§!之前，神武会三羽乌中§o石原莞尔§!处于优势地位。\n\n§M金鸡俱乐部§!（$authoritarian_democrat_coloured$）\n£white_dot 确保在完成国策§p大东亚协和§!之前，神武会三羽乌中§a安冈正笃§!处于优势地位。\n£white_dot 如果希望让§a孔德成§!上台，则需要在此之前完成国策§p斯文同盟§!，将§a孔德成§!带到日本。\n\n§M犹存社§!（$national_populist_coloured$）\n£white_dot 确保在完成国策§p大东亚协和§!之前，神武会三羽乌中§n大川周明§!处于优势地位。\n\n\n§M大本教§!/§M昭和神圣会§!（$national_populist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过，确保此时§x赤色阴谋§!的等级小于50。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项，§M昭和青年团§!就会在东京集结。\n£white_dot 在事件§M手持火剑前往伊甸§!中，选择“陛下和圣师维持了友谊”则可以维持§n裕仁§!作为领导人。如果选择“陛下批评了皇道世界的愿景”，过一段时间§n裕仁§!就会被下毒，领袖会变成动态肖像的§n大本天皇§!。\n\n\n§M纯正社会主义党§!/§M皇道派§!（$social_democrat_coloured$/$national_populist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中任意一次选择支持雍仁的选项，§M皇道派§!就会在东京集结。\n£white_dot 在事件§M先发制人§!中，选择“主力包围皇宫”即可让政变成功。既可以拥立§n雍仁§!作为摄政，也可以让§n真崎甚三郎§!作为领袖执政（此时§n雍仁§!将作为民族精神提供较弱的效果）。\n£white_dot 在完成国策§p飘扬的锦旗§!后，如果§x毁灭§!高于§q缔造§!，则将维持$national_populist_coloured$，反之§S纯正社会主义党§!将作为$social_democrat_coloured$上台执政。\n£white_dot 在完成国策§p飘扬的锦旗§!后，如果§x毁灭§!等于§q缔造§!，且二者都达到最大值，在完成国策§p宁静之亚细亚§!不久后，§S隐藏事件链§!就会触发。\n\n\n§M一心奉公会§!（$authoritarian_democrat_coloured$/$paternal_autocrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上让《国家保安法》通过，在事件§M愤怒§!中选择“朕意已决”。\n£white_dot 或进入§M皇道派§!路线，并在事件§M先发制人§!中，选择“以诛杀国贼为重”，在事件§M愤怒§!中选择“朕意已决”。\n£white_dot 在完成国策§p宁静之亚细亚§!后，将根据先前在事件中做出的选择和完成的国策转变为真正统而不治的§a英式君主立宪§!或公武一和的§P昭和新政§!。\n\n\n§M反皇道派§!（$paternal_autocrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上让《国家保安法》通过，在事件§M愤怒§!中选择“宣布他们为叛军”。"
 JAP_guide_1: "§M立宪政友会§!/§M立宪民政党§!/§M政民连携§!/§M社会大众党§!/§M国民同盟§!/§M科学社会党§!/§M三叶俱乐部§!（$social_conservative_coloured$/$market_liberal_coloured$/$social_democrat_coloured$/$social_liberal_coloured$/$authoritarian_democrat_coloured$/$national_populist_coloured$/$paternal_autocrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项。\n\n§M立宪政友会§!（$social_conservative_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n£white_dot 若希望更换领袖，需要在§M五一五事件§!中选择“如今的首相也要杀”，§c铃木喜三郎§!的继任者是§c鸠山一郎§!，§c久原房之助§!的继任者是§c中岛知久平§!。\n\n§M立宪民政党§!（$market_liberal_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n£white_dot 若希望更换领袖，需要在§M五一五事件§!中选择“如今的首相也要杀”，§m滨口雄幸§!的继任者是§m町田忠治§!。\n\n§M政民连携§!（$social_conservative_coloured$/$market_liberal_coloured$）\n£white_dot 在选举中让§c立宪政友会§!和§m立宪民政党§!均未取得绝对优势地位，但其席位总和超过233席。\n\n§M社会大众党§!（$social_democrat_coloured$/$social_liberal_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n£white_dot 若§M红星与锁链§!中红星最后斩断了锁链（即§S革新力量§!大于§l稳健力量§!），则$social_democrat_coloured$将主导社会大众党。\n£white_dot 若§M红星与锁链§!中锁链最后束缚了红星（即§l稳健力量§!大于§S革新力量§!），则$social_liberal_coloured$将主导社会大众党。\n\n§M国民同盟§!（$authoritarian_democrat_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n\n§M科学社会党§!（$national_populist_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n\n§M三叶俱乐部§!（$paternal_autocrat_coloured$）\n£white_dot 在§M黑色星期一§!期间，选择至少三次让财阀认购/兼并的选项。\n£white_dot 在选举中让§c立宪政友会§!和§m立宪民政党§!取得绝对优势地位，终结“悬峙议会”的局面。稍后§P三叶俱乐部§!的国策树就会解锁。\n£white_dot 在完成国策§p有序的经济控制§!前确保Capital/Consumption/Cycle中朋友领先于家族，§P鲇川义介§!就会出席§P三叶俱乐部§!主席。\n£white_dot 在完成国策§p有序的经济控制§!前确保Capital/Consumption/Cycle中家族领先于朋友，§P池田成彬§!，§P岩崎小弥太§!或§P小仓正恒§!就会出席§P三叶俱乐部§!主席。"
 JAP_guide_2: "§M大政翼赞会§!/§M和盛公明会§!（$authoritarian_democrat_coloured$/$totalist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项。\n£white_dot 在选举中让任何一方都不要形成绝对多数，且压制§c立宪政友会§!和§m立宪民政党§!的席位总和不超过233席，维持“悬峙议会”的局面。\n\n§M大政翼赞会§!（$authoritarian_democrat_coloured$）\n£white_dot 在§a近卫文麿§!上台后触发的一系列事件中选择满足所有人的要求，不要让§M朝日樱§!有任何诞生的可能性。在完成国策§p元老的阴影之下§!后就会成立§a大政翼赞会§!。\n\n§M和盛公明会§!（$totalist_coloured$）\n£white_dot 在§o近卫文麿§!上台后触发的一系列事件中选择坚持§o昭和研究会§!最初愿景的选项，让§M朝日樱§!维持在高于§G新芽§!等级的状态。在完成国策§p元老的阴影之下§!后就会成立§o和盛公明会§!。\n£white_dot 为了能更简单地进入§o和盛公明会§!路线，§o近卫文麿§!可以出席全国巡回演讲，并在§M大坂危机§!中选择“许下的约定决不能打破”。即便先前向§f政党§!和§e军队§!部分妥协了，也依然能够进入$totalist_coloured$路线。\n\n\n§M大日本救国军人会§!（$national_populist_coloured$）\n£white_dot 以任何政体进行游戏，选择武力扩张的外交路线，在日本本岛被入侵后的事件中选择“德川义宽无路可走”，即可切换为§n大日本救国军人会§!。\n£white_dot §n大日本救国军人会§!需要在§M士气§!降至0之前控制所有核心领土，失去东京会令士气更快流失。当§M士气§!降至0时将强制投降。"
 JAP_guide_3: "§M战败后的日本共和国§!：§M日本共产党§!/§M宪政同盟§!/§M正义社§!（$totalist_coloured$/$syndicalist_coloured$/$radical_socialist_coloured$/$authoritarian_democrat_coloured$/$national_populist_coloured$）\n£white_dot 输掉中日战争，或失去所有在大陆上由自己或傀儡控制的领土。\n\n§M日本共产党§!（$totalist_coloured$/$syndicalist_coloured$/$radical_socialist_coloured$）\n£white_dot 在§M涉足深渊§!之后，选择扮演§M日本共产党§!。\n\n§M宪政同盟§!（$authoritarian_democrat_coloured$）\n£white_dot 在§M涉足深渊§!之后，选择扮演§M宪政同盟§!。\n\n§M正义社§!（$national_populist_coloured$）\n£white_dot 在§M涉足深渊§!之后，选择扮演§M正义社§!。"
### Party Name Setting ###
 JAP_pnr_totalist_party: "日本共产党"
 JAP_pnr_totalist_party_long: "日本共产党\n§L诞生于1922年的日本共产党是世界社会主义运动中的少数派，他们奉行一种基于马克思主义发展出来的学说——被称为布尔什维克主义。这一学说在过去曾响彻世界，如今却位于社会主义运动中的边缘，而它在日本的延续则是某种偶然与必然。\n\n在20年代的安娜-布尔论争中，布尔什维克主义者们以缜密的理论击败了无政府工团主义者，并从经济与社会角度挖出了长期以来被遮蔽的天皇与天皇制的根基进行批判，这使得该学说在日本收获了大批拥趸。\n\n因其对天皇制的反动，日本共产党被官方视为非法组织受到渗透和打击，该党虽然在数次政府抓捕行动中失去了许多中央委员，但在袴田里见的带领下，日本共产党目前在《1932年提纲》的指导下一边在内部清除叛徒，一边继续进行着革命斗争。§!\n\n§Y备注：日本共产党并非团结一体，内部仍存在派系冲突：坐镇巴黎，与雅科夫·斯维尔德洛夫领导的俄罗斯布尔什维克关系密切的“巴黎艺术与科学之友人协会”，目前由山本悬藏和国崎定洞等人领导；袴田里见和现已入狱的风间丈吉、锅山贞亲、德田球一等在日本活动的“本地派”；以及以野坂参三和渡边政之辅为代表的，从巴黎出发前往中国等地支援海外革命的“支援派”。§!\n"
 JAP_pnr_syndicalist_party: "日本劳动组合全国评议会"
 JAP_pnr_syndicalist_party_long: "日本劳动组合全国评议会(日本労働組合全国評議会)\n§L尽管工团主义/无政府主义运动在日本有着长久的历史，但自1910年大逆事件发生后，社会主义运动便大多处于被压制的状态。对工团主义者的压制在宪政恢复和普选确立之后略有放松。但原先代表着大多数日本工人呼声的日本劳动总同盟（日本労働総同盟）此时则被主张劳资协调的社会民主主义势力把持，并持有这激起了原先从农民劳动党（1925年成立）出身的工人的不满，他们谋求建立一个能够真正代表他们的组织。\n\n1934年日本劳动组合全国评议会成立，加藤勘十担任总帅，田部井健次任秘书长，该组织宣称自己代表着左翼劳工的利益，目前约有6000名成员。由于他们对阶级斗争的强调，该党在议会中并不受到欢迎，甚至一些意有所图的传言称他们不过是日本共产党在议会中的影武者。§!\n\n§Y备注：日本劳动组合全国评议会（日本労働組合全国評議会）、日本劳动组合全国协议会（日本労働組合全国協議会）、全国劳动组合同盟（全国労働組合同盟）是三个名称相似，但意识形态与主张均不同的组织，不应混淆。§!\n"
 JAP_pnr_radical_socialist_party: "日本共产党（多数派）"
 JAP_pnr_radical_socialist_party_long: "日本共产党（多数派）\n§L为清除党内叛徒，袴田里见推行了党员再登记运动，要求全部日本共产党员向党中央提交自我批评与个人信息。多数派便是反对该政策的基层党员们所结成的团体。他们团结在宫内勇和山本秋两名党员身边，认为叛徒可能不仅存在于各支部，也可能存在于党中央，而现在进行党员再登记只会让叛徒掌握更多信息——他们暗示叛徒就是袴田里见本人。多数派批评日本共产党陷入了极左激进主义和官僚作风之中，呼吁所有地方党员团结起来，为了从叛徒手中夺回党中央而发起对袴田里见的斗争。为此，多数派已将袴田里见的照片、衣着、走路方式公开在其官方报纸《多数》上。§!\n"
 JAP_pnr_social_democrat_party: "社会大众党（革新派）"
 JAP_pnr_social_democrat_party_long: "社会大众党（革新派）\n§L成立于1932年的社会大众党自诞生起就是一个暂时的联盟，它是由左派的全国劳农大众党和右派的社会民众党合流而成的产物。即便社会大众党在诞生之时或许受到了基督教社会主义的祝福，但如今人道的社会主义已经变成了一句空洞的口号。\n\n社会大众党中的革新派以社会大众党书记长$JAP_pnr_hisashi_aso$马首是瞻，他们主张在普选已经实现的当下应当真正地走到作为国家多数的大众中间去“亲和大众”，社会大众党应该在议会之中代表大众的利益。为了实现这一点，社会大众党应当采取一种灵活的战术。这使得他们虽自称为社会民主主义者，但却时常对当下的政治问题表现出更复杂的立场。$JAP_pnr_hisashi_aso$等人的方针受到了社会大众党内保守派的抵制，迟迟无法完全施行，但社会大众党的联盟终有一日将结束，而那时它将变成完全不同的东西。§!\n"
 JAP_pnr_social_liberal_party: "社会大众党（保守派）"
 JAP_pnr_social_liberal_party_long: "社会大众党（保守派）\n§L成立于1932年的社会大众党自诞生起就是一个暂时的联盟，它是由左派的全国劳农大众党和右派的社会民众党合流而成的产物。即便社会大众党在诞生之时或许受到了基督教社会主义的祝福，但如今人道的社会主义已经变成了一句空洞的口号。\n\n社会大众党中的保守派追随着社会大众党委员长，同时也是日本社会主义运动的先驱者安部矶雄。保守派们在今天依旧坚持着他们在社会民众党时期的“三反思想”：反对资本主义、反对激进社会主义、反对国家民粹主义。但随着革新派凭借“灵活战术”而在党内与党外的取得的势力越来越强大，保守派们在社会大众党内的权威也在被日益削弱，现在他们所能依靠的惟有安部矶雄的名望，但安部矶雄并非能永远保护保守派，社会大众党的联盟终有一日将结束，而那时它将变成完全不同的东西。§!\n"
 JAP_pnr_market_liberal_party: "立宪民政党"
 JAP_pnr_market_liberal_party_long: "立宪民政党\n§L1926年宪政恢复之后，由于政治格局的重组和执政理念的分歧，“护宪联盟”很快便破裂了，随后宪政会便改组成了名为“立宪民政党”的新党派。尽管名义上$JAP_pnr_market_liberal_party$是一个代表新兴城市中产阶级，偏向自由主义的党派，但作为与$JAP_pnr_social_conservative_party$交锋的国会大党，其执政承诺却几乎和$JAP_pnr_social_conservative_party$没有什么分别：$JAP_pnr_market_liberal_party$相信议会政治本身就是说出大多数国民希望听到的话。\n\n总的来说，$JAP_pnr_market_liberal_party$和$JAP_pnr_social_conservative_party$倡导几乎相同的政策，仅仅在经济上与政友会不同，支持自由放任而非国家干预。§!\n"
 JAP_pnr_social_conservative_party: "立宪政友会"
 JAP_pnr_social_conservative_party_long: "立宪政友会\n§L起源自1887年的大同团结运动，并于1900年成立的立宪政友会可谓是日本的第一个真正意义上的“政党”。作为帝国议会中的“长寿者”，立宪政友会刚诞生时并非是一个民主意义上政党。\n\n帝国议会成立后，掌控日本权力的藩阀集团如果无法得到众议院中的“民党”的支持的话，就难以推行预算和法律。伊藤博文为摆脱这种冲突局面而创设了立宪政友会，作为藩阀在众议院中的代理人挤压其他“民党”的位置，从而实现政治目标。然而随着立宪政友会掌握了众议院，它却开始反过来对抗藩阀，伊藤博文的计划落空了。在立宪政友会的领导之下，日本迈向了“宪政政治”。\n\n作为古老的政党，政友会的支持基础来自日本农村地区的富人与地主阶层，他们在经济上更支持干预性的政策。§!\n"
