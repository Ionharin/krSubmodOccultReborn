 JAP_pnr_three_year_national_transformation: "三年之国家改造"
 JAP_pnr_three_year_national_transformation_desc: "根据最初的目的，我国将暂停宪法三年时间，并在此期间施行国家改造的诸项内容。时间不等人，我们必须迅速行动！"
 JAP_pnr_three_year_national_transformation_timeout_tt: "我们将根据我们实现的§Y国家改造成果§!来获得多种§G增益§!。"
