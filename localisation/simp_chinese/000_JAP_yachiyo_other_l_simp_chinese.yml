### Decisions ###

 JAP_pnr_red_conspiracy_begun: "赤色阴谋正在蔓延。"
 JAP_pnr_red_conspiracy_category: "赤色阴谋"
 JAP_pnr_red_conspiracy_progress_title: "赤色分子正在行动"
 JAP_pnr_red_conspiracy_progressbar_tt: "赤色阴谋的当前强度为§R[?JAP_pnr_red_conspiracy_strength|0]§!/100。\n\n为了让政府能够通过《治安维持法》，我们必须确保社会能够感受到激进且暴力的工团分子的威胁，为此需要将赤色阴谋的强度控制在§Y25到75§!之间。\n\n如果该强度低于§325§!，帝国议会恐怕会对《治安维持法》提出更多诘难。如果该强度高于§t75§!，或许焦急的人们就会发现这一切只是我们的§R政治手段§!。"
 JAP_pnr_red_conspiracy_category_desc: "自我们将工团分子的地上势力铲除已经过去了十几年，但他们依然在地下世界茁壮成长。以§Y袴田里见§!为首的赤色领袖继续运营着他们在§G风间丈吉§!时期的“家屋资金局”。一方面利用知识分子同情，另一方面利用各种非法手段获取行动资金。长期以来我国缺乏用于打击这下隐藏赤色分子的强力手段，在1923年到1926年期间，我国在田中义一内阁的领导下曾存在过一部《治安维持法》，用于控制工团同情者并防患于未然。但此法案极大地限制了民权，甚至威胁到了宪法的正常运行，因此不久就被废除了。直到§0与之类似的法案§!施行之前，我们只能依靠警察和特高课的间谍来应对他们，但§Y袴田里见§!的疑心病很重，想要渗透他们简直难如登天。\n\n事实上我们并不知道他们的实际规模，但毫无疑问的是，在社会上愈来愈强的红色风暴威胁本身也是一个机会，如果我们能确保“工团阴谋”看上去足够有威胁，那么或许我们就可以借助民意实现某些§t特别的目的§!。"
 JAP_pnr_red_conspiracy_escalation: "£pol_violence 赤色阴谋升级"
 JAP_pnr_red_conspiracy_escalation_desc: "赤色分子的地下组织正在积蓄力量，如果不能及时遏制，他们的活动会变得更加大胆。"
 JAP_pnr_red_conspiracy_reduced: "赤色阴谋强度§G降低$RIGHT|0$点§!。"
 JAP_pnr_red_conspiracy_raised: "赤色阴谋强度§R提高$RIGHT|0$点§!。"
 JAP_pnr_red_conspiracy_curtail_red_press: "搜查《赤旗》报"
 JAP_pnr_red_conspiracy_curtail_red_press_desc: "长期以来日本共产党和其它激进的左翼社会破坏者都通过《赤旗》报来宣传他们的理念，它刊发了大量煽动工人罢工和农民起义的文章，并每天都在编造许多危言耸听的小故事，鼓动人们“向邪恶的资产阶级发起冲锋”。虽然我们无法完全杜绝他们在自己的非法出版物上摇唇鼓舌，但我们至少可以通过突袭来尽量压制它的传播。"
 JAP_pnr_red_conspiracy_activate_loyal_unions: "强化工会教育"
 JAP_pnr_red_conspiracy_activate_loyal_unions_desc: "与其放任这些因经济危机和生活不顺而逐渐激进的城市工人组织罢工和结成地下团体，不如利用我们目前已有的工会组织来向他们展示善意。大多数工人都并不是天生就想要反对政府，他们的大多数诉求大多只是经济诉求——而解决经济诉求是最简单的，只需要让他们相信他们的诉求已经被重视就行了。"
 JAP_pnr_red_conspiracy_establish_curfews: "咖啡馆登记制度"
 JAP_pnr_red_conspiracy_establish_curfews_desc: "夜间集会和秘密联络是地下组织赖以活动的土壤，临时宵禁能够打断他们的节奏。"
 JAP_pnr_red_conspiracy_arrest_activists: "逮捕劳工煽动者"
 JAP_pnr_red_conspiracy_arrest_activists_desc: "随着关于工团主义和马克思主义运动正在愈演愈烈的流言，一些胆子够大的思想犯终于露出了他们的马脚。"
 JAP_pnr_red_conspiracy_selective_reform: "选择性让步"
 JAP_pnr_red_conspiracy_selective_reform_desc: "有限的社会让步可以分化温和工人与革命分子，代价则由产业界和国家财政共同承担。"
 JAP_pnr_red_conspiracy_lapse_on_security: "偶然的警备疏漏"
 JAP_pnr_red_conspiracy_lapse_on_security_desc: "暂时放松警备可以释放一部分政治压力和行政资源，但地下赤色组织也会利用这个机会壮大自己。"

 JAP_pnr_kasumigaseki_diplomacy_category: "霞关外交"
 JAP_pnr_kasumigaseki_diplomacy_category_desc: "1871年，"
 JAP_pnr_south_china_melee_anq_decision: "华东混战：[ANQ.GetName]"
 JAP_pnr_south_china_melee_anq_decision_desc: "中国的华东地区，即八省联合因政治问题而陷入了叛乱之中，这对我国来说是个机会，如果我们想真正地削弱中国，就应该让他们持续处于分裂不和的状态中，或是支援对我们来说是潜在盟友的势力。无论如何，布局已经开始。"
 JAP_pnr_south_china_melee_chi_decision: "华东混战：[CHI.GetName]"
 JAP_pnr_south_china_melee_chi_decision_desc: "$JAP_pnr_south_china_melee_anq_decision_desc$"
 JAP_pnr_south_china_melee_lep_decision: "华东混战：[LEP.GetName]"
 JAP_pnr_south_china_melee_lep_decision_desc: "$JAP_pnr_south_china_melee_anq_decision_desc$"
 JAP_pnr_south_china_melee_shd_decision: "华东混战：[SHD.GetName]"
 JAP_pnr_south_china_melee_shd_decision_desc: "$JAP_pnr_south_china_melee_anq_decision_desc$"
 JAP_pnr_operation_spartacus_india_decision: "斯巴达克斯行动：印度"
 JAP_pnr_operation_spartacus_india_decision_desc: "我们通过瓦隆-彭达尔克会议与第三国际之间形成了一份秘密条约，我们将支持印度人民共和国在次大陆上的合法地位，换取第三国际对我军借道中国南下侵攻德属东亚的默许。只要我们在印度问题上表明了我们有履行条约的意愿，相信就能够让第三国际也同样履行他们应该做的事情——在对抗德意志帝国主义这一点上，我们显然是盟友。"
 JAP_pnr_national_security_bill_category: "国家保安法"
 JAP_pnr_national_security_bill_category_desc: "五·一五事件令社会陷入恐怖主义的动荡之中，而如今政府终于可以借此推进《国家保安法》的立法了。政府宣称该法律将加强对社会不安定分子的控制，并且捍卫我国摇摇欲坠的政治体系。1936年帝国议会临时会议即将在30天后召开，届时帝国议会中各党派将对该法案草案进行审议。面对此等政治丑闻，无论结果如何，在临时会议结束后众议院都将重新举行议员选举，并选出在当下情况里真正受到民众信任的内阁。\n\n我们可以从以下法条中选择五条组成《国家保安法》的草案，不过意料之中的是，草案在提交给帝国议会之后一定会引发广泛讨论，其最终形态可能与我们提交的草案略有差别……\n\n已选择法条：§Y[?JAP_pnr_nsb_article_count|0]§!/5"
 JAP_pnr_nsb_extraordinary_session: "1936年帝国议会临时会议"
 JAP_pnr_nsb_extraordinary_session_desc: "五·一五事件的发生使得现任政府开始尝试推行一部类似于《治安维持法》的法律《国家保安法》，预计该法律将在不久后召开的帝国议会临时会议上表决。在此之前我们还可以就草案进行事前协商。"
 JAP_pnr_nsb_ban_secret_societies: "取缔秘密结社"
 JAP_pnr_nsb_ban_secret_societies_desc: "以暴力、胁迫、武装行动、秘密谋议或其他非法手段实施下列事项之一为目的而组织之结社，为本法所称危害国家安宁之结社：（一）变革国体；（二）废止或以非法手段妨碍帝国宪法所定国家机关之职能；（三）推翻帝国议会、责任内阁或合法选举制度；（四）以革命手段否认私有财产制度，建立阶级独裁；（五）以暗杀、暴动、军事叛乱或其他暴力行为实现政治目的。"
 JAP_pnr_nsb_preventive_detention: "预防拘禁"
 JAP_pnr_nsb_preventive_detention_desc: "结社以实施危害国家安宁之事项为目的，就暴动、暗杀、破坏交通、夺取军警设施或其他非法行为进行具体协议、预备或谋划者，处五年以下惩役或禁锢。"
 JAP_pnr_nsb_monitor_front_organisations: "监视外围组织"
 JAP_pnr_nsb_monitor_front_organisations_desc: "以促使他人实施危害国家安宁之事项为目的，公开或秘密进行煽动、宣传、招募或散布行动指令者，处三年以下惩役或禁锢。"
 JAP_pnr_nsb_register_pressure_groups: "院外团登记制度"
 JAP_pnr_nsb_register_pressure_groups_desc: "以支援危害国家安宁结社为主要目的而组织者，或明知其性质而担任其负责人者，处五年以下惩役；加入者，处三年以下惩役或禁锢。"
 JAP_pnr_nsb_public_communications: "通信公开原则"
 JAP_pnr_nsb_public_communications_desc: "明知系危害国家安宁结社之机关文件、行动指令或秘密刊物，而以援助该组织为目的进行印刷、运输、销售、大量散布或秘密传递者，处三年以下惩役或禁锢。"
 JAP_pnr_nsb_military_official_responsibility: "军人-官吏特别责任"
 JAP_pnr_nsb_military_official_responsibility_desc: "现役陆海军军人、警察官吏及其他负有维持国家安全职责之官吏犯罪者，从重处罚。陆军省、海军省及其他有关官厅发现所属人员涉嫌本法犯罪时，应即进行调查，并将调查结果报送内阁及司法机关。不得以军纪、军机或内部处分为理由妨碍本法所定之调查。"
 JAP_pnr_nsb_emergency_suppression_power: "紧急取缔权"
 JAP_pnr_nsb_emergency_suppression_power_desc: "内务大臣认为某结社符合危害国家安宁之结社时，得经内阁同意命令停止其活动，并向行政裁判所请求确认其禁止。情况紧急时，得暂时禁止集会、募集资金、发行机关刊物及处分组织财产；未经法院确认者，临时处分不得长期继续。"
 JAP_pnr_nsb_judicial_warrant_principle: "司法令状原则"
 JAP_pnr_nsb_judicial_warrant_principle_desc: "检察官及司法警察官对涉嫌本法犯罪者，依刑事诉讼法进行搜查、扣押、讯问及拘留。搜查陆海军机关、军营或舰艇时，有关军政机关应予协助；涉及军机者，得采取保密程序，但不得拒绝提供与本法犯罪有关之证据。"
 JAP_pnr_nsb_freeze_suspicious_funding: "冻结可疑资助"
 JAP_pnr_nsb_freeze_suspicious_funding_desc: "被禁止或停止活动之结社，不得推荐候选人、支付选举费用、组织竞选人员或以其他方式进行选举活动。候选人明知而接受该组织之资金、人员、秘密宣传或其他实质援助者，由法院依选举法宣告其当选无效或停止一定期间之被选举资格。"
 JAP_pnr_nsb_reconsider_draft: "重新考虑草案"
 JAP_pnr_nsb_reconsider_draft_desc: "一些法条从目前的形势来看可能不再合适，我们应当重新考虑。"
 JAP_pnr_nsb_prepare_submission: "准备递交草案"
 JAP_pnr_nsb_prepare_submission_desc: "本法以维护国体、帝国宪法所定之统治秩序、帝国议会及合法政党政治之正常运行，并防止以暴力、胁迫、秘密结社或其他非法手段破坏国家安宁秩序为目的。"
 JAP_pnr_nsb_if_article_passes_tt: "若该法条最终通过，我们将获得："
 JAP_pnr_nsb_original_draft_submitted_tt: "政府将提交一部原始版本草案"
 JAP_pnr_nsb_longer_security_event_interval_tt: "国家保安事件将每150天而非90天触发一次"
 JAP_pnr_nsb_no_military_security_backlash_tt: "国家保安事件将不再触发军队的负面事件"
 JAP_pnr_nsb_weaker_parties_gain_fewer_seats_tt: "选举期间触发的事件将为议会中弱势党派提供更少席位"
