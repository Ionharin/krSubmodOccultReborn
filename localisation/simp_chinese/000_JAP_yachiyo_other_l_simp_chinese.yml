### Guide and Intro ###
 JAP_KR_pnr_gathering_storm_desc: "日本的一切似乎都在世界大战之后被冻结了，经济的停滞，军队的衰败以及帝国议会的僵持自20年代延续至今。尽管许多人都尝试打破这一现状，其成果却寥寥无几。1926年工团主义者对摄政王裕仁的刺杀促使政府出台《治安维持法》，但野蛮燃烧的民意最终焚尽了这部法律，也令帝国议会陷入了“悬峙议会”的僵局。关东军对奉天政府的进军没有起到任何成果，民众们依然厌恶军人，将帝国之外的领土视为税收负担而非成果与奖杯。\n\n1936年的朝阳照常升起，而日本是否能寻找到打破冰封的机会，重新主宰自身在亚洲乃至世界上的命运，她终将在这风起云涌的新世界中给出自己的答案。"
 JAP_guide: "§M日本共产党§!/§M日本劳动组合全国评议会§!/§M劳动者农民党§!（$totalist_coloured$/$radical_socialist_coloured$/$syndicalist_coloured$/$social_democrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级大于85，触发陆军对海军的调查事件。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议前夕，让§S山本宣治§!准备发表红旗演讲，确保此时§x赤色阴谋§!的等级大于75。\n\n§M日本共产党§!（$totalist_coloured$/$radical_socialist_coloured$）\n£white_dot 在完成国策§p打破历史循环§!前确保§N沉重的现实§!并未压过§x展翅的理想§!从而维持§M人民同盟§!的存续，并确保§t全日本农工同盟§!占据主导地位，即可维持$radical_socialist_coloured$。\n£white_dot 或者在任何时刻，让§N沉重的现实§!高于§x展翅的理想§!从而令§M人民同盟§!破裂，§o全日本农工同盟§!就会发动阵线清洗，从而作为$totalist_coloured$主导同盟。\n\n§M日本劳动组合全国评议会§!（$syndicalist_coloured$）\n£white_dot 在完成国策§p打破历史循环§!前确保§N沉重的现实§!并未压过§x展翅的理想§!从而维持§M人民同盟§!的存续，并确保§r日本劳动组合全国评议会§!占据主导地位。\n\n§M劳动者农民党§!（$social_democrat_coloured$/$radical_socialist_coloured$）\n£white_dot 在完成国策§p打破历史循环§!前确保§N沉重的现实§!并未压过§x展翅的理想§!从而维持§M人民同盟§!的存续，并确保§S社会大众党§!占据主导地位。在随后的事件中，可选择重组§M劳动者农民党§!（$radical_socialist_coloured$）或维持§M社会大众党§!（$social_democrat_coloured$）\n\n\n§M国柱会§!/§M金鸡俱乐部§!/§M犹存社§!（$totalist_coloured$/$authoritarian_democrat_coloured$/$national_populist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过，确保此时§x赤色阴谋§!的等级大于50小于75。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项，§M大日本斗争生产联合§!就会在随后开始向东京进军。\n\n§M国柱会§!（$totalist_coloured$）\n£white_dot 确保在完成国策§p大东亚协和§!之前，神武会三羽乌中§o石原莞尔§!处于优势地位。\n\n§M金鸡俱乐部§!（$authoritarian_democrat_coloured$）\n£white_dot 确保在完成国策§p大东亚协和§!之前，神武会三羽乌中§a安冈正笃§!处于优势地位。\n£white_dot 如果希望让§a孔德成§!上台，则需要在此之前完成国策§p斯文同盟§!，将§a孔德成§!带到日本。\n\n§M犹存社§!（$national_populist_coloured$）\n£white_dot 确保在完成国策§p大东亚协和§!之前，神武会三羽乌中§n大川周明§!处于优势地位。\n\n\n§M大本教§!/§M昭和神圣会§!（$national_populist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过，确保此时§x赤色阴谋§!的等级小于50。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项，§M昭和青年团§!就会在东京集结。\n£white_dot 在事件§M手持火剑前往伊甸§!中，选择“陛下和圣师维持了友谊”则可以维持§n裕仁§!作为领导人。如果选择“陛下批评了皇道世界的愿景”，过一段时间§n裕仁§!就会被下毒，领袖会变成动态肖像的§n大本天皇§!。\n\n\n§M纯正社会主义党§!/§M皇道派§!（$social_democrat_coloured$/$national_populist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中任意一次选择支持雍仁的选项，§M皇道派§!就会在东京集结。\n£white_dot 在事件§M先发制人§!中，选择“主力包围皇宫”即可让政变成功。既可以拥立§n雍仁§!作为摄政，也可以让§n真崎甚三郎§!作为领袖执政（此时§n雍仁§!将作为民族精神提供较弱的效果）。\n£white_dot 在完成国策§p飘扬的锦旗§!后，如果§x毁灭§!高于§q缔造§!，则将维持$national_populist_coloured$，反之§S纯正社会主义党§!将作为$social_democrat_coloured$上台执政。\n\n\n§M一心奉公会§!（$authoritarian_democrat_coloured$/$paternal_autocrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中任意一次选择支持雍仁的选项，§M皇道派§!就会在东京集结。\n£white_dot 在事件§M先发制人§!中，选择“以诛杀国贼为重”，在事件§M愤怒§!中选择“朕意已决”。\n£white_dot 在完成国策§p宁静之亚细亚§!后，将根据先前在事件中做出的选择和完成的国策转变为真正统而不治的§a英式君主立宪§!或公武一和的§P昭和新政§!。\n\n\n§M反皇道派§!（$paternal_autocrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上不要让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中任意一次选择支持雍仁的选项，§M皇道派§!就会在东京集结。\n£white_dot 在事件§M先发制人§!中，选择“以诛杀国贼为重”，在事件§M愤怒§!中选择“宣布他们为叛军”。"
 JAP_guide_1: "§M立宪政友会§!/§M立宪民政党§!/§M政民连携§!/§M社会大众党§!/§M国民同盟§!/§M科学社会党§!/§M三叶俱乐部§!（$social_conservative_coloured$/$market_liberal_coloured$/$social_democrat_coloured$/$social_liberal_coloured$/$authoritarian_democrat_coloured$/$national_populist_coloured$/$paternal_autocrat_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项。\n\n§M立宪政友会§!（$social_conservative_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n£white_dot 若希望更换领袖，需要在§M五一五事件§!中选择“如今的首相也要杀”，§c铃木喜三郎§!的继任者是§c鸠山一郎§!，§c久原房之助§!的继任者是§c中岛知久平§!。\n\n§M立宪民政党§!（$market_liberal_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n£white_dot 若希望更换领袖，需要在§M五一五事件§!中选择“如今的首相也要杀”，§m滨口雄幸§!的继任者是§m町田忠治§!。\n\n§M政民连携§!（$social_conservative_coloured$/$market_liberal_coloured$）\n£white_dot 在选举中让§c立宪政友会§!和§m立宪民政党§!均未取得绝对优势地位，但其席位总和超过233席。\n\n§M社会大众党§!（$social_democrat_coloured$/$social_liberal_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n£white_dot 若§M红星与锁链§!中红星最后斩断了锁链（即§S革新力量§!大于§l稳健力量§!），则$social_democrat_coloured$将主导社会大众党。\n£white_dot 若§M红星与锁链§!中锁链最后束缚了红星（即§l稳健力量§!大于§S革新力量§!），则$social_liberal_coloured$将主导社会大众党。\n\n§M国民同盟§!（$authoritarian_democrat_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n\n§M科学社会党§!（$national_populist_coloured$）\n£white_dot 在选举中取得绝对优势地位，终结“悬峙议会”的局面。\n\n§M三叶俱乐部§!（$paternal_autocrat_coloured$）\n£white_dot 在§M黑色星期一§!期间，选择至少三次让财阀认购/兼并的选项。\n£white_dot 在选举中让§c立宪政友会§!和§m立宪民政党§!取得绝对优势地位，终结“悬峙议会”的局面。稍后§P三叶俱乐部§!的国策树就会解锁。\n£white_dot 在完成国策§p有序的经济控制§!前确保Capital/Consumption/Cycle中朋友领先于家族，§P鲇川义介§!就会出席§P三叶俱乐部§!主席。\n£white_dot 在完成国策§p有序的经济控制§!前确保Capital/Consumption/Cycle中家族领先于朋友，§P池田成彬§!，§P岩崎小弥太§!或§P小仓正恒§!就会出席§P三叶俱乐部§!主席。"
 JAP_guide_2: "§M大政翼赞会§!/§M和盛公明会§!（$authoritarian_democrat_coloured$/$totalist_coloured$）\n£white_dot 确保§M五一五事件§!发生前§x赤色阴谋§!的等级小于85（不触发陆军对海军的调查事件）。\n£white_dot 在§M五一五事件§!发生后的帝国议会临时会议上让《国家保安法》通过。\n£white_dot 在系列事件§M火车上的对话§!中全部选择有利于裕仁的选项。\n£white_dot 在选举中让任何一方都不要形成绝对多数，且压制§c立宪政友会§!和§m立宪民政党§!的席位总和不超过233席，维持“悬峙议会”的局面。\n\n§M大政翼赞会§!（$authoritarian_democrat_coloured$）\n£white_dot 在§a近卫文麿§!上台后触发的一系列事件中选择满足所有人的要求，不要让§M朝日樱§!有任何诞生的可能性。在完成国策§p元老的阴影之下§!后就会成立§a大政翼赞会§!。\n\n§M和盛公明会§!（$totalist_coloured$）\n£white_dot 在§o近卫文麿§!上台后触发的一系列事件中选择坚持§o昭和研究会§!最初愿景的选项，让§M朝日樱§!维持在高于§G新芽§!等级的状态。在完成国策§p元老的阴影之下§!后就会成立§o和盛公明会§!。\n£white_dot 为了能更简单地进入§o和盛公明会§!路线，§o近卫文麿§!可以出席全国巡回演讲，并在§M大坂危机§!中选择“许下的约定决不能打破”。即便先前向§f政党§!和§e军队§!部分妥协了，也依然能够进入$totalist_coloured$路线。\n\n\n§M大日本救国军人会§!（$national_populist_coloured$）\n£white_dot 以任何政体进行游戏，选择武力扩张的外交路线，在日本本岛被入侵后的事件中选择“德川义宽无路可走”，即可切换为§n大日本救国军人会§!。\n£white_dot §n大日本救国军人会§!需要在§M士气§!降至0之前控制所有核心领土，失去东京会令士气更快流失。当§M士气§!降至0时将强制投降。"
 JAP_guide_3: "§M战败后的日本共和国§!：§M日本共产党§!/§M宪政同盟§!/§M正义社§!（$totalist_coloured$/$syndicalist_coloured$/$radical_socialist_coloured$/$authoritarian_democrat_coloured$/$national_populist_coloured$）\n£white_dot 输掉中日战争，或失去所有在大陆上由自己或傀儡控制的领土。\n\n§M日本共产党§!（$totalist_coloured$/$syndicalist_coloured$/$radical_socialist_coloured$）\n£white_dot 在§M涉足深渊§!之后，选择扮演§M日本共产党§!。\n\n§M宪政同盟§!（$authoritarian_democrat_coloured$）\n£white_dot 在§M涉足深渊§!之后，选择扮演§M宪政同盟§!。\n\n§M正义社§!（$national_populist_coloured$）\n£white_dot 在§M涉足深渊§!之后，选择扮演§M正义社§!。"
