 ### Raids ###

 raid_type_JAP_pnr_operation_night_blossom: "夜间樱花行动"
 raid_type_JAP_pnr_operation_night_blossom_desc: "一架战略轰炸机将从所罗门海附近的航空基地起飞，其将在敌人的关键城市上空投下特殊弹，以执行代号：夜间樱花行动。参谋部相信此举将能对这些白人鹰犬造成重创，并有助于我国迅速取得对帝国主义作战的胜利。"

 ### Modifiers ###

 JAP_pnr_pandemic_modifier: "大流行"
 JAP_pnr_pandemic_modifier_desc: "一场突如其来的瘟疫导致此地陷入公共卫生危机。"
 JAP_pnr_red_hands_modifier: "赤色魔手"
 JAP_pnr_red_hands_modifier_desc: "日本工人和农民们，富士山已经沉没，邪恶的天皇已经夹着尾巴逃跑了，现在是时候进军，彻底颠覆资产阶级了！——日本共产党\n\n尽管我国出于各种原因没有深入到德意志帝国主导的世界市场之中去，但随着黑色星期一的爆发，金融危机还是传导到了我国，并且对我们刚刚稍有起色的经济施加了一记重拳。\n\n日本共产党正是抓住了这个机会，以“岸田国中生事件”为代表加快了他们对社会的破坏行动。大量日共和激进分子被动员出来，对我国政府发动从合法游行到暴力犯罪的广泛攻击，§R我们必须向天皇陛下证明我们有能力将这些犯罪者绳之以法，否则我们就不得不倒台，或者更糟……§!"

 ### Red Conspiracy Decisions ###

 JAP_pnr_red_conspiracy_begun: "赤色阴谋正在蔓延。"
 JAP_pnr_red_conspiracy_category: "赤色阴谋"
 JAP_pnr_red_conspiracy_category_desc: "长期以来我国缺乏用于打击赤色分子的强力手段，在1923年到1926年期间，我国在田中义一内阁的领导下曾存在过一部《治安维持法》，用于打击这些危害社会的恐怖分子。但此法案极大地限制了民权，甚至威胁到了宪法的正常运行，因此不久就被废除了。直到§0与之类似的法案§!施行之前，我们只能依靠警察和特高课的间谍来应对他们。\n\n毫无疑问的是，愈来愈强的红色风暴也是一个机会，如果我们能确保这场社会动乱在我们能掌控的范围里持续足够久，那么或许我们就可以借助民意实现某些§t特别的目的§!……\n\n赤色阴谋的当前强度为§R[?JAP_pnr_red_conspiracy_strength|0]§!/100，并且每14天将提高§R5§!。当赤色阴谋的强度归零且赤色犯罪者不再对社会造成威胁之后，赤色阴谋将结束。"
 JAP_pnr_red_conspiracy_escalation: "£pol_violence 赤色阴谋升级"
 JAP_pnr_red_conspiracy_escalation_desc: "赤色分子的地下组织正在积蓄力量，如果不能及时遏制，他们的活动会变得更加大胆。"
 JAP_pnr_red_conspiracy_reduced: "赤色阴谋强度§G降低$RIGHT|0$点§!。"
 JAP_pnr_red_conspiracy_raised: "赤色阴谋强度§R提高$RIGHT|0$点§!。"
 JAP_pnr_red_conspiracy_curtail_red_press: "搜查《赤旗》报"
 JAP_pnr_red_conspiracy_curtail_red_press_desc: "长期以来日本共产党和其它激进的左翼社会破坏者都通过《赤旗》报来宣传他们的理念，它刊发了大量煽动工人罢工和农民起义的文章，并每天都在编造许多危言耸听的小故事，鼓动人们“向邪恶的资产阶级发起冲锋”。虽然我们无法完全杜绝他们在自己的非法出版物上摇唇鼓舌，但我们至少可以通过突袭来尽量压制它的传播。"
 JAP_pnr_red_conspiracy_activate_loyal_unions: "强化工会教育"
 JAP_pnr_red_conspiracy_activate_loyal_unions_desc: "忠于现行秩序的工会组织可以协助我们与激进派争夺工人中的影响力。"
 JAP_pnr_red_conspiracy_establish_curfews: "咖啡馆登记制度"
 JAP_pnr_red_conspiracy_establish_curfews_desc: "夜间集会和秘密联络是地下组织赖以活动的土壤，临时宵禁能够打断他们的节奏。"
 JAP_pnr_red_conspiracy_arrest_activists: "逮捕劳工煽动者"
 JAP_pnr_red_conspiracy_arrest_activists_desc: "只要掌握足够证据，警方和特高课就能拔除若干赤色组织的骨干。"
 JAP_pnr_red_conspiracy_selective_reform: "选择性让步"
 JAP_pnr_red_conspiracy_selective_reform_desc: "有限的社会让步可以分化温和工人与革命分子，代价则由产业界和国家财政共同承担。"
 JAP_pnr_red_conspiracy_lapse_on_security: "偶然的警备疏漏"
 JAP_pnr_red_conspiracy_lapse_on_security_desc: "暂时放松警备可以释放一部分政治压力和行政资源，但地下赤色组织也会利用这个机会壮大自己。"
