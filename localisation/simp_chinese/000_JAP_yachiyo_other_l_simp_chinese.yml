 JAP_pnr_national_populist_party: "国民社会主义党"
 JAP_pnr_national_populist_party_long: "国民社会主义党\n§L国民社会主义党虽然是一个新生的党派，然而它的领袖却已在政界摸爬滚打多年：$JAP_pnr_katsumaro_akamatsu$，日本共产党的元老，曾与野坂参三等人共事的前中央委员；社会大众党前身社会民众党的创立者之一；如今则是国民社会主义党的总裁。该党主张自己是真正的人民的政党，是从科学角度出发，立足于现实的，务实行动主义的政党。具体到其诉求上则是基于经济科学的原则废除资本主义的无政府经济模式，转而以国家的集中指令经济作为替代，从而实现无剥削的新社会。国民社会主义党还主张民族斗争，强调日本对欧洲帝国主义主张生存权的正当性。\n\n国民社会主义党虽然是新生政党，但在这几年已发展成议会中不可小觑的势力，一条实孝公爵是该政党最有力的支持者之一，更有传言称该政党的背后还有大川周明、内田良平乃至出口王仁三郎等人的运作。§!\n"
 JAP_pnr_kodoha_party: "天皇顾问院"
 JAP_pnr_kodoha_party_long: "天皇顾问院\n§L天皇顾问院始于《日本改造法案大纲》，与劫持天皇大命，暗中施行专制统治的枢密院不同，天皇顾问院是在国家改造的“非常三年”中总领执行一切新政治的特别机关。在过去，明治天皇通过维新将日本人民从幕府的控制下解放了出来，令国家成为了一个天皇陛下与人民合一的，真正的民主国家。\n\n但特权阶级和反动势力只是暂时退场，他们很快就改头换面，重归世间——这一次他们被称为财阀、藩主、军部和官僚。这些特权阶级再一次劫持了天皇陛下，再一次劫持了“社会意志”。尽管他们中的大多数人已经伏法，也有一部分人交出了手中的特权，但这些存在对国家所施加的极为不良的影响仍未散去。为此天皇顾问院将手持由今上天皇授予的锦旗，执行天皇，或称为社会意志的行动，并真正地实现粉碎所有特权的民主国家的愿景。§!\n"
### MIO Loc ###
 JAP_edogawa_jukogyo_mio: "江户川重工业"
 edogawa_jukogyo_subtitle: "乙级战车制作所\n§L位于埼玉县的江户川重工业株式会社是一家始创于1899年的民营企业，在世界大战期间以棉织品生产起家。它在战后的经济萧条浪潮中虽然和其他企业一样受到了严重打击，但却借助着随之而来的国家补贴成功转型成军工制造商。江户川重工业虽作为中坚家族企业在名义上是独立企业，但实际上其扩张严重依赖三井银行的贷款。§!\n"
 JAP_hitachi_mio: "日立制作所铁炮兵器部"
 hitachi_subtitle: "突击炮制造工场\n§L$JAP_pnr_fusanosuke_kuhara$于1905年收购了茨城县的赤泽铜山，并以其毗邻的日立村命名自己的新产业——1908年，电气工程师小平浪平开始为$JAP_pnr_fusanosuke_kuhara$工作，负责日立矿山的开采设备的制造与维护。他制造的电气设备质量优异，引起了$JAP_pnr_fusanosuke_kuhara$总裁的注意，在总裁的支持之下，小平浪平管理的机械修理厂从矿山中独立出来，形成了日立制作所。除其已经生产多年的电力机车、冰箱和电梯之外，日立制作所近年也开始承接各类军事订单。§!\n"
 JAP_sagami_mio: "相模兵器制造所"
 sagami_subtitle: "试验性战车制造工场\n§L在审慎地考虑之后，陆军士官学校已迁移至相模原，于此同时大藏省也为开发相模原地区拨付了相关款项。位于大野村与相原村交界处的相模兵器制造所便是第一批启用的陆军配套设施，该制造所将致力于战车的研究和开发，根据计划，接下来$JAP_sagami_mio$将修建一条约30公里长的“战车道”，以进行更大规模的坦克驾驶试验和驾驶员训练。§!\n"
 pnr_kure_naval_subtitle: "帝国海军之母腹\n§L吴海军工厂始于1889年吴镇守府的设立，经过近五十年的发展，如今的吴海军工厂可称得上是帝国第一海军工厂。由于吴港本身即为天然良港，战略地位极其重要，围绕着该工厂也形成了极为繁华的“海军生活圈”，我国最有名的海校江田岛海军兵学校就位于吴镇。§!\n"
 JAP_mitsubishi_armor_mio: "三菱重工业"
 mitsubishi_armor_subtitle: "尖端重工业利维坦\n§L三菱重工最开始是一家造船厂，随着三菱联合公司的业务多元化发展，三菱为了推行近代化经营和扩大产业规模，将三菱造船厂和其它公司都相继分拆出来。但随着1926年到来的日本经济危机，大部分分拆出来的公司都陷入了财务困境。为了优化管理，同时也考虑到重工业技术发展的关联性，岩崎小弥太主持了这些公司的内部产业重组，最终形成了覆盖各领域的综合重工业公司——三菱重工。§!\n"
 JAP_ishikawajima_mio: "东京石川岛造船所"
 ishikawajima_subtitle: "坦克标准化生产设计商\n§L首先是日本第一家民营船厂，随后是设计出日本第一台火力发电设备，世界大战接踵而至，而东京石川岛造船所也乘上了大战的东风，因船舶业繁荣获得了巨额贸易。为了扩张产业规模，石川岛借着这笔财富进军了自动车与飞行机制造业。在可见的未来，石川岛还会继续将自己商业帝国的触手伸向重工业领域的更多方面，成为名副其实的产业领军者。§!\n"
 nissan_subtitle: "综合重工业设计商\n§L首先是日本第一家民营船厂，随后是设计出日本第一台火力发电设备，世界大战接踵而至，而东京石川岛造船所也乘上了大战的东风，因船舶业繁荣获得了巨额贸易。为了扩张产业规模，石川岛借着这笔财富进军了自动车与飞行机制造业。在可见的未来，石川岛还会继续将自己商业帝国的触手伸向重工业领域的更多方面，成为名副其实的产业领军者。§!\n"
 tetsudo_sho: "铁道省"
 pnr_tetsudo_sho_subtitle: "铁道监督与改革部门\n§L铁道省是负责铁路相关业务的国家行政机构，一方面负责国有铁路业务，一方面对地方铁路、汽车运输和有轨电车进行监管。长期以来铁道省都因涉及到政党政治中的“铁路利益”而受到公众批评，这侧面体现出铁道省在货运需求增长的当下所掌握的丰厚资源。由于铁路网的发展，铁道省自1935年起便设立了诸多新地方铁道局进行协助管理。§!\n"
