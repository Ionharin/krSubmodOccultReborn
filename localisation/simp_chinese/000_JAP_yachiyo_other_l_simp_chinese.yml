 ### Character and trait ###

 JAP_pnr_inukai_tsuyoshi: "犬养毅"
 JAP_pnr_inukai_tsuyoshi_leader_desc: "§Y生于：§!§L1855年；日本国、山阳道备中国§!\n§Y派系：§!§2政友会§!\n§Y背景：§!§L犬养毅出身于武士家族，据称与足利幕府有关。1876年他自庆应义塾毕业之后便作为随军记者奔赴了萨摩藩叛乱的前线，并记录下了“拔刀队”的故事。\n\n1882年，他加入了立宪改进党，并在8年之后成为众议院议员之一。随着1913年桂太郎内阁引发了日本宪政危机，犬养毅和尾崎行雄合作组织了第一次护宪运动，领导民众与政党推翻了桂太郎军阀内阁，成功维护了议会政治的延续，这使得他与尾崎行雄被并称为“宪政之神”。在此之后，犬养毅本想急流勇退，但其家乡的选民却不同意，他们在未告知犬养毅的情况下便把他提名为“因犬养毅辞职而进行补选的候选人”，强迫他再次重返政坛。\n\n世界大战结束之后，在犬养内阁的干预下，日本经济实现了温和的经济复苏，但农村地区的困苦依然存在，极端主义势力也在抬头；另一方面，政党政治的弊端正在显现，不同的利益集团为了各自的派系在议会甚至是党内相互攻击。面对着内部和外部的两方敌人，犬养毅本人对驾驶政友会这艘大船越来越力不从心。§!§!\n\n§Y备注：犬养毅是孙中山在夏威夷创立的“兴中会”的元老成员，他曾与黑龙会的头山满等人一同前往中国调查局势，并为中国国民党提供慷慨的经济援助，武装人员和技术支持，以期实现亚洲的解放。§!"
