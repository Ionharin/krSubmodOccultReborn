 JAP_pnr_fumimaro_konoe: "近卫文麿"
 JAP_pnr_fumimaro_konoe_leader_desc: "§Y生于：§!§L1891年；日本国、东京都§!\n§Y派系：§!§g无派系§!\n§Y背景：§!§L$JAP_pnr_fumimaro_konoe$，五摄家（摄政家族）之一近卫家的宗主。但纵使有着如此高贵的出身，近卫家却长年深陷债务危机之中。$JAP_pnr_fumimaro_konoe$的父亲近卫笃麿作为公爵深度涉入政治领域，创办了诸如东亚同文会，东亚同文书院等主张日中相互提携，合作对抗欧美殖民侵略的外交团体。然而作为公爵的近卫笃麿由于法律原因无法领取作为议员的薪水，从事政治活动的大笔开销不得不以借款填补。当近卫笃麿撒手人寰之后，这份沉重的债务则随着公爵爵位一同落到了当时12岁的近卫文麿头上。值此危机之际，正是元老$JAP_pnr_saionji_kinmochi$出手搭救，帮助近卫家度过难关。\n\n在高中毕业之后，$JAP_pnr_fumimaro_konoe$受到当时的马克思经济学教授河上肇影响，遂投入京都帝国大学法学系完成学业。1919年，$JAP_pnr_saionji_kinmochi$携$JAP_pnr_fumimaro_konoe$出席了凡尔赛条约的签署仪式，日本由于领土争议而最终拒绝在条约上签字，也是在这里，$JAP_pnr_fumimaro_konoe$第一次切身意识到了所谓的“合约”不过是大国的横暴，实力支配才是国与国之间的铁的原则。而日本则因力量弱小，所提出的任何要求都不会被强权采纳。\n\n1921年，耻辱的《青岛条约》签署后，他与自己的恩人兼老师$JAP_pnr_saionji_kinmochi$在思想上彻底决裂，成为了革新势力的中心人物：他在贵族院中组成了“火曜会”，在金鸡学院的$JAP_pnr_yasuoka_masahiro$的支持下组成了“早餐俱乐部”，并在民间组成了政治研究团体“昭和研究会”，旨在终有一日改革日本政治的现状。§!§!\n\n§Y备注：$JAP_pnr_saionji_kinmochi$将$JAP_pnr_fumimaro_konoe$视为能延续自己“欧美协调外交”的继承人培养，但$JAP_pnr_fumimaro_konoe$却并不对延续这种外交体制上心。§!"
 JAP_pnr_funada_naka: "船田中"
 JAP_pnr_hakamada_satomi: "袴田里见"
 JAP_pnr_hakamada_satomi_leader_desc: "§Y生于：§!§L1904年；日本国、青森县§!\n§Y派系：§!§x日本共产党§!\n§Y背景：§!§L从16岁的送报员生活开始，到随后于铁桥制造厂做工，1924年的$JAP_pnr_hakamada_satomi$便觉醒了阶级意识，向职业革命家的路程走上了第一步。首先是在函馆地区组织起了革命的工会和青年同盟，然后是追随“劳动者之父”渡边政之辅，一同在日本劳动总同盟活动。在总同盟分裂后，为了另组日本劳动组合评议会，$JAP_pnr_hakamada_satomi$东奔西走进行革命活动。期间曾与日本共产党的主要领导人之一市川正一共同行动，为其奠定下了与日本共产党之间的深厚缘分。\n\n1925年，$JAP_pnr_hakamada_satomi$被推荐前往法兰西公社留学，在那里他与“巴黎艺术与科学之友人协会”——一个存在于欧洲地区的，植根于正统列宁主义的布尔什维克主义研究小组产生了短暂的联系。在1928年返回日本后，他被指派为关西和九州两地重建共产党的负责人，旋即开始活动。但不久即于六月在大阪被捕，被判四年零四个月徒刑。1932年，经长期监狱生活后重见天日的$JAP_pnr_hakamada_satomi$仍不觉疲劳，翌年任党东京地方委员。\n\n在日本共产党的中枢因刚刚计划了一场银行突袭却遭埋伏逮捕之后，$JAP_pnr_hakamada_satomi$成为了最后的中央委员，他随即意识到了纯洁的共产党机关中出现了不纯洁的间谍。为此他一方面带领剩余可信的中央成员潜伏在北海道的某个农村之中韬光养晦，另一方面则将党的工作从获取武装暴动资金转向了肃清党内不纯分子，铲除党内反革命的反动障碍。“最后的大人物”心怀着不屈不挠的革命意识，绝不能容许党和党员略有松懈。他常指导党应走布尔什维克路线，自己也循此路线不断努力。§!§!"
 JAP_pnr_katsuno_kinmasa: "胜野金政"
 JAP_pnr_katsuno_kinmasa_leader_desc: "§Y生于：§!§L1901年；日本国、长野县§!\n§Y派系：§!§x日本共产党§!-§o巴黎友人派§!\n§Y背景：§!§L如果要评选日本共产党中最年轻的入狱者的话，$JAP_pnr_katsuno_kinmasa$想必能作为十五岁的少年犯拔得头筹。这位少年在当地农会中发表了抨击国家体制不公的演讲之后很快就被投入监狱，等到出狱的时候村子里的其他人已将他视为“疯子”。就是这样一位少年最终进入了早稻田大学学习，彼时的早稻田大学中的学生们受到赤松克麿等人在东京帝国大学建立的“新人会”的影响，也建立起了自己的左翼社会团体“建设者同盟”，积极参与社会抗议和社会主义思想的传播。\n\n随后便是田中义一大将的残酷镇压，《治安维持法》与不得人心的恐怖迫害使得$JAP_pnr_katsuno_kinmasa$最终选择前往法国，在那里他首先参加了法国工团主义——准确来说是雅各宾派工团的影响，投入到了当地的革命事业之中。\n\n然而很快，$JAP_pnr_katsuno_kinmasa$就意识到工团并非理论，而是一种“行动”，但盲目的行动只是空虚地耗费力气，他对工团主义的热情迅速消退，并旋之接触到了存在于巴黎地区的另一个社会主义运动团体——主张正统列宁主义的“巴黎艺术与科学之友人协会”。该小组奉行布尔什维克主义，渴望以科学的社会主义指导社会主义乌托邦的诞生。$JAP_pnr_katsuno_kinmasa$成为了该组织的委员长国崎定洞的秘书，并在其庇护下一边为国际社会主义流亡者大网络的出版物撰稿，一边在海外支持着日本共产党的活动。\n\n机会很快到来，“日本工团主义之父”片山潜在拜访山本宣治时被杀引爆了日本社会的左翼情绪，在山本宣治的“横向阵线联盟”被建立起来之后，$JAP_pnr_katsuno_kinmasa$发觉革命的时机已知，他携带着“巴黎的礼物”返回日本支援日本共产党，一个真正的“工农国”将借助反动的社会民主主义者而实现，社会主义乌托邦就要降临在这里。§!§!\n\n§Y备注：传闻$JAP_pnr_katsuno_kinmasa$离开工团主义加入布尔什维克主义阵营的原因是在罢工时一位法国少女邀请他这个“日本小子”加入，然而他本人并未对此作出更多回应。§!"
