 JAP_pnr_aikawa_yoshisuke_desc: "§Y生于：§!§L1880年；日本国、山口县§!\n§Y派系：§!§g无派系§!\n§Y背景：§!§L“三角血盟”，“商界三羽乌”或者称其为“五巨头”，$JAP_pnr_aikawa_yoshisuke$在1910年创立了亚洲第一家可锻铸铁制造企业，并在随后的几年中通过技术迭代，掌握了电炉生产的技术。§!§!\n\n§Y备注：鲇川义介、岸信介与松冈洋右三人被时人称为“三角血盟”，这不止是因为三人有着类似的社会诉求，更是因为他们三人之间本就有姻亲关系。§!"
