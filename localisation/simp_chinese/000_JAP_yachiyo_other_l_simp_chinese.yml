 JAP_pnr_kanebukuro_kozuchi_placeholder_desc: ""
 JAP_pnr_zb_yoshisuke_bust_tt: "§Y新兴康采恩§!\n\n当前影响力：§H[?JAP_pnr_zb_balance|0]%§!\n\n生活消费品工厂系数：[?JAP_pnr_zb_consumer_goods_factor|Y=%1]\n建造速度：[?JAP_pnr_zb_production_speed_buildings_factor|+=%1]\n生产效率增长：[?JAP_pnr_zb_production_factory_efficiency_gain_factor|+=%1]\n基础生产效率：[?JAP_pnr_zb_production_factory_start_efficiency_factor|+=%1]"
