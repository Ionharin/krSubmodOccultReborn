 JAP_pnr_south_china_melee_decision: "华东混战"
 JAP_pnr_south_china_melee_decision_desc: "中国的华东地区，即八省联合因政治问题而陷入了叛乱之中，这对我国来说是个机会，如果我们想真正地削弱中国，就应该让他们持续处于分裂不和的状态中，或是支援对我们来说是潜在盟友的势力。无论如何，布局已经开始。"
 JAP_pnr_operation_spartacus_india_decision: "斯巴达克斯行动：印度"
 JAP_pnr_operation_spartacus_india_decision_desc: "我们通过瓦隆-彭达尔克会议与第三国际之间形成了一份秘密条约，我们将支持印度人民共和国在次大陆上的合法地位，换取第三国际对我军借道中国南下侵攻德属东亚的默许。只要我们在印度问题上表明了我们有履行条约的意愿，相信就能够让第三国际也同样履行他们应该做的事情——在对抗德意志帝国主义这一点上，我们显然是盟友。"
