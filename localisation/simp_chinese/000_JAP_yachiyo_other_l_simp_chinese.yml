 ### Ideas ###

 JAP_pnr_housing_finance_agency: "家屋资金局"
 JAP_pnr_housing_finance_agency_desc: "金钱是斗争的神经，藏身房屋的安全周密，是防备组织的要塞——日本共产党\n\n家屋资金局是日本共产党为筹集活动资金所运作的一个地下犯罪网络，由从法兰西公社归来的风间丈吉授意建立，他们通过绑架，诱拐，卖淫，敲诈勒索和出租车业务收拢了大量资金用于“和资本主义斗争”。尽管我们已经破坏了他们在明面上的组织，但在袴田里见的带领之下，他们还是偶尔发动一些零星的社会攻击。并且继续在《赤旗》报上恬不知耻地宣称他们干了所有坏事——毫无疑问，这些赤色恐怖分子已成为我国社会动荡的一大原因。\n\n§R如果放任不管，局势可能进一步恶化。§!"
 JAP_pnr_showa_tenno: "今上天皇"
 JAP_pnr_showa_tenno_desc: "$JAP_hirohito_leader_desc$"
 JAP_pnr_farewell_to_the_lost_decade_0: "失去的十年"
 JAP_pnr_farewell_to_the_lost_decade: "向失去的十年告别"
 JAP_pnr_farewell_to_the_lost_decade_desc: "1925年爆发的美国大萧条对我国纺织业造成了巨大冲击，我国政府为此进行了救助和产业结构改革，并努力（以及不情愿地）融入以德意志帝国为首的新全球市场之中，尽管收效甚微，但确实避免了局势进一步恶化。\n\n幸运的是，我国经济已经开始恢复，不过它依然脆弱，任何中度经济动荡都可能导致情况急转直下……"
 JAP_pnr_forever_frozen_in_1928: "永恒冻结的1928年"
 JAP_pnr_forever_frozen_in_1928_desc: "日本经济经历了失落的十年，而它的政党政治也随着经济困境一起被冻结在了那一刻——1928年实施25岁男子普选法之后，工人、农民和新兴产业群体出乎立宪政友会和立宪民政党的意料，各自将自己的代言人都送进了日本众议院。众议院自那之后便一直维持着“悬浮议会”的形式，没有任何一个党派能够取得绝对优势地位。尽管围绕在天皇身边的宫中集团乐见于这种情况，但政治家们显然为此头疼不已。\n\n如今主持内阁的犬养毅虽被人尊称为伟大的宪政之神，但他实质不过是个勉强维持政友会不分裂的垂死的老人。立宪政友会内部无人承认他的权威，而犬养毅也无法约束政党内部日益激烈的派系斗争。\n\n自原敬被农业民族主义分子暗杀之后，政友会始终缺乏一位有能力的政党领袖来总领全局——以“日式议会斗士”为首的铃木喜三郎和以久原房之助为首的“反铃木派”之间的路线斗争日益严峻，每天都有人宣布退出党派，毫无疑问，立宪政友会内部正在瓦解，而其它政党正对内阁的椅子虎视眈眈。"
 JAP_pnr_offensive_realpolitik: "攻性现实政治"
 JAP_pnr_offensive_realpolitik_desc: "[JAP.GetName]作为一个岛国，主宰她行动的乃是彻头彻尾的现实利益。我们将尽量避免同强国正面冲突，并借助各种干涉手段来谋取国家的最大利益。"
 JAP_pnr_offensive_realpolitik_1: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_1_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_offensive_realpolitik_2: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_2_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_offensive_realpolitik_3: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_3_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_offensive_realpolitik_4: "$JAP_pnr_offensive_realpolitik$"
 JAP_pnr_offensive_realpolitik_4_desc: "$JAP_pnr_offensive_realpolitik_desc$"
 JAP_pnr_restore_naval_shipbuilding_plan: "恢复海军造舰计划"
 JAP_pnr_restore_naval_shipbuilding_plan_desc: "自1925年英国发生“光荣革命”以来，政府便一直以所谓人民的力量来压制[JAP.GetAdjective]海军的扩张，并逐步削减军队预算。先前预定进行的“八八造舰计划”半途而废，最终只出厂了纪伊号和尾张号。如今战争的风暴已经迫近，我们得以重启先前的造舰计划，可是时代已经不同了，时机也已经过去了。但总之，我们终于又一次迎来了扩张的机会。"
 JAP_pnr_20_knot_scrap_plan_idea: "20节老旧舰船改装"
 JAP_pnr_20_knot_scrap_plan_idea_desc: ""
 JAP_pnr_develop_assault_guns: "发展突击炮"
 JAP_pnr_develop_assault_guns_desc: "与其把注意力集中在成熟的坦克上，还不如依靠我们的突击炮使步兵获得突破能力，这是一种更划算的选择。"
 JAP_pnr_foolproof_plan: "万无一失"
 JAP_pnr_foolproof_plan_desc: "战争在交战之前就已经开始了，详细的实地考察和周密的计划部署将有助于军队发起更有组织，更具破坏力的进攻。"
 JAP_pnr_cage_tactic_idea: "囚笼战术"
 JAP_pnr_cage_tactic_idea_desc: "所谓的“囚笼战术”，指的便是通过快速构建出包围网，并切断敌人的通讯线路来将敌人的一小撮部队逼入战争迷雾中的战术。面对与外界完全隔绝的情况，我军只需再组织数轮攻击，敌人便会自行溃散。"
 JAP_pnr_strengthened_core_staff_system: "强化的参谋本部"
 JAP_pnr_strengthened_core_staff_system_desc: "战争在交战之前就已经开始了，详细的实地考察和周密的计划部署将有助于军队发起更有组织，更具破坏力的进攻。"
 JAP_pnr_advanced_army: "先进之军"
 JAP_pnr_advanced_army_desc: "经过一系列改革，我国军队已成为傲视世界之先进军队。我们现在所需的不过是一场战争，借助此战争我们便可以检验我们的改革成果，并证明我军的真正实力！"
 JAP_pnr_great_war_army: "大战之军"
 JAP_pnr_great_war_army_desc: "经过一系列改革，我国军队已成为傲视世界之先进军队，而我们在战场上所取得的诸项成果更是证明了我们改革的成功。"
 JAP_pnr_short_term_decisive_battle_doctrine_idea: "一击论"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_desc: "我国陆军之力量虽在世界上处于第一梯队，但较列强而言仍有许多不足，造成这一现象的最为致命的原因便是我国战略资源的不足够。为此我军应当奉行以强力一击摧毁敌人的战争原则，以免陷入一场旷日持久的消耗战中从而将我们消耗殆尽"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_upgraded: "一击论"
 JAP_pnr_short_term_decisive_battle_doctrine_idea_upgraded_desc: "$JAP_pnr_short_term_decisive_battle_doctrine_idea_desc$"
 JAP_pnr_prepare_for_total_war_idea: "徐徐图之"
 JAP_pnr_prepare_for_total_war_idea_desc: "在第一次世界大战的风暴之后，战争已不再是依赖意志和士气的，只属于军队自己的一件事务了。它早已变成考验国家已有资源，工业水平和科技发展的多方面的“全体主义行动”。受限于我国资源与工业现状，想要进行一场符合当下标准的战争实在太过困难，为此我等应当为任何可能的战争做好准备，并不要乐观地估计今后的战争将是能在短期内结束的战争。"
 JAP_pnr_prepare_for_total_war_idea_upgraded: "徐徐图之"
 JAP_pnr_prepare_for_total_war_idea_upgraded_desc: "$JAP_pnr_prepare_for_total_war_idea_desc$"
 JAP_pnr_q_agency: "Q机关"
 JAP_pnr_q_agency_desc: "一旦战争开始，为确保占领区的社会稳定，设立相关的特务机关是必不可少的。Q机关的Q指平息（Quell），不论是收买当地潜在的合作者还是使用更严厉的方式来压制占领区，我们总会找到确保相关地区稳定的办法。"
 JAP_pnr_limited_light_armor: "有限轻装甲"
 JAP_pnr_limited_light_armor_desc: "我国钢铁资源不足，为此采用轻型装甲计划是最符合我国国情的。"
 JAP_pnr_armored_forces: "装甲部队"
 JAP_pnr_armored_forces_desc: "尽管我国面临着钢铁资源不足的窘境，但毫无疑问，武装一支强大的装甲部队将确保我们面对任何敌人都游刃有余。"
 JAP_pnr_armored_car_warfare: "推广装甲车作战"
 JAP_pnr_armored_car_warfare_desc: "我国钢铁资源不足，为此采用轻型装甲计划是最符合我国国情的。"
 JAP_pnr_armored_torrent: "装甲洪流"
 JAP_pnr_armored_torrent_desc: "尽管我国面临着钢铁资源不足的窘境，但毫无疑问，武装一支强大的装甲部队将确保我们面对任何敌人都游刃有余。"
