 JAP_pnr_plan_sagami_dam: "筹划相模大坝"
 JAP_pnr_plan_sagami_dam_desc: "横滨-神奈川工业带日益发展，其电力需求也变得庞大起来，为确保其正常的工业生产，维持我国工业的强劲心脏，利用邻近的相模川流域进行水力发电就显得十分重要。1935年相模川大坝计划书曾被提交给内务省的官僚们，可惜官僚们更青睐于自己能够获得利益的项目，而把这对民众来说极为有利的工程丢进了垃圾桶。如今我们将重启该建设计划。"
