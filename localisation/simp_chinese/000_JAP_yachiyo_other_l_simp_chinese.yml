 JAP_pnr_ruin_and_creation_category_desc: "自古以来，人类的发展就处于不断地毁灭之中，而能够利用毁灭之后的断壁残垣创造出崭新事物的人则被称为“革命者”。啊，革命者，多么美好的名字，当人们说出这个名字之后，似乎天地之间再没有比它大得多的头衔了！正因如此，许多阴险小人，流氓和破坏狂经常窃取“革命者”的皮囊，他们穿戴上这件并不符合自己的衣服便粉墨登场了。然而他们只知破坏，却从未掌握缔造的真谛，这使得他们见到真正的革命者之后，便立刻化成了一抔尘土。\n\n为了实现维新，对错误事物的§R毁灭§!必不可少，但同时也不能忘记§G缔造§!本身。而假使我等要实现完美的维新之政治，那么谨慎结合这两种力量，确保其相互制衡则为必须谨遵之教条。若是令§R毁灭§!将国家焚烧殆尽，那骇人的狂热或许终将蔓延至整个世界；若是连旧房子都未推倒便开始大肆§G缔造§!，那最后形成的也不过就是更臃肿的存在。惟有令§R毁灭§!与§G缔造§!相平衡，令黑与白这两种力量相持，才能实现真正的§M革新§!。\n\n通过推进§Y国策§!与完成§Y决议§!，又或是在一系列§Y事件§!之中作出选择都会塑造维新政治的愿景——总的来说，§R毁灭§!将主要通过§Y国策§!来积累，而§G缔造§!则主要通过§Y决议§!来积累。确保§R毁灭§!与§G缔造§!在§x三年国家改造§!完成的时刻都处于最大值且相平衡的状态即可达成最完美的§Y国家重生§!，并将国家引向一条更为神秘且崇高的道路；而确保§R毁灭§!与§G缔造§!处于相平衡的状态将达成完美的§Y国家改造§!；如果§R毁灭§!与§G缔造§!任意一方逾越了界限，那么显然国家就会在达成§Y国家变革§!之后倒向对应的一边。\n\n当前的£GFX_SOV_paranoia_text_icon §R毁灭§!：§p[?JAP_pnr_iw_destruction|0]§!\n当前的£GFX_repairing §G缔造§!：§p[?JAP_pnr_iw_creation|0]§!"
