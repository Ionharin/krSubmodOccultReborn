  ### 决议和阵营 ###
  faction_QIE_world_moral_association: "万国道德会"
  faction_manifest_world_wide_ethical_society_name: "天下大同"
  faction_manifest_world_wide_ethical_society_desc: "我们将把世界上大多数国家都纳入万国道德会的控制之下，从而实现康有为的未竟之理想，将整个世界团结为一个超国家的实体，用儒家秩序和中华文化为这个被战火摧残的世界带来“最终解决方案”。"
  COLLECTION_WORLD_WIDE_ETHICAL_SOCIETY_TARGETS: "万国道德会宣称区域"
  COLLECTION_WORLD_WIDE_ETHICAL_SOCIETY_CONTROLLED: "由我方或阵营成员控制的万国道德会宣称区域"
