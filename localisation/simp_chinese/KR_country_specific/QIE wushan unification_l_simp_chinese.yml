  QIE_wushan_world_moral_association: "万国道德会"
  QIE_wushan_world_moral_association_desc: "万国道德会的概念最早可追溯至1921年，由康有为的孔教会发展而来。其目的正是“阐扬道德，救助人心”。\n在过去，万国道德会建立者之子江希张曾撰写一本《三千大千世界图说》，阐述了生前死后的奥秘，揭示了儒释道耶回五教合一的真谛。并借助绘画展示了在宇宙之外的外星生命。\n如今万国道德会将作为我们宣扬中华礼教的美德先锋，把这个世界从西方文化的毒害之中拯救出来，让真正的和平与真正的文明重新降临世间。"
  QIE_wushan_world_moral_association_member: "万国道德会"
  QIE_wushan_world_moral_association_member_desc: "万国道德会的概念最早可追溯至1921年，由康有为的孔教会发展而来。其目的正是“阐扬道德，救助人心”。\n在过去，万国道德会建立者之子江希张曾撰写一本《三千大千世界图说》，阐述了生前死后的奥秘，揭示了儒释道耶回五教合一的真谛。并借助绘画展示了在宇宙之外的外星生命。\n如今我们成为万国道德会的成员，尽管名义上我们与其领导者具有平等的“君子地位”，但情况似乎有点不太对劲……"
  QIE_wushan_world_moral_research_name: "万国道德会科研合作"
  QIE_wushan_world_moral_research_desc: ""

  QIE_pnr_ws_puppet.1.t: "决定[JAP.GetName]的总督"
  QIE_pnr_ws_puppet.1.desc: "[QIE.GetLeader]刚刚坐下来，旁边那个带眼镜的斯文秘书就立刻弓下身子，把头垂到桌边，两手呈着文件探到桌子和[QIE.GetLeader]之间。“这是本月第三封电报了，还是老问题，日本人想搞清楚总督到底是谁。”自从[JAP.GetName]的大陆作战以耻辱收场，连本岛都被[QIE.GetName]这条东方巨龙轻易占领已过去很长一段时间了。在投降——以他们的说法是“终战”——时，[JAP.GetName]接受了从裁军到赔款的诸多要求，其中就包括[QIE.GetName]对其政府的完全接管。条约规定，[QIE.GetName]将在战后的[JAP.GetName]设立军政府，并派出一位总督负责管理。\n\n其实[QIE.GetLeader]也还没想好，根据条约，[JAP.GetName]已经失去了威胁[QIE.GetName]统治的能力，只要[QIE.GetName]的统治如同德意志帝国那样坚不可摧，始终维持着自身东亚霸主的地位，[JAP.GetName]从今往后便只能作为仆从国存在。而对于这个在战争中被摧毁殆尽，除了难民，饥荒，黑手党和失能的政府之外再无别的东西的地方，不管派谁去都无异于将其流放到权力中心之外。[QIE.GetLeader]只是还没想好要从北京排除谁，所以就暂时搁置了这件事。\n\n日子一天天过去，就这样空耗着也不是事。[QIE.GetLeader]必须作出决定，要说到现在中国内部谁比较危险的话，那恐怕就是和[QIE.GetName]推行的“五教合一”相悖的那另一个“现人神”——衍圣公孔德成。如果能把他驱逐掉，[QIE.GetRulingParty]就能进一步随实际意图解释儒教了；但其实还有另一个选择，那就是扶持[QIE.GetRulingParty]在日本的老朋友，大本教的教主$JAP_pnr_onisaburo$。此人痴迷于末世论和成为日本国父，尽管有的时候[QIE.GetLeader]觉得他是在装疯卖傻，但他的行为却似乎证明他是真心的。把这个坏掉的玩具丢给一个失心疯的疯子治理是最好不过的，要是万一[JAP.GetName]活过来了，也好再从他手里讨回来。"
  QIE_pnr_ws_puppet.1.a: "既然如此，把孔德成丢给他们。"
  QIE_pnr_ws_puppet.1.b: "鬼三郎不是一直幻想着这个吗？"
  QIE_pnr_ws_puppet.2.t: "第二次香巴拉探险"
  QIE_pnr_ws_puppet.2.desc: "$JAP_pnr_onisaburo$告知我们，他近日将前往蒙古地区继续上次被$FNG_zhang_zuolin$打断的蒙古探险。1924年他曾通过东北地区尝试进入蒙古，以寻访神秘的香巴拉王国——那是一个存在于佛教神话中的世外桃源，是完美之人的居所。这支探险小队在当地雇佣了一小股土匪充当安保力量。结果不幸的事情很快就发生了，这伙土匪被张作霖发现被剿灭，而探险小队也理所当然地被当成土匪的帮凶全部抓了起来，并计划选个适合处决的日子把他们全都枪毙。\n\n直到日本方面给张作霖拍了电报，张作霖才知道自己抓错了人，这回竟抓到日本人头上去了。$JAP_pnr_onisaburo$等人随后得以返回日本，但这次香巴拉探险也因这场风波而终结。如今在$JAP_pnr_onisaburo$和[QIE.GetName]的统治之下，[JAP.GetName]和[QIE.GetName]终于取得了长久的和平，这使得他开始计划进行第二次探险。\n\n$JAP_pnr_onisaburo$相信自己一定能在蒙古地区找到什么东西的，他计划先访问北京与[QIE.GetLeader]会面，并在短暂休整之后北上进入蒙古，为此需要向我们借一些武器——出于先前[JAP.GetName]和[QIE.GetName]之间的和平条约，他此次前来没有，也无法携带任何武器。"
  QIE_pnr_ws_puppet.2.a: "当然当然，给他点防身武器。"
  QIE_pnr_ws_puppet.3.t: "深入腹地"
  QIE_pnr_ws_puppet.3.desc: "在蒙古的行军是很乏味的，$JAP_pnr_onisaburo$等人的目的地是乌兰巴托以西的鄂尔浑峡谷。在蒙古人心目中，鄂尔浑山是世界的轴心，历代可汗和先祖的灵魂都居住在那里，他们从山上向下释放力量，赋予可汗统治各部落的神圣权力。而对于$JAP_pnr_onisaburo$来说，他坚信神秘的香巴拉王国，“光明国”的入口就藏在那里。\n\n但行军本身还是很无聊，占据了前往圣地朝圣的喜悦和不安。大家不得不开始聊天来集中精神。有人问起为他们带路的向导最近有没有发生什么趣事，向导就讲了一个他听说的战乱时期的冲突：据说更西方的新疆地区有一个年少的残暴军阀，那次他不得不带着几十人对抗一个团，但他毫不惧怕，带着自己的同伴和一大群马匹就上路了。他驱赶马群迎风而行，一边冲锋，一边高喊“立刻交出武器，不然我就率领全军进攻你们！”而敌军看到马群扬起的尘土，以为是一支大军前来，就乖乖投降了。\n\n“就像成吉思汗的故事！”队伍里有个人称赞道。但那向导却有些鄙夷：“好朋友，你们知道后来发生什么了吗——那支投降的团一个活人都没剩下——那军阀把所有人都杀啦！他是个纯粹的疯子，还说要一直打到东海去，在大陆上重建大伊斯兰国！”\n\n正当他们聊得起劲的时候，从队伍的右侧突然卷起一阵和故事一样的尘土，向导眯着眼睛，然后突然像是看到了死神一样大喊出声：\n\n“马贼来啦！”"
  QIE_pnr_ws_puppet.3.a: "开枪射击！"
  QIE_pnr_ws_puppet.3.b: "分开逃跑！"
  QIE_pnr_ws_puppet.2.b: "这疯子真相信有世外桃源啊……"
  QIE_pnr_ws_puppet.4.t: "五彩绚烂的世界"
  QIE_pnr_ws_puppet.4.desc: "不知骑马跑了多久，我终于摆脱了那些盗匪，钻到了我也不知道的某个地方。我在这里迷路了，但问题不大，只要一直往东走就能回到乌兰巴托。当务之急是水，幸运的是这里有一条小溪。所以现在一切都不是问题。我把马系好，在河边装满了水袋，又喝了很多。就找了个石头倚着歇息。\n\n等我醒过来天已经黑了，一个白胡子的，比我更苍老的老者拄着拐杖站在我面前。见我醒过来他便对我说，自己是穴太寺的产土神，而这里是灵力充沛的神圣地点，所以他能显现，他来这里是受到了其他天神的嘱托，帮助我寻找到我想要得到的东西。初代大天使长稚樱姫命命他来到这里，为我指引前往“光明国”的道路。我想要上马，但是马却不见了。\n\n产土神告诉我这里是灵界和现实的夹缝，而牲畜这种灵魂被蒙蔽的生物很难进入到这里。他向河流的另一端伸出手指，我就和他一同乘上祥云，快速飞掠过熟睡的城市上空，来到一个神秘瀑布的山洞中。产土神告诉我这里就是“光明国”的入口了，只要穿过七七四十九座楼阁，就到“光明国”了。那里是仙人居住的仙境，因为我是活人不能进入，只能远远地望一眼。"
  QIE_pnr_ws_puppet.4.a: "那我们走吧。"
  QIE_pnr_ws_puppet.5.t: "新灵界物语"
  QIE_pnr_ws_puppet.5.desc: "在穿过了许多奇异的领域之后，不知何时我又和产土神走散了。从我头顶上方传来沙沙的怪声，我抬头看天空，什么都没有。等我再看前方的时候周围的环境就变成了一条携着泥沙的奔腾咆哮的大河，声音如同雷霆，令人害怕。从大河之中跃出一头如同鬃毛如同火焰的狮子拦在我面前，对我发出低沉的咆吼，这一定就是此圣地的护法神。\n\n它说它奉苇原瑞穗国高照姫命的命令守卫着这里。自从高照姫命用毁灭之剑攻击了耶路撒冷的常世彦的魔君而被囚禁在伊甸园之后，他就被罢免到这里守卫着“光明国”的大门——只有有福的死者才能行走过这条河，生者和罪人都会因为自身重量而掉下去。正当我因护法的警告而准备折返的时候，一个穿白衣的美丽少年从河对岸踩着星辰过来了，他有着超凡的美丽容颜，在原业平在他面前也会羞愧难当。\n\n那穿白衣的少年伸手抚摸那狮子的毛发，安抚这猛兽。又向我深鞠一躬，双手在胸前合十，说：\n\n“我是管理此地的大神，受命警惕盘古一族再次摧毁约旦河。如今正值天运循环，国常立尊命我在此守候，等待你前来。我们将一同前往灵界，加入宇宙的大神业中，化身拯救三界的大慈悲之尊。”\n\n少年向我伸出右手，在我背后，突然传来产土神急切的呼唤，要我不要过多停留，继续和他一起走。"
  QIE_pnr_ws_puppet.5.a: "我只到此，不再越过。"
  QIE_pnr_ws_puppet.5.b: "我听到了清朗的笛音。"
  QIE_pnr_ws_puppet.6.t: "新“教皇”，或称为圣地管理人"
  QIE_pnr_ws_puppet.6.desc: "随着我们攻陷最后一座圣地，世界上大多数曾发生过基督教圣母显灵，以及和基督教本身密切相关的圣地都落入我们手中了。可以说，[ROOT.GetName]是真正的十字军精神的继承者。为了统治这跨越了多个大陆的圣地领土，我们效法当年列强建立“使馆城市”那样的准国家的方法，扶持了以梵蒂冈为总部的特别城市组织。\n\n然而长久以来，我们都没有为新生的，在仁慈的中国人的公正监督下运作的梵蒂冈指派一位管理相关事务的总督。如果没有总督，事务就很难开展——最好的选择是本来就在梵蒂冈里的那些红衣主教，但征召各个圣地有权威的人也不失为另一种好办法。不论是谁，他最终都不得不受到我们的控制。"
  QIE_pnr_ws_puppet.6.a: "阿尔弗雷德·鲍德里亚尔，法国枢机。"
  QIE_pnr_ws_puppet.6.b: "路易斯·玛丽亚·马丁内斯，来自墨西哥。"
  QIE_pnr_ws_puppet.6.c: "曼努埃尔·贡萨尔维斯·塞雷热拉，葡萄牙枢机。"
  QIE_pnr_ws_puppet.6.d: "米歇尔·冯·福尔哈伯，德国枢机。"
  QIE_pnr_ws_puppet.6.e: "皮埃尔·赛列斯汀——我们的老同事。"
