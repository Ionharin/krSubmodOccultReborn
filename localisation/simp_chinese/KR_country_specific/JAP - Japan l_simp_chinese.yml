 JAP_unpopular_republic_idea: "不得民心的共和国"
 JAP_unpopular_republic_idea_desc: "在[JAP.overlord.GetNameDef]的要求下，日本实现了共和体制。据说此举在宗主国内颇受欢迎，却在日本国内引发了剧烈民愤。如今新政府肩负重任，必须赢得日本民众的支持，否则他们的结局将和第一次世界大战后诞生的众多类似政权一样悲惨。"
 JAP_question_of_the_imperial_family_abolished_tt: "§L我们的宗主强制要求我们实行共和制，这一决定不得民心，但我们唯有砥砺前行。是时候去赢取民众的支持，并寄希望于他们终有一日能接受日本的崭新未来了。§!"
 JAP_republic_effect_tt: "§Y天皇制度§!将被彻底废除，日本将成为§Y日本共和国§!。\n"
 japan_domestic_events.240.c: "我们必须彻底废除天皇制。"
 japan_news_events.1.t: "日本帝国崩溃"
 japan_news_events.1.d: "日本帝国，这个旭日初升般兴起的亚洲强国，在考虑过近来的条款后宣布日本本土列岛的一切部队正式投降。死硬而好战的日本人不见棺材不掉泪，他们无疑不愿见到祖国化为废墟。日本曾被视为太平洋地区最为重要的工业国，有着全世界最现代化的海军和陆军，如今日本的战败令其势力圈最终解体。在压倒性的败局面前，共荣圈的各个成员国如樱花般四散于风——或许还面临着外部侵略的威胁。总而言之，有一点是确切无疑的：朝阳已落，亚洲的新主人可能很快就能将取日本而代之了。"
 japan_news_events.1.a: "残阳如血。"
 japan_news_events.2.t: "大太平洋战争"
 japan_news_events.2.d: "自第二次美国内战以来，日本帝国几乎没有遇到抵抗就在太平洋站稳了脚跟。很多人预测它将成为该区域的首要势力，坐拥超过其美国和德国对手的影响力。在内战后，美国政府重建了其军事和工业实力，把目光再次投向太平洋，并伴随着两个大国之间的海军交战，公开挑战日本的霸权。\n\n尽管日本曾在太平洋上取得了巨大的成功，但由于美国这一工业巨人摆脱了内战的废墟，其战争机器重现生机，日本现在面对着迄今为止最大的挑战。"
 japan_news_events.3.t: "旭日高升"
 japan_news_events.3.d.default: "自《青岛协议》签署以来，日本深陷经济危机与社会动荡，国内形势愈发严峻，由于对德国干涉中国应对不力，专断的田中义一内阁就此倒台。然而，旭日帝国已重整旗鼓，作为仅局限在东亚的地区大国再次崛起。\n\n今天，日本高层宣布了夺取列强之位的新计划，且在必要时将动用武力。消息已经传到了柏林，而德皇和宰相府尚未对本国殖民地的这一公然威胁做出回应。"
 japan_news_events.3.d.defeated_in_china: "在柏林证券交易所崩盘、清廷对中国的统治崩溃后，强大的日本帝国才刚要开始大展宏图，可令人震惊的是，中国成功击败了朝鲜全境的日本军队，并将他们一个不剩地赶出了大陆。在此之前，许多观察家都曾认为日本会成为东亚的主导力量，但在他们灾难性的大败过后，前景就变得模糊起来。\n\n在日本高层最近的一次公开讲话中，他们似乎并不在意这些“小麻烦”，并宣布了让日本再次成为列强的计划。只有时间才能证明日本是否能够真正实现其雄心壮志。"
 japan_news_events.3.a: "令人不安。"
 japan_news_events.4.t: "东京军事政变失败"
 japan_news_events.4.d: "从日本传来了令人震惊的消息。极端天皇主义者与民族主义者领导着一帮军中激进派发动了政变，意图推翻岌岌可危的东京民主政府。他们控制了全首都的重要机关和关键建筑，但天皇本人的明确拒绝让这场政变在随后的数个小时内完全失败。\n\n许多高层军官及支持者满腔悲愤，切腹自尽。东亚民主的支柱成功幸存，至少现在如此。"
 japan_news_events.4.a: "皇城内外风波定，民主昭日耀扶桑。"
 japan_news_events.5.t: "日本皇室的命运"
 japan_news_events.5.d.exile: "随着前日本帝国政权更迭，天皇家族的命运悬而未决——直到昨天。随着日本人民共和国第一次代表大会的闭幕，大会认为天皇家族已不适合留在日本。今天，天皇家族乘远洋渡轮离开东京前往美洲，消失在公众视野之外。\n\n此举引发了东京港的罢工以及大多数主要城市的抗议活动，但预计这种情况将在几个月后恢复正常。"
 japan_news_events.5.d.abolishsocialist: "随着前日本帝国政权更迭，天皇家族的命运悬而未决——直到昨天。随着日本人民共和国第一次代表大会的闭幕，大会认为天皇制度和他们的头衔应该都被废止——从今天起，天皇一家获得日本公民身份，同他们曾经的臣民别无二致。\n\n这一行为引发了东京市中心的一起罢工，大阪和长崎也发生了规模更小的抗议，但是一个月内局势应该便会恢复正常。"
 japan_news_events.5.d.abolishdem: "随着前日本帝国政权更迭，天皇家族的命运悬而未决——直到昨天。按照[JAP.overlord.GetNameDef]的要求，皇室机构已被废除，天皇制度和他们的头衔都被废止——从今天起，天皇一家获得日本公民身份，同他们曾经的臣民别无二致。\n\n这一行为引发了东京市中心的一起罢工，大阪和长崎也发生了规模更小的抗议，只要新政府存在一日，这种广泛的公众抗议也许便会如影随形。"
 japan_news_events.5.d.symbol: "随着前日本帝国政权更迭，天皇家族的命运悬而未决——直到昨天。随着[JAP.GetName]国会特别会议的闭幕，大会认为天皇，乃至于天皇家族，作为日本国家和人民的象征，应该承担公共和官方的责任，但不能在新政府中发挥任何作用。\n\n为了强调这一点，[JAP.GetLeader]天皇发表了意义非凡的广播演讲，公开宣布“放弃神性”，他强调，菊花御座和人民之间的关系始终建立在彼此间的信任和感情，而不仅仅是神话或传说之上。"
 japan_news_events.5.d.abdicate: "随着前日本帝国政权更迭，天皇家族的命运悬而未决——直到昨天。随着[JAP.GetName]国会特别会议的闭幕，大会认为天皇，乃至于天皇家族，作为日本国家和人民的象征，应该承担公共和官方的责任，但不能在新政府中发挥任何作用。\n\n在接受国际媒体采访时，临时摄政高松宫宣仁亲王表示，虽然天皇退位造成了日本国内的些许动荡，但这是维持长期和平、恢复日本与其宗主国友好关系的必要操作。"
 japan_news_events.5.a: "一个时代落幕，新的时代开启。"
 japan_news_events.6.t: "昭和维新"
 japan_news_events.6.d: "过去几周，来自东京的报告寥寥可数；但现在，大多数人都认为日本民主已然寿终正寝。政府未能镇压蔓延全国的新生工团主义运动，随后，保守派军官发动政变推翻了首相，建立了军事独裁统治。但事实证明这也仅仅只是暂时的——素来视保守派为仇雠的维新派军官举旗反正。\n\n在血染亚洲第一大城市街角巷尾之际，他们宣布进行“昭和维新”，恢复天皇至高无上的权力，并实现日本的重生，摆脱工团主义、民主乃至西方的腐朽影响。"
 japan_news_events.6.a: "尊皇讨奸！"
 japan_news_events.6.b: "哦，不……"
 japan_news_events.7.t: "日本军事政变"
 japan_news_events.7.d: "过去几周，来自东京的报告寥寥可数，但日本民主似乎已然寿终正寝。经过多年的内讧、丑闻以及政党间的腐败，激进的维新派军官发动了政变，意图将国家转变为一个极端民族主义的政权。最终，他们的企图失败了——仍忠于政府的军队发动了反政变，成功粉碎了叛军。\n\n然而，这一事件毫无疑问地揭露了各党派的软弱，日本在实际上已经转变成了一个军事独裁国家，遵循着民族主义、法团主义和军国主义的思想原则。"
 japan_news_events.7.a: "天皇万岁！"
 japan_news_events.7.b: "哦，不……"
