 JAP_fading_sun: "落日"
 JAP_fading_sun_timer: "落日"
 JAP_fading_sun_timer_desc: "我们已经失去了在大陆上的据点！即使我们能像现在这样继续战争，但是我们没有多少剩余时间了。精英阶层对这场战争的政治上的支持正在迅速衰落，我们一次又一次的失败带来的耻辱使群众走上了街道。如果帝国还想继续生存下去，我们必须尽快在大陆上找到新的立足之地！"
 JAP_fading_sun_timer_enemy: "落日"
 JAP_fading_sun_timer_enemy_desc: "对日本正在进行的战争来说，朝鲜半岛和旅顺口被外国势力占领是一个沉重的打击。除非他们能在大陆上攻占一个新的立足之地，否则我们给他们造成的无数失败将点燃他们国内的动荡，很快会强迫这个旭日帝国坐上谈判桌。"
 JAP_offer_peace_to_china: "同中国议和"
 JAP_offer_peace_to_china_desc: "中国人已击败了皇军，如今占领了满洲和朝鲜。虽然他们全无入侵我本土的能力，战败的耻辱也已在国内引起了大规模不满。不论此番行为会让我国如何蒙羞，但现在最好的办法是立刻谈判求和，然后转移重心到处理内部问题。"
 JAP_offer_peace_to_russia: "同[From.GetNameDef]议和"
 JAP_offer_peace_to_russia_desc: "俄国人已经击败了皇军，控制了我国在大陆上的领土，为他们1905年的战败一雪前耻。虽然俄国人绝无入侵本土的能力，战败的耻辱也已在国内引起了大规模不满。不论此番行为会让我国如何蒙羞，但现在最好的办法是立刻谈判求和，然后转移重心到处理内部问题。"
 JAP_attack_indochina_desc: "一个独立的[From.GetNameDef]是不可接受的，除非将其纳入我国势力范围内。我们必须立刻采取行动！"
 JAP_attack_india_desc: "如果我们想控制印度次大陆，[From.GetNameDef]就应该是我们的下一个目标！"
 JAP_attack_australia_desc: "[From.GetNameDefCap]坐落于我们的太平洋利益圈内，是时候将我们的意志贯彻到其身上了！"
 JAP_take_over_sakhalin: "夺取北桦太"
 JAP_take_over_sakhalin_desc: "桦太岛上的全部石油资源都集中在其北半边。如今的远东政府控制力薄弱，而俄罗斯正处于劣势，这是夺取它的最佳时机！"
 JAP_attack_russia_desc: "摆脱欧洲掠夺、建立亚洲共荣的梦想已经实现，但[From.GetNameDef]作为我们的眼中钉，依旧为其1905年的战败而耿耿于怀。我们不能让他们危及我方伟业，必须采取先发制人的措施彻底解除其武装。"
 JAP_influence_china: "旭日与坠龙"
 JAP_influence_china_desc: "我们的邻国中国如今虽然衰弱却依然不可小觑。1911年辛亥革命后，中国被各路军阀、革命者和分裂分子瓜分，而我们则始终难以掌握该地区的控制权。动荡不安的局势和民族主义的浪潮使我们的盟友始终无法长期控制中国的大部分地区，其他竞争对手则试图将我们排除在外。而与此同时，我们构建势力范围的努力也因己方政策的自相矛盾与短视而受阻。\n\n面对这一困境，我们在该地区的代理人开始互相竞争，这固然让我方政策变得灵活，但代价却是他们的自主权正不断增长。中国境内的冲突似乎已不可避免，而通过支持我们在大陆上的盟友，我们可以最大限度地发挥自身优势并减少直接介入。\n\n我们当前对§e[FNG.GetNameDef]§!的影响力为[?FNG.FNG_JAP_influence_variable|j%0]。"
 JAP_china_army_training: "帮助[From.GetName]扩军"
 JAP_provide_arms_facilities: "为[From.GetNameDef]供应武器"
 JAP_support_offensive: "支援[From.GetNameDef]的攻势"
 JAP_provide_planes: "允许[From.GetNameDef]获取战斗机设计"
 support_chinese_separatists: "支持[From.GetAdjectiveCap]独立"
 send_ETS_tartar_guy: "派阿卜杜拉希德·易卜拉欣前往[ETS.GetName]"
 JAP_pan_asianism: "利用泛亚宣传"
 JAP_pan_asianism_desc: "中国多年来遭受着欧洲列强的残酷掠夺。以泛亚主义和兄弟情谊之名，我们将通过宣扬该事实来消磨中国人的意志——倘若他们愿意放下分歧，中日两国将携手组建一个足以对抗西方帝国主义的强大阵营。"
 JAP_harmony_and_reconciliation: "和谐与和解"
 JAP_harmony_and_reconciliation_desc: "虽然军阀一直在抵抗我们，中国人民一定能看清我们的本意。我们多次试图警醒他们有关军阀对中国人民的剥削，以及中国如果继续照此发展将会发生的灾难。只有我们能将他们从这迫在眉睫的灾难中解救出来，确保中日两国的和谐未来。"
 JAP_unity_through_peace: "团结与和平"
 JAP_unity_through_peace_desc: "全体中华民族团结一致，免遭贪婪军阀剥削时刻到来了。我们将号召军阀下台，并真正实现他们宣称为之奋斗的理想。"
 JAP_finish_off_stragglers: "消灭[FROM.GetNameDef]"
 JAP_finish_off_stragglers_desc: "出于各种理由，[FROM.GetLeader]和他的[FROM.GetRulingParty]亲信正设法避免和我们的冲突，也许他们是想用保持中立的方式稳坐江山。但是中国必须被统一在正确的权威之下。在我们构筑的新秩序中，没有离群浪士的容身之所。因此，我们要消灭军阀主义的最后残余。"
 JAP_peace_effects: "§Y所有与我们交战的中国势力§!："
 develop_generic_tag: "发展[From.GetNameDef]的军工"
 major_railroad_investment: "[From.GetAdjectiveCap]大规模铁路投资"
 minor_railroad_investment: "[From.GetAdjectiveCap]小规模铁路投资"
 develop_fengtian: "发展[FNG.GetNameDef]的军工"
 harbin_chemical_research: "哈尔滨化学研究所"
 changchun_industry_investment: "吉林工业区"
 JAP_NSA_focus: "国家保安法"
 JAP_NSA_focus_desc: "国会就《国家保安法》的辩论已经持续了几个星期，这是决定国家未来的历史时刻。保守派的议员们担心，一旦法案没有被通过，社会上的激进分子就会试图夺权。日本的未来正掌握在我们手中。"
 JAP_protect_constitutional_government: "维护宪政"
 JAP_protect_constitutional_government_desc: "日本是亚洲现代化的灯塔，人民长期享有稳定，让亚洲大陆各处人民十分眼红，多地人民竞相学习。不幸的是，近期的事件暴露了我国年轻政府中的缺陷。我们还有很多工作要做，要重塑人民对政府的信任……还要为参与选举的人民提供更好的安保，这样五·一五政变之类的事件才不会再次发生。"
 JAP_civil_servant_purge: "公务员清洗"
 JAP_civil_servant_purge_desc: "我们若想根除社会主义激进分子的威胁，就有必要剥夺任何他们可能拥有的政治权力。虽然一些更温和的声音认为这种担忧言过其实，我们可担不起任何风险：政府机构需要彻底清除任何意识形态上的不良分子。"
 JAP_promote_conciliation_unions: "推广调解工会"
 JAP_promote_conciliation_unions_desc: "尽管健康的民主制度应当允许工人组织起来争取更好的条件，但让工会在不加监管的情况下运作只会让工厂成为激进思想的温床。为避免工会活动失去控制，我们应依靠拒绝阶级斗争思想的劳工组织进行调解，鼓励雇主组建并监管自己公司的工会。"
 JAP_investigate_corruption: "调查腐败"
 JAP_investigate_corruption_desc: "经过深入调查，我们地方政府的许多人似乎一直在向其他政党妥协，以换取礼物或人情。更糟糕的是，先前的政友会政府的势力显然在有权势的人中盘根错节，一些高层人士甚至私下相交，对一些见不得人的交易视而不见，以换取大鳄们的继续支持。我们不能容忍这种弄虚作假，继续从现在起遏制腐败。"
 JAP_peace_preservation_laws: "治安维持法"
 JAP_peace_preservation_laws_desc: "尽管十多年前自由派政党驳回了田中大将提出的《治安维持法》，但最近的事件表明，即使在民主制度中，也需要强有力的手段来保护其机构以免受激进分子的威胁。作为维护日本国会制度的最后一步，我们将修改《国家保安法》，以便于打击任何威胁日本国体的人。当然，先从跳梁的工团分子和无政府分子开刀。"
 JAP_rebuild_public_faith: "重建公众信心"
 JAP_rebuild_public_faith_desc: "国家局势混乱、经济凋敝，也难怪人民对现有体制失掉了信心。重塑人民对民主体制的支持至关重要，但这不能靠威胁或审查，而是靠策略和方法。新闻采访、履行竞选承诺以及鼓励当选官员与相关社区接触都能随时间推移慢慢重建健康的政治风气。"
 JAP_rural_outreach: "乡村推广"
 JAP_rural_outreach_desc: "日本建立起了数个繁荣的工业中心，随可之而来的还有些不幸的副作用。就目前而言，被落在后面的农村地区的条件还没有迈入二十世纪，他们正在苦苦挣扎。激进的农地改革固然愚蠢，但给予佃农更多保护，并向耕地农民提供更多使用现代农耕机械的机会，这都将有助于减轻其负担。"
 JAP_elite_mediation: "精英中介"
 JAP_elite_mediation_desc: "为了重塑政府权力，我们必须想办法找到盟友。万幸的是，政友会不少成员与日本权贵阶层有密切往来。也许有人会称之为恩庇关系，但那些人都是爱国者，为日本国鞠躬尽瘁，我们若是给予一些恩惠，他们必将感恩戴德。"
 JAP_ties_to_the_zaibatsu: "与财阀的关系"
 JAP_ties_to_the_zaibatsu_desc: "日本工业的繁荣很大程度上归功于财阀。多亏了他们与我党的往来，我们之间才能发展出互惠关系，给予我党合法性。同时我们对他们的一贯支持也将对经济持续增长有利。"
 JAP_reorganise_public_finance: "重组公共财政"
 JAP_reorganise_public_finance_desc: "所谓的“失去的十年”给我们的公共财政造成了极为恶劣的影响。财政紧缩导致资产投资和公共服务系统的大幅度缩水。从现在起，我们将着眼于扶持衰落产业、新建医院并在全国范围内补贴制造业。"
 JAP_support_from_unions: "工会的支持"
 JAP_support_from_unions_desc: "随着日本工业的快速发展，普通工人与工厂主的差距也在日渐增加。抛开反动派和保守派的哀叹不谈，工会只是帮助工人对抗雇主的一条合理有效途径。与其打压工会，不如尝试倾听他们的需求以赢得他们的支持。"
 JAP_protection_for_tenants: "保护佃农"
 JAP_protection_for_tenants_desc: "许多日本农民仍然没有属于自己的土地，收入只是刚好够维持生计。虽然彻底的农地改革依然道途且长，但为了赢得大多数农民的支持，我们将保护农民的合法权利，并在农民和地主的纠纷中尽可能地给予帮助。"
 JAP_building_the_mass_party: "建设大众党"
 JAP_building_the_mass_party_desc: "近来，民政党人气飙升，尽显灵活手腕，试图发展为真正的大众党。与腐败不堪、精英主义的政友会相反，民政党代表着日本的平民大众，而非想要限制民权的腐败精英。因此，他们开始与其他组织谈判寻求支持，推动党内进一步采取行动，继续发展壮大。"
 JAP_parliamentary_socialism: "议会社会主义"
 JAP_parliamentary_socialism_desc: "社会大众党在大选中大获全胜，许多人陷入沮丧之中，对此感到难以置信。他们希望代表日本的工人阶级和农民，因为国家需要辛劳大众的支持。保守派诋毁他们是彻头彻尾的工团主义者，而他们的目标其实只有一个：建设一个为了多数人，而不是少数人的日本。"
 JAP_utilise_the_peace_preservation_laws: "动用《治安维持法》"
 JAP_utilise_the_peace_preservation_laws_desc: "虽然在过去几年间，《治安维持法》的铁拳曾经砸到过我党不少党员的头上，但现在我们取得了政权，可以利用该法对付反对党。与企业主有联系的民政党和政友会腐败官僚将受到审查，而私有财产也不再神圣不可侵犯，从这里开始，我们将动用一切必要手段保护日本工人。"
 JAP_city_housing_projects: "城市住房计划"
 JAP_city_housing_projects_desc: "日本大城市的许多居民住不起体面的住处，只能委身于破烂小屋或者待在棚户区。同时，从乡下入城的居民越来越多，其需求也没能得到满足。为确保尽可能多的人能过上得体的生活，政府已计划了一项大规模公共住房项目。"
 JAP_promote_artistic_expression: "促进艺术表达"
 JAP_promote_artistic_expression_desc: "虽然搬进大城市的人越来越多，仍然没几个人能自己创作甚至欣赏艺术。电影、绘画、音乐、戏剧……必须有足够资金鼓励有抱负的艺术家进行创作，并向人民宣传以供其欣赏。在下个十年，日本艺术家将享誉亚洲乃至整个世界。"
 JAP_entrench_bureaucracy: "维护新制度"
 JAP_entrench_bureaucracy_desc: "有了上次选举的胜利，民政党终于有了足够的影响力在政府中进行广泛改革。大量保守派占据的职位将由我党职员取代，他们都愿意为日本民主事业的繁荣而不懈努力。这也有望对我们在政友会的对手造成沉重打击。"
 JAP_primacy_of_the_diet: "确保国会至上"
 JAP_primacy_of_the_diet_desc: "日本可以为自身亚洲民主灯塔的地位而自豪，而为永葆自由主义火炬不灭，议会必须始终作为政府决策的中心机关。官员既已被日本人民寄予厚望，则必须能不偏不倚地代表人民之意志，同时不能被保守的贵族或臃肿的官僚束缚。"
 JAP_divert_funding_to_military: "向军队倾斜预算"
 JAP_divert_funding_to_military_desc: "虽然过去十年可称得上是经济困难时期，现在我国经济可以说已经重回正轨。凯旋的政友会要做的第一件事便是将一大笔预算拨给国防事务，以确保我国作为东亚强国之首的地位得以永固。"
 JAP_loosen_economic_regulations: "放松经济管制"
 JAP_loosen_economic_regulations_desc: "社会主义破坏活动的威胁看来已渐行渐远，亚洲各地新商贸伙伴也越来越多，是时候重新审视过去十年实施的经济政策了。我们最大的支持者、举足轻重的企业家指出，自由放任政策是保持日本经济增长的必要之举，拒绝该提议只会阻碍创新和获利。"
 JAP_devotion_to_war_effort: "献身备战"
 JAP_devotion_to_war_effort_desc: "随着欧洲强国再一次陷入公开冲突，接下来的十年将以战争为主题。为了维护日本正当国际地位，我们要让每个人明白共克时艰的道理，他们得加倍卖力干活，支援离开故土在远方作战的战士。因为这些战士是日本的英雄，而为了让他们取得胜利，我们付出再多的汗水也不为过。"
 JAP_cult_imperial_institution: "天皇制度崇拜"
 JAP_cult_imperial_institution_desc: "天皇不仅仅是花瓶，其代表了日本人民几千年的传统和共同的身份认同。我们作为天皇陛下的代表，目标也是要保证我们的人民记住，他们的牺牲奉献有助于保护我国国体，为子孙后代计，抵挡那些试图改变我们国家的人。"
 JAP_towards_nationalist_mass_party: "迈向民族主义大众党"
 JAP_towards_nationalist_mass_party_desc: "与自家政党中的当权派意见相左的反主流政治家们组建的国民同盟已成为议会中一股新的强大民族主义势力。有人认为他们的胜利是民主的倒退，但他们坚称自己最能代表人民，与那些害得国家差点落入工团主义深渊的懒惰政党有天壤之别。日本人民将动员起来，用行动支援国家和军队。"
 JAP_dirigiste_economics: "统制经济"
 JAP_dirigiste_economics_desc: "随着日本在世界舞台上崛起，她已无法全心全意地相信全球市场上的其他国家能成为诚实、持久的合作伙伴。更糟糕的是，许多国人总是想着富了自己的腰包，而不是为国纾难。我们要保证自己永远不会再任由市场摆布，国家有必要对工业和银行业进行高度干预，这样经济才能像一台润滑充分的机器运转起来。"
 JAP_military_centralism: "军事集中制"
 JAP_military_centralism_desc: "暴民统治的时代已经不复存在，那些背信弃义的政客们也不会为了自己的利益而阻碍国家。现在，在我们的指导下，日本将与曾经瞧不起我们的大国竞争。"
 JAP_create_cabinet_planning_board: "建立企划院"
 JAP_create_cabinet_planning_board_desc: "尽管我们已经摆脱了旧制度，但仍有一些老练的政治家是支持我们事业的爱国者。建立企划院将有助于确保我们的权力和国家的方向。"
 JAP_budget_research_and_policy_section: "预算与政策研究部"
 JAP_budget_research_and_policy_section_desc: "各行政机关长期各自为政，在资金问题上你争我斗——现在是时候结束这些无谓的争吵了。只有设立一个新的部来处理未来的预算和政策研究，这类问题才能迎刃而解，同时使我们保持对国家的长期目标。"
 JAP_expand_propaganda_agency: "扩大宣传机构"
 JAP_expand_propaganda_agency_desc: "通过给宣传机构提供额外资金，我们不仅能够在日本，还能够在全亚洲传播我们的思想。这番努力对我们未来数年的计划可谓是至关重要，如此才能够让所有人都认识到帝国的理念，并努力去捍卫它。"
 JAP_merge_small_ministries: "合并小省厅"
 JAP_merge_small_ministries_desc: "小而低效的中央省厅往往会阻碍国家取得更大进步，并造成不必要的繁文缛节。为解决这一问题，我们将推动合并部分省厅，不过国会中的一些人可能会反对此次行动。"
 JAP_promote_nationalist_education: "推进民族主义教育"
 JAP_promote_nationalist_education_desc: "没有哪个国家能在国民都是文盲的情况下变得伟大，然而，即使是最优秀的人才也会对日本的伟大命运望而却步。为了防止这种情况，我国必须摒弃外国的理想，转而向年轻人传授兄弟情谊的理念，使他们能够继续在有利于自己和同胞的道路上前进。"
 JAP_rationalise_industrial_development: "合理化工业发展"
 JAP_rationalise_industrial_development_desc: "我们要牢记，日本作为一个大国的地位和其他老牌列强一样，是由战争和随后取得的成功打造出来的。随着周遭的世界开始燃烧，我们必须迅速地将经济转变为适应战争的经济，如此，我国才不会被那些试图摧毁我们的人击败。"
 JAP_create_five_year_plan: "制订五年计划"
 JAP_create_five_year_plan_desc: "为了我们准备未来的计划，我们必须重新统筹国家，使其能够与西方列强匹敌。建立起新的强大的工业和军事力量，才能将亚洲从帝国主义者手中解放出来。"
 JAP_reorganisation_of_aerial_industries: "重组航空工业"
 JAP_reorganisation_of_aerial_industries_desc: "空军是未来战争的主旋律，因此赢下空军就是赢在起跑线上。我国航空工业的快速发展将实现这一愿景。"
 JAP_develop_manchurian_resources: "开发满洲资源"
 JAP_develop_manchurian_resources_desc: "天不佑日本，我们的自然资源并不多，但我们可以通过投资我们拥有海量资源的盟友来解决这个问题。只要满洲当局仍忠于我们，我们在满洲的额外投入就不会打水漂。这场投资可谓皆大欢喜。"
 JAP_zabaitsu_contracts_focus: "与财阀的合同"
 JAP_zabaitsu_contracts_focus_desc: "财阀对我们的计划略感恼怒，他们企图获得比现在更大的真正的自主权。话虽如此，他们仍然可以利用，只要财阀们无私地为国家大计服务，我们就可以与他们达成互利的协议。"
 JAP_nationalise_the_railways: "铁道国有化"
 JAP_nationalise_the_railways_desc: "只要还有部分铁道系统处于私营管理，日本就不能向前发展。只有把铁道的运营权从私企的手中抽离出来，并完全纳入国家的控制之下，才能有助于我国未来的战争事业。"
 JAP_national_defence_state: "国防国家"
 JAP_national_defence_state_desc: "虽然陆军提出了很多建议，但事实是，政府来来去去，我们的进步可能在未来就被冲走。为了防止这种情况的发生，我们将创建一个真正团结日本人民的政党，并作为保持国会步调一致的工具。"
 JAP_showa_restoration: "昭和维新"
 JAP_showa_restoration_desc: "随着天皇陛下正式为政变背书，维新已然成功！然而，统治根基尚未稳固，夺权不易，执政更难。维新派已陷入派系纷争，为了缓和紧张局势，近卫文麿首相将确保维新事业以统一的面貌昭示全日本。"
 JAP_destroy_degenerative_individualism: "摧毁堕落个人主义"
 JAP_destroy_degenerative_individualism_desc: "个人主义作为西方舶来品，无疑带来了拒绝报国的自私与推诿。个人主义及其伴生口号“民主、自由、平等”已经深深腐化了国家。是时候杜绝这些概念，彻底将它们扫出国门了。"
 JAP_eliminate_party_politics: "消灭党派政治"
 JAP_eliminate_party_politics_desc: "我们相信思与行的统一，而不是只会带来灾难的无休止且分裂的争吵。若国家沦丧，再繁荣的经济也分文不值。只有维新事业能让国家重焕生机。"
 JAP_work_through_the_dojinkai: "与同人会合作"
 JAP_work_through_the_dojinkai_desc: "政治运动不能只靠嘴皮子，为了不让事业昙花一现，我们需要向维持国家机器运转的商人、官僚和政客们明确，他们在牌桌上仍有一席之地。\n\n谢天谢地，昭和同人会刚好就在做这件事。"
 JAP_one_country_one_party: "一国一党"
 JAP_one_country_one_party_desc: "党同伐异的政党政治琐碎至极。若是将所有前政党及其成员，乃至将最偏远的村庄囊括在内，都吸纳入大政翼赞会，体制运行将高效得多。"
 JAP_rural_development: "乡村发展"
 JAP_rural_development_desc: "眼不见、心不烦的态度已成为过去：如今地方巨头成为了政府的一部分，我们可以大胆向迄今仍然未知的乡村进发，将翼赞带给广大群众。"
 JAP_work_with_the_elite: "亲近大企业"
 JAP_work_with_the_elite_desc: "政治联盟内的民粹主义言论呼吁限制商人和地主的影响力，并对工业进行大规模国有化，这些观点已使我们疏远了国内一些精明人士与权势人物。我们必须阐明，这些人对建设新日本的事业仍有很大帮助。"
 JAP_development_of_a_new_way: "新的道路"
 JAP_development_of_a_new_way_desc: "把日本商界头面人物召集到一间屋子里的效果，就是让他们终于意识到合作比竞争来的更有效。发起集体请愿来废止规章或者往自己的工厂增派工人，要比他们习惯的私下贿赂高效得多。"
 JAP_continue_zaibatsu_ties: "朋友间的人情"
 JAP_continue_zaibatsu_ties_desc: "财阀是维持日本发展可持续性的关键，他们的顺从应该已足以证明其善意。我们是为了国家利益最大化选择维持这合作关系的，也乐意向其提供让步，只要他们继续支持我们的行动。\n\n毕竟，朋友之间帮个忙有什么大不了的呢？"
 JAP_appease_the_kodoha: "安抚皇道派"
 JAP_appease_the_kodoha_desc: "在皇道派的强硬观点和治国理政的现实之间调和并不容易，但我们绝不能忘记，正是他们把我们推上宝座。只有傻子才会恩将仇报。"
 JAP_shison_danran: "子孙团乐"
 JAP_shison_danran_desc: "最为重要的是，日本国建立在坚实的基础之上：天皇和臣民之间的关系以“王道”组织起来。一千多年来，这一基础使日本在一千多年来优于任何其他国家，而我们将继续保持。"
 JAP_revere_imperial_power: "尊崇皇权"
 JAP_revere_imperial_power_desc: "国家总是受限于那些打着天皇名号的阴谋官僚和吵闹的政客，然而他们只是贪心不足，一心想为自己攫取权力，损害了天皇的利益。既然真正的爱国者已经掌权，是时候把权力交还给应得之人了。"
 JAP_enact_economic_controls: "实行经济统制"
 JAP_enact_economic_controls_desc: "虽然工业在日本强国征程中的作用不可否认，但私营经济对我国经济的统治地位已产生了可怕的副作用。不断增长的城市市民阶层饱受腐化的美式思想的荼毒，整天想着削减政府的权力，这将极大危害日本未来成为世界一流强国的事业。皇道派将着力削减无节制的资本主义影响，并引导我国经济转向战争方向。"
 JAP_colonial_investments: "殖民地工业"
 JAP_colonial_investments_desc: "我们的海外领地是用来试行长期大规模工业化的好地方。今天若能在朝鲜和满洲行得通，将来也适用于东北地区和北海道。皇道派关键人物已负责掌管这些地区，这让在当地推行工业化项目变得相当方便。"
 JAP_curtail_the_zaibatsu: "终结无节制"
 JAP_curtail_the_zaibatsu_desc: "财阀体现了日本社会最恶劣的一面：腐败、裙带关系以及他们与民主党派的关系，这都清楚地表明，我们应该停止与他们的一切合作，极力削弱他们的影响。毫无疑问，这么做需要时间，但我们会启动一项对几大企业集团的国有化计划，并开始打击政府内部已经暴露的协作者。"
 JAP_build_the_mass_party: "建设新体制"
 JAP_build_the_mass_party_desc: "昭和研究会存在期间制定了许多关于整顿日本政治、经济、全球地位和文化方面的计划。如今该机构赞助者执掌权柄，这些计划得以施行，日本也将依照其理念完成转变。"
 JAP_nation_service_draft_ordinance: "国民征用令"
 JAP_nation_service_draft_ordinance_desc: "我们可以将工人直接分配到需要额外人力的工业项目，来减轻生产线的负担。"
 JAP_mobilise_the_nation: "动员国民"
 JAP_mobilise_the_nation_desc: "最近数十年，由于议员的争吵不休和对激进思想传播的不管不顾，日本社会陷入了分裂。我们将通过组建爱国组织、加强教育和国有化媒体行业等措施摒弃内部分裂、培育爱国精神，着力重建社会精神面貌，加强国民纽带，并让他们知道自己在为何而奋斗。"
 JAP_independence_and_self_sufficiency: "独立与自给自足"
 JAP_independence_and_self_sufficiency_desc: "尽管日本经济蒸蒸日上，我国却非常缺乏自然资源，只能从外国购买。对进口的依赖不仅是对日本经济的不公平限制，倘若日本与西方市场联系中断，还会危机我国战争实力。我们只能自力更生，进一步开展资源开采项目，并对出口资源征收关税，最终实现自给自足。"
 JAP_banking_and_agriculture_control: "银行业与农业控制"
 JAP_banking_and_agriculture_control_desc: "对银行业和农业等行业的私有化都是危及日本经济政治主权的西方毒瘤。为扫清遍布各地的自由主义影响，政府必须实行大米专卖，并对银行和保险公司采取严厉管制措施。这些虫豸的利益必须完全服务于国家利益，而不是干戈倒持。"
 JAP_cabinet_information_committee: "内阁情报委员会"
 JAP_cabinet_information_committee_desc: "通过对媒体的直接控制，我们能够确保国民认识并参与到政府的计划之中。"
 JAP_ennoble_the_national_spirit: "崇高化民族精神"
 JAP_ennoble_the_national_spirit_desc: "世界不论过去和现在都充满了竞争，一场规模庞大的总力战迫在眉睫，所有国家都要争夺胜利。只有那些即便在最艰难时刻仍拥有强大斗争精神和鸿鹄之志的民族才有生存的权利。作为一个适合生存的民族，我们将奋战到底，在一场狂热的达尔文主义生存斗争中让日本攀上巅峰！"
 JAP_national_rd_institutes: "国立研究开发机关"
 JAP_national_rd_institutes_desc: "通过投资国立研究开发机关，我们可以更为轻松地让各个独立的研究团队协力工作，从而提高我国的研究产出，允许政府更好地指导国家的科研发展方向。"
 JAP_narrow_gauge_railways: "标准化铁道"
 JAP_narrow_gauge_railways_desc: "我们的窄轨铁路虽便于施工，但却阻碍了工业发展。时不我待，日本尤然。"
 JAP_prioritise_military_oil: "军用石油优先"
 JAP_prioritise_military_oil_desc: "由于国家处于战争状态，石油变得空前重要、虽然石油在许多民事用途上有大用，但是它理应优先用于我们的军队。因此，我们必须把石油优先交付给军队使用。"
 JAP_land_reform_focus: "农地改革"
 JAP_land_reform_focus_desc: "日本的土地利用率非常低。虽然在具体方针上众口不一，但几乎所有派系都同意必须采取行动。如果我们想充分展现经济实力，就必须解决这个问题。"
 JAP_support_the_zaibatsu: "支持财阀"
 JAP_support_the_zaibatsu_desc: "在过去几十年里，财阀积累了巨大的政治和经济力量。我们认为与财阀合作符合我国的最佳利益。"
 JAP_finance_factory_projects: "注资工厂项目"
 JAP_finance_factory_projects_desc: "一些财阀要求国家协助他们在本土列岛各地修筑工厂。这将创造许多工作机会，并帮助解决经济危机。"
 JAP_raw_materials_excavation_endeavours: "原材料挖掘事业"
 JAP_raw_materials_excavation_endeavours_desc: "一批财阀已同我们联络，请求我们资助他们的自然资源勘探项目。如果我们资助他们，必然能为我们带来急需的稀有资源。"
 JAP_foster_technological_innovation: "促进技术创新"
 JAP_foster_technological_innovation_desc: "国立基金在极大程度上能保障各财阀的科学家们能集中全力推动日本前进，并能让政府在科研优先权方面有更高的话语权。"
 JAP_the_central_railroad_plan: "中央铁道计划"
 JAP_the_central_railroad_plan_desc: "中央铁道计划是在日本本岛建设一系列现代化的新干线，推动我们建设高效多产的社会。然而，由于缺乏资金和专业知识，该项目已经推迟了数年。幸运的是，财阀愿意帮助我们。而在他们的支持下，这个悬而未决的项目终于可以完成了。"
 JAP_build_new_aircraft_facilities: "建造新的飞机工厂"
 JAP_build_new_aircraft_facilities_desc: "航空工业是国防的重要组成部分，战争的胜负很可能就在空中决出，我们的工业必须足以给我们的飞行员提供大量高质量的国产飞机。建设新的飞机制造厂可确保我们能满足未来几年不断增长的需求。"
 JAP_invest_in_heavy_industry: "投资重工业"
 JAP_invest_in_heavy_industry_desc: "为了使日本的经济保持竞争力，我们有必要进一步投资大型工业项目，之后这些项目还能够反哺我国的国防建设。"
 JAP_riken_north: "北方理研"
 JAP_riken_north_desc: "北方理研是即将建立的“二号研究”核心设施的代号，坐落于福岛县辖区内。\n“二号研究”是我国在原子研究领域所做的最高机密级别工作，其目标是用热扩散法分裂铀235。\n该项目的其他设施位于东京的理化学研究所和朝鲜北部的兴南。"
 JAP_rocket_science: "火箭科学"
 JAP_rocket_science_desc: "发展火箭不仅可以提供火箭武器，据科学家们推测，火箭引擎还能被用于高速移动。"
 JAP_colonial_incentives: "刺激殖民"
 JAP_colonial_incentives_desc: "为了拯救我们垂死的农业并发展经济，必须投资殖民项目。帝国即是日本的未来。"
 JAP_bureaucratic_economy: "官僚经济"
 JAP_bureaucratic_economy_desc: "政府决定改革经济，设立一个官僚体系来调控经济。该体制将限制财阀的势力，造福国家。"
 JAP_rapid_industrialisation: "迅速扩军"
 JAP_rapid_industrialisation_desc: "虽然我们的经济正在增长而且我们避免了黑色星期一的绝大多数影响，但我们的兵工产量仍然未发挥出全部潜力。建设一批专门设计为兵工服务的工厂，我们将极大地促进我们的军工生产。"
 JAP_regulating_the_automotive_industry: "调控汽车产业"
 JAP_regulating_the_automotive_industry_desc: "在本世纪二三十年代，日本国内汽车产业规模太小，无法参与全球竞争。为了弥补这一点，并使国内企业能够与更大规模的西方同行竞争，我们可以强制我们的众多小型汽车公司合并为几家大企业。"
 JAP_reorganise_resource_extraction: "重组资源勘采"
 JAP_reorganise_resource_extraction_desc: "随着全球紧张不断升温，高效迅速地开采资源对我们来说变得至关重要。为实现这一目的，那些参与开采资源的企业将被置于更为庞大的官僚机构监督下，并将在政府指导下被动进行结构重组。"
 JAP_the_shinkansen_proposal: "新干线提案"
 JAP_the_shinkansen_proposal_desc: "是时候颁布新干线提案了；营建互通有无的高速铁路，让崭新的蒸汽机车和电力机车运转起来。这些线路将能够以前所未有的速度运送乘客和货物。"
 JAP_revise_imperial_defence_policy: "修改帝国国防政策"
 JAP_revise_imperial_defence_policy_desc: "弱肉强食，或者说“适者生存”是我们对军事哲学的基本理解。西方帝国主义者已大大扩充了他们海空军，如果我们不迎头赶上，无疑就会沦为他们的手下败将。而军队中的派系斗争未曾停歇，因此我们的武装部队无法充分发挥其潜力。故而，决定我们的学说方向至关重要。"
 JAP_long_war_doctrine: "长期战争学说"
 JAP_long_war_doctrine_desc: "长期战争学说的支持者认为，如果日本要在国家间的斗争中坚持到底，则必须为一场规模可能比上一次更大的总力战做好准备。为此，我们必须建立一个强大的工业基地，为我们的士兵配备新式武器，并让国民为迫近的风暴做好准备。"
 JAP_short_war_doctrine: "短期战争学说"
 JAP_short_war_doctrine_desc: "考虑到日本工业基础薄弱、资源匮乏及我们在亚洲的位置，短期战争学说的倡导者认为，日本应该效仿此前的日俄战争和中日战争的模式，准备好投身于一场速战速决的冲突，为此，我国需要建立一支能够在战争初期就造成毁灭性打击的庞大常备军。"
 JAP_phase_out_arisakas: "逐步淘汰有坂步枪"
 JAP_phase_out_arisakas_desc: "我国现今大量列装的有坂步枪在过去几十年都坚实可靠，但却在一定程度上因为其枪栓设计而落后于现在最新的战争发展趋势。为此，我们需要将武备升级换代为更强力、更高效的半自动步枪。这样一来，我国的军队才能经受住时代的磨练，甚至战胜先进的西式军队。"
 JAP_agile_and_indomitable: "轻便耐用"
 JAP_agile_and_indomitable_desc: "要是没有他们可靠的榴弹炮打出的各种炮弹，我们的步兵就会一事无成。因此，我们决不能让难以运输的庞大火炮减缓步兵的进军，也不能让火炮的操作过于复杂。我们要设计一款轻便、耐用的火炮，同时保持其装填威力大、破坏力强炮弹的能力，扫清步兵在突破敌军防线时的多余问题。"
 JAP_supremacy_of_logistics: "后勤至上"
 JAP_supremacy_of_logistics_desc: "要在东亚的多条战线上维持庞大的武装部队，我们必须在后勤装备和训练方面走在前列。如果我们的步兵中队没有配备最新的支援装备，我们就会让勇敢的日本人毫无意义地死去。我们的海兵队需要最先进的医疗技术、后勤训练以及侦察支持，这样才能确保每次登陆都能为日本带来胜利！"
 JAP_backbone_of_the_army: "军队中坚"
 JAP_backbone_of_the_army_desc: "步兵是任何现代军队的基石，要是我们的步兵面对敌人时畏缩不前，我国征服亚洲的计划便没有任何实现的可能。因此，我们必须加强军队，每个士兵不仅要拿到我们手头最好的装备，还要充满摧毁日本之敌的勇气。没有一支精英地面部队撑腰，我们拿什么自称为东亚的霸主？"
 JAP_armoured_experiments: "装甲试验"
 JAP_armoured_experiments_desc: "第一次世界大战末，欧洲各国使用了一些粗制装甲车。受此启发，我们产生了设计一款国产坦克的想法。陆军技术局设计了一款坦克，能在高速行进的同时抵挡轻型火力的攻击。这些装甲部队将在不久后的对华战争中大展拳脚！"
 JAP_retention_of_mobility: "维持机动"
 JAP_retention_of_mobility_desc: "尽管与亚洲其他国家相比，我军并不缺乏纯粹火力或技术优势，但这些都不是取得战争胜利的唯一因素。一支能高速机动的部队也同等重要，在广阔的中国平原上，这将让我们在决定性战役中取胜。"
 JAP_coordinate_intelligence_services: "协调情报部门"
 JAP_coordinate_intelligence_services_desc: "我方情报机构如今过于混乱，不仅被划分为文职部、陆军部和海军部，还经常被作战指挥部忽视。我们必须加强跨军种合作，这样情报行动的珍贵成果才能在战场上发挥作用。"
 JAP_f_agency: "F厅"
 JAP_f_agency_desc: "我军很有可能马上要被派往热带地区作战。该地区复杂艰苦的地形给军事行动带来了不少麻烦，但若我们能抢在敌人前面掌握这种作战方式，那可能也是个好机会。"
 JAP_expand_the_kenpeitai: "扩大宪兵队"
 JAP_expand_the_kenpeitai_desc: "随着帝国扩张，反抗我国德政的非法异见分子也愈发嚣张。一段时间以来，宪兵队在镇压国内异议并进行间谍和反间谍工作方面表现良好，继续为其招募人手是唯一正确的做法。"
 JAP_strengthen_the_ijaas: "加强陆军航空部队"
 JAP_strengthen_the_ijaas_desc: "飞机早已不再是简单的侦察或骚扰工具。通过将其完全整合到我们陆军的行动中，空军有能力造成大量破坏并推进我们的行动发展，就像普通的陆军单位一样。"
 JAP_intensive_pilot_training: "飞行员强度训练"
 JAP_intensive_pilot_training_desc: "日本飞行员的训练是世界上最严苛的训练之一，但这么做是有充分理由的。我们的飞机速度很快，地勤人员训练有素，指挥人员也很聪明，但这些都比不过飞行员本身的勇气与天赋。"
 JAP_open_new_flight_schools: "开设新飞行学校"
 JAP_open_new_flight_schools_desc: "空战不仅要求飞行员有高素质，还要有足够的数量。我们将开办更多新学校，为帝国陆军航空部队培训人员。这不仅是为了增加空军规模，也是为了获取实践经验以增进对空战的认识。"
 JAP_found_teishindan: "建立挺进团"
 JAP_found_teishindan_desc: "试验已经证明了向敌军阵线后方投送空降部队的可行性和有效性。其他国家已开始组建伞兵部队，我们为什么不组建自己的伞兵呢？挺进团将成为一支新式特种部队，执行垂直包围并占领关键目标的任务。"
 JAP_plan_edit_1: "[GetPlanEditOne]"
 JAP_plan_edit_1_desc: "[GetPlanEditOneDesc]"
 JAP_plan_edit_2: "[GetPlanEditTwo]"
 JAP_plan_edit_2_desc: "[GetPlanEditTwoDesc]"
 JAP_plan_edit_3: "[GetPlanEditThree]"
 JAP_plan_edit_3_desc: "[GetPlanEditThreeDesc]"
 JAP_ideological_indoctrination: "意识形态灌输"
 JAP_ideological_indoctrination_desc: "日本士兵与其他国家的士兵有何不同？这就在于他们的战斗意志、对国家和天皇陛下的献身精神和拒不投降的决心，与其懦弱的对手截然不同。悍不畏死的士兵无往不胜！日本也无往不胜！"
 JAP_new_field_manuals: "新野战手册"
 JAP_new_field_manuals_desc: "我们目前的野战手册根本不匹配快速发展的现代战争标准，因此有必要对其进行更新，以保持我们的作战效率。"
 JAP_logistics_corps: "辎重队"
 JAP_logistics_corps_desc: "陆军负责后勤工作（包括保障必需的补给、维护、通信等工作）的军种将帮助我军克服艰难环境，尤其是亚洲那些较为不利的地形。"
 JAP_envolepment_tactics: "包围战术"
 JAP_envolepment_tactics_desc: "若要说我们从世界大战中汲取了什么教训的话，那便是单纯的正面进攻很少能产生决定性作用。突破敌军侧翼并从后方发动攻击要好得多，能用我军更少的损失给敌军造成极大混乱。"
 JAP_expand_the_engineer_corps: "扩大陆军工兵队"
 JAP_expand_the_engineer_corps_desc: "顾及我们面临的作战环境复杂多样，以及亚洲各地普遍缺乏基建，设立一支专门的工兵队对我军各部队来说会非常有用。我们将在此事上投入资金。"
 JAP_update_the_imperial_war_college: "陆军大学校升级"
 JAP_update_the_imperial_war_college_desc: "陆军大学校（简称陆大）起初受到普鲁士参谋学院启发，为我国培养出顶尖的军官队伍，但五十年来其教学技术几乎没有改变。是时候让这个受人尊敬的机构升级，使其达到现代标准了。"
 JAP_start_the_third_circle_plan: "开始丸三计划"
 JAP_start_the_third_circle_plan_desc: "鉴于我国无法同敌人打持久战，我们唯一的选择就是继续目前的海军建设，集中精力在一场海上决战中打垮敌军。"
 JAP_expand_the_snlf: "扩编特别陆战队"
 JAP_expand_the_snlf_desc: "海军特别陆战队（即大日本帝国海军的陆战队）是未来战争中的关键力量——有了他们，我们将能在中国沿海和东印度群岛展开登陆行动。"
 JAP_pacific_defence_zone: "太平洋防卫区"
 JAP_pacific_defence_zone_desc: "日本在太平洋地区投送力量的能力从未达到我们的预期，但在最近的冲突中，我们还是确保了对太平洋的控制。通过着力强化海域中各个海军基地，我们也能保护本土不受任何势力侵犯。"
 JAP_reexamine_naval_doctrine: "重审海军学说"
 JAP_reexamine_naval_doctrine_desc: "20年前我们就认识到，以决战赢取下一场战争的想法愚不可及，那会是一场仰仗资源、工业的消耗战。我们必须改变旧观念，墨守成规只会把我们全部害死。"
 JAP_maintain_kantai_kessen: "维持舰队决战"
 JAP_maintain_kantai_kessen_desc: "同欧米的假想敌相比，我国造船业和工业的产能显得相对有限。但我国的设计师与工程师各方各面都比他们优秀。我们的一艘船抵得上他们的十二艘船！"
 JAP_experimental_division: "实验部门"
 JAP_experimental_division_desc: "日本舰队固然强大，但仍不能与美国或德国舰队相提并论。若想在太平洋地区占得上风，我们就得继续在科研发展领域投资，因为打赢海战靠的是独到战术和创新思维，而不是纯粹的火力。"
 JAP_improve_the_long_lance: "改进九三式鱼雷"
 JAP_improve_the_long_lance_desc: "鱼雷虽小，却极为致命；即使最为强大的战列舰也难以幸免，可悲的俄罗斯海军在对马海战中的遭遇便是明证。不过，当下的舰船可比三十年前要大得多，所以我们应当努力增大我们的鱼雷口径。"
 JAP_refit_old_ships: "改装旧式舰艇"
 JAP_refit_old_ships_desc: "虽然日本海军在数量上跻身全球前列，但其中有许多船只已经跟不上时代，在未来的战争中很难发挥作用。鉴于我国缺乏从头建造新舰的资源，我们应该在旧舰只基础上进行改造，给予它们适当的装备，让它们几近与新船相媲美。"
 JAP_revise_kantai_kessen: "修改舰队决战"
 JAP_revise_kantai_kessen_desc: "我国目前保有的舰队同我军的最新学说对不上号。其小型舰艇数量未到达应付一系列新任务之所需。若想解决问题，我们只有一种办法：采用一种标准化的、制造简便的模块化舰船设计，并在此基础上大建。"
 JAP_expand_shipping_capacity: "增强航运能力"
 JAP_expand_shipping_capacity_desc: "也许战舰更加引人注目，但在维持战争这方面，商船的重要性也不输战舰。尤其是对于日本这个岛国来说，资源进口、海外派遣军补给都要依赖海运。"
 JAP_start_the_fourth_circle_plan: "[GetMaruKeikaku]"
 JAP_start_the_fourth_circle_plan_desc: "第四次海军军备充实计划(第四次海軍軍備充実計画)，或称丸四计划(④計画)，是海军省最新出台的海军扩军计划。其时间跨度长达六年，预算高达十几亿日元，预计将建造数十艘各型船只。"
 JAP_expand_personnel_reserves: "扩充预备海员"
 JAP_expand_personnel_reserves_desc: "一个常被忽视的事实是，海军也需要人力，就像陆军一样。只有扩大预备海员的规模，我们才能迅速补充损失。"
 JAP_scrap_and_build_program: "报废与大建项目"
 JAP_scrap_and_build_program_desc: "虽然我国海军规模庞大，但实力的衡量标准并不仅仅是吨位。海军的许多船只都已经过时，无法与现代军舰相抗衡，我们要报废这些老船，然后将其回收利用，建造跟得上最新海军科技的替代品。"
 JAP_naval_wargames: "海军演习"
 JAP_naval_wargames_desc: "研究表明，军事演习作用巨大，它可以在平常时期训练军官，还可以预测未来军事行动的结果和效能。制订战争计划是，这种演习是不可或缺的。"
 JAP_destroyer_development: "发展驱逐舰"
 JAP_destroyer_development_desc: "“驱逐舰”得名于其最初的用途：驱逐、摧毁地方的鱼雷艇。但是，现代的驱逐舰已经与初衷大不一样，是反潜战中必不可少的兵器。未来的驱逐舰只会体型更大、速度更快，我们必须跟上这个潮流。"
 JAP_floating_fortresses: "浮动要塞"
 JAP_floating_fortresses_desc: "众所周知，海军航空兵已经成为现代海战的决定性因素，作为航空兵载体的空母就尤为重要，能够帮助皇国布武太平洋。因此，必须增加空母的部署数量。"
 JAP_diversify_submarine_models: "多样化潜艇型号"
 JAP_diversify_submarine_models_desc: "无论是在舰队之间的战斗、商船掠袭，甚至是补给输送中，潜水舰都有不可替代的作用。鉴于其用途多种多样，我们也要大量生产多种多样的潜水舰。"
 JAP_leviathans_of_the_pacific: "太平洋利维坦"
 JAP_leviathans_of_the_pacific_desc: "虽然空母正在崛起，但战列舰仍是帝国海军的骄傲，它们是海上最大、最坚固、最强的战舰，是皇国之力的象征。如今有了技术更为先进的战列舰，海军就可以击灭一切胆敢挑战帝国的敌人。"
 JAP_cruiser_innovation_efforts: "巡洋舰创新"
 JAP_cruiser_innovation_efforts_desc: "为了让海上巨兽战列舰能有效对抗敌人，我们必须给予其足够的屏卫力量，投资中轻型巡洋舰的发展，维护帝国海军在太平洋的霸权。"
 JAP_naval_aviation_department: "海军航空部"
 JAP_naval_aviation_department_desc: "没有飞机的航空母舰就是一口漂浮的铁棺材。我们必须保证我们的航空母舰能一直配备最好的飞机和飞行员。"
 JAP_the_zero: "零式战斗机"
 JAP_the_zero_desc: "在三菱飞机公司的努力下，我们设计出一款陆基海基两用的新式战机——零战，它将成为这个时代的巅峰舰战。"
 JAP_plan_edit_name_1: "陆军改进"
 JAP_plan_edit_name_1_desc: "军队中的传统派支持扩充常备军规模，但改革派则认为应当建立三角师团，以便我们在战场上有更好的作战效能。只有时间才能证明哪个计划能奏效。"
 JAP_plan_edit_name_2: "为战争准备"
 JAP_plan_edit_name_2_desc: "陆军中的传统派呼吁制订广泛的战争计划，了解未来战区的地理信息，收集敌军的情报；而改革派希望重金投资科技，取得对敌技术优势。"
 JAP_plan_edit_name_3: "动员行动"
 JAP_plan_edit_name_3_desc: "军队中的改革派指出，大规模的全国动员是日本在冲突中屡战屡胜的绝招，而传统派则指出，强调道德优越性和帝国军人必须履行的神圣职责，这样才能经受住日后战争的考验。"
 JAP_expand_the_army: "扩充常备军"
 JAP_expand_the_army_desc: "规模并不是一切，但根本来说数量优势具有多个优点：减少惨败损失期望、维持广泛的专业部队，并在亚洲各地部署军队。"
 JAP_war_plan_expansions: "广泛战争计划"
 JAP_war_plan_expansions_desc: "要给敌人致命一击，就要了解敌方领土的地形、收集敌人的情报，然后才能确定攻击点。从中国的平原到缅甸的森林，清楚自然屏障的重要性是我军胜利的关键。"
 JAP_extensive_planning: "精神动员"
 JAP_extensive_planning_desc: "战争的胜利不仅来自海陆空各战场的激战，还来源于永不放弃的精神。赢得战争一方的军人，都有继续推进的力量，第一次总攻开始之时，皇国士兵就应该明白他们在为什么而战。"
 JAP_the_four_year_plan: "建立三角师团"
 JAP_the_four_year_plan_desc: "三角师团，又称三单位制师团(3単位制師団)，它比方块师团更小，不会有方块师团那么严重的指挥和操纵问题。虽然每个师团的人数少了，但其机动性更强，能够携带更强的火力。我们该改换编制了。"
 JAP_scientific_war_planning: "科学战争计划"
 JAP_scientific_war_planning_desc: "日本在自然资源和经济净产出上的劣势可以通过强调科技的重要性来弥补。只有在科技上超越我国在亚洲的对手，才能克服我国在自然禀赋方面的缺陷。"
 JAP_national_mobilisation: "国民动员"
 JAP_national_mobilisation_desc: "战争的胜利不仅来自海陆空各战场的激战，还来源于能够真正动员起全体国民投入到战争之中的人。一万万国民正翼赞歌颂日本将亚洲从西方列强手中解放出来的圣战，他们团结一致，无不期盼着最终胜利的到来。"
 JAP_revise_the_third_circle_plan: "修改丸三计划"
 JAP_revise_the_fourth_circle_plan: "开始丸四计划"
 JAP_third_naval_armaments_idea_no_mtg: "第三次海军军备补充计划"
 JAP_naval_innovation: "海军革新司"
 JAP_the_long_lance_idea: "九三式鱼雷"
 JAP_naval_aviation_breakthroughs: "海军航空突破"
 JAP_quality_shipbuilding: "高质量造船"
 JAP_mass_shipbuilding: "大规模造船"
 JAP_naval_personnel_expansion: "海员扩充"
 JAP_rising_sun: "八纮一宇"
 JAP_rising_sun_desc: "日本在当今世界舞台的位置在军事学者与理论家间争论已久，不过大家都同意一点：世界应该归于日本统治。"
 JAP_nanshin_ron: "南进论"
 JAP_nanshin_ron_desc: "尽管军势日盛，但皇国的一大战略弱点便是对外国石油的依赖。为了寻求自立并确保在对抗不断入侵的西方帝国主义时的战略安全，夺取这些资源并由此扩大我们的安全区，如此决策难道不明智而正确吗？"
 JAP_extend_pacific_security_zone: "扩大太平洋安全区"
 JAP_extend_pacific_security_zone_desc: "随着美国陷入混乱，我们不能坐失良机。一个建立太平洋安全区的提案已经被制定出来，这将让我们把我们的影响力和保护范围扩展到美国遥远的太平洋领地——目前该提案已经进入了缜密的讨论阶段。"
 JAP_hawaii: "夺取美属太平洋领土"
 JAP_hawaii_desc: "既然他们在太平洋的地位已经大不如前，那我们可以采取行动吞并夏威夷和太平洋上的美国岛屿，并为我们的帝国建立起一道不可逾越的警戒线。"
 JAP_target_east_indies: "目标：东印度"
 JAP_target_east_indies_desc: "几个世纪以来，东印度群岛都处于尼德兰殖民者的高压统治之下，当地丰富的资源都流入了欧洲人的口袋。现在是时候让我们终结这种不公正的行为了。我们将解放这片地区，把这些宝贵的资源交还给他真正的主人：共荣圈！"
 JAP_philippines: "让菲律宾屈服！"
 JAP_philippines_desc: "美国内战爆发后，其在太平洋地区的军力投射水平一泻千里，令其前殖民地菲律宾陷入了举目无援的境地。我们固然希望这个新生的共和国能与我们和平地建立盟约，但菲律宾政府却愚蠢地拒绝了我们的提议。不幸的是，他们的战略位置和海军基地实在是宝贵到令人无法忽视，因此我们不得不以武力将他们纳入共荣圈。"
 JAP_claim_colonies: "创设南洋领"
 JAP_claim_colonies_desc: "每个太平洋上的岛礁，若不由皇国控制，都有可能成为入侵我神州本岛的战略跳板。德国人绝对无权占有这些岛屿，故而这些岛屿理应由我们掌控。首先，我们要将我们对南洋领的声索正当化。然后，我们将利用这些声索，把南洋领并入我大日本帝国。届时，若外交手段受阻，德国人就得见识大日本帝国海军的厉害。"
 JAP_ultimatum: "对殖民地最后通牒"
 JAP_ultimatum_desc: "方今面对世界的大变动，我们必须利用时机宣称我们在亚洲和太平洋的主宰地位：我们必须索要一切[GER.GetAdjective]位于东南亚和太平洋的领地以及他们位于中国境内的所有租界。他们若敢不满足我们的要求，那么就只有战争！"
 JAP_target_indochina: "目标：印度支那"
 JAP_target_indochina_desc: "一个独立自主的印度支那不符合我们在这一地区的战略规划。我们必须尽快控制这一地区。"
 JAP_target_siam: "让暹罗屈服！"
 JAP_target_siam_desc: "我们一度寄希望于暹罗人会服从于我们的联盟，但是事实让我们失望了。看来我们必须用武力让他们服从。"
 JAP_new_order_in_east_asia: "东亚新秩序"
 JAP_new_order_in_east_asia_desc: "鉴于黑龙江对岸的露国不再是威胁，而米畜陷入了内乱，当下正是实现皇国天命之时。中国贫弱、腐败而分裂，必须借日本的指导迈入现代社会。如果中国人不同意，那就让他们明白反抗的下场！"
 JAP_mantetsu_projects: "满铁项目"
 JAP_mantetsu_projects_desc: "满铁代表我们管理满洲和朝鲜地区的铁路，并因此深入参与了中国东北的经济。随着我们的影响力扩展到中国沿海和内陆地区，他们肯定会提出越来越野心勃勃的项目来开发这些土地。"
 JAP_support_allies: "支持军阀盟友"
 JAP_support_allies_desc: "许多中国军阀都向日本低下了头，以求得日本人撑腰——正如老帅张作霖一样。我们应该满足他们的愿望，确保他们成为我们在中国的代理人。"
 JAP_five_races_under_the_sun: "旭日之下五族不和"
 JAP_five_races_under_the_sun_desc: "虽然许多中国军阀都挂着五色旗，但事实是，汉族数个世纪以来一直压制着中国其他四大族。我们将在日本的指导下帮助这些受尽欺辱的民族，并无视我们代理人的意见而更彻底地分裂中国。"
 JAP_national_mobilisation_law: "国家动员法"
 JAP_national_mobilisation_law_desc: "在中国进行的战争注定是一项宏大的事业，他将让我国的负担达到极限。我们必须保证人民能够一亿一心尽忠报国，担负得起这场大规模战争的负担。"
 JAP_peace_and_reconstruction: "和平与重建"
 JAP_peace_and_reconstruction_desc: "皇军成功占领了中国的两大古都，长达数年的军阀统治即将到头，但却没结束。讽刺的是，军阀们所声称的努力，却是阻碍我们将全中国重新一统的奋斗。若要一劳永逸地结束这场冲突，关键就是促进和平、和解与重建——这才是真正值得为之奋斗的理想。"
 JAP_peace_and_reconstruction_tt: "这些决议将削弱正在与我们交战的中国各派系。"
 JAP_victory_with_vision: "唯一构想之胜利"
 JAP_victory_with_vision_desc: "无休止的消耗战对谁都没有好处。有人说，我们之所以与军阀开战，是出于某种崇高的信念，希望中国人民重新团结起来，实现泛亚共荣。他们错了：这是一场君临大东亚的圣战，我们将用这些来之不易的成果确保皇国的繁荣发展。"
 JAP_continental_warfare: "大陆作战"
 JAP_continental_warfare_desc: "一系列决战级别的战役已被起草命名为“一号作战”，其意在联合我们的各支部队，一劳永逸地碾碎中国人的抵抗。我们在这一点上下了很大的赌注，若是失败，我们的稳定肯定会大受影响——届时公众必然会认为我们已无望打赢这场战争。但是我们灭私奉公一致协力的将军们坚信我们能取得胜利！全軍突撃！天皇陛下萬歳！"
 JAP_the_fruits_of_loyalty: "忠诚的回报"
 JAP_the_fruits_of_loyalty_desc: "多年来，张作霖政府都是我们在中国大陆上的主要盟友，支持他统一中国是我们的目标，也是这场战争的起因。因此，我们有必要把他所主张的中国核心领土交还给他。"
 JAP_dismantle_legation_cities: "取缔使馆城市"
 JAP_dismantle_legation_cities_desc: "那些操控着[LEC.GetNameDef]自以为是的欧洲人竟敢把我们排除在所谓的工部局和权力中心之外。现在我们要让他们知道这种放肆行为的代价。"
 JAP_tokyo_conference: "召开东京会议"
 JAP_tokyo_conference_desc: "泛亚思想得到了一大批政治派系的广泛支持，无论如何来说都是一种有用的工具。通过在东京主办一次重要会议并邀请来自亚洲各地的外交官，我们可以鼓励亚洲国家之间的相互协作并打击西方帝国主义。"
 JAP_osaka_conference: "大阪经济局"
 JAP_osaka_conference_desc: "在我们的主要工业城市之一，历史悠久的贸易枢纽大阪，我们决意成立一个由亚洲各地人士组成的委员会。它的职责主要是负责大东亚共荣圈内各成员间的经济联系。通过在该领域投入资源，我们可以促进亚洲的自给自足及自信意识，并进一步扩大我们对他们的影响。"
 JAP_mission_to_india: "去往印度的使节"
 JAP_mission_to_india_desc: "[PRF.GetNameDefCap]已经准备好加入我方阵营了。他们有理由担心，位于边境上虎视眈眈的欧洲人和工团主义者会再次起到自己头上。一个比试图征服印度更好的办法是将印度交给一位拥护者统治，一个能被我们“栽培”的盟友。"
 JAP_target_india: "目标：印度"
 JAP_target_india_desc: "印度是一个羽翼未丰的强权，如果让它在我们的控制之外太久，足够多的人力会让印度有可能颠覆世界格局。我们必须尽快行动起来，让他们臣服于我。"
 JAP_isolate_australasia: "孤立澳大拉西亚"
 JAP_isolate_australasia_desc: "共荣圈对太平洋贸易的控制十分强大，我们应当通过对帝国主义前哨站和欧洲殖民主义据点的“[AST.GetNameDefCap]”进行惩罚性制裁来宣示这一点。"
 JAP_integrate_asian_economies: "整合大亚洲经济"
 JAP_integrate_asian_economies_desc: "经济实力决定一切，有了对亚洲无可争议的控制权，我们可以继续推动始于大阪的进程：让大东亚的经济更紧密的和我国经济联合起来，让他们服从于我们的意志。"
 JAP_final_victory: "宣告击灭帝国主义"
 JAP_final_victory_desc: "终于，胜利在握！现在日本是东亚地区毫无疑问的霸主！我们打倒了我们的宿敌，把欧洲人从我们的地盘上赶回了他们的老家。本土列岛将成为亚洲经济的活力中心。一夫动怒，世界颤抖！"
 JAP_prosperity_ships: "繁荣之船"
 JAP_prosperity_ships_desc: "我国在造船时已经使用了一系列特定的船只模块。但鉴于现在我们对货船的需求比过去任何时代都要高，我国聪明的工程师提出，让工厂流水线以模块化制造的方式直接装配好一整条船。"
 JAP_copro_development_plan: "共荣圈海军发展计划"
 JAP_copro_development_plan_desc: "我国绝大多数盟友的造船能力都令人捧腹。尽管他们的工人绝对比不上日本劳工的精神，但我们必须支持他们的海军建设能力，因为在下一场战争中，每艘船只都至关重要。"
 JAP_naval_engineering_assistance: "海军工程援助"
 JAP_naval_engineering_assistance_desc: "海军工程援助计划的目标十分简单明了：让我们的各个盟友能制造的不仅仅是货船。"
 JAP_unified_production: "统一生产"
 JAP_unified_production_desc: "现在我方盟国的造船业也已起步，我们可以利用其造船能力，建设一支足以保障整个共荣圈的庞大舰队。"
 JAP_dawn_of_a_revolution: "革命之黎明"
 JAP_dawn_of_a_revolution_desc: "数千年来，天皇和幕府将军通过建立皇室权威统治着日本。如今随着革命到达日本本土，日本无产阶级打碎了锁链，新的黎明已然到来。"
 JAP_dismantle_the_tools_of_capitalism: "捣毁资本主义工具"
 JAP_purge_reactionaries: "清洗反动派"
 JAP_renounce_imperialism: "断绝帝国主义"
 JAP_restore_faith_in_the_civilian_government: "重建对文官政府的信心"
