 japan_legations_crisis_events.021.e: "西方人终于认清了现实。"
 japan_korean_events.001.t: "八月回忆"
 japan_korean_events.001.d: "亚洲为欧陆列强瓜分之时，日本孤军奋战抵御着帝国主义的浪潮。明治维新后，日本成为东方繁荣和进步的灯塔，肩负起不惜代价解放亚洲人民的使命。1895年，日本击败了腐朽的清朝，将朝鲜纳入自身的影响力范围，1910年8月29日，朝鲜纯宗“自愿”退位，半岛并入大日本帝国，尽管沐浴着浩荡皇恩，朝鲜民众却始终不愿臣服于东京的统治，反而一直抵制现代化的进程。\n\n1919年，这种抵抗达到顶峰：当年早前，朝鲜先王高宗去世，一些人认为他被毒杀，引发了整个半岛的大规模抗议，遭到日本当局镇压，成百上千人因此死去。这次事件促使大韩民国临时政府在上海成立，各路反抗日本的民兵组织也在满洲涌现，对当地日本驻军展开报复袭击，造成了一些伤亡。\n\n此后，朝鲜还发生过几次抗议：1926年朝鲜纯宗去世，引发了六·十运动；1929年，光州学生发起了独立运动，两次运动均被严厉镇压。20世纪20年代，社会主义在朝鲜蓬勃发展，但被日本的积极镇压所扼杀。\n\n被吞并二十余年后，朝鲜很大程度上已经臣服于日本的统治，审查有所放松，经济和政治都转而服从日本的利益，但独立的思潮仍在暗中涌动。"
 japan_korean_events.001.a: "无朝鲜，则帝国不完整。"
 japan_korean_events.002.t: "朝鲜的抵抗"
 japan_korean_events.002.d: "尽管在1910年，日本兵不血刃地吞并了朝鲜，但朝鲜在接下来的十年中仍不断反抗着日本的统治。许多朝鲜人流亡海外，大多数人都逃到了中国。在上海，流亡者成立了大韩民国临时政府。临时政府内各派系间水火不容，使得他们无法如愿发动革命，但仍组织了多支游击队，在这些年中发动了数次反日突袭。身为临时政府一员的金九创立了大韩民国爱国武装组织，该组织曾在1932年妄图刺杀裕仁天皇，同年，又用炸弹袭击了驻扎在上海的日本军队，制造了虹口公园爆炸案。\n\n在满洲地区，各地纷纷成立反叛组织，他们于1920年在凤梧洞和青山里伏击了一支日军分队并取得大捷。日本对此则以间岛惨案作为报复，在接下来的行动中，日本及奉天盟友几乎消灭了这一带的反抗运动。\n\n尽管如此，这些朝鲜流亡者仍砥砺前行。在[FROM.GetLeader]和其他中国领导人的支持下，朝鲜流亡者的队伍得以不断壮大。其中，规模最大的两个组织分别为大韩民国临时政府领导的韩国光复军，该军队得到了直隶政府支持，以及韩国义勇队，得到了国民党和中国工团党支持。每支队伍的人数至多只有寥寥数百，它们单打独斗对我们构不成威胁，但这些事件标志着我们同[FROM.GetNameDef]的关系正不断恶化。"
 japan_korean_events.002.a: "令人担忧。"
 japan_korean_events.003.t: "朝鲜农村状况"
 japan_korean_events.003.d: "日本政府最初吞并朝鲜时，曾希望日本移民迁居朝鲜，以充实当地已有的日本社群（其中多数为1894年甲午战争后移居者）。然而这一计划基本落空，此后数十年间，朝鲜族人口增速远超在朝日本移民，但日本人对乡村土地的所有权占比却从不足10%攀升至逾50%。\n\n首任朝鲜总督寺内正毅推行了土地改革，对普遍采取遥领地主制度的土地展开大规模检地。由于众多朝鲜地主对土地仅拥有口头耕作权，当土地调查局拒绝承认无书面凭证的所有权时，这便为日本方面（包括个人与企业）占有更多朝鲜土地提供了可乘之机。\n\n此举致使大量朝鲜地主与自耕农沦为佃农，而随着朝鲜农民被强征参与灌溉系统等强制劳役工程，民生愈发艰难。雪上加霜的是，此类工程常以向朝鲜乡村课以重税的方式筹资，这些税制在1918年米荒后经调整，转而服务于为日本本土生产粮食，朝鲜民众却几乎没有从中受益。\n\n时至今日，朝鲜城市经济地位已远超乡村，加之战时需求压力，政府正酝酿牺牲地主阶层（朝鲜地主与日本地主一样，经常向佃农索要半数以上收成作为地租）以强化农业统制。目前已有人提出成立中央农业协会，此举虽耗资巨大，却能让帝国更加深入地掌控朝鲜经济。"
 japan_korean_events.003.a: "我们必须对朝鲜农业施加更强的控制。"
 japan_korean_events.003.b: "我们绝不能打乱这一脆弱的格局。"
 japan_korean_events.004.t: "国家总动员法"
 japan_korean_events.004.d: "战争爆发后，日本国内出现了严重的劳动力短缺，政府被迫展开了一项大规模“招募”朝鲜劳工前往日本工作的计划。尽管最初声称自愿参与、并且朝鲜人相较其他国家的劳工待遇通常略好，但整体劳动环境仍艰苦且危险，约有近十分之一的朝鲜人因此丧生。被征募的劳工广受虐待，对女性劳工更甚，朝鲜民众对日本统治愈发不满。日本本土大量男性已被征召入伍，近期的工业项目加剧了用工短缺，朝鲜总督正式推行了对朝鲜劳工的征用制度，工人们被迫进入工厂和矿山劳动——甚至被送出朝鲜。"
 japan_korean_events.004.a: "帝国各部须精诚团结，求得胜利。"
 JAP_KOR_national_mobilisation_law_tt: "征召朝鲜劳工：$VALUE|=-%0$"
 japan_korean_events.005.t: "日本帝国陆军内的朝鲜士兵"
 japan_korean_events.005.d: "日本军队一直避免征募朝鲜人，在帝国陆军内服役的大多是朝鲜志愿兵。尽管这种“志愿性”到底如何尚存疑问，但许多朝鲜人视参军为社会晋升途径，因此竞争也相当激烈。\n\n这一现象在军官阶层中尤为明显，早在1910年日本吞并朝鲜前，许多朝鲜士官已经在日本陆军士官学校学习了。朝鲜前统治者、现已成为日本华族的李氏家族中，大量男性后裔就在日本帝国陆军中服役，包括亲王李键、李垠和李鍝。在日军中服役的著名朝鲜籍将军还有洪思翊、李应俊以及少将金锡源。\n\n而朝鲜籍普通士兵大多被安排在驻防岗位，很少被派往前线作战。值得一提的是关东军，他们在满洲组织朝鲜志愿者成立了用于镇压抵抗的“特设队”。是否征召朝鲜人一直极具争议，也很可能激化地方矛盾，但为了取得战争的胜利，扩大驻防部队或许是必要之举。"
 japan_korean_events.005.a: "我们应立即着手对朝鲜臣民进行登记。"
 japan_korean_events.005.b: "我可信不过朝鲜人！"
 JAP_KOR_conscription_resistance_tt: "征召朝鲜兵员：$VALUE|=-%0$"
 japan_korean_events.006.t: "朝鲜文化的命运"
 japan_korean_events.006.d: "日本对朝鲜的统治规划在多年间不断演变。1910年，吞并朝鲜仅一年后，日本政府便颁布了“关于朝鲜人姓名变更之事项”的法令，禁止朝鲜人取日式姓名。日本移民被鼓励迁往朝鲜并购置土地，但最终效果有限。随着新一轮同化政策的开展，日本政府发布了一项新的帝国敕令以促进文化同化——强制朝鲜人放弃其以宗族为基础的传统姓名体系，改用新的姓氏，在实际操作中，这些新姓氏往往是日式姓氏。同时，日本还大力推广日语与日本习俗，深化了对朝鲜半岛的经济控制。\n\n在过去几十年中，朝鲜文化逐步遭受日本侵蚀，包括景福宫王宫在内的历史建筑要么被破坏，要么改作他用。为了给统治正名，日本政府设立了朝鲜历史编修委员会，宣扬早在古代，日本便在朝鲜半岛设立了“任那日本府”作为殖民据点。他们还开展考古活动，收集各类历史资料，并通过立法保护重要文物。而争议也随之而来，大量文物被掳走转移至日本本土，同时又有部分外来文物流入朝鲜。许多日设博物馆也带有宣传性质——通过对比传统的朝鲜艺术与现代的日本艺术，借此突出日本统治的“进步性”。"
 japan_korean_events.006.a: "进步是有代价的。"
