 JAP_campaign_into_frontier: "对[FROM.GetNameDef]宣战"
 JAP_campaign_into_frontier_desc: "在中国取得胜利，并促成一个亲日政府加入我方势力范围后，如今我们可以将目光转向曾经强大的中华帝国的遥远边疆。过去，我们曾试图拉拢这些地区的各路分裂割据势力，但如今已无必要。我们的合作者叫嚣着要收复失地，如果[FROM.GetLeader]及其同僚不愿与我方和平共处，那么旭日终将深入西部边疆！"