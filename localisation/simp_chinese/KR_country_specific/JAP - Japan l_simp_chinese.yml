 JAP_bad_land: "猖獗的地主所有制"
 JAP_bad_land_desc: "在日本，土地利用的效率极低。大部分土地都被地主所占据，佃农只能通过租赁地主土地的方式来耕种，并且还要被收取高额的佃租。这严重限制了日本社会的发展，并且导致了农村的政治两极分化。大量的农民不得不背井离乡前往城市寻求生路。"
