 JAP_nippon_kokuminto: "日本国民党"
 JAP_nippon_kokuminto_long: "日本国民党(日本国民党)\n§L随着中国在第二次中日战争中取得了胜利，日本帝国的权威荡然无存，中国革命政府组建了以野坂参三为首的临时政府和政党，以管理日本本土，并将三民主义的理想带给日本的家家户户。新组建的日本国民党正寻求与中国保持良好的关系，同时也正努力树立并实现属于日本自己的民族、民权、民生三大理想，以此实现孙中山泛亚世界革命的愿景。§!\n"
 JAP_zantei_gunseifu: "暂定军政府"
 JAP_zantei_gunseifu_long: "暂定军政府(暫定軍政府)\n§L国家输掉了战争，帝国和军事当局轰然垮台，全面占领与投降随之而来，对于骄傲的日本人民来说，这令他们措手不及。现在，这个外来占领国成立了一个过渡军政府，以管理日本本土岛屿，并保障其从过去的君主国健康稳定地过渡到充满活力的亚洲新民主国家。§!\n"
