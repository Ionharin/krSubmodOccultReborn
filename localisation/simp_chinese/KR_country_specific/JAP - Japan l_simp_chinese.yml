 JAP_shared_modernisation_1_desc: "尽管在长期战争与短期战争学说的支持者之间存在着理论和策略差异，双方在几个基本观点上有所共识，例如需要陆军保卫早期胜利果实和获得的领土，迫使敌人和谈或建立防线应对强敌，以及格外强调进攻重要性，认为撤退不可接受。有这些共识存在，陆军将能稳步推进现代化建设。"
 JAP_tech_marine_bonus: "特别陆战队"
 JAP_short_war_cat: "大日本帝国武装部队"
 JAP_short_war_cat_desc: "自明治维新以来，我国的两大骄傲，大日本帝国陆军和海军，已成为两股强大的作战力量，不仅能保卫日本在亚洲大陆的利益，更能结合纯粹意志力和英明领导力战胜资源和人口占优的对手。\n\n但是，大战后的世界环境复杂多变，两军的未来正经历激烈讨论。陆军分为两派，一派希望国民能做好总力战的准备，久战久持，另一派希望日本能用一连串速战速决的战役结束一切的战争。海军则基于美国形势的改变仔细审视其对策。该情况由于军种间极其严重的对立变得愈发复杂，促使两军为了争取更多资金而策划不同的战备，阻碍了统一的国防政策的建立。但无论会发生什么，军队都必须为战争做好准备。"
