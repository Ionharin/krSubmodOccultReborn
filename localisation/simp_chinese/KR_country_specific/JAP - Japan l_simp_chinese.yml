 JAP_invest_timer: "在一年内已成为投资目标。"
 JAP_land_reform: "农地改革"
 JAP_land_reform_desc: "农地改革已经是日本政治持续近70年的议题了。我们并非第一批尝试解决这个问题的人，若是我们不够小心，那我们也将不会是最后一批。在此花费越多的精力和时间，我们的努力就越有可能取得成果，尽管我们随时都有终止这项计划的自由……\n\n目前我们的农地改革进度：[?JAP.JAP_land_reform_variable|H0]"
 JAP_land_reform_1: "初期农地改革"
 JAP_land_reform_1_desc: "《农地改革法》旨在限制地主的势力并为贫穷的农民提供土地。我们最初的计划将在未来4年内强制重新分配所有在外地主的土地。"
 JAP_land_reform_2: "接续农地改革"
 JAP_land_reform_2_desc: "我们扩大了《农地改革法》的规模：对个人所有的土地出台限制，对于超限土地进行重新分配，并给地主发放国债作为补偿。这将成为朝解决困扰我国几代人的农村贫困问题迈出的一大步。"
 JAP_land_reform_3: "扩大农地改革"
 JAP_land_reform_3_desc: "规模最大的《农地改革法》将赋予政府官员更大的权力去同反抗改革的人斗争。"
 JAP_land_adjustment: "土地区划整理法"
 JAP_land_adjustment_desc: "《土地区划整理法》将为承租人的权利建立法理基础。该法案将禁止地主在没有正当理由的情况下单方面取消或拒绝续约。"
 JAP_rent_control: "地代家赁统制令"
 JAP_rent_control_desc: "《地代家赁统制令》将允许地方当局实施租金控制，并授权地府官员在租金被证明过高的情况下进行干预。"
 JAP_agriculture_land_control: "农地统制法"
 JAP_agriculture_land_control_desc: "《农地统制法》规定用于非农业目的的农用土地流转或交易必须得到地方当局的批准。这使我们能够选择种植什么作物，从而保证主粮的高产。"
 JAP_finish_land_reform: "完成农地改革计划"
 JAP_finish_land_reform_desc: "我们将完成农地改革计划并看看结果如何……"
 JAP_develop_chosen_tungsten_mines: "扩建朝鲜钨矿"
 JAP_develop_chosen_tungsten_mines1_desc: "我们已经开始扩大[527.GetName]的钨矿，要在那里扩大矿井还需要一些时间和精力。"
 JAP_develop_chosen_tungsten_mines2_desc: "我们已经开始第二次扩大[527.GetName]的钨矿，要在那里扩大矿井还需要一些时间和精力。"
 JAP_develop_chosen_tungsten_mines3_desc: "我们已经开始第三次扩大[527.GetName]的钨矿，要在那里扩大矿井还需要一些时间和精力。"
 JAP_develop_chosen_tungsten_mines4_desc: "我们收到了[525.GetName]的勘探报告，据报告称该地新发现了数个新钨矿床，在我们验证这个报告的真实性的同时，我们也应该进行第四次扩大[527.GetName]的钨矿。"
 JAP_develop_chosen_tungsten_mines5_desc: "我们的探矿者已经从[525.GetName]回来了，并确认那里确实有一个大型的钨矿床，我们将立即着手开发这个新矿床，同时也要完成对[527.GetName]的矿井的扩建工作。"
 JAP_develop_chosen_tungsten_mines_tt: "§C我们每完成一级§Y挖掘技术§!的研究，便可以启用一次该决议。§!"
