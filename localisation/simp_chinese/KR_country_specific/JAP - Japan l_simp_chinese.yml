 JAP_KR_gathering_storm_desc: "旭日帝国在斯帕和会与《青岛协议》中接连蒙羞，崛起之路并非一帆风顺。1926年，持续的经济动荡最终导致了一次工团主义者对摄政王裕仁的刺杀，不稳定的政府在这年的大危机中不断地建立又垮台——首先是田中义一大将，然后是民主联合内阁，再然后是军队干涉中国东北。1936年的朝阳升起，日本帝国似乎正摩拳擦掌，准备扩张。眼看德国在世界上的主导地位出现下滑迹象，日本开始贪婪地注视着德国霸权笼罩的中国与德国在太平洋的属地……"
 JAP_country_intro_background: "GFX_JAP_intro"
 japan_domestic_events.2.t: "重选国会"
 japan_domestic_events.2.d: "1932年选出的前任帝国议会的四年任期到现在正式结束了，犬养毅首相宣布将会尽快举行一次新的大选。"
 japan_domestic_events.2.a: "好极了。"
 japan_domestic_events.3.t: "1936年大选"
 japan_domestic_events.3.d: "自1926年宪法恢复行使以及随后的政治重整以来，日本政界一直由两个主要政党把持着：保守主义的立宪政友会和自由主义的立宪民政党。\n\n政友会在1932年大选中赢得了绝对多数席位，但在乡村（他们传统的票仓），他们的支持度持续下降。由于政局愈发不利于执政党，在1927年以前名唤“宪政会”的民政党巩固了城市票仓，并开始向乡村地区扩展实力，希望能打破政友会对国会的长期绝对多数。在1936年大选中，另一个新崛起的党派是1933年由社民和工会分子成立的社会大众党。\n\n现在是时候看看政友会是否依然能够获得足够的席位来保持绝对多数……"
 japan_domestic_events.3.a: "政友会已经捍卫了他们的绝对多数！"
 japan_domestic_events.3.b: "政友会已经失去了他们的绝对多数！"
 japan_domestic_events.4.t: "片山潜被暗杀"
 japan_domestic_events.4.d: "生于1859年的片山潜是日本工团主义最老资格的领导人之一，被称为“日本工团主义之父”。早年间他因为参与社会民主运动而被驱逐出境，之后他前往美国，在那里他见证了约翰·里德的工团主义运动，也目睹了世界产业工人联合会一步步壮大。受到这些影响，片山潜在1926年宪法恢复之后返回日本，建立了日本第一个合法的工团主义党：日本劳动农民党(日本労働農民党)。该党在1932年被宣布为非法后，他又组织成立了社会大众党(社会大衆党)。\n\n昨天，片山潜到访京都祝贺社会大众党成员山本宣治当选时，三个右翼分子攻击了山本宣治的办公地，用棍子殴打了二人。山本宣治在袭击中幸存了下来，但是76岁的片山潜，因为抢救无效，在今天早些时候逝世。"
 japan_domestic_events.4.a: "这可不妙……"
 japan_domestic_events.5.t: "日本左派内部的摩擦"
 japan_domestic_events.5.d: "片山潜之死成功让社会大众党团结起来对抗“白色恐怖”，但左派的团结并不长久。社会大众党本质上只是一个由各路社会民主主义组织和工团主义组织结成的松散联盟，只是为了实现“建成以无产阶级为主体的社会化的经济基础”这一共同目标而团结到了一起。片山潜被害前，他曾引导社会大众党回避党内意识形态冲突；但如今他已去世，社会大众党不得不将党内的意识形态立场问题重新摆到台面上，很快党内内斗就开始了。\n\n在1936年春天，信奉国家工团主义的日劳系(日労系)采纳了极权主义理念，大力吸引成员：在党内，他们打压温和派的社民系(社民系)，从社民系处招揽成员；在党外，还大力从社民系控制的日本劳动总同盟(日本労働総同盟)处招揽成员。很快，日劳系和社民系之间便爆发了公开冲突。日劳系指责总同盟的运转被所谓“劳工官僚当权派”所掌握，而总同盟和社民系指责日劳系“骑劫工人组织，将组织掠为傀儡”。随后，日劳系的成员们被开除出了总同盟及社会大众党，如今这一集团已开始独立活动。"
 japan_domestic_events.5.a: "有趣的发展。"
 japan_domestic_events.6.t: "五·一五事件"
 japan_domestic_events.6.d: "首相被暗杀！11名和极权主义的“日劳系”有瓜葛的海军激进下级军官闯入首相官邸并开枪射杀了犬养毅首相。他们声称这是为了给片山潜复仇并为新潟迫害工人的“信浓川事件”伸张正义。这一事件使全国大受震惊，海军省因这一事件而蒙羞并对海军内部的激进活动进行彻查，预计不久之后就将召开军事审判。"
 japan_domestic_events.6.a: "任命铃木喜三郎接替犬养毅。"
 japan_domestic_events.7.t: "维新派和中心派"
 japan_domestic_events.7.d: "目前，日本政局动荡，当权派颟顸无能，维新派的火焰被重新点燃。桥本欣五郎中佐的樱会(桜会)一直是陆军中反建制派的温床，但近年来，荒木贞夫将军的皇道派(皇道派)成员数量也在猛烈增长。\n\n在激进下级军官的组织努力下，皇道派势头正劲。这些军官公开宣扬反资本主义、反寡头和反议会的意识形态，大多自幼家境贫寒，饱尝世态炎凉，自认因佞幸弄权而受尽人间疾苦——这导致他们坚信当权派已经架空了天皇陛下的权力，正将国家领入深渊。维新派为此提出的解决方案很简单：扫清天皇陛下身边掌权的小人，将大权重新奉还天皇，由此开展一场彻底的国民性改革。\n\n与他们针锋相对的是一群较为温和的陆军军官，他们用嘲笑的口气称之为“统制派(統制派)”。但即使是这群所谓“温和派”，也已经达到了爆发的临界点，最为反对皇道派的是一群同军队高层联系密切的军官，他们在主张同掌权派合作的同时，也开始认同政治再军事化的必要性。"
 japan_domestic_events.7.a: "又要下克上了吗？"
 japan_domestic_events.8.t: "安全讨论"
 japan_domestic_events.8.d: "过去数月间，帝国议会内的气氛日渐紧张，如今更是达到了一个令人恐惧的程度。许多议员担心自己被“国贼天诛”，故而如今在国会中想取得进展可不仅仅要靠政治权力或个人名誉，更要赌上生命才行。越来越多的人认为，时局弊病在于现行的安全法律无法保卫民主政治，故而我们需要更为强力的手段来捍卫民主。“五·一五事件”的悲剧决不能重演！"
 japan_domestic_events.8.a: "必须制定出一部综合性的法律法案！"
 japan_domestic_events.9.t: "国家保安法"
 japan_domestic_events.9.d: "由于1923年9月关东无政府主义者起义之后爆发的红色恐慌，以及同年12月工团主义者试图刺杀当时的皇储裕仁引发的波澜，1924年初，执政的田中内阁通过了臭名昭著的《治安维持法》。该法案极大地限制了民权，是田中义一大将独裁统治的象征之一。1926年田中政权垮台、宪法恢复行使之后，《治安维持法》随即被废除了。而现在，首相铃木喜三郎想要重新推行该法案——或者说已经经过些微调整，并重新命名为《国家保安法》，但连他自己的阁僚都对此表示强烈反对，国内的舆论对此的评价也已降到新低。然而铃木坚信，重新引入该法案是应对不断上升的工团主义威胁的必要手段，而且这也不单单是他一个人的看法。一个由政友会的中岛知久平和民政党的安达谦藏带领的跨党派议会联盟宣称，该法案通过后将会成为“宪政民主政府的最后一道保障”，并煽动党内人士支持其通过。贵族院和枢密院也赞成通过该法。"
 japan_domestic_events.9.a: "必须用一切手段捍卫民主，强推该法案通过。"
 japan_domestic_events.9.b: "凭良心讲，我们不能悖逆民意。"
 japan_domestic_events.10.t: "五·一五事件的审判"
 japan_domestic_events.10.d: "刺杀犬养毅首相的十一名主犯的军事法庭审判于上月开庭。在审判结束之前，一份由三十五万同情者署名的请愿书被送到法庭，恳求能够宽大处理这几位海军军官。除了请愿书，法院还收到了由十一位新潟县的年轻人寄来的求情书，他们请求代替十一位海军军官去死，并附上了十一截断指到法院表示他们的决心！因为整个审判不得人心，所以法院不得不加速审判进程，死刑判决是在昨天才发布的，而今天凌晨刺客就被行刑队枪决了。"
 japan_domestic_events.10.a: "这个国家疯了……"
 japan_domestic_events.11.t: "铃木喜三郎被刺杀"
 japan_domestic_events.11.d: "令人震惊的事情再次发生！铃木首相和他的姐夫鸠山一郎今天在川越出席一场党代会。当鸠山站起来发表开幕演讲时，来自“救国埼玉青年挺身队”的工团主义恐怖分子开枪刺杀铃木和鸠山，以报复对刺杀犬养毅首相的刺客的处决。铃木于今日晚些时候被确认抢救无效死亡。"
 japan_domestic_events.11.a: "愿逝者安息。(ご冥福をお祈りします。)"
 japan_domestic_events.12.t: "政府受到抨击"
 japan_domestic_events.12.d: "不出所料，《国家保安法》被议院否决后，首相遭到了强烈的反对。支持该法案的保守派人士和官僚们认为被铃木喜三郎出卖了。贵族院和枢密院对政府无力遏制工团主义浪潮感到失望，他们对本届内阁失去了耐心。"
 japan_domestic_events.12.a: "铃木的日子屈指可数了……"
 japan_domestic_events.13.t: "铃木喜三郎辞职"
 japan_domestic_events.13.d: "由于众叛亲离，在贵族院通过了一项弹劾现任内阁的动议后，首相铃木喜三郎被迫引咎辞职。由于支持率还算差强人意，前内务大臣水野炼太郎被任命为下任首相。但不妙的是，枢密院和它极其保守的院长平沼骐一郎男爵发表声明，声称“议会无能”并且需要用一个更为稳定的政治制度取而代之。看上去一场政治风暴又要爆发了。"
 japan_domestic_events.13.a: "呼吁召开紧急会议！"
 japan_domestic_events.14.t: "水野炼太郎当选"
 japan_domestic_events.14.dead: "铃木之死震惊了立宪政友会，他们立刻召开了紧急会议。官僚化的床次派（得名于床次竹二郎(1867-1935)，其人为田中义一独裁统治时期及之后余波期间支持田中政权的“政友本党”总裁）因痛失领导人而陷入瘫痪，这让秉持反动思潮的中岛派得以控制该党。在新任该党“总裁代行委员”后，中岛享有对全党的决策权；不过他没有加封自己为总裁，而是提名了与床次派结盟的水野炼太郎为首相。"
 japan_domestic_events.14.notdead: "铃木喜三郎辞职震惊了立宪政友会，他们立刻召开了紧急会议。官僚化的床次派（得名于床次竹二郎(1867-1935)，其人为田中义一独裁统治时期及之后余波期间支持田中政权的“政友本党”总裁）因群龙无首而陷入瘫痪，这让秉持反动思潮的中岛派得以控制该党。在新任该党“总裁代行委员”后，中岛享有对全党的决策权；不过他没有加封自己为总裁，而是提名了与床次派结盟的水野炼太郎为首相。"
 japan_domestic_events.14.a: "最终，政局稳定些了。"
 japan_domestic_events.15.t: "日本最长的夏天"
 japan_domestic_events.15.d: "日本政府现在实际上已近瘫痪，连续两个立宪政友会内阁的垮台严重削弱了新首相的权力，而平沼骐一郎公然摧毁议会制度的计划只会恶化局面，加剧政局的动荡。极端主义团体的实力日渐增长，军方对此也愈发沮丧。军队中的几名高级军官正在策划一场旨在推翻民选政府、“拯救”帝国的阴谋。他们中的几个现在找到了陆军大臣林铣十郎，希望获得他的支持……"
 japan_domestic_events.15.a: "日本的未来将取决于他的选择……"
 japan_domestic_events.16.t: "日本最长的一天"
 japan_domestic_events.16.d: "日本在这十年之间受够了所谓民主带来的耻辱，现在军队已经忍无可忍，通过一场政变，他们再次掌权，事实上，“无能的议会”已经被一个更“稳定”的制度所取代。极端保守的平沼骐一郎男爵打得一手好牌，他现在成为了首相，与此同时大日本帝国全境已颁布戒严令。"
 japan_domestic_events.16.a: "万岁！(萬歲！)"
 japan_domestic_events.17.t: "未遂政变"
 japan_domestic_events.17.d: "虽然陆军大臣拒绝支持政变，但他也没有采取任何手段阻止这场阴谋，政变策划者们将此理解为一种默许，于是便发起了行动。今天上午，政变部队夺取了警视厅、首相官邸和新修的帝国议会议事堂，但未能占领皇宫。然而，这些阴谋分子没有想到的是，天皇抵制了这场政变，并下令镇压叛军，这使得他们的行动变成了一场笑话。政变部队没有抵抗就投降了，几个关键策划者被迅速逮捕，而其中一些人在被捕前选择了切腹自杀。"
 japan_domestic_events.17.a: "民主制度的胜利！"
 japan_domestic_events.18.t: "新的权力斗争"
 japan_domestic_events.18.d: "这场政变是由一个广泛的部队联盟实施的，但其中很少有人能像皇道派下级军官及其同道中人一样充满热情。事实上，他们很乐意竭尽所能，推翻一向庸碌无能的民选政府，因为他们看清了议会的本质：财阀资本主义机构。\n\n然而，在新政府统治下，情况并没有什么变化，平沼等人和统制派，这些当权的骗子，愉快地坐上了新内阁中的领导位子，而皇道派则因“激进”被边缘化。因此，皇道派下级军官得出结论，他们和整个日本都被出卖了，当权派再次从天皇手中窃取了权力，并将国家带入了另一个深渊。新的权力斗争已经开始。"
 japan_domestic_events.18.a: "这事算是到头了？"
 japan_domestic_events.19.t: "皇道派反政变！"
 japan_domestic_events.19.d: "今天早些时候，驻扎于东京地区部队中的皇道派下级军官发动了新一场政变！清晨，1400名政变官兵迅速占领了几处关键的通讯设施和行政机关，陆军省、参谋本部、警视厅、首相官邸和帝国议会议事堂都被迅速占领，皇宫也被政变部队封锁了起来。下午，天皇亲自现身，并正式向政变官兵宣布支持他们的革命。\n\n为了保证这次能“合适地治国”，荒木贞夫将军提名近卫文麿公爵出任首相。近卫与支持维新派的各路知识分子、政论家等知名人士都有联系，他希望塑造一个更符合皇道派愿景的日本。"
 japan_domestic_events.19.a: "政变是成功的！"
 japan_domestic_events.20.t: "维新派试图政变"
 japan_domestic_events.20.d: "今天早些时候，驻扎于东京地区部队中的皇道派下级军官发动了新一场政变！清晨，1400名政变官兵迅速占领了几处关键的通讯设施和行政机关，陆军省、参谋本部、警视厅、首相官邸和帝国议会议事堂都被迅速占领，皇宫也被政变部队封锁了起来。然而，当天皇明确谴责暴动者的非法举动之后，海军省动员了数支海军特别陆战队击退了叛军，拯救了皇宫，到了傍晚，政变被完全粉碎。"
 japan_domestic_events.20.a: "天照大神在上，感谢海军！"
 japan_domestic_events.21.t: "政变失败"
 japan_domestic_events.21.d: "维新派的政变已被粉碎。作为叛国者的典型，维新派正在全国各地被清洗。有人呼吁军队在政府中发挥更大的作用，协助政府根除国贼和工团主义者。"
 japan_domestic_events.21.a: "陆军大臣林铣十郎将担任首相。"
 japan_domestic_events.22.t: "举国一致政府"
 japan_domestic_events.22.d: "立宪政友会的中岛知久平和立宪民政党的安达谦藏发表联合声明（二人都是《国家保安法》的拥趸），敦促两大主流政党组成一个多党派的“举国一致政府”，保卫大日本帝国的“国体”不受工团主义威胁。"
 japan_domestic_events.22.a: "我们需要一个强有力的政府。"
 japan_domestic_events.22.b: "我们不需要你的废话；选举公平才是我们所需的！"
 japan_domestic_events.23.t: "国防的基本方针"
 japan_domestic_events.23.d: "上台之后，中心派就开始为他们的新政权寻求政治蓝图。现在他们出版了《国防的基本方针》这份“蓝图”，并将其分发给了中心派的领导层。通过构想“高度国防国家”这一概念，该文件提出国家应随时准备好进行“总力战”。为此，不仅日本的经济结构必须按照军国主义路线重组，而且日本人民也必须拥有“开明的意识形态”，摒弃一己私利。他们必须放弃进行对国家安全有害的阶级斗争，从道德经济层面重建社会形态。"
 japan_domestic_events.23.a: "此乃吾辈应遵之道。"
 japan_domestic_events.24.t: "国体之本义"
 japan_domestic_events.24.d: "《国体之本义》是文部省编纂出版的156页小册子，该书旨在对日本的“国体”确立正统的定论（“国体”一词的大意为“国家的本质”，“国家的政治“等）。根据天照大神的传说和“万世一系”的天皇皇祖的神敕，这本小册子正式把天皇尊奉为了现人神（一个活着的神）。为了效忠天皇，为了实现日本文化的繁荣富强，天皇的臣民们必须“克己奉公”。在某种程度上来说，这份册子是对中心派的“新幕府主义”批评的回应。"
 japan_domestic_events.24.a: "天皇陛下万岁！"
 japan_domestic_events.25.t: "新体制运动"
 japan_domestic_events.25.d: "为了动员公众支持政府及其改革方案，政府组织了“新体制运动”。由近卫文麿公爵领导的新体制运动，其目的是创建一个能够将人民从根本上统合起来并整合为一个有机民族整体的政治机构——该运动的本质是一种将天皇作为家长式领袖的日本式法团主义。该运动的直接目标是统合政坛上的各个政党，将其全部整合进一个组织——大政翼赞会。"
 japan_domestic_events.25.a: "此乃吾辈应遵之道。"
 japan_domestic_events.26.t: "大政翼赞会第一次会议"
 japan_domestic_events.26.d: "大政翼赞会(大政翼贊會)作为新的政治核心机构，统领着社会的方方面面，与旧时“财阀把持的”帝国议会迥然不同。它在全国各地按照行政机构等级设有道府县支部、大都市支部、市区町村支部、町内会、部落会等分支机构，并统合了学术、文化、经济、政府、军事、政治等各个专业领域顶尖人才组建了大政翼赞会的中央本部。理论上，通过扎根到基层的方式，大政翼赞会将确立“上意下达，下情上通”的政治联系，通过让每个重要的利益团体都能在核心圈里拥有自己的代表，协调改进国家各项政策。\n\n理论上来说，第一次会议上出现了三个主要集团。居于中心的是由近卫文麿公爵亲自领导的，由有着改良倾向的知识分子和政治家组成的国民精神总动员运动(国民精神総動員運動)，简称“精动(精動)”，而在近卫命令下成立的政治研讨会——昭和研究会(昭和研究會)是他们许多改革建议的来源。\n\n昭和同人会(昭和同人會)是昭和研究会的分支机构，它已经成为了新政府事实上的公共关系部门，并保证能实现“吸引日本最有智慧（以及最有影响力）的人才”的目标。\n\n在新政府的安排中，皇道派(皇道派)成为了局外人，它由荒木贞夫将军及其手下的预备役和积极维新派军官组成。正是他们通过反政变让新政府掌权，而今他们却被冷落一旁，必须多加留意以慰其心。\n\n许多人质疑近卫文麿那强有力的议程，甚至质疑大政翼赞会本身的目的。近卫希望翼赞会成为“新制度”的中枢神经，将所有立法、行政和管理权力合而为一。虽然他保证旧有的明治宪法会继续生效，翼赞会也不会代替帝国议会，但这种塑造政治利维坦（即政治巨兽）的想法还是遭到了强烈反对。"
 japan_domestic_events.26.a: "此将为我新国家之根基！"
 japan_domestic_events.27.t: "近卫文麿获得支持"
 japan_domestic_events.27.d: "为期15天的会议后，近卫文麿公爵成功地推进了自己的议程，确保了大政翼赞会的支持。如今身为首相的他正试图将其改革派政见付诸实施，但同时也得和维新派中反对自己的势力达成共识。\n\n这项任务可能没料想的那么简单，大政翼赞会正遭受来自皇道派里最多嘴的那些人的口诛笔伐。不过，近卫文麿也承认，为了保住权柄自己将不得不作出妥协，在政治上走钢丝以避免整个权力结构轰然倒塌。"
 japan_domestic_events.27.a: "为日本之命运，一同努力吧。"
 japan_domestic_events.31.t: "大选"
 japan_domestic_events.31.d: "尽管如此，在民主幸存下来之后，确保民主制度稳固的选举制改革已获通过。然而，由于“举国一致政府”的垮台，政府缺乏高效运转的权力与威望。解决方案自然是再简单不过：相信选举改革，把问题交给日本人民来处理；如今政府呼吁进行选举，以便选出众望所归且能控制政治局势的候选人。"
 japan_domestic_events.31.a: "立宪政友会胜选。（保守派）"
 japan_domestic_events.31.b: "立宪民政党胜选。（自由派）"
 japan_domestic_events.31.c: "执政联盟继续携手共行。"
 japan_domestic_events.32.t: "立宪政友会的分裂"
 japan_domestic_events.32.d: "在1936年立宪政友会会议期间，中岛知久平认为他的领导地位不稳固，所以与其他派系订立了权力分享协议。这个协议规定，立宪政友会干事长的职位将保持空缺（但并非废除该职位），而秘书长的事务将转交给立宪政友会的总务会进行集体处置。\n\n上个月，中岛知久平认为自己的地位已经巩固，所以他试图攫取干事长的权力以完成他的绝对统治。为达目的，他向总务会正式提出，将干事长这一职位交给同情“革新派”的前秘书长久原房之助；4月28日，中岛和他的派阀组成了“革新同盟”，实际上是在一个党内再组建一个党，从而进一步挤压了总务会的权力。大选结束后，5月14日，亲中岛派的总务会长堀切善兵卫就干事长职务这一问题，在党内强行推动投票表决，然而党内其他各派别合力否决了这项动议。由于革新派被孤立在了政友会的高层之中，他们不得不尝试用召集各地党干事的办法来打开局面——但这一企图再次被各路反对革新派的政治领袖联手挫败了，这使得中岛知久平更为沮丧。今天，在选举结束仅一个月后，“革新同盟”正式宣布脱离立宪政友会。"
 japan_domestic_events.32.a: "是时候追寻我们自己的道路了。"
 japan_domestic_events.33.t: "国民同盟成立"
 japan_domestic_events.33.d: "在安达谦藏和他的派系离开立宪民政党，请求加入革新同盟获得许可后，中岛知久平重组了革新同盟，将党更名为国民同盟。"
 japan_domestic_events.33.a: "是时候追寻我们自己的道路了。"
 japan_domestic_events.34.t: "举国一致内阁垮台"
 japan_domestic_events.34.d: "尽管最初成立举国一致政府的目的是向军方和民众显示议会的强势，但很明显，举国政府的受益者从一开始就是民政党内的安达派和政友会内的中岛派这两支反主流政治的派阀。过去几年间，两党的关系愈发恶化，近日更是达到了临界点。现在，民政党和政友会的议会联盟已告瓦解，安达谦藏和久原房之助分别脱党，共同组建了新党“国民同盟”，而民政党和政友会内部的保守派再次取得了党内主导权。"
 japan_domestic_events.34.a: "是时候追寻我们自己的道路了。"
 japan_domestic_events.45.t: "人民阵线事件"
 japan_domestic_events.45.d: "446名左翼学者、知识分子和政治家（包括两名现任国会议员）根据《国家保安法》被逮捕和起诉。这些人被指控试图组织一个“人民阵线”，并威胁到了国体。"
 japan_domestic_events.45.a: "嗯，名单是这样排的吧？"
 japan_domestic_events.46.t: "第二次人民阵线事件"
 japan_domestic_events.46.d: "今天又有一批知识分子被捕，38名左翼教授因涉嫌组织“人民阵线”被捕起诉。"
 japan_domestic_events.46.a: "还会有多少个赤色分子？！"
 japan_domestic_events.47.t: "京滨集团事件"
 japan_domestic_events.47.d: "在京滨（东京-横滨）地区开展地下运动的一个工团主义“集团”已被曝光并被逮捕。"
 japan_domestic_events.47.a: "这很好，对吧？"
 japan_domestic_events.48.t: "企划院事件"
 japan_domestic_events.48.d: "内阁企划院内的十七名成员被逮捕，他们被控在当今政府内部组织一个“人民阵线”。"
 japan_domestic_events.48.a: "形势有点失控了！"
 japan_domestic_events.49.t: "满铁调查部事件"
 japan_domestic_events.49.d: "今天，来自南满铁路研究部的二十九名官僚被逮捕，因为他们被指控在满铁内部组织一个地下工团主义社团。"
 japan_domestic_events.49.a: "形势有点失控了！"
 japan_domestic_events.50.t: "横滨事件"
 japan_domestic_events.50.d: "六十名作家和记者因企图组建地下的工团主义政党而被逮捕。但是据信，他们的绝大部分证词是在酷刑之下作出的。"
 japan_domestic_events.50.a: "这越来越糟糕了！"
 japan_domestic_events.51.t: "特高科警察被控刑讯逼供"
 japan_domestic_events.51.d: "特高科，全称“特别高等警察”，是一个专门预防社会和思想犯罪的警察组织。特高科因其酷刑和残忍的拷问审讯而臭名昭著，有时甚至会导致犯人死亡。《国家保安法》通过后，特高科的规模和权限也迅速扩大，他们对嫌疑罪犯的人身安全也愈发不上心。今天一家大报刊报道，一名男子在拘留期间死亡，并指控是特高科将该男子拷问致死。"
 japan_domestic_events.51.a: "哦，不……"
 japan_domestic_events.53.t: "1939年大旱"
 japan_domestic_events.53.d: "我国正处于本世纪以来最严重的旱灾之中。水的供应量严重不足，农作物死于干旱。在一些地区，地方官员正在组织祈雨仪式，试图引来降雨并稳固民心，但却无济于事。幸运的是，干旱主要的受灾地区为南朝鲜、本州西部和南方诸岛，尽管稻米收成大幅下降，但没有造成饥荒。然而，干旱对粮食生产的影响严重到足以迫使我们关停几处大米交易市场（包括著名的堂岛米会所），并且迫使我们直接统制大米配给（至少在目前我们得采取此番手段）。"
 japan_domestic_events.53.a: "至少现在没有人饿死……"
 japan_domestic_events.54.t: "1940年大选"
 japan_domestic_events.54.d: "现在是时候进行新大选了。随着主要党派和反对党开始全力拉票，这次大选会比19世纪后期以来的各场大选有更多的不确定性。选举结束后，天皇陛下将要求新首相组建他的内阁。"
 japan_domestic_events.54.a: "立宪政友会胜选。（保守派）"
 japan_domestic_events.54.b: "立宪民政党胜选。（自由派）"
 japan_domestic_events.54.c: "国民同盟胜选。（民族主义者）"
 japan_domestic_events.54.e: "社会大众党胜选。（社会主义者）"
 japan_domestic_events.55.t: "1944年大选"
 japan_domestic_events.58.t: "林铣十郎逝世！"
 japan_domestic_events.58.d.pataut: "呜呼哀哉！林铣十郎首相在家逝世了。首相生前同时是中心派和维新派一分子，作为新的军政府领导人而声名鹊起，在任期间日本生活的方方面面亦有大改观。在我国现代化的历史上，他无疑是最有影响——抑或是最臭名昭著的一员。\n\n林铣首相继任者分为两派。一派是永田铁山将军——这一选择是日本的大势所趋。永田铁山是陆军中心派的主要理论家，自30年代起一直在幕后活动，四处争取政要与商界精英的支持，来将日本转变为他及其全面战争理论支持者所梦寐以求的国防国家。另一方面，平沼骐一郎男爵代表倾向于中央派的文官政府，他是一个敏锐的反民主阴谋家，在军队中有众多关系，他将为军国主义政府修饰一些文官色彩。"
 japan_domestic_events.58.d.defaul: "真是悲伤的一天——前将军林铣十郎在家逝世了。将军生前同时是中心派和维新派一分子，他的政治生涯堪称步履维艰，且其与陆军激进派的关系也常常令我们担忧。不过，现在应该太平无事了。"
 japan_domestic_events.58.a: "任命永田铁山。"
 japan_domestic_events.58.b: "任命平沼骐一郎男爵。"
 japan_domestic_events.58.c: "愿逝者安息。(ご冥福をお祈りします。)"
 japan_domestic_events.60.t: "干旱造成损失"
 japan_domestic_events.60.d: "日本农村在“失落十年”之后已经陷入了水深火热之中，这场旱灾更让贫困农民与倒闭的农副产品工厂数量激增。旱灾的影响似乎还在继续扩大。"
 japan_domestic_events.60.a: "没办法了。(仕様がない。)"
 japan_domestic_events.61.t: "奉天-朝鲜-日本供给提议"
 japan_domestic_events.61.d_pervasive: "在对时下的旱灾进行自然研究后，农林省、商工省和内务省都得出结论说我们已经没有更好的办法来减轻损失了。但是，拓务省主张，我国可以要求奉天政府向朝鲜提供谷物和大米，而朝鲜则需要向日本本土输送当地产出的大米以缓解日本本土的压力。满洲基本上没有受到旱灾影响，尽管这个要求可能需要满洲地区在短期内用更少的粮食勉强度日，但我们对这个国家政治经济的掌控应该足以让我们压制住任何不满。"
 japan_domestic_events.61.d_normal: "在对时下的旱灾进行自然研究后，农林省、商工省和内务省都得出结论说我们已经没有更好的办法来减轻损失了。但是，拓务省主张，我国可以要求奉天政府向朝鲜提供谷物和大米，而朝鲜则需要向日本本土输送当地产出的大米以缓解日本本土的压力。满洲基本上没有受到旱灾影响，尽管这个要求可能需要满洲地区在短期内用更少的粮食勉强度日——但我们肯定，奉天政府会乐意在其后台需要之际出手相助的。"
 japan_domestic_events.61.a: "他们别无选择。"
 japan_domestic_events.61.b: "发出请求。"
 japan_domestic_events.61.c: "我们将会撑过去的。"
 japan_domestic_events.62.t: "奉天拒绝了我们的提议"
 japan_domestic_events.62.t.cutoff: "奉天切断了援助"
 japan_domestic_events.62.d: "奉天政府极其无礼的拒绝了我们减少旱灾损失的提议。他们恶劣的行径以及对宗主的不敬将得到应有的惩罚！"
 japan_domestic_events.62.d.cutoff: "奉天政府极其无礼的决定终止运输食物给我们，我们被迫独自应对这场大旱。这种悖逆行为毫无疑问会得到应有的惩罚！"
 japan_domestic_events.62.a: "惩罚他们无礼的行为！"
 japan_domestic_events.62.b: "没办法了。(仕様がない。)"
 japan_domestic_events.63.t: "旱灾结束"
 japan_domestic_events.63.d: "在几个月的煎熬后，旱灾终于结束了，整个国家也开始恢复。"
 japan_domestic_events.63.a: "太好了！"
 japan_domestic_events.64.t: "奉天同意提供食物"
 japan_domestic_events.64.d: "奉天政府同意提供食物，旱灾的负面效应不久之后也将会得到减缓。"
 japan_domestic_events.64.a: "好消息！"
 japan_domestic_events.65.t: "天皇支持政府"
 japan_domestic_events.65.d: "几个月的混乱之后，政友会的领导地位正经受巨大的压力。但随着《国家保卫法》的通过，政府似乎终于看见了隧道尽头的光明。今天，天皇陛下罕见地在议会中露面并发言。他郑重宣告自己对政府表示支持，并强调了回归常态和稳定的重要性。有人将此视为一个强烈的暗示，认为其意在阻止任何反对常设民选政府的军事行动。天皇陛下金口玉言，他的支持也许足以确保事态持续稳定下来。"
 japan_domestic_events.65.a: "感谢天皇陛下。"
 japan_domestic_events.72.t: "天皇拒绝支持政府"
 japan_domestic_events.72.d: "政府软弱不堪，只得断然恳请天皇发言。于是，天皇陛下罕见地在议会中露面，却表示拒绝支持政府。天皇陛下字字千钧，其态度也是对政府的致命一击。此时如果没有外力干预，政府势必会倒台，我们是该认可天皇陛下的支持，还是冒万死指出他的行为已经触碰了宪政的红线？"
 japan_domestic_events.72.a: "让我们与天皇陛下步调一致吧。"
 japan_domestic_events.72.b: "天皇陛下的行为过线了！"
 japan_domestic_events.74.t: "铁轨间距更换中"
 japan_domestic_events.74.d: "我们付出了巨大的努力才让这个庞大的工程得以启动，虽然目前的进度离完成还有十万八千里，但计划中最艰难的部分已经过去，旧式铁路，窄轨铁路的负面影响正在以肉眼可见的速度减少。"
 japan_domestic_events.74.a: "好哇！"
 japan_domestic_events.75.t: "农地改革完成"
 japan_domestic_events.75.bad: "农地改革一直以来都是一个持续的政治问题。我们不是第一个尝试解决的政府，不幸的是，我们也不会是最后一个。我们的努力一直在浪费时间，简直就是一场灾难！我们甚至未能在这个问题上取得任何进展；它肯定会在未来几年困扰我们的经济。"
 japan_domestic_events.75.okay: "农地改革一直以来都是一个持续的政治问题。我们不是第一个尝试解决的政府，但我们也许是最后一个，虽然我们没有彻底改革土地使用，但我们已经解决了许多问题，足以使低效的土地利用不再困扰我们的经济。"
 japan_domestic_events.75.good: "农地改革一直以来都是一个持续的政治问题，我们不是第一个尝试解决的政府，但我们在前人失败的地方取得了成功！我们不仅解决了许多根本问题，而且更进了一步；我们已经购买和重新分配了数万公顷的土地给无地农民或佃农，我们努力的成果已经显现！"
 japan_domestic_events.75.great: "这真是一个奇迹！农地改革一直以来都是一个持续的政治问题。我们不是第一个尝试解决的政府，但在前人失败的地方，我们做了许多人认为不可能的事情！我们已经完成了国际公认的历史上最大的土地再分配项目之一。230万公顷的土地已经在计划中分配给了农民，而且就日本而言，地主经济已经不在存在了。"
 japan_domestic_events.75.a: "怎么会这样……"
 japan_domestic_events.75.b: "我可以接受！"
 japan_domestic_events.75.c: "万岁！(萬歲！)"
 japan_domestic_events.75.d: "万岁！万岁！万岁！(萬歲！萬歲！萬歲！)"
 japan_domestic_events.76.t: "建立预算和研究组织"
 japan_domestic_events.76.d: "[GetSecondInCommand]首相和其他陆军军官一道，提出建立一个新组织，用于处理预算并进行政治研究。该组织将直属于首相。从表面上看，建立这个组织是在为陆军的长期计划准备资金、出台有利的政策。\n\n然而，国会对该提案表示强烈反对，因为该组织将会取代其权力范围内的许多省厅。当然，一点妥协也不是不可能，但问题是，我们需要自己的计划推行到何种程度。"
 japan_domestic_events.76.a: "通过妥协使国会放下心来。"
 japan_domestic_events.76.b: "必须全部完成，不惜代价。"
 japan_domestic_events.77.t: "合并低效省厅"
 japan_domestic_events.77.d: "陆军领导层向国会提议合并一些中央省厅，以消除低效问题，促进权力集中。具体而言，他们建议将拓务省与外务省合并、将农林省与商工省合并。\n\n国会对此相当担心，并补充说，许多岗位会因此消失，议员们指出，这会导致陆军在政治上的影响力更进一步。"
 japan_domestic_events.77.a: "让国会放心，没人会丢掉位置。"
 japan_domestic_events.77.b: "必须全部完成，不惜代价。"
 japan_domestic_events.78.t: "五年计划的细节"
 japan_domestic_events.78.d: "在陆军改造国家的众多计划中，五年计划无疑是颇具争议的一项。包括陆军大臣寺内寿一在内的众多官员，为了推动帝国走向战争，都提出了与五年计划类似的提案，该类提案致力于国有化一些企业，同时保护日本的海陆国防安全。\n\n然而，国会或者财阀不太可能批准如此宽泛的提案。通过某种妥协，我们可以推动他们前进——或者用另一种方法，通过武力威胁，迫使他们通过提案。"
 japan_domestic_events.78.a: "与国会和财阀一起制定计划。"
 japan_domestic_events.78.b: "用威胁和贿赂来推进我们的计划。"
 japan_domestic_events.79.t: "遏制财阀"
 japan_domestic_events.79.d: "财阀，是日本几大工业企业集团的代名词，如今他们正遭到我们执政联盟部分成员的口诛笔伐，特别是皇道派的人。他们坚信，财阀是日本堕落的主要推手：腐败、裙带关系，他们代表着资本主义最无节制的面孔，收割所有利润，然后丢下作为我国灵魂的农村家庭，置之不理。\n\n确实，财阀在近几十年来的扩张速度有目共睹，我们在满洲的投资也只会进一步增长他们对日本经济的影响力。为了纠正这一问题，执政联盟和军队中的一些人强烈建议我们对财阀的资产进行国有化，其最终目的就是要彻底消除他们的影响力。还有些人也暗示以高遗产税作为手段，这将有助于企业集团摆脱家族统治的性质。\n\n然而，有些声音则对这些想法表达了担忧，其中，昭和同人会是主要的反对者。他们争辩道财阀是爱国的公司，从长远来看，妨碍财阀的业务将酿成灾难性的后果。作为回应，皇道派的成员迅速地指出了同人会领导人物久原房之助同日产的关系，日产正是由他姐夫运用他的资产创立的。\n\n政府中的许多人都与财阀势同水火，因此我们最终还是决定遏制财阀的影响力，只在程度多少上还存有疑问。"
 japan_domestic_events.79.a: "必须终结财阀的腐败，开始国有化他们的资产。"
 japan_domestic_events.79.b: "有点太鲁莽了，还是温和一点吧。"
 japan_domestic_events.90.t: "清扫行政系统"
 japan_domestic_events.90.d: "在过去几个月里，五·一五事件造成了巨大的动荡，但历尽艰险，日本的民主还是从余波中幸存了下来。然而，许多人并没有称颂政权的稳定，反而对这一系列事件的源头困惑不解：社会主义竟恐怖如斯，能让极端分子在一年内两次袭击首相成功？\n\n因此，无端的恐惧和猜疑涌上了当权派的心头，气氛十分紧张。这些狂热分子怎么可能多次对政府首脑发起行动，还成功了？政府中一定满是社会主义的信徒，他们在向第三国际间谍和社会主义煽动者通风报信！这种流言正像野火一般四处蔓延，社会大众党受到的攻击尤其严重，因为他们信奉民粹纲领，还推动减少军费改为他用，人们认为他们过于同情使国家几乎陷入无政府状态的乱党。无论这个指控是否属实，它都清楚地表明，局势依旧不稳，忽视这些警兆可能会导致灾难。\n\n不过，事情还有一线转机。最近通过的《国家保安法》给了政府一双应对激进分子的长臂，事实上，政府可以清除任何被怀疑对革命思想感兴趣的下级官僚，将他们作为“试图从内部改变日本国体”的国贼来审判。一旦查明有罪，我们既可以判他们重刑以儆效尤，也可以把他们交给特别高等警察(特別高等警察，即特高课)，授权动用一切必要手段，让他们认识到错误，放弃有害的思想，这个过程就是所谓的“转向(転向)”。毕竟，许多官员政客都很有能力，只要加以足够的“劝服”，他们就能很好地继续为我们服务。"
 japan_domestic_events.90.a: "剔除恶首，能认错的就让他们将功补过。"
 japan_domestic_events.90.b: "我们不能冒险，必须清洗整个系统里的可疑因素。"
 japan_domestic_events.239.t: "[GetYear]年大选"
 japan_domestic_events.239.d: "现在是时候进行新大选了。随着主要党派和反对党开始全力拉票，这次大选会比19世纪后期以来的各场大选有更多的不确定性。"
 japan_domestic_events.239.a: "民主党。（保守主义）"
 japan_domestic_events.239.b: "自由党。（自由主义）"
 japan_domestic_events.239.c: "社会党。（社会主义）"
 japan_domestic_events.240.t: "天皇的命运"
 japan_domestic_events.240.d: "在敲定新政府体系中的最后一个分支后，我们必须决定日本皇位的未来。虽然裕仁无疑要为发动对我国的战争承担责任，但正义的裁决很可能会让他迎接死亡或者终身监禁，而我们则要面对无法解决的公共秩序问题。然而，许多民众认为入侵本岛时遭到的巨大伤亡都要归咎于天皇，因此他们呼吁彻底废除天皇制度，以此为牺牲者复仇。而另一方面，我们的外交官，甚至大多数将领都反对废除天皇制度，他们建议我们要么允许皇室继续保持象征性地位，要么只让裕仁退位而保留天皇制度，否则我们的合作者将因潜在的叛乱而永无宁日。"
 japan_domestic_events.240.a: "让他保留皇位，但将国家主权转到人民身上。"
 japan_domestic_events.240.b: "迫他退位。"
 japan_domestic_events.241.t: "皇室的命运"
 japan_domestic_events.241.d: "随着新政府最后一个部门的职权敲定，日本皇室的未来摆到了台面上。毫无疑问，不少皇室成员对向我们发动战争负有责任，但执行彻底的正义或许会让不少皇族被判处死刑或无期徒刑，如此会让我们面临完全无法应付的公共秩序问题。我国外交官甚至大多数将领都坚称，我们应该宽大处理。我们当然不能再让日本维持君主制，但我们手上还有别的选择。"
 japan_domestic_events.241.a: "让他们留下，但剥夺其权力。他们再也不是贵族了。"
 japan_domestic_events.241.b: "放逐他们。"
 japan_domestic_events.400.t: "皇室新丁"
 japan_domestic_events.400.d: "大内于今早宣布了大喜之事，良子皇后在短暂的分娩后又诞下一女。尽管皇室内部因皇后的年龄及这作为她第七次分娩而感到担忧，但据报道，母女都很健康，没有严重的并发症。大部分皇亲国戚都已见到了这位新出生的成员，而天皇本人也在大约一个小时后到达，首次见到了他的女儿。\n\n按照皇室的传统，新皇女还尚未取名字，这还要等到出生后七天举行的传统命名仪式。尽管如此，全国各地的许多人已经开始猜测孩子的名字和宫号。其中最广为流传的一种说法是，这个名字可能源于万叶集——已知最古老的日本传统诗集，就像她的叔叔三笠宫亲王一样。不管这些说法是否正确，皇室中新生命的诞生总能为国家和人民带来一小段美妙与欢愉的时光。"
 japan_domestic_events.400.a: "御内弄瓦之喜，国之幸也。"
 japan_domestic_events.401.t: "“蹴球”旭升之国"
 japan_domestic_events.401.d: "由于天皇家族的地位，皇室成员很少遭到非议，他们与政府之间也罕有政治上的冲突，不过也不是完全没有。近来，天皇陛下之弟秩父宫雍仁亲王就与多名政府官员发生了冲突，与一般的幕后政治相比，这次冲突更加不同寻常。\n\n亲王以支持和促进了多种体育运动在日本的发展而闻名，而最出众的一项运动便是英式橄榄球。前日本橄榄球协会主席、日本国家橄榄球队主教练香山蕃将橄榄球介绍给亲王后，亲王就成了日本橄榄球在国内外的代言人。在亲王的帮助下，这项运动传到了全日本，许多日本球队已经开始和英联邦球队进行国际比赛。\n\n而争议的点就在这里，政府中一些强硬的传统派认为，这种外国运动正在“像癌症一样发展，吞噬我国的文化”，希望压制这种对橄榄球的支持，并把“ラグビー”（英语中橄榄球Rugby的音译）改成一个更日本化的名字（即“蹴球”）。这些人和亲王等新潮人士进行了正面交锋，由于亲王已经对这些提议表示了反对，这次冲突无可避免地需要官方裁决。（译注：标题原文为The Land of the Rising Scrum，为“旭日之国”的谐音，其中“Scrum”意为橄榄球中的“并列争球”。）"
 japan_domestic_events.401.a: "不就是办些球赛，日本文化不会就此毁灭。"
 japan_domestic_events.401.b: "要重视传统，也许亲王应该转而保护蹴鞠（けまり）。"
 japan_domestic_events.402.t: "$fengtian_events.173.t$"
 japan_domestic_events.402.desc: "$fengtian_events.173.d$并非所有满洲人真正感激日本帮助其国家发展的努力，少数人甚至公开抗议他们所谓的“公然的殖民主义行径”。不过，这条线路的开通有力地证明了日本为将现代性带到奉天乃至整个亚洲所做的付出，一些异见分子的想法无关紧要。"
 japan_domestic_events.402.a: "为共荣三呼万岁！"
 japan_domestic_events.403.t: "达特桑崛起"
 japan_domestic_events.403.desc: "十多年来，米国汽车公司完全主宰着日本市场，虽然近年来本土制造商表现优异，但总产量也只能达到福特、通用、克莱斯勒三巨头的零头。即便母国已经陷入一片混乱，三巨头在日本的分公司仍在继续运营，只不过许多人都能看出来，它们的产量已经开始大幅下降。\n\n日产公司(日産自動車株式会社)看到了从三巨头手中夺取市场份额的机会，推出了达特桑(ダットサン，即DATSUN)系列的新车，称为“达特桑16型”。虽然与前代15型并无太大不同，但由于抓住了发布时机，以及向帝国陆军供应免费型号等相关市场营销活动，该型号已卖出数千台，甚至有一些被富裕的澳大利亚进口商所购买。对于日本企业来说，今年也许是美妙的一年，但是，尤其是在米国局势自行解决之后，这种势头会不会持续下去还很难说。"
 japan_domestic_events.403.a: "这只是个开始！"
 japan_domestic_events.404.t: "本岛本垒打"
 japan_domestic_events.404.desc: "棒球(日语：野球)自传入日本几十年来，已经发展为全国最受欢迎的运动之一，不过直到近年，人们还普遍认为棒球是闲暇时的消遣游戏，或者学校中开设的一门课程。但是几年前，传媒大亨正力松太郎组织了“日米大野球赛”，由日本最优秀的棒球手组成一队，对阵贝比·鲁斯、吉米·福克斯等人组成的米国大联盟明星队，从此，风向瞬间转变了，随着这场横跨12个城市的巡回赛，职业棒球的概念很快席卷了全国。\n\n由此，日本第一个职业棒球联盟——日本职业棒球联盟(日本職業野球連盟)于今日成立，由七支球队组成，其中包括以上次日米野球赛中日本明星队为班底组建的东京巨人队(大日本東京野球倶楽部(東京巨人軍))。联盟的第一个赛季将会分为三个部分，预计将于几周内开始。公众本就热切期待职业比赛，再加上正力松太郎旗下报业大力宣传，新生的职业联盟有望大获成功，成为未来全国人民喜闻乐见的娱乐活动。"
 japan_domestic_events.404.a: "给我们几年，我们就能轻松打赢米国佬！"
 japan_domestic_events.405.t: "网走市立乡土博物馆开放"
 japan_domestic_events.405.desc: "今天，网走市洋溢着激动和欢乐，网走市立乡土博物馆向公众开放了，该馆建筑的设计师田中义也是美国著名建筑师弗兰克·劳埃德·赖特的弟子。该馆展览着米村喜男卫收藏的三千余件考古学和民族志藏品，其中有从旧石器时代到绳文时代、续绳文时代，再到当下的昭和时代生产的日本手工制品，还有来自擦文文化、鄂霍茨克文化和阿依努文化的手工制品。"
 japan_domestic_events.405.a: "这是我国值得骄傲的一天！"
 japan_domestic_events.406.t: "45倍径九四式46厘米舰炮的炮声"
 japan_domestic_events.406.desc: "英国海军将领杰基·费舍尔曾设想制造巨型战列巡洋舰，也就是“无比”号，这是巨型舰炮首次被提出，但时至今日，它仍然只是海军设计师的一种梦想。在我国下一代“终极战列舰”的设计中，一些热情的设计师提出，为称霸海洋，战舰可配备18英寸(约为46厘米)舰炮。经过数月筹划，今天上午10时，这款世界上口径最大的舰炮发出怒吼，大地也为之震颤。海军航空派认为，这种巨炮不过是玩物，只会浪费宝贵的资源和时间，很可能等不到成功上舰就要退出现役了。"
 japan_domestic_events.406.a: "火力之强，无人能敌！"
 japan_domestic_events.407.t: "名古屋泛太平洋和平博览会"
 japan_domestic_events.407.desc: "名古屋泛太平洋和平博览会由政府主办，旨在振兴工业、交通、教育、科学、建造、建筑、社会福利、旅游、艺术和手工业等部门。在历时两个半月的展览期间，展会接待了超过480万人，大约是当时大名古屋地区人口的四倍，平均每天有61643人前来参观。"
 japan_domestic_events.407.a: "向世界展示我国最好的一面！"
 japan_domestic_events.407.b: "欲求和平，必先备战！"
 japan_domestic_events.408.t: "新国会议事堂竣工"
 japan_domestic_events.408.desc: "由于过去十年间政局动荡，新国会议事堂的建设略有延迟，直到今天才得以竣工。除彩色玻璃、门锁和通风管道系统外，建筑其余部分均由日本国产材料建成，今天下午正式开放后，它将成为国内最高的建筑。最终方案的屋顶和塔楼参考了获得三等奖的竹内新七方案，据信，此举是因为与其他设计师的纯欧式或纯东亚式设计相比，这种设计反映的理念更加现代。1918年，大藏省公开征集新国会议事堂的设计案，共征得118份设计，渡边福三的设计（与恩德和博克曼的设计相似）获得了头等奖。最终在渡边福三案的基础上进行一些修改之后，新国会议事堂于1920年开工，并于今年（即1936年）竣工。"
 japan_domestic_events.408.a: "希望等待是值得的！"
 japan_domestic_events.409.t: "1943年鸟取地震"
 japan_domestic_events.409.desc: "当地时间9月10日17时36分，鸟取县发生了7.0级地震，据记录，震中位于气高町，远在濑户内海沿岸的冈山都记录到地震活动的迹象。当地已报告数百人遇难，鸟取市80%的区域被毁，许多古建筑毁于一旦。今年早些时候还发生过两次地震，不过并未造成严重损失。"
 japan_domestic_events.409.a: "人间惨剧！"
 japan_domestic_events.410.t: "台北公会堂竣工"
 japan_domestic_events.410.desc: "台北公会堂设计目的是纪念1928年昭和天皇即位，并取代大清在岛内老旧的布政使司衙门。经过四年的建设、掷出接近一百万日元的花费后，台北公会堂最终竣工。现在，台北已成为日本本岛外仅有的一座拥有公会堂的大城市。总建筑师井手薰意识到台湾高温、多雨、潮湿的气候与日本本岛大相径庭，试图在注重台湾当地特色的同时，将已在岛内其他地方应用过的现代建筑设计应用到其他工程中。"
 japan_domestic_events.410.a: "这栋楼配得上天皇的皇威！"
 japan_domestic_events.411.t: "《小真凛和水兵》——日本刚上架的新书"
 japan_domestic_events.411.d: "我国最近参与的那场战争，为许多战场归还者提供了文艺素材。其中一本浪漫爱情小说获得了空前热销。\n\n这本书标题为《小真凛和水兵》(Marin-chan to Kaigun-kun)，讲述了一对青梅竹马的悲剧爱情故事：邻家男孩和女孩一起长大，似乎生活将永远这样下去。然而就在他们高中毕业的时候，日本投入了战争，男孩被征召加入了海军，女孩留在家中，两人被迫分离。当他们分离后才发现彼此的情谊，却只能通过几封信件来表达了。当战争临近结束，真凛期盼着她的爱人回家时，来信却中断了。\n\n尽管《小真凛和水兵》不能代表日本文学的最高成就，但其以令人惊异的详细笔触描写了日本农家女儿与海军水兵的日常生活。这部作品已有计划出版德语、英语和俄语版本。"
 japan_domestic_events.411.a: "快告诉我结局是啥？"
 japan_foreign_events.1.t: "满铁宣布盈利创纪录"
 japan_foreign_events.1.d: "自日俄战争结束以来，日本的势力便一直扎根于满洲境内。近些年来我们对该地区的掌控力大大加强，这一现状也因此变得更加稳固。1928年的上海会谈迫使世界承认了我们“满洲全权代理”的特殊地位，在关东军的监视下，这项特权为我们的公民造就了无限的机会。\n\n然而，满洲的控制权并未全数落入我们手中，张作霖领导的奉天政府也不是时刻与我们合作。不过他该庆幸，维护满洲和平的愿景目前仍被我们放在第一位，但同时我们也希望他的政府有一天能成为我们实现征服支那野心的工具。因此我们工作的核心是南满洲铁道株式会社，简称“满铁”，该公司现已成长为了一个负责开发利用满洲经济各个重要方面的庞然大物，满铁推动中国东北成为了日本煤、钢的主要来源地，并让中国东北坐拥超过全球一半以上的大豆产量。\n\n今天，满铁再一次宣布其利润达到历史最高值。"
 japan_foreign_events.1.a: "满洲真是个满是机遇的聚宝盆啊！"
 japan_foreign_events.3.t: "日本提供部队训练"
 japan_foreign_events.3.d: "一个来自[From.GetNameDef]的代表团已经于今日抵达，他们提出训练我们的军队，以便将我军提升到一个“更为要紧的水平”。这可真是个令人难以拒绝的要求……"
 japan_foreign_events.3.a: "务必如此！"
 japan_foreign_events.3.b: "拒绝他们。"
 japan_foreign_events.4.t: "日本提供军工设施"
 japan_foreign_events.4.d: "日本人（显然是在发送糖衣炮弹），已经提出给我们为期一年的世界顶尖武器生产线的使用权。虽然我们无法得知他们的真实意图，但是拒绝送上门来的大礼可是不明智的……"
 japan_foreign_events.4.a: "真是太慷慨了！"
 japan_foreign_events.4.b: "打发他们走。"
 japan_foreign_events.5.t: "日本支持我们的攻势"
 japan_foreign_events.5.d: "日本人给我们提出了一份诱人的条件：提供补给品、炸药、弹药，以帮助我们在接下来一百天中发起攻势。我们该接受吗？"
 japan_foreign_events.5.a: "当然！"
 japan_foreign_events.5.b: "绝不！"
 japan_foreign_events.6.t: "日本提供战斗机设计"
 japan_foreign_events.6.d: "日本军队现已允许交付一批远比我军飞行器先进的飞机设计图给我们，并详细告诉我们该如何高效率的生产制造。这真是个意外之喜，我们当然欢迎这一举动。"
 japan_foreign_events.6.a: "无论我们需要什么，日本都能给我们。"
 japan_foreign_events.7.t: "日本支持我们独立"
 japan_foreign_events.7.d: "今天抵达了一批日本顾问，他们带来了礼物并支持我们对抗中国人的斗争。我们十分感谢他们做出的这一举动，但是我们真就这么轻易接受日本人的礼物吗？"
 japan_foreign_events.7.a: "我们将竭尽所能。"
 japan_foreign_events.7.b: "拒绝他们。"
 japan_foreign_events.8.t: "阿卜杜拉希德·易卜拉欣抵达[Root.GetNameDef]"
 japan_foreign_events.8.d: "作为日本政府的代表，一位名叫阿卜杜拉希德·易卜拉欣的伊玛目今日抵达了[Root.GetNameDef]。他强调了日本对我们的支持以及对中国人暴政的反对，并表明日本渴望全亚洲人在反帝国主义的旗帜下团结起来。如此博学的一人驾临我处真是我们无上的光荣。"
 japan_foreign_events.8.a: "导师，欢迎您。"
 japan_foreign_events.21.t: "东京会议"
 japan_foreign_events.21.d: "日本邀请参加他们在东京举办的“泛亚会议”。他们宣称的主办目标是促进亚洲各民族之间的团结合作以对抗西方帝国主义者，看起来是个非常高尚的目的。然而，一些人则请求我们忽视这一邀请，这些人宣称这只是日本人的花言巧语，日本的真正目的是让我们让渡独立权——日本主宰亚洲的野心才刚刚起步。"
 japan_foreign_events.21.a: "带上我最好的西服。"
 japan_foreign_events.21.b: "今年还是好好待在家吧。"
 japan_foreign_events.22.t: "[From.GetNameDefCap]参加东京会议"
 japan_foreign_events.22.d: "来自[From.GetNameDef]的代表团已经抵达了东京，磋商谈判已经开始！"
 japan_foreign_events.22.a: "欢迎！"
 japan_foreign_events.23.t: "[From.GetNameDefCap]拒绝参会"
 japan_foreign_events.23.d: "[From.GetNameDefCap]拒绝参加我们精心准备的东京会议，而问及理由时候他们却含糊其辞的蒙混过关。"
 japan_foreign_events.23.a: "丢人。"
 japan_foreign_events.24.t: "共同谴责西方帝国主义"
 japan_foreign_events.24.d: "今天，在东京举办的首脑会议提出了第一个动议，一项相当没有争议的动议，即让与会成员国签署一份谴责西方殖民者剥削亚洲人民的宣言，并敦促各国废除不平等条约。我们料到这会获得其他国家首脑的支持，并顺利的将会议引入下一阶段。"
 japan_foreign_events.24.a: "如果你同意的话，在虚线上方写下……"
 japan_foreign_events.24.b: "别冒险，“请”他们签字。"
 japan_foreign_events.25.t: "东京会议：谴责西方帝国主义"
 japan_foreign_events.25.d: "我们在日本的代表团显然被要求在一份相当正式的宣言上签名。该宣言谴责了“反亚洲种族主义”、“欧洲列强对被压迫人民的剥削”和“通过不平等条约设立起的机构，以及因为这些机构亚洲人民被剥夺了在他们祖国上的正当权利”。我们应该加入[JAP.GetNameDef]的倡议吗？"
 japan_foreign_events.25.a: "当然！"
 japan_foreign_events.25.b: "我们最好别这么做。（退会）"
 japan_foreign_events.26.t: "[From.GetNameDefCap]退会"
 japan_foreign_events.26.d: "看起来[From.GetAdjective]的高官们对我们在东京会议上提出的议案感到不安，并决意退出进一步的谈判。"
 japan_foreign_events.26.a: "耻辱！"
 japan_foreign_events.27.t: "东京会议：贸易决议"
 japan_foreign_events.27.d: "……因此，与会各国一致认为，为了促进泛亚合作与兄弟友谊，应当将订立相关的贸易协定，并建立一个“保护亚洲人民的经济不受西方世界掠夺性经济规则约束”的泛亚洲关税区置于与会各国的议程核心之上……"
 japan_foreign_events.27.a: "完美，他们必须同意……"
 japan_foreign_events.27.b: "……或许可以给他们点甜头。"
 japan_foreign_events.28.t: "东京会议：关于泛亚贸易"
 japan_foreign_events.28.d: "……因此，与会各国一致认为，为了促进泛亚合作与兄弟友谊，应当将订立相关的贸易协定，并建立一个“保护亚洲人民的经济不受西方世界掠夺性经济规则约束”的泛亚洲关税区置于与会各国的议程核心之上……"
 japan_foreign_events.28.a: "听起来不错。"
 japan_foreign_events.28.b: "简直荒谬。（退会）"
 japan_foreign_events.29.t: "东京会议：呼吁更深层次经济联系"
 japan_foreign_events.29.d: "亚洲必须胜利！我们正在为东京会议起草一系列的备忘录，呼吁深化我们同与会各国之间经济的一体化整合。有利的贸易条款，日本企业特权，货币兑换机制等各方面内容都将囊括在一项更为宏大的计划之中。然而，在目前的情况下，一些与会方在见到条款后可能会直接卷铺盖走人。我们也可以削减部分条款，给他们一点甜头来让他们更倾向于同意，而代价是从长期来看我们将更难用经济手段整合对方。"
 japan_foreign_events.29.a: "将其提交会议讨论。"
 japan_foreign_events.29.b: "对条约内容略加削减。"
 japan_foreign_events.30.t: "东京会议：日本呼吁更深层次经济联系"
 japan_foreign_events.30.d: "或者说“东京呼吁经济一体化”？无论如何，提案在今天会议开始前就已经被交了上去，其内容详细阐述了日本渴望在先前订立的简约的贸易政策协定之外寻求更深层次的经济联系。这一步得慎重，不过话又说回来，这一协定对[From.GetAdjective]经济的好处可能比我们单干要大得多。"
 japan_foreign_events.30.a: "同意！"
 japan_foreign_events.30.b: "反对！（退会）"
 japan_foreign_events.31.t: "重头戏：军事联盟？"
 japan_foreign_events.31.d: "表面上是为了反对殖民者，现在是时候让剩余的所有与会国参加一个全面的军事联盟来共同对抗我们的敌国。毕竟，同我们站到一起，总比被我们当做独逸鬼畜的走狗击灭掉要好得多！\n\n目前，这项方案仅仅是一个构想——一份呼吁进一步合作的声明。签署该宣言目前尚不构成任何义务，但围绕我们构建的全面联盟框架正在形成，他们需要尽快决定是加入其中还是与我们为敌。"
 japan_foreign_events.31.a: "以战争求和平，则和平存。"
 japan_foreign_events.31.b: "强推与会方签字。"
 japan_foreign_events.32.t: "东京会议：呼吁军事行动"
 japan_foreign_events.32.d: "今天，在日本人公布了他们的真正方略后，东京会议发生了争议：在同我们签下经济协议后，他们如今想就此推动一个军事大联盟，以对抗德国乃至其他“西方帝国主义列强”。当然，他们肯定将在其中起领导作用。我们真的满意于这一想法吗？\n\n目前，这项方案仅仅是一个构想——一份呼吁进一步合作的声明。签署该宣言目前尚不构成任何义务，但围绕东京构建的全面联盟框架正在形成，我们需要尽快决定是加入其中还是与他们为敌。"
 japan_foreign_events.32.a: "同心协力，为了全亚洲！"
 japan_foreign_events.32.b: "他们显然疯了！"
 japan_foreign_events.33.t: "[From.GetNameDefCap]倒向日本！"
 japan_foreign_events.33.d: "看起来[From.GetNameDef]的政治家们已一致同意，他们通向繁荣强盛的办法就是同亚洲的一流强国，[JAP.GetNameDef]，相合作。我们将作出安排让他们正式加入军事联盟，以巩固大东亚共荣圈。"
 japan_foreign_events.33.a: "好极了！"
 japan_foreign_events.340.t: "[From.GetNameDefCap]接受了"
 japan_foreign_events.340.d: "[From.GetAdjective]政府参透了我们提案中的智慧，接受加入我们的联盟。"
 japan_foreign_events.340.a: "好极了。"
 japan_foreign_events.341.t: "[From.GetNameDefCap]拒绝了"
 japan_foreign_events.341.d: "[From.GetAdjective]政府抛弃了我们的联盟提议。"
 japan_foreign_events.341.a: "愚蠢的选择。"
 japan_foreign_events.342.t: "加入日本势力圈"
 japan_foreign_events.342.d: "由于在东京会议上公开表明我们有意加入日本的军事联盟，如今日本人已经找上[Root.GetNameDef]门来了，并亲自提出了他们的邀请。"
 japan_foreign_events.342.a: "留给我们的时间不多了！"
 japan_foreign_events.342.b: "我们改变主意了……"
 japan_foreign_events.41.t: "日本的最后通牒"
 japan_foreign_events.41.d: "几个月来，作为其扩张政策的一部分，日本帝国已经表现出了他们对我国殖民地的抱负。今天，日本大使给我们提出了最后通牒：他们要求我们放弃我们在东南亚和太平洋地区的领土，否则我们将面临日本帝国军队的全面入侵……"
 japan_foreign_events.41.a: "懒得和他们废话。"
 japan_foreign_events.41.b: "同意他们的要求。"
 japan_foreign_events.42.t: "我们的最后通牒被无视了！"
 japan_foreign_events.42.d: "[From.GetNameDef]对我们最后通牒没有作任何回应。我们必须动员军队准备作战，确保我们作为东亚唯一强国的地位！"
 japan_foreign_events.42.a: "宣战！"
 japan_foreign_events.42.b: "让步，我们不能冒险开战。"
 japan_foreign_events.43.t: "[From.GetNameDefCap]接受我们的条件"
 japan_foreign_events.43.d: "[From.GetNameDefCap]已经接受了我们的条件。这并不奇怪：他们不敢面对皇国强大的军势！"
 japan_foreign_events.43.a: "太好了！"
 japan_foreign_events.45.t: "日本特使"
 japan_foreign_events.45.d: "一名日本外交官于今日抵达，他寻求与[Root.GetLeader]会谈并讨论他们提出的要求：[From.GetNameDef]将送出军事援助及军事顾问给[PRF.GetNameDef]，作为交换我们将加入亚细亚共荣圈。这并不是说要让我们加入一个军事同盟——至少现在不是，而是让我们加入一个在日本保护下团结经济实力的互助集团。这显然有利于[Root.GetAdjective]经济，但是也有不少人担心日本人在谋求扩大其影响力并致力于最终把我们变成日本殖民地。"
 japan_foreign_events.45.a: "同意他们的要求。"
 japan_foreign_events.45.b: "我们得礼貌拒绝。"
 japan_foreign_events.46.t: "印度人接受了！"
 japan_foreign_events.46.d: "我们给印度人慷慨的提议受到了热情的赞扬与肯定并被他们接受了。从[From.GetNameDef]来的特使赞扬了日本为将我们两个伟大民族团结在一起而做出的慷慨而细致的工作。我们已经邀请他们在东京设立永久性大使馆。"
 japan_foreign_events.46.a: "漂亮！"
 japan_foreign_events.47.t: "印度人拒绝了我们的提议！"
 japan_foreign_events.47.d: "由于对形势糟糕的判断力，来自[From.GetNameDef]的外交官拒绝了我们宽宏大量的友谊与结盟提议。日本报纸对此的反应是嘲笑他们如漫画中受惊了的西洋犬，不敢采取必要的措施来消灭次大陆上的殖民主义。"
 japan_foreign_events.47.a: "真是他们的耻辱！"
 japan_foreign_events.62.t: "日本威胁我们！"
 japan_foreign_events.62.d: "日本一支大型特混舰队已经驶入这片群岛，并威胁如果我们不屈服于他们的投降要求，他们将攻击我们！"
 japan_foreign_events.62.a: "抵制他们，呼吁帮助！"
 japan_foreign_events.62.b: "投降是我们唯一的选择。"
 japan_foreign_events.63.t: "夏威夷投降！"
 japan_foreign_events.63.d: "这对他们来说是明智的，他们绝无坚持下去的可能。"
 japan_foreign_events.63.a: "傀儡他们！"
 japan_foreign_events.63.b: "吞并他们！"
 japan_foreign_events.64.t: "夏威夷请求帮助"
 japan_foreign_events.64.d: "日本正在威胁夏威夷的安全，他们来到我们这里乞求援助。我们应该如何回应？"
 japan_foreign_events.64.a: "我们提供保护。"
 japan_foreign_events.64.b: "他们背离了我们，还记得吗？"
 japan_foreign_events.65.t: "夏威夷有了美国人作后盾"
 japan_foreign_events.65.d: "夏威夷正在抵制我们的要求，[From.GetNameDef]正在支持他们的独立要求。"
 japan_foreign_events.65.a: "我们必将粉碎他们！"
 japan_foreign_events.65.b: "先后撤，我们之后再回来。"
 japan_foreign_events.66.t: "夏威夷抵制我们！"
 japan_foreign_events.66.d: "夏威夷正在抵制我们的要求，即使美洲大陆上没有人有意愿协助他们。我们应该让夏威夷用血来赎罪。"
 japan_foreign_events.90.t: "[FROM.GetNameDefCap]准备向使馆城市开战"
 japan_foreign_events.90.d: "在过去几天，来自上海的新闻越来越不容乐观，战争的阴云似乎已经将这座东方魔都完全笼罩。仅仅过去十年，[FROM.GetNameDef]的立场似乎直接反过来了。他们现在宣称使馆城市的存在，正是“西方帝国主义”把手伸向东亚的象征。与此同时，近期日本的海军似乎也变得活跃起来，准备对使馆城市的首府发起攻击。所有证据都表明，日本正在准备发动一场战争。但是由于现在国际局势比以前任何时候都要紧张，而[LEC.GetNameDef]又远离我们的本土，我们的舰队很难在东亚与日本人争锋，所以很多人都认为援助使馆城市的任何行动最后注定都会失败。然而社会上的一些强而有力的声音，特别是商界，却呼吁政府坚持它的对外承诺，制止日本的侵略行为。"
 japan_foreign_events.90.a: "快撤，我们可不能和日本人打仗。"
 japan_foreign_events.90.b: "我们将捍卫我们的利益！"
 japan_foreign_events.91.t: "[FROM.GetNameDefCap]放弃了使馆城市"
 japan_foreign_events.91.d: "看起来[FROM.GetNameDef]并没有忽视日本对我们的威胁。但是他们并没有坚守保护我们领土完整的承诺，而是耐人寻味地保持了沉默。事实上，[FROM.GetNameDef]已经开始尽可能地转移，放弃在上海的资产，同时否认他们之前对我们承诺过的防御责任。面对外国的公然侵略，我们的保护者已经抛弃了我们。"
 japan_foreign_events.91.a: "哦不……"
 japan_foreign_events.92.t: "[FROM.GetNameDefCap]保证了使馆城市的独立"
 japan_foreign_events.92.d: "一则来自[FROM.GetNameDef]的令人震惊的声明。据声明称，[FROM.GetAdjective]的外交部长表达了对[LEC.GetNameDef]正在被侵略的担忧，并且严正地谴责了我们的行为，最后表示他们对上海做出的承诺绝不会失效。在最糟糕的情况下，[FROM.GetNameDef]愿意为捍卫[LEC.GetNameDef]的领土完整而战。"
 japan_foreign_events.92.a: "想开战的话，随时奉陪！"
 japan_foreign_events.202.t: "奉天白银危机"
 japan_foreign_events.202.d: "当日本最大的两家银行——日本银行与三井银行相继要求立即偿还贷款时，奉天政府的中央银行却由于“难以解释的原因引起的白银储备突然不足”而不得不选择违约。这只能是由于银行极其无能以及严重管理失职导致的——还是说有更险恶的行为在其中还不得而知，但毫无疑问奉天政府现在处于极端的财政状况中并且急需我们的帮助。\n\n尽管我们的影响力可以确保三井银行与日本银行能及时获得还款，但是一个破产的奉天政府会极大地降低他们声称的政权合法性并败坏我们声称的中日亲善。我们可以选择援助他们。"
 japan_foreign_events.202.a: "我们别无选择。"
 japan_foreign_events.202.b: "这是他们自作自受。"
 japan_foreign_events.203.t: "奉天把白银危机怪罪于我们！"
 japan_foreign_events.203.d: "奉天公开谴责了我国政府，声称当下的危机是一个蓄意的阴谋，目的是利用最近爆发的白银危机败坏他们政府的稳定；他们还提及了当下日本银行和三井银行要求奉天政府用白银储备偿还贷款一事作为依据。鉴于白银储备明显低于奉天政府对外宣称的水平，奉天政府的信誉一落千丈，几个小时内奉天政府的经济就彻底失控。这种愚蠢的推卸责任的反应看起来正像是中国内部政治局势的外在表现。\n\n同样的，我们完全可以回绝这个荒谬的言论，但我们真的会让这种荒谬绝伦的言论逃脱惩罚吗？"
 japan_foreign_events.203.a: "一派胡言！"
 japan_foreign_events.203.b: "惩罚他们！"
 japan_foreign_events.204.t: "[FNG.GetLeader]驱逐了我们的军事特派团"
 japan_foreign_events.204.d: "[FNG.GetLeader]已经驱逐了我们的军事特派团，要求他们在24小时内携带他们的一切物资和财产离境。然而，出乎我们意料的是，随逐客令附带了一份外交信函，其中解释称我们的特派团已经达成了其使命，如今的奉军已具备足够的指挥能力。在过去的几个小时里，奉天大使还花了不少力气试图私下说服外务省，声称这仅仅是由于奉天内部政治事务而不得已为之的办法，奉天对日本不具有任何恶意。\n\n不管是不是如他所言，但是这一举动无疑会削弱我们对奉天政府的影响力。谁敢保证中国人下一步不会做什么出格的事呢？"
 japan_foreign_events.204.d_mantetsu: "[FNG.GetLeader]已经驱逐了我们的军事特派团，要求他们在24小时内离境。然而，出乎我们意料的是，随逐客令附带了一份外交信函，其中解释称我们的特派团已经达成了其使命，如今的奉军已具备足够的指挥能力。\n\n幸运的是，通过满铁，我们对奉天的控制是十分广泛的，几乎可以肯定我们能强迫他们的政府收回决议。这也许会导致他们政府中的爱国者与好战分子强行对我们宣战，而此番后果应该会让他们三思一下。"
 japan_foreign_events.204.a: "宣战。"
 japan_foreign_events.204.b: "强行要求奉天“重新考虑一下”。"
 japan_foreign_events.204.c: "惩罚奉天。"
 japan_foreign_events.204.e: "什么也不做。"
 japan_foreign_events.205.t: "[FNG.GetLeader]驱逐了我们的军事特派团"
 japan_foreign_events.205.d: "[FNG.GetLeader]已经驱逐了我们的军事特派团，要求他们在24小时内离境。这不仅严重威胁到了我们对奉天政府的掌控，也会让朝鲜甚至于日本暴露于危险中。这对于我们的将军们乃至日本人的荣誉感来说都是绝不可接受的。这种忘恩负义的大不敬行为必须受到与之相匹配的惩罚！"
 japan_foreign_events.205.a: "发出最后通牒。"
 japan_foreign_events.205.b: "什么都不做。"
 japan_foreign_events.206.t: "奉天谴责了我们！"
 japan_foreign_events.206.d: "自从1918年以来，鞍山的铁矿石矿藏一直被满铁的一家日资子公司开发，其名为“鞍山制铁所”——并成为了日本在本土列岛以外最重要的钢产地。现在，鞍山制铁所希望扩建，显然它在没有许可的情况下擅自开始扩大矿石开采面，并在这一过程中毁坏了农田，引发了当地中国人的抗议。这些抗议活动最终引发了暴力行为，并使得我们在当地的驻军采取了一些令人遗憾的行动，让一些抗议者丢掉了性命。\n\n奉天政府就此发表了一片冗长的官样文章以谴责我们的行为。我们该如何回复？"
 japan_foreign_events.206.a: "惩罚这一无理举动！"
 japan_foreign_events.206.b: "谴责奉天。"
 japan_foreign_events.206.c: "保持沉默。"
 japan_foreign_events.218.t: "夏威夷接受了我们的提议"
 japan_foreign_events.218.d: "夏威夷已经选择加入我们，他们明智地预见到反抗我们终将是徒劳的，并选择成为我们的盟友。"
 japan_foreign_events.218.a: "好消息！"
 japan_foreign_events.226.t: "日本夺取关岛"
 japan_foreign_events.226.d: "在美国陷入动荡之际，日本采取了大胆举动，派遣了一支海军特遣舰队占领关岛。关岛是马里亚纳群岛的一部分，在美西战争期间被美国占领。马里亚纳群岛的其余岛屿则被出售给德国，并在世界大战期间被日本占领，但最终在战争结束后归还给了德国。\n\n20世纪初，美国在关岛建造了一座加油站、海军陆战队营房和一些岸防炮。然而，华盛顿的政策制定者们怀疑自己在遭遇入侵时保卫关岛的能力，加上与该地区其他大国进行谈判的努力，导致美国未能大规模建设防御工事。关岛被认为对增援菲律宾毫无用处，而且随着美国国内局势的恶化，人们希望德国在附近的驻军能够遏制日军的侵略，直至局势缓和。\n\n随着日军侦察机开始在关岛周围盘旋，获得德国保护的希望破灭了。由于德国舰队距离太远，当地政府不愿在没有柏林进一步命令的情况下挑起太平洋战争，日军因此得以识破美军的虚张声势。尽管如此，人数严重不足的美国驻军在投降前的三天里，仍用轻武器进行了一系列小规模战斗。日本当局已从日本派遣了一支驻军和多名教师，开始对当地土著查莫罗人进行日本化，但预计日方仍会遭到抵抗。"
 japan_foreign_events.226.a: "我们不会忘记这件事。"
 japan_foreign_events.227.t: "日本控制美资汽车公司"
 japan_foreign_events.227.d: "在国家陷入动荡之际，日本控制了几家在日本运营的美国汽车公司。内战导致许多公司失去了与母公司的联系，它们一直在努力为生产线采购零部件。这使得日本人很容易打着“援助”的幌子控制他们。虽然这显然是一种非法行为，但我们除了给他们写一封措辞强硬的信外，没有什么别的办法。"
 japan_foreign_events.227.a: "措辞一定要强硬！"
 japan_foreign_events.230.t: "日本希望和谈"
 japan_foreign_events.230.d.taiwan_kept: "日本人在亚洲大陆的战场上被我们成功击败，他们已经从东北和朝鲜的基地撤退了。我们已经重夺了陆上霸权，而他们没什么希望夺回去，日本国内又舆情不利、担心这场灾难恶化，因此，东京不得不走上谈判桌，但是他们打出了手中的底牌：日本帝国海军。\n\n东京方面以持续封锁相威胁，并声称这次和谈要让中日两个大国都强大到足以抗击西方帝国主义，因此，他们提出了总体上“慷慨”的条件，但老实说不过是承认现状：日本将承认我们对中国大陆的所有权、归还所有“租界”并放弃朝鲜，而我们将从其他被占领的[JAP.GetFactionName]成员国中撤出；中日签署互不侵犯条约，日本将避免干涉中国事务；但值得注意的是，日本人打算执意继续占有台湾岛。\n\n鉴于目前我们无力挑战日本的海权，我国政府也面临着各种其他问题，如果想要谨慎行事，可能就得签署这份协议，毕竟日本要封锁我国海岸线固然困难，但确实会严重破坏我国的贸易和经济稳定。但是，台湾是中国不可分割的领土，甲午战争后被可耻地割让给日本人，如果我们要争取对日战争的彻底胜利，可能还要花上数年，我们是否要为统一而继续战争呢？"
 japan_foreign_events.230.d.taiwan_handed_over: "日本人在亚洲大陆的战场上被我们成功击败，他们已经从东北和朝鲜的基地撤退了。多年来，由于我国或他国的各种行动，日本的海军实力同样有所下降，这使得他们几乎无法寻求更有利的条件。我们重夺了陆上霸权，而他们没什么希望夺回去，日本国内又舆情不利、担心这场灾难恶化，因此，东京不得不走上谈判桌。\n\n他们决心挽回颜面、减少损失，因此提出了协议，“让中日两个大国都强大到足以抗击西方帝国主义”，但老实说，他们的条件不过是承认现状：日本将承认我们对中国大陆的所有权、归还所有“租界”并放弃朝鲜和台湾，而我们将从其他被占领的[JAP.GetFactionName]成员国中撤出；中日签署互不侵犯条约，日本将避免干涉中国事务。\n\n鉴于进攻日本本土在后勤上存在困难，我国政府也面临着各种比彻底击败日本更紧迫的问题，如果想要谨慎行事，可能就得签署这份协议。从另一方面来说，只要日本仍然是一个大国，就会威胁我国的领土完整，因此一些强硬派建议我们继续战争，彻底击败日本，解散[JAP.GetFactionName]。"
 japan_foreign_events.230.d.taiwan_occupied: "日本人在亚洲大陆的战场上被我们成功击败，他们已经从东北和朝鲜的基地撤退了。多年来，由于我国或他国的各种行动，日本的海军实力同样有所下降，这使得他们几乎无法寻求更有利的条件。我们重夺了陆上霸权，而他们没什么希望夺回去，日本国内又舆情不利、担心这场灾难恶化，因此，东京不得不走上谈判桌。\n\n他们决心挽回颜面、减少损失，因此提出了协议，“让中日两个大国都强大到足以抗击西方帝国主义”，但老实说，他们的条件不过是承认现状：日本将承认我们对中国大陆的所有权、归还所有“租界”并放弃朝鲜和台湾，而我们将从其他被占领的[JAP.GetFactionName]成员国中撤出；中日签署互不侵犯条约，日本将避免干涉中国事务。\n\n鉴于进攻日本本土在后勤上存在困难，我国政府也面临着各种比彻底击败日本更紧迫的问题，如果想要谨慎行事，可能就得签署这份协议。从另一方面来说，只要日本仍然是一个大国，就会威胁我国的领土完整，因此一些强硬派建议我们继续战争，彻底击败日本，一劳永逸地解散[JAP.GetFactionName]。"
 japan_foreign_events.230.d.no_taiwan: "日本人在亚洲大陆的战场上被我们成功击败，他们已经从东北和朝鲜的基地撤退了。我们已经重夺了陆上霸权，而他们没什么希望夺回去，日本国内又舆情不利、担心这场灾难恶化，因此，东京不得不走上谈判桌，但是他们打出了手中的底牌：日本帝国海军。\n\n东京方面以持续封锁相威胁，并声称这次和谈要让中日两个大国都强大到足以抗击西方帝国主义，因此，他们提出了总体上“慷慨”的条件，但老实说不过是承认现状：日本将承认我们对中国大陆的所有权、归还所有“租界”并放弃朝鲜，而我们将从其他被占领的[JAP.GetFactionName]成员国中撤出；中日签署互不侵犯条约，日本将避免干涉中国事务；但值得注意的是，台湾岛已被外部势力从日本手中夺取，因此台湾问题将改日解决。\n\n鉴于进攻日本本土在后勤上存在困难，我国政府也面临着各种比彻底击败日本更紧迫的问题，如果想要谨慎行事，可能就得签署这份协议。从另一方面来说，只要日本仍然是一个大国，就会威胁我国的领土完整，因此一些强硬派建议我们继续战争，彻底击败日本，一劳永逸地解散[JAP.GetFactionName]。"
 japan_foreign_events.230.a: "让那些倭寇待在他们可怜的“本土”小岛上吧。"
 japan_foreign_events.230.b: "我们要把旗帜插到东京！"
 japan_foreign_events.231.t.peace: "与中国达成和平"
 japan_foreign_events.231.d.peace_taiwan_kept: "鉴于帝国陆军从中国大陆撤退，且这场冲突持续加重了我们的经济负担，我国政府决定转变策略。帝国海军将会保护水路并封锁中国海岸线，阻止国家进一步受辱，也同时让我们在谈判中有了一些筹码。因此，我们要寻求一个最谨慎的方针，即拟一份可行的和平协议。\n\n经过长时间的考虑，中国人答应了我们的条件。我们将承认他们对满洲和朝鲜的占领，并撤回我们对领土的宣称、归还租借的土地。不过，我们得以保留台湾，这是一座中国人宣称主权，却早已因先前日清战争中我们成功的表现而在马关条约中被割让给我们的巨大岛屿。\n\n虽然这个结果很令人痛苦，不过至少避免了一场旷日持久、劳民伤财的冲突。我们将与中国人签订一条互不侵犯条约，以期在未来建立更加和平的关系。"
 japan_foreign_events.231.d.peace_taiwan_handed_over: "鉴于帝国陆军从中国大陆撤退，且这场冲突持续加重了我们的经济负担，我国政府决定转变策略。帝国海军在封锁中国海岸线的过程中同样遭遇了许多麻烦，这也让我们在谈判中进一步丧失了筹码。因此，我们要寻求一个最谨慎的方针，即拟一份可行的和平协议。\n\n经过长时间的考虑，中国人答应了我们的条件。我们将承认他们对满洲和朝鲜的占领，并撤回我们对领土的宣称、归还租借的土地。不幸的是，割让的领土包括台湾，这是一座中国人宣称主权却早已在马关条约中被割让给我们的巨大岛屿。虽然我们仍维持着对它的占领，但是我国目前舰队的力量是贫弱的，将它还给中国人可以防止西方帝国主义者或者其他侵略者再来节外生枝。\n\n虽然这个结果很令人痛苦，不过至少避免了一场旷日持久、劳民伤财的冲突。我们将与中国人签订一条互不侵犯条约，以期在未来建立更加和平的关系。"
 japan_foreign_events.231.d.peace_taiwan_occupied: "鉴于帝国陆军从中国大陆撤退，且这场冲突持续加重了我们的经济负担，我国政府决定转变策略。帝国海军在封锁中国海岸线的过程中同样遭遇了许多麻烦，这也让我们在谈判中进一步丧失了筹码。因此，我们要寻求一个最谨慎的方针，即拟一份可行的和平协议。\n\n经过长时间的考虑，中国人答应了我们的条件。我们将承认他们对满洲和朝鲜的占领，并撤回我们对领土的宣称、归还租借的土地。不幸的是，割让的领土包括台湾，这是一座中国人宣称主权却早已在马关条约中被割让给我们的巨大岛屿。中国人已经将其占领，这大大削弱了我们在南部的力量投射。这座岛屿掌握在中国人手里至少可以防止西方帝国主义者或者其他侵略者再来节外生枝。\n\n虽然这个结果很令人痛苦，不过至少避免了一场旷日持久、劳民伤财的冲突。我们将与中国人签订一条互不侵犯条约，以期在未来建立更加和平的关系。"
 japan_foreign_events.231.d.peace_no_taiwan: "鉴于帝国陆军从中国大陆撤退，且这场冲突持续加重了我们的经济负担，我国政府决定转变策略。帝国海军在封锁中国海岸线的过程中同样遭遇了许多麻烦，这也让我们在谈判中进一步丧失了筹码。因此，我们要寻求一个最谨慎的方针，即拟一份可行的和平协议。\n\n经过长时间的考虑，中国人答应了我们的条件。我们将承认他们对满洲和朝鲜的占领，并撤回我们对领土的宣称、归还租借的土地。双方已经交换俘虏，这样我们的军队就可以腾出时间来保卫我们自己的家园。\n\n虽然这个结果很令人痛苦，不过至少避免了一场旷日持久、劳民伤财的冲突。我们将与中国人签订一条互不侵犯条约，以期在未来建立更加和平的关系。"
 japan_foreign_events.231.a: "而战局未必好转，世界大势亦不利我。"
 japan_foreign_events.231.t.no_peace: "拒绝和谈"
 japan_foreign_events.231.d.no_peace: "显然，中国对我们恨之入骨，干脆地回绝了我们的和谈请求。尽管在大陆上一再受挫，但我们唯有孤注一掷，谋求击垮中国。这意味着东亚即将迎来两个国家之间的总力战（全面战争），而这场战争看起来不会轻易结束。"
 japan_foreign_events.231.b: "已经到了生死存亡之时。"
 japan_foreign_events.232.t: "第二次中日战争结束"
 japan_foreign_events.232.d: "甲午战争对我们的国家来说是奇耻大辱。现在，日本侵略者已经被赶出去了，我们终于为甲午的前辈们报了心头之恨。我们再也不会让帝国主义列强插手我们国家的事务，中国也不再会受奴役与支配了，因为中华民族从此站起来了！"
 japan_foreign_events.232.a: "万岁！"
 japan_foreign_events.233.t: "[FROM.GetNameDefCap]拒绝和平"
 japan_foreign_events.233.d: "[FROM.GetNameDefCap]已经拒绝了我们的和谈请求。考虑到中国人没有像样的海军，他们想要接近我们的海岸将难如登天。然而，在陆地上对阵中国人绝非易事，因为我们已经在大陆上遭受了巨大的失败。赢得这场战争对我们来说将变得十分困难。"
 japan_foreign_events.233.a: "我们将战至最后一卒，决不投降！"
 japan_foreign_events.238.t: "日本提出和平条件"
 japan_foreign_events.238.d: "在被俄国军队完全羞辱之后，日本提出了有条件投降，宣称将从他们非法占领的俄罗斯领土上全面撤离。他们的海军除了封锁我们在太平洋上的港口外便无能为力，而他们的陆军也几乎被全部歼灭。许多军界和政界要员都主张我们应当接受这份条款，而小部分人认为，考虑到我们在工业上对日本的全面优势，我们应当试图获取全面胜利。"
 japan_foreign_events.238.a: "奉天之仇已报，我们接受他们的条款。"
 japan_foreign_events.238.b: "在我军踏入东京的废墟之前，我们绝不停战。"
 japan_foreign_events.239.t: "俄罗斯接受和谈"
 japan_foreign_events.239.d: "俄罗斯巨熊已经接受了我们的有条件投降，允许我们的军队撤出亚洲大陆并安全返回本岛。尽管这是一场耻辱的失败，但至少不是全面的战败。至少我们保证了自己的独立免受欧洲帝国主义的染指。"
 japan_foreign_events.239.a: "至少我们的小伙子们平安到家了。"
 japan_foreign_events.240.t: "与日落之国的和平"
 japan_foreign_events.240.d: "懦弱的大和民族已因战败蒙羞，日出之地的太阳已经不可挽回地落下了。在我们的钢铁之师的猛烈炮火下，东亚的武士倒下了。我们骄傲的士兵现在能够将这些日本侵略者赶回他们那可悲的“本土列岛”，并解放成千上万之前与祖国分离的俄国人。万岁俄罗斯，统一而团结！"
 japan_foreign_events.240.a: "万岁！"
 japan_foreign_events.241.t: "俄罗斯拒绝议和"
 japan_foreign_events.241.d: "俄罗斯巨熊已经拒绝了我们的有条件投降，声称他们将“不会让在战场上的败者来起草和平条约”。尽管我们已经输了陆战，我们仍然能在海上让他们死无葬身之地，当然，在本土列岛也是一样。就像我们800年前抵御蒙古鬼一样，俄罗斯人也会遭遇我们的神风！"
 japan_foreign_events.241.a: "我们将战至最后一卒，决不投降！万岁！(萬歲！)"
 japan_foreign_events.251.t: "日本崩溃"
 japan_foreign_events.251.d: "忆往昔，大日本帝国气势雄浑、兵强马壮，执掌东亚，八纮一宇，似乎注定要在亚洲打断西方帝国主义的脊梁骨。世事变迁，沧海桑田。随着日本总司令部投降，尽管亚洲各地仍有零零散散的部队在死抗，[JAP.GetFactionName]终于黄粱一场。如今我们只能踽踽独行，独自奋斗，自己的命运就由自己来选择。"
 japan_foreign_events.251.a: "我还以为他们会更能打一点的……"
 japan_foreign_events.259.t: "新皖系放弃复国战争"
 japan_foreign_events.259.d: "新皖系放弃了参与复国战争的计划，而奉天政府也同他们划清了界限。我们得停止为其输送援助。"
 japan_foreign_events.259.a: "就这样吧。"
 japan_foreign_events.260.t: "新皖系放弃复国战争"
 japan_foreign_events.260.d: "新皖系放弃了参与复国战争的计划，但是奉天政府决意不中止他们的重建项目，看起来一切还能照旧进行下去。"
 japan_foreign_events.260.a: "很高兴听到这个消息。"
 japan_foreign_events.261.t: "新皖系放弃复国战争"
 japan_foreign_events.261.d: "新皖系放弃了参与复国战争的计划，但是奉天政府决意不中止他们的重建项目，而新皖系不顾一切地自行中止了合作。"
 japan_foreign_events.261.a: "真是白费力气。"
 japan_foreign_events.316.t: "日本开进太平洋"
 japan_foreign_events.316.d: "日本大使镇定自若的手秉一份电文迈入了[Root.GetLeader]的办公室：一支日本舰队正奉命开赴夏威夷，数小时后他们就会登陆夏威夷创立一个“安全带”。日本大使表示，确保当下席卷美国的政治风波不蔓延至境外符合泛太平洋人民的最大利益，所以日本将主动承担责任，保障泛太地区的和平与稳定。他表示，为了太平洋两岸免受战火的荼毒，希望美方以泛太人民的最大利益为重，同日方合作，并邀请美方派遣代表赴夏威夷，确保权力的和平交接。这一明目张胆的夺权行为显然不应被我们默许，但美国当下的乱局使得我国高官无不怀疑火奴鲁鲁驻军是否有能力挡住侵略军。内阁中的鹰派坚称内战很快就将平息，而后我们的援军就会上路，何况在撞上美国人的坚定意志后日本人八成会缩回去。而其他人则呼吁冷静，并希望说服[Root.GetLeader]等美国局势彻底稳定后再向日本复仇。现在是时候让总统决定是否撤出我们的太平洋驻军了。很显然，这一决定会极大地影响到太平洋的未来。"
 japan_foreign_events.316.a: "我们会回来的……"
 japan_foreign_events.316.b: "伙计们，全副武装，上战场！"
 japan_foreign_events.317.t: "美国人交出太平洋"
 japan_foreign_events.317.d: "我们在太平洋大博弈中取得了完全胜利！由于当下美国国内的政治风波，也由于缺少控制太平洋地区的政治动力，美国政府决定认可我们对太平洋地区的主导权，并将美国的各个岛屿基地转交给我们。虽然一些美国人把我们的举动称之为“背叛”，但他们的声音早就被更现实的祝捷声压过。一个代表团现已奔赴火奴鲁鲁，同美国官员进行交涉，确保权力的和平交接。我们的部队兵不血刃地踏上了夏威夷。虽然美国人坚称这是一种“临时性”的措施，但这无疑是我国寻求扩张势力范围的巨大胜利。不过，我国政府内的一些人私下里在质疑，我们的步子是不是迈得太大了：我们的扩张是否会导致政府机关超负荷运转？美国人有朝一日是否会寻求复仇？虽然如此，失败主义在当下没有市场——日本正大踏步向前迈进，日本将为亚洲履行其天命！"
 japan_foreign_events.317.a: "极好！(素晴らしい！)"
 japan_foreign_events.318.t: "美国反抗！"
 japan_foreign_events.318.d: "太平洋危机不断升级！尽管北美陷入政治动乱，但顽固的美国政府拒绝放松对太平洋的控制，并扬言将对任何试图破坏美国主权的行为进行严正回击。果然只有这帮殖民者才会摆出如此傲慢无礼的态度，但他们的态度却把我们推到了油锅上。无疑，我们可以用武力夺取美属太平洋岛屿，但一些人对我国海军是否有能力连续保卫这些群岛达数年提出了疑问。合众国无疑是一个不容小觑的对手，一些人甚至把他称呼为沉睡的巨人。不过，还有些人强调了劈艰克难的大和魂，1895年是大和魂让中国龙屈服，1905年是大和魂让俄罗斯巨熊被赶出了满洲。在美国最为虚弱的当下，吞下这一苦果的耻辱将比投降更可耻，还会让世人永远认为日本只配做太平洋第二把交椅。因此，现在日本站到了十字路口——日出之国，路在何方？"
 japan_foreign_events.318.a: "虎！虎！虎！"
 japan_foreign_events.318.b: "召回舰队，小不忍则乱大谋。"
 japan_foreign_events.401.t: "一份来自[From.GetNameDef]的邀请"
 japan_foreign_events.401.d.conf: "在东京会议上，日本官员提出了加深两国经济联系的想法。现在他们又一次接触[Root.GetAdjective]政府，提出让我们加入所谓的“共荣圈”的经济合作领域。他们说我们有权根据自己意愿同意或拒绝。"
 japan_foreign_events.401.d.noconf: "日本政府同我们作了接触，提出让我们加入“大东亚共荣圈”的经济合作。加入其中后，我们将会放宽日本对[Root.GetNameDef]投资的限制，随着投资还能获得经济繁荣并独立于“西方帝国主义”。但是，从某种意义上来说，这只不过是将帝国主义者从欧洲人换成了日本人，我们应该小心的开启这个潘多拉魔盒以免事态失控。"
 japan_foreign_events.401.a: "我们同意他们的请求。"
 japan_foreign_events.401.b: "我们不需要如此。"
 japan_foreign_events.402.t: "[From.GetNameDefCap]同意了"
 japan_foreign_events.402.d: "[From.GetAdjective]政府参透了我们提案中的智慧和经济上的好处，已经成为了我们经济共荣圈的一员。他们同意了我们的条件。"
 japan_foreign_events.402.a: "太好了。"
 japan_foreign_events.403.t: "[From.GetNameDefCap]拒绝了"
 japan_foreign_events.403.d: "[From.GetAdjective]政府，或许是怀疑我们的真实动机，已拒绝加入日本经济共荣圈的提议。"
 japan_foreign_events.403.a: "不明智的决定。"
 japan_foreign_events.405.t: "日本投资增长"
 japan_foreign_events.405.d: "有了[From.GetAdjective]政府的积极鼓励，来自[From.GetNameDef]的投资者云集[Root.GetNameDef]。无疑，他们的出现必然带来了利润；然而，随着[From.GetAdjective]经济的主导权不断增长，越来越多人担心我们最终将会被[From.GetAdjective]政府彻底控制……如果我们还尚未被控制的话。"
 japan_foreign_events.405.a: "投资者约等于钱，对吧？"
 japan_foreign_events.406.t: "投资者修建工厂"
 japan_foreign_events.406.d: "位于[Root.GetNameDef]的日本投资者正忙于创设新工厂——这似乎是我们共同参与亚细亚共荣圈的红利，至少看起来是这样的。"
 japan_foreign_events.406.a: "这真不错！"
 japan_foreign_events.407.t: "[Root.GetAdjective]屈从于日本"
 japan_foreign_events.407.d: "如果有人还在担心日本对[Root.GetNameDef]的持续投资会导致他们的主导地位，那么这些人悬着的心可以放下了——担心如今成为现实。[Root.GetAdjective]的政策正循规蹈矩的取悦于日本人的利益，而我们任何关于独立的想法随着时间变化都慢慢化作了政治画皮。来自[From.GetNameDef]的一小批“顾问”已经打消了我们在共荣圈内任何想要自行其是的想法。"
 japan_foreign_events.407.a: "就这样吧。"
 japan_foreign_events.408.t: "[From.GetNameDefCap]终止联盟"
 japan_foreign_events.408.d: "愚蠢的[From.GetAdjective]政府选择结束同我们的军事同盟。看起来他们觉得，不靠我们也能成功。"
 japan_foreign_events.408.a: "我们走着瞧。"
 japan_foreign_events.409.t: "[From.GetNameDefCap]退出共荣圈"
 japan_foreign_events.409.d: "被一些害怕我们控制其内政的非理性想法吓趴后，[From.GetAdjective]政府决定终止同亚细亚共荣圈的合作，切断[From.GetAdjective]经济同我们的联系。"
 japan_foreign_events.409.a: "太愚蠢了。"
 japan_foreign_events.410.t: "[From.GetAdjective]投资被国有化"
 japan_foreign_events.410.d: "[From.GetAdjective]政府一意孤行地采取了措施，强行将我们对[From.GetNameDef]的投资进行了国有化，同时也一并退出了共荣圈。或许他们是担心日本控制他们经济命脉？如果是这样，那么他们就落了给我们入侵的借口——如果我们想反击这一挑衅行为的话。"
 japan_foreign_events.410.a: "随他们去吧。"
 japan_foreign_events.410.b: "给他们一个教训！"
 japan_foreign_events.411.t: "[withdraw_country.GetNameDefCap]离开经济共荣圈"
 japan_foreign_events.411.d: "一度加入过[withdraw_country.GetFactionName]，[withdraw_country.GetNameDef]如今不再被视作是我们经济势力圈的一分子。他们必须离开了。"
 japan_foreign_events.411.a: "愚蠢的举动。"
 japan_foreign_events.412.t: "退出日本势力圈"
 japan_foreign_events.412.d: "随着我们加入了[Root.GetFactionName]，我们不再被视作是日本经济共荣圈的一分子。"
 japan_foreign_events.412.a: "就这样吧！"
 japan_foreign_events.420.t: "投资者建造船坞"
 japan_foreign_events.420.d: "[Root.GetNameDef]的日本投资者一直在忙于营建新船坞——看来，参与亚细亚共荣圈可以为我们带来可观的收益。"
 japan_foreign_events.420.a: "好极了！"
 japan_foreign_events.421.t: "日本派出海军顾问"
 japan_foreign_events.421.d: "作为日本帝国资助的海军发展计划的一部分，一批日本顾问已前来援助我们的海军项目。他们在许多方面都十分博学，所以我们应当考虑把他们派到何处能让其发挥最大作用。"
 japan_foreign_events.421.a: "让他们援助我国工程师。"
 japan_foreign_events.421.b: "我们应当利用起他们的专业知识。"
 japan_foreign_events.421.c: "最好让他们在培训课中为我们提供一些实践经验。"
 japan_foreign_events.422.t: "第一批繁荣之船"
 japan_foreign_events.422.d: "赴[Root.GetNameDef]的日本工程师正忙于教授我们的船厂工人如何建造号称“繁荣之船”的现代日本货船——看来这是我们投身亚细亚共荣圈的一项重要回报。"
 japan_foreign_events.422.a: "好消息！"
 japan_foreign_events.423.t: "日本希望控制我们的船坞"
 japan_foreign_events.423.d: "日本海陆军官员于今晨正式要求控制我国境内一切由日本建造的船厂。他们的理由是，在当下这一艰难的战时境遇下，海军生产必须由日本大本营统筹。"
 japan_foreign_events.423.a: "好极了。"
 japan_foreign_events.423.b: "他们以为他们是谁？"
 japan_foreign_events.424.t: "日本将船坞归还给我们"
 japan_foreign_events.424.d: "由于我们共同的威胁已不复存在，日本再无任何控制我国船厂的合法理由，因此向我们移交了先前被其控制的船厂。"
 japan_foreign_events.424.a: "的确令人惊讶，我们为此表示欢迎。"
 japan_foreign_events.425.t: "[From.GetNameDefCap]请求派遣海军顾问"
 japan_foreign_events.425.d: "今晨，我们收到了来自[From.GetNameDef]的请求，希望我们能派遣顾问来帮助他们发展海军。"
 japan_foreign_events.425.a: "不错的提议。"
 japan_foreign_events.425.b: "哦，我可不觉得。"
 japan_foreign_events.426.t: "日本拒绝了我们的请求"
 japan_foreign_events.426.d: "不幸的是，日本拒绝向我们派遣海军顾问。"
 japan_foreign_events.426.a: "真是耻辱。"
 japan_foreign_events.427.t: "[From.GetNameDefCap]拒绝控制船坞"
 japan_foreign_events.427.d: "我们想要控制我国创设的船厂的要求已被回绝，这真是胆大妄为。尽管为此立刻做出反应在外交上显得不甚明智，但我们可不会忘记这次背叛。他们会后悔的。"
 japan_foreign_events.427.a: "这就是“盟友”吗？"
 japan_foreign_events.450.t: "日本禁运[Root.GetNameDef]！"
 japan_foreign_events.450.d: "数月以来我们都在关注着日本的野心以及他们对南太平洋的侵略行动，现在我们的担心有了依据。他们已经表明了意图，要求他们的经济影响势力圈内的所有成员立刻终止同[Root.GetNameDef]的贸易，并宣布我们是“欧洲殖民主义和帝国主义位于亚洲的前哨站”。这对我们造成的经济压力不可低估……"
 japan_foreign_events.450.a: "我们会撑过去的。"
 japan_foreign_events.450.b: "这意味着贸易战！"
 japan_foreign_events.450.c: "我们应该向日本靠拢。"
 japan_foreign_events.451.t: "[From.GetNameDefCap]报复！"
 japan_foreign_events.451.d: "[From.GetAdjective]政府已经对我们提高了关税！这正好给了我们梦寐以求的宣战借口！"
 japan_foreign_events.451.a: "确实，但是时候未到……"
 japan_foreign_events.451.b: "以军事行动为回应！"
 japan_foreign_events.452.t: "[From.GetNameDefCap]寻求紧密联系"
 japan_foreign_events.452.d: "作为对我们禁运的回应，[From.GetAdjective]政府寻求成为我们经济共荣圈一分子，显然他们觉得同皇国合作远比对抗皇国要好得多！"
 japan_foreign_events.452.a: "更好了！"
 japan_foreign_events.453.t: "[From.GetNameDefCap]无动于衷"
 japan_foreign_events.453.d: "懦弱的[From.GetAdjective]政府对我们的禁运不作任何回应。他们选择硬抗过去。如果我们想对他们开战，那么我们得要多花点手段了。"
 japan_foreign_events.453.a: "行吧！"
 japan_foreign_events.455.t: "日本似乎在筹划攻击"
 japan_foreign_events.455.d: "我们搜集到一系列情报，表明日本正尝试夺取我们位于荷属东印度群岛的殖民地。我们的军事专家警告称，考虑到日本与我们的国力对比、日本帝国军队同我国陆海军的体量对比，我们大概抵抗不了这样的入侵。\n\n他们建议我们立刻知会德皇，乞求他们的援助：他们追求“维持现状”的战略利益同我国的利益一致，若是日本人接管了荷属东印度，那么他们在远东的财产也会受到威胁。这可能是我们想存续殖民地的最佳机会。"
 japan_foreign_events.455.a: "致电柏林！"
 japan_foreign_events.455.b: "这肯定是杞人忧天……"
 japan_foreign_events.456.t: "尼德兰人求助"
 japan_foreign_events.456.d: "尼德兰人发现了一批有关日本正策划入侵他们殖民地的证据；因为他们的殖民地驻军过于分散，他们的海军比之日本太过弱小，尼德兰人确信自己无力保卫自己的殖民地。不过，他们指出，日本若占领了他们的殖民地将会严重削弱我国殖民地的防御，何况毫无疑问的是日本人一直谋求把我们从该地区一同赶出去！"
 japan_foreign_events.456.a: "我们会出手相助！"
 japan_foreign_events.456.b: "尼德兰木鞋佬本就不该有殖民地……"
 japan_foreign_events.457.t: "德国伸援"
 japan_foreign_events.457.d: "鉴于日本人意图夺取我们的殖民地，德国人同意和我们协作，保护荷属东印度群岛免受日本人威胁。"
 japan_foreign_events.457.a: "为我们的朋友干杯！"
 japan_foreign_events.458.t: "德国拒绝保护我们！"
 japan_foreign_events.458.d: "德国人知会我们，保护我们在东印度群岛的殖民领不符合他们的最高利益。我们得独自奋战了！"
 japan_foreign_events.458.a: "我们能够独自保护东印度群岛的……对吧？"
 japan_foreign_events.459.t: "[From.GetNameDefCap]孤立无援"
 japan_foreign_events.459.d: "由于列强不愿或无力伸出援手，[From.GetNameDefCap]现在孤立无援。他们的军队孱弱不堪，他们的领袖软弱无能，现在任何人都不能阻止我们了。"
 japan_foreign_events.459.a: "万岁！(萬歲！)"
 japan_foreign_events.460.t: "印度尼西亚在德国的支持下反抗"
 japan_foreign_events.460.d: "德国人同意协助保护兰领东印度免遭我们攻击！虽然我们依然可以发动攻击，但我们在动刀兵之前或许要三思一下。"
 japan_foreign_events.460.a: "我们绝不动摇。"
 japan_foreign_events.460.b: "时机未至。"
 japan_foreign_events.461.t: "日本推行分而治之战略"
 japan_foreign_events.461.d: "看起来日本长期以来对我政府的合法性支持，乃至于所谓“亲如手足的亚洲兄弟”宣传，只停留在他们的嘴皮子层面上。他们现在正朝着把中国分而治之的道路上前行。把我们的中国分之，治之。虽然这意味着双方之间的战争可能会比我们预料的到来更早，但至少他们这么做也损害了协和会的基本盘，让我们的操作空间更宽松了。"
 japan_foreign_events.461.a: "他们会后悔的。"
 japan_foreign_events.462.t: "日本对经济的剥削"
 japan_foreign_events.462.d: "日本人在拿下北京和南京后，加大了对中国东北的剥削掠夺。这似乎是日本预备在全中国推行的占领政策预演——而我们也可能成为日人之奴仆。这种前所未有的野蛮政策难以容忍，我们决不能与之同流合污。亲日的协和会对此事的解释苍白无力，其代表的日本影响力也势必减少。"
 japan_foreign_events.462.a: "我们必须认定思索一条新战略方向。"
 japan_foreign_events.464.t: "日本犒劳了我们的忠心"
 japan_foreign_events.464.d: "日本政府明智地决定回报我们的忠诚，他们归还了我国的各正当领土。尽管我们当然为这一行为感到开心，但是我们也必须留心三分；由于日本人的行为，协和会获得了许多支持，这意味着若是将来我们想要反抗日本人的话会困难许多。"
 japan_foreign_events.464.a: "那些土地本就属于我们，借花献佛罢了。"
 japan_foreign_events.465.t: "敌人大兵压境"
 japan_foreign_events.465.d: "如今，世人皆知敌众我寡。最初仅存在于情报部门中的流言也逐一变成了现实。尽管我们仍能维持公众乐观之心态，然当下虽帝国最坚定之士亦就持久作战于国于民是否有利发出疑问。我们只是在竭力拖延败北日期吗？"
 japan_foreign_events.465.a: "现在仍不是回天乏术……"
 japan_foreign_events.466.t: "我军有着压倒性力量"
 japan_foreign_events.466.d: "对敌我双方来说，我军数目压倒日军已是板上钉钉。随着这一消息已传到日本大众之中，他们的不满与日俱增，日本政府也摇摇欲坠。如果我们能继续维持优势，他们肯定能比我们设想中投降的更早。"
 japan_foreign_events.466.a: "真是个好消息！"
 japan_foreign_events.467.t: "日本扩大宣传运动"
 japan_foreign_events.467.d: "在战胜其他自封的“中央政府”军队，尤其是攻克北京和南京之后，日本人开始呼吁敌军放下武器、和平地加入我们。他们的宣传机器马力全开，赞扬[FNG.GetLeader]是全中国的唯一领袖，嘲笑其他“中央政府”不过是中饱私囊的小小军阀。日本对我们释放的善意固然好，却只会让政府中亲日派的声浪再高一分，他们指出，此举证明日本是值得信赖的必要盟友。"
 japan_foreign_events.467.a: "明白。"
 japan_foreign_events.500.t: "孙基祯和南昇龙"
 japan_foreign_events.500.d: "1936年的奥运会已落下帷幕，我们有理由为之庆贺。奥运健儿为帝国争得了九块奖牌，创下了喜人的新记录……不过这次奥运赛场上的一些胜利似乎……出了乱子。运动员孫基禎(そん きてい)和南昇竜(なん しょうりゅう)——啊，或者按他们自己的叫法，孙基祯(Sohn Kee-Chung)和南昇龙(Nam Sung-Yong)——他们在马拉松比赛中表现出色，孙基祯甚至取得了马拉松冠军，但却根本没有体现出作为天皇陛下之臣民所应具备的教养。在颁奖典礼时，他们不仅低头侧目，遮挡了胸前的日之丸，还坚称自己是朝鲜人而非日本人。国内不少人声称他们的行为让自己颇为受辱，与之相反的是，他们的举动在朝鲜却广受追捧。最终，帝国政府发令禁止这二人以后参与任何体育赛事，并安排专人对其进行监视。如果所谓的奖牌将导致帝国内部动荡，那这奖牌不要也罢！\n\n外务省同样已对爱尔兰政府及国际奥组委提出抗议，试图在确保此事不会让“友邦惊诧”的同时，指斥其安排运动员代表帝国参赛的工作产生了重大疏漏。不过他们目前还未对此事发表评论。"
 japan_foreign_events.500.a: "真不幸。"
 japan_foreign_events.550.t: "与[JAP.GetNameDef]联合军演"
 japan_foreign_events.550.d: "自从在日本建立了一个友好政府以来，我们的最高指挥部一直热衷于抓住机会去研究旧日本帝国陆海军的战术，特别是海上登陆和两栖作战这两方面。对此最好的提案是举办联合军演，当然，这也能使正在重建的[JAP.GetName]自卫队受益。因此，在几个月的计划后，双方成功于上周进行了一次演习。在为期三天的演习中，一支军级部队被指派了登陆并夺取岸边关键战略点，并保卫这一新建立的滩头阵地的训练任务。我们的士兵扮演了进攻方，而日方顾问则对每个师都传授了相关战争经验。\n\n而仅仅几年前，即使乐天派也无法想象，我们双方的部队能在一场只存在虚构子弹的演习中相遇，或者是用仓促准备好的字典手册进行连蒙带猜的对话，双方的交流会在如此友好的气氛中进行。"
 japan_foreign_events.550.a: "将棋？和象棋有关系吗……？"
 japan_foreign_events.604.t: "日本宣传运动"
 japan_foreign_events.604.d: "占领北京和南京后，日本人一直在扩大宣传活动，以泛亚之名兜售“和平”。虽然我们知道他们在撒谎，但这种宣传还是影响了民众。"
 japan_foreign_events.604.a: "国之不幸。"
 japan_foreign_events.605.t: "日本宣传运动"
 japan_foreign_events.605.d: "占领北京和南京后，日本人一直在扩大宣传活动，呼吁“中日和平和解”，消除“两个伟大国家”间的误解。虽然我们知道他们在撒谎，但这种宣传还是影响了部分军民。"
 japan_foreign_events.606.t: "日本宣传运动"
 japan_foreign_events.606.d: "占领北京和南京后，日本人一直在扩大宣传活动，呼吁“和平”，以及“军阀下台，中国才能再次统一”。虽然我们知道他们在撒谎，但这种宣传还是影响了部分军民。"
 japan_fengtian_events.4.t: "日本发动一号作战"
 japan_fengtian_events.4.d: "今天上午，日本军事代表团团长宣布，中国名义上的政府之间爆发了战争，暗示日本将在动荡不安的中国政坛发挥积极作用。关东军正在中国东北发起行动，捍卫日本的利益，因此日本要求我政府立即采取措施，满足日本的补给和军事需求。\n\n此外，我们要参与中日战争。日本政府一直在对华计划的影响上含糊其辞，但他们邀请我们加入他们的大泛亚联盟，敦促我们加入对抗中国政府的战争，以促进亚洲的和平与安全，防止西方帝国主义进一步利用中国。虽然这意味着我们反而要和日本人联手对付中国同胞，但由于内部有日本影响存在，他们的威胁离我们如此之近，我们似乎没有太多选择。"
 japan_fengtian_events.4.a: "好吧。"
 japan_fengtian_events.5.t: "闲院宫载仁亲王准备访问奉天政府"
 japan_fengtian_events.5.d: "天皇的叔祖闲院宫载仁亲王通知政府，他打算对以满洲为基地的[FNG.GetLeader]政府进行国事访问。这并不是闲院宫亲王第一次访问[716.Controller.GetVictoryPointName_11771]，但如今，奉天政府布武全中国的雄心越来越有可能实现，亲王有兴趣视察一下他们为此做的准备工作。\n\n政府已经批准了亲王的访问请求，并开始为访问细节做准备，但很多人担心，这次访问远没有例行公事走个过场这么简单，中国不乏激进分子，近几年已有许多人因此遭逢不幸，特别是在奉天；而许多激进分子肯定不会放过这次伤害日本皇室成员的机会。为了保证这种事情不会发生，精确的细节和行程会严格保密，政府已经通过驻[716.Controller.GetVictoryPointName_11771]领事馆致信[FNG.GetLeader]，警告他别把事情搞砸，当然，要尽可能使用外交辞令。"
 japan_fengtian_events.5.a: "如果张作霖识相点，亲王的访问就能顺利完成。"
 japan_fengtian_events.6.t: "奉天中止了亲王的访问"
 japan_fengtian_events.6.d: "奉天政府以“可能有尚未破获的暗杀阴谋”为由，突然取消了闲院宫亲王余下的访问行程。在数小时内，亲王就乘上了回日本的船，据报告，他在言谈中透露出对[FNG.GetLeader]无法确保行程安全的蔑视。"
 japan_fengtian_events.6.a: "真不幸，不过至少他没事。"
 japan_fengtian_events.7.t: "亲王的访问中止"
 japan_fengtian_events.7.d: "鉴于奉天政府已处于战争状态，奉日双方一致决定中止闲院宫亲王的访问。这主要是出于安全考虑，但更大的原因是，亲王需要回国协调援助奉天攻势的计划。"
 japan_fengtian_events.7.d_FNG: "鉴于奉天政府已处于战争状态，奉日双方一致决定中止闲院宫亲王的访问。这主要是出于安全考虑，而亲王的随行人员也因为双方正处战时而被匆匆疏散回日本。"
 japan_fengtian_events.7.a: "真可惜，但也能理解。"
 japan_fengtian_events.8.t: "闲院宫亲王回到日本"
 japan_fengtian_events.8.d: "闲院宫载仁亲王已经结束了访问奉天政府的行程，让政府大多数人松了一口气，同时也十分惊讶的是，这次访问没有发生什么重大意外。视察了奉天政府的大城市和军事设施之后，亲王已于昨夜乘船返回了日本。\n\n他马不停蹄地整理出一份简短的视察报告，表达了他此行的看法。在访问期间，他对奉天政府的不足之处保持着礼貌的态度，但在报告中却并非如此：他非常详细地描述了[FNG.GetLeader]政权中的军事、社会甚至经济上的缺陷，在报告最后，他质疑奉天政府，称他们只能堪堪控制住满洲，中国其他地方就更不用说了。"
 japan_fengtian_events.8.a: "这就已经不错了。"
 japan_fengtian_events.9.t: "闲院宫亲王回到日本"
 japan_fengtian_events.9.d: "闲院宫载仁亲王已经结束了访问奉天政府的行程，让政府大多数人松了一口气，同时也十分惊讶的是，这次访问没有发生什么重大意外。视察了奉天政府的大城市和军事设施之后，亲王已于昨夜乘船返回了日本。\n\n他马不停蹄地整理出一份简短的视察报告，表达了他此行的看法。令人震惊的是，报告中几乎全是对奉天政府，以及[FNG.GetLeader]英明领导的赞美之词，亲王应该是对奉天相当有信心，认为如无意外，他们很快就能将统治扩张到全中国。最重要的是，亲王似乎亲自安排了一份小礼物送给奉天，作为安保工作出色的谢礼。"
 japan_fengtian_events.9.a: "听起来他这次行程很愉快。"
 japan_fengtian_events.10.t: "对闲院宫亲王的未遂刺杀！"
 japan_fengtian_events.10.d: "政府中许多人担心的事情发生了：闲院宫亲王访问奉天期间，有人试图暗杀他。不过，在这场灾难中还有一线希望——亲王基本没有因暴行而受伤，为预防此种事件而随行的日本医护人员进行了短暂的治疗，他很快就恢复了过来。\n\n这次未遂刺杀的消息以惊人的速度传到了[JAP.Capital.GetCapitalVictoryPointName]，整个夜晚，政府中都充斥着愤怒的声音，要[FNG.GetLeader]以死谢罪，最好让他自己提头来见。到天亮时，这些人要求趋于合理：作为对怠慢的惩罚，日本应该撤回对奉天的援助。不过支持这项提议的人也不太多，一些人反而认为，从长远来看，如此严厉地惩罚盟友只会损害日本的利益，并主张仅给予象征性的谴责。现在，政府必须决定如何应对。"
 japan_fengtian_events.10.a: "他们必须为怠慢付出代价！"
 japan_fengtian_events.10.b: "他们已经尽力了。"
 JAP_arahata_kanson: "荒畑寒村"
 JAP_arahata_kanson_leader_desc: "§Y生于：§!§L1887年8月14日；大日本帝国、神奈川县横滨§!\n§Y背景：§!§L日本人民共和国的第一任主席，荒畑寒村，在国家政治格局翻天覆地之际走马上任。因“赤旗事件”被捕后，荒畑寒村不得不收敛起自己的亲社会主义倾向，之后则为那些左倾活动家们建立起了一个社会主义地下组织。因此有传言称，一切因反对旧帝制政权而产生的左翼暴力活动都出自荒畑寒村之手。§!"
