 JAP_emergency_relief_for_wartorn_areas: "战乱地区紧急救济"
 JAP_question_of_the_imperial_family: "皇室问题"
 JAP_break_up_the_mass_party: "拆分大政翼赞会"
 JAP_dismantle_the_national_defense_state: "解除国防国家"
