 JAP_joint_sino_jap_construction_scheme: "中日联合建设方案"
 JAP_sino_japanese_study_programme: "中日研究项目"
 JAP_japanese_branch_of_the_youth_corps: "青年团日本支部"
 JAP_establish_the_self_defense_corps: "建立自卫队"
 JAP_form_transitional_government: "成立过渡政府"
