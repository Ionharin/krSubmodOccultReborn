 JAP_hirohito: "裕仁"
 JAP_hirohito_leader_desc: "§Y生于：§!§L1901年4月29日；大日本帝国、东京府青山东宫§!\n§Y背景：§!§L$JAP_hirohito_desc_body$§!"
 JAP_hirohito_desc_body: "1926年，父亲大正天皇逝世后，裕仁成为了第124位坐上菊花御座的天皇。此前，这位年轻的皇太子自1921年起担任摄政，渡过了包括1923年的关东大地震和行刺未遂在内的几次灾难与危机。如今，继位十年后，这位在摄政期间始终对议会政治保持超然态度的天皇，一直是国民的精神领袖与日本的神圣象征。\n\n天皇本人神秘莫测甚至优柔寡断，虽掌握日本政坛大权，实践中却经常依赖枢密院建言。他时而热切主动时而消极被动，既决心在国家治理中保持强大的影响力，又时常屈从于顾问或军部的意愿。裕仁的政治立场几经演变，最终成为大日本帝国野望的坚定支持者，并决意在这场为日本谋取帝国荣光的征途中，扮演自己眼中必不可少的角色。"
 JAP_hirohito_defeat_desc_body: "看来，曾经不可一世的大日本帝国进入了一个艰难而充满不确定性的时期。它曾拥有东亚最强的海上力量，可与德国海军一战，但现在，“八纮一宇”的野心反而让日本走向了没落，敌军发起了成功的海陆攻势，日本有史以来第一次被完全占领。"
 JAP_hirohito_defeat_leader_desc: "§Y生于：§!§L1901年4月29日；大日本帝国、东京府青山东宫§!\n§Y背景：§!§L1926年，父亲大正天皇逝世后，裕仁成为了第124位坐上菊花御座的天皇。此前，这位年轻的皇太子自1921年起担任摄政，渡过了包括1923年的关东大地震和行刺未遂在内的几次灾难与危机。\n\n$JAP_hirohito_defeat_desc_body$虽然裕仁依然是国家元首、日本人民的天皇，但是，谁又知道这一安排是不是暂时的呢？§!"
 JAP_hirohito_symbol_leader_desc: "§Y生于：§!§L1901年4月29日；大日本帝国、东京府青山东宫§!\n§Y背景：§!§L1926年，父亲大正天皇逝世后，裕仁成为了第124位坐上菊花御座的天皇。此前，这位年轻的皇太子自1921年起担任摄政，渡过了包括1923年的关东大地震和行刺未遂在内的几次灾难与危机。\n\n$JAP_hirohito_defeat_desc_body$如今，日本建立了新政权，根据决定，天皇的角色将会永远被限定为日本国家的象征，以及日本人民团结的象征，不得拥有一切政治权力，哪怕是名义上的权力也不行。§!"
