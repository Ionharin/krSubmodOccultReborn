 FNG_JAP_deploy_emergency_economic_aid_idea_desc: "随着日方在满洲的利益受到威胁，日本开始资助奉天政府以期支撑其经济长期运行，并使其最终能够偿还债务。同时日本的慷慨援助还使奉天政府的战时工业得以平稳运转。"
