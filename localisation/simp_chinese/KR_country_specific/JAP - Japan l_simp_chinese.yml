 JAP_dismantle_the_zaibatsus: "取缔财阀"
 JAP_radical_land_distribution: "激进土地分配"
 JAP_launch_the_five_year_plan: "发起五年计划"
 JAP_reorganise_central_committee: "重组中央委员会"
 JAP_enforce_ideological_purity: "推行意识形态纯洁性"
 JAP_shining_communist_republic: "光辉的共产主义共和国"
 JAP_found_the_sohyo: "建立“总评”"
 JAP_promote_fair_land_redistribution: "推动公平土地再分配"
 JAP_nationalise_the_zaibatsus: "国有化财阀"
 JAP_create_peoples_communes: "建立人民公社"
 JAP_strengthen_workers_councils: "强化工人委员会"
 JAP_the_red_flag_shall_fly_here: "红旗飘扬于此！"
 JAP_emancipate_women: "解放妇女"
 JAP_create_socialist_youth_league: "建立社会主义青年团"
 JAP_encourage_revolutionary_culture: "鼓励革命文化"
 JAP_sponser_overseas_revolutionary_studies: "赞助海外革命研究"
 JAP_white_dawn_eclipses_red_sun: "白日盖过红日"
 JAP_white_dawn_eclipses_red_sun_desc: "纵观日本历史，这是我国头一次被完全占领，并任由曾经所谓劣等的中华民族和中国人摆布。中国国民党决定以三民主义为指导，对我国进行重塑与改组，最终成为一个新的反帝国家。"
 JAP_total_demobilisation: "全面复员"
 JAP_military_tribunal_for_the_far_east: "远东军事法庭"
 JAP_war_reparations_order: "战争赔偿令"
