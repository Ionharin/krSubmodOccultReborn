 JAP_subject_pol_start_focus: "[DemPupGetFinishingPolFocus]"
 JAP_pressure_the_dissolution_of_the_zaibatsu: "督促解散财阀"
 JAP_constitutional_amendments: "宪法修正案"
 JAP_industrial_demobilisation: "工业复员"
