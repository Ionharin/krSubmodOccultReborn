 japan_legations_crisis_events.001.t: "日本人提出要求"
 japan_legations_crisis_events.001.a: "我们必须通知盟友。"
 japan_legations_crisis_events.001.b: "请求盟友的援助。"
 japan_legations_crisis_events.001.c: "我们必须通知工部局。"
 japan_legations_crisis_events.001.d: "请求工部局的援助。"
 japan_legations_crisis_events.001.e: "看来我们很快就不得不做决定了……"
 JAP_LEC_crisis_plead_tt: "§G盟友将更有可能听从我们的意见。§!"
 japan_legations_crisis_events.002.t: "“孤岛”末日？"
 japan_legations_crisis_events.002.d: "我们的使馆城市现在已被所有可能的盟友或保护人抛弃，成为了一座孤岛。日本派遣军将在几天内抵达，而他们最后通牒的期限正在迅速耗尽。城内有关日本威胁的谣言四起，大量居民开始逃离城市。\n\n高级专员[LEC.GetLeader]还在权衡自己的胜算，留给他的选项已经不多了。使馆城市防卫队的主力是万国商团，可他们的武装和训练是用于镇压当地乱党、阻止军阀乱兵的，不是用来对抗全面入侵的。不过使馆城市里确实还有一些防御工事，而且日本已经与其他国家处于战争状态，我们也不能说完全没有胜算。\n\n若接受日本人的条件就意味着委任政府的终结，不过至少有望让国际区远离战火。但日本人似乎坚持要完全控制我们的武装力量，若是如此，我们在失去中立地位后就可能遭到相邻中国军阀政府的攻击，而和平也就无从谈起了。时间已所剩无几，必须艰难地做出决定了。"
 japan_legations_crisis_events.002.a: "别无选择，举起白旗吧。"
 japan_legations_crisis_events.002.b: "动员防卫队，奋战到底！"
 JAP_LEC_crisis_war_tt: "§R此举可能引发战争！§!"
 japan_legations_crisis_events.003.t: "使馆城市投降"
 japan_legations_crisis_events.003.d: "在我们发出要求控制中国境内使馆城市的最后通牒后，使馆城市领导层陷入了危机。尽管有人担心外部支持者可能会阻挠我们的行动，但最终使馆城市领导层选择接受我们的条件，而非负隅顽抗。\n\n此举当然是唯一正确公正的做法。作为欧洲帝国主义留下的醒目疮疤，使馆城市在亚洲冲突中的中立立场一直备受质疑。为了保护自身利益，确保我方补给线，并保障我国公民在使馆城市中的安全，我们决定结束这场闹剧。尽管我们的中国盟友名义上支持这一举措，但鉴于当前的战略形势，我们并不打算将使馆城市的控制权移交给中国盟友，至少目前如此。\n\n原高级专员辞职后，由新任高级专员冈崎胜男率领的高级代表团迅速接管了原国际委任政府及其周边地区的指挥权。我方军官已接管使馆城市防卫队，鉴于其雇佣兵性质以及其与中国人的相互猜忌，此项任务实施较为顺利。无论如何，所有反抗的军官都已被清除，上海驻屯军的海军陆战队很快就会得到增援。\n\n然而，中国各地军阀政权不太可能对此表示赞同，他们担心自己将成为下一个目标。在反租界和民族主义暴民的施压下，这些军阀可能会试图攻占使馆城市，在我们巩固阵地之前将我军赶下海。由于《使馆公约》提供的保护现已失效，我们需要迅速行动，以确保我们取得的成果不会落入他人之手。"
 japan_legations_crisis_events.003.a: "亚细亚解放力量的伟大胜利！"
 JAP_LEC_CHN_intervention_warning_tt: "§R相邻的中国势力阵营可能会视此举为挑衅行为！§!"
 japan_legations_crisis_events.004.t: "日军进驻使馆城市"
 japan_legations_crisis_events.004.d: "使馆城市的建立恐怕算是百年国耻的终极体现，它标志着外国列强正式掌控了中国主要城市。其建立来源于几个帝国主义列强间达成的一项协议，旨在将各自在沿海主要城市的租界合并，以避免彼此交战，并更有效地从中国攫取资源。而随着日本派遣军夺取脆弱的国际委任政府，这一协议也画上了句号。\n\n东京方面在对外宣传上玩弄着双重伎俩：他们一方面向西方列强声称，他们之所以违反国际条约，是为了确保使馆城市在日益白热化的东亚冲突中保持中立；另一方面，他们又告诉其亚洲盟友，此举是为了维护其扶植的中国政府，应是泛亚主义的胜利。同时在国内，他们还大肆渲染上海的日僧事件，以此为借口派遣军队占领上海。\n\n但不难看出，使馆城市已彻底告终，而日本侵略路线上的下一个目标无疑就是我们。随着国际条约彻底失效，爱国军官和反帝团体要求我们趁日本立足未稳夺取这些租界。他们呼吁全国各势力团结起来，对日发动一次最终抗日战争，但也有人警告说，只凭义愤填膺的民族主义是不足以真正赢得这场战争的。"
 japan_legations_crisis_events.004.a: "中国一点都不能少！"
 japan_legations_crisis_events.004.b: "必须先静待时机……"
 japan_legations_crisis_events.005.t: "日本占领使馆城市"
 japan_legations_crisis_events.005.d: "为防止德日两国因在华势力范围大打出手，在美国的仲裁下，使馆城市应运而生。如今，国际委任政府默许了日本直接占领使馆城市的要求，上海派遣军的到来宣告了“门户开放”政策的终结。\n\n日本人打着维护使馆城市中立、泛亚解放和保护本国公民等自相矛盾的旗号为此举辩护，丝毫不顾使馆城市的安危。《使馆公约》现已统统作废，使馆各城势必要陷入同周边中国军阀的战火之中……"
 japan_legations_crisis_events.005.a: "我军在使馆城市畅通无阻！"
 japan_legations_crisis_events.005.b: "上海的一群懦夫就这么投降了。"
 japan_legations_crisis_events.005.c: "门户不再开放。"
 japan_legations_crisis_events.006.t: "使馆城市抵抗！"
 japan_legations_crisis_events.006.d: "在我们发出要求控制中国境内使馆城市的最后通牒后，使馆城市领导层陷入了危机。在此期间，有人担心外部支持者或当地顽固分子可能会阻挠我们的行动，最终使馆城市领导层决定抵抗——动员使馆城市防卫队并将所有忠于我们的驻军解除武装。\n\n我们别无选择才提出这些要求——使馆城市不仅是欧洲帝国主义留下的醒目疮疤，其在亚洲冲突中的中立立场也一直备受质疑。为了保护自身利益，确保我方补给线，并保障我国公民在使馆城市中的安全，我们决定结束这场闹剧。\n\n使馆城市出乎意料的决心打乱了我方计划。眼下我们面临着新的艰难抉择：若此时退让必将显得软弱可欺——这对已深陷大规模战事的我们而言不可接受。虽然使馆城市防卫队不过是一群由民兵和雇佣兵组成的乌合之众，但他们的防御工事却十分坚固。我们必须迅速出击，尝试攻占这些至关重要的战略城市，然而这或将是一项艰巨的任务。"
 japan_legations_crisis_events.006.a: "命令上海派遣军立即登陆！"
 japan_legations_crisis_events.006.b: "我们别无选择，只能让步并尝试道歉……"
 japan_legations_crisis_events.007.t: "日本进攻使馆城市"
 japan_legations_crisis_events.007.d: "为防止德日两国因在华势力范围大打出手，在美国的仲裁下，使馆城市应运而生。如今，国际委任政府默许了日本直接占领使馆城市的要求，上海派遣军的到来宣告了“门户开放”政策的终结。\n\n日本人打着维护使馆城市中立、泛亚解放和保护本国公民等自相矛盾的旗号为此举辩护，丝毫不顾使馆城市的安危。《使馆公约》现已统统作废，使馆各城势必要陷入同周边中国军阀的战火之中……"
 japan_legations_crisis_events.007.a: "我们要当机立断，速战速决！"
 japan_legations_crisis_events.007.b: "日本又给自己招来了更多敌人。"
 japan_legations_crisis_events.007.c: "使馆城市还是没逃掉这场注定的战争。"
 japan_legations_crisis_events.008.t: "使馆城市危机平息"
 japan_legations_crisis_events.008.d: "为防止德日两国因在华势力范围大打出手，在美国的仲裁下，使馆城市应运而生。如今，日本要求派遣军进驻上海一事对“门户开放”政策构成严重威胁，进而引爆了一场危机。\n\n但东京方面似乎严重误判形势，最终被迫做出让步。为挽回面子，日本公开宣布接受使馆城市对保护本国公民安全的保证，并在同邻国的冲突中保障使馆城市的中立地位。"
 japan_legations_crisis_events.008.a: "耻辱性的大败。"
 japan_legations_crisis_events.008.b: "旭日帝国颜面扫地。"
 japan_legations_crisis_events.008.c: "使馆城市依旧坚挺……"
 japan_legations_crisis_events.010.t: "日本威胁使馆城市"
 japan_legations_crisis_events.010.d.standard: "日本向高级专员[LEC.GetLeader]发来了一封大胆的电报，通知他日方准备在上海市内部署数千名上海派遣军士兵，理由是在当地暴民袭击日本僧人后需要“维护使馆城市中立”并保护侨民。尽管根据公约日本享有在中国使馆城市驻扎少量部队的权利，但此次调兵规模已远远超出公约范围。\n\n此举公然企图破坏国际委任政府，将使馆城市置于日本控制之下——若允许此次驻军，日方势必迅速接管使馆城市防卫队，导致使馆城市工部局名存实亡。电报中暗含了入侵威胁，而日本人似乎有能力和意愿为此提供舰队和突击部队支持。\n\n作为国际委任政府的捍卫者，我们的回应将决定其命运。鉴于使馆城市防卫队能否在援军（如果有的话）抵达前成功组织防御备受质疑，而这些城市（日益被视作旧时代遗存）是否值得捍卫也存有争议——我们必须尽快作出抉择。"
 japan_legations_crisis_events.010.d.plead: "$japan_legations_crisis_events.010.d.standard$\n\n面对日益严峻的局势，高级专员[LEC.GetLeader]在一封字字泣血的信件中恳求我们捍卫国际委任政府，声称他相信使馆城市防卫队能够守住阵地，并恳求我们保障其公民的安全。尽管希望渺茫，但他仍诚挚期望能说服我们抵制日本的最后通牒。"
 japan_legations_crisis_events.010.a: "不幸的是，使馆城市不值得我们捍卫。"
 japan_legations_crisis_events.010.b: "我们将履行承诺，捍卫使馆城市！"
 japan_legations_crisis_events.011.t: "[FROM.GetNameDefCap]抛弃了我们！"
 japan_legations_crisis_events.011.d: "[FROM.GetAdjective]在权衡利弊之后决定接受日方要求。由冈崎胜男率领的日本官员和军官组成的高级代表团迅速抵达上海，向高级专员[LEC.GetLeader]施压，要求其交出对国际委任政府和使馆城市防卫队的实际控制权。\n\n冈崎胜男承诺尊重使馆城市财产，保障居民的权利和安全，但外国公民的撤离潮已然开始。随着中国民族主义者抗议日本军队进驻，紧张局势不断升级，使馆城市工部局的这一决定恐怕将使这座城市劫数难逃。\n\n外国支持者已经抛弃了我们，任由我们自生自灭，这或许意味着末日降临。我们必须尽快做出最终决定：是接受占领，还是进行最后的抵抗（尽管很可能徒劳无功）。"
 japan_legations_crisis_events.011.a: "骇人听闻的背叛！"
 japan_legations_crisis_events.012.t: "[FROM.GetNameDefCap]保护我们！"
 japan_legations_crisis_events.012.d: "[FROM.GetAdjective]在权衡利弊之后决定拒绝日方要求。高级专员[LEC.GetLeader]与使馆城市防卫队已迅速行动，将当地忠于日本的驻军缴械，并加固防御以抵抗任何可能的入侵。他们认为日方是在虚张声势，于是做出了这一大胆的决定，希望通过展示武力来说服东京方面让步。\n\n日本的舰队和派遣军仍蓄势待发，使馆城市居民担忧战争扩大化，纷纷外逃避难。不过使馆城市出乎意料的决心无疑还是打乱了日本的计划。\n\n我们的部队士气高涨，但如果日本继续发动入侵，我们就必须坚守阵地等待援助。在我们苦苦挣扎之际，此事对于我们政府而言无疑是一场重大胜利，但很遗憾，这次胜利很可能标志着使馆城市的永久中立之终结。"
 japan_legations_crisis_events.012.a: "秣马厉兵，枕戈待旦……"
 japan_legations_crisis_events.020.t: "日本威胁使馆城市"
 japan_legations_crisis_events.020.d.standard: "日本向高级专员[LEC.GetLeader]发来了一封大胆的电报，通知他日方准备在上海市内部署数千名上海派遣军士兵，理由是在当地暴民袭击日本僧人后需要“维护使馆城市中立”并保护侨民。尽管根据公约日本享有在中国使馆城市驻扎少量部队的权利，但此次调兵规模已远远超出公约范围。\n\n此举公然企图破坏国际委任政府，将使馆城市置于日本控制之下——若允许此次驻军，日方势必迅速接管使馆城市防卫队，导致使馆城市工部局名存实亡。电报中暗含了入侵威胁，而日本人似乎有能力和意愿为此提供舰队和突击部队支持。\n\n作为使馆城市工部局成员和使馆城市的独立保障者，我们的回应将决定其命运。鉴于使馆城市防卫队能否在援军（如果有的话）抵达前成功组织防御备受质疑，而这些城市（日益被视作旧时代遗存）是否值得捍卫也存有争议——预计不久后便会举行投票。"
 japan_legations_crisis_events.020.d.plead: "$japan_legations_crisis_events.020.d.standard$\n\n面对日益严峻的局势，高级专员[LEC.GetLeader]在一封字字泣血的信件中恳求我们捍卫国际委任政府，声称他相信使馆城市防卫队能够守住阵地，并恳求我们保障其公民的安全。尽管希望渺茫，但他或许能打动使馆城市工部局，使其倾向于他的立场。"
 japan_legations_crisis_events.020.a: "我们投票决定接受日本的要求。"
 japan_legations_crisis_events.020.b: "我们投票决定拒绝日本的要求。"
 japan_legations_crisis_events.021.t: "使馆城市工部局投票决定接受日本要求"
 japan_legations_crisis_events.021.d.council: "使馆城市工部局在快速表决之后决定接受日方要求。由冈崎胜男率领的日本官员和军官组成的高级代表团迅速抵达上海，向高级专员[LEC.GetLeader]施压，要求其交出对国际委任政府和使馆城市防卫队的实际控制权。\n\n冈崎胜男承诺尊重使馆城市财产，保障居民的权利和安全，但外国公民的撤离潮已然开始。随着中国民族主义者抗议日本军队进驻，紧张局势不断升级，使馆城市工部局的这一决定恐怕将使这座城市劫数难逃。"
 japan_legations_crisis_events.021.d.LEC: "$japan_legations_crisis_events.021.d.council$\n\n外国支持者已经抛弃了我们，任由我们自生自灭，这或许意味着末日降临。我们必须尽快做出最终决定：是接受占领，还是进行最后的抵抗（尽管很可能徒劳无功）。"
 japan_legations_crisis_events.021.a: "悲惨的结果，却也是可悲而又现实的结果。"
 japan_legations_crisis_events.021.b: "……但我们拒绝接受！"
 japan_legations_crisis_events.021.c: "使馆城市已成孤岛……"
 japan_legations_crisis_events.022.t: "[FROM.GetNameDefCap]保护我们！"
 japan_legations_crisis_events.022.d: "令人震惊的是，看来[FROM.GetNameDef]违背了使馆城市工部局其他成员的意愿，决定迎难而上捍卫我们。他们的代表鼓励高级专员[LEC.GetLeader]抵抗日军登陆，坚守阵地直至援军抵达。虽然希望渺茫，但我们或许仍有一线生机。"
 japan_legations_crisis_events.022.a: "看来我们并不孤单……"
 japan_legations_crisis_events.025.t: "使馆城市工部局投票决定拒绝日本要求"
 japan_legations_crisis_events.025.d.council: "使馆城市工部局在快速表决之后决定拒绝日方要求。高级专员[LEC.GetLeader]与使馆城市防卫队已迅速行动，将当地忠于日本的驻军缴械，并加固防御以抵抗任何可能的入侵。他们认为日方是在虚张声势，于是做出了这一大胆的决定，希望西方列强能够联手迫使东京方面让步。\n\n日本的舰队和派遣军仍蓄势待发，使馆城市居民担忧战争扩大化，纷纷外逃避难。不过使馆城市工部局出乎意料的决心无疑还是打乱了日本的计划，并巩固了国际委任政府的地位。"
 japan_legations_crisis_events.025.d.LEC: "$japan_legations_crisis_events.025.d.council$\n\n有了外国支持者的帮助，我们的部队士气高涨，但如果日本继续发动入侵，我们就必须坚守阵地等待援助。不过无论如何，在我们苦苦挣扎之际，此事对于我们政府而言无疑是一场重大胜利。"
 japan_legations_crisis_events.025.a: "战争似乎一触即发……"
 japan_legations_crisis_events.025.b: "……但我们不会参与其中。"
 japan_legations_crisis_events.025.c: "看来清算的时刻已经到来。"
 japan_legations_crisis_events.026.t: "[FROM.GetNameDefCap]抛弃了我们！"
 japan_legations_crisis_events.026.d: "尽管使馆城市工部局投票否决日本的要求，但[FROM.GetNameDef]违背了使馆城市工部局其他成员的意愿，决定撤离其军队、使馆人员及侨民。此举标志着他们退出国际委任政府，看来他们希望通过撤离来避免被卷入东方的冲突。他们的懦弱行径将被世人铭记，但我们对此却无能为力。"
 japan_legations_crisis_events.026.a: "我们正变得愈发孤立。"
 japan_legations_crisis_events.030.t: "日本施压使馆城市"
 japan_legations_crisis_events.030.d: "一份来自东京的秘电直接送达了[LEC.GetLeader]的办公桌，告知他日本政府即将出动一支派遣军增援上海驻屯军，并为最终解散使馆城市做准备。此举当然早有预谋，日本政府只是一直在等待合适时机。\n\n日本政府在对外宣传上玩弄着双重伎俩：一方面，向西方列强声称，此举是为了确保使馆城市在未来冲突中保持中立；另一方面，告诉其亚洲盟友，此举是为了维护他们扶植的中国政府的权利，并将其视做泛亚主义的胜利。同时在国内，他们还大肆渲染上海的日僧事件，以此为借口派遣军队占领上海和其他使馆城市。\n\n无论日方如何辩解，也不管他们如何承诺保障国际区居民的安全，所有人对此都心知肚明——此举实质上将导致使馆城市以某种方式走向终结。日本高层意图直接接管使馆城市防卫队，尽管[LEC.GetLeader]或许仍能保留法律意义上的管辖权，但日军必将实际掌控这些城市。此外，鉴于《使馆公约》的废除和日军进驻将为冲突提供借口，此举很可能会引发与邻近中国势力擦枪走火。\n\n对于[LEC.GetLeader]来说，眼下可能唯有遵从指令并接受他期望中的丰厚回报一途。不过若能拟就一份措辞得当的请愿书，或可说服东京当局暂缓下达吞并命令。"
 japan_legations_crisis_events.030.a: "我们将做好迎接日方的准备。"
 japan_legations_crisis_events.030.b: "请求给予更多时间。"
 japan_legations_crisis_events.031.t: "使馆城市的命运"
 japan_legations_crisis_events.031.a: "出动上海派遣军——我们将正式结束使馆城市这场闹剧。"
 japan_legations_crisis_events.031.b: "我们将维持上海现状。"
 japan_legations_crisis_events.032.t: "日本着手终结使馆城市"
 japan_legations_crisis_events.032.d: "使馆城市的建立恐怕算是百年国耻的终极体现，它标志着外国列强正式掌控了中国主要城市。日本成功接管使馆城市工部局一事始终令爱国志士心存疑虑，而随着日军进驻上海以及日军指挥官直接接管使馆城市防卫队，这些疑虑最终得到了证实。\n\n东京方面在对外宣传上玩弄着双重伎俩：他们一方面向西方列强声称，他们之所以违反国际条约，是为了确保使馆城市在日益白热化的东亚冲突中保持中立；另一方面，他们又告诉其亚洲盟友，此举是为了维护其扶植的中国政府，应是泛亚主义的胜利。同时在国内，他们还大肆渲染上海的日僧事件，以此为借口派遣军队占领上海。\n\n但不难看出，使馆城市已彻底告终，而日本侵略路线上的下一个目标无疑就是我们。随着国际条约彻底失效，爱国军官和反帝团体要求我们趁日本立足未稳夺取这些租界。他们呼吁全国各势力团结起来，对日发动一次最终抗日战争，但也有人警告说，只凭义愤填膺的民族主义是不足以真正赢得这场战争的。"
 japan_legations_crisis_events.032.a: "中国一点都不能少！"
 japan_legations_crisis_events.032.b: "必须先静待时机……"
 japan_legations_crisis_events.033.t: "日本终结使馆城市"
 japan_legations_crisis_events.033.d: "当日本代表冈崎胜男就任在华使馆城市高级专员后，许多外国侨民预感到大势已去，纷纷逃离了这座城市——日本政府将逐步接管这些表面上维持中立的城市。\n\n当上海派遣军登陆并直接接管国际委任政府时，这一预兆终于成为现实。日本人打着维护使馆城市中立、泛亚解放和保护本国公民等自相矛盾的旗号为此举辩护，丝毫不顾使馆城市的安危。《使馆公约》现已统统作废，使馆各城势必要陷入同周边中国军阀的战火之中……"
 japan_legations_crisis_events.033.a: "这是日本和共荣圈的巨大胜利！"
 japan_legations_crisis_events.033.b: "日本的侵略没有止境！"
 japan_legations_crisis_events.033.c: "使馆城市中立的闹剧就此落幕……"
 japan_legations_crisis_events.034.t: "日本维持使馆城市独立"
 japan_legations_crisis_events.034.d: "当日本代表冈崎胜男就任在华使馆城市高级专员后，许多外国侨民预感到大势已去，纷纷逃离了这座城市——日本政府将逐步接管这些表面上维持中立的城市。\n\n尽管有关日本一支派遣军计划在上海登陆的传言满天飞，但东京方面似乎已经撤销了这一命令，舰队最终也并未抵达。这缓解了人们对使馆城市可能卷入全面战争的担忧，但许多人仍然质疑冈崎胜男高级专员究竟拥有多少自主权，以及这种做法是否真的能够从长远角度保护使馆城市远离战火。"
 japan_legations_crisis_events.034.a: "使馆城市挺过了一次日出。"
 JAP_kuhara_fusanosuke: "久原房之助"
 JAP_kuhara_fusanosuke_advisor_desc: "§Y生于：§!§L1869年7月12日；大日本帝国、长门国萩藩§!"
 japan_domestic_events.1.t: "日本AI路线选择"
 japan_domestic_events.1.d: ""
 japan_domestic_events.1.a: "民主。"
 japan_domestic_events.1.b: "军方中心派。"
 japan_domestic_events.1.c: "维新派。"
 japan_legations_crisis_events.000.t: "使馆城市危机酝酿"
 japan_legations_crisis_events.000.d: "为了维护美国倡导的在华“门户开放”政策，并维系德、日、英美三大势力范围之间的和平，中国租界、居留地、使馆区国际委任政府（通常被称为使馆城市）应运而生。然而，随着亚洲冲突日益升级，使馆城市恐怕难以幸免于难。\n\n日本公然调集大批舰队，并仓促组建了一支由陆军和海军陆战队混编的派遣军，其意图引发各界纷纷猜测。毫无疑问，派遣军最终旨在亚太地区贯彻东京的宏伟目标，但有消息称，这支部队的首个目标将是国际委任政府的璀璨明珠——上海。\n\n在日益紧张的地缘政治局势下，使馆城市高级专员一直保持缄默并强调冷静，幕后各方也在努力缓和局势。然而，日本军方高层似乎要一意孤行，或许此刻已没有人（甚至包括日本政府）能够劝阻他们。对中国而言，使馆城市始终是个棘手问题，许多人都在猜测中方是否会采取相应行动。"
 japan_legations_crisis_events.000.a: "他们最好听听我们的意见。"
 japan_legations_crisis_events.000.b: "日本人又开始蠢蠢欲动了。"
 japan_legations_crisis_events.000.c: "我们将密切关注事态发展。"
 JAP_LEC_crisis_warning_tt: "§R日本计划占领使馆城市，必要时将诉诸武力。做好万全准备方为明智之举。§!"
 japan_legations_crisis_events.001.intro: "冈崎胜男不情愿地向使馆城市当发来了一份措辞大胆的电报，通知他们日方政府准备在上海市内部署数千名上海派遣军士兵。尽管根据公约日本享有在中国使馆城市驻扎少量部队的权利，但此次调兵规模已远远超出公约范围。电报中给出了一个极短的最后同意期限来接受。同时有消息称，东京方面已经集结了一支舰队和登陆部队，以便在必要时武力夺取使馆城市。"
 japan_legations_crisis_events.001.closer: "无论日本如何修饰文字，所有人都心知肚明：接受要求将意味着国际委任政府的结束。毫无疑问，只要委任政府允许日本驻军，日本就会迅速将使馆城市防卫队置于其直接控制之下，并在事实上解散使馆城市工部局。这可能会是使馆城市在其短暂存在期间面临的最大危机。"
 japan_legations_crisis_events.001.d.war_with_both: "$japan_legations_crisis_events.001.intro$\n\n日本帝国正陷入与中国和东南亚的战火之中，为了给自己不断升级的武装干预行为辩护，他们以最近日本僧人在上海三友实业社附近被中国人袭击作为借口。我方当局确信，此事无疑是日本情报机关的自导自演，但事实真相已不再重要，重要的是，当地财阀已纷纷提出抗议，而上海居留民团也已公开要求日本舰队采取行动。\n\n$japan_legations_crisis_events.001.closer$"
 japan_legations_crisis_events.001.d.war_with_GER: "$japan_legations_crisis_events.001.intro$\n\n日本正陷入与德属殖民地的战火之中，他们在国内将此举描述为是为了消灭西方帝国主义，实现共荣圈的泛亚主义野望。他们声称自己代表了自己的各色中国傀儡政府与上海居留民团等当地组织的利益。\n\n$japan_legations_crisis_events.001.closer$"
 japan_legations_crisis_events.001.d.war_with_CUF: "$japan_legations_crisis_events.001.intro$\n\n日本正陷入与中国不断升级的战火之中，为了给自己的行为辩护，他们试图以确保使馆城市在冲突中保持中立作为借口，并指责中国正在通过使馆城市获取非法外部援助。他们还辩解称，占领使馆城市将有助于在冲突中保护各国公民的安全，并抛出了上海居留民团投诉这种站不住脚的借口。\n\n$japan_legations_crisis_events.001.closer$"
 japan_legations_crisis_events.031.d_normal: "一份来自东京的秘电直接送达了[LEC.GetLeader]的办公桌，告知他我方政府即将出动一支派遣军增援上海驻屯军，并为最终解散使馆城市做准备。此举当然早有预谋，我方政府只是一直在等待合适时机。\n\n我方政府在对外宣传上玩弄着双重伎俩：一方面，向西方列强声称，此举是为了确保使馆城市在未来冲突中保持中立；另一方面，告诉其亚洲盟友，此举是为了维护我们扶植的中国政府的权利，并将其视做泛亚主义的胜利。同时在国内，我们还大肆渲染上海的日僧事件，以此为借口派遣军队占领上海和其他使馆城市。\n\n无论我方如何辩解，也不管我们如何承诺保障国际区居民的安全，所有人对此都心知肚明——此举实质上将导致使馆城市以某种方式走向终结。日本高层意图直接接管使馆城市防卫队，尽管[LEC.GetLeader]或许仍能保留法律意义上的管辖权，但日军必将实际掌控这些城市。此外，鉴于《使馆公约》的废除和日军进驻将为冲突提供借口，此举很可能会引发与邻近中国势力擦枪走火——而这或许是我们收回成命的唯一潜在理由。"
 japan_legations_crisis_events.031.d_plead: "$japan_legations_crisis_events.031.d_normal$\n\n高级专员[LEC.GetLeader]对此提出了一个奇怪的、甚至堪称大胆的请求——由于担心使馆城市会引发更大规模的冲突，战争也可能对重要基础设施造成破坏，他请求高层推迟部署，并声称使馆城市防卫队足以保障上海的安全。虽然我们大可以对此置若罔闻，但鉴于其过往的出色领导，他的建言或许值得斟酌。"
 JAP_miyazaki_ryusuke: "宫崎龙介"
 JAP_miyazaki_ryusuke_leader_desc: "§Y生于：§!§L1892年11月2日；大日本帝国、熊本县玉名郡荒尾村§!\n§Y背景：§!§L宫崎龙介是日本政治活动家、中国革命家孙中山的支持者宫崎滔天的长子。1916年，他进入东京帝国大学法学部学习，并在那里开启政治生涯。他与赤松胜麿、石渡春雄等人一起加入了新人会，积极倡导大正民主，并结识了吉野作造。后来，他与著名诗人、煤矿大亨的妻子柳原白莲私奔，引发了一场轰动一时的丑闻。\n\n之后，宫崎龙介曾在片山哲和星岛二郎手下担任律师，但不幸患上肺结核。经过几年的休养，他于1926年与吉野作造和安部矶雄共同创立了独立劳动协会，随后成为社会大众党中央委员。他一度沦为政坛边缘人物，多次竞选公职均告失败，期间与其他泛亚主义政治人物交往密切——甚至一度转向右翼，与中野正刚结盟。\n\n若非曾作为日本政府与新兴国民党之间的调解人，宫崎龙介很可能早已被淹没在历史洪流之中。受文官政府委派，宫崎龙介作为秘密特使试图缓和国民党与日本政府之间的紧张关系，却在离开日本前被不满的日本军方扣押。然而，随着国民党完成不可能的任务——登陆日本本土，宫崎龙介再度出任谈判小组成员并被派往中国。最终，宫崎龙介被中国占领当局选中，负责监督日本向姊妹共和国转型的过程。§!"
 JAP_okamura_yasuji_bio: "冈村宁次1094年毕业于日本陆军士官学校，与他同期的包括和他并称“三羽乌”的永田铁山、小畑敏四郎，以及板垣征四郎、土肥原贤二和安藤利吉等人。在军校时，他的学习方向为中国研究，并在陆士学生队中负责中国留学生的教育。从日本陆军大学校毕业后，他于1916年成为了驻北京武官。\n\n1921年，他游历欧洲和美国六个月，之后返回亚洲，在驻华日军部队中担任职务，之后其职务逐年晋升，并曾在上海派遣军与关东军中任职。在其职业生涯中，冈村宁次利用其作为日本代表教育中国军校生和为军阀势力担任顾问的身份，不仅与奉系军官保持着联系，还与孙传芳等直系军官以及蒋介石、何应钦等国民党军官有着往来。"
 JAP_okamura_yasuji_leader_desc: "§Y生于：§!§L1884年5月15日；大日本帝国、东京府§!\n§Y背景：§!§L$JAP_okamura_yasuji_bio$\n\n这么多年过去之后，中国人成功地骑在了曾经不可一世的日本头上。讽刺的是，中国人选择由冈村将军担任占领政府首脑，希望通过抛出这根小小的橄榄枝，来安抚心怀不满的日本陆军。§!"
