 JAP_fengtian_bailout: "奉天援助"
 JAP_fengtian_bailout_desc: "我们通过采购白银补足奉天政府白银储备的方式来援助奉天政府。"
 JAP_MANTETSU_COLLAPSE: "满铁垮台"
 JAP_MANTETSU_COLLAPSE_desc: "满铁可观的收益现已成为日本经济的一大助力，也是政府近四分之一年收入的直接来源。中国政府对其业务的大规模封锁和扣押犹如釜底抽薪，让这个国家摇摇欲坠。"
 JAP_ANQ_Reconstruction_Plan: "新皖系重建规划"
 JAP_ANQ_Reconstruction_Plan_desc: "为了让新皖系尽快恢复，使其能够帮上奉系，我们向他们提供了大量的援助。"
 JAP_china_training: "日式训练项目"
 JAP_china_training_desc: "为了协助他们盟友的成长，日本派出了一批军官为他们训练士兵。"
 JAP_china_attack_support: "日本的攻势支持"
 JAP_chinese_separatist_support: "日本的独立保障"
 JAP_sabotage_1: "日本破坏活动"
 JAP_Imperial_Family_exiled: "皇室被流放"
 JAP_Imperial_Family_exiled_desc: "天皇和他的家人已经被驱逐出境，再无机会回到本土列岛。尽管大街小巷都可以听到人民愤怒的抗议，但是没有爆发大规模的暴力事件。不过，我们的国家威望和军队战力都因此遭受了极大地影响。"
 JAP_Imperial_Family_powerless: "废止皇室特权地位"
 JAP_Imperial_Family_powerless_desc: "大会已经决定废止天皇及皇室的一切头衔。天皇和他的家人如今和普通百姓一样拥有了平等的公民权。此举说服了广大人民群众支持我们的社会主义新政权。"
 JAP_country_unrest: "全国骚乱"
 JAP_country_unrest_desc: "废止君主制激怒了日本社会的部分人，一些城市陷入了混乱，军方也拒绝承认新政权。希望时间能治愈这一切。"
 JAP_shattered_people_idea: "四分五裂的人民"
 JAP_shattered_people_idea_desc: "数世纪以来，日本人民对天皇陛下的忠诚坚定不移。日本过去从未被征服过，但如今，日本本土却首次被完全占领，所有的信念都在这一系列破碎的梦想中四分五裂。日本人民信心的重建和与失败主义和悲观主义情绪的斗争将需要切实的努力。"
 JAP_devastated_national_economy_idea: "崩溃的国民经济"
 JAP_devastated_national_economy_idea_desc: "日本前所未有的战败和向外国占领军的全面投降使日本经济完全崩溃。虽然曾有过满铁垮台造成的经济混乱，但与完全占领和经济活动全面中止造成的经济灾难相比只是小巫见大巫。国家经济在累累负债和欠缺投资下摇摇欲坠，日本经济需要很长时间才能得到完全恢复。"
 JAP_disarmed_nation_idea: "非军事化国家"
 JAP_disarmed_nation_idea_desc: "按新外国占领者的规定，日本帝国所有陆海空军将被暂时解散，以作为其在亚洲掀起帝国主义战争的惩罚。在得到宗主的信任前，日本暂时将不得拥有任何形式的武装力量。"
 JAP_jpel_influence_idea: "向日本人民解放联盟叛逃"
 JAP_jpel_influence_idea_desc: "日本人民解放联盟由向国民党投诚的日本士兵和逃离我国的难民组成。日本人民解放联盟来者不拒，承诺新生的日本将预示着军国主义的终结，以此笼络了许多我国的不满分子。向联盟的叛逃将损害我军的士气和信念。"
 JAP_sister_republic_idea: "姊妹共和国"
 JAP_sister_republic_idea_desc: "尽管日本人曾对中国人民带来了深重灾难，在中国领导下多年的训政让日本人受到启发，并进行自己的国民革命。在三民主义的领导下，他们也将成为泛亚人民反对帝国主义伟大斗争中的同志。日本已从战败的混乱和耻辱中走出，正走在一条新的道路上——抛弃帝国主义思想并与其社会主义兄弟姐妹精诚团结。"
 JAP_communist_republic_of_japan_idea: "日本共产主义共和国"
 JAP_communist_republic_of_japan_idea_desc: "经历种种困难，日本共产主义者终于建立了一个真正的人民共和国——一个为日本工农鞠躬尽瘁的人民政府。他们将不再被天皇及其朝廷的封建锁链束缚，也不再被迫服务于资本主义军国主义者的狂想。新的黎明、新的太阳正在亚洲大地上升起，因为人民已真正站起来了！"
 JAP_the_revolution_successful_idea: "革命：成功"
 JAP_the_revolution_successful_idea_desc: "经历种种困难，社会主义者和社会民主主义者携手组建了联合阵线，共同致力于服务日本真正的无产阶级。现在，我们将尽己所能确保革命胜利果实，让红旗不倒！同志们，铭记1911年以来牺牲的先烈，日本社会主义万岁！"
 JAP_chinese_construction_crews_idea: "中日建设方案"
 JAP_chinese_construction_crews_idea_desc: "由于战争造成的严重破坏，中国主动提供帮助，派来数千名中国劳工帮助日本民用甚至军用工业的重建。重建日本工业的目的不是为了发动战争，而是将日本人民生活质量恢复至战前水平。"
 JAP_five_year_plan_idea: "五年计划"
 JAP_war_reparations_chi_overlord_idea: "战争赔偿令"
 JAP_war_reparations_chi_overlord_idea_desc: "鉴于日本给中国人民造成的深重苦难，日本政府已同意接受羞辱性的条款，在一定时间内以战争赔款的形式支付补偿。"
