 KR_co_prosperity_sphere_desc: "§H$JAP_asian_economic_sphere$§!是各国共同努力铲除西方帝国主义在亚影响的经济政治同盟。日本作为其领导国，负责给予其成员以经济援助，回报则是在当地开发自然资源并加强政治影响。"
 JAP_co_prosperity_decisions: "日本的共荣圈"
 JAP_co_prosperity_decisions_desc: "亚洲人民正共同努力铲除西方帝国主义在亚洲的影响，而我们共荣圈正是其中的一员。在共荣圈内，我们会共同受益，共同繁荣，而日本则会在她盟友的“帮助”下，更加繁荣。\n\n当前的经济共荣圈成员：[JAP_ally0][JAP_ally1][JAP_ally2][JAP_ally3][JAP_ally4][JAP_ally5][JAP_ally6][JAP_ally7][JAP_ally8][JAP_ally9][JAP_ally10][JAP_ally11][JAP_ally12][JAP_ally13][JAP_ally14]"
 JAP_invite_into_faction: "邀请[From.GetNameDef]加入联盟"
 JAP_invite_into_faction_desc: "由于[From.GetAdjective]政府在东京会议上表现了结盟的兴趣，现在我们的会谈只不过是走个过场罢了。"
 JAP_invite_into_economic_sphere: "邀请[From.GetNameDef]加入经济共荣圈"
 JAP_invite_into_economic_sphere_desc: "[From.GetNameDefCap]是一个尚未结盟的国家或已经是日本的盟友，无论哪种情况，他们都是被我们争取入“大东亚共荣圈”的最佳候选人……这是为了他们的利益，而且“十分”有利于我们的利益。"
 JAP_invest_in_sphere_member: "促进在[From.GetNameDef]的投资"
 JAP_invest_in_sphere_member_desc: "我们应该开始投资[From.GetNameDef]，这不仅方便我们同他们贸易，也会在其国内增进日本势力，并最终从内部接管这个国家。"
 JAP_invest_in_sphere_member_docks: "促进[From.GetNameDef]的海军投资"
 JAP_invest_in_sphere_member_docks_desc: "我们应该开始投资[From.GetNameDef]，这不仅方便我们同他们贸易，也会在其国内增进日本势力，并最终从内部接管这个国家。"
 JAP_invest_in_sphere_naval_advisors: "向[From.GetNameDef]派遣海军顾问"
 JAP_invest_in_sphere_naval_advisors_desc: "我们应当向[From.GetNameDef]派遣顾问，这将有助于其发展建设自己的海军基地。"
 JAP_naval_advisors_tech_bonus: "日本海军顾问"
 JAP_invest_in_sphere_prosperity_ships: "同[From.GetNameDef]分享“繁荣之船”计划"
 JAP_invest_in_sphere_prosperity_ships_desc: "我们应当向[From.GetNameDef]派出一批负责“繁荣之船”的工程师，这么做将有助于其海运基础的发展。"
 JAP_invest_in_sphere_take_dockyards: "接管[From.GetNameDef]船坞"
 JAP_invest_in_sphere_take_dockyards_desc: "我国国内的产能已经难以为继我们海军的规模了。我们别无他法，只能利用共荣圈的加盟国的工业能力。说到底，这也是为了保护他们自己。"
 JAP_economic_sphere_takeover: "接管[From.GetNameDef]"
 JAP_economic_sphere_takeover_desc: "我们对[From.GetNameDef]的经济渗透已经达到了[Root.GetNameDef]彻底主宰他们的地步了。[From.GetAdjective]政府如今只会按我们的意愿行事了……现在是时候礼貌地扒下他们“独立自主”的外壳了。"
 JAP_co_prosperity_member_decisions: "日本的共荣圈"
 JAP_co_prosperity_member_decisions_desc: "共荣圈一方面是军事联盟，另一方面又是经济合作项目——尽管这两方面都受到了[JAP.GetNameDef]这一东亚强权所牢牢掌控。日本已决意要与西方帝国主义对亚洲的入侵作斗争，即使——在某种程度上，这意味着他们自己也要成为帝国主义的一员。"
 JAP_foreign_policy_decisions: "外交政策决议"
 JAP_request_nav_advisors: "请求海军顾问"
 JAP_withdraw_from_alliance: "退出军事联盟"
 JAP_withdraw_from_alliance_desc: "我们不再需要同[JAP.GetNameDef]进行军事联盟了。让我们就此告终吧。"
 JAP_withdraw_from_sphere: "退出经济共荣圈"
 JAP_withdraw_from_sphere_desc: "尽管这对我们有利可图，但是日本经济共荣圈的成员身份引起了我们对自身独立性的关注。我们必须立刻退出与日本人的合作。"
 JAP_nationalize_japanese_investments: "国有化日本投资"
 JAP_nationalize_japanese_investments_desc: "[Root.GetNameDef]境内数量不断增长的日本投资者已经引起了社会强烈关注。虽然这将代价高昂，而且需要我们彻底退出日本的经济共荣圈，但是我们应当国有化日本人的投资，并阻止日本利用对[Root.GetAdjective]经济不断增长的影响力把我国变成一个唯命是从的傀儡。"
 JAP_rising_sun_idea: "帝国荣耀"
 JAP_rising_sun_idea_desc: "吾国并未时刻获得外人应有之尊崇。尽管过去三十年间情况有所改变，但西人仍在很大程度上鄙夷我国。为促成皇国大业，我们相信每个大和儿女都会为天皇陛下恪尽职守。\n\n吾国乃亚洲最强大之国家，战争的胜利果实理应由我们——必须由我们独享。"
 JAP_asian_economic_sphere: "东亚共荣圈"
 JAP_asian_economic_sphere_desc: "该精神代表着位于共荣圈核心的我国经济从共荣圈中获得的全局加成。共荣圈的成员越多，成员拥有的工业规模越大，我们就越富有。"
 JAP_asian_economic_sphere_member: "东亚共荣圈"
 JAP_asian_economic_sphere_member_desc: "该精神代表着作为共荣圈成员的我国经济从共荣圈中获得的全局加成。共荣圈的成员越多，成员拥有的工业规模越大，我们就越富有。"
 JAP_member_integration_1: "经济渗透：低"
 JAP_member_integration_1_desc: "日本对我国的投资是刺激我国经济飞速增长的强大帮手……但是他们的影响力传播的越广，我们对他们日益增长的经济需求就会越顺从。"
