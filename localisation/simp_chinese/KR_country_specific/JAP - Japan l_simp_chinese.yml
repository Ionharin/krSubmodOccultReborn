 JAP_nosaka_sanzo: "野坂参三"
 JAP_nosaka_sanzo_desc_body: "野坂参三出生于富裕的商人家庭，在资产阶级环境中长大，后进入庆应义塾大学就读。那时，在教授堀江归一的支持下，他开始对国际劳工运动产生兴趣。随后，他完成了一项关于温和劳工组织“友爱会”的研究，并在毕业后成为了该组织的刊物编辑。\n\n1917年布尔什维克革命、1919年法国革命后，野坂参三成为了坚定的马克思主义者，并于1919年抵达法国，在那里结识了一些来自英法的社会主义者，他领导着萌芽中的日本社会主义运动，通过第三国际来发挥影响力。国民党的第一次北伐失败后，党内左派高层被赶出中国，野坂得以与他们亲近。他参与筹备了国民党和中工盟策划的1932年上海起义，由于起义失败，他作为志愿者来到了闽赣根据地。\n\n与国民党共度一段时光、见证二次北伐成功之后，野坂参三承诺帮助中国军队"
 JAP_nosaka_sanzo_leader_desc: "§Y生于：§!§L1892年3月30日；大日本帝国、山口县萩市§!\n§Y背景：§!§L$JAP_nosaka_sanzo_desc_body$，对第二次中日战争中的日本战俘进行再教育。他以此赢得了国民党的信任，带领新生的日本社会主义共和国，与姐妹共和国中国一道，走向崭新的明天。§!"
 JAP_nosaka_sanzo_commander_desc: "§Y生于：§!§L1892年3月30日；大日本帝国、山口县萩市§!\n§Y背景：§!§L$JAP_nosaka_sanzo_desc_body$。国民党中央委员会表示，中国欢迎任何形式的帮助，因此允许他作为将领加入国民革命军。虽然目前正为异国军队效力、与祖国隔海相望，但野坂参三还是希望有一天能回到日本，亲自掌舵，为日本带来社会主义革命。§!\n\n§Y备注：野坂参三只是为了帮助中国国民革命而来，并不参与国民党的政治内斗，他被视作一位中立人士。§!"
