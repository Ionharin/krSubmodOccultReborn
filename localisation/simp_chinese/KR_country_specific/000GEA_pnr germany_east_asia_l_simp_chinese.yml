l_simp_chinese:

### Decisions ###
  GEA_diguo_de_wuqi_category: "帝国的武器"
  GEA_diguo_de_wuqi_category_desc: "[GEA.GetNameDef]和帝国殖民办公厅的任务便是保卫璀璨耀眼的[GER.GetAdejective]东方殖民地不受外人侵害，甚至再度像世界大战时那样落入到横暴的[JAP.GetNameDef]手中。[GEA.GetNameDef]是帝国的一件武器，一位哨兵，他手持四面转动的火焰之剑，谨慎地警戒着不洁者们，以免他们染指帝国的财宝。\n\n当前[GER.Capital.GetCapitalVictoryPointName]对亚洲紧张局势的评估结果为[loc_gea_alert_situation]。"
  GEA_alert_situation_0: "§C四海承平§!"
  GEA_alert_situation_1: "§4风平浪静§!"
  GEA_alert_situation_2: "§4微澜乍起§!"
  GEA_alert_situation_3: "§3暗流涌动§!"
  GEA_alert_situation_4: "§3风起浪涌§!"
  GEA_alert_situation_5: "§t惊涛骇浪§!"
  GEA_alert_situation_6: "§x海沸江翻§!"
  GEA_alert_situation_none: "§O一切稳定，危机解除§!"
  GEA_alert_situation_decrease_tt: "§G亚洲的紧张状态得到了缓解。§!"
  GEA_alert_situation_increase_tt: "§G亚洲的紧张状态提高了。§!"
  GEA_cai_qu_shou_duan_decision: "采取手段"
  GEA_cai_qu_shou_duan_decision_desc: ""
  GEA_bao_ri_ying_cheng_decision: "暴日膺惩"
  GEA_bao_ri_ying_cheng_decision_desc: "[GER.GetNameDef]自世界大战以降便祈愿着亚洲乃至整个世界的永久和平，为此特别设立了[GEA.GetNameDef]来确保亚洲地区的永久和平。然而自1936年以来，[JAP.GetNameDef]和[JAP.Capital.GetCapitalVictoryPointName]一而再再二三地试图破坏亚洲的和平稳定，欲与[GER.GetNameDef]抗衡，称霸于亚洲之野心高涨，如今亚洲各国的生命财产已岌岌可危，为此，一向渴望维护亚洲和平的[GEA.GetNameDef]必当尽最大努力维护其秩序，此自不待言。"
  GEA_bao_ri_ying_cheng_decision_tt: "§a我们将开展一项针对§j[JAP.GetNameDef]§!的§Y特别军事行动§!，在达成战略目标后，我们便可迫使§j[JAP.GetNameDef]§!签订条约，令其暂时失去对亚洲的干涉能力。§!"
  GEA_alert_level_check_normal_tt: "[GER.Capital.GetCapitalVictoryPointName]认为当前局势处于$GEA_alert_situation_2$及更严重的状态"
  GEA_alert_level_check_serious_tt: "[GER.Capital.GetCapitalVictoryPointName]认为当前局势处于$GEA_alert_situation_4$及更严重的状态"
  GEA_bao_ri_ying_cheng_mission_decision: "$GEA_bao_ri_ying_cheng_decision$"
  GEA_bao_ri_ying_cheng_mission_decision_desc: "我们时间紧迫，[GER.Capital.GetCapitalVictoryPointName]对我们自作主张的行动的容忍是有限度的，如果到时间我们还没办法解决问题的话，我们可能就不得不撤出这场冲突——想必代价是办公室里的所有人都要因此而遭到撤职吧。"
  GEA_bao_ri_ying_cheng_mission_decision_failed_tt: "[GEA.GetFlag]§Y[GEA.GetNameDef]§!与[JAP.GetFlag]§Y[JAP.GetNameDef]§!，\n现已签订了一份§Y和平条约§!，\n宣布敌对状态已经结束。\n[GEA.GetNameDef]未能在局部冲突中迫使[JAP.GetNameDef]认输。\n\n\n§R如今中国又将独自面对旭日之高升§!"
  GEA_limiting_war.1.t: "登上本岛"
  GEA_limiting_war.1.desc: "我们的敌人，卑鄙无耻的窃贼和匪徒，[RUS.GetName]的军队正在溃败，我们的胜利已成定局，时隔近百年，我国富饶的外东北地区终于再次被牢牢掌控在他真正的主人手中。\n\n毫无疑问，随着我们在冲突地区取得的一个又一个胜利，盘踞在莫斯科中的旧帝国主义势力定在瑟瑟发抖，并向他们信仰的神灵祈求我们的军队不要彻底毁灭他们的国家。当这个世界上真正正义且道德的人们拿起强大的火器奋力反击，在思想与物质的两重武器的加持之下，[RUS.GetName]怎能不失败？"
  GEA_limiting_war.1.a: "再电[JAP.Capital.GetCapitalVictoryPointName]，提出我们的要求。"
  GEA_limiting_war.2.t: "[FROM.GetNameDef]与我们和谈"
  GEA_limiting_war.2.desc: ""
  GEA_limiting_war.2.a: "我们别无办法……按他们说的办。"
  GEA_limiting_war.3.t: "[FROM.GetName]接受失败"
  GEA_limiting_war.3.desc: "从莫斯科传回了帝国主义者们祈求和平的消息，毫无疑问的是我们的军事行动取得了完全的成功，敌人已经丧失了所有抵抗斗志，并害怕地向我们磕头求饶以祈求和平。[FROM.GetName]为避免我们进一步的复仇，已正式放弃对外东北的控制。毫无疑问的是，这场胜利提升了我们在世界上的地位，震慑了那些帝国主义者，并维护了我们领土的完整性。"
  GEA_limiting_war.3.a: "巨龙腾飞于东方！"
  GEA_limiting_war.5.t: "[QIE.GetAdjective]突击停滞"
  GEA_limiting_war.5.desc: "最近[QIE.GetName]突然在远东地区发动了一场不宣而战的突袭，在战争初期，[QIE.GetAdjective]部队的迅速突进让我们措手不及，但随着战争日益持久，他们的压力日渐增加，战场上的表现也逐步下滑。其军队的弱点已暴露出来。对[QIE.GetAdjective]军队而言，原本计划中的闪电战已变成一场苦战。我们可以选择宽宏大量，提出让步给他们一条出路，不过棋盘已经反转，是放他们一马还是追求彻底的胜利，决定权现在在于我们。"
  GEA_limiting_war.5.a: "提出让步。"
  GEA_limiting_war.5.b: "我们只接受完全的胜利。"
  GEA_limiting_war.6.t: "远东战事不利"
  GEA_limiting_war.6.desc: "我们在外东北的攻势已陷入僵局，这并非问题所在，问题在于我们的敌人已经察觉到了这一点。他们注意到了我们的作战计划执行得并不顺利。如今他们向我们发出最后通牒，我们要么立即投降以减少损失，要么继续战争，承受更多的流血牺牲。"
  GEA_limiting_war.6.a: "那就议和吧。"
  GEA_limiting_war.6.b: "在收复故土之前，我们绝不停下！"
  GEA_limiting_war.7.t: "[FROM.GetName]拒绝投降"
  GEA_limiting_war.7.desc: "[FROM.GetName]已明确表示，他们宁愿看到整个国家化为灰烬，也绝不会向我们屈服丝毫。我们的战争将继续下去，并且已完全演变成一场全面战争。"
  GEA_limiting_war.7.a: "箭在弦上，不得不发。"
  GEA_limiting_war.8.t: "[FROM.GetName]谋求让我方投降！"
  GEA_limiting_war.8.desc: "截获的敌方高层通讯证实了我们最深重的忧虑：不会有谈判达成的和解，也不会有任何让这场战争适度结束的让步。他们要求的无异于我国的彻底投降，企图让我们在又一个帝国主义者的铁蹄下苟活。如果这就是他们的目标，那么我们只有一个回答：我们绝不屈服。"
  GEA_limiting_war.8.a: "[ROOT.GetNameDefCap]战斗到底！"
